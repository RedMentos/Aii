name: V13 runtime deployment integrity
on:
  pull_request:
    paths:
      - 'v13/code/v13/runtime_deploy.py'
      - 'v13/code/v13/pipeline_agent.py'
      - 'v13/code/tests/test_runtime_deploy_integrity.py'
      - 'v13/code/tests/test_runtime_deploy.py'
      - 'v13/code/tests/test_runtime_activation_journal.py'
      - 'v13/code/tests/test_pipeline_agent.py'
      - 'v14/V14_USER_NEXT_ACTION.md'
      - 'v14/V14_WORK_BOARD.json'
      - 'v14/handoffs/QA_RUNTIME_ACTIVATION_JOURNAL_20261122.md'
      - '.github/workflows/v13-runtime-deploy-integrity.yml'
  push:
    branches:
      - 'gpt6/core-runtime-deploy-integrity-20261112'
    paths:
      - 'v13/code/v13/runtime_deploy.py'
      - 'v13/code/tests/test_runtime_deploy_integrity.py'
      - 'v13/code/tests/test_runtime_deploy.py'
      - '.github/workflows/v13-runtime-deploy-integrity.yml'
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and run offline regressions
        working-directory: v13/code
        run: |
          python -m py_compile v13/runtime_deploy.py v13/pipeline_agent.py tests/test_runtime_deploy_integrity.py tests/test_runtime_deploy.py tests/test_runtime_activation_journal.py tests/test_pipeline_agent.py
          python -m unittest discover -s tests -p test_runtime_activation_journal.py -v
          python -m unittest discover -s tests -p test_runtime_deploy_integrity.py -v
          python -m unittest discover -s tests -p test_runtime_deploy.py -v
          python -m unittest discover -s tests -p test_pipeline_agent.py -v
