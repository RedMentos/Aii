name: V13 P2X frozen 360-call C3 QAD base-only Linux-native validation
on:
  push:
    branches: [assistant/v13-p2x-base360-native-20261029]
    paths:
      - '.github/workflows/v13-p2x-base360-native-20261029.yml'
permissions:
  contents: read
concurrency:
  group: v13-p2-qad-fp32-real-value-serial-20261029
  cancel-in-progress: false
jobs:
  base360-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen source, resource, 360 serial native C3 calls and closed evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-p2x-base360-evidence"
          work="$RUNNER_TEMP/v13-p2x-base360-work"
          home="$RUNNER_TEMP/v13-p2x-base360-home"
          mkdir -p "$e" "$work" "$home"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          1b3afb183ef2a1cb2542dac7ef32f71905169232 v13/code/scripts/p2x_base360_native_executor.py
          eeebf85e33e214e7648fd182f7023f3723d922d4 v13/code/scripts/p2x_base360_native_verifier.py
          a667d84a6a462215809dba1057dd195b9deae047 v13/code/tests/test_p2x_base360_native_executor.py
          79f2c2e08377aaa6ce3f582d1f0523fd8477fbd5 v13/code/tests/test_p2x_base360_native_verifier.py
          8135fa2792df2c541dc1719e49d941c775703697 v13/code/scripts/p2x_disjoint_receiver_trainset.py
          c9509e299510540af4e43ebbc397f2e5a144142d v13/code/scripts/p2x_native_receiver_eval_scorer.py
          9791ad1a7b10692d4e75810856bd93fc4dcb44ea v13/code/scripts/hb1b_c3_format_native_executor.py
          efda7aa1aa5729e974d0d641870d4da05d21c961 v13/code/v13/runners.py
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          : > "$e/SOURCE_RAW.log"
          source_red=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            printf '%s %s %s\n' "$want" "$got" "$path" >> "$e/SOURCE_RAW.log"
            if [ "$want" != "$got" ]; then echo BLOB_MISMATCH >> "$e/SOURCE_RAW.log"; source_red=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$source_red" > "$e/SOURCE_EXIT.txt"
          python3 - "$work" > "$e/RESOURCE_RAW.log" 2>&1 <<'PY'
          import json,platform,shutil,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          info={'platform':platform.platform(),'machine':platform.machine(),
                'disk_free_bytes':shutil.disk_usage(root).free}
          for line in Path('/proc/meminfo').read_text().splitlines():
              if line.startswith(('MemAvailable:','MemTotal:')):
                  key,value,*_=line.split()
                  info[key.rstrip(':')]=int(value)*1024
          c=Path('/sys/fs/cgroup/memory.max')
          info['cgroup_memory_max']=c.read_text().strip() if c.exists() else 'UNAVAILABLE'
          print(json.dumps(info,sort_keys=True))
          assert platform.system()=='Linux' and platform.machine()=='x86_64'
          assert info['disk_free_bytes']>=3_000_000_000
          assert info.get('MemAvailable',0)>=2_500_000_000
          assert info['cgroup_memory_max'] in ('max','UNAVAILABLE') or int(info['cgroup_memory_max'])>=2_000_000_000
          PY
          echo "$?" > "$e/RESOURCE_EXIT.txt"
          python3 v13/code/scripts/p2x_disjoint_receiver_trainset.py --out "$work/cohort" --fixture-sha256 cd3edfdb464c6f99650b1ea32b5b09854268f0b53faa79df22ddcd135f21985a > "$e/COHORT_RAW.json" 2>&1
          echo "$?" > "$e/COHORT_EXIT.txt"
          if [ "$(cat "$e/COHORT_EXIT.txt")" = 0 ]; then
            printf '%s  %s\n' 'af191c087d872a42924f2d2d465a3f26f6c323bf48c5c0682b30094b9d666cf1' "$work/cohort/train.jsonl" 'a7f2d70d463305a43ec03bbd758a61cc91129a411094ed60e5503d4ffe0894cf' "$work/cohort/validation_inputs.jsonl" 'd1cbe570ae3caa2a80177f861ba5751c93208ffccc98f8d12d90578c59555e9a' "$work/cohort/validation_answers.jsonl" | sha256sum -c > "$e/COHORT_SHA_RAW.log" 2>&1
            echo "$?" > "$e/COHORT_SHA_EXIT.txt"
          else echo SKIPPED > "$e/COHORT_SHA_EXIT.txt"; fi
          python3 -m venv "$work/venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$work/venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
          else echo SKIPPED > "$e/DEPS_EXIT.txt"; echo SKIPPED > "$e/PIP_CHECK_EXIT.txt"; fi
          if [ "$source_red" = 0 ] && [ "$(cat "$e/RESOURCE_EXIT.txt")" = 0 ] && [ "$(cat "$e/COHORT_SHA_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ] && [ "$(cat "$e/PIP_CHECK_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests "$py" -m unittest -v tests.test_p2x_base360_native_executor tests.test_p2x_base360_native_verifier) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else echo SKIPPED_PREREQ_RED > "$e/FOCUSED_RAW.log"; echo SKIPPED > "$e/FOCUSED_EXIT.txt"; fi
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=20s 1500s "$py" -m scripts.p2x_base360_native_executor --home "$home" --install) > "$e/INSTALL_RAW.log" 2>&1
            echo "$?" > "$e/INSTALL_EXIT.txt"
          else echo SKIPPED_FOCUSED_RED > "$e/INSTALL_RAW.log"; echo SKIPPED > "$e/INSTALL_EXIT.txt"; fi
          if [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=20s 2600s "$py" -m scripts.p2x_base360_native_executor --home "$home" --validation-dir "$work/cohort" --out "$work/evidence") > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else echo SKIPPED_INSTALL_RED > "$e/NATIVE_RAW.log"; echo SKIPPED > "$e/NATIVE_EXIT.txt"; fi
          if [ -d "$work/evidence" ]; then cp -a "$work/evidence" "$e/evidence"; fi
          if [ "$(cat "$e/NATIVE_EXIT.txt")" = 0 ]; then
            (cd v13/code && "$py" -m scripts.p2x_base360_native_verifier --evidence-dir "$e/evidence" --validation-dir "$work/cohort") > "$e/VERIFY_RAW.json" 2>&1
            echo "$?" > "$e/VERIFY_EXIT.txt"
          else echo SKIPPED_NATIVE_RED > "$e/VERIFY_RAW.json"; echo SKIPPED > "$e/VERIFY_EXIT.txt"; fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 77429f4f13e9df60b0b98142567babaccd0afa03 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 77429f4f13e9df60b0b98142567babaccd0afa03 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve all original raw and RED attempts, exclude installed model weights
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-p2x-base360-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-p2x-base360-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce exact source, 360 native calls and no gate promotion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-p2x-base360-evidence"
          for stage in SOURCE RESOURCE COHORT COHORT_SHA VENV DEPS PIP_CHECK FOCUSED INSTALL NATIVE VERIFY PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained; no STEP2/AG6/JEPA promotion"
              tail -30 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          python3 - "$e/VERIFY_RAW.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['status']=='VERIFIED_BASE_ONLY_LINUX_NATIVE_NO_GATE'
          assert r['rows']==360 and r['native_calls']==360
          assert r['adapter_sha256'] is None and r['redmi_measured'] is False
          assert r['step2_status']=='UTILITY_FAIL' and r['jepa_weight']==0
          assert r['whole_system_complete'] is False
          print('P2X_C3_BASE360_NATIVE_ONLY_NO_ADAPTER_OR_UTILITY_GATE')
          PY
