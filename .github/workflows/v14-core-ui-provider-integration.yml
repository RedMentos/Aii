name: V14 Core UI provider integration

on:
  pull_request:
    paths:
      - "v13/code/v13/vision.py"
      - "v13/code/v13/vision_ui_frame_ingress.py"
      - "v13/code/v13/a5_visual_frame_bridge.py"
      - "v13/code/v13/a5_ui_admission_bridge.py"
      - "v13/code/v13/android_ui_runtime.py"
      - "v13/code/scripts/source_lifecycle_lock_integration_candidate.py"
      - "v13/code/scripts/integrated_android_ui_runtime_candidate_20261127.py"
      - "v13/code/tests/test_vision.py"
      - "v13/code/tests/test_vision_ui_frame_ingress.py"
      - "v13/code/tests/test_a5_visual_frame_bridge.py"
      - "v13/code/tests/test_a5_ui_admission_bridge_20261115.py"
      - "v13/code/tests/test_android_ui_runtime_consumer.py"
      - "v13/code/tests/test_source_lifecycle_lock_integration.py"
      - ".github/workflows/v14-core-ui-provider-integration.yml"
  push:
    branches:
      - "core/v14-ui-ood-provider-integration-20261127-run1"

jobs:
  provider-consumer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused dependencies
        run: python -m pip install --upgrade pip numpy pillow pytest cryptography
      - name: Report exact provider source digest
        run: sha256sum v13/code/v13/vision.py v13/code/v13/vision_ui_frame_ingress.py
      - name: Compile provider and Core consumer
        env:
          PYTHONPATH: v13/code
        run: >-
          python -m py_compile
          v13/code/v13/vision.py
          v13/code/v13/vision_ui_frame_ingress.py
          v13/code/v13/a5_visual_frame_bridge.py
          v13/code/v13/a5_ui_admission_bridge.py
          v13/code/v13/android_ui_runtime.py
          v13/code/scripts/source_lifecycle_lock_integration_candidate.py
          v13/code/scripts/integrated_android_ui_runtime_candidate_20261127.py
      - name: Run Perception provider and Core consumer regressions
        env:
          PYTHONPATH: v13/code
        run: >-
          python -m pytest -q
          v13/code/tests/test_vision.py
          v13/code/tests/test_vision_ui_frame_ingress.py
          v13/code/tests/test_a5_visual_frame_bridge.py
          v13/code/tests/test_a5_ui_admission_bridge_20261115.py
          v13/code/tests/test_android_ui_runtime_consumer.py
          v13/code/tests/test_source_lifecycle_lock_integration.py
