name: V13 predictor restart integrity QA
on:
  pull_request:
    paths:
      - 'v13/code/v13/continuous_predictor.py'
      - 'v13/code/tests/test_online_predictor_restart_integrity.py'
      - '.github/workflows/v13-predictor-restart-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  predictor-restart-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded dependency
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Test checkpoint/restart fault boundaries
        working-directory: v13/code
        run: python -m unittest -v tests.test_online_predictor_restart_integrity
