name: V13 Run12B contrastive Body-JEPA tiny Torch+PEFT trainer software
on:
  push:
    branches: [assistant/v13-run12b-bjepa-contrastive-trainer-20261030]
    paths:
      - '.github/workflows/v13-run12b-bjepa-contrastive-trainer.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned real tiny Torch+PEFT two-step contrastive trainer tests
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run12b"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          62c62e1978e7c2224e1536828203809a5f1e6049 v13/code/docs/BJEPA_CONTRASTIVE_350M_DISJOINT_PREREG_RUN12B_20261030.md
          a31a18d9be0b1137a10304f24d3a241d720bd247 v13/code/v13/body_jepa_contrastive_trainer_shadow.py
          2fb084149a53600728a62fbe6db4dc5c8f9c2de1 v13/code/tests/test_body_jepa_contrastive_trainer_run12b.py
          acd40aeac9e286e93b40bda72c655c17725a522e v13/code/v13/body_jepa_contrastive_shadow.py
          b560d4e88fe457f381e89dfc5d6188a8ec3b306b v13/code/v13/body_jepa.py
          af685a22ddd4ff6412643a8849a1f00bf2112487 v13/code/scripts/bodyjepa_350m_eightstep_disjoint_run11p.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run12b-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run12b-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu' > "$e/TORCH_RAW.log" 2>&1
            echo "$?" > "$e/TORCH_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' 'transformers==4.44.2' 'peft==0.13.2' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
            "$py" -c 'import torch,transformers,peft; assert torch.__version__=="2.5.1+cpu" and transformers.__version__=="4.44.2" and peft.__version__=="0.13.2"; print(torch.__version__,transformers.__version__,peft.__version__)' > "$e/IMPORT_RAW.log" 2>&1
            echo "$?" > "$e/IMPORT_EXIT.txt"
          else for stage in TORCH DEPS PIP_CHECK IMPORT; do echo SKIPPED > "$e/${stage}_RAW.log"; echo SKIPPED > "$e/${stage}_EXIT.txt"; done; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/TORCH_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ] && [ "$(cat "$e/IMPORT_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 7m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_body_jepa_contrastive_shadow_run12a tests.test_body_jepa_contrastive_trainer_run12b) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED > "$e/TEST_RAW.log"; echo SKIPPED > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/v13/body_jepa_contrastive_shadow.py v13/code/v13/body_jepa_contrastive_trainer_shadow.py v13/code/tests/test_body_jepa_contrastive_trainer_run12b.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 54d28b4ea669df3a45312e20ff90df1b8805cf45 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 54d28b4ea669df3a45312e20ff90df1b8805cf45 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw even on RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run12b-tiny-trainer-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run12b/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce no-export software proof without Body-JEPA promotion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run12b"
          for stage in PINS VENV TORCH DEPS PIP_CHECK IMPORT TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw preserved, no gate promotion"
              tail -75 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'RUN12B_TINY_TRAINER_SOFTWARE_ONLY_NO_NATIVE_350M_OR_JEPA_GATE'
