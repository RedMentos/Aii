name: V13 Run14V learned wake effort band candidate and C2 regression
on:
  push:
    branches: [assistant/v13-run14v-effort-learned-wake-ceiling-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run14v-effort-green.yml'
permissions:
  contents: read
jobs:
  effort:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify pinned C2 effort and runtime wake regressions
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run14v-green"; mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          197f77ad2c76611df33c1841e68be369ddb05bc2 v13/code/docs/EFFORT_LEARNED_BAND_PREREG_RUN14V_20261030.md
          d1cda1627b93e30701a35f022df1ff09270886b8 v13/code/tests/test_effort_learned_band_run14v.py
          563a6db17c1331f5eaa9f6549502f8afc460ad57 v13/code/v13/effort.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run14v-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run14v-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
          echo "$?" > "$e/PIP_CHECK_EXIT.txt"
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 7m env PYTHONPATH=.:tests "$py" -m unittest -v \
              tests.test_effort_learned_band_run14v \
              tests.test_effort \
              tests.test_c2_deadline_preferred_wake_run14o \
              tests.test_resource_modes \
              tests.test_r4_c3_uncertainty_wake) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PREREQUISITE > "$e/TEST_RAW.log";echo 99 > "$e/TEST_EXIT.txt";fi
          python3 -m compileall -q v13/code/v13/effort.py v13/code/tests/test_effort_learned_band_run14v.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 09f6ce79d1a7684a0421c6d509dc934218b71bf2 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 09f6ce79d1a7684a0421c6d509dc934218b71bf2 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve complete candidate raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run14v-green-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run14v-green/
          retention-days: 30
          if-no-files-found: error
      - name: Require all candidate stages GREEN
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run14v-green"
          for stage in PINS VENV DEPS PIP_CHECK TEST COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              tail -100 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
          echo 'C2_EFFORT_SOFTWARE_ONLY; NO_NATIVE_OR_AGE_PROMOTION'
