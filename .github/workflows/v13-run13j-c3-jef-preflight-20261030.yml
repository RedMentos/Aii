name: V13 Run13J seed227 C3 JEF native preflight source-only
on:
  push:
    branches: [assistant/v13-run13j-c3-jef-native-fidelity-20261030-auto11]
    paths:
      - '.github/workflows/v13-run13j-c3-jef-preflight-20261030.yml'
      - 'v13/code/scripts/run13j_c3_jef_native.py'
      - 'v13/code/tests/test_run13j_c3_jef_native_preflight.py'
      - 'v13/code/scripts/run13j_c3_jef_native_verify.py'
      - 'v13/code/tests/test_run13j_c3_jef_native_verify.py'
      - 'v13/code/docs/fixtures/run13j_c3_jef_native_seed227_20261030.json'
      - 'v13/code/docs/RUN13J_C3_JEF_NATIVE_PREREG_20261030.md'
      - 'v13/code/docs/BUILD_STATE_RUN13J_C3_JEF_NATIVE_20261030.json'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen fixture and real Store/ContextOS JEF preflight
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run13j-preflight"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/scripts/run13j_c3_jef_native.py v13/code/scripts/run13j_c3_jef_native_verify.py v13/code/tests/test_run13j_c3_jef_native_preflight.py v13/code/tests/test_run13j_c3_jef_native_verify.py v13/code/docs/fixtures/run13j_c3_jef_native_seed227_20261030.json v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/SOURCE_BLOBS.txt"
          test "$(tail -1 "$e/SOURCE_BLOBS.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          echo "$?" > "$e/CANON_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run13j-preflight-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run13j-preflight-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts timeout 480s "$py" -m unittest -v tests.test_run13j_c3_jef_native_preflight tests.test_run13j_c3_jef_native_verify tests.test_jef_c3_shadow_prompt_run13i) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/scripts/run13j_c3_jef_native.py v13/code/scripts/run13j_c3_jef_native_verify.py v13/code/tests/test_run13j_c3_jef_native_preflight.py v13/code/tests/test_run13j_c3_jef_native_verify.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base edb156ea91ad0a3a4052491423e43361eea89902 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check edb156ea91ad0a3a4052491423e43361eea89902 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve raw and hashes on RED or GREEN
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run13j-preflight-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run13j-preflight/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce preflight only, not native proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run13j-preflight"
          for stage in CANON VENV DEPS TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; raw retained"
              tail -90 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'RUN13J_SOURCE_PREFLIGHT_ONLY_NO_NATIVE_OR_GATE_PROMOTION'
