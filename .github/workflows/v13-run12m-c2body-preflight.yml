name: V13 Run12M disjoint C2 C3 Body native utility source preflight
on:
  push:
    branches: [assistant/v13-run12m-c2-c3-body-utility-20261030]
    paths:
      - '.github/workflows/v13-run12m-c2body-preflight.yml'
permissions:
  contents: read
jobs:
  source-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Source pins, 16-turn cohort, frozen scorer, tests, privacy
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run12m-preflight"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          1ccb21c8ca13d20fc0f837f889705c323800feb6 v13/code/docs/fixtures/c2_body_paired_run12m_20261030.json
          92cdb5129eb50865486ddceab7808bd5b7c89598 v13/code/docs/C2_C3_BODY_PAIRED_RUN12M_PREREG_20261030.md
          96c195263121610de1f44d954eff3b6a0043ec93 v13/code/scripts/c2_c3_body_paired_native_run12m.py
          22010109e2c6d572367d69a9c11ca3454e52a60e v13/code/scripts/c2_c3_body_paired_verify_run12m.py
          d49b99e590824a8ad1a0e8803c2961d3bace3dd1 v13/code/tests/test_c2_c3_body_paired_run12m.py
          57372fbbf403e4fb0114e8b9066baf936468bf7c v13/code/tests/test_c2_c3_body_paired_verify_run12m.py
          d274a66b8ceb801c741bbffe1456611b43603208 v13/code/scripts/c2_body_disjoint_paired181_run11v.py
          4f04236507d7f4c2ae70f62aef905eefe83389d6 v13/code/scripts/c2_body_disjoint_paired181_verify_run11v.py
          22ed11e4a53d9eeae8fbc74a1753082b5785be2b v13/code/v13/runtime.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run12m-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run12m-venv/bin/python"
          "$py" -m pip install --no-input --disable-pip-version-check --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts timeout 180s "$py" -m unittest -v tests.test_c2_c3_body_paired_run12m tests.test_c2_c3_body_paired_verify_run12m tests.test_c2_body_disjoint_paired181_run11v tests.test_c2_body_disjoint_paired181_verify_run11v tests.test_c2_route_runtime_strict_run12j) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
            PYTHONPATH=v13/code "$py" - <<'PY' > "$e/COHORT_RAW.log" 2>&1
          from scripts import c2_c3_body_paired_native_run12m as m
          from scripts import c2_body_disjoint_paired181_run11v as original
          f=m.load_fixture('v13/code/docs/fixtures/c2_body_paired_run12m_20261030.json')
          assert m.fixture_hash(f['cases'])==m.FIXTURE_SHA256
          assert m.ARMS==('A_C3_ONLY','B_B1_ONLY','C_B2_ONLY','F_NATIVE_AUTO')
          assert len(m.ARM_ORDER)==4 and len(set(m.ARMS))==4
          assert original.SEED==181
          print('FROZEN_DISJOINT_16_TURN_C2_C3_B1_B2_COHORT_VERIFIED')
          PY
            echo "$?" > "$e/COHORT_EXIT.txt"
          else
            echo SKIPPED_PINS_OR_DEPS_RED > "$e/TEST_RAW.log"
            echo 99 > "$e/TEST_EXIT.txt"
            echo SKIPPED_PINS_OR_DEPS_RED > "$e/COHORT_RAW.log"
            echo 99 > "$e/COHORT_EXIT.txt"
          fi
          "$py" -m py_compile v13/code/scripts/c2_c3_body_paired_native_run12m.py v13/code/scripts/c2_c3_body_paired_verify_run12m.py v13/code/tests/test_c2_c3_body_paired_run12m.py v13/code/tests/test_c2_c3_body_paired_verify_run12m.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 03ba3422b6d17c1956b22d054941e9d51cd6b16a --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 03ba3422b6d17c1956b22d054941e9d51cd6b16a HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original preflight raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run12m-preflight-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run12m-preflight/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce source-only preflight, never native utility claim
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run12m-preflight"
          for stage in PINS VENV DEPS TEST COHORT COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "${stage} RED; original raw retained"
              tail -80 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN12M_SOURCE_ONLY_GREEN_NO_NATIVE_OR_STEP2_GATE
