name: V13 Run116 independent native raw auditor synthetic tests
on:
  push:
    branches:
      - assistant/v13-run116-independent-native-audit-20261031-gpt6
    paths:
      - .github/workflows/v13-run116-independent-raw-audit.yml
      - v13/code/scripts/run116_original_raw_audit.py
      - v13/code/tests/test_run116_original_raw_audit.py
permissions:
  contents: read
jobs:
  audit-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NO_MODEL_DOWNLOADS: "1"
      V13_NO_AUTOSTART: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Audit parser synthetic adversarial tests and privacy
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run116-independent-audit"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          set +e
          (cd v13/code && env PYTHONPATH=.:scripts:tests python3 -m unittest discover -s tests -p test_run116_original_raw_audit.py -v) > "$e/TEST_RAW.log" 2>&1
          test_rc=$?
          python3 -m compileall -q v13/code/scripts/run116_original_raw_audit.py v13/code/tests/test_run116_original_raw_audit.py > "$e/COMPILE_RAW.log" 2>&1
          compile_rc=$?
          python3 v13/code/scripts/public_repo_privacy_scan.py --base df08a4ce311317bdfd322ba7c7520d9fe8fb2b93 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          privacy_rc=$?
          git diff --check df08a4ce311317bdfd322ba7c7520d9fe8fb2b93 HEAD > "$e/DIFF_RAW.log" 2>&1
          diff_rc=$?
          set -e
          for item in "TEST:$test_rc" "COMPILE:$compile_rc" "PRIVACY:$privacy_rc" "DIFF:$diff_rc"; do
            echo "${item#*:}" > "$e/${item%%:*}_EXIT.txt"
          done
          python3 - "$e" <<'PY' > "$e/RESULT_RAW.log"
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1]);names=('TEST','COMPILE','PRIVACY','DIFF')
          r={'schema':'v13.run116.independent_raw_audit_software.v1',
             'head':(e/'HEAD.txt').read_text().strip(),
             'exits':{n:int((e/(n+'_EXIT.txt')).read_text()) for n in names},
             'synthetic_only':True,'native_executed':False,
             'redmi_measured':False,'step2_promoted':False,
             'b3_promoted':False,'body_jepa_promoted':False}
          (e/'RESULT.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat "$e/RESULT_RAW.log"
          tail -n 24 "$e/TEST_RAW.log"
          for rc in "$test_rc" "$compile_rc" "$privacy_rc" "$diff_rc"; do test "$rc" -eq 0; done
      - name: Preserve original synthetic audit GREEN or RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run116-independent-audit-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run116-independent-audit/
          if-no-files-found: warn
          retention-days: 90
