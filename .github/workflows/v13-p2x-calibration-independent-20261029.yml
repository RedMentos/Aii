name: V13 P2X independent calibration raw replay source review
on:
  push:
    branches: [assistant/v13-p2x-calibration-independent-audit-20261029]
    paths:
      - '.github/workflows/v13-p2x-calibration-independent-20261029.yml'
      - 'v13/code/scripts/p2x_calibration_independent_audit.py'
      - 'v13/code/tests/test_p2x_calibration_independent_audit.py'
      - 'v13/code/docs/proofs/continuation-20261029/P2X_CALIBRATION_INDEPENDENT_*'
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Closed independent adversarial source review
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-p2x-calibration-independent"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          a3f9d89c9e8ae1231294df78d0a1f728f92e1bc5 v13/code/docs/proofs/continuation-20261029/P2X_CALIBRATION_INDEPENDENT_AUDIT_PREREG.md
          efab826d482ed69e84eaa5b799036ef80dd72c6a v13/code/scripts/p2x_calibration_independent_audit.py
          db7e9b4594f0add726f024cd78ab704dca5421d3 v13/code/tests/test_p2x_calibration_independent_audit.py
          8135fa2792df2c541dc1719e49d941c775703697 v13/code/scripts/p2x_disjoint_receiver_trainset.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          source_red=0
          : > "$e/SOURCE_RAW.log"
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/SOURCE_RAW.log"
            if [ "$want" != "$got" ]; then source_red=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$source_red" > "$e/SOURCE_EXIT.txt"
          python3 -m py_compile v13/code/scripts/p2x_calibration_independent_audit.py v13/code/tests/test_p2x_calibration_independent_audit.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests python3 -m unittest -v tests.test_p2x_calibration_instruction tests.test_p2x_calibration_native_executor tests.test_p2x_calibration_independent_audit) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests:scripts python3 -m scripts.p2x_calibration_independent_audit --help) > "$e/CLI_RAW.log" 2>&1
          echo "$?" > "$e/CLI_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 7174040ad6ab005f5a75704d796ce194a0bd2fe6 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 7174040ad6ab005f5a75704d796ce194a0bd2fe6 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Retain original independent source raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-p2x-calibration-independent-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-p2x-calibration-independent/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce independent replay tests and integrity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-p2x-calibration-independent"
          for stage in SOURCE COMPILE TEST CLI PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED, raw retained"
              tail -35 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'P2X_CALIBRATION_INDEPENDENT_SOURCE_ONLY_NO_NATIVE_NO_GATE'
