name: V13 two checkout migration proof
on:
  push:
    branches: ['work/v13-two-checkout-migration-proof-20261116']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  old-worker-to-new-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 64
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest==9.2.0 numpy==2.2.6
      - name: Test old worker to new installed runtime with real Git checkouts
        working-directory: v13/code
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q tests/test_two_checkout_migration_20261116.py
