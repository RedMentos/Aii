name: Run223 DS3 shifted heldout risk report (synthetic)
on:
  pull_request:
    paths:
      - 'v13/code/v13/agi/ds3_selective.py'
      - 'v13/code/tests/test_ds3_shift_run223.py'
      - '.github/workflows/run223-ds3-shift.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shift:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Actual source lab shift and previous risk regressions
        run: |
          set -o pipefail
          cd v13/code
          PYTHONPATH=tests:. python3 -m unittest -v tests.test_ds3_shift_run223 tests.test_ds3_selective_run222 2>&1 | tee "$RUNNER_TEMP/RUN223_TEST_RAW.log"
          python3 -m compileall -q v13/agi/ds3_selective.py tests/test_ds3_shift_run223.py
      - name: Official public repository privacy scan
        run: python3 v13/code/scripts/public_repo_privacy_scan.py --base d0bf78b933718b4def9bb821c1683af7c5d5b498 --head HEAD --no-worktree
      - name: Preserve raw results even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: V13-Run223-DS3-Shift-Raw
          path: ${{ runner.temp }}/RUN223_TEST_RAW.log
          if-no-files-found: warn
          retention-days: 30
      - name: Claim boundary
        run: echo 'Synthetic shifted holdout only; no native C3, conformal guarantee, live deployment or gate promotion'
