name: Run206 B3 Callosum observed utility integrity (software)
on:
  pull_request:
    paths:
      - 'v13/code/v13/callosum.py'
      - 'v13/code/tests/test_callosum_observed_cost_run206.py'
      - 'v13/code/tests/test_callosum_message_lineage_run98.py'
      - 'v13/code/tests/test_callosum_peer_link_run99.py'
      - '.github/workflows/run206-b3-observed-utility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  callosum:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Isolated software prerequisites
        run: python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Actual Callosum source-bound utility and peer lineage tests
        working-directory: v13/code
        run: |
          python -m unittest -v tests.test_callosum_observed_cost_run206 tests.test_callosum tests.test_callosum_message_lineage_run98 tests.test_callosum_peer_link_run99 tests.test_callosum_outcome_integration_run66 tests.test_callosum_outcome_once
          python -m compileall -q v13/callosum.py tests/test_callosum_observed_cost_run206.py
      - name: Official public repository privacy scan
        run: python v13/code/scripts/public_repo_privacy_scan.py --base 19ecea1ae1557ccdb636200de27d31eca6d4017d --head HEAD --no-worktree
      - name: Claim boundary
        run: echo 'B3 L1 FAIL unchanged; synthetic source-valid packets are not native receiver utility or Redmi evidence'
