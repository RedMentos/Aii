name: V13 Run470 frozen complementarity source audit
on:
  pull_request:
    paths:
      - '.github/workflows/run470-step2-complementarity.yml'
      - 'v13/code/scripts/run470_step2_complementarity.py'
      - 'v13/code/tests/test_run470_step2_complementarity.py'
      - 'v13/code/tests/test_run470_pinned_replay.py'
      - 'v13/code/docs/proofs/continuation-20261026/run470-complementarity/**'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      HF_HUB_OFFLINE: '1'
      NO_MODEL_DOWNLOADS: '1'
      V13_NO_AUTOSTART: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Pin frozen registered source and predecessor audit
        run: |
          set -euo pipefail
          test "$(git hash-object v13/code/scripts/run469_native378_utility.py)" = "b11819e5dfe6a6022177923c2f151ce9f53f01b8"
          test "$(git hash-object v13/code/scripts/run468_verify_native378.py)" = "eedc307a6e6f3c36fea43894dcfa41e983fa4c74"
          test "$(git hash-object v13/code/scripts/run394_step2_fresh.py)" = "fae7aed612108a554d8566b2917ebf31022df423"
          sha256sum v13/code/scripts/run470_step2_complementarity.py v13/code/tests/test_run470_step2_complementarity.py v13/code/tests/test_run470_pinned_replay.py > "$RUNNER_TEMP/run470-source-sha256.txt"
          python3 -m venv "$RUNNER_TEMP/run470"
          "$RUNNER_TEMP/run470/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Run complementarity negatives, full replay and inherited native378 source controls
        working-directory: v13/code
        run: |
          set +e
          export PYTHONPATH="$PWD:$PWD/scripts"
          "$RUNNER_TEMP/run470/bin/python" -m unittest -v tests.test_run470_step2_complementarity tests.test_run470_pinned_replay tests.test_run469_native378_utility tests.test_run469_native378_pinned_reads tests.test_run468_verify_native378_adversarial tests.test_run467_stage9_s22 tests.test_run466_native336_atomic_import tests.test_run465_verify_native336_adversarial tests.test_run438_import_stage5_artifact tests.test_run452_stage6_s21 tests.test_run458_native252_atomic_import tests.test_run461_native294_atomic_import tests.test_run462_stage8_p22 tests.test_run460_verify_native294_adversarial tests.test_run459_stage7_o22 tests.test_run457_pinned_utility_reads tests.test_run456_native252_utility tests.test_run454_verify_native252_adversarial tests.test_run453_verify_native252 tests.test_run436_verify_native210 > "$RUNNER_TEMP/run470-tests.txt" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/run470-tests.txt"
          echo "EXIT=$rc" > "$RUNNER_TEMP/run470-exit.txt"
          exit "$rc"
      - name: Official public repository privacy scan
        if: always()
        run: |
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
      - name: Preserve raw tests and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run470-complementarity-${{ github.sha }}
          path: |
            ${{ runner.temp }}/run470-source-sha256.txt
            ${{ runner.temp }}/run470-tests.txt
            ${{ runner.temp }}/run470-exit.txt
          if-no-files-found: warn
          retention-days: 30
