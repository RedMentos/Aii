name: V13 Run77 frozen native engineering forensic replay compact evidence
on:
  push:
    branches: [assistant/v13-run77-native-forensic-gpt6-20261031]
    paths: ['.github/workflows/v13-run77-forensic-compact.yml']
permissions:
  contents: read
concurrency:
  group: v13-step2-budget-paired-native-20261030
  cancel-in-progress: false
jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen original code, synthetic diagnostic tests and serialized native replay
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run77-forensic"
          c="$e/compact"
          mkdir -p "$c/raw_rows" "$c/store_audits"
          git rev-parse HEAD > "$c/HEAD.txt"
          git merge-base --is-ancestor 4ea3f697d2ed8418c8a68cebfc1538b6642e439e HEAD
          echo "$?" > "$c/ANCESTRY_EXIT.txt"
          cat > "$c/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          6044d7bb48d7c8de0801cce96c6af466b1f9d547 v13/code/scripts/jef_b1b2_context_fixture_797.py
          eebd79d1a454b9b3dcda42be425666ad3e609cd6 v13/code/scripts/run77_b1b2_context_native.py
          e42222c39d9a065b653b21374f336be363d6ea87 v13/code/scripts/run77_b1b2_context_verify.py
          a848c3b924d32e3d69cbccbb75e23837d372f3a1 v13/code/tests/test_run77_b1b2_context_fixture.py
          7c1ea152d511783a47a1e55cc6a968ecd9d7e338 v13/code/v13/b1b2_latest_user_offer_candidate.py
          277d34a46b14633c52b5e7d59b3fdf0f16ea4159 v13/code/v13/b1b2_topic_partition_candidate.py
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$c/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$c/PINS.txt"
          git cat-file -e afdca4d0d227c1fd04a5b7fda01e3bb0d38a9a5e
          [ "$?" = 0 ] || bad=1
          echo "$bad" > "$c/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run77-forensic-venv" > "$c/VENV_RAW.log" 2>&1
          echo "$?" > "$c/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run77-forensic-venv/bin/python"
          if [ "$(cat "$c/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$c/DEPS_RAW.log" 2>&1
            echo "$?" > "$c/DEPS_EXIT.txt"
          else echo VENV_RED > "$c/DEPS_RAW.log"; echo 99 > "$c/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$c/DEPS_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m unittest discover -s v13/code/tests -p test_run77_forensic_diagnostic.py -v > "$c/TEST_RAW.log" 2>&1
            echo "$?" > "$c/TEST_EXIT.txt"
            timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m unittest discover -s v13/code/tests -p test_run77_b1b2_context_fixture.py -v > "$c/LEGACY_TEST_RAW.log" 2>&1
            echo "$?" > "$c/LEGACY_TEST_EXIT.txt"
          else
            echo SKIPPED > "$c/TEST_RAW.log"; echo 99 > "$c/TEST_EXIT.txt"
            echo SKIPPED > "$c/LEGACY_TEST_RAW.log"; echo 99 > "$c/LEGACY_TEST_EXIT.txt"
          fi
          export V13_HOME="$RUNNER_TEMP/v13-run77-forensic-installed"
          if [ "$(cat "$c/TEST_EXIT.txt")" = 0 ] && [ "$(cat "$c/LEGACY_TEST_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 15m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m v13.bootstrap --home "$V13_HOME" > "$c/BOOTSTRAP_RAW.log" 2>&1
            echo "$?" > "$c/BOOTSTRAP_EXIT.txt"
          else echo SKIPPED > "$c/BOOTSTRAP_RAW.log"; echo 99 > "$c/BOOTSTRAP_EXIT.txt"; fi
          if [ "$(cat "$c/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 70m env PYTHONPATH=v13/code:v13/code/scripts "$py" v13/code/scripts/run77_b1b2_context_native.py --home "$V13_HOME" --out "$e/pilot" > "$c/NATIVE_RAW.log" 2>&1
            echo "$?" > "$c/NATIVE_EXIT.txt"
          else echo SKIPPED > "$c/NATIVE_RAW.log"; echo 99 > "$c/NATIVE_EXIT.txt"; fi
          if [ -f "$e/pilot/report.json" ]; then
            cp "$e/pilot/report.json" "$c/report.json"
            timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=v13/code:v13/code/scripts "$py" v13/code/scripts/run77_b1b2_context_verify.py "$c/report.json" > "$c/VERIFY_RAW.log" 2>&1
            echo "$?" > "$c/VERIFY_EXIT.txt"
            timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=v13/code:v13/code/scripts "$py" v13/code/scripts/run77_native_forensic_diagnostic.py "$c/report.json" --out "$c/DIAG.json" > "$c/DIAG_RAW.log" 2>&1
            echo "$?" > "$c/DIAG_EXIT.txt"
            find "$e/pilot" -type f -name raw_row.json -print0 | while IFS= read -r -d '' p; do
              key="$(basename "$(dirname "$p")")"
              cp "$p" "$c/raw_rows/${key}.json"
            done
            env PYTHONPATH=v13/code:v13/code/scripts "$py" - "$e/pilot" "$c/store_audits" <<'PY' > "$c/AUDIT_RAW.log" 2>&1
          import json, sys
          from pathlib import Path
          from v13.store import audit_closed
          root, out = Path(sys.argv[1]), Path(sys.argv[2])
          for folder in sorted(root.iterdir()):
              if not folder.is_dir():
                  continue
              try:
                  result = audit_closed(folder)
              except Exception as exc:
                  result = {"ok": False, "error_type": type(exc).__name__}
              (out / (folder.name + ".json")).write_text(
                  json.dumps(result, sort_keys=True, default=str) + "\n",
                  encoding="utf-8")
          print("AUDITED", len(list(out.glob("*.json"))))
          PY
            echo "$?" > "$c/AUDIT_EXIT.txt"
          else
            echo NO_REPORT > "$c/VERIFY_RAW.log"; echo 99 > "$c/VERIFY_EXIT.txt"
            echo NO_REPORT > "$c/DIAG_RAW.log"; echo 99 > "$c/DIAG_EXIT.txt"
            echo NO_REPORT > "$c/AUDIT_RAW.log"; echo 99 > "$c/AUDIT_EXIT.txt"
          fi
          python3 -m compileall -q v13/code/scripts/run77_native_forensic_diagnostic.py v13/code/tests/test_run77_forensic_diagnostic.py > "$c/COMPILE_RAW.log" 2>&1
          echo "$?" > "$c/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 89e1309b623df6d214955de89b2f1ebdf873dd02 --head HEAD --no-worktree > "$c/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$c/PRIVACY_EXIT.txt"
          git diff --check 89e1309b623df6d214955de89b2f1ebdf873dd02 HEAD > "$c/DIFF_RAW.log" 2>&1
          echo "$?" > "$c/DIFF_EXIT.txt"
          (cd "$c" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          du -sb "$c" > "$c/SIZE_RAW.log"
          bytes="$(du -sb "$c" | cut -f1)"
          [ "$bytes" -le 20971520 ]
          echo "$?" > "$c/SIZE_EXIT.txt"
          echo "FORENSIC_STATUS_NATIVE=$(cat "$c/NATIVE_EXIT.txt") VERIFY=$(cat "$c/VERIFY_EXIT.txt") DIAG=$(cat "$c/DIAG_EXIT.txt")"
          if [ -f "$c/DIAG.json" ]; then cat "$c/DIAG.json"; fi
          exit 0
      - name: Upload compact raw, never installed models or home
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run77-forensic-compact-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run77-forensic/compact/
          if-no-files-found: error
          retention-days: 90
      - name: Require preflight, native, forensic and original independent verification
        if: always()
        shell: bash
        run: |
          c="$RUNNER_TEMP/v13-run77-forensic/compact"
          for s in ANCESTRY PINS VENV DEPS TEST LEGACY_TEST BOOTSTRAP NATIVE DIAG AUDIT COMPILE PRIVACY DIFF SIZE VERIFY; do
            echo "$s $(cat "$c/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$c/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN77_FORENSIC_ENGINEERING_REPLAY_VERIFIED_NO_SCIENTIFIC_PROMOTION
