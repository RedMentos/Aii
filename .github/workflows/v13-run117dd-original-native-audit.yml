name: V13 Run117DD independent immutable Run117DA original-native audit
on:
  push:
    branches:
      - assistant/v13-run117dd-da-original-independent-audit-20261101-hourly11
permissions:
  contents: read
  actions: read
jobs:
  independent-original-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read-only exact original artifact, strict replay, adversarial tests
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run117dd"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          {
            test "$(git hash-object v13/code/scripts/run117dd_independent_native_audit.py)" = b7dbc825feb17dc5808c4c4b953dc3c355a6cd29
            test "$(git hash-object v13/code/tests/test_run117dd_independent_native_audit.py)" = def1e80c78961a819e7e46cad5f45e79dbce4d06
            test "$(git hash-object v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md)" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          } > "$e/PINS_RAW.log" 2>&1
          echo "$?" > "$e/PINS_EXIT.txt"
          export V13_RUN117DA_ORIGINAL_ZIP="$RUNNER_TEMP/run117da-original-native.zip"
          curl --fail --location --silent --show-error --retry 2 --max-time 240 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/RedMentos/Aii/actions/artifacts/13066065846/zip' \
            -o "$V13_RUN117DA_ORIGINAL_ZIP" > "$e/HYDRATE_RAW.log" 2>&1
          echo "$?" > "$e/HYDRATE_EXIT.txt"
          if [ "$(cat "$e/HYDRATE_EXIT.txt")" = 0 ]; then
            echo '71b2337a0fb012cbf0842417092311d666b52f19110e95646054d01f8bb35568  '"$V13_RUN117DA_ORIGINAL_ZIP" | sha256sum -c - > "$e/ORIGINAL_SHA_RAW.log" 2>&1
            echo "$?" > "$e/ORIGINAL_SHA_EXIT.txt"
          else
            echo 99 > "$e/ORIGINAL_SHA_EXIT.txt"; echo HYDRATE_RED > "$e/ORIGINAL_SHA_RAW.log"
          fi
          python3 -m py_compile v13/code/scripts/run117dd_independent_native_audit.py v13/code/tests/test_run117dd_independent_native_audit.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/ORIGINAL_SHA_EXIT.txt")" = 0 ] && [ "$(cat "$e/COMPILE_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout 300s env PYTHONPATH=.:tests:scripts python3 -m unittest -v tests.test_run117dd_independent_native_audit) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
            (cd v13/code && env PYTHONPATH=.:tests:scripts python3 scripts/run117dd_independent_native_audit.py --original-zip "$V13_RUN117DA_ORIGINAL_ZIP") > "$e/AGGREGATE.json" 2> "$e/AUDIT_RAW.log"
            echo "$?" > "$e/AUDIT_EXIT.txt"
          else
            for stage in TEST AUDIT; do echo 99 > "$e/${stage}_EXIT.txt"; echo PREREQUISITE_RED > "$e/${stage}_RAW.log"; done
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base d5d420fe1d7754ea1f6527cb7b1613ea24c752a9 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check d5d420fe1d7754ea1f6527cb7b1613ea24c752a9 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve small raw stage receipts, never upload original ZIP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117dd-original-audit-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117dd/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce original raw audit and privacy stages
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117dd"
          for stage in PINS HYDRATE ORIGINAL_SHA COMPILE TEST AUDIT PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw preserved, no native promotion"
              tail -60 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN117DD_INDEPENDENT_ORIGINAL_NATIVE_ZIP_VERIFIED_NONPROMOTING
