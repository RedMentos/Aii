name: V13 seed61 independent RED raw replay
on:
  push:
    branches: [assistant/v13-seed61-independent-raw-audit-20261030-0635]
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen source-only posthoc replay, preserve original RED
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          e="$RUNNER_TEMP/v13-seed61-independent-red"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/seed61-replay-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/seed61-replay-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          curl -fsSL --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/RedMentos/Aii/actions/artifacts/12955848461/zip" \
            -o "$e/first.zip" > "$e/FIRST_DOWNLOAD_RAW.log" 2>&1
          echo "$?" > "$e/FIRST_DOWNLOAD_EXIT.txt"
          curl -fsSL --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/RedMentos/Aii/actions/artifacts/12956867267/zip" \
            -o "$e/second.zip" > "$e/SECOND_DOWNLOAD_RAW.log" 2>&1
          echo "$?" > "$e/SECOND_DOWNLOAD_EXIT.txt"
          echo "5296bf6bdf9fda8ac2c2b95ec9b73e10a1a1eb53574038c803a9d3ac12c55ad1  $e/first.zip" > "$e/EXPECTED_SHA256.txt"
          echo "dd7d00dc04a82180171bc3d1739bb21cd53ead7d3a05e26e4e6ac3b2b8e8556a  $e/second.zip" >> "$e/EXPECTED_SHA256.txt"
          sha256sum -c "$e/EXPECTED_SHA256.txt" > "$e/SHA256_RAW.log" 2>&1
          echo "$?" > "$e/SHA256_EXIT.txt"
          (cd v13/code && V13_SEED61_FIRST_ZIP="$e/first.zip" V13_SEED61_SECOND_ZIP="$e/second.zip" PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_c2_seed61_wire_score_audit_20261030) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          PYTHONPATH=v13/code "$py" v13/code/scripts/c2_seed61_wire_score_audit_20261030.py first "$e/first.zip" --out "$e/FIRST_POSTHOC.json" > "$e/FIRST_REPLAY_RAW.log" 2>&1
          echo "$?" > "$e/FIRST_REPLAY_EXIT.txt"
          PYTHONPATH=v13/code "$py" v13/code/scripts/c2_seed61_wire_score_audit_20261030.py second "$e/second.zip" --out "$e/SECOND_POSTHOC.json" > "$e/SECOND_REPLAY_RAW.log" 2>&1
          echo "$?" > "$e/SECOND_REPLAY_EXIT.txt"
          "$py" -m py_compile v13/code/scripts/c2_seed61_wire_score_audit_20261030.py v13/code/tests/test_c2_seed61_wire_score_audit_20261030.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base d1bc56ba6c77c19c9e9ddc71595424df4dc3a548 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check d1bc56ba6c77c19c9e9ddc71595424df4dc3a548 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS ! -name first.zip ! -name second.zip -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-seed61-independent-red-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-seed61-independent-red/
          retention-days: 30
          if-no-files-found: error
      - name: Require all posthoc checks but never promote original RED
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-seed61-independent-red"
          for stage in VENV DEPS FIRST_DOWNLOAD SECOND_DOWNLOAD SHA256 TEST FIRST_REPLAY SECOND_REPLAY COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original native workflows remain RED"
              tail -70 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo "POSTHOC_REPLAY_ONLY_ORIGINAL_NATIVE_WORKFLOWS_STILL_RED"
