name: V13 phone C3 and STEP2 native-negative exit integrated acceptance
on:
  push:
    branches:
      - assistant/v13-phone-c3-step2-exit-20261031-auto11
    paths:
      - v13/code/docs/PHONE_C3_STEP2_EXIT_TRIGGER.txt
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NO_MODEL_DOWNLOADS: "1"
      V13_NO_AUTOSTART: "1"
      DO_NOT_TRACK: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate combined original native RED and extracted phone runtime
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-phone-c3-step2-exit"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/v13-phone-c3-step2-venv" > "$e/VENV_RAW.log" 2>&1
          py="$RUNNER_TEMP/v13-phone-c3-step2-venv/bin/python"
          echo 0 > "$e/VENV_EXIT.txt"
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo 0 > "$e/DEPS_EXIT.txt"
          "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log"
          "$py" -m compileall -q v13/code/v13/gates.py v13/code/v13/context_os.py v13/code/scripts/package_source.py v13/code/tests/test_phone_c3_step2_exit_integration_20261031.py > "$e/COMPILE_RAW.log" 2>&1
          echo 0 > "$e/COMPILE_EXIT.txt"
          set +e
          for spec in "SPLIT:test_step2_exit_gate_split_20261031.py" "ORIGINAL:test_register_gates.py" "INTEGRATION:test_phone_c3_step2_exit_integration_20261031.py" "C3_CONTEXT:test_b2_c3_context_plan_20261031.py" "INSTALL_CONTRACT:test_install_selftest.py" "COHORT:test_install_selftest_run102_20261031.py" "TAR:test_bootstrap_safe_tar_20261031.py"; do
            label="${spec%%:*}"
            pattern="${spec#*:}"
            (cd v13/code && env PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests -p "$pattern" -v) > "$e/${label}_RAW.log" 2>&1
            echo $? > "$e/${label}_EXIT.txt"
          done
          "$py" v13/code/scripts/package_source.py --root v13/code --out "$e/V13-Phone-C3-STEP2-Exit.zip" --phone-install > "$e/PACKAGE_RAW.log" 2>&1
          package_rc=$?
          set -e
          echo "$package_rc" > "$e/PACKAGE_EXIT.txt"
          if test "$package_rc" -eq 0; then
            set +e
            "$py" - "$e" "$RUNNER_TEMP/v13-phone-c3-step2-extracted" <<'PY' > "$e/ZIP_VERIFY_RAW.log" 2>&1
          import hashlib,json,sys,zipfile
          from pathlib import Path
          e=Path(sys.argv[1]);root=Path(sys.argv[2])
          zpath=e/'V13-Phone-C3-STEP2-Exit.zip'
          negative=('bench-results/step2-z2b-seeds-20261021/z2b_result.json',
                    'bench-results/step2-z2c-b2-rule-20261021/z2c_result.json',
                    'bench-results/step2-z2-timescale-20261021/z2_result.json')
          with zipfile.ZipFile(zpath) as z:
              assert z.testzip() is None
              manifest=json.loads(z.read('V13-Phone/WORKSPACE_FILES.json'))
              assert manifest['schema_version']==1
              files=manifest['files']
              for name,expected in files.items():
                  assert not name.startswith('/') and '..' not in Path(name).parts
                  raw=z.read('V13-Phone/'+name)
                  assert hashlib.sha256(raw).hexdigest()==expected,name
              for name in negative:
                  assert name in files
                  raw=z.read('V13-Phone/'+name)
                  assert raw==(Path('v13/code')/name).read_bytes()
              for name in ('v13/gates.py','specs/gate-graph.json',
                           'tests/test_step2_exit_gate_split_20261031.py',
                           'tests/test_phone_c3_step2_exit_integration_20261031.py',
                           'v13/context_os.py','tests/test_b2_c3_context_plan_20261031.py'):
                  assert name in files,name
              z.extractall(root)
          for name,expected in files.items():
              assert hashlib.sha256((root/'V13-Phone'/name).read_bytes()).hexdigest()==expected,name
          for name in negative[:2]:
              report=json.loads((root/'V13-Phone'/name).read_text())
              assert report['gate']['canonical_gate_pass'] is False
          result={'schema':'v13.phone_c3_step2_exit_zip.software.v1',
                  'source_files':len(files),'zip_bytes':zpath.stat().st_size,
                  'zip_sha256':hashlib.sha256(zpath.read_bytes()).hexdigest(),
                  'native_negative_files':list(negative),
                  'original_negative_verdicts':[False,False],
                  'all_manifest_hashes_match':True,
                  'native_model_executed':False,'redmi_measured':False,
                  'canonical_gate_promoted':False}
          (e/'ZIP_REPORT.json').write_text(json.dumps(result,sort_keys=True)+'\n')
          print(json.dumps(result,sort_keys=True))
          PY
            verify_rc=$?
            if test "$verify_rc" -eq 0; then
              (cd "$RUNNER_TEMP/v13-phone-c3-step2-extracted/V13-Phone" && env PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests -p test_step2_exit_gate_split_20261031.py -v) > "$e/EXTRACTED_SPLIT_RAW.log" 2>&1
              extracted_split_rc=$?
              (cd "$RUNNER_TEMP/v13-phone-c3-step2-extracted/V13-Phone" && env PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests -p test_b2_c3_context_plan_20261031.py -v) > "$e/EXTRACTED_C3_RAW.log" 2>&1
              extracted_c3_rc=$?
              (cd "$RUNNER_TEMP/v13-phone-c3-step2-extracted/V13-Phone" && env PYTHONPATH=.:tests:scripts "$py" scripts/install_selftest.py --timeout-seconds 120 --cohort run102_c3) > "$e/EXTRACTED_SMOKE_RAW.log" 2>&1
              smoke_rc=$?
              (cd "$RUNNER_TEMP/v13-phone-c3-step2-extracted/V13-Phone" && env PYTHONPATH=.:tests:scripts "$py" -c 'import json;from v13.gates import summary; s=summary();assert s["gates"]["STEP2_EXIT"]=="EVIDENCE_NOT_PASSING"; print(json.dumps(s,sort_keys=True))') > "$e/EXTRACTED_GATES_RAW.log" 2>&1
              gates_rc=$?
            else
              extracted_split_rc=125; extracted_c3_rc=125; smoke_rc=125; gates_rc=125
              echo 'ZIP_VERIFY_RED_NO_EXTRACTED_TESTS' > "$e/EXTRACTED_SPLIT_RAW.log"
            fi
            set -e
          else
            verify_rc=125; extracted_split_rc=125; extracted_c3_rc=125; smoke_rc=125; gates_rc=125
            echo 'PACKAGE_RED_NO_ZIP' > "$e/ZIP_VERIFY_RAW.log"
          fi
          echo "$verify_rc" > "$e/ZIP_VERIFY_EXIT.txt"
          echo "$extracted_split_rc" > "$e/EXTRACTED_SPLIT_EXIT.txt"
          echo "$extracted_c3_rc" > "$e/EXTRACTED_C3_EXIT.txt"
          echo "$smoke_rc" > "$e/EXTRACTED_SMOKE_EXIT.txt"
          echo "$gates_rc" > "$e/EXTRACTED_GATES_EXIT.txt"
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 621d4df389ea010ede9f53679a435eb8dd85b07e --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo $? > "$e/PRIVACY_EXIT.txt"
          git diff --check 621d4df389ea010ede9f53679a435eb8dd85b07e HEAD > "$e/DIFF_RAW.log" 2>&1
          echo $? > "$e/DIFF_EXIT.txt"
          set -e
          "$py" - "$e" <<'PY' > "$e/RESULT_RAW.log" 2>&1
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1])
          names=('SPLIT','ORIGINAL','INTEGRATION','C3_CONTEXT','INSTALL_CONTRACT',
                 'COHORT','TAR','PACKAGE','ZIP_VERIFY','EXTRACTED_SPLIT',
                 'EXTRACTED_C3','EXTRACTED_SMOKE','EXTRACTED_GATES','PRIVACY','DIFF')
          result={'schema':'v13.phone_c3_step2_exit_integration.software.v1',
                  'head':(e/'HEAD.txt').read_text().strip(),
                  'exits':{n:int((e/(n+'_EXIT.txt')).read_text()) for n in names},
                  'native_model_executed':False,'redmi_measured':False,
                  'step2_promoted':False,'b3_promoted':False,
                  'body_jepa_promoted':False,'age_promoted':False}
          (e/'RESULT.json').write_text(json.dumps(result,sort_keys=True)+'\n')
          print(json.dumps(result,sort_keys=True))
          PY
          echo 0 > "$e/RESULT_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat "$e/RESULT_RAW.log"
          for name in SPLIT ORIGINAL INTEGRATION C3_CONTEXT EXTRACTED_SPLIT EXTRACTED_C3 EXTRACTED_SMOKE EXTRACTED_GATES; do
            echo "===== $name ====="; tail -n 5 "$e/${name}_RAW.log"
          done
          for name in SPLIT ORIGINAL INTEGRATION C3_CONTEXT INSTALL_CONTRACT COHORT TAR PACKAGE ZIP_VERIFY EXTRACTED_SPLIT EXTRACTED_C3 EXTRACTED_SMOKE EXTRACTED_GATES PRIVACY DIFF; do
            test "$(cat "$e/${name}_EXIT.txt")" -eq 0
          done
          grep -q 'INSTALL_SELFTEST_PASS' "$e/EXTRACTED_SMOKE_RAW.log"
      - name: Upload original ZIP and all raw results including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-phone-c3-step2-exit-${{ github.sha }}
          path: ${{ runner.temp }}/v13-phone-c3-step2-exit/
          if-no-files-found: error
          retention-days: 90
