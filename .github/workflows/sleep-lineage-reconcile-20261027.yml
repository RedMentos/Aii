name: V13 Sleep lineage prior-art reconciliation (software only)
on:
  push:
    branches: [assistant/v13-sleep-lineage-reconcile-20261027]
    paths:
      - '.github/workflows/sleep-lineage-reconcile-20261027.yml'
      - 'v13/code/v13/sleep_offline.py'
      - 'v13/code/v13/history.py'
      - 'v13/code/tests/test_sleep_*'
      - 'v13/code/docs/proofs/continuation-20261027/sleep-lineage-reconciliation/**'
permissions:
  contents: read
concurrency:
  group: v13-sleep-lineage-reconcile-20261027
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run exact-source software tests and preserve raw evidence
        shell: bash
        run: |
          set +e
          evidence="$RUNNER_TEMP/v13-sleep-lineage"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/HEAD.txt"
          git show -s --format='%P' HEAD > "$evidence/PARENTS.txt"
          for item in \
            "v13/code/v13/sleep_offline.py:e51766478fee915824853da7c8e73785b12e91b3" \
            "v13/code/v13/history.py:a7138080e19b439331bf4c5da68e7e62f823f169" \
            "v13/code/tests/test_sleep_ttt_source_lineage_run207.py:783092f081ede8fbfb8de3fd9879816b560f2fb4" \
            "v13/code/tests/test_sleep_digest_live_lineage_run208.py:b80eeacc38375368d35bdb8041f52ec42a70cbc2" \
            "v13/code/tests/test_sleep_digest_view_authority_run278.py:947286a7e2debd2795c77bf1efe1a2fa98000fe5" \
            "v13/code/tests/test_sleep_memory_c3_continuity_run205.py:b0119e70b492c2b386979daf0c9e08cf438e2608"; do
            path="${item%%:*}"; expected="${item##*:}"
            observed="$(git hash-object "$path")"
            printf '%s %s %s\n' "$path" "$expected" "$observed" >> "$evidence/BLOBS.txt"
            if [ "$observed" != "$expected" ]; then echo "$path" >> "$evidence/BLOB_MISMATCH.txt"; fi
          done
          if [ -s "$evidence/BLOB_MISMATCH.txt" ]; then echo 1 > "$evidence/BLOBS_EXIT.txt"; else echo 0 > "$evidence/BLOBS_EXIT.txt"; fi
          python3 -m venv "$RUNNER_TEMP/v13-sleep-lineage-venv"
          py="$RUNNER_TEMP/v13-sleep-lineage-venv/bin/python"
          "$py" -m pip install --no-input -q 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu > "$evidence/INSTALL_RAW.log" 2>&1
          first=$?
          "$py" -m pip install --no-input -q 'numpy==2.2.6' 'psutil' 'PyYAML' 'Pillow' 'transformers==5.20.2' 'peft==0.21.2' >> "$evidence/INSTALL_RAW.log" 2>&1
          second=$?
          if [ "$first" -eq 0 ] && [ "$second" -eq 0 ]; then echo 0; else echo 1; fi > "$evidence/INSTALL_EXIT.txt"
          (
            cd v13/code
            timeout --signal=TERM --kill-after=10s 7m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_sleep_ttt_source_lineage_run207 tests.test_sleep_digest_live_lineage_run208 tests.test_sleep_digest_view_authority_run278 tests.test_sleep_memory_c3_continuity_run205 tests.test_sleep_offline tests.test_history_lineage tests.test_sleep_a_exact_recall_identity_review
          ) > "$evidence/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$evidence/FOCUSED_EXIT.txt"
          (
            cd v13/code
            timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=.:tests "$py" -m unittest discover -s tests -p 'test_*.py' -q
          ) > "$evidence/FULL_RAW.log" 2>&1
          echo "$?" > "$evidence/FULL_EXIT.txt"
          python3 -m compileall -q v13/code/v13 > "$evidence/COMPILE_RAW.log" 2>&1
          echo "$?" > "$evidence/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 6c5dbf145380956ac29bf2d5479ec489ebc7ef5a --head HEAD > "$evidence/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$evidence/PRIVACY_EXIT.txt"
          git diff --check 6c5dbf145380956ac29bf2d5479ec489ebc7ef5a HEAD > "$evidence/DIFF_RAW.log" 2>&1
          echo "$?" > "$evidence/DIFF_EXIT.txt"
          (cd "$evidence" && sha256sum * > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-sleep-lineage-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-sleep-lineage/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce all exits without promoting any gate
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/v13-sleep-lineage"
          for name in BLOBS INSTALL FOCUSED FULL COMPILE PRIVACY DIFF; do
            if [ "$(cat "$evidence/${name}_EXIT.txt")" != 0 ]; then
              echo "$name FAILED (raw evidence uploaded)"
              tail -90 "$evidence/${name}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'SLEEP_LINEAGE_SOFTWARE_ONLY_NO_AGE_B3_STEP2_JEPA_PROMOTION'
