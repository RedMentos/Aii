name: V13 Automation11 STEP2 staged12 candidate software guards
on:
  push:
    branches:
      - assistant/v13-run11-step2-staged12-candidate-20261028
    paths:
      - '.github/workflows/automation11-step2-staged12-software-20261028.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v13-run11-age0-native-endtoend
  cancel-in-progress: false
jobs:
  staged12-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      V13_NO_AUTOSTART: "1"
      NEEDLE_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen staged12 candidate tests, no native execution
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-step2-staged12-evidence"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          8773d5e9f9f423f5f528eb04c5c0089802b06bb1 v13/code/scripts/step2_longnote_staged12_native.py
          1680c331eee029681e1777d2ae609a32c883db05 v13/code/tests/test_step2_longnote_staged12_native.py
          62753649615620237923a1bda2a587b1bed5931e v13/code/docs/coordination/AUTOMATION11_STEP2_STAGED12_PREREG_20261028.md
          128647ee0680262575807722cd670db79a709385 v13/code/scripts/step2_longnote_runner_preflight.py
          eeb4155dc3421c2b57ca0871c126f8ea2249c649 v13/code/scripts/step2_longnote_revision_fixtures.py
          7c299616495450e4a38f9aab9921f7176ba67556 v13/code/scripts/step2_z2b_seeds.py
          2ad62fbbf1c6463d99360cdb8198f1104cfdfaf7 v13/code/scripts/step2_z2_timescale.py
          5722cdcf6163331ae83677bd96394399cca0fbc3 v13/code/scripts/step2_fourarm_native_collector_candidate.py
          68e7ed1352800174972558f1e0b0683a42c8689a v13/code/v13/runtime.py
          e07216f214b2653295eb797318b20cd862602de6 v13/code/v13/world_jepa.py
          BLOBS
          : > "$e/PINS_RAW.log"
          while read -r want file; do
            got="$(git hash-object "$file" 2>/dev/null)"
            printf '%s %s %s\n' "$want" "$got" "$file" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then echo MISMATCH >> "$e/PINS_RAW.log"; fi
          done < "$e/EXPECTED_BLOBS.txt"
          if grep -q MISMATCH "$e/PINS_RAW.log"; then echo 1 > "$e/PINS_EXIT.txt"; else echo 0 > "$e/PINS_EXIT.txt"; fi
          python3 -m venv "$RUNNER_TEMP/v13-step2-staged12-venv"
          py="$RUNNER_TEMP/v13-step2-staged12-venv/bin/python"
          "$py" -m pip install --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          first=$?
          "$py" -m pip install --no-input -q 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
          second=$?
          "$py" -m pip install --no-input -q 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
          third=$?
          if [ "$first" = 0 ] && [ "$second" = 0 ] && [ "$third" = 0 ]; then echo 0 > "$e/INSTALL_EXIT.txt"; else echo 1 > "$e/INSTALL_EXIT.txt"; fi
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 4m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_step2_longnote_staged12_native tests.test_step2_longnote_tp27_full70_native tests.test_step2_fourarm_native_collector_candidate_20261028 tests.test_step2_longnote_fourarm_analysis_20261028) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
            (cd v13/code && timeout --signal=TERM --kill-after=10s 9m env PYTHONPATH=.:tests "$py" -m unittest discover -s tests -p 'test_*.py' -q) > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
            "$py" -m py_compile v13/code/scripts/step2_longnote_staged12_native.py v13/code/tests/test_step2_longnote_staged12_native.py > "$e/COMPILE_RAW.log" 2>&1
            echo "$?" > "$e/COMPILE_EXIT.txt"
          else
            for n in FOCUSED FULL COMPILE; do echo SKIPPED_PREREQ_RED > "$e/${n}_RAW.log"; echo SKIPPED_RED > "$e/${n}_EXIT.txt"; done
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 53d7216b5786ad31faa497fb5de7b5ee2257709c --head HEAD > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 53d7216b5786ad31faa497fb5de7b5ee2257709c HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-automation11-step2-staged12-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-step2-staged12-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce software-only source checks
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-step2-staged12-evidence"
          for name in PINS INSTALL FOCUSED FULL COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${name}_EXIT.txt")" != 0 ]; then
              echo "$name RED; original raw retained; no STEP2 gate promotion"
              tail -90 "$e/${name}_RAW.log" || true
              exit 1
            fi
          done
          echo 'STEP2_STAGED12_SOFTWARE_ONLY_NO_GATE_PROMOTION'
