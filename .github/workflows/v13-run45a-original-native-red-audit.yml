name: V13 Run45A independently replay original Run44 Linux native RED raw
on:
  push:
    branches: [assistant/v13-run45-independent-handoff-raw-audit-20261031-hourly11]
    paths: ['.github/workflows/v13-run45a-original-native-red-audit.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download pinned original RED ZIP and independently audit unchanged raw
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run45a-original-native-red"
          mkdir -p "$e/raw"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/scripts/run45a_run44_raw_audit.py > "$e/AUDITOR_BLOB.txt"
          test "$(cat "$e/AUDITOR_BLOB.txt")" = 7d7877158f47ff1289576d226f2e3e6360c755c9
          echo "$?" > "$e/PINS_EXIT.txt"
          curl --fail --location --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/RedMentos/Aii/actions/artifacts/13024333634/zip" \
            -o "$e/ORIGINAL_RED.zip" > "$e/DOWNLOAD_RAW.log" 2>&1
          echo "$?" > "$e/DOWNLOAD_EXIT.txt"
          echo '24c7c4d5738140b3a79974554a4287f3b02477e726678b5116c9a61d41248585  '"$e/ORIGINAL_RED.zip" > "$e/ORIGINAL_SHA256.txt"
          if [ "$(cat "$e/DOWNLOAD_EXIT.txt")" = 0 ]; then
            sha256sum -c "$e/ORIGINAL_SHA256.txt" > "$e/ZIP_HASH_RAW.log" 2>&1
            echo "$?" > "$e/ZIP_HASH_EXIT.txt"
            unzip -t "$e/ORIGINAL_RED.zip" > "$e/CRC_RAW.log" 2>&1
            echo "$?" > "$e/CRC_EXIT.txt"
            unzip -q "$e/ORIGINAL_RED.zip" -d "$e/raw" > "$e/UNZIP_RAW.log" 2>&1
            echo "$?" > "$e/UNZIP_EXIT.txt"
          else
            for s in ZIP_HASH CRC UNZIP; do echo DOWNLOAD_RED > "$e/${s}_RAW.log"; echo 99 > "$e/${s}_EXIT.txt"; done
          fi
          if [ "$(cat "$e/UNZIP_EXIT.txt")" = 0 ]; then
            (cd "$e/raw" && sha256sum -c SHA256SUMS) > "$e/MANIFEST_RAW.log" 2>&1
            echo "$?" > "$e/MANIFEST_EXIT.txt"
            python3 - "$e/raw" > "$e/ORIGINAL_STAGES_RAW.log" 2>&1 <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1])
          stages=('PINS','VENV','DEPS','TEST','BOOTSTRAP','NATIVE','REPORT_CHECK','COMPILE','PRIVACY','DIFF')
          actual={s:(root/(s+'_EXIT.txt')).read_text().strip() for s in stages}
          print(actual)
          assert all(actual[s]=='0' for s in stages if s!='REPORT_CHECK')
          assert actual['REPORT_CHECK']=='1'
          print('ORIGINAL_RUN44_RED_UNWAIVED')
          PY
            echo "$?" > "$e/ORIGINAL_STAGES_EXIT.txt"
          else
            for s in MANIFEST ORIGINAL_STAGES; do echo UNZIP_RED > "$e/${s}_RAW.log"; echo 99 > "$e/${s}_EXIT.txt"; done
          fi
          if [ "$(cat "$e/MANIFEST_EXIT.txt")" = 0 ] && [ "$(cat "$e/PINS_EXIT.txt")" = 0 ]; then
            env PYTHONPATH=v13/code python3 - "$e/raw/ORIGINAL_REPORT.json" > "$e/AUDIT_RAW.log" 2>&1 <<'PY'
          import json,sys
          from pathlib import Path
          from scripts.run45a_run44_raw_audit import audit
          result=audit(Path(sys.argv[1]),Path('v13/code/docs/fixtures/run44_source_handoff_seed307.json'))
          print(json.dumps(result,sort_keys=True))
          assert result['status']=='ORIGINAL_INCOMPLETE'
          assert result['strict_pilot_signal'] is False
          assert result['strict_summary']['B_VERIFIED_B2_TO_C3']['structural']==2
          assert all(result['strict_summary'][a]['correct']==0 for a in result['strict_summary'])
          assert result['negative_gates']['step2']=='UTILITY_FAIL'
          print('RUN45A_INDEPENDENT_ORIGINAL_NATIVE_STRUCTURAL_RED_PRESERVED')
          PY
            echo "$?" > "$e/AUDIT_EXIT.txt"
          else echo SKIPPED_MANIFEST_OR_PINS_RED > "$e/AUDIT_RAW.log"; echo 99 > "$e/AUDIT_EXIT.txt"; fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 61e1e48b8dcd0296533a23d672732081dde355b7 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 61e1e48b8dcd0296533a23d672732081dde355b7 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          mkdir -p "$e/receipts"
          for s in HEAD.txt AUDITOR_BLOB.txt ORIGINAL_SHA256.txt DOWNLOAD_RAW.log DOWNLOAD_EXIT.txt ZIP_HASH_RAW.log ZIP_HASH_EXIT.txt CRC_RAW.log CRC_EXIT.txt UNZIP_RAW.log UNZIP_EXIT.txt MANIFEST_RAW.log MANIFEST_EXIT.txt ORIGINAL_STAGES_RAW.log ORIGINAL_STAGES_EXIT.txt AUDIT_RAW.log AUDIT_EXIT.txt PINS_EXIT.txt PRIVACY_RAW.log PRIVACY_EXIT.txt DIFF_RAW.log DIFF_EXIT.txt; do
            [ ! -f "$e/$s" ] || cp "$e/$s" "$e/receipts/$s"
          done
          (cd "$e/receipts" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve independent replay and original RED references on any outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run45a-original-red-audit-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run45a-original-native-red/receipts/
          retention-days: 90
          if-no-files-found: error
      - name: Require original RED preserved and independent audit closed
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run45a-original-native-red"
          for s in PINS DOWNLOAD ZIP_HASH CRC UNZIP MANIFEST ORIGINAL_STAGES AUDIT PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN45A_NATIVE_ORIGINAL_RED_AUDITED_NO_UTILITY_OR_AGE_PROMOTION
