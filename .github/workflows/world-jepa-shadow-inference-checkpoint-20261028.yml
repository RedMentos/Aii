name: V13 World-JEPA SHADOW inference checkpoint Linux software review
on:
  push:
    branches: [assistant/v13-world-jepa-shadow-inference-checkpoint-20261028]
    paths:
      - '.github/workflows/world-jepa-shadow-inference-checkpoint-20261028.yml'
      - 'v13/code/v13/world_jepa_shadow_checkpoint.py'
      - 'v13/code/tests/test_world_jepa_shadow_checkpoint_20261028.py'
permissions:
  contents: read
concurrency:
  group: v13-world-jepa-shadow-inference-checkpoint-20261028
  cancel-in-progress: false
jobs:
  numpy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Closed raw inference checkpoint tests (no model artifacts)
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-world-jepa-inference-checkpoint"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/v13/world_jepa_shadow_checkpoint.py > "$e/SOURCE_BLOB.txt"
          python3 -m venv "$RUNNER_TEMP/v13-world-jepa-inference-venv"
          py="$RUNNER_TEMP/v13-world-jepa-inference-venv/bin/python"
          "$py" -m pip install --no-input -q numpy==2.2.6 > "$e/INSTALL_RAW.log" 2>&1
          echo "$?" > "$e/INSTALL_EXIT.txt"
          if [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 10m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_world_jepa_shadow_checkpoint_20261028 tests.test_world_jepa) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else
            echo SKIPPED_INSTALL_RED > "$e/FOCUSED_RAW.log"
            echo SKIPPED_RED > "$e/FOCUSED_EXIT.txt"
          fi
          python3 -m compileall -q v13/code/v13/world_jepa_shadow_checkpoint.py v13/code/tests/test_world_jepa_shadow_checkpoint_20261028.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 0cc5e59fc1c91a71b0b232b42f70668c562d9d2b --head HEAD > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 0cc5e59fc1c91a71b0b232b42f70668c562d9d2b HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && sha256sum * > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-world-jepa-shadow-inference-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-world-jepa-inference-checkpoint/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce raw exits
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-world-jepa-inference-checkpoint"
          for name in INSTALL FOCUSED COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${name}_EXIT.txt")" != 0 ]; then
              echo "$name RED; raw retained"
              tail -50 "$e/${name}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'INFERENCE_ONLY_SHADOW_NO_TRAINING_RESUME_NO_GATE_PROMOTION'
