name: V13 Predictor Restore Validation
on:
  push:
    branches:
      - 'codex/v13-predictor-restore-validation-*'
  pull_request:
    paths:
      - 'v13/code/v13/continuous_predictor.py'
      - 'v13/code/tests/test_online_restore_atomic_20261109.py'
      - '.github/workflows/v13-predictor-restore-validation.yml'
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy
      - name: Predictor and online-world regressions
        working-directory: v13/code
        run: |
          python -m compileall -q v13/continuous_predictor.py
          python -m pytest -q tests/test_online_restore_atomic_20261109.py tests/test_online_observe_atomic_20261109.py tests/test_online_checkpoint_validation_20261109.py tests/test_continuous_predictor_20261108.py tests/test_online_world_atomic_cursor_20261109.py
