name: V13 Run32 disjoint World-JEPA W7 attribution software preflight
on:
  push:
    branches: [assistant/v13-run32-world-jepa-disjoint-attribution-20261031-hourly11]
    paths:
      - '.github/workflows/v13-run32-world-jepa-disjoint-software.yml'
permissions:
  contents: read
jobs:
  prereg-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      DO_NOT_TRACK: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin original Z12b, Run28 slot and Run32 W7 prereg, test without native
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run32-software"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          dc1c01390de0b783928cc1b628192524b61077b9 v13/code/docs/WORLD_JEPA_DISJOINT_ATTRIBUTION_PREREG_RUN32_20261031.md
          7e221f1fea0c382dd273461a3ec3c1d0c0d312b7 v13/code/scripts/run32_world_jepa_disjoint_attribution.py
          ab088853f117cd475f3b940dcd842e99d78cb35e v13/code/tests/test_run32_world_jepa_disjoint_attribution.py
          99a686a131a1bdc89efe0d0cf9610ec54cbd853b v13/code/v13/world_jepa.py
          2fd1366dc1b6d8c02803ee3254020f70e5bf3eb4 v13/code/scripts/z12b_world_jepa.py
          67e14e0d03c50c4767b74d5b02a819a95c6cc262 v13/code/v13/world_jepa_slot_candidate.py
          dbf3af3f8bc61a846eb542c7db3cc034e94f5bd7 v13/code/scripts/run28_world_jepa_slot_real.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run32-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run32-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 4m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_run32_world_jepa_disjoint_attribution tests.test_world_jepa_slot_candidate_run28 tests.test_run28_world_jepa_slot_real) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PIN_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          python3 -m py_compile v13/code/scripts/run32_world_jepa_disjoint_attribution.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 83be15bed42b7800260ed82a1cd70fcd7798e131 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 83be15bed42b7800260ed82a1cd70fcd7798e131 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve raw including failed stages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run32-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run32-software/
          if-no-files-found: error
          retention-days: 90
      - name: Require pinned software pass without promoting learning
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-run32-software"
          for stage in PINS VENV DEPS TEST COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${stage}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN32_DISJOINT_W7_SOFTWARE_ONLY_NO_NATIVE_PROOF
