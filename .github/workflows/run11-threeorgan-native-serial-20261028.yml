name: V13 Run11 pinned B1 B2 C3 serial Linux native catalog smoke
on:
  push:
    branches:
      - codex/v13-run11-threeorgan-native-singleturn-review-20261028
    paths:
      - '.github/workflows/run11-threeorgan-native-serial-20261028.yml'
      - 'v13/code/scripts/step2_current_catalog_native_smoke.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v13-run11-threeorgan-serial-native
  cancel-in-progress: false
jobs:
  threeorgan-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Guards then exact pinned B1 B2 C3 serial Linux native
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-threeorgan-native"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/specs/models.json > "$e/CATALOG_BLOB.txt"
          git hash-object v13/code/scripts/step2_current_catalog_native_smoke.py > "$e/PROBE_BLOB.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:tests python3 -m unittest -q tests.test_step2_current_catalog_native_smoke_20261028 tests.test_native_smoke_io_20261028) > "$e/GUARDS_RAW.log" 2>&1
          echo "$?" > "$e/GUARDS_EXIT.txt"
          if [ "$(cat "$e/GUARDS_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 15m env PYTHONPATH=v13/code python3 v13/code/scripts/step2_current_catalog_native_smoke.py \
              --scratch-root "$RUNNER_TEMP/v13-threeorgan-native-scratch" \
              --evidence-dir "$e/native" \
              --expected-catalog-blob 7af05962af41d0bc3f7dd18ef01d4eba55eabf99 > "$e/NATIVE_PROBE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_PROBE_EXIT.txt"
          else
            echo SKIPPED_GUARDS_RED > "$e/NATIVE_PROBE_RAW.log"
            echo SKIPPED_RED > "$e/NATIVE_PROBE_EXIT.txt"
          fi
          python3 - "$e" > "$e/REPORT_CHECK_RAW.log" 2>&1 <<'PY'
          import hashlib,json,pathlib,sys
          p=pathlib.Path(sys.argv[1])/'native'
          f=p/'SMOKE_REPORT.json'
          if not f.is_file():
              raise SystemExit('NO_CLOSED_THREEORGAN_NATIVE_REPORT')
          j=json.loads(f.read_text())
          assert j['evidence_kind']=='LINUX_NATIVE_SMOKE_ONLY'
          assert j['catalog_git_blob_sha']=='7af05962af41d0bc3f7dd18ef01d4eba55eabf99'
          assert j['runner_cli_sha256']=='3acf625ff44f1dc28799e7e036519207b5564191d6243371bfae086b3911ed71'
          assert (j['seed'],j['tokens'],j['context'],j['threads'])==(27,4,512,2)
          assert j['native_linux_load_decode'] and not j['redmi_proof']
          assert not j['step2_gate_promoted'] and j['jepa_weight']==0
          pins=['bb741ebb106d543e9de114b843a3d3d73d51c74b5801e69da2abde821a0cb3e1','57d1997790d1744fba5b40a7317df71ea5e2acee28c47e78f0cce39c0703f8cf','3d10b6ab8fc91a919534b9558e266255aca0bbc7f6d015963599aa9e74e05b1d']
          roles=['B1_DETAIL','B2_GIST','C3_LANGUAGE']
          assert [x['role'] for x in j['roles']]==roles
          for r,role,pin in zip(j['roles'],roles,pins):
              assert r['model_sha256']==pin and r['runner_cli_sha256']==j['runner_cli_sha256']
              assert r['returncode']==0 and not r['timeout'] and r['native_smoke_pass']
              assert r['generation_marker_seen'] and r['raw_capture_complete'] and not r['raw_output_capped']
              assert r['stdout_bytes']<1048576 and r['stderr_bytes']<1048576
              for suffix,key in [('STDOUT_RAW.log','stdout_sha256'),('STDERR_RAW.log','stderr_sha256')]:
                  raw=(p/(role+'_'+suffix)).read_bytes()
                  assert hashlib.sha256(raw).hexdigest()==r[key]
              assert (p/(role+'.stdout')).read_bytes()==(p/(role+'_STDOUT_RAW.log')).read_bytes()
          model=json.loads((p/'MODEL_BYTES.json').read_text())
          assert [x['sha256'] for x in model['roles']]==pins
          runner=json.loads((p/'RUNNER_ARCHIVES.json').read_text())
          assert any(x['kind']=='binary' and x['sha256']=='9abf88aea48a55d0f80edb1ee20220b186848cca0b4e919d71518cfd7ca67443' for x in runner['archives'])
          print('PINNED_B1_B2_C3_SERIAL_LINUX_NATIVE_ONLY_NO_STEP2_GATE')
          PY
          echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base ca1fbeaeb75597ded2ef71ec96977651513df173 --head HEAD > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check ca1fbeaeb75597ded2ef71ec96977651513df173 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-threeorgan-serial-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-threeorgan-native/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce exact three-organ native evidence
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-threeorgan-native"
          for name in GUARDS NATIVE_PROBE REPORT_CHECK PRIVACY DIFF; do
            if [ "$(cat "$e/${name}_EXIT.txt")" != 0 ]; then
              echo "$name RED; raw retained, no native PASS"
              tail -80 "$e/${name}_RAW.log" || true
              exit 1
            fi
          done
          echo 'B1_B2_C3_LINUX_NATIVE_ONLY_NO_C2_JEF_STEP2_REDM I_OR_GATE_PROMOTION'
