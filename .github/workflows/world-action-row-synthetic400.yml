name: V13 World-JEPA split-row action 400-step synthetic control
on:
  push:
    branches: [assistant/v13-world-action-permutation-control-20261027]
    paths:
      - '.github/workflows/world-action-row-synthetic400.yml'
permissions:
  contents: read
concurrency:
  group: v13-native-heavy-lp3-gradient-350m
  cancel-in-progress: false
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen synthetic SQLite cohort with raw exits
        run: |
          set +e
          evidence="$RUNNER_TEMP/world-action-row-400"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/HEAD.txt"
          git hash-object v13/code/v13/world_jepa.py > "$evidence/MODEL_BLOB.txt"
          git hash-object v13/code/scripts/world_jepa_digital_shadow.py > "$evidence/BRIDGE_BLOB.txt"
          git hash-object v13/code/scripts/world_jepa_fair_baseline.py > "$evidence/FAIR_BLOB.txt"
          git hash-object v13/code/scripts/world_jepa_action_permutation_control.py > "$evidence/CONTROL_BLOB.txt"
          git hash-object v13/code/docs/coordination/WORLD_ACTION_ROW_PERMUTATION_PREREG_20261027.md > "$evidence/PREREG_BLOB.txt"
          if [ "$(cat "$evidence/MODEL_BLOB.txt")" = "5ffd56097e66a37e2922e39d1dc0ba86cb28a760" ] && [ "$(cat "$evidence/BRIDGE_BLOB.txt")" = "4ab37e11d8238d376e568567f901c85c12d09da8" ] && [ "$(cat "$evidence/FAIR_BLOB.txt")" = "97367ad5eaae24024955a58fbdd079cfb59de179" ] && [ "$(cat "$evidence/CONTROL_BLOB.txt")" = "63e3844aa0b04ed3635c046e068b7e96cc01ddc9" ] && [ "$(cat "$evidence/PREREG_BLOB.txt")" = "1176ce11dc75a60279332ff760038aee9f29a349" ]; then echo 0; else echo 1; fi > "$evidence/FROZEN_EXIT.txt"
          git merge-base --is-ancestor 00f1dd2fa737fe5cb3a9ea074e437c51233aa040 HEAD
          echo "$?" > "$evidence/PREREG_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/world-action-row-400-venv"
          py="$RUNNER_TEMP/world-action-row-400-venv/bin/python"
          "$py" -m pip install --no-input -q 'numpy==2.2.6' 'psutil' 'PyYAML' 'Pillow' > "$evidence/INSTALL_RAW.log" 2>&1
          echo "$?" > "$evidence/INSTALL_EXIT.txt"
          (
            cd v13/code
            timeout --signal=TERM --kill-after=10s 12m env PYTHONPATH=.:tests "$py" - <<'PY'
          import hashlib,json
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from tests.test_world_jepa_readonly_store import fixture
          from scripts import world_jepa_action_permutation_control as ctrl
          from scripts import world_jepa_readonly_store as closed
          from v13 import world_model as wm
          with TemporaryDirectory() as d:
              p=Path(d)/'synthetic.sqlite'
              fixture(p,n=64)
              original=hashlib.sha256(p.read_bytes()).hexdigest()
              store=closed.ReadOnlyStore(p)
              try:
                  rows=wm.transitions(store)
              finally:
                  store.close()
              report=ctrl.run_rows(rows)
              assert original==hashlib.sha256(p.read_bytes()).hexdigest()
              assert report['source_sha256']=='21bb5a49906676050a1caf755ce441b36a483b3cb8db8d3f1a8a9048e2a7a0bf'
              assert report['train_ids_sha256']=='e526ec41c33f4f639d662e053cbb8757de66737babc76df442a7d1eaed2c164b'
              assert report['heldout_ids_sha256']=='dce3c8c36cf08617c193ea628112964796c23bbd78a5eb353c965396816b0760'
              assert report['steps']==400 and report['seeds']==[3,7]
              assert report['n']==64 and report['train_n']==47 and report['heldout_n']==17
              assert report['row_shift_split_isolated'] and report['row_shift']==1
              assert not report['utility_proven'] and not report['runtime_wired']
              assert not any(Path(str(p)+s).exists() for s in ('-wal','-shm','-journal'))
              output=json.dumps({'fixture':'SYNTHETIC_SQLITE_ONLY','report':report},sort_keys=True,allow_nan=False)
              assert 'synthetic-action-' not in output and str(p) not in output
              print(output)
          PY
          ) > "$evidence/SYNTHETIC_REPORT.json" 2> "$evidence/SYNTHETIC_RAW.log"
          echo "$?" > "$evidence/SYNTHETIC_EXIT.txt"
          python3 -m py_compile v13/code/scripts/world_jepa_action_permutation_control.py > "$evidence/COMPILE_RAW.log" 2>&1
          echo "$?" > "$evidence/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base c84b95142e30dabd834e0cb5e495b3b8511a0a0e --head HEAD > "$evidence/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$evidence/PRIVACY_EXIT.txt"
          git diff --check c84b95142e30dabd834e0cb5e495b3b8511a0a0e HEAD > "$evidence/DIFF_RAW.log" 2>&1
          echo "$?" > "$evidence/DIFF_EXIT.txt"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-world-action-row-400-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/world-action-row-400/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce actual exits and negative gates
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/world-action-row-400"
          for name in FROZEN PREREG INSTALL SYNTHETIC COMPILE PRIVACY DIFF; do
            if [ "$(cat "$evidence/${name}_EXIT.txt")" != 0 ]; then
              echo "$name failed; raw evidence retained"
              tail -90 "$evidence/${name}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'WORLD_ACTION_ROW_SYNTHETIC_ONLY_NO_JEPA_PROMOTION'
