name: V13 Run11U focal source identity synthetic shadow
on:
  push:
    branches: [assistant/v13-run11u-focal-keybound-shadow-20261030]
    paths:
      - '.github/workflows/v13-run11u-focal-keybound-shadow.yml'
permissions:
  contents: read
jobs:
  source-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned synthetic source and negative controls
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run11u-shadow"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          257df28b2548dbc546e68c7e0899897c06ad25f8 v13/code/docs/FOCAL_SOURCE_IDENTITY_PREREG_RUN11U_20261030.md
          fabd634ac1394ff074fcf07d2b648ff51e601810 v13/code/scripts/focal_source_identity_guard_run11u.py
          4bda7ba459cce637ea00215c79944915b57fd9ba v13/code/tests/test_focal_source_identity_guard_run11u.py
          22361f6e6888bdc98c640ecc5f852a323fc1283f v13/code/docs/FOCAL_RECENCY_REPLACEMENT_SHADOW_PREREG_RUN11S_20261030.md
          bf9c7d8ee75bbe82a82c0c2d3dc4cefed4036bce v13/code/scripts/focal_replacement_shadow_run11s.py
          47b49d6df8f42d49bee08f7b818a70710c7abea1 v13/code/tests/test_focal_replacement_shadow_run11s.py
          c81b6d38309311708cf03ffc47a9f279e86a4084 v13/code/scripts/utility_bench2.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run11u-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run11u-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo SKIPPED > "$e/DEPS_RAW.log"; echo SKIPPED > "$e/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_focal_replacement_shadow_run11s tests.test_focal_source_identity_guard_run11u) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
            (cd v13/code && PYTHONPATH=.:scripts "$py" scripts/focal_source_identity_guard_run11u.py) > "$e/report.json" 2> "$e/REPORT_RAW.log"
            echo "$?" > "$e/REPORT_EXIT.txt"
          else
            for stage in TEST REPORT; do echo SKIPPED > "$e/${stage}_RAW.log"; echo SKIPPED > "$e/${stage}_EXIT.txt"; done
          fi
          "$py" -m py_compile v13/code/scripts/focal_replacement_shadow_run11s.py v13/code/tests/test_focal_replacement_shadow_run11s.py v13/code/scripts/focal_source_identity_guard_run11u.py v13/code/tests/test_focal_source_identity_guard_run11u.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 65585cd7518b98dd09562a1d083347435b2f8d0b --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 65585cd7518b98dd09562a1d083347435b2f8d0b HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original software raw even on RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run11u-shadow-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run11u-shadow/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce synthetic-only gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run11u-shadow"
          for stage in PINS VENV DEPS TEST REPORT COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw preserved"
              tail -80 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'RUN11U_SYNTHETIC_SOURCE_IDENTITY_ONLY_NO_NATIVE_OR_GATE'
