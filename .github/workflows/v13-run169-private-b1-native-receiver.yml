name: V13 Run169 pinned private B1 native receiver paired probe
on:
  pull_request:
    paths:
      - '.github/workflows/v13-run169-private-b1-native-receiver.yml'
      - 'v13/code/docs/proofs/continuation-20261025/run169-native-b1-receiver/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v13-native-c3-run131-serialized
  cancel-in-progress: false
jobs:
  real-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pinned isolated NumPy, CPU Torch and exact frozen registration
        run: |
          python -m pip install --disable-pip-version-check --no-input numpy==2.3.5
          timeout 420s python -m pip install --disable-pip-version-check --no-input --index-url https://download.pytorch.org/whl/cpu 'torch==2.9.1+cpu'
          PYTHONPATH=v13/code python -m unittest discover -s v13/code/tests -p test_body_fp32_master_micro_run166.py -v
          PYTHONPATH=v13/code python -m unittest discover -s v13/code/tests -p test_body_fp32_gguf_reversible_run168.py -v
          PYTHONPATH=v13/code python -m unittest discover -s v13/code/tests -p test_body_fp32_native_receiver_run169.py -v
          PYTHONPATH=v13/code python -m unittest discover -s v13/code/tests -p test_body_fp32_export_verify_run163.py -v
          python -m compileall -q v13/code/scripts/body_fp32_native_receiver_run169.py v13/code/tests/test_body_fp32_native_receiver_run169.py
          python - <<'PY'
          import json
          s=json.load(open('v13/code/specs/models.json'))['models']['body']
          f=s['files'][0]
          assert s['revision']=='6767265158422fb8a19c62ceb45f16f05363615b'
          assert s['license_id']=='LFM Open License 1.0'
          assert f['size']==695755488
          assert f['sha256']=='bb741ebb106d543e9de114b843a3d3d73d51c74b5801e69da2abde821a0cb3e1'
          print('RUN169_REGISTERED_SOURCE_OK')
          PY
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2{print $4}')" -gt 2500000
      - name: Serialized pinned model extraction, byte-exact cross-audit, delete weights
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/run169"
          export MODEL="$RUNNER_TEMP/run169/body.gguf"
          export MASTER="$RUNNER_TEMP/run169/private-master.npz"
          export REPORT="$RUNNER_TEMP/run169/private-report.json"
          export PREFIX="$RUNNER_TEMP/run169/private-prefix.bin"
          export SUMMARY="$RUNNER_TEMP/run169/metadata-summary.json"
          export MICRO="$RUNNER_TEMP/run169/private-micro.npz"
          export MICRO_REPORT="$RUNNER_TEMP/run169/private-micro-report.json"
          export PATCHED="$RUNNER_TEMP/run169/private-patched.gguf"
          export NATIVE_HOME="$RUNNER_TEMP/run169/native-home"
          export NATIVE_DIR="$RUNNER_TEMP/run169/native-binary"
          export NATIVE_ARCHIVE="$RUNNER_TEMP/run169/llama-b10964-linux-x64.tar.gz"
          trap 'rm -f "$MODEL" "$MASTER" "$PREFIX" "$REPORT" "$MICRO" "$MICRO_REPORT" "$PATCHED" "$NATIVE_ARCHIVE"; rm -rf "$NATIVE_HOME" "$NATIVE_DIR"' EXIT
          timeout 600s curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 480 \
            'https://huggingface.co/LiquidAI/LFM2.5-1.2B-Instruct-GGUF/resolve/6767265158422fb8a19c62ceb45f16f05363615b/LFM2.5-1.2B-Instruct-QAD-Q4_0.gguf' -o "$MODEL"
          test "$(stat -c %s "$MODEL")" = "695755488"
          echo "bb741ebb106d543e9de114b843a3d3d73d51c74b5801e69da2abde821a0cb3e1  $MODEL" | sha256sum -c -
          head -c 33554432 "$MODEL" > "$PREFIX"
          PYTHONPATH=v13/code python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.body_gguf_dtype_audit_run160 import parse
          from scripts.body_fp32_master_export_run162 import export
          from scripts.body_fp32_export_verify_run163 import verify
          from scripts.body_fp32_master_micro_run166 import micro
          from scripts.body_fp32_native_receiver_run169 import probe, PROMPTS_SHA, prompt_hash
          from v13.models import catalog, download_file
          from v13.bootstrap import extract
          from v13.config import initialize
          from v13.runners import LlamaRunner
          m=Path(os.environ['MODEL']); p=Path(os.environ['PREFIX'])
          master=Path(os.environ['MASTER']); report=Path(os.environ['REPORT'])
          expected='bb741ebb106d543e9de114b843a3d3d73d51c74b5801e69da2abde821a0cb3e1'
          meta=parse(p.read_bytes())
          assert meta['tensor_count']==148 and len(meta['fp32_tensor_names'])==55
          eligible=sorted(n for n,t in meta['tensors'].items()
                          if t['type']=='F32' and len(t['dims'])==1 and
                          1<=t['dims'][0]*4<=16*1024*1024)
          selection=eligible[:4]
          if not selection: raise RuntimeError('NO_PREREG_ELIGIBLE_F32_VECTOR')
          r=export(m,expected,selection,master)
          report.write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          a=verify(m,master,report,expected)
          micro_report=micro(m,master,report,expected,Path(os.environ['MICRO']))
          Path(os.environ['MICRO_REPORT']).write_text(json.dumps(micro_report,sort_keys=True,indent=2)+'\n')
          assert prompt_hash()==PROMPTS_SHA
          specs=catalog()
          ns=specs['runner']['linux_binaries']['linux-x86_64']
          assert ns['sha256']=='9abf88aea48a55d0f80edb1ee20220b186848cca0b4e919d71518cfd7ca67443'
          archive=Path(os.environ['NATIVE_ARCHIVE'])
          download_file(ns,archive,progress=lambda x:print('RUN169_RUNNER_DOWNLOAD',x,flush=True))
          import hashlib
          def sha(path):
              h=hashlib.sha256()
              with Path(path).open('rb') as f:
                  for b in iter(lambda:f.read(1<<20),b''):h.update(b)
              return h.hexdigest()
          assert sha(archive)==ns['sha256']
          native_dir=Path(os.environ['NATIVE_DIR'])
          extract(archive,native_dir)
          binaries=list(native_dir.rglob('llama-server'))
          assert len(binaries)==1
          binary=binaries[0];binary.chmod(0o700)
          os.environ['V13_LLAMA_SERVER']=str(binary)
          home=Path(os.environ['NATIVE_HOME'])
          cfg=dict(initialize(home));cfg.update(threads=2,context_tokens=1024,answer_tokens=32)
          native_report=probe(m,master,report,Path(os.environ['MICRO']),
                              Path(os.environ['MICRO_REPORT']),expected,Path(os.environ['PATCHED']),
                              home,cfg,LlamaRunner)
          assert len(native_report['rows'])==6 and native_report['body_training_authority']==0
          assert native_report['private_restored_sha256']==expected
          print('RUN169_NATIVE_B1_PRIVATE_RECEIVER_PASS',len(native_report['rows']),'AUTHORITY',0)
          assert micro_report['gradients_finite_nonzero'] and micro_report['rollback_exact_baseline']
          assert micro_report['exclusive_persist_reload'] and micro_report['body_training_authority']==0
          assert micro_report['jepa_weight']==0 and micro_report['gates']==a['gates']
          assert a['selected_bytes_exact'] and a['selected_source_spans_nonoverlap']
          assert a['body_training_authority']==0 and a['gate']=='UNVERIFIED'
          assert r['body_training_authority']==0 and r['train_master_authority']==0
          summary={'schema':'V13_RUN169_REAL_PINNED_B1_PRIVATE_NATIVE_RECEIVER_V1',
                   'source_revision':'6767265158422fb8a19c62ceb45f16f05363615b',
                   'full_source_sha256':expected,'full_source_bytes':m.stat().st_size,
                   'tensor_count':meta['tensor_count'],'fp32_count':len(meta['fp32_tensor_names']),
                   'selection_rule':'sorted first <=4 eligible 1D F32 <=16MiB',
                   'selected_tensors':r['selected_tensors'],
                   'private_master_sha256':r['master_candidate_sha256'],
                   'private_master_bytes':r['master_candidate_bytes'],
                   'external_audit':a,
                   'synthetic_micro':micro_report,
                   'private_native_receiver':native_report,
                   'evidence_class':'LINUX_NATIVE_B1_PRIVATE_RECEIVER_NO_JEPA_OR_UTILITY',
                   'native_training':False,'redmi':False,
                   'gates':a['gates']}
          Path(os.environ['SUMMARY']).write_text(json.dumps(summary,sort_keys=True,indent=2)+'\n')
          print('RUN169_PRIVATE_B1_NATIVE_PAIR_COMPLETE',len(selection),'AUTHORITY',native_report['body_training_authority'])
          PY
      - name: Official public repo privacy scan
        run: python v13/code/scripts/public_repo_privacy_scan.py --base b630f68d2536aa5aefff2775c476cc7682ab42a1 --head HEAD
      - name: Upload metadata only, never weight files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V13-Run169-Private-B1-Native-Receiver-Metadata-Only
          path: ${{ runner.temp }}/run169/metadata-summary.json
          if-no-files-found: warn
          retention-days: 14
