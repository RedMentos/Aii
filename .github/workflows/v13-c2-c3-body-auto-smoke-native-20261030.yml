name: V13 seed47 C2 C3 Body auto-route Linux native integration smoke
on:
  push:
    branches:
      - assistant/v13-c2-c3-body-auto-native-smoke-20261030-0500
    paths:
      - '.github/workflows/v13-c2-c3-body-auto-smoke-native-20261030.yml'
permissions:
  contents: read
concurrency:
  group: v13-step2-budget-paired-native-20261030
  cancel-in-progress: false
jobs:
  auto-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned seed47 native auto-route 3-turn smoke with closed raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-auto-native-smoke"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          1b08f558cc60d1e0b43432180a4eb7f0c0f142ef v13/code/docs/C2_C3_BODY_AUTO_NATIVE_SMOKE_PREREG_20261030.md
          e97bd4ca787f8d8f6b6ac52e06988e590a896103 v13/code/scripts/c2_c3_body_auto_native_smoke_20261030.py
          6b4ee8d2ceaefc17ddb28420eead4d5b09ebf70e v13/code/tests/test_c2_c3_body_auto_native_smoke_20261030.py
          fb34dba97ae3700ba5accdcb928bfb72afcf4fcb v13/code/scripts/c2_native_route_provenance_20261030.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          954a3f468f10195fbce12d27f68585ee7edee2c9 v13/code/specs/control_tools.json
          BLOBS
          red=0
          : > "$e/PINS_RAW.log"
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then red=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$red" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-auto-native-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-auto-native-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else
            echo SKIPPED_VENV_RED > "$e/DEPS_RAW.log"
            echo SKIPPED_RED > "$e/DEPS_EXIT.txt"
          fi
          if [ "$red" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_c2_c3_body_auto_native_smoke_20261030) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else
            echo SKIPPED_PINS_OR_DEPS_RED > "$e/TEST_RAW.log"
            echo SKIPPED_RED > "$e/TEST_EXIT.txt"
          fi
          export V13_HOME="$RUNNER_TEMP/v13-auto-native-installed"
          if [ "$(cat "$e/TEST_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 15m env PYTHONPATH=v13/code "$py" -m v13.bootstrap --home "$V13_HOME" > "$e/BOOTSTRAP_RAW.log" 2>&1
            echo "$?" > "$e/BOOTSTRAP_EXIT.txt"
          else
            echo SKIPPED_TEST_RED > "$e/BOOTSTRAP_RAW.log"
            echo SKIPPED_RED > "$e/BOOTSTRAP_EXIT.txt"
          fi
          if [ "$(cat "$e/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 12m env PYTHONPATH=v13/code "$py" v13/code/scripts/c2_c3_body_auto_native_smoke_20261030.py --home "$V13_HOME" --out "$e/pilot" > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else
            echo SKIPPED_BOOTSTRAP_RED > "$e/NATIVE_RAW.log"
            echo SKIPPED_RED > "$e/NATIVE_EXIT.txt"
          fi
          if [ -f "$e/pilot/report.json" ]; then
            "$py" - "$e/pilot" > "$e/REPORT_CHECK_RAW.log" 2>&1 <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);j=json.loads((p/'report.json').read_text())
          assert j['schema']=='v13.c2_c3_body.auto_native_smoke.v1'
          assert j['seed']==47 and j['fixture_sha256']=='74818535a13819a65d4d32801d704fecd7716ea99c112b33c3bca248f3442c36'
          assert len(j['fixtures'])==3 and len(j['rows'])==3
          assert j['status']=='NATIVE_AUTO_ROUTE_3_OF_3'
          assert j['native_c2_invocations']==3 and j['native_final_outputs']==3
          assert 0<=j['native_c2_selected_route']<=3 and 0<=j['full_body_offer_paths']<=3
          assert all(x=={'ok':True,'hash_checked':True} for x in j['model_verification'].values())
          assert set(j['model_verification'])=={'needle','language','body','gist'}
          for i,row in enumerate(j['rows']):
              raw=json.loads((p/'raw'/f'{i:02d}_AUTO.json').read_text())
              assert row==raw and row['index']==i and row['fixture']==j['fixtures'][i]['project']
              assert row['flags']['native_invocation'] is True and row['flags']['native_output'] is True
              assert row['native_c2_process_reaped'] is True and row['source_exact'] is True
              assert row['route_info']['source'] in ('BOOT_SCAFFOLD','NATIVE_C2_ADVISORY')
              assert row['flags']['native_selected']==(row['route_info']['source']=='NATIVE_C2_ADVISORY')
              assert row['route_info']['native_control_metrics']['role']=='C2_CONTROL'
              assert row['route_info']['native_control_metrics']['operation']=='C'
              assert row['route_info']['native_control_metrics']['status']=='FINAL'
              assert row['route_info']['native_control_metrics']['memory']['measurement_status']=='MEASURED'
              assert row['context_packet']['event_id']==row['event_id']
              assert row['context_packet']['session_id']==row['session_id']
              assert row['context_packet']['external_action_authority'] is False
              assert row['learning_mode']=='RECORD_ONLY' and row['jepa_weight']==0
              assert row['redmi_measured'] is False and row['step2_gate_promoted'] is False
          assert j['learning_mode']=='RECORD_ONLY' and j['jepa_weight']==0
          assert j['step2_gate_promoted'] is False and j['comparative_utility_proven'] is False
          assert j['b3_promoted'] is False and j['body_jepa_available'] is False
          assert j['redmi_measured'] is False and j['whole_system_complete'] is False
          print('NATIVE_AUTO_ROUTE_3_OF_3_SMOKE_ONLY_NO_COMPARATIVE_UTILITY_OR_GATE',j['native_c2_selected_route'],j['full_body_offer_paths'])
          PY
            echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          else
            echo NO_NATIVE_REPORT > "$e/REPORT_CHECK_RAW.log"
            echo SKIPPED_NO_REPORT > "$e/REPORT_CHECK_EXIT.txt"
          fi
          "$py" -m py_compile v13/code/scripts/c2_c3_body_auto_native_smoke_20261030.py v13/code/tests/test_c2_c3_body_auto_native_smoke_20261030.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 0984b7a2908e2bfa81622c6d8f6a7666a0c62453 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 0984b7a2908e2bfa81622c6d8f6a7666a0c62453 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-auto-native-smoke-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-auto-native-smoke/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce native smoke evidence without utility or age promotion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-auto-native-smoke"
          for stage in PINS VENV DEPS TEST BOOTSTRAP NATIVE REPORT_CHECK COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained; no integrated native smoke proof"
              tail -90 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'NATIVE_AUTO_ROUTE_SMOKE_ONLY_NO_STEP2_B3_JEPA_REDMI_OR_AGE_PROMOTION'
