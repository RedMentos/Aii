name: V13 Run12I Sleep replay atomic provenance source-only
on:
  push:
    branches: [assistant/v13-run12i-sleep-replay-atomicity-20261030]
    paths:
      - '.github/workflows/v13-run12i-sleep-replay-atomicity.yml'
permissions:
  contents: read
jobs:
  replay-atomicity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Source-pinned real SQLite rollback and cross-organ sleep tests
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run12i-sleep"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          90d5361d1f8ad34c2311e870572a1d40146e4ca0 v13/code/v13/sleep.py
          2583ff75b8fa1350129ae144b0ba71139c8d1d55 v13/code/tests/test_sleep_replay_enqueue_atomic_run12i.py
          0779d986fb8aee8aa01c5df5f656889d4bd56348 v13/code/v13/store.py
          a9c9b828448737862fed41597e7471345453caf9 v13/code/v13/contracts.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run12i-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run12i-venv/bin/python"
          "$py" -m pip install --no-input --disable-pip-version-check --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests timeout --signal=TERM --kill-after=5s 420s "$py" -m unittest -v tests.test_sleep_replay_enqueue_atomic_run12i tests.test_sleep_scheduler tests.test_sleep_validation tests.test_sleep_offline tests.test_sleep_mix_finite_20261029 tests.test_sleep_finite_delay_20261029 tests.test_context_self_sleep_age0_20261029) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          "$py" -m py_compile v13/code/v13/sleep.py v13/code/tests/test_sleep_replay_enqueue_atomic_run12i.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          git show c91988be08b418be694257cc12509b177c6bbd29:v13/code/v13/sleep.py > "$e/ORIGINAL_SLEEP.py" 2> "$e/ORIGINAL_FETCH_RAW.log"
          (cd v13/code && ORIGINAL="$e/ORIGINAL_SLEEP.py" PYTHONPATH=. "$py" - <<'PY'
          import importlib.util, os, sqlite3, tempfile
          from pathlib import Path
          from v13.store import Store
          from v13.sleep import ReplayQueue as New
          spec = importlib.util.spec_from_file_location('v13.sleep_original_run12i', os.environ['ORIGINAL'])
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          def count_after_injected_packet_failure(cls):
              with tempfile.TemporaryDirectory() as d:
                  home = Path(d); (home/'data/db').mkdir(parents=True)
                  store = Store(home)
                  try:
                      event = store.event(store.new_session(), 'Replay source')
                      with store.tx() as c:
                          c.execute("""CREATE TRIGGER run12i_fail BEFORE INSERT ON packets
                                       WHEN NEW.kind='ReplayItem'
                                       BEGIN SELECT RAISE(ABORT,'injected'); END""")
                      try:
                          cls(store).enqueue(event['event_id'],'EPISODIC',.8,'HUMAN_CORRECTION',[event['source_ref']])
                      except sqlite3.IntegrityError:
                          pass
                      else:
                          raise AssertionError('expected injected failure')
                      return store.one('SELECT count(*) AS n FROM replay')['n']
                  finally:
                      store.close()
          old = count_after_injected_packet_failure(mod.ReplayQueue)
          new = count_after_injected_packet_failure(New)
          print('ORIGINAL_ORPHAN_REPLAY_ROWS',old)
          print('PATCHED_ORPHAN_REPLAY_ROWS',new)
          assert old == 1 and new == 0
          PY
          ) > "$e/REVIEW_RAW.log" 2>&1
          echo "$?" > "$e/REVIEW_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base c91988be08b418be694257cc12509b177c6bbd29 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check c91988be08b418be694257cc12509b177c6bbd29 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw on RED or GREEN
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run12i-sleep-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run12i-sleep/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce source-only no-promotion review
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run12i-sleep"
          for stage in PINS VENV DEPS TEST COMPILE REVIEW PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "${stage} RED; original raw preserved"
              tail -100 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo "RUN12I_SLEEP_REPLAY_ATOMIC_SOFTWARE_ONLY_NO_GATE_PROMOTION"
