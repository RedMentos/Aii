name: V13 JEPA replay no-op integrity
on:
  push:
    branches: ['codex/v13-jepa-replay-noop-integrity-*']
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pytest
      - name: Compile and replay/generation regressions
        working-directory: v13/code
        run: |
          python -m py_compile v13/world_jepa_replay.py v13/world_jepa_generation.py
          python -m pytest -q tests/test_world_jepa_replay_noop_integrity.py tests/test_world_jepa_replay_20261108.py tests/test_world_jepa_generation_20261108.py tests/test_world_jepa_generation_member_integrity.py tests/test_world_jepa_incremental_20261108.py
