name: V14 Research Perception RAW EAR voice overlay

on:
  push:
    branches:
      - research-perception/v14-voice-cues-finality-overlay-20261121
    paths:
      - "v13/code/v13/audio_voice_cues.py"
      - "v13/code/scripts/integrated_audio_context_candidate_20261121.py"
      - "v13/code/tests/test_audio_ear_voice_cues_v14.py"
      - "v13/code/tests/test_v14_audio_voice_overlay_contract_20261121.py"
      - ".github/workflows/v14-research-audio-voice-overlay.yml"

jobs:
  voice-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 psutil PyYAML pytest==9.2.0
      - name: Compile RAW EAR and staged overlay
        run: |
          python -m py_compile \
            v13/code/v13/audio_voice_cues.py \
            v13/code/scripts/integrated_audio_context_candidate_20261121.py \
            v13/code/tests/test_audio_ear_voice_cues_v14.py \
            v13/code/tests/test_v14_audio_voice_overlay_contract_20261121.py
      - name: Test voice cues, finality and exact overlay composition
        env:
          PYTHONPATH: v13/code
        run: |
          cd v13/code
          python -m pytest -q \
            tests/test_audio_ear_voice_cues_v14.py \
            tests/test_v14_audio_voice_overlay_contract_20261121.py
