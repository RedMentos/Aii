name: V13 Run479 exact S_s22 native Stage9 from verified 336 rows
on:
  pull_request:
    types: [opened]
    paths:
      - '.github/workflows/run479-native-s22.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: v13-native-c3-run131-serialized
  cancel-in-progress: false
jobs:
  pinned-s22:
    # PR-opened only; no duplicate native work from subsequent documentation commits.
    if: ${{ github.event.pull_request.head.ref == 'codex/run479-native-s22-20261026' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      V13_NO_AUTOSTART: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      NEEDLE_TELEMETRY: '0'
      PIP_NO_CACHE_DIR: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Pin frozen code and actual 336-row native source
        id: preflight
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/RUN479_HEAD.txt"
          git merge-base --is-ancestor b3aab6974a9d93ab0ff50b75f3fbc7a15f1ea31c HEAD
          test "$(git hash-object v13/code/scripts/run394_step2_fresh.py)" = 'fae7aed612108a554d8566b2917ebf31022df423'
          test "$(git hash-object v13/code/scripts/run397_step2_resume.py)" = 'f1946054135cb6fdf48c06477308f518e2e62ad9'
          test "$(git hash-object v13/code/specs/models.json)" = '7af05962af41d0bc3f7dd18ef01d4eba55eabf99'
          test "$(git hash-object v13/code/scripts/run467_stage9_s22.py)" = '0fdd14fd73d5122c9f39c6cc08c8d1b2adbbb8b2'
          test "$(git hash-object v13/code/scripts/run468_verify_native378.py)" = 'eedc307a6e6f3c36fea43894dcfa41e983fa4c74'
          test "$(git hash-object v13/code/scripts/run466_import_stage8_artifact.py)" = '2444c92ec60447adff906db93bfd5effd4dc1edc'
          test "$(git hash-object v13/code/scripts/run465_verify_native336.py)" = 'c4aa16eda5e4e67b31d8aefc78c13a281305b000'
          gh api repos/RedMentos/Aii/actions/runs/40277803560 --jq '{conclusion,head_sha}' > "$RUNNER_TEMP/RUN479_NATIVE336_SOURCE.json"
          gh api repos/RedMentos/Aii/actions/artifacts/12632191220 --jq '{id,digest,expired}' > "$RUNNER_TEMP/RUN479_SAFE336_META.json"
          gh api repos/RedMentos/Aii/actions/artifacts/12631932326 --jq '{id,digest,expired}' > "$RUNNER_TEMP/RUN479_RAW336_META.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          read=lambda name:json.loads((root/name).read_text())
          assert read('RUN479_NATIVE336_SOURCE.json')=={'conclusion':'success','head_sha':'8763ef9a8ab9e1a1e7da8463135e5b4983003145'}
          for name,aid,digest in (
              ('RUN479_SAFE336_META.json',12632191220,'a928aaba590557a656d8ee3274262e144a890e675bba511338758b3a559d086f'),
              ('RUN479_RAW336_META.json',12631932326,'0f832b779d841a5c42255bb3c277cf2b3c1c845b9678f785922d8bb050d0d0d9')):
              assert read(name)=={'id':aid,'digest':'sha256:'+digest,'expired':False}
          print('ACTUAL_NATIVE336_GREEN_ARTIFACTS_PINNED')
          PY
          { date -u -Iseconds; uname -a; python3 --version; free -h; df -h "$RUNNER_TEMP"; cat /sys/fs/cgroup/memory.max 2>/dev/null || true; } > "$RUNNER_TEMP/RUN479_HOST.txt"
          sha256sum v13/code/scripts/run467_stage9_s22.py v13/code/scripts/run468_verify_native378.py > "$RUNNER_TEMP/RUN479_SOURCE_SHA256.txt"
      - name: Isolated dependencies and source-only regressions
        id: deps
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          python3 -m venv "$RUNNER_TEMP/run479venv"
          timeout 240s "$RUNNER_TEMP/run479venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52' > "$RUNNER_TEMP/RUN479_DEPS_RAW.log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            PYTHONPATH="$PWD:$PWD/scripts:$PWD/tests" "$RUNNER_TEMP/run479venv/bin/python" -m unittest -v tests.test_run467_stage9_s22 tests.test_run468_verify_native378_adversarial tests.test_run466_native336_atomic_import tests.test_run465_verify_native336_adversarial tests.test_run397_step2_resume > "$RUNNER_TEMP/RUN479_SOURCE_TESTS_RAW.log" 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            PYTHONPATH="$PWD:$PWD/scripts" "$RUNNER_TEMP/run479venv/bin/python" scripts/run467_stage9_s22.py --help | grep -Fq -- '--stage8-report'
            rc=$?
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN479_DEPS_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Download SHA-pinned safe336 and original native report
        id: download
        if: steps.deps.outputs.rc == '0'
        run: |
          set -uo pipefail
          set +e
          curl -fsSL --retry 2 --max-time 300 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/RedMentos/Aii/actions/artifacts/12632191220/zip' -o "$RUNNER_TEMP/run479-safe336.zip"
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "a928aaba590557a656d8ee3274262e144a890e675bba511338758b3a559d086f  $RUNNER_TEMP/run479-safe336.zip" | sha256sum --check - > "$RUNNER_TEMP/RUN479_SAFE336_SHA.log" 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            curl -fsSL --retry 2 --max-time 300 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/RedMentos/Aii/actions/artifacts/12631932326/zip' -o "$RUNNER_TEMP/run479-raw336.zip"
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            echo "0f832b779d841a5c42255bb3c277cf2b3c1c845b9678f785922d8bb050d0d0d9  $RUNNER_TEMP/run479-raw336.zip" | sha256sum --check - > "$RUNNER_TEMP/RUN479_RAW336_SHA.log" 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            python3 - <<'PY' > "$RUNNER_TEMP/RUN479_REPORT_EXTRACT.log" 2>&1
          import hashlib,json,os,zipfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(root/'run479-raw336.zip') as z:
              assert len(z.namelist())==len(set(z.namelist()))
              raw=z.read('RUN473_STAGE8_REPORT.json')
          assert 0 < len(raw) < 2_000_000  # pinned raw ZIP authenticates report
          d=json.loads(raw)
          assert d['run']=='Run462' and d['status']=='STAGE8_NATIVE_PARTIAL_NO_PROMOTION' and d['errors']==[]
          assert d['rows_verified']==336 and d['native_execution_performed'] is True
          assert d['canonical_gate_pass'] is False and d['step2_exit']=='UTILITY_FAIL'
          (root/'RUN479_STAGE8_REPORT.json').write_bytes(raw)
          print('ORIGINAL_NATIVE336_STAGE8_REPORT_FROM_PINNED_ARCHIVE')
          PY
            rc=$?
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN479_DOWNLOAD_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Actual 336-row source-only preflight before model provisioning
        id: preview
        if: steps.download.outputs.rc == '0'
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          PYTHONPATH="$PWD:$PWD/scripts" "$RUNNER_TEMP/run479venv/bin/python" scripts/run467_stage9_s22.py --archive "$RUNNER_TEMP/run479-safe336.zip" --expected-sha256 a928aaba590557a656d8ee3274262e144a890e675bba511338758b3a559d086f --stage8-report "$RUNNER_TEMP/RUN479_STAGE8_REPORT.json" --work "$RUNNER_TEMP/run479-preview-work" --output "$RUNNER_TEMP/RUN479_PREVIEW_REPORT.json" > "$RUNNER_TEMP/RUN479_PREVIEW_RAW.log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python3 - <<'PY' >> "$RUNNER_TEMP/RUN479_PREVIEW_RAW.log" 2>&1
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'RUN479_PREVIEW_REPORT.json').read_text())
          assert d['status']=='STAGE9_READY_NO_NATIVE' and d['errors']==[]
          assert d['rows_verified']==336 and d['remaining_arms']==1
          assert d['native_execution_performed'] is False and d['canonical_gate_pass'] is False
          assert d['completed']==['O_s20','P_s20','S_s20','O_s21','P_s21','S_s21','O_s22','P_s22']
          print('ACTUAL_NATIVE336_STAGE9_PREEXEC_VERIFIED')
          PY
            rc=$?
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN479_PREVIEW_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Install exact pinned public models and b10964 executable
        id: bootstrap
        if: steps.preview.outputs.rc == '0'
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          export PYTHONPATH="$PWD:$PWD/scripts" V13_HOME="$RUNNER_TEMP/run479installed"
          timeout 1800s "$RUNNER_TEMP/run479venv/bin/python" -m v13.bootstrap --home "$V13_HOME" > "$RUNNER_TEMP/RUN479_BOOTSTRAP_RAW.log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            "$RUNNER_TEMP/run479venv/bin/python" - <<'PY' > "$RUNNER_TEMP/RUN479_INSTALLED_RAW.log" 2>&1
          import json,os
          from pathlib import Path
          from v13.models import ModelManager,catalog
          from v13.common import file_hash
          from run402_stage_restore import RUN401_EXECUTABLE_SHA256
          home=Path(os.environ['V13_HOME'])
          manager=ModelManager(home)
          checks=manager.verify(deep=True)
          for key in ('needle','language','body','gist'):
              assert checks[key]['ok'] and checks[key]['hash_checked']
              assert manager.installed[key]['exact_revision']==catalog()['models'][key]['revision']
              print('MODEL_VERIFIED',key)
          runner=home/'bin/llama-server'
          meta=json.loads((home/'config/runner.json').read_text())
          assert meta['tag']=='b10964' and meta['binary_sha256']==file_hash(runner)
          assert file_hash(runner)==RUN401_EXECUTABLE_SHA256
          print('RUNNER_VERIFIED',meta['binary_sha256'])
          PY
            rc=$?
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN479_BOOTSTRAP_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Execute exactly one pinned native S_s22 and safe no-model export
        id: native
        if: steps.bootstrap.outputs.rc == '0'
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          export PYTHONPATH="$PWD:$PWD/scripts"
          timeout -s TERM -k 30s 4800s "$RUNNER_TEMP/run479venv/bin/python" scripts/run467_stage9_s22.py --archive "$RUNNER_TEMP/run479-safe336.zip" --expected-sha256 a928aaba590557a656d8ee3274262e144a890e675bba511338758b3a559d086f --stage8-report "$RUNNER_TEMP/RUN479_STAGE8_REPORT.json" --work "$RUNNER_TEMP/run479work" --installed-home "$RUNNER_TEMP/run479installed" --export-destination "$RUNNER_TEMP/run479-safe-export" --execute --output "$RUNNER_TEMP/RUN479_STAGE9_REPORT.json" > "$RUNNER_TEMP/RUN479_NATIVE_RAW.log" 2>&1
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/RUN479_NATIVE_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preserve failed native attempts with no-model export if interrupted
        if: always()
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          rc=0
          if [ -d "$RUNNER_TEMP/run479work" ] && [ -d "$RUNNER_TEMP/run479installed" ] && [ ! -e "$RUNNER_TEMP/run479-safe-export" ]; then
            PYTHONPATH="$PWD:$PWD/scripts" "$RUNNER_TEMP/run479venv/bin/python" scripts/run409_safe_export.py --work "$RUNNER_TEMP/run479work" --installed-home "$RUNNER_TEMP/run479installed" --destination "$RUNNER_TEMP/run479-safe-export" --output "$RUNNER_TEMP/RUN479_FALLBACK_EXPORT.json" > "$RUNNER_TEMP/RUN479_FALLBACK_RAW.log" 2>&1
            rc=$?
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN479_FALLBACK_EXIT.txt"
          exit 0
      - name: Independent nine-receipt native378 verification (no inference)
        id: audit
        if: steps.native.outputs.rc == '0'
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          PYTHONPATH="$PWD:$PWD/scripts" "$RUNNER_TEMP/run479venv/bin/python" scripts/run468_verify_native378.py --export "$RUNNER_TEMP/run479-safe-export" --stage6-report "$RUNNER_TEMP/RUN479_STAGE9_REPORT.json" --output "$RUNNER_TEMP/RUN479_INDEPENDENT_REPORT.json" > "$RUNNER_TEMP/RUN479_INDEPENDENT_RAW.log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python3 - <<'PY' >> "$RUNNER_TEMP/RUN479_INDEPENDENT_RAW.log" 2>&1
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'RUN479_INDEPENDENT_REPORT.json').read_text())
          assert d['status']=='RUN468_NATIVE_378_INDEPENDENTLY_VERIFIED'
          assert d['rows_verified']==378 and len(d['verified_arms'])==9
          assert d['verified_arms'][-1]=='S_s22'
          assert d['canonical_gate_pass'] is False and d['step2_exit']=='UTILITY_FAIL'
          assert d['jepa_weight']==0 and d['redmi_measured'] is False
          print('INDEPENDENT_NATIVE378_NO_PROMOTION_VERIFIED')
          PY
            rc=$?
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN479_AUDIT_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Independently inspect no-model export inventory even on RED
        id: safe
        if: always()
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          PYTHONPATH="$PWD:$PWD/scripts" python3 - <<'PY' > "$RUNNER_TEMP/RUN479_SAFE_AUDIT_RAW.log" 2>&1
          import hashlib,json,os,stat
          from pathlib import Path
          from run413_export_receipt_gate import safe_rel,registered_model_hashes,MANIFEST,MAX_FILE,MAX_TOTAL
          root=Path(os.environ['RUNNER_TEMP'])/'run479-safe-export'
          assert root.is_dir() and not root.is_symlink()
          mp=root/MANIFEST
          assert mp.is_file() and not mp.is_symlink()
          d=json.loads(mp.read_text())
          assert d['schema']=='RUN409_SAFE_NATIVE_EXPORT_V1'
          assert d['canonical_gate_pass'] is False and d['step2_exit']=='UTILITY_FAIL'
          copied=d['copied'];assert isinstance(copied,dict) and copied
          observed=set();dirs=set();total=0;models=registered_model_hashes()
          for current,folders,files in os.walk(root,topdown=True,followlinks=False):
              here=Path(current);dirs.add(here.relative_to(root).as_posix())
              for name in folders:
                  p=here/name;assert p.is_dir() and not p.is_symlink()
              for name in files:
                  p=here/name;assert not p.is_symlink()
                  info=p.stat();assert stat.S_ISREG(info.st_mode) and info.st_nlink==1
                  rel=p.relative_to(root).as_posix()
                  if rel==MANIFEST:continue
                  safe_rel(rel);assert rel in copied and info.st_size==copied[rel]['bytes'] and info.st_size<=MAX_FILE
                  h=hashlib.sha256(p.read_bytes()).hexdigest()
                  assert h==copied[rel]['sha256'] and h not in models
                  total+=info.st_size;assert total<=MAX_TOTAL;observed.add(rel)
          assert observed==set(copied) and dirs==set(d['directories'])
          progress=json.loads((root/'RUN397_PROGRESS.json').read_text())
          assert progress['canonical_gate_pass'] is False and progress['step2_exit']=='UTILITY_FAIL'
          assert set(progress['completed']).issubset({'O_s20','P_s20','S_s20','O_s21','P_s21','S_s21','O_s22','P_s22','S_s22'})
          result={'status':'SAFE_WORK_ARCHIVE_VERIFIED_NO_MODEL_WEIGHTS','files':len(observed),'bytes':total,
                  'completed':sorted(progress['completed']),'failed_attempt_groups':len(progress.get('failures_preserved',{})),
                  'manifest_sha256':hashlib.sha256(mp.read_bytes()).hexdigest(),
                  'canonical_gate_pass':False,'step2_exit':'UTILITY_FAIL'}
          (Path(os.environ['RUNNER_TEMP'])/'RUN479_SAFE_AUDIT.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,sort_keys=True))
          PY
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/RUN479_SAFE_AUDIT_EXIT.txt"
          echo "ready=$([ "$rc" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Official public repository privacy scan
        id: privacy
        run: |
          set -uo pipefail
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree > "$RUNNER_TEMP/RUN479_PRIVACY_RAW.log" 2>&1
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/RUN479_PRIVACY_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Close raw logs with SHA256
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          find . -maxdepth 1 -type f -name 'RUN479_*' ! -name RUN479_SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > RUN479_SHA256SUMS.txt
      - name: Upload only small raw native source/evidence logs even on RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run479-native-s22-raw-${{ github.sha }}
          path: ${{ runner.temp }}/RUN479_*
          if-no-files-found: warn
          retention-days: 30
      - name: Upload verified safe no-model work, never installed model files
        if: always() && steps.safe.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run479-native378-safe-no-model-${{ github.sha }}
          path: ${{ runner.temp }}/run479-safe-export/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce actual native and independent result, preserve RED on failure
        if: always()
        run: |
          test -f "$RUNNER_TEMP/RUN479_NATIVE_EXIT.txt"
          test "$(cat "$RUNNER_TEMP/RUN479_NATIVE_EXIT.txt")" = '0'
          test -f "$RUNNER_TEMP/RUN479_AUDIT_EXIT.txt"
          test "$(cat "$RUNNER_TEMP/RUN479_AUDIT_EXIT.txt")" = '0'
          test -f "$RUNNER_TEMP/RUN479_PRIVACY_EXIT.txt"
          test "$(cat "$RUNNER_TEMP/RUN479_PRIVACY_EXIT.txt")" = '0'
          test -f "$RUNNER_TEMP/RUN479_SAFE_AUDIT_EXIT.txt"
          test "$(cat "$RUNNER_TEMP/RUN479_SAFE_AUDIT_EXIT.txt")" = '0'
