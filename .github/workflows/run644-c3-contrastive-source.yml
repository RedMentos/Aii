name: V13 Run644 disjoint contrastive C3 source contract
on:
  push:
    branches:
      - codex/gpt6-run644-c3-contrastive-20261027
    paths:
      - '.github/workflows/run644-c3-contrastive-source.yml'
      - 'v13/code/scripts/run644_c3_contrastive.py'
      - 'v13/code/scripts/run644_c3_native_compare.py'
      - 'v13/code/tests/test_run644_c3_contrastive.py'
      - 'v13/code/tests/test_run644_c3_native_compare.py'
      - 'v13/code/docs/proofs/continuation-20261027/run644-c3-contrastive/**'
permissions:
  contents: read
concurrency:
  group: v13-run644-c3-source
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.sha }}
      - name: Exact new and original cohort/source/Canon identities
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/RUN644_HEAD.txt"
          test "$(git hash-object v13/code/docs/proofs/continuation-20261027/run644-c3-contrastive/COHORT.json)" = c1b5a4c6b2ab22c0ad07996f114d05e69912a7cc
          test "$(git hash-object v13/code/docs/proofs/continuation-20261027/run642-c3-protocol-locality/COHORT.json)" = 249d4be0e0663cccf5d1165347fa37c0db924791
          test "$(git hash-object v13/code/docs/proofs/continuation-20261027/run639-c3-kl-anchor/COHORT.json)" = ccec34634714b760b6cba6ce626536928f229ed3
          test "$(git hash-object v13/code/scripts/run644_c3_contrastive.py)" = 37704ced4dfd24f09b1ab9f798db2326d1f06df6
          test "$(git hash-object v13/code/scripts/run644_c3_native_compare.py)" = 052433103ea79a857941c0afd3fb03f980097564
          test "$(git hash-object v13/code/tests/test_run644_c3_contrastive.py)" = c88fed6ced4d236e5c6dba35e31036462c305743
          test "$(git hash-object v13/code/tests/test_run644_c3_native_compare.py)" = 52577868bd75844ad9fcd330db8263994821bdef
          test "$(git hash-object v13/code/v13/lora_trainer.py)" = 49a752879ae5d19391963742a0f042e740edb2cc
          test "$(sha256sum v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md | cut -d' ' -f1)" = 3423906b01b24443fcef733fb5c7ef47296963df63e603d8f843c99d544877ee
          { date -u -Iseconds; python3 --version; uname -a; } > "$RUNNER_TEMP/RUN644_HOST.txt"
          sha256sum v13/code/scripts/run644_c3_contrastive.py v13/code/scripts/run644_c3_native_compare.py v13/code/docs/proofs/continuation-20261027/run644-c3-contrastive/COHORT.json > "$RUNNER_TEMP/RUN644_SOURCE_SHA256.txt"
      - name: Exact source and historical C3 negative controls
        run: |
          set +e
          python3 -m py_compile v13/code/scripts/run644_c3_contrastive.py v13/code/scripts/run644_c3_native_compare.py v13/code/tests/test_run644_c3_contrastive.py v13/code/tests/test_run644_c3_native_compare.py > "$RUNNER_TEMP/RUN644_COMPILE_RAW.log" 2>&1
          compile=$?
          if [ "$compile" = 0 ]; then
            (cd v13/code && PYTHONPATH="$PWD:$PWD/scripts" python3 -m unittest -v tests.test_run644_c3_contrastive tests.test_run644_c3_native_compare tests.test_run642_c3_protocol_locality tests.test_run642_c3_native_compare tests.test_run639_c3_kl_anchor tests.test_run639_c3_native_anchor_compare tests.test_run632_c3_lfm350_native) > "$RUNNER_TEMP/RUN644_TEST_RAW.log" 2>&1
            rc=$?
          else
            echo 'COMPILE_FAILED' > "$RUNNER_TEMP/RUN644_TEST_RAW.log"; rc=2
          fi
          echo "$compile" > "$RUNNER_TEMP/RUN644_COMPILE_EXIT.txt"
          echo "$rc" > "$RUNNER_TEMP/RUN644_TEST_EXIT.txt"
          exit 0
      - name: Public repo privacy
        run: |
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base df96269a179b9942ee517f02cbb7069ed80c5ba5 --head HEAD > "$RUNNER_TEMP/RUN644_PRIVACY_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/RUN644_PRIVACY_EXIT.txt"
          exit 0
      - name: Close all raw outcomes and SHA256
        if: always()
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP"
          for k in COMPILE TEST PRIVACY; do
            test -f "RUN644_${k}_EXIT.txt" || echo 2 > "RUN644_${k}_EXIT.txt"
          done
          find . -maxdepth 1 -type f -name 'RUN644_*' ! -name RUN644_SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > RUN644_SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: V13-Run644-C3-Source-${{ github.sha }}
          path: ${{ runner.temp }}/RUN644_*
          if-no-files-found: error
          retention-days: 30
      - name: Enforce source and privacy
        if: always()
        run: |
          set -euo pipefail
          for k in COMPILE TEST PRIVACY; do
            echo "RUN644 $k exit $(cat "$RUNNER_TEMP/RUN644_${k}_EXIT.txt")"
            test "$(cat "$RUNNER_TEMP/RUN644_${k}_EXIT.txt")" = 0
          done
          (cd "$RUNNER_TEMP" && sha256sum -c RUN644_SHA256SUMS.txt)
