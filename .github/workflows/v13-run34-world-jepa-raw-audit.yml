name: V13 Run34 independent original Run32 World-JEPA raw audit
on:
  push:
    branches: [assistant/v13-run34-world-jepa-disjoint-raw-audit-20261031-hourly11]
    paths:
      - '.github/workflows/v13-run34-world-jepa-raw-audit.yml'
permissions:
  contents: read
  actions: read
jobs:
  read-only-run32-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Independently check original Run32 ZIP and preregistered W7 failures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run34-audit"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          c679c0d8243ceb7d465cbcf33670ad99cda5d410 v13/code/docs/WORLD_JEPA_RUN32_RAW_AUDIT_PREREG_RUN34_20261031.md
          6aa0e84f51302c1939547f283dae6af05894cce8 v13/code/scripts/run34_world_jepa_disjoint_raw_audit.py
          5084006bcf14c29714f733dc3cfc951848ec40a0 v13/code/tests/test_run34_world_jepa_disjoint_raw_audit.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          if [ "$bad" = 0 ]; then
            curl -fLSs --retry 2 --connect-timeout 20 --max-time 120 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/RedMentos/Aii/actions/artifacts/13021771958/zip" -o "$e/run32-original.zip" > "$e/FETCH_RAW.log" 2>&1
            echo "$?" > "$e/FETCH_EXIT.txt"
          else echo SKIPPED_PIN_RED > "$e/FETCH_RAW.log"; echo 99 > "$e/FETCH_EXIT.txt"; fi
          if [ "$(cat "$e/FETCH_EXIT.txt")" = 0 ]; then
            (cd v13/code && RUN34_ORIGINAL_ZIP="$e/run32-original.zip" PYTHONPATH=.:scripts python3 -m unittest -v tests.test_run34_world_jepa_disjoint_raw_audit) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
            (cd v13/code && PYTHONPATH=.:scripts python3 scripts/run34_world_jepa_disjoint_raw_audit.py --original-zip "$e/run32-original.zip" --out "$e/RESULT.json") > "$e/ANALYSIS_RAW.log" 2>&1
            echo "$?" > "$e/ANALYSIS_EXIT.txt"
          else echo SKIPPED_FETCH_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; echo SKIPPED_FETCH_RED > "$e/ANALYSIS_RAW.log"; echo 99 > "$e/ANALYSIS_EXIT.txt"; fi
          if [ -f "$e/RESULT.json" ]; then
            python3 - "$e/RESULT.json" > "$e/REPORT_CHECK_RAW.log" 2>&1 <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['schema']=='v13.run34.run32_original_zip_independent_readonly.v1'
          assert r['manifest_members_verified']==130 and r['stage_exit_zero']==9
          assert r['status']=='SHADOW_CANDIDATE_FAIL'
          assert list(r['w7_gates'].values())==[True,False,False]
          assert r['slot_original_gates']['W6_no_action_attribution_worse'] is False
          assert r['age0']=='RECORD_ONLY' and r['step2']=='UTILITY_FAIL'
          assert r['b3']=='NO_PROMOTION' and r['jepa_weight']==0
          assert not r['redmi_measured'] and not r['whole_system_complete']
          print('RUN34_INDEPENDENT_ORIGINAL_RUN32_RAW_FAIL_REPRODUCED_NO_PROMOTION')
          PY
            echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          else echo NO_RESULT_RED > "$e/REPORT_CHECK_RAW.log"; echo 99 > "$e/REPORT_CHECK_EXIT.txt"; fi
          python3 -m py_compile v13/code/scripts/run34_world_jepa_disjoint_raw_audit.py v13/code/tests/test_run34_world_jepa_disjoint_raw_audit.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 5370b56d5ca6e5f057d0c884aee68ec308769548 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 5370b56d5ca6e5f057d0c884aee68ec308769548 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          mkdir -p "$e/receipts"
          for f in HEAD.txt PINS.txt PINS_RAW.log PINS_EXIT.txt FETCH_RAW.log FETCH_EXIT.txt TEST_RAW.log TEST_EXIT.txt ANALYSIS_RAW.log ANALYSIS_EXIT.txt REPORT_CHECK_RAW.log REPORT_CHECK_EXIT.txt COMPILE_RAW.log COMPILE_EXIT.txt PRIVACY_RAW.log PRIVACY_EXIT.txt DIFF_RAW.log DIFF_EXIT.txt RESULT.json; do
            [ ! -f "$e/$f" ] || cp "$e/$f" "$e/receipts/$f"
          done
          (cd "$e/receipts" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve only aggregate independent audit receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run34-original-audit-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run34-audit/receipts/
          if-no-files-found: error
          retention-days: 90
      - name: Require exact original evidence and all read-only checks
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-run34-audit"
          for stage in PINS FETCH TEST ANALYSIS REPORT_CHECK COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${stage}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN34_READONLY_ORIGINAL_RAW_AUDIT_ONLY_NO_GATE_PROMOTION
