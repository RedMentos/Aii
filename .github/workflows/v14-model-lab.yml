name: V14 model-lab tests

on:
  push:
    branches:
      - "research-perception/**"
    paths:
      - "v14/experiments/**"
      - ".github/workflows/v14-model-lab.yml"
  pull_request:
    branches:
      - "gpt6/v13-private-remote-bridge-20261111"
    paths:
      - "v14/experiments/**"
      - ".github/workflows/v14-model-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v14-model-lab
  cancel-in-progress: true

jobs:
  model-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile experiment and tests
        run: python -m py_compile v14/experiments/model_compare.py v14/experiments/test_model_compare.py
      - name: Validate candidate manifest
        run: python -m json.tool v14/experiments/model_candidates.json > /dev/null
      - name: Run isolated safety and grading tests
        run: python -m unittest discover -s v14/experiments -p "test_*.py" -v
