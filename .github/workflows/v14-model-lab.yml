name: V14 model-lab tests

on:
  push:
    branches:
      - "research-perception/**"
    paths:
      - "v14/experiments/**"
      - ".github/workflows/v14-model-lab.yml"
  pull_request:
    branches:
      - "gpt6/v13-private-remote-bridge-20261111"
    paths:
      - "v14/experiments/**"
      - ".github/workflows/v14-model-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v14-model-lab-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  model-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile experiment and tests
        run: python -m py_compile v14/experiments/model_compare.py v14/experiments/test_model_compare.py
      - name: Validate candidate manifest
        run: python -m json.tool v14/experiments/model_candidates.json > /dev/null
      - name: Run isolated safety and grading tests
        run: python -m unittest discover -s v14/experiments -p "test_*.py" -v
      - name: Scan added public content for secrets and private identifiers
        run: python v13/code/scripts/public_repo_privacy_scan.py --base origin/gpt6/v13-private-remote-bridge-20261111 --head HEAD --no-worktree

  latent-cache-tiny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned CPU-only experiment dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: numpy==2.3.5
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: torch==2.10.0+cpu --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Verify pinned experiment environment
        run: python -c "import numpy, torch; assert numpy.__version__ == '2.3.5', numpy.__version__; assert torch.__version__ == '2.10.0+cpu', torch.__version__; print('numpy', numpy.__version__, 'torch', torch.__version__)"
      - name: Compile directed cross-geometry KV-cache experiment
        run: python -m py_compile v14/experiments/latent_cache_tiny/latent_cache_tiny.py v14/experiments/latent_cache_tiny/test_latent_cache_tiny.py
      - name: Run directed cross-geometry KV-cache regressions
        working-directory: v14/experiments/latent_cache_tiny
        run: python -m unittest -v
