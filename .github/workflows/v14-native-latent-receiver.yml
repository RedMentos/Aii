name: V14 native latent receiver staged runtime
on:
  push:
    branches:
      - boss/v14-native-latent-probe-rebase-20261122
      - core/v14-native-receiver-release-rebase-20261122-run14
      - core/v14-llama-server-cache-diagnostics-20261122
      - core/v14-native-probe-operator-dispatch-20261122
      - core/v14-native-probe-resource-preflight-20261123
  pull_request:
    branches:
      - boss/v14-recall-store-pin-rebind-20261122
      - gpt6/v13-private-remote-bridge-20261111
      - core/v14-llama-server-cache-diagnostics-20261122
      - qa/v14-native-probe-model-hash-20261122
      - qa/v14-native-receiver-fd-pin-chain-20261123-run1
    paths:
      - "v13/code/v13/native_latent_receiver.py"
      - "v13/code/v13/native_probe_approval.py"
      - "v13/code/v13/brain_panel.py"
      - "v13/code/v13/native/latent_receiver/**"
      - "v13/code/scripts/integrated_native_latent_receiver_candidate_20261122.py"
      - "v13/code/scripts/termux_runtime_recovery_candidate_20261121.py"
      - "v13/code/scripts/stage_integrated_candidate.py"
      - "v13/code/v13/runtime_deploy.py"
      - "v13/code/tests/test_native_latent_receiver*.py"
      - "v13/code/tests/test_native_latent_receiver_approval.py"
      - "v13/code/tests/test_callosum.py"
      - ".github/workflows/v14-native-latent-receiver.yml"
permissions:
  contents: read
jobs:
  python-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused Runtime test dependencies
        run: python -m pip install pytest==9.2.0 numpy==2.3.5 psutil PyYAML
      - name: Compile staged receiver and deploy chain
        run: python -m py_compile v13/code/v13/native_latent_receiver.py v13/code/v13/native_probe_approval.py v13/code/v13/brain_panel.py v13/code/v13/cognition.py v13/code/v13/callosum.py v13/code/scripts/integrated_native_latent_receiver_candidate_20261122.py v13/code/scripts/termux_runtime_recovery_candidate_20261121.py v13/code/scripts/stage_integrated_candidate.py v13/code/v13/runtime_deploy.py v13/code/tests/test_native_latent_receiver.py v13/code/tests/test_native_latent_receiver_approval.py v13/code/tests/test_native_latent_receiver_runtime.py v13/code/tests/test_native_latent_receiver_stage.py
      - name: Test source tap identity and exact staged Runtime
        env:
          PYTHONPATH: v13/code
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          # Approval tests require the staged Operator overlay; the stage regression runs them there.
          python -m pytest -q v13/code/tests/test_native_taps.py v13/code/tests/test_native_latent_receiver_stage.py
      - name: Scan public diff for private data and secrets
        run: python v13/code/scripts/public_repo_privacy_scan.py --base origin/gpt6/v13-private-remote-bridge-20261111 --head HEAD --no-worktree
  linux-pinned-api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact llama.cpp API revision
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
          path: third_party/llama.cpp
          persist-credentials: false
      - name: Verify upstream license and build pinned Linux receiver
        run: |
          test -f third_party/llama.cpp/LICENSE
          grep -q "MIT License" third_party/llama.cpp/LICENSE
          cmake -S v13/code/v13/native/latent_receiver -B build-native -DLLAMA_CPP_DIR="$GITHUB_WORKSPACE/third_party/llama.cpp" -DV14_LLAMA_REVISION=b29c606e28a01b1bc8c1351026a0fa6e616bf6c4 -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF
          cmake --build build-native --target native_latent_receiver -j2
          build-native/bin/native_latent_receiver --selftest
          build-native/bin/native_latent_receiver --version
  android-arm64-cross-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact llama.cpp API revision
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
          path: third_party/llama.cpp
          persist-credentials: false
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Cross-compile Android arm64-v8a
        run: |
          cmake -S v13/code/v13/native/latent_receiver -B build-android -DLLAMA_CPP_DIR="$GITHUB_WORKSPACE/third_party/llama.cpp" -DV14_LLAMA_REVISION=b29c606e28a01b1bc8c1351026a0fa6e616bf6c4 -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-android --target native_latent_receiver -j2
          test -x build-android/bin/native_latent_receiver
          mkdir -p native-artifact
          cp build-android/bin/native_latent_receiver native-artifact/
          cp third_party/llama.cpp/LICENSE native-artifact/LLAMA_CPP_LICENSE
          (cd native-artifact && sha256sum native_latent_receiver > SHA256SUMS)
      - name: Upload review-only Android ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: v14-native-latent-receiver-android-arm64
          path: native-artifact/
          if-no-files-found: error
          retention-days: 14
