name: V13 World review-chain broad software suite
on:
  push:
    branches: [codex/automation11-world-ensemble-ablation-20261027]
    paths:
      - '.github/workflows/world-holdout-fullsuite-review.yml'
      - 'v13/code/scripts/world_jepa_ensemble_ablation.py'
      - 'v13/code/tests/test_world_jepa_ensemble_ablation.py'
permissions:
  contents: read
concurrency:
  group: v13-world-holdout-fullsuite
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.sha }}
      - name: Isolated software dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/worldsuite"
          timeout 240s "$RUNNER_TEMP/worldsuite/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Closed broad software suite
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/worldsuiteproof"
          git rev-parse HEAD > "$RUNNER_TEMP/worldsuiteproof/HEAD.txt"
          sha256sum v13/code/scripts/world_jepa_ensemble_ablation.py v13/code/scripts/world_jepa_holdout_utility.py v13/code/BUILD_STATE.json > "$RUNNER_TEMP/worldsuiteproof/SOURCE_SHA256.txt"
          (cd v13/code && PYTHONPATH="$PWD:$PWD/scripts" timeout 900s "$RUNNER_TEMP/worldsuite/bin/python" -m unittest discover -s tests -p 'test_*.py' -v) > "$RUNNER_TEMP/worldsuiteproof/UNIT_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/worldsuiteproof/UNIT_EXIT.txt"
          "$RUNNER_TEMP/worldsuite/bin/python" -m compileall -q v13/code/v13 v13/code/scripts v13/code/tests > "$RUNNER_TEMP/worldsuiteproof/COMPILE_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/worldsuiteproof/COMPILE_EXIT.txt"
          "$RUNNER_TEMP/worldsuite/bin/python" v13/code/scripts/public_repo_privacy_scan.py --base 85a88ffd48c59d618c5fdb04022813580418e9d0 --head HEAD > "$RUNNER_TEMP/worldsuiteproof/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/worldsuiteproof/PRIVACY_EXIT.txt"
          exit 0
      - name: Upload original raw suite
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-review-fullsuite-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/worldsuiteproof/
          if-no-files-found: error
      - name: Enforce
        run: |
          set -euo pipefail
          for n in UNIT COMPILE PRIVACY; do
            test "$(cat "$RUNNER_TEMP/worldsuiteproof/${n}_EXIT.txt")" = 0 || { cat "$RUNNER_TEMP/worldsuiteproof/${n}_RAW.log"; exit 1; }
          done
          tail -25 "$RUNNER_TEMP/worldsuiteproof/UNIT_RAW.log"
