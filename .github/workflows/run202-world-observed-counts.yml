name: Run202 World observed-count integrity (software)
on:
  pull_request:
    paths:
      - 'v13/code/v13/world_model.py'
      - 'v13/code/tests/test_world_observation_integrity_run202.py'
      - '.github/workflows/run202-world-observed-counts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Isolated software prerequisites
        run: python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Actual WorldModel transition and consumer regressions
        working-directory: v13/code
        run: |
          python -m unittest -v tests.test_world_observation_integrity_run202 tests.test_world_action_chronology_run70 tests.test_world_observed_role_run71 tests.test_world_model tests.test_world_model_integration_run64 tests.test_world_align_finite_run65
          python -m compileall -q v13/world_model.py tests/test_world_observation_integrity_run202.py
      - name: Official public repository privacy scan
        run: python v13/code/scripts/public_repo_privacy_scan.py --base 0934e477af2593d5dde44745b79ba86b71275b1b --head HEAD --no-worktree
      - name: Scope
        run: echo 'SOFTWARE/SYNTHETIC SQLite only; no real native model, Redmi, JEPA or authority promotion'
