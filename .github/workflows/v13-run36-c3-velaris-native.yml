name: V13 Run36 Velaris C3-only five-arm Linux-native pilot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v13-run11-age0-native-endtoend
  cancel-in-progress: false
jobs:
  c3-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 40
      - name: Capture source-bound five-arm Linux-native evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run36-evidence"
          work="$RUNNER_TEMP/v13-run36-work"
          mkdir -p "$e" "$work"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          8a57b60a483c50550ca0714ac6472675dced701c v13/code/scripts/run34_c3_native_quote_intervention_pilot.py
          b1d58d7e0c3937787cf15dd801e278de25845879 v13/code/scripts/run33_b2_c3_counterfactual_envelopes.py
          bd035cf8029850cce00b179edf533e53bf24358a v13/code/v13/models.py
          dc23e192bcd01589475692666ebb6568c80d078b v13/code/v13/bootstrap.py
          efda7aa1aa5729e974d0d641870d4da05d21c961 v13/code/v13/runners.py
          f4a92dab9c4a40761d64394cdca1c052e9a76bfd v13/code/v13/utility.py
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          a7ba12a8807a1ca8236f1c70d54dedb65c212caa v13/code/tests/integration_step2_utility.py
          635e5727a42cb1eac4f84441afda2977b0c8109c v13/code/scripts/run15_step2_disjoint_bilingual_fixtures.py
          BLOBS
          : > "$e/BLOBS_RAW.log"
          mismatch=0
          while read -r want file; do
            got="$(git hash-object "$file" 2>/dev/null)"
            printf '%s %s %s\n' "$want" "$got" "$file" >> "$e/BLOBS_RAW.log"
            if [ "$want" != "$got" ]; then mismatch=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$mismatch" > "$e/BLOBS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run36-venv"
          py="$RUNNER_TEMP/v13-run36-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          echo "$?" > "$e/INSTALL_EXIT.txt"
          if [ "$mismatch" = 0 ] && [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 180s env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_run35_c3_report_arm_binding tests.test_run34_c3_native_quote_intervention_pilot tests.test_run33_b2_c3_counterfactual_envelopes) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
            "$py" -m compileall -q v13/code/scripts/run34_c3_native_quote_intervention_pilot.py v13/code/tests/test_run35_c3_report_arm_binding.py > "$e/COMPILE_RAW.log" 2>&1
            echo "$?" > "$e/COMPILE_EXIT.txt"
          else
            for n in FOCUSED COMPILE; do echo SKIPPED_PREREQ_RED > "$e/${n}_RAW.log"; echo SKIPPED_RED > "$e/${n}_EXIT.txt"; done
          fi
          export V13_HOME="$RUNNER_TEMP/v13-run36-installed"
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ] && [ "$(cat "$e/COMPILE_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 15m env PYTHONPATH=v13/code "$py" - > "$e/BOOTSTRAP_RAW.log" 2>&1 <<'PY'
          import fcntl,os
          from pathlib import Path
          from v13.config import initialize
          from v13.models import ModelManager
          from v13.bootstrap import install_native
          home=Path(os.environ['V13_HOME'])
          initialize(home)
          with (home/'data/coordinator.lock').open('a+') as lock:
              fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)
              manager=ModelManager(home)
              manager.install('language')
              manager.install('needle')
              install_native(home)
              proof=ModelManager(home).verify(deep=True)
              assert set(proof)=={'language','needle'}
              assert proof['language']['ok'] and proof['needle']['ok']
          print('PINNED_C3_AND_C2_RUNNER_SUPPORT_ONLY_NO_B1_B2_INSTALL')
          PY
            echo "$?" > "$e/BOOTSTRAP_EXIT.txt"
          else
            echo SKIPPED_SOFTWARE_RED > "$e/BOOTSTRAP_RAW.log"; echo SKIPPED_RED > "$e/BOOTSTRAP_EXIT.txt"
          fi
          if [ "$(cat "$e/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 35m env -u V13_LLAMA_SERVER PYTHONPATH=v13/code "$py" v13/code/scripts/run34_c3_native_quote_intervention_pilot.py --installed-home "$V13_HOME" --evidence-dir "$work/velaris" > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else
            echo SKIPPED_BOOTSTRAP_RED > "$e/NATIVE_RAW.log"; echo SKIPPED_RED > "$e/NATIVE_EXIT.txt"
          fi
          for f in RECEIPT.json C3_NATIVE_RAW.json; do
            if [ -f "$work/velaris/$f" ]; then cp "$work/velaris/$f" "$e/$f"; fi
          done
          if [ "$(cat "$e/NATIVE_EXIT.txt")" = 0 ]; then
            env PYTHONPATH=v13/code "$py" - "$e" > "$e/REPLAY_RAW.log" 2>&1 <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          from scripts import run34_c3_native_quote_intervention_pilot as pilot
          e=Path(sys.argv[1])
          receipt=json.loads((e/'RECEIPT.json').read_text())
          raw=(e/'C3_NATIVE_RAW.json').read_bytes()
          report=json.loads(raw)
          assert receipt['raw_report_sha256']==hashlib.sha256(raw).hexdigest()
          assert receipt['status']=='PASS_SCOPED_C3_ONLY_NATIVE_NO_STEP2_GATE'
          assert receipt['native_executed'] is True
          assert all(receipt[x] is True for x in ('model_unchanged','runner_unchanged','source_unchanged'))
          assert receipt['canonical_gate_pass'] is False and receipt['whole_system_complete'] is False
          assert receipt['phone_measured'] is False and receipt['jepa_weight']==0
          result=pilot.verify_report(report,pilot.C3_GGUF_SHA256,report['runner_sha256'])
          assert result['status']==receipt['status'] and result['rows']==5
          assert len(report['rows'])==5 and len(report['row_sha256'])==5
          assert [row['arm'] for row in report['rows']]==list(pilot.ARMS)
          for row in report['rows']:
              assert row['arm']==row['envelope']['arm']
              assert row['envelope']['fixture_id']==pilot.FIXTURE
              assert row['envelope']['seed']==pilot.SEED
              assert row['process_reaped'] is True and row['oracle_visible_to_native'] is False
          print('RUN36_LINUX_NATIVE_C3_ONLY_FIVE_ARM_SCOPED_NO_STEP2_PROMOTION')
          print('RAW_SHA256',receipt['raw_report_sha256'])
          print('ARM_SCORES',[(row['arm'],row['score'].get('utility')) for row in report['rows']])
          PY
            echo "$?" > "$e/REPLAY_EXIT.txt"
          else
            echo SKIPPED_NATIVE_RED > "$e/REPLAY_RAW.log"; echo SKIPPED_RED > "$e/REPLAY_EXIT.txt"
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 1f2039f3fa7b62ed6c9e3699672af91dfe532144 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 1f2039f3fa7b62ed6c9e3699672af91dfe532144 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - name: Preserve original raw Linux-native evidence and failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run36-c3-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run36-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce scoped Linux-native proof without canonical gate promotion
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run36-evidence"
          for n in BLOBS INSTALL FOCUSED COMPILE BOOTSTRAP NATIVE REPLAY PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; original raw retained; no native or STEP2 gate promotion"
              tail -70 "$e/${n}_RAW.log" || true
              exit 1
            fi
          done
          echo RUN36_C3_ONLY_LINUX_NATIVE_FIVE_ARM_NO_STEP2_GATE
