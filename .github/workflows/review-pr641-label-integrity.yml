name: V13 independent Claude PR641 exact route label cross-review
on:
  push:
    branches:
      - codex/review-claude-pr641-label-integrity-20261027
    paths:
      - '.github/workflows/review-pr641-label-integrity.yml'
      - 'v13/code/v13/learning_worker.py'
      - 'v13/code/tests/test_review641_curiosity_receipt.py'
      - 'v13/code/docs/proofs/continuation-20261027/review641-curiosity-receipt/**'
permissions:
  contents: read
concurrency:
  group: v13-review641-curiosity-source
  cancel-in-progress: false
jobs:
  receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.sha }}
      - name: Record source and dependency environment
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review641"
          git rev-parse HEAD > "$RUNNER_TEMP/review641/HEAD.txt"
          sha256sum v13/code/v13/learning_worker.py v13/code/tests/test_review641_curiosity_receipt.py > "$RUNNER_TEMP/review641/SOURCE_SHA256.txt"
          { date -u -Iseconds; python3 --version; uname -a; } > "$RUNNER_TEMP/review641/HOST.txt"
          python3 -m venv "$RUNNER_TEMP/review641venv"
          timeout 240s "$RUNNER_TEMP/review641venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
          "$RUNNER_TEMP/review641venv/bin/python" -m pip freeze > "$RUNNER_TEMP/review641/DEPS.txt"
      - name: Focused SQLite regression and privacy
        run: |
          set +e
          (cd v13/code && PYTHONPATH="$PWD:$PWD/scripts" "$RUNNER_TEMP/review641venv/bin/python" -m unittest -v tests.test_review641_curiosity_receipt tests.test_run633_jef_noanswer_goal tests.test_agi_live) > "$RUNNER_TEMP/review641/UNIT_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/review641/UNIT_EXIT.txt"
          (cd v13/code && PYTHONPATH="$PWD:$PWD/scripts" timeout 600s "$RUNNER_TEMP/review641venv/bin/python" -m unittest discover -s tests -p 'test_*.py') > "$RUNNER_TEMP/review641/FULL_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/review641/FULL_EXIT.txt"
          "$RUNNER_TEMP/review641venv/bin/python" -m compileall -q v13/code/v13/learning_worker.py v13/code/tests/test_review641_curiosity_receipt.py > "$RUNNER_TEMP/review641/COMPILE_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/review641/COMPILE_EXIT.txt"
          "$RUNNER_TEMP/review641venv/bin/python" v13/code/scripts/public_repo_privacy_scan.py --base bc0703f4fbfb794b23ffc49ac8a7cb6074903bfa --head HEAD > "$RUNNER_TEMP/review641/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/review641/PRIVACY_EXIT.txt"
          exit 0
      - name: Upload raw original evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review641-source-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/review641/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce actual results
        run: |
          set -euo pipefail
          for n in UNIT FULL COMPILE PRIVACY; do
            test "$(cat "$RUNNER_TEMP/review641/${n}_EXIT.txt")" = 0 || { cat "$RUNNER_TEMP/review641/${n}_RAW.log"; exit 1; }
          done
          cat "$RUNNER_TEMP/review641/UNIT_RAW.log" | tail -25
          cat "$RUNNER_TEMP/review641/FULL_RAW.log" | tail -25
          cat "$RUNNER_TEMP/review641/PRIVACY_RAW.log"
