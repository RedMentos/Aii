name: V13 seed79 C3 German typed read source-only preflight
on:
  push:
    branches: [assistant/v13-c3-de-typed-read-native-seed79-20261030]
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen fixtures, schema and source-only negative gates
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-c3-de79-preflight"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/specs/c3_de_native_typed_read_seed79.json > "$e/FIXTURE_BLOB.txt"
          git merge-base --is-ancestor 57a9fc4a230f21079374ce632aedf7bc17db965f HEAD > "$e/PREREG_RAW.log" 2>&1
          echo "$?" > "$e/PREREG_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/de79-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/de79-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_c3_de_native_typed_read_seed79_20261030) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          PYTHONPATH=v13/code "$py" -c 'from scripts.c3_de_native_typed_read_seed79 import fixtures; assert len(fixtures())==12; print("SOURCE_PINNED_FIXTURE_PASS")' > "$e/IMPORT_RAW.log" 2>&1
          echo "$?" > "$e/IMPORT_EXIT.txt"
          "$py" -m py_compile v13/code/scripts/c3_de_native_typed_read_seed79.py v13/code/tests/test_c3_de_native_typed_read_seed79_20261030.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 30bcf62f22c70107f920276263df6a7e9f8872de --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 30bcf62f22c70107f920276263df6a7e9f8872de HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-c3-de79-preflight-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-c3-de79-preflight/
          retention-days: 30
          if-no-files-found: error
      - name: Source-only acceptance, never native evidence
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-c3-de79-preflight"
          for stage in PREREG VENV DEPS TEST IMPORT COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; no native claim"
              tail -60 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo "C3_DE79_SOURCE_ONLY_PREFLIGHT_PASS_NOT_NATIVE_OR_GATE"
