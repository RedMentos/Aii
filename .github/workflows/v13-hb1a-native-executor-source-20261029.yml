name: V13 HB1a native executor source-only preflight (no native calls)
on:
  push:
    branches: [codex/v13-hb1a-native-execution-20261029]
permissions:
  contents: read
concurrency:
  group: v13-hb1a-native-source-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Source pins, focused synthetic/native-admission tests and privacy
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-hb1a-native-source"
          mkdir -p "$e"
          trap '(cd "$e"; find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)' EXIT
          git rev-parse HEAD > "$e/HEAD.txt"
          check() { [ "$(git hash-object "$2")" = "$1" ]; }
          {
            check 9d6652e99ac9aa0de7898f15eeb8a54d598c49e6 v13/code/docs/proofs/continuation-20261029/HB1A_TWO_BODY_NATIVE_PREREG.md
            check 033ea9c8c3e6f9ff631b84136afa1f74dd7e627c v13/code/scripts/hb1a_two_body_native_pilot.py
            check 6a2f2feb5a15dc59ea1905b4ecbfadbfeb0fbac0 v13/code/tests/test_hb1a_two_body_native_pilot.py
            check 1f6d268d3b38ba80833e26558fa9dd60bdd5f791 v13/code/docs/proofs/continuation-20261029/HB1A_NATIVE_EXECUTION_BUILD_STATE.json
            check 56306009d69554419bd9c024173ba9e56f32f56c v13/code/scripts/hb1a_native_executor.py
            check 3801a552ebd8a1d59a42a9a6ce078310e0b34221 v13/code/tests/test_hb1a_native_executor.py
            check 50b90700a7010a7d2a90dfc4793731bb012ff21b v13/code/tests/test_hb1a_native_executor_mock.py
            check 329153aaa73df009fdc433523994e372e0fd2c95 v13/code/scripts/hb0_split_information_cohort.py
            check 218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
            echo HB1A_NATIVE_SOURCE_PINS_OK
          } > "$e/SOURCE_RAW.log" 2>&1
          python3 -m venv "$RUNNER_TEMP/v13-hb1a-native-venv"
          py="$RUNNER_TEMP/v13-hb1a-native-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          python3 -m compileall -q v13/code/scripts/hb1a_native_executor.py v13/code/tests/test_hb1a_native_executor.py v13/code/tests/test_hb1a_native_executor_mock.py v13/code/scripts/hb1a_two_body_native_pilot.py > "$e/COMPILE_RAW.log" 2>&1
          (cd v13/code && timeout --signal=TERM --kill-after=5s 180s "$py" -m unittest -v tests.test_hb1a_two_body_native_pilot tests.test_hb1a_native_executor tests.test_hb1a_native_executor_mock) > "$e/FOCUSED_RAW.log" 2>&1
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 73e6343e3b7e5370cddf912d5023080a29ea9e4a --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          grep -q CLEAN "$e/PRIVACY_RAW.log"
          git diff --check 73e6343e3b7e5370cddf912d5023080a29ea9e4a HEAD
          echo HB1A_NATIVE_EXECUTOR_SOFTWARE_ONLY_NO_GATE > "$e/STATUS.txt"
      - name: Preserve source-only raw and RED attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-hb1a-native-source-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-hb1a-native-source/
          if-no-files-found: error
          retention-days: 30
