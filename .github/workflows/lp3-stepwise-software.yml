name: V13 LP3 preregistered two-arm stepwise synthetic review
on:
  push:
    branches: [codex/automation11g-lp3-stepwise-lr-arms-20261027]
    paths:
      - '.github/workflows/lp3-stepwise-software.yml'
      - 'v13/code/scripts/lp3_stepwise_lr_arms.py'
      - 'v13/code/tests/test_lp3_stepwise_lr_arms.py'
      - 'v13/code/docs/proofs/continuation-20261027/lp3-stepwise-lr-arms/PREREG.md'
permissions:
  contents: read
concurrency:
  group: v13-lp3-stepwise-software-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Pinned tiny frozen-decoder 24-step trace, privacy and diff
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 49848755351dbbe6c7beaf2a70e15917305c1253 HEAD
          python3 -m venv "$RUNNER_TEMP/lp3-stepwise-venv"
          py="$RUNNER_TEMP/lp3-stepwise-venv/bin/python"
          "$py" -m pip install --no-input --disable-pip-version-check --timeout 90 --retries 2 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu
          "$py" -m pip install --no-input --disable-pip-version-check --timeout 90 --retries 2 'transformers==5.20.2'
          "$py" -m pip check
          cd v13/code
          PYTHONPATH=. "$py" -m unittest -v tests.test_lp3_stepwise_lr_arms tests.test_lp3_heldout_utility tests.test_lp3_state_prefix
          "$py" -m py_compile scripts/lp3_stepwise_lr_arms.py tests/test_lp3_stepwise_lr_arms.py
          cd ../..
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 6331e5021e1e977183ece3d3b1ed7cfb8f05d4ba --head HEAD
          git diff --check 6331e5021e1e977183ece3d3b1ed7cfb8f05d4ba HEAD
          echo 'LP3_STEPWISE_SYNTHETIC_ONLY_NO_NATIVE_OR_AGE_PROMOTION'
