name: V14 online-world exactly-once regression
on:
  push:
    branches:
      - boss/v14-online-world-atomic-consumer-20261121
  pull_request:
    paths:
      - v13/code/v13/continuous_predictor.py
      - v13/code/v13/online_world.py
      - v13/code/tests/test_online_world_atomic_cursor_20261121.py
      - .github/workflows/v14-online-world-atomic.yml
jobs:
  local-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install numpy pytest
      - name: Compile changed runtime modules
        run: python -m py_compile v13/code/v13/continuous_predictor.py v13/code/v13/online_world.py v13/code/tests/test_online_world_atomic_cursor_20261121.py
      - name: Run exact-once and existing online-world regressions
        run: PYTHONPATH=v13/code python -m pytest -q v13/code/tests/test_online_world_atomic_cursor_20261121.py v13/code/tests/test_online_world_20261108.py
