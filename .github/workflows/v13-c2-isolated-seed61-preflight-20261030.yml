name: V13 seed61 isolated Body post-close source preflight
on:
  push:
    branches:
      - assistant/v13-seed61-isolated-body-postclose-20261030
    paths:
      - '.github/workflows/v13-c2-isolated-seed61-preflight-20261030.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact prereg, source and test preflight
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-seed61-preflight"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git merge-base --is-ancestor 8713ee286a6a20a777ce266a557b316c46599429 HEAD > "$e/PREREG_RAW.log" 2>&1
          echo "$?" > "$e/PREREG_EXIT.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          45e3008b1bc38d0b7ebaeeda60e7292b1eb28e62 v13/code/docs/C2_NATIVE_ISOLATED_SEED61_PREREG_20261030.md
          631df9e4932bb7ace43d95dd4097c1733dc852c7 v13/code/scripts/c2_isolated_postclose_seed61_20261030.py
          15921a36c0dc83c5edeaea02c63f41e8db41d26e v13/code/tests/test_c2_isolated_postclose_seed61_20261030.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          954a3f468f10195fbce12d27f68585ee7edee2c9 v13/code/specs/control_tools.json
          BLOBS
          red=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then red=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$red" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-seed61-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-seed61-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_c2_isolated_postclose_seed61_20261030) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          PYTHONPATH=v13/code "$py" -c 'from scripts.c2_isolated_postclose_seed61_20261030 import validate_fixtures; assert validate_fixtures(); print("REAL_IMPORT_AND_SCAFFOLD_PASS")' > "$e/IMPORT_RAW.log" 2>&1
          echo "$?" > "$e/IMPORT_EXIT.txt"
          "$py" -m py_compile v13/code/scripts/c2_isolated_postclose_seed61_20261030.py v13/code/tests/test_c2_isolated_postclose_seed61_20261030.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 84976e41aab1c42bff16bfaee0fbe6b673dd3752 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 84976e41aab1c42bff16bfaee0fbe6b673dd3752 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve all original preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-seed61-isolated-preflight-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-seed61-preflight/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce source-only preflight without native or age promotion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-seed61-preflight"
          for stage in PREREG PINS VENV DEPS TEST IMPORT COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained; no native or gate proof"
              tail -70 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'SEED61_SOURCE_PREFLIGHT_ONLY_NOT_NATIVE_OR_STEP2_GATE'
