name: V13 Run289 atomic update-row approval (SQLite software)
on:
  pull_request:
    paths:
      - 'v13/code/v13/store.py'
      - 'v13/code/tests/test_atomic_update_approval_row_run289.py'
      - '.github/workflows/run289-atomic-update-row.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approval-row:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Record source and canonical bytes
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/RUN289_HEAD.txt"
          sha256sum v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md | tee "$RUNNER_TEMP/RUN289_CANON.txt"
          test "$(cut -d' ' -f1 "$RUNNER_TEMP/RUN289_CANON.txt")" = 3423906b01b24443fcef733fb5c7ef47296963df63e603d8f843c99d544877ee
          git hash-object v13/code/v13/store.py v13/code/tests/test_atomic_update_approval_row_run289.py | tee "$RUNNER_TEMP/RUN289_BLOBS.txt"
          python3 -m compileall -q v13/code/v13 v13/code/tests
      - name: Run exact-head SQLite and learning regressions
        id: tests
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          python3 -m venv "$RUNNER_TEMP/run289venv"
          "$RUNNER_TEMP/run289venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
          deps=$?
          if [[ "$deps" != "0" ]]; then echo "$deps" > "$RUNNER_TEMP/RUN289_TEST_EXIT.txt"; echo "rc=$deps" >> "$GITHUB_OUTPUT"; exit 0; fi
          PYTHONPATH="$PWD:$PWD/tests" "$RUNNER_TEMP/run289venv/bin/python" -m unittest -v \
            tests.test_atomic_update_approval_row_run289 \
            tests.test_revoked_update_lineage_run287 \
            tests.test_component_generations tests.test_core \
            tests.test_learning_invariants tests.test_plasticity 2>&1 | tee "$RUNNER_TEMP/RUN289_TEST_RAW.log"
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/RUN289_TEST_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Official public repo privacy scan
        id: privacy
        run: |
          set -uo pipefail
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree 2>&1 | tee "$RUNNER_TEMP/RUN289_PRIVACY_RAW.log"
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/RUN289_PRIVACY_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Retain raw evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V13-Run289-AtomicUpdateRow-Raw-${{ github.sha }}
          path: |
            ${{ runner.temp }}/RUN289_HEAD.txt
            ${{ runner.temp }}/RUN289_CANON.txt
            ${{ runner.temp }}/RUN289_BLOBS.txt
            ${{ runner.temp }}/RUN289_TEST_EXIT.txt
            ${{ runner.temp }}/RUN289_TEST_RAW.log
            ${{ runner.temp }}/RUN289_PRIVACY_EXIT.txt
            ${{ runner.temp }}/RUN289_PRIVACY_RAW.log
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce test and privacy exits
        if: always()
        run: |
          test "${{ steps.tests.outputs.rc }}" = "0"
          test "${{ steps.privacy.outputs.rc }}" = "0"
