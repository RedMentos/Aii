name: V13 compiled procedural fastbatch regression

on:
  push:
    branches:
      - codex/v13-fast-procedure-20261110-hour11
    paths:
      - 'v13/code/v13/procedural_batch.py'
      - 'v13/code/v13/operator.py'
      - 'v13/code/tests/test_procedural_batch.py'
      - '.github/workflows/v13-procedural-batch-regression.yml'
  pull_request:
    paths:
      - 'v13/code/v13/procedural_batch.py'
      - 'v13/code/v13/operator.py'
      - 'v13/code/tests/test_procedural_batch.py'
      - '.github/workflows/v13-procedural-batch-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: v13/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Compile changed modules
        run: python -m py_compile v13/procedural_batch.py v13/operator.py tests/test_procedural_batch.py
      - name: Test real operator and durable mini-checkpoints
        run: python -m pytest -q tests/test_procedural_batch.py
