name: V13 Online World atomic cursor
on:
  pull_request:
    paths:
      - 'v13/code/v13/online_world.py'
      - 'v13/code/v13/continuous_predictor.py'
      - 'v13/code/tests/test_online_world_atomic_cursor_20261109.py'
      - 'v13/code/tests/test_online_world_20261108.py'
      - 'v13/code/tests/test_continuous_predictor_20261108.py'
      - 'v13/code/tests/test_online_checkpoint_validation_20261109.py'
      - '.github/workflows/v13-online-world-atomic-cursor.yml'
  workflow_dispatch:
jobs:
  atomic-cursor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy
      - name: Compile and execute online learning persistence and regression suite
        working-directory: v13/code
        run: |
          python -m compileall -q v13/online_world.py v13/continuous_predictor.py
          python -m pytest -q tests/test_online_world_atomic_cursor_20261109.py tests/test_online_world_20261108.py tests/test_continuous_predictor_20261108.py tests/test_online_checkpoint_validation_20261109.py
