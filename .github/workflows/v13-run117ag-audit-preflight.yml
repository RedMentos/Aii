name: V13 Run117AG independent original native auditor model-free preflight
on:
  push:
    branches:
      - assistant/v13-run117ag-independent-native-audit-20261031-gpt6
    paths:
      - .github/workflows/v13-run117ag-audit-preflight.yml
      - v13/code/scripts/run117ag_independent_native_audit.py
      - v13/code/tests/test_run117ag_independent_native_audit.py
      - v13/code/docs/RUN117AG_*
permissions:
  contents: read
jobs:
  stdlib-independent-audit-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Verify independent audit scorer and negative controls
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117ag-audit-preflight"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run117ag-venv" > "$e/VENV_RAW.log" 2>&1
          py="$RUNNER_TEMP/v13-run117ag-venv/bin/python"
          set +e
          "$py" -m pip install --disable-pip-version-check --no-input -q \
            'numpy==2.2.6' 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          deps_rc=$?
          if test "$deps_rc" -eq 0; then
            (cd v13/code && env PYTHONPATH=. "$py" -m unittest -v \
              tests.test_run117ag_independent_native_audit) > "$e/TEST_RAW.log" 2>&1
            test_rc=$?
          else
            test_rc=125;echo DEPS_RED > "$e/TEST_RAW.log"
          fi
          "$py" -m compileall -q \
            v13/code/scripts/run117ag_independent_native_audit.py \
            v13/code/tests/test_run117ag_independent_native_audit.py > "$e/COMPILE_RAW.log" 2>&1
          compile_rc=$?
          python3 v13/code/scripts/public_repo_privacy_scan.py \
            --base f767480f5d79e8b8493f458e8579aefa78721ca5 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          privacy_rc=$?
          git diff --check f767480f5d79e8b8493f458e8579aefa78721ca5 HEAD > "$e/DIFF_RAW.log" 2>&1
          diff_rc=$?
          for x in "DEPS:$deps_rc" "TEST:$test_rc" "COMPILE:$compile_rc" \
                   "PRIVACY:$privacy_rc" "DIFF:$diff_rc"; do
            echo "${x#*:}" > "$e/${x%%:*}_EXIT.txt"
          done
          set -e
          "$py" - "$e" <<'PY' > "$e/RESULT_RAW.log"
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1]);names=('DEPS','TEST','COMPILE','PRIVACY','DIFF')
          r={'schema':'v13.run117ag.independent_native_audit_preflight.v1',
             'head':(e/'HEAD.txt').read_text().strip(),
             'exits':{n:int((e/(n+'_EXIT.txt')).read_text()) for n in names},
             'native_inference':False,'original_artifact_not_yet_audited':True,
             'step2_promoted':False,'b3_promoted':False,'jepa_weight':0,
             'redmi_measured':False,'whole_system_complete':False}
          (e/'RESULT.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat "$e/RESULT_RAW.log"
          tail -n 6 "$e/TEST_RAW.log"
          for rc in "$deps_rc" "$test_rc" "$compile_rc" "$privacy_rc" "$diff_rc"; do test "$rc" -eq 0; done
      - name: Preserve preflight raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117ag-audit-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117ag-audit-preflight/
          if-no-files-found: warn
          retention-days: 90
