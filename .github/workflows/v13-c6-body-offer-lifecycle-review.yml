name: V13 C6 B1 B2 offer lifecycle SHADOW independent software audit
on:
  push:
    branches: [assistant/v13-c6-offer-lifecycle-review-20261031-auto11]
    paths: ['.github/workflows/v13-c6-body-offer-lifecycle-review.yml']
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen source pins, synthetic real-Store tests, privacy and raw evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-c6-body-offer-lifecycle"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          0779d986fb8aee8aa01c5df5f656889d4bd56348 v13/code/v13/store.py
          1a9eb6f7c7cbfce83d91cc09b4ff9516cff310cf v13/code/v13/cognition.py
          277d34a46b14633c52b5e7d59b3fdf0f16ea4159 v13/code/v13/b1b2_topic_partition_candidate.py
          8aaccb96c3fca43fa4450ab9bdc15f0e787bf093 v13/code/v13/b1b2_c3_source_envelope_candidate.py
          b401e0ba26a1031007ad939397947b6d2d01850d v13/code/v13/run58_crossorgan_c6_shadow_candidate.py
          ee37a0482abb9ef70784cb232f52e3d06080f22a v13/code/v13/c6_body_offer_lifecycle_candidate.py
          44082471c6379c92034ab4e2a5e6d2216e2f019b v13/code/tests/test_c6_body_offer_lifecycle_candidate.py
          fe0a07c3b5bee5a00431e9d344a6e7f58e99787e v13/code/tests/test_run58_crossorgan_c6_shadow_candidate.py
          30bb3269fa89621f78db893cf566d04f8768cf27 v13/code/v13/c6_positive_assertion_candidate.py
          c887e3db355df8b68d3bd35c6c86d1573ea2d081 v13/code/docs/fixtures/run52_b1b2_cross_turn_seed479.json
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          sha256sum v13/code/docs/fixtures/run52_b1b2_cross_turn_seed479.json > "$e/FIXTURE_RAW.log" 2>&1
          test "$(cut -d' ' -f1 "$e/FIXTURE_RAW.log")" = 5cc8783dedbb201a0a8b86763c99dc23130e1d126a603cf0afcac33d8b985f3b
          echo "$?" > "$e/FIXTURE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-c6-lifecycle-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-c6-lifecycle-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/FIXTURE_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_c6_body_offer_lifecycle_candidate tests.test_run58_crossorgan_c6_shadow_candidate tests.test_c6_positive_assertion_candidate tests.test_b1b2_c3_source_envelope_candidate tests.test_b1b2_topic_partition_candidate tests.test_f1f5_temporal_atomic_draft_candidate tests.test_c6_temporal_draft_preflight_candidate tests.test_f1f5_event_finalizer_candidate) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PINS_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/v13/c6_body_offer_lifecycle_candidate.py v13/code/tests/test_c6_body_offer_lifecycle_candidate.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 74f9610d279f1b06d670376cb28c330a061d8b42 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 74f9610d279f1b06d670376cb28c330a061d8b42 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve complete raw evidence including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-c6-body-offer-lifecycle-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-c6-body-offer-lifecycle/
          retention-days: 90
          if-no-files-found: error
      - name: Require all eight stage exits zero
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-c6-body-offer-lifecycle"
          for s in PINS FIXTURE VENV DEPS TEST COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo C6_BODY_OFFER_LIFECYCLE_SHADOW_NO_TTY_NO_DELIVERY_NO_PROMOTION
