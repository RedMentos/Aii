name: V13 Run418 one pinned Linux-native S_s20 from verified no-model P export
on:
  pull_request:
    paths:
      - '.github/workflows/run418-native-s20.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: v13-native-c3-run131-serialized
  cancel-in-progress: false
jobs:
  pinned-s20:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      V13_NO_AUTOSTART: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      NEEDLE_TELEMETRY: '0'
      PIP_NO_CACHE_DIR: '1'
      RUN413_RUN_ID: '40258333913'
      RUN413_HEAD: 'f7fe01393801c852aa3797973bda0e81b14069ac'
      RAW_ID: '12624511151'
      RAW_SHA256: '3c554e654bc62ba0a4979c5c89b1c9a43d6ce86c4bf16933d5a1b3d709fdf5a5'
      SAFE_ID: '12624057201'
      SAFE_SHA256: 'bb2bc545ce72b30657f36cc605e4a6b2c3e74b2085aea8c679ccc31062b7089a'
      IMPORT_SOURCE_RUN: '40260220484'
      IMPORT_SOURCE_HEAD: 'bf8cefd5de71fcf145ddfa8b5ef7d22601f1eb10'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Exact frozen source, prior native/source GREEN, artifact metadata, host
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/RUN418_HEAD.txt"
          git merge-base --is-ancestor "$IMPORT_SOURCE_HEAD" HEAD
          test "$(git hash-object v13/code/scripts/run394_step2_fresh.py)" = "fae7aed612108a554d8566b2917ebf31022df423"
          test "$(git hash-object v13/code/scripts/run397_step2_resume.py)" = "f1946054135cb6fdf48c06477308f518e2e62ad9"
          test "$(git hash-object v13/code/specs/models.json)" = "7af05962af41d0bc3f7dd18ef01d4eba55eabf99"
          test "$(sha256sum v13/code/scripts/run418_import_no_model_artifact.py | cut -d' ' -f1)" = "89120229cf047f360187c2669af7308bd251962cca847a88808e56364084e29f"
          gh api "repos/RedMentos/Aii/actions/runs/$RUN413_RUN_ID" --jq '{id,conclusion,head_sha}' | tee "$RUNNER_TEMP/RUN418_RUN413_METADATA.json"
          gh api "repos/RedMentos/Aii/actions/runs/$IMPORT_SOURCE_RUN" --jq '{id,conclusion,head_sha}' | tee "$RUNNER_TEMP/RUN418_SOURCE_GREEN_METADATA.json"
          gh api "repos/RedMentos/Aii/actions/artifacts/$RAW_ID" --jq '{id,digest,expired}' | tee "$RUNNER_TEMP/RUN418_RAW_METADATA.json"
          gh api "repos/RedMentos/Aii/actions/artifacts/$SAFE_ID" --jq '{id,digest,expired}' | tee "$RUNNER_TEMP/RUN418_SAFE_METADATA.json"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          def load(n):return json.loads((root/n).read_text())
          assert load("RUN418_RUN413_METADATA.json")=={"id":int(os.environ["RUN413_RUN_ID"]),"conclusion":"success","head_sha":os.environ["RUN413_HEAD"]}
          assert load("RUN418_SOURCE_GREEN_METADATA.json")=={"id":int(os.environ["IMPORT_SOURCE_RUN"]),"conclusion":"success","head_sha":os.environ["IMPORT_SOURCE_HEAD"]}
          for label in ("RAW","SAFE"):
              item=load("RUN418_"+label+"_METADATA.json")
              assert item["id"]==int(os.environ[label+"_ID"]) and not item["expired"]
              assert item["digest"]=="sha256:"+os.environ[label+"_SHA256"]
          PY
          { date -u -Iseconds; uname -a; python3 --version; free -h; df -h "$RUNNER_TEMP"; cat /sys/fs/cgroup/memory.max 2>/dev/null || true; } | tee "$RUNNER_TEMP/RUN418_HOST.txt"
      - name: Isolated pinned dependencies and adversarial source tests
        id: deps
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          python3 -m venv "$RUNNER_TEMP/run418venv"
          timeout 240s "$RUNNER_TEMP/run418venv/bin/python" -m pip install --disable-pip-version-check --no-input \
            'numpy==2.3.5' 'prompt-toolkit==3.0.52' 2>&1 | tee "$RUNNER_TEMP/RUN418_DEPS_RAW.log"
          d=${PIPESTATUS[0]}
          if [ "$d" -eq 0 ]; then
            PYTHONPATH="$PWD:$PWD/scripts" "$RUNNER_TEMP/run418venv/bin/python" -m unittest -v \
              tests.test_run394_step2_fresh tests.test_run397_step2_resume \
              tests.test_run413_export_receipt_gate tests.test_run415_stage3_no_model_restore \
              tests.test_run418_import_no_model_artifact \
              2>&1 | tee "$RUNNER_TEMP/RUN418_NATIVE_SOURCE_TESTS_RAW.log"
            t=${PIPESTATUS[0]}
          else
            t=2
          fi
          rc=$((d+t))
          echo "$rc" > "$RUNNER_TEMP/RUN418_DEPS_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Install exact pinned public models and b10964 runner
        id: bootstrap
        if: steps.deps.outputs.rc == '0'
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          export PYTHONPATH="$PWD:$PWD/scripts" V13_HOME="$RUNNER_TEMP/run418installed"
          timeout 1800s "$RUNNER_TEMP/run418venv/bin/python" -m v13.bootstrap --home "$V13_HOME" \
            2>&1 | tee "$RUNNER_TEMP/RUN418_BOOTSTRAP_RAW.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 0 ]; then
            "$RUNNER_TEMP/run418venv/bin/python" - <<'PY' 2>&1 | tee "$RUNNER_TEMP/RUN418_INSTALLED_RAW.log"
          import json,os
          from pathlib import Path
          from v13.models import ModelManager,catalog
          from v13.common import file_hash
          from run402_stage_restore import RUN401_EXECUTABLE_SHA256
          home=Path(os.environ["V13_HOME"])
          manager=ModelManager(home); checks=manager.verify(deep=True)
          for key in ("needle","language","body","gist"):
              assert checks[key]["ok"] and checks[key]["hash_checked"]
              assert manager.installed[key]["exact_revision"]==catalog()["models"][key]["revision"]
              print("MODEL_VERIFIED",key)
          runner=home/"bin/llama-server"
          meta=json.loads((home/"config/runner.json").read_text())
          assert meta["tag"]=="b10964" and meta["binary_sha256"]==file_hash(runner)
          assert file_hash(runner)==RUN401_EXECUTABLE_SHA256
          print("RUNNER_VERIFIED",meta["binary_sha256"])
          PY
            rc=${PIPESTATUS[0]}
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN418_BOOTSTRAP_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Download exact Run413 raw and no-model work ZIPs
        id: download
        if: steps.bootstrap.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          set +e
          timeout 900s gh api "repos/RedMentos/Aii/actions/artifacts/$RAW_ID/zip" > "$RUNNER_TEMP/run413-raw.zip" 2> "$RUNNER_TEMP/RUN418_RAW_DOWNLOAD_STDERR.log"
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "$RAW_SHA256  $RUNNER_TEMP/run413-raw.zip" | sha256sum -c - > "$RUNNER_TEMP/RUN418_RAW_HASH_CHECK.log" 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            timeout 900s gh api "repos/RedMentos/Aii/actions/artifacts/$SAFE_ID/zip" > "$RUNNER_TEMP/run413-safe.zip" 2> "$RUNNER_TEMP/RUN418_SAFE_DOWNLOAD_STDERR.log"
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            echo "$SAFE_SHA256  $RUNNER_TEMP/run413-safe.zip" | sha256sum -c - > "$RUNNER_TEMP/RUN418_SAFE_HASH_CHECK.log" 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/RUN418_RAW_REPORT_EXTRACT.log"
          import os,pathlib,zipfile,json
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          with zipfile.ZipFile(root/"run413-raw.zip") as z:
              names=z.namelist()
              assert len(set(names))==len(names)
              assert "RUN413_STAGE2_REPORT.json" in names
              raw=z.read("RUN413_STAGE2_REPORT.json")
          report=json.loads(raw)
          assert report["status"]=="STAGE2_NATIVE_PARTIAL_NO_PROMOTION" and report["rows_verified"]==84
          assert report["errors"]==[] and report["canonical_gate_pass"] is False
          (root/"RUN413_STAGE2_REPORT.json").write_bytes(raw)
          print("RUN413_NATIVE_84_REPORT_VERIFIED")
          PY
            rc=${PIPESTATUS[0]}
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN418_DOWNLOAD_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Independently import exact no-model work and restore manifest empty dirs
        id: import
        if: steps.download.outputs.rc == '0'
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          PYTHONPATH="$PWD:$PWD/scripts" "$RUNNER_TEMP/run418venv/bin/python" scripts/run418_import_no_model_artifact.py \
            --archive "$RUNNER_TEMP/run413-safe.zip" --expected-sha256 "$SAFE_SHA256" \
            --run411-report "$RUNNER_TEMP/RUN413_STAGE2_REPORT.json" \
            --destination "$RUNNER_TEMP/run418-safe-import" \
            --output "$RUNNER_TEMP/RUN418_IMPORT_REPORT.json" \
            2>&1 | tee "$RUNNER_TEMP/RUN418_IMPORT_RAW.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUNNER_TEMP/RUN418_IMPORT_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Execute exactly one pinned native S_s20 arm and safe no-model export
        id: native
        if: steps.import.outputs.rc == '0'
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          export PYTHONPATH="$PWD:$PWD/scripts"
          timeout -s TERM -k 30s 4800s "$RUNNER_TEMP/run418venv/bin/python" scripts/run415_stage3_no_model_restore.py \
            --export "$RUNNER_TEMP/run418-safe-import" \
            --run411-report "$RUNNER_TEMP/RUN413_STAGE2_REPORT.json" \
            --work "$RUNNER_TEMP/run418work" \
            --installed-home "$RUNNER_TEMP/run418installed" \
            --export-destination "$RUNNER_TEMP/run418-safe-export" --execute \
            --output "$RUNNER_TEMP/RUN418_STAGE3_REPORT.json" \
            2>&1 | tee "$RUNNER_TEMP/RUN418_NATIVE_RAW.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUNNER_TEMP/RUN418_NATIVE_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preserve failed attempts in no-model export if native wrapper interrupted
        id: fallback
        if: always()
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          rc=0
          if [ -d "$RUNNER_TEMP/run418work" ] && [ -d "$RUNNER_TEMP/run418installed" ] \
             && [ ! -e "$RUNNER_TEMP/run418-safe-export" ]; then
            PYTHONPATH="$PWD:$PWD/scripts" "$RUNNER_TEMP/run418venv/bin/python" scripts/run409_safe_export.py \
              --work "$RUNNER_TEMP/run418work" --installed-home "$RUNNER_TEMP/run418installed" \
              --destination "$RUNNER_TEMP/run418-safe-export" \
              --output "$RUNNER_TEMP/RUN418_FALLBACK_EXPORT.json" \
              2>&1 | tee "$RUNNER_TEMP/RUN418_FALLBACK_RAW.log"
            rc=${PIPESTATUS[0]}
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN418_FALLBACK_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Independently check no-model export integrity and native gate
        id: export
        if: always()
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          PYTHONPATH="$PWD:$PWD/scripts" python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/RUN418_EXPORT_VERIFICATION_RAW.log"
          import os,json,hashlib,stat,pathlib
          from run413_export_receipt_gate import safe_rel,registered_model_hashes,MANIFEST,MAX_FILE,MAX_TOTAL
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          export=root/"run418-safe-export"
          assert export.is_dir() and not export.is_symlink()
          manifest_path=export/MANIFEST
          assert manifest_path.is_file() and not manifest_path.is_symlink()
          manifest=json.loads(manifest_path.read_text())
          assert manifest["schema"]=="RUN409_SAFE_NATIVE_EXPORT_V1" and manifest["canonical_gate_pass"] is False
          assert manifest["step2_exit"]=="UTILITY_FAIL"
          copied=manifest["copied"]; expected=set(copied)
          observed=set(); dirs=set(); total=0; models=registered_model_hashes()
          for current,folders,files in os.walk(export,topdown=True,followlinks=False):
              here=pathlib.Path(current);dirs.add(here.relative_to(export).as_posix())
              for name in folders:
                  p=here/name
                  assert not p.is_symlink() and p.is_dir()
              for name in files:
                  p=here/name
                  assert not p.is_symlink()
                  info=p.stat();assert stat.S_ISREG(info.st_mode) and info.st_nlink==1
                  rel=p.relative_to(export).as_posix()
                  if rel==MANIFEST:continue
                  safe_rel(rel)
                  assert rel in copied and info.st_size==copied[rel]["bytes"] and info.st_size<=MAX_FILE
                  digest=hashlib.sha256(p.read_bytes()).hexdigest()
                  assert digest==copied[rel]["sha256"] and digest not in models
                  total+=info.st_size;assert total<=MAX_TOTAL
                  observed.add(rel)
          assert observed==expected and dirs==set(manifest["directories"])
          progress=json.loads((export/"RUN397_PROGRESS.json").read_text())
          assert progress["canonical_gate_pass"] is False and progress["step2_exit"]=="UTILITY_FAIL"
          assert total<=MAX_TOTAL
          report_path=root/"RUN418_STAGE3_REPORT.json"
          if report_path.is_file():
              report=json.loads(report_path.read_text())
              assert report["canonical_gate_pass"] is False and report["step2_exit"]=="UTILITY_FAIL"
              assert report["safe_export"]["status"]=="EXPORT_VERIFIED_NO_MODEL_WEIGHTS"
              assert report["safe_export"]["manifest_sha256"]==hashlib.sha256(manifest_path.read_bytes()).hexdigest()
              assert report["safe_export"]["copied_files"]==len(observed)
              assert report["safe_export"]["copied_bytes"]==total
              if report["status"]=="STAGE3_NATIVE_PARTIAL_NO_PROMOTION":
                  assert report["native_execution_performed"] is True and report["rows_verified"]==126
                  assert set(progress["completed"])=={"O_s20","P_s20","S_s20"}
                  assert not progress["failures_preserved"]
                  assert report["progress_sha256"]==hashlib.sha256((export/"RUN397_PROGRESS.json").read_bytes()).hexdigest()
                  outcome="NO_MODEL_EXPORT_VERIFIED_NATIVE_126"
              else:
                  outcome="NO_MODEL_EXPORT_VERIFIED_NATIVE_RED"
          else:
              outcome="NO_MODEL_EXPORT_VERIFIED_WRAPPER_INTERRUPTED"
          result={"status":outcome,"files":len(observed),"bytes":total,
                  "manifest_sha256":hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
                  "canonical_gate_pass":False,"step2_exit":"UTILITY_FAIL"}
          (root/"RUN418_EXPORT_VERIFICATION.json").write_text(json.dumps(result,sort_keys=True,indent=2)+"\n")
          print(json.dumps(result,sort_keys=True))
          PY
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUNNER_TEMP/RUN418_EXPORT_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Public repo privacy scan
        id: privacy
        run: |
          set -uo pipefail
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py \
            --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree \
            2>&1 | tee "$RUNNER_TEMP/RUN418_PRIVACY_RAW.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUNNER_TEMP/RUN418_PRIVACY_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Close only small raw logs, never models or original ZIP
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          find . -maxdepth 1 -type f -name 'RUN418_*' ! -name RUN418_SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 -r sha256sum > RUN418_SHA256SUMS.txt
      - name: Upload small native logs even on RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V13-Run418-S20-Small-Raw-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/RUN418_*
          if-no-files-found: warn
          retention-days: 30
      - name: Upload independently verified no-model work, including RED attempts
        if: steps.export.outputs.rc == '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V13-Run418-S20-Safe-Work-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/run418-safe-export/**
          if-no-files-found: error
          retention-days: 30
      - name: Enforce exact native 126 rows, safe export and privacy
        if: always()
        run: |
          test "${{ steps.preflight.conclusion }}" = "success"
          test "${{ steps.deps.outputs.rc }}" = "0"
          test "${{ steps.bootstrap.outputs.rc }}" = "0"
          test "${{ steps.download.outputs.rc }}" = "0"
          test "${{ steps.import.outputs.rc }}" = "0"
          test "${{ steps.native.outputs.rc }}" = "0"
          test "${{ steps.export.outputs.rc }}" = "0"
          test "${{ steps.privacy.outputs.rc }}" = "0"
