name: V13 Run14O C2 deadline wake candidate GREEN
on:
  push:
    branches: [assistant/v13-run14o-c2-deadline-wake-20261030-2027]
    paths:
      - '.github/workflows/v13-run14o-c2-deadline-wake.yml'
permissions:
  contents: read
jobs:
  c2-wake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Candidate pinned C2 source and regression GREEN
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run14o-c2-wake"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          dcf933014a521ac98d250f826b72bc214d2dcfda v13/code/docs/RUN14O_C2_DEADLINE_WAKE_PREREG_20261030.md
          57e2612ff23f21941d464604a573c17cb9512dd1 v13/code/tests/test_c2_deadline_preferred_wake_run14o.py
          f251fd86f64786f673ee647d9611ea4d2ca351ee v13/code/v13/effort.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=. python3 -m unittest -v tests.test_c2_deadline_preferred_wake_run14o tests.test_effort tests.test_resource_modes tests.test_r4_c3_uncertainty_wake) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m py_compile v13/code/v13/effort.py v13/code/tests/test_c2_deadline_preferred_wake_run14o.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 98b5c634627b01fa34a178fad4c0ee8c4d1eecc0 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 98b5c634627b01fa34a178fad4c0ee8c4d1eecc0 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original RED raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run14o-c2-wake-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run14o-c2-wake/
          retention-days: 30
          if-no-files-found: error
      - name: Require all candidate stages GREEN
        if: always()
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run14o-c2-wake"
          test "$(cat "$e/PINS_EXIT.txt")" = 0
          test "$(cat "$e/TEST_EXIT.txt")" = 0
          test "$(cat "$e/COMPILE_EXIT.txt")" = 0
          test "$(cat "$e/PRIVACY_EXIT.txt")" = 0
          test "$(cat "$e/DIFF_EXIT.txt")" = 0
          echo 'RUN14O_C2_DEADLINE_HEMISPHERE_SOFTWARE_GREEN_NO_UTILITY_PROMOTION'
