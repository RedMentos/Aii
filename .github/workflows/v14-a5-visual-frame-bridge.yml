name: V14 A5 visual frame bridge
on:
  push:
    branches:
      - "research-perception/**"
    paths:
      - "v13/code/v13/a5_visual_frame_bridge.py"
      - "v13/code/v13/a4_visual_salience.py"
      - "v13/code/tests/test_a5_visual_frame_bridge.py"
      - "v13/code/v13/a5_ui_admission_bridge.py"
      - "v13/code/v13/vision.py"
      - ".github/workflows/v14-a5-visual-frame-bridge.yml"
  pull_request:
    paths:
      - "v13/code/v13/a5_visual_frame_bridge.py"
      - "v13/code/v13/a4_visual_salience.py"
      - "v13/code/tests/test_a5_visual_frame_bridge.py"
      - "v13/code/v13/a5_ui_admission_bridge.py"
      - "v13/code/v13/vision.py"
      - ".github/workflows/v14-a5-visual-frame-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a5-visual-frame:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bounded visual test dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow pytest
      - name: Compile A5 visual bridge
        env:
          PYTHONPATH: v13/code
        run: python -m py_compile v13/code/v13/a5_visual_frame_bridge.py v13/code/v13/a4_visual_salience.py
      - name: Run exact A5 visual Runtime tests
        env:
          PYTHONPATH: v13/code
        run: python -m pytest -q v13/code/tests/test_a5_visual_frame_bridge.py
