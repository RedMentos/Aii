name: V13 full unfiltered software review with pinned CPU torch and Transformers
on:
  push:
    branches: [codex/v13-full-suite-torch-transformers-20261029-auto10am]
    paths:
      - '.github/workflows/v13-full-suite-transformers-review-20261029.yml'
      - 'v13/code/docs/proofs/continuation-20261029/FULL_SUITE_TRANSFORMERS_PREREG_20261029.md'
permissions:
  contents: read
jobs:
  full-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Full unfiltered software suite with isolated pinned HF dependencies
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-full-transformers"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/v13/world_model.py v13/code/scripts/ask_verified_budget.py v13/code/tests/test_body_jepa_checkpoint_fit.py v13/code/tests/test_lp3_state_prefix.py v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/SOURCE_BLOBS.txt"
          test "$(tail -1 "$e/SOURCE_BLOBS.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          echo "$?" > "$e/CANON_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-full-transformers-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-full-transformers-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input -q --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu' > "$e/TORCH_RAW.log" 2>&1
            echo "$?" > "$e/TORCH_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input -q 'transformers==4.44.2' > "$e/TRANSFORMERS_RAW.log" 2>&1
            echo "$?" > "$e/TRANSFORMERS_EXIT.txt"
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
            "$py" -c 'import torch; print(torch.__version__, torch.cuda.is_available())' > "$e/TORCH_IMPORT_RAW.log" 2>&1
            echo "$?" > "$e/TORCH_IMPORT_EXIT.txt"
            "$py" -c 'import transformers; from transformers import GPT2Config, GPT2LMHeadModel; print(transformers.__version__)' > "$e/TRANSFORMERS_IMPORT_RAW.log" 2>&1
            echo "$?" > "$e/TRANSFORMERS_IMPORT_EXIT.txt"
          else
            for stage in DEPS TORCH TRANSFORMERS PIP_CHECK TORCH_IMPORT TRANSFORMERS_IMPORT; do
              echo SKIPPED > "$e/${stage}_EXIT.txt"
              echo SKIPPED > "$e/${stage}_RAW.log"
            done
          fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ] && [ "$(cat "$e/TORCH_EXIT.txt")" = 0 ] && [ "$(cat "$e/TRANSFORMERS_EXIT.txt")" = 0 ] && [ "$(cat "$e/TORCH_IMPORT_EXIT.txt")" = 0 ] && [ "$(cat "$e/TRANSFORMERS_IMPORT_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests -p 'test_*.py') > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else
            echo SKIPPED > "$e/FULL_EXIT.txt"
            echo SKIPPED > "$e/FULL_RAW.log"
          fi
          "$py" -m compileall -q v13/code/v13 v13/code/scripts > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base cdf5f48c5bacbca494674a2554e96bf1e4e8dc2b --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check cdf5f48c5bacbca494674a2554e96bf1e4e8dc2b HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-full-transformers-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-full-transformers/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce all full-suite checks without waivers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-full-transformers"
          for stage in CANON VENV DEPS TORCH TRANSFORMERS PIP_CHECK TORCH_IMPORT TRANSFORMERS_IMPORT FULL COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained; no gate promotion"
              tail -75 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'FULL_SOFTWARE_PASS_ONLY_NOT_NATIVE_OR_REDMI'
