name: V13 Run116 independent original native artifact verification
on:
  push:
    branches:
      - assistant/v13-run116-independent-native-audit-20261031-gpt6
    paths:
      - .github/workflows/v13-run116-original-native-audit.yml
permissions:
  contents: read
  actions: read
jobs:
  original-native-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      NO_MODEL_DOWNLOADS: "1"
      V13_NO_AUTOSTART: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch exact original GitHub artifact and independently audit frozen native output
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run116-original-audit"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/AUDITOR_HEAD.txt"
          set +e
          curl --location --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/RedMentos/Aii/actions/artifacts/13051756857/zip" \
            --output "$e/ORIGINAL_RUN116.zip" > "$e/DOWNLOAD_RAW.log" 2>&1
          download_rc=$?
          if test "$download_rc" -eq 0; then
            sha256sum "$e/ORIGINAL_RUN116.zip" > "$e/ORIGINAL_SHA_RAW.log" 2>&1
            echo "71de9bb7bc2899f5aee67f58b55d13514d0a9b0d870cd98ae5e8f2f1850d11c5  $e/ORIGINAL_RUN116.zip" | sha256sum -c - > "$e/HASH_RAW.log" 2>&1
            hash_rc=$?
          else
            hash_rc=125
            echo 'DOWNLOAD_RED' > "$e/HASH_RAW.log"
          fi
          if test "$hash_rc" -eq 0; then
            python3 v13/code/scripts/run116_original_raw_audit.py \
              "$e/ORIGINAL_RUN116.zip" \
              --sha256 71de9bb7bc2899f5aee67f58b55d13514d0a9b0d870cd98ae5e8f2f1850d11c5 \
              > "$e/ORIGINAL_AUDIT_RAW.log" 2>&1
            audit_rc=$?
          else
            audit_rc=125
            echo 'HASH_RED' > "$e/ORIGINAL_AUDIT_RAW.log"
          fi
          (cd v13/code && env PYTHONPATH=.:scripts:tests python3 -m unittest discover -s tests -p test_run116_original_raw_audit.py -v) > "$e/TEST_RAW.log" 2>&1
          test_rc=$?
          python3 -m compileall -q v13/code/scripts/run116_original_raw_audit.py v13/code/tests/test_run116_original_raw_audit.py > "$e/COMPILE_RAW.log" 2>&1
          compile_rc=$?
          python3 v13/code/scripts/public_repo_privacy_scan.py --base df08a4ce311317bdfd322ba7c7520d9fe8fb2b93 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          privacy_rc=$?
          git diff --check df08a4ce311317bdfd322ba7c7520d9fe8fb2b93 HEAD > "$e/DIFF_RAW.log" 2>&1
          diff_rc=$?
          set -e
          for item in "DOWNLOAD:$download_rc" "HASH:$hash_rc" "AUDIT:$audit_rc" "TEST:$test_rc" "COMPILE:$compile_rc" "PRIVACY:$privacy_rc" "DIFF:$diff_rc"; do
            echo "${item#*:}" > "$e/${item%%:*}_EXIT.txt"
          done
          python3 - "$e" <<'PY' > "$e/RESULT_RAW.log"
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1]);names=('DOWNLOAD','HASH','AUDIT','TEST','COMPILE','PRIVACY','DIFF')
          result={'schema':'v13.run116.original_native_independent_audit.v1',
                  'auditor_head':(e/'AUDITOR_HEAD.txt').read_text().strip(),
                  'original_native_head':'df08a4ce311317bdfd322ba7c7520d9fe8fb2b93',
                  'original_artifact_id':13051756857,
                  'original_sha256':'71de9bb7bc2899f5aee67f58b55d13514d0a9b0d870cd98ae5e8f2f1850d11c5',
                  'exits':{n:int((e/(n+'_EXIT.txt')).read_text()) for n in names},
                  'native_executed_this_run':False,
                  'native_original_audited':(e/'AUDIT_EXIT.txt').read_text().strip()=='0',
                  'redmi_measured':False,'step2_promoted':False,
                  'b3_promoted':False,'body_jepa_promoted':False}
          (e/'RESULT.json').write_text(json.dumps(result,sort_keys=True)+'\n')
          print(json.dumps(result,sort_keys=True))
          PY
          # Do not duplicate or republish original native artifact in this
          # receipt. The original is retained in its native Actions run and
          # separately byte-verified in the private user Library.
          rm -f "$e/ORIGINAL_RUN116.zip"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat "$e/RESULT_RAW.log"
          tail -n 12 "$e/ORIGINAL_AUDIT_RAW.log"
          for rc in "$download_rc" "$hash_rc" "$audit_rc" "$test_rc" "$compile_rc" "$privacy_rc" "$diff_rc"; do test "$rc" -eq 0; done
      - name: Preserve independent original audit GREEN or RED receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run116-original-native-audit-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run116-original-audit/
          if-no-files-found: warn
          retention-days: 90
