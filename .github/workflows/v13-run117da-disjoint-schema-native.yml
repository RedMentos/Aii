name: V13 Run117DA pinned disjoint 48-arm source-only C3 schema ablation
on:
  push:
    branches:
      - assistant/v13-run117da-disjoint-schema-ablation-20261101-gpt6
    paths:
      - v13/code/docs/RUN117DA_NATIVE_LAUNCH_20261101.md
permissions:
  contents: read
concurrency:
  group: v13-native-c3-ag12-20261030
  cancel-in-progress: false
jobs:
  serial-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      V13_NO_AUTOSTART: '1'
      DO_NOT_TRACK: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      NEEDLE_TELEMETRY: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact pinned public models, 48 serial C3 calls, original raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run117da-native"
          installed="$RUNNER_TEMP/v13-run117da-installed"
          modeldir="$RUNNER_TEMP/v13-run117da-qwen"
          mkdir -p "$e" "$modeldir"
          git rev-parse HEAD > "$e/HEAD.txt"
          test "$(git hash-object v13/code/docs/PREREG_RUN117DA_DISJOINT_SCHEMA_ABLATION_20261101.md)" = 11eb96c6b12df389b453bae2bb10e0fe403f285b
          echo "$?" > "$e/PREREG_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run117da-native-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run117da-native-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' 'psutil==7.0.0' 'PyYAML==6.0.2' 'Pillow==11.3.0' 'prompt-toolkit==3.0.52' 'huggingface_hub==0.35.3' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
          echo "$?" > "$e/PIP_CHECK_EXIT.txt"
          python3 -m py_compile v13/code/scripts/run117da_disjoint_schema_fixture.py v13/code/scripts/run117da_source_only_preflight.py v13/code/scripts/run117da_disjoint_schema_native.py v13/code/tests/test_run117da_disjoint_schema_native.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ] && [ "$(cat "$e/PREREG_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout 300s env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_run117da_source_only_preflight tests.test_run117da_disjoint_schema_native) > "$e/PREFLIGHT_RAW.log" 2>&1
            echo "$?" > "$e/PREFLIGHT_EXIT.txt"
          else
            echo 99 > "$e/PREFLIGHT_EXIT.txt";echo PREREQUISITE_RED > "$e/PREFLIGHT_RAW.log"
          fi
          if [ "$(cat "$e/PREFLIGHT_EXIT.txt")" = 0 ]; then
            (cd v13/code && env PYTHONPATH=.:tests:scripts "$py" scripts/run93_source_c3_native_e2e.py --home "$installed" --install) > "$e/INSTALL_RAW.log" 2>&1
            echo "$?" > "$e/INSTALL_EXIT.txt"
          else
            echo 99 > "$e/INSTALL_EXIT.txt";echo PREFLIGHT_RED > "$e/INSTALL_RAW.log"
          fi
          if [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ]; then
            "$py" - "$modeldir" <<'PY' > "$e/QWEN_RAW.log" 2>&1
          from huggingface_hub import hf_hub_download
          from pathlib import Path
          import hashlib,shutil,sys
          dest=Path(sys.argv[1])/'Qwen3.5-0.8B-Q4_0.gguf'
          cached=hf_hub_download(repo_id='ggml-org/Qwen3.5-0.8B-GGUF',
              revision='8fea620810c4afa23dd6443f999a48574c1611a3',
              filename='Qwen3.5-0.8B-Q4_0.gguf')
          shutil.copyfile(cached,dest)
          assert not dest.is_symlink() and dest.stat().st_size==563036064
          h=hashlib.sha256(dest.read_bytes()).hexdigest()
          assert h=='57d1997790d1744fba5b40a7317df71ea5e2acee28c47e78f0cce39c0703f8cf',h
          print('QWEN_PINNED_MODEL_BYTES_VERIFIED',h)
          PY
            echo "$?" > "$e/QWEN_EXIT.txt"
          else
            echo 99 > "$e/QWEN_EXIT.txt";echo INSTALL_RED > "$e/QWEN_RAW.log"
          fi
          if [ "$(cat "$e/QWEN_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=10s 3300s env PYTHONPATH=.:tests:scripts "$py" scripts/run117da_disjoint_schema_native.py --installed "$installed" --qwen "$modeldir/Qwen3.5-0.8B-Q4_0.gguf" --out "$e/NATIVE_CASE") > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else
            echo 99 > "$e/NATIVE_EXIT.txt";echo QWEN_RED > "$e/NATIVE_RAW.log"
          fi
          if [ -f "$e/NATIVE_CASE/report.json" ]; then
            "$py" - "$e/NATIVE_CASE/report.json" <<'PY' > "$e/VERIFY_RAW.log" 2>&1
          import json,sys,hashlib
          r=json.load(open(sys.argv[1]))
          assert r['schema']=='v13.run117da.disjoint_source_only_schema_ablation_native.v1'
          assert r['seed']==117053 and r['table_sha256']=='78ec82002dafa54bcd9bb09456a0351123d2974bf12222fa6b20794d44f2edfb'
          assert len(r['rows'])<=12 and r['model_callback_attempts']<=48
          assert r['age0']=='RECORD_ONLY' and r['step2']=='UTILITY_FAIL'
          assert r['b3']=='NO_PROMOTION' and r['body_jepa']=='UNAVAILABLE'
          assert r['jepa_weight']==0 and r['redmi_measured'] is False
          assert r['whole_system_complete'] is False and r['output_committed'] is False
          assert r['learning_authority']==r['delivery_authority']==r['tool_dispatches']==0
          assert r['native_body_calls']==r['native_c2_calls']==r['native_jef_calls']==0
          for row in r['rows']:
              assert len(row['arms'])<=4
              for arm in row['arms']:
                  assert arm['model'] in ('lfm25_350m','qwen35_0p8b')
                  assert arm['mode'] in ('SCHEMA','UNCONSTRAINED')
                  assert arm['raw_sha256']==hashlib.sha256(arm['native_output'].encode()).hexdigest()
                  if arm['status']=='RECORDED':
                      assert arm['native_final'] and arm['process_reaped']
          if r['status']!='STRUCTURAL_RED':
              assert r['native_proof'] and r['native_calls_verified']==48
              assert r['summary']['complete_native_receipts']
          print(json.dumps({'status':r['status'],'summary':r.get('summary'),
                            'native_calls_verified':r['native_calls_verified']},sort_keys=True))
          PY
            echo "$?" > "$e/VERIFY_EXIT.txt"
          else
            echo 99 > "$e/VERIFY_EXIT.txt";echo NO_NATIVE_REPORT > "$e/VERIFY_RAW.log"
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 1719870530b7b7702660f9518dcf5b556077e811 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 1719870530b7b7702660f9518dcf5b556077e811 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original native GREEN or RED, no weights
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117da-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117da-native/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce all native stages without waivers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117da-native"
          for stage in PREREG VENV DEPS PIP_CHECK COMPILE PREFLIGHT INSTALL QWEN NATIVE VERIFY PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw preserved"
              tail -60 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN117DA_NATIVE_SCHEMA_ABLATION_NONPROMOTING
