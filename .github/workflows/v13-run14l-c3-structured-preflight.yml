name: V13 Run14L C3 structured native source-only preflight
on:
  push:
    branches: [assistant/v13-run14l-c3-structured-native-20261030-2008]
    paths:
      - '.github/workflows/v13-run14l-c3-structured-preflight.yml'
permissions:
  contents: read
jobs:
  source-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check source pins, synthetic tests, compile, privacy and diff
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run14l-preflight"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          27f290a1cf519eb9b053b6acacb53f62ea5612fb v13/code/docs/RUN14L_C3_STRUCTURED_NATIVE_PREREG_20261030.md
          f9023c1d5e575279f333b4b99f0bb8bdea110e84 v13/code/docs/fixtures/run14l_c3_structured_seed307_20261030.json
          0dd1aa6db41c1258e13d4108316bcd850af3f589 v13/code/scripts/run14l_c3_structured_native.py
          711d789b466b5974b964e7d5faf10dc93453d458 v13/code/scripts/run14l_c3_structured_native_verify.py
          62af10d15de656316be8236534c48b82da70df16 v13/code/tests/test_run14l_c3_structured_native.py
          41ae26e01932ea7e89188e3a544bef103f1b3ec6 v13/code/v13/agi/c3_structured_source_shadow_run14k.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=. python3 -m unittest -v tests.test_run14l_c3_structured_native tests.test_c3_structured_source_shadow_run14k tests.test_run13t_c3_verbatim_heldout) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m py_compile v13/code/scripts/run14l_c3_structured_native.py v13/code/scripts/run14l_c3_structured_native_verify.py v13/code/tests/test_run14l_c3_structured_native.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 033cd9326cb2c7b8329f577b8eb32ded3839987c --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 033cd9326cb2c7b8329f577b8eb32ded3839987c HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve all original source preflight raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run14l-preflight-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run14l-preflight/
          retention-days: 30
          if-no-files-found: error
      - name: Fail closed on any stage
        if: always()
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run14l-preflight"
          for stage in PINS TEST COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              tail -80 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
