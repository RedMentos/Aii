name: V13 Run71 exact-blob C3 schema cross-package software integration
on:
  push:
    branches: [assistant/v13-run71-c3-crosspackage-integration-20261031-run11]
    paths: ['.github/workflows/v13-run71-c3-crosspackage-integration.yml']
permissions:
  contents: read
concurrency:
  group: v13-run71-c3-crosspackage-software
  cancel-in-progress: false
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact immutable donors, five real Store suites, privacy and raw evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run71-integration"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          270d309e8650975959d0f5402b190838bcc41ab4 v13/code/docs/RUN71_C3_CROSSPACKAGE_INTEGRATION_PREREG_20261031.md
          3b6b79c7eded3b812d27fb594ceda9afd3fd9464 v13/code/scripts/jef_c3_schema_fixture_727.py
          cf9822ca0af0d00780d53e5b4824aa239dcd8ead v13/code/scripts/jef_c3_source_reasoning_fixture_743.py
          fa3922dbf7e1e39c78257529b6ccf107aeb48d81 v13/code/tests/test_jef_c3_source_reasoning_fixture_743.py
          e9457dd6091a7201ecd6f19ad82632835aa43ddb v13/code/scripts/run70_c3_source_reasoning_native_743.py
          9ea19808e52fd7a727df1e5d6d18be63d9c679ba v13/code/scripts/run70_c3_source_reasoning_verify.py
          f28c173cad37019e962cae5d76a5f795cc01fa37 v13/code/tests/test_run70_c3_source_reasoning_verify.py
          ee976c0329ad751b4851862680e6fe6f9ee66e82 v13/code/v13/jef_c3_schema_draft_candidate.py
          25ad2234b353b58ad06bcc505b6ca05f527c0add v13/code/scripts/jef_c3_c5_c6_operator_cli.py
          9b11075e2f7820ea0f571226fed6dcbd0ab145ed v13/code/tests/test_jef_c3_schema_draft_candidate.py
          18aaaa86f416a1df9a703b86b9d12215ad1c00c5 v13/code/v13/jef_c3_schema_source_recheck_shadow.py
          c47a6ea2ef47e01b43c6320c60de1280e33607bf v13/code/tests/test_jef_c3_schema_source_recheck_shadow.py
          d56984141128ea9299d4c2a53baae9e8dc5097df v13/code/tests/test_run71_schema_crosspackage_integration.py
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run71-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run71-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            for t in test_jef_c3_schema_source_recheck_shadow.py test_jef_c3_schema_draft_candidate.py test_jef_c3_c5_c6_operator_cli.py test_jef_c3_source_reasoning_fixture_743.py test_run70_c3_source_reasoning_verify.py test_run71_schema_crosspackage_integration.py; do
              key="${t%.py}"
              timeout --signal=TERM --kill-after=5s 6m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m unittest discover -s v13/code/tests -p "$t" -v > "$e/${key}_RAW.log" 2>&1
              echo "$?" > "$e/${key}_EXIT.txt"
            done
          else
            for t in test_jef_c3_schema_source_recheck_shadow.py test_jef_c3_schema_draft_candidate.py test_jef_c3_c5_c6_operator_cli.py test_jef_c3_source_reasoning_fixture_743.py test_run70_c3_source_reasoning_verify.py test_run71_schema_crosspackage_integration.py; do
              key="${t%.py}"; echo SKIPPED > "$e/${key}_RAW.log"; echo 99 > "$e/${key}_EXIT.txt"
            done
          fi
          python3 -m compileall -q v13/code/v13/jef_c3_schema_source_recheck_shadow.py v13/code/v13/jef_c3_schema_draft_candidate.py v13/code/scripts/jef_c3_c5_c6_operator_cli.py v13/code/scripts/jef_c3_source_reasoning_fixture_743.py v13/code/scripts/run70_c3_source_reasoning_native_743.py v13/code/scripts/run70_c3_source_reasoning_verify.py v13/code/tests/test_run71_schema_crosspackage_integration.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 07b5227655528627262736ae91844d5cd3767cf8 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 07b5227655528627262736ae91844d5cd3767cf8 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Retain original integrated raw including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run71-integration-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run71-integration/
          if-no-files-found: error
          retention-days: 90
      - name: Require all donor and suite checks
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-run71-integration"
          for s in PINS VENV DEPS test_jef_c3_schema_source_recheck_shadow test_jef_c3_schema_draft_candidate test_jef_c3_c5_c6_operator_cli test_jef_c3_source_reasoning_fixture_743 test_run70_c3_source_reasoning_verify test_run71_schema_crosspackage_integration COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN71_EXACT_BLOB_CROSSPACKAGE_SOFTWARE_ONLY_NO_NATIVE_OR_AGE_PROMOTION
