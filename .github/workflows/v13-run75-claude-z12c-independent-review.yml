name: V13 Run75 independent Claude Z12c slot World-JEPA review
on:
  push:
    branches: [codex/automation11-run75-claude-z12c-independent-review-20261028]
  pull_request:
    branches: [claude/project-thread-puk36d]
permissions:
  contents: read
concurrency:
  group: v13-run75-${{ github.ref }}
  cancel-in-progress: true
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      V13_NO_AUTOSTART: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Capture Run75 source-bound evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run75"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          for p in v13/code/docs/proofs/continuation-20261028/RUN75_CLAUDE_Z12C_INDEPENDENT_REVIEW_PREREG.md v13/code/v13/world_jepa_slots.py v13/code/v13/world_jepa.py v13/code/tests/test_world_jepa_slots.py v13/code/scripts/z12c_slot_world_jepa.py v13/code/docs/proofs/continuation-20261027/z12c-slot-world-jepa/PREREG.md v13/code/docs/proofs/continuation-20261027/z12c-slot-world-jepa/BEFUND.md; do git hash-object "$p" | xargs -I{} echo "{} $p"; done > "$e/FROZEN_RAW.log"
          if [ "$(git hash-object v13/code/docs/proofs/continuation-20261028/RUN75_CLAUDE_Z12C_INDEPENDENT_REVIEW_PREREG.md)" = dae6c45e80e695cd0c4f06402468133a363cea8f ] && [ "$(git hash-object v13/code/v13/world_jepa_slots.py)" = 95de5e4b0c18f75a987b8602626a90257cde730d ] && [ "$(git hash-object v13/code/v13/world_jepa.py)" = 470377f999ccd250be284e674e4b8f165942889b ] && [ "$(git hash-object v13/code/tests/test_world_jepa_slots.py)" = f326460707ebf54696f684b2592f7c186eff46af ] && [ "$(git hash-object v13/code/scripts/z12c_slot_world_jepa.py)" = c3c32733bc22d22e06c0b790801f9c37b4fe9e5b ] && [ "$(git hash-object v13/code/docs/proofs/continuation-20261027/z12c-slot-world-jepa/PREREG.md)" = f95ff01dcf94e061bb0740645f5f7a60953a8193 ] && [ "$(git hash-object v13/code/docs/proofs/continuation-20261027/z12c-slot-world-jepa/BEFUND.md)" = 2285963511330687def1af15df698f8866eaf3f5 ]; then echo 0 > "$e/FROZEN_EXIT.txt"; else echo 1 > "$e/FROZEN_EXIT.txt"; fi
          python3 -m venv "$RUNNER_TEMP/v13-run75-venv"
          py="$RUNNER_TEMP/v13-run75-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' > "$e/NUMPY_RAW.log" 2>&1
          echo "$?" > "$e/NUMPY_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 180s env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_world_jepa_slots tests.test_world_jepa tests.test_world_jepa_action_permutation_control) > "$e/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$e/FOCUSED_EXIT.txt"
          python3 -m compileall -q v13/code/v13/world_jepa_slots.py v13/code/v13/world_jepa.py v13/code/tests/test_world_jepa_slots.py v13/code/scripts/z12c_slot_world_jepa.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
            first=$?
            "$py" -m pip install --disable-pip-version-check --no-input 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
            second=$?
            "$py" -m pip install --disable-pip-version-check --no-input 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
            third=$?
            if [ "$first" = 0 ] && [ "$second" = 0 ] && [ "$third" = 0 ]; then
              echo 0 > "$e/INSTALL_EXIT.txt"
              (cd v13/code && timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=.:tests "$py" -m unittest discover -s tests -p 'test_*.py' -q) > "$e/FULL_RAW.log" 2>&1
              echo "$?" > "$e/FULL_EXIT.txt"
            else
              echo 1 > "$e/INSTALL_EXIT.txt"
              echo SKIPPED_PREREQ_RED > "$e/FULL_RAW.log"
              echo SKIPPED_RED > "$e/FULL_EXIT.txt"
            fi
          else
            for n in INSTALL FULL; do echo SKIPPED_FOCUSED_RED > "$e/${n}_RAW.log"; echo SKIPPED_RED > "$e/${n}_EXIT.txt"; done
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 7471a7fb61d453b2aa6c9500b896cfb564010a90 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 7471a7fb61d453b2aa6c9500b896cfb564010a90 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - name: Preserve original Run75 raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run75-claude-z12c-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run75/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce Run75 source-only gates
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run75"
          for n in FROZEN NUMPY FOCUSED COMPILE INSTALL FULL PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; original raw retained; no B2/JEPA/native/gate promotion"
              tail -40 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN75_CLAUDE_Z12C_INDEPENDENT_SOFTWARE_REVIEW
