name: V13 Context OS warm F5 authority (software only)
on:
  push:
    branches: [assistant/v13-context-warm-f5-review-20261027]
    paths:
      - '.github/workflows/context-warm-f5-review-20261027.yml'
      - 'v13/code/v13/context_os.py'
      - 'v13/code/tests/test_context_warm_authority_run271.py'
permissions:
  contents: read
concurrency:
  group: v13-context-warm-f5-review-20261027
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Actual Context warm F5 source and full software proof
        shell: bash
        run: |
          set +e
          evidence="$RUNNER_TEMP/v13-context-warm-f5"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/HEAD.txt"
          git show -s --format='%P' HEAD > "$evidence/PARENTS.txt"
          for item in \
            "v13/code/v13/context_os.py:127af0b872bfce002c6dd72020a22574f52691e8" \
            "v13/code/v13/memory.py:501c8f43c92f031e034e4b93f4adbd4c67b7edfe" \
            "v13/code/tests/test_context_warm_authority_run271.py:cc1423c7f4961b038f073c77ceec6a31cbc99a43"; do
            path="${item%%:*}"; expected="${item##*:}"
            observed="$(git hash-object "$path")"
            printf '%s %s %s\n' "$path" "$expected" "$observed" >> "$evidence/BLOBS.txt"
            if [ "$observed" != "$expected" ]; then echo "$path" >> "$evidence/BLOB_MISMATCH.txt"; fi
          done
          if [ -s "$evidence/BLOB_MISMATCH.txt" ]; then echo 1 > "$evidence/BLOBS_EXIT.txt"; else echo 0 > "$evidence/BLOBS_EXIT.txt"; fi
          python3 -m venv "$RUNNER_TEMP/v13-context-warm-f5-venv"
          py="$RUNNER_TEMP/v13-context-warm-f5-venv/bin/python"
          "$py" -m pip install --no-input -q 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu > "$evidence/INSTALL_RAW.log" 2>&1
          first=$?
          "$py" -m pip install --no-input -q 'numpy==2.2.6' 'psutil' 'PyYAML' 'Pillow' 'transformers==5.20.2' 'peft==0.21.2' >> "$evidence/INSTALL_RAW.log" 2>&1
          second=$?
          if [ "$first" -eq 0 ] && [ "$second" -eq 0 ]; then echo 0; else echo 1; fi > "$evidence/INSTALL_EXIT.txt"
          (
            cd v13/code
            timeout --signal=TERM --kill-after=10s 7m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_context_warm_authority_run271 tests.test_memory_human_decision_lineage_run270 tests.test_episodic_route_f5_authority_run279 tests.test_context_os tests.test_semantic_memory tests.test_episodic_route tests.test_route_supersede tests.test_executive_context
          ) > "$evidence/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$evidence/FOCUSED_EXIT.txt"
          (
            cd v13/code
            timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=.:tests "$py" -m unittest discover -s tests -p 'test_*.py' -q
          ) > "$evidence/FULL_RAW.log" 2>&1
          echo "$?" > "$evidence/FULL_EXIT.txt"
          python3 -m compileall -q v13/code/v13 > "$evidence/COMPILE_RAW.log" 2>&1
          echo "$?" > "$evidence/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 893ae11f0b16ea3e39b56dc2c4a173ad794715b1 --head HEAD > "$evidence/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$evidence/PRIVACY_EXIT.txt"
          git diff --check 893ae11f0b16ea3e39b56dc2c4a173ad794715b1 HEAD > "$evidence/DIFF_RAW.log" 2>&1
          echo "$?" > "$evidence/DIFF_EXIT.txt"
          (cd "$evidence" && sha256sum * > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-context-warm-f5-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-context-warm-f5/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce every raw exit without authority promotion
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/v13-context-warm-f5"
          for name in BLOBS INSTALL FOCUSED FULL COMPILE PRIVACY DIFF; do
            if [ "$(cat "$evidence/${name}_EXIT.txt")" != 0 ]; then
              echo "$name FAILED; raw evidence retained"
              tail -90 "$evidence/${name}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'CONTEXT_WARM_F5_SOFTWARE_ONLY_NO_GATE_PROMOTION'
