name: V13 seed83 German native SHADOW source-only preflight
on:
  push:
    branches:
      - 'assistant/v13-de83-native-shadow-cohort-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Source-pin tests, compile and privacy evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/de83-preflight"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/de83-preflight-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/de83-preflight-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          (cd v13/code && timeout 3m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_listarith_de83_native_shadow_20261030 tests.test_listarith_de83_native_shadow_audit_20261030 tests.test_listarith_de_shadow_pipeline_20261030 tests.test_listarith_de_seed79_native_posthoc_replay_20261030) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          "$py" -m py_compile v13/code/scripts/listarith_de83_native_shadow.py v13/code/scripts/listarith_de83_native_shadow_audit.py v13/code/tests/test_listarith_de83_native_shadow_20261030.py v13/code/tests/test_listarith_de83_native_shadow_audit_20261030.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 22cbd1bcd4e31091eb6a4f3e0bb5d818367b339b --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 22cbd1bcd4e31091eb6a4f3e0bb5d818367b339b HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-de83-preflight-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/de83-preflight/
          retention-days: 30
          if-no-files-found: error
      - name: Gate software only
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/de83-preflight"
          for stage in VENV DEPS TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; raw preserved"
              tail -60 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
          echo "SEED83_SOURCE_ONLY_NO_NATIVE_AGE_STEP2_B3_JEPA_REDMI_PROMOTION"
