name: V13 Run13R 350M JEPA dose/heldout software prereg preflight
on:
  push:
    branches: [assistant/v13-run13r-bjepa-scale-heldout-20261030-auto11]
    paths:
      - '.github/workflows/v13-run13r-bjepa-scale-preflight.yml'
      - 'v13/code/scripts/bodyjepa_350m_scale_heldout_run13r.py'
      - 'v13/code/tests/test_bodyjepa_350m_scale_heldout_run13r.py'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve all source-only tests and raw exits
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run13r-preflight"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/CANON_BLOB.txt"
          git hash-object v13/code/v13/body_jepa.py > "$e/BJEPA_BLOB.txt"
          git hash-object v13/code/v13/body_jepa_contrastive_shadow.py > "$e/LOSS_BLOB.txt"
          git hash-object v13/code/v13/body_jepa_contrastive_trainer_shadow.py > "$e/TRAINER_BLOB.txt"
          git hash-object v13/code/scripts/bodyjepa_350m_contrastive_disjoint_run12c.py > "$e/ORIGINAL_RUN12C_BLOB.txt"
          git hash-object v13/code/scripts/bodyjepa_350m_scale_heldout_run13r.py > "$e/PROBE_BLOB.txt"
          git hash-object v13/code/tests/test_bodyjepa_350m_scale_heldout_run13r.py > "$e/TEST_BLOB.txt"
          git hash-object v13/code/docs/RUN13R_BJEPA_SCALE_HELDOUT_PREREG_20261030.md > "$e/PREREG_BLOB.txt"
          test "$(cat "$e/CANON_BLOB.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7 &&
          test "$(cat "$e/BJEPA_BLOB.txt")" = b560d4e88fe457f381e89dfc5d6188a8ec3b306b &&
          test "$(cat "$e/LOSS_BLOB.txt")" = acd40aeac9e286e93b40bda72c655c17725a522e &&
          test "$(cat "$e/TRAINER_BLOB.txt")" = a31a18d9be0b1137a10304f24d3a241d720bd247 &&
          test "$(cat "$e/ORIGINAL_RUN12C_BLOB.txt")" = 15597550100de6ca546b1b024fbc6597fc600839 &&
          test "$(cat "$e/PROBE_BLOB.txt")" = 5d665c09909ae77eeb12bf038a053232371abcb8 &&
          test "$(cat "$e/TEST_BLOB.txt")" = ac3a38192de0c5dd6cde632746da4e191d196adf &&
          test "$(cat "$e/PREREG_BLOB.txt")" = c979514672c01d74999868c307a46d3be8ba455d
          echo "$?" > "$e/SOURCE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run13r-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run13r-venv/bin/python"
          "$py" -m pip install --no-input --disable-pip-version-check --timeout 90 --retries 2 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu > "$e/TORCH_RAW.log" 2>&1
          echo "$?" > "$e/TORCH_EXIT.txt"
          "$py" -m pip install --no-input --disable-pip-version-check --timeout 90 --retries 2 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
          echo "$?" > "$e/PIP_CHECK_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_bodyjepa_350m_scale_heldout_run13r tests.test_bodyjepa_350m_contrastive_disjoint_run12c tests.test_body_jepa_contrastive_shadow_run12a) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          "$py" -m py_compile v13/code/scripts/bodyjepa_350m_scale_heldout_run13r.py v13/code/tests/test_bodyjepa_350m_scale_heldout_run13r.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 82cd958abb0c0874f1451dfc094f4bd3b2eb615a --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 82cd958abb0c0874f1451dfc094f4bd3b2eb615a HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve raw even when RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run13r-preflight-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run13r-preflight/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce every stage without waivers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run13r-preflight"
          for stage in SOURCE VENV TORCH DEPS PIP_CHECK TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained"
              tail -90 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'RUN13R_SOURCE_ONLY_GREEN_NO_NATIVE_OR_UTILITY'
