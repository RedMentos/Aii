name: V13 Z1 full-suite historical RED differential diagnostic
on:
  push:
    branches: [codex/automation11-z1-gate-evidence-type-20261027]
    paths:
      - '.github/workflows/z1-gate-fullsuite-differential.yml'
      - 'v13/code/v13/gates.py'
      - 'v13/code/scripts/measure_suite.py'
      - 'v13/code/tests/test_z1_gate_evidence_type.py'
permissions:
  contents: read
concurrency:
  group: v13-z1-gate-fullsuite-differential
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.sha }}
      - name: Isolated software-only dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/z1-fullsuite-venv"
          timeout 240s "$RUNNER_TEMP/z1-fullsuite-venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Capture original broad RED without suppressing tests
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/z1-fullsuite"
          git rev-parse HEAD > "$RUNNER_TEMP/z1-fullsuite/HEAD.txt"
          sha256sum v13/code/v13/gates.py v13/code/scripts/measure_suite.py v13/code/tests/test_z1_gate_evidence_type.py > "$RUNNER_TEMP/z1-fullsuite/SOURCE_SHA256.txt"
          (cd v13/code && PYTHONPATH="$PWD:$PWD/scripts" timeout 900s "$RUNNER_TEMP/z1-fullsuite-venv/bin/python" -m unittest discover -s tests -p 'test_*.py' -v) > "$RUNNER_TEMP/z1-fullsuite/UNIT_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/z1-fullsuite/UNIT_EXIT.txt"
          "$RUNNER_TEMP/z1-fullsuite-venv/bin/python" - <<'PY' > "$RUNNER_TEMP/z1-fullsuite/FAILURE_SIGNATURE.json"
          import hashlib,json,re
          from pathlib import Path
          lines=Path(__import__('os').environ['RUNNER_TEMP']+'/z1-fullsuite/UNIT_RAW.log').read_text(errors='replace').splitlines()
          headers=sorted(x.strip() for x in lines if x.startswith('FAIL: ') or x.startswith('ERROR: '))
          summary=[x.strip() for x in lines if re.search(r'Ran [0-9]+ tests|FAILED \(|^OK$',x)]
          print(json.dumps({'failure_headers':len(headers),'failure_header_sha256':hashlib.sha256(('\n'.join(headers)+'\n').encode()).hexdigest(),'summary_tail':summary[-5:]},sort_keys=True))
          PY
          "$RUNNER_TEMP/z1-fullsuite-venv/bin/python" -m compileall -q v13/code/v13 v13/code/scripts > "$RUNNER_TEMP/z1-fullsuite/COMPILE_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/z1-fullsuite/COMPILE_EXIT.txt"
          "$RUNNER_TEMP/z1-fullsuite-venv/bin/python" v13/code/scripts/public_repo_privacy_scan.py --base 9eae3cc175512382038cc5f55887e7a8dbc9797f --head HEAD > "$RUNNER_TEMP/z1-fullsuite/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/z1-fullsuite/PRIVACY_EXIT.txt"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: z1-fullsuite-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/z1-fullsuite/
          if-no-files-found: error
      - name: Enforce source hygiene only; retain historical RED
        run: |
          set -euo pipefail
          for n in COMPILE PRIVACY; do
            test "$(cat "$RUNNER_TEMP/z1-fullsuite/${n}_EXIT.txt")" = 0 || { cat "$RUNNER_TEMP/z1-fullsuite/${n}_RAW.log"; exit 1; }
          done
          echo "Broad unit exit: $(cat "$RUNNER_TEMP/z1-fullsuite/UNIT_EXIT.txt")"
          cat "$RUNNER_TEMP/z1-fullsuite/FAILURE_SIGNATURE.json"
