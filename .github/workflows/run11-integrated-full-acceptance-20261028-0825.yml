          set +e
          e="$RUNNER_TEMP/v13-integrated-full-acceptance"
          home="$RUNNER_TEMP/v13-integrated-full-acceptance-home"
          py="$RUNNER_TEMP/v13-integrated-full-acceptance-venv/bin/python"
          if [ "$(cat "$e/MODEL_VERIFY_EXIT.txt")" != 0 ]; then
            echo SKIPPED_PREREQ_RED > "$e/CHUNK15_RAW.log"
            echo SKIPPED_RED > "$e/CHUNK15_EXIT.txt"
            echo SKIPPED_RED > "$e/CHUNK15_CHECK_EXIT.txt"
          else
            live="$(cat "$e/ACCEPTANCE_DIR.txt" 2>/dev/null)"
            if [ "-n "$live"" ]; then
              (cd v13/code && timeout --signal=INT --kill-after=15s 13m env PYTHONPATH=. "$py" scripts/acceptance.py --installed-home "$home" --archive-dir "$e/archive" --resume "$live" --stage-limit 15) > "$e/CHUNK15_RAW.log" 2>&1
