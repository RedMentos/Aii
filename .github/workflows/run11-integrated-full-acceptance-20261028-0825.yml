            if [ "-n "$live"" ]; then
              (cd v13/code && timeout --signal=INT --kill-after=15s 13m env PYTHONPATH=. "$py" scripts/acceptance.py --installed-home "$home" --archive-dir "$e/archive" --resume "$live" --stage-limit 10) > "$e/CHUNK10_RAW.log" 2>&1
              echo "$?" > "$e/CHUNK10_EXIT.txt"
            else
