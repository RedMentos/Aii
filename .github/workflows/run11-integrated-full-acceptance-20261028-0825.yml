        run: |
          set +e
          e="$RUNNER_TEMP/v13-integrated-full-acceptance"
          home="$RUNNER_TEMP/v13-integrated-full-acceptance-home"
          py="$RUNNER_TEMP/v13-integrated-full-acceptance-venv/bin/python"
          if [ "$(cat "$e/MODEL_VERIFY_EXIT.txt")" != 0 ]; then
