name: V13 Run83 pinned native C3 dual-source body interference seed839
on:
  push:
    branches: [assistant/v13-run83-c3-body-hypothesis-interference-native-20261031-gpt6]
    paths: ['.github/workflows/v13-run83-c3-interference-native.yml']
permissions:
  contents: read
concurrency:
  group: v13-native-c3-ag12-20261030
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check exact sources, bootstrap pinned C3 and run twelve serialized calls
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run83-native"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          ced10a86c3b32c9f7c35b55b50eb63119bc58245 v13/code/docs/RUN83_C3_DUAL_SOURCE_INTERFERENCE_NATIVE_PREREG_20261031.md
          a590a359df5b2baed2c622c949ed9c793e185265 v13/code/scripts/jef_body_c3_interference_fixture_839.py
          68dcb88818c7c4efb2bb3297d2d0c93c140d9362 v13/code/scripts/run83_jef_body_c3_interference_native.py
          cbff89068e4614fb0f3365bea21790048fd4e2e5 v13/code/scripts/run83_jef_body_c3_interference_verify.py
          0ca7198e8e872d9a4c56b0c058fd33d2f4a79965 v13/code/tests/test_run83_c3_interference_verify.py
          317024871a96c9dc390fe5c1c94032658f790b40 v13/code/v13/jef_b1b2_c3_dual_source_shadow.py
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run83-native-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run83-native-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo SKIPPED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m unittest tests.test_run83_c3_interference_verify tests.test_run82_jef_b1b2_c3_dual_source -v > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          export V13_HOME="$RUNNER_TEMP/v13-run83-native-home"
          if [ "$(cat "$e/TEST_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 15m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m v13.bootstrap --home "$V13_HOME" > "$e/BOOTSTRAP_RAW.log" 2>&1
            echo "$?" > "$e/BOOTSTRAP_EXIT.txt"
          else echo SKIPPED > "$e/BOOTSTRAP_RAW.log"; echo 99 > "$e/BOOTSTRAP_EXIT.txt"; fi
          if [ "$(cat "$e/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 42m env PYTHONPATH=v13/code:v13/code/scripts "$py" v13/code/scripts/run83_jef_body_c3_interference_native.py --home "$V13_HOME" --out "$e/pilot" > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else echo SKIPPED > "$e/NATIVE_RAW.log"; echo 99 > "$e/NATIVE_EXIT.txt"; fi
          if [ -f "$e/pilot/report.json" ]; then
            env PYTHONPATH=v13/code:v13/code/scripts "$py" v13/code/scripts/run83_jef_body_c3_interference_verify.py "$e/pilot/report.json" > "$e/VERIFY_RAW.log" 2>&1
            echo "$?" > "$e/VERIFY_EXIT.txt"
          else echo NO_REPORT > "$e/VERIFY_RAW.log"; echo 99 > "$e/VERIFY_EXIT.txt"; fi
          python3 -m compileall -q v13/code/scripts/jef_body_c3_interference_fixture_839.py v13/code/scripts/run83_jef_body_c3_interference_native.py v13/code/scripts/run83_jef_body_c3_interference_verify.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base e3ab533ecd0109c26f7d00d6189f01d9704739bc --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check e3ab533ecd0109c26f7d00d6189f01d9704739bc HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Retain original Linux-native raw, including negative or failed rows
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run83-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run83-native/
          if-no-files-found: error
          retention-days: 90
      - name: Require all engineering and independent evidence checks
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-run83-native"
          for s in PINS VENV DEPS TEST BOOTSTRAP NATIVE VERIFY COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || { tail -n 60 "$e/NATIVE_RAW.log"; tail -n 60 "$e/VERIFY_RAW.log"; exit 1; }
          done
          echo RUN83_NATIVE_ENGINEERING_COMPLETE_DIAGNOSTIC_SCORE_MAY_BE_RED
