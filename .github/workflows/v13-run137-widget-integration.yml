name: V13 Run137 integrate Run127 Widget quoting on frozen-runtime chain
on:
  pull_request:
    paths:
      - ".github/workflows/v13-run137-widget-integration.yml"
      - "v13/code/KNOEPFE_EINRICHTEN.sh"
      - "v13/code/tests/test_widget_installer_quoting_run127.py"
      - "v13/code/docs/proofs/continuation-20261025/widget-quote-integration-run137/**"
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Official privacy
        run: |
          set -euo pipefail
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "$(git rev-parse HEAD^1)" --head HEAD --no-worktree
  software:
    needs: privacy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exact upstream source and frozen Runtime guards
        run: |
          set -euo pipefail
          test "$(git hash-object v13/code/KNOEPFE_EINRICHTEN.sh)" = 744ef9cbf20bb096eb8222c010d2bd28f8fe7ab2
          test "$(git hash-object v13/code/tests/test_widget_installer_quoting_run127.py)" = fccc0f240fb521211baf35bb2774d2c7d74caf5c
          test "$(git hash-object v13/code/v13/runtime.py)" = a691d27bd0772a4fa1f03d57ec90663237bf6825
          bash -n v13/code/KNOEPFE_EINRICHTEN.sh
          cd v13/code
          PYTHONPATH=. python3 -m unittest -v tests.test_widget_installer_quoting_run127 tests.test_phone_halt tests.test_phone_prestart_run128 tests.test_age0d_answer_arithmetic_run134 tests.test_hx2_paired_run135
