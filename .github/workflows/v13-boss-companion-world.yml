name: V13 Boss typed companion to WorldJEPA E2E
on:
  push:
    branches:
      - boss/v13-operator-companion-world-20261111-1445
  pull_request:
    paths:
      - 'v13/code/v13/android_operator_world.py'
      - 'v13/code/v13/android_companion_registry.py'
      - 'v13/code/tests/test_android_operator_world.py'
      - 'v13/code/tests/test_android_companion_registry.py'
      - '.github/workflows/v13-boss-companion-world.yml'
permissions:
  contents: read
jobs:
  typed-companion-world-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v13/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest numpy==1.26.4
      - run: python -m py_compile v13/android_companion_registry.py v13/android_operator_world.py v13/android_goal_learning_demo.py
      - run: python -m pytest -q tests/test_android_companion_registry.py tests/test_android_operator_loop.py tests/test_android_operator_world.py tests/test_android_goal_learning_demo.py tests/test_android_goal_replay_retention.py tests/test_android_c5_goal_replay.py tests/test_c5_goal_c3_speech_e2e.py tests/test_behavior_governor_android_integration.py
