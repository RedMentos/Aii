name: V13 Run73 JEF fixed mixed-range source policy software
on:
  push:
    branches: [assistant/v13-run73-jef-range-policy-shadow-20261031-auto11]
    paths:
      - '.github/workflows/v13-run73-jef-range-policy.yml'
      - 'v13/code/v13/jef_range_policy_shadow.py'
      - 'v13/code/tests/test_jef_range_policy_shadow.py'
permissions:
  contents: read
concurrency:
  group: v13-run73-jef-fixed-range-software
  cancel-in-progress: false
jobs:
  fixed-range:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Real-Store fixed-range and unchanged JEF source guards
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run73-fixed-range"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          08842f3833262117e45a6496bc6f06b908954f37 v13/code/docs/RUN73_JEF_RANGE_POLICY_PREREG_20261031.md
          d57c9eb561e115541883e2f6ed37da451ff528f7 v13/code/v13/jef_range_policy_shadow.py
          384628a38070012b449b876b2529f44ca8b038ce v13/code/tests/test_jef_range_policy_shadow.py
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run73-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run73-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          for t in test_jef_range_policy_shadow.py test_jef_typed_source_shadow.py test_jef_f1f5_source_admission.py test_jef_c3_schema_source_recheck_shadow.py; do
            key="${t%.py}"
            if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
              timeout --signal=TERM --kill-after=5s 6m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m unittest discover -s v13/code/tests -p "$t" -v > "$e/${key}_RAW.log" 2>&1
              echo "$?" > "$e/${key}_EXIT.txt"
            else echo DEPS_RED > "$e/${key}_RAW.log"; echo 99 > "$e/${key}_EXIT.txt"; fi
          done
          python3 -m compileall -q v13/code/v13/jef_range_policy_shadow.py v13/code/tests/test_jef_range_policy_shadow.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 5e9cd6a14ff131fc9709932e55002faabe4ffd12 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 5e9cd6a14ff131fc9709932e55002faabe4ffd12 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run73-fixed-range-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run73-fixed-range/
          if-no-files-found: error
          retention-days: 90
      - name: Require all focused checks
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-run73-fixed-range"
          for s in PINS VENV DEPS test_jef_range_policy_shadow test_jef_typed_source_shadow test_jef_f1f5_source_admission test_jef_c3_schema_source_recheck_shadow COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN73_FIXED_RANGE_SOFTWARE_ONLY_NO_F1F5_AUTHORITY_OR_AGE_PROMOTION
