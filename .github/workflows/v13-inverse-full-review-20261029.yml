name: V13 inverse majority baseline full software regression review
on:
  push:
    branches:
      - codex/v13-worldmodel-inverse-heldout-baseline-20261029-auto10z
    paths:
      - .github/workflows/v13-inverse-full-review-20261029.yml
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      V13_NO_AUTOSTART: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 50
      - name: Full software suite on exact review head, preserve failures
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-inverse-full"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/v13/world_model.py v13/code/tests/test_world_model.py v13/code/tests/test_worldmodel_inverse_heldout_baseline_20261029.py > "$e/SOURCE_BLOBS.txt"
          python3 -m venv "$RUNNER_TEMP/venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          rc=$?
          if [ "$rc" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/DEPS_RAW.log" 2>&1
            rc=$?
          fi
          if [ "$rc" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input 'transformers==5.20.2' 'peft==0.21.2' >> "$e/DEPS_RAW.log" 2>&1
            rc=$?
          fi
          echo "$rc" > "$e/DEPS_EXIT.txt"
          "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
          "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
          echo "$?" > "$e/PIP_CHECK_EXIT.txt"
          if [ "$rc" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests) > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else
            echo SKIPPED > "$e/FULL_EXIT.txt"
            echo SKIPPED > "$e/FULL_RAW.log"
          fi
          "$py" -m compileall -q v13/code/v13/world_model.py v13/code/tests/test_worldmodel_inverse_heldout_baseline_20261029.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 20363b1f3052276254d23878feeb2f92adeff2ca --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 20363b1f3052276254d23878feeb2f92adeff2ca HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve raw even on inherited preflight errors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-inverse-full-${{ github.sha }}
          path: ${{ runner.temp }}/v13-inverse-full/
          if-no-files-found: error
      - name: Enforce full suite and evidence without waivers
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-inverse-full"
          for n in VENV DEPS PIP_CHECK FULL COMPILE PRIVACY DIFF; do
            test "$(cat "$e/${n}_EXIT.txt")" = 0 || { echo "$n failed; raw retained"; exit 1; }
          done
