name: V13 read-only phone 20-turn local metadata gate
on:
  push:
    branches:
      - gpt6/phone-20turn-cohort-20261118
  pull_request:
    paths:
      - 'v13/code/v13/phone_20turn_gate.py'
      - 'v13/code/tests/test_phone_20turn_gate_20261118.py'
      - '.github/workflows/v13-phone-20turn-metadata-gate-20261118.yml'
permissions:
  contents: read
jobs:
  local-metadata-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and run 20-turn no-text gate
        env:
          PYTHONPATH: v13/code
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m py_compile v13/code/v13/phone_20turn_gate.py v13/code/tests/test_phone_20turn_gate_20261118.py
          python -m unittest discover -s v13/code/tests -p 'test_phone_20turn_gate_20261118.py' -v
          python -m unittest discover -s v13/code/tests -p 'test_phone_offer_evidence_20261116.py' -v
          python -m unittest discover -s v13/code/tests -p 'test_native_offer_prompt_receipt_20261118.py' -v
