name: V14 Core audio and observer composition

on:
  pull_request:
    paths:
      - "v13/code/scripts/termux_runtime_recovery_candidate_20261121.py"
      - "v13/code/scripts/integrated_audio_context_candidate_20261121.py"
      - "v13/code/scripts/integrated_observer_fair_budget_candidate_20261116.py"
      - "v13/code/tests/test_core_audio_observer_composition_20261127.py"
      - ".github/workflows/v14-core-audio-observer-composition.yml"
  push:
    branches:
      - "core/v14-adaptive-c4-budget-20261126-run4-core"

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile the exact Core composer and regression
        env:
          PYTHONPATH: v13/code
        run: python -m py_compile v13/code/scripts/termux_runtime_recovery_candidate_20261121.py v13/code/tests/test_core_audio_observer_composition_20261127.py
      - name: Test exact audio + fair-budget + native receiver composition
        env:
          PYTHONPATH: v13/code
        run: python -m pytest -q -s v13/code/tests/test_core_audio_observer_composition_20261127.py
