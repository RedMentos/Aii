name: V13 Run11 read-only Store SHADOW ticket operator proof
on:
  push:
    branches:
      - assistant/v13-run11-store-ticket-readonly-cli-20261028
permissions:
  contents: read
concurrency:
  group: v13-run11-readonly-ticket-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      V13_NO_AUTOSTART: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Capture source-only proof stages
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run11-readonly-cli"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          for p in v13/code/v13/store.py v13/code/scripts/run21_event_source_adapter_shadow.py v13/code/scripts/run23_store_typed_bridge_shadow.py v13/code/scripts/run11_store_shadow_use_boundary.py v13/code/scripts/run11_store_shadow_ticket_io.py; do
            git hash-object "$p" | xargs -I{} echo "{} $p"
          done > "$e/FROZEN_BLOBS_RAW.log"
          if [ "$(git hash-object v13/code/scripts/run21_event_source_adapter_shadow.py)" = fa8e290388386f279aa835633b8564f8f77cbe1f ] && [ "$(git hash-object v13/code/scripts/run23_store_typed_bridge_shadow.py)" = d958df02327034e644dc31185ccc71e5492d033f ] && [ "$(git hash-object v13/code/scripts/run11_store_shadow_use_boundary.py)" = 8d5f1abb177a0feee933bfecac0cf967680879a3 ] && [ "$(git hash-object v13/code/scripts/run11_store_shadow_ticket_io.py)" = af24709d8a398494d7625f33f90570cb83cd8c5d ]; then echo 0 > "$e/FROZEN_EXIT.txt"; else echo 1 > "$e/FROZEN_EXIT.txt"; fi
          (cd v13/code && timeout --signal=TERM --kill-after=5s 120s env PYTHONPATH=.:tests python3 -m unittest -v tests.test_run11_store_ticket_readonly_cli tests.test_run11_store_shadow_ticket_io tests.test_run11_store_shadow_use_boundary) > "$e/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$e/FOCUSED_EXIT.txt"
          python3 -m compileall -q v13/code/tests/test_run11_store_ticket_readonly_cli.py v13/code/scripts/run11_store_ticket_readonly_cli.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ]; then
            python3 -m venv "$RUNNER_TEMP/v13-run11-readonly-cli-venv"
            py="$RUNNER_TEMP/v13-run11-readonly-cli-venv/bin/python"
            "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
            first=$?
            "$py" -m pip install --disable-pip-version-check --no-input 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
            second=$?
            "$py" -m pip install --disable-pip-version-check --no-input 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
            third=$?
            if [ "$first" = 0 ] && [ "$second" = 0 ] && [ "$third" = 0 ]; then
              echo 0 > "$e/INSTALL_EXIT.txt"
              (cd v13/code && timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=.:tests "$py" -m unittest discover -s tests -p 'test_*.py' -q) > "$e/FULL_RAW.log" 2>&1
              echo "$?" > "$e/FULL_EXIT.txt"
            else
              echo 1 > "$e/INSTALL_EXIT.txt"
              echo SKIPPED_PREREQ_RED > "$e/FULL_RAW.log"
              echo SKIPPED_RED > "$e/FULL_EXIT.txt"
            fi
          else
            for n in INSTALL FULL; do echo SKIPPED_FOCUSED_RED > "$e/${n}_RAW.log"; echo SKIPPED_RED > "$e/${n}_EXIT.txt"; done
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 76b78dc0650b3284f975048d7e202a49f7732d8d --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 76b78dc0650b3284f975048d7e202a49f7732d8d HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - name: Preserve original raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run11-readonly-cli-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run11-readonly-cli/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce proof stages without gate promotion
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run11-readonly-cli"
          for n in FROZEN FOCUSED COMPILE INSTALL FULL PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; raw retained; no gate promotion"
              tail -35 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo READONLY_SHADOW_TICKET_CLI_SOFTWARE_ONLY_NO_NATIVE_OR_CANON_GATE_PROMOTION
