name: V13 Run11 half second-number ambiguity review
on:
  push:
    branches:
      - assistant/v13-run11-half-numeric-ambiguity-review-20261028
    paths:
      - '.github/workflows/run11-half-second-number-review-20261028.yml'
      - 'v13/code/v13/toolstep.py'
      - 'v13/code/tests/test_toolstep.py'
permissions:
  contents: read
concurrency:
  group: v13-run11-half-second-number-review
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: "1"
      NO_MODEL_DOWNLOADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact-source guards and focused plus full Linux software regression
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-half-second-number-review"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/v13/toolstep.py > "$e/TOOLSTEP_BLOB.txt"
          git hash-object v13/code/tests/test_toolstep.py > "$e/TEST_BLOB.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          68e7ed1352800174972558f1e0b0683a42c8689a v13/code/v13/runtime.py
          2135f4404f241cfc198abd7fe2288f13a622f4fc v13/code/v13/focal.py
          a74d7517a7ab70e801e177b58da057e57fd3460c v13/code/v13/prompts.py
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          954a3f468f10195fbce12d27f68585ee7edee2c9 v13/code/specs/control_tools.json
          BLOBS
          : > "$e/BLOBS_RAW.log"
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            printf '%s %s %s\n' "$want" "$got" "$path" >> "$e/BLOBS_RAW.log"
            if [ "$want" != "$got" ]; then echo BLOB_MISMATCH >> "$e/BLOBS_RAW.log"; fi
          done < "$e/EXPECTED_BLOBS.txt"
          if grep -q BLOB_MISMATCH "$e/BLOBS_RAW.log"; then echo 1 > "$e/BLOBS_EXIT.txt"; else echo 0 > "$e/BLOBS_EXIT.txt"; fi
          python3 -m venv "$RUNNER_TEMP/v13-half-second-number-venv"
          py="$RUNNER_TEMP/v13-half-second-number-venv/bin/python"
          "$py" -m pip install --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          first=$?
          "$py" -m pip install --no-input -q 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
          second=$?
          "$py" -m pip install --no-input -q 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
          third=$?
          if [ "$first" = 0 ] && [ "$second" = 0 ] && [ "$third" = 0 ]; then echo 0 > "$e/INSTALL_EXIT.txt"; else echo 1 > "$e/INSTALL_EXIT.txt"; fi
          if [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ] && [ "$(cat "$e/BLOBS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=10s 5m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_toolstep tests.test_calc_tool_ablation tests.test_calc_tool_span_ablation tests.test_calc_tool_producer_ablation) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else
            echo SKIPPED_PREREQ_RED > "$e/FOCUSED_RAW.log"
            echo SKIPPED_RED > "$e/FOCUSED_EXIT.txt"
          fi
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=.:tests "$py" -m unittest discover -s tests -p 'test_*.py' -q) > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else
            echo SKIPPED_FOCUSED_RED > "$e/FULL_RAW.log"
            echo SKIPPED_RED > "$e/FULL_EXIT.txt"
          fi
          python3 -m compileall -q v13/code/v13/toolstep.py v13/code/tests/test_toolstep.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 42daf68da2d0a5dac986f6744fa0cc9ef363b72a --head HEAD > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 42daf68da2d0a5dac986f6744fa0cc9ef363b72a HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-half-second-number-review-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-half-second-number-review/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce source and software gates
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-half-second-number-review"
          for name in BLOBS INSTALL FOCUSED FULL COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${name}_EXIT.txt")" != 0 ]; then
              echo "$name RED; raw retained"
              tail -80 "$e/${name}_RAW.log" || true
              exit 1
            fi
          done
          echo 'HALF_SECOND_NUMBER_AMBIGUITY_LINUX_SOFTWARE_PASS_NO_AGE0_TOOL_AUTHORITY'
