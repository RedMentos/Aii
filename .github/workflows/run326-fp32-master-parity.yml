name: V13 Run326 pinned FP32 master source/path parity (no training)
on:
  pull_request:
    paths:
      - '.github/workflows/run326-fp32-master-parity.yml'
      - 'v13/code/scripts/audit_fp32_master_parity_run326.py'
      - 'v13/code/tests/test_fp32_master_parity_run326.py'
      - 'v13/code/docs/proofs/continuation-20261025/run326-fp32-master-parity/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v13-native-c3-run131-serialized
  cancel-in-progress: false
jobs:
  fp32-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DO_NOT_TRACK: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      PIP_NO_CACHE_DIR: '1'
      V13_NO_AUTOSTART: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 50
      - name: Record exact head and original failed run
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/RUN326_HEAD.txt"
          echo "Run325 failed before optimizer at exact Run324 FP32 full SHA assertion, original run 40213614735" | tee "$RUNNER_TEMP/RUN326_ORIGINAL_RED.txt"
          test "$(sha256sum v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md | cut -d' ' -f1)" = 3423906b01b24443fcef733fb5c7ef47296963df63e603d8f843c99d544877ee
          { date -u -Iseconds; uname -a; free -h; df -h "$RUNNER_TEMP"; python3 --version; } | tee "$RUNNER_TEMP/RUN326_HOST.txt"
      - name: Ten adversarial source-only tests
        id: fixture
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          PYTHONPATH="$PWD" python3 -m unittest -v tests.test_fp32_master_parity_run326 \
            2>&1 | tee "$RUNNER_TEMP/RUN326_FIXTURE_RAW.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUNNER_TEMP/RUN326_FIXTURE_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Pinned official b10964 source and converter SHA
        id: source
        run: |
          set -uo pipefail
          set +e
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 300 \
            'https://github.com/ggml-org/llama.cpp/archive/refs/tags/b10964.tar.gz' \
            -o "$RUNNER_TEMP/RUN326_b10964.tar.gz" \
            2>&1 | tee "$RUNNER_TEMP/RUN326_SOURCE_DOWNLOAD_RAW.log"
          rc=${PIPESTATUS[0]}
          if [[ "$rc" == "0" ]]; then
            echo "4c96d72c40cefdacf621457d8a12fe5673b8de5b640ff7fe6d342ea1c579a9fe  $RUNNER_TEMP/RUN326_b10964.tar.gz" | sha256sum -c -
            rc=$?
          fi
          if [[ "$rc" == "0" ]]; then
            tar -xzf "$RUNNER_TEMP/RUN326_b10964.tar.gz" -C "$RUNNER_TEMP"
            rc=$?
          fi
          if [[ "$rc" == "0" ]]; then
            echo "e9a1da876330bbce9687541ab31736542a01b4ac43c6686126514a50f122fb7f  $RUNNER_TEMP/llama.cpp-b10964/convert_hf_to_gguf.py" | sha256sum -c -
            rc=$?
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN326_SOURCE_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Exact Run324 isolated CPU conversion dependencies
        id: deps
        run: |
          set -uo pipefail
          set +e
          python3 -m venv "$RUNNER_TEMP/run326venv"
          {
            "$RUNNER_TEMP/run326venv/bin/python" -m pip install --disable-pip-version-check --no-input \
              --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
            "$RUNNER_TEMP/run326venv/bin/python" -m pip install --disable-pip-version-check --no-input \
              'numpy==2.3.5' 'transformers==5.3.0' 'jinja2==3.1.6' \
              'safetensors==0.6.2' 'sentencepiece==0.2.1' 'protobuf==6.33.0'
          } 2>&1 | tee "$RUNNER_TEMP/RUN326_DEPS_RAW.log"
          rc=${PIPESTATUS[0]}
          "$RUNNER_TEMP/run326venv/bin/python" -m pip freeze > "$RUNNER_TEMP/RUN326_PIP_FREEZE.txt" || true
          echo "$rc" > "$RUNNER_TEMP/RUN326_DEPS_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Download identical pinned source into exact original Run324 path
        id: snapshot
        run: |
          set -uo pipefail
          set +e
          if [[ "$(cat "$RUNNER_TEMP/RUN326_DEPS_EXIT.txt")" != "0" || "$(cat "$RUNNER_TEMP/RUN326_SOURCE_EXIT.txt")" != "0" ]]; then
            echo 2 > "$RUNNER_TEMP/RUN326_SNAPSHOT_EXIT.txt"; echo "rc=2" >> "$GITHUB_OUTPUT"; exit 0
          fi
          export HF_DIR="$RUNNER_TEMP/run324hf" VARIANT_DIR="$RUNNER_TEMP/run325hf"
          "$RUNNER_TEMP/run326venv/bin/python" - <<'PY' 2>&1 | tee "$RUNNER_TEMP/RUN326_SNAPSHOT_RAW.log"
          import json,os,shutil
          from pathlib import Path
          from huggingface_hub import snapshot_download
          from hashlib import sha256
          root=Path(os.environ['HF_DIR'])
          snapshot_download(repo_id="LiquidAI/LFM2.5-350M",
              revision="9e6c6ccf47cd318696e137d381a7ded8fe4df09f",
              local_dir=str(root),
              allow_patterns=["*.safetensors","config.json","tokenizer*","special_tokens_map.json","chat_template.jinja","generation_config.json"])
          files=sorted(p for p in root.iterdir() if p.is_file())
          assert sha256((root/'model.safetensors').read_bytes()).hexdigest()=="1c9c77a4471a7f590f85240f74ed1fc26df7fbde88c3006724e2f93ca993ea4e"
          dest=Path(os.environ['VARIANT_DIR'])
          dest.mkdir()
          for p in files: shutil.copy2(p,dest/p.name)
          manifest={p.name:sha256(p.read_bytes()).hexdigest() for p in files}
          assert manifest=={p.name:sha256(p.read_bytes()).hexdigest() for p in dest.iterdir() if p.is_file()}
          Path(os.environ['RUNNER_TEMP'],'RUN326_HF_SHA256.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          print(json.dumps({'source_file_count':len(files),'weights_sha256':manifest['model.safetensors'],'identical_snapshots':True},sort_keys=True))
          PY
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUNNER_TEMP/RUN326_SNAPSHOT_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Two exact official F32 conversions differing only in snapshot directory name
        id: convert
        run: |
          set -uo pipefail
          set +e
          if [[ "$(cat "$RUNNER_TEMP/RUN326_SNAPSHOT_EXIT.txt")" != "0" || "$(cat "$RUNNER_TEMP/RUN326_FIXTURE_EXIT.txt")" != "0" ]]; then
            echo 2 > "$RUNNER_TEMP/RUN326_CONVERT_EXIT.txt"; echo "rc=2" >> "$GITHUB_OUTPUT"; exit 0
          fi
          timeout 720s "$RUNNER_TEMP/run326venv/bin/python" \
            "$RUNNER_TEMP/llama.cpp-b10964/convert_hf_to_gguf.py" \
            --outtype f32 --outfile "$RUNNER_TEMP/run324-f32.gguf" "$RUNNER_TEMP/run324hf" \
            > "$RUNNER_TEMP/RUN326_BASELINE_CONVERT_RAW.log" 2>&1
          rc=$?
          if [[ "$rc" == "0" ]]; then
            timeout 720s "$RUNNER_TEMP/run326venv/bin/python" \
              "$RUNNER_TEMP/llama.cpp-b10964/convert_hf_to_gguf.py" \
              --outtype f32 --outfile "$RUNNER_TEMP/run325-f32.gguf" "$RUNNER_TEMP/run325hf" \
              > "$RUNNER_TEMP/RUN326_VARIANT_CONVERT_RAW.log" 2>&1
            rc=$?
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN326_CONVERT_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Full GGUF metadata and every FP32 tensor payload SHA
        id: audit
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          if [[ "$(cat "$RUNNER_TEMP/RUN326_CONVERT_EXIT.txt")" != "0" ]]; then
            echo 2 > "$RUNNER_TEMP/RUN326_AUDIT_EXIT.txt"; echo "rc=2" >> "$GITHUB_OUTPUT"; exit 0
          fi
          PYTHONPATH="$RUNNER_TEMP/llama.cpp-b10964/gguf-py:$PWD" \
            "$RUNNER_TEMP/run326venv/bin/python" scripts/audit_fp32_master_parity_run326.py \
            --baseline "$RUNNER_TEMP/run324-f32.gguf" --variant "$RUNNER_TEMP/run325-f32.gguf" \
            --baseline-source "$RUNNER_TEMP/run324hf" --variant-source "$RUNNER_TEMP/run325hf" \
            --out "$RUNNER_TEMP/RUN326_AUDIT.json" \
            2>&1 | tee "$RUNNER_TEMP/RUN326_AUDIT_RAW.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUNNER_TEMP/RUN326_AUDIT_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Official privacy scan
        id: privacy
        run: |
          set -uo pipefail
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py \
            --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree \
            2>&1 | tee "$RUNNER_TEMP/RUN326_PRIVACY_RAW.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUNNER_TEMP/RUN326_PRIVACY_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Close raw hashes without model or GGUF
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          find . -maxdepth 1 -type f -name 'RUN326_*' ! -name 'RUN326_b10964.tar.gz' ! -name 'RUN326_SHA256SUMS.txt' -print0 | sort -z | xargs -0 -r sha256sum > RUN326_SHA256SUMS.txt
      - name: Retain original failure reference and full raw diagnostic (no weights)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V13-Run326-FP32-Parity-Raw-${{ github.sha }}
          path: |
            ${{ runner.temp }}/RUN326_*.log
            ${{ runner.temp }}/RUN326_*.txt
            ${{ runner.temp }}/RUN326_*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce exact source, baseline reproduction, full tensor audit and privacy
        if: always()
        run: |
          test "${{ steps.fixture.outputs.rc }}" = "0"
          test "${{ steps.source.outputs.rc }}" = "0"
          test "${{ steps.deps.outputs.rc }}" = "0"
          test "${{ steps.snapshot.outputs.rc }}" = "0"
          test "${{ steps.convert.outputs.rc }}" = "0"
          test "${{ steps.audit.outputs.rc }}" = "0"
          test "${{ steps.privacy.outputs.rc }}" = "0"
