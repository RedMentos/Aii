name: V13 Run66 JEF operator pinned native structural SHADOW replay
on:
  push:
    branches: [codex/jef-operator-native-structural-20261031-hourly11]
    paths: ['.github/workflows/v13-run66-jef-operator-native.yml']
permissions:
  contents: read
concurrency:
  group: v13-native-c3-ag12-20261030
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned software then real C3 operator CLI replay with redacted raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run66-jef-operator"
          mkdir -p "$e/receipts"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          a14941e4b3e3554ce9490b329f6a88378e0cb01d v13/code/docs/JEF_OPERATOR_NATIVE_STRUCTURAL_REPLAY_PREREG_20261031.md
          c921d6a0f791d67c4788fbfed2d212ad7696d224 v13/code/docs/JEF_OPERATOR_BACKGROUND_POLICY_ISOLATION_PREREG_20261031.md
          d31c93c438f3e15f435b60603866713005c59f93 v13/code/scripts/jef_c3_c5_c6_operator_cli.py
          e7088ffce25d242ae6f9a499459f2ff78974d23a v13/code/scripts/run66_jef_operator_native_structural.py
          c4f28e661284c82f5c09506d16d974ee04cd866a v13/code/tests/test_run66_jef_operator_native_structural.py
          4409692865d284382de9a14aae55aa3a4315ecfc v13/code/scripts/run63_jef_c3_native.py
          01464d215933bf6de22c6c585f0aa8b16d056678 v13/code/scripts/run65_jef_c3_c5_native.py
          5e095feb81157b3a4be41dd7459c9f44cdcb7036 v13/code/v13/jef_c3_c5_c6_fallback_draft_candidate.py
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run66-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run66-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 7m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_run66_jef_operator_native_structural tests.test_jef_operator_policy_isolation tests.test_jef_operator_regular_file tests.test_jef_operator_io_finalizer_hardening tests.test_jef_c3_c5_c6_operator_cli tests.test_run65_jef_c3_c5_native) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PINS_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          export V13_HOME="$RUNNER_TEMP/v13-run66-installed"
          if [ "$(cat "$e/TEST_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 15m env PYTHONPATH=v13/code "$py" -m v13.bootstrap --home "$V13_HOME" > "$e/BOOTSTRAP_RAW.log" 2>&1
            echo "$?" > "$e/BOOTSTRAP_EXIT.txt"
          else echo SKIPPED_TEST_RED > "$e/BOOTSTRAP_RAW.log"; echo 99 > "$e/BOOTSTRAP_EXIT.txt"; fi
          if [ "$(cat "$e/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 35m env PYTHONPATH=v13/code "$py" v13/code/scripts/run66_jef_operator_native_structural.py --home "$V13_HOME" --out "$e/pilot/report.json" --input-root "$e/pilot-private-inputs" > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else echo SKIPPED_BOOTSTRAP_RED > "$e/NATIVE_RAW.log"; echo 99 > "$e/NATIVE_EXIT.txt"; fi
          if [ -f "$e/pilot/report.json" ]; then
            "$py" - "$e/pilot/report.json" > "$e/REPORT_CHECK_RAW.log" 2>&1 <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['schema']=='v13.jef.operator.native.structural_replay.v1'
          assert r['evidence_kind']=='LINUX_NATIVE_C3_REAL_OPERATOR_CLI_SHADOW'
          assert r['registered'] and r['replay_not_disjoint'] and r['cohort_count']==3
          assert r['status']=='STRUCTURAL_SHADOW_PASS_NO_PROMOTION'
          assert len(r['cases'])==3 and [c['index'] for c in r['cases']]==[0,1,2]
          assert r['c3_model_sha256_required']=='3d10b6ab8fc91a919534b9558e266255aca0bbc7f6d015963599aa9e74e05b1d'
          assert r['runner_sha256_required']=='79e312188dc1d75c28201771f106e91de470b5cebdd838d31bb4db25eecf5d39'
          assert r['restart_drafts_zero'] and r['restart_no_committed'] and r['restart_policy_unchanged']
          assert r['age0']=='RECORD_ONLY' and r['step2']=='UTILITY_FAIL'
          assert r['b3']=='NO_PROMOTION' and r['body_jepa']=='UNAVAILABLE'
          assert r['jepa_weight']==0 and r['world_jepa_authority']=='SHADOW'
          assert r['delivery_authority']==0 and r['learning_authority']==0
          assert not r['redmi_measured'] and not r['whole_system_complete']
          for c in r['cases']:
            assert c['status']=='SHADOW_DRAFT_PREFLIGHT_READY'
            assert c['input_matches_sha256'] and c['policy_unchanged']
            assert c['native_model_called'] and c['native_process_reaped'] and c['native_final']
            assert c['assistant_committed']==0 and c['assistant_drafts']==1
            assert c['c6_status']=='NEEDS_REAL_TTY_APPROVAL'
            assert c['preflight_only'] and c['no_live_output']
            assert c['delivery_authority']==0 and not c['output_committed']
            assert c['tool_dispatches']==0 and c['learning_authority']==0
            assert c['model_formatter_status'] in ('FORMATTER_MATCH_SHADOW','FORMATTER_MISMATCH_RED')
          print('RUN66_REAL_NATIVE_OPERATOR_STRUCTURAL_SHADOW_ONLY',
                'strict',r['strict_formatter_matches_observed'],
                'fallbacks',r['source_only_fallbacks_observed'])
          PY
            echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          else echo NO_NATIVE_REPORT_RED > "$e/REPORT_CHECK_RAW.log"; echo 99 > "$e/REPORT_CHECK_EXIT.txt"; fi
          "$py" -m py_compile v13/code/scripts/run66_jef_operator_native_structural.py v13/code/scripts/jef_c3_c5_c6_operator_cli.py v13/code/tests/test_run66_jef_operator_native_structural.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 03e2eb7374da01774ee6629cd44d3ca9c5adb2ff --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 03e2eb7374da01774ee6629cd44d3ca9c5adb2ff HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          cp "$e/HEAD.txt" "$e/PINS.txt" "$e/receipts/"
          for s in PINS VENV DEPS TEST BOOTSTRAP NATIVE REPORT_CHECK COMPILE PRIVACY DIFF; do
            cp "$e/${s}_RAW.log" "$e/${s}_EXIT.txt" "$e/receipts/" 2>/dev/null || true
          done
          [ ! -f "$e/pilot/report.json" ] || cp "$e/pilot/report.json" "$e/receipts/ORIGINAL_REPORT.json"
          (cd "$e/receipts" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve redacted original native including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run66-jef-operator-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run66-jef-operator/receipts/
          if-no-files-found: error
          retention-days: 90
      - name: Require all stages zero without TTY/output/learning promotion
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-run66-jef-operator"
          for s in PINS VENV DEPS TEST BOOTSTRAP NATIVE REPORT_CHECK COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN66_OPERATOR_NATIVE_STRUCTURAL_SHADOW_ONLY_NO_PROMOTION
