name: V13 Run68 JEF C3 schema disjoint pinned Linux-native SHADOW
on:
  push:
    branches: [codex/jef-c3-schema-constrained-727-20261031-auto11]
    paths: ['.github/workflows/v13-run68-jef-c3-schema-native.yml']
permissions:
  contents: read
concurrency:
  group: v13-native-c3-ag12-20261030
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned software and 12 native C3 calls, redacted original raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run68-native"
          mkdir -p "$e/receipts"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          587410221d3ed033e52fbedcb32b31d836a4a363 v13/code/docs/JEF_C3_SCHEMA_CONSTRAINED_727_PREREG_20261031.md
          3b6b79c7eded3b812d27fb594ceda9afd3fd9464 v13/code/scripts/jef_c3_schema_fixture_727.py
          bdbec75f12e6af135dc17fd8eaea8d9927079f04 v13/code/scripts/run68_jef_c3_schema_native_727.py
          d36538e8157a51ac703f29c6043a092beef9df4a v13/code/scripts/run68_jef_c3_schema_verify.py
          6a0d8c3a03d280adc9778094fa28a19f100d0824 v13/code/tests/test_jef_c3_schema_fixture_727.py
          f1958dbcdcc7e231f7763029dd7b348f90634397 v13/code/tests/test_run68_jef_c3_schema_verify.py
          9ebc4178d4ce2bac941c70a8e1a1cb4438bd5dac v13/code/scripts/jef_c3_recency_fixture_619.py
          d31c93c438f3e15f435b60603866713005c59f93 v13/code/scripts/jef_c3_c5_c6_operator_cli.py
          4409692865d284382de9a14aae55aa3a4315ecfc v13/code/scripts/run63_jef_c3_native.py
          e94d70be7ec5f4666392a50ea17f813bd92c0879 v13/code/v13/jef_c3_typed_envelope_candidate.py
          7cfae3d54e49718181813cea68238301e2ffae87 v13/code/v13/jef_typed_source_shadow.py
          8135fa2792df2c541dc1719e49d941c775703697 v13/code/scripts/p2x_disjoint_receiver_trainset.py
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run68-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run68-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m unittest discover -s v13/code/tests -p 'test_jef_c3_schema_fixture_727.py' > "$e/TEST_RAW.log" 2>&1
            first="$?"
            timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m unittest discover -s v13/code/tests -p 'test_run68_jef_c3_schema_verify.py' >> "$e/TEST_RAW.log" 2>&1
            second="$?"
            if [ "$first" = 0 ] && [ "$second" = 0 ]; then echo 0 > "$e/TEST_EXIT.txt"; else echo 1 > "$e/TEST_EXIT.txt"; fi
          else echo SKIPPED_PINS_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          export V13_HOME="$RUNNER_TEMP/v13-run68-installed"
          if [ "$(cat "$e/TEST_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 15m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m v13.bootstrap --home "$V13_HOME" > "$e/BOOTSTRAP_RAW.log" 2>&1
            echo "$?" > "$e/BOOTSTRAP_EXIT.txt"
          else echo SKIPPED_TEST_RED > "$e/BOOTSTRAP_RAW.log"; echo 99 > "$e/BOOTSTRAP_EXIT.txt"; fi
          if [ "$(cat "$e/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 37m env PYTHONPATH=v13/code:v13/code/scripts "$py" v13/code/scripts/run68_jef_c3_schema_native_727.py --home "$V13_HOME" --out "$e/pilot" > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else echo SKIPPED_BOOTSTRAP_RED > "$e/NATIVE_RAW.log"; echo 99 > "$e/NATIVE_EXIT.txt"; fi
          if [ -f "$e/pilot/report.json" ]; then
            env PYTHONPATH=v13/code:v13/code/scripts "$py" v13/code/scripts/run68_jef_c3_schema_verify.py "$e/pilot/report.json" > "$e/VERIFY_RAW.log" 2>&1
            echo "$?" > "$e/VERIFY_EXIT.txt"
          else echo NO_REPORT_RED > "$e/VERIFY_RAW.log"; echo 99 > "$e/VERIFY_EXIT.txt"; fi
          "$py" -m py_compile v13/code/scripts/jef_c3_schema_fixture_727.py v13/code/scripts/run68_jef_c3_schema_native_727.py v13/code/scripts/run68_jef_c3_schema_verify.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 8cf020737f779089d4e9e6534fa21bf5347b9c7c --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 8cf020737f779089d4e9e6534fa21bf5347b9c7c HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          cp "$e/HEAD.txt" "$e/PINS.txt" "$e/receipts/"
          for s in PINS VENV DEPS TEST BOOTSTRAP NATIVE VERIFY COMPILE PRIVACY DIFF; do
            cp "$e/${s}_RAW.log" "$e/${s}_EXIT.txt" "$e/receipts/" 2>/dev/null || true
          done
          [ ! -f "$e/pilot/report.json" ] || cp "$e/pilot/report.json" "$e/receipts/ORIGINAL_REPORT.json"
          (cd "$e/receipts" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Retain redacted native original raw including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run68-jef-schema-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run68-native/receipts/
          if-no-files-found: error
          retention-days: 90
      - name: Require structural stages zero; fidelity RED is not waived
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-run68-native"
          for s in PINS VENV DEPS TEST BOOTSTRAP NATIVE VERIFY COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN68_NATIVE_FORMATTER_COPY_DIAGNOSTIC_ONLY_NO_PROMOTION
