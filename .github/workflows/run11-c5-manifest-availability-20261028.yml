name: V13 Run11 C5 installed-manifest availability regression
on:
  push:
    branches:
      - codex/v13-run11-c5-manifest-availability-20261028
    paths:
      - '.github/workflows/run11-c5-manifest-availability-20261028.yml'
      - 'v13/code/v13/bodies.py'
      - 'v13/code/tests/test_body_slot_manifest_absence_20261028.py'
permissions:
  contents: read
jobs:
  c5-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: "1"
      NO_MODEL_DOWNLOADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Manifest suppression and existing C5 STEP12 software regressions
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-c5-manifest-guards"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/v13/bodies.py > "$e/BODIES_BLOB.txt"
          git hash-object v13/code/v13/runtime.py > "$e/RUNTIME_BLOB.txt"
          if [ "$(cat "$e/RUNTIME_BLOB.txt")" != '68e7ed1352800174972558f1e0b0683a42c8689a' ]; then echo 'FROZEN_RUNTIME_DRIFT' >> "$e/FOCUSED_RAW.log"; fi
          (cd v13/code && timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=.:tests python3 -m unittest -v tests.test_body_slot_manifest_absence_20261028 tests.test_focal tests.test_step12) > "$e/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$e/FOCUSED_EXIT.txt"
          python3 -m compileall -q v13/code/v13/bodies.py v13/code/tests/test_body_slot_manifest_absence_20261028.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base af71f1ebc26d934a180db39f77a2978ced7b6261 --head HEAD > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check af71f1ebc26d934a180db39f77a2978ced7b6261 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-c5-manifest-guards-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-c5-manifest-guards/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce focused compile privacy diff
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-c5-manifest-guards"
          for name in FOCUSED COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${name}_EXIT.txt")" != 0 ]; then
              echo "$name RED"
              tail -90 "$e/${name}_RAW.log" || true
              exit 1
            fi
          done
          echo 'C5_MANIFEST_SOFTWARE_ONLY_NO_NATIVE_OR_GATE_PROMOTION'
