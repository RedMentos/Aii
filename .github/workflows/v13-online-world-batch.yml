name: V13 OnlineWorld batch integrity
on:
  push:
    branches: ['jepa/online-world-restart-idempotence-*']
  pull_request:
    paths:
      - 'v13/code/v13/online_world.py'
      - 'v13/code/tests/test_online_world_batch_validation_20261110.py'
      - 'v13/code/tests/test_online_world_cursor_recovery.py'
      - '.github/workflows/v13-online-world-batch.yml'
  workflow_dispatch:
jobs:
  online-world-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pytest
      - name: Compile and run targeted T8 batch/restart tests
        working-directory: v13/code
        run: |
          python -m py_compile v13/online_world.py tests/test_online_world_batch_validation_20261110.py
          python -m pytest -q tests/test_online_world_batch_validation_20261110.py tests/test_online_world_cursor_recovery.py tests/test_online_world_20261108.py
