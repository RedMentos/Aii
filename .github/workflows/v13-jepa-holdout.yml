name: V13 JEPA T8 holdout proof
on:
  push:
    branches:
      - jepa/holdout-retention-evidence-20261116
  pull_request:
    paths:
      - 'v13/code/v13/online_world_holdout.py'
      - 'v13/code/tests/test_online_world_holdout.py'
      - '.github/workflows/v13-jepa-holdout.yml'
jobs:
  holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: PYTHONPATH=v13/code python -m unittest discover -s v13/code/tests -p test_online_world_holdout.py -v
