name: V13 Run11 JEF stale AG0 slot missing-manifest regression
on:
  push:
    branches:
      - assistant/v13-run11-jef-slot-manifest-guard-20261028
    paths:
      - '.github/workflows/run11-jef-stale-slot-20261028.yml'
      - 'v13/code/tests/test_bodies.py'
      - 'v13/code/v13/bodies.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run missing-manifest regression with closed raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-jef-slot-regression"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/specs/models.json > "$e/CATALOG_BLOB.txt"
          git hash-object v13/code/specs/control_tools.json > "$e/TOOLS_BLOB.txt"
          python3 -m venv "$RUNNER_TEMP/v13-jef-slot-venv"
          py="$RUNNER_TEMP/v13-jef-slot-venv/bin/python"
          "$py" -m pip install --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          echo "$?" > "$e/INSTALL_EXIT.txt"
          if [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_bodies) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else
            echo SKIPPED_INSTALL_RED > "$e/FOCUSED_RAW.log"
            echo SKIPPED_RED > "$e/FOCUSED_EXIT.txt"
          fi
          python3 -m compileall -q v13/code/v13/bodies.py v13/code/tests/test_bodies.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base af71f1ebc26d934a180db39f77a2978ced7b6261 --head HEAD > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check af71f1ebc26d934a180db39f77a2978ced7b6261 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-jef-slot-regression-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-jef-slot-regression/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce focused evidence
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-jef-slot-regression"
          for name in INSTALL FOCUSED COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${name}_EXIT.txt")" != 0 ]; then
              echo "$name RED; raw retained"
              tail -100 "$e/${name}_RAW.log" || true
              exit 1
            fi
          done
          echo 'JEF_SLOT_MANIFEST_SOFTWARE_ONLY_NO_NATIVE_OR_GATE_PROMOTION'
