name: V13 Run14C AG9 AG12 cross-organ unfiltered full suite
on:
  push:
    branches: [assistant/v13-run14c-ag9-ag12-crossorgan-review-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run14c-ag9-ag12-crossorgan.yml'
permissions:
  contents: read
jobs:
  focused-crossorgan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact source pins and cross-organ focused tests
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run14c-focused"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          658b3c04bd95907211d1f5f7601436d3370d68e1 v13/code/v13/agi/metacog.py
          6f7906c9b9352b9d4ffe9cf9f237fba684942308 v13/code/v13/agi/generality.py
          287d2709dc82cc1ab4dd4a754f6b6cd8bf22e32a v13/code/tests/test_ag9_read_component_run14a.py
          ad1b97ef3ce9e136fd78e4795544d9985697fb39 v13/code/tests/test_ag12_nonfinite_solver_run14b.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=. python3 -m unittest -v tests.test_ag9_read_component_run14a tests.test_ag9_finite_confidence_run13y tests.test_ag9_heldout_shadow_run13z tests.test_ag12_nonfinite_solver_run14b tests.test_growth.G12Eval) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m py_compile v13/code/v13/agi/metacog.py v13/code/v13/agi/generality.py v13/code/tests/test_ag9_read_component_run14a.py v13/code/tests/test_ag12_nonfinite_solver_run14b.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 7e7d57e1db88642f4fcd447eda2c012c1e625bfb --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 7e7d57e1db88642f4fcd447eda2c012c1e625bfb HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve focused raw even on RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run14c-focused-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run14c-focused/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce focused verdict
        if: always()
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run14c-focused"
          for stage in PINS TEST COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            test "$(cat "$e/${stage}_EXIT.txt")" = 0
          done

  unfiltered-fullsuite:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Unfiltered full-suite exact original raw, no RED waivers
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run14c-fullsuite"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/v13/agi/metacog.py v13/code/v13/agi/generality.py v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/SOURCE_BLOBS.txt"
          test "$(tail -1 "$e/SOURCE_BLOBS.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          echo "$?" > "$e/CANON_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run14c-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run14c-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input -q --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu' > "$e/TORCH_RAW.log" 2>&1
            echo "$?" > "$e/TORCH_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input -q 'transformers==4.44.2' > "$e/TRANSFORMERS_RAW.log" 2>&1
            echo "$?" > "$e/TRANSFORMERS_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input -q 'peft==0.13.2' > "$e/PEFT_RAW.log" 2>&1
            echo "$?" > "$e/PEFT_EXIT.txt"
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
            "$py" -c 'import torch; assert torch.__version__=="2.5.1+cpu"; print(torch.__version__, torch.cuda.is_available())' > "$e/TORCH_IMPORT_RAW.log" 2>&1
            echo "$?" > "$e/TORCH_IMPORT_EXIT.txt"
            "$py" -c 'import transformers; from transformers import GPT2Config,GPT2LMHeadModel; assert transformers.__version__=="4.44.2"; print(transformers.__version__)' > "$e/TRANSFORMERS_IMPORT_RAW.log" 2>&1
            echo "$?" > "$e/TRANSFORMERS_IMPORT_EXIT.txt"
            "$py" -c 'import peft; from peft import LoraConfig,get_peft_model; assert peft.__version__=="0.13.2"; print(peft.__version__)' > "$e/PEFT_IMPORT_RAW.log" 2>&1
            echo "$?" > "$e/PEFT_IMPORT_EXIT.txt"
          else
            for stage in DEPS TORCH TRANSFORMERS PEFT PIP_CHECK TORCH_IMPORT TRANSFORMERS_IMPORT PEFT_IMPORT; do echo SKIPPED > "$e/${stage}_EXIT.txt"; echo SKIPPED > "$e/${stage}_RAW.log"; done
          fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ] && [ "$(cat "$e/TORCH_EXIT.txt")" = 0 ] && [ "$(cat "$e/TRANSFORMERS_EXIT.txt")" = 0 ] && [ "$(cat "$e/PEFT_EXIT.txt")" = 0 ] && [ "$(cat "$e/TORCH_IMPORT_EXIT.txt")" = 0 ] && [ "$(cat "$e/TRANSFORMERS_IMPORT_EXIT.txt")" = 0 ] && [ "$(cat "$e/PEFT_IMPORT_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=10s 20m env PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests -p 'test_*.py') > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else echo SKIPPED > "$e/FULL_EXIT.txt"; echo SKIPPED > "$e/FULL_RAW.log"; fi
          "$py" -m compileall -q v13/code/v13 v13/code/scripts > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 7e7d57e1db88642f4fcd447eda2c012c1e625bfb --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 7e7d57e1db88642f4fcd447eda2c012c1e625bfb HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve full-suite original raw even when RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run14c-fullsuite-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run14c-fullsuite/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce all original full-suite checks and negative gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run14c-fullsuite"
          for stage in CANON VENV DEPS TORCH TRANSFORMERS PEFT PIP_CHECK TORCH_IMPORT TRANSFORMERS_IMPORT PEFT_IMPORT FULL COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained; no waiver or promotion"
              tail -50 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'RUN14C_FULLSUITE_SOFTWARE_GREEN_ONLY_NO_NATIVE_REDMI_OR_STEP2_GATE'
