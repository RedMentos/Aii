name: V13 Run87 child seed877 B1B2 native (serialized)
on:
  workflow_dispatch:
  push:
    branches: [assistant/v13-run87-native-execution-20261031-auto11]
    paths: ['v13/code/docs/RUN87_NATIVE_CHILD_EXECUTION_TRIGGER_20261031.txt']
permissions:
  contents: read
concurrency:
  group: v13-step2-budget-paired-native-20261030
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned seed877 48 native calls and independent reparse (manual only)
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run87-compact"
          work="$RUNNER_TEMP/v13-run87-work"
          mkdir -p "$e" "$work"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          2727afa5d8f791e87ade99deba92cc8f74144c23 v13/code/docs/RUN87_B1B2_BUDGET_ABLATION_NATIVE_PREREG_20261031.md
          b02c0d80830232900398437b36f1867067c6afa6 v13/code/scripts/jef_b1b2_budget_fixture_877.py
          beffe7c0de003a023a92be2248cb723e261ac082 v13/code/scripts/run87_b1b2_budget_native.py
          959adb772658c1ea0cb239c749d809eaedd9e9c9 v13/code/scripts/run87_b1b2_budget_verify.py
          62f9543b6b0a11ab192e375dd10e853f79f254a7 v13/code/tests/test_run87_b1b2_budget_fixture.py
          1a60caecf13987acf8fd8973cab777ecafe03ad6 v13/code/tests/test_run87_native_verify.py
          6044d7bb48d7c8de0801cce96c6af466b1f9d547 v13/code/scripts/jef_b1b2_context_fixture_797.py
          1a9eb6f7c7cbfce83d91cc09b4ff9516cff310cf v13/code/v13/cognition.py
          a73ad91409dbf5b6a62b2b935b6491aad7301db8 v13/code/scripts/run52_b1b2_cross_turn_native.py
          429d792106063c48933d921dc1a6b7ecd16b5df6 v13/code/scripts/run55_b1b2_topic_native_corrective.py
          7c1ea152d511783a47a1e55cc6a968ecd9d7e338 v13/code/v13/b1b2_latest_user_offer_candidate.py
          277d34a46b14633c52b5e7d59b3fdf0f16ea4159 v13/code/v13/b1b2_topic_partition_candidate.py
          4705a46640134e213aa00a86e02375d972c76cda v13/code/scripts/run47_jef_c3_typed_receiver_native.py
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run87-native-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run87-native-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m unittest \
              tests.test_run87_b1b2_budget_fixture tests.test_run87_native_verify -v \
              > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          export V13_HOME="$RUNNER_TEMP/v13-run87-native-installed"
          if [ "$(cat "$e/TEST_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 15m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m v13.bootstrap --home "$V13_HOME" > "$e/BOOTSTRAP_RAW.log" 2>&1
            echo "$?" > "$e/BOOTSTRAP_EXIT.txt"
          else echo SKIPPED > "$e/BOOTSTRAP_RAW.log"; echo 99 > "$e/BOOTSTRAP_EXIT.txt"; fi
          if [ "$(cat "$e/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 82m env PYTHONPATH=v13/code:v13/code/scripts "$py" \
              v13/code/scripts/run87_b1b2_budget_native.py --home "$V13_HOME" --out "$work/pilot" \
              > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else echo SKIPPED > "$e/NATIVE_RAW.log"; echo 99 > "$e/NATIVE_EXIT.txt"; fi
          if [ -f "$work/pilot/report.json" ]; then
            mkdir -p "$e/raw_rows"
            cp "$work/pilot/report.json" "$e/report.json"
            find "$work/pilot" -name raw_row.json -type f -print0 | while IFS= read -r -d '' row; do
              parent="$(basename "$(dirname "$row")")"
              cp "$row" "$e/raw_rows/$parent.json"
            done
            timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=v13/code:v13/code/scripts "$py" \
              v13/code/scripts/run87_b1b2_budget_verify.py "$e/report.json" \
              > "$e/VERIFY_RAW.log" 2>&1
            echo "$?" > "$e/VERIFY_EXIT.txt"
          else echo NO_REPORT > "$e/VERIFY_RAW.log"; echo 99 > "$e/VERIFY_EXIT.txt"; fi
          python3 -m compileall -q v13/code/scripts/jef_b1b2_budget_fixture_877.py \
            v13/code/scripts/run87_b1b2_budget_native.py \
            v13/code/scripts/run87_b1b2_budget_verify.py \
            v13/code/tests/test_run87_native_verify.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py \
            --base 7f5875e46036dd1278303dd74461a7bb6dfc24da --head HEAD --no-worktree \
            > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 7f5875e46036dd1278303dd74461a7bb6dfc24da HEAD \
            > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve compact raw evidence, including failed attempts and RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run87-native-child-compact-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run87-compact/
          if-no-files-found: error
          retention-days: 90
      - name: Require native engineering and independent reparse, not scientific success
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-run87-compact"
          for s in PINS VENV DEPS TEST BOOTSTRAP NATIVE VERIFY COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || {
              tail -n 40 "$e/VERIFY_RAW.log" 2>/dev/null || true
              tail -n 40 "$e/NATIVE_RAW.log" 2>/dev/null || true
              exit 1
            }
          done
          echo RUN87_NATIVE_ENGINEERING_COMPLETE_SCIENTIFIC_BUDGET_MAY_BE_RED
