name: V13 Run70 C3 source-only reasoning prereg software preflight
on:
  push:
    branches: [assistant/v13-run70-source-reasoning-schema-20261031-run11]
    paths: ['.github/workflows/v13-run70-c3-source-schema-software.yml']
permissions:
  contents: read
concurrency:
  group: v13-run70-c3-source-schema-software
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen sources, Store admission, source-only no-leak, privacy
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run70-software"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          91f7f625504d329fa5d0d5c93c44f9e3409c6148 v13/code/docs/RUN70_C3_SOURCE_ONLY_SCHEMA_PREREG_20261031.md
          3b6b79c7eded3b812d27fb594ceda9afd3fd9464 v13/code/scripts/jef_c3_schema_fixture_727.py
          cf9822ca0af0d00780d53e5b4824aa239dcd8ead v13/code/scripts/jef_c3_source_reasoning_fixture_743.py
          fa3922dbf7e1e39c78257529b6ccf107aeb48d81 v13/code/tests/test_jef_c3_source_reasoning_fixture_743.py
          e9457dd6091a7201ecd6f19ad82632835aa43ddb v13/code/scripts/run70_c3_source_reasoning_native_743.py
          9ea19808e52fd7a727df1e5d6d18be63d9c679ba v13/code/scripts/run70_c3_source_reasoning_verify.py
          f28c173cad37019e962cae5d76a5f795cc01fa37 v13/code/tests/test_run70_c3_source_reasoning_verify.py
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run70-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run70-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=5s 6m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m unittest discover -s v13/code/tests -p 'test_jef_c3_source_reasoning_fixture_743.py' -v > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
            timeout --signal=TERM --kill-after=5s 6m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m unittest discover -s v13/code/tests -p 'test_run70_c3_source_reasoning_verify.py' -v > "$e/TEST_VERIFY_RAW.log" 2>&1
            echo "$?" > "$e/TEST_VERIFY_EXIT.txt"
          else echo SKIPPED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; echo SKIPPED > "$e/TEST_VERIFY_RAW.log"; echo 99 > "$e/TEST_VERIFY_EXIT.txt"; fi
          python3 -m compileall -q v13/code/scripts/jef_c3_source_reasoning_fixture_743.py v13/code/tests/test_jef_c3_source_reasoning_fixture_743.py v13/code/scripts/run70_c3_source_reasoning_native_743.py v13/code/scripts/run70_c3_source_reasoning_verify.py v13/code/tests/test_run70_c3_source_reasoning_verify.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 4b14ca3bea9b4ddf717aefb7d04408d4b59921b5 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 4b14ca3bea9b4ddf717aefb7d04408d4b59921b5 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Retain original raw including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run70-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run70-software/
          if-no-files-found: error
          retention-days: 90
      - name: Require all software stages
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-run70-software"
          for s in PINS VENV DEPS TEST TEST_VERIFY COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN70_SOFTWARE_ONLY_NO_NATIVE_OR_UTILITY_PROMOTION
