name: V13 Run127 independent C3 raw verifier SOFTWARE only
on:
  push:
    branches: [assistant/v13-step2-native-raw-verifier-20261029]
permissions:
  contents: read
concurrency:
  group: v13-run127-raw-verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Verify frozen source and run focused/full software regressions
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run127-raw"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          source_ok=0
          check() {
            observed="$(git hash-object "$2" 2>/dev/null)" || return 1
            printf '%s %s\n' "$observed" "$2" >> "$e/SOURCE_RAW.log"
            [ "$observed" = "$1" ]
          }
          check dd55b486db032742941b1bcd897c1bc873e17c5f v13/code/docs/proofs/continuation-20261029/STEP2_RULE_TRANSPORT_RAW_VERIFY_PREREG.md || source_ok=1
          check 4c233aaade91e55d00fa152c934de0e03e26d58f v13/code/scripts/step2_exact_rule_transport_verify.py || source_ok=1
          check c6ae8c8f7447cede21caebddda81de1f5beae034 v13/code/tests/test_step2_exact_rule_transport_verify.py || source_ok=1
          check 9b43ce0721213775ef7067169ec4bd6f0b1e0f0e v13/code/scripts/step2_exact_rule_transport_native.py || source_ok=1
          check 58e0aceea1b99e1fc770296902bdb641608e6cc3 v13/code/scripts/step2_exact_rule_native_replay_preflight.py || source_ok=1
          echo "$source_ok" > "$e/SOURCE_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/step2_exact_rule_transport_verify.py v13/code/tests/test_step2_exact_rule_transport_verify.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 120s python3 -m unittest -v tests.test_step2_exact_rule_transport_verify) > "$e/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$e/FOCUSED_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run127-venv" > "$e/VENV_RAW.log" 2>&1
          py="$RUNNER_TEMP/v13-run127-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          first="$?"
          if [ "$first" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
            first="$?"
          fi
          if [ "$first" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
            first="$?"
          fi
          echo "$first" > "$e/INSTALL_EXIT.txt"
          if [ "$first" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=10s 18m "$py" -m unittest discover -s tests -p 'test_*.py') > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else
            echo SKIPPED_DEPENDENCY_RED > "$e/FULL_RAW.log"
            echo SKIPPED_RED > "$e/FULL_EXIT.txt"
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 7f25f3b0d0d8b7167817420240d0475f57f0a538 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 7f25f3b0d0d8b7167817420240d0475f57f0a538 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - name: Preserve raw software evidence including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run127-independent-native-raw-verifier-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run127-raw/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce software-only acceptance
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run127-raw"
          for n in SOURCE COMPILE FOCUSED INSTALL FULL PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; raw preserved; no native or canonical promotion"
              tail -40 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN127_SOFTWARE_ONLY_GREEN_NO_NATIVE
