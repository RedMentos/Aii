name: V13 Core committed C3 speech binding
on:
  push:
    branches:
      - codex/v13-core-store-speech-binding-20261111-2004
  workflow_dispatch:
jobs:
  focused:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v13/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m compileall -q v13/speech_intent.py v13/speech_runtime_bridge.py v13/speech_store_binding.py v13/runtime.py
      - run: python -m pytest -q tests/test_speech_intent.py tests/test_speech_runtime_bridge.py tests/test_speech_store_binding.py
