name: V13 Run16 ContextOS typed capability original RED
on:
  push:
    branches: [assistant/v13-run16-contextos-capability-proof-20261030-hourly11]
    paths: ['.github/workflows/v13-run16-contextos-original-red.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve exact-source original test-first result
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run16-original"; mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          4238cd406cc630ee46b6720bec53da219bc2dece v13/code/docs/CONTEXTOS_CAPABILITY_TYPED_PREREG_RUN16_20261030.md
          2921b4be177ba213dd8dfdf3ca251be809511635 v13/code/tests/test_contextos_capability_typed_run16.py
          40a77a9c3717db7899bfd8966acfa4b9e315e966 v13/code/v13/context_os.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run16-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run16-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
          echo "$?" > "$e/PIP_CHECK_EXIT.txt"
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 8m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_contextos_capability_typed_run16) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PREREQUISITE > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          python3 -m compileall -q v13/code/v13/context_os.py v13/code/tests/test_contextos_capability_typed_run16.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base a35813a2cbf051d9bed004bca5be06fb8c81a079 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check a35813a2cbf051d9bed004bca5be06fb8c81a079 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run16-original-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run16-original/
          retention-days: 30
          if-no-files-found: error
      - name: Require prereg, compile, privacy, and expose original RED
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run16-original"
          for stage in PINS VENV DEPS PIP_CHECK COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            [ "$(cat "$e/${stage}_EXIT.txt")" = 0 ] || exit 1
          done
          echo "TEST_EXIT=$(cat "$e/TEST_EXIT.txt")"
          tail -90 "$e/TEST_RAW.log"
          [ "$(cat "$e/TEST_EXIT.txt")" != 0 ]
