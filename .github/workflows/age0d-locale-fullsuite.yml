name: V13 AGE0d locale full software regression
on:
  push:
    branches: [assistant/v13-age0d-locale-ambiguity-review-20261027]
    paths:
      - '.github/workflows/age0d-locale-fullsuite.yml'
      - 'v13/code/scripts/age0d_answer_audit.py'
      - 'v13/code/tests/test_age0d_locale_ambiguity_review.py'
permissions:
  contents: read
concurrency:
  group: v13-age0d-locale-full-${{ github.ref }}
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Full source-wide regression and closed raw exits
        run: |
          set +e
          evidence="$RUNNER_TEMP/age0d-locale-full"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/HEAD.txt"
          git hash-object v13/code/scripts/age0d_answer_audit.py > "$evidence/AUDIT_BLOB.txt"
          python3 -m venv "$RUNNER_TEMP/age0d-locale-full-venv"
          py="$RUNNER_TEMP/age0d-locale-full-venv/bin/python"
          "$py" -m pip install --no-input -q 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu > "$evidence/INSTALL_RAW.log" 2>&1
          torch_exit=$?
          "$py" -m pip install --no-input -q 'numpy==2.2.6' 'psutil' 'PyYAML' 'Pillow' 'transformers==5.20.2' 'peft==0.21.2' >> "$evidence/INSTALL_RAW.log" 2>&1
          deps_exit=$?
          if [ "$torch_exit" -eq 0 ] && [ "$deps_exit" -eq 0 ]; then echo 0; else echo 1; fi > "$evidence/INSTALL_EXIT.txt"
          (
            cd v13/code
            timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=. "$py" -m unittest discover -s tests -p 'test_*.py' -q
          ) > "$evidence/UNIT_RAW.log" 2>&1
          echo "$?" > "$evidence/UNIT_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/age0d_answer_audit.py v13/code/tests/test_age0d_locale_ambiguity_review.py > "$evidence/COMPILE_RAW.log" 2>&1
          echo "$?" > "$evidence/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 51e23fab7716dc90f3269a505002b002424ef94e --head HEAD > "$evidence/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$evidence/PRIVACY_EXIT.txt"
          git diff --check 51e23fab7716dc90f3269a505002b002424ef94e HEAD > "$evidence/DIFF_RAW.log" 2>&1
          echo "$?" > "$evidence/DIFF_EXIT.txt"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-age0d-locale-full-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/age0d-locale-full/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce all exits and no live correction
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/age0d-locale-full"
          for name in INSTALL UNIT COMPILE PRIVACY DIFF; do
            if [ "$(cat "$evidence/${name}_EXIT.txt")" != 0 ]; then
              echo "$name failed; raw evidence retained"
              tail -80 "$evidence/${name}_RAW.log"
              exit 1
            fi
          done
          echo 'AGE0D_LOCALE_FULL_SOFTWARE_ONLY_STAY_SHADOW'
