name: V13 Run21 AG12 solver identity candidate GREEN
on:
  push:
    branches: [assistant/v13-run21-ag12-solver-identity-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run21-ag12-solver-candidate.yml'
permissions:
  contents: read
jobs:
  ag12-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run bounded real-Store AG12 tests and integrity checks
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run21-candidate"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          74d6f421c1a89f1fbb11af00f0af024f573effd8 v13/code/docs/AG12_SOLVER_IDENTITY_PREREG_RUN21_20261030.md
          27dea154c15b16a00c28c2eed1c7fd23a89c6222 v13/code/tests/test_ag12_solver_identity_run21.py
          a1cab60363814cb86472a42defb5089d4cdbd432 v13/code/v13/agi/generality.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=. python3 -m unittest -v tests.test_ag12_solver_identity_run21 tests.test_ag12_suite_identity_run14h tests.test_ag12_historical_holdout_run14m tests.test_ag12_language_isolation_run14f tests.test_ag12_crosslanguage_holdout_run14p tests.test_ag9_ag12_sqlite_lifecycle_run14d) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m py_compile v13/code/v13/agi/generality.py v13/code/tests/test_ag12_solver_identity_run21.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 8cb422295156ef50199d0c24df2e80d379fac692 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 8cb422295156ef50199d0c24df2e80d379fac692 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original candidate raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run21-ag12-candidate-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run21-candidate/
          retention-days: 30
          if-no-files-found: error
      - name: Require every candidate stage GREEN
        if: always()
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run21-candidate"
          test "$(cat "$e/PINS_EXIT.txt")" = 0
          test "$(cat "$e/TEST_EXIT.txt")" = 0
          test "$(cat "$e/COMPILE_EXIT.txt")" = 0
          test "$(cat "$e/PRIVACY_EXIT.txt")" = 0
          test "$(cat "$e/DIFF_EXIT.txt")" = 0
          echo 'RUN21_AG12_SOLVER_IDENTITY_SOFTWARE_GREEN_NO_UTILITY_PROMOTION'
