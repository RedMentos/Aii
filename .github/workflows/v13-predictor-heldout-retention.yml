name: V13 Predictor Heldout Retention
on:
  pull_request:
    paths:
      - 'v13/code/v13/continuous_predictor.py'
      - 'v13/code/tests/test_online_predictor_heldout_retention.py'
      - '.github/workflows/v13-predictor-heldout-retention.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  predictor-heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3'
      - working-directory: v13/code
        run: python -m unittest -v tests.test_online_predictor_heldout_retention
