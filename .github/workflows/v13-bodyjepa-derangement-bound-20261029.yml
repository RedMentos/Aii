name: V13 Body-JEPA bounded derangement fail-closed focused review
on:
  push:
    branches: [codex/v13-bodyjepa-bounded-derangement-20261029-auto10ao]
    paths:
      - '.github/workflows/v13-bodyjepa-derangement-bound-20261029.yml'
      - 'v13/code/v13/body_jepa.py'
      - 'v13/code/tests/test_bodyjepa_derangement_bound_20261029.py'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact-source bounded RNG tests without native models
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-bj-derangement"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/v13/body_jepa.py v13/code/tests/test_bodyjepa_derangement_bound_20261029.py v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/SOURCE_BLOBS.txt"
          test "$(tail -1 "$e/SOURCE_BLOBS.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          echo "$?" > "$e/CANON_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests:scripts python3 -m unittest -v tests.test_bodyjepa_derangement_bound_20261029) > "$e/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$e/FOCUSED_EXIT.txt"
          python3 -m py_compile v13/code/v13/body_jepa.py v13/code/tests/test_bodyjepa_derangement_bound_20261029.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base e5e054c7059181952ff2919789c2652e7ce97c45 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check e5e054c7059181952ff2919789c2652e7ce97c45 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve raw test output on red and green
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-bj-derangement-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-bj-derangement/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce all focused checks
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-bj-derangement"
          for stage in CANON FOCUSED COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; raw preserved"
              tail -50 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'BODYJEPA_DERANGEMENT_SOFTWARE_ONLY_NO_GATE'
