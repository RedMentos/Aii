name: V13 Run151 registered C3 varied-language AGE0d native holdout
on:
  pull_request:
    paths:
      - ".github/workflows/v13-run151-age0d-terminal-native.yml"
      - "v13/code/scripts/age0d_c3_terminal_native_run151.py"
      - "v13/code/docs/proofs/continuation-20261025/age0d-terminal-native-run151/**"
permissions:
  contents: read
  actions: read
concurrency:
  group: v13-native-c3-run131-serialized
  cancel-in-progress: false
jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Official privacy scan
        run: |
          set -euo pipefail
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
  linux-native-c3:
    needs: privacy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN147_ARTIFACT: ${{ runner.temp }}/RUN147_native.zip
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      NEEDLE_TELEMETRY: "0"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Download exact closed Run147 prior cohort for no-overlap guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --retry-delay 1 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/RedMentos/Aii/actions/artifacts/12585363362/zip" \
            -o "$RUN147_ARTIFACT"
          echo "ddd60c897e1bdc634a40179b67e434097bb1e1999a6a2141372f6272682b9676  $RUN147_ARTIFACT" | sha256sum -c -
      - name: Exact head and isolated Python
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 -m venv "$RUNNER_TEMP/run151"
          "$RUNNER_TEMP/run151/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
          "$RUNNER_TEMP/run151/bin/python" -m compileall -q v13/code/v13 v13/code/scripts/age0d_c3_varied_run151.py
          (cd v13/code && PYTHONPATH=. "$RUNNER_TEMP/run151/bin/python" -m unittest -v tests.test_age0d_c3_terminal_run151 tests.test_answer_arithmetic_shadow_v3_run149)
      - name: Assert registered task and prompt hashes before native model execution
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/run151/bin/python" - <<'PY'
          import hashlib,json,sys
          sys.path.insert(0,'v13/code')
          from scripts.age0d_c3_terminal_native_run151 import tasks,SYSTEM
          task_hash=hashlib.sha256(json.dumps(tasks(),sort_keys=True,separators=(',',':')).encode()).hexdigest()
          prompt_hash=hashlib.sha256(SYSTEM.encode()).hexdigest()
          assert task_hash=='9418de94428bb51a42d4d5e292ab9f5ef5e94acea61382d3f88c1694a7712144'
          assert prompt_hash=='e2a94802abbfc212fead6e70427ab6ac92b84541aabb762043a8ff29101b980d'
          print('RUN151_PREREG_HASHES_PASS')
          PY
      - name: Recheck current native resources and ownership without signalling processes
        run: |
          set -euo pipefail
          uname -a
          df -h "$RUNNER_TEMP"
          free -h
          cat /sys/fs/cgroup/memory.max 2>/dev/null || true
          cat /sys/fs/cgroup/memory.current 2>/dev/null || true
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          p=Path('/sys/fs/cgroup/memory.max')
          value=p.read_text().strip() if p.exists() else 'max'
          current=Path('/sys/fs/cgroup/memory.current')
          used=int(current.read_text()) if current.exists() else 0
          limit=int(value) if value.isdigit() else None
          if limit is not None and limit-used < 1536*1024*1024:
              raise SystemExit('RUN151_REFUSED_MEMORY_BUDGET')
          if shutil.disk_usage('/tmp').free < 1024*1024*1024:
              raise SystemExit('RUN151_REFUSED_DISK_BUDGET')
          print('RUN151_RESOURCE_PREFLIGHT_PASS; native owner only this job; no process signals')
          PY
      - name: Single native C3 registered model and pinned server, retain failures
        id: native
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          export PYTHONPATH="$PWD"
          timeout 840s "$RUNNER_TEMP/run151/bin/python" scripts/age0d_c3_terminal_native_run151.py --prior-zip "$RUN147_ARTIFACT" --home "$RUNNER_TEMP/v13_run151" --report "$RUNNER_TEMP/RUN151_C3_VARIED_NATIVE_REPORT.json" 2>&1 | tee "$RUNNER_TEMP/RUN151_VARIED_NATIVE_RAW.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "RUN151_NATIVE_EXIT=$rc"
          exit 0
      - name: Upload only closed report and raw log, NEVER model bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: V13-Run151-C3-AGE0D-Native-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/RUN151_C3_VARIED_NATIVE_REPORT.json
            ${{ runner.temp }}/RUN151_VARIED_NATIVE_RAW.log
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce actual native outcome
        if: always()
        run: |
          test "${{ steps.native.outputs.exit_code }}" = "0"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'RUN151_C3_VARIED_NATIVE_REPORT.json'
          r=json.loads(p.read_text())
          assert r['status']=='LINUX_NATIVE_C3_COHORT_EXECUTED' and len(r['rows'])==288
          assert r['seed']==15132 and r['age0d_delivery']=='OFF'
          assert r['summary']['gate']=='UNVERIFIED' and r['unload']['process_reaped'] is True
          assert r['gates']['STEP2']=='UTILITY_FAIL' and r['gates']['B3_L1']=='FAIL'
          print('RUN151_NATIVE_COHORT_COMPLETE_GATES_UNCHANGED')
          PY
