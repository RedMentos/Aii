name: V13 Run589 Sleep full-night integrity proof
on:
  push:
    branches:
      - codex/automation11-run589-sleep-full-integrity-20261026
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/run589-sleep-full-integrity.yml'
      - 'v13/code/v13/sleep.py'
      - 'v13/code/tests/test_run589_sleep_full_integrity.py'
      - 'v13/code/docs/proofs/continuation-20261026/run589-sleep-full-integrity/**'
permissions:
  contents: read
jobs:
  sleep-full-integrity:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.ref == 'codex/automation11-run589-sleep-full-integrity-20261026' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install isolated model-free test dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'prompt_toolkit==3.0.52'
      - name: Execute Sleep FULL and existing scheduler software regressions
        shell: bash
        run: |
          mkdir -p run589-raw
          git rev-parse HEAD > run589-raw/source_head.txt
          sha256sum v13/code/v13/sleep.py v13/code/tests/test_run589_sleep_full_integrity.py v13/code/docs/proofs/continuation-20261026/run589-sleep-full-integrity/PREREG.md > run589-raw/source_sha256.txt
          set +e
          (cd v13/code && python -m unittest discover -s tests -p test_run589_sleep_full_integrity.py -v) > run589-raw/new-tests.log 2>&1
          echo "$?" > run589-raw/new-tests.exit
          (cd v13/code && python -m unittest discover -s tests -p test_sleep_scheduler.py -v && python -m unittest discover -s tests -p test_sleep_policy_finite.py -v && python -m unittest discover -s tests -p test_sleep_wake_index_run96.py -v) > run589-raw/regressions.log 2>&1
          echo "$?" > run589-raw/regressions.exit
          python -m compileall -q v13/code/v13/sleep.py v13/code/tests/test_run589_sleep_full_integrity.py > run589-raw/compile.log 2>&1
          echo "$?" > run589-raw/compile.exit
          python v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha || '5d007b19c7fe4bf5fe361de1c2e3eca07eaab714' }}" --head "${{ github.event.pull_request.head.sha || github.sha }}" --no-worktree > run589-raw/privacy.log 2>&1
          echo "$?" > run589-raw/privacy.exit
          set -e
          cat run589-raw/new-tests.log
          cat run589-raw/regressions.log
          cat run589-raw/privacy.log
      - name: Close SHA manifest even on failure
        if: always()
        shell: bash
        run: |
          mkdir -p run589-raw
          (cd run589-raw && sha256sum *.txt *.log *.exit > RAW_SHA256SUMS.txt)
          cat run589-raw/RAW_SHA256SUMS.txt
      - name: Preserve raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run589-sleep-full-integrity-raw
          path: run589-raw/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce tests and privacy
        shell: bash
        run: |
          test "$(cat run589-raw/new-tests.exit)" = 0
          test "$(cat run589-raw/regressions.exit)" = 0
          test "$(cat run589-raw/compile.exit)" = 0
          test "$(cat run589-raw/privacy.exit)" = 0
