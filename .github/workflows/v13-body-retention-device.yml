name: V13 Body-JEPA retention device regression
on:
  push:
    branches: ['codex/v13-body-retention-device-*']
  workflow_dispatch:
jobs:
  retention-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and evaluate retention
        working-directory: v13/code
        run: |
          python -m py_compile v13/body_jepa.py
          python -m pytest -q tests/test_body_jepa_retention_20261108.py tests/test_body_jepa_retention_integrity.py tests/test_body_jepa_retention_device.py
