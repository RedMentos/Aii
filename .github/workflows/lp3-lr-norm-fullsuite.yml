name: V13 LP3 LR norm full software regression
on:
  push:
    branches: [assistant/v13-lp3-lr-normalization-ablation-automation11-20261027]
    paths:
      - '.github/workflows/lp3-lr-norm-fullsuite.yml'
permissions:
  contents: read
concurrency:
  group: v13-lp3-lr-norm-fullsuite
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Full LP3 software suite with raw exits
        run: |
          set +e
          evidence="$RUNNER_TEMP/lp3-lr-norm-full"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/HEAD.txt"
          git hash-object v13/code/scripts/lp3_lr_norm_ablation.py > "$evidence/SOURCE_BLOB.txt"
          python3 -m venv "$RUNNER_TEMP/lp3-lr-norm-full-venv"
          py="$RUNNER_TEMP/lp3-lr-norm-full-venv/bin/python"
          "$py" -m pip install --no-input -q 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu > "$evidence/INSTALL_RAW.log" 2>&1
          first=$?
          "$py" -m pip install --no-input -q 'numpy==2.2.6' 'psutil' 'PyYAML' 'Pillow' 'transformers==5.20.2' 'peft==0.21.2' >> "$evidence/INSTALL_RAW.log" 2>&1
          second=$?
          if [ "$first" -eq 0 ] && [ "$second" -eq 0 ]; then echo 0; else echo 1; fi > "$evidence/INSTALL_EXIT.txt"
          (
            cd v13/code
            timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=.:tests "$py" -m unittest discover -s tests -p 'test_*.py' -q
          ) > "$evidence/UNIT_RAW.log" 2>&1
          echo "$?" > "$evidence/UNIT_EXIT.txt"
          python3 -m compileall -q v13/code/v13 v13/code/scripts/lp3_lr_norm_ablation.py > "$evidence/COMPILE_RAW.log" 2>&1
          echo "$?" > "$evidence/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 73f1ceac47804bfcf7a00e9555e7ab7d0d4b8b83 --head HEAD > "$evidence/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$evidence/PRIVACY_EXIT.txt"
          git diff --check 73f1ceac47804bfcf7a00e9555e7ab7d0d4b8b83 HEAD > "$evidence/DIFF_RAW.log" 2>&1
          echo "$?" > "$evidence/DIFF_EXIT.txt"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-lp3-lr-norm-full-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/lp3-lr-norm-full/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce all genuine exits
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/lp3-lr-norm-full"
          for name in INSTALL UNIT COMPILE PRIVACY DIFF; do
            if [ "$(cat "$evidence/${name}_EXIT.txt")" != 0 ]; then
              echo "$name failed; raw evidence retained"
              tail -80 "$evidence/${name}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'LP3_FULL_SOFTWARE_ONLY_NO_AGE_PROMOTION'
