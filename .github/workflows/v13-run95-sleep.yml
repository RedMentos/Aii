name: V13 Run95 bounded Sleep replay proof

on:
  pull_request:
    paths:
      - "v13/code/v13/sleep.py"
      - "v13/code/tests/test_sleep_replay_window_run95.py"
      - ".github/workflows/v13-run95-sleep.yml"

permissions:
  contents: read

concurrency:
  group: v13-run95-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sleep-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Isolated dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Source-bound SQLite and Sleep regressions
        working-directory: v13/code
        run: |
          set -euo pipefail
          ../../.venv/bin/python -m compileall -q v13 tests
          ../../.venv/bin/python -m unittest -v tests.test_sleep_replay_window_run95 tests.test_sleep_scheduler tests.test_sleep_validation tests.test_homeostasis_regulation
      - name: Official public repository privacy scan
        run: |
          set -euo pipefail
          .venv/bin/python v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
