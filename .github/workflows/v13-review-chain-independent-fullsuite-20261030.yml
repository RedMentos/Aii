name: V13 independent review-chain focused count and unfiltered full software
on:
  push:
    branches:
      - codex/v13-review-chain-audit-fullsuite-20261030-hourly11b
    paths:
      - '.github/workflows/v13-review-chain-independent-fullsuite-20261030.yml'
permissions:
  contents: read
  actions: read
jobs:
  independent-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run 31 focused tests and unfiltered full suite with raw preserved
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          e="$RUNNER_TEMP/v13-review-chain-independent"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          dc0c46fc66c6547bca2f22a9eb7dd2cda2c9d279 v13/code/scripts/step2_budget_paired_native_v3_20261030.py
          57cf6adfa5fce1d1594bfadd25c9b111e105926c v13/code/tests/test_step2_budget_paired_native_v3_20261030.py
          fb34dba97ae3700ba5accdcb928bfb72afcf4fcb v13/code/scripts/c2_native_route_provenance_20261030.py
          3d517b27ddcc8a2fb2fa966be88c8d7eb2984738 v13/code/tests/test_c2_native_route_provenance_20261030.py
          e97bd4ca787f8d8f6b6ac52e06988e590a896103 v13/code/scripts/c2_c3_body_auto_native_smoke_20261030.py
          6b4ee8d2ceaefc17ddb28420eead4d5b09ebf70e v13/code/tests/test_c2_c3_body_auto_native_smoke_20261030.py
          f6bb6c26237f9c94a29a9eeac5ecc6c5fa129ad3 v13/code/scripts/step2_expression_diagnostic_20261030.py
          1ef0799efb29b103fde0c82712c986271c395e4c v13/code/tests/test_step2_expression_diagnostic_20261030.py
          fcd44ccce3b8b40d65a25187a78b0a8d49d9609d v13/code/scripts/step2_paired_raw_validator_audit_20261030.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          954a3f468f10195fbce12d27f68585ee7edee2c9 v13/code/specs/control_tools.json
          BLOBS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            printf '%s %s %s\n' "$want" "$got" "$path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-independent-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-independent-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input -q --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu' > "$e/TORCH_RAW.log" 2>&1
            echo "$?" > "$e/TORCH_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input -q 'transformers==4.44.2' > "$e/TRANSFORMERS_RAW.log" 2>&1
            echo "$?" > "$e/TRANSFORMERS_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input -q 'peft==0.13.2' > "$e/PEFT_RAW.log" 2>&1
            echo "$?" > "$e/PEFT_EXIT.txt"
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
            "$py" -c 'import torch,transformers,peft; assert torch.__version__=="2.5.1+cpu"; assert transformers.__version__=="4.44.2"; assert peft.__version__=="0.13.2"; print(torch.__version__,transformers.__version__,peft.__version__)' > "$e/IMPORT_RAW.log" 2>&1
            echo "$?" > "$e/IMPORT_EXIT.txt"
          else
            for stage in DEPS TORCH TRANSFORMERS PEFT PIP_CHECK IMPORT; do
              echo SKIPPED_VENV_RED > "$e/${stage}_RAW.log"
              echo SKIPPED_RED > "$e/${stage}_EXIT.txt"
            done
          fi
          original="$RUNNER_TEMP/v13-original-native-v3-40996792157.zip"
          curl --fail --location --silent --show-error --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/RedMentos/Aii/actions/artifacts/12951963045/zip' \
            -o "$original" > "$e/DOWNLOAD_RAW.log" 2>&1
          dl="$?"
          if [ "$dl" = 0 ]; then
            printf '%s  %s\n' '98a61f622b64b792f38d766da3ef50e9101571b7e616f2c587d6e89ab5e31c46' "$original" | sha256sum --check >> "$e/DOWNLOAD_RAW.log" 2>&1
            dl="$?"
          fi
          echo "$dl" > "$e/DOWNLOAD_EXIT.txt"
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ] && [ "$dl" = 0 ]; then
            ln -s "$original" v13/code/tests/NATIVE_40996792157.zip
            (cd v13/code && timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=.:scripts:tests "$py" -m unittest -v \
              tests.test_step2_budget_paired_native_v3_20261030 \
              tests.test_c2_native_route_provenance_20261030 \
              tests.test_c2_c3_body_auto_native_smoke_20261030 \
              tests.test_step2_expression_diagnostic_20261030) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
            # Keep original digest-verified ZIP symlink for the unfiltered suite.
            # Its expression diagnostic test also needs the exact native fixture.
            "$py" - "$e/FOCUSED_RAW.log" > "$e/COUNT_RAW.log" 2>&1 <<'PY'
          import pathlib,re,sys
          raw=pathlib.Path(sys.argv[1]).read_text()
          m=re.findall(r'(?m)^Ran (\d+) tests in [0-9.]+s$',raw)
          assert m==['31'],f'EXPECTED_31_ACTUAL_{m}'
          assert re.search(r'(?m)^OK$',raw), 'FOCUSED_NOT_OK'
          assert not re.search(r'(?m)^(FAILED|ERROR|FAIL):',raw), 'FOCUSED_FAILED'
          print('31/31_FOCUSED_TESTS; HISTORICAL_37_EXPECTATION_INCORRECT')
          PY
            echo "$?" > "$e/COUNT_EXIT.txt"
          else
            for stage in FOCUSED COUNT; do
              echo SKIPPED_PREREQUISITE_RED > "$e/${stage}_RAW.log"
              echo SKIPPED_RED > "$e/${stage}_EXIT.txt"
            done
          fi
          if [ "$(cat "$e/IMPORT_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=10s 32m env PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests -p 'test_*.py') > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else
            echo SKIPPED_DEPENDENCY_RED > "$e/FULL_RAW.log"
            echo SKIPPED_RED > "$e/FULL_EXIT.txt"
          fi
          "$py" -m compileall -q v13/code/v13 v13/code/scripts > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 373d50e92c698163aa4ac773f46f27ec13379e85 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 373d50e92c698163aa4ac773f46f27ec13379e85 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original full-suite raw even on RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-review-chain-independent-full-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-review-chain-independent/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce exact focused count and full suite without waivers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-review-chain-independent"
          for stage in PINS VENV DEPS TORCH TRANSFORMERS PEFT PIP_CHECK IMPORT DOWNLOAD FOCUSED COUNT FULL COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained; no gate promotion"
              tail -80 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'INDEPENDENT_FOCUSED_31_AND_FULL_SOFTWARE_ONLY_NOT_NATIVE_OR_REDMI'
