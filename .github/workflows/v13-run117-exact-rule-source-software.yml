name: V13 Run117 exact historical rule source span software candidate (no model)
on:
  push:
    branches: [assistant/v13-run117-exact-rule-source-candidate-20261029]
permissions:
  contents: read
concurrency:
  group: v13-run117-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixture_acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Exact-source checks, deterministic fixtures, focused and full tests
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run117"
          mkdir -p "$e/experiment"
          git rev-parse HEAD > "$e/HEAD.txt"
          source_ok=0
          check() {
            observed="$(git hash-object "$2" 2>/dev/null)" || return 1
            printf '%s %s\n' "$observed" "$2" >> "$e/SOURCE_RAW.log"
            [ "$observed" = "$1" ]
          }
          check 35ff7d424821bf49eeefe249375b16112c33d35e v13/code/docs/proofs/continuation-20261028/RUN117_EXACT_RULE_SOURCE_CANDIDATE_PREREG.md || source_ok=1
          check 53a43b5dfc9ff289bd926544b254b7672cbf5dbb v13/code/docs/proofs/continuation-20261028/RUN117_BRANCH_BUILD_STATE.json || source_ok=1
          check 959cc898e2fd6386d999443b914a5b7c6701386d v13/code/scripts/run117_step2_rule_source_candidate.py || source_ok=1
          check b86fcdc6f915b6a4f6fd7e54df1c93b5d46f6884 v13/code/tests/test_run117_step2_rule_source_candidate.py || source_ok=1
          check 468d2bc72a5584fc6e5c67292968feb3a4125c07 v13/code/scripts/run111_step2_fresh_native_preflight.py || source_ok=1
          check 6cc3d52524e8c9122710eae2a908d024f0f44f24 v13/code/scripts/run109_step2_fresh_fixtures.py || source_ok=1
          check 2ad62fbbf1f6463d99360cdb8198f1104cfdfaf7 v13/code/scripts/step2_z2_timescale.py || source_ok=1
          check a7ba12a8807a1ca8236f1c70d54dedb65c212caa v13/code/tests/integration_step2_utility.py || source_ok=1
          check 7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json || source_ok=1
          check 218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md || source_ok=1
          echo "$source_ok" > "$e/SOURCE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run117-venv"
          py="$RUNNER_TEMP/v13-run117-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          deps_rc="$?"
          if [ "$deps_rc" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
            deps_rc="$?"
          fi
          if [ "$deps_rc" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
            deps_rc="$?"
          fi
          echo "$deps_rc" > "$e/INSTALL_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/run117_step2_rule_source_candidate.py v13/code/tests/test_run117_step2_rule_source_candidate.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$source_ok" = 0 ] && [ "$deps_rc" = 0 ] && [ "$(cat "$e/COMPILE_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 180s "$py" -m scripts.run117_step2_rule_source_candidate --out "$e/experiment/run111-report.json") > "$e/PROBE_RAW.log" 2>&1
            echo "$?" > "$e/PROBE_EXIT.txt"
            (cd v13/code && timeout --signal=TERM --kill-after=5s 180s "$py" -m unittest -v tests.test_run117_step2_rule_source_candidate tests.test_run111_step2_fresh_native_preflight tests.test_run109_step2_fresh_fixtures tests.test_step2_z2) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
            (cd v13/code && timeout --signal=TERM --kill-after=10s 18m "$py" -m unittest discover -s tests -p 'test_*.py') > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else
            for n in PROBE FOCUSED FULL; do echo SKIPPED_PREREQ_RED > "$e/${n}_RAW.log"; echo SKIPPED_RED > "$e/${n}_EXIT.txt"; done
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 12b0e3ad0d1876de83e2ecc38216cc9e268e26ea --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 12b0e3ad0d1876de83e2ecc38216cc9e268e26ea HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - name: Preserve original Run117 software raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run117-rule-source-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce software-only acceptance without gate promotion
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117"
          for n in SOURCE INSTALL COMPILE PROBE FOCUSED FULL PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; original raw retained; STEP2 remains UTILITY_FAIL"
              tail -40 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN117_EXACT_SOURCE_SOFTWARE_ONLY_NO_NATIVE_NO_GATE_PROMOTION
