name: V13 Run117BI grouped-source 350M six-arm software preflight

on:
  push:
    branches:
      - assistant/v13-run117bi-bjepa-grouped-350m-prereg-20261031-hourly11
    paths:
      - .github/workflows/v13-run117bi-bjepa-grouped-350m-preflight.yml
      - v13/code/scripts/bodyjepa_350m_grouped_run117bi.py
      - v13/code/tests/test_bodyjepa_350m_grouped_run117bi.py
      - v13/code/docs/RUN117BI_BJEPA_GROUPED_350M_PREREG_20261031.md

permissions:
  contents: read

jobs:
  six-arm-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen grouped-source cohort, controls and raw receipts
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run117bi"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          42e2a5f3200337a9a83d0d32926ea449a4017109 v13/code/scripts/bodyjepa_350m_grouped_run117bi.py
          f30d6738f85ca2148d442b9e5fa09bb032421182 v13/code/tests/test_bodyjepa_350m_grouped_run117bi.py
          577add70a5108782cedc43cf82a8f3cff72b4067 v13/code/docs/RUN117BI_BJEPA_GROUPED_350M_PREREG_20261031.md
          a09ef0b01b66d9700e9a42b4a10ac21b4ce5d895 v13/code/v13/body_jepa_grouped_contrastive_trainer_shadow.py
          823644a51acd1ea1ed2c8ed17452d0976a25778f v13/code/v13/body_jepa_grouped_source_candidate.py
          a31a18d9be0b1137a10304f24d3a241d720bd247 v13/code/v13/body_jepa_contrastive_trainer_shadow.py
          b560d4e88fe457f381e89dfc5d6188a8ec3b306b v13/code/v13/body_jepa.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          if [ "$bad" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:scripts:tests python3 -c 'from scripts.bodyjepa_350m_grouped_run117bi import fixture,fixture_sha,FIXTURE_SHA256,items_and_heldout; f=fixture(); assert fixture_sha(f)==FIXTURE_SHA256; assert items_and_heldout(f)[2]["source_group_count"]==4; print(FIXTURE_SHA256)') > "$e/FIXTURE_RAW.log" 2>&1
            echo "$?" > "$e/FIXTURE_EXIT.txt"
            (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:scripts:tests python3 -m unittest -v tests.test_bodyjepa_350m_grouped_run117bi tests.test_bodyjepa_350m_contrastive_disjoint_run12c tests.test_body_jepa_grouped_source_candidate tests.test_body_jepa_grouped_trainer_run117be) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else
            for stage in FIXTURE TEST; do echo SKIPPED > "$e/${stage}_RAW.log"; echo SKIPPED > "$e/${stage}_EXIT.txt"; done
          fi
          python3 -m py_compile v13/code/scripts/bodyjepa_350m_grouped_run117bi.py v13/code/tests/test_bodyjepa_350m_grouped_run117bi.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 518cd8c64631edacea44b349543f66d95c580b52 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 518cd8c64631edacea44b349543f66d95c580b52 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117bi-grouped-preflight-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117bi/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce software only, no 350M training claim
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117bi"
          for stage in PINS FIXTURE TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw preserved"
              tail -70 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'RUN117BI_SOFTWARE_ONLY_NO_350M_TRAINING_OR_JEPA_GATE'
