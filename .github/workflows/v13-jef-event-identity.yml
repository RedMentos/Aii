name: V13 JEF event identity
on:
  pull_request:
    paths:
      - 'v13/code/v13/turnflow.py'
      - 'v13/code/tests/test_turnflow_event_identity.py'
      - 'v13/code/tests/test_turnflow_no_offer_evidence.py'
      - 'v13/code/tests/test_turnflow_think_speak.py'
      - '.github/workflows/v13-jef-event-identity.yml'
  workflow_dispatch:
jobs:
  identity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Compile and exercise JEF evidence identity and scheduling
        env:
          PYTHONPATH: v13/code
        run: |
          python -m compileall -q v13/code/v13/turnflow.py v13/code/tests/test_turnflow_event_identity.py
          python -m unittest discover -s v13/code/tests -p 'test_turnflow_event_identity.py' -v
          python -m unittest discover -s v13/code/tests -p 'test_turnflow_no_offer_evidence.py' -v
          python -m pytest -q v13/code/tests/test_turnflow_think_speak.py v13/code/tests/test_turnflow_human_exploration.py
