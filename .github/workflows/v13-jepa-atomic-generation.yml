name: V13 JEPA atomic generation regression
on:
  push:
    branches: ['codex/v13-jepa-atomic-generation-*']
  workflow_dispatch:
jobs:
  generation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pytest
      - name: Compile and test generation, replay and JEPA
        working-directory: v13/code
        run: |
          python -m py_compile v13/world_jepa_generation.py
          python -m pytest -q tests/test_world_jepa_generation_20261108.py tests/test_world_jepa_replay_20261108.py tests/test_world_jepa_incremental_20261108.py tests/test_world_jepa_online_experiment_20261108.py
