name: V13 C3 speech intent contract
on:
  push:
    branches:
      - codex/v13-c3-speech-intent-queue-20261111-1804
  pull_request:
    paths:
      - 'v13/code/v13/speech_intent.py'
      - 'v13/code/tests/test_speech_intent.py'
      - 'v13/code/tests/test_speech_atomic_capacity.py'
      - 'v13/code/v13/speech_operator.py'
      - 'v13/code/tests/test_speech_operator.py'
      - '.github/workflows/v13-c3-speech-intent.yml'
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: cd v13/code && python -m pytest -q tests/test_speech_intent.py tests/test_speech_atomic_capacity.py tests/test_speech_operator.py
