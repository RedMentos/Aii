name: V13 C3 speech intent contract
on:
  pull_request:
    paths:
      - 'v13/code/v13/c3_speech_intent.py'
      - 'v13/code/tests/test_c3_speech_intent.py'
      - '.github/workflows/v13-c3-speech-intent.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: PYTHONPATH=v13/code python -m pytest -q v13/code/tests/test_c3_speech_intent.py
