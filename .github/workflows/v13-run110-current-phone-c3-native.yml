name: V13 Run110 original pinned C3 native source answer from extracted current phone
on:
  push:
    branches:
      - assistant/v13-run110-current-phone-c3-native-e2e-20261031-gpt6
    paths:
      - .github/workflows/v13-run110-current-phone-c3-native.yml
permissions:
  contents: read
concurrency:
  group: v13-native-c3-ag12-20261030
  cancel-in-progress: false
jobs:
  native-c3:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      V13_NO_AUTOSTART: "1"
      DO_NOT_TRACK: "1"
      NEEDLE_TELEMETRY: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned dependencies, extract phone source and run actual C3
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run110"
          source_root="$RUNNER_TEMP/v13-run110-extracted/V13-Phone"
          home="$RUNNER_TEMP/v13-run110-home"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run110-venv" > "$e/VENV_RAW.log" 2>&1
          py="$RUNNER_TEMP/v13-run110-venv/bin/python"
          echo 0 > "$e/VENV_EXIT.txt"
          "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q \
            'numpy==2.2.6' 'prompt-toolkit==3.0.52' psutil PyYAML Pillow > "$e/DEPS_RAW.log" 2>&1
          echo 0 > "$e/DEPS_EXIT.txt"
          "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log"
          set +e
          "$py" v13/code/scripts/package_source.py --root v13/code --out "$e/V13-Phone-Run110.zip" --phone-install > "$e/PACK_RAW.log" 2>&1
          pack_rc=$?
          set -e
          echo "$pack_rc" > "$e/PACK_EXIT.txt"
          if test "$pack_rc" -eq 0; then
            set +e
            "$py" - "$e" "$RUNNER_TEMP/v13-run110-extracted" <<'PY' > "$e/ZIP_RAW.log" 2>&1
          import hashlib,json,sys,zipfile
          from pathlib import Path
          e=Path(sys.argv[1]);dest=Path(sys.argv[2]);p=e/'V13-Phone-Run110.zip'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              manifest=json.loads(z.read('V13-Phone/WORKSPACE_FILES.json'))
              assert manifest['schema_version']==1
              for name,expected in manifest['files'].items():
                  assert hashlib.sha256(z.read('V13-Phone/'+name)).hexdigest()==expected,name
              for name in ('scripts/run93_source_c3_native_e2e.py','scripts/ask_verified_budget.py',
                           'v13/bootstrap.py','v13/runner_activation.py'):
                  assert z.read('V13-Phone/'+name)==(Path('v13/code')/name).read_bytes()
              z.extractall(dest)
          print(json.dumps({'source_files':len(manifest['files']),
                            'phone_zip_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                            'manifest_hashes_pass':True,'redmi_measured':False},sort_keys=True))
          PY
            zip_rc=$?
            set -e
          else
            zip_rc=125
            echo 'PACK_RED' > "$e/ZIP_RAW.log"
          fi
          echo "$zip_rc" > "$e/ZIP_EXIT.txt"
          if test "$zip_rc" -eq 0; then
            set +e
            (cd "$source_root" && env PYTHONPATH=.:scripts:tests "$py" scripts/install_selftest.py --cohort run104_c3_c5_exit --timeout-seconds 120) > "$e/SMOKE_RAW.log" 2>&1
            smoke_rc=$?
            (cd "$source_root" && env PYTHONPATH=.:scripts:tests "$py" scripts/run93_source_c3_native_e2e.py --home "$home" --install) > "$e/INSTALL_RAW.log" 2>&1
            install_rc=$?
            if test "$install_rc" -eq 0; then
              (cd "$source_root" && env PYTHONPATH=.:scripts:tests "$py" scripts/run93_source_c3_native_e2e.py --home "$home" --out "$e/RUN93_NATIVE") > "$e/NATIVE_RAW.log" 2>&1
              native_rc=$?
            else
              native_rc=125
              echo 'PINNED_INSTALL_RED' > "$e/NATIVE_RAW.log"
            fi
            set -e
          else
            smoke_rc=125;install_rc=125;native_rc=125
            echo 'ZIP_RED' > "$e/SMOKE_RAW.log"
            echo 'ZIP_RED' > "$e/INSTALL_RAW.log"
            echo 'ZIP_RED' > "$e/NATIVE_RAW.log"
          fi
          echo "$smoke_rc" > "$e/SMOKE_EXIT.txt"
          echo "$install_rc" > "$e/INSTALL_EXIT.txt"
          echo "$native_rc" > "$e/NATIVE_EXIT.txt"
          if test "$native_rc" -eq 0; then
            set +e
            "$py" - "$e" <<'PY' > "$e/VERIFY_RAW.log" 2>&1
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1])
          r=json.loads((e/'RUN93_NATIVE/run93-report.json').read_text())
          assert r['schema']=='v13.run93.age0_source_c3_linux_native.v1'
          assert r['status']=='SOURCE_C3_ANSWER_PASS'
          assert r['model_sha256']=='3d10b6ab8fc91a919534b9558e266255aca0bbc7f6d015963599aa9e74e05b1d'
          n=r['native']
          assert n['status']=='FINAL' and n['native_calls']==1
          assert n['process_reaped'] is True
          assert n['model_revision']=='657e078c94084481950a2d555a941481f715536b'
          assert n['model_called'] is True
          assert '615' in n['answer']
          assert r['negative_controls']['total_native_calls']==0
          assert r['post_forget_native_calls']==0
          assert r['restart_and_forget']['native_calls']==0
          assert r['negative_gates_promoted'] is False
          assert r['whole_system_complete'] is False
          print('CURRENT_PHONE_SOURCE_NATIVE_C3_ONE_FIXTURE_PASS')
          PY
            verify_rc=$?
            set -e
          else
            verify_rc=125
            echo 'NATIVE_RED_NOT_PROMOTED' > "$e/VERIFY_RAW.log"
          fi
          echo "$verify_rc" > "$e/VERIFY_EXIT.txt"
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 921ba2bf6f60237ef0756d886aff9f7f4a5097ce --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          privacy_rc=$?
          git diff --check 921ba2bf6f60237ef0756d886aff9f7f4a5097ce HEAD > "$e/DIFF_RAW.log" 2>&1
          diff_rc=$?
          set -e
          echo "$privacy_rc" > "$e/PRIVACY_EXIT.txt"
          echo "$diff_rc" > "$e/DIFF_EXIT.txt"
          "$py" - "$e" <<'PY' > "$e/RESULT_RAW.log"
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1]);names=['PACK','ZIP','SMOKE','INSTALL','NATIVE','VERIFY','PRIVACY','DIFF']
          result={'schema':'v13.run110.current_phone_c3_native_regression.v1',
                  'head':(e/'HEAD.txt').read_text().strip(),
                  'exits':{n:int((e/(n+'_EXIT.txt')).read_text()) for n in names},
                  'native_c3_executed':(e/'NATIVE_EXIT.txt').read_text().strip()!='125',
                  'redmi_measured':False,'step2_promoted':False,
                  'b3_promoted':False,'body_jepa_promoted':False,'age_promoted':False}
          (e/'RESULT.json').write_text(json.dumps(result,sort_keys=True)+'\n')
          print(json.dumps(result,sort_keys=True))
          PY
          echo 0 > "$e/RESULT_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat "$e/RESULT_RAW.log"
          tail -n 10 "$e/INSTALL_RAW.log"
          tail -n 12 "$e/NATIVE_RAW.log"
          for rc in "$pack_rc" "$zip_rc" "$smoke_rc" "$install_rc" "$native_rc" "$verify_rc" "$privacy_rc" "$diff_rc"; do test "$rc" -eq 0; done
      - name: Upload original raw results even if RED (no model weights)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run110-current-phone-c3-native-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run110/
          if-no-files-found: warn
          retention-days: 90
