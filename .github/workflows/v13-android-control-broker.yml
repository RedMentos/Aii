name: V13 Android control broker isolated tests
on:
  push:
    branches:
      - codex/v13-android-control-contract-20261111-hour08
  pull_request:
    paths:
      - 'v13/code/v13/android_control.py'
      - 'v13/code/tests/test_android_control.py'
      - 'v13/code/v13/android_control_cli.py'
      - 'v13/code/tests/test_android_control_cli.py'
jobs:
  broker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: PYTHONPATH=v13/code python -m pytest -q v13/code/tests/test_android_control.py v13/code/tests/test_android_control_cli.py
