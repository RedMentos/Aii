name: V13 Run112 independent packages integration
on:
  pull_request:
    paths:
      - "v13/code/v13/episodic_route.py"
      - "v13/code/tests/test_episodic_route_source_run107.py"
      - ".github/workflows/v13-run112-integration.yml"
permissions:
  contents: read
concurrency:
  group: v13-run112-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable integration review
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Isolated model-free dependencies
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Cross-package real SQLite and lab integration
        working-directory: v13/code
        run: |
          set -euo pipefail
          ../../.venv/bin/python -m compileall -q v13 tests
          ../../.venv/bin/python -m unittest -v \
            tests.test_episodic_route_source_run107 \
            tests.test_episodic_route \
            tests.test_episodes \
            tests.test_world_timing_finite_run108 \
            tests.test_world_recovery_invalid_run109 \
            tests.test_world_state \
            tests.test_sandbox \
            tests.test_sandbox_ds2_run110 \
            tests.test_sandbox_composition_run111 \
            tests.test_agi_live \
            tests.test_skilllive \
            tests.test_context_os \
            tests.test_callosum \
            tests.test_age
      - name: Official public repo privacy scan
        run: |
          set -euo pipefail
          .venv/bin/python v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
