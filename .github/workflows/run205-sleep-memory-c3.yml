name: Run205 Age-0 Sleep A/B/C memory continuity (software)
on:
  pull_request:
    paths:
      - 'v13/code/tests/test_sleep_memory_c3_continuity_run205.py'
      - '.github/workflows/run205-sleep-memory-c3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sleep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Isolated software prerequisites
        run: python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Real SleepCycle and C3 test-double continuity
        working-directory: v13/code
        run: |
          python -m unittest -v tests.test_sleep_memory_c3_continuity_run205 tests.test_second_turn_c3_memory_pipeline_run204 tests.test_sleep_offline tests.test_sleep_trace_decay tests.test_sleep_trace_decay_integration tests.test_sleep_policy_finite_integration
          python -m compileall -q tests/test_sleep_memory_c3_continuity_run205.py
      - name: Official public repository privacy scan
        run: python v13/code/scripts/public_repo_privacy_scan.py --base 631ac41ae4b2c8b851bfa2e889957f7ce2590f20 --head HEAD --no-worktree
      - name: Claim boundary
        run: echo 'Manual Sleep on synthetic Runtime; no native training, no weight update, no Redmi, no JEPA'
