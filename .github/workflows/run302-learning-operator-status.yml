name: V13 Run302 read-only learning operator status (software)
on:
  pull_request:
    paths:
      - 'v13/code/v13/operator.py'
      - 'v13/code/tests/test_learning_operator_status_run302.py'
      - '.github/workflows/run302-learning-operator-status.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  learning-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 50
      - name: Exact source and Canon
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/RUN302_HEAD.txt"
          test "$(sha256sum v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md | cut -d' ' -f1)" = 3423906b01b24443fcef733fb5c7ef47296963df63e603d8f843c99d544877ee
          git hash-object v13/code/v13/operator.py v13/code/tests/test_learning_operator_status_run302.py | tee "$RUNNER_TEMP/RUN302_BLOBS.txt"
          python3 -m compileall -q v13/code/v13/operator.py v13/code/tests/test_learning_operator_status_run302.py
      - name: Isolated dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/run302venv"
          "$RUNNER_TEMP/run302venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Real SQLite learning status and phone operator regressions
        id: tests
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          PYTHONPATH="$PWD" "$RUNNER_TEMP/run302venv/bin/python" -m unittest -v \
            tests.test_learning_operator_status_run302 \
            tests.test_learning_invariants \
            tests.test_age \
            tests.test_age_rights \
            tests.test_chat_operator_persistence_run214 \
            tests.test_phone_operator_journey_run86 \
            tests.test_phone_cli_run87 \
            tests.test_phone_learning_integrity_integration 2>&1 | tee "$RUNNER_TEMP/RUN302_TEST_RAW.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUNNER_TEMP/RUN302_TEST_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Official privacy scan
        id: privacy
        run: |
          set -uo pipefail
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree 2>&1 | tee "$RUNNER_TEMP/RUN302_PRIVACY.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUNNER_TEMP/RUN302_PRIVACY_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Close raw evidence
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sha256sum RUN302_HEAD.txt RUN302_BLOBS.txt RUN302_TEST_RAW.log RUN302_TEST_EXIT.txt RUN302_PRIVACY.log RUN302_PRIVACY_EXIT.txt > RUN302_SHA256SUMS.txt
      - name: Persist RED and GREEN raw logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V13-Run302-LearningStatus-Raw-${{ github.sha }}
          path: |
            ${{ runner.temp }}/RUN302_HEAD.txt
            ${{ runner.temp }}/RUN302_BLOBS.txt
            ${{ runner.temp }}/RUN302_TEST_RAW.log
            ${{ runner.temp }}/RUN302_TEST_EXIT.txt
            ${{ runner.temp }}/RUN302_PRIVACY.log
            ${{ runner.temp }}/RUN302_PRIVACY_EXIT.txt
            ${{ runner.temp }}/RUN302_SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce actual exits
        if: always()
        run: |
          test "${{ steps.tests.outputs.rc }}" = "0"
          test "${{ steps.privacy.outputs.rc }}" = "0"
