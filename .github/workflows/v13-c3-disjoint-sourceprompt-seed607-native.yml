name: V13 C3 seed607 disjoint source-prompt nine-call Linux-native diagnostic
on:
  push:
    branches: [assistant/v13-c3-disjoint-sourceprompt-20261031-auto11]
    paths: ['.github/workflows/v13-c3-disjoint-sourceprompt-seed607-native.yml']
permissions:
  contents: read
concurrency:
  group: v13-step2-budget-paired-native-20261030
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen fixture and source pins, software guards, nine native C3 calls, independent replay
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-c3-seed607"
          mkdir -p "$e/receipts"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          0779d986fb8aee8aa01c5df5f656889d4bd56348 v13/code/v13/store.py
          22ed11e4a53d9eeae8fbc74a1753082b5785be2b v13/code/v13/runtime.py
          efda7aa1aa5729e974d0d641870d4da05d21c961 v13/code/v13/runners.py
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          4705a46640134e213aa00a86e02375d972c76cda v13/code/scripts/run47_jef_c3_typed_receiver_native.py
          a73ad91409dbf5b6a62b2b935b6491aad7301db8 v13/code/scripts/run52_b1b2_cross_turn_native.py
          86963812c0172e769f8c9714dfd2de9857534c12 v13/code/docs/C3_DISJOINT_SOURCEPROMPT_SEED607_PREREG_20261031.md
          4a4663ad648c9d3be5fd3902378146f8fabc4ae1 v13/code/docs/fixtures/c3_sourceprompt_seed607.json
          979b5ce060a4b74cab4fa2f801f142a2da40d158 v13/code/scripts/c3_disjoint_sourceprompt_seed607_native.py
          5c0dfb148e6d4366eae41967173c69136c77bb54 v13/code/scripts/c3_disjoint_sourceprompt_seed607_verify.py
          3ad15685dc2d1abdb240aa402bf521b6ee2def1c v13/code/tests/test_c3_disjoint_sourceprompt_seed607.py
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          sha256sum v13/code/docs/fixtures/c3_sourceprompt_seed607.json > "$e/FIXTURE_RAW.log" 2>&1
          test "$(cut -d' ' -f1 "$e/FIXTURE_RAW.log")" = 3d90673610be4536029290756eb652c7eb08acf0c40b61c19c002f8d1d281eb4
          echo "$?" > "$e/FIXTURE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-c3-seed607-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-c3-seed607-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/FIXTURE_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_c3_disjoint_sourceprompt_seed607 tests.test_run59_crossorgan_c6_native tests.test_run58_crossorgan_c6_shadow_candidate tests.test_c6_positive_assertion_candidate tests.test_b1b2_c3_source_envelope_candidate) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PINS_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          export V13_HOME="$RUNNER_TEMP/v13-c3-seed607-installed"
          if [ "$(cat "$e/TEST_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 15m env PYTHONPATH=v13/code "$py" -m v13.bootstrap --home "$V13_HOME" > "$e/BOOTSTRAP_RAW.log" 2>&1
            echo "$?" > "$e/BOOTSTRAP_EXIT.txt"
          else echo SKIPPED_TEST_RED > "$e/BOOTSTRAP_RAW.log"; echo 99 > "$e/BOOTSTRAP_EXIT.txt"; fi
          if [ "$(cat "$e/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 30m env PYTHONPATH=v13/code "$py" v13/code/scripts/c3_disjoint_sourceprompt_seed607_native.py --home "$V13_HOME" --out "$e/pilot" --fixture v13/code/docs/fixtures/c3_sourceprompt_seed607.json > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else echo SKIPPED_BOOTSTRAP_RED > "$e/NATIVE_RAW.log"; echo 99 > "$e/NATIVE_EXIT.txt"; fi
          if [ -f "$e/pilot/report.json" ]; then
            timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=v13/code "$py" v13/code/scripts/c3_disjoint_sourceprompt_seed607_verify.py --report "$e/pilot/report.json" --fixture v13/code/docs/fixtures/c3_sourceprompt_seed607.json > "$e/REPORT_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          else echo NO_NATIVE_REPORT_RED > "$e/REPORT_CHECK_RAW.log"; echo 99 > "$e/REPORT_CHECK_EXIT.txt"; fi
          "$py" -m py_compile v13/code/scripts/c3_disjoint_sourceprompt_seed607_native.py v13/code/scripts/c3_disjoint_sourceprompt_seed607_verify.py v13/code/tests/test_c3_disjoint_sourceprompt_seed607.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base aa0ce5d4808b1afe77a3af373862ae6ea52de052 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check aa0ce5d4808b1afe77a3af373862ae6ea52de052 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          for f in HEAD.txt PINS.txt; do cp "$e/$f" "$e/receipts/"; done
          for s in PINS FIXTURE VENV DEPS TEST BOOTSTRAP NATIVE REPORT_CHECK COMPILE PRIVACY DIFF; do
            cp "$e/${s}_RAW.log" "$e/${s}_EXIT.txt" "$e/receipts/" 2>/dev/null || true
          done
          [ ! -f "$e/pilot/report.json" ] || cp "$e/pilot/report.json" "$e/receipts/ORIGINAL_REPORT.json"
          (cd "$e/receipts" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw including utility RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-c3-seed607-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-c3-seed607/receipts/
          retention-days: 90
          if-no-files-found: error
      - name: Require structural native and frozen prospective utility threshold
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-c3-seed607"
          for s in PINS FIXTURE VENV DEPS TEST BOOTSTRAP NATIVE REPORT_CHECK COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo C3_SEED607_DISJOINT_DIAGNOSTIC_NOT_SECOND_ATTEMPT_OR_PROMOTION
