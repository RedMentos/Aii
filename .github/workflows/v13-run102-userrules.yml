name: V13 Run102 fixed user-rule nondisclosure
on:
  pull_request:
    paths:
      - "v13/code/v13/userrules.py"
      - "v13/code/tests/test_userrules_nondisclosure_run102.py"
      - ".github/workflows/v13-run102-userrules.yml"
permissions:
  contents: read
concurrency:
  group: v13-run102-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  userrules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout review source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Install isolated Python dependencies
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Test actual SQLite user rules and existing G1-G6
        working-directory: v13/code
        run: |
          set -euo pipefail
          ../../.venv/bin/python -m compileall -q v13 tests
          ../../.venv/bin/python -m unittest -v \
            tests.test_userrules_nondisclosure_run102 \
            tests.test_userrules \
            tests.test_prohibitions
      - name: Official public repository privacy scan
        run: |
          set -euo pipefail
          .venv/bin/python v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
