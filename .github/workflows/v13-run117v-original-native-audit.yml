name: V13 Run117V independent audit of original Run117U native RED
on:
  push:
    branches:
      - assistant/v13-run117v-original-native-readonly-audit-20261031-1927
    paths:
      - .github/workflows/v13-run117v-original-native-audit.yml
permissions:
  contents: read
  actions: read
jobs:
  audit-original-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      ORIGINAL_ARTIFACT_ID: '13053405975'
      ORIGINAL_ARTIFACT_SHA: 'eca6ca3801c98fb1afc9cdb41c39f3ba27a4438cb89ad103820397716da699a8'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Read original 15 MB native ZIP by immutable artifact ID and audit without models
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117v-original-audit"
          original="$RUNNER_TEMP/v13-run117u-original-native.zip"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run117v-original-venv" > "$e/VENV_RAW.log" 2>&1
          py="$RUNNER_TEMP/v13-run117v-original-venv/bin/python"
          set +e
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          deps_rc=$?
          curl --fail --silent --show-error --location --retry 2 --max-time 180 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/RedMentos/Aii/actions/artifacts/$ORIGINAL_ARTIFACT_ID/zip" \
            --output "$original" > "$e/DOWNLOAD_RAW.log" 2>&1
          download_rc=$?
          if test "$download_rc" -eq 0; then
            printf '%s  %s\n' "$ORIGINAL_ARTIFACT_SHA" "$original" | sha256sum -c - > "$e/OUTER_SHA_RAW.log" 2>&1
            outer_rc=$?
          else
            outer_rc=125;echo DOWNLOAD_RED > "$e/OUTER_SHA_RAW.log"
          fi
          if test "$deps_rc" -eq 0 && test "$outer_rc" -eq 0; then
            (cd v13/code && env PYTHONPATH=. "$py" scripts/run117v_original_native_readonly_audit.py \
              --artifact "$original" --sha256 "$ORIGINAL_ARTIFACT_SHA" \
              --fixture docs/fixtures/RUN117S_BODY_COMPLEMENTARITY_SEED1061.json \
              --out "$e/INDEPENDENT_AUDIT.json") > "$e/AUDIT_RAW.log" 2>&1
            audit_rc=$?
          else
            audit_rc=125;echo PREREQUISITE_RED > "$e/AUDIT_RAW.log"
          fi
          "$py" -m compileall -q v13/code/scripts/run117v_original_native_readonly_audit.py > "$e/COMPILE_RAW.log" 2>&1
          compile_rc=$?
          python3 v13/code/scripts/public_repo_privacy_scan.py --base a85eb4d3d0050f26404517d49c51c7843f0e933e --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          privacy_rc=$?
          git diff --check a85eb4d3d0050f26404517d49c51c7843f0e933e HEAD > "$e/DIFF_RAW.log" 2>&1
          diff_rc=$?
          for x in "DEPS:$deps_rc" "DOWNLOAD:$download_rc" "OUTER:$outer_rc" "AUDIT:$audit_rc" "COMPILE:$compile_rc" "PRIVACY:$privacy_rc" "DIFF:$diff_rc"; do
            echo "${x#*:}" > "$e/${x%%:*}_EXIT.txt"
          done
          set -e
          "$py" - "$e" <<'PY' > "$e/RESULT_RAW.log"
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1]);names=('DEPS','DOWNLOAD','OUTER','AUDIT','COMPILE','PRIVACY','DIFF')
          r={'schema':'v13.run117v.original_native_artifact_independent_receipt.v1',
             'head':(e/'HEAD.txt').read_text().strip(),
             'original_artifact_id':13053405975,
             'original_artifact_sha256':'eca6ca3801c98fb1afc9cdb41c39f3ba27a4438cb89ad103820397716da699a8',
             'exits':{n:int((e/(n+'_EXIT.txt')).read_text()) for n in names},
             'model_called_by_auditor':False,
             'original_native_result_preserved':'PARTIAL_BODY_QUOTE_RED',
             'step2_promoted':False,'b3_promoted':False,'jepa_weight':0,
             'redmi_measured':False,'whole_system_complete':False}
          (e/'RESULT.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat "$e/RESULT_RAW.log"
          cat "$e/AUDIT_RAW.log"
          for rc in "$deps_rc" "$download_rc" "$outer_rc" "$audit_rc" "$compile_rc" "$privacy_rc" "$diff_rc"; do test "$rc" -eq 0; done
      - name: Preserve original independent GREEN or RED audit receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117v-original-native-audit-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117v-original-audit/
          if-no-files-found: warn
          retention-days: 90
