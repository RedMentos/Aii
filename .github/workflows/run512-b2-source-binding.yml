name: V13 Run512 complete B2 source-slot binding source-only proof
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/run512-b2-source-binding.yml'
      - 'v13/code/scripts/run511_b2_offer_collector.py'
      - 'v13/code/tests/test_run512_b2_source_binding.py'
permissions:
  contents: read
jobs:
  source-only:
    if: ${{ github.event.pull_request.head.ref == 'codex/run512-b2-source-binding-20261026' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 60
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Preregistered exact source pins
        run: |
          set -euo pipefail
          test "$(git hash-object v13/code/docs/proofs/continuation-20261026/run512-b2-source-binding/PREREG.md)" = '95eafcbe6accc70fad951ad31b5b7edcf092889d'
          test "$(git hash-object v13/code/scripts/run511_b2_offer_collector.py)" = 'ab8efec8016d77abc371a5a1d6dae395a06ebb60'
          test "$(git hash-object v13/code/tests/test_run512_b2_source_binding.py)" = 'f8c59acccb636cb68efa12ba0fccb2e0b440cd34'
          test "$(git hash-object v13/code/scripts/run509_b2_rule_quote_prereg.py)" = 'ec8860d2333bd3c4a16caccb9537073a310f32da'
          test "$(git hash-object v13/code/scripts/run510_b2_quote_metric.py)" = 'd2c35f430f9dc0f39c390043197787ea1f6e0cc6'
      - name: Isolated source-only dependencies
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Focused source-only regression
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          ../../.venv/bin/python -m py_compile scripts/run511_b2_offer_collector.py tests/test_run512_b2_source_binding.py
          rc=$?
          if [ "$rc" -eq 0 ]; then
            ../../.venv/bin/python -m unittest -v tests.test_run512_b2_source_binding tests.test_run511_b2_offer_collector tests.test_run510_b2_quote_metric tests.test_run509_b2_rule_quote_prereg > "$RUNNER_TEMP/RUN512_TEST_RAW.log" 2>&1
            rc=$?
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN512_TEST_EXIT.txt"
          exit 0
      - name: Five frozen source-only plans
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          for index in 0 1 2 3 4; do
            mkdir -p "$RUNNER_TEMP/run512-stage-$index"
            ../../.venv/bin/python scripts/run511_b2_offer_collector.py --work "$RUNNER_TEMP/run512-stage-$index" --pair-index "$index" --plan >> "$RUNNER_TEMP/RUN512_PLAN_RAW.log" 2>&1 || break
            cp "$RUNNER_TEMP/run512-stage-$index/RUN511_STAGE_PLAN.json" "$RUNNER_TEMP/RUN512_PLAN_$index.json"
          done
          ../../.venv/bin/python - <<'PY' >> "$RUNNER_TEMP/RUN512_PLAN_RAW.log" 2>&1
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          plans=[json.loads((root/f'RUN512_PLAN_{i}.json').read_text()) for i in range(5)]
          keys=[tuple(k) for p in plans for k in p['row_keys']]
          assert len(keys)==len(set(keys))==60
          assert all(p['native_executed'] is False and p['canonical_gate_pass'] is False for p in plans)
          assert all(p['step2_exit']=='UTILITY_FAIL' and p['b3_l1']=='FAIL' and p['jepa_weight']==0 for p in plans)
          print('RUN512_FROZEN_60_SOURCE_ONLY_NOT_NATIVE')
          PY
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/RUN512_PLAN_EXIT.txt"
          exit 0
      - name: Public repository privacy scan
        if: always()
        run: |
          set -uo pipefail
          set +e
          .venv/bin/python v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree > "$RUNNER_TEMP/RUN512_PRIVACY_RAW.log" 2>&1
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/RUN512_PRIVACY_EXIT.txt"
          exit 0
      - name: Close raw SHA256 evidence
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          find . -maxdepth 1 -type f -name 'RUN512_*' ! -name RUN512_SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > RUN512_SHA256SUMS.txt
      - name: Preserve source-only proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run512-b2-source-binding-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/RUN512_*
          if-no-files-found: error
          retention-days: 30
      - name: Enforce focused tests plans privacy
        if: always()
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/RUN512_TEST_EXIT.txt")" = 0
          test "$(cat "$RUNNER_TEMP/RUN512_PLAN_EXIT.txt")" = 0
          test "$(cat "$RUNNER_TEMP/RUN512_PRIVACY_EXIT.txt")" = 0
