name: V13 Run14U World duplicate JSON candidate and cross-organ
on:
  push:
    branches: [assistant/v13-run14u-world-json-duplicate-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run14u-world-green.yml'
permissions:
  contents: read
jobs:
  world:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify pinned World F4 source and real SQLite recovery tests
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run14u-green"; mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          667fd1b6667b2e934dc8941749b58e59e46ef243 v13/code/docs/WORLD_DUPLICATE_JSON_PREREG_RUN14U_20261030.md
          5e39a749f57cc38a13417b45fd5a9658ece3262f v13/code/tests/test_world_duplicate_json_run14u.py
          03c87501862eb773f80b3704f1e2b8f81b5cfc75 v13/code/v13/world.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run14u-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run14u-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
          echo "$?" > "$e/PIP_CHECK_EXIT.txt"
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 9m env PYTHONPATH=.:tests "$py" -m unittest -v \
              tests.test_world_duplicate_json_run14u \
              tests.test_world_receipt_binding_run424 \
              tests.test_world_valid_recent_window_run431 \
              tests.test_world_corrupt_packet_recovery_run420 \
              tests.test_world_multiaction_recovery_20261028 \
              tests.test_world_modulator_atomicity_run349 \
              tests.test_world_timing_invalid_sample_20261028 \
              tests.test_world_state \
              tests.test_world_model \
              tests.test_world_jepa) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PREREQUISITE > "$e/TEST_RAW.log";echo 99 > "$e/TEST_EXIT.txt";fi
          python3 -m compileall -q v13/code/v13/world.py v13/code/tests/test_world_duplicate_json_run14u.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 3c7ffab524dbb346d115e81067e5f5729dc5057a --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 3c7ffab524dbb346d115e81067e5f5729dc5057a HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve complete candidate raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run14u-green-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run14u-green/
          retention-days: 30
          if-no-files-found: error
      - name: Require all candidate stages GREEN
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run14u-green"
          for stage in PINS VENV DEPS PIP_CHECK TEST COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              tail -100 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
          echo 'WORLD_JSON_SOFTWARE_ONLY; NO_NATIVE_OR_AGE_PROMOTION'
