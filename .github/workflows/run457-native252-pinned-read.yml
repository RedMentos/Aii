name: V13 Run457 post-verification pinned native252 utility reads
on:
  pull_request:
    paths:
      - '.github/workflows/run457-native252-pinned-read.yml'
      - 'v13/code/scripts/run456_native252_utility.py'
      - 'v13/code/tests/test_run457_pinned_utility_reads.py'
      - 'v13/code/docs/proofs/continuation-20261026/run457-pinned-read/**'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      HF_HUB_OFFLINE: '1'
      NO_MODEL_DOWNLOADS: '1'
      V13_NO_AUTOSTART: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Freeze upstream six-receipt verifier and registered cohort
        run: |
          set -euo pipefail
          test "$(git hash-object v13/code/scripts/run453_verify_native252.py)" = "358f2803a9bcaf88aa011a177863b6ff77e65394"
          test "$(git hash-object v13/code/scripts/run394_step2_fresh.py)" = "fae7aed612108a554d8566b2917ebf31022df423"
          test "$(git hash-object v13/code/scripts/run397_step2_resume.py)" = "f1946054135cb6fdf48c06477308f518e2e62ad9"
          sha256sum v13/code/scripts/run456_native252_utility.py v13/code/tests/test_run457_pinned_utility_reads.py > "$RUNNER_TEMP/run457-source-sha256.txt"
          python3 -m venv "$RUNNER_TEMP/run457"
          "$RUNNER_TEMP/run457/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Run original and adversarial post-verify read regressions
        working-directory: v13/code
        run: |
          set +e
          export PYTHONPATH="$PWD:$PWD/scripts"
          "$RUNNER_TEMP/run457/bin/python" -m unittest -v tests.test_run457_pinned_utility_reads tests.test_run456_native252_utility tests.test_run454_verify_native252_adversarial tests.test_run453_verify_native252 tests.test_run436_verify_native210 > "$RUNNER_TEMP/run457-tests.txt" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/run457-tests.txt"
          echo "EXIT=$rc" > "$RUNNER_TEMP/run457-exit.txt"
          exit "$rc"
      - name: Official public repository privacy scan
        if: always()
        run: |
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
      - name: Preserve raw evidence including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run457-pinned-read-${{ github.sha }}
          path: |
            ${{ runner.temp }}/run457-source-sha256.txt
            ${{ runner.temp }}/run457-tests.txt
            ${{ runner.temp }}/run457-exit.txt
          if-no-files-found: warn
          retention-days: 30
