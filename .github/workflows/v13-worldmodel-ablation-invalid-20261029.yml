name: V13 World-Model invalid-output ablation consumer evidence
on:
  push:
    branches: [codex/v13-worldmodel-ablation-invalid-20261029-auto10y]
    paths: ['.github/workflows/v13-worldmodel-ablation-invalid-20261029.yml', 'v13/code/scripts/ablation_world_model_confidence.py', 'v13/code/tests/test_worldmodel_ablation_invalid_20261029.py']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Test exact historical cohort with explicit unscorable negative outcomes
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-worldmodel-ablation-invalid"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/v13/world_model.py v13/code/scripts/ablation_world_model_confidence.py v13/code/tests/test_worldmodel_ablation_invalid_20261029.py > "$e/SOURCE_BLOBS.txt"
          python3 -m venv "$RUNNER_TEMP/venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v test_worldmodel_ablation_invalid_20261029 test_ablation_homeo_meta test_world_model) > "$e/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$e/FOCUSED_EXIT.txt"
          "$py" -m compileall -q v13/code/scripts/ablation_world_model_confidence.py v13/code/tests/test_worldmodel_ablation_invalid_20261029.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 32e6f4846ef03f3d8934f3824f809ff43763a70d --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 32e6f4846ef03f3d8934f3824f809ff43763a70d HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original regression and corrected raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-worldmodel-ablation-invalid-${{ github.sha }}
          path: ${{ runner.temp }}/v13-worldmodel-ablation-invalid/
          if-no-files-found: error
      - name: Enforce source-pinned focused checks
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-worldmodel-ablation-invalid"
          for n in VENV DEPS FOCUSED COMPILE PRIVACY DIFF; do
            test "$(cat "$e/${n}_EXIT.txt")" = 0 || { echo "$n failed; raw preserved"; exit 1; }
          done
