name: V13 Context OS single quote exact span software evidence
on:
  push:
    branches: [codex/v13-contextos-singlequote-exact-20261029-auto10s]
    paths: ['.github/workflows/v13-contextos-singlequote-exact-20261029.yml', 'v13/code/v13/context_os.py', 'v13/code/tests/test_context_os_singlequote_exact_20261029.py']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Run real Store lineage controls and capture exact raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/contextos-singlequote-exact"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/v13/context_os.py v13/code/tests/test_context_os_singlequote_exact_20261029.py > "$e/SOURCE_BLOBS.txt"
          python3 -m venv "$RUNNER_TEMP/venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests:scripts "$RUNNER_TEMP/venv/bin/python" -m unittest -v tests.test_context_os_singlequote_exact_20261029 tests.test_context_os) > "$e/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$e/FOCUSED_EXIT.txt"
          "$RUNNER_TEMP/venv/bin/python" -m compileall -q v13/code/v13/context_os.py v13/code/tests/test_context_os_singlequote_exact_20261029.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base f4f537c398c0a47b8595ca9c9a0b24b2ca7eb2ba --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check f4f537c398c0a47b8595ca9c9a0b24b2ca7eb2ba HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve raw outcomes including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contextos-singlequote-exact-${{ github.sha }}
          path: ${{ runner.temp }}/contextos-singlequote-exact/
          if-no-files-found: error
      - name: Enforce software checks
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/contextos-singlequote-exact"
          for n in VENV DEPS FOCUSED COMPILE PRIVACY DIFF; do
            test "$(cat "$e/${n}_EXIT.txt")" = 0 || { echo "$n failed"; exit 1; }
          done
