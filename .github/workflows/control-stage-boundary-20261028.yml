name: V13 WP-T14 FINAL stage boundary RED GREEN Linux review
on:
  push:
    branches: [assistant/v13-run11-control-stage-boundary-review-20261028]
    paths:
      - '.github/workflows/control-stage-boundary-20261028.yml'
      - 'v13/code/v13/control_budget.py'
      - 'v13/code/tests/test_control_stage_boundary_20261028.py'
permissions:
  contents: read
concurrency:
  group: v13-control-stage-boundary-20261028
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Capture raw focused control-budget tests
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-control-stage-boundary"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/v13/control_budget.py > "$e/SOURCE_BLOB.txt"
          python3 -m venv "$RUNNER_TEMP/v13-control-stage-venv"
          py="$RUNNER_TEMP/v13-control-stage-venv/bin/python"
          "$py" -m pip install --no-input -q 'numpy==2.2.6' 'psutil' 'PyYAML' 'Pillow' 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          echo "$?" > "$e/INSTALL_EXIT.txt"
          if [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 6m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_control_stage_boundary_20261028 tests.test_control_budget_monotonic_20261028 tests.test_control_budget) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else
            echo SKIPPED_INSTALL_RED > "$e/FOCUSED_RAW.log"
            echo SKIPPED_RED > "$e/FOCUSED_EXIT.txt"
          fi
          python3 -m compileall -q v13/code/v13/control_budget.py v13/code/tests/test_control_stage_boundary_20261028.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 28320b825d789ecc4d505a2b86279bcb2fc89927 --head HEAD > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 28320b825d789ecc4d505a2b86279bcb2fc89927 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && sha256sum * > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-control-stage-boundary-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-control-stage-boundary/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce raw exits
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-control-stage-boundary"
          for name in INSTALL FOCUSED COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${name}_EXIT.txt")" != 0 ]; then
              echo "$name RED; raw retained"
              tail -70 "$e/${name}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'CONTROL_BOUNDARY_SOFTWARE_ONLY_NO_REDM I_NO_GATE_PROMOTION'
