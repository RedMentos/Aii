name: V13 phone offer receipt evidence
on:
  push:
    branches:
      - gpt6/native-c3-prompt-witness-20261118
  pull_request:
    paths:
      - 'v13/code/v13/phone_offer_delivery_audit.py'
      - 'v13/code/v13/native_offer_prompt_receipt.py'
      - 'v13/code/v13/runners.py'
      - 'v13/code/tests/test_native_offer_prompt_receipt_20261118.py'
      - 'v13/code/tests/test_phone_offer_delivery_audit.py'
      - 'v13/code/tests/test_phone_offer_evidence_20261116.py'
      - 'v13/code/tests/test_phone_offer_deployed_stage_20261118.py'
      - '.github/workflows/v13-phone-offer-evidence-20261116.yml'
permissions:
  contents: read
jobs:
  metadata-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and run existing plus adversarial no-text audit contracts
        env:
          PYTHONPATH: v13/code
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m py_compile v13/code/v13/phone_offer_delivery_audit.py v13/code/tests/test_phone_offer_delivery_audit.py v13/code/tests/test_phone_offer_evidence_20261116.py v13/code/tests/test_phone_offer_deployed_stage_20261118.py v13/code/v13/native_offer_prompt_receipt.py v13/code/v13/runners.py v13/code/tests/test_native_offer_prompt_receipt_20261118.py
          python -m unittest discover -s v13/code/tests -p 'test_phone_offer_delivery_audit.py' -v
          python -m unittest discover -s v13/code/tests -p 'test_phone_offer_evidence_20261116.py' -v
          python -m unittest discover -s v13/code/tests -p 'test_phone_offer_deployed_stage_20261118.py' -v
          python -m unittest discover -s v13/code/tests -p 'test_native_offer_prompt_receipt_20261118.py' -v
