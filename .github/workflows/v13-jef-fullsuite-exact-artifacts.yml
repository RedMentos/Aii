name: V13 JEF exact original native artifact-fed unfiltered suite
on:
  push:
    branches: [codex/jef-fullsuite-exact-artifacts-20261031-hourly11]
    paths: ['.github/workflows/v13-jef-fullsuite-exact-artifacts.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: v13-native-c3-ag12-20261030
  cancel-in-progress: false
jobs:
  full-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      DO_NOT_TRACK: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned dependencies and full unfiltered cross-organ software
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-jef-artifact-fed"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          d31c93c438f3e15f435b60603866713005c59f93 v13/code/scripts/jef_c3_c5_c6_operator_cli.py
          d9cc9fd46e54a92026fc0d0af21f2a6429e48a9b v13/code/tests/test_jef_operator_policy_isolation.py
          c921d6a0f791d67c4788fbfed2d212ad7696d224 v13/code/docs/JEF_OPERATOR_BACKGROUND_POLICY_ISOLATION_PREREG_20261031.md
          9ed0f549aff4d3e40d93da6388c406902f7ae53e v13/code/docs/JEF_OPERATOR_POLICY_FULLSUITE_PREREG_20261031.md
          6c4ec601e9761776b2e8d21779a07c79a854733e v13/code/docs/JEF_FULLSUITE_EXACT_ARTIFACTS_PREREG_20261031.md
          1ef0799efb29b103fde0c82712c986271c395e4c v13/code/tests/test_step2_expression_diagnostic_20261030.py
          6248791ac8790b386f288b856ad1090f3dc6de44 v13/code/tests/test_run13x_original_native_receipt_replay.py
          283df0c08b849842f8040e8d0a59a1fa8c2a2e1b v13/code/scripts/run13x_original_native_receipt_replay.py
          f6bb6c26237f9c94a29a9eeac5ecc6c5fa129ad3 v13/code/scripts/step2_expression_diagnostic_20261030.py
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          run13t="$RUNNER_TEMP/v13-original-run13t.zip"
          step2="$RUNNER_TEMP/v13-original-step2.zip"
          for pair in "ORIGINAL13_FETCH:12996917793:$run13t" "ORIGINALSTEP2_FETCH:12951963045:$step2"; do
            IFS=: read -r label aid path <<< "$pair"
            curl --fail --location --silent --show-error --retry 3 --retry-delay 2               -H "Authorization: Bearer $GITHUB_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$aid/zip"               --output "$path" > "$e/${label}_RAW.log" 2>&1
            echo "$?" > "$e/${label}_EXIT.txt"
          done
          python3 - "$run13t" "$step2" > "$e/ORIGINAL_VERIFY_RAW.log" 2>&1 <<'PY'
          import hashlib,sys,zipfile
          specs=(
            (sys.argv[1], "86f728599312518bfa67efa0ae16e66be0eaec9ccfd8c3da8710fba40192717c", "d9d0b312168000283e84109ec3e7951304e6520b",39),
            (sys.argv[2], "98a61f622b64b792f38d766da3ef50e9101571b7e616f2c587d6e89ab5e31c46", "5e802d235c9501879a3aff07e5134c1455e1769b",53),
          )
          for path,want,head,count in specs:
            assert hashlib.sha256(open(path,"rb").read()).hexdigest()==want
            with zipfile.ZipFile(path) as z:
              names=z.namelist()
              assert len(names)==len(set(names)) and z.testzip() is None
              assert z.read("HEAD.txt").decode().strip()==head
              entries={}
              for line in z.read("SHA256SUMS").decode().splitlines():
                h,n=line.split("  ",1);n=n.removeprefix("./")
                assert n not in entries and n in names
                assert hashlib.sha256(z.read(n)).hexdigest()==h
                entries[n]=h
              assert len(entries)==count and set(entries)==set(names)-{"SHA256SUMS"}
              if count==39:
                assert len([n for n in names if n.startswith("pilot/raw/") and n.endswith(".json")])==16
            print("EXACT_ORIGINAL_NATIVE_VERIFIED",want,count)
          PY
          echo "$?" > "$e/ORIGINAL_VERIFY_EXIT.txt"
          if [ "$(cat "$e/ORIGINAL13_FETCH_EXIT.txt")" = 0 ] && [ "$(cat "$e/ORIGINALSTEP2_FETCH_EXIT.txt")" = 0 ] && [ "$(cat "$e/ORIGINAL_VERIFY_EXIT.txt")" = 0 ]; then
            cp "$step2" v13/code/tests/NATIVE_40996792157.zip
            echo "$?" > "$e/ORIGINAL_STAGE_EXIT.txt"
            echo "Exact original STEP2 ZIP staged as untracked ephemeral prerequisite" > "$e/ORIGINAL_STAGE_RAW.log"
          else
            echo 99 > "$e/ORIGINAL_STAGE_EXIT.txt"
            echo "ORIGINAL_ZIP_RED_NOT_STAGED" > "$e/ORIGINAL_STAGE_RAW.log"
          fi
          python3 -m venv "$RUNNER_TEMP/v13-jef-policy-full-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-jef-policy-full-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu' > "$e/TORCH_RAW.log" 2>&1
            echo "$?" > "$e/TORCH_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'transformers==4.44.2' > "$e/TRANSFORMERS_RAW.log" 2>&1
            echo "$?" > "$e/TRANSFORMERS_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'peft==0.13.2' > "$e/PEFT_RAW.log" 2>&1
            echo "$?" > "$e/PEFT_EXIT.txt"
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
            "$py" -c 'import torch; assert torch.__version__=="2.5.1+cpu"; print(torch.__version__,torch.cuda.is_available())' > "$e/TORCH_IMPORT_RAW.log" 2>&1
            echo "$?" > "$e/TORCH_IMPORT_EXIT.txt"
            "$py" -c 'import transformers; from transformers import GPT2Config,GPT2LMHeadModel; assert transformers.__version__=="4.44.2"; print(transformers.__version__)' > "$e/TRANSFORMERS_IMPORT_RAW.log" 2>&1
            echo "$?" > "$e/TRANSFORMERS_IMPORT_EXIT.txt"
            "$py" -c 'import peft; from peft import LoraConfig,get_peft_model; assert peft.__version__=="0.13.2"; print(peft.__version__)' > "$e/PEFT_IMPORT_RAW.log" 2>&1
            echo "$?" > "$e/PEFT_IMPORT_EXIT.txt"
          else
            for s in DEPS TORCH TRANSFORMERS PEFT PIP_CHECK TORCH_IMPORT TRANSFORMERS_IMPORT PEFT_IMPORT; do echo SKIPPED > "$e/${s}_EXIT.txt"; echo SKIPPED > "$e/${s}_RAW.log"; done
          fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/ORIGINAL_STAGE_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ] && [ "$(cat "$e/TORCH_EXIT.txt")" = 0 ] && [ "$(cat "$e/TRANSFORMERS_EXIT.txt")" = 0 ] && [ "$(cat "$e/PEFT_EXIT.txt")" = 0 ] && [ "$(cat "$e/TORCH_IMPORT_EXIT.txt")" = 0 ] && [ "$(cat "$e/TRANSFORMERS_IMPORT_EXIT.txt")" = 0 ] && [ "$(cat "$e/PEFT_IMPORT_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 25m env RUN13X_ORIGINAL_ZIP="$run13t" PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests -p 'test_*.py') > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else echo PREREQUISITE_RED > "$e/FULL_RAW.log"; echo 99 > "$e/FULL_EXIT.txt"; fi
          "$py" -m compileall -q v13/code/v13 v13/code/scripts > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 1edd8b3b19997f9d5de3a2f5e0420ef3e4ab40d2 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 1edd8b3b19997f9d5de3a2f5e0420ef3e4ab40d2 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original full-suite raw including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-jef-artifact-fed-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-jef-artifact-fed/
          if-no-files-found: error
          retention-days: 90
      - name: Require every stage zero without native/Redmi promotion
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-jef-artifact-fed"
          for s in PINS ORIGINAL13_FETCH ORIGINALSTEP2_FETCH ORIGINAL_VERIFY ORIGINAL_STAGE VENV DEPS TORCH TRANSFORMERS PEFT PIP_CHECK TORCH_IMPORT TRANSFORMERS_IMPORT PEFT_IMPORT FULL COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo JEF_ARTIFACT_FED_FULL_SOFTWARE_ONLY_NO_PROMOTION
