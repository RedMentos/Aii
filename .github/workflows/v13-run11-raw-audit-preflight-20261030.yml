name: V13 Run11 independent raw ZIP integrity audit software
on:
  push:
    branches:
      - codex/v13-c2-simple-scaffold-native-20261030-hourly11d
    paths:
      - '.github/workflows/v13-run11-raw-audit-preflight-20261030.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run independent ZIP adversarial tests without model
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run11-audit-preflight"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          18971bd49e17ead9662484af4d212e7de27586fd v13/code/scripts/run11_independent_raw_audit_20261030.py
          f585e3bb8b2355e6ecb37ab29f0076b227936ecf v13/code/tests/test_run11_independent_raw_audit_20261030.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests:scripts python3 -m unittest -v tests.test_run11_independent_raw_audit_20261030) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m py_compile v13/code/scripts/run11_independent_raw_audit_20261030.py v13/code/tests/test_run11_independent_raw_audit_20261030.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base e5d1c9b90670006989ac161246aa2793384fc319 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check e5d1c9b90670006989ac161246aa2793384fc319 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original independent audit raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run11-raw-audit-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run11-audit-preflight/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce independent software-only integrity test
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run11-audit-preflight"
          for stage in PINS TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; raw preserved; no native or gate promotion"
              tail -70 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'INDEPENDENT_AUDIT_SOFTWARE_ONLY_NO_NATIVE_OR_GATE'
