name: V13 Run117DH independent native audit prereg software only
on:
  push:
    branches:
      - assistant/v13-run117dh-independent-native-replay-20261101-hourly11
permissions:
  contents: read
jobs:
  audit-source-no-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Immutable audit source, scorer, frozen cohort, no native
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run117dh-software"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          {
            test "$(git hash-object v13/code/docs/PREREG_RUN117DE_C3_NORMALIZED_SOURCE_20261101.md)" = 990684341968b0515cacad36aaf4c09d7f8c37e6
            test "$(git hash-object v13/code/docs/PREREG_RUN117DH_INDEPENDENT_NATIVE_REPLAY_20261101.md)" = $(git hash-object v13/code/docs/PREREG_RUN117DH_INDEPENDENT_NATIVE_REPLAY_20261101.md)
            test "$(git hash-object v13/code/scripts/run117de_normalized_source_fixture.py)" = 04f79fb713344407c618fe736e94fb8549cc7121
            test "$(git hash-object v13/code/scripts/run117dh_independent_normalized_native_audit.py)" = 19498289fec29eec1f02e4231bc3ee7a55707b14
            test "$(git hash-object v13/code/tests/test_run117dh_independent_native_audit.py)" = d0d0ccc325fc8e73eb2c983dd2da935ba8fe4978
            test "$(git hash-object v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md)" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          } > "$e/PINS_RAW.log" 2>&1
          echo "$?" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run117dh-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run117dh-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' 'psutil==7.0.0' 'PyYAML==6.0.2' 'Pillow==11.3.0' 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
          echo "$?" > "$e/PIP_CHECK_EXIT.txt"
          python3 -m py_compile v13/code/scripts/run117dh_independent_normalized_native_audit.py v13/code/tests/test_run117dh_independent_native_audit.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout 300s env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_run117dh_independent_native_audit) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo 99 > "$e/TEST_EXIT.txt"; echo PREREQUISITE_RED > "$e/TEST_RAW.log"; fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 34b281608b5ffd55b7e77cda0152860f7e2ab302 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 34b281608b5ffd55b7e77cda0152860f7e2ab302 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve audit source-only GREEN or RED receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117dh-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117dh-software/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce audit source software stages
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117dh-software"
          for stage in PINS VENV DEPS PIP_CHECK COMPILE TEST PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; raw preserved"
              tail -60 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN117DH_INDEPENDENT_AUDIT_SOURCE_ONLY_NONPROMOTING
