name: V13 Run48 World-JEPA holdout action diagnostic
on:
  push:
    branches:
      - codex/automation11-worldjepa-holdout-diagnostic-20261028
permissions:
  contents: read
concurrency:
  group: v13-run48-holdout-${{ github.ref }}
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      V13_NO_AUTOSTART: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Capture exact source-bound integration evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run48"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          for p in v13/code/v13/agi/eligibility.py v13/code/scripts/run42_b2_eligibility_source_shadow.py v13/code/scripts/run40_b2_store_history_readonly.py; do git hash-object "$p" | xargs -I{} echo "{} $p"; done > "$e/FROZEN_RAW.log"
          if [ "$(git hash-object v13/code/v13/agi/eligibility.py)" = e1f1a2d09a614378a75e397819fdce96a46de22d ] && [ "$(git hash-object v13/code/scripts/run42_b2_eligibility_source_shadow.py)" = d60d38112e9db69cd1ebab2fe5a91e35ca9feb0c ] && [ "$(git hash-object v13/code/scripts/run40_b2_store_history_readonly.py)" = f4befd61f22f87194c0cac070af73a1d7f559d73 ]; then echo 0 > "$e/FROZEN_EXIT.txt"; else echo 1 > "$e/FROZEN_EXIT.txt"; fi
          for p in v13/code/scripts/run44_b2_shadow_readonly_cli.py v13/code/tests/test_run45_bounded_offline_blob.py v13/code/v13/world_jepa.py v13/code/v13/world_jepa_shadow_checkpoint.py v13/code/tests/test_run46_world_jepa_zero_step_evidence.py; do git hash-object "$p" | xargs -I{} echo "{} $p"; done > "$e/PARENT_BYTES_RAW.log"
          if [ "$(git hash-object v13/code/scripts/run44_b2_shadow_readonly_cli.py)" = 9b71ac24cbff98de3b5d184c675e6276166b3a96 ] && [ "$(git hash-object v13/code/tests/test_run45_bounded_offline_blob.py)" = a3758770b617ff2c32dc90409ce96c4272113b15 ] && [ "$(git hash-object v13/code/v13/world_jepa.py)" = b95cd3fd9172ddef0fb88f0a7d70e2921c43e777 ] && [ "$(git hash-object v13/code/v13/world_jepa_shadow_checkpoint.py)" = c7267487262507320c9e4af65a3da04efbf449d6 ] && [ "$(git hash-object v13/code/tests/test_run46_world_jepa_zero_step_evidence.py)" = 7d6b1f21c5dd436e330a44589cbfcbcaa420ed1a ]; then echo 0 > "$e/PARENT_BYTES_EXIT.txt"; else echo 1 > "$e/PARENT_BYTES_EXIT.txt"; fi
          python3 -m venv "$RUNNER_TEMP/v13-run48-venv"
          py="$RUNNER_TEMP/v13-run48-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' > "$e/NUMPY_RAW.log" 2>&1
          echo "$?" > "$e/NUMPY_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 180s env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_run48_world_jepa_holdout_diagnostic tests.test_run45_bounded_offline_blob tests.test_run44_b2_shadow_readonly_cli tests.test_run42_b2_eligibility_source_shadow tests.test_run40_b2_store_history_readonly tests.test_run46_world_jepa_zero_step_evidence tests.test_world_jepa_fit_input_guard tests.test_world_jepa_coverage_integrity tests.test_world_jepa_shadow_checkpoint_20261028 tests.test_world_jepa_atomic_fit tests.test_world_jepa_stale_fit_order tests.test_world_jepa_reader_snapshot) > "$e/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$e/FOCUSED_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/run44_b2_shadow_readonly_cli.py v13/code/v13/world_jepa.py v13/code/v13/world_jepa_shadow_checkpoint.py v13/code/tests/test_run45_bounded_offline_blob.py v13/code/tests/test_run46_world_jepa_zero_step_evidence.py v13/code/v13/world_jepa_holdout_diagnostic.py v13/code/tests/test_run48_world_jepa_holdout_diagnostic.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
            first=$?
            "$py" -m pip install --disable-pip-version-check --no-input 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
            second=$?
            "$py" -m pip install --disable-pip-version-check --no-input 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
            third=$?
            if [ "$first" = 0 ] && [ "$second" = 0 ] && [ "$third" = 0 ]; then
              echo 0 > "$e/INSTALL_EXIT.txt"
              (cd v13/code && timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=.:tests "$py" -m unittest discover -s tests -p 'test_*.py' -q) > "$e/FULL_RAW.log" 2>&1
              echo "$?" > "$e/FULL_EXIT.txt"
            else
              echo 1 > "$e/INSTALL_EXIT.txt"
              echo SKIPPED_PREREQ_RED > "$e/FULL_RAW.log"
              echo SKIPPED_RED > "$e/FULL_EXIT.txt"
            fi
          else
            for n in INSTALL FULL; do echo SKIPPED_FOCUSED_RED > "$e/${n}_RAW.log"; echo SKIPPED_RED > "$e/${n}_EXIT.txt"; done
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 07f31a288cbade3779b791b22b2d4b10ffb8ba59 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check c666f7bd36ca76844e26eba2695b128cb00b9daa HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - name: Preserve original raw software evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run47-b2-worldjepa-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run48/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce integrated software-only proof
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run48"
          for n in FROZEN PARENT_BYTES NUMPY FOCUSED COMPILE INSTALL FULL PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; raw retained; no native or gate promotion"
              tail -40 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN48_WORLD_JEPA_HOLDOUT_DIAGNOSTIC_SOFTWARE_ONLY
