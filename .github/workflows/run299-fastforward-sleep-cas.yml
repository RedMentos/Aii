name: V13 Run299 FastForward Sleep CAS (software)
on:
  pull_request:
    paths:
      - 'v13/code/v13/fastforward.py'
      - 'v13/code/tests/test_fastforward_sleep_cas_run299.py'
      - '.github/workflows/run299-fastforward-sleep-cas.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fastforward-cas:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 50
      - name: Bind exact source and unchanged Canon
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/RUN299_HEAD.txt"
          test "$(sha256sum v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md | cut -d' ' -f1)" = 3423906b01b24443fcef733fb5c7ef47296963df63e603d8f843c99d544877ee
          git hash-object v13/code/v13/fastforward.py v13/code/tests/test_fastforward_sleep_cas_run299.py | tee "$RUNNER_TEMP/RUN299_BLOBS.txt"
          python3 -m compileall -q v13/code/v13/fastforward.py v13/code/tests/test_fastforward_sleep_cas_run299.py
      - name: Isolated Python dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/run299venv"
          "$RUNNER_TEMP/run299venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Actual SQLite Sleep/live race and prior regressions
        id: tests
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          PYTHONPATH="$PWD" "$RUNNER_TEMP/run299venv/bin/python" -m unittest -v \
            tests.test_fastforward_sleep_cas_run299 \
            tests.test_fastforward_reflex \
            tests.test_sleep_scheduler \
            tests.test_sleep_validation \
            tests.test_sleep_trace_decay \
            tests.test_sleep_digest_view_authority_run278 2>&1 | tee "$RUNNER_TEMP/RUN299_TEST_RAW.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUNNER_TEMP/RUN299_TEST_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Official privacy scan
        id: privacy
        run: |
          set -uo pipefail
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree 2>&1 | tee "$RUNNER_TEMP/RUN299_PRIVACY.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUNNER_TEMP/RUN299_PRIVACY_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Hash and upload closed raw evidence
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sha256sum RUN299_HEAD.txt RUN299_BLOBS.txt RUN299_TEST_RAW.log RUN299_TEST_EXIT.txt RUN299_PRIVACY.log RUN299_PRIVACY_EXIT.txt > RUN299_SHA256SUMS.txt
      - name: Persist RED and GREEN evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V13-Run299-FastForwardCAS-Raw-${{ github.sha }}
          path: |
            ${{ runner.temp }}/RUN299_HEAD.txt
            ${{ runner.temp }}/RUN299_BLOBS.txt
            ${{ runner.temp }}/RUN299_TEST_RAW.log
            ${{ runner.temp }}/RUN299_TEST_EXIT.txt
            ${{ runner.temp }}/RUN299_PRIVACY.log
            ${{ runner.temp }}/RUN299_PRIVACY_EXIT.txt
            ${{ runner.temp }}/RUN299_SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce test and privacy exits
        if: always()
        run: |
          test "${{ steps.tests.outputs.rc }}" = "0"
          test "${{ steps.privacy.outputs.rc }}" = "0"
