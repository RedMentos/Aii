name: V13 Sleep S7 user cursor overflow software review
on:
  push:
    branches: [codex/v13-s7-user-cursor-overflow-20261029-auto10d]
    paths: ['.github/workflows/v13-s7-user-cursor-overflow-source-20261029.yml', 'v13/code/v13/history.py', 'v13/code/v13/sleep_offline.py', 'v13/code/tests/test_sleep_user_cursor_overflow_20261029.py']
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      V13_NO_AUTOSTART: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Run exact-head cross-organ and full software tests with closed raw logs
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-s7-user-cursor-overflow-source"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            rc=$?
            if [ "$rc" = 0 ]; then
              "$py" -m pip install --disable-pip-version-check --no-input 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/DEPS_RAW.log" 2>&1
              rc=$?
            fi
            if [ "$rc" = 0 ]; then
              "$py" -m pip install --disable-pip-version-check --no-input 'transformers==5.20.2' 'peft==0.21.2' >> "$e/DEPS_RAW.log" 2>&1
              rc=$?
            fi
            echo "$rc" > "$e/DEPS_EXIT.txt"
          else echo SKIPPED > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_sleep_user_cursor_overflow_20261029 tests.test_sleep_interleaved_final_20261029 tests.test_sleep_digest_session_fairness_20261029 tests.test_sleep_digest_backlog_20261029 tests.test_contextos_sleep_source_integration_20261029 tests.test_sleep_offline tests.test_history_lineage) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests) > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
            "$py" -m compileall -q v13/code/v13/context_os.py v13/code/v13/history.py v13/code/v13/sleep_offline.py v13/code/tests/test_sleep_user_cursor_overflow_20261029.py > "$e/COMPILE_RAW.log" 2>&1
            echo "$?" > "$e/COMPILE_EXIT.txt"
          else
            for n in FOCUSED FULL COMPILE; do echo SKIPPED > "$e/${n}_EXIT.txt"; done
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base f21e965cba76f314ecc8444d23cd2e67e759f567 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check f21e965cba76f314ecc8444d23cd2e67e759f567 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve raw evidence even on test failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-s7-user-cursor-overflow-source-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-s7-user-cursor-overflow-source/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce exact-head software checks
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-s7-user-cursor-overflow-source"
          for n in VENV DEPS FOCUSED FULL COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; raw preserved"
              tail -100 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo "S7_USER_CURSOR_OVERFLOW_SOFTWARE_ONLY_NO_AUTHORITY"
