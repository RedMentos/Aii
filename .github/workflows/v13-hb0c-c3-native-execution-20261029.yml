name: V13 HB0c pinned C3 receiver 24-call Linux-native diagnostic
on:
  push:
    branches: [codex/v13-hb0c-native-execution-20261029]
permissions:
  contents: read
  actions: read
concurrency:
  group: v13-hb0c-native-serial
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Verify external fixture raw, install pinned C3, serial native and closed evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          e="$RUNNER_TEMP/v13-hb0c-native"
          work="$RUNNER_TEMP/v13-hb0c-work"
          home="$RUNNER_TEMP/v13-hb0c-installed"
          pin="73c9f4096a928ece659cfa5aff0c483001346834f6117765ed1c53c9c2b7939b"
          mkdir -p "$e" "$work" "$e/parent"
          git rev-parse HEAD > "$e/HEAD.txt"
          source_red=0
          check() {
            got="$(git hash-object "$2" 2>/dev/null)" || return 1
            printf '%s %s\n' "$got" "$2" >> "$e/SOURCE_RAW.log"
            [ "$got" = "$1" ]
          }
          check 02bbb826c6b06343a773ffb8a1e36d6f619dbebc v13/code/docs/proofs/continuation-20261029/HB0C_NATIVE_EXECUTION_BUILD_STATE.json || source_red=1
          check 486030c7031b5cfa343c935fe39a0f3d74049c65 v13/code/docs/proofs/continuation-20261029/HB0_SPLIT_INFORMATION_COHORT_PREREG.md || source_red=1
          check 329153aaa73df009fdc433523994e372e0fd2c95 v13/code/scripts/hb0_split_information_cohort.py || source_red=1
          check 5a401012bae1835cfeaffd317a65ea3376aef284 v13/code/docs/proofs/continuation-20261029/HB0_ARM_BLIND_EXPORT_PREREG.md || source_red=1
          check 8d6f5b9f0830540d2de72cc624778ff03e7b90ec v13/code/scripts/hb0_arm_export.py || source_red=1
          check ea933b53af8503f5e37d64560e50272ed69288d5 v13/code/docs/proofs/continuation-20261029/HB0_C3_RECEIVER_NATIVE_PREREG.md || source_red=1
          check 41e388c7d34074dfcb86f3cb4f5423ab4b9c8af6 v13/code/scripts/hb0_c3_receiver_native_pilot.py || source_red=1
          check d6d8afc7cc51debefe6f5af05eba404f80e6c5d2 v13/code/tests/test_hb0_c3_receiver_native_pilot.py || source_red=1
          check 7b65fdaa044ebd9d564f1dd06bfa5423e40c1d02 v13/code/scripts/run93_source_c3_native_e2e.py || source_red=1
          check efda7aa1aa5729e974d0d641870d4da05d21c961 v13/code/v13/runners.py || source_red=1
          check bd035cf8029850cce00b179edf533e53bf24358a v13/code/v13/models.py || source_red=1
          check dc23e192bcd01589475692666ebb6568c80d078b v13/code/v13/bootstrap.py || source_red=1
          check 546b97946a5036b7006fb741376e5ca42c7e1440 v13/code/v13/config.py || source_red=1
          check 8efd950c7bc221fbdae3fca200610cb383286001 v13/code/v13/common.py || source_red=1
          check 7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json || source_red=1
          check 218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md || source_red=1
          echo "$source_red" > "$e/SOURCE_EXIT.txt"
          gh run download 40827742335 -n v13-hb0b-arm-export-40827742335-b03d81f87d931a4f5917efaf3cb2323f893c586e -D "$e/parent" > "$e/PARENT_DOWNLOAD_RAW.log" 2>&1
          echo "$?" > "$e/PARENT_DOWNLOAD_EXIT.txt"
          python3 - "$e/parent" "$pin" > "$e/PARENT_VERIFY_RAW.log" 2>&1 <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]);pin=sys.argv[2]
          assert (root/'HEAD.txt').read_text().strip()=='b03d81f87d931a4f5917efaf3cb2323f893c586e'
          assert (root/'FIXTURE_SHA256.txt').read_text().strip()==pin
          lines=(root/'SHA256SUMS.txt').read_text().splitlines()
          assert len(lines)>=18
          for line in lines:
              h,rel=line.split('  ',1)
              assert hashlib.sha256((root/rel.removeprefix('./')).read_bytes()).hexdigest()==h,rel
          manifest=json.loads((root/'bundle/manifest.json').read_text())
          assert manifest['source_fixture_sha256']==pin
          assert manifest['status']=='MODEL_INPUT_PREPARED_SOFTWARE_ONLY_NO_GATE'
          assert manifest['canonical_gate_pass'] is False
          for name in ('prompts.jsonl','answers.jsonl'):
              assert hashlib.sha256((root/'bundle'/name).read_bytes()).hexdigest()==manifest['sha256'][name]
          print('HB0B_22_PLUS_CLOSED_EXTERNAL_FIXTURE_SHA256_OK',pin)
          PY
          echo "$?" > "$e/PARENT_VERIFY_EXIT.txt"
          python3 - "$e" > "$e/RESOURCE_RAW.log" 2>&1 <<'PY'
          import json,platform,shutil,sys
          from pathlib import Path
          info={'platform':platform.platform(),'machine':platform.machine(),
                'disk_free_bytes':shutil.disk_usage(sys.argv[1]).free}
          for line in Path('/proc/meminfo').read_text().splitlines():
              if line.startswith(('MemAvailable:','MemTotal:')):
                  k,v,*_=line.split();info[k.rstrip(':')]=int(v)*1024
          c=Path('/sys/fs/cgroup/memory.max')
          info['cgroup_memory_max']=c.read_text().strip() if c.exists() else 'UNAVAILABLE'
          print(json.dumps(info,sort_keys=True))
          assert platform.system()=='Linux' and platform.machine()=='x86_64'
          assert info['disk_free_bytes']>=3_000_000_000
          assert info.get('MemAvailable',0)>=2_500_000_000
          assert info['cgroup_memory_max'] in ('max','UNAVAILABLE') or int(info['cgroup_memory_max'])>=2_000_000_000
          PY
          echo "$?" > "$e/RESOURCE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-hb0c-native-venv"
          py="$RUNNER_TEMP/v13-hb0c-native-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_DEPS_RAW.log" 2>&1
          echo "$?" > "$e/INSTALL_DEPS_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/hb0_c3_receiver_native_pilot.py v13/code/tests/test_hb0_c3_receiver_native_pilot.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$source_red" = 0 ] && [ "$(cat "$e/PARENT_VERIFY_EXIT.txt")" = 0 ] && [ "$(cat "$e/INSTALL_DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 180s "$py" -m unittest -v tests.test_hb0_c3_receiver_native_pilot tests.test_hb0_arm_export tests.test_hb0_split_information_cohort) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else
            echo SKIPPED_PREREQ_RED > "$e/FOCUSED_RAW.log"; echo SKIPPED_RED > "$e/FOCUSED_EXIT.txt"
          fi
          if [ "$source_red" = 0 ] && [ "$(cat "$e/PARENT_VERIFY_EXIT.txt")" = 0 ] && [ "$(cat "$e/RESOURCE_EXIT.txt")" = 0 ] && [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ] && [ "$(cat "$e/COMPILE_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=15s 22m "$py" -m scripts.run93_source_c3_native_e2e --home "$home" --install) > "$e/BOOTSTRAP_RAW.log" 2>&1
            echo "$?" > "$e/BOOTSTRAP_EXIT.txt"
          else
            echo SKIPPED_PREREQ_RED > "$e/BOOTSTRAP_RAW.log"; echo SKIPPED_RED > "$e/BOOTSTRAP_EXIT.txt"
          fi
          if [ "$(cat "$e/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            python3 - "$home" > "$e/ADMISSION_RAW.log" 2>&1 <<'PY'
          import json,os,sys
          from pathlib import Path
          home=Path(sys.argv[1])
          assert not os.environ.get('V13_LLAMA_SERVER'),'NATIVE_BINARY_OVERRIDE_REFUSED'
          for name in ('config/lora-active.json','config/memory-server.json'):
              path=home/name
              if path.exists():
                  payload=json.loads(path.read_text())
                  assert payload in ({},{'active':{}}),name+':UNAPPROVED_ADAPTER_OR_MEMORY'
          assert (home/'bin/llama-server').is_file()
          print('FRESH_AGE0_NO_ADAPTERS_NO_BINARY_OVERRIDE')
          PY
            echo "$?" > "$e/ADMISSION_EXIT.txt"
          else
            echo SKIPPED_BOOTSTRAP_RED > "$e/ADMISSION_RAW.log"; echo SKIPPED_RED > "$e/ADMISSION_EXIT.txt"
          fi
          if [ "$(cat "$e/ADMISSION_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=20s 35m "$py" -m scripts.hb0_c3_receiver_native_pilot --home "$home" --out "$work/evidence" --fixture-sha256 "$pin") > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else
            echo SKIPPED_ADMISSION_RED > "$e/NATIVE_RAW.log"; echo SKIPPED_RED > "$e/NATIVE_EXIT.txt"
          fi
          if [ -d "$work/evidence" ]; then
            cp -a "$work/evidence" "$e/evidence"
          fi
          if [ "$(cat "$e/NATIVE_EXIT.txt")" = 0 ]; then
            (cd v13/code && "$py" - "$e/evidence" "$pin" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          from scripts import hb0_split_information_cohort as hb0
          from scripts import hb0_c3_receiver_native_pilot as pilot
          root=Path(sys.argv[1]);pin=sys.argv[2]
          def data(name):return json.loads((root/name).read_text())
          receipt=data('RECEIPT.json');raw=data('RAW.json');score=data('SCORE.json');inputs=data('INPUTS.json')
          assert receipt['status']=='RECORDED_LINUX_NATIVE_C3_DIAGNOSTIC_NO_GATE'
          assert receipt['fixture_sha256']==pin and receipt['model_sha256']==pilot.MODEL_SHA
          assert receipt['model_sha256_after']==pilot.MODEL_SHA
          assert receipt['runner_sha256_before']==receipt['runner_sha256_after']
          assert receipt['process_reaped'] is True and receipt['canonical_gate_pass'] is False
          assert receipt['age_authority']==0 and receipt['jepa_weight']==0
          assert receipt['weight_updates'] is False and receipt['redmi_measured'] is False
          assert receipt['whole_system_complete'] is False and receipt['recorded_calls']==24
          assert len(raw['rows'])==24 and raw['status']==receipt['status']
          assert receipt['raw_sha256']==hashlib.sha256((root/'RAW.json').read_bytes()).hexdigest()
          assert receipt['score_sha256']==hashlib.sha256((root/'SCORE.json').read_bytes()).hexdigest()
          assert receipt['input_sha256']==hashlib.sha256((root/'INPUTS.json').read_bytes()).hexdigest()
          assert inputs==pilot.plan(hb0.fixtures(),pin)
          assert score==pilot.score(raw['rows'],hb0.fixtures(),pin)
          assert all(r['metrics']['status']=='FINAL' and r['native_calls']==1 for r in raw['rows'])
          print('HB0C_24_REAL_LINUX_NATIVE_C3_ROWS_CLOSED_NO_GATE',receipt['raw_sha256'])
          PY
            ) > "$e/VERIFY_RAW.log" 2>&1
            echo "$?" > "$e/VERIFY_EXIT.txt"
          else
            echo SKIPPED_NATIVE_RED > "$e/VERIFY_RAW.log"; echo SKIPPED_RED > "$e/VERIFY_EXIT.txt"
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base e7bc434ed68f726d14907695963b6070c0597094 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check e7bc434ed68f726d14907695963b6070c0597094 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - name: Preserve exact raw native and all RED attempts; exclude installed weights
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-hb0c-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-hb0c-native/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce source, parent, native, raw verification and privacy
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-hb0c-native"
          for n in SOURCE PARENT_DOWNLOAD PARENT_VERIFY RESOURCE INSTALL_DEPS COMPILE FOCUSED BOOTSTRAP ADMISSION NATIVE VERIFY PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; original raw retained; no native acceptance or Canon gate promotion"
              tail -60 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo HB0C_C3_LINUX_NATIVE_DIAGNOSTIC_ONLY_NO_STEP2_B3_JEPA_REDMI_GATE
