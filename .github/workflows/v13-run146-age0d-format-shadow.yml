name: V13 Run146 AGE0d format-aware SHADOW candidate
on:
  pull_request:
    paths:
      - ".github/workflows/v13-run146-age0d-format-shadow.yml"
      - "v13/code/v13/agi/answer_arithmetic_shadow_v2.py"
      - "v13/code/tests/test_answer_arithmetic_shadow_v2_run146.py"
      - "v13/code/docs/proofs/continuation-20261025/age0d-format-shadow-run146/**"
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Official privacy scan
        run: |
          set -euo pipefail
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
  shadow-software:
    needs: privacy
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Exact candidate and inherited checker tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 -m compileall -q v13/code/v13/agi/answer_arithmetic_shadow_v2.py v13/code/tests/test_answer_arithmetic_shadow_v2_run146.py
          (cd v13/code && PYTHONPATH=. python3 -m unittest -v tests.test_answer_arithmetic_shadow_v2_run146 tests.test_age0d_answer_arithmetic_run134 tests.test_age0d_run142_readonly_audit)
          test "$(git hash-object v13/code/v13/runtime.py)" = "a691d27bd0772a4fa1f03d57ec90663237bf6825"
          echo "RUN146_SOFTWARE_ONLY_SHADOW_NO_GATE_PROMOTION"
