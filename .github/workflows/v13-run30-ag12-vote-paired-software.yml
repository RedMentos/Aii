name: V13 Run30 AG12 native vote paired read-only diagnostic software preflight
on:
  push:
    branches: [assistant/v13-run30-ag12-vote-paired-audit-20261031-hourly11]
    paths:
      - '.github/workflows/v13-run30-ag12-vote-paired-software.yml'
permissions:
  contents: read
jobs:
  paired-audit-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen audit source, tests, no network and no model execution
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run30-paired-software"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          1854c1b67190843644ac4c1ec540768b0a9f633d v13/code/scripts/run30_ag12_vote_paired_raw_audit.py
          082b7cc68666914bd6ab0f1c3880036f3bd62ea4 v13/code/tests/test_run30_ag12_vote_paired_raw_audit.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          if [ "$bad" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts python3 -m unittest -v tests.test_run30_ag12_vote_paired_raw_audit) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PIN_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          python3 -m py_compile v13/code/scripts/run30_ag12_vote_paired_raw_audit.py v13/code/tests/test_run30_ag12_vote_paired_raw_audit.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base be88168989fb47cac2c8a81db62217468456fb4b --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check be88168989fb47cac2c8a81db62217468456fb4b HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original software raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run30-paired-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run30-paired-software/
          if-no-files-found: error
          retention-days: 90
      - name: Require all stages without any native inference or gate promotion
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-run30-paired-software"
          for stage in PINS TEST COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${stage}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN30_POSTHOC_PAIRED_DIAGNOSTIC_ONLY
