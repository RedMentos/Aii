name: V13 AGE0d answer-aware arithmetic software audit
on:
  push:
    branches: [assistant/v13-age0d-answer-aware-audit-20261027]
    paths:
      - '.github/workflows/age0d-answer-audit.yml'
      - 'v13/code/scripts/age0d_answer_audit.py'
      - 'v13/code/tests/test_age0d_answer_audit.py'
      - 'v13/code/docs/proofs/continuation-20261027/age0d-answer-audit/**'
  pull_request:
    branches: [assistant/v13-world-jepa-digital-shadow-20261027]
permissions:
  contents: read
concurrency:
  group: v13-age0d-${{ github.ref }}
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Frozen fixture, full regression and raw evidence
        run: |
          set +e
          evidence="$RUNNER_TEMP/v13-age0d-answer-audit"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/HEAD.txt"
          git hash-object v13/code/scripts/age0d_answer_audit.py > "$evidence/SOURCE_BLOB.txt"
          git hash-object v13/code/tests/test_age0d_answer_audit.py > "$evidence/TEST_BLOB.txt"
          git hash-object v13/code/docs/proofs/continuation-20261027/age0d-answer-audit/PREREG.md > "$evidence/PREREG_BLOB.txt"
          python3 -m venv "$RUNNER_TEMP/age0d-venv"
          py="$RUNNER_TEMP/age0d-venv/bin/python"
          "$py" -m pip install --no-input -q 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu > "$evidence/INSTALL_RAW.log" 2>&1
          torch_exit=$?
          "$py" -m pip install --no-input -q 'numpy==2.2.6' 'psutil' 'PyYAML' 'Pillow' 'transformers==5.20.2' 'peft==0.21.2' >> "$evidence/INSTALL_RAW.log" 2>&1
          deps_exit=$?
          if [ "$torch_exit" -eq 0 ] && [ "$deps_exit" -eq 0 ]; then echo 0; else echo 1; fi > "$evidence/INSTALL_EXIT.txt"
          (
            cd v13/code
            timeout --signal=TERM --kill-after=10s 2m env PYTHONPATH=. "$py" -m unittest -v tests.test_age0d_answer_audit
          ) > "$evidence/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$evidence/FOCUSED_EXIT.txt"
          (
            cd v13/code
            timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=. "$py" -m unittest discover -s tests -p 'test_*.py' -q
          ) > "$evidence/FULL_RAW.log" 2>&1
          echo "$?" > "$evidence/FULL_EXIT.txt"
          (
            cd v13/code
            PYTHONPATH=. "$py" -c 'import json; from scripts.age0d_answer_audit import score_cases; from tests.test_age0d_answer_audit import FROZEN_ROWS; print(json.dumps(score_cases(FROZEN_ROWS), sort_keys=True))'
          ) > "$evidence/RESULT.json" 2> "$evidence/RESULT_RAW.log"
          echo "$?" > "$evidence/RESULT_EXIT.txt"
          python3 -m py_compile v13/code/scripts/age0d_answer_audit.py v13/code/tests/test_age0d_answer_audit.py > "$evidence/COMPILE_RAW.log" 2>&1
          echo "$?" > "$evidence/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 3a14e9bc62e19a58d6fa4bad1fcddbb3e9c179b2 --head HEAD > "$evidence/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$evidence/PRIVACY_EXIT.txt"
          git diff --check 3a14e9bc62e19a58d6fa4bad1fcddbb3e9c179b2 HEAD > "$evidence/DIFF_RAW.log" 2>&1
          echo "$?" > "$evidence/DIFF_EXIT.txt"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-age0d-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-age0d-answer-audit/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce raw exits, no live delivery or Age promotion
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/v13-age0d-answer-audit"
          for name in INSTALL FOCUSED FULL RESULT COMPILE PRIVACY DIFF; do
            if [ "$(cat "$evidence/${name}_EXIT.txt")" != 0 ]; then
              echo "$name failed; original raw evidence retained"
              tail -80 "$evidence/${name}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'AGE0D_SOFTWARE_ONLY_STAY_SHADOW_NO_AGE_PROMOTION'
