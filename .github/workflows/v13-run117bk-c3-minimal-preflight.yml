name: V13 Run117BK C3 minimal exact-source three-arm software preflight

on:
  push:
    branches:
      - assistant/v13-run117bk-c3-minimal-exact-spans-20261031-hourly11
    paths:
      - .github/workflows/v13-run117bk-c3-minimal-preflight.yml
      - v13/code/docs/fixtures/RUN117BK_C3_MINIMAL_EXACT_SEED1091.json
      - v13/code/scripts/run117bk_c3_minimal_exact_native.py
      - v13/code/tests/test_run117bk_c3_minimal_exact_native.py

permissions:
  contents: read

jobs:
  three-arm-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify new prereg and exact Store minimal/no-prior prompts
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run117bk"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          4a1d3aa5588d38ad9955f78306a00a5d536ab962 v13/code/scripts/run117bk_c3_minimal_exact_native.py
          a01709c1d3b84ed7faeb3041308775a48ec81295 v13/code/tests/test_run117bk_c3_minimal_exact_native.py
          974d05a58d627209d87f7926a2091054b676d225 v13/code/docs/fixtures/RUN117BK_C3_MINIMAL_EXACT_SEED1091.json
          bf891c5c77636b17cfdea924d8754198468db472 v13/code/docs/RUN117BK_C3_MINIMAL_EXACT_PREREG_20261031.md
          9e74d8a64741ce909133ddd8cf42434b738a5d04 v13/code/v13/body_source_id_c3_evidence_bridge_candidate.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          echo '8d004fc2a0b6c80bac103e675b2012b33f1d078451a916a715ff47b0d1db81e4  v13/code/docs/fixtures/RUN117BK_C3_MINIMAL_EXACT_SEED1091.json' | sha256sum -c - > "$e/FIXTURE_RAW.log" 2>&1
          echo "$?" > "$e/FIXTURE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run117bk-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run117bk-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo SKIPPED > "$e/DEPS_RAW.log"; echo SKIPPED > "$e/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/FIXTURE_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=. "$py" -m unittest -v tests.test_run117bk_c3_minimal_exact_native tests.test_run117aq_body_source_c3_bridge tests.test_run117ai_event_source_binding_candidate) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED > "$e/TEST_RAW.log"; echo SKIPPED > "$e/TEST_EXIT.txt"; fi
          python3 -m py_compile v13/code/scripts/run117bk_c3_minimal_exact_native.py v13/code/tests/test_run117bk_c3_minimal_exact_native.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 46f4aa8f7637e651203c94935c87cc890c561662 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 46f4aa8f7637e651203c94935c87cc890c561662 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve all original software raw GREEN or RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117bk-minimal-preflight-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117bk/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce software only with negative gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117bk"
          for stage in PINS FIXTURE VENV DEPS TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw preserved"
              tail -65 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'RUN117BK_SOFTWARE_ONLY_NO_NATIVE_C3_OR_STEP2_GATE'
