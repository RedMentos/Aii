name: V13 Run115I seed983 real pinned C3 source-role native ablation
on:
  push:
    branches:
      - assistant/v13-run115i-native-c3-role-source-ablation-20261031-hourly11
    paths:
      - .github/workflows/v13-run115i-c3-role-native.yml
permissions:
  contents: read
concurrency:
  group: v13-native-c3-ag12-20261030
  cancel-in-progress: false
jobs:
  native-c3:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      V13_NO_AUTOSTART: "1"
      DO_NOT_TRACK: "1"
      NEEDLE_TELEMETRY: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Extract exact phone source, install pinned C3 and execute twelve FINAL attempts
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run115i-native"
          extracted="$RUNNER_TEMP/v13-run115i-extracted/V13-Phone"
          installed="$RUNNER_TEMP/v13-run115i-installed"
          fixture="$GITHUB_WORKSPACE/v13/code/docs/fixtures/RUN115I_C3_ROLE_SOURCE_SEED983.json"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run115i-native-venv" > "$e/VENV_RAW.log" 2>&1
          py="$RUNNER_TEMP/v13-run115i-native-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q \
            'numpy==2.2.6' 'prompt-toolkit==3.0.52' psutil PyYAML Pillow > "$e/DEPS_RAW.log" 2>&1
          "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log"
          set +e
          "$py" v13/code/scripts/package_source.py --root v13/code --out "$e/V13-Phone-Run115I-Native.zip" --phone-install > "$e/PACK_RAW.log" 2>&1
          pack_rc=$?
          set -e
          echo "$pack_rc" > "$e/PACK_EXIT.txt"
          if test "$pack_rc" -eq 0; then
            set +e
            "$py" - "$e" "$RUNNER_TEMP/v13-run115i-extracted" "$fixture" <<'PY' > "$e/ZIP_RAW.log" 2>&1
          import hashlib,json,sys,zipfile
          from pathlib import Path
          e=Path(sys.argv[1]);dest=Path(sys.argv[2]);fixture=Path(sys.argv[3])
          p=e/'V13-Phone-Run115I-Native.zip'
          assert hashlib.sha256(fixture.read_bytes()).hexdigest()=='671aab8745cdb5eb00a0539bf344aa571fe71f7f32ed1e17ed123d8055d51906'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              manifest=json.loads(z.read('V13-Phone/WORKSPACE_FILES.json'))
              for name,expected in manifest['files'].items():
                  assert hashlib.sha256(z.read('V13-Phone/'+name)).hexdigest()==expected,name
              for name in ('scripts/run115i_c3_role_source_native.py',
                           'v13/two_source_c3_role_boundary_candidate.py',
                           'docs/fixtures/RUN115I_C3_ROLE_SOURCE_SEED983.json'):
                  assert z.read('V13-Phone/'+name)==(Path('v13/code')/name).read_bytes()
              z.extractall(dest)
          print(json.dumps({'source_files':len(manifest['files']),
                            'phone_zip_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                            'fixture_sha256':hashlib.sha256(fixture.read_bytes()).hexdigest(),
                            'redmi_measured':False},sort_keys=True))
          PY
            zip_rc=$?
            set -e
          else
            zip_rc=125
            echo 'PACK_RED' > "$e/ZIP_RAW.log"
          fi
          echo "$zip_rc" > "$e/ZIP_EXIT.txt"
          if test "$zip_rc" -eq 0; then
            set +e
            (cd "$extracted" && env PYTHONPATH=.:scripts:tests "$py" scripts/run93_source_c3_native_e2e.py --home "$installed" --install) > "$e/INSTALL_C3_RAW.log" 2>&1
            install_rc=$?
            if test "$install_rc" -eq 0; then
              (cd "$extracted" && env PYTHONPATH=.:scripts:tests "$py" scripts/run115i_c3_role_source_native.py --fixture "$fixture" --work "$RUNNER_TEMP/v13-run115i-native-work" --out "$e/NATIVE_CASE" --installed "$installed") > "$e/NATIVE_RAW.log" 2>&1
              native_rc=$?
            else
              native_rc=125
              echo 'INSTALL_C3_RED' > "$e/NATIVE_RAW.log"
            fi
            set -e
          else
            install_rc=125;native_rc=125
            echo 'ZIP_RED' > "$e/INSTALL_C3_RAW.log"
            echo 'ZIP_RED' > "$e/NATIVE_RAW.log"
          fi
          echo "$install_rc" > "$e/INSTALL_C3_EXIT.txt"
          echo "$native_rc" > "$e/NATIVE_EXIT.txt"
          if test "$native_rc" -eq 0; then
            set +e
            "$py" - "$e" <<'PY' > "$e/VERIFY_RAW.log" 2>&1
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1]);r=json.loads((e/'NATIVE_CASE/report.json').read_text())
          assert r['schema']=='v13.run115i.c3_role_source_native.v1'
          assert r['fixture_sha256']=='671aab8745cdb5eb00a0539bf344aa571fe71f7f32ed1e17ed123d8055d51906'
          assert r['seed']==983 and r['native'] is True
          assert r['status'] in ('NATIVE_COMPLETE_ROLE_SIGNAL','NATIVE_COMPLETE_NO_GAIN')
          assert r['native_c3_calls']==12 and r['native_b1_calls']==0 and r['native_b2_calls']==0
          assert r['native_c2'] is False and r['native_jef'] is False
          assert len(r['rows'])==6 and set(r['scores'])=={'FULL_TWO_SOURCE','CURRENT_ONLY'}
          assert all(0<=v<=6 for v in r['scores'].values())
          assert r['exploratory_role_signal'] is (
              r['scores']['FULL_TWO_SOURCE']>=5 and
              r['scores']['FULL_TWO_SOURCE']-r['scores']['CURRENT_ONLY']>=2 and
              all(next(a for a in row['arms'] if a['arm']=='FULL_TWO_SOURCE')['score']['parsed']
                  in ({'choice':'NONE','remaining':None},None)
                  for row in r['rows'] if row['id'] in ('Nyxford','Morenix')))
          for row in r['rows']:
              assert row['status']=='RECORDED' and row['closed_store_ok'] is True
              assert row['no_live_output'] is True and len(row['source_refs'])==2
              assert len(row['arms'])==2 and set(x['arm'] for x in row['arms'])=={'FULL_TWO_SOURCE','CURRENT_ONLY'}
              for arm in row['arms']:
                  assert arm['status']=='RECORDED' and arm['native_final'] is True
                  assert arm['process_reaped'] is True
                  assert arm['native_metrics']['status']=='FINAL'
                  assert arm['native_metrics']['actual_model']=='LFM2.5-350M-QAD-Q4_0.gguf'
                  assert len(arm['messages'])==2
                  assert [m['role'] for m in arm['messages']]==['system','user']
                  assert 'oracle' not in arm['messages'][0]['content'].lower()
          assert r['age0']=='RECORD_ONLY' and r['jepa_weight']==0
          assert r['step2_exit']=='EVIDENCE_NOT_PASSING' and r['b3']=='NO_PROMOTION'
          assert r['output_committed'] is False and r['tool_dispatches']==0
          assert r['learning_authority']==0 and r['delivery_authority']==0
          assert r['whole_system_complete'] is False and r['redmi_measured'] is False
          print(json.dumps({'status':r['status'],'scores':r['scores'],
                            'exploratory_role_signal':r['exploratory_role_signal'],
                            'native_c3_calls':12,'step2_promoted':False},sort_keys=True))
          PY
            verify_rc=$?
            set -e
          else
            verify_rc=125
            echo 'NATIVE_RED_NOT_PROMOTED' > "$e/VERIFY_RAW.log"
          fi
          echo "$verify_rc" > "$e/VERIFY_EXIT.txt"
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 39f0244fab8e1ac6252a3ea8730184cda82ae10f --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          privacy_rc=$?
          git diff --check 39f0244fab8e1ac6252a3ea8730184cda82ae10f HEAD > "$e/DIFF_RAW.log" 2>&1
          diff_rc=$?
          set -e
          echo "$privacy_rc" > "$e/PRIVACY_EXIT.txt"
          echo "$diff_rc" > "$e/DIFF_EXIT.txt"
          "$py" - "$e" <<'PY' > "$e/RESULT_RAW.log"
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1]);names=['PACK','ZIP','INSTALL_C3','NATIVE','VERIFY','PRIVACY','DIFF']
          r={'schema':'v13.run115i.seed983.native_evidence.v1',
             'head':(e/'HEAD.txt').read_text().strip(),
             'exits':{n:int((e/(n+'_EXIT.txt')).read_text()) for n in names},
             'native_c3_attempted':int((e/'NATIVE_EXIT.txt').read_text())!=125,
             'native_b1_executed':False,'native_b2_executed':False,
             'native_c2_executed':False,'native_jef_executed':False,
             'redmi_measured':False,'step2_promoted':False,
             'b3_promoted':False,'body_jepa_promoted':False}
          (e/'RESULT.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat "$e/RESULT_RAW.log"
          tail -n 14 "$e/NATIVE_RAW.log"
          for rc in "$pack_rc" "$zip_rc" "$install_rc" "$native_rc" "$verify_rc" "$privacy_rc" "$diff_rc"; do test "$rc" -eq 0; done
      - name: Preserve original native GREEN or RED without weights
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run115i-seed983-c3-native-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run115i-native/
          if-no-files-found: warn
          retention-days: 90
