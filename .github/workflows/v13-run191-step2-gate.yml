name: V13 Run191 STEP2 native complementarity gate honesty

on:
  pull_request:
    paths:
      - "v13/code/specs/gate-graph.json"
      - "v13/code/tests/test_run191_step2_complementarity_gate.py"
      - ".github/workflows/v13-run191-step2-gate.yml"

permissions:
  contents: read

concurrency:
  group: v13-run191-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact review source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 50
          filter: blob:none
          sparse-checkout: |
            v13/code
            v13/bench-results/timescale-gate-20261009

      - name: Execute independent STEP2 gate tests
        shell: bash
        working-directory: v13/code
        run: |
          set -euo pipefail
          python3 -m compileall -q v13/gates.py tests/test_run191_step2_complementarity_gate.py
          python3 -m unittest -v tests.test_run191_step2_complementarity_gate

      - name: Official public-repo privacy scan
        shell: bash
        run: |
          set -euo pipefail
          python3 v13/code/scripts/public_repo_privacy_scan.py \
            --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
