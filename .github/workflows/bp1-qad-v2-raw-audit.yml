name: V13 BP1 independent V2 original ZIP auditor software counterexamples
on:
  push:
    branches: [codex/automation11-bp1-v2-raw-audit-20261027]
    paths:
      - '.github/workflows/bp1-qad-v2-raw-audit.yml'
      - 'v13/code/scripts/bp1_qad_v2_raw_audit.py'
      - 'v13/code/tests/test_bp1_qad_v2_raw_audit.py'
permissions:
  contents: read
concurrency:
  group: v13-bp1-v2-raw-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Source-bound synthetic counterexamples, compile and privacy
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/bp1-v2-raw-audit"
          git rev-parse HEAD > "$RUNNER_TEMP/bp1-v2-raw-audit/HEAD.txt"
          sha256sum v13/code/scripts/bp1_qad_v2_raw_audit.py v13/code/tests/test_bp1_qad_v2_raw_audit.py > "$RUNNER_TEMP/bp1-v2-raw-audit/SOURCE_SHA256.txt"
          (cd v13/code && PYTHONPATH="$PWD:$PWD/scripts" python3 -m unittest -v tests.test_bp1_qad_v2_raw_audit) > "$RUNNER_TEMP/bp1-v2-raw-audit/UNIT_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp1-v2-raw-audit/UNIT_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/bp1_qad_v2_raw_audit.py v13/code/tests/test_bp1_qad_v2_raw_audit.py > "$RUNNER_TEMP/bp1-v2-raw-audit/COMPILE_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp1-v2-raw-audit/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base ca954bf471a4d96abb4e84c8dcd847c75a5b1186 --head HEAD > "$RUNNER_TEMP/bp1-v2-raw-audit/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp1-v2-raw-audit/PRIVACY_EXIT.txt"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bp1-v2-raw-audit-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/bp1-v2-raw-audit/
          if-no-files-found: error
      - name: Enforce every software exit
        run: |
          set -euo pipefail
          for n in UNIT COMPILE PRIVACY; do
            test "$(cat "$RUNNER_TEMP/bp1-v2-raw-audit/${n}_EXIT.txt")" = 0 || {
              tail -100 "$RUNNER_TEMP/bp1-v2-raw-audit/${n}_RAW.log"; exit 1;
            }
          done
          echo "BP1_V2_RAW_AUDITOR_SYNTHETIC_ONLY_NO_NATIVE_UTILITY"
