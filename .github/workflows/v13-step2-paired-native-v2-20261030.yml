name: V13 STEP2 v2 fresh disjoint paired C3 and two-body native budget pilot
on:
  push:
    branches:
      - codex/v13-step2-paired-native-v2-20261030-hourly11
    paths:
      - '.github/workflows/v13-step2-paired-native-v2-20261030.yml'
      - 'v13/code/scripts/step2_budget_paired_native_v2_20261030.py'
      - 'v13/code/tests/test_step2_budget_paired_native_v2_20261030.py'
permissions:
  contents: read
concurrency:
  group: v13-step2-budget-paired-native-20261030
  cancel-in-progress: false
jobs:
  paired-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Serial fixed 4x3 native STEP2 pilot with raw and fail-closed checks
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-step2-paired-native-v2"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/CANON_BLOB.txt"
          git hash-object v13/code/specs/models.json > "$e/CATALOG_BLOB.txt"
          git hash-object v13/code/specs/control_tools.json > "$e/TOOLS_BLOB.txt"
          git hash-object v13/code/scripts/step2_budget_paired_native_v2_20261030.py v13/code/tests/test_step2_budget_paired_native_v2_20261030.py v13/code/scripts/step2_paired_raw_validator_audit_20261030.py > "$e/SOURCE_BLOBS.txt"
          test "$(cat "$e/CANON_BLOB.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7 &&
          test "$(cat "$e/CATALOG_BLOB.txt")" = 7af05962af41d0bc3f7dd18ef01d4eba55eabf99 &&
          test "$(cat "$e/TOOLS_BLOB.txt")" = 954a3f468f10195fbce12d27f68585ee7edee2c9 &&
          test "$(sed -n '1p' "$e/SOURCE_BLOBS.txt")" = 6bd49f34c0abba03bf459a2031d2fe19ac290bcf &&
          test "$(sed -n '2p' "$e/SOURCE_BLOBS.txt")" = ff39f76dd2551b945a9f928b5b53f0918225e0b3 &&
          test "$(sed -n '3p' "$e/SOURCE_BLOBS.txt")" = fcd44ccce3b8b40d65a25187a78b0a8d49d9609d
          echo "$?" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-step2-paired-v2-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-step2-paired-v2-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else
            echo SKIPPED_VENV_RED > "$e/DEPS_RAW.log"
            echo SKIPPED_RED > "$e/DEPS_EXIT.txt"
          fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_step2_budget_paired_native_v2_20261030 tests.test_step2_paired_raw_validator_audit_20261030 tests.test_step2_currentchain_native_semantic_gap_20261030) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else
            echo SKIPPED_DEPS_RED > "$e/FOCUSED_RAW.log"
            echo SKIPPED_RED > "$e/FOCUSED_EXIT.txt"
          fi
          export V13_HOME="$RUNNER_TEMP/v13-step2-paired-v2-installed"
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ] && [ "$(cat "$e/PINS_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 15m env PYTHONPATH=v13/code "$py" -m v13.bootstrap --home "$V13_HOME" > "$e/BOOTSTRAP_RAW.log" 2>&1
            echo "$?" > "$e/BOOTSTRAP_EXIT.txt"
          else
            echo SKIPPED_FOCUSED_RED > "$e/BOOTSTRAP_RAW.log"
            echo SKIPPED_RED > "$e/BOOTSTRAP_EXIT.txt"
          fi
          if [ "$(cat "$e/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 28m env PYTHONPATH=v13/code "$py" v13/code/scripts/step2_budget_paired_native_v2_20261030.py --home "$V13_HOME" --out "$e/pilot" > "$e/PILOT_RAW.log" 2>&1
            echo "$?" > "$e/PILOT_EXIT.txt"
          else
            echo SKIPPED_BOOTSTRAP_RED > "$e/PILOT_RAW.log"
            echo SKIPPED_RED > "$e/PILOT_EXIT.txt"
          fi
          if [ "$(cat "$e/PILOT_EXIT.txt")" = 0 ]; then
            "$py" - "$e/pilot/report.json" > "$e/REPORT_CHECK_RAW.log" 2>&1 <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          assert j['schema']=='v13.step2.budget_paired_native_pilot.v2'
          assert j['status']=='PILOT_COMPLETE_NO_GATE'
          assert j['fixture_sha256']=='b8dba3465d80aa90142065550a6d1b6770b562fd852e25f598ec8260d2bf6cf4'
          assert j['seed']==29 and len(j['rows'])==12
          assert all(x['valid_native'] is True and x['route_override_evidence_valid'] is True for x in j['rows'])
          assert j['native_c2_control_proven'] is False
          assert all(x['native_c2_control_proven'] is False for x in j['rows'])
          assert sum(len(x['native_process_releases']) for x in j['rows'])==16
          assert all(y['process_reaped'] is True for x in j['rows'] for y in x['native_process_releases'])
          assert j['comparative_step2_gate_promoted'] is False
          assert j['redmi_measured'] is False and j['jepa_weight']==0
          assert all(0<=v<=8 for v in j['score_totals_out_of_8'].values())
          print('FRESH_PAIRED_NATIVE_V2_INTERMEDIATE_NO_C2_OR_STEP2_GATE',j['score_totals_out_of_8'])
          PY
            echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          else
            echo SKIPPED_PILOT_RED > "$e/REPORT_CHECK_RAW.log"
            echo SKIPPED_RED > "$e/REPORT_CHECK_EXIT.txt"
          fi
          "$py" -m py_compile v13/code/scripts/step2_budget_paired_native_v2_20261030.py v13/code/tests/test_step2_budget_paired_native_v2_20261030.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 8c0d07947edb81a1cf7cbaaa63cfbcc8522d2e3c --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 8c0d07947edb81a1cf7cbaaa63cfbcc8522d2e3c HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-step2-paired-native-v2-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-step2-paired-native-v2/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce native pilot without STEP2 gate promotion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-step2-paired-native-v2"
          for stage in PINS VENV DEPS FOCUSED BOOTSTRAP PILOT REPORT_CHECK COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained; no native pilot PASS"
              tail -80 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'PAIRED_NATIVE_V2_INTERMEDIATE_NO_C2_STEP2_B3_JEPA_REDMI_OR_AGE_PROMOTION'
