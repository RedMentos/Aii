name: V13 Run111 compositional grounding lab
on:
  pull_request:
    paths:
      - "v13/code/v13/sandbox_composition.py"
      - "v13/code/tests/test_sandbox_composition_run111.py"
      - "v13/code/scripts/sandbox_composition_bench_run111.py"
      - ".github/workflows/v13-run111-composition.yml"
permissions:
  contents: read
concurrency:
  group: v13-run111-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  composition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable review source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Preregistered toy composition tests
        working-directory: v13/code
        run: |
          set -euo pipefail
          python3 -m compileall -q tests/test_sandbox_composition_run111.py scripts/sandbox_composition_bench_run111.py
          python3 -m unittest -v tests.test_sandbox_composition_run111 tests.test_sandbox
      - name: Locked 20-seed unseen phrase ablation
        working-directory: v13/code
        run: |
          set -euo pipefail
          python3 scripts/sandbox_composition_bench_run111.py
      - name: Official privacy scan
        run: |
          set -euo pipefail
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
