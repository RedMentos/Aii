name: V13 Run14A AG9 read-side component containment
on:
  push:
    branches: [assistant/v13-run14a-ag9-invalid-component-read-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run14a-ag9-read-component.yml'
      - 'v13/code/v13/agi/metacog.py'
      - 'v13/code/tests/test_ag9_read_component_run14a.py'
permissions:
  contents: read
jobs:
  ag9-read-side:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned test-first AG9 read-side evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run14a-ag9"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          658b3c04bd95907211d1f5f7601436d3370d68e1 v13/code/v13/agi/metacog.py
          287d2709dc82cc1ab4dd4a754f6b6cd8bf22e32a v13/code/tests/test_ag9_read_component_run14a.py
          b8dea13fe5482c6e3dd82300669cdad9d7d1a5b3 v13/code/docs/RUN14A_AG9_READ_COMPONENT_PREREG_20261030.md
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 2m env PYTHONPATH=. python3 -m unittest -v tests.test_ag9_read_component_run14a tests.test_ag9_finite_confidence_run13y tests.test_ag9_heldout_shadow_run13z) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m py_compile v13/code/v13/agi/metacog.py v13/code/tests/test_ag9_read_component_run14a.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 7e7d57e1db88642f4fcd447eda2c012c1e625bfb --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 7e7d57e1db88642f4fcd447eda2c012c1e625bfb HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve exact original raw evidence even on RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run14a-ag9-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run14a-ag9/
          if-no-files-found: error
          retention-days: 30
      - name: Explicit scoped verdict
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run14a-ag9"
          for stage in PINS TEST COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            test "$(cat "$e/${stage}_EXIT.txt")" = 0
          done
