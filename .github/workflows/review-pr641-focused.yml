name: PR641 exact route label focused RED/GREEN
on:
  push:
    branches:
      - codex/review-claude-pr641-label-integrity-20261027
    paths:
      - '.github/workflows/review-pr641-focused.yml'
      - 'v13/code/v13/learning_worker.py'
      - 'v13/code/tests/test_review_pr641_exact_route_labels.py'
permissions:
  contents: read
concurrency:
  group: v13-review641-focused
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.sha }}
      - name: Install isolated deps
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/rv641"
          timeout 240s "$RUNNER_TEMP/rv641/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Preserve actual results
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/rv641proof"
          git rev-parse HEAD > "$RUNNER_TEMP/rv641proof/HEAD.txt"
          sha256sum v13/code/v13/learning_worker.py v13/code/tests/test_review_pr641_exact_route_labels.py > "$RUNNER_TEMP/rv641proof/SHA256.txt"
          (cd v13/code && PYTHONPATH="$PWD:$PWD/scripts" "$RUNNER_TEMP/rv641/bin/python" -m unittest -v tests.test_review_pr641_exact_route_labels tests.test_route_words tests.test_learning_worker) > "$RUNNER_TEMP/rv641proof/UNIT_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/rv641proof/UNIT_EXIT.txt"
          "$RUNNER_TEMP/rv641/bin/python" v13/code/scripts/public_repo_privacy_scan.py --base bc0703f4fbfb794b23ffc49ac8a7cb6074903bfa --head HEAD > "$RUNNER_TEMP/rv641proof/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/rv641proof/PRIVACY_EXIT.txt"
          exit 0
      - name: Upload original raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review641-focused-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/rv641proof/
          if-no-files-found: error
      - name: Enforce
        run: |
          set -euo pipefail
          for n in UNIT PRIVACY; do
            test "$(cat "$RUNNER_TEMP/rv641proof/${n}_EXIT.txt")" = 0 || { cat "$RUNNER_TEMP/rv641proof/${n}_RAW.log"; exit 1; }
          done
          tail -15 "$RUNNER_TEMP/rv641proof/UNIT_RAW.log"
