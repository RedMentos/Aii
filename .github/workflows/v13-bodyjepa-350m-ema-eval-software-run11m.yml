name: V13 Body-JEPA 350M EMA eval paired source-only prereg run11m
on:
  push:
    branches:
      - 'assistant/v13-bjepa-target-eval-350m-paired-run11m-20261030'
    paths:
      - '.github/workflows/v13-bodyjepa-350m-ema-eval-software-run11m.yml'
      - 'v13/code/scripts/bodyjepa_350m_ema_eval_paired_run11m.py'
      - 'v13/code/tests/test_bodyjepa_350m_ema_eval_paired_run11m.py'
      - 'v13/code/docs/BJEPA_350M_EMA_EVAL_SOFTWARE_TRIGGER_RUN11M.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Source-only protocol and raw receipts
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/bjepa-350m-eval-software-run11m"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/v13/body_jepa.py v13/code/v13/lora_trainer.py \
            v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/SOURCE_BLOBS.txt"
          test "$(head -1 "$e/SOURCE_BLOBS.txt")" = b560d4e88fe457f381e89dfc5d6188a8ec3b306b &&
          test "$(sed -n '2p' "$e/SOURCE_BLOBS.txt")" = 49a752879ae5d19391963742a0f042e740edb2cc &&
          test "$(tail -1 "$e/SOURCE_BLOBS.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          echo "$?" > "$e/SOURCE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/bjepa-350m-eval-software-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/bjepa-350m-eval-software-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 7m \
            env PYTHONPATH=.:tests:scripts "$py" -m unittest -v \
              tests.test_bodyjepa_350m_ema_eval_paired_run11m \
              tests.test_bodyjepa_350m_heldout_ablation_20261030) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          "$py" -m py_compile v13/code/scripts/bodyjepa_350m_ema_eval_paired_run11m.py \
            v13/code/tests/test_bodyjepa_350m_ema_eval_paired_run11m.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py \
            --base 645c70e8c28fb9e016eaa5d068c2d3977075184d \
            --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 645c70e8c28fb9e016eaa5d068c2d3977075184d HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-bjepa-350m-eval-software-run11m-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/bjepa-350m-eval-software-run11m/
          retention-days: 30
          if-no-files-found: error
      - name: Fail closed on any stage
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/bjepa-350m-eval-software-run11m"
          for stage in SOURCE VENV DEPS TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained"
              tail -100 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
          echo "350M_PAIRED_PROTOCOL_SOFTWARE_ONLY_NO_NATIVE_OR_GATE_PROMOTION"
