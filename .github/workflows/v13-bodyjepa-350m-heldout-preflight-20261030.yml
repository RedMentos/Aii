name: V13 Body-JEPA 350M heldout three-arm source-only preflight
on:
  push:
    branches:
      - 'assistant/v13-bodyjepa-350m-heldout-threearm-*'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Frozen ablation source and scorer checks
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/bodyjepa-s101-preflight"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          (cd v13/code && timeout 3m env PYTHONPATH=.:scripts:tests python3 -m unittest -v tests.test_bodyjepa_350m_heldout_three_arm_20261030) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m py_compile v13/code/scripts/bodyjepa_350m_heldout_three_arm_20261030.py v13/code/tests/test_bodyjepa_350m_heldout_three_arm_20261030.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base be26f5176a55180be0f9086868a9c4a1c2a5889c --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check be26f5176a55180be0f9086868a9c4a1c2a5889c HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-bodyjepa-s101-preflight-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/bodyjepa-s101-preflight/
          retention-days: 30
          if-no-files-found: error
      - name: Gate only software, no learning promotion
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/bodyjepa-s101-preflight"
          for stage in TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; raw retained"
              tail -80 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
          echo "BODYJEPA_SOURCE_ONLY_NO_AGE_STEP2_B3_JEPA_REDMI_PROMOTION"
