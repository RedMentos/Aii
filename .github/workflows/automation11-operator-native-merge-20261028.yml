name: V13 Automation11 combined native lineage plus TTY preflight software
on:
  push:
    branches:
      - assistant/v13-run11-operator-native-merged-review-20261028
    paths:
      - '.github/workflows/automation11-operator-native-merge-20261028.yml'
      - 'v13/code/v13/operator.py'
      - 'v13/code/tests/test_verified_operator_preflight.py'
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: "1"
      NO_MODEL_DOWNLOADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify combined native and TTY donor blobs, frozen runtime, run full software
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run11-operator-native-merge"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          9039a467bba0e52349d693ee7d6120529f4a3d94 v13/code/scripts/native_c3_batch_world_atomic_fresh_smoke.py
          08bd6b1b1c040f3cc566d541da1ed92e07f36050 .github/workflows/automation11-c3-batch-world-atomic-fresh-native-20261028.yml
          68e7ed1352800174972558f1e0b0683a42c8689a v13/code/v13/runtime.py
          7bf3a992af1db87f6ee2432c2486dbbced0f2bd4 v13/code/v13/operator.py
          33645182b9c5149f7f1c4e0f360c78ccc4db2db1 v13/code/tests/test_verified_operator_preflight.py
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          a7138080e19b439331bf4c5da68e7e62f823f169 v13/code/v13/history.py
          e51766478fee915824853da7c8e73785b12e91b3 v13/code/v13/sleep_offline.py
          fd8ea629dc565a5f27b212599f3b006bb93605fd v13/code/v13/context_os.py
          52563e1c838b5dc9955fa8739ff35c1de1eed707 v13/code/tests/test_context_os.py
          350a1343a014934f4dbfc200b87b0b69491cd187 v13/code/v13/world_jepa.py
          4c72c10a6266729e4c5d274bd4fbb4bc1f7be7a2 v13/code/tests/test_world_jepa_fit_input_guard.py
          2530540ee0ed4648e985f5c929565b9cdb128232 v13/code/tests/test_world_jepa_atomic_fit.py
          0b6fdef06b7300c008562d296110690c82c1675c v13/code/v13/world_jepa_shadow_checkpoint.py
          4b73842be25e784f70ade4f6c4ced3fe2dcb9eab v13/code/v13/source_consumer.py
          75ca7f3f197665f665d9582b7f5c2efb1f598235 v13/code/scripts/ask_verified_budget.py
          b041fada7bef403d2600a0e276891911fe7a1bc3 v13/code/tests/test_source_consumer_admission.py
          c3689b73043d9655cc71e54cee2c87421f3666fc v13/code/tests/test_source_consumer_recall_integration.py
          346c56c27ee99549c61d811f06641a6e42740649 v13/code/tests/test_source_consumer_live_render_revalidation.py
          67f560ff193f0d323d11688c0668d03cb15e81e2 v13/code/tests/test_source_consumer_render_seal.py
          efb239a116e463bea8e47a43ea841c2b2a599af4 v13/code/tests/test_ask_verified_budget.py
          be0770b06657f8f0869b26b21cc9b4715af07a65 v13/code/tests/test_c3_cli_no_worker_pinned.py
          BLOBS
          : > "$e/BLOBS_RAW.log"
          while read -r want file; do
            got="$(git hash-object "$file" 2>/dev/null)"
            printf '%s %s %s\n' "$want" "$got" "$file" >> "$e/BLOBS_RAW.log"
            if [ "$want" != "$got" ]; then echo MISMATCH >> "$e/BLOBS_RAW.log"; fi
          done < "$e/EXPECTED_BLOBS.txt"
          if grep -q MISMATCH "$e/BLOBS_RAW.log"; then echo 1 > "$e/BLOBS_EXIT.txt"; else echo 0 > "$e/BLOBS_EXIT.txt"; fi
          python3 -m venv "$RUNNER_TEMP/v13-run11-operator-native-merge-venv"
          py="$RUNNER_TEMP/v13-run11-operator-native-merge-venv/bin/python"
          "$py" -m pip install --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          first=$?
          "$py" -m pip install --no-input -q 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
          second=$?
          "$py" -m pip install --no-input -q 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
          third=$?
          if [ "$first" = 0 ] && [ "$second" = 0 ] && [ "$third" = 0 ]; then echo 0 > "$e/INSTALL_EXIT.txt"; else echo 1 > "$e/INSTALL_EXIT.txt"; fi
          if [ "$(cat "$e/BLOBS_EXIT.txt")" = 0 ] && [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 6m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_verified_operator_preflight tests.test_context_os tests.test_context_sleep_f5_crossorgan_20261028 tests.test_world_jepa_atomic_fit tests.test_world_jepa_fit_input_guard tests.test_world_jepa_coverage_integrity tests.test_source_consumer_admission tests.test_source_consumer_recall_integration tests.test_source_consumer_live_render_revalidation tests.test_source_consumer_render_seal tests.test_ask_verified_budget tests.test_c3_cli_no_worker_pinned) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else
            echo SKIPPED_PREREQ_RED > "$e/FOCUSED_RAW.log"
            echo SKIPPED_RED > "$e/FOCUSED_EXIT.txt"
          fi
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=.:tests "$py" -m unittest discover -s tests -p 'test_*.py' -q) > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else
            echo SKIPPED_FOCUSED_RED > "$e/FULL_RAW.log"
            echo SKIPPED_RED > "$e/FULL_EXIT.txt"
          fi
          python3 -m compileall -q v13/code/v13/operator.py v13/code/v13/context_os.py v13/code/v13/world_jepa.py v13/code/v13/source_consumer.py v13/code/scripts/ask_verified_budget.py v13/code/tests/test_context_os.py v13/code/tests/test_world_jepa_fit_input_guard.py v13/code/tests/test_world_jepa_atomic_fit.py v13/code/tests/test_verified_operator_preflight.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 4e24234b5c26df7438c5f9af1b23a38e9b2263e3 --head HEAD > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 4e24234b5c26df7438c5f9af1b23a38e9b2263e3 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-automation11-operator-native-merge-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run11-operator-native-merge/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce focused and full software with original native verdict preserved
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run11-operator-native-merge"
          for name in BLOBS INSTALL FOCUSED FULL COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${name}_EXIT.txt")" != 0 ]; then
              echo "$name RED; raw retained"
              tail -60 "$e/${name}_RAW.log" || true
              exit 1
            fi
          done
          echo 'COMBINED_OPERATOR_NATIVE_LINEAGE_SOFTWARE_ONLY_NO_NATIVE_RERUN_OR_GATE_PROMOTION'
