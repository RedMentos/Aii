name: V13 German list_arith seed67 frozen holdout once
on:
  push:
    branches:
      - assistant/v13-listarith-german-shadow-seed67-20261030
    paths:
      - '.github/workflows/v13-listarith-de-shadow-seed67-holdout.yml'
permissions:
  contents: read
jobs:
  shadow-holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen one-shot holdout with exact source and all raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-listarith-de67-holdout"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git merge-base --is-ancestor 45506ebab8595cea59cba85b2c773a6c0f44d438 HEAD > "$e/PREREG_RAW.log" 2>&1
          echo "$?" > "$e/PREREG_EXIT.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          3072aa0d6666a38de2f711e123cd35dae2cfed2a v13/code/docs/LISTARITH_GERMAN_SHADOW_SEED67_PREREG_20261030.md
          264805f54b697f693dc0e9730f0448f447fa8141 v13/code/specs/listarith_de_shadow_seed67_fixtures.json
          d13120bcd6be6572b6e63af5f2b5a3242e7d0b98 v13/code/v13/agi/listarith_de_shadow.py
          7ae45dbfbfbc74c9af8a5bb19f909d47fe2a3b1b v13/code/scripts/listarith_de_shadow_seed67_eval.py
          35893e9f829a591ffb9a792a73cef9bce986b3c4 v13/code/v13/agi/listarith.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          red=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then red=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$red" > "$e/PINS_EXIT.txt"
          if [ "$red" = 0 ] && [ "$(cat "$e/PREREG_EXIT.txt")" = 0 ]; then
            env PYTHONPATH=v13/code python3 v13/code/scripts/listarith_de_shadow_seed67_eval.py --fixture v13/code/specs/listarith_de_shadow_seed67_fixtures.json --out "$e/holdout" > "$e/HOLDOUT_RAW.log" 2>&1
            echo "$?" > "$e/HOLDOUT_EXIT.txt"
          else
            echo SKIPPED_PINS_RED > "$e/HOLDOUT_RAW.log"
            echo SKIPPED_RED > "$e/HOLDOUT_EXIT.txt"
          fi
          if [ -f "$e/holdout/report.json" ]; then
            (cd "$e/holdout" && sha256sum -c SHA256SUMS) > "$e/REPORT_CHECK_RAW.log" 2>&1
            chk="$?"
            python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));assert d["schema"]=="v13.listarith.de_shadow.seed67.holdout.v1";assert d["authority"]=="SHADOW_ONLY" and d["live_consumers"]==0 and d["native_model_inference"] is False;assert d["holdout_rows"]==24 and 0<=d["correct"]<=24 and 0<=d["false_positive_none"]<=8 and 0<=d["english_regressions_pass"]<=8;assert d["status"] in ("SHADOW_DE_SUPPORTED","SHADOW_DE_NOT_SUPPORTED");assert all(d[k] is False for k in ("redmi_measured","step2_gate_promoted","b3_promoted","body_jepa_available","whole_system_complete"));assert d["jepa_weight"]==0' "$e/holdout/report.json" >> "$e/REPORT_CHECK_RAW.log" 2>&1
            chk2="$?"
            if [ "$chk" = 0 ] && [ "$chk2" = 0 ]; then echo 0 > "$e/REPORT_CHECK_EXIT.txt"; else echo 1 > "$e/REPORT_CHECK_EXIT.txt"; fi
          else
            echo NO_REPORT > "$e/REPORT_CHECK_RAW.log"
            echo SKIPPED_NO_REPORT > "$e/REPORT_CHECK_EXIT.txt"
          fi
          python3 -m py_compile v13/code/v13/agi/listarith_de_shadow.py v13/code/scripts/listarith_de_shadow_seed67_eval.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 01e4ee82b86a42afec7d76c3f2766270364e1c41 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 01e4ee82b86a42afec7d76c3f2766270364e1c41 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve exact original holdout on PASS or RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-listarith-de67-holdout-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-listarith-de67-holdout/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce integrity, not a utility gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-listarith-de67-holdout"
          for stage in PREREG PINS HOLDOUT REPORT_CHECK COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained; no promotion"
              tail -70 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'GERMAN_SHADOW_HOLDOUT_INTEGRITY_ONLY_NOT_LIVE_OR_NATIVE_OR_STEP2'
