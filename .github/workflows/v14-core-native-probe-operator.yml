name: V14 Core native-probe operator dispatch
on:
  push:
    branches:
      - core/v14-native-probe-operator-dispatch-20261122
    paths:
      - "v13/code/v13/callosum.py"
      - "v13/code/v13/native_probe_approval.py"
      - "v13/code/v13/native_latent_receiver.py"
      - "v13/code/tests/test_native_latent_receiver_approval.py"
      - "v13/code/tests/test_native_latent_receiver_operator.py"
      - "v13/code/tests/test_native_latent_receiver_stage.py"
      - "v13/code/tests/test_native_latent_receiver_runtime.py"
      - ".github/workflows/v14-core-native-probe-operator.yml"
  pull_request:
    branches:
      - qa/v14-native-probe-model-hash-20261122
    paths:
      - "v13/code/v13/callosum.py"
      - "v13/code/v13/native_probe_approval.py"
      - "v13/code/v13/native_latent_receiver.py"
      - "v13/code/tests/test_native_latent_receiver_approval.py"
      - "v13/code/tests/test_native_latent_receiver_operator.py"
      - "v13/code/tests/test_native_latent_receiver_stage.py"
      - "v13/code/tests/test_native_latent_receiver_runtime.py"
      - ".github/workflows/v14-core-native-probe-operator.yml"
permissions:
  contents: read
jobs:
  python-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
      - name: Install focused Runtime test dependencies
        run: python -m pip install pytest==9.2.0 numpy==2.3.5 psutil PyYAML
      - name: Compile native probe operator and receiver
        run: |
          python -m py_compile \\
            v13/code/v13/callosum.py \\
            v13/code/v13/native_probe_approval.py \\
            v13/code/v13/native_latent_receiver.py \\
            v13/code/v13/cognition.py
      - name: Test approval, route identity, and staged Runtime consumer
        env:
          PYTHONPATH: v13/code
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -q \\
            v13/code/tests/test_native_latent_receiver_approval.py \\
            v13/code/tests/test_native_latent_receiver_operator.py \\
            v13/code/tests/test_native_latent_receiver_runtime.py \\
            v13/code/tests/test_native_latent_receiver_stage.py
      - name: Scan public diff for private data and secrets
        run: python v13/code/scripts/public_repo_privacy_scan.py --base origin/gpt6/v13-private-remote-bridge-20261111 --head HEAD --no-worktree
