name: V13 phone bootstrap transactional tar software integrity
on:
  push:
    branches:
      - assistant/v13-phone-bootstrap-atomic-extract-20261031-gpt6
    paths:
      - v13/code/docs/PHONE_BOOTSTRAP_ATOMIC_TAR_TRIGGER.txt
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      NO_MODEL_DOWNLOADS: "1"
      V13_NO_AUTOSTART: "1"
      DO_NOT_TRACK: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify real bootstrap extraction and bounded model-free install smoke
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-phone-tar"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/v13-phone-tar-venv" > "$e/VENV_RAW.log" 2>&1
          py="$RUNNER_TEMP/v13-phone-tar-venv/bin/python"
          echo 0 > "$e/VENV_EXIT.txt"
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo 0 > "$e/DEPS_EXIT.txt"
          "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log"
          "$py" -m compileall -q v13/code/v13/bootstrap.py v13/code/v13/safe_tar.py v13/code/tests/test_bootstrap_safe_tar_20261031.py > "$e/COMPILE_RAW.log" 2>&1
          echo 0 > "$e/COMPILE_EXIT.txt"
          set +e
          (cd v13/code && env PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests -p test_bootstrap_safe_tar_20261031.py -v) > "$e/TAR_RAW.log" 2>&1
          tar_rc=$?
          (cd v13/code && env PYTHONPATH=.:tests:scripts "$py" scripts/install_selftest.py --timeout-seconds 120) > "$e/SMOKE_RAW.log" 2>&1
          smoke_rc=$?
          set -e
          echo "$tar_rc" > "$e/TAR_EXIT.txt"
          echo "$smoke_rc" > "$e/SMOKE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base bc80a0d7df7031f5c18a11531969f5fc482b5891 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo 0 > "$e/PRIVACY_EXIT.txt"
          git diff --check bc80a0d7df7031f5c18a11531969f5fc482b5891 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo 0 > "$e/DIFF_EXIT.txt"
          "$py" - "$e" <<'PY' > "$e/RESULT_RAW.log" 2>&1
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1])
          r={'schema':'v13.phone_bootstrap_atomic_tar.software.v1',
             'head':(e/'HEAD.txt').read_text().strip(),
             'tar_exit':int((e/'TAR_EXIT.txt').read_text()),
             'smoke_exit':int((e/'SMOKE_EXIT.txt').read_text()),
             'native_model_proven':False,'redmi_measured':False,'step2_promoted':False,
             'b3_promoted':False,'body_jepa_promoted':False,'age_promoted':False}
          (e/'RESULT.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
          echo 0 > "$e/RESULT_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat "$e/RESULT_RAW.log"
          tail -n 14 "$e/TAR_RAW.log"
          tail -n 5 "$e/SMOKE_RAW.log"
          test "$tar_rc" -eq 0
          test "$smoke_rc" -eq 0
          grep -q 'INSTALL_SELFTEST_PASS' "$e/SMOKE_RAW.log"
      - name: Upload original raw receipts including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-phone-bootstrap-atomic-tar-${{ github.sha }}
          path: ${{ runner.temp }}/v13-phone-tar/
          if-no-files-found: error
          retention-days: 90
