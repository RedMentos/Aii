name: V13 Run26 closed native AG12 cross-organ analyzer software preflight
on:
  push:
    branches: [assistant/v13-run26-ag12-crossorgan-diagnostic-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run26-ag12-crossorgan-software.yml'
permissions:
  contents: read
jobs:
  closed-native-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source pins and synthetic closed-artifact behavior
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run26-software"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          120488c5cb906b0c8a962505c3b7c7dd3cfe3ae3 v13/code/docs/AG12_CROSSORGAN_CLOSED_NATIVE_PREREG_RUN26_20261030.md
          dc956cd488aec969ebb37e7562238b5e5c48e397 v13/code/scripts/run26_ag12_native_crossorgan.py
          dfec1968331155e7e8c4cbd0a87b827107a0129a v13/code/tests/test_run26_ag12_native_crossorgan.py
          a1cab60363814cb86472a42defb5089d4cdbd432 v13/code/v13/agi/generality.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run26-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run26-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout 4m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_run26_ag12_native_crossorgan tests.test_run25_ag12_bodies_native tests.test_run24_ag12_german_c3_native) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PIN_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/scripts/run26_ag12_native_crossorgan.py v13/code/tests/test_run26_ag12_native_crossorgan.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 5a7262bd23592cad69ea1af2b266c90383268be9 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 5a7262bd23592cad69ea1af2b266c90383268be9 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve synthetic preflight raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run26-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run26-software/
          retention-days: 30
          if-no-files-found: error
      - name: Require preflight GREEN without native or age claim
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run26-software"
          for stage in PINS VENV DEPS TEST COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              tail -70 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
          echo 'RUN26_SYNTHETIC_SOFTWARE_ONLY_NO_NATIVE_OR_FUSION_PROOF'
