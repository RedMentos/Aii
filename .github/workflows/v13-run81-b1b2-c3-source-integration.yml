name: V13 Run81 integrated B1B2 quote and C3 source binding
on:
  push:
    branches: [assistant/v13-run81-b1b2-quote-c3-source-merge-20261031-gpt6]
    paths: ['.github/workflows/v13-run81-b1b2-c3-source-integration.yml']
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run combined real SQLite and quote evidence tests
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run81-b1b2-c3"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run81-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run81-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo SKIPPED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=5s 7m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m unittest tests.test_run80_b1b2_c3_postrender_bindings tests.test_b1b2_c3_source_envelope_candidate tests.test_run77_b2_quote_provenance_audit tests.test_run77_forensic_diagnostic tests.test_run77_prompt_transport_audit -v > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          python3 -m compileall -q v13/code/v13/b1b2_c3_source_envelope_candidate.py v13/code/scripts/run77_b2_quote_provenance_audit.py v13/code/tests/test_run80_b1b2_c3_postrender_bindings.py v13/code/tests/test_run77_b2_quote_provenance_audit.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 8da75d9396760c7907726d71d783c236527cefa7 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 8da75d9396760c7907726d71d783c236527cefa7 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Retain integrated raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run81-b1b2-c3-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run81-b1b2-c3/
          if-no-files-found: error
          retention-days: 90
      - name: Require all integration checks
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-run81-b1b2-c3"
          for s in VENV DEPS TEST COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || { cat "$e/TEST_RAW.log"; exit 1; }
          done
          tail -n 5 "$e/TEST_RAW.log"
          echo RUN81_B1B2_C3_SOURCE_INTEGRATION_SHADOW_ONLY
