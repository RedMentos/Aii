name: V13 JEF human receipt full unfiltered regression run11d
on:
  push:
    branches:
      - 'assistant/v13-jef-human-receipt-run11d-20261030'
    paths:
      - 'v13/code/docs/JEF_HUMAN_RECEIPT_FULLSUITE_LAUNCH_20261030.md'
permissions:
  contents: read
jobs:
  full-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Unfiltered full regression, keep exact raw even if RED
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-fullsuite-run11d"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object \
            v13/code/v13/jefbridge.py v13/code/v13/jefoutcome.py \
            v13/code/v13/executive.py v13/code/v13/runners.py \
            v13/code/v13/agi/listarith_de_shadow_pipeline.py \
            v13/code/v13/agi/listarith_de_closedworld_candidate.py \
            v13/code/v13/body_jepa.py v13/code/v13/world_jepa.py \
            v13/code/v13/sleep.py v13/code/v13/context_os.py \
            v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md \
            > "$e/SOURCE_BLOBS.txt"
          test "$(tail -1 "$e/SOURCE_BLOBS.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          echo "$?" > "$e/CANON_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-fullsuite-run11d-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-fullsuite-run11d-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input -q --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu' > "$e/TORCH_RAW.log" 2>&1
            echo "$?" > "$e/TORCH_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input -q 'transformers==4.44.2' > "$e/TRANSFORMERS_RAW.log" 2>&1
            echo "$?" > "$e/TRANSFORMERS_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input -q 'peft==0.13.2' > "$e/PEFT_RAW.log" 2>&1
            echo "$?" > "$e/PEFT_EXIT.txt"
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
            "$py" -c 'import torch; assert torch.__version__=="2.5.1+cpu"; print(torch.__version__,torch.cuda.is_available())' > "$e/TORCH_IMPORT_RAW.log" 2>&1
            echo "$?" > "$e/TORCH_IMPORT_EXIT.txt"
            "$py" -c 'import transformers; from transformers import GPT2Config,GPT2LMHeadModel; assert transformers.__version__=="4.44.2"; print(transformers.__version__)' > "$e/TRANSFORMERS_IMPORT_RAW.log" 2>&1
            echo "$?" > "$e/TRANSFORMERS_IMPORT_EXIT.txt"
            "$py" -c 'import peft; from peft import LoraConfig,get_peft_model; assert peft.__version__=="0.13.2"; print(peft.__version__)' > "$e/PEFT_IMPORT_RAW.log" 2>&1
            echo "$?" > "$e/PEFT_IMPORT_EXIT.txt"
          else
            for stage in DEPS TORCH TRANSFORMERS PEFT PIP_CHECK TORCH_IMPORT TRANSFORMERS_IMPORT PEFT_IMPORT; do
              echo SKIPPED_RED > "$e/${stage}_EXIT.txt"
              echo SKIPPED_RED > "$e/${stage}_RAW.log"
            done
          fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ] && [ "$(cat "$e/TORCH_EXIT.txt")" = 0 ] && \
             [ "$(cat "$e/TRANSFORMERS_EXIT.txt")" = 0 ] && [ "$(cat "$e/PEFT_EXIT.txt")" = 0 ] && \
             [ "$(cat "$e/TORCH_IMPORT_EXIT.txt")" = 0 ] && \
             [ "$(cat "$e/TRANSFORMERS_IMPORT_EXIT.txt")" = 0 ] && \
             [ "$(cat "$e/PEFT_IMPORT_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=10s 32m \
              env PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests -p 'test_*.py') \
              > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else
            echo SKIPPED_DEPENDENCY_RED > "$e/FULL_RAW.log"
            echo SKIPPED_RED > "$e/FULL_EXIT.txt"
          fi
          "$py" -m compileall -q v13/code/v13 v13/code/scripts > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py \
            --base 852f2c6ccef375cb03a0ad8318fec851f3b191ad \
            --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 852f2c6ccef375cb03a0ad8318fec851f3b191ad HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve all raw, including expected historical RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-fullsuite-run11d-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-fullsuite-run11d/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce unfiltered result without historical waivers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-fullsuite-run11d"
          for stage in CANON VENV DEPS TORCH TRANSFORMERS PEFT PIP_CHECK TORCH_IMPORT TRANSFORMERS_IMPORT PEFT_IMPORT FULL COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained, no waiver"
              tail -70 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo "FULL_SOFTWARE_GREEN_ONLY_NO_NATIVE_OR_REDMI_PROMOTION"
