name: V13 Run77 independent forensic and compact artifact software tests
on:
  push:
    branches: [assistant/v13-run77-native-forensic-gpt6-20261031]
    paths: ['.github/workflows/v13-run77-forensic-software.yml']
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Focused synthetic diagnostic and independent ZIP auditor tests
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run77-forensic-software"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run77-software-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run77-software-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo SKIPPED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=5s 6m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m unittest discover -s v13/code/tests -p 'test_run77_*.py' -v > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          python3 -m compileall -q v13/code/scripts/run77_native_forensic_diagnostic.py v13/code/scripts/run77_compact_zip_verify.py v13/code/scripts/run77_prompt_transport_audit.py v13/code/tests/test_run77_forensic_diagnostic.py v13/code/tests/test_run77_compact_zip_verify.py v13/code/tests/test_run77_prompt_transport_audit.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 89e1309b623df6d214955de89b2f1ebdf873dd02 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 89e1309b623df6d214955de89b2f1ebdf873dd02 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Retain focused software raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run77-forensic-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run77-forensic-software/
          if-no-files-found: error
          retention-days: 90
      - name: Require all focused tests and guards
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-run77-forensic-software"
          for s in VENV DEPS TEST COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || { cat "$e/TEST_RAW.log"; exit 1; }
          done
          tail -n 5 "$e/TEST_RAW.log"
          echo RUN77_FORENSIC_AND_PROMPT_BYTES_SOFTWARE_COMPLETE_NO_NATIVE_CLAIM
