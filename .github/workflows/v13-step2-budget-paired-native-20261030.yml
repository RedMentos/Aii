name: V13 STEP2 fresh disjoint paired C3 and two-body native budget pilot
on:
  push:
    branches:
      - codex/v13-step2-budget-prompt-paired-native-20261030-auto11ag
    paths:
      - '.github/workflows/v13-step2-budget-paired-native-20261030.yml'
      - 'v13/code/scripts/step2_budget_paired_native_pilot_20261030.py'
      - 'v13/code/tests/test_step2_budget_paired_native_pilot_20261030.py'
permissions:
  contents: read
concurrency:
  group: v13-step2-budget-paired-native-20261030
  cancel-in-progress: false
jobs:
  paired-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Serial fixed 4x3 native STEP2 pilot with raw and fail-closed checks
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-step2-budget-paired-native"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/CANON_BLOB.txt"
          git hash-object v13/code/specs/models.json > "$e/CATALOG_BLOB.txt"
          git hash-object v13/code/specs/control_tools.json > "$e/TOOLS_BLOB.txt"
          git hash-object v13/code/scripts/step2_budget_paired_native_pilot_20261030.py v13/code/tests/test_step2_budget_paired_native_pilot_20261030.py > "$e/SOURCE_BLOBS.txt"
          test "$(cat "$e/CANON_BLOB.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7 &&
          test "$(cat "$e/CATALOG_BLOB.txt")" = 7af05962af41d0bc3f7dd18ef01d4eba55eabf99 &&
          test "$(cat "$e/TOOLS_BLOB.txt")" = 954a3f468f10195fbce12d27f68585ee7edee2c9
          echo "$?" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-step2-paired-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-step2-paired-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else
            echo SKIPPED_VENV_RED > "$e/DEPS_RAW.log"
            echo SKIPPED_RED > "$e/DEPS_EXIT.txt"
          fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_step2_budget_paired_native_pilot_20261030 tests.test_step2_currentchain_native_semantic_gap_20261030) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else
            echo SKIPPED_DEPS_RED > "$e/FOCUSED_RAW.log"
            echo SKIPPED_RED > "$e/FOCUSED_EXIT.txt"
          fi
          export V13_HOME="$RUNNER_TEMP/v13-step2-paired-installed"
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ] && [ "$(cat "$e/PINS_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 15m env PYTHONPATH=v13/code "$py" -m v13.bootstrap --home "$V13_HOME" > "$e/BOOTSTRAP_RAW.log" 2>&1
            echo "$?" > "$e/BOOTSTRAP_EXIT.txt"
          else
            echo SKIPPED_FOCUSED_RED > "$e/BOOTSTRAP_RAW.log"
            echo SKIPPED_RED > "$e/BOOTSTRAP_EXIT.txt"
          fi
          if [ "$(cat "$e/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 28m env PYTHONPATH=v13/code "$py" v13/code/scripts/step2_budget_paired_native_pilot_20261030.py --home "$V13_HOME" --out "$e/pilot" > "$e/PILOT_RAW.log" 2>&1
            echo "$?" > "$e/PILOT_EXIT.txt"
          else
            echo SKIPPED_BOOTSTRAP_RED > "$e/PILOT_RAW.log"
            echo SKIPPED_RED > "$e/PILOT_EXIT.txt"
          fi
          if [ "$(cat "$e/PILOT_EXIT.txt")" = 0 ]; then
            "$py" - "$e/pilot/report.json" > "$e/REPORT_CHECK_RAW.log" 2>&1 <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          assert j['status']=='PILOT_COMPLETE_NO_GATE'
          assert len(j['rows'])==12
          assert all(x['valid_native'] is True for x in j['rows'])
          assert j['comparative_step2_gate_promoted'] is False
          assert j['redmi_measured'] is False and j['jepa_weight']==0
          assert all(0<=v<=8 for v in j['score_totals_out_of_8'].values())
          print('FRESH_PAIRED_NATIVE_PILOT_INTERMEDIATE_ONLY',j['score_totals_out_of_8'])
          PY
            echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          else
            echo SKIPPED_PILOT_RED > "$e/REPORT_CHECK_RAW.log"
            echo SKIPPED_RED > "$e/REPORT_CHECK_EXIT.txt"
          fi
          "$py" -m py_compile v13/code/scripts/step2_budget_paired_native_pilot_20261030.py v13/code/tests/test_step2_budget_paired_native_pilot_20261030.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base d7dddf8ab6c23f187003d919570dc18b650d5a8b --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check d7dddf8ab6c23f187003d919570dc18b650d5a8b HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-step2-budget-paired-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-step2-budget-paired-native/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce native pilot without STEP2 gate promotion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-step2-budget-paired-native"
          for stage in PINS VENV DEPS FOCUSED BOOTSTRAP PILOT REPORT_CHECK COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained; no native pilot PASS"
              tail -80 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'PAIRED_NATIVE_PILOT_COMPLETE_INTERMEDIATE_ONLY_NO_STEP2_B3_JEPA_REDMI_OR_AGE_PROMOTION'
