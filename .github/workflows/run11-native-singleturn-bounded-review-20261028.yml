name: V13 Run11 bounded single-turn native smoke regression review
on:
  push:
    branches:
      - codex/v13-run11-native-singleturn-bounded-review-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-native-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run real synthetic subprocess guards and preserve raw exits
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-singleturn-guards"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 4m env PYTHONPATH=.:tests python3 -m unittest -v tests.test_native_smoke_io_20261028 tests.test_current_c3_native_linux_smoke_20261028 tests.test_current_b1b2_native_linux_smoke_20261028) > "$e/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$e/FOCUSED_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/native_smoke_io_20261028.py v13/code/scripts/current_c3_native_linux_smoke_20261028.py v13/code/scripts/current_b1b2_native_linux_smoke_20261028.py v13/code/tests/test_native_smoke_io_20261028.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 1d8c05b84b2b178d8ec0c1f5249c5fc36e171c9a --head HEAD > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 1d8c05b84b2b178d8ec0c1f5249c5fc36e171c9a HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-native-singleturn-guards-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-singleturn-guards/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce focused, compile, privacy and diff
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-singleturn-guards"
          for name in FOCUSED COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${name}_EXIT.txt")" != 0 ]; then
              echo "$name RED"
              tail -100 "$e/${name}_RAW.log" || true
              exit 1
            fi
          done
          echo 'BOUNDED_SINGLE_TURN_SOFTWARE_GUARDS_ONLY_NO_NATIVE_OR_GATE_PROMOTION'
