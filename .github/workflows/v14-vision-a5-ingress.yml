name: V14 RAW EYE vision A5 ingress

on:
  push:
    branches:
      - "research-perception/**"
    paths:
      - "v13/code/v13/vision.py"
      - "v13/code/v13/common.py"
      - "v13/code/v13/config.py"
      - "v13/code/v13/store.py"
      - "v13/code/v13/vision_a5_bridge.py"
      - "v13/code/v13/attention.py"
      - "v13/code/v13/contracts.py"
      - "v13/code/v13/percept_admission.py"
      - "v13/code/v13/a5_context_envelope.py"
      - "v13/code/tests/test_vision.py"
      - "v13/code/tests/test_vision_a5_bridge.py"
      - ".github/workflows/v14-vision-a5-ingress.yml"
  pull_request:
    paths:
      - "v13/code/v13/vision.py"
      - "v13/code/v13/common.py"
      - "v13/code/v13/config.py"
      - "v13/code/v13/store.py"
      - "v13/code/v13/vision_a5_bridge.py"
      - "v13/code/v13/attention.py"
      - "v13/code/v13/contracts.py"
      - "v13/code/v13/percept_admission.py"
      - "v13/code/v13/a5_context_envelope.py"
      - "v13/code/tests/test_vision.py"
      - "v13/code/tests/test_vision_a5_bridge.py"
      - ".github/workflows/v14-vision-a5-ingress.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v14-vision-a5-ingress-\${{ github.event_name }}-\${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  vision-a5-ingress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
      - name: Install pinned vision test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.2.0 numpy==2.3.5 Pillow==12.3.0
      - name: Compile RAW EYE vision and A5 bridge
        run: python -m py_compile v13/code/v13/vision.py v13/code/v13/vision_a5_bridge.py v13/code/tests/test_vision.py v13/code/tests/test_vision_a5_bridge.py
      - name: Run existing vision regressions and source-bound A5/A4/C3 admission tests
        working-directory: v13/code
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -s tests/test_vision.py tests/test_vision_a5_bridge.py
      - name: Scan changed public content for secrets and private identifiers
        run: python v13/code/scripts/public_repo_privacy_scan.py --base origin/gpt6/v13-private-remote-bridge-20261111 --head HEAD --no-worktree
