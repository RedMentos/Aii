name: Run220 exact-head extracted Termux source ZIP smoke (Linux software)
on:
  pull_request:
    paths:
      - '.github/workflows/run220-phone-extracted.yml'
      - 'v13/code/scripts/package_source.py'
      - 'v13/code/scripts/verify_installed_source_run194.py'
      - 'v13/code/tests/test_phone_cli_run87.py'
      - 'v13/code/tests/test_phone_chat_sessions_run89.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Isolated software prerequisites
        run: python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Build immutable source-only phone ZIP from exact checkout
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/run220"
          python v13/code/scripts/package_source.py --root v13/code --phone-install --out "$RUNNER_TEMP/run220/V13-Phone-Run220.zip" | tee "$RUNNER_TEMP/run220/package.json"
          sha256sum "$RUNNER_TEMP/run220/V13-Phone-Run220.zip"
          unzip -t "$RUNNER_TEMP/run220/V13-Phone-Run220.zip" | tail -1
          unzip -q "$RUNNER_TEMP/run220/V13-Phone-Run220.zip" -d "$RUNNER_TEMP/run220/extracted"
      - name: Verify extracted bytes before importing V13
        run: |
          set -euo pipefail
          python -I -S "$RUNNER_TEMP/run220/extracted/V13-Phone/scripts/verify_installed_source_run194.py" --root "$RUNNER_TEMP/run220/extracted/V13-Phone"
          cmp v13/code/v13/runtime.py "$RUNNER_TEMP/run220/extracted/V13-Phone/v13/runtime.py"
          cmp v13/code/setup.sh "$RUNNER_TEMP/run220/extracted/V13-Phone/setup.sh"
      - name: Run actual extracted source CLI and multi-chat smoke
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/run220/extracted/V13-Phone"
          PYTHONPATH=tests:. PYTHONDONTWRITEBYTECODE=1 python -m unittest -v tests.test_phone_cli_run87 tests.test_phone_chat_sessions_run89 tests.test_installed_source_preflight_run194 tests.test_operator_search_literal_run88
      - name: Official public repository privacy scan
        run: python v13/code/scripts/public_repo_privacy_scan.py --base 263d39a29b40c5e469be9c04e76452c95b802728 --head HEAD --no-worktree
      - name: Upload verified source-only ZIP
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: V13-Phone-Run220-source-only
          path: ${{ runner.temp }}/run220/V13-Phone-Run220.zip
          if-no-files-found: error
          retention-days: 14
      - name: Claim boundary
        run: echo 'Linux extracted source-only smoke; no native model, Redmi, JEPA or STEP2/B3 promotion'
