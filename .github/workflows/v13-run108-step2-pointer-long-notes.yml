name: V13 Run108 STEP2 pointer long-note source transport software diagnostic
on:
  push:
    branches: [assistant/v13-run108-step2-pointer-long-notes-20261029]
permissions:
  contents: read
concurrency:
  group: v13-run108-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pointer_transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Closed exact-source deterministic probe, focused/full and privacy
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run108"
          mkdir -p "$e/experiment"
          git rev-parse HEAD > "$e/HEAD.txt"
          source_ok=0
          check() {
            observed="$(git hash-object "$2" 2>/dev/null)" || return 1
            printf '%s %s\n' "$observed" "$2" >> "$e/SOURCE_RAW.log"
            [ "$observed" = "$1" ]
          }
          check f801b33f0f3f46548bc654a91014ca3de9c3a889 v13/code/docs/proofs/continuation-20261028/RUN108_STEP2_POINTER_LONG_NOTES_PREREG.md || source_ok=1
          check 6732fe5be704018f716a0bf52b524c19d2da0707 v13/code/scripts/run108_step2_pointer_long_notes.py || source_ok=1
          check 94bc485f9582e8bf179c181c95d4420477108b0a v13/code/tests/test_run108_step2_pointer_long_notes.py || source_ok=1
          check 44811df26bcfea648a1aebbe366942ad1f6734cd v13/code/docs/proofs/continuation-20261028/RUN108_BRANCH_BUILD_STATE.json || source_ok=1
          check 1a9eb6f7c7cbfce83d91cc09b4ff9516cff310cf v13/code/v13/cognition.py || source_ok=1
          check 218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md || source_ok=1
          echo "$source_ok" > "$e/SOURCE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run108-venv"
          py="$RUNNER_TEMP/v13-run108-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          base_rc="$?"
          if [ "$base_rc" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
            torch_rc="$?"
            if [ "$torch_rc" = 0 ]; then
              "$py" -m pip install --disable-pip-version-check --no-input 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
              deps_rc="$?"
            else
              deps_rc=1
            fi
          else
            deps_rc=1
          fi
          echo "$deps_rc" > "$e/INSTALL_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/run108_step2_pointer_long_notes.py v13/code/tests/test_run108_step2_pointer_long_notes.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$source_ok" = 0 ] && [ "$deps_rc" = 0 ] && [ "$(cat "$e/COMPILE_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 180s "$py" -m scripts.run108_step2_pointer_long_notes --out "$e/experiment/run108-report.json") > "$e/PROBE_RAW.log" 2>&1
            echo "$?" > "$e/PROBE_EXIT.txt"
            (cd v13/code && timeout --signal=TERM --kill-after=5s 180s "$py" -m unittest -v tests.test_run108_step2_pointer_long_notes tests.test_b2_quote_select tests.test_step2_z2) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
            (cd v13/code && timeout --signal=TERM --kill-after=10s 18m "$py" -m unittest discover -s tests -p 'test_*.py') > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else
            for n in PROBE FOCUSED FULL; do echo SKIPPED_PREREQ_RED > "$e/${n}_RAW.log"; echo SKIPPED_RED > "$e/${n}_EXIT.txt"; done
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base e56753ffe8fc3b78e341659a19e7af02302d9bb8 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check e56753ffe8fc3b78e341659a19e7af02302d9bb8 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - name: Preserve Run108 original raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run108-step2-pointer-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run108/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce exact source, probe, tests, privacy and diff
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run108"
          for n in SOURCE INSTALL COMPILE PROBE FOCUSED FULL PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; raw retained; no STEP2 gate promotion"
              tail -40 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN108_STEP2_POINTER_STRUCTURAL_DIAGNOSTIC_ONLY
