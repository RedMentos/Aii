name: V13 C6 bounded budget lexical v2 SHADOW software proof
on:
  push:
    branches: [assistant/v13-c6-lexical-v2-shadow-gpt6-20261031]
    paths: ['.github/workflows/v13-c6-budget-lexical-v2-shadow.yml']
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      NEEDLE_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact source pins, real SQLite software tests and closed raw receipts
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-c6-budget-lexical-v2"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          890641892b3d4f6ec1f54de4e6591cfa4784baa6 v13/code/docs/fixtures/run51_f1f5_second_attempt_seed467.json
          295702496d94e84113f253cc3a09d71aba3b1e34 v13/code/v13/c6_temporal_draft_preflight_candidate.py
          30bb3269fa89621f78db893cf566d04f8768cf27 v13/code/v13/c6_positive_assertion_candidate.py
          bd524f2b09368ee265a4f3c5a7253da49078771c v13/code/docs/C6_BUDGET_LEXICAL_V2_PREREG_20261031.md
          b5c0cf0c07f8abdfdbb08e18ea6520200684c572 v13/code/v13/c6_budget_lexical_v2_candidate.py
          f810422d49cc3f0ac73e0f0d407098a1355bb1fb v13/code/tests/test_c6_budget_lexical_v2_candidate.py
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          sha256sum v13/code/docs/fixtures/run51_f1f5_second_attempt_seed467.json > "$e/FIXTURE_RAW.log" 2>&1
          test "$(cut -d' ' -f1 "$e/FIXTURE_RAW.log")" = 160128b2f5df2a5798ae7ec62687e6be5a8e61f6c6b2dad43f1ad253ee592ecc
          echo "$?" > "$e/FIXTURE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-c6-v2-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-c6-v2-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/FIXTURE_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 6m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_c6_budget_lexical_v2_candidate tests.test_c6_positive_assertion_candidate tests.test_c6_temporal_draft_preflight_candidate tests.test_f1f5_temporal_atomic_draft_candidate) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PIN_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/v13/c6_budget_lexical_v2_candidate.py v13/code/tests/test_c6_budget_lexical_v2_candidate.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base de79f3314844c88a9289528998272362df081aaa --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check de79f3314844c88a9289528998272362df081aaa HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve raw even on RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-c6-budget-lexical-v2-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-c6-budget-lexical-v2/
          retention-days: 90
          if-no-files-found: error
      - name: Require all eight stage exits zero
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-c6-budget-lexical-v2"
          for s in PINS FIXTURE VENV DEPS TEST COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo C6_BOUNDED_LEXICAL_V2_SOFTWARE_SHADOW_NO_TTY_NO_DELIVERY_NO_PROMOTION
