name: V14 JEPA source SHA holdout regression
on:
  push:
    branches:
      - jepa-memory/v14-source-sha-disjoint-fix-20261121
  pull_request:
    paths:
      - v14/learning/world_jepa_consumer.py
      - v14/learning/test_world_jepa_consumer.py
      - .github/workflows/v14-source-sha-disjoint-fix.yml
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
      - name: Install runtime test dependencies
        run: python -m pip install numpy pytest psutil
      - name: Compile V14 learning modules
        run: python -m py_compile v14/learning/*.py
      - name: Run V14 real SQLite Store and WorldJEPA regressions
        env:
          PYTHONPATH: v13/code:v14/learning
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python -m pytest -q v14/learning/test_*.py
