name: V13 Run301 WorldModel event-group holdout (software)
on:
  pull_request:
    paths:
      - 'v13/code/v13/world_model.py'
      - 'v13/code/tests/test_world_event_group_holdout_run301.py'
      - '.github/workflows/run301-world-event-holdout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  event-holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 50
      - name: Record exact head and Canon
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/RUN301_HEAD.txt"
          test "$(sha256sum v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md | cut -d' ' -f1)" = 3423906b01b24443fcef733fb5c7ef47296963df63e603d8f843c99d544877ee
          git hash-object v13/code/v13/world_model.py v13/code/tests/test_world_event_group_holdout_run301.py | tee "$RUNNER_TEMP/RUN301_BLOBS.txt"
          python3 -m compileall -q v13/code/v13/world_model.py v13/code/tests/test_world_event_group_holdout_run301.py
      - name: Isolated Python dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/run301venv"
          "$RUNNER_TEMP/run301venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Actual SQLite source-event split and prior regressions
        id: tests
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          PYTHONPATH="$PWD" "$RUNNER_TEMP/run301venv/bin/python" -m unittest -v \
            tests.test_world_event_group_holdout_run301 \
            tests.test_world_terminal_outcomes_run298 \
            tests.test_world_model \
            tests.test_world_model_integration_run64 \
            tests.test_world_action_chronology_run70 \
            tests.test_world_observation_integrity_run202 \
            tests.test_world_event_source_integrity_20261025 \
            tests.test_world_fitted_source_lineage_20261025 \
            tests.test_world_synthetic_scope_run264 2>&1 | tee "$RUNNER_TEMP/RUN301_TEST_RAW.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUNNER_TEMP/RUN301_TEST_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Official public repo privacy scan
        id: privacy
        run: |
          set -uo pipefail
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree 2>&1 | tee "$RUNNER_TEMP/RUN301_PRIVACY.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUNNER_TEMP/RUN301_PRIVACY_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Close raw logs and hashes
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sha256sum RUN301_HEAD.txt RUN301_BLOBS.txt RUN301_TEST_RAW.log RUN301_TEST_EXIT.txt RUN301_PRIVACY.log RUN301_PRIVACY_EXIT.txt > RUN301_SHA256SUMS.txt
      - name: Preserve RED and GREEN artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V13-Run301-EventHoldout-Raw-${{ github.sha }}
          path: |
            ${{ runner.temp }}/RUN301_HEAD.txt
            ${{ runner.temp }}/RUN301_BLOBS.txt
            ${{ runner.temp }}/RUN301_TEST_RAW.log
            ${{ runner.temp }}/RUN301_TEST_EXIT.txt
            ${{ runner.temp }}/RUN301_PRIVACY.log
            ${{ runner.temp }}/RUN301_PRIVACY_EXIT.txt
            ${{ runner.temp }}/RUN301_SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce actual exits
        if: always()
        run: |
          test "${{ steps.tests.outputs.rc }}" = "0"
          test "${{ steps.privacy.outputs.rc }}" = "0"
