name: V13 Run14L seed307 C3 structured vs copy 16-call native
on:
  push:
    branches: [assistant/v13-run14l-c3-structured-native-20261030-2008]
    paths:
      - '.github/workflows/v13-run14l-c3-structured-native.yml'
permissions:
  contents: read
concurrency:
  group: v13-step2-budget-paired-native-20261030
  cancel-in-progress: false
jobs:
  native-structured:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify pins, run 16 native calls, independently replay raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run14l-native"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          27f290a1cf519eb9b053b6acacb53f62ea5612fb v13/code/docs/RUN14L_C3_STRUCTURED_NATIVE_PREREG_20261030.md
          f9023c1d5e575279f333b4b99f0bb8bdea110e84 v13/code/docs/fixtures/run14l_c3_structured_seed307_20261030.json
          0dd1aa6db41c1258e13d4108316bcd850af3f589 v13/code/scripts/run14l_c3_structured_native.py
          711d789b466b5974b964e7d5faf10dc93453d458 v13/code/scripts/run14l_c3_structured_native_verify.py
          62af10d15de656316be8236534c48b82da70df16 v13/code/tests/test_run14l_c3_structured_native.py
          41ae26e01932ea7e89188e3a544bef103f1b3ec6 v13/code/v13/agi/c3_structured_source_shadow_run14k.py
          82d1f1e2af5bf565f9d5f081844e1da55c88084c v13/code/v13/agi/c3_source_fidelity_shadow_run13m.py
          b32edca2c1d622ce865f7beee11a925cdce064f9 v13/code/scripts/run13l_c3_system_native.py
          a8e240f47f25409eeb495d82e2dd0fe47dad0e3d v13/code/scripts/run13k_c3_copy_native.py
          de5cf4541bb45e2764ea424747dacd08e6f212e0 v13/code/scripts/run13j_c3_jef_native.py
          f27822fbd78e2ae37038df96f5a31ebb04ee11e1 v13/code/scripts/run13j_c3_jef_native_verify.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run14l-native-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run14l-native-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_run14l_c3_structured_native tests.test_c3_structured_source_shadow_run14k tests.test_run13t_c3_verbatim_heldout) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          export V13_HOME="$RUNNER_TEMP/v13-run14l-installed"
          if [ "$(cat "$e/TEST_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 15m env PYTHONPATH=v13/code "$py" -m v13.bootstrap --home "$V13_HOME" > "$e/BOOTSTRAP_RAW.log" 2>&1
            echo "$?" > "$e/BOOTSTRAP_EXIT.txt"
          else echo SKIPPED_TEST_RED > "$e/BOOTSTRAP_RAW.log"; echo 99 > "$e/BOOTSTRAP_EXIT.txt"; fi
          if [ "$(cat "$e/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 35m env PYTHONPATH=v13/code "$py" v13/code/scripts/run14l_c3_structured_native.py --home "$V13_HOME" --out "$e/pilot" --fixture v13/code/docs/fixtures/run14l_c3_structured_seed307_20261030.json --execute-native > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else echo SKIPPED_BOOTSTRAP_RED > "$e/NATIVE_RAW.log"; echo 99 > "$e/NATIVE_EXIT.txt"; fi
          if [ -f "$e/pilot/report.json" ]; then
            timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=v13/code "$py" v13/code/scripts/run14l_c3_structured_native_verify.py --pilot "$e/pilot" --fixture v13/code/docs/fixtures/run14l_c3_structured_seed307_20261030.json > "$e/REPORT_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          else echo NO_NATIVE_REPORT > "$e/REPORT_CHECK_RAW.log"; echo 99 > "$e/REPORT_CHECK_EXIT.txt"; fi
          "$py" -m py_compile v13/code/scripts/run14l_c3_structured_native.py v13/code/scripts/run14l_c3_structured_native_verify.py v13/code/tests/test_run14l_c3_structured_native.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 033cd9326cb2c7b8329f577b8eb32ded3839987c --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 033cd9326cb2c7b8329f577b8eb32ded3839987c HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original native raw and all failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run14l-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run14l-native/
          retention-days: 30
          if-no-files-found: error
      - name: Require native structural completion and independent raw replay
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run14l-native"
          for stage in PINS VENV DEPS TEST BOOTSTRAP NATIVE REPORT_CHECK COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              tail -80 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
          echo 'RUN14L_LINUX_NATIVE_STRUCTURAL_ONLY_NO_STEP2_B3_JEPA_REDMI_OR_WHOLE_SYSTEM_GATE'
