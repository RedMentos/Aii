name: V13 Run451 full postflight installed executable SHA
on:
  pull_request:
    paths:
      - '.github/workflows/run451-fullpostflight-executable.yml'
      - 'v13/code/scripts/run403_full_postflight.py'
      - 'v13/code/tests/test_run403_full_postflight.py'
      - 'v13/code/tests/test_run451_fullpostflight_executable_identity.py'
      - 'v13/code/docs/proofs/continuation-20261026/run451-fullpostflight/**'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      HF_HUB_OFFLINE: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Frozen cohort identities and dependencies
        run: |
          set -euo pipefail
          test "$(git hash-object v13/code/scripts/run394_step2_fresh.py)" = "fae7aed612108a554d8566b2917ebf31022df423"
          test "$(git hash-object v13/code/scripts/run397_step2_resume.py)" = "f1946054135cb6fdf48c06477308f518e2e62ad9"
          test "$(git hash-object v13/code/specs/models.json)" = "7af05962af41d0bc3f7dd18ef01d4eba55eabf99"
          python3 -m venv "$RUNNER_TEMP/run451"
          "$RUNNER_TEMP/run451/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Test full synthetic 378-row postflight and failure-history negatives
        run: |
          cd v13/code
          export PYTHONPATH="$PWD:$PWD/scripts"
          sha256sum scripts/run403_full_postflight.py tests/test_run403_full_postflight.py tests/test_run451_fullpostflight_executable_identity.py | tee "$RUNNER_TEMP/run451-source-sha256.txt"
          set +e
          "$RUNNER_TEMP/run451/bin/python" -m unittest -v tests.test_run451_fullpostflight_executable_identity tests.test_run403_full_postflight tests.test_run405_failure_history tests.test_run404_stage2_resume > "$RUNNER_TEMP/run451-tests.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/run451-tests.txt"
          printf 'EXIT=%s\n' "$status" > "$RUNNER_TEMP/run451-exit.txt"
          exit "$status"
      - name: Official privacy scan
        if: always()
        run: |
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
      - name: Retain RED and GREEN raw source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run451-fullpostflight-${{ github.sha }}
          path: |
            ${{ runner.temp }}/run451-source-sha256.txt
            ${{ runner.temp }}/run451-tests.txt
            ${{ runner.temp }}/run451-exit.txt
          if-no-files-found: warn
          retention-days: 30
