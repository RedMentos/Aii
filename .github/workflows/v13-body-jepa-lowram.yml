name: V13 low-RAM exact streamed Body-JEPA anchors
on:
  push:
    branches:
      - 'codex/v13-body-jepa-lowram-stream-*'
  pull_request:
    paths:
      - 'v13/code/v13/body_jepa.py'
      - 'v13/code/v13/agi/body_trainers.py'
      - 'v13/code/tests/test_body_jepa_stream_anchor.py'
      - '.github/workflows/v13-body-jepa-lowram.yml'
permissions:
  contents: read
jobs:
  gradient:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v13/code
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tiny test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest numpy
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and execute real tiny Torch gradients
        run: |
          python -m py_compile v13/body_jepa.py v13/agi/body_trainers.py tests/test_body_jepa_stream_anchor.py
          python -m pytest -q tests/test_body_jepa_stream_anchor.py tests/test_body_ag6_trainer_connection.py tests/test_body_heldout_retention.py tests/test_body_jepa.py
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python v13/code/scripts/public_repo_privacy_scan.py --base 2f2893ab1a7666b605564c29d7e2b60dfdc59ef4 --head HEAD
