name: V13 Run24 pinned C3 Linux native AG12 German English cohort
on:
  push:
    branches: [assistant/v13-run24-ag12-german-c3-native-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run24-ag12-german-c3-native.yml'
permissions:
  contents: read
concurrency:
  group: v13-native-c3-ag12-20261030
  cancel-in-progress: false
jobs:
  c3-ag12-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin immutable public C3, run real native DE then EN, retain all raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run24-c3-native"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          04ca9fb8190407a0d896c9789c932b7165930627 v13/code/docs/AG12_GERMAN_C3_NATIVE_PREREG_RUN24_20261030.md
          b781461e8fae5de9a519a0216d4d9a6a773eb498 v13/code/scripts/run24_ag12_german_c3_native.py
          04226718c4cbbd1d1f84ee01eed890b036211809 v13/code/tests/test_run24_ag12_german_c3_native.py
          3a5c13e14307d08c894476fa7acfc145acb16d00 v13/code/tests/test_ag12_german_body_eval_run23.py
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          bd035cf8029850cce00b179edf533e53bf24358a v13/code/v13/models.py
          dc23e192bcd01589475692666ebb6568c80d078b v13/code/v13/bootstrap.py
          66a9419143c456f01747b4796fb327b3b36711b3 v13/code/v13/agi/solver.py
          8e4727140e9f1e88b64c6d3bfdccb8526f772647 v13/code/v13/agi/__init__.py
          1944cffced498a32a28d74ec13bc9674df8e55fb v13/code/v13/agi/language_compare.py
          a1cab60363814cb86472a42defb5089d4cdbd432 v13/code/v13/agi/generality.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run24-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run24-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_run24_ag12_german_c3_native tests.test_ag12_german_body_eval_run23 tests.test_ag12_bilingual_compare_run22) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PIN_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          if [ "$(cat "$e/TEST_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=15s 38m env PYTHONPATH=v13/code "$py" v13/code/scripts/run24_ag12_german_c3_native.py --home "$RUNNER_TEMP/v13-run24-fresh-home" --out "$e/native" > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else echo SKIPPED_TEST_RED > "$e/NATIVE_RAW.log"; echo 99 > "$e/NATIVE_EXIT.txt"; fi
          if [ -f "$e/native/REPORT.json" ]; then
            "$py" - "$e/native/REPORT.json" > "$e/REPORT_CHECK_RAW.log" 2>&1 <<'PY'
          import json,pathlib,sys
          r=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert r['evidence_kind']=='LINUX_NATIVE_C3_AG12_ONLY'
          assert r['model_sha256']=='3d10b6ab8fc91a919534b9558e266255aca0bbc7f6d015963599aa9e74e05b1d'
          assert r['runner_tar_sha256']=='9abf88aea48a55d0f80edb1ee20220b186848cca0b4e919d71518cfd7ca67443'
          assert r['learning_mode']=='RECORD_ONLY' and r['jepa_weight']==0
          assert r['runtime_closed'] and r['no_holdout_prompts_in_events'] and r['no_holdout_prompts_in_messages']
          assert r['runs']['de']['status']=='DONE' and r['runs']['en']['status']=='DONE'
          assert r['native_calls_observed']>=176
          assert r['comparison']['status']=='DIAGNOSTIC_ONLY'
          assert not r['redmi_measured'] and not r['step2_promoted'] and not r['b3_promoted']
          assert not r['body_jepa_promoted'] and not r['learned_german_transfer_proven'] and not r['whole_system_complete']
          print('RUN24_LINUX_NATIVE_C3_176_CALLS_EN_DE_NO_TRANSFER_OR_AGE_PROMOTION')
          PY
            echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          else echo NO_CLOSED_NATIVE_REPORT > "$e/REPORT_CHECK_RAW.log"; echo 99 > "$e/REPORT_CHECK_EXIT.txt"; fi
          "$py" -m py_compile v13/code/scripts/run24_ag12_german_c3_native.py v13/code/tests/test_run24_ag12_german_c3_native.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base c64dfd129bbf02f13206fb7b9b143cd61ddc0c7c --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check c64dfd129bbf02f13206fb7b9b143cd61ddc0c7c HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve native and failed raw, never weights
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run24-c3-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run24-c3-native/
          retention-days: 30
          if-no-files-found: error
      - name: Require pinned full native completion, no gate promotion
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run24-c3-native"
          for stage in PINS VENV DEPS TEST NATIVE REPORT_CHECK COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              tail -60 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
          echo 'RUN24_REAL_LINUX_C3_ONLY_NO_REDMI_OR_WHOLE_SYSTEM_PROMOTION'
