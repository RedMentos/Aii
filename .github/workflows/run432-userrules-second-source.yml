name: V13 Run432 user-rule second opinion nonfinite source-only
on:
  pull_request:
    paths:
      - '.github/workflows/run432-userrules-second-source.yml'
      - 'v13/code/v13/userrules_second.py'
      - 'v13/code/tests/test_userrules_second_nonfinite_run432.py'
      - 'v13/code/docs/proofs/continuation-20261026/run432-userrules-second/**'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 80
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Source identity and compile
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/RUN432_HEAD.txt"
          git merge-base --is-ancestor 65ff1cd8d27732ba4691879b5db4afaabc7b890e HEAD
          sha256sum v13/code/v13/userrules_second.py v13/code/v13/userrules_second.json v13/code/tests/test_userrules_second_nonfinite_run432.py | tee "$RUNNER_TEMP/RUN432_SOURCE_SHA256.txt"
          python3 -m compileall -q v13/code/v13/userrules_second.py v13/code/tests/test_userrules_second_nonfinite_run432.py
      - name: RED-first tests and inherited rule guards
        id: tests
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          python3 -m venv "$RUNNER_TEMP/run432venv"
          timeout 240s "$RUNNER_TEMP/run432venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 2>&1 | tee "$RUNNER_TEMP/RUN432_DEPS_RAW.log"
          dep_rc=${PIPESTATUS[0]}
          if [ "$dep_rc" -eq 0 ]; then
            PYTHONPATH="$PWD:$PWD/scripts" "$RUNNER_TEMP/run432venv/bin/python" -m unittest -v \
              tests.test_userrules_second_nonfinite_run432 \
              tests.test_userrules_v8 tests.test_userrules \
              2>&1 | tee "$RUNNER_TEMP/RUN432_TESTS_RAW.log"
            rc=${PIPESTATUS[0]}
          else
            rc=2
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN432_TESTS_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Privacy scan
        id: privacy
        run: |
          set -uo pipefail
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree 2>&1 | tee "$RUNNER_TEMP/RUN432_PRIVACY_RAW.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUNNER_TEMP/RUN432_PRIVACY_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Close raw
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          find . -maxdepth 1 -type f -name 'RUN432_*' ! -name RUN432_SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > RUN432_SHA256SUMS.txt
      - name: Upload source raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V13-Run432-UserRulesSecond-Raw-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/RUN432_*
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce
        if: always()
        run: |
          test "${{ steps.tests.outputs.rc }}" = "0"
          test "${{ steps.privacy.outputs.rc }}" = "0"
