name: V13 Run87 Age0 standstill backup recovery end-to-end software
on:
  push:
    branches: [assistant/v13-run87-standstill-backup-recovery-20261029]
permissions:
  contents: read
concurrency:
  group: v13-run87-${{ github.ref }}
  cancel-in-progress: true
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Capture Run87 real stop/backup/restore and raw evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run87"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          for p in v13/code/docs/proofs/continuation-20261028/RUN87_STANDSTILL_BACKUP_RESTORE_PREREG.md v13/code/tests/test_run87_standstill_backup_restore_e2e.py v13/code/v13/standstill.py v13/code/v13/backup.py v13/code/scripts/ask_verified_budget.py v13/code/v13/operator.py v13/code/v13/runtime.py; do git hash-object "$p" | xargs -I{} echo "{} $p"; done > "$e/SOURCE_RAW.log"
          if [ "$(git hash-object v13/code/docs/proofs/continuation-20261028/RUN87_STANDSTILL_BACKUP_RESTORE_PREREG.md)" = 23360e5996311ca9d208a142cecab5172065f6f4 ] && [ "$(git hash-object v13/code/tests/test_run87_standstill_backup_restore_e2e.py)" = ed5ea5c5d8d4b93d61561f8099160581c9f91158 ] && [ "$(git hash-object v13/code/v13/standstill.py)" = 92e80399501036aeed5f29fc7d9fb23af9941c95 ] && [ "$(git hash-object v13/code/v13/backup.py)" = 409c4e13ba0754364d708e4dbe803bd740954b69 ] && [ "$(git hash-object v13/code/scripts/ask_verified_budget.py)" = 75ca7f3f197665f665d9582b7f5c2efb1f598235 ] && [ "$(git hash-object v13/code/v13/operator.py)" = 7bf3a992af1db87f6ee2432c2486dbbced0f2bd4 ] && [ "$(git hash-object v13/code/v13/runtime.py)" = 68e7ed1352800174972558f1e0b0683a42c8689a ]; then echo 0 > "$e/SOURCE_EXIT.txt"; else echo 1 > "$e/SOURCE_EXIT.txt"; fi
          python3 -m venv "$RUNNER_TEMP/v13-run87-venv"
          py="$RUNNER_TEMP/v13-run87-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/BASE_INSTALL_RAW.log" 2>&1
          echo "$?" > "$e/BASE_INSTALL_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 180s env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_run87_standstill_backup_restore_e2e tests.test_run83_age0_backup_restore_e2e tests.test_standstill tests.test_verified_operator_preflight) > "$e/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$e/FOCUSED_EXIT.txt"
          python3 -m compileall -q v13/code/tests/test_run87_standstill_backup_restore_e2e.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu > "$e/INSTALL_RAW.log" 2>&1
            first=$?
            "$py" -m pip install --disable-pip-version-check --no-input 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
            second=$?
            if [ "$first" = 0 ] && [ "$second" = 0 ]; then
              echo 0 > "$e/INSTALL_EXIT.txt"
              (cd v13/code && timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=.:tests "$py" -m unittest discover -s tests -p 'test_*.py' -q) > "$e/FULL_RAW.log" 2>&1
              echo "$?" > "$e/FULL_EXIT.txt"
            else
              echo 1 > "$e/INSTALL_EXIT.txt"
              echo SKIPPED_PREREQ_RED > "$e/FULL_RAW.log"; echo SKIPPED_RED > "$e/FULL_EXIT.txt"
            fi
          else
            echo SKIPPED_FOCUSED_RED > "$e/INSTALL_RAW.log"; echo SKIPPED_RED > "$e/INSTALL_EXIT.txt"
            echo SKIPPED_FOCUSED_RED > "$e/FULL_RAW.log"; echo SKIPPED_RED > "$e/FULL_EXIT.txt"
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 3545dab0faa3d548df58557ed8376a6162c51d9a --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 3545dab0faa3d548df58557ed8376a6162c51d9a HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - name: Preserve Run87 original raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run87-standstill-backup-restore-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run87/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce Run87 source and emergency-stop backup lifecycle gates
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run87"
          for n in SOURCE BASE_INSTALL FOCUSED COMPILE INSTALL FULL PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; raw retained; no native/Redmi/age/utility promotion"
              tail -40 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN87_STOP_BACKUP_RESTORE_LINUX_SOFTWARE_ONLY
