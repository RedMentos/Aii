name: V13 research perception contract
on:
  push:
    paths:
      - 'v13/code/tests/test_space_cross_organ_budget.py'
      - '.github/workflows/v13-research-perception-contract.yml'
  pull_request:
    paths:
      - 'v13/code/tests/test_space_cross_organ_budget.py'
      - '.github/workflows/v13-research-perception-contract.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cross-organ contract against checked-out production code
        env:
          PYTHONPATH: v13/code
        run: python -m unittest discover -s v13/code/tests -p 'test_space_cross_organ_budget.py' -v
