name: V13 BP1 native V2 adapter locator retry software review
on:
  push:
    branches: [codex/automation11-bp1-v2-adapter-locator-retry-20261027]
    paths:
      - '.github/workflows/bp1-qad-v2-adapter-locator-review.yml'
      - '.github/workflows/bp1-qad-train-plus-v2-samejob.yml'
      - 'v13/code/scripts/bp1_qad_adapter_locator.py'
      - 'v13/code/tests/test_bp1_qad_adapter_locator.py'
      - 'v13/code/tests/test_bp1_qad_adapter_locator_workflow.py'
      - 'v13/code/docs/proofs/continuation-20261027/bp1-qad-v2-adapter-locator/PREREG.md'
permissions:
  contents: read
concurrency:
  group: v13-bp1-v2-adapter-locator-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Exact native V2 workflow and adapter source, unit, compile, privacy
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/bp1-locator-review"
          git rev-parse HEAD > "$RUNNER_TEMP/bp1-locator-review/HEAD.txt"
          sha256sum v13/code/scripts/bp1_qad_adapter_locator.py v13/code/tests/test_bp1_qad_adapter_locator.py v13/code/tests/test_bp1_qad_adapter_locator_workflow.py .github/workflows/bp1-qad-train-plus-v2-samejob.yml > "$RUNNER_TEMP/bp1-locator-review/SOURCE_SHA256.txt"
          (cd v13/code && PYTHONPATH="$PWD:$PWD/scripts" python3 -m unittest -v tests.test_bp1_qad_adapter_locator tests.test_bp1_qad_adapter_locator_workflow tests.test_bp1_qad_train_candidate tests.test_bp1_qad_lora_eval) > "$RUNNER_TEMP/bp1-locator-review/UNIT_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp1-locator-review/UNIT_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/bp1_qad_adapter_locator.py v13/code/tests/test_bp1_qad_adapter_locator.py v13/code/tests/test_bp1_qad_adapter_locator_workflow.py > "$RUNNER_TEMP/bp1-locator-review/COMPILE_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp1-locator-review/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base ca954bf471a4d96abb4e84c8dcd847c75a5b1186 --head HEAD > "$RUNNER_TEMP/bp1-locator-review/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp1-locator-review/PRIVACY_EXIT.txt"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bp1-v2-adapter-locator-review-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/bp1-locator-review/
          if-no-files-found: error
      - name: Enforce all source-only exits
        run: |
          set -euo pipefail
          for n in UNIT COMPILE PRIVACY; do
            test "$(cat "$RUNNER_TEMP/bp1-locator-review/${n}_EXIT.txt")" = 0 || {
              tail -100 "$RUNNER_TEMP/bp1-locator-review/${n}_RAW.log"; exit 1;
            }
          done
          echo "BP1_V2_ADAPTER_LOCATOR_SOFTWARE_ONLY_NATIVE_RETRY_NOT_ACTIVATED"
