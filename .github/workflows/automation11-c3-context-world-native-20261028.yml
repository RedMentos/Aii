name: V13 Automation11 C3 ContextOS WorldJEPA merged native source-use replay
on:
  push:
    branches:
      - assistant/v13-run11-c3-context-world-native-20261028
    paths:
      - '.github/workflows/automation11-c3-context-world-native-20261028.yml'
      - 'v13/code/scripts/native_c3_cli_render_fresh_smoke.py'
      - 'v13/code/scripts/ask_verified_budget.py'
      - 'v13/code/v13/source_consumer.py'
      - 'v13/code/v13/context_os.py'
      - 'v13/code/v13/world_jepa.py'
permissions:
  contents: read
concurrency:
  group: v13-run11-age0-native-endtoend
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      V13_NO_AUTOSTART: "1"
      NEEDLE_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify merged frozen source pins, bootstrap models, execute unchanged native cohort
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run11-c3-context-world-native"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          ccf5b5a5e080560beab90f275f8d73af4f68eaa5 v13/code/scripts/native_c3_cli_render_fresh_smoke.py
          75ca7f3f197665f665d9582b7f5c2efb1f598235 v13/code/scripts/ask_verified_budget.py
          0edb409e5ee6674e22539713874e9a038f9cba24 v13/code/v13/source_consumer.py
          68e7ed1352800174972558f1e0b0683a42c8689a v13/code/v13/runtime.py
          efda7aa1aa5729e974d0d641870d4da05d21c961 v13/code/v13/runners.py
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          fd8ea629dc565a5f27b212599f3b006bb93605fd v13/code/v13/context_os.py
          87dde9c51ac9c042694870f3e15619711503a537 v13/code/v13/world_jepa.py
          52563e1c838b5dc9955fa8739ff35c1de1eed707 v13/code/tests/test_context_os.py
          4c72c10a6266729e4c5d274bd4fbb4bc1f7be7a2 v13/code/tests/test_world_jepa_fit_input_guard.py
          BLOBS
          : > "$e/BLOBS_RAW.log"
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            printf '%s %s %s\n' "$want" "$got" "$path" >> "$e/BLOBS_RAW.log"
            if [ "$want" != "$got" ]; then echo MISMATCH >> "$e/BLOBS_RAW.log"; fi
          done < "$e/EXPECTED_BLOBS.txt"
          if grep -q MISMATCH "$e/BLOBS_RAW.log"; then echo 1 > "$e/BLOBS_EXIT.txt"; else echo 0 > "$e/BLOBS_EXIT.txt"; fi
          python3 -m venv "$RUNNER_TEMP/v13-run11-c3-context-world-native-venv"
          py="$RUNNER_TEMP/v13-run11-c3-context-world-native-venv/bin/python"
          "$py" -m pip install --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          first=$?
          "$py" -m pip install --no-input -q 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
          second=$?
          "$py" -m pip install --no-input -q 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
          third=$?
          if [ "$first" = 0 ] && [ "$second" = 0 ] && [ "$third" = 0 ]; then echo 0 > "$e/INSTALL_EXIT.txt"; else echo 1 > "$e/INSTALL_EXIT.txt"; fi
          python3 -m compileall -q v13/code/scripts/native_c3_cli_render_fresh_smoke.py v13/code/scripts/ask_verified_budget.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$(cat "$e/BLOBS_EXIT.txt")" = 0 ] && [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_ask_verified_budget tests.test_c3_cli_no_worker_pinned) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else
            echo SKIPPED_PREREQ_RED > "$e/FOCUSED_RAW.log"
            echo SKIPPED_RED > "$e/FOCUSED_EXIT.txt"
          fi
          home="$RUNNER_TEMP/v13-run11-c3-context-world-native-home"
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ] && [ ! -e "$home" ]; then
            timeout --signal=INT --kill-after=15s 14m env PYTHONPATH=v13/code "$py" -m v13.bootstrap --home "$home" > "$e/BOOTSTRAP_RAW.log" 2>&1
            echo "$?" > "$e/BOOTSTRAP_EXIT.txt"
          else
            echo SKIPPED_FOCUSED_RED > "$e/BOOTSTRAP_RAW.log"
            echo SKIPPED_RED > "$e/BOOTSTRAP_EXIT.txt"
          fi
          if [ "$(cat "$e/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            env PYTHONPATH=v13/code "$py" - "$home" > "$e/MODEL_VERIFY_RAW.log" 2>&1 <<'PY'
          import json,pathlib,sys
          from v13.models import ModelManager
          h=pathlib.Path(sys.argv[1]);m=ModelManager(h);v=m.verify(deep=True)
          assert len(v)>=4 and all(x['ok'] and x['hash_checked'] for x in v.values()),v
          cfg=json.loads((h/'config/settings.json').read_text())
          assert cfg['system_stage']==0 and cfg['learning_mode']=='RECORD_ONLY'
          assert cfg.get('jepa_weight',0)==0 and not cfg['latents_enabled']
          assert m.installed['language']['exact_revision']=='657e078c94084481950a2d555a941481f715536b'
          print('C3_CLI_PINNED_MODELS_AGE0',json.dumps({k:x['revision'] for k,x in v.items()},sort_keys=True))
          PY
            echo "$?" > "$e/MODEL_VERIFY_EXIT.txt"
          else
            echo SKIPPED_BOOTSTRAP_RED > "$e/MODEL_VERIFY_RAW.log"
            echo SKIPPED_RED > "$e/MODEL_VERIFY_EXIT.txt"
          fi
          if [ "$(cat "$e/MODEL_VERIFY_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=INT --kill-after=15s 20m env PYTHONPATH=. "$py" scripts/native_c3_cli_render_fresh_smoke.py --installed-home "$home" --out "$e/NATIVE_REPORT.json") > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else
            echo SKIPPED_VERIFY_RED > "$e/NATIVE_RAW.log"
            echo SKIPPED_RED > "$e/NATIVE_EXIT.txt"
          fi
          if [ -f "$e/NATIVE_REPORT.json" ]; then
            env PYTHONPATH=v13/code "$py" - "$e/NATIVE_REPORT.json" > "$e/REPORT_CHECK_RAW.log" 2>&1 <<'PY'
          import json,pathlib,sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert d['status']=='CLI_RENDER_NATIVE_SCOPED_PASS',d['status']
          assert d['fixture_sha256']=='4fe0977c26f5f0d213d992b17a5a4fa0b1d5fd05fa3eaf7146116076c4414eea'
          assert len(d['positive'])==2 and all(x['pass'] for x in d['positive'])
          assert len(d['negative'])==8 and all(x['pass'] for x in d['negative'])
          assert d['native_calls']==2 and d['model_hash_unchanged'] and not d['integrity_errors']
          assert d['phone_measured'] is False and d['seed']==13
          print('ACTUAL_C3_CLI_RENDER_NATIVE_SCOPED_PASS_NO_STAGE11_OR_REDMl',d['native_calls'])
          PY
            echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          else
            echo MISSING_NATIVE_REPORT > "$e/REPORT_CHECK_RAW.log"
            echo SKIPPED_RED > "$e/REPORT_CHECK_EXIT.txt"
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 3ca9a6d158759f5abc9c00883135487c0a33e3ae --head HEAD > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 3ca9a6d158759f5abc9c00883135487c0a33e3ae HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-run11-c3-context-world-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run11-c3-context-world-native/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce actual native CLI result without promoting original gates
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run11-c3-context-world-native"
          for name in BLOBS INSTALL COMPILE FOCUSED BOOTSTRAP MODEL_VERIFY NATIVE REPORT_CHECK PRIVACY DIFF; do
            if [ "$(cat "$e/${name}_EXIT.txt")" != 0 ]; then
              echo "$name RED; raw retained"
              tail -50 "$e/${name}_RAW.log" || true
              exit 1
            fi
          done
          echo 'ACTUAL_C3_CONTEXT_WORLD_NATIVE_SCOPED_ONLY_NO_STAGE11_OR_JEPA'
