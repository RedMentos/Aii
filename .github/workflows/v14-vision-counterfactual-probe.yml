name: V14 A3 counterfactual dynamics probe

on:
  push:
    branches:
      - "research-perception/**"
    paths:
      - "v14/experiments/vision_counterfactual_probe.py"
      - "v14/experiments/test_vision_counterfactual_probe.py"
      - "v14/experiments/test_a3_projector_integration.py"
      - ".github/workflows/v14-vision-counterfactual-probe.yml"
  pull_request:
    paths:
      - "v14/experiments/vision_counterfactual_probe.py"
      - "v14/experiments/test_vision_counterfactual_probe.py"
      - "v14/experiments/test_a3_projector_integration.py"
      - ".github/workflows/v14-vision-counterfactual-probe.yml"

permissions:
  contents: read

concurrency:
  group: v14-vision-counterfactual-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install NumPy
        run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Compile probe and tests
        run: python -m py_compile v14/experiments/vision_counterfactual_probe.py v14/experiments/test_vision_counterfactual_probe.py v14/experiments/test_a3_projector_integration.py
      - name: Run counterfactual feature, source-disjoint and negative controls
        working-directory: v14/experiments
        env:
          PYTHONPATH: ../../v13/code
        run: python -m unittest test_vision_counterfactual_probe test_a3_projector_integration -v
