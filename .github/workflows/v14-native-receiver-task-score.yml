name: V14 Native Receiver Task Score
on:
  push:
    branches: [research-perception/v14-native-receiver-task-score-20261125-run24]
    paths:
      - 'v13/code/v13/native/receiver_task_score/**'
      - 'v13/code/v13/native_receiver_task_score.py'
      - 'v13/code/v13/native_receiver_utility.py'
      - 'v13/code/tests/test_native_receiver_task_score.py'
      - '.github/workflows/v14-native-receiver-task-score.yml'
  pull_request:
    branches: [research-perception/v14-anchor-preserving-tokenwise-20261125-run22, gpt6/v13-private-remote-bridge-20261111]
    paths:
      - 'v13/code/v13/native/receiver_task_score/**'
      - 'v13/code/v13/native_receiver_task_score.py'
      - 'v13/code/v13/native_receiver_utility.py'
      - 'v13/code/tests/test_native_receiver_task_score.py'
      - '.github/workflows/v14-native-receiver-task-score.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest==9.2.0
      - name: Compile and test the exact task-score wrapper
        run: |
          PYTHONPATH=v13/code python -m py_compile v13/code/v13/native_receiver_task_score.py v13/code/v13/native_receiver_utility.py
          PYTHONPATH=v13/code python -m pytest -q v13/code/tests/test_native_receiver_task_score.py
      - name: Public repository privacy scan
        if: github.event_name == 'pull_request'
        run: python v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
  linux-native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch the exact llama.cpp source
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git llama.cpp
          git -C llama.cpp checkout b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
          test "$(git -C llama.cpp rev-parse HEAD)" = b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
      - name: Build and run native math/CLI checks
        run: |
          cmake -S v13/code/v13/native/receiver_task_score -B build/task-score-linux \
            -DLLAMA_CPP_DIR="$GITHUB_WORKSPACE/llama.cpp" \
            -DV14_WITH_LLAMA=ON \
            -DV14_LLAMA_REVISION=b29c606e28a01b1bc8c1351026a0fa6e616bf6c4 \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build/task-score-linux --target native_receiver_task_score --parallel 2
          build/task-score-linux/bin/native_receiver_task_score --selftest
          build/task-score-linux/bin/native_receiver_task_score --version
  android-arm64-cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: android-actions/setup-android@v3
        with:
          ndk-version: 27.2.12479018
      - name: Fetch the exact llama.cpp source
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git llama.cpp
          git -C llama.cpp checkout b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
          test "$(git -C llama.cpp rev-parse HEAD)" = b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
      - name: Cross-compile the native receiver task scorer for Android arm64
        run: |
          cmake -S v13/code/v13/native/receiver_task_score -B build/task-score-android \
            -DLLAMA_CPP_DIR="$GITHUB_WORKSPACE/llama.cpp" \
            -DV14_WITH_LLAMA=ON \
            -DV14_LLAMA_REVISION=b29c606e28a01b1bc8c1351026a0fa6e616bf6c4 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build/task-score-android --target native_receiver_task_score --parallel 2
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build/task-score-android/bin/native_receiver_task_score | grep -E 'Class:|Machine:'
