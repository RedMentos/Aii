name: V13 read-only World-Model four-route operator comparison
on:
  push:
    branches: [codex/v13-worldmodel-compare-operator-20261029-auto10au]
    paths:
      - '.github/workflows/v13-worldmodel-compare-operator-20261029.yml'
      - 'v13/code/v13/operator.py'
      - 'v13/code/tests/test_worldmodel_operator_20261029.py'
      - 'v13/code/docs/proofs/continuation-20261029/WORLDMODEL_COMPARE_OPERATOR_PREREG_20261029.md'
permissions:
  contents: read
jobs:
  read-only-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test observed four-route World-Model comparison without learning
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-worldmodel-compare"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/v13/operator.py v13/code/v13/world_model.py v13/code/tests/test_worldmodel_operator_20261029.py v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/SOURCE_BLOBS.txt"
          test "$(tail -1 "$e/SOURCE_BLOBS.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          echo "$?" > "$e/CANON_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-worldmodel-compare-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-worldmodel-compare-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
          else echo SKIPPED > "$e/DEPS_EXIT.txt"; echo SKIPPED > "$e/PIP_CHECK_EXIT.txt"; fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_worldmodel_operator_20261029 tests.test_world_model tests.test_worldmodel_numeric_guard_20261029 tests.test_worldmodel_output_domain_20261029 tests.test_worldmodel_selection_binding_20261029) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else echo SKIPPED > "$e/FOCUSED_EXIT.txt"; echo SKIPPED > "$e/FOCUSED_RAW.log"; fi
          "$py" -m py_compile v13/code/v13/operator.py v13/code/tests/test_worldmodel_operator_20261029.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base e321d06cac47bcba42030ab87625b2ed192bc96c --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check e321d06cac47bcba42030ab87625b2ed192bc96c HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-worldmodel-compare-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-worldmodel-compare/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce World-Model operator checks without gate promotion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-worldmodel-compare"
          for stage in CANON VENV DEPS PIP_CHECK FOCUSED COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained"
              tail -60 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'WORLDMODEL_COMPARE_OPERATOR_SOFTWARE_PASS_NO_ACTION_AUTHORITY'
