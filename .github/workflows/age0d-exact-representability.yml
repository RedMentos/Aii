name: V13 AGE0d exact representability review
on:
  push:
    branches: [codex/automation11-age0d-exact-representability-20261027]
    paths:
      - '.github/workflows/age0d-exact-representability.yml'
      - 'v13/code/scripts/age0d_answer_audit.py'
      - 'v13/code/tests/test_age0d_exact_representability.py'
permissions:
  contents: read
concurrency:
  group: v13-age0d-exact-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Source-bound raw test evidence
        run: |
          set +e
          evidence="$RUNNER_TEMP/v13-age0d-exact"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/HEAD.txt"
          git hash-object v13/code/scripts/age0d_answer_audit.py > "$evidence/SOURCE_BLOB.txt"
          git hash-object v13/code/tests/test_age0d_exact_representability.py > "$evidence/TEST_BLOB.txt"
          (
            cd v13/code
            timeout --signal=TERM --kill-after=10s 2m env PYTHONPATH=. python3 -m unittest -v tests.test_age0d_exact_representability tests.test_age0d_answer_audit tests.test_age0d_cli tests.test_age0d_locale_ambiguity_review
          ) > "$evidence/UNIT_RAW.log" 2>&1
          echo "$?" > "$evidence/UNIT_EXIT.txt"
          python3 -m py_compile v13/code/scripts/age0d_answer_audit.py v13/code/tests/test_age0d_exact_representability.py > "$evidence/COMPILE_RAW.log" 2>&1
          echo "$?" > "$evidence/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 6c1e0e985c7fa5ba5e477d95743cf1e21b718831 --head HEAD > "$evidence/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$evidence/PRIVACY_EXIT.txt"
          git diff --check 6c1e0e985c7fa5ba5e477d95743cf1e21b718831 HEAD > "$evidence/DIFF_RAW.log" 2>&1
          echo "$?" > "$evidence/DIFF_EXIT.txt"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-age0d-exact-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-age0d-exact/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce exits; preserve RED failure
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/v13-age0d-exact"
          for name in UNIT COMPILE PRIVACY DIFF; do
            if [ "$(cat "$evidence/${name}_EXIT.txt")" != 0 ]; then
              echo "$name failed; raw evidence retained"
              tail -80 "$evidence/${name}_RAW.log"
              exit 1
            fi
          done
          echo 'AGE0D_EXACT_SOFTWARE_ONLY_STAY_SHADOW'
