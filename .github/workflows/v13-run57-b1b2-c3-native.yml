name: V13 Run57 five-call B1 B2 to C3 exact source envelope Linux native
on:
  push:
    branches: [assistant/v13-run57-b1b2-c3-native-envelope-20261031-auto11]
    paths: ['.github/workflows/v13-run57-b1b2-c3-native.yml']
permissions:
  contents: read
concurrency:
  group: v13-step2-budget-paired-native-20261030
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen source pins, pinned bootstrap, eight native B1/B2 topic-partition offers and independent replay
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run57-native"
          mkdir -p "$e/receipts"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          890641892b3d4f6ec1f54de4e6591cfa4784baa6 v13/code/docs/fixtures/run51_f1f5_second_attempt_seed467.json
          0ae9bc8f2b50dc358fda5c1ef24a65e004012e6b v13/code/docs/RUN51_F1F5_SECOND_ATTEMPT_PREREG_20261031.md
          a5da4ba065a2f79f38e9b94b57fcb3d1cb4138c7 v13/code/scripts/run51_f1f5_second_attempt_native.py
          0058092a0def77ad860198ef0b51083732c48c3b v13/code/scripts/run51_f1f5_second_attempt_verify.py
          9640619488fd6c3fdb20625e6ecd27b7f3fedd7d v13/code/tests/test_run51_f1f5_second_attempt.py
          c33930e8f9d9f02f788bc8fb9de3f498db9a2800 v13/code/v13/source_consumer.py
          53dc948d0d360f94743ad996eb83ea0e85c2dd0b v13/code/v13/memory.py
          4705a46640134e213aa00a86e02375d972c76cda v13/code/scripts/run47_jef_c3_typed_receiver_native.py
          d684572065fa220becf72a888b6303c4467ab8f3 v13/code/scripts/run47_jef_c3_typed_receiver_verify.py
          22ed11e4a53d9eeae8fbc74a1753082b5785be2b v13/code/v13/runtime.py
          efda7aa1aa5729e974d0d641870d4da05d21c961 v13/code/v13/runners.py
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          0779d986fb8aee8aa01c5df5f656889d4bd56348 v13/code/v13/store.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          6d5a6394f8cd68192d44c66606d4793486cad925 v13/code/scripts/run54_b1b2_topic_native.py
          b95bf64065673412eaea025548642d407b29955f v13/code/scripts/run54_b1b2_topic_native_verify.py
          3054d2dad09691ba8c2cf31cc7292202e74f09ef v13/code/tests/test_run54_b1b2_topic_native.py
          429d792106063c48933d921dc1a6b7ecd16b5df6 v13/code/scripts/run55_b1b2_topic_native_corrective.py
          b9de84c7cf76f0d629d396b0b45c2b0fb528bdd6 v13/code/scripts/run55_b1b2_topic_native_verify.py
          ee0cdd4cefa5928cfbc752e9d0535661b248228c v13/code/tests/test_run55_b1b2_native_corrective.py
          8aaccb96c3fca43fa4450ab9bdc15f0e787bf093 v13/code/v13/b1b2_c3_source_envelope_candidate.py
          beda0ad44985fc567ea7e1b39db8617493955176 v13/code/tests/test_b1b2_c3_source_envelope_candidate.py
          221798d31436fc88bbf1dce7f22328fd068b2dde v13/code/scripts/run57_b1b2_c3_native_envelope.py
          e25deb605e7fc7cca857f7c2078a202fdd07ad57 v13/code/scripts/run57_b1b2_c3_native_verify.py
          01f970a302590ce78198f678fe24936447682a9d v13/code/tests/test_run57_b1b2_c3_native_envelope.py
          277d34a46b14633c52b5e7d59b3fdf0f16ea4159 v13/code/v13/b1b2_topic_partition_candidate.py
          a73ad91409dbf5b6a62b2b935b6491aad7301db8 v13/code/scripts/run52_b1b2_cross_turn_native.py
          c887e3db355df8b68d3bd35c6c86d1573ea2d081 v13/code/docs/fixtures/run52_b1b2_cross_turn_seed479.json
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          sha256sum v13/code/docs/fixtures/run52_b1b2_cross_turn_seed479.json > "$e/FIXTURE_RAW.log" 2>&1
          test "$(cut -d' ' -f1 "$e/FIXTURE_RAW.log")" = 5cc8783dedbb201a0a8b86763c99dc23130e1d126a603cf0afcac33d8b985f3b
          echo "$?" > "$e/FIXTURE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run57-native-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run57-native-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/FIXTURE_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_run57_b1b2_c3_native_envelope tests.test_b1b2_c3_source_envelope_candidate tests.test_run55_b1b2_native_corrective tests.test_run54_b1b2_topic_native tests.test_c6_temporal_draft_preflight_candidate tests.test_f1f5_temporal_atomic_draft_candidate tests.test_f1f5_temporal_source_gate_candidate tests.test_runtime_c3_atomic_draft_candidate tests.test_b1b2_topic_partition_candidate tests.test_b1b2_causal_offer_consumer_candidate tests.test_b1b2_causal_context_candidate tests.test_f1f5_c5c6_atomic_draft_candidate tests.test_f1f5_event_finalizer_candidate tests.test_run52_lexical_metric_audit tests.test_run52_b1b2_cross_turn tests.test_run51_f1f5_second_attempt tests.test_run50_native_c3_c5_c6_draft tests.test_run49_c5_c6_draft_shadow tests.test_run48_jef_c3_final_agreement_shadow tests.test_run46b_jef_source_eligibility_shadow) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PINS_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          export V13_HOME="$RUNNER_TEMP/v13-run51-installed"
          if [ "$(cat "$e/TEST_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 15m env PYTHONPATH=v13/code "$py" -m v13.bootstrap --home "$V13_HOME" > "$e/BOOTSTRAP_RAW.log" 2>&1
            echo "$?" > "$e/BOOTSTRAP_EXIT.txt"
          else echo SKIPPED_TEST_RED > "$e/BOOTSTRAP_RAW.log"; echo 99 > "$e/BOOTSTRAP_EXIT.txt"; fi
          if [ "$(cat "$e/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 36m env PYTHONPATH=v13/code "$py" v13/code/scripts/run57_b1b2_c3_native_envelope.py --home "$V13_HOME" --out "$e/pilot" --fixture v13/code/docs/fixtures/run52_b1b2_cross_turn_seed479.json > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else echo SKIPPED_BOOTSTRAP_RED > "$e/NATIVE_RAW.log"; echo 99 > "$e/NATIVE_EXIT.txt"; fi
          if [ -f "$e/pilot/report.json" ]; then
            timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=v13/code "$py" v13/code/scripts/run57_b1b2_c3_native_verify.py --report "$e/pilot/report.json" --fixture v13/code/docs/fixtures/run52_b1b2_cross_turn_seed479.json > "$e/REPORT_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          else echo NO_NATIVE_REPORT_RED > "$e/REPORT_CHECK_RAW.log"; echo 99 > "$e/REPORT_CHECK_EXIT.txt"; fi
          "$py" -m py_compile v13/code/scripts/run57_b1b2_c3_native_envelope.py v13/code/scripts/run57_b1b2_c3_native_verify.py v13/code/v13/b1b2_c3_source_envelope_candidate.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 489c6e0c0ff3c9da0d8a484338dda4fb874df91e --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 489c6e0c0ff3c9da0d8a484338dda4fb874df91e HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          cp "$e/HEAD.txt" "$e/PINS.txt" "$e/receipts/"
          for s in PINS FIXTURE VENV DEPS TEST BOOTSTRAP NATIVE REPORT_CHECK COMPILE PRIVACY DIFF; do
            cp "$e/${s}_RAW.log" "$e/${s}_EXIT.txt" "$e/receipts/" 2>/dev/null || true
          done
          [ ! -f "$e/pilot/report.json" ] || cp "$e/pilot/report.json" "$e/receipts/ORIGINAL_REPORT.json"
          (cd "$e/receipts" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original native and failure receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run57-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run57-native/receipts/
          retention-days: 90
          if-no-files-found: error
      - name: Require original native and independent replay; retain scientific RED
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run57-native"
          for s in PINS FIXTURE VENV DEPS TEST BOOTSTRAP NATIVE REPORT_CHECK COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN57_LINUX_NATIVE_B1B2_TOPIC_PARTITION_STRUCTURAL_ONLY_NO_UTILITY_PROMOTION
