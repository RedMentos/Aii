name: V13 STEP2 original paired native RED independent raw-audit software
on:
  push:
    branches: [codex/v13-step2-pilot-raw-validator-audit-20261030-hourly11]
    paths:
      - '.github/workflows/v13-step2-paired-raw-validator-audit-20261030.yml'
      - 'v13/code/scripts/step2_paired_raw_validator_audit_20261030.py'
      - 'v13/code/tests/test_step2_paired_raw_validator_audit_20261030.py'
      - 'v13/code/docs/STEP2_PAIRED_PILOT_RAW_VALIDATOR_AUDIT_*'
permissions:
  contents: read
jobs:
  read-only-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Independent audit unit tests, pins, privacy and raw evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-step2-paired-raw-audit"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          fcd44ccce3b8b40d65a25187a78b0a8d49d9609d v13/code/scripts/step2_paired_raw_validator_audit_20261030.py
          e14e2161c75ab94f715f3c2216b23ea5f6e81837 v13/code/tests/test_step2_paired_raw_validator_audit_20261030.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          source_red=0
          : > "$e/SOURCE_RAW.log"
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/SOURCE_RAW.log"
            if [ "$want" != "$got" ]; then source_red=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$source_red" > "$e/SOURCE_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests:scripts python3 -m unittest -v tests.test_step2_paired_raw_validator_audit_20261030) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m py_compile v13/code/scripts/step2_paired_raw_validator_audit_20261030.py v13/code/tests/test_step2_paired_raw_validator_audit_20261030.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base c6a9de775c2e7f4f450472f75db0481458894386 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check c6a9de775c2e7f4f450472f75db0481458894386 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve raw independent audit tests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-step2-paired-raw-audit-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-step2-paired-raw-audit/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce non-promoting audit tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-step2-paired-raw-audit"
          for stage in SOURCE TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; raw retained"
              tail -50 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'ORIGINAL_NATIVE_PILOT_RED_RETAINED_INDEPENDENT_AUDIT_ONLY'
