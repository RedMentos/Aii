name: V13 Run35 C3 report attribution adversarial review
on:
  push:
    branches:
      - assistant/v13-run35-c3-report-arm-binding-review-20261028
permissions:
  contents: read
concurrency:
  group: v13-run35-c3-report-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      V13_NO_AUTOSTART: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Capture source-only native preflight evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run35-c3-report-review"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          for p in v13/code/scripts/run33_b2_c3_counterfactual_envelopes.py v13/code/scripts/run15_step2_disjoint_bilingual_fixtures.py v13/code/tests/integration_step2_utility.py v13/code/specs/models.json; do git hash-object "$p" | xargs -I{} echo "{} $p"; done > "$e/FROZEN_BLOBS_RAW.log"
          if [ "$(git hash-object v13/code/scripts/run33_b2_c3_counterfactual_envelopes.py)" = b1d58d7e0c3937787cf15dd801e278de25845879 ] && [ "$(git hash-object v13/code/scripts/run15_step2_disjoint_bilingual_fixtures.py)" = 635e5727a42cb1eac4f84441afda2977b0c8109c ] && [ "$(git hash-object v13/code/tests/integration_step2_utility.py)" = a7ba12a8807a1ca8236f1c70d54dedb65c212caa ] && [ "$(git hash-object v13/code/specs/models.json)" = 7af05962af41d0bc3f7dd18ef01d4eba55eabf99 ]; then echo 0 > "$e/FROZEN_EXIT.txt"; else echo 1 > "$e/FROZEN_EXIT.txt"; fi
          (cd v13/code && timeout --signal=TERM --kill-after=5s 120s env PYTHONPATH=.:tests python3 -m unittest -v tests.test_run35_c3_report_arm_binding tests.test_run34_c3_native_quote_intervention_pilot tests.test_run33_b2_c3_counterfactual_envelopes) > "$e/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$e/FOCUSED_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/run34_c3_native_quote_intervention_pilot.py v13/code/tests/test_run34_c3_native_quote_intervention_pilot.py v13/code/tests/test_run35_c3_report_arm_binding.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ]; then
            python3 -m venv "$RUNNER_TEMP/v13-run35-c3-report-review-venv"
            py="$RUNNER_TEMP/v13-run35-c3-report-review-venv/bin/python"
            "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
            first=$?
            "$py" -m pip install --disable-pip-version-check --no-input 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
            second=$?
            "$py" -m pip install --disable-pip-version-check --no-input 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
            third=$?
            if [ "$first" = 0 ] && [ "$second" = 0 ] && [ "$third" = 0 ]; then
              echo 0 > "$e/INSTALL_EXIT.txt"
              (cd v13/code && timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=.:tests "$py" -m unittest discover -s tests -p 'test_*.py' -q) > "$e/FULL_RAW.log" 2>&1
              echo "$?" > "$e/FULL_EXIT.txt"
            else
              echo 1 > "$e/INSTALL_EXIT.txt"
              echo SKIPPED_PREREQ_RED > "$e/FULL_RAW.log"
              echo SKIPPED_RED > "$e/FULL_EXIT.txt"
            fi
          else
            for n in INSTALL FULL; do echo SKIPPED_FOCUSED_RED > "$e/${n}_RAW.log"; echo SKIPPED_RED > "$e/${n}_EXIT.txt"; done
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 47a079d50170ea03c8abf6d96ac240dbc6caedea --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 47a079d50170ea03c8abf6d96ac240dbc6caedea HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - name: Preserve original raw preflight stages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run34-c3-preflight-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run35-c3-report-review/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce preflight without native gate promotion
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run35-c3-report-review"
          for n in FROZEN FOCUSED COMPILE INSTALL FULL PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; raw retained; native NOT RUN"
              tail -35 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN35_C3_REPORT_BINDING_SOFTWARE_ONLY_NO_NATIVE_EXECUTION
