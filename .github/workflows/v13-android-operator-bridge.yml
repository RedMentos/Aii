name: V13 Android Operator Bridge
on:
  push:
    branches:
      - 'core/v13-android-operator-bridge-*'
  pull_request:
    paths:
      - 'v13/code/v13/android_operator_bridge.py'
      - 'v13/code/tests/test_android_operator_bridge.py'
      - '.github/workflows/v13-android-operator-bridge.yml'
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: PYTHONPATH=v13/code python -m pytest -q v13/code/tests/test_android_operator_bridge.py
