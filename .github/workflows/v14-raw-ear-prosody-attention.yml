name: V14 RAW EAR prosody-to-attention regression

on:
  pull_request:
    branches: [gpt6/v13-private-remote-bridge-20261111, qa/v14-jepa-checkpoint-publication-20261121]
    paths:
      - "v13/code/v13/audio_voice_cues.py"
      - "v13/code/v13/audio_silero_vad.py"
      - "v13/code/tests/test_audio_silero_vad.py"
      - "v13/code/v13/audio_temporal_evidence.py"
      - "v13/code/tests/test_audio_temporal_evidence.py"
      - "v13/code/tests/test_audio_ear_voice_cues_v14.py"
      - ".github/workflows/v14-raw-ear-prosody-attention.yml"
  push:
    branches:
      - "research-perception/**"
    paths:
      - "v13/code/v13/audio_voice_cues.py"
      - "v13/code/v13/audio_silero_vad.py"
      - "v13/code/tests/test_audio_silero_vad.py"
      - "v13/code/v13/audio_temporal_evidence.py"
      - "v13/code/tests/test_audio_temporal_evidence.py"
      - "v13/code/tests/test_audio_ear_voice_cues_v14.py"
      - ".github/workflows/v14-raw-ear-prosody-attention.yml"

jobs:
  raw-ear-prosody:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Report exact Perception and dependent recovery source pins for Core
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          names = (
              "v13/code/v13/attention.py",
              "v13/code/v13/neuromod.py",
              "v13/code/v13/audio_voice_cues.py",
              "v13/code/v13/audio_speaker_evidence.py",
              "v13/code/scripts/record_only_controller_guard_20261116.py",
              "v13/code/scripts/termux_runtime_recovery_candidate_20261112.py",
              "v13/code/scripts/termux_runtime_recovery_candidate_20261121.py",
              "v13/code/scripts/stage_integrated_candidate.py",
              "v13/code/scripts/activate_termux_recovery.py",
              "v13/code/scripts/termux_runtime_recovery.sh",
              "v13/code/scripts/termux_one_command.sh",
              "v13/code/v13/runtime_deploy.py",
          )
          for name in names:
              print(f"{name} sha256={sha256(Path(name).read_bytes()).hexdigest()}")
          recovery = Path("v13/code/scripts/termux_runtime_recovery_candidate_20261112.py").read_text()
          needle = "control_guard = load(code_dir, 'scripts/record_only_controller_guard_20261116.py',"
          start = recovery.find(needle)
          if start < 0:
              raise SystemExit("recovery candidate guard pin not found")
          import re
          match = re.search(r"[0-9a-f]{64}", recovery[start:start + 300])
          if not match:
              raise SystemExit("recovery candidate guard hash not found")
          expected = match.group(0)
          actual = sha256(Path("v13/code/scripts/record_only_controller_guard_20261116.py").read_bytes()).hexdigest()
          print(f"CORE_RECOVERY_GUARD_PIN expected={expected} actual={actual} matches={expected == actual}")
          PY
      - name: Install isolated CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 psutil PyYAML pytest==9.2.0
      - name: Compile RAW EAR producer and consumer tests
        run: |
          python -m py_compile \
            v13/code/v13/audio_voice_cues.py \
            v13/code/v13/audio_silero_vad.py \
            v13/code/v13/audio_temporal_evidence.py \
            v13/code/tests/test_audio_temporal_evidence.py \
            v13/code/tests/test_audio_ear_voice_cues_v14.py \
            v13/code/tests/test_audio_silero_vad.py
      - name: Run exact RAW EAR -> A4 -> C3 regressions
        env:
          PYTHONPATH: v13/code
        run: |
          python -m pytest -q v13/code/tests/test_audio_temporal_evidence.py v13/code/tests/test_audio_ear_voice_cues_v14.py v13/code/tests/test_audio_silero_vad.py
