name: V13 coordinated source contracts
on:
  push:
    branches: ['work/v13-coordinated-runtime-20261116']
  pull_request:
    paths:
      - '.github/workflows/v13-coordinated-source-contracts.yml'
      - 'v13/code/v13/native_prompt_admission.py'
      - 'v13/code/v13/runners.py'
      - 'v13/code/scripts/context_offer_budget_candidate_20261116.py'
      - 'v13/code/tests/test_prompt_source_integrity_20261116.py'
      - 'v13/code/tests/test_context_offer_budget_20261116.py'
      - 'v13/code/tests/test_record_only_online_guard_20261116.py'
      - 'v13/code/tests/test_diagnostic_push.py'
      - 'v13/code/tests/test_public_repo_privacy_scan.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: v13/code
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Scan proposed changes for private material
        env:
          V13_REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: python scripts/public_repo_privacy_scan.py --base "$V13_REVIEW_BASE" --head HEAD --no-worktree
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest==9.2.0 numpy==2.2.6
      - name: Run source, history, ContextOS and learning-gate regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: >-
          python -m pytest -q
          tests/test_prompt_source_integrity_20261116.py
          tests/test_native_prompt_admission.py
          tests/test_native_stream_integrity.py
          tests/test_native_prompt_preflight.py
          tests/test_native_perf_gate.py
          tests/test_context_offer_budget_20261116.py
          tests/test_context_stage_composition_20261116.py
          tests/test_context_source_recall_stage_20261111.py
          tests/test_postcommit_observer_20261116.py
          tests/test_postcommit_stage_composition_20261116.py
          tests/test_latewatch.py
          tests/test_context_os.py
          tests/test_record_only_online_guard_20261116.py
          tests/test_record_only_controller_guard_20261116.py
          tests/test_runtime_deploy.py
          tests/test_runtime_deploy_integrity.py
          tests/test_runtime_deploy_integrated_20261116.py
          tests/test_arithmetic_stage_20261116.py
          tests/test_observer_fair_budget_stage_20261116.py
          tests/test_diagnostic_push.py
          tests/test_public_repo_privacy_scan.py
