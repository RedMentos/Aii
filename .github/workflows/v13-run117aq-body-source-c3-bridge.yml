name: V13 Run117AQ persisted B1 B2 source-ID to C3 exact evidence SHADOW
on:
  push:
    branches:
      - assistant/v13-run117aq-body-source-c3-bridge-20261031-gpt6
    paths:
      - .github/workflows/v13-run117aq-body-source-c3-bridge.yml
      - v13/code/v13/body_source_id_c3_evidence_bridge_candidate.py
      - v13/code/tests/test_run117aq_body_source_c3_bridge.py
permissions:
  contents: read
jobs:
  causal-source-c3:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Run real Store causal B1 B2 C3 evidence and all precursor guards
        shell: bash
        run: |
          set -uo pipefail
          e="$RUNNER_TEMP/v13-run117aq-c3"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run117aq-venv" > "$e/VENV_RAW.log" 2>&1
          venv_rc=$?
          py="$RUNNER_TEMP/v13-run117aq-venv/bin/python"
          if test "$venv_rc" -eq 0; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            deps_rc=$?
          else
            deps_rc=125;echo VENV_RED > "$e/DEPS_RAW.log"
          fi
          if test "$deps_rc" -eq 0; then
            (cd v13/code && env PYTHONPATH=. "$py" -m unittest -v \
              tests.test_run117ai_event_source_binding_candidate \
              tests.test_run117al_body_source_id_prewarm \
              tests.test_run117am_body_source_id_native \
              tests.test_run117ao_bound_prewarm \
              tests.test_run117aq_body_source_c3_bridge) > "$e/TEST_RAW.log" 2>&1
            test_rc=$?
          else
            test_rc=125;echo PREREQUISITE_RED > "$e/TEST_RAW.log"
          fi
          python3 -m compileall -q v13/code/v13/body_source_id_c3_evidence_bridge_candidate.py v13/code/tests/test_run117aq_body_source_c3_bridge.py > "$e/COMPILE_RAW.log" 2>&1
          compile_rc=$?
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 47935b6e8160db527f8e2eb5964e752981329b6b --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          privacy_rc=$?
          git diff --check 47935b6e8160db527f8e2eb5964e752981329b6b HEAD > "$e/DIFF_RAW.log" 2>&1
          diff_rc=$?
          for x in "VENV:$venv_rc" "DEPS:$deps_rc" "TEST:$test_rc" "COMPILE:$compile_rc" "PRIVACY:$privacy_rc" "DIFF:$diff_rc"; do
            echo "${x#*:}" > "$e/${x%%:*}_EXIT.txt"
          done
          "$py" - "$e" <<'PY' > "$e/RESULT_RAW.log"
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1]);names=('VENV','DEPS','TEST','COMPILE','PRIVACY','DIFF')
          r={'schema':'v13.run117aq.body_source_id_c3_software.v1',
             'head':(e/'HEAD.txt').read_text().strip(),
             'exits':{n:int((e/(n+'_EXIT.txt')).read_text()) for n in names},
             'native_model_calls':0,'c3_model_calls':0,
             'original_seed1073_body_id_pair_correct':'2_OF_6_LOW_UTILITY',
             'step2_promoted':False,'b3_promoted':False,'jepa_weight':0,
             'redmi_measured':False,'whole_system_complete':False}
          (e/'RESULT.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat "$e/RESULT_RAW.log"
          tail -n 22 "$e/TEST_RAW.log"
          for rc in "$venv_rc" "$deps_rc" "$test_rc" "$compile_rc" "$privacy_rc" "$diff_rc"; do test "$rc" -eq 0 || exit 2; done
      - name: Preserve C3 bridge software GREEN or RED raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117aq-c3-bridge-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117aq-c3/
          if-no-files-found: warn
          retention-days: 90
