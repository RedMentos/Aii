name: V13 public tracked source export for isolated local review
on:
  push:
    branches: [codex/v13-c3-stream-finalizer-20261029-auto10al]
    paths:
      - '.github/workflows/v13-public-source-export-20261029.yml'
permissions:
  contents: read
jobs:
  source-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Archive only tracked public V13 source and manifest
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-public-source"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git archive --format=tar HEAD v13/code | gzip -n -9 > "$e/v13-code-source.tar.gz"
          sha256sum "$e/v13-code-source.tar.gz" > "$e/SOURCE_ARCHIVE_SHA256.txt"
          git hash-object v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/CANON_BLOB.txt"
          test "$(cat "$e/CANON_BLOB.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 12c3c152a5a183f7dd3899761a62d964854f0a97 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          git diff --check 12c3c152a5a183f7dd3899761a62d964854f0a97 HEAD > "$e/DIFF_RAW.log" 2>&1
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Preserve source archive privately via run artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-public-source-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-public-source/
          retention-days: 30
          if-no-files-found: error
