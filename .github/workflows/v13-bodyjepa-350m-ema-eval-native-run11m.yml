name: V13 pinned 350M Body-JEPA EMA eval paired heldout NLL run11m
on:
  push:
    branches: [assistant/v13-bjepa-target-eval-350m-paired-run11m-20261030]
    paths:
      - 'v13/code/docs/BJEPA_350M_EMA_EVAL_NATIVE_TRIGGER_RUN11M.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v13-bodyjepa-350m-eval-paired-native-serial-20261030
  cancel-in-progress: false
jobs:
  native-heldout:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      V13_NO_AUTOSTART: '1'
      PYTHONNOUSERSITE: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Run preregistered source-bound real-master ablation and preserve original exits
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-bodyjepa-eval-paired-evidence"
          w="$RUNNER_TEMP/v13-bodyjepa-eval-paired-work"
          mkdir -p "$e" "$w"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/CANON_BLOB.txt"
          git hash-object v13/code/v13/body_jepa.py > "$e/BODYJEPA_BLOB.txt"
          git hash-object v13/code/v13/lora_trainer.py > "$e/LORA_BLOB.txt"
          test "$(cat "$e/CANON_BLOB.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7 &&
          test "$(cat "$e/BODYJEPA_BLOB.txt")" = b560d4e88fe457f381e89dfc5d6188a8ec3b306b &&
          test "$(cat "$e/LORA_BLOB.txt")" = 49a752879ae5d19391963742a0f042e740edb2cc
          echo "$?" > "$e/SOURCE_EXIT.txt"
          python3 -m venv "$w/venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$w/venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --no-input --disable-pip-version-check --timeout 90 --retries 2               'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu               > "$e/TORCH_RAW.log" 2>&1
            echo "$?" > "$e/TORCH_EXIT.txt"
          else echo SKIPPED > "$e/TORCH_EXIT.txt"; fi
          if [ "$(cat "$e/TORCH_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --no-input --disable-pip-version-check --timeout 90 --retries 2               'numpy==2.2.6' 'transformers==5.20.2' 'tokenizers==0.23.1'               'safetensors==0.8.0' 'peft==0.21.2' 'huggingface_hub>=1.31.0,<2.0'               > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
          else echo SKIPPED > "$e/DEPS_EXIT.txt"; echo SKIPPED > "$e/PIP_CHECK_EXIT.txt"; fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ] && [ "$(cat "$e/PIP_CHECK_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v               tests.test_bodyjepa_350m_ema_eval_paired_run11m tests.test_bodyjepa_350m_heldout_ablation_20261030 tests.test_body_jepa)               > "$e/SOFTWARE_RAW.log" 2>&1
            echo "$?" > "$e/SOFTWARE_EXIT.txt"
            "$py" -m py_compile v13/code/scripts/bodyjepa_350m_ema_eval_paired_run11m.py               > "$e/COMPILE_RAW.log" 2>&1
            echo "$?" > "$e/COMPILE_EXIT.txt"
          else echo SKIPPED > "$e/SOFTWARE_EXIT.txt"; echo SKIPPED > "$e/COMPILE_EXIT.txt"; fi
          if [ "$(cat "$e/SOURCE_EXIT.txt")" = 0 ] && [ "$(cat "$e/SOFTWARE_EXIT.txt")" = 0 ]; then
            MASTER="$w/master" "$py" - <<'PY' > "$e/DOWNLOAD_RAW.log" 2>&1
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='LiquidAI/LFM2.5-350M',
              revision='120bf032c36dd1273de754669da040dba7ad4982',
              local_dir=os.environ['MASTER'],
              allow_patterns=['*.json','*.jinja','*.safetensors','LICENSE','README.md'])
          PY
            echo "$?" > "$e/DOWNLOAD_EXIT.txt"
          else echo SKIPPED > "$e/DOWNLOAD_EXIT.txt"; fi
          if [ "$(cat "$e/DOWNLOAD_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:scripts "$py" - "$w/master" <<'PY'
          import sys
          from scripts.lp3_real_master_smoke import verify_master
          print("MASTER_SHA256", verify_master(sys.argv[1]))
          PY
            ) > "$e/MASTER_SHA_RAW.log" 2>&1
            echo "$?" > "$e/MASTER_SHA_EXIT.txt"
            if [ -f "$w/master/LICENSE" ]; then
              sha256sum "$w/master/LICENSE" > "$e/LICENSE_SHA_RAW.log"
              echo 0 > "$e/LICENSE_EXIT.txt"
            else echo 1 > "$e/LICENSE_EXIT.txt"; fi
          else echo SKIPPED > "$e/MASTER_SHA_EXIT.txt"; echo SKIPPED > "$e/LICENSE_EXIT.txt"; fi
          if [ "$(cat "$e/MASTER_SHA_EXIT.txt")" = 0 ] && [ "$(cat "$e/LICENSE_EXIT.txt")" = 0 ]; then
            (cd v13/code && HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 PYTHONPATH=.:scripts               timeout --signal=TERM --kill-after=15s 1800s "$py"               scripts/bodyjepa_350m_ema_eval_paired_run11m.py               --master "$w/master" --out "$w/cohort" --execute-native)               > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
            if [ -f "$w/cohort/report.json" ]; then
              cp "$w/cohort/report.json" "$e/REPORT.json"
            fi
          else echo SKIPPED > "$e/NATIVE_EXIT.txt"; fi
          python3 v13/code/scripts/public_repo_privacy_scan.py             --base 645c70e8c28fb9e016eaa5d068c2d3977075184d --head HEAD --no-worktree             > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 645c70e8c28fb9e016eaa5d068c2d3977075184d HEAD             > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Upload complete raw and numeric receipts but never weight files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-bodyjepa-350m-eval-paired-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-bodyjepa-eval-paired-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce complete ablation; do not require positive utility
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-bodyjepa-eval-paired-evidence"
          for stage in SOURCE VENV TORCH DEPS PIP_CHECK SOFTWARE COMPILE DOWNLOAD MASTER_SHA LICENSE NATIVE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "${stage} RED; original raw retained; no utility or age promotion"
              tail -60 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          "$RUNNER_TEMP/v13-bodyjepa-eval-paired-work/venv/bin/python" - "$e/REPORT.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['schema']=='v13.bodyjepa.350m_ema_eval_paired_nll.v1'
          assert d['completed_arms']==12 and len(d['results'])==3
          assert all(set(seed)=={'CE','EMA_TRAIN','EMA_EVAL','SHUFFLED'} for seed in d['results'].values())
          assert d['body_jepa_source_git_blob']=='b560d4e88fe457f381e89dfc5d6188a8ec3b306b'
          assert d['historical_three_seed_status']=='DIAGNOSTIC_NO_ATTRIBUTABLE_GAIN'
          assert d['fixture_sha256']=='be4925666ef6ffc2206dc450f775dee8ac7a6eb21fbc67082a0f49f1e3804e95'
          assert d['status'] in ('BOUNDED_EVAL_SIGNAL_NOT_UTILITY_GATE','DIAGNOSTIC_HURT','DIAGNOSTIC_NO_ATTRIBUTABLE_GAIN')
          assert d['utility_gate_pass'] is False
          assert d['runtime_jepa_weight']==0 and d['age_authority']==0
          assert d['production_activation'] is False and d['redmi_measured'] is False
          assert d['b1_b2_utility_proven'] is False and d['step2_utility_pass'] is False
          assert all(not arm['exported_adapter'] for seed in d['results'].values() for arm in seed.values())
          print('THREE_SEED_HELDOUT_NLL_DIAGNOSTIC_ONLY_NO_GATE_PROMOTION',d['status'])
          PY
