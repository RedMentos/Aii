name: Run211 restore crash journal integrity (software)
on:
  pull_request:
    paths:
      - 'v13/code/v13/backup.py'
      - 'v13/code/tests/test_restore_crash_journal_run211.py'
      - '.github/workflows/run211-restore-crash-journal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Isolated software prerequisites
        run: python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Actual Store recovery and backup regressions
        working-directory: v13/code
        run: |
          python -m unittest -v tests.test_restore_crash_journal_run211 tests.test_backup_restore_memory_run210 tests.test_migrations
          python -m compileall -q v13/backup.py tests/test_restore_crash_journal_run211.py
      - name: Official public repository privacy scan
        run: python v13/code/scripts/public_repo_privacy_scan.py --base 6fbfe16ff4d665fbe597a06ffa4521850965d763 --head HEAD --no-worktree
      - name: Claim boundary
        run: echo 'Synthetic crash windows with actual SQLite and Store; no native model or Redmi proof'
