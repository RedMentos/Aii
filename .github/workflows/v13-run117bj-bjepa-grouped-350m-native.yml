name: V13 Run117BJ pinned 350M grouped-vs-ungrouped Body-JEPA native

on:
  push:
    branches:
      - assistant/v13-run117bj-bjepa-grouped-350m-native-20261031-hourly11
    paths:
      - .github/workflows/v13-run117bj-bjepa-grouped-350m-native.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v13-bodyjepa-350m-eval-paired-native-serial-20261030
  cancel-in-progress: false

jobs:
  native-grouped-350m:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      V13_NO_AUTOSTART: '1'
      PYTHONNOUSERSITE: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source, install isolated pinned CPU deps, preserve raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run117bj-native"
          w="$RUNNER_TEMP/v13-run117bj-work"
          mkdir -p "$e" "$w"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          42e2a5f3200337a9a83d0d32926ea449a4017109 v13/code/scripts/bodyjepa_350m_grouped_run117bi.py
          f30d6738f85ca2148d442b9e5fa09bb032421182 v13/code/tests/test_bodyjepa_350m_grouped_run117bi.py
          577add70a5108782cedc43cf82a8f3cff72b4067 v13/code/docs/RUN117BI_BJEPA_GROUPED_350M_PREREG_20261031.md
          a09ef0b01b66d9700e9a42b4a10ac21b4ce5d895 v13/code/v13/body_jepa_grouped_contrastive_trainer_shadow.py
          823644a51acd1ea1ed2c8ed17452d0976a25778f v13/code/v13/body_jepa_grouped_source_candidate.py
          a31a18d9be0b1137a10304f24d3a241d720bd247 v13/code/v13/body_jepa_contrastive_trainer_shadow.py
          acd40aeac9e286e93b40bda72c655c17725a522e v13/code/v13/body_jepa_contrastive_shadow.py
          b560d4e88fe457f381e89dfc5d6188a8ec3b306b v13/code/v13/body_jepa.py
          49a752879ae5d19391963742a0f042e740edb2cc v13/code/v13/lora_trainer.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$bad" > "$e/SOURCE_EXIT.txt"
          python3 -m venv "$w/venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$w/venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --no-input --disable-pip-version-check --timeout 90 --retries 2 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu > "$e/TORCH_RAW.log" 2>&1
            echo "$?" > "$e/TORCH_EXIT.txt"
            "$py" -m pip install --no-input --disable-pip-version-check --timeout 90 --retries 2 'numpy==2.2.6' 'transformers==5.20.2' 'tokenizers==0.23.1' 'safetensors==0.8.0' 'peft==0.21.2' 'huggingface_hub>=1.31.0,<2.0' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
          else
            for stage in TORCH DEPS PIP_CHECK; do echo SKIPPED > "$e/${stage}_RAW.log"; echo SKIPPED > "$e/${stage}_EXIT.txt"; done
          fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/TORCH_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 7m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_bodyjepa_350m_grouped_run117bi tests.test_bodyjepa_350m_contrastive_disjoint_run12c tests.test_body_jepa_grouped_source_candidate tests.test_body_jepa_grouped_trainer_run117be) > "$e/SOFTWARE_RAW.log" 2>&1
            echo "$?" > "$e/SOFTWARE_EXIT.txt"
          else echo SKIPPED > "$e/SOFTWARE_RAW.log"; echo SKIPPED > "$e/SOFTWARE_EXIT.txt"; fi
          "$py" -m py_compile v13/code/scripts/bodyjepa_350m_grouped_run117bi.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$bad" = 0 ] && [ "$(cat "$e/SOFTWARE_EXIT.txt")" = 0 ] && [ "$(cat "$e/PIP_CHECK_EXIT.txt")" = 0 ]; then
            MASTER="$w/master" "$py" - <<'PY' > "$e/DOWNLOAD_RAW.log" 2>&1
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='LiquidAI/LFM2.5-350M',
              revision='120bf032c36dd1273de754669da040dba7ad4982',
              local_dir=os.environ['MASTER'],
              allow_patterns=['*.json','*.jinja','*.safetensors','LICENSE','README.md'])
          PY
            echo "$?" > "$e/DOWNLOAD_EXIT.txt"
          else echo SKIPPED > "$e/DOWNLOAD_RAW.log"; echo SKIPPED > "$e/DOWNLOAD_EXIT.txt"; fi
          if [ "$(cat "$e/DOWNLOAD_EXIT.txt")" = 0 ]; then
            (cd v13/code && HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 PYTHONPATH=.:scripts timeout --signal=TERM --kill-after=15s 2100s "$py" scripts/bodyjepa_350m_grouped_run117bi.py --master "$w/master" --out "$e/NATIVE_CASE" --execute-native) > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else echo SKIPPED > "$e/NATIVE_RAW.log"; echo SKIPPED > "$e/NATIVE_EXIT.txt"; fi
          if [ -f "$e/NATIVE_CASE/report.json" ]; then
            "$py" - "$e/NATIVE_CASE/report.json" <<'PY' > "$e/VERIFY_RAW.log" 2>&1
          import json,sys,math,statistics
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text())
          assert r['schema']=='v13.bodyjepa.350m_grouped_source_run117bi.v1'
          assert r['model_revision']=='120bf032c36dd1273de754669da040dba7ad4982'
          assert r['master_sha256']=='1c9c77a4471a7f590f85240f74ed1fc26df7fbde88c3006724e2f93ca993ea4e'
          assert r['license_sha256']=='4d28ca14dedc0b3d0fcc2b3339f0e79931faa33874f3d24f522183a8fc70068c'
          assert r['fixture_sha256']=='30c400a581ddea67c38b304e4b467d4fe05c039ac6cc152c860102b1b3462279'
          assert r['seeds']==[263,269] and r['arms']==['CE','UNGROUPED_EMA','GROUPED_EMA']
          assert r['source_group_count']==4 and r['repeated_view_count']==4
          assert r['source_authentication']=='SYNTHETIC_FACT_METADATA_ONLY'
          assert r['runtime_jepa_weight']==0 and r['age_authority']==0
          assert r['body_jepa_available'] is False and r['production_activation'] is False
          assert r['step2_utility_pass'] is False and r['whole_system_complete'] is False
          assert r['redmi_measured'] is False
          if r['status']=='FAILED_PRESERVED':
              assert r['failures']
              print(json.dumps({'native_status':'FAILED_PRESERVED','failures':r['failures']},sort_keys=True))
              raise SystemExit(2)
          assert r['completed_arms']==6 and not r['failures']
          assert set(r['results'])=={'263','269'}
          categories={'train':8,'paraphrase':4,'near_miss_wrong_answer':4,
                      'source_disjoint_heldout':2,'retention':4}
          deltas=[]
          for seed in ('263','269'):
              arms=r['results'][seed]
              assert set(arms)=={'CE','UNGROUPED_EMA','GROUPED_EMA'}
              for arm,item in arms.items():
                  assert item['exported_adapter'] is False
                  assert item['metrics']['steps']==8
                  assert set(item['rows'])==set(item['baseline_rows'])==set(categories)
                  for cat,n in categories.items():
                      vals=item['rows'][cat];base=item['baseline_rows'][cat]
                      assert len(vals)==len(base)==n
                      for x in vals+base:
                          assert type(x['nll']) in (int,float) and math.isfinite(x['nll']) and x['nll']>=0
                      actual=statistics.mean(x['nll'] for x in vals)
                      original=item['summary'][cat]
                      assert math.isclose(actual,original,rel_tol=0,abs_tol=1e-7)
                      baseline=statistics.mean(x['nll'] for x in base)
                      assert math.isclose(baseline,item['baseline'][cat],rel_tol=0,abs_tol=1e-7)
                  if arm=='GROUPED_EMA':
                      b=item['metrics']['grouped_source_binding']
                      assert b['source_group_count']==4 and b['repeated_view_count']==4
                      assert b['source_authentication']=='REQUIRED_EXTERNAL'
              ce=arms['CE']['summary'];u=arms['UNGROUPED_EMA']['summary'];g=arms['GROUPED_EMA']['summary']
              deltas.append({'seed':int(seed),
                  'paraphrase_grouped_minus_ungrouped':g['paraphrase']-u['paraphrase'],
                  'paraphrase_grouped_minus_ce':g['paraphrase']-ce['paraphrase'],
                  'retention_grouped_minus_ungrouped':g['retention']-u['retention'],
                  'near_miss_grouped_minus_ungrouped':g['near_miss_wrong_answer']-u['near_miss_wrong_answer'],
                  'source_disjoint_grouped_minus_ungrouped':g['source_disjoint_heldout']-u['source_disjoint_heldout']})
          means={k:statistics.mean(x[k] for x in deltas) for k in deltas[0] if k!='seed'}
          wins=sum(x['paraphrase_grouped_minus_ungrouped']<=-.02 for x in deltas)
          signal=(wins==2 and means['paraphrase_grouped_minus_ungrouped']<=-.03
              and means['paraphrase_grouped_minus_ce']<=-.03
              and means['retention_grouped_minus_ungrouped']<=.05
              and means['near_miss_grouped_minus_ungrouped']>=-.05
              and means['source_disjoint_grouped_minus_ungrouped']<=.05)
          expected=('GROUPED_MASK_EXPLORATORY_NLL_SIGNAL_NO_GATE' if signal
                    else 'GROUPED_MASK_NO_ATTRIBUTABLE_SIGNAL')
          assert r['status']==expected
          assert r['utility_gate_pass'] is False
          assert r['mean_deltas']==means and r['seed_wins']==wins
          print(json.dumps({'independent_six_arm_native_verified':True,
                            'status':r['status'],'seed_wins':wins,'means':means},sort_keys=True))
          PY
            echo "$?" > "$e/VERIFY_EXIT.txt"
          else echo SKIPPED > "$e/VERIFY_RAW.log"; echo SKIPPED > "$e/VERIFY_EXIT.txt"; fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 3dff622e518d2dbad93e54c127c0d491ef93836c --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 3dff622e518d2dbad93e54c127c0d491ef93836c HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve all original raw including failed arms
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117bj-grouped-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117bj-native/
          retention-days: 90
          if-no-files-found: error
      - name: Enforce all pins and original native gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117bj-native"
          for stage in SOURCE VENV TORCH DEPS PIP_CHECK SOFTWARE COMPILE DOWNLOAD NATIVE VERIFY PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw preserved; no gate promotion"
              tail -80 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'RUN117BJ_LINUX_350M_SYNTHETIC_NLL_ONLY_NO_JEPA_OR_STEP2_GATE'
