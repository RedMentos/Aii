name: V13 JEPA Android Goal Replay (synthetic)
on:
  push:
    branches: [jepa/android-goal-replay-retention-20261111-0930]
  pull_request:
    paths:
      - 'v13/code/v13/android_goal_replay_retention.py'
      - 'v13/code/tests/test_android_goal_replay_retention.py'
      - '.github/workflows/v13-jepa-android-goal-replay.yml'
jobs:
  synthetic-goal-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pytest
      - name: Synthetic goal-replay integration tests
        run: cd v13/code && python -m pytest -q tests/test_android_goal_replay_retention.py
