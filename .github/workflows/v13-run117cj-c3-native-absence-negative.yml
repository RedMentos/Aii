name: V13 Run117CJ real native absence negative software
on:
  push:
    branches:
      - assistant/v13-run117cj-c3-native-absence-negative-20261101-hourly11
    paths:
      - .github/workflows/v13-run117cj-c3-native-absence-negative.yml
      - v13/code/scripts/run83_jef_body_c3_interference_native.py
      - v13/code/tests/test_run83_native_driver_fake_c3.py
      - v13/code/tests/test_run117cj_c3_native_absence_gate.py
permissions:
  contents: read
jobs:
  operator-progress:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned software-only native absence negative regression
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run117cj"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          68dcb88818c7c4efb2bb3297d2d0c93c140d9362 v13/code/scripts/run83_jef_body_c3_interference_native.py
          883f5ea8a34cfd68aa46ce338cf4b68288e1d3b1 v13/code/tests/test_run83_native_driver_fake_c3.py
          a590a359df5b2baed2c622c949ed9c793e185265 v13/code/scripts/jef_body_c3_interference_fixture_839.py
          49d5d12fe511a6ecb02553ec7d0cd1d7974fa440 v13/code/tests/test_run117cj_c3_native_absence_gate.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run117cj-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run117cj-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' 'prompt-toolkit==3.0.52' 'psutil==7.0.0' 'PyYAML==6.0.2' 'Pillow==11.3.0' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo SKIPPED > "$e/DEPS_RAW.log"; echo SKIPPED > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout 300s "$py" -m unittest -v tests.test_run117cj_c3_native_absence_gate tests.test_run83_native_driver_fake_c3 tests.test_run52_b1b2_cross_turn) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED > "$e/TEST_RAW.log"; echo SKIPPED > "$e/TEST_EXIT.txt"; fi
          python3 -m py_compile v13/code/scripts/jef_body_c3_interference_fixture_839.py v13/code/scripts/run83_jef_body_c3_interference_native.py v13/code/tests/test_run83_native_driver_fake_c3.py v13/code/tests/test_run117cj_c3_native_absence_gate.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 594143dc778e4317f0b011b862a7b94232567488 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 594143dc778e4317f0b011b862a7b94232567488 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original software raw GREEN or RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117cj-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117cj/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce software-only blocked-session fairness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117cj"
          for stage in PINS VENV DEPS TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw preserved"
              tail -60 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
          echo RUN117CD_SOFTWARE_ONLY_NO_NATIVE_OR_GATE_PROMOTION
