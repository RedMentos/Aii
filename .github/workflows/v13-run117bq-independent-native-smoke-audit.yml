name: V13 Run117BQ independent known-cohort native receipt audit software
on:
  push:
    branches:
      - assistant/v13-run117bq-independent-native-smoke-audit-20261101-hourly11
    paths:
      - .github/workflows/v13-run117bq-independent-native-smoke-audit.yml
      - v13/code/scripts/run117bq_independent_budget_smoke_audit.py
      - v13/code/tests/test_run117bq_independent_budget_smoke_audit.py
permissions:
  contents: read
jobs:
  independent-stdlib-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run independent synthetic adversarial audit and close raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run117bq"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          5d711fccf8de608e442b80281b16917d1a3faaa0 v13/code/scripts/run117bq_independent_budget_smoke_audit.py
          cb56a9d39357d7f076760edaa8352ab64ae8c33f v13/code/tests/test_run117bq_independent_budget_smoke_audit.py
          5818efb35c53ffe814041de7c11e86539eeae82f v13/code/scripts/run117bp_jef_c3_budget_native_smoke.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          (cd v13/code && python3 -m unittest -v tests.test_run117bq_independent_budget_smoke_audit) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m py_compile v13/code/scripts/run117bq_independent_budget_smoke_audit.py v13/code/tests/test_run117bq_independent_budget_smoke_audit.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 753ea98a10400e3469fb4926e727742e8fe55c61 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 753ea98a10400e3469fb4926e727742e8fe55c61 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw even on RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117bq-stdlib-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117bq/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce structural software gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117bq"
          for stage in PINS TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw preserved"
              tail -50 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
          echo 'RUN117BQ_STRUCTURAL_SOFTWARE_ONLY_NO_NATIVE_ATTESTATION'
