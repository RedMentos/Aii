name: V13 Run14R AG6 holdout use-time original test-first RED
on:
  push:
    branches: [assistant/v13-run14r-ag6-holdout-revalidate-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run14r-ag6-holdout-original-red.yml'
permissions:
  contents: read
jobs:
  ag6:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin original source and preserve test-first raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run14r-ag6-original"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          49eceb86e95aa37c24cc2db88270898244e16eea v13/code/docs/AG6_HOLDOUT_REVALIDATE_PREREG_RUN14R_20261030.md
          430ee32bc9ebed960d5e12f8eacca9909f09d768 v13/code/tests/test_ag6_holdout_revalidate_run14r.py
          eab5f8440bbfe3a584ac2dfb9fedc1401ae4e7a7 v13/code/v13/agi/weights.py
          84ca3580c37a00701286d0d9b00d535ee8c3153f v13/code/v13/agi/generality.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run14r-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run14r-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
          else
            echo 99 > "$e/DEPS_EXIT.txt";echo VENV_RED > "$e/DEPS_RAW.log"
            echo 99 > "$e/PIP_CHECK_EXIT.txt";echo VENV_RED > "$e/PIP_CHECK_RAW.log"
          fi
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=. "$py" -m unittest -v \
              tests.test_ag6_holdout_revalidate_run14r \
              tests.test_ag6_staged_source_revocation_20261029) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PREREQUISITE > "$e/TEST_RAW.log";echo 99 > "$e/TEST_EXIT.txt";fi
          python3 -m py_compile v13/code/v13/agi/weights.py v13/code/tests/test_ag6_holdout_revalidate_run14r.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base b83e19e07c1a662b8b54e98cc99649f95bf48a2e --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check b83e19e07c1a662b8b54e98cc99649f95bf48a2e HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve complete original raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run14r-original-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run14r-ag6-original/
          retention-days: 30
          if-no-files-found: error
      - name: Require original stage integrity and test result
        if: always()
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run14r-ag6-original"
          for stage in PINS VENV DEPS PIP_CHECK COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            test "$(cat "$e/${stage}_EXIT.txt")" = 0
          done
          echo "ORIGINAL_TEST_EXIT=$(cat "$e/TEST_EXIT.txt")"
          test "$(cat "$e/TEST_EXIT.txt")" = 0
