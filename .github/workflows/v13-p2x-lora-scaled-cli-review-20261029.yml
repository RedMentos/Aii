name: V13 P2X LoRA scaled argv review source-only
on:
  push:
    branches:
      - codex/v13-p2x-lora-scaled-cli-review-20261029
  pull_request:
    branches:
      - assistant/v13-p2x-candidate360-standalone-20261029
permissions:
  contents: read
concurrency:
  group: v13-p2x-lora-cli-integration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      V13_NO_AUTOSTART: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Capture RED or GREEN source-only evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-p2x-lora-cli"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          for p in v13/code/v13/agi/eligibility.py v13/code/scripts/run42_b2_eligibility_source_shadow.py v13/code/scripts/run40_b2_store_history_readonly.py; do git hash-object "$p" | xargs -I{} echo "{} $p"; done > "$e/FROZEN_RAW.log"
          if [ "$(git hash-object v13/code/v13/agi/eligibility.py)" = e1f1a2d09a614378a75e397819fdce96a46de22d ] && [ "$(git hash-object v13/code/scripts/run42_b2_eligibility_source_shadow.py)" = 3b0e5e67b908fe09130555c6f78e341c88d4de78 ] && [ "$(git hash-object v13/code/scripts/run40_b2_store_history_readonly.py)" = f4befd61f22f87194c0cac070af73a1d7f559d73 ]; then echo 0 > "$e/FROZEN_EXIT.txt"; else echo 1 > "$e/FROZEN_EXIT.txt"; fi
          git show 1aa13abec66eccd2df24942479e1194e826caa5e:v13/code/scripts/p2x_candidate360_standalone.py | git hash-object --stdin > "$e/ORIGINAL_AGE_RAW.log"
          if [ "$(cat "$e/ORIGINAL_AGE_RAW.log")" = eb810d0ee137d8567ca192d00fd015741b4f66a7 ]; then echo 0 > "$e/ORIGINAL_EXIT.txt"; else echo 1 > "$e/ORIGINAL_EXIT.txt"; fi
          git hash-object v13/code/scripts/p2x_candidate360_standalone.py > "$e/AGE_SOURCE_RAW.log"
          git hash-object v13/code/tests/test_p2x_lora_scaled_cli_review.py > "$e/TEST_SOURCE_RAW.log"
          python3 -m venv "$RUNNER_TEMP/v13-p2x-lora-cli-venv"
          py="$RUNNER_TEMP/v13-p2x-lora-cli-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' > "$e/NUMPY_RAW.log" 2>&1
          echo "$?" > "$e/NUMPY_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 180s env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_p2x_lora_scaled_cli_review tests.test_p2x_candidate360_standalone tests.test_p2x_base360_native_verifier tests.test_p2x_native_receiver_eval_scorer) > "$e/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$e/FOCUSED_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/p2x_candidate360_standalone.py v13/code/tests/test_p2x_lora_scaled_cli_review.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
            first=$?
            "$py" -m pip install --disable-pip-version-check --no-input 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
            second=$?
            "$py" -m pip install --disable-pip-version-check --no-input 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
            third=$?
            if [ "$first" = 0 ] && [ "$second" = 0 ] && [ "$third" = 0 ]; then
              echo 0 > "$e/INSTALL_EXIT.txt"
              (cd v13/code && timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=.:tests "$py" -m unittest discover -s tests -p 'test_*.py' -q) > "$e/FULL_RAW.log" 2>&1
              echo "$?" > "$e/FULL_EXIT.txt"
            else
              echo 1 > "$e/INSTALL_EXIT.txt"
              echo SKIPPED_PREREQ_RED > "$e/FULL_RAW.log"
              echo SKIPPED_RED > "$e/FULL_EXIT.txt"
            fi
          else
            for n in INSTALL FULL; do echo SKIPPED_FOCUSED_RED > "$e/${n}_RAW.log"; echo SKIPPED_RED > "$e/${n}_EXIT.txt"; done
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 1aa13abec66eccd2df24942479e1194e826caa5e --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 1aa13abec66eccd2df24942479e1194e826caa5e HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - name: Preserve original RED or GREEN raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run49-world-jepa-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-p2x-lora-cli/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce source-only gates
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-p2x-lora-cli"
          for n in FROZEN ORIGINAL NUMPY FOCUSED COMPILE INSTALL FULL PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; raw retained; no native or gate promotion"
              tail -40 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo P2X_LORA_SCALED_ARGV_SOFTWARE_ONLY
