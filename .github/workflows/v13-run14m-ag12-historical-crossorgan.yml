name: V13 Run14M AG12 historical holdout cross-organ regression
on:
  push:
    branches: [assistant/v13-run14m-ag12-historical-holdout-20261030-2014]
    paths:
      - '.github/workflows/v13-run14m-ag12-historical-crossorgan.yml'
permissions:
  contents: read
jobs:
  crossorgan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run focused AG12 AG9 solver and persistence cross-organ regression
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run14m-crossorgan"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          69b172b0f8a35d4de0ee735341e8c8e2f2202b2f v13/code/docs/RUN14M_AG12_HISTORICAL_HOLDOUT_PREREG_20261030.md
          e5d33296435e01c59c301dc36e5214939a909c33 v13/code/tests/test_ag12_historical_holdout_run14m.py
          0972b10353b8b1911060992f037d0f71eaa05331 v13/code/v13/agi/generality.py
          7bed7c85357dee21cb50f8cb8b3964a564e6d9d8 v13/code/v13/agi/metacog.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=. python3 -m unittest -v \
            tests.test_ag12_historical_holdout_run14m \
            tests.test_ag12_suite_identity_run14h \
            tests.test_ag12_ag9_direct_feedback_run14i \
            tests.test_ag12_export_isolation_run14g \
            tests.test_ag12_language_isolation_run14f \
            tests.test_ag12_nonfinite_solver_run14b \
            tests.test_ag9_atomic_feedback_run14j \
            tests.test_ag9_ag12_sqlite_lifecycle_run14d \
            tests.test_ag9_read_component_run14a \
            tests.test_ag9_finite_confidence_run13y \
            tests.test_ag9_heldout_shadow_run13z \
            tests.test_growth.G12Eval \
            tests.test_agi_solver) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m compileall -q v13/code/v13/agi v13/code/tests/test_ag12_historical_holdout_run14m.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 067920aa2d3896917e9cdd07e24b5ba0be28201c --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 067920aa2d3896917e9cdd07e24b5ba0be28201c HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original cross-organ raw including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run14m-crossorgan-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run14m-crossorgan/
          retention-days: 30
          if-no-files-found: error
      - name: Require all focused stages GREEN
        if: always()
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run14m-crossorgan"
          for stage in PINS TEST COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              tail -80 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
