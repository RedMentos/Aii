name: V13 JEPA T8 cursor retention
on:
  pull_request:
    paths:
      - 'v13/code/v13/continuous_predictor.py'
      - 'v13/code/tests/test_online_predictor_cursor_retention.py'
      - '.github/workflows/v13-jepa-cursor-retention.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cursor-retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m unittest tests.test_online_predictor_cursor_retention -v
        working-directory: v13/code
