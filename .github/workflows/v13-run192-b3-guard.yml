name: V13 Run192 B3 calibration finite and paired gate

on:
  pull_request:
    paths:
      - "v13/code/scripts/run192_b3_calibration_guard_candidate.py"
      - "v13/code/tests/test_run192_b3_calibration_guard.py"
      - ".github/workflows/v13-run192-b3-guard.yml"

permissions:
  contents: read

concurrency:
  group: v13-run192-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 50
          filter: blob:none
          sparse-checkout: |
            v13/code

      - name: Isolated dependency and focused software tests
        shell: bash
        working-directory: v13/code
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.5
          .venv/bin/python -m compileall -q v13/b3calibration.py tests/test_run192_b3_calibration_guard.py
          .venv/bin/python -m unittest -v tests.test_run192_b3_calibration_guard

      - name: Official public repository privacy scan
        shell: bash
        run: |
          set -euo pipefail
          python3 v13/code/scripts/public_repo_privacy_scan.py \
            --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
