name: V13 C3 paired109 native typed-read comparison
on:
  push:
    branches:
      - 'codex/v13-c3-typedread-paired-20261030-auto11e'
    paths:
      - 'v13/code/docs/C3_TYPEDREAD_PAIRED109_LAUNCH_MARKER_AUTO11_20261030.md'
permissions:
  contents: read
concurrency:
  group: v13-step2-budget-paired-native-20261030
  cancel-in-progress: false
jobs:
  native-paired109:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Exact pinned native paired109 and closed original raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/c3-paired109-native"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          printf '%s\n' \
            '8b27c1dce8b83d7964b56405d3fdd7e8a4eb2181 v13/code/specs/c3_typedread_paired109_frozen.json' \
            'ca46e435374cf892290d8e4e7377f4c4621c6e48 v13/code/scripts/c3_typedread_paired109_native.py' \
            '6f698ef12377b2e92d7c801e80e2648ca8aea78c v13/code/scripts/listarith_de_operator_shadow.py' \
            '25cacd7388e5464dd814f4b18c545e2ec2f78b54 v13/code/v13/agi/listarith_de_shadow_pipeline.py' \
            'f9791c84846db660e9bde0e002defa55321f47b3 v13/code/v13/agi/listarith_de_shadow_v2_candidate.py' \
            '35893e9f829a591ffb9a792a73cef9bce986b3c4 v13/code/v13/agi/listarith.py' \
            'efda7aa1aa5729e974d0d641870d4da05d21c961 v13/code/v13/runners.py' \
            '7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json' \
            > "$e/EXPECTED_BLOBS.txt"
          red=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then red=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$red" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/c3-paired109-native-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/c3-paired109-native-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          if [ "$red" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout 5m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v \
              tests.test_c3_typedread_paired109_auto11 \
              tests.test_c3_operator_bounded_input_auto11 \
              tests.test_c3_operator_receipt_boundary_auto11 \
              tests.test_c3_de_operator_shadow_run11g_20261030 \
              tests.test_listarith_de_closedworld_seed101_20261030) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else
            echo SKIPPED_PINS_OR_DEPS > "$e/TEST_RAW.log"
            echo SKIPPED_RED > "$e/TEST_EXIT.txt"
          fi
          export V13_HOME="$RUNNER_TEMP/c3-paired109-installed"
          if [ "$(cat "$e/TEST_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 15m env PYTHONPATH=v13/code "$py" -m v13.bootstrap --home "$V13_HOME" > "$e/BOOTSTRAP_RAW.log" 2>&1
            echo "$?" > "$e/BOOTSTRAP_EXIT.txt"
          else
            echo SKIPPED_TEST_RED > "$e/BOOTSTRAP_RAW.log"
            echo SKIPPED_RED > "$e/BOOTSTRAP_EXIT.txt"
          fi
          if [ "$(cat "$e/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 30m env PYTHONPATH=v13/code "$py" \
              v13/code/scripts/c3_typedread_paired109_native.py \
              --home "$V13_HOME" --out "$e/PAIRED_PRIVATE_REPORT.json" > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else
            echo SKIPPED_BOOTSTRAP_RED > "$e/NATIVE_RAW.log"
            echo SKIPPED_RED > "$e/NATIVE_EXIT.txt"
          fi
          if [ -f "$e/PAIRED_PRIVATE_REPORT.json" ]; then
            "$py" - "$e/PAIRED_PRIVATE_REPORT.json" v13/code/specs/c3_typedread_paired109_frozen.json <<'PY' > "$e/AUDIT_RAW.log" 2>&1
          import hashlib, json, os, pathlib, sys
          report_path, fixture_path = map(pathlib.Path, sys.argv[1:])
          report = json.loads(report_path.read_text(encoding="utf-8"))
          fixture = json.loads(fixture_path.read_text(encoding="utf-8"))
          assert report["schema"] == "v13.c3.typedread.paired109.result.v1"
          assert report["seed"] == 109
          assert report["fixture_blob"] == "8b27c1dce8b83d7964b56405d3fdd7e8a4eb2181"
          assert report["model_sha256"] == "3d10b6ab8fc91a919534b9558e266255aca0bbc7f6d015963599aa9e74e05b1d"
          assert report["binary_sha256"] == "79e312188dc1d75c28201771f106e91de470b5cebdd838d31bb4db25eecf5d39"
          assert report["learning_mode"] == "RECORD_ONLY"
          assert report["authority"] == "SHADOW_ONLY"
          assert report["jepa_weight"] == 0
          for key in ("redmi_measured", "live_tool_execution", "external_action_authority",
                      "step2_gate_promoted", "b3_promoted", "body_jepa_available",
                      "whole_system_complete"):
              assert report[key] is False, key
          assert len(report["rows"]) == len(fixture["rows"]) == 8
          assert report["counts"]["D_exact"] == 8
          assert (os.stat(report_path).st_mode & 0o777) == 0o600
          for row, expected in zip(report["rows"], fixture["rows"]):
              assert row["id"] == expected["id"]
              assert row["source_sha256"] == hashlib.sha256(expected["text"].encode()).hexdigest()
              assert set(row["arms"]) == {"A", "B"}
              for arm in ("A", "B"):
                  item = row["arms"][arm]
                  receipt = item["receipt"]
                  assert receipt["admitted"] is True, (row["id"], arm, receipt.get("error_type"))
                  assert receipt["native_final"] is True
                  assert receipt["postclose_process_reaped"] is True
                  assert type(receipt["native_pid"]) is int and receipt["native_pid"] > 0
                  assert receipt["release"]["process_reaped"] is True
                  assert receipt["native_metrics"]["status"] == "FINAL"
                  raw = receipt["raw_output"]
                  assert item["raw_sha256"] == hashlib.sha256(raw.encode()).hexdigest()
          assert report["counts"]["native_admitted"] == 16
          print(json.dumps({"native_structural": "PASS", "counts": report["counts"]}, sort_keys=True))
          PY
            echo "$?" > "$e/AUDIT_EXIT.txt"
          else
            echo NO_NATIVE_REPORT > "$e/AUDIT_RAW.log"
            echo SKIPPED_NO_REPORT > "$e/AUDIT_EXIT.txt"
          fi
          "$py" -m py_compile v13/code/scripts/c3_typedread_paired109_native.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py \
            --base 4f7734a2b708e7faa95c4325866fb1daa54fc8c3 \
            --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 4f7734a2b708e7faa95c4325866fb1daa54fc8c3 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-c3-paired109-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/c3-paired109-native/
          retention-days: 30
          if-no-files-found: error
      - name: Preserve all native errors, no utility gate
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/c3-paired109-native"
          for stage in PINS VENV DEPS TEST BOOTSTRAP NATIVE AUDIT COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained; no promotion"
              tail -80 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
          echo "C3_PAIRED109_NATIVE_STRUCTURAL_ONLY_NO_UTILITY_STEP2_B3_JEPA_REDMI_PROMOTION"
