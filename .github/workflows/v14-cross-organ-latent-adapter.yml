name: V14 cross-organ latent adapter
on:
  push:
    branches:
      - research-perception/v14-crossdim-latent-adapter-20261122
  pull_request:
    branches:
      - gpt6/v13-private-remote-bridge-20261111
    paths:
      - "v13/code/v13/latent_adapter.py"
      - "v13/code/v13/native_latent_receiver.py"
      - "v13/code/tests/test_latent_adapter.py"
      - "v13/code/tests/test_native_latent_receiver.py"
      - ".github/workflows/v14-cross-organ-latent-adapter.yml"
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused test dependencies
        run: python -m pip install pytest==9.2.0 numpy==2.3.5
      - name: Compile adapter and native receiver contract
        run: python -m py_compile v13/code/v13/latent_adapter.py v13/code/v13/native_latent_receiver.py v13/code/tests/test_latent_adapter.py v13/code/tests/test_native_latent_receiver.py
      - name: Run adapter and receiver regressions
        env:
          PYTHONPATH: v13/code
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q v13/code/tests/test_latent_adapter.py v13/code/tests/test_native_latent_receiver.py
      - name: Scan public diff for private data and secrets
        run: python v13/code/scripts/public_repo_privacy_scan.py --base origin/gpt6/v13-private-remote-bridge-20261111 --head HEAD --no-worktree
