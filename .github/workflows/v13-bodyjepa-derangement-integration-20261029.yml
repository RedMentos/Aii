name: V13 Body-JEPA bounded derangement existing torch PEFT integration
on:
  push:
    branches: [codex/v13-bodyjepa-bounded-derangement-20261029-auto10ao]
    paths:
      - '.github/workflows/v13-bodyjepa-derangement-integration-20261029.yml'
      - 'v13/code/docs/proofs/continuation-20261029/BODYJEPA_DERANGEMENT_INTEGRATION_PREREG_20261029.md'
permissions:
  contents: read
jobs:
  bj1-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Existing BJ1 regression with pinned isolated HF PEFT dependencies
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-bj-integration"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/v13/body_jepa.py v13/code/tests/test_body_jepa.py v13/code/tests/test_body_jepa_checkpoint_fit.py v13/code/tests/test_bodyjepa_derangement_bound_20261029.py v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/SOURCE_BLOBS.txt"
          test "$(tail -1 "$e/SOURCE_BLOBS.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          echo "$?" > "$e/CANON_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-bj-integration-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-bj-integration-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input -q --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu' > "$e/TORCH_RAW.log" 2>&1
            echo "$?" > "$e/TORCH_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input -q 'transformers==4.44.2' 'peft==0.13.2' > "$e/HF_RAW.log" 2>&1
            echo "$?" > "$e/HF_EXIT.txt"
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
            "$py" -c 'import torch,transformers,peft; assert (torch.__version__,transformers.__version__,peft.__version__)==("2.5.1+cpu","4.44.2","0.13.2"); print(torch.__version__,transformers.__version__,peft.__version__)' > "$e/IMPORT_RAW.log" 2>&1
            echo "$?" > "$e/IMPORT_EXIT.txt"
          else
            for stage in DEPS TORCH HF PIP_CHECK IMPORT; do echo SKIPPED > "$e/${stage}_EXIT.txt"; echo SKIPPED > "$e/${stage}_RAW.log"; done
          fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ] && [ "$(cat "$e/TORCH_EXIT.txt")" = 0 ] && [ "$(cat "$e/HF_EXIT.txt")" = 0 ] && [ "$(cat "$e/IMPORT_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_bodyjepa_derangement_bound_20261029 tests.test_body_jepa tests.test_body_jepa_checkpoint_fit tests.test_body_jepa_checkpoint) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else echo SKIPPED > "$e/FOCUSED_EXIT.txt"; echo SKIPPED > "$e/FOCUSED_RAW.log"; fi
          "$py" -m py_compile v13/code/v13/body_jepa.py v13/code/tests/test_bodyjepa_derangement_bound_20261029.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base e5e054c7059181952ff2919789c2652e7ce97c45 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check e5e054c7059181952ff2919789c2652e7ce97c45 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-bj-integration-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-bj-integration/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce BJ1 regression no waivers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-bj-integration"
          for stage in CANON VENV DEPS TORCH HF PIP_CHECK IMPORT FOCUSED COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; raw retained"
              tail -60 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'BODYJEPA_BOUNDED_DERANGEMENT_EXISTING_SOFTWARE_PASS_ONLY'
