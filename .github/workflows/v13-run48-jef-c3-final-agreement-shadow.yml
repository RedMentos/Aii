name: V13 Run48 seed419 JEF C3 final agreement real SQLite SHADOW
on:
  push:
    branches: [assistant/v13-run48-jef-c3-final-agreement-shadow-20261031-hourly11]
    paths: ['.github/workflows/v13-run48-jef-c3-final-agreement-shadow.yml']
permissions:
  contents: read
jobs:
  realstore-final-agreement:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen pins, disjoint real SQLite event/SourceRef agreement and revocation races
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run48-final"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          117970493762868ef410bfc64fb8a80ddea1a7e1 v13/code/docs/fixtures/run48_jef_c3_final_agreement_seed419.json
          55493684910bbc099b6918364284325dd2e2b8fa v13/code/docs/RUN48_JEF_C3_FINAL_AGREEMENT_PREREG_20261031.md
          a7352d3b577b17db92d2fc31650bfcd914b53e02 v13/code/v13/agi/jef_c3_final_agreement_shadow_run48.py
          7ce5709ab5ea60ffe35da3df4526b7c51bdcb717 v13/code/tests/test_run48_jef_c3_final_agreement_shadow.py
          d1186642d5f4b7ef4af0699f07a2fe682b1484e2 v13/code/v13/agi/jef_eligibility_source_shadow_run46b.py
          e1f1a2d09a614378a75e397819fdce96a46de22d v13/code/v13/agi/eligibility.py
          0779d986fb8aee8aa01c5df5f656889d4bd56348 v13/code/v13/store.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          sha256sum v13/code/docs/fixtures/run48_jef_c3_final_agreement_seed419.json > "$e/FIXTURE_RAW.log" 2>&1
          test "$(cut -d' ' -f1 "$e/FIXTURE_RAW.log")" = c29b6ffb92bb97965b45d46d09de5bc3817e5ab16e22598dd1c682daf1e4c1d5
          echo "$?" > "$e/FIXTURE_EXIT.txt"
          if [ "$bad" = 0 ] && [ "$(cat "$e/FIXTURE_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:tests:scripts python3 -m unittest -v tests.test_run48_jef_c3_final_agreement_shadow tests.test_run46b_jef_source_eligibility_shadow) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PINS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          python3 -m py_compile v13/code/v13/agi/jef_c3_final_agreement_shadow_run48.py v13/code/tests/test_run48_jef_c3_final_agreement_shadow.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base f4b177b4d0df940bc047fb69efd08c641e6df6a6 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check f4b177b4d0df940bc047fb69efd08c641e6df6a6 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve all original raw even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run48-final-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run48-final/
          retention-days: 90
          if-no-files-found: error
      - name: Require all six stages zero
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run48-final"
          for s in PINS FIXTURE TEST COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN48_REAL_SQLITE_FINAL_AGREEMENT_SHADOW_ONLY_NO_LIVE_OR_AGE_PROMOTION
