name: V13 C5 Android goal + C3 speech + JEPA E2E
on:
  push:
    branches:
      - boss/v13-c3-speech-android-goal-20261111-1145
      - boss/v13-fix-integrated-c5-c3-replay-20261111-1245
  pull_request:
    paths:
      - 'v13/code/v13/android_c5_goal_replay.py'
      - 'v13/code/v13/speech_intent.py'
      - 'v13/code/tests/test_c5_goal_c3_speech_e2e.py'
      - '.github/workflows/v13-boss-c5-c3-speech-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c5-c3-speech:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: v13/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy==1.26.4
      - run: python -m py_compile v13/speech_intent.py v13/android_c5_goal_replay.py
      - run: python -m pytest -q tests/test_speech_intent.py tests/test_c5_goal_c3_speech_e2e.py tests/test_android_c5_goal_replay.py tests/test_android_goal_replay_retention.py tests/test_behavior_governor.py
