name: V13 C3 LoRA checkpoint resume integrity
on:
  push:
    branches:
      - 'codex/v13-c3-lora-resume-integrity-*'
  pull_request:
    paths:
      - 'v13/code/v13/lora_trainer.py'
      - 'v13/code/tests/test_lora_resume_safety.py'
      - '.github/workflows/v13-c3-lora-resume-integrity.yml'
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m py_compile v13/code/v13/lora_trainer.py v13/code/tests/test_lora_resume_safety.py
      - working-directory: v13/code
        run: python -m pytest -q tests/test_lora_resume_safety.py
