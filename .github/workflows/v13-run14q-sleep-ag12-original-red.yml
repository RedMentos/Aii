name: V13 Run14Q Sleep AG12 holdout original test-first RED
on:
  push:
    branches: [assistant/v13-run14q-sleep-ag12-holdout-stage-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run14q-sleep-ag12-original-red.yml'
permissions:
  contents: read
jobs:
  sleep-ag12:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve original source and test-first raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run14q-sleep-ag12-original"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          1dda3f4adf8987f95be5a3c1358286254d3bf27b v13/code/docs/SLEEP_AG12_HOLDOUT_STAGE_PREREG_RUN14Q_20261030.md
          13e46360bc4ea9583f16c2678bd1ee276149b2e0 v13/code/tests/test_sleep_ag12_holdout_run14q.py
          43831251af47dbdd718fa9ee3289955fc7f84a87 v13/code/v13/agi/generality.py
          e51766478fee915824853da7c8e73785b12e91b3 v13/code/v13/sleep_offline.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 6m env PYTHONPATH=. python3 -m unittest -v tests.test_sleep_ag12_holdout_run14q tests.test_sleep_offline tests.test_ag12_crosslanguage_holdout_run14p) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m py_compile v13/code/v13/agi/generality.py v13/code/v13/sleep_offline.py v13/code/tests/test_sleep_ag12_holdout_run14q.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 49e7eb3edbee83a7717a4d4356df086406a2a817 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 49e7eb3edbee83a7717a4d4356df086406a2a817 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve complete raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run14q-original-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run14q-sleep-ag12-original/
          retention-days: 30
          if-no-files-found: error
      - name: Require original stage integrity and test result
        if: always()
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run14q-sleep-ag12-original"
          for stage in PINS COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            test "$(cat "$e/${stage}_EXIT.txt")" = 0
          done
          echo "ORIGINAL_TEST_EXIT=$(cat "$e/TEST_EXIT.txt")"
          test "$(cat "$e/TEST_EXIT.txt")" = 0
