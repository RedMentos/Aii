name: V13 Run13J seed227 C3 JEF 12-call serialized native pilot
on:
  push:
    branches: [assistant/v13-run13j-c3-jef-native-fidelity-20261030-auto11]
    paths:
      - '.github/workflows/v13-run13j-c3-jef-native-20261030.yml'
permissions:
  contents: read
concurrency:
  group: v13-step2-budget-paired-native-20261030
  cancel-in-progress: false
jobs:
  c3-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned seed227 sources, isolated native C3 12 calls and independent replay
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run13j-c3-native"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          de5cf4541bb45e2764ea424747dacd08e6f212e0 v13/code/scripts/run13j_c3_jef_native.py
          f27822fbd78e2ae37038df96f5a31ebb04ee11e1 v13/code/scripts/run13j_c3_jef_native_verify.py
          802470f7e09f91bae1aec92c5be180a483d935fb v13/code/tests/test_run13j_c3_jef_native_preflight.py
          c3a13c39593b43296f46235fc591caa612b5b3e7 v13/code/tests/test_run13j_c3_jef_native_verify.py
          3820924ada9c45178529aafba4052819da766623 v13/code/docs/fixtures/run13j_c3_jef_native_seed227_20261030.json
          e39f5f293c7fe1c5cfb99ee8bc04ad56b9e99915 v13/code/docs/RUN13J_C3_JEF_NATIVE_PREREG_20261030.md
          887aad1a55faf4b263b49c992a9e61372fce3948 v13/code/v13/agi/jef_c3_shadow_prompt_run13i.py
          6ed4b14d0067714281a7b9d22f87e0c9a7d57519 v13/code/v13/agi/context_source_link_budget_run13e.py
          a5ea76be96f2924f28c3184ff71da902062fb6ae v13/code/v13/agi/budget_answer_shadow_run13b.py
          d274a66b8ceb801c741bbffe1456611b43603208 v13/code/scripts/c2_body_disjoint_paired181_run11v.py
          7324f5c8c09d5e5706c40887f755285dcdcbb9a8 v13/code/scripts/c2_body_run12n_fulltask_readonly.py
          22ed11e4a53d9eeae8fbc74a1753082b5785be2b v13/code/v13/runtime.py
          efda7aa1aa5729e974d0d641870d4da05d21c961 v13/code/v13/runners.py
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run13j-native-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run13j-native-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_run13j_c3_jef_native_preflight tests.test_run13j_c3_jef_native_verify tests.test_jef_c3_shadow_prompt_run13i) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PINS_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          export V13_HOME="$RUNNER_TEMP/v13-run13j-installed"
          if [ "$(cat "$e/TEST_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 15m env PYTHONPATH=v13/code "$py" -m v13.bootstrap --home "$V13_HOME" > "$e/BOOTSTRAP_RAW.log" 2>&1
            echo "$?" > "$e/BOOTSTRAP_EXIT.txt"
          else echo SKIPPED_TEST_RED > "$e/BOOTSTRAP_RAW.log"; echo 99 > "$e/BOOTSTRAP_EXIT.txt"; fi
          if [ "$(cat "$e/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 35m env PYTHONPATH=v13/code "$py" v13/code/scripts/run13j_c3_jef_native.py --home "$V13_HOME" --out "$e/pilot" --fixture v13/code/docs/fixtures/run13j_c3_jef_native_seed227_20261030.json > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else echo SKIPPED_BOOTSTRAP_RED > "$e/NATIVE_RAW.log"; echo 99 > "$e/NATIVE_EXIT.txt"; fi
          if [ -f "$e/pilot/report.json" ]; then
            timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=v13/code "$py" v13/code/scripts/run13j_c3_jef_native_verify.py --pilot "$e/pilot" --fixture v13/code/docs/fixtures/run13j_c3_jef_native_seed227_20261030.json > "$e/REPORT_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          else echo NO_NATIVE_REPORT > "$e/REPORT_CHECK_RAW.log"; echo 99 > "$e/REPORT_CHECK_EXIT.txt"; fi
          "$py" -m py_compile v13/code/scripts/run13j_c3_jef_native.py v13/code/scripts/run13j_c3_jef_native_verify.py v13/code/tests/test_run13j_c3_jef_native_preflight.py v13/code/tests/test_run13j_c3_jef_native_verify.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base edb156ea91ad0a3a4052491423e43361eea89902 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check edb156ea91ad0a3a4052491423e43361eea89902 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original native and failure raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run13j-c3-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run13j-c3-native/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce actual native structural execution and independent replay only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run13j-c3-native"
          for stage in PINS VENV DEPS TEST BOOTSTRAP NATIVE REPORT_CHECK COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained; no STEP2 or native utility gate"
              tail -80 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'RUN13J_LINUX_NATIVE_C3_STRUCTURAL_ONLY_NO_STEP2_B3_JEPA_REDMI_OR_WHOLE_SYSTEM_GATE'
