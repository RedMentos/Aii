name: V13 audited validated Android operator integration
on:
  push:
    branches:
      - boss/v13-audited-operator-validation-integration-20261112-0245
  pull_request:
    paths:
      - 'v13/code/v13/android_operator_bridge.py'
      - 'v13/code/v13/android_operator_audited_session.py'
      - 'v13/code/tests/test_android_operator_audited_session.py'
      - '.github/workflows/v13-boss-validated-audited-operator.yml'
jobs:
  synthetic-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Syntax and full operator/audit regression
        run: |
          python -m compileall -q v13/code/v13/android_operator_bridge.py v13/code/v13/android_operator_audited_session.py
          PYTHONPATH=v13/code python -m pytest -q v13/code/tests/test_android_operator_validation.py v13/code/tests/test_android_operator_bridge.py v13/code/tests/test_android_operator_audited_session.py v13/code/tests/test_android_action_audit.py
