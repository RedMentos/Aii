name: V13 Z12c control confidence regression
on:
  push:
    branches:
      - codex/automation11-z12c-control-confidence-20261027
    paths:
      - '.github/workflows/z12c-control-confidence.yml'
      - 'v13/code/scripts/z12c_slot_world_jepa.py'
      - 'v13/code/tests/test_z12c_control_calibration.py'
      - 'v13/code/docs/proofs/continuation-20261027/z12c-control-confidence-regression/**'
permissions:
  contents: read
concurrency:
  group: v13-z12c-control-confidence
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.sha }}
      - name: Install isolated dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/z12cctrl"
          timeout 240s "$RUNNER_TEMP/z12cctrl/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Preserve original raw outputs
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/z12cctrlproof"
          git rev-parse HEAD > "$RUNNER_TEMP/z12cctrlproof/HEAD.txt"
          sha256sum v13/code/scripts/z12c_slot_world_jepa.py v13/code/tests/test_z12c_control_calibration.py v13/code/v13/world_jepa_slots.py > "$RUNNER_TEMP/z12cctrlproof/SHA256.txt"
          (cd v13/code && PYTHONPATH="$PWD:$PWD/scripts" "$RUNNER_TEMP/z12cctrl/bin/python" -m unittest -v tests.test_z12c_control_calibration tests.test_world_jepa_slots_calibration_guard tests.test_world_jepa_slots_checkpoint tests.test_world_jepa_slots tests.test_world_jepa) > "$RUNNER_TEMP/z12cctrlproof/UNIT_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/z12cctrlproof/UNIT_EXIT.txt"
          "$RUNNER_TEMP/z12cctrl/bin/python" -m compileall -q v13/code/scripts/z12c_slot_world_jepa.py v13/code/tests/test_z12c_control_calibration.py > "$RUNNER_TEMP/z12cctrlproof/COMPILE_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/z12cctrlproof/COMPILE_EXIT.txt"
          "$RUNNER_TEMP/z12cctrl/bin/python" v13/code/scripts/public_repo_privacy_scan.py --base 293ccf7dd8b24a9dd25e0ceffac1792e8e14cc53 --head HEAD > "$RUNNER_TEMP/z12cctrlproof/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/z12cctrlproof/PRIVACY_EXIT.txt"
          exit 0
      - name: Upload original raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: z12c-control-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/z12cctrlproof/
          if-no-files-found: error
      - name: Enforce
        run: |
          set -euo pipefail
          for n in UNIT COMPILE PRIVACY; do
            test "$(cat "$RUNNER_TEMP/z12cctrlproof/${n}_EXIT.txt")" = 0 || { cat "$RUNNER_TEMP/z12cctrlproof/${n}_RAW.log"; exit 1; }
          done
          tail -18 "$RUNNER_TEMP/z12cctrlproof/UNIT_RAW.log"
