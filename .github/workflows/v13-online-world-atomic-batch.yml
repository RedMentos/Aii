name: V13 OnlineWorld Atomic Batch
on:
  push:
    branches:
      - 'jepa/atomic-online-world-validation-*'
      - 'jepa/online-world-prevalidate-range-*'
  pull_request:
    paths:
      - 'v13/code/v13/online_world.py'
      - 'v13/code/v13/continuous_predictor.py'
      - 'v13/code/tests/test_online_world_atomic_batch.py'
      - '.github/workflows/v13-online-world-atomic-batch.yml'
jobs:
  atomic-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal numeric dependency
        run: python -m pip install numpy
      - name: Compile and run atomic checkpoint tests
        working-directory: v13/code
        run: |
          python -m compileall -q v13/online_world.py v13/continuous_predictor.py tests/test_online_world_atomic_batch.py
          python -m unittest discover -s tests -p 'test_online_world_atomic_batch.py' -v
