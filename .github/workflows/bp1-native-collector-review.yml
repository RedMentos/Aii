name: V13 BP1 serial C3 native collector software-only review
on:
  push:
    branches: [codex/gpt6-bp1-native-collector-20261027-0910]
    paths:
      - '.github/workflows/bp1-native-collector-review.yml'
      - 'v13/code/scripts/bp1_native_collect.py'
      - 'v13/code/tests/test_bp1_native_collect.py'
      - 'v13/code/docs/proofs/continuation-20261027/bp1-native-collector/**'
permissions:
  contents: read
concurrency:
  group: v13-bp1-native-collector-software
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Mocked-server software tests, compile and privacy
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/bp1-collector-proof"
          git rev-parse HEAD > "$RUNNER_TEMP/bp1-collector-proof/HEAD.txt"
          sha256sum v13/code/scripts/bp1_native_collect.py v13/code/tests/test_bp1_native_collect.py > "$RUNNER_TEMP/bp1-collector-proof/SOURCE_SHA256.txt"
          (cd v13/code && PYTHONPATH="$PWD:$PWD/scripts" python3 -m unittest -v tests.test_bp1_paired_score tests.test_bp1_native_collect) > "$RUNNER_TEMP/bp1-collector-proof/UNIT_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp1-collector-proof/UNIT_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/bp1_native_collect.py v13/code/scripts/bp1_paired_score.py v13/code/tests/test_bp1_native_collect.py v13/code/tests/test_bp1_paired_score.py > "$RUNNER_TEMP/bp1-collector-proof/COMPILE_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp1-collector-proof/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 65e14c6b15a3cf992834b25daca851ee62d72d61 --head HEAD > "$RUNNER_TEMP/bp1-collector-proof/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp1-collector-proof/PRIVACY_EXIT.txt"
          exit 0
      - name: Preserve original evidence including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bp1-native-collector-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/bp1-collector-proof/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce software gates only
        run: |
          set -euo pipefail
          for n in UNIT COMPILE PRIVACY; do
            test "$(cat "$RUNNER_TEMP/bp1-collector-proof/${n}_EXIT.txt")" = 0 || { echo "$n failed"; tail -90 "$RUNNER_TEMP/bp1-collector-proof/${n}_RAW.log"; exit 1; }
          done
          echo "MOCKED_SERVER_ONLY; NO_NATIVE_C3_TRAINING_OR_INFERENCE"
