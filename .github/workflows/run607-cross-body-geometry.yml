name: V13 Run613 frozen posthoc B1/B2 lexical fusion independent raw audit
on:
  push:
    branches:
      - codex/automation11-run613-cross-body-fusion-20261026
    paths:
      - '.github/workflows/run613-cross-body-fusion.yml'
      - 'v13/code/scripts/run613_cross_body_fusion_offline.py'
      - 'v13/code/tests/test_run613_cross_body_fusion_offline.py'
      - 'v13/code/docs/proofs/continuation-20261026/run613-cross-body-fusion/**'
permissions:
  contents: read
  actions: read
jobs:
  offline-fusion:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.sha }}
      - name: Frozen source and original canonical authority
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/RUN613_HEAD.txt"
          test "$(git hash-object v13/code/docs/proofs/continuation-20261026/run608-cross-body-paraphrase/RUN608_COHORT.json)" = f452bdf80bb8d8a784c1909c98e310041d3157aa
          test "$(sha256sum v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md | cut -d' ' -f1)" = 3423906b01b24443fcef733fb5c7ef47296963df63e603d8f843c99d544877ee
          sha256sum v13/code/scripts/run613_cross_body_fusion_offline.py v13/code/tests/test_run613_cross_body_fusion_offline.py v13/code/docs/proofs/continuation-20261026/run613-cross-body-fusion/PREREG.md > "$RUNNER_TEMP/RUN613_SOURCE_SHA256.txt"
          { date -u -Iseconds; python3 --version; uname -a; } > "$RUNNER_TEMP/RUN613_HOST.txt"
      - name: Isolated pinned numpy
        run: |
          python3 -m venv "$RUNNER_TEMP/run613venv"
          "$RUNNER_TEMP/run613venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Source-only adversarial fixtures
        id: fixture
        working-directory: v13/code
        run: |
          set +e
          PYTHONPATH="$PWD:$PWD/scripts" "$RUNNER_TEMP/run613venv/bin/python" -m unittest -v tests.test_run613_cross_body_geometry > "$RUNNER_TEMP/RUN613_FIXTURE_RAW.log" 2>&1
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/RUN613_FIXTURE_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Download original SHA-closed Run608 artifact without native inference
        id: download
        if: ${{ steps.fixture.outputs.rc == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          curl -fsSL --retry 0 --max-time 180 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/RedMentos/Aii/actions/artifacts/12688049715/zip" -o "$RUNNER_TEMP/RUN608_ORIGINAL.zip" > "$RUNNER_TEMP/RUN613_DOWNLOAD_RAW.log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "9cae2ac55a9ac773f3d3c2433d7ad485f479d8dc7b79f32e7555014f0eaad732  $RUNNER_TEMP/RUN608_ORIGINAL.zip" | sha256sum -c - >> "$RUNNER_TEMP/RUN613_DOWNLOAD_RAW.log" 2>&1
            rc=$?
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN613_DOWNLOAD_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Frozen offline B1/B2/lexical fusion with 200 shuffled train controls
        id: audit
        if: ${{ steps.download.outputs.rc == '0' }}
        working-directory: v13/code
        run: |
          set +e
          PYTHONPATH="$PWD:$PWD/scripts" timeout -s TERM -k 10s 180s "$RUNNER_TEMP/run613venv/bin/python" scripts/run613_cross_body_fusion_offline.py --original-zip "$RUNNER_TEMP/RUN608_ORIGINAL.zip" --output "$RUNNER_TEMP/RUN613_REPORT.json" > "$RUNNER_TEMP/RUN613_AUDIT_RAW.log" 2>&1
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/RUN613_AUDIT_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Public privacy scan
        id: privacy
        run: |
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 7682123d4a206330331cf8b65d7457003913771e --head "$GITHUB_SHA" > "$RUNNER_TEMP/RUN613_PRIVACY_RAW.log" 2>&1
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/RUN613_PRIVACY_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Close all original raw, hashes and report even on RED
        if: always()
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP"
          for key in FIXTURE DOWNLOAD AUDIT PRIVACY; do
            test -f "RUN613_${key}_EXIT.txt" || echo 2 > "RUN613_${key}_EXIT.txt"
          done
          find . -maxdepth 1 -type f -name 'RUN613_*' ! -name 'RUN613_SHA256SUMS.txt' -print0 | sort -z | xargs -0 -r sha256sum > RUN613_SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: V13-Run613-Fixed-Fusion-${{ github.sha }}
          path: |
            ${{ runner.temp }}/RUN613_*
          if-no-files-found: error
          retention-days: 30
      - name: Enforce independent audit and privacy exits
        if: always()
        run: |
          set -euo pipefail
          for key in FIXTURE DOWNLOAD AUDIT PRIVACY; do
            echo "RUN613 $key exit: $(cat "$RUNNER_TEMP/RUN613_${key}_EXIT.txt")"
            test "$(cat "$RUNNER_TEMP/RUN613_${key}_EXIT.txt")" = 0
          done
