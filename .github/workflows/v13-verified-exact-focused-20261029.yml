name: V13 verified exact F1F5 focused software regression
on:
  push:
    branches:
      - codex/v13-verified-exact-budget-20261029-auto10ad
    paths:
      - .github/workflows/v13-verified-exact-focused-20261029.yml
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 50
      - name: Run exact-source focused software suite, preserve raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-verified-exact-focused"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/v13/operator.py v13/code/scripts/ask_verified_budget.py v13/code/tests/test_verified_exact_budget_20261029.py > "$e/SOURCE_BLOBS.txt"
          python3 -m venv "$RUNNER_TEMP/v13venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input numpy==2.2.6 psutil PyYAML Pillow prompt-toolkit==3.0.52 > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v test_verified_exact_budget_20261029 test_ask_verified_budget test_source_consumer_recall_integration test_source_consumer_data_boundary test_source_consumer_live_render_revalidation test_source_consumer_render_seal test_worldmodel_operator_20261029 test_worldmodel_realstore_integration_20261029 test_world_model test_worldmodel_inverse_heldout_baseline_20261029) > "$e/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$e/FOCUSED_EXIT.txt"
          "$py" -m compileall -q v13/code/v13/operator.py v13/code/scripts/ask_verified_budget.py v13/code/tests/test_verified_exact_budget_20261029.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 0cbf94d8d3a53f70044f4905fbf7a18970d91390 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 0cbf94d8d3a53f70044f4905fbf7a18970d91390 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve closed raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-verified-exact-focused-${{ github.sha }}
          path: ${{ runner.temp }}/v13-verified-exact-focused/
          if-no-files-found: error
      - name: Enforce all focused stages
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-verified-exact-focused"
          for n in VENV DEPS FOCUSED COMPILE PRIVACY DIFF; do
            test "$(cat "$e/${n}_EXIT.txt")" = 0 || { echo "$n failed; raw retained"; exit 1; }
          done
