name: V13 Run14M artifact-bound unfiltered full-suite regression
on:
  push:
    branches: [assistant/v13-run14m-ag12-historical-holdout-20261030-2014]
    paths:
      - '.github/workflows/v13-run14m-fullsuite-unfiltered.yml'
permissions:
  contents: read
  actions: read
jobs:
  unfiltered:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install isolated pinned dependencies and record unfiltered original raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run14m-fullsuite"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          0972b10353b8b1911060992f037d0f71eaa05331 v13/code/v13/agi/generality.py
          e5d33296435e01c59c301dc36e5214939a909c33 v13/code/tests/test_ag12_historical_holdout_run14m.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run14m-fullsuite-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run14m-fullsuite-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input -q --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu' > "$e/TORCH_RAW.log" 2>&1
            echo "$?" > "$e/TORCH_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input -q 'transformers==4.44.2' > "$e/TRANSFORMERS_RAW.log" 2>&1
            echo "$?" > "$e/TRANSFORMERS_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input -q 'peft==0.13.2' > "$e/PEFT_RAW.log" 2>&1
            echo "$?" > "$e/PEFT_EXIT.txt"
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
          else
            for stage in DEPS TORCH TRANSFORMERS PEFT PIP_CHECK; do
              echo 99 > "$e/${stage}_EXIT.txt"; echo VENV_RED > "$e/${stage}_RAW.log"
            done
          fi
          # Run13X is an artifact-bound test, not a unit test with a synthetic replacement.
          # Retrieve the exact original Run13T native ZIP privately into RUNNER_TEMP,
          # verify the preregistered original SHA, and never upload the ZIP itself.
          orig="$RUNNER_TEMP/v13-run13t-original-native.zip"
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ]; then
            curl --fail --silent --show-error --location --retry 2 --max-time 120 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/RedMentos/Aii/actions/artifacts/12996917793/zip" \
              --output "$orig" > "$e/ARTIFACT_RAW.log" 2>&1
            rc="$?"
            got="$(sha256sum "$orig" 2>/dev/null | cut -d' ' -f1)"
            echo "original_sha256=$got expected=86f728599312518bfa67efa0ae16e66be0eaec9ccfd8c3da8710fba40192717c" >> "$e/ARTIFACT_RAW.log"
            if [ "$rc" = 0 ] && [ "$got" = "86f728599312518bfa67efa0ae16e66be0eaec9ccfd8c3da8710fba40192717c" ]; then echo 0 > "$e/ARTIFACT_EXIT.txt"; else echo 1 > "$e/ARTIFACT_EXIT.txt"; fi
          else echo PIN_RED > "$e/ARTIFACT_RAW.log"; echo 99 > "$e/ARTIFACT_EXIT.txt"; fi
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/ARTIFACT_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ] && [ "$(cat "$e/TORCH_EXIT.txt")" = 0 ] && [ "$(cat "$e/TRANSFORMERS_EXIT.txt")" = 0 ] && [ "$(cat "$e/PEFT_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=10s 20m env RUN13X_ORIGINAL_ZIP="$orig" PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests -p 'test_*.py') > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else echo SKIPPED_DEPS_RED > "$e/FULL_RAW.log"; echo 99 > "$e/FULL_EXIT.txt"; fi
          "$py" -m compileall -q v13/code/v13 v13/code/scripts > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 067920aa2d3896917e9cdd07e24b5ba0be28201c --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 067920aa2d3896917e9cdd07e24b5ba0be28201c HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Preserve complete unfiltered raw including historical RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run14m-fullsuite-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run14m-fullsuite/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce setup integrity; do not waive unfiltered FULL exit
        if: always()
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run14m-fullsuite"
          for stage in PINS VENV DEPS TORCH TRANSFORMERS PEFT PIP_CHECK ARTIFACT COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            test "$(cat "$e/${stage}_EXIT.txt")" = 0
          done
          echo "UNFILTERED_FULL_EXIT=$(cat "$e/FULL_EXIT.txt")"
          test "$(cat "$e/FULL_EXIT.txt")" = 0 || test "$(cat "$e/FULL_EXIT.txt")" = 1
          echo 'FULL_SUITE_STATUS_IS_RAW_NOT_PROMOTED; ORIGINAL_FAILURE_IDENTITIES_REQUIRE_INDEPENDENT_COMPARISON'
