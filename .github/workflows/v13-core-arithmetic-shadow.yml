name: V13 core arithmetic shadow integrity
on:
  push:
    branches:
      - gpt6/core-arithmetic-shadow-integrity-20261116
  pull_request:
    paths:
      - 'v13/code/v13/arithmetic_verifier.py'
      - 'v13/code/v13/toolstep.py'
      - 'v13/code/tests/test_arithmetic_verifier.py'
      - '.github/workflows/v13-core-arithmetic-shadow.yml'
jobs:
  arithmetic-shadow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run focused offline regression
        working-directory: v13/code
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_arithmetic_verifier.py
          python -m compileall -q v13/arithmetic_verifier.py v13/toolstep.py
