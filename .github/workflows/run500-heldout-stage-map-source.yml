name: V13 Run500 frozen 1050-row stage map source-only proof
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/run500-heldout-stage-map-source.yml'
      - 'v13/code/scripts/run500_step2_stage_map.py'
      - 'v13/code/tests/test_run500_step2_stage_map.py'
permissions:
  contents: read
jobs:
  source-only:
    if: ${{ github.event.pull_request.head.ref == 'codex/run500-heldout1050-stage-map-20261026' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 60
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Exact frozen source and prereg hashes
        run: |
          set -euo pipefail
          test "$(git hash-object v13/code/docs/proofs/continuation-20261026/run500-heldout1050-stage-map/PREREG.md)" = '7bbf69d35a56631e368fc3f410711466114fdc0e'
          test "$(git hash-object v13/code/scripts/run500_step2_stage_map.py)" = '504a4a8492bdb383869b164b82c05d13e00f6823'
          test "$(git hash-object v13/code/tests/test_run500_step2_stage_map.py)" = 'cf4dd3fd4b882779eadbf7eea4bcdf573e732bda'
          test "$(git hash-object v13/code/scripts/run491_step2_heldout10.py)" = 'f4d2d8d5e66c49c508e376ebafce2146e5a2715b'
          test "$(git hash-object v13/code/scripts/run496_heldout10_native_pilot.py)" = '543982e6c03c548eab87470732be279fbba53ac1'
          test "$(git hash-object v13/code/specs/models.json)" = '7af05962af41d0bc3f7dd18ef01d4eba55eabf99'
      - name: Isolated source test dependencies
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Stage map and frozen original source tests
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          ../../.venv/bin/python -m unittest -v tests.test_run500_step2_stage_map tests.test_run491_step2_heldout10 tests.test_run496_heldout10_native_pilot > "$RUNNER_TEMP/RUN500_TEST_RAW.log" 2>&1
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/RUN500_TEST_EXIT.txt"
          exit 0
      - name: Generate actual source-only 75-stage manifest
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          ../../.venv/bin/python scripts/run500_step2_stage_map.py --fixture-only --work "$RUNNER_TEMP/run500-stage-map" > "$RUNNER_TEMP/RUN500_FIXTURE_RAW.log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            cp "$RUNNER_TEMP/run500-stage-map/RUN500_STAGE_MAP.json" "$RUNNER_TEMP/RUN500_STAGE_MAP.json"
            ../../.venv/bin/python - <<'PY' >> "$RUNNER_TEMP/RUN500_FIXTURE_RAW.log" 2>&1
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'RUN500_STAGE_MAP.json'
          d=json.loads(p.read_text())
          assert d['stage_count']==75 and d['expected_native_rows']==1050
          assert d['original_fixture_sha256']=='c434a5765ed85b7c51022c5aaea0ba4c3150ef0f1490f466b4a8833e41b44c63'
          assert len({tuple(k) for s in d['stages'] for k in s['row_keys']})==1050
          assert d['native_executed'] is False and d['canonical_gate_pass'] is False and d['step2_exit']=='UTILITY_FAIL'
          print('RUN500_75_STAGES_1050_SOURCE_ONLY_VERIFIED')
          PY
            rc=$?
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN500_FIXTURE_EXIT.txt"
          exit 0
      - name: Official public privacy scan
        if: always()
        run: |
          set -uo pipefail
          set +e
          .venv/bin/python v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree > "$RUNNER_TEMP/RUN500_PRIVACY_RAW.log" 2>&1
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/RUN500_PRIVACY_EXIT.txt"
          exit 0
      - name: Close raw source-only SHA256 evidence
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          find . -maxdepth 1 -type f -name 'RUN500_*' ! -name RUN500_SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > RUN500_SHA256SUMS.txt
      - name: Preserve source-only proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run500-heldout-stage-map-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/RUN500_*
          if-no-files-found: error
          retention-days: 30
      - name: Enforce tests, manifest and privacy
        if: always()
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/RUN500_TEST_EXIT.txt"
          test -f "$RUNNER_TEMP/RUN500_FIXTURE_EXIT.txt"
          test -f "$RUNNER_TEMP/RUN500_PRIVACY_EXIT.txt"
          test "$(cat "$RUNNER_TEMP/RUN500_TEST_EXIT.txt")" = '0'
          test "$(cat "$RUNNER_TEMP/RUN500_FIXTURE_EXIT.txt")" = '0'
          test "$(cat "$RUNNER_TEMP/RUN500_PRIVACY_EXIT.txt")" = '0'
