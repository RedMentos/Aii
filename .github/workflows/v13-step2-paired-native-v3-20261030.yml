name: V13 STEP2 v3 nine-task counterbalanced paired native budget pilot
on:
  push:
    branches:
      - assistant/v13-step2-v3-counterbalanced-20261030-0419
    paths:
      - '.github/workflows/v13-step2-paired-native-v3-20261030.yml'
permissions:
  contents: read
concurrency:
  group: v13-step2-budget-paired-native-20261030
  cancel-in-progress: false
jobs:
  paired-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Serial fixed counterbalanced 9x3 native STEP2 pilot with raw and fail-closed checks
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-step2-paired-native-v3"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/CANON_BLOB.txt"
          git hash-object v13/code/specs/models.json > "$e/CATALOG_BLOB.txt"
          git hash-object v13/code/specs/control_tools.json > "$e/TOOLS_BLOB.txt"
          git hash-object v13/code/scripts/step2_budget_paired_native_v3_20261030.py v13/code/tests/test_step2_budget_paired_native_v3_20261030.py v13/code/scripts/step2_paired_raw_validator_audit_20261030.py > "$e/SOURCE_BLOBS.txt"
          test "$(cat "$e/CANON_BLOB.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7 &&
          test "$(cat "$e/CATALOG_BLOB.txt")" = 7af05962af41d0bc3f7dd18ef01d4eba55eabf99 &&
          test "$(cat "$e/TOOLS_BLOB.txt")" = 954a3f468f10195fbce12d27f68585ee7edee2c9 &&
          test "$(sed -n '1p' "$e/SOURCE_BLOBS.txt")" = dc0c46fc66c6547bca2f22a9eb7dd2cda2c9d279 &&
          test "$(sed -n '2p' "$e/SOURCE_BLOBS.txt")" = 57cf6adfa5fce1d1594bfadd25c9b111e105926c &&
          test "$(sed -n '3p' "$e/SOURCE_BLOBS.txt")" = fcd44ccce3b8b40d65a25187a78b0a8d49d9609d
          echo "$?" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-step2-paired-v3-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-step2-paired-v3-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else
            echo SKIPPED_VENV_RED > "$e/DEPS_RAW.log"
            echo SKIPPED_RED > "$e/DEPS_EXIT.txt"
          fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_step2_budget_paired_native_v3_20261030 tests.test_step2_paired_raw_validator_audit_20261030 tests.test_step2_currentchain_native_semantic_gap_20261030) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else
            echo SKIPPED_DEPS_RED > "$e/FOCUSED_RAW.log"
            echo SKIPPED_RED > "$e/FOCUSED_EXIT.txt"
          fi
          export V13_HOME="$RUNNER_TEMP/v13-step2-paired-v3-installed"
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ] && [ "$(cat "$e/PINS_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 15m env PYTHONPATH=v13/code "$py" -m v13.bootstrap --home "$V13_HOME" > "$e/BOOTSTRAP_RAW.log" 2>&1
            echo "$?" > "$e/BOOTSTRAP_EXIT.txt"
          else
            echo SKIPPED_FOCUSED_RED > "$e/BOOTSTRAP_RAW.log"
            echo SKIPPED_RED > "$e/BOOTSTRAP_EXIT.txt"
          fi
          if [ "$(cat "$e/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 32m env PYTHONPATH=v13/code "$py" v13/code/scripts/step2_budget_paired_native_v3_20261030.py --home "$V13_HOME" --out "$e/pilot" > "$e/PILOT_RAW.log" 2>&1
            echo "$?" > "$e/PILOT_EXIT.txt"
          else
            echo SKIPPED_BOOTSTRAP_RED > "$e/PILOT_RAW.log"
            echo SKIPPED_RED > "$e/PILOT_EXIT.txt"
          fi
          if [ "$(cat "$e/PILOT_EXIT.txt")" = 0 ]; then
            "$py" - "$e/pilot/report.json" > "$e/REPORT_CHECK_RAW.log" 2>&1 <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          assert j['schema']=='v13.step2.budget_paired_native_pilot.v3'
          assert j['status']=='PILOT_COMPLETE_NO_GATE'
          assert j['fixture_sha256']=='fe9b86fdf561778ad540dd4767111f04c10a147a8a44cf783fa16f0d2c8a45ca'
          assert j['seed']==41 and len(j['rows'])==27
          assert j['arm_order']==[['A_C3_ONLY','B_DEFAULT_BOTH','C_ARITH_BOTH'],['B_DEFAULT_BOTH','C_ARITH_BOTH','A_C3_ONLY'],['C_ARITH_BOTH','A_C3_ONLY','B_DEFAULT_BOTH']]
          assert len(j['fixtures'])==9
          for i,f in enumerate(j['fixtures']):
              group=j['rows'][i*3:i*3+3]
              assert [x['arm'] for x in group]==j['arm_order'][i%3]
              assert all(x['fixture']==f['project'] for x in group)
          from pathlib import Path
          base=Path(sys.argv[1]).parent
          for row in j['rows']:
              raw=json.loads((base/'raw'/row['raw_file']).read_text())
              assert raw['event_id']==row['event_id'] and raw['output']==row['final_output']
              assert len(raw['checks'])==13 and all(raw['checks'].values())
          assert all(x['valid_native'] is True and x['route_override_evidence_valid'] is True for x in j['rows'])
          assert j['native_c2_control_proven'] is False
          assert all(x['native_c2_control_proven'] is False for x in j['rows'])
          assert sum(len(x['native_process_releases']) for x in j['rows'])==36
          assert all(y['process_reaped'] is True for x in j['rows'] for y in x['native_process_releases'])
          assert j['comparative_step2_gate_promoted'] is False
          assert j['redmi_measured'] is False and j['jepa_weight']==0
          assert all(0<=v<=18 for v in j['score_totals_out_of_18'].values())
          assert all(j['score_totals_out_of_18'][arm]==sum(row['score']['correct'] for row in j['rows'] if row['arm']==arm) for arm in j['arms'])
          assert j['learning_mode']=='RECORD_ONLY' and j['pilot_gain'] in (True,False)

          print('FRESH_PAIRED_NATIVE_V3_INTERMEDIATE_NO_C2_OR_STEP2_GATE',j['score_totals_out_of_18'])
          PY
            echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          else
            echo SKIPPED_PILOT_RED > "$e/REPORT_CHECK_RAW.log"
            echo SKIPPED_RED > "$e/REPORT_CHECK_EXIT.txt"
          fi
          "$py" -m py_compile v13/code/scripts/step2_budget_paired_native_v3_20261030.py v13/code/tests/test_step2_budget_paired_native_v3_20261030.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 4030bd528b670d251960c0f630dd6411e8c006a3 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 4030bd528b670d251960c0f630dd6411e8c006a3 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-step2-paired-native-v3-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-step2-paired-native-v3/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce native pilot without STEP2 gate promotion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-step2-paired-native-v3"
          for stage in PINS VENV DEPS FOCUSED BOOTSTRAP PILOT REPORT_CHECK COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained; no native pilot PASS"
              tail -80 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'PAIRED_NATIVE_V3_INTERMEDIATE_NO_C2_STEP2_B3_JEPA_REDMI_OR_AGE_PROMOTION'
