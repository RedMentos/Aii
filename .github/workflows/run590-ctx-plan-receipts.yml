name: V13 Run590 Context OS committed plan receipt proof
on:
  push:
    branches:
      - codex/automation11-run590-ctx-plan-receipts-20261026
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/run590-ctx-plan-receipts.yml'
      - 'v13/code/v13/context_os.py'
      - 'v13/code/tests/test_run590_ctx_plan_receipts.py'
      - 'v13/code/docs/proofs/continuation-20261026/run590-ctx-plan-receipts/**'
permissions:
  contents: read
jobs:
  context-plan-receipts:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.ref == 'codex/automation11-run590-ctx-plan-receipts-20261026' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install isolated model-free test dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'prompt_toolkit==3.0.52'
      - name: Execute Context OS receipt and existing source-bound tests
        shell: bash
        run: |
          mkdir -p run590-raw
          git rev-parse HEAD > run590-raw/source_head.txt
          sha256sum v13/code/v13/context_os.py v13/code/tests/test_run590_ctx_plan_receipts.py v13/code/docs/proofs/continuation-20261026/run590-ctx-plan-receipts/PREREG.md > run590-raw/source_sha256.txt
          set +e
          (cd v13/code && python -m unittest discover -s tests -p test_run590_ctx_plan_receipts.py -v) > run590-raw/new-tests.log 2>&1
          echo "$?" > run590-raw/new-tests.exit
          (cd v13/code && python -m unittest discover -s tests -p test_context_os.py -v && python -m unittest discover -s tests -p test_context_append_provenance_run74.py -v && python -m unittest discover -s tests -p test_context_warm_authority_run271.py -v) > run590-raw/regressions.log 2>&1
          echo "$?" > run590-raw/regressions.exit
          python -m compileall -q v13/code/v13/context_os.py v13/code/tests/test_run590_ctx_plan_receipts.py > run590-raw/compile.log 2>&1
          echo "$?" > run590-raw/compile.exit
          python v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha || '47072aff89e8244c55542ed90adb5a6d06f3e168' }}" --head "${{ github.event.pull_request.head.sha || github.sha }}" --no-worktree > run590-raw/privacy.log 2>&1
          echo "$?" > run590-raw/privacy.exit
          set -e
          cat run590-raw/new-tests.log
          cat run590-raw/regressions.log
          cat run590-raw/privacy.log
      - name: Close SHA manifest even on failure
        if: always()
        shell: bash
        run: |
          mkdir -p run590-raw
          (cd run590-raw && sha256sum *.txt *.log *.exit > RAW_SHA256SUMS.txt)
          cat run590-raw/RAW_SHA256SUMS.txt
      - name: Preserve raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run590-ctx-plan-receipts-raw
          path: run590-raw/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce tests and privacy
        shell: bash
        run: |
          test "$(cat run590-raw/new-tests.exit)" = 0
          test "$(cat run590-raw/regressions.exit)" = 0
          test "$(cat run590-raw/compile.exit)" = 0
          test "$(cat run590-raw/privacy.exit)" = 0
