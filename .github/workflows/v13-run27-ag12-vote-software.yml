name: V13 Run27 three-organ AG12 vote software preflight only
on:
  push:
    branches: [assistant/v13-run27-ag12-ensemble-native-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run27-ag12-vote-software.yml'
permissions:
  contents: read
jobs:
  three-organ-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin source, test mocked three-organ native contract only
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run27-software"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          040730d68bccf1d7d3c154bb1b7657d8a47bffba v13/code/docs/AG12_THREE_ORGAN_NATIVE_PREREG_RUN27_20261030.md
          f7c23a2467b3daeae4875b7e18b1a6d83fcdbb47 v13/code/scripts/run27_ag12_three_organ_native.py
          10ceb8bd168e7a22e14b6127cf30856632431cec v13/code/tests/test_run27_ag12_three_organ_native.py
          cec8b7ec36066ee74c2ff1a3684c7517160cef3a v13/code/scripts/run25_ag12_bodies_native.py
          b781461e8fae5de9a519a0216d4d9a6a773eb498 v13/code/scripts/run24_ag12_german_c3_native.py
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          66a9419143c456f01747b4796fb327b3b36711b3 v13/code/v13/agi/solver.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run27-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run27-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout 4m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_run27_ag12_three_organ_native tests.test_run26_ag12_native_crossorgan tests.test_run25_ag12_bodies_native) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PIN_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/scripts/run27_ag12_three_organ_native.py v13/code/tests/test_run27_ag12_three_organ_native.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 503f73faab73b1aa780813f605c68362ac7bd7d9 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 503f73faab73b1aa780813f605c68362ac7bd7d9 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve software-only raw, no native
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run27-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run27-software/
          retention-days: 30
          if-no-files-found: error
      - name: Require preflight GREEN only
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run27-software"
          for stage in PINS VENV DEPS TEST COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              tail -70 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
          echo 'RUN27_MOCKED_SOFTWARE_ONLY_NATIVE_NOT_LAUNCHED'
