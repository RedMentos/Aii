name: V13 BJ1 weight preflight clean RED replay
on:
  push:
    branches: [codex/automation11r-red-clean-20261027]
    paths:
      - '.github/workflows/bj1-weight-clean-red.yml'
      - 'v13/code/v13/body_jepa.py'
      - 'v13/code/v13/body_jepa.py'
      - 'v13/code/tests/test_body_jepa.py'
      - 'v13/code/tests/test_body_jepa.py'
permissions:
  contents: read
concurrency:
  group: v13-bj1-weight-red-${{ github.ref }}
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Full software regression, source hashes and closed raw exits
        run: |
          set +e
          evidence="$RUNNER_TEMP/v13-bj1-weight-red"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/HEAD.txt"
          git hash-object v13/code/v13/body_jepa.py > "$evidence/BODY_JEPA_BLOB.txt"
          python3 -m venv "$RUNNER_TEMP/bj1-weight-red-venv"
          py="$RUNNER_TEMP/bj1-weight-red-venv/bin/python"
          "$py" -m pip install --no-input -q 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu > "$evidence/INSTALL_RAW.log" 2>&1
          torch_exit=$?
          "$py" -m pip install --no-input -q 'numpy==2.2.6' 'psutil' 'PyYAML' 'Pillow' 'transformers==5.20.2' 'peft==0.21.2' >> "$evidence/INSTALL_RAW.log" 2>&1
          deps_exit=$?
          if [ "$torch_exit" -eq 0 ] && [ "$deps_exit" -eq 0 ]; then echo 0; else echo 1; fi > "$evidence/INSTALL_EXIT.txt"
          (
            cd v13/code
            timeout --signal=TERM --kill-after=10s 8m env PYTHONPATH=. "$py" -m unittest -v tests.test_body_jepa
          ) > "$evidence/UNIT_RAW.log" 2>&1
          echo "$?" > "$evidence/UNIT_EXIT.txt"
          python3 -m compileall -q v13/code/v13 v13/code/tests/test_body_jepa.py > "$evidence/COMPILE_RAW.log" 2>&1
          echo "$?" > "$evidence/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 45616b669cbf56eabc29e5ff55979c223476d601 --head HEAD > "$evidence/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$evidence/PRIVACY_EXIT.txt"
          git diff --check 45616b669cbf56eabc29e5ff55979c223476d601 HEAD > "$evidence/DIFF_RAW.log" 2>&1
          echo "$?" > "$evidence/DIFF_EXIT.txt"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-bj1-weight-red-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-bj1-weight-red/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce all exits, never promote native or Age gates
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/v13-bj1-weight-red"
          for name in INSTALL UNIT COMPILE PRIVACY DIFF; do
            if [ "$(cat "$evidence/${name}_EXIT.txt")" != 0 ]; then
              echo "$name failed; raw evidence retained"
              tail -80 "$evidence/${name}_RAW.log"
              exit 1
            fi
          done
          echo 'BJ1_WEIGHT_PREFLIGHT_SOFTWARE_ONLY_NO_AGE_PROMOTION'
