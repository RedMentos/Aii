name: V14 Android companion

on:
  push:
    branches:
      - core/v14-android-companion-native-20261121
      - qa/v14-companion-single-use-approval-20261121
      - qa/v14-companion-os-permission-contract-20261122
    paths:
      - "android-companion/**"
      - ".github/workflows/v14-android-companion.yml"
  pull_request:
    branches:
      - gpt6/v14-core-companion-outcome-20261121
      - core/v14-android-companion-native-20261121
      - qa/v14-companion-single-use-approval-20261121
    paths:
      - "android-companion/**"
      - ".github/workflows/v14-android-companion.yml"

permissions:
  contents: read

jobs:
  android-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Build and test isolated companion
        run: |
          gradle --no-daemon -p android-companion :app:assembleDebug :app:testDebugUnitTest
