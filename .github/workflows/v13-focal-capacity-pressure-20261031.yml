name: V13 focal capacity-pressure marginal-diversity candidate software
on:
  push:
    branches:
      - assistant/v13-focal-capacity-pressure-20261031-gpt6
    paths:
      - v13/code/docs/FOCAL_CAPACITY_DIVERSITY_TRIGGER.txt
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      NO_MODEL_DOWNLOADS: "1"
      DO_NOT_TRACK: "1"
      V13_NO_AUTOSTART: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run real focal pressure controls and original focal regressions
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-focal-pressure"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/v13-focal-pressure-venv" > "$e/VENV_RAW.log" 2>&1
          py="$RUNNER_TEMP/v13-focal-pressure-venv/bin/python"
          echo 0 > "$e/VENV_EXIT.txt"
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo 0 > "$e/DEPS_EXIT.txt"
          "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log"
          "$py" -m compileall -q v13/code/scripts/focal_capacity_diversity_candidate_20261031.py v13/code/tests/test_focal_capacity_diversity_20261031.py > "$e/COMPILE_RAW.log" 2>&1
          echo 0 > "$e/COMPILE_EXIT.txt"
          set +e
          (cd v13/code && env PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests -p test_focal_capacity_diversity_20261031.py -v) > "$e/CANDIDATE_RAW.log" 2>&1
          candidate_rc=$?
          (cd v13/code && env PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests -p test_focal.py -v) > "$e/ORIGINAL_RAW.log" 2>&1
          original_rc=$?
          (cd v13/code && env PYTHONPATH=.:tests:scripts "$py" scripts/focal_capacity_diversity_candidate_20261031.py) > "$e/REPORT_RAW.log" 2>&1
          report_rc=$?
          set -e
          echo "$candidate_rc" > "$e/CANDIDATE_EXIT.txt"
          echo "$original_rc" > "$e/ORIGINAL_EXIT.txt"
          echo "$report_rc" > "$e/REPORT_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 9fc4a85930b22ddb0c0f306d48bcddfad4806842 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo 0 > "$e/PRIVACY_EXIT.txt"
          git diff --check 9fc4a85930b22ddb0c0f306d48bcddfad4806842 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo 0 > "$e/DIFF_EXIT.txt"
          "$py" - "$e" <<'PY' > "$e/RESULT_RAW.log" 2>&1
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1])
          r={'schema':'v13.focal_capacity_diversity_candidate.software.v1',
             'head':(e/'HEAD.txt').read_text().strip(),
             'candidate_exit':int((e/'CANDIDATE_EXIT.txt').read_text()),
             'original_exit':int((e/'ORIGINAL_EXIT.txt').read_text()),
             'report_exit':int((e/'REPORT_EXIT.txt').read_text()),
             'native_model_used':False,'redmi_measured':False,
             'focal_gate_promoted':False,'step2_promoted':False,'age_promoted':False}
          (e/'RESULT.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
          echo 0 > "$e/RESULT_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat "$e/RESULT_RAW.log"
          tail -n 15 "$e/CANDIDATE_RAW.log"
          tail -n 5 "$e/ORIGINAL_RAW.log"
          cat "$e/REPORT_RAW.log"
          test "$candidate_rc" -eq 0
          test "$original_rc" -eq 0
          test "$report_rc" -eq 0
      - name: Upload original raw evidence including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-focal-pressure-${{ github.sha }}
          path: ${{ runner.temp }}/v13-focal-pressure/
          if-no-files-found: error
          retention-days: 90
