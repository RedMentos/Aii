name: V13 Run117DG new normalized-source C3 48-arm software safety
on:
  push:
    branches:
      - assistant/v13-run117dg-c3-normalized-source-native-20261101-hourly11
permissions:
  contents: read
jobs:
  synthetic-no-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen source pins, 48 synthetic serial seams, original Store
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run117dg-software"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          {
            test "$(git hash-object v13/code/docs/PREREG_RUN117DE_C3_NORMALIZED_SOURCE_20261101.md)" = 990684341968b0515cacad36aaf4c09d7f8c37e6
            test "$(git hash-object v13/code/scripts/run117de_normalized_source_fixture.py)" = 04f79fb713344407c618fe736e94fb8549cc7121
            test "$(git hash-object v13/code/v13/jef_c3_normalized_source_shadow_candidate.py)" = b625f989f7c3236652c7f646540f0e99d86cf016
            test "$(git hash-object v13/code/scripts/run117df_paired_source_preflight.py)" = 280c2f32e5ac707b8c0d3ca22cf9a1cf8d7255d1
            test "$(git hash-object v13/code/scripts/run117dg_normalized_source_native.py)" = 45a952b12f5bca06dd754dcd3eab654cb2f47e7b
            test "$(git hash-object v13/code/tests/test_run117dg_normalized_source_native.py)" = f91a95227251d4227ed293e4edc0540bdca36ebd
            test "$(git hash-object v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md)" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          } > "$e/PINS_RAW.log" 2>&1
          echo "$?" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run117dg-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run117dg-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' 'psutil==7.0.0' 'PyYAML==6.0.2' 'Pillow==11.3.0' 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
          echo "$?" > "$e/PIP_CHECK_EXIT.txt"
          python3 -m py_compile v13/code/scripts/run117dg_normalized_source_native.py v13/code/tests/test_run117dg_normalized_source_native.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout 300s env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_run117dg_normalized_source_native tests.test_run117df_paired_source_preflight tests.test_run117de_normalized_source_candidate) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo 99 > "$e/TEST_EXIT.txt"; echo PREREQUISITE_RED > "$e/TEST_RAW.log"; fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 27f53ff50ef7017cba5b6e1248e1c73c1048c3aa --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 27f53ff50ef7017cba5b6e1248e1c73c1048c3aa HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve synthetic software GREEN or RED receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117dg-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117dg-software/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce no-native software stages
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117dg-software"
          for stage in PINS VENV DEPS PIP_CHECK COMPILE TEST PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; raw preserved, no native claim"
              tail -80 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN117DG_SYNTHETIC_48_ARM_SOFTWARE_NONPROMOTING
