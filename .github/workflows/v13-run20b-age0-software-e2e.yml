name: V13 Run20B latest-chain Age0 operator JEF World JEPA Sleep software E2E
on:
  push:
    branches: [assistant/v13-run20-resource-sensor-finite-20261030-hourly11]
    paths: ['.github/workflows/v13-run20b-age0-software-e2e.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run exact-source SQLite capability, ContextOS, warm, Sleep and neuromod regressions
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run20b-e2e"; mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          35b2f70aa57988392abd70970cfa85dfa72b020c v13/code/docs/RUN20B_AGE0_SOFTWARE_E2E_PREREG_20261030.md
          e2abb957edce797a235febfcf287b947b3621087 v13/code/v13/context_os.py
          cff2a44d0111fda6d74789ccc3aceac88e77fbbb v13/code/v13/sleep.py
          7bd80ab472483183bb04eb2dc83ef59fe5919901 v13/code/v13/resource_modes.py
          f5236f201ee90e16dae994d981e5d0ef67357722 v13/code/v13/world_model.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run20b-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run20b-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
          echo "$?" > "$e/PIP_CHECK_EXIT.txt"
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 11m env PYTHONPATH=.:tests "$py" -m unittest -v \
              tests.test_run82_age0_operator_e2e \
              tests.test_run83_age0_backup_restore_e2e \
              tests.test_age0_source_context_world_sleep_integration_20261029 \
              tests.test_age0_jef_f1f5_crossorgan_20261029 \
              tests.test_context_self_sleep_age0_20261029 \
              tests.test_run14w_context_world_effort_integration \
              tests.test_worldmodel_realstore_integration_20261029 \
              tests.test_world_jepa_closedstore_private_pipeline_20261028 \
              tests.test_jefoutcome \
              tests.test_step12) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PREREQUISITE > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          python3 -m compileall -q v13/code/v13/resource_modes.py v13/code/docs/RUN20B_AGE0_SOFTWARE_E2E_PREREG_20261030.md > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 07b72767342308567cd32e562d3166fb397f56ce --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 07b72767342308567cd32e562d3166fb397f56ce HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve candidate raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run20b-e2e-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run20b-e2e/
          retention-days: 30
          if-no-files-found: error
      - name: Require all stages GREEN
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run20b-e2e"
          for stage in PINS VENV DEPS PIP_CHECK TEST COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              tail -90 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
          echo 'AGE0_E2E_SOFTWARE_ONLY_NO_NATIVE_OR_AGE_PROMOTION; NO_MODEL_OR_AGE_PROMOTION'
