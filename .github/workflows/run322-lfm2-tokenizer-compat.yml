name: V13 Run322 pinned LFM2 tokenizer compatibility (no weights)
on:
  pull_request:
    paths:
      - 'v13/code/scripts/probe_lfm2_tokenizer_compat_run322.py'
      - 'v13/code/tests/test_lfm2_tokenizer_compat_run322.py'
      - '.github/workflows/run322-lfm2-tokenizer-compat.yml'
      - 'v13/code/docs/proofs/continuation-20261025/lfm2-tokenizer-compat-run322/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v13-run322-tokenizer-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  two-arm-tokenizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      PIP_NO_CACHE_DIR: '1'
      V13_NO_AUTOSTART: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 50
      - name: Freeze source and run negative/positive fixture tests
        id: fixture
        run: |
          set -uo pipefail
          set +e
          git rev-parse HEAD | tee "$RUNNER_TEMP/RUN322_HEAD.txt"
          PYTHONPATH=v13/code python3 -m unittest -v tests.test_lfm2_tokenizer_compat_run322 \
            2>&1 | tee "$RUNNER_TEMP/RUN322_FIXTURE_RAW.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUNNER_TEMP/RUN322_FIXTURE_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Exact HF revision tokenizer-only snapshot and hashes
        id: snapshot
        run: |
          set -uo pipefail
          set +e
          python3 -m venv "$RUNNER_TEMP/run322hub"
          "$RUNNER_TEMP/run322hub/bin/python" -m pip install --disable-pip-version-check --no-input 'huggingface_hub==0.36.0' \
            2>&1 | tee "$RUNNER_TEMP/RUN322_HUB_DEPS_RAW.log"
          rc=${PIPESTATUS[0]}
          if [[ "$rc" == "0" ]]; then
            export HF_DIR="$RUNNER_TEMP/run322hf"
            "$RUNNER_TEMP/run322hub/bin/python" - <<'PY' 2>&1 | tee "$RUNNER_TEMP/RUN322_SNAPSHOT_RAW.log"
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id="LiquidAI/LFM2.5-350M",
              revision="9e6c6ccf47cd318696e137d381a7ded8fe4df09f",
              local_dir=os.environ["HF_DIR"],
              allow_patterns=["config.json","tokenizer*","special_tokens_map.json","chat_template.jinja","generation_config.json"])
          PY
            rc=${PIPESTATUS[0]}
          fi
          if [[ "$rc" == "0" ]]; then
            export SOURCE_MANIFEST="$RUNNER_TEMP/RUN322_SOURCE_MANIFEST.json"
            python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["HF_DIR"])
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          files={p.name:sha(p) for p in sorted(root.iterdir()) if p.is_file() and not p.is_symlink()}
          assert all(x in files for x in ("config.json","tokenizer_config.json","tokenizer.json"))
          manifest={"hf_repo":"LiquidAI/LFM2.5-350M",
              "hf_revision":"9e6c6ccf47cd318696e137d381a7ded8fe4df09f",
              "file_sha256":files,"license":"LFM Open License v1.0"}
          Path(os.environ["SOURCE_MANIFEST"]).write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print(json.dumps(manifest,sort_keys=True))
          PY
            rc=$?
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN322_SNAPSHOT_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Frozen Transformers 4.57.1 negative control
        id: old
        run: |
          set -uo pipefail
          set +e
          if [[ "$(cat "$RUNNER_TEMP/RUN322_SNAPSHOT_EXIT.txt")" != "0" ]]; then
            echo 2 > "$RUNNER_TEMP/RUN322_OLD_EXIT.txt"; echo "rc=2" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python3 -m venv "$RUNNER_TEMP/run322old"
          "$RUNNER_TEMP/run322old/bin/python" -m pip install --disable-pip-version-check --no-input 'transformers==4.57.1' \
            2>&1 | tee "$RUNNER_TEMP/RUN322_OLD_DEPS_RAW.log"
          rc=${PIPESTATUS[0]}
          "$RUNNER_TEMP/run322old/bin/python" -m pip freeze > "$RUNNER_TEMP/RUN322_OLD_FREEZE.txt" || true
          if [[ "$rc" == "0" ]]; then
            "$RUNNER_TEMP/run322old/bin/python" v13/code/scripts/probe_lfm2_tokenizer_compat_run322.py probe \
              --snapshot-dir "$RUNNER_TEMP/run322hf" --manifest "$RUNNER_TEMP/RUN322_SOURCE_MANIFEST.json" \
              --version-tag 4.57.1 --out "$RUNNER_TEMP/RUN322_OLD_RESULT.json" \
              2>&1 | tee "$RUNNER_TEMP/RUN322_OLD_PROBE_RAW.log"
            rc=${PIPESTATUS[0]}
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN322_OLD_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Frozen Transformers 5.3.0 candidate
        id: new
        run: |
          set -uo pipefail
          set +e
          if [[ "$(cat "$RUNNER_TEMP/RUN322_SNAPSHOT_EXIT.txt")" != "0" ]]; then
            echo 2 > "$RUNNER_TEMP/RUN322_NEW_EXIT.txt"; echo "rc=2" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python3 -m venv "$RUNNER_TEMP/run322new"
          "$RUNNER_TEMP/run322new/bin/python" -m pip install --disable-pip-version-check --no-input 'transformers==5.3.0' \
            2>&1 | tee "$RUNNER_TEMP/RUN322_NEW_DEPS_RAW.log"
          rc=${PIPESTATUS[0]}
          "$RUNNER_TEMP/run322new/bin/python" -m pip freeze > "$RUNNER_TEMP/RUN322_NEW_FREEZE.txt" || true
          if [[ "$rc" == "0" ]]; then
            "$RUNNER_TEMP/run322new/bin/python" v13/code/scripts/probe_lfm2_tokenizer_compat_run322.py probe \
              --snapshot-dir "$RUNNER_TEMP/run322hf" --manifest "$RUNNER_TEMP/RUN322_SOURCE_MANIFEST.json" \
              --version-tag 5.3.0 --out "$RUNNER_TEMP/RUN322_NEW_RESULT.json" \
              2>&1 | tee "$RUNNER_TEMP/RUN322_NEW_PROBE_RAW.log"
            rc=${PIPESTATUS[0]}
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN322_NEW_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preregistered two-arm assessment
        id: assess
        run: |
          set -uo pipefail
          set +e
          if [[ -f "$RUNNER_TEMP/RUN322_OLD_RESULT.json" && -f "$RUNNER_TEMP/RUN322_NEW_RESULT.json" ]]; then
            python3 v13/code/scripts/probe_lfm2_tokenizer_compat_run322.py assess \
              --old "$RUNNER_TEMP/RUN322_OLD_RESULT.json" --new "$RUNNER_TEMP/RUN322_NEW_RESULT.json" \
              --out "$RUNNER_TEMP/RUN322_ASSESSMENT.json" \
              2>&1 | tee "$RUNNER_TEMP/RUN322_ASSESS_RAW.log"
            rc=${PIPESTATUS[0]}
          else
            echo "NO_COMPARABLE_ARMS" | tee "$RUNNER_TEMP/RUN322_ASSESS_RAW.log"
            rc=2
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN322_ASSESS_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Official privacy scan
        id: privacy
        run: |
          set -uo pipefail
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" \
            --head HEAD --no-worktree 2>&1 | tee "$RUNNER_TEMP/RUN322_PRIVACY_RAW.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUNNER_TEMP/RUN322_PRIVACY_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Close raw evidence hashes (no model weights)
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          find . -maxdepth 1 -type f -name 'RUN322_*' ! -name 'RUN322_SHA256SUMS.txt' -print0 | sort -z | xargs -0 -r sha256sum > RUN322_SHA256SUMS.txt
      - name: Retain all positive and negative arms
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V13-Run322-TokenizerOnly-Raw-${{ github.sha }}
          path: ${{ runner.temp }}/RUN322_*
          retention-days: 30
      - name: Enforce source fixtures diagnostic and privacy
        if: always()
        run: |
          test "${{ steps.fixture.outputs.rc }}" = "0"
          test "${{ steps.snapshot.outputs.rc }}" = "0"
          test "${{ steps.assess.outputs.rc }}" = "0"
          test "${{ steps.privacy.outputs.rc }}" = "0"
