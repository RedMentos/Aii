name: V13 Run61 B1 B2 C3 F1 F5 C6 v2 DRAFT SHADOW software integration
on:
  push:
    branches: [assistant/v13-run61-crossorgan-c6-v2-shadow-gpt6-20261031]
    paths:
      - '.github/workflows/v13-run61-crossorgan-c6-v2-shadow.yml'
      - 'v13/code/v13/run61_crossorgan_c6_v2_shadow_candidate.py'
      - 'v13/code/tests/test_run61_crossorgan_c6_v2_shadow_candidate.py'
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      NEEDLE_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen source pins, real Store cross-organ tests and raw evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run61-c6-v2-shadow"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          890641892b3d4f6ec1f54de4e6591cfa4784baa6 v13/code/docs/fixtures/run51_f1f5_second_attempt_seed467.json
          b63c0b242d904d4155175453ef7d932965fd7cbc v13/code/docs/RUN61_CROSSORGAN_C6_V2_SHADOW_PREREG_20261031.md
          94755aba1e019483483ead24c8b1d0d6fdbf007e v13/code/v13/run61_crossorgan_c6_v2_shadow_candidate.py
          e340083a3c5188a86ac45e71e3423c2beebcad75 v13/code/tests/test_run61_crossorgan_c6_v2_shadow_candidate.py
          54461496a337a04913b807861e0c6c73d4de6cfa v13/code/v13/c6_budget_lexical_v2_candidate.py
          8aaccb96c3fca43fa4450ab9bdc15f0e787bf093 v13/code/v13/b1b2_c3_source_envelope_candidate.py
          26f866c88c1604b6119aaf55066f40a9f8b43f4f v13/code/v13/f1f5_temporal_atomic_draft_candidate.py
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          sha256sum v13/code/docs/fixtures/run51_f1f5_second_attempt_seed467.json > "$e/FIXTURE_RAW.log" 2>&1
          test "$(cut -d' ' -f1 "$e/FIXTURE_RAW.log")" = 160128b2f5df2a5798ae7ec62687e6be5a8e61f6c6b2dad43f1ad253ee592ecc
          echo "$?" > "$e/FIXTURE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run61-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run61-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/FIXTURE_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 6m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_run61_crossorgan_c6_v2_shadow_candidate tests.test_c6_budget_lexical_v2_candidate tests.test_run58_crossorgan_c6_shadow_candidate tests.test_b1b2_c3_source_envelope_candidate tests.test_f1f5_temporal_atomic_draft_candidate tests.test_c6_positive_assertion_candidate tests.test_c6_temporal_draft_preflight_candidate) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PIN_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/v13/run61_crossorgan_c6_v2_shadow_candidate.py v13/code/tests/test_run61_crossorgan_c6_v2_shadow_candidate.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base a6c24adc0649e7229c96cb5d56dfe24aad7cc309 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check a6c24adc0649e7229c96cb5d56dfe24aad7cc309 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve raw including failed controls
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run61-c6-v2-shadow-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run61-c6-v2-shadow/
          retention-days: 90
          if-no-files-found: error
      - name: Require all eight stages zero
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run61-c6-v2-shadow"
          for s in PINS FIXTURE VENV DEPS TEST COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN61_C6_V2_SHADOW_NO_TTY_NO_OUTPUT_NO_PROMOTION
