name: V13 Run14Q Sleep AG12 cross-organ candidate v2 isolated numpy
on:
  push:
    branches: [assistant/v13-run14q-sleep-ag12-holdout-stage-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run14q-sleep-ag12-green-v2.yml'
permissions:
  contents: read
jobs:
  sleep-ag12:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin source install isolated dependency and test cross-organ
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run14q-sleep-ag12-green-v2"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          1dda3f4adf8987f95be5a3c1358286254d3bf27b v13/code/docs/SLEEP_AG12_HOLDOUT_STAGE_PREREG_RUN14Q_20261030.md
          42747a7128c372c5ca4f737fb2dbe7ec32a3283e v13/code/tests/test_sleep_ag12_holdout_run14q.py
          84ca3580c37a00701286d0d9b00d535ee8c3153f v13/code/v13/agi/generality.py
          622f3c202c70464c7426e590979428e41f6e50a6 v13/code/v13/sleep_offline.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run14q-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run14q-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
          else
            echo 99 > "$e/DEPS_EXIT.txt";echo VENV_RED > "$e/DEPS_RAW.log"
            echo 99 > "$e/PIP_CHECK_EXIT.txt";echo VENV_RED > "$e/PIP_CHECK_RAW.log"
          fi
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 8m env PYTHONPATH=. "$py" -m unittest -v \
              tests.test_sleep_ag12_holdout_run14q \
              tests.test_sleep_offline \
              tests.test_sleep_ttt_source_lineage_run207 \
              tests.test_sleep_digest_live_lineage_run208 \
              tests.test_sleep_digest_view_authority_run278 \
              tests.test_context_sleep_f5_crossorgan_20261028 \
              tests.test_ag12_crosslanguage_holdout_run14p \
              tests.test_ag12_historical_holdout_run14m \
              tests.test_ag12_suite_identity_run14h \
              tests.test_ag12_language_isolation_run14f \
              tests.test_ag12_ag9_direct_feedback_run14i \
              tests.test_ag9_atomic_feedback_run14j) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PREREQUISITE > "$e/TEST_RAW.log";echo 99 > "$e/TEST_EXIT.txt";fi
          python3 -m compileall -q v13/code/v13/agi v13/code/v13/sleep_offline.py v13/code/tests/test_sleep_ag12_holdout_run14q.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 49e7eb3edbee83a7717a4d4356df086406a2a817 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 49e7eb3edbee83a7717a4d4356df086406a2a817 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve complete raw, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run14q-v2-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run14q-sleep-ag12-green-v2/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce isolated setup and tests GREEN
        if: always()
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run14q-sleep-ag12-green-v2"
          for stage in PINS VENV DEPS PIP_CHECK TEST COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              tail -80 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
          echo 'RUN14Q_SOFTWARE_ONLY; STAGED_DATA_NOT_TRAINED'
