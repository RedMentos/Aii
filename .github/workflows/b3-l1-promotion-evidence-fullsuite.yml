name: V13 B3 explicit L1 promotion full software regression
on:
  push:
    branches: [assistant/v13-b3-l1-promotion-evidence-review-20261027]
    paths:
      - '.github/workflows/b3-l1-promotion-evidence-fullsuite.yml'
      - 'v13/code/v13/b3degrade.py'
permissions:
  contents: read
concurrency:
  group: v13-b3-l1-promotion-full
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Full B3 explicit promotion source and raw exits
        run: |
          set +e
          evidence="$RUNNER_TEMP/b3-l1-promotion-full"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/HEAD.txt"
          git hash-object v13/code/v13/b3degrade.py > "$evidence/SOURCE_BLOB.txt"
          git hash-object v13/code/tests/test_b3_l1_promotion_evidence_review.py > "$evidence/TEST_BLOB.txt"
          git hash-object v13/code/tests/test_b3degrade.py > "$evidence/EXISTING_TEST_BLOB.txt"
          git merge-base --is-ancestor 6a3280dc7859870a0c7ad80eceef1dc4d972fa5e HEAD
          echo "$?" > "$evidence/PREREG_EXIT.txt"
          git merge-base --is-ancestor bfc31da5875738b290febcf65dfb0d4a5739c550 HEAD
          echo "$?" > "$evidence/RED_TEST_COMMIT_EXIT.txt"
          if [ "$(cat "$evidence/SOURCE_BLOB.txt")" = "5cc822ecad749887acfad69f5fcba39a5a2dae8f" ] && [ "$(cat "$evidence/TEST_BLOB.txt")" = "d5f819f6fab02c8a65e308fd62920f8534182b99" ] && [ "$(cat "$evidence/EXISTING_TEST_BLOB.txt")" = "f40b40f6ef114524d318507a5106f5d03d6c5bcf" ]; then echo 0; else echo 1; fi > "$evidence/FROZEN_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/b3-l1-promotion-full-venv"
          py="$RUNNER_TEMP/b3-l1-promotion-full-venv/bin/python"
          "$py" -m pip install --no-input -q 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu > "$evidence/INSTALL_RAW.log" 2>&1
          first=$?
          "$py" -m pip install --no-input -q 'numpy==2.2.6' 'psutil' 'PyYAML' 'Pillow' 'transformers==5.20.2' 'peft==0.21.2' >> "$evidence/INSTALL_RAW.log" 2>&1
          second=$?
          if [ "$first" -eq 0 ] && [ "$second" -eq 0 ]; then echo 0; else echo 1; fi > "$evidence/INSTALL_EXIT.txt"
          (
            cd v13/code
            timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=.:tests "$py" -m unittest discover -s tests -p 'test_*.py' -q
          ) > "$evidence/UNIT_RAW.log" 2>&1
          echo "$?" > "$evidence/UNIT_EXIT.txt"
          python3 -m compileall -q v13/code/v13 > "$evidence/COMPILE_RAW.log" 2>&1
          echo "$?" > "$evidence/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base b45194a2e8ad6625b40e4b8a985b0c512414c703 --head HEAD > "$evidence/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$evidence/PRIVACY_EXIT.txt"
          git diff --check b45194a2e8ad6625b40e4b8a985b0c512414c703 HEAD > "$evidence/DIFF_RAW.log" 2>&1
          echo "$?" > "$evidence/DIFF_EXIT.txt"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-b3-l1-promotion-full-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/b3-l1-promotion-full/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce raw exits
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/b3-l1-promotion-full"
          for name in PREREG RED_TEST_COMMIT FROZEN INSTALL UNIT COMPILE PRIVACY DIFF; do
            if [ "$(cat "$evidence/${name}_EXIT.txt")" != 0 ]; then
              echo "$name failed; original raw evidence retained"
              tail -80 "$evidence/${name}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'B3_L1_PROMOTION_FULL_SOFTWARE_ONLY_NO_AUTHORITY'
