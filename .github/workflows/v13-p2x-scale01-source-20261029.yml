name: V13 P2X LoRA scale0 scale1 training16 source-only review
# Revision: explicit JSON round-trip score keys after original synthetic RED.

on:
  push:
    branches: [codex/v13-p2x-scale01-train16-review-20261029-auto10]
    paths: ['.github/workflows/v13-p2x-scale01-source-20261029.yml']
permissions:
  contents: read

jobs:
  source-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Source-only review and original raw closure
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-p2x-scale01-source"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            deps_rc=$?
            if [ "$deps_rc" = 0 ]; then
              "$py" -m pip install --disable-pip-version-check --no-input 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/DEPS_RAW.log" 2>&1
              deps_rc=$?
            fi
            if [ "$deps_rc" = 0 ]; then
              "$py" -m pip install --disable-pip-version-check --no-input 'transformers==5.20.2' 'peft==0.21.2' >> "$e/DEPS_RAW.log" 2>&1
              deps_rc=$?
            fi
            echo "$deps_rc" > "$e/DEPS_EXIT.txt"
          else echo SKIPPED > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_p2x_scale01_train16_20261029 tests.test_p2x_schema_toggle_train16_20261029 tests.test_p2x_json_train16_eval_20261029) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m scripts.p2x_scale01_train16 --plan-check) > "$e/PLAN_RAW.log" 2>&1
            echo "$?" > "$e/PLAN_EXIT.txt"
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests) > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
            "$py" -m compileall -q v13/code/scripts/p2x_scale01_train16.py v13/code/tests/test_p2x_scale01_train16_20261029.py > "$e/COMPILE_RAW.log" 2>&1
            echo "$?" > "$e/COMPILE_EXIT.txt"
          else
            for n in FOCUSED PLAN FULL COMPILE; do echo SKIPPED > "$e/${n}_EXIT.txt"; done
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base c16c5f71ee9cebd50bc07330d6cc45245de7460b --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 9e22b688c124ed2435d191d81e7a8bb512c127af HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve source-only raw before enforcement
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-p2x-scale01-source-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-p2x-scale01-source/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce source-only proof and unchanged negative gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-p2x-scale01-source"
          for n in VENV DEPS FOCUSED PLAN FULL COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; original raw preserved"
              tail -70 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          python3 - "$e/PLAN_RAW.log" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x == {"status":"SOURCE_ONLY_NO_NATIVE","calls":32,
                       "training_rows":16,"step2_status":"UTILITY_FAIL"}
          print("SOURCE_ONLY_32_CALL_PLAN_NO_GATE")
          PY
