name: V13 Run117AN independent original AL AM GREEN and AJ RED artifact audit
on:
  push:
    branches:
      - assistant/v13-run117an-independent-preflight-audit-20261031-gpt6
    paths:
      - .github/workflows/v13-run117an-original-artifact-audit.yml
      - v13/code/scripts/run117an_independent_original_artifact_audit.py
      - v13/code/tests/test_run117an_independent_original_artifact_audit.py
permissions:
  contents: read
  actions: read
jobs:
  original-readonly-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Download immutable original ZIPs and run independent strict audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          e="$RUNNER_TEMP/v13-run117an-audit"
          mkdir -p "$e/originals"
          git rev-parse HEAD > "$e/HEAD.txt"
          for item in "AL:13055904791:859e8cb57c21f9fe6532086a25e9a0e952e01339862bcce9911ed4e05907fb9d" \
                      "AM:13056872547:7b6e96a3ec2f6c7e35b02724cb727e28010be28ec8d96988bf1eb6b2a1d78a5f" \
                      "AJ:13055762789:bbf62ce125b2df42760252b5491b10ee817065623b13f6d0cc818471a297ad48"; do
            IFS=: read -r label id sha <<< "$item"
            curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/RedMentos/Aii/actions/artifacts/$id/zip" \
              --output "$e/originals/$label.zip" > "$e/${label}_DOWNLOAD_RAW.log" 2>&1
            rc=$?
            if test "$rc" -eq 0; then
              printf '%s  %s\n' "$sha" "$e/originals/$label.zip" | sha256sum -c - > "$e/${label}_HASH_RAW.log" 2>&1
              rc=$?
            else
              echo DOWNLOAD_RED > "$e/${label}_HASH_RAW.log"
            fi
            echo "$rc" > "$e/${label}_EXIT.txt"
          done
          if test "$(cat "$e/AL_EXIT.txt")" -eq 0 && test "$(cat "$e/AM_EXIT.txt")" -eq 0 && test "$(cat "$e/AJ_EXIT.txt")" -eq 0; then
            (cd v13/code && RUN117AN_AL="$e/originals/AL.zip" \
              RUN117AN_AM="$e/originals/AM.zip" RUN117AN_AJ="$e/originals/AJ.zip" \
              python3 -m unittest -v tests.test_run117an_independent_original_artifact_audit) > "$e/TEST_RAW.log" 2>&1
            test_rc=$?
            for label in AL AM AJ; do
              (cd v13/code && python3 scripts/run117an_independent_original_artifact_audit.py "$label" "$e/originals/$label.zip") > "$e/${label}_AUDIT_RAW.log" 2>&1
              echo "$?" > "$e/${label}_AUDIT_EXIT.txt"
            done
          else
            test_rc=125
            echo ORIGINAL_DOWNLOAD_RED > "$e/TEST_RAW.log"
            for label in AL AM AJ; do echo 125 > "$e/${label}_AUDIT_EXIT.txt";echo ORIGINAL_DOWNLOAD_RED > "$e/${label}_AUDIT_RAW.log";done
          fi
          echo "$test_rc" > "$e/TEST_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/run117an_independent_original_artifact_audit.py v13/code/tests/test_run117an_independent_original_artifact_audit.py > "$e/COMPILE_RAW.log" 2>&1
          compile_rc=$?
          echo "$compile_rc" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 5edeeffe9689ac32faabf0ff3bff7572e579c918 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          privacy_rc=$?
          echo "$privacy_rc" > "$e/PRIVACY_EXIT.txt"
          git diff --check 5edeeffe9689ac32faabf0ff3bff7572e579c918 HEAD > "$e/DIFF_RAW.log" 2>&1
          diff_rc=$?
          echo "$diff_rc" > "$e/DIFF_EXIT.txt"
          python3 - "$e" <<'PY' > "$e/RESULT_RAW.log"
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1]);names=('AL','AM','AJ','AL_AUDIT','AM_AUDIT','AJ_AUDIT','TEST','COMPILE','PRIVACY','DIFF')
          r={'schema':'v13.run117an.original_zip_audit_receipt.v1',
             'head':(e/'HEAD.txt').read_text().strip(),
             'exits':{n:int((e/(n+'_EXIT.txt')).read_text()) for n in names},
             'original_AJ_fullsuite':'RED_5152_5FAIL_68ERROR_28SKIP',
             'native_inference_this_run':False,'step2_promoted':False,
             'b3_promoted':False,'jepa_weight':0,'redmi_measured':False,
             'whole_system_complete':False}
          (e/'RESULT.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
          # The original ZIPs are immutable GitHub artifacts; only retain their
          # hashes/IDs and the auditor's raw receipts, not duplicate large files.
          rm -rf "$e/originals"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat "$e/RESULT_RAW.log"
          tail -n 18 "$e/TEST_RAW.log"
          for name in AL AM AJ AL_AUDIT AM_AUDIT AJ_AUDIT TEST COMPILE PRIVACY DIFF; do
            test "$(cat "$e/${name}_EXIT.txt")" -eq 0 || exit 2
          done
      - name: Preserve original-audit GREEN or RED raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117an-original-audit-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117an-audit/
          if-no-files-found: warn
          retention-days: 90
