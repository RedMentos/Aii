name: V13 Context OS arithmetic relation source-retention preflight
on:
  push:
    branches: [assistant/v13-contextos-math-exact-20261030]
    paths:
      - '.github/workflows/v13-contextos-math-exact-preflight.yml'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Hash-pinned Context OS exact source regression and raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-contextos-math"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          ec5370b6eafc23a66e3e26d0f9b403d0ec24df3b v13/code/v13/context_os.py
          33356c48925b4dbf5f5fcc477ca5d58660688489 v13/code/tests/test_context_os_math_exact_20261030.py
          054ee37eda080a8686235c528fa8cce11cf5d5bd v13/code/docs/CONTEXT_OS_MATH_EXACT_GUARD_PREREG_20261030.md
          22ed11e4a53d9eeae8fbc74a1753082b5785be2b v13/code/v13/runtime.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-contextos-math-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-contextos-math-venv/bin/python"
          "$py" -m pip install --no-input --disable-pip-version-check -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts timeout 240s "$py" -m unittest -v tests.test_context_os_math_exact_20261030 tests.test_context_os tests.test_context_os_singlequote_exact_20261029 tests.test_context_os_unclosed_code_20261029) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else
            echo SKIPPED_PINS_OR_DEPS_RED > "$e/TEST_RAW.log"
            echo 99 > "$e/TEST_EXIT.txt"
          fi
          "$py" -m py_compile v13/code/v13/context_os.py v13/code/tests/test_context_os_math_exact_20261030.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 5ba394d08ab9494d77f0b406b74ea931532b0388 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 5ba394d08ab9494d77f0b406b74ea931532b0388 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve complete original raw even when RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-contextos-math-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-contextos-math/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce source-only regression and negative gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-contextos-math"
          for stage in PINS VENV DEPS TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "${stage} RED; original raw retained; no gate promotion"
              tail -80 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo CONTEXT_OS_MATH_EXACT_SOURCE_ONLY_GREEN_NO_NATIVE_OR_AGE_GATE
