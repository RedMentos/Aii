name: V13 G13 burnout clock rollback source review
on:
  push:
    branches: [assistant/v13-g13-burnout-clockrollback-20261030-auto11]
    paths:
      - '.github/workflows/v13-g13-burnout-rollback-20261030.yml'
      - 'v13/code/v13/scheduler.py'
      - 'v13/code/tests/test_scheduler_burnout_rollback_20261030.py'
      - 'v13/code/docs/G13_BURNOUT_CLOCK_ROLLBACK_PREREG_20261030.md'
permissions:
  contents: read
concurrency:
  group: v13-g13-burnout-rollback-${{ github.ref }}
  cancel-in-progress: false
jobs:
  software-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Focused rollback, scheduler and prior G13 regression
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-g13-burnout-rollback"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/v13/scheduler.py v13/code/tests/test_scheduler_burnout_rollback_20261030.py v13/code/docs/G13_BURNOUT_CLOCK_ROLLBACK_PREREG_20261030.md v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/SOURCE_BLOBS.txt"
          test "$(tail -1 "$e/SOURCE_BLOBS.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          echo "$?" > "$e/CANON_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-g13-burnout-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-g13-burnout-venv/bin/python"
          "$py" -m pip install --no-input --disable-pip-version-check -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts timeout 480s "$py" -m unittest -v tests.test_scheduler_burnout_rollback_20261030 tests.test_scheduler_dispatch_clock_20261030 tests.test_scheduler_finite_boundary_20261029 tests.test_sleep_scheduler.SchedulerTests) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo DEPENDENCIES_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/v13/scheduler.py v13/code/tests/test_scheduler_burnout_rollback_20261030.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 501042c1581b226bf1cc24be0e939880a2393cd4 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 501042c1581b226bf1cc24be0e939880a2393cd4 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve unfiltered raw logs and SHA256SUMS
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-g13-burnout-rollback-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-g13-burnout-rollback/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce all checks, no gate promotion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-g13-burnout-rollback"
          for stage in CANON VENV DEPS TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; raw preserved"
              tail -80 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'G13_BURNOUT_CLOCK_ROLLBACK_SOFTWARE_GREEN_NO_NATIVE_OR_GATE'
