name: V13 Run13H JEF SQLite fail-closed source-only regression
on:
  push:
    branches: [assistant/v13-run13h-jeflink-sqlite-failclosed-20261030-auto11]
    paths:
      - '.github/workflows/v13-run13h-jeflink-sqlite-failclosed-20261030.yml'
      - 'v13/code/v13/jef_context_link_operator_run13f.py'
      - 'v13/code/v13/agi/context_source_link_budget_run13e.py'
      - 'v13/code/tests/test_jeflink_sqlite_failclosed_run13h.py'
      - 'v13/code/docs/RUN13H_JEFLINK_SQLITE_FAILCLOSED_PREREG_20261030.md'
      - 'v13/code/docs/BUILD_STATE_RUN13H_JEFLINK_SQLITE_FAILCLOSED_20261030.json'
permissions:
  contents: read
concurrency:
  group: v13-run13h-jeflink-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: SQLite failure containment and inherited source-link tests
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run13h-jeflink"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/v13/jef_context_link_operator_run13f.py v13/code/v13/agi/context_source_link_budget_run13e.py v13/code/tests/test_jeflink_sqlite_failclosed_run13h.py v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/SOURCE_BLOBS.txt"
          test "$(tail -1 "$e/SOURCE_BLOBS.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          echo "$?" > "$e/CANON_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run13h-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run13h-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --no-input --disable-pip-version-check -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else
            echo SKIPPED > "$e/DEPS_RAW.log"
            echo SKIPPED > "$e/DEPS_EXIT.txt"
          fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts timeout 480s "$py" -m unittest -v tests.test_jeflink_sqlite_failclosed_run13h tests.test_jeflink_last_run13g tests.test_jeflink_operator_run13f tests.test_context_source_link_budget_run13e) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo DEPENDENCIES_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/v13/jef_context_link_operator_run13f.py v13/code/v13/agi/context_source_link_budget_run13e.py v13/code/tests/test_jeflink_sqlite_failclosed_run13h.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 4c789ae85758ca71bf86dd5067ab697913071a51 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 4c789ae85758ca71bf86dd5067ab697913071a51 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve raw and hashes on RED and GREEN
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run13h-jeflink-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run13h-jeflink/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce no regressions and no promotion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run13h-jeflink"
          for stage in CANON VENV DEPS TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained"
              tail -80 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'RUN13H_SQLITE_CONTAINMENT_SOFTWARE_ONLY_NO_GATE_PROMOTION'
