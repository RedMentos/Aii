name: V13 Run13D C2 numeric v1-v2 learned-route synthetic transfer
on:
  push:
    branches:
      - 'assistant/v13-run13d-c2-numeric-generalization-20261030-auto11'
    paths:
      - '.github/workflows/v13-run13d-c2-numeric-generalization-20261030.yml'
      - 'v13/code/scripts/c2_route_numeric_generalization_run13d.py'
      - 'v13/code/tests/test_c2_route_numeric_generalization_run13d.py'
      - 'v13/code/docs/RUN13D_C2_ROUTE_NUMERIC_GENERALIZATION_PREREG_20261030.md'
permissions:
  contents: read
concurrency:
  group: v13-run13d-c2-numeric-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-learning:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen cohort training, focused tests and raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run13d-c2-numeric"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/v13/route_words.py v13/code/v13/route_words_numeric_candidate.py v13/code/v13/learning_worker.py v13/code/scripts/c2_route_numeric_generalization_run13d.py v13/code/tests/test_c2_route_numeric_generalization_run13d.py v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/SOURCE_BLOBS.txt"
          test "$(head -1 "$e/SOURCE_BLOBS.txt")" = 901f993ce815a1ccc10808c6d3272078d4300580 && test "$(sed -n '2p' "$e/SOURCE_BLOBS.txt")" = 1ba6ec6c1b2002cbc44164286404cd9d915b2cac && test "$(tail -1 "$e/SOURCE_BLOBS.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          echo "$?" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run13d-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run13d-venv/bin/python"
          "$py" -m pip install --no-input --disable-pip-version-check -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts timeout 480s "$py" -m unittest -v tests.test_c2_route_numeric_generalization_run13d tests.test_route_words_numeric_candidate_20261030 tests.test_route_words) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
            (cd v13/code && PYTHONPATH=.:tests:scripts timeout 180s "$py" -m scripts.c2_route_numeric_generalization_run13d) > "$e/RESULT_RAW.json" 2> "$e/RESULT_STDERR.log"
            echo "$?" > "$e/RESULT_EXIT.txt"
          else echo DEPENDENCIES_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; echo DEPENDENCIES_RED > "$e/RESULT_STDERR.log"; echo 99 > "$e/RESULT_EXIT.txt"; fi
          "$py" -m py_compile v13/code/scripts/c2_route_numeric_generalization_run13d.py v13/code/tests/test_c2_route_numeric_generalization_run13d.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 7baea8983bf4aeb7ebe24fda19b79e97b46a136c --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 7baea8983bf4aeb7ebe24fda19b79e97b46a136c HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original result and all raw exits
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run13d-c2-numeric-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run13d-c2-numeric/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce tests without hiding negative outcomes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run13d-c2-numeric"
          for stage in PINS VENV DEPS TEST RESULT COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; raw retained"
              tail -90 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'RUN13D_SYNTHETIC_ROUTE_TRANSFER_NO_NATIVE_HEAD_AUTHORITY_OR_GATE_PROMOTION'
