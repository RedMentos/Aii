name: V13 Run20 Resource live sensor finite original RED
on:
  push:
    branches: [assistant/v13-run20-resource-sensor-finite-20261030-hourly11]
    paths: ['.github/workflows/v13-run20-sensor-original-red.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve exact-source original test-first result
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run20-original"; mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          44f7cd3d727b1b9cfdf4d8089bdad0ddb80e88f3 v13/code/docs/RESOURCE_SENSOR_FINITE_PREREG_RUN20_20261030.md
          1b6f7e59af0c8c0f8579e0561f7bdeec91e4cd06 v13/code/tests/test_resource_sensor_finite_run20.py
          d8325b0a05bec623bc45b30a1a26de3d7ca176f4 v13/code/v13/resource_modes.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run20-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run20-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
          echo "$?" > "$e/PIP_CHECK_EXIT.txt"
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 8m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_resource_sensor_finite_run20) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PREREQUISITE > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          python3 -m compileall -q v13/code/v13/resource_modes.py v13/code/tests/test_resource_sensor_finite_run20.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 07b72767342308567cd32e562d3166fb397f56ce --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 07b72767342308567cd32e562d3166fb397f56ce HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run20-original-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run20-original/
          retention-days: 30
          if-no-files-found: error
      - name: Require prereg, compile, privacy, and expose original RED
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run20-original"
          for stage in PINS VENV DEPS PIP_CHECK COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            [ "$(cat "$e/${stage}_EXIT.txt")" = 0 ] || exit 1
          done
          echo "TEST_EXIT=$(cat "$e/TEST_EXIT.txt")"
          tail -90 "$e/TEST_RAW.log"
          [ "$(cat "$e/TEST_EXIT.txt")" != 0 ]
