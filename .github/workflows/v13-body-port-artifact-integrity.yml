name: V13 native body port artifact integrity
on:
  push:
    branches:
      - codex/v13-body-port-artifact-integrity-20261109
  pull_request:
    paths:
      - 'v13/code/v13/body_training.py'
      - 'v13/code/tests/test_body_training_port.py'
      - '.github/workflows/v13-body-port-artifact-integrity.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Body port contract tests
        working-directory: v13/code
        run: python -m unittest discover -s tests -p test_body_training_port.py -v
