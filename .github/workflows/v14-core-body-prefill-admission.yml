name: V14 Core B1/B2 prefill and C5 source context

on:
  push:
    branches:
      - core/v14-body-prefill-admission-20261128-run1
    paths:
      - "v13/code/v13/native_prompt_admission.py"
      - "v13/code/v13/native_prefill_rate.py"
      - "v13/code/v13/runtime_deploy.py"
      - "v13/code/scripts/stage_integrated_candidate.py"
      - "v13/code/scripts/integrated_action_selection_source_refs_candidate_20261128.py"
      - "v13/code/tests/test_body_prefill_soft_budget_20261128.py"
      - "v13/code/tests/test_native_prefill_rate_20261128.py"
      - "v13/code/tests/test_action_selection_context_sources_20261128.py"
      - "v13/code/tests/test_native_prompt_admission.py"
      - "v13/code/tests/test_native_turn_budget.py"
      - "v13/code/tests/test_native_offer_prompt_receipt_20261118.py"
      - "v13/code/tests/test_v14_exact_arithmetic_runtime_20261121.py"
      - ".github/workflows/v14-core-body-prefill-admission.yml"
  pull_request:
    paths:
      - "v13/code/v13/native_prompt_admission.py"
      - "v13/code/v13/native_prefill_rate.py"
      - "v13/code/v13/runtime_deploy.py"
      - "v13/code/scripts/stage_integrated_candidate.py"
      - "v13/code/scripts/integrated_action_selection_source_refs_candidate_20261128.py"
      - "v13/code/tests/test_body_prefill_soft_budget_20261128.py"
      - "v13/code/tests/test_native_prefill_rate_20261128.py"
      - "v13/code/tests/test_action_selection_context_sources_20261128.py"
      - "v13/code/tests/test_native_prompt_admission.py"
      - "v13/code/tests/test_native_turn_budget.py"
      - "v13/code/tests/test_native_offer_prompt_receipt_20261118.py"
      - "v13/code/tests/test_v14_exact_arithmetic_runtime_20261121.py"
      - ".github/workflows/v14-core-body-prefill-admission.yml"

permissions:
  contents: read

jobs:
  core-native-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest 'numpy>=2.2,<3'
      - name: Compile exact Core and stage sources
        run: |
          python -m py_compile \
            v13/code/v13/native_prompt_admission.py \
            v13/code/v13/native_prefill_rate.py \
            v13/code/v13/runtime_deploy.py \
            v13/code/scripts/stage_integrated_candidate.py \
            v13/code/scripts/integrated_action_selection_source_refs_candidate_20261128.py \
            v13/code/tests/test_body_prefill_soft_budget_20261128.py \
            v13/code/tests/test_native_prefill_rate_20261128.py \
            v13/code/tests/test_action_selection_context_sources_20261128.py \
            v13/code/tests/test_native_prompt_admission.py \
            v13/code/tests/test_native_turn_budget.py \
            v13/code/tests/test_native_offer_prompt_receipt_20261118.py \
            v13/code/tests/test_v14_exact_arithmetic_runtime_20261121.py
      - name: Run body admission, measured prefill, staged C5 source, C3 token-span and exact arithmetic regressions
        env:
          PYTHONPATH: v13/code
        run: |
          python -m pytest -q \
            v13/code/tests/test_body_prefill_soft_budget_20261128.py \
            v13/code/tests/test_native_prefill_rate_20261128.py \
            v13/code/tests/test_action_selection_context_sources_20261128.py \
            v13/code/tests/test_native_prompt_admission.py \
            v13/code/tests/test_native_turn_budget.py \
            v13/code/tests/test_native_offer_prompt_receipt_20261118.py \
            v13/code/tests/test_v14_exact_arithmetic_runtime_20261121.py
      - name: Stage the exact integrated Termux candidate
        run: |
          python v13/code/scripts/stage_integrated_candidate.py \
            --output "$RUNNER_TEMP/v14-core-native-inputs-stage"
      - name: Re-run production admission and C3 token-span tests against staged Runtime
        env:
          PYTHONPATH: ${{ runner.temp }}/v14-core-native-inputs-stage
        run: |
          python -m pytest -q \
            v13/code/tests/test_body_prefill_soft_budget_20261128.py \
            v13/code/tests/test_native_prefill_rate_20261128.py \
            v13/code/tests/test_native_prompt_admission.py \
            v13/code/tests/test_native_offer_prompt_receipt_20261118.py
      - name: Check patch whitespace
        run: git diff --check
