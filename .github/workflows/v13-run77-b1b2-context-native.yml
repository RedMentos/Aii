name: V13 Run77 disjoint B1 B2 two-turn context utility Linux native
on:
  push:
    branches: [assistant/v13-run77-b1b2-disjoint-context-utility-20261031-auto11]
    paths: ['.github/workflows/v13-run77-b1b2-context-native.yml']
permissions:
  contents: read
concurrency:
  group: v13-step2-budget-paired-native-20261030
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen disjoint fixture, pinned native bootstrap and 36 paired body offers
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run77-native"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          afdca4d0d227c1fd04a5b7fda01e3bb0d38a9a5e v13/code/docs/RUN77_B1B2_DISJOINT_CONTEXT_UTILITY_PREREG_20261031.md
          6044d7bb48d7c8de0801cce96c6af466b1f9d547 v13/code/scripts/jef_b1b2_context_fixture_797.py
          eebd79d1a454b9b3dcda42be425666ad3e609cd6 v13/code/scripts/run77_b1b2_context_native.py
          e42222c39d9a065b653b21374f336be363d6ea87 v13/code/scripts/run77_b1b2_context_verify.py
          a848c3b924d32e3d69cbccbb75e23837d372f3a1 v13/code/tests/test_run77_b1b2_context_fixture.py
          7c1ea152d511783a47a1e55cc6a968ecd9d7e338 v13/code/v13/b1b2_latest_user_offer_candidate.py
          277d34a46b14633c52b5e7d59b3fdf0f16ea4159 v13/code/v13/b1b2_topic_partition_candidate.py
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run77-native-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run77-native-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m unittest discover -s v13/code/tests -p test_run77_b1b2_context_fixture.py -v > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          export V13_HOME="$RUNNER_TEMP/v13-run77-native-installed"
          if [ "$(cat "$e/TEST_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 15m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m v13.bootstrap --home "$V13_HOME" > "$e/BOOTSTRAP_RAW.log" 2>&1
            echo "$?" > "$e/BOOTSTRAP_EXIT.txt"
          else echo SKIPPED > "$e/BOOTSTRAP_RAW.log"; echo 99 > "$e/BOOTSTRAP_EXIT.txt"; fi
          if [ "$(cat "$e/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 70m env PYTHONPATH=v13/code:v13/code/scripts "$py" v13/code/scripts/run77_b1b2_context_native.py --home "$V13_HOME" --out "$e/pilot" > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else echo SKIPPED > "$e/NATIVE_RAW.log"; echo 99 > "$e/NATIVE_EXIT.txt"; fi
          if [ -f "$e/pilot/report.json" ]; then
            timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=v13/code:v13/code/scripts "$py" v13/code/scripts/run77_b1b2_context_verify.py "$e/pilot/report.json" > "$e/VERIFY_RAW.log" 2>&1
            echo "$?" > "$e/VERIFY_EXIT.txt"
          else echo NO_REPORT > "$e/VERIFY_RAW.log"; echo 99 > "$e/VERIFY_EXIT.txt"; fi
          python3 -m compileall -q v13/code/scripts/jef_b1b2_context_fixture_797.py v13/code/scripts/run77_b1b2_context_native.py v13/code/scripts/run77_b1b2_context_verify.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 98c7951720f812d7f65aee97dcfbc222cf252edc --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 98c7951720f812d7f65aee97dcfbc222cf252edc HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Retain original native raw including scientific and structural RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run77-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run77-native/
          if-no-files-found: error
          retention-days: 90
      - name: Require engineering and independent reparse
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-run77-native"
          for s in PINS VENV DEPS TEST BOOTSTRAP NATIVE VERIFY COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN77_NATIVE_ENGINEERING_COMPLETE_SCIENTIFIC_SCORE_MAY_BE_RED
