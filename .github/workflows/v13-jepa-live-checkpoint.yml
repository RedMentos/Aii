name: V13 JEPA checkpoint live-state validation
on:
  push:
    branches:
      - 'jepa/reject-invalid-checkpoint-*'
  pull_request:
    paths:
      - 'v13/code/v13/continuous_predictor.py'
      - 'v13/code/tests/test_online_predictor_live_checkpoint.py'
      - '.github/workflows/v13-jepa-live-checkpoint.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - working-directory: v13/code
        run: python -m unittest -v tests.test_online_predictor_live_checkpoint tests.test_online_predictor_nonfinite_loss tests.test_online_predictor_cursor_retention
