name: V13 Run116 seed1019 pinned native B1B2 JEF C3 three-arm pilot
on:
  push:
    branches:
      - assistant/v13-run116-b1b2-jef-c3-native-pilot-20261031-gpt6
    paths:
      - .github/workflows/v13-run116-b1b2-jef-c3-native.yml
permissions:
  contents: read
concurrency:
  group: v13-native-c3-ag12-20261030
  cancel-in-progress: false
jobs:
  native-crossorgan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      V13_NO_AUTOSTART: "1"
      DO_NOT_TRACK: "1"
      NEEDLE_TELEMETRY: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source ZIP and preflight; install pinned three models; run native pilot
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run116-native"
          source_root="$RUNNER_TEMP/v13-run116-extracted/V13-Phone"
          installed="$RUNNER_TEMP/v13-run116-installed"
          fixture="$GITHUB_WORKSPACE/v13/code/docs/fixtures/RUN116_B1B2_JEF_C3_SEED1019.json"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run116-native-venv" > "$e/VENV_RAW.log" 2>&1
          py="$RUNNER_TEMP/v13-run116-native-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q \
            'numpy==2.2.6' 'prompt-toolkit==3.0.52' psutil PyYAML Pillow > "$e/DEPS_RAW.log" 2>&1
          "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log"
          set +e
          "$py" v13/code/scripts/package_source.py --root v13/code --out "$e/V13-Phone-Run116-Native.zip" --phone-install > "$e/PACK_RAW.log" 2>&1
          pack_rc=$?
          set -e
          echo "$pack_rc" > "$e/PACK_EXIT.txt"
          if test "$pack_rc" -eq 0; then
            set +e
            "$py" - "$e" "$RUNNER_TEMP/v13-run116-extracted" "$fixture" <<'PY' > "$e/ZIP_RAW.log" 2>&1
          import hashlib,json,sys,zipfile
          from pathlib import Path
          e=Path(sys.argv[1]);dest=Path(sys.argv[2]);fixture=Path(sys.argv[3])
          p=e/'V13-Phone-Run116-Native.zip'
          assert hashlib.sha256(fixture.read_bytes()).hexdigest()=='e31e2d68331cc4280e161b2dbdbd022f493325ca234f050cda06065fa6775a69'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              manifest=json.loads(z.read('V13-Phone/WORKSPACE_FILES.json'))
              assert manifest['schema_version']==1
              assert set(z.namelist())=={'V13-Phone/'+x for x in manifest['files']}|{'V13-Phone/WORKSPACE_FILES.json'}
              for name,digest in manifest['files'].items():
                  assert hashlib.sha256(z.read('V13-Phone/'+name)).hexdigest()==digest,name
              for name in ('scripts/run116_b1b2_jef_c3_native.py',
                           'v13/b1b2_jef_c3_source_role_bridge_candidate.py',
                           'docs/fixtures/RUN116_B1B2_JEF_C3_SEED1019.json'):
                  assert z.read('V13-Phone/'+name)==(Path('v13/code')/name).read_bytes()
              z.extractall(dest)
          print(json.dumps({'source_files':len(manifest['files']),
                            'phone_zip_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                            'fixture_sha256':hashlib.sha256(fixture.read_bytes()).hexdigest(),
                            'redmi_measured':False},sort_keys=True))
          PY
            zip_rc=$?
            set -e
          else
            zip_rc=125;echo 'PACK_RED' > "$e/ZIP_RAW.log"
          fi
          echo "$zip_rc" > "$e/ZIP_EXIT.txt"
          if test "$zip_rc" -eq 0; then
            set +e
            (cd "$source_root" && env PYTHONPATH=.:scripts:tests "$py" scripts/run116_b1b2_jef_c3_native.py --fixture "$fixture" --work "$RUNNER_TEMP/v13-run116-preflight-work" --out "$e/PREFLIGHT") > "$e/PREFLIGHT_RAW.log" 2>&1
            preflight_rc=$?
            if test "$preflight_rc" -eq 0; then
              (cd "$source_root" && env PYTHONPATH=.:scripts:tests "$py" scripts/run93_source_c3_native_e2e.py --home "$installed" --install) > "$e/INSTALL_C3_RAW.log" 2>&1
              install_c3_rc=$?
            else
              install_c3_rc=125;echo 'PREFLIGHT_RED' > "$e/INSTALL_C3_RAW.log"
            fi
            if test "$install_c3_rc" -eq 0; then
              (cd "$source_root" && env PYTHONPATH=.:scripts:tests "$py" - "$installed" <<'PY') > "$e/INSTALL_BODIES_RAW.log" 2>&1
          from pathlib import Path
          import sys,json
          from v13.models import ModelManager,catalog
          from v13.common import file_hash
          home=Path(sys.argv[1]);m=ModelManager(home)
          pins={'body':('6767265158422fb8a19c62ceb45f16f05363615b','bb741ebb106d543e9de114b843a3d3d73d51c74b5801e69da2abde821a0cb3e1'),
                'gist':('8fea620810c4afa23dd6443f999a48574c1611a3','57d1997790d1744fba5b40a7317df71ea5e2acee28c47e78f0cce39c0703f8cf')}
          for key,role in (('body','B1_DETAIL'),('gist','B2_GIST')):
              m.install(key)
              s=catalog()['models'][key]
              assert (s['revision'],s['files'][0]['sha256'])==pins[key]
              assert m.verify(deep=True)[key]['ok']
              assert file_hash(m.path_for(role))==pins[key][1]
          print(json.dumps({'status':'RUN116_PINNED_B1_B2_INSTALLED',
                            'model_sha256':{k:v[1] for k,v in pins.items()},
                            'weights_exported':False},sort_keys=True))
          PY
              install_bodies_rc=$?
            else
              install_bodies_rc=125;echo 'C3_INSTALL_RED' > "$e/INSTALL_BODIES_RAW.log"
            fi
            if test "$install_bodies_rc" -eq 0; then
              (cd "$source_root" && env PYTHONPATH=.:scripts:tests "$py" scripts/run116_b1b2_jef_c3_native.py --fixture "$fixture" --installed "$installed" --work "$RUNNER_TEMP/v13-run116-native-work" --out "$e/NATIVE_CASE") > "$e/NATIVE_RAW.log" 2>&1
              native_rc=$?
            else
              native_rc=125;echo 'BODY_INSTALL_RED' > "$e/NATIVE_RAW.log"
            fi
            set -e
          else
            preflight_rc=125;install_c3_rc=125;install_bodies_rc=125;native_rc=125
            for n in PREFLIGHT INSTALL_C3 INSTALL_BODIES NATIVE; do echo 'ZIP_RED' > "$e/${n}_RAW.log"; done
          fi
          for item in "PREFLIGHT:$preflight_rc" "INSTALL_C3:$install_c3_rc" "INSTALL_BODIES:$install_bodies_rc" "NATIVE:$native_rc"; do
            echo "${item#*:}" > "$e/${item%%:*}_EXIT.txt"
          done
          if test "$native_rc" -eq 0; then
            set +e
            "$py" - "$e" <<'PY' > "$e/VERIFY_RAW.log" 2>&1
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1]);r=json.loads((e/'NATIVE_CASE/report.json').read_text())
          arms={'RAW_TWO_SOURCE_ROLE','TYPED_JEF_ROLE','TYPED_JEF_WITH_BODY_ROLE'}
          assert r['schema']=='v13.run116.b1b2_jef_c3_native.v1'
          assert r['seed']==1019 and r['fixture_sha256']=='e31e2d68331cc4280e161b2dbdbd022f493325ca234f050cda06065fa6775a69'
          assert r['native'] is True and r['synthetic_body_observers'] is False
          assert r['status'] in ('NATIVE_COMPLETE_NONINTERFERENCE_SIGNAL',
                                 'NATIVE_COMPLETE_NO_NONINTERFERENCE_SIGNAL')
          assert r['native_body_calls']==18 and r['native_c3_calls']==18
          assert r['native_c2_calls']==0 and r['native_jef_calls']==0
          assert len(r['rows'])==6 and set(r['scores'])==arms
          assert all(0<=v<=6 for v in r['scores'].values())
          assert r['exploratory_noninterference_signal'] is (
              r['scores']['TYPED_JEF_WITH_BODY_ROLE']>=5 and
              r['scores']['TYPED_JEF_WITH_BODY_ROLE']>=r['scores']['TYPED_JEF_ROLE']-1 and
              all(next(a for a in row['arms'] if a['arm']=='TYPED_JEF_WITH_BODY_ROLE')['score']['parsed']
                  == {'choice':'NONE','remaining':None}
                  for row in r['rows'] if row['id'] in ('Cetus','Fjord')))
          for row in r['rows']:
              assert row['status']=='RECORDED' and row['closed_store_ok'] is True
              assert row['no_live_output'] is True
              assert len(row['offers'])==3 and len(row['arms'])==3
              assert type(row['verified_quote_count']) is int and row['verified_quote_count']>=0
              assert [(x['role'],x['phase']) for x in row['offers']]==[
                  ('B2_GIST','prior'),('B1_DETAIL','current'),('B2_GIST','current')]
              assert all(x['status']=='RECORDED' and x['process_reaped'] is True
                         and x['native_metrics']['status']=='FINAL'
                         for x in row['offers'])
              assert set(x['arm'] for x in row['arms'])==arms
              for a in row['arms']:
                  assert a['status']=='RECORDED' and a['native_final'] is True
                  assert a['process_reaped'] is True
                  assert a['native_metrics']['status']=='FINAL'
                  assert a['native_metrics']['actual_model']=='LFM2.5-350M-QAD-Q4_0.gguf'
                  assert [m['role'] for m in a['messages']]==['system','user']
                  assert 'oracle' not in a['messages'][0]['content'].lower()
                  assert a['score'] is not None
          assert r['age0']=='RECORD_ONLY' and r['step2_exit']=='EVIDENCE_NOT_PASSING'
          assert r['b3']=='NO_PROMOTION' and r['body_jepa']=='UNAVAILABLE'
          assert r['world_jepa']=='SHADOW' and r['jepa_weight']==0
          assert r['output_committed'] is False and r['tool_dispatches']==0
          assert r['learning_authority']==0 and r['delivery_authority']==0
          assert r['whole_system_complete'] is False and r['redmi_measured'] is False
          print(json.dumps({'status':r['status'],'scores':r['scores'],
                            'exploratory_noninterference_signal':r['exploratory_noninterference_signal'],
                            'native_body_calls':18,'native_c3_calls':18,
                            'step2_promoted':False},sort_keys=True))
          PY
            verify_rc=$?
            set -e
          else
            verify_rc=125;echo 'NATIVE_RED_NOT_PROMOTED' > "$e/VERIFY_RAW.log"
          fi
          echo "$verify_rc" > "$e/VERIFY_EXIT.txt"
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base b8c1f059f4ecb3fb1f1c2533a2c5310e75aea8de --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          privacy_rc=$?
          git diff --check b8c1f059f4ecb3fb1f1c2533a2c5310e75aea8de HEAD > "$e/DIFF_RAW.log" 2>&1
          diff_rc=$?
          set -e
          echo "$privacy_rc" > "$e/PRIVACY_EXIT.txt"
          echo "$diff_rc" > "$e/DIFF_EXIT.txt"
          "$py" - "$e" <<'PY' > "$e/RESULT_RAW.log"
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1]);names=['PACK','ZIP','PREFLIGHT','INSTALL_C3','INSTALL_BODIES','NATIVE','VERIFY','PRIVACY','DIFF']
          r={'schema':'v13.run116.seed1019.native_evidence.v1',
             'head':(e/'HEAD.txt').read_text().strip(),
             'exits':{n:int((e/(n+'_EXIT.txt')).read_text()) for n in names},
             'native_attempted':int((e/'NATIVE_EXIT.txt').read_text())!=125,
             'native_c2_executed':False,'native_jef_executed':False,
             'redmi_measured':False,'step2_promoted':False,
             'b3_promoted':False,'body_jepa_promoted':False}
          (e/'RESULT.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat "$e/RESULT_RAW.log"
          tail -n 16 "$e/NATIVE_RAW.log"
          for rc in "$pack_rc" "$zip_rc" "$preflight_rc" "$install_c3_rc" "$install_bodies_rc" "$native_rc" "$verify_rc" "$privacy_rc" "$diff_rc"; do test "$rc" -eq 0; done
      - name: Preserve original native GREEN or RED without weights
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run116-seed1019-native-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run116-native/
          if-no-files-found: warn
          retention-days: 90
