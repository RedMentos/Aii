name: V13 Run14X Sleep policy original test-first RED
on:
  push:
    branches: [assistant/v13-run14x-sleep-policy-cas-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run14x-sleep-original-red.yml'
permissions:
  contents: read
jobs:
  sleep:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve original F9 Sleep policy test-first raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run14x-original"; mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          21ef598dee658fe0629dd3a770a13f93f309d811 v13/code/docs/SLEEP_POLICY_CAS_PREREG_RUN14X_20261030.md
          1a57db25ca669c0895e963f2070247bdb834e4ad v13/code/tests/test_sleep_policy_cas_run14x.py
          90d5361d1f8ad34c2311e870572a1d40146e4ca0 v13/code/v13/sleep.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run14x-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run14x-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
          echo "$?" > "$e/PIP_CHECK_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 6m env PYTHONPATH=.:tests "$py" -m unittest -v \
            tests.test_sleep_policy_cas_run14x tests.test_sleep_scheduler tests.test_sleep_validation) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m compileall -q v13/code/v13/sleep.py v13/code/tests/test_sleep_policy_cas_run14x.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base ef8f6d0bda3d6b19e2280c4bafeed4658639de55 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check ef8f6d0bda3d6b19e2280c4bafeed4658639de55 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve complete original raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run14x-original-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run14x-original/
          retention-days: 30
          if-no-files-found: error
      - name: Require setup and expose original RED
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run14x-original"
          for stage in PINS VENV DEPS PIP_CHECK COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            test "$(cat "$e/${stage}_EXIT.txt")" = 0
          done
          echo "ORIGINAL_TEST_EXIT=$(cat "$e/TEST_EXIT.txt")"
          tail -65 "$e/TEST_RAW.log"
          test "$(cat "$e/TEST_EXIT.txt")" = 0
