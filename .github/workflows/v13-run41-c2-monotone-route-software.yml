name: V13 Run41 C2 JEF monotone advisory software SHADOW
on:
  push:
    branches: [assistant/v13-run41-c2-monotone-advisory-20261031-hourly11]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Frozen source pins and software/negative controls
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run41-software"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          3879e099d33f86c8e08c66e4c1f5626626c5c3d4 v13/code/docs/C2_JEF_MONOTONE_ROUTE_PREREG_RUN41_20261031.md
          3ce13313b351cb8bcc40ba2da296ac1e287fee47 v13/code/v13/c2_monotone_route_shadow.py
          3f403af851af2877750bfff2a73f62c0e9c317bf v13/code/tests/test_c2_monotone_route_shadow.py
          22ed11e4a53d9eeae8fbc74a1753082b5785be2b v13/code/v13/runtime.py
          1b353cf79ca2291c6ec4cf7b69eb926a63a1b48b v13/code/v13/control_calibration_worker.py
          563a6db17c1331f5eaa9f6549502f8afc460ad57 v13/code/v13/effort.py
          1a9eb6f7c7cbfce83d91cc09b4ff9516cff310cf v13/code/v13/cognition.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run41-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run41-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests "$py" -m unittest -v tests.test_c2_monotone_route_shadow tests.test_c2_route_admission_shadow tests.test_control_calibration tests.test_effort_learned_band_run14v) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo PIN_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/v13/c2_monotone_route_shadow.py v13/code/tests/test_c2_monotone_route_shadow.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          git fetch --no-tags --depth=1 origin 6b9bcfba3837b0360ae8a43c49bfdeb471f36999 > "$e/FETCH_RAW.log" 2>&1
          echo "$?" > "$e/FETCH_EXIT.txt"
          python3 - > "$e/PRIVACY_RAW.log" 2>&1 <<'PY'
          import subprocess,sys
          sys.path.insert(0,'v13/code')
          from scripts.public_repo_privacy_scan import scan
          d=subprocess.check_output(['git','diff','--no-color','-U0','--text','6b9bcfba3837b0360ae8a43c49bfdeb471f36999','HEAD'],text=True)
          hits=scan(d)
          print('privacy','CLEAN' if not hits else hits)
          sys.exit(bool(hits))
          PY
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 6b9bcfba3837b0360ae8a43c49bfdeb471f36999 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original software raw including failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run41-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run41-software/
          if-no-files-found: error
          retention-days: 90
      - name: Require all stages zero and no native or age authority
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-run41-software"
          for s in PINS VENV DEPS TEST COMPILE FETCH PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN41_C2_MONOTONE_SOFTWARE_SHADOW_NO_RUNTIME_ROUTE_OR_AGE_PROMOTION
