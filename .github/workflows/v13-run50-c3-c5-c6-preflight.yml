name: V13 Run50 seed443 native C3 C5 C6 draft software preflight
on:
  push:
    branches: [assistant/v13-run50-native-c3-c5-c6-draft-20261031-hourly11]
    paths: ['.github/workflows/v13-run50-c3-c5-c6-preflight.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen pins and synthetic C3 fake with real SQLite C5 C6
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run50-preflight"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          d54962cbaeb8c5475e5f2c4cbcbd6199032e2d23 v13/code/docs/fixtures/run50_native_c3_c5_c6_draft_seed443.json
          fcf2aaf6511ddfaa8bfc5d239967bfd9664b1a70 v13/code/docs/RUN50_NATIVE_C3_C5_C6_DRAFT_PREREG_20261031.md
          a541f17b607b1307713fc8d5fa0b81fb95f46be9 v13/code/scripts/run50_native_c3_c5_c6_draft.py
          c3f83500b2d9e1f7787792e124ee688834206bc7 v13/code/scripts/run50_native_c3_c5_c6_draft_verify.py
          dc49ed5833a8487471f5af74dfc17790490e1d36 v13/code/tests/test_run50_native_c3_c5_c6_draft.py
          4705a46640134e213aa00a86e02375d972c76cda v13/code/scripts/run47_jef_c3_typed_receiver_native.py
          d684572065fa220becf72a888b6303c4467ab8f3 v13/code/scripts/run47_jef_c3_typed_receiver_verify.py
          075e563cec10e08b3f285ad138ee5d955de10bf0 v13/code/v13/agi/jef_c3_c5_c6_draft_shadow_run49.py
          0779d986fb8aee8aa01c5df5f656889d4bd56348 v13/code/v13/store.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          sha256sum v13/code/docs/fixtures/run50_native_c3_c5_c6_draft_seed443.json > "$e/FIXTURE_RAW.log" 2>&1
          test "$(cut -d' ' -f1 "$e/FIXTURE_RAW.log")" = 7e05d20beb53653c86fe0ed83c12befba766ec0110be03ce9ea58569865e350c
          echo "$?" > "$e/FIXTURE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run50-preflight-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run50-preflight-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/FIXTURE_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_run50_native_c3_c5_c6_draft tests.test_run49_c5_c6_draft_shadow tests.test_run48_jef_c3_final_agreement_shadow tests.test_run46b_jef_source_eligibility_shadow) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PINS_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/scripts/run50_native_c3_c5_c6_draft.py v13/code/scripts/run50_native_c3_c5_c6_draft_verify.py v13/code/tests/test_run50_native_c3_c5_c6_draft.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 8c972f9c647aae5a88974b1917a25589620dee9e --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 8c972f9c647aae5a88974b1917a25589620dee9e HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run50-preflight-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run50-preflight/
          retention-days: 90
          if-no-files-found: error
      - name: Require all eight stages zero
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run50-preflight"
          for s in PINS FIXTURE VENV DEPS TEST COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN50_SOFTWARE_FAKE_C3_REAL_SQLITE_NO_NATIVE_CLAIM
