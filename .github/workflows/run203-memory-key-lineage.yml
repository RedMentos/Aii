name: Run203 Memory human-key source integrity (software)
on:
  pull_request:
    paths:
      - 'v13/code/v13/memory.py'
      - 'v13/code/tests/test_memory_recall_key_lineage_run203.py'
      - '.github/workflows/run203-memory-key-lineage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Isolated software prerequisites
        run: python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Actual Memory.recall, human correction, route and semantic regressions
        working-directory: v13/code
        run: |
          python -m unittest -v tests.test_memory_recall_key_lineage_run203 tests.test_retrieval tests.test_semantic_memory tests.test_episodic_route_source_run107 tests.test_executive_context
          python -m compileall -q v13/memory.py tests/test_memory_recall_key_lineage_run203.py
      - name: Official public repository privacy scan
        run: python v13/code/scripts/public_repo_privacy_scan.py --base 3a63cb85a5cf2c45f8ba06885d12ddc504a2a076 --head HEAD --no-worktree
      - name: Claim boundary
        run: echo 'SOFTWARE/SYNTHETIC SQLite only; no native model or Redmi memory quality proof'
