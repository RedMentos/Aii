name: V13 AG6 rated dependency lifecycle software review
on:
  push:
    branches: [codex/v13-ag6-rated-dependency-lifecycle-20261029-auto10m]
    paths: ['.github/workflows/v13-ag6-rated-dependency-lifecycle-20261029.yml', 'v13/code/v13/agi/weights.py', 'v13/code/tests/test_ag6_rated_dependency_lifecycle_20261029.py']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Preserve exact source and focused outcomes
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/ag6-rated-dependency-lifecycle"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/v13/agi/weights.py v13/code/tests/test_ag6_rated_dependency_lifecycle_20261029.py > "$e/SOURCE_BLOBS.txt"
          python3 -m venv "$RUNNER_TEMP/venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests:scripts "$RUNNER_TEMP/venv/bin/python" -m unittest -v tests.test_ag6_rated_dependency_lifecycle_20261029 tests.test_ag6_approval_source_revocation_20261029 tests.test_ag6_staged_source_revocation_20261029 tests.test_ag6_rated_answer_dependencies_20261029 tests.test_ag6_rated_source_admission_20261029 tests.test_weight_approval_atomic) > "$e/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$e/FOCUSED_EXIT.txt"
          python3 -m compileall -q v13/code/v13/agi/weights.py v13/code/tests/test_ag6_rated_dependency_lifecycle_20261029.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 89a7422916d60b6a0966713eb584c725069c9f2c --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 89a7422916d60b6a0966713eb584c725069c9f2c HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Upload original RED or candidate GREEN evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ag6-rated-dependency-lifecycle-${{ github.sha }}
          path: ${{ runner.temp }}/ag6-rated-dependency-lifecycle/
          if-no-files-found: error
      - name: Enforce checks without concealing original RED
        shell: bash
        run: |
          e="$RUNNER_TEMP/ag6-rated-dependency-lifecycle"
          for n in VENV DEPS FOCUSED COMPILE PRIVACY DIFF; do
            test "$(cat "$e/${n}_EXIT.txt")" = 0 || { echo "$n failed"; exit 1; }
          done
