name: V13 Run11 SourceHandoff frozen historical fixture and C5 software
on:
  push:
    branches:
      - assistant/v13-run11-sourcehandoff-historical-fixture-20261028-0925
    paths:
      - '.github/workflows/run11-sourcehandoff-historical-fixture-20261028.yml'
      - 'v13/code/v13/focal.py'
      - 'v13/code/v13/runtime.py'
      - 'v13/code/tests/test_c5_manifest_proactive.py'
      - 'v13/code/tests/test_source_handoff_candidate.py'
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: "1"
      NO_MODEL_DOWNLOADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test C5 manifest guards and original full software without mutating frozen cohorts
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run11-sourcehandoff-fixture"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          643b9b585740c31866436199d6b2d01a0811d482 v13/code/v13/runtime.py
          d60476b1761e5d8400ba843f427bd7f2a82d08bb v13/code/v13/focal.py
          9933e75b12ddda19e1f956b446b2ac856e2be881 v13/code/tests/test_c5_manifest_proactive.py
          d27ea61b7c6cc87ef07ea57d18f9b1fa580c532a v13/code/tests/test_source_handoff_candidate.py
          82fb81c8a98c51ca1c339737184e2fda8ab6a692 v13/code/v13/bodies.py
          98d2378cf213be32ee0ad0fb6891c244279f6f0b v13/code/v13/actionlearn.py
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          BLOBS
          : > "$e/BLOBS_RAW.log"
          while read -r want file; do
            got="$(git hash-object "$file" 2>/dev/null)"
            printf '%s %s %s\n' "$want" "$got" "$file" >> "$e/BLOBS_RAW.log"
            if [ "$want" != "$got" ]; then echo MISMATCH >> "$e/BLOBS_RAW.log"; fi
          done < "$e/EXPECTED_BLOBS.txt"
          if grep -q MISMATCH "$e/BLOBS_RAW.log"; then echo 1 > "$e/BLOBS_EXIT.txt"; else echo 0 > "$e/BLOBS_EXIT.txt"; fi
          python3 -m venv "$RUNNER_TEMP/v13-run11-sourcehandoff-fixture-venv"
          py="$RUNNER_TEMP/v13-run11-sourcehandoff-fixture-venv/bin/python"
          "$py" -m pip install --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          first=$?
          "$py" -m pip install --no-input -q 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
          second=$?
          "$py" -m pip install --no-input -q 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
          third=$?
          if [ "$first" = 0 ] && [ "$second" = 0 ] && [ "$third" = 0 ]; then echo 0 > "$e/INSTALL_EXIT.txt"; else echo 1 > "$e/INSTALL_EXIT.txt"; fi
          if [ "$(cat "$e/BLOBS_EXIT.txt")" = 0 ] && [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 4m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_source_handoff_candidate tests.test_c5_manifest_proactive tests.test_actionlearn tests.test_focal) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else
            echo SKIPPED_PREREQ_RED > "$e/FOCUSED_RAW.log"
            echo SKIPPED_RED > "$e/FOCUSED_EXIT.txt"
          fi
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=.:tests "$py" -m unittest discover -s tests -p 'test_*.py' -q) > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else
            echo SKIPPED_FOCUSED_RED > "$e/FULL_RAW.log"
            echo SKIPPED_RED > "$e/FULL_EXIT.txt"
          fi
          python3 -m compileall -q v13/code/v13/focal.py v13/code/v13/runtime.py v13/code/tests/test_c5_manifest_proactive.py v13/code/tests/test_source_handoff_candidate.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 107526467ad9544934c62e0a9673673c3b756224 --head HEAD > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 107526467ad9544934c62e0a9673673c3b756224 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-run11-sourcehandoff-fixture-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run11-sourcehandoff-fixture/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce all original software and no gate promotion
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run11-sourcehandoff-fixture"
          for name in BLOBS INSTALL FOCUSED FULL COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${name}_EXIT.txt")" != 0 ]; then
              echo "$name RED; raw retained"
              tail -80 "$e/${name}_RAW.log" || true
              exit 1
            fi
          done
          echo 'SOURCE_HANDOFF_HISTORICAL_FIXTURE_SOFTWARE_ONLY_NO_NATIVE_OR_GATE_PROMOTION'
