name: V13 Run11 C2 frozen embedding routehead shadow software
on:
  push:
    branches:
      - assistant/v13-run11-c2-bilingual-routehead-shadow-20261028
    paths:
      - '.github/workflows/run11-c2-routehead-shadow-software-20261028.yml'
      - 'v13/code/scripts/c2_bilingual_routehead_shadow.py'
      - 'v13/code/tests/test_c2_bilingual_routehead_shadow.py'
      - 'v13/code/specs/c2-bilingual-routehead-train64-20261028.json'
permissions:
  contents: read
jobs:
  routehead-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: "1"
      NO_MODEL_DOWNLOADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact source and deterministic shadow optimizer full software review
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-c2-routehead-shadow-software"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          e944d33e544ff828adee8c9be3feb5e078726e99 v13/code/specs/c2-bilingual-routehead-train64-20261028.json
          e9aaae43f3313fbdc8e4b2fc870f2712a5557a66 v13/code/specs/c2-bilingual-transfer64-20261028.json
          758c5a7dea93bfb178bc3778428ee262178b6a58 v13/code/specs/c2-benchmark.json
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          954a3f468f10195fbce12d27f68585ee7edee2c9 v13/code/specs/control_tools.json
          BLOBS
          : > "$e/BLOBS_RAW.log"
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            printf '%s %s %s\n' "$want" "$got" "$path" >> "$e/BLOBS_RAW.log"
            if [ "$want" != "$got" ]; then echo BLOB_MISMATCH >> "$e/BLOBS_RAW.log"; fi
          done < "$e/EXPECTED_BLOBS.txt"
          if grep -q BLOB_MISMATCH "$e/BLOBS_RAW.log"; then echo 1 > "$e/BLOBS_EXIT.txt"; else echo 0 > "$e/BLOBS_EXIT.txt"; fi
          python3 -m venv "$RUNNER_TEMP/v13-c2-routehead-shadow-venv"
          py="$RUNNER_TEMP/v13-c2-routehead-shadow-venv/bin/python"
          "$py" -m pip install --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          first=$?
          "$py" -m pip install --no-input -q 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
          second=$?
          "$py" -m pip install --no-input -q 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
          third=$?
          if [ "$first" = 0 ] && [ "$second" = 0 ] && [ "$third" = 0 ]; then echo 0 > "$e/INSTALL_EXIT.txt"; else echo 1 > "$e/INSTALL_EXIT.txt"; fi
          if [ "$(cat "$e/BLOBS_EXIT.txt")" = 0 ] && [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_c2_bilingual_routehead_shadow tests.test_c2_bilingual_transfer64 tests.test_c2_benchmark tests.test_control_calibration) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else
            echo SKIPPED_PREREQ_RED > "$e/FOCUSED_RAW.log"
            echo SKIPPED_RED > "$e/FOCUSED_EXIT.txt"
          fi
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=.:tests "$py" -m unittest discover -s tests -p 'test_*.py' -q) > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else
            echo SKIPPED_FOCUSED_RED > "$e/FULL_RAW.log"
            echo SKIPPED_RED > "$e/FULL_EXIT.txt"
          fi
          python3 -m compileall -q v13/code/scripts/c2_bilingual_routehead_shadow.py v13/code/tests/test_c2_bilingual_routehead_shadow.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 797da0a1a7c7965cb00504e8b10570696d500e80 --head HEAD > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 797da0a1a7c7965cb00504e8b10570696d500e80 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-c2-routehead-shadow-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-c2-routehead-shadow-software/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce exact-source software only
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-c2-routehead-shadow-software"
          for name in BLOBS INSTALL FOCUSED FULL COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${name}_EXIT.txt")" != 0 ]; then
              echo "$name RED; raw retained, no promotion"
              tail -80 "$e/${name}_RAW.log" || true
              exit 1
            fi
          done
          echo 'C2_ROUTEHEAD_SHADOW_SOFTWARE_ONLY_NO_NATIVE_OR_REDM I_PROOF'
