name: V13 JEF operator durable sleep-policy isolation software
on:
  push:
    branches: [codex/jef-operator-no-persistent-sleep-mutation-20261031-hourly11]
    paths: ['.github/workflows/v13-jef-operator-policy-isolation.yml']
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      DO_NOT_TRACK: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify pins, run real Store software tests and preserve raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-jef-operator-policy"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          2cf6223af1cd97b119f1e04d902a6bb75592b2b0 v13/code/docs/JEF_OPERATOR_REGULAR_FILE_PREREG_20261031.md
          c921d6a0f791d67c4788fbfed2d212ad7696d224 v13/code/docs/JEF_OPERATOR_BACKGROUND_POLICY_ISOLATION_PREREG_20261031.md
          d31c93c438f3e15f435b60603866713005c59f93 v13/code/scripts/jef_c3_c5_c6_operator_cli.py
          4840f81f7fd541ff50063ff473aad4f3ffd6e60e v13/code/tests/test_jef_operator_regular_file.py
          d9cc9fd46e54a92026fc0d0af21f2a6429e48a9b v13/code/tests/test_jef_operator_policy_isolation.py
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-jef-policy-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-jef-policy-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 6m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_jef_operator_policy_isolation tests.test_jef_operator_regular_file tests.test_jef_operator_io_finalizer_hardening tests.test_jef_c3_c5_c6_operator_cli tests.test_jef_operator_session_20261030) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo PIN_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/scripts/jef_c3_c5_c6_operator_cli.py v13/code/tests/test_jef_operator_policy_isolation.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 2c0ddbf22b6a92f9e0760cbf9af5f8ddd6e51ca9 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 2c0ddbf22b6a92f9e0760cbf9af5f8ddd6e51ca9 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve raw failures and successes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-jef-operator-policy-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-jef-operator-policy/
          if-no-files-found: error
          retention-days: 90
      - name: Require all stages zero and no authority promotion
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-jef-operator-policy"
          for s in PINS VENV DEPS TEST COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo JEF_OPERATOR_POLICY_SOFTWARE_SHADOW_ONLY
