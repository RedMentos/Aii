name: V13 combined online JEPA integration
on:
  push:
    branches:
      - codex/v13-integrated-online-jepa-20261109
  pull_request:
    paths:
      - 'v13/code/v13/continuous_predictor.py'
      - 'v13/code/v13/online_world.py'
      - 'v13/code/v13/world_jepa.py'
      - 'v13/code/v13/world_jepa_online_experiment.py'
      - 'v13/code/v13/runtime.py'
      - 'v13/code/tests/test_online_world_20261108.py'
      - 'v13/code/tests/test_world_jepa_incremental_20261108.py'
      - '.github/workflows/v13-integrated-online-jepa.yml'
jobs:
  combined:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pytest
      - run: PYTHONPATH=v13/code python -m pytest -q v13/code/tests/test_continuous_predictor_20261108.py v13/code/tests/test_online_world_20261108.py v13/code/tests/test_world_jepa_incremental_20261108.py v13/code/tests/test_world_jepa_online_experiment_20261108.py v13/code/tests/test_runtime_jepa_integration_20261110.py v13/code/tests/test_ag6_training_readiness_20261108.py v13/code/tests/test_lora_resume_safety.py
