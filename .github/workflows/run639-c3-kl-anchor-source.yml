name: V13 Run639 C3 32-step KL-anchor prospective source contract
on:
  push:
    branches:
      - codex/gpt6-run639-c3-kl-anchor-20261027
    paths:
      - '.github/workflows/run639-c3-kl-anchor-source.yml'
      - 'v13/code/scripts/run639_c3_kl_anchor.py'
      - 'v13/code/scripts/run639_c3_native_anchor_compare.py'
      - 'v13/code/tests/test_run639_c3_kl_anchor.py'
      - 'v13/code/tests/test_run639_c3_native_anchor_compare.py'
      - 'v13/code/docs/proofs/continuation-20261027/run639-c3-kl-anchor/**'
permissions:
  contents: read
concurrency:
  group: v13-run639-source-only
  cancel-in-progress: false
jobs:
  run639-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.sha }}
      - name: Freeze prereg cohort original model trainer and source
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/RUN639_SOURCE_HEAD.txt"
          test "$(git hash-object v13/code/docs/proofs/continuation-20261027/run639-c3-kl-anchor/PREREG.md)" = a2e6edc75f4880694512951b8f1c723d26693e80
          test "$(git hash-object v13/code/docs/proofs/continuation-20261027/run639-c3-kl-anchor/COHORT.json)" = ccec34634714b760b6cba6ce626536928f229ed3
          test "$(git hash-object v13/code/scripts/run639_c3_kl_anchor.py)" = 5ee4adf90a3486fd4c1f2090a3a173dc411d9703
          test "$(git hash-object v13/code/scripts/run639_c3_native_anchor_compare.py)" = 023c4e08f41f4d7bba641078be3f5c0e3e1a7703
          test "$(git hash-object v13/code/tests/test_run639_c3_native_anchor_compare.py)" = abacb1d2de535dfd069ad67a556715c7b88b650a
          test "$(git hash-object v13/code/tests/test_run639_c3_kl_anchor.py)" = 576a5f919af744128519f76c81cb48ae548d84fb
          test "$(git hash-object v13/code/scripts/run632_c3_lfm350_native.py)" = b59f45f06bf0b8428fba502b8146c02205228edd
          test "$(git hash-object v13/code/docs/proofs/continuation-20261027/run632-c3-lfm350-native/COHORT_V2.json)" = c282077912ec4e284476825b3e03728620d8bad0
          test "$(git hash-object v13/code/v13/lora_trainer.py)" = 49a752879ae5d19391963742a0f042e740edb2cc
          test "$(sha256sum v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md | cut -d' ' -f1)" = 3423906b01b24443fcef733fb5c7ef47296963df63e603d8f843c99d544877ee
          { date -u -Iseconds; python3 --version; uname -a; } > "$RUNNER_TEMP/RUN639_SOURCE_HOST.txt"
          sha256sum v13/code/scripts/run639_c3_kl_anchor.py v13/code/tests/test_run639_c3_kl_anchor.py v13/code/scripts/run639_c3_native_anchor_compare.py v13/code/tests/test_run639_c3_native_anchor_compare.py v13/code/docs/proofs/continuation-20261027/run639-c3-kl-anchor/COHORT.json > "$RUNNER_TEMP/RUN639_SOURCE_INPUTS.txt"
      - name: Compile and run 20 frozen source-only negative controls
        run: |
          set +e
          python3 -m py_compile v13/code/scripts/run639_c3_kl_anchor.py v13/code/tests/test_run639_c3_kl_anchor.py v13/code/scripts/run639_c3_native_anchor_compare.py v13/code/tests/test_run639_c3_native_anchor_compare.py > "$RUNNER_TEMP/RUN639_COMPILE_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/RUN639_COMPILE_EXIT.txt"
          (cd v13/code && PYTHONPATH="$PWD:$PWD/scripts" python3 -m unittest -v tests.test_run639_c3_kl_anchor tests.test_run639_c3_native_anchor_compare tests.test_run632_c3_lfm350_native) > "$RUNNER_TEMP/RUN639_SOURCE_TEST_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/RUN639_SOURCE_TEST_EXIT.txt"
          exit 0
      - name: Public repository privacy
        run: |
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 920c37d0436b536f4ed7c96570fc0dc6e3a14528 --head HEAD > "$RUNNER_TEMP/RUN639_PRIVACY_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/RUN639_PRIVACY_EXIT.txt"
          exit 0
      - name: Close raw evidence and hashes
        if: always()
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP"
          for k in COMPILE SOURCE_TEST PRIVACY; do
            test -f "RUN639_${k}_EXIT.txt" || echo 2 > "RUN639_${k}_EXIT.txt"
          done
          find . -maxdepth 1 -type f -name 'RUN639_*' ! -name RUN639_SOURCE_SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > RUN639_SOURCE_SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: V13-Run639-C3-Source-${{ github.sha }}
          path: ${{ runner.temp }}/RUN639_*
          if-no-files-found: error
          retention-days: 30
      - name: Enforce source tests and privacy
        if: always()
        run: |
          set -euo pipefail
          for k in COMPILE SOURCE_TEST PRIVACY; do
            echo "RUN639 $k exit $(cat "$RUNNER_TEMP/RUN639_${k}_EXIT.txt")"
            test "$(cat "$RUNNER_TEMP/RUN639_${k}_EXIT.txt")" = 0
          done
          (cd "$RUNNER_TEMP" && sha256sum -c RUN639_SOURCE_SHA256SUMS.txt)
