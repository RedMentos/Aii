name: V13 Run462 stage8 P_s22 source-only preview
on:
  pull_request:
    paths:
      - '.github/workflows/run462-stage8-p22-source.yml'
      - 'v13/code/scripts/run462_stage8_p22.py'
      - 'v13/code/tests/test_run462_stage8_p22.py'
      - 'v13/code/docs/proofs/continuation-20261026/run462-stage8-p22/**'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      HF_HUB_OFFLINE: '1'
      NO_MODEL_DOWNLOADS: '1'
      V13_NO_AUTOSTART: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Pin exact native294 importer and frozen native cohort
        run: |
          set -euo pipefail
          test "$(git hash-object v13/code/scripts/run460_verify_native294.py)" = "2a61c2ae8600cede90900a323e22e1f5a723a3ea"
          test "$(git hash-object v13/code/scripts/run461_import_stage7_artifact.py)" = "2f11c45f09fe1f48d0908d22add4cb4d6a2212d5"
          test "$(git hash-object v13/code/scripts/run397_step2_resume.py)" = "f1946054135cb6fdf48c06477308f518e2e62ad9"
          sha256sum v13/code/scripts/run462_stage8_p22.py v13/code/tests/test_run462_stage8_p22.py > "$RUNNER_TEMP/run462-source-sha256.txt"
          python3 -m venv "$RUNNER_TEMP/run462"
          "$RUNNER_TEMP/run462/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Stage8 exact next-arm source tests and inherited receipt/import controls
        working-directory: v13/code
        run: |
          set +e
          export PYTHONPATH="$PWD:$PWD/scripts"
          "$RUNNER_TEMP/run462/bin/python" -m unittest -v tests.test_run462_stage8_p22 tests.test_run461_native294_atomic_import tests.test_run460_verify_native294_adversarial tests.test_run459_stage7_o22 tests.test_run458_native252_atomic_import tests.test_run457_pinned_utility_reads tests.test_run456_native252_utility tests.test_run454_verify_native252_adversarial tests.test_run453_verify_native252 tests.test_run436_verify_native210 > "$RUNNER_TEMP/run462-tests.txt" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/run462-tests.txt"
          echo "EXIT=$rc" > "$RUNNER_TEMP/run462-exit.txt"
          exit "$rc"
      - name: Official public repository privacy scan
        if: always()
        run: |
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
      - name: Preserve raw source-only evidence including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run462-stage8-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/run462-source-sha256.txt
            ${{ runner.temp }}/run462-tests.txt
            ${{ runner.temp }}/run462-exit.txt
          if-no-files-found: warn
          retention-days: 30
