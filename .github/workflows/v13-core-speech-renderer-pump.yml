name: V13 C3 speech renderer pump
on:
  push:
    branches:
      - core/v13-speech-renderer-pump-20261112-0604
  pull_request:
    paths:
      - 'v13/code/v13/speech_renderer_pump.py'
      - 'v13/code/v13/speech_operator.py'
      - 'v13/code/v13/speech_intent.py'
      - 'v13/code/tests/test_speech_renderer_pump.py'
jobs:
  synthetic-speech:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: |
          python -m compileall -q v13/code/v13/speech_renderer_pump.py
          PYTHONPATH=v13/code python -m pytest -q v13/code/tests/test_speech_intent.py v13/code/tests/test_speech_runtime_bridge.py v13/code/tests/test_speech_store_binding.py v13/code/tests/test_speech_operator_handoff.py v13/code/tests/test_speech_renderer_pump.py
