name: V13 Run11 B1 World-JEPA control fabric full Linux integration review
on:
  push:
    branches: [assistant/v13-run11-b1-world-jepa-integration-20261028]
    paths:
      - '.github/workflows/run11-b1-world-jepa-full-20261028.yml'
      - 'v13/code/scripts/step2_longnote_fourarm_analysis.py'
      - 'v13/code/scripts/world_jepa_heldout_action_readout_20261028.py'
      - 'v13/code/tests/test_step2_crossarm_b1_identity_20261028.py'
      - 'v13/code/tests/test_world_jepa_heldout_action_readout_20261028.py'
      - 'v13/code/v13/control_budget.py'
      - 'v13/code/tests/test_control_budget_monotonic_20261028.py'
permissions:
  contents: read
concurrency:
  group: v13-run11-b1-world-jepa-full-20261028
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve raw full-suite and cross-organ evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run11-b1-world-jepa-integration"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git show -s --format='%P' HEAD > "$e/PARENTS.txt"
          git log --format='%H %P' -6 > "$e/ANCESTRY_RAW.log"
          for path in v13/code/scripts/step2_longnote_fourarm_analysis.py v13/code/scripts/world_jepa_heldout_action_readout_20261028.py v13/code/v13/control_budget.py v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md v13/code/specs/models.json; do
            git hash-object "$path"
          done > "$e/BLOBS_RAW.log"
          first=$?
          test "$(git hash-object v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md)" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          second=$?
          test "$(git hash-object v13/code/specs/models.json)" = 7af05962af41d0bc3f7dd18ef01d4eba55eabf99
          third=$?
          if [ "$first" = 0 ] && [ "$second" = 0 ] && [ "$third" = 0 ]; then echo 0 > "$e/BLOBS_EXIT.txt"; else echo 1 > "$e/BLOBS_EXIT.txt"; fi
          python3 -m venv "$RUNNER_TEMP/v13-run11-integration-venv"
          py="$RUNNER_TEMP/v13-run11-integration-venv/bin/python"
          "$py" -m pip install --no-input -q 'numpy==2.2.6' 'psutil' 'PyYAML' 'Pillow' 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          first=$?
          "$py" -m pip install --no-input -q 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
          second=$?
          "$py" -m pip install --no-input -q 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
          third=$?
          if [ "$first" = 0 ] && [ "$second" = 0 ] && [ "$third" = 0 ]; then echo 0 > "$e/INSTALL_EXIT.txt"; else echo 1 > "$e/INSTALL_EXIT.txt"; fi
          if [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ]; then
            (
              cd v13/code
              timeout --signal=TERM --kill-after=10s 8m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_step2_crossarm_b1_identity_20261028 tests.test_step2_longnote_fourarm_analysis_20261028 tests.test_step2_collector_scorer_crossorgan_20261028 tests.test_world_jepa_heldout_action_readout_20261028 tests.test_world_jepa_action_permutation_control tests.test_control_budget_monotonic_20261028 tests.test_control_budget
            ) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else
            echo SKIPPED_INSTALL_RED > "$e/FOCUSED_RAW.log"
            echo SKIPPED_RED > "$e/FOCUSED_EXIT.txt"
          fi
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ]; then
            (
              cd v13/code
              timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=.:tests "$py" -m unittest discover -s tests -p 'test_*.py' -q
            ) > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else
            echo SKIPPED_FOCUSED_RED > "$e/FULL_RAW.log"
            echo SKIPPED_RED > "$e/FULL_EXIT.txt"
          fi
          python3 -m compileall -q v13/code/v13 v13/code/scripts/step2_longnote_fourarm_analysis.py v13/code/scripts/world_jepa_heldout_action_readout_20261028.py v13/code/tests/test_step2_crossarm_b1_identity_20261028.py v13/code/tests/test_world_jepa_heldout_action_readout_20261028.py v13/code/tests/test_control_budget_monotonic_20261028.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 0cc5e59fc1c91a71b0b232b42f70668c562d9d2b --head HEAD > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 0cc5e59fc1c91a71b0b232b42f70668c562d9d2b HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && sha256sum * > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-run11-b1-world-jepa-integration-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run11-b1-world-jepa-integration/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce all raw exits
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run11-b1-world-jepa-integration"
          for name in BLOBS INSTALL FOCUSED FULL COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${name}_EXIT.txt")" != 0 ]; then
              echo "$name RED; raw evidence retained"
              tail -50 "$e/${name}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'V13_FULL_LINUX_SOFTWARE_ONLY_NO_NATIVE_OR_GATE_PROMOTION'
