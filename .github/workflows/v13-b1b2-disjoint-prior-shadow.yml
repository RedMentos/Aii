name: V13 B1 B2 disjoint prior source to C3 SHADOW software
on:
  push:
    branches: [assistant/v13-b1b2-disjoint-prior-gpt6-20261031]
    paths:
      - '.github/workflows/v13-b1b2-disjoint-prior-shadow.yml'
      - 'v13/code/v13/b1b2_disjoint_prior_envelope_candidate.py'
      - 'v13/code/tests/test_b1b2_disjoint_prior_envelope_candidate.py'
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      NEEDLE_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Real Store B1 B2 source disjointness and original C3 regressions
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-b1b2-disjoint-prior"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          3a81e36399a1946cf011ba0563891245c57c7543 v13/code/docs/B1B2_DISJOINT_PRIOR_ENVELOPE_PREREG_20261031.md
          fd7a47c708833a7c886c4aca0530deaa672daf1b v13/code/v13/b1b2_disjoint_prior_envelope_candidate.py
          5a493c3cadae804836721e9898fb4c380113d230 v13/code/tests/test_b1b2_disjoint_prior_envelope_candidate.py
          277d34a46b14633c52b5e7d59b3fdf0f16ea4159 v13/code/v13/b1b2_topic_partition_candidate.py
          8aaccb96c3fca43fa4450ab9bdc15f0e787bf093 v13/code/v13/b1b2_c3_source_envelope_candidate.py
          dfb3891d76ef8e9e86f745a6f30183f44f8ff9ed v13/code/tests/test_b1b2_topic_partition_candidate.py
          beda0ad44985fc567ea7e1b39db8617493955176 v13/code/tests/test_b1b2_c3_source_envelope_candidate.py
          c887e3db355df8b68d3bd35c6c86d1573ea2d081 v13/code/docs/fixtures/run52_b1b2_cross_turn_seed479.json
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-b1b2-disjoint-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-b1b2-disjoint-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 8m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_b1b2_disjoint_prior_envelope_candidate tests.test_b1b2_topic_partition_candidate tests.test_b1b2_c3_source_envelope_candidate tests.test_b1b2_causal_offer_consumer_candidate) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PINS_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/v13/b1b2_disjoint_prior_envelope_candidate.py v13/code/tests/test_b1b2_disjoint_prior_envelope_candidate.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 0d0189d52c48af80c76e690e0bcf4904c7f3a459 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 0d0189d52c48af80c76e690e0bcf4904c7f3a459 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve raw even on RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-b1b2-disjoint-prior-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-b1b2-disjoint-prior/
          retention-days: 90
          if-no-files-found: error
      - name: Require all seven stage exits zero
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-b1b2-disjoint-prior"
          for s in PINS VENV DEPS TEST COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo B1B2_DISJOINT_PRIOR_SHADOW_NO_NATIVE_UTILITY_OR_PROMOTION
