name: V13 Run536 approved WP-K sandbox Self World binding
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/run536-wpk-self-world-binding.yml'
      - 'v13/code/v13/agi/approved_sandbox_world.py'
      - 'v13/code/tests/test_run536_approved_sandbox_world.py'
      - 'v13/code/docs/proofs/continuation-20261026/run536-wpk-self-world-binding/**'
permissions:
  contents: read
jobs:
  source-only:
    if: ${{ github.event.pull_request.head.ref == 'codex/automation11-run536-wpk-self-world-binding-20261026' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Exact WP-K F3 F4 prereg source and existing port pins
        id: source
        run: |
          set -euo pipefail
          test "$(git hash-object v13/code/docs/proofs/continuation-20261026/run536-wpk-self-world-binding/PREREG.md)" = '2856a6b81ca996f5b49c6dd99797746dfe3f0868'
          test "$(git hash-object v13/code/v13/agi/approved_sandbox_world.py)" = 'de09734fe1eedbd207e6c57447430f8bcee12a51'
          test "$(git hash-object v13/code/tests/test_run536_approved_sandbox_world.py)" = 'a3d859e574cf6089af808d95ff6a1c4eb63eb598'
          test "$(git hash-object v13/code/v13/agi/file_world_port.py)" = '713d66efac249649adeaeb32ae7efb690fab72f4'
          test "$(git hash-object v13/code/v13/agi/tools.py)" = '172ad8c9cf3b3be4d36734f4a60cc25da3755ac3'
          { date -u -Iseconds; python3 --version; uname -a; } > "$RUNNER_TEMP/RUN536_HOST.txt"
      - name: Isolated no-model source dependencies
        id: deps
        run: |
          set -uo pipefail
          set +e
          python3 -m venv "$RUNNER_TEMP/run536venv"
          timeout 240s "$RUNNER_TEMP/run536venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52' > "$RUNNER_TEMP/RUN536_DEPS_RAW.log" 2>&1
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/RUN536_DEPS_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Actual approved tool and original transaction Self World regressions
        id: tests
        if: ${{ steps.deps.outputs.rc == '0' }}
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          export PYTHONPATH="$PWD:$PWD/scripts"
          "$RUNNER_TEMP/run536venv/bin/python" -m unittest -v tests.test_run536_approved_sandbox_world tests.test_transaction tests.test_run533_sandbox_world_port tests.test_run535_self_world_operator tests.test_selfmodel > "$RUNNER_TEMP/RUN536_TEST_RAW.log" 2>&1
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/RUN536_TEST_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Public privacy scan
        id: privacy
        if: always()
        run: |
          set -uo pipefail
          set +e
          git fetch --no-tags --depth=100 origin "${{ github.event.pull_request.base.sha }}" > "$RUNNER_TEMP/RUN536_PRIVACY_RAW.log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree >> "$RUNNER_TEMP/RUN536_PRIVACY_RAW.log" 2>&1
            rc=$?
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN536_PRIVACY_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: SHA-close raw
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          find . -maxdepth 1 -type f -name 'RUN536_*' ! -name RUN536_SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > RUN536_SHA256SUMS.txt
      - name: Preserve raw evidence even on RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run536-wpk-self-world-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/RUN536_*
          if-no-files-found: error
          retention-days: 30
      - name: Enforce pinned tests and privacy
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.source.outcome }}" = success
          test "$(cat "$RUNNER_TEMP/RUN536_DEPS_EXIT.txt")" = 0
          test "$(cat "$RUNNER_TEMP/RUN536_TEST_EXIT.txt")" = 0
          test "$(cat "$RUNNER_TEMP/RUN536_PRIVACY_EXIT.txt")" = 0
