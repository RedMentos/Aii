name: V13 BP1 QAD software-only comparison integrity review
on:
  push:
    branches: [codex/automation11-bp1-qad-review-20261027]
    paths:
      - '.github/workflows/bp1-qad-software-review.yml'
      - 'v13/code/scripts/bp1_qad_native_smoke.py'
      - 'v13/code/tests/test_bp1_qad_native_smoke.py'
      - 'v13/code/docs/proofs/continuation-20261027/bp1-qad-software-review/**'
permissions:
  contents: read
concurrency:
  group: v13-bp1-qad-software-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Run focused software tests, compile and privacy (preserve failures)
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/bp1-qad-review"
          git rev-parse HEAD > "$RUNNER_TEMP/bp1-qad-review/HEAD.txt"
          sha256sum v13/code/scripts/bp1_qad_native_smoke.py v13/code/tests/test_bp1_qad_native_smoke.py > "$RUNNER_TEMP/bp1-qad-review/SOURCE_SHA256.txt"
          (cd v13/code && PYTHONPATH="$PWD:$PWD/scripts" python3 -m unittest -v tests.test_bp1_qad_native_smoke) > "$RUNNER_TEMP/bp1-qad-review/UNIT_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp1-qad-review/UNIT_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/bp1_qad_native_smoke.py v13/code/tests/test_bp1_qad_native_smoke.py > "$RUNNER_TEMP/bp1-qad-review/COMPILE_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp1-qad-review/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base a71121d30fa1b83fa4c9b86b8f5fa3bc5fe710aa --head HEAD > "$RUNNER_TEMP/bp1-qad-review/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp1-qad-review/PRIVACY_EXIT.txt"
          exit 0
      - name: Preserve raw source-bound evidence including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bp1-qad-software-review-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/bp1-qad-review/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce all software exits
        run: |
          set -euo pipefail
          for n in UNIT COMPILE PRIVACY; do
            test "$(cat "$RUNNER_TEMP/bp1-qad-review/${n}_EXIT.txt")" = 0 || {
              echo "${n} failed"
              tail -100 "$RUNNER_TEMP/bp1-qad-review/${n}_RAW.log"
              exit 1
            }
          done
          echo "SOFTWARE_ONLY_PASS; NO_NATIVE_OR_REDMi_EVIDENCE"
