name: V13 episode vector boundary integrity review
on:
  push:
    branches: [codex/automation11m-episode-vector-boundary-20261027]
    paths:
      - '.github/workflows/episode-vector-boundary-review.yml'
      - 'v13/code/v13/semantic_memory.py'
      - 'v13/code/v13/memory.py'
      - 'v13/code/tests/test_semantic_memory.py'
      - 'v13/code/tests/test_episodes.py'
permissions:
  contents: read
concurrency:
  group: v13-episode-vector-freshness-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Focused synthetic tests and closed raw exits
        run: |
          set +e
          evidence="$RUNNER_TEMP/v13-episode-vector"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/HEAD.txt"
          git hash-object v13/code/v13/semantic_memory.py > "$evidence/SEMANTIC_BLOB.txt"
          git hash-object v13/code/v13/memory.py > "$evidence/MEMORY_BLOB.txt"
          python3 -m venv "$RUNNER_TEMP/episode-vector-venv"
          py="$RUNNER_TEMP/episode-vector-venv/bin/python"
          "$py" -m pip install --no-input -q 'numpy==2.2.6' 'psutil' 'PyYAML' 'Pillow' > "$evidence/INSTALL_RAW.log" 2>&1
          echo "$?" > "$evidence/INSTALL_EXIT.txt"
          (
            cd v13/code
            timeout --signal=TERM --kill-after=10s 8m env PYTHONPATH=. "$py" -m unittest -v tests.test_episodes
          ) > "$evidence/UNIT_RAW.log" 2>&1
          echo "$?" > "$evidence/UNIT_EXIT.txt"
          python3 -m py_compile v13/code/v13/semantic_memory.py v13/code/v13/memory.py v13/code/tests/test_semantic_memory.py v13/code/tests/test_episodes.py > "$evidence/COMPILE_RAW.log" 2>&1
          echo "$?" > "$evidence/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 0047aa76d5e5d221f18c0e4d4ce36c14bcb70f46 --head HEAD > "$evidence/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$evidence/PRIVACY_EXIT.txt"
          git diff --check 0047aa76d5e5d221f18c0e4d4ce36c14bcb70f46 HEAD > "$evidence/DIFF_RAW.log" 2>&1
          echo "$?" > "$evidence/DIFF_EXIT.txt"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-episode-vector-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-episode-vector/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce exits, preserving original failed attempts
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/v13-episode-vector"
          for name in INSTALL UNIT COMPILE PRIVACY DIFF; do
            if [ "$(cat "$evidence/${name}_EXIT.txt")" != 0 ]; then
              echo "$name failed; raw evidence retained"
              tail -80 "$evidence/${name}_RAW.log"
              exit 1
            fi
          done
          echo 'EPISODE_VECTOR_BOUNDARY_SOFTWARE_ONLY_NO_AGE_PROMOTION'
