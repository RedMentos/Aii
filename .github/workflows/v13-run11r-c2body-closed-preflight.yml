name: V13 Run11R seed163 observer-closed six-arm software preflight
on:
  push:
    branches: [assistant/v13-run11r-c2body-closed-release-seed163-20261030]
    paths:
      - '.github/workflows/v13-run11r-c2body-closed-preflight.yml'
      - 'v13/code/scripts/c2_body_observer_closed_run11r.py'
      - 'v13/code/tests/test_c2_body_observer_closed_run11r.py'
      - 'v13/code/scripts/c2_body_observer_closed_verify_run11r.py'
      - 'v13/code/tests/test_c2_body_observer_closed_verify_run11r.py'
      - 'v13/code/docs/C2_BODY_OBSERVER_CLOSED_PREREG_RUN11R_20261030.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen prereg and source; run adversarial tests
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run11r-preflight"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          2152a5d2205f8c3b3c52c987e6b5e36ab7c96c94 v13/code/docs/C2_BODY_OBSERVER_CLOSED_PREREG_RUN11R_20261030.md
          854179b1c130a68e20ceea313e28193d63bef083 v13/code/scripts/c2_body_observer_closed_run11r.py
          e6931fee2d1e833baf83d39d95ad1888745fb661 v13/code/tests/test_c2_body_observer_closed_run11r.py
          77ef6df92da4281f7ac908302d14fdc4ebee44e3 v13/code/scripts/c2_body_observer_closed_verify_run11r.py
          537d4e5bc46e5410c71b326c83d2a606e0a0a449 v13/code/tests/test_c2_body_observer_closed_verify_run11r.py
          d824690e942489b11c79c3aa68cd0f02e6176f06 v13/code/scripts/c2_c3_body_source_arithmetic_shadow_run11q.py
          fcd44ccce3b8b40d65a25187a78b0a8d49d9609d v13/code/scripts/step2_paired_raw_validator_audit_20261030.py
          f6bb6c26237f9c94a29a9eeac5ecc6c5fa129ad3 v13/code/scripts/step2_expression_diagnostic_20261030.py
          fb34dba97ae3700ba5accdcb928bfb72afcf4fcb v13/code/scripts/c2_native_route_provenance_20261030.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          954a3f468f10195fbce12d27f68585ee7edee2c9 v13/code/specs/control_tools.json
          BLOBS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run11r-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run11r-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo SKIPPED > "$e/DEPS_RAW.log"; echo SKIPPED > "$e/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_c2_body_observer_closed_run11r tests.test_c2_body_observer_closed_verify_run11r) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
            (cd v13/code && PYTHONPATH=.:scripts "$py" -c 'from scripts.c2_body_observer_closed_run11r import validate_fixtures; assert validate_fixtures(); print("RUN11R_24_TURNS_PREREG_SOFTWARE_ONLY")') > "$e/FIXTURE_RAW.log" 2>&1
            echo "$?" > "$e/FIXTURE_EXIT.txt"
          else
            for stage in TEST FIXTURE; do echo SKIPPED > "$e/${stage}_RAW.log"; echo SKIPPED > "$e/${stage}_EXIT.txt"; done
          fi
          "$py" -m py_compile v13/code/scripts/c2_body_observer_closed_run11r.py v13/code/tests/test_c2_body_observer_closed_run11r.py v13/code/scripts/c2_body_observer_closed_verify_run11r.py v13/code/tests/test_c2_body_observer_closed_verify_run11r.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 5b6c515a058725fe3db88c0daf07505187ac5c72 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 5b6c515a058725fe3db88c0daf07505187ac5c72 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve closed raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run11r-preflight-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run11r-preflight/
          retention-days: 30
          if-no-files-found: error
      - name: Fail closed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run11r-preflight"
          for stage in PINS VENV DEPS TEST FIXTURE COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; no native authorization"
              tail -80 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'RUN11R_SOFTWARE_ONLY_NO_NATIVE_OR_GATE_PROMOTION'
