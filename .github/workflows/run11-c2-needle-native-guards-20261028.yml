name: V13 Run11 C2 Needle native control-call synthetic guards
on:
  push:
    branches:
      - codex/v13-run11-c2-needle-native-control-smoke-20261028
    paths:
      - '.github/workflows/run11-c2-needle-native-guards-20261028.yml'
      - 'v13/code/scripts/current_c2_native_linux_smoke_20261028.py'
      - 'v13/code/tests/test_current_c2_native_linux_smoke_20261028.py'
permissions:
  contents: read
jobs:
  c2-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: "1"
      NO_MODEL_DOWNLOADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: C2 pinned schema and bounded real synthetic subprocess guards
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-c2-native-guards"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/specs/models.json > "$e/CATALOG_BLOB.txt"
          git hash-object v13/code/specs/control_tools.json > "$e/TOOLS_BLOB.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 4m env PYTHONPATH=.:tests python3 -m unittest -v tests.test_current_c2_native_linux_smoke_20261028 tests.test_native_smoke_io_20261028) > "$e/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$e/FOCUSED_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/current_c2_native_linux_smoke_20261028.py v13/code/tests/test_current_c2_native_linux_smoke_20261028.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 87c9e7f1927130ffb3dd4e2491d8b3ee462d355c --head HEAD > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 87c9e7f1927130ffb3dd4e2491d8b3ee462d355c HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-c2-native-guards-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-c2-native-guards/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce focused, compile, privacy and diff
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-c2-native-guards"
          for name in FOCUSED COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${name}_EXIT.txt")" != 0 ]; then
              echo "$name RED"
              tail -100 "$e/${name}_RAW.log" || true
              exit 1
            fi
          done
          echo 'C2_NEEDLE_SYNTHETIC_SOFTWARE_ONLY_NO_NATIVE_OR_AUTHORITY'
