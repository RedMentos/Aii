name: V13 Run161 pinned B1 full GGUF SHA256 preflight
on:
  pull_request:
    paths:
      - '.github/workflows/v13-run161-body-fullhash.yml'
      - 'v13/code/docs/proofs/continuation-20261025/run161-body-fullhash/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v13-native-c3-run131-serialized
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen model registration and bounded resources
        run: |
          python - <<'PY'
          import json
          s=json.load(open('v13/code/specs/models.json'))['models']['body']
          f=s['files'][0]
          assert s['revision']=='6767265158422fb8a19c62ceb45f16f05363615b'
          assert s['license_id']=='LFM Open License 1.0'
          assert f['size']==695755488
          assert f['sha256']=='bb741ebb106d543e9de114b843a3d3d73d51c74b5801e69da2abde821a0cb3e1'
          print('RUN161_PINNED_MODEL_MANIFEST_OK')
          PY
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2{print $4}')" -gt 1500000
      - name: Serialized exact public B1 GGUF download and full SHA256
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/run161"
          MODEL="$RUNNER_TEMP/run161/body.gguf"
          trap 'rm -f "$MODEL"' EXIT
          timeout 600s curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 480 \
            'https://huggingface.co/LiquidAI/LFM2.5-1.2B-Instruct-GGUF/resolve/6767265158422fb8a19c62ceb45f16f05363615b/LFM2.5-1.2B-Instruct-QAD-Q4_0.gguf' -o "$MODEL"
          test "$(stat -c %s "$MODEL")" = "695755488"
          echo "bb741ebb106d543e9de114b843a3d3d73d51c74b5801e69da2abde821a0cb3e1  $MODEL" | sha256sum -c -
          head -c 33554432 "$MODEL" > "$RUNNER_TEMP/run161/body-prefix.bin"
          PYTHONPATH=v13/code python v13/code/scripts/body_gguf_dtype_audit_run160.py --prefix "$RUNNER_TEMP/run161/body-prefix.bin" --output "$RUNNER_TEMP/run161/prefix-audit.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'run161'
          r=json.loads((p/'prefix-audit.json').read_text())
          assert r['tensor_count']==148 and r['fp32_count']==55
          assert r['body_training_authority']==0 and r['full_model_sha256_verified'] is False
          result={'schema':'V13_RUN161_PINNED_B1_FULLHASH_PREFLIGHT_V1',
                  'full_model_sha256':'bb741ebb106d543e9de114b843a3d3d73d51c74b5801e69da2abde821a0cb3e1',
                  'full_model_sha256_verified_by_run161':True,'bytes':695755488,
                  'prefix_tensor_count':r['tensor_count'],'prefix_fp32_count':r['fp32_count'],
                  'body_training_authority':0,'Body_JEPA':'UNAVAILABLE','jepa_weight':0,
                  'evidence_class':'LINUX_CI_FULL_MODEL_FILE_INTEGRITY_NO_INFERENCE_OR_TRAINING'}
          (p/'fullhash-report.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          print('RUN161_B1_FULLHASH_PASS 695755488 F32 55 AUTHORITY 0')
          PY
      - name: Official public repository privacy scan
        run: python v13/code/scripts/public_repo_privacy_scan.py --base 36f2b57aeba3d5c1117350e8955ad78b71d2e578 --head HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V13-Run161-B1-Fullhash-Metadata-Only
          path: |
            ${{ runner.temp }}/run161/fullhash-report.json
            ${{ runner.temp }}/run161/prefix-audit.json
          if-no-files-found: warn
          retention-days: 14
