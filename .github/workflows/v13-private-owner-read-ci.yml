name: V13 private owner-read Termux bootstrap
on:
  push:
    branches:
      - gpt6/v13-private-remote-bridge-20261111
  pull_request:
    paths:
      - 'v13/code/v13/owner_read_bridge.py'
      - 'v13/code/v13/remote_chat.py'
      - 'v13/code/v13/phone_monitor.py'
      - 'v13/code/v13/phone_runtime_diagnostics.py'
      - 'v13/code/tests/test_phone_runtime_diagnostics.py'
      - 'v13/code/tests/test_remote_chat.py'
      - 'v13/code/tests/test_phone_monitor.py'
      - 'v13/code/v13/source_updater.py'
      - 'v13/code/v13/pipeline_agent.py'
      - 'v13/code/v13/lifecycle.py'
      - 'v13/code/v13/chat_service.py'
      - 'v13/code/v13/inner_dialogue.py'
      - 'v13/code/v13/runtime.py'
      - 'v13/code/v13/operator.py'
      - 'v13/code/tests/test_inner_dialogue.py'
      - 'v13/code/tests/test_chat_service.py'
      - 'v13/code/tests/test_lifecycle.py'
      - 'v13/code/tests/test_pipeline_agent.py'
      - 'v13/code/tests/test_update_truth_cli.py'
      - 'v13/code/v13/runtime_deploy.py'
      - 'v13/code/v13/diagnostic_push.py'
      - 'v13/code/tests/test_runtime_deploy.py'
      - 'v13/code/tests/test_diagnostic_push.py'
      - 'v13/code/v13/mobile_dashboard.py'
      - 'v13/code/v13/mobile_dashboard.html'
      - 'v13/code/tests/test_mobile_dashboard_browser.js'
      - 'v13/code/v13/managed_console.py'
      - 'v13/code/tests/test_managed_console_dashboard.py'
      - 'v13/code/tests/test_source_updater.py'
      - 'v13/code/tests/test_mobile_dashboard.py'
      - 'v13/code/tests/test_termux_bootstrap.py'
      - 'v13/code/scripts/v13-update'
      - 'v13/code/tests/test_owner_read_bridge.py'
      - 'v13/code/scripts/termux_one_command.sh'
      - '.github/workflows/v13-private-owner-read-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v13/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile read-only bridge and run synthetic security tests
        run: |
          python -m py_compile v13/owner_read_bridge.py v13/remote_maintenance_bridge.py v13/remote_chat.py v13/phone_monitor.py tests/test_owner_read_bridge.py tests/test_remote_chat.py tests/test_phone_monitor.py
          python -m unittest discover -s tests -p 'test_owner_read_bridge.py' -v
          python -m unittest discover -s tests -p 'test_remote_chat.py' -v
          python -m unittest discover -s tests -p 'test_phone_monitor.py' -v
      - name: Validate updater and phone UI source syntax
        run: |
          python -m py_compile v13/phone_runtime_diagnostics.py tests/test_phone_runtime_diagnostics.py
          python -m unittest discover -s tests -p 'test_phone_runtime_diagnostics.py' -v
          python -m py_compile v13/source_updater.py v13/lifecycle.py v13/pipeline_agent.py v13/chat_service.py v13/mobile_dashboard.py tests/test_source_updater.py tests/test_pipeline_agent.py tests/test_lifecycle.py tests/test_chat_service.py
          python -m unittest discover -s tests -p 'test_source_updater.py' -v
          python -m unittest discover -s tests -p 'test_pipeline_agent.py' -v
          python -m py_compile tests/test_update_truth_cli.py
          python -m unittest discover -s tests -p 'test_update_truth_cli.py' -v
          python -m unittest discover -s tests -p 'test_lifecycle.py' -v
          python -m unittest discover -s tests -p 'test_chat_service.py' -v
          python -m py_compile v13/managed_console.py tests/test_managed_console_dashboard.py
          python -m unittest discover -s tests -p 'test_managed_console_dashboard.py' -v
          python -m unittest discover -s tests -p 'test_mobile_dashboard.py' -v
          python -m py_compile v13/inner_dialogue.py v13/runtime.py v13/operator.py tests/test_inner_dialogue.py
          python -m unittest discover -s tests -p 'test_inner_dialogue.py' -v
      - name: Validate actual runtime deployment and explicit diagnostic upload
        run: |
          python -m py_compile v13/runtime_deploy.py v13/diagnostic_push.py tests/test_runtime_deploy.py tests/test_diagnostic_push.py
          python -m unittest discover -s tests -p 'test_runtime_deploy.py' -v
          python -m unittest discover -s tests -p 'test_diagnostic_push.py' -v
          python - <<'PY'
          from pathlib import Path
          from v13.runtime_deploy import _selftest
          _selftest(Path.cwd())
          print("PASS: actual checked-out V13 starts and roundtrips Hi/Test/... through real Store")
          PY
      - name: Validate mobile HTML tab layout and JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("v13/mobile_dashboard.html").read_text()
          assert all(f'data-tab="{t}"' in html for t in ("chat","brain","settings","maintenance"))
          assert 'id="copy-chat"' in html and 'id="chat-compose"' in html
          assert 'id="v13-live-output"' in html and 'id="update-result"' in html
          assert html.index('id="v13-live-output"') < html.index('id="chat-compose"')
          assert 'Gesamten Chat kopieren' in html
          assert 'Fehlerbericht jetzt senden' in Path('v13/mobile_dashboard.py').read_text()
          assert 'id="diagnostic-result"' in html
          assert '@@DIAGNOSTIC_STATUS@@' in html
          assert 'data-fill=' not in html.split("<script>",1)[0]  # generated by backend
          script=html.split("<script>",1)[1].split("</script>",1)[0]
          Path("/tmp/v13-dashboard.js").write_text(script.replace("@@PREFIX@@","/t/test"))
          PY
          node --check /tmp/v13-dashboard.js
          node tests/test_mobile_dashboard_browser.js
      - name: Validate one-command bootstrap syntax
        run: |
          bash -n scripts/termux_one_command.sh scripts/v13-update
          python -m unittest discover -s tests -p 'test_termux_bootstrap.py' -v
