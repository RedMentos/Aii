name: V13 private owner-read Termux bootstrap
on:
  push:
    branches:
      - gpt6/v13-private-remote-bridge-20261111
  pull_request:
    paths:
      - 'v13/code/v13/owner_read_bridge.py'
      - 'v13/code/v13/source_updater.py'
      - 'v13/code/v13/mobile_dashboard.py'
      - 'v13/code/v13/managed_console.py'
      - 'v13/code/tests/test_managed_console_dashboard.py'
      - 'v13/code/tests/test_source_updater.py'
      - 'v13/code/scripts/v13-update'
      - 'v13/code/tests/test_owner_read_bridge.py'
      - 'v13/code/scripts/termux_one_command.sh'
      - '.github/workflows/v13-private-owner-read-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v13/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile read-only bridge and run synthetic security tests
        run: |
          python -m py_compile v13/owner_read_bridge.py v13/remote_maintenance_bridge.py tests/test_owner_read_bridge.py
          python -m unittest discover -s tests -p 'test_owner_read_bridge.py' -v
      - name: Validate updater and phone UI source syntax
        run: |
          python -m py_compile v13/source_updater.py v13/mobile_dashboard.py tests/test_source_updater.py
          python -m unittest discover -s tests -p 'test_source_updater.py' -v
          python -m py_compile v13/managed_console.py tests/test_managed_console_dashboard.py
          python -m unittest discover -s tests -p 'test_managed_console_dashboard.py' -v
      - name: Validate one-command bootstrap syntax
        run: bash -n scripts/termux_one_command.sh scripts/v13-update
