name: V13 Run434 P_s21 stage5 source-only
on:
  pull_request:
    paths:
      - '.github/workflows/run434-stage5-p21-source.yml'
      - 'v13/code/scripts/run434_stage5_p21.py'
      - 'v13/code/tests/test_run434_stage5_p21.py'
      - 'v13/code/docs/proofs/continuation-20261026/run434-native-p21/**'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 80
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Pin frozen source and compile
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/RUN434_HEAD.txt"
          git merge-base --is-ancestor 0db3a569aa16dd495d6c4013b4610229fd03ed74 HEAD
          test "$(git hash-object v13/code/scripts/run394_step2_fresh.py)" = "fae7aed612108a554d8566b2917ebf31022df423"
          test "$(git hash-object v13/code/scripts/run397_step2_resume.py)" = "f1946054135cb6fdf48c06477308f518e2e62ad9"
          test "$(git hash-object v13/code/scripts/run429_verify_native168.py)" = "d2fb5572f2b4ded290d4a3bc081f67c20b53cd47"
          test "$(git hash-object v13/code/scripts/run430_import_stage4_artifact.py)" = "61987b9c9967df7d6bbaab38eb59cbb101d59848"
          test "$(git hash-object v13/code/specs/models.json)" = "7af05962af41d0bc3f7dd18ef01d4eba55eabf99"
          sha256sum v13/code/scripts/run434_stage5_p21.py v13/code/tests/test_run434_stage5_p21.py | tee "$RUNNER_TEMP/RUN434_SOURCE_SHA256.txt"
          python3 -m compileall -q v13/code/scripts/run434_stage5_p21.py v13/code/tests/test_run434_stage5_p21.py
      - name: Source-only stage5 and inherited receipt tests
        id: tests
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          python3 -m venv "$RUNNER_TEMP/run434venv"
          timeout 240s "$RUNNER_TEMP/run434venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52' 2>&1 | tee "$RUNNER_TEMP/RUN434_DEPS_RAW.log"
          dep_rc=${PIPESTATUS[0]}
          if [ "$dep_rc" -eq 0 ]; then
            PYTHONPATH="$PWD:$PWD/scripts" "$RUNNER_TEMP/run434venv/bin/python" -m unittest -v \
              tests.test_run434_stage5_p21 \
              tests.test_run430_import_stage4_artifact \
              tests.test_run429_verify_native168 \
              tests.test_run421_stage4_o21 \
              tests.test_run419_verify_stage3_native \
              2>&1 | tee "$RUNNER_TEMP/RUN434_TESTS_RAW.log"
            rc=${PIPESTATUS[0]}
          else
            rc=2
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN434_TESTS_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Privacy
        id: privacy
        run: |
          set -uo pipefail
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree 2>&1 | tee "$RUNNER_TEMP/RUN434_PRIVACY_RAW.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUNNER_TEMP/RUN434_PRIVACY_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Close raw
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          find . -maxdepth 1 -type f -name 'RUN434_*' ! -name RUN434_SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > RUN434_SHA256SUMS.txt
      - name: Upload only small source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V13-Run434-P21-Stage5-Source-Raw-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/RUN434_*
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce
        if: always()
        run: |
          test "${{ steps.tests.outputs.rc }}" = "0"
          test "${{ steps.privacy.outputs.rc }}" = "0"
