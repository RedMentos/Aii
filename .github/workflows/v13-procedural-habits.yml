name: V13 local habits and brain error diagnosis
on:
  push:
    branches:
      - 'codex/v13-habit-fastbatch-discovery-*'
  pull_request:
    paths:
      - 'v13/code/v13/procedural_habits.py'
      - 'v13/code/v13/procedural_batch.py'
      - 'v13/code/v13/brain_diagnosis.py'
      - 'v13/code/v13/brain_panel.py'
      - 'v13/code/tests/test_brain_diagnosis.py'
      - 'v13/code/tests/test_procedural_habits.py'
      - 'v13/code/tests/test_procedural_batch.py'
      - '.github/workflows/v13-procedural-habits.yml'
permissions:
  contents: read
jobs:
  habits:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: v13/code
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile bounded local habit discovery
        run: |
          python -m py_compile v13/procedural_habits.py v13/procedural_batch.py v13/brain_diagnosis.py v13/brain_panel.py v13/operator.py tests/test_procedural_habits.py tests/test_brain_diagnosis.py
      - name: "Regression tests: real local operator + source-bound discovery"
        run: |
          python -m pytest -q tests/test_procedural_habits.py tests/test_procedural_batch.py tests/test_brain_diagnosis.py
      - name: "Verify public-repository privacy and provenance scope"
        run: |
          python scripts/public_repo_privacy_scan.py --base 22441aecd8d0760e2281c6a32670d988ea3718e4 --head HEAD
