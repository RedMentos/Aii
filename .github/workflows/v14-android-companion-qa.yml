name: V14 Android companion QA — one-shot approval

on:
  push:
    branches:
      - qa/v14-companion-single-use-approval-20261121
    paths:
      - "android-companion/**"
      - ".github/workflows/v14-android-companion-qa.yml"
  pull_request:
    branches:
      - core/v14-android-companion-native-20261121
    paths:
      - "android-companion/**"
      - ".github/workflows/v14-android-companion-qa.yml"

permissions:
  contents: read

jobs:
  android-companion-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools;platforms;android-35;build-tools;35.0.0"
      - name: Build APK and run Android SQLite approval regressions
        run: gradle --no-daemon -p android-companion :app:assembleDebug :app:testDebugUnitTest
