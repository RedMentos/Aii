name: V13 guarded World plus AG5 two-parent review candidate
on:
  push:
    branches:
      - codex/world-ag5-merge-candidate-builder-20261027
    paths:
      - '.github/workflows/world-ag5-merge-candidate.yml'
      - 'v13/code/scripts/resolve_world_ag5_candidate.py'
permissions:
  contents: write
concurrency:
  group: v13-world-ag5-merge-candidate-builder
  cancel-in-progress: false
jobs:
  build-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Isolated Python
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/mergecandidate"
          timeout 240s "$RUNNER_TEMP/mergecandidate/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Exact-head merge and two-file resolution in disposable runner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mergeproof"
          git rev-parse HEAD > "$RUNNER_TEMP/mergeproof/WORLD_HEAD.txt"
          git fetch --no-tags origin c615497384dc5519be59232451895ca443ce9e45 > "$RUNNER_TEMP/mergeproof/FETCH_RAW.log" 2>&1
          git rev-parse FETCH_HEAD > "$RUNNER_TEMP/mergeproof/AG5_HEAD.txt"
          git merge-base HEAD FETCH_HEAD > "$RUNNER_TEMP/mergeproof/MERGE_BASE.txt"
          set +e
          git -c user.name='V13 Review Candidate' -c user.email='review@localhost.invalid' merge --no-commit --no-ff FETCH_HEAD > "$RUNNER_TEMP/mergeproof/MERGE_RAW.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$RUNNER_TEMP/mergeproof/MERGE_EXIT.txt"
          test "$rc" = 1
          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/mergeproof/CONFLICT_PATHS.txt"
          diff -u <(printf 'v13/code/scripts/handy_pflicht.py\nv13/code/v13/operator.py\n') "$RUNNER_TEMP/mergeproof/CONFLICT_PATHS.txt"
          "$RUNNER_TEMP/mergecandidate/bin/python" v13/code/scripts/resolve_world_ag5_candidate.py > "$RUNNER_TEMP/mergeproof/RESOLUTION_RAW.json"
          git add v13/code/scripts/handy_pflicht.py v13/code/v13/operator.py
          git diff --cached --check -- v13/code/scripts/handy_pflicht.py v13/code/v13/operator.py
          test -z "$(git diff --name-only --diff-filter=U)"
          "$RUNNER_TEMP/mergecandidate/bin/python" -m json.tool v13/code/BUILD_STATE.json > /dev/null
          git diff --cached --stat > "$RUNNER_TEMP/mergeproof/RESOLUTION_STAT.txt"
      - name: Run focused and broad software tests with raw exits
        run: |
          set +e
          (cd v13/code && PYTHONPATH="$PWD:$PWD/scripts" timeout 480s "$RUNNER_TEMP/mergecandidate/bin/python" -m unittest -v tests.test_handy_pflicht tests.test_handy_pflicht_resume tests.test_operator_config_atomic_run623 tests.test_language_operator_run620 tests.test_effort tests.test_world_console_shadow tests.test_world_probe_bounded_io tests.test_world_file_timing_receipts tests.test_world_jepa_shadow_lifecycle tests.test_world_jepa_shadow_probe tests.test_world_jepa_slots_checkpoint) > "$RUNNER_TEMP/mergeproof/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/mergeproof/FOCUSED_EXIT.txt"
          if test "$(cat "$RUNNER_TEMP/mergeproof/FOCUSED_EXIT.txt")" = 0; then
            (cd v13/code && PYTHONPATH="$PWD:$PWD/scripts" timeout 600s "$RUNNER_TEMP/mergecandidate/bin/python" -m unittest discover -s tests -p 'test_*.py' -v) > "$RUNNER_TEMP/mergeproof/BROAD_RAW.log" 2>&1
            echo "$?" > "$RUNNER_TEMP/mergeproof/BROAD_EXIT.txt"
          else
            echo SKIPPED_FOCUSED_FAILED > "$RUNNER_TEMP/mergeproof/BROAD_EXIT.txt"
          fi
          "$RUNNER_TEMP/mergecandidate/bin/python" -m compileall -q v13/code/v13 v13/code/scripts > "$RUNNER_TEMP/mergeproof/COMPILE_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/mergeproof/COMPILE_EXIT.txt"
          exit 0
      - name: Create local merge commit and privacy-check exact tree
        run: |
          set -euo pipefail
          git -c user.name='V13 Review Candidate' -c user.email='review@localhost.invalid' commit --no-edit > "$RUNNER_TEMP/mergeproof/COMMIT_RAW.log" 2>&1
          git rev-parse HEAD > "$RUNNER_TEMP/mergeproof/MERGED_HEAD.txt"
          git show -s --format=%P HEAD > "$RUNNER_TEMP/mergeproof/PARENTS.txt"
          test "$(wc -w < "$RUNNER_TEMP/mergeproof/PARENTS.txt")" = 2
          sha256sum v13/code/v13/operator.py v13/code/scripts/handy_pflicht.py v13/code/BUILD_STATE.json > "$RUNNER_TEMP/mergeproof/SOURCE_SHA256.txt"
          set +e
          "$RUNNER_TEMP/mergecandidate/bin/python" v13/code/scripts/public_repo_privacy_scan.py --base df3d690a34aca83e4da96e40c08f8bfb81e5d229 --head HEAD > "$RUNNER_TEMP/mergeproof/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/mergeproof/PRIVACY_EXIT.txt"
          exit 0
      - name: Upload original raw before any remote push
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-ag5-merge-candidate-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/mergeproof/
          if-no-files-found: error
      - name: Gate and push NEW review branch only
        run: |
          set -euo pipefail
          for n in FOCUSED COMPILE PRIVACY; do
            test "$(cat "$RUNNER_TEMP/mergeproof/${n}_EXIT.txt")" = 0 || { echo "$n failed"; tail -80 "$RUNNER_TEMP/mergeproof/${n}_RAW.log"; exit 1; }
          done
          target='refs/heads/codex/world-ag5-merged-review-20261027'
          if git ls-remote --exit-code --heads origin "$target" >/dev/null; then
            echo 'Target review branch already exists; refusing overwrite'
            exit 1
          fi
          git push origin "HEAD:$target"
          actual="$(git ls-remote origin "$target" | awk '{print $1}')"
          expected="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf '%s\n' "$actual" > "$RUNNER_TEMP/mergeproof/REMOTE_VERIFIED_SHA.txt"
      - name: Upload verified remote receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-ag5-remote-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/mergeproof/REMOTE_VERIFIED_SHA.txt
          if-no-files-found: error
