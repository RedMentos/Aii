name: V13 Run106 source-answer pending restore before initialize software acceptance
on:
  push:
    branches: [assistant/v13-run106-cli-recovery-before-init-20261029]
permissions:
  contents: read
concurrency:
  group: v13-run106-${{ github.ref }}
  cancel-in-progress: true
jobs:
  crosschain:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Exact imported sources, real subprocess tests, full suite and raw evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run96"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          source_ok=0
          check() {
            observed="$(git hash-object "$2" 2>/dev/null)" || return 1
            printf '%s %s\n' "$observed" "$2" >> "$e/SOURCE_RAW.log"
            [ "$observed" = "$1" ]
          }
          check 59b6f8febd71781738557a5492057af4689ada6e v13/code/v13/__main__.py || source_ok=1
          check ef3cdd5913a47b8e6e35bbaebf97a8325ecf13cb v13/code/v13/operator.py || source_ok=1
          check 53048dd477af945a75dd0f6825e4b81d057742a2 v13/code/v13/source_record.py || source_ok=1
          check 81a73a59c2df95fe3757229c486a505fc70335f7 v13/code/tests/test_run94_source_answer_cli.py || source_ok=1
          check 946ab53726b5ed0ae4ac0b9a776a4f81c1d6e8fd v13/code/tests/test_run95_human_budget_source.py || source_ok=1
          check 8e28fb0168465a85a2066666538e03b0ac33f548 v13/code/tests/test_run96_human_source_cli_crosschain.py || source_ok=1
          check f1e2a8a5572cbd536ea07f50bfd2906a125ace48 v13/code/docs/proofs/continuation-20261028/RUN96_HUMAN_SOURCE_CLI_CROSSCHAIN_PREREG.md || source_ok=1
          check 5117856b255796c081dda171d62bcebb86ab0729 v13/code/docs/proofs/continuation-20261028/RUN104_CLARIFY_CONTRACT_PREREG.md || source_ok=1
          check b44d2f4fb08c3aed5e47563509896f64f0f7e19b v13/code/docs/proofs/continuation-20261028/RUN106_CLI_RESTORE_BEFORE_INIT_PREREG.md || source_ok=1
          check 22c2a149848fba992407bd4f1fba41db73844755 v13/code/tests/test_run106_cli_restore_before_initialize.py || source_ok=1
          check 46def3572df2eed7cd33f3b3f6375e7b3dd6e191 v13/code/docs/proofs/continuation-20261028/RUN106_BRANCH_BUILD_STATE.json || source_ok=1
          check 1e967437564f97dd150809e1bc611629f51ce9f3 v13/code/docs/proofs/continuation-20261028/RUN104_BRANCH_BUILD_STATE.json || source_ok=1
          check 532e45eab08dd14cc0490c42857fa7bab1c4e894 v13/code/docs/HUMAN_SOURCE_CLI_CROSSCHAIN_REVIEW.md || source_ok=1
          check f0b432282c66de62709865c27ead208f48e58e45 v13/code/docs/proofs/continuation-20261028/RUN96_BRANCH_BUILD_STATE.json || source_ok=1
          check 75ca7f3f197665f665d9582b7f5c2efb1f598235 v13/code/scripts/ask_verified_budget.py || source_ok=1
          check 4b73842be25e784f70ade4f6c4ced3fe2dcb9eab v13/code/v13/source_consumer.py || source_ok=1
          check 53dc948d0d360f94743ad996eb83ea0e85c2dd0b v13/code/v13/memory.py || source_ok=1
          check 68e7ed1352800174972558f1e0b0683a42c8689a v13/code/v13/runtime.py || source_ok=1
          check 218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md || source_ok=1
          echo "$source_ok" > "$e/SOURCE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run106-venv"
          py="$RUNNER_TEMP/v13-run106-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          base_rc="$?"
          if [ "$base_rc" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
            torch_rc="$?"
            if [ "$torch_rc" = 0 ]; then
              "$py" -m pip install --disable-pip-version-check --no-input 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
              deps_rc="$?"
            else
              deps_rc=1
            fi
          else
            deps_rc=1
          fi
          echo "$deps_rc" > "$e/INSTALL_EXIT.txt"
          python3 -m compileall -q v13/code/v13/__main__.py v13/code/v13/operator.py v13/code/v13/source_record.py v13/code/tests/test_run96_human_source_cli_crosschain.py v13/code/tests/test_run106_cli_restore_before_initialize.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$source_ok" = 0 ] && [ "$deps_rc" = 0 ] && [ "$(cat "$e/COMPILE_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 180s "$py" -m unittest -v tests.test_run106_cli_restore_before_initialize tests.test_run96_human_source_cli_crosschain tests.test_run94_source_answer_cli tests.test_run95_human_budget_source) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
            (cd v13/code && timeout --signal=TERM --kill-after=10s 18m "$py" -m unittest discover -s tests -p 'test_*.py') > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else
            echo SKIPPED_PREREQ_RED > "$e/FOCUSED_RAW.log"; echo SKIPPED_RED > "$e/FOCUSED_EXIT.txt"
            echo SKIPPED_PREREQ_RED > "$e/FULL_RAW.log"; echo SKIPPED_RED > "$e/FULL_EXIT.txt"
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 4ddf364e127dd274884338835d2cf0407b2944d6 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 4ddf364e127dd274884338835d2cf0407b2944d6 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - name: Preserve Run96 original raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run106-cli-restore-order-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run96/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce source, tests and privacy without native promotion
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run96"
          for n in SOURCE INSTALL COMPILE FOCUSED FULL PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; raw retained; no gate promotion"
              tail -40 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN106_CLI_RESTORE_BEFORE_INIT_SOFTWARE_ONLY
