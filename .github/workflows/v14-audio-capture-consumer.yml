name: V14 signed one-shot audio consumer

on:
  push:
    branches:
      - "research-perception/**"
    paths:
      - "v13/code/v13/audio_capture_consumer.py"
      - "v13/code/tests/test_audio_capture_consumer.py"
      - ".github/workflows/v14-audio-capture-consumer.yml"
  pull_request:
    paths:
      - "v13/code/v13/audio_capture_consumer.py"
      - "v13/code/tests/test_audio_capture_consumer.py"
      - ".github/workflows/v14-audio-capture-consumer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v14-audio-capture-consumer-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  signed-audio-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal perception test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.2.0 numpy==2.3.5
      - name: Compile signed audio consumer and tests
        run: python -m py_compile v13/code/v13/audio_capture_consumer.py v13/code/tests/test_audio_capture_consumer.py
      - name: Run signed receipt, replay, consent and RAW EAR ingress tests
        working-directory: v13/code
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q tests/test_audio_capture_consumer.py tests/test_audio_input.py tests/test_audio_ear_voice_cues_v14.py tests/test_audio_speaker_evidence.py
      - name: Scan changed public content for secrets and private identifiers
        run: python v13/code/scripts/public_repo_privacy_scan.py --base origin/research-perception/v14-raw-ear-currentboss-20261122-run11 --head HEAD --no-worktree
