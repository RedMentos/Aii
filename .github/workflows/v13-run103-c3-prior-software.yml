name: V13 Run103 preregistered disjoint C3 prior-rule software preflight
on:
  push:
    branches:
      - assistant/v13-run103-c3-prior-native-pilot-20261031-auto11
    paths:
      - v13/code/docs/RUN103_C3_SOFTWARE_TRIGGER.txt
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      NO_MODEL_DOWNLOADS: "1"
      DO_NOT_TRACK: "1"
      V13_NO_AUTOSTART: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify fixed fixture, exact source envelopes and strict gates
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/run103-software"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/run103-venv" > "$e/VENV_RAW.log" 2>&1
          py="$RUNNER_TEMP/run103-venv/bin/python"
          echo 0 > "$e/VENV_EXIT.txt"
          "$py" -m pip install --disable-pip-version-check --no-input -q \
            'numpy==2.2.6' 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo 0 > "$e/DEPS_EXIT.txt"
          "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log"
          "$py" -m compileall -q v13/code/scripts/run103_c3_prior_fixture.py \
            v13/code/tests/test_run103_c3_prior_fixture.py > "$e/COMPILE_RAW.log" 2>&1
          echo 0 > "$e/COMPILE_EXIT.txt"
          set +e
          (cd v13/code && env PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests -p test_run103_c3_prior_fixture.py -v) > "$e/FIXTURE_RAW.log" 2>&1
          fixture_rc=$?
          set -e
          echo "$fixture_rc" > "$e/FIXTURE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py \
            --base 9fc4a85930b22ddb0c0f306d48bcddfad4806842 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo 0 > "$e/PRIVACY_EXIT.txt"
          git diff --check 9fc4a85930b22ddb0c0f306d48bcddfad4806842 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo 0 > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          tail -n 26 "$e/FIXTURE_RAW.log"
          test "$fixture_rc" -eq 0
      - name: Upload raw software prereg receipts including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run103-c3-software-${{ github.sha }}
          path: ${{ runner.temp }}/run103-software/
          if-no-files-found: error
          retention-days: 90
