name: V13 Run117S-R prior USER and hypothesis binding adversarial proof
on:
  push:
    branches:
      - assistant/v13-run117s-prior-source-binding-review-20261031-1915
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prior-source-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Run real SQLite adversarial tests and inherited non-native checks
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117s-r-prior-binding"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run117s-r-venv" > "$e/VENV_RAW.log" 2>&1
          py="$RUNNER_TEMP/v13-run117s-r-venv/bin/python"
          set +e
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          deps_rc=$?
          if test "$deps_rc" -eq 0; then
            (cd v13/code && env PYTHONPATH=. "$py" -m unittest -v tests.test_run117s_r_prior_source_binding_review) > "$e/ADVERSARIAL_RAW.log" 2>&1
            adversarial_rc=$?
            (cd v13/code && env PYTHONPATH=. "$py" -m unittest -v tests.test_run117s_b2_salient_source_shadow tests.test_run117s_body_complementarity_preflight) > "$e/INHERITED_RAW.log" 2>&1
            inherited_rc=$?
          else
            adversarial_rc=125;inherited_rc=125
            echo DEPS_RED > "$e/ADVERSARIAL_RAW.log"
            echo DEPS_RED > "$e/INHERITED_RAW.log"
          fi
          "$py" -m compileall -q v13/code/v13/b2_salient_source_excerpt_shadow_candidate.py v13/code/tests/test_run117s_r_prior_source_binding_review.py > "$e/COMPILE_RAW.log" 2>&1
          compile_rc=$?
          python3 v13/code/scripts/public_repo_privacy_scan.py --base dc0851db19a9872d580460dd67e650d247b7b6f2 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          privacy_rc=$?
          git diff --check dc0851db19a9872d580460dd67e650d247b7b6f2 HEAD > "$e/DIFF_RAW.log" 2>&1
          diff_rc=$?
          for x in "DEPS:$deps_rc" "ADVERSARIAL:$adversarial_rc" "INHERITED:$inherited_rc" "COMPILE:$compile_rc" "PRIVACY:$privacy_rc" "DIFF:$diff_rc"; do
            echo "${x#*:}" > "$e/${x%%:*}_EXIT.txt"
          done
          set -e
          "$py" - "$e" <<'PY' > "$e/RESULT_RAW.log"
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1]); names=('DEPS','ADVERSARIAL','INHERITED','COMPILE','PRIVACY','DIFF')
          r={'schema':'v13.run117s_r.prior_source_binding_evidence.v1',
             'head':(e/'HEAD.txt').read_text().strip(),
             'exits':{n:int((e/(n+'_EXIT.txt')).read_text()) for n in names},
             'native_calls':0,'synthetic_body_only':True,
             'output_committed':False,'tool_dispatches':0,
             'learning_authority':0,'delivery_authority':0,
             'step2_promoted':False,'b3_promoted':False,
             'jepa_weight':0,'redmi_measured':False,
             'whole_system_complete':False}
          (e/'RESULT.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat "$e/RESULT_RAW.log"
          tail -n 20 "$e/ADVERSARIAL_RAW.log"
          tail -n 5 "$e/INHERITED_RAW.log"
          for rc in "$deps_rc" "$adversarial_rc" "$inherited_rc" "$compile_rc" "$privacy_rc" "$diff_rc"; do test "$rc" -eq 0; done
      - name: Preserve original RED or GREEN logs and hashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117s-r-prior-binding-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117s-r-prior-binding/
          if-no-files-found: warn
          retention-days: 90
