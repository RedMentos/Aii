name: V13 Run40 AG12 null-span subtype triple-vote software preflight
on:
  push:
    branches: [assistant/v13-run40-ag12-null-span-native-20261031-hourly11]
    paths: ['.github/workflows/v13-run40-ag12-null-span-software.yml']
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Frozen source pins and software-only subtype regressions
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run40-software"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          670b3faeb2671ef1d3a0cbfa6df6ec0b5db3d146 v13/code/docs/AG12_NULL_SPAN_NATIVE_SUBTYPE_PREREG_RUN40_20261031.md
          f92faeefe835f86562f8fc37a4de4795563702f6 v13/code/v13/agi/solver_confidence_null_span_native_candidate.py
          409272754f600c4dfeb5642b5d6b3b0cda238e9b v13/code/tests/test_run40_ag12_null_span_native.py
          6a163fe8c7e981c5864ec326d6a960ffbd31aefe v13/code/scripts/run40_ag12_null_span_native.py
          128e6785416f0367265dfcd1c11cd626dfdefba7 v13/code/tests/test_run40_ag12_null_span_native_collector.py
          82019c70cb82fb1ad86b3c920a3354d20c95dd96 v13/code/v13/agi/solver_confidence_null_sentinel_candidate.py
          46982818f6c6078d823c97388c1a4ec250d82e14 v13/code/v13/agi/solver_confidence_finite_candidate.py
          66a9419143c456f01747b4796fb327b3b36711b3 v13/code/v13/agi/solver.py
          2135f4404f241cfc198abd7fe2288f13a622f4fc v13/code/v13/focal.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run40-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run40-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_run40_ag12_null_span_native tests.test_run40_ag12_null_span_native_collector tests.test_run37_ag12_null_sentinel_confidence tests.test_run36_ag12_native_confidence_incidence) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo PIN_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/v13/agi/solver_confidence_null_span_native_candidate.py v13/code/tests/test_run40_ag12_null_span_native.py v13/code/scripts/run40_ag12_null_span_native.py v13/code/tests/test_run40_ag12_null_span_native_collector.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          git fetch --no-tags --depth=1 origin 1bf72d065b54f458f269e1b0d0754488228a38ce > "$e/FETCH_RAW.log" 2>&1
          echo "$?" > "$e/FETCH_EXIT.txt"
          "$py" - > "$e/PRIVACY_RAW.log" 2>&1 <<'PY'
          import subprocess,sys
          sys.path.insert(0,'v13/code')
          from scripts.public_repo_privacy_scan import scan
          d=subprocess.check_output(['git','diff','--no-color','-U0','--text','1bf72d065b54f458f269e1b0d0754488228a38ce','HEAD'],text=True)
          hits=scan(d)
          print('privacy', 'CLEAN' if not hits else hits)
          sys.exit(bool(hits))
          PY
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 1bf72d065b54f458f269e1b0d0754488228a38ce HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original software raw and failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run40-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run40-software/
          if-no-files-found: error
          retention-days: 90
      - name: Require all software stages zero and no authority promotion
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-run40-software"
          for s in PINS VENV DEPS TEST COMPILE FETCH PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN40_NULL_SPAN_SOFTWARE_SHADOW_ONLY_NO_AGE_OR_STEP2_PROMOTION
