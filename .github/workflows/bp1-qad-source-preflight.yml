name: V13 BP1 official QAD master source metadata preflight
on:
  push:
    branches: [codex/gpt6-bp1-qad-source-preflight-20261027-0915]
    paths:
      - '.github/workflows/bp1-qad-source-preflight.yml'
      - 'v13/code/scripts/bp1_qad_source_audit.py'
      - 'v13/code/tests/test_bp1_qad_source_audit.py'
      - 'v13/code/docs/proofs/continuation-20261027/bp1-qad-source/**'
permissions:
  contents: read
concurrency:
  group: v13-bp1-qad-metadata-only
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Software negative tests, compile, privacy
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/bp1-qad-proof"
          git rev-parse HEAD > "$RUNNER_TEMP/bp1-qad-proof/HEAD.txt"
          sha256sum v13/code/scripts/bp1_qad_source_audit.py v13/code/tests/test_bp1_qad_source_audit.py > "$RUNNER_TEMP/bp1-qad-proof/SOURCE_SHA256.txt"
          (cd v13/code && PYTHONPATH="$PWD:$PWD/scripts" python3 -m unittest -v tests.test_bp1_qad_source_audit) > "$RUNNER_TEMP/bp1-qad-proof/UNIT_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp1-qad-proof/UNIT_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/bp1_qad_source_audit.py v13/code/tests/test_bp1_qad_source_audit.py > "$RUNNER_TEMP/bp1-qad-proof/COMPILE_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp1-qad-proof/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 172a8b546ec026b9d7f2ea55f6c86a0c8c3c6974 --head HEAD > "$RUNNER_TEMP/bp1-qad-proof/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp1-qad-proof/PRIVACY_EXIT.txt"
          exit 0
      - name: Retrieve exact official metadata, no model bytes (preserve RED)
        run: |
          set +e
          curl -fsSL --retry 1 --max-time 120 "https://huggingface.co/api/models/LiquidAI/LFM2.5-350M-GGUF/revision/657e078c94084481950a2d555a941481f715536b?blobs=true" -o "$RUNNER_TEMP/bp1-qad-proof/HF_RAW.json" > "$RUNNER_TEMP/bp1-qad-proof/FETCH_RAW.log" 2>&1
          rc="$?"
          echo "$rc" > "$RUNNER_TEMP/bp1-qad-proof/FETCH_EXIT.txt"
          if [ "$rc" = 0 ]; then
            sha256sum "$RUNNER_TEMP/bp1-qad-proof/HF_RAW.json" > "$RUNNER_TEMP/bp1-qad-proof/HF_RAW_SHA256.txt"
            (cd v13/code && PYTHONPATH="$PWD:$PWD/scripts" python3 scripts/bp1_qad_source_audit.py --metadata "$RUNNER_TEMP/bp1-qad-proof/HF_RAW.json" --out "$RUNNER_TEMP/bp1-qad-proof/QAD_SOURCE_AUDIT.json") > "$RUNNER_TEMP/bp1-qad-proof/AUDIT_RAW.log" 2>&1
            echo "$?" > "$RUNNER_TEMP/bp1-qad-proof/AUDIT_EXIT.txt"
          else
            echo 2 > "$RUNNER_TEMP/bp1-qad-proof/AUDIT_EXIT.txt"
          fi
          exit 0
      - name: Preserve raw public metadata and all exits including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bp1-qad-source-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/bp1-qad-proof/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce source-only checks
        run: |
          set -euo pipefail
          for n in UNIT COMPILE PRIVACY FETCH AUDIT; do
            test "$(cat "$RUNNER_TEMP/bp1-qad-proof/${n}_EXIT.txt")" = 0 || { echo "$n failed"; tail -80 "$RUNNER_TEMP/bp1-qad-proof/${n}_RAW.log" 2>/dev/null || true; exit 1; }
          done
          cat "$RUNNER_TEMP/bp1-qad-proof/AUDIT_RAW.log"
          echo "QAD_SOURCE_METADATA_ONLY; NO_MODEL_DOWNLOAD_OR_NATIVE_C3_TRAINING"
