name: V13 Run14D real SQLite AG9 AG12 lifecycle green
on:
  push:
    branches: [assistant/v13-run14d-ag9-ag12-sqlite-lifecycle-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run14d-sqlite-green.yml'
permissions:
  contents: read
jobs:
  sqlite-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact-source real SQLite lifecycle
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run14d-green"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          658b3c04bd95907211d1f5f7601436d3370d68e1 v13/code/v13/agi/metacog.py
          6f7906c9b9352b9d4ffe9cf9f237fba684942308 v13/code/v13/agi/generality.py
          5e5f44b9a843fb86e83a96a0bb1bfa487c03055a v13/code/tests/test_ag9_ag12_sqlite_lifecycle_run14d.py
          220a2e58bc928ab0f283b57c6c2313ebab6241d3 v13/code/docs/RUN14D_AG9_AG12_SQLITE_LIFECYCLE_PREREG_20261030.md
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=. python3 -m unittest -v tests.test_ag9_ag12_sqlite_lifecycle_run14d) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m py_compile v13/code/v13/agi/metacog.py v13/code/v13/agi/generality.py v13/code/tests/test_ag9_ag12_sqlite_lifecycle_run14d.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 7e7d57e1db88642f4fcd447eda2c012c1e625bfb --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 7e7d57e1db88642f4fcd447eda2c012c1e625bfb HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original SQLite raw even on RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run14d-green-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run14d-green/
          retention-days: 30
          if-no-files-found: error
      - name: Explicit scoped verdict
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run14d-green"
          for stage in PINS TEST COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            test "$(cat "$e/${stage}_EXIT.txt")" = 0
          done
