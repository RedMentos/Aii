name: V13 Run581 original FUTURE_005 partial 28-row postflight
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/run581-partial-postflight.yml'
      - 'v13/code/scripts/run581_partial_postflight.py'
      - 'v13/code/tests/test_run581_partial_postflight.py'
      - 'v13/code/docs/proofs/continuation-20261026/run581-partial-postflight/**'
permissions:
  contents: read
  actions: read
jobs:
  partial-original-postflight:
    if: ${{ github.event.pull_request.head.ref == 'codex/run581-native005-partial-postflight-20261026' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Bind prereg and exact code, Canon unchanged
        id: pins
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/RUN581_HEAD.txt"
          test "$(git hash-object v13/code/docs/proofs/continuation-20261026/run581-partial-postflight/PREREG.md)" = 586bfa5bf04eadc385718ba04280b35c3e0cc373
          test "$(git hash-object v13/code/scripts/run581_partial_postflight.py)" = ebac5ab10ddef37fd9aaeeecdf72fb7b9a4c9055
          test "$(git hash-object v13/code/tests/test_run581_partial_postflight.py)" = dd21dfe259bcb08d4ac3b85d3fb670ab948b4c35
          test "$(sha256sum v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md | cut -d' ' -f1)" = 3423906b01b24443fcef733fb5c7ef47296963df63e603d8f843c99d544877ee
          { date -u -Iseconds; python3 --version; } > "$RUNNER_TEMP/RUN581_HOST.txt"
      - name: Original immutable safe artifact download and SHA
        run: |
          set -uo pipefail
          set +e
          curl -fsSL --retry 0 --max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/RedMentos/Aii/actions/artifacts/12672672003/zip" \
            -o "$RUNNER_TEMP/original-native-568-safe.zip" > "$RUNNER_TEMP/RUN581_DOWNLOAD_RAW.log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "8860df4426bdfb1f07215519638b48cbb45b11266bfdd2ebd1b08e7465b9d151  $RUNNER_TEMP/original-native-568-safe.zip" | sha256sum -c - >> "$RUNNER_TEMP/RUN581_DOWNLOAD_RAW.log" 2>&1
            rc=$?
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN581_DOWNLOAD_EXIT.txt"
          exit 0
      - name: Source-only strict-score unit tests
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          python3 -m compileall -q scripts/run581_partial_postflight.py tests/test_run581_partial_postflight.py > "$RUNNER_TEMP/RUN581_COMPILE_RAW.log" 2>&1
          cr=$?
          echo "$cr" > "$RUNNER_TEMP/RUN581_COMPILE_EXIT.txt"
          if [ "$cr" -eq 0 ]; then
            timeout 90s python3 -m unittest -v tests.test_run581_partial_postflight > "$RUNNER_TEMP/RUN581_TEST_RAW.log" 2>&1
            rc=$?
          else
            rc=1
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN581_TEST_EXIT.txt"
          if [ "$rc" -ne 0 ] && [ -f "$RUNNER_TEMP/RUN581_TEST_RAW.log" ]; then tail -n 60 "$RUNNER_TEMP/RUN581_TEST_RAW.log"; fi
          exit 0
      - name: Independently rescore available original 28 rows; retain p02 unavailable
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          if [ "$(cat "$RUNNER_TEMP/RUN581_DOWNLOAD_EXIT.txt")" = 0 ]; then
            timeout 120s python3 -m scripts.run581_partial_postflight \
              --safe-zip "$RUNNER_TEMP/original-native-568-safe.zip" \
              --report "$RUNNER_TEMP/RUN581_REPORT.json" > "$RUNNER_TEMP/RUN581_AUDIT_RAW.log" 2>&1
            rc=$?
          else
            rc=1
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN581_AUDIT_EXIT.txt"
          if [ "$rc" -eq 0 ]; then cat "$RUNNER_TEMP/RUN581_AUDIT_RAW.log"; else tail -n 70 "$RUNNER_TEMP/RUN581_AUDIT_RAW.log" 2>/dev/null || true; fi
          exit 0
      - name: Official public privacy scan
        if: always()
        run: |
          set -uo pipefail
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree > "$RUNNER_TEMP/RUN581_PRIVACY_RAW.log" 2>&1
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/RUN581_PRIVACY_EXIT.txt"
          exit 0
      - name: SHA-close bounded audit evidence, not original safe raw
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          find . -maxdepth 1 -type f -name 'RUN581_*' ! -name RUN581_SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > RUN581_SHA256SUMS.txt
      - name: Preserve bounded partial report even RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run581-original-partial-28-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/RUN581_*
          if-no-files-found: error
          retention-days: 30
      - name: Enforce original partial scope, never promote full 42
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.pins.outcome }}" = success
          test "$(cat "$RUNNER_TEMP/RUN581_DOWNLOAD_EXIT.txt")" = 0
          test "$(cat "$RUNNER_TEMP/RUN581_COMPILE_EXIT.txt")" = 0
          test "$(cat "$RUNNER_TEMP/RUN581_TEST_EXIT.txt")" = 0
          test "$(cat "$RUNNER_TEMP/RUN581_AUDIT_EXIT.txt")" = 0
          test "$(cat "$RUNNER_TEMP/RUN581_PRIVACY_EXIT.txt")" = 0
