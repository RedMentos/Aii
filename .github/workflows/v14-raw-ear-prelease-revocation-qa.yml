name: V14 RAW EAR pre-processing consent revocation QA

on:
  pull_request:
    branches:
      - "research-perception/v14-raw-ear-consent-current-20261121-run11"
      - "gpt6/v13-private-remote-bridge-20261111"
      - "qa/v14-jepa-checkpoint-publication-20261121"
    paths:
      - "v13/code/v13/audio_voice_cues.py"
      - "v13/code/v13/audio_temporal_evidence.py"
      - "v13/code/v13/audio_silero_vad.py"
      - "v13/code/tests/test_audio_ear_voice_cues_v14.py"
      - ".github/workflows/v14-raw-ear-prelease-revocation-qa.yml"
  push:
    branches:
      - "research-perception/**"
      - "qa/v14-jepa-checkpoint-publication-20261121"
    paths:
      - "v13/code/v13/audio_voice_cues.py"
      - "v13/code/v13/audio_temporal_evidence.py"
      - "v13/code/v13/audio_silero_vad.py"
      - "v13/code/tests/test_audio_ear_voice_cues_v14.py"
      - ".github/workflows/v14-raw-ear-prelease-revocation-qa.yml"

permissions:
  contents: read

jobs:
  consent-revocation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install isolated test dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 pytest==9.2.0
      - name: Compile exact RAW EAR producer and tests
        run: |
          python -m py_compile \
            v13/code/v13/audio_voice_cues.py \
            v13/code/v13/audio_temporal_evidence.py \
            v13/code/tests/test_audio_ear_voice_cues_v14.py
      - name: Run complete RAW EAR producer regressions
        env:
          PYTHONPATH: v13/code
        run: python -m pytest -q v13/code/tests/test_audio_ear_voice_cues_v14.py
