name: V13 Run121 CLI persisted standstill regression
on:
  pull_request:
    paths:
      - ".github/workflows/v13-run121-cli-standstill.yml"
      - "v13/code/tests/test_cli_standstill_run121.py"
      - "v13/code/v13/__main__.py"
      - "v13/code/docs/proofs/continuation-20261025/cli-standstill-run121/**"
permissions:
  contents: read
concurrency:
  group: v13-run121-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Official privacy scan
        run: |
          set -euo pipefail
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
  software:
    needs: privacy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Isolated model-free prerequisites
        run: |
          python3 -m venv "$RUNNER_TEMP/run121"
          "$RUNNER_TEMP/run121/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Real CLI and inherited stop/phone regressions
        run: |
          set -euo pipefail
          cd v13/code
          export PYTHONPATH="$PWD"
          "$RUNNER_TEMP/run121/bin/python" -m compileall -q v13
          for pattern in test_cli_standstill_run121.py test_phone_cli_run87.py test_phone_operator_journey_run86.py test_standstill.py; do
            echo "RUN121_SUITE=$pattern"
            "$RUNNER_TEMP/run121/bin/python" -m unittest discover -s tests -p "$pattern" -v
          done
          echo "RUN121_LINUX_SOFTWARE_ONLY_PASS; NO_NATIVE_OR_REDMI_PROOF"
