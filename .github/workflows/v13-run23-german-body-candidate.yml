name: V13 Run23 German AG12 BodySolver candidate GREEN
on:
  push:
    branches: [assistant/v13-run23-ag12-german-body-eval-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run23-german-body-candidate.yml'
permissions:
  contents: read
jobs:
  german-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned German BodySolver and English legacy software regressions
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run23-candidate"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          95f4361704caf236ef4a80c46776ae9982ec60f0 v13/code/docs/AG12_GERMAN_BODY_EVAL_PREREG_RUN23_20261030.md
          3a5c13e14307d08c894476fa7acfc145acb16d00 v13/code/tests/test_ag12_german_body_eval_run23.py
          66a9419143c456f01747b4796fb327b3b36711b3 v13/code/v13/agi/solver.py
          8e4727140e9f1e88b64c6d3bfdccb8526f772647 v13/code/v13/agi/__init__.py
          32a03faf746f3bb4a3d7968b6d9b5d06e7db0a2c v13/code/v13/operator.py
          1944cffced498a32a28d74ec13bc9674df8e55fb v13/code/v13/agi/language_compare.py
          a1cab60363814cb86472a42defb5089d4cdbd432 v13/code/v13/agi/generality.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=. python3 -m unittest -v tests.test_ag12_german_body_eval_run23 tests.test_agi_solver tests.test_growth tests.test_ag12_bilingual_compare_run22 tests.test_ag12_ag9_direct_feedback_run14i tests.test_ag12_solver_identity_run21) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m py_compile v13/code/v13/agi/solver.py v13/code/v13/agi/__init__.py v13/code/v13/operator.py v13/code/tests/test_ag12_german_body_eval_run23.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 018c3fc875de36690545ec31731b0968a0e22466 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 018c3fc875de36690545ec31731b0968a0e22466 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve candidate raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run23-candidate-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run23-candidate/
          retention-days: 30
          if-no-files-found: error
      - name: Require every candidate stage GREEN
        if: always()
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run23-candidate"
          test "$(cat "$e/PINS_EXIT.txt")" = 0
          test "$(cat "$e/TEST_EXIT.txt")" = 0
          test "$(cat "$e/COMPILE_EXIT.txt")" = 0
          test "$(cat "$e/PRIVACY_EXIT.txt")" = 0
          test "$(cat "$e/DIFF_EXIT.txt")" = 0
          echo 'RUN23_GERMAN_BODYSOLVER_SOFTWARE_GREEN_NO_NATIVE_OR_TRANSFER_PROMOTION'
