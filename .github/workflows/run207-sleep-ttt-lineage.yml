name: Run207 Sleep TTT source-lineage revocation (software)
on:
  pull_request:
    paths:
      - 'v13/code/v13/sleep_offline.py'
      - 'v13/code/tests/test_sleep_ttt_source_lineage_run207.py'
      - '.github/workflows/run207-sleep-ttt-lineage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sleep-ttt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Isolated software prerequisites
        run: python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Actual-source TTT lineage, Sleep and history regressions
        working-directory: v13/code
        run: |
          python -m unittest -v tests.test_sleep_ttt_source_lineage_run207 tests.test_sleep_offline tests.test_sleep_memory_c3_continuity_run205 tests.test_history_lineage
          python -m compileall -q v13/sleep_offline.py tests/test_sleep_ttt_source_lineage_run207.py
      - name: Official public repository privacy scan
        run: python v13/code/scripts/public_repo_privacy_scan.py --base 681deec1d7a11a25324e3989617d7de2870d1a7c --head HEAD --no-worktree
      - name: Claim boundary
        run: echo 'Software/synthetic only; TTT staging has no learning or authority; STEP2/B3/JEPA gates unchanged'
