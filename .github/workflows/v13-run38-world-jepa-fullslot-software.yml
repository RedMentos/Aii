name: V13 Run38 World-JEPA full-six-slot software preflight
on:
  push:
    branches: [assistant/v13-run38-world-jepa-fullslot-training-20261031-hourly11]
    paths: ['.github/workflows/v13-run38-world-jepa-fullslot-software.yml']
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Frozen source pins, focused tests and closed raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run38-software"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          a37bb2a7db068b21061bb56a3526b9a8c69c7b30 v13/code/docs/WORLD_JEPA_FULLSLOT_TRAINING_PREREG_RUN38_20261031.md
          51bc5260cde8db3bc6cf7924a7a089a5cdfe5fd0 v13/code/v13/world_jepa_fullslot_candidate.py
          909cc20adc014048d9c3bd51248eef2c4d611cf7 v13/code/tests/test_run38_world_jepa_fullslot_candidate.py
          a423f210cd87f428e7a014f1ed7ae873271e8c7c v13/code/scripts/run38_world_jepa_fullslot_real.py
          572f976a770e5e70063c519a2027803d02fcf3c2 v13/code/tests/test_run38_world_jepa_fullslot_real.py
          99a686a131a1bdc89efe0d0cf9610ec54cbd853b v13/code/v13/world_jepa.py
          67e14e0d03c50c4767b74d5b02a819a95c6cc262 v13/code/v13/world_jepa_slot_candidate.py
          219bf7233cb91c746c89a60f9b7789dc3b5ca9ef v13/code/scripts/run35_world_jepa_slot_alignment_real.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run38-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run38-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_run38_world_jepa_fullslot_candidate tests.test_run38_world_jepa_fullslot_real tests.test_world_jepa_slot_candidate_run28 tests.test_run35_world_jepa_slot_alignment tests.test_world_jepa_atomic_fit) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo PIN_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/v13/world_jepa_fullslot_candidate.py v13/code/tests/test_run38_world_jepa_fullslot_candidate.py v13/code/scripts/run38_world_jepa_fullslot_real.py v13/code/tests/test_run38_world_jepa_fullslot_real.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          git fetch --no-tags --depth=1 origin 9006c30437840383873136862e326b46ffa7abea > "$e/FETCH_RAW.log" 2>&1
          echo "$?" > "$e/FETCH_EXIT.txt"
          "$py" - > "$e/PRIVACY_RAW.log" 2>&1 <<'PY'
          import subprocess,sys
          sys.path.insert(0,'v13/code')
          from scripts.public_repo_privacy_scan import scan
          d=subprocess.check_output(['git','diff','--no-color','-U0','--text','9006c30437840383873136862e326b46ffa7abea','HEAD'],text=True)
          hits=scan(d)
          print('privacy', 'CLEAN' if not hits else hits)
          sys.exit(bool(hits))
          PY
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 9006c30437840383873136862e326b46ffa7abea HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original software raw including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run38-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run38-software/
          if-no-files-found: error
          retention-days: 90
      - name: Require every stage zero, no learning promotion
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-run38-software"
          for s in PINS VENV DEPS TEST COMPILE FETCH PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN38_FULLSLOT_SOFTWARE_SHADOW_ONLY_NO_AGE_OR_WORLD_JEPA_PROMOTION
