name: V13 BP1 genuine QAD Q4 base-only 22-row native heldout baseline
on:
  push:
    branches: [codex/gpt6-bp1-qad-base-heldout-20261027]
    paths:
      - '.github/workflows/bp1-qad-base-heldout-native.yml'
      - 'v13/code/scripts/bp1_qad_base_heldout.py'
      - 'v13/code/tests/test_bp1_qad_base_heldout.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: v13-bp1-qad-native-smoke-heavy-serial
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Exact base-only software tests and privacy
        run: |
          set -euo pipefail
          cd v13/code
          PYTHONPATH="$PWD:$PWD/scripts" python3 -m unittest -v tests.test_bp1_qad_base_heldout tests.test_bp1_paired_score tests.test_bp1_native_collect
          python3 -m compileall -q scripts/bp1_qad_base_heldout.py tests/test_bp1_qad_base_heldout.py
          cd ../..
          python3 v13/code/scripts/public_repo_privacy_scan.py --base f6d6812a493cc7d2235e97bf16e0324242d1ecd6 --head HEAD
  native:
    needs: software
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: '1'
      NO_PRODUCTION_ACTIVATION: '1'
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Exact source and host budget
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/bp1-base-native"
          git rev-parse HEAD > "$RUNNER_TEMP/bp1-base-native/HEAD.txt"
          sha256sum v13/code/scripts/bp1_qad_base_heldout.py v13/code/tests/test_bp1_qad_base_heldout.py > "$RUNNER_TEMP/bp1-base-native/SOURCE_SHA256.txt"
          (free -h; df -h "$RUNNER_TEMP"; cat /sys/fs/cgroup/memory.max 2>/dev/null || true) > "$RUNNER_TEMP/bp1-base-native/RESOURCE_BEFORE.log" 2>&1
          python3 - <<'PY' > "$RUNNER_TEMP/bp1-base-native/BUDGET_RAW.log" 2>&1
          import os,shutil
          free=shutil.disk_usage(os.environ['RUNNER_TEMP']).free
          raw=open('/sys/fs/cgroup/memory.max').read().strip() if os.path.isfile('/sys/fs/cgroup/memory.max') else 'max'
          cap=int(raw) if raw.isdigit() else 8_000_000_000
          print('disk_free',free,'cgroup_memory_cap',cap)
          assert free>=2_000_000_000 and cap>=2_000_000_000
          PY
          echo "$?" > "$RUNNER_TEMP/bp1-base-native/BUDGET_EXIT.txt"
          exit 0
      - name: Fetch immutable original source-disjoint heldout only
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/bp1-heldout"
          LOCATION="$(curl -fsS --max-time 60 -o /dev/null -w '%{redirect_url}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/RedMentos/Aii/actions/artifacts/12715684803/zip)"
          rc="$?"
          if [ "$rc" = 0 ] && [[ "$LOCATION" == https://* ]]; then
            curl -fsSL --retry 2 --max-time 180 "$LOCATION" -o "$RUNNER_TEMP/bp1-heldout-source.zip" > "$RUNNER_TEMP/bp1-base-native/DATASET_RAW.log" 2>&1
            rc="$?"
          else
            echo 'artifact redirect failed' > "$RUNNER_TEMP/bp1-base-native/DATASET_RAW.log"
            rc=2
          fi
          if [ "$rc" = 0 ]; then
            echo "12a66c12019ee267cac12defd0b281f34fbcac5dc1f2e941236ae4ebf9a5f56c  $RUNNER_TEMP/bp1-heldout-source.zip" | sha256sum -c - >> "$RUNNER_TEMP/bp1-base-native/DATASET_RAW.log" 2>&1
            rc="$?"
          fi
          if [ "$rc" = 0 ]; then
            unzip -p "$RUNNER_TEMP/bp1-heldout-source.zip" bp1-output/heldout_paired.jsonl > "$RUNNER_TEMP/bp1-heldout/heldout_paired.jsonl"
            unzip -p "$RUNNER_TEMP/bp1-heldout-source.zip" bp1-output/MANIFEST.json > "$RUNNER_TEMP/bp1-heldout/MANIFEST.json"
            echo "7238a0220255cbccbcf1f9ccfad8dc03febfc37f7bc1d9d0aa645618f006508c  $RUNNER_TEMP/bp1-heldout/heldout_paired.jsonl" | sha256sum -c - >> "$RUNNER_TEMP/bp1-base-native/DATASET_RAW.log" 2>&1
            rc="$?"
          fi
          if [ "$rc" = 0 ]; then
            PYTHONPATH="$PWD/v13/code" python3 - <<'PY' >> "$RUNNER_TEMP/bp1-base-native/DATASET_RAW.log" 2>&1
          import os
          from scripts import bp1_paired_score as S
          idx,digest=S.load_dataset(os.environ['RUNNER_TEMP']+'/bp1-heldout')
          print('heldout rows',len(idx),'sha',digest)
          assert len(idx)==22 and digest==S.HELDOUT_SHA
          PY
            rc="$?"
          fi
          echo "$rc" > "$RUNNER_TEMP/bp1-base-native/DATASET_EXIT.txt"
          exit 0
      - name: Fetch official immutable QAD Q4 GGUF and license
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/bp1-qad-base-model"
          curl -fsSL --retry 2 --max-time 720 "https://huggingface.co/LiquidAI/LFM2.5-350M-GGUF/resolve/657e078c94084481950a2d555a941481f715536b/LFM2.5-350M-QAD-Q4_0.gguf" -o "$RUNNER_TEMP/bp1-qad-base-model/base.gguf" > "$RUNNER_TEMP/bp1-base-native/MODEL_RAW.log" 2>&1
          rc="$?"
          if [ "$rc" = 0 ]; then
            echo "3d10b6ab8fc91a919534b9558e266255aca0bbc7f6d015963599aa9e74e05b1d  $RUNNER_TEMP/bp1-qad-base-model/base.gguf" | sha256sum -c - >> "$RUNNER_TEMP/bp1-base-native/MODEL_RAW.log" 2>&1
            rc="$?"
          fi
          if [ "$rc" = 0 ]; then
            curl -fsSL --retry 1 --max-time 60 "https://huggingface.co/LiquidAI/LFM2.5-350M-GGUF/resolve/657e078c94084481950a2d555a941481f715536b/qad/LICENSE" -o "$RUNNER_TEMP/bp1-qad-base-model/LICENSE" >> "$RUNNER_TEMP/bp1-base-native/MODEL_RAW.log" 2>&1
            rc="$?"
          fi
          if [ "$rc" = 0 ]; then
            sha256sum "$RUNNER_TEMP/bp1-qad-base-model/LICENSE" > "$RUNNER_TEMP/bp1-base-native/MODEL_LICENSE_SHA256.txt"
          fi
          echo "$rc" > "$RUNNER_TEMP/bp1-base-native/MODEL_EXIT.txt"
          exit 0
      - name: Fetch pinned b10964 llama-server with exact binary hash
        run: |
          set +e
          curl -fsSL --retry 2 --max-time 300 "https://github.com/ggml-org/llama.cpp/releases/download/b10964/llama-b10964-bin-ubuntu-x64.tar.gz" -o "$RUNNER_TEMP/bp1-base-llama.tar.gz" > "$RUNNER_TEMP/bp1-base-native/RUNNER_RAW.log" 2>&1
          rc="$?"
          if [ "$rc" = 0 ]; then
            echo "9abf88aea48a55d0f80edb1ee20220b186848cca0b4e919d71518cfd7ca67443  $RUNNER_TEMP/bp1-base-llama.tar.gz" | sha256sum -c - >> "$RUNNER_TEMP/bp1-base-native/RUNNER_RAW.log" 2>&1
            rc="$?"
          fi
          if [ "$rc" = 0 ]; then
            mkdir -p "$RUNNER_TEMP/bp1-base-llama"
            tar -xzf "$RUNNER_TEMP/bp1-base-llama.tar.gz" -C "$RUNNER_TEMP/bp1-base-llama" >> "$RUNNER_TEMP/bp1-base-native/RUNNER_RAW.log" 2>&1
            rc="$?"
          fi
          if [ "$rc" = 0 ]; then
            SERVER="$(find "$RUNNER_TEMP/bp1-base-llama" -type f -name llama-server | head -1)"
            if [ -z "$SERVER" ]; then rc=2; else
              echo "$SERVER" > "$RUNNER_TEMP/bp1-base-native/SERVER_PATH.txt"
              echo "79e312188dc1d75c28201771f106e91de470b5cebdd838d31bb4db25eecf5d39  $SERVER" | sha256sum -c - >> "$RUNNER_TEMP/bp1-base-native/RUNNER_RAW.log" 2>&1
              rc="$?"
            fi
          fi
          echo "$rc" > "$RUNNER_TEMP/bp1-base-native/RUNNER_EXIT.txt"
          exit 0
      - name: Source-bound genuine base-only 22-row collection and software score
        run: |
          set +e
          if [ "$(cat "$RUNNER_TEMP/bp1-base-native/BUDGET_EXIT.txt")" = 0 ] && [ "$(cat "$RUNNER_TEMP/bp1-base-native/DATASET_EXIT.txt")" = 0 ] && [ "$(cat "$RUNNER_TEMP/bp1-base-native/MODEL_EXIT.txt")" = 0 ] && [ "$(cat "$RUNNER_TEMP/bp1-base-native/RUNNER_EXIT.txt")" = 0 ]; then
            PYTHONPATH="$PWD/v13/code" python3 - <<'PY' > "$RUNNER_TEMP/bp1-base-native/BINDING_RAW.log" 2>&1
          import json,os
          from pathlib import Path
          from scripts import bp1_qad_base_heldout as B
          from scripts import bp1_paired_score as S
          b={"schema":B.SCHEMA,"dataset_sha256":S.HELDOUT_SHA,"model_sha256":B.N.GGUF_SHA,
             "runner_sha256":B.V2.RUNNER_SHA,"seed":B.N.SEED,"temperature":0,
             "decoding":B.C.DECODING,"production_weight_authority":0,"gates":B.GATES}
          B.validate_binding(b,S.HELDOUT_SHA)
          Path(os.environ["RUNNER_TEMP"]+"/bp1-base-binding.json").write_text(json.dumps(b,sort_keys=True)+"\n")
          print("exact source-bound QAD base-only binding ready")
          PY
            rc="$?"
            if [ "$rc" = 0 ]; then
              SERVER="$(cat "$RUNNER_TEMP/bp1-base-native/SERVER_PATH.txt")"
              timeout 1500s env LD_LIBRARY_PATH="$(dirname "$SERVER")" PYTHONPATH="$PWD/v13/code" python3 v13/code/scripts/bp1_qad_base_heldout.py --mode collect --dataset "$RUNNER_TEMP/bp1-heldout" --binding "$RUNNER_TEMP/bp1-base-binding.json" --server "$SERVER" --model "$RUNNER_TEMP/bp1-qad-base-model/base.gguf" --out "$RUNNER_TEMP/bp1-base-collect" --serial-owner-confirmed > "$RUNNER_TEMP/bp1-base-native/COLLECT_RAW.log" 2>&1
              rc="$?"
            fi
            if [ "$rc" = 0 ]; then
              PYTHONPATH="$PWD/v13/code" python3 v13/code/scripts/bp1_qad_base_heldout.py --mode score --dataset "$RUNNER_TEMP/bp1-heldout" --binding "$RUNNER_TEMP/bp1-base-binding.json" --predictions "$RUNNER_TEMP/bp1-base-collect/predictions.jsonl" --out "$RUNNER_TEMP/bp1-base-score" > "$RUNNER_TEMP/bp1-base-native/SCORE_RAW.log" 2>&1
              rc="$?"
            fi
            if [ "$rc" = 0 ]; then
              cp "$RUNNER_TEMP/bp1-base-collect/"{RUN_BINDING.json,predictions.jsonl,FINAL_MANIFEST.json,base-server.log} "$RUNNER_TEMP/bp1-base-native/"
              cp "$RUNNER_TEMP/bp1-base-score/SCORES.json" "$RUNNER_TEMP/bp1-base-native/"
            fi
          else
            echo 'PREREQUISITE_FAILED; NO_NATIVE_BASE_COLLECTION' > "$RUNNER_TEMP/bp1-base-native/COLLECT_RAW.log"
            rc=2
          fi
          echo "$rc" > "$RUNNER_TEMP/bp1-base-native/COLLECT_SCORE_EXIT.txt"
          (free -h; df -h "$RUNNER_TEMP"; cat /sys/fs/cgroup/memory.peak 2>/dev/null || true) > "$RUNNER_TEMP/bp1-base-native/RESOURCE_AFTER.log" 2>&1
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bp1-qad-base-heldout-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/bp1-base-native/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce actual native collection and score exits
        run: |
          set -euo pipefail
          for n in BUDGET DATASET MODEL RUNNER COLLECT_SCORE; do
            test "$(cat "$RUNNER_TEMP/bp1-base-native/${n}_EXIT.txt")" = 0 || {
              echo "${n} failed"; tail -100 "$RUNNER_TEMP/bp1-base-native/${n}_RAW.log" 2>/dev/null || true; exit 1;
            }
          done
          test -s "$RUNNER_TEMP/bp1-base-native/FINAL_MANIFEST.json"
          test -s "$RUNNER_TEMP/bp1-base-native/SCORES.json"
          echo "QAD_Q4_BASE_ONLY_NATIVE_HELDOUT_22; NO_CANDIDATE_OR_UTILITY_OR_REDMi"
