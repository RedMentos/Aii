name: V13 Run95 human Age0 F1 F5 source budget software acceptance
on:
  push:
    branches: [assistant/v13-run95-human-budget-source-20261029]
permissions:
  contents: read
concurrency:
  group: v13-run95-${{ github.ref }}
  cancel-in-progress: true
jobs:
  human_source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Exact-source real Store/Memory tests, full suite and closed raw evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run95"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          source_ok=0
          check() {
            observed="$(git hash-object "$2" 2>/dev/null)" || return 1
            printf '%s %s\n' "$observed" "$2" >> "$e/SOURCE_RAW.log"
            [ "$observed" = "$1" ]
          }
          check 53048dd477af945a75dd0f6825e4b81d057742a2 v13/code/v13/source_record.py || source_ok=1
          check 4cd5ba2159e1034445ebe395b6b9bbe99b9b3ccf v13/code/v13/operator.py || source_ok=1
          check 946ab53726b5ed0ae4ac0b9a776a4f81c1d6e8fd v13/code/tests/test_run95_human_budget_source.py || source_ok=1
          check d865b964c26492147dc4d63938683768dad1dcfd v13/code/docs/HUMAN_BUDGET_SOURCE_REVIEW.md || source_ok=1
          check 83954474e7b2adfa2a7b44e3152ac4ab877da7e2 v13/code/docs/proofs/continuation-20261028/RUN95_HUMAN_BUDGET_SOURCE_PREREG.md || source_ok=1
          check 53dc948d0d360f94743ad996eb83ea0e85c2dd0b v13/code/v13/memory.py || source_ok=1
          check 4b73842be25e784f70ade4f6c4ced3fe2dcb9eab v13/code/v13/source_consumer.py || source_ok=1
          check 68e7ed1352800174972558f1e0b0683a42c8689a v13/code/v13/runtime.py || source_ok=1
          check 218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md || source_ok=1
          echo "$source_ok" > "$e/SOURCE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run95-venv"
          py="$RUNNER_TEMP/v13-run95-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          echo "$?" > "$e/INSTALL_EXIT.txt"
          python3 -m compileall -q v13/code/v13/source_record.py v13/code/v13/operator.py v13/code/tests/test_run95_human_budget_source.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$source_ok" = 0 ] && [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ] && [ "$(cat "$e/COMPILE_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 180s "$py" -m unittest -v tests.test_run95_human_budget_source tests.test_source_consumer_recall_integration tests.test_verified_operator_preflight) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
            (cd v13/code && timeout --signal=TERM --kill-after=10s 18m "$py" -m unittest discover -s tests -p 'test_*.py') > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else
            echo SKIPPED_PREREQ_RED > "$e/FOCUSED_RAW.log"; echo SKIPPED_RED > "$e/FOCUSED_EXIT.txt"
            echo SKIPPED_PREREQ_RED > "$e/FULL_RAW.log"; echo SKIPPED_RED > "$e/FULL_EXIT.txt"
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 58eb54a05532a5b9d25bd9713faf3bec1d55baff --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 58eb54a05532a5b9d25bd9713faf3bec1d55baff HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - name: Preserve original Run95 software evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run95-human-source-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run95/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce source, tests and privacy without native promotion
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run95"
          for n in SOURCE INSTALL COMPILE FOCUSED FULL PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; raw retained; no gate promotion"
              tail -40 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN95_HUMAN_F1_F5_SOURCE_SOFTWARE_ONLY
