name: V14 JEPA production optimizer resume and reset ablation

on:
  pull_request:
    paths:
      - "v13/code/v13/world_jepa.py"
      - "v13/code/v13/world_jepa_training_state.py"
      - "v13/code/v13/world_jepa_shadow_checkpoint.py"
      - "v13/code/v13/world_jepa_consumer.py"
      - "v13/code/tests/test_world_jepa_optimizer_resume_store.py"
      - ".github/workflows/v14-jepa-production-optimizer-ablation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimizer-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 pytest==9.2.0
      - name: Compile production WorldJEPA and resume tests
        run: >-
          python -m py_compile
          v13/code/v13/world_jepa.py
          v13/code/v13/world_jepa_training_state.py
          v13/code/v13/world_jepa_shadow_checkpoint.py
          v13/code/v13/world_jepa_consumer.py
          v13/code/tests/test_world_jepa_optimizer_resume_store.py
          v13/code/tests/test_world_jepa_training_resume_stage_20261111.py
      - name: Exercise production SQLite T8 optimizer-resume and reset control
        run: PYTHONPATH=v13/code PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -s v13/code/tests/test_world_jepa_optimizer_resume_store.py
      - name: Run staged optimizer-resume regression on the same Python version
        run: PYTHONPATH=v13/code PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -s v13/code/tests/test_world_jepa_training_resume_stage_20261111.py
