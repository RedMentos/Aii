name: Run219 Sleep digest backup and source continuity (software)
on:
  pull_request:
    paths:
      - 'v13/code/tests/test_sleep_context_backup_continuity_run219.py'
      - 'v13/code/v13/sleep_offline.py'
      - '.github/workflows/run219-sleep-digest-backup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sleep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Isolated software prerequisites
        run: python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Actual Runtime/Sleep/Backup and source lineage regressions
        working-directory: v13/code
        run: |
          PYTHONPATH=tests:. python -m unittest -v tests.test_sleep_context_backup_continuity_run219 tests.test_sleep_memory_c3_continuity_run205 tests.test_sleep_digest_live_lineage_run208 tests.test_sleep_ttt_source_lineage_run207
          python -m compileall -q v13/sleep_offline.py tests/test_sleep_context_backup_continuity_run219.py
      - name: Official public repository privacy scan
        run: python v13/code/scripts/public_repo_privacy_scan.py --base 0a414c1ad56094b59e890569beacff417971089c --head HEAD --no-worktree
      - name: Claim boundary
        run: echo 'Actual Runtime/SQLite with C3 double; no native inference, TTT weight update or gate promotion'
