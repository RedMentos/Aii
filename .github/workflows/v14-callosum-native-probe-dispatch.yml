name: V14 local Callosum native-probe dispatch

on:
  push:
    branches:
      - core/v14-callosum-native-probe-dispatch-20261125-run1
  pull_request:
    branches:
      - core/v14-native-probe-fair-budget-20261125-run1
    paths:
      - v13/code/v13/callosum.py
      - v13/code/tests/test_callosum.py
      - v13/code/tests/test_native_latent_receiver_approval.py
      - v13/code/tests/test_native_latent_receiver_matrix.py
      - .github/workflows/v14-callosum-native-probe-dispatch.yml

permissions:
  contents: read

jobs:
  local-probe-dispatch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Print exact integrated source-pin hashes
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          paths = (
              "v13/code/scripts/record_only_controller_guard_20261116.py",
              "v13/code/scripts/termux_runtime_recovery_candidate_20261112.py",
              "v13/code/scripts/integrated_native_latent_receiver_candidate_20261122.py",
              "v13/code/scripts/termux_runtime_recovery_candidate_20261121.py",
              "v13/code/scripts/stage_integrated_candidate.py",
              "v13/code/v13/runtime_deploy.py",
          )
          for name in paths:
              raw = Path(name).read_bytes()
              blob = hashlib.sha1(b"blob " + str(len(raw)).encode("ascii") + b"\\0" + raw).hexdigest()
              print("PIN_HASH", name, "sha256=" + hashlib.sha256(raw).hexdigest(), "git_blob_sha1=" + blob)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused Python dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.2.0 numpy==2.3.5 psutil PyYAML
      - name: Compile exact operator and approval sources
        run: |
          python -m py_compile \
            v13/code/v13/callosum.py \
            v13/code/v13/native_probe_approval.py \
            v13/code/v13/native_probe_matrix.py \
            v13/code/v13/operator.py \
            v13/code/tests/test_callosum.py \
            v13/code/tests/test_native_latent_receiver_approval.py \
            v13/code/tests/test_native_latent_receiver_matrix.py
      - name: Exercise local and negative operator paths
        env:
          PYTHONPATH: v13/code
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -q \
            v13/code/tests/test_callosum.py \
            v13/code/tests/test_native_latent_receiver_approval.py \
            v13/code/tests/test_native_latent_receiver_matrix.py \
            v13/code/tests/test_native_probe_runtime_close_overlay.py
      - name: Public diff privacy scan
        run: |
          git fetch --no-tags origin \
            core/v14-native-probe-fair-budget-20261125-run1:refs/remotes/origin/core/v14-native-probe-fair-budget-20261125-run1
          python v13/code/scripts/public_repo_privacy_scan.py \
            --base origin/core/v14-native-probe-fair-budget-20261125-run1 \
            --head HEAD --no-worktree
