name: V13 Run517 live Age0d answer-aware shadow source-only proof
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/run517-age0d-shadow-source.yml'
      - 'v13/code/v13/selfmodel.py'
      - 'v13/code/tests/test_run517_age0d_arithmetic_shadow.py'
permissions:
  contents: read
jobs:
  source-only:
    if: ${{ github.event.pull_request.head.ref == 'codex/run517-age0d-arithmetic-shadow-20261026' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 80
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Exact source pins and preserved design amendment
        run: |
          set -euo pipefail
          test "$(git hash-object v13/code/docs/proofs/continuation-20261026/run517-age0d-arithmetic-shadow/PREREG.md)" = '21d8b4fea16705a9df48ce455b017fd34aa20852'
          test "$(git hash-object v13/code/docs/proofs/continuation-20261026/run517-age0d-arithmetic-shadow/AMENDMENT_A.md)" = 'e66b2a3d4fcca08e85dc05e5b7c9c5536b1024ba'
          test "$(git hash-object v13/code/v13/selfmodel.py)" = 'e2e558eb675bb30c6a5c9eae21230d1dfbd540fd'
          test "$(git hash-object v13/code/tests/test_run517_age0d_arithmetic_shadow.py)" = '595e11357f79d0f94436df09708e61713ea5be33'
          test "$(git hash-object v13/code/v13/agi/answer_arithmetic_shadow.py)" = '3cec2c4b6883e3f02f449cc74cf44d5584a6affb'
          test "$(git hash-object v13/code/tests/test_age0d_answer_arithmetic_run134.py)" = '7022699b8dc63622a910a7dd785cb2cf0188ac99'
          test ! -e v13/code/v13/answer_audit.py
      - name: Isolated source-only dependencies
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Original Run134/150/Age0a and new live shadow regressions
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          ../../.venv/bin/python -m py_compile v13/selfmodel.py tests/test_run517_age0d_arithmetic_shadow.py
          rc=$?
          if [ "$rc" -eq 0 ]; then
            ../../.venv/bin/python -m unittest -v tests.test_run517_age0d_arithmetic_shadow tests.test_age0d_answer_arithmetic_run134 tests.test_age0d_history_shadow_audit_run150 tests.test_late_correction tests.test_selfmodel > "$RUNNER_TEMP/RUN517_TEST_RAW.log" 2>&1
            rc=$?
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN517_TEST_EXIT.txt"
          exit 0
      - name: Official public privacy scan
        if: always()
        run: |
          set -uo pipefail
          set +e
          git fetch --no-tags --depth=100 origin "${{ github.event.pull_request.base.sha }}" > "$RUNNER_TEMP/RUN517_PRIVACY_RAW.log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            .venv/bin/python v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree >> "$RUNNER_TEMP/RUN517_PRIVACY_RAW.log" 2>&1
            rc=$?
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN517_PRIVACY_EXIT.txt"
          exit 0
      - name: SHA-close raw source-only evidence
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          find . -maxdepth 1 -type f -name 'RUN517_*' ! -name RUN517_SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > RUN517_SHA256SUMS.txt
      - name: Preserve raw source-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run517-age0d-live-shadow-source-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/RUN517_*
          if-no-files-found: error
          retention-days: 30
      - name: Enforce tests and privacy
        if: always()
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/RUN517_TEST_EXIT.txt")" = 0
          test "$(cat "$RUNNER_TEMP/RUN517_PRIVACY_EXIT.txt")" = 0
