name: V13 adaptive concurrent think-speak scheduling
on:
  push:
    branches:
      - 'codex/v13-adaptive-think-speak-schedule-*'
  pull_request:
    paths:
      - 'v13/code/v13/turnflow.py'
      - 'v13/code/v13/latewatch.py'
      - 'v13/code/v13/operator.py'
      - 'v13/code/tests/test_turnflow_think_speak.py'
      - 'v13/code/tests/test_turnflow_human_exploration.py'
      - 'v13/code/tests/test_turnflow_feedback_count.py'
      - '.github/workflows/v13-turnflow.yml'
permissions:
  contents: read
jobs:
  turnflow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: v13/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile changed interfaces
        run: |
          python -m py_compile v13/turnflow.py v13/latewatch.py v13/operator.py tests/test_turnflow_think_speak.py tests/test_turnflow_human_exploration.py tests/test_turnflow_feedback_count.py
      - name: Integration with preexisting live stream and duplex tests
        run: |
          python -m pytest -q tests/test_turnflow_think_speak.py tests/test_turnflow_human_exploration.py tests/test_turnflow_feedback_count.py tests/test_latewatch.py tests/test_duplex.py tests/test_effort.py
