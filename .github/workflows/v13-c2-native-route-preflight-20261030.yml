name: V13 isolated C2 native route provenance software preflight
on:
  push:
    branches: [assistant/v13-c2-native-route-provenance-20261030-0425]
    paths:
      - '.github/workflows/v13-c2-native-route-preflight-20261030.yml'
      - 'v13/code/scripts/c2_native_route_provenance_20261030.py'
      - 'v13/code/tests/test_c2_native_route_provenance_20261030.py'
      - 'v13/code/docs/C2_NATIVE_ROUTE_PROVENANCE_PREREG_20261030.md'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Source-bound C2 software-only preflight and closed raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-c2-route-preflight"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          4d63ece77f38ca58fedde5f21296d354703c9270 v13/code/docs/C2_NATIVE_ROUTE_PROVENANCE_PREREG_20261030.md
          3e5ecbe91e42a96bc0795c89485d5587b13ff7df v13/code/scripts/c2_native_route_provenance_20261030.py
          45ba0fed9fb02406d9a576f473e9a4b3a0cbcec6 v13/code/tests/test_c2_native_route_provenance_20261030.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          954a3f468f10195fbce12d27f68585ee7edee2c9 v13/code/specs/control_tools.json
          BLOBS
          red=0
          : > "$e/SOURCE_RAW.log"
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/SOURCE_RAW.log"
            if [ "$want" != "$got" ]; then red=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$red" > "$e/SOURCE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-c2-route-preflight-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-c2-route-preflight-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          if [ "$red" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests "$py" -m unittest -v tests.test_c2_native_route_provenance_20261030) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED > "$e/TEST_RAW.log"; echo SKIPPED > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/scripts/c2_native_route_provenance_20261030.py v13/code/tests/test_c2_native_route_provenance_20261030.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base f41ecd93e50b475787a9a13272d1c2c20e99fb6e --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check f41ecd93e50b475787a9a13272d1c2c20e99fb6e HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-c2-route-preflight-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-c2-route-preflight/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce C2 software-only preflight
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-c2-route-preflight"
          for stage in SOURCE VENV DEPS TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; no native launch"
              tail -70 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'C2_ROUTE_PROVENANCE_SOFTWARE_ONLY_NO_NATIVE_OR_GATE'
