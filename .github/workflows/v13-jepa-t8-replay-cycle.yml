name: V13 JEPA committed T8 replay cycle
on:
  push:
    paths:
      - 'v13/code/v13/t8_world_jepa_replay_cycle.py'
      - 'v13/code/tests/test_t8_world_jepa_replay_cycle.py'
      - '.github/workflows/v13-jepa-t8-replay-cycle.yml'
  pull_request:
    paths:
      - 'v13/code/v13/t8_world_jepa_replay_cycle.py'
      - 'v13/code/tests/test_t8_world_jepa_replay_cycle.py'
      - '.github/workflows/v13-jepa-t8-replay-cycle.yml'
jobs:
  t8-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pytest
      - run: PYTHONPATH=v13/code python -m pytest -q v13/code/tests/test_t8_world_jepa_replay_cycle.py
