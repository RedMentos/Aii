name: V13 Audited Android Operator E2E
on:
  push:
    branches:
      - 'boss/v13-operator-audit-e2e-*'
  pull_request:
    paths:
      - 'v13/code/v13/android_operator_audited_session.py'
      - 'v13/code/tests/test_android_operator_audited_session.py'
      - '.github/workflows/v13-android-operator-audit-e2e.yml'
jobs:
  synthetic-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: PYTHONPATH=v13/code python -m pytest -q v13/code/tests/test_android_operator_audited_session.py v13/code/tests/test_android_operator_bridge.py v13/code/tests/test_android_action_audit.py
