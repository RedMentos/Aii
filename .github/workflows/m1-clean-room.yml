name: M1 clean-room tests
on:
  push:
    paths:
      - "experiments/m1/**"
      - ".github/workflows/m1-clean-room.yml"
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip numpy
      - run: python -m unittest discover -s experiments/m1 -p "test_*.py" -v
