name: V13 run11q C2-C3-Body source arithmetic shadow audit
on:
  push:
    branches: [assistant/v13-run11q-c2c3-source-arithmetic-shadow-20261030]
    paths:
      - '.github/workflows/v13-run11q-c2c3-arithmetic-shadow.yml'
      - 'v13/code/scripts/c2_c3_body_source_arithmetic_shadow_run11q.py'
      - 'v13/code/tests/test_c2_c3_body_source_arithmetic_shadow_run11q.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-bound-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Original native artifact, adversarial software tests, and shadow scoring
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run11q-evidence"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/scripts/c2_c3_body_source_arithmetic_shadow_run11q.py > "$e/SCRIPT_BLOB.txt"
          git hash-object v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/CANON_BLOB.txt"
          test "$(cat "$e/SCRIPT_BLOB.txt")" = d824690e942489b11c79c3aa68cd0f02e6176f06 &&
          test "$(cat "$e/CANON_BLOB.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          echo "$?" > "$e/SOURCE_EXIT.txt"
          python3 - "$e/original_native.zip" > "$e/DOWNLOAD_RAW.log" 2>&1 <<'PY'
          import hashlib,os,pathlib,shutil,sys,urllib.error,urllib.parse,urllib.request
          dest=pathlib.Path(sys.argv[1])
          api="https://api.github.com/repos/RedMentos/Aii/actions/artifacts/12952434876/zip"
          req=urllib.request.Request(api,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect)
          try:
              with opener.open(req,timeout=120) as response,dest.open("wb") as f:shutil.copyfileobj(response,f)
          except urllib.error.HTTPError as exc:
              if exc.code not in (301,302,303,307,308):raise
              target=exc.headers.get("Location","")
              u=urllib.parse.urlsplit(target)
              if u.scheme!="https" or not u.hostname:raise ValueError("INVALID_REDIRECT")
              with urllib.request.urlopen(urllib.request.Request(target),timeout=120) as response,dest.open("wb") as f:
                  shutil.copyfileobj(response,f)
          actual=hashlib.sha256(dest.read_bytes()).hexdigest()
          assert actual=="df680697f65f9879b7817179b8d4a2d1f8625656579c68f03c0268d599f6d4c4"
          print("PINNED_ORIGINAL_ZIP_VERIFIED",actual)
          PY
          echo "$?" > "$e/DOWNLOAD_EXIT.txt"
          unset GH_TOKEN
          (cd v13/code && PYTHONPATH=.:tests:scripts python3 -m unittest -v tests.test_c2_c3_body_source_arithmetic_shadow_run11q) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m py_compile v13/code/scripts/c2_c3_body_source_arithmetic_shadow_run11q.py v13/code/tests/test_c2_c3_body_source_arithmetic_shadow_run11q.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$(cat "$e/SOURCE_EXIT.txt")" = 0 ] && [ "$(cat "$e/DOWNLOAD_EXIT.txt")" = 0 ] && [ "$(cat "$e/TEST_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:scripts python3 scripts/c2_c3_body_source_arithmetic_shadow_run11q.py --original-zip "$e/original_native.zip" --out "$e/SHADOW_REPORT.json") > "$e/SHADOW_RAW.log" 2>&1
            echo "$?" > "$e/SHADOW_EXIT.txt"
          else echo SKIPPED > "$e/SHADOW_EXIT.txt"; fi
          if [ "$(cat "$e/SHADOW_EXIT.txt")" = 0 ]; then
            python3 - "$e/SHADOW_REPORT.json" > "$e/VERIFY_RAW.log" 2>&1 <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["schema"]=="v13.c2_c3_body.source_arithmetic_shadow.v1"
          assert d["original_zip_sha256"]=="df680697f65f9879b7817179b8d4a2d1f8625656579c68f03c0268d599f6d4c4"
          assert d["total_options"]==6
          assert d["totals"]=={"MATCH":2,"CONTRADICTS_SOURCE":4,"CONTRADICTORY_CLAIMS":0,"UNSCORED":0}
          assert d["utility_gate_pass"] is False and d["native_route_selection_proven"] is False
          assert d["redmi_measured"] is False and d["production_activation"] is False
          assert d["age_authority"]==0 and d["whole_system_complete"] is False
          print("POSTHOC_SOURCE_BOUND_SHADOW_ONLY",d["totals"])
          PY
            echo "$?" > "$e/VERIFY_EXIT.txt"
          else echo SKIPPED > "$e/VERIFY_EXIT.txt"; fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 5184ef06ae1108db01caeb55aabebba2498c0067 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 5184ef06ae1108db01caeb55aabebba2498c0067 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          rm -f "$e/original_native.zip"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-run11q-shadow-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run11q-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Fail closed on original or scoring mismatch
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run11q-evidence"
          for stage in SOURCE DOWNLOAD TEST COMPILE SHADOW VERIFY PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "${stage} RED; original raw preserved"
              tail -100 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo "SOURCE_BOUND_POSTHOC_SHADOW_ONLY_NO_C2_C3_BODY_UTILITY_PROMOTION"
