name: V13 opt-in JEF source-exact explanatory SHADOW operator
on:
  push:
    branches: [codex/v13-jefsource-explain-optin-20261030-hourly11]
    paths:
      - '.github/workflows/v13-jefsource-explain-optin-20261030.yml'
      - 'v13/code/v13/jef_f1f5_operator.py'
      - 'v13/code/v13/operator.py'
      - 'v13/code/tests/test_jefsource_explain_optin_20261030.py'
      - 'v13/code/docs/JEF_SOURCE_EXPLAIN_OPTIN_*'
permissions:
  contents: read
jobs:
  exact-explain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run real Store source-exact explanation and negative tests with raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-jefsource-explain"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          8a0bb4f78041fa981c4988aca843ff1a0aa69741 v13/code/docs/JEF_SOURCE_EXPLAIN_OPTIN_PREREG_20261030.md
          83b0f5d079c6d93aaf1aeae71e07d2bda8a46970 v13/code/tests/test_jefsource_explain_optin_20261030.py
          f0e687db8d47cad7621581e4b6d9a65b3679fc89 v13/code/v13/jef_f1f5_operator.py
          e2679c9d2c6bd88bd2c770d66dec75b17a3962e5 v13/code/v13/operator.py
          f092369bf5f4674191dbd43cd80ed50ed8283475 v13/code/v13/jef_typed_source_shadow.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          source_red=0
          : > "$e/SOURCE_RAW.log"
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/SOURCE_RAW.log"
            if [ "$want" != "$got" ]; then source_red=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$source_red" > "$e/SOURCE_EXIT.txt"
          git hash-object v13/code/v13/jef_f1f5_operator.py > "$e/OPERATOR_BLOB.txt"
          python3 -m venv "$RUNNER_TEMP/v13-jefsource-explain-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-jefsource-explain-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
          else echo SKIPPED > "$e/DEPS_EXIT.txt"; echo SKIPPED > "$e/PIP_CHECK_EXIT.txt"; fi
          if [ "$source_red" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ] && [ "$(cat "$e/PIP_CHECK_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_jefsource_explain_optin_20261030 tests.test_jef_f1f5_operator tests.test_jef_source_arithmetic_shadow_20261030) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PREREQ_RED > "$e/TEST_RAW.log"; echo SKIPPED > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/v13/jef_f1f5_operator.py v13/code/tests/test_jefsource_explain_optin_20261030.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base d5581223f0caaf40972d619fef5ef6f056dba134 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check d5581223f0caaf40972d619fef5ef6f056dba134 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original operator test raw including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-jefsource-explain-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-jefsource-explain/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce opt-in SHADOW only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-jefsource-explain"
          for stage in SOURCE VENV DEPS PIP_CHECK TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained"
              tail -55 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'JEF_SOURCE_EXPLAIN_SHADOW_ONLY_NO_LIVE_ANSWER_NO_GATE'
