name: V13 STEP2 collector scorer quick stdlib integration proof
on:
  push:
    branches: [assistant/v13-fourarm-collector-scorer-crossorgan-automation11-20261028]
    paths:
      - '.github/workflows/step2-collector-scorer-quick-20261028.yml'
      - 'v13/code/scripts/step2_fourarm_native_collector_candidate.py'
      - 'v13/code/scripts/step2_longnote_fourarm_io.py'
      - 'v13/code/tests/test_step2_collector_scorer_crossorgan_20261028.py'
      - 'v13/code/docs/coordination/STEP2_NATIVE_MODEL_PIN_CANDIDATES_20261028.md'
      - 'v13/code/scripts/step2_current_catalog_artifact_probe.py'
      - 'v13/code/tests/test_step2_current_catalog_artifact_probe_20261028.py'
      - 'v13/code/scripts/step2_current_runner_archive_probe.py'
      - 'v13/code/tests/test_step2_current_runner_archive_probe_20261028.py'
      - 'v13/code/scripts/step2_current_catalog_native_smoke.py'
      - 'v13/code/tests/test_step2_current_catalog_native_smoke_20261028.py'
permissions:
  contents: read
concurrency:
  group: v13-step2-collector-scorer-quick-20261028
  cancel-in-progress: false
jobs:
  stdlib:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Execute and retain closed software evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-step2-collector-scorer-quick"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git show -s --format='%P' HEAD > "$e/PARENTS.txt"
          git hash-object v13/code/scripts/step2_fourarm_native_collector_candidate.py v13/code/scripts/step2_longnote_fourarm_io.py v13/code/scripts/step2_current_catalog_artifact_probe.py v13/code/scripts/step2_current_runner_archive_probe.py v13/code/scripts/step2_current_catalog_native_smoke.py v13/code/tests/test_step2_current_catalog_native_smoke_20261028.py v13/code/tests/test_step2_current_runner_archive_probe_20261028.py v13/code/tests/test_step2_collector_scorer_crossorgan_20261028.py v13/code/tests/test_step2_current_catalog_artifact_probe_20261028.py > "$e/BLOBS_RAW.log"
          echo "$?" > "$e/BLOBS_EXIT.txt"
          (
            cd v13/code
            timeout --signal=TERM --kill-after=5s 6m env PYTHONPATH=.:tests python3 -m unittest -v tests.test_step2_current_catalog_native_smoke_20261028 tests.test_step2_current_runner_archive_probe_20261028 tests.test_step2_current_catalog_artifact_probe_20261028 tests.test_step2_collector_scorer_crossorgan_20261028 tests.test_step2_fourarm_native_collector_candidate_20261028 tests.test_step2_longnote_fourarm_analysis_20261028 tests.test_step2_longnote_fourarm_io_20261028
          ) > "$e/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$e/FOCUSED_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/step2_fourarm_native_collector_candidate.py v13/code/scripts/step2_longnote_fourarm_io.py v13/code/tests/test_step2_collector_scorer_crossorgan_20261028.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base db1b5238e6e9193d62e1a75a38f545c3a28533df --head HEAD > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check db1b5238e6e9193d62e1a75a38f545c3a28533df HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && sha256sum * > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-step2-collector-scorer-quick-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-step2-collector-scorer-quick/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce focused results
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-step2-collector-scorer-quick"
          for k in BLOBS FOCUSED COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${k}_EXIT.txt")" != 0 ]; then
              echo "$k RED, preserved"
              tail -35 "$e/${k}_RAW.log" || true
              exit 1
            fi
          done
          echo 'STDLIB_ONLY_SYNTHETIC_NO_NATIVE_NO_GATE_PROMOTION'
