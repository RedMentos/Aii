name: V13 Run14F AG12 English German language isolation candidate GREEN
on:
  push:
    branches: [assistant/v13-run14f-ag12-language-isolation-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run14f-language-green.yml'
permissions:
  contents: read
jobs:
  ag12-language:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact candidate bilingual state alias evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run14f-green"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          42a06579f8b01ae525b730cd36244e407c7eeef8 v13/code/v13/agi/generality.py
          ca37009075610a9d937f5327bbb2222d470025f0 v13/code/tests/test_ag12_language_isolation_run14f.py
          9e52d558dbd4e2bf25817244c92fd703027d8792 v13/code/docs/RUN14F_AG12_LANGUAGE_ISOLATION_PREREG_20261030.md
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=. python3 -m unittest -v tests.test_ag12_language_isolation_run14f tests.test_growth.G12Eval) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m py_compile v13/code/v13/agi/generality.py v13/code/tests/test_ag12_language_isolation_run14f.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base b2e8cc28cf05538f81cc5fd913c9f216c746d8bd --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check b2e8cc28cf05538f81cc5fd913c9f216c746d8bd HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve candidate bilingual raw even on RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run14f-green-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run14f-green/
          retention-days: 30
          if-no-files-found: error
      - name: Explicit scoped verdict
        if: always()
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run14f-green"
          for stage in PINS TEST COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            test "$(cat "$e/${stage}_EXIT.txt")" = 0
          done
