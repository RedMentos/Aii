name: V13 Run572 dormant native workflow independent source-only preflight
on:
  push:
    branches:
      - assistant/v13-run572-current-legacy-native-20261026
permissions:
  contents: read
jobs:
  dormant-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.sha }}
      - name: Verify original/new prereg, Canon and dormant native workflow exact bytes
        id: source
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/RUN572_PREFLIGHT_HEAD.txt"
          test "$(git hash-object .github/workflows/run572-current-legacy-native.yml)" = '1cc82d7eb17dfa6e78986cc852426b6c08b7f948'
          test "$(git hash-object v13/code/docs/proofs/continuation-20261026/run572-current-legacy-native/PREREG.md)" = 'bbe80979288006bde1b6e9bd8cf4081e6d4a8284'
          test "$(git hash-object v13/code/scripts/run571_current_default_native.py)" = '813dfe55997db2116b7cd79365a744b2635440b6'
          test "$(git hash-object v13/code/scripts/run570_current_default_cohort.py)" = '64a76175da9f14c65c0e7fdfaf647e47e7e56715'
          test "$(git hash-object v13/code/scripts/run491_step2_heldout10.py)" = 'f4d2d8d5e66c49c508e376ebafce2146e5a2715b'
          test "$(git hash-object v13/code/specs/models.json)" = '7af05962af41d0bc3f7dd18ef01d4eba55eabf99'
          test "$(sha256sum v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md | cut -d' ' -f1)" = '3423906b01b24443fcef733fb5c7ef47296963df63e603d8f843c99d544877ee'
          { date -u -Iseconds; python3 --version; } > "$RUNNER_TEMP/RUN572_PREFLIGHT_HOST.txt"
      - name: Isolated pinned source-only dependencies
        id: deps
        run: |
          set -uo pipefail
          set +e
          python3 -m venv "$RUNNER_TEMP/run572-preflight-venv"
          timeout 240s "$RUNNER_TEMP/run572-preflight-venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52' 'PyYAML==6.0.3' > "$RUNNER_TEMP/RUN572_PREFLIGHT_DEPS_RAW.log" 2>&1
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/RUN572_PREFLIGHT_DEPS_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Independent workflow syntax/ownership/safe artifact checks and source tests
        id: tests
        if: ${{ steps.deps.outputs.rc == '0' }}
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          export PYTHONPATH="$PWD:$PWD/scripts"
          timeout 450s "$RUNNER_TEMP/run572-preflight-venv/bin/python" -m unittest -v tests.test_run570_current_default_cohort tests.test_run571_current_default_native tests.test_run496_heldout10_native_pilot > "$RUNNER_TEMP/RUN572_PREFLIGHT_TEST_RAW.log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            "$RUNNER_TEMP/run572-preflight-venv/bin/python" scripts/run571_current_default_native.py --plan --work "$RUNNER_TEMP/run572-dormant-plan" > "$RUNNER_TEMP/RUN572_PREFLIGHT_PLAN_RAW.log" 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            "$RUNNER_TEMP/run572-preflight-venv/bin/python" - <<'PY' > "$RUNNER_TEMP/RUN572_PREFLIGHT_REVIEW_RAW.log" 2>&1
          import hashlib,json,os
          from pathlib import Path
          import yaml
          path=Path('.github/workflows/run572-current-legacy-native.yml')
          if not path.is_file():path=Path('../../.github/workflows/run572-current-legacy-native.yml')
          doc=yaml.load(path.read_text(),Loader=yaml.BaseLoader)
          assert doc['on']['pull_request']['types']==['opened']
          assert doc['on']['pull_request']['paths']==['.github/workflows/run572-current-legacy-native.yml']
          assert doc['concurrency']['group']=='v13-native-c3-run131-serialized'
          assert doc['concurrency']['cancel-in-progress']=='false'
          job=doc['jobs']['native-paired']
          assert 'assistant/v13-run572-current-legacy-native-20261026' in job['if']
          assert job['runs-on']=='ubuntu-24.04' and job['timeout-minutes']=='100'
          steps=job['steps'];ids=[s.get('id') for s in steps]
          assert ids.index('source')<ids.index('fixture')<ids.index('bootstrap')<ids.index('native')<ids.index('audit')
          native=next(s for s in steps if s.get('id')=='native')
          assert 'run571_current_default_native.py --execute' in native['run']
          assert '--work "$RUNNER_TEMP/run572-work"' in native['run']
          raw=next(s for s in steps if s.get('name')=='Preserve raw synthetic and failed attempts')
          safe=next(s for s in steps if s.get('name')=='Preserve bounded safe metadata only after full native success')
          assert raw['if']=='always()' and "steps.audit.outputs.rc == '0'" in safe['if']
          assert 'run572-raw/*' in raw['with']['path'] and 'run572-safe/*' in safe['with']['path']
          plan=Path(os.environ['RUNNER_TEMP'])/'run572-dormant-plan'/'RUN570_PLAN.json'
          p=json.loads(plan.read_text())
          assert p['planned_native_consumer_rows']==84 and p['native_executed'] is False
          assert p['canonical_gate_pass'] is False and p['step2_exit']=='UTILITY_FAIL'
          assert p['jepa_weight']==0 and p['redmi_measured'] is False
          report={'status':'RUN572_DORMANT_WORKFLOW_SOURCE_REVIEW_ONLY',
                  'workflow_blob':'1cc82d7eb17dfa6e78986cc852426b6c08b7f948',
                  'plan_sha256':hashlib.sha256(plan.read_bytes()).hexdigest(),
                  'planned_rows':84,'native_executed':False,'canonical_gate_pass':False,
                  'step2_exit':'UTILITY_FAIL','redmi_measured':False}
          (Path(os.environ['RUNNER_TEMP'])/'RUN572_PREFLIGHT_REPORT.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
          print(json.dumps(report,sort_keys=True))
          PY
            rc=$?
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN572_PREFLIGHT_TEST_EXIT.txt"
          exit 0
      - name: Official public privacy scan
        if: always()
        run: |
          set -uo pipefail
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 387cb983c140bb174c3d448aeab2d5a17ee3516a --head HEAD --no-worktree > "$RUNNER_TEMP/RUN572_PREFLIGHT_PRIVACY_RAW.log" 2>&1
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/RUN572_PREFLIGHT_PRIVACY_EXIT.txt"
          exit 0
      - name: SHA-close source-only raw evidence including RED
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          find . -maxdepth 1 -type f -name 'RUN572_PREFLIGHT_*' ! -name RUN572_PREFLIGHT_SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > RUN572_PREFLIGHT_SHA256SUMS.txt
      - name: Upload source-only review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run572-dormant-source-review-${{ github.sha }}
          path: ${{ runner.temp }}/RUN572_PREFLIGHT_*
          if-no-files-found: error
          retention-days: 30
      - name: Enforce no-model source review and privacy
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.source.outcome }}" = success
          test "$(cat "$RUNNER_TEMP/RUN572_PREFLIGHT_DEPS_EXIT.txt")" = 0
          test "$(cat "$RUNNER_TEMP/RUN572_PREFLIGHT_TEST_EXIT.txt")" = 0
          test "$(cat "$RUNNER_TEMP/RUN572_PREFLIGHT_PRIVACY_EXIT.txt")" = 0
