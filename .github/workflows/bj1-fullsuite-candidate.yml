name: V13 BJ1 opt-in checkpoint full software regression
on:
  push:
    branches: [codex/automation11-bj1-step-resume-candidate-20261027]
    paths:
      - '.github/workflows/bj1-fullsuite-candidate.yml'
      - 'v13/code/scripts/bp2b_native_batch.py'
      - 'v13/code/tests/test_bp2b_native_batch.py'
      - 'v13/code/tests/test_body_jepa_checkpoint.py'
      - 'v13/code/tests/test_body_jepa_checkpoint_fit.py'
      - 'v13/code/v13/body_jepa_checkpoint.py'
      - 'v13/code/v13/body_jepa.py'
permissions:
  contents: read
concurrency:
  group: v13-bj1-fullsuite-${{ github.ref }}
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Full software suite, compile and privacy evidence
        run: |
          set +e
          evidence="$RUNNER_TEMP/v13-bj1-fullsuite"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/HEAD.txt"
          git hash-object v13/code/scripts/bp2b_native_batch.py > "$evidence/BATCH_BLOB.txt"
          python3 -m venv "$RUNNER_TEMP/v13-bj1-fullsuite-venv"
          py="$RUNNER_TEMP/v13-bj1-fullsuite-venv/bin/python"
          "$py" -m pip install --no-input -q 'numpy==2.2.6' 'psutil' 'PyYAML' 'Pillow' 'transformers==5.20.2' 'peft==0.21.2' > "$evidence/INSTALL_RAW.log" 2>&1
          "$py" -m pip install --no-input -q 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$evidence/INSTALL_RAW.log" 2>&1
          echo "$?" > "$evidence/INSTALL_EXIT.txt"
          (
            cd v13/code
            timeout --signal=TERM --kill-after=10s 20m env PYTHONPATH=. "$py" -m unittest discover -s tests -p 'test_*.py' -q
          ) > "$evidence/UNIT_RAW.log" 2>&1
          echo "$?" > "$evidence/UNIT_EXIT.txt"
          python3 -m compileall -q v13/code/v13 v13/code/tests/test_body_jepa_checkpoint.py v13/code/tests/test_body_jepa_checkpoint_fit.py > "$evidence/COMPILE_RAW.log" 2>&1
          echo "$?" > "$evidence/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base edd0212c1774f893433040f48fa6b57c3d2d4209 --head HEAD > "$evidence/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$evidence/PRIVACY_EXIT.txt"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-bj1-fullsuite-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-bj1-fullsuite/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce suite, no promotion
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/v13-bj1-fullsuite"
          for name in INSTALL UNIT COMPILE PRIVACY; do
            if [ "$(cat "$evidence/${name}_EXIT.txt")" != 0 ]; then
              echo "$name failed; original raw evidence retained"
              tail -80 "$evidence/${name}_RAW.log"
              exit 1
            fi
          done
          echo "V13_BJ1_FULL_SOFTWARE_SUITE_ONLY_NO_NATIVE_OR_REDMi_PROOF_NO_GATE_PROMOTION"
