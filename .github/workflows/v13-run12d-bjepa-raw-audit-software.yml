name: V13 Run12D independent original raw ZIP auditor software
on:
  push:
    branches: [assistant/v13-run12d-bjepa-native-raw-auditor-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run12d-bjepa-raw-audit-software.yml'
permissions:
  contents: read
jobs:
  audit-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Source pins, original ZIP tamper tests and raw receipts
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run12d-audit-software"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          40d94e455091d411cf5e1619fbd61f2bbd2bc6b4 v13/code/scripts/bodyjepa_350m_contrastive_raw_audit_run12d.py
          e0fbe189e3fc97460ebf8c668e1df8427d2302bd v13/code/tests/test_bodyjepa_350m_contrastive_raw_audit_run12d.py
          15597550100de6ca546b1b024fbc6597fc600839 v13/code/scripts/bodyjepa_350m_contrastive_disjoint_run12c.py
          a31a18d9be0b1137a10304f24d3a241d720bd247 v13/code/v13/body_jepa_contrastive_trainer_shadow.py
          b560d4e88fe457f381e89dfc5d6188a8ec3b306b v13/code/v13/body_jepa.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:scripts:tests timeout --signal=TERM --kill-after=5s 120s python3 -m unittest -v tests.test_bodyjepa_350m_contrastive_raw_audit_run12d tests.test_bodyjepa_350m_contrastive_disjoint_run12c) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m py_compile v13/code/scripts/bodyjepa_350m_contrastive_raw_audit_run12d.py v13/code/tests/test_bodyjepa_350m_contrastive_raw_audit_run12d.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 61d4b05d080296962e72e4501c933993545d4ce1 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 61d4b05d080296962e72e4501c933993545d4ce1 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw even on RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run12d-raw-audit-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run12d-audit-software/
          retention-days: 30
          if-no-files-found: error
      - name: Fail closed, software only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run12d-audit-software"
          for stage in PINS TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "${stage} RED; original raw preserved"
              tail -100 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo "RUN12D_SYNTHETIC_AUDITOR_TESTS_ONLY_NO_NATIVE_PROMOTION"
