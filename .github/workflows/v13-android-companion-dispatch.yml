name: V13 Android companion dispatch
on:
  push:
    branches: [gpt6/v13-core-companion-dispatch-20261111-2300]
  pull_request:
    paths:
      - 'v13/code/v13/android_companion_dispatch.py'
      - 'v13/code/tests/test_android_companion_dispatch.py'
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: cd v13/code && python -m pytest -q tests/test_android_capability_contract.py tests/test_android_companion_dispatch.py
