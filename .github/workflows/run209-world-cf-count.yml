name: Run209 World counterfactual observed-count integrity (software)
on:
  pull_request:
    paths:
      - 'v13/code/v13/world_model.py'
      - 'v13/code/tests/test_world_counterfactual_input_integrity_run209.py'
      - '.github/workflows/run209-world-cf-count.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Isolated software prerequisites
        run: python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Actual WorldModel counterfactual and transition integrity
        working-directory: v13/code
        run: |
          python -m unittest -v tests.test_world_counterfactual_input_integrity_run209 tests.test_world_observation_integrity_run202 tests.test_world_model tests.test_world_state
          python -m compileall -q v13/world_model.py tests/test_world_counterfactual_input_integrity_run209.py
      - name: Official public repository privacy scan
        run: python v13/code/scripts/public_repo_privacy_scan.py --base 9172c44ca01c598df886c864b12391f6be7182b9 --head HEAD --no-worktree
      - name: Claim boundary
        run: echo 'Synthetic SQLite and WorldModel only; no causal/world learning, native model or Redmi proof'
