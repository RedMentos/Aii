name: V13 Auto11 dual-source C5/C6 DRAFT software SHADOW
on:
  push:
    branches: [assistant/v13-auto11-dual-source-c5c6-draft-20261031-1205]
    paths: ['.github/workflows/v13-auto11-dual-source-c5c6-draft-shadow.yml']
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Closed raw software checks, pinned new sources, no native
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-auto11-dual-draft"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          f95e7b4d380589b26e63f3d782a74cb178d5607e v13/code/docs/AUTO11_DUAL_SOURCE_C5C6_DRAFT_BRIDGE_PREREG_20261031.md
          d1380250630aec582935a218c36bfec90b4520cd v13/code/docs/AUTO11_RUN1_RED_RANGE_STAGER_CORRECTION_PREREG_20261031.md
          ccf0661689b54e178c990880573e6a12b3cee0b8 v13/code/v13/jef_b1b2_c3_c5c6_draft_shadow.py
          a93946aaaf3aeb84d98ba4ac327d49f25e16c28b v13/code/tests/test_auto11_dual_source_c5c6_draft.py
          PINS
          bad=0
          while read -r want file; do
            got="$(git hash-object "$file" 2>/dev/null)"
            echo "$want $got $file" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-auto11-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-auto11-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo SKIPPED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=5s 8m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m unittest -v tests.test_auto11_dual_source_c5c6_draft tests.test_run84_dual_source_c3_postgen tests.test_jef_c3_schema_source_recheck_shadow > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          python3 -m compileall -q v13/code/v13/jef_b1b2_c3_c5c6_draft_shadow.py v13/code/tests/test_auto11_dual_source_c5c6_draft.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 7f5875e46036dd1278303dd74461a7bb6dfc24da --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 7f5875e46036dd1278303dd74461a7bb6dfc24da HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Retain original raw software evidence even if RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-auto11-dual-draft-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-auto11-dual-draft/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce stage exits
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-auto11-dual-draft"
          for s in PINS VENV DEPS TEST COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || { tail -n 100 "$e/TEST_RAW.log"; exit 1; }
          done
          tail -n 5 "$e/TEST_RAW.log"
          echo AUTO11_SOFTWARE_SHADOW_NO_NATIVE_NO_TTY_NO_DELIVERY
