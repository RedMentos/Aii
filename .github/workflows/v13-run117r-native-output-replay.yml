name: V13 Run117R original-native output postgen replay (no model)
on:
  push:
    branches:
      - assistant/v13-run117r-native-output-replay-postgen-20261031-hourly11
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-text-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Exact original native output replay with real SQLite and inherited tests
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117r-replay"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          set +e
          test "$(git hash-object v13/code/scripts/run117r_native_output_postgen_replay.py)" = c3888048641b9cb126c54b5c6561c0ac633799f8
          a=$?
          test "$(git hash-object v13/code/tests/test_run117r_native_output_postgen_replay.py)" = 2f9f37c95a26c8c650bdf4fcac0533f99b837092
          b=$?
          test "$a" -eq 0 && test "$b" -eq 0
          source_rc=$?
          echo "$source_rc" > "$e/SOURCE_EXIT.txt"
          curl --location --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/RedMentos/Aii/actions/artifacts/13051756857/zip" \
            --output "$e/ORIGINAL_RUN116.zip" > "$e/DOWNLOAD_RAW.log" 2>&1
          download_rc=$?
          if [ "$download_rc" -eq 0 ]; then
            sha256sum "$e/ORIGINAL_RUN116.zip" > "$e/ORIGINAL_SHA_RAW.log" 2>&1
            echo "71de9bb7bc2899f5aee67f58b55d13514d0a9b0d870cd98ae5e8f2f1850d11c5  $e/ORIGINAL_RUN116.zip" | sha256sum -c - > "$e/HASH_RAW.log" 2>&1
            hash_rc=$?
          else
            echo DOWNLOAD_RED > "$e/HASH_RAW.log"
            hash_rc=125
          fi
          python3 -m venv "$RUNNER_TEMP/v13-run117r-venv" > "$e/VENV_RAW.log" 2>&1
          venv_rc=$?
          py="$RUNNER_TEMP/v13-run117r-venv/bin/python"
          if [ "$venv_rc" -eq 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            deps_rc=$?
          else
            echo VENV_RED > "$e/DEPS_RAW.log"
            deps_rc=1
          fi
          echo "$deps_rc" > "$e/DEPS_EXIT.txt"
          if [ "$source_rc" -eq 0 ] && [ "$hash_rc" -eq 0 ] && [ "$deps_rc" -eq 0 ]; then
            (cd v13/code && env PYTHONPATH=. "$py" -m scripts.run117r_native_output_postgen_replay --original-zip "$e/ORIGINAL_RUN116.zip" --out "$e/REPLAY.json") > "$e/REPLAY_RAW.log" 2>&1
            replay_rc=$?
          else
            echo SOURCE_HASH_OR_DEPS_RED > "$e/REPLAY_RAW.log"
            replay_rc=125
          fi
          if [ "$deps_rc" -eq 0 ]; then
            (cd v13/code && env PYTHONPATH=. "$py" -m unittest -v \
              tests.test_run117r_native_output_postgen_replay \
              tests.test_run117q_native_attribution_readonly \
              tests.test_run117_b1b2_jef_c3_role_postgen \
              tests.test_run115k_realstore_bridge_review \
              tests.test_run115k_postassembly_authority_review \
              tests.test_run116_b1b2_jef_c3_native \
              tests.test_jef_two_source_role_formatter_candidate \
              tests.test_two_source_pointer_shadow_candidate \
              tests.test_b1b2_c3_source_envelope_candidate) > "$e/TEST_RAW.log" 2>&1
            test_rc=$?
          else
            echo DEPS_RED > "$e/TEST_RAW.log"
            test_rc=125
          fi
          "$py" -m compileall -q v13/code/scripts/run117r_native_output_postgen_replay.py v13/code/tests/test_run117r_native_output_postgen_replay.py > "$e/COMPILE_RAW.log" 2>&1
          compile_rc=$?
          python3 v13/code/scripts/public_repo_privacy_scan.py --base acc014728918a2d1cf1c382693996243a8ab7fa6 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          privacy_rc=$?
          git diff --check acc014728918a2d1cf1c382693996243a8ab7fa6 HEAD > "$e/DIFF_RAW.log" 2>&1
          diff_rc=$?
          set -e
          for item in "SOURCE:$source_rc" "DOWNLOAD:$download_rc" "HASH:$hash_rc" "DEPS:$deps_rc" "REPLAY:$replay_rc" "TEST:$test_rc" "COMPILE:$compile_rc" "PRIVACY:$privacy_rc" "DIFF:$diff_rc"; do
            echo "${item#*:}" > "$e/${item%%:*}_EXIT.txt"
          done
          python3 - "$e" <<'PY' > "$e/RESULT_RAW.log"
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1]);names=('SOURCE','DOWNLOAD','HASH','DEPS','REPLAY','TEST','COMPILE','PRIVACY','DIFF')
          r={'schema':'v13.run117r.native_text_replay_evidence.v1',
             'head':(e/'HEAD.txt').read_text().strip(),
             'original_artifact_id':13051756857,
             'original_sha256':'71de9bb7bc2899f5aee67f58b55d13514d0a9b0d870cd98ae5e8f2f1850d11c5',
             'exits':{n:int((e/(n+'_EXIT.txt')).read_text()) for n in names},
             'native_executed_this_run':False,'original_native_text_replayed':True,
             'synthetic_body_observers':True,'real_sqlite_store':True,
             'output_committed':False,'delivery_authority':0,'learning_authority':0,
             'step2_promoted':False,'redmi_measured':False,'whole_system_complete':False}
          (e/'RESULT.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
          rm -f "$e/ORIGINAL_RUN116.zip"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat "$e/RESULT_RAW.log"
          cat "$e/REPLAY_RAW.log"
          tail -n 9 "$e/TEST_RAW.log"
          for rc in "$source_rc" "$download_rc" "$hash_rc" "$deps_rc" "$replay_rc" "$test_rc" "$compile_rc" "$privacy_rc" "$diff_rc"; do test "$rc" -eq 0; done
      - name: Preserve original replay receipt GREEN or RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117r-replay-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117r-replay/
          if-no-files-found: warn
          retention-days: 90
