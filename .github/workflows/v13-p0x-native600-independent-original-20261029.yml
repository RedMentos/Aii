name: V13 P0X independent original 600-call raw audit
on:
  push:
    branches: [codex/v13-p0x-native600-independent-review-20261029]
    paths: ['.github/workflows/v13-p0x-native600-independent-original-20261029.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: v13-p0x-native600-independent-original
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Exact original 600 native raw, strict source/oracle and tamper review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          e="$RUNNER_TEMP/v13-p0x-native600-independent-original"
          mkdir -p "$e/original"
          git rev-parse HEAD > "$e/HEAD.txt"
          {
            test "$(git hash-object v13/code/scripts/p0x_native600_raw_independent_audit.py)" = 07c047ddcee76db20a81564626ec50537688cb6c
            test "$(git hash-object v13/code/tests/test_p0x_native600_raw_independent_audit.py)" = 9245d83061d6a9a0870c9d9430ed1552ccfae4f5
            test "$(git hash-object v13/code/docs/proofs/continuation-20261029/P0X_NATIVE600_EXTERNAL_EVIDENCE_PINS.json)" = 13abbbaa37145641282f5dd59b8f37db4bd38404
            test "$(git hash-object v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md)" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
            git merge-base --is-ancestor 4a98235e7e17c0dfd0e9a9cc3cb8478f99d9abac HEAD
          } > "$e/PINS_RAW.log" 2>&1
          echo "$?" > "$e/PINS_EXIT.txt"
          gh run download 40841374171 -n v13-p0x-c3-600call-40841374171-4a98235e7e17c0dfd0e9a9cc3cb8478f99d9abac -D "$e/original" > "$e/DOWNLOAD_RAW.log" 2>&1
          echo "$?" > "$e/DOWNLOAD_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/p0x_native600_raw_independent_audit.py v13/code/tests/test_p0x_native600_raw_independent_audit.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          pins="$PWD/v13/code/docs/proofs/continuation-20261029/P0X_NATIVE600_EXTERNAL_EVIDENCE_PINS.json"
          if [ "$(cat "$e/DOWNLOAD_EXIT.txt")" = 0 ]; then
            (cd v13/code && python3 -m scripts.p0x_native600_raw_independent_audit --root "$e/original" --pins-json "$pins") > "$e/VERIFY_RAW.json" 2>&1
            echo "$?" > "$e/VERIFY_EXIT.txt"
            (cd v13/code && P0X_ORIGINAL_600_EVIDENCE="$e/original" P0X_ORIGINAL_600_PINS="$pins" python3 -m unittest -v tests.test_p0x_native600_raw_independent_audit) > "$e/TESTS_RAW.log" 2>&1
            echo "$?" > "$e/TESTS_EXIT.txt"
          else
            echo SKIPPED_DOWNLOAD_RED > "$e/VERIFY_RAW.json"; echo SKIPPED_RED > "$e/VERIFY_EXIT.txt"
            echo SKIPPED_DOWNLOAD_RED > "$e/TESTS_RAW.log"; echo SKIPPED_RED > "$e/TESTS_EXIT.txt"
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 4a98235e7e17c0dfd0e9a9cc3cb8478f99d9abac --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 4a98235e7e17c0dfd0e9a9cc3cb8478f99d9abac HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - name: Retain original closed raw including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-p0x-native600-independent-original-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-p0x-native600-independent-original/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce independent original evidence gates
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-p0x-native600-independent-original"
          for n in PINS DOWNLOAD COMPILE VERIFY TESTS PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; raw retained, no acceptance"
              tail -35 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          grep -q CLEAN "$e/PRIVACY_RAW.log"
          echo P0X_600_INDEPENDENT_RAW_CLOSED_NO_STEP2_B3_JEPA_REDMI_GATE
