name: V13 AG6 finite gate source-only review
on:
  push:
    branches: [codex/v13-ag6-finite-gate-review-20261029-auto10b]
    paths:
      - '.github/workflows/v13-ag6-gate-finite-source-20261029.yml'
      - 'v13/code/v13/agi/weights.py'
      - 'v13/code/tests/test_ag6_gate_finite_review_20261029.py'
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      V13_NO_AUTOSTART: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Focused and full software tests with closed raw evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-ag6-gate-finite-source"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/v13/agi/weights.py v13/code/tests/test_ag6_gate_finite_review_20261029.py > "$e/SOURCE_BLOBS.txt"
          python3 -m venv "$RUNNER_TEMP/venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            rc="$?"
            if [ "$rc" = 0 ]; then
              "$py" -m pip install --disable-pip-version-check --no-input 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/DEPS_RAW.log" 2>&1
              rc="$?"
            fi
            if [ "$rc" = 0 ]; then
              "$py" -m pip install --disable-pip-version-check --no-input 'transformers==5.20.2' 'peft==0.21.2' >> "$e/DEPS_RAW.log" 2>&1
              rc="$?"
            fi
            echo "$rc" > "$e/DEPS_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
          else echo SKIPPED > "$e/DEPS_EXIT.txt"; echo SKIPPED > "$e/PIP_CHECK_EXIT.txt"; fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_ag6_gate_finite_review_20261029 tests.test_score_anchor_train_crosschain_20261029 tests.test_anchor_train_boundary_review_20261029 tests.test_weight_approval_atomic tests.test_agi_trainers) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests) > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
            "$py" -m compileall -q v13/code/v13/agi/weights.py v13/code/tests/test_ag6_gate_finite_review_20261029.py > "$e/COMPILE_RAW.log" 2>&1
            echo "$?" > "$e/COMPILE_EXIT.txt"
          else
            for n in FOCUSED FULL COMPILE; do echo SKIPPED > "$e/${n}_EXIT.txt"; echo SKIPPED > "$e/${n}_RAW.log"; done
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base f428a171cd595ed053d0c7e16801ce415bf1e4a0 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check f428a171cd595ed053d0c7e16801ce415bf1e4a0 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve raw including negative results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-ag6-gate-finite-source-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-ag6-gate-finite-source/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce exact-head source-only checks
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-ag6-gate-finite-source"
          for n in VENV DEPS PIP_CHECK FOCUSED FULL COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; raw preserved"
              tail -70 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'AG6_FINITE_GATE_SOFTWARE_ONLY_NO_AUTHORITY'
