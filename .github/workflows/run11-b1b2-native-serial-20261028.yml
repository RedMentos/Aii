name: V13 Run11 pinned distinct B1 B2 serial native Linux smoke
on:
  push:
    branches:
      - codex/v13-run11-distinct-b1b2-native-serial-20261028
    paths:
      - '.github/workflows/run11-b1b2-native-serial-20261028.yml'
      - 'v13/code/scripts/current_b1b2_native_linux_smoke_20261028.py'
      - 'v13/code/scripts/native_smoke_io_20261028.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v13-run11-b1b2-serial-native
  cancel-in-progress: false
jobs:
  b1b2-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Focused guards then exact pinned distinct B1 and B2 serial Linux native
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-b1b2-serial-native"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/specs/models.json > "$e/CATALOG_BLOB.txt"
          git hash-object v13/code/v13/models.py > "$e/MANAGER_BLOB.txt"
          git hash-object v13/code/scripts/current_b1b2_native_linux_smoke_20261028.py > "$e/PROBE_BLOB.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:tests python3 -m unittest -q tests.test_native_smoke_io_20261028 tests.test_current_c3_native_linux_smoke_20261028 tests.test_current_b1b2_native_linux_smoke_20261028) > "$e/GUARDS_RAW.log" 2>&1
          echo "$?" > "$e/GUARDS_EXIT.txt"
          if [ "$(cat "$e/GUARDS_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 14m env PYTHONPATH=v13/code python3 v13/code/scripts/current_b1b2_native_linux_smoke_20261028.py \
              --scratch-home "$RUNNER_TEMP/v13-b1b2-serial-native-scratch" \
              --evidence-dir "$e/native" > "$e/NATIVE_PROBE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_PROBE_EXIT.txt"
          else
            echo SKIPPED_GUARDS_RED > "$e/NATIVE_PROBE_RAW.log"
            echo SKIPPED_RED > "$e/NATIVE_PROBE_EXIT.txt"
          fi
          python3 - "$e" > "$e/REPORT_CHECK_RAW.log" 2>&1 <<'PY'
          import hashlib,json,pathlib,sys
          p=pathlib.Path(sys.argv[1])/'native'
          report=p/'REPORT.json'
          if not report.is_file():
              raise SystemExit('NO_CLOSED_NATIVE_REPORT')
          j=json.loads(report.read_text())
          assert j['evidence_kind']=='LINUX_NATIVE_DISTINCT_B1_B2_SERIAL_SMOKE'
          assert j['catalog_git_blob']=='7af05962af41d0bc3f7dd18ef01d4eba55eabf99'
          assert j['model_manager_git_blob']=='bd035cf8029850cce00b179edf533e53bf24358a'
          assert j['runner_tar_sha256']=='9abf88aea48a55d0f80edb1ee20220b186848cca0b4e919d71518cfd7ca67443'
          assert j['native_all_pass'] and j['models_distinct'] and j['serial_execution']
          roles=j['roles']
          assert len(roles)==2 and [r['role'] for r in roles]==['B1_DETAIL','B2_GIST']
          pins=['bb741ebb106d543e9de114b843a3d3d73d51c74b5801e69da2abde821a0cb3e1','57d1997790d1744fba5b40a7317df71ea5e2acee28c47e78f0cce39c0703f8cf']
          for r,pin in zip(roles,pins):
              assert r['model_sha256']==pin and r['native_exit_code']==0 and r['native_smoke_pass']
              assert r['generation_marker_seen'] and r['raw_capture_complete']
              assert not r['raw_output_capped'] and not r['native_timed_out']
              assert r['stdout_bytes']<1048576 and r['stderr_bytes']<1048576
              for suffix,key in [('STDOUT_RAW.log','stdout_sha256'),('STDERR_RAW.log','stderr_sha256')]:
                  name=r['role']+'_'+suffix
                  assert hashlib.sha256((p/name).read_bytes()).hexdigest()==r[key]
          assert not j['c2_jef_executed'] and not j['c3_executed'] and not j['redmi_measured']
          assert not j['step2_gate_promoted'] and j['jepa_weight']==0 and j['age_authority']==0
          assert not j['whole_system_complete']
          print('PINNED_DISTINCT_B1_B2_SERIAL_LINUX_NATIVE_ONLY_NO_GATE_PROMOTION')
          PY
          echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 7b3347103e65e5f491a91aba8a84e1bc78818242 --head HEAD > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 7b3347103e65e5f491a91aba8a84e1bc78818242 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-b1b2-serial-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-b1b2-serial-native/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce exact B1 and B2 native evidence, no gate promotion
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-b1b2-serial-native"
          for name in GUARDS NATIVE_PROBE REPORT_CHECK PRIVACY DIFF; do
            if [ "$(cat "$e/${name}_EXIT.txt")" != 0 ]; then
              echo "$name RED; raw retained; no native PASS claim"
              tail -80 "$e/${name}_RAW.log" || true
              exit 1
            fi
          done
          echo 'CURRENT_B1_B2_DISTINCT_SERIAL_LINUX_NATIVE_ONLY_NO_STEP2_REDM I_OR_GATE_PROMOTION'
