name: V13 Run13P pinned 350M CE versus contrastive JEPA gradient attribution
on:
  push:
    branches: [assistant/v13-run13p-bjepa-gradient-attribution-20261030-auto11]
    paths:
      - 'v13/code/docs/RUN13P_NATIVE_TRIGGER_20261030.txt'
permissions:
  contents: read
concurrency:
  group: v13-bodyjepa-350m-eval-paired-native-serial-20261030
  cancel-in-progress: false
jobs:
  native-gradient:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      V13_NO_AUTOSTART: '1'
      PYTHONNOUSERSITE: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Pin source, install isolated CPU dependencies, and capture original native raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run13p-native"
          w="$RUNNER_TEMP/v13-run13p-work"
          mkdir -p "$e" "$w"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/CANON_BLOB.txt"
          git hash-object v13/code/v13/body_jepa.py > "$e/BJEPA_BLOB.txt"
          git hash-object v13/code/v13/lora_trainer.py > "$e/LORA_BLOB.txt"
          git hash-object v13/code/v13/body_jepa_contrastive_shadow.py > "$e/LOSS_BLOB.txt"
          git hash-object v13/code/scripts/bodyjepa_ce_contrast_gradient_run13p.py > "$e/PROBE_BLOB.txt"
          git hash-object v13/code/tests/test_bodyjepa_ce_contrast_gradient_run13p.py > "$e/TEST_BLOB.txt"
          git hash-object v13/code/docs/RUN13P_BJEPA_GRADIENT_ATTRIBUTION_PREREG_20261030.md > "$e/PREREG_BLOB.txt"
          test "$(cat "$e/CANON_BLOB.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7 &&
          test "$(cat "$e/BJEPA_BLOB.txt")" = b560d4e88fe457f381e89dfc5d6188a8ec3b306b &&
          test "$(cat "$e/LORA_BLOB.txt")" = 49a752879ae5d19391963742a0f042e740edb2cc &&
          test "$(cat "$e/LOSS_BLOB.txt")" = acd40aeac9e286e93b40bda72c655c17725a522e &&
          test "$(cat "$e/PROBE_BLOB.txt")" = 07e64d1dacdadc12e16c59e4fb448466f5369fd5 &&
          test "$(cat "$e/TEST_BLOB.txt")" = 410685fbf2e22294314b27d9429e8e8f07810c44 &&
          test "$(cat "$e/PREREG_BLOB.txt")" = ca828dc4b6565afb304b8e43b7ae7b7b4f2e492b
          echo "$?" > "$e/SOURCE_EXIT.txt"
          python3 -m venv "$w/venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$w/venv/bin/python"
          "$py" -m pip install --no-input --disable-pip-version-check --timeout 90 --retries 2 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu > "$e/TORCH_RAW.log" 2>&1
          echo "$?" > "$e/TORCH_EXIT.txt"
          "$py" -m pip install --no-input --disable-pip-version-check --timeout 90 --retries 2 'numpy==2.2.6' 'transformers==5.20.2' 'tokenizers==0.23.1' 'safetensors==0.8.0' 'peft==0.21.2' 'huggingface_hub>=1.31.0,<2.0' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
          echo "$?" > "$e/PIP_CHECK_EXIT.txt"
          "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
          (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_bodyjepa_ce_contrast_gradient_run13p tests.test_body_jepa_contrastive_shadow_run12a) > "$e/SOFTWARE_RAW.log" 2>&1
          echo "$?" > "$e/SOFTWARE_EXIT.txt"
          "$py" -m py_compile v13/code/scripts/bodyjepa_ce_contrast_gradient_run13p.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$(cat "$e/SOURCE_EXIT.txt")" = 0 ] && [ "$(cat "$e/SOFTWARE_EXIT.txt")" = 0 ]; then
            MASTER="$w/master" "$py" - <<'PY' > "$e/DOWNLOAD_RAW.log" 2>&1
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='LiquidAI/LFM2.5-350M',
              revision='120bf032c36dd1273de754669da040dba7ad4982',
              local_dir=os.environ['MASTER'],
              allow_patterns=['*.json','*.jinja','*.safetensors','LICENSE','README.md'])
          PY
            echo "$?" > "$e/DOWNLOAD_EXIT.txt"
          else echo SKIPPED > "$e/DOWNLOAD_EXIT.txt"; fi
          if [ "$(cat "$e/DOWNLOAD_EXIT.txt")" = 0 ]; then
            (cd v13/code && HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 PYTHONPATH=.:scripts timeout --signal=TERM --kill-after=15s 1500s "$py" scripts/bodyjepa_ce_contrast_gradient_run13p.py --master "$w/master" --out "$e/RESULT.json" --execute-native) > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else echo SKIPPED > "$e/NATIVE_EXIT.txt"; fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 5d37d8cb25f5cc1dab347c3cea9a64fe08d077c5 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 5d37d8cb25f5cc1dab347c3cea9a64fe08d077c5 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve all raw including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run13p-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run13p-native/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce stages and negative gates without waiver
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run13p-native"
          for stage in SOURCE VENV TORCH DEPS PIP_CHECK SOFTWARE COMPILE DOWNLOAD NATIVE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained; no gate promotion"
              tail -80 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          "$RUNNER_TEMP/v13-run13p-work/venv/bin/python" - "$e/RESULT.json" <<'PY'
          import json,sys,math
          d=json.load(open(sys.argv[1]))
          assert d["status"]=="ATTRIBUTABLE_GRADIENT_PRESENT_MECHANISM_ONLY"
          assert d["model_revision"]=="120bf032c36dd1273de754669da040dba7ad4982"
          assert d["master_sha256"]=="1c9c77a4471a7f590f85240f74ed1fc26df7fbde88c3006724e2f93ca993ea4e"
          assert d["fixture_sha256"]=="9a7ab2d99694a45d56292fe8f8500b34264f66bfd8c47590855d1ff9232607d4"
          m=d["measurement"]
          assert all(math.isfinite(m[k]) and m[k]>0 for k in ("ce_adapter_l2","contrastive_adapter_l2","shuffled_adapter_l2","contrastive_predictor_l2"))
          assert m["frozen_before_sha256"]==m["frozen_after_sha256"]
          assert m["ema_updates"]==0 and m["no_optimizer_step"] is True
          assert d["jepa_weight_runtime"]==0 and d["learning_enabled"] is False
          assert d["utility_gate_pass"] is False and d["redmi_measured"] is False and d["whole_system_complete"] is False
          print("RUN13P_MECHANISM_ONLY_NO_UTILITY_OR_AGE_PROMOTION")
          PY
