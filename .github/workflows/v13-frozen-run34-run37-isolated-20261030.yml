name: V13 frozen Run34 Run37 isolated preflight replay
on:
  push:
    branches: [codex/v13-frozen-run34-run37-isolated-20261030-auto11n]
    paths:
      - '.github/workflows/v13-frozen-run34-run37-isolated-20261030.yml'
      - 'v13/code/docs/proofs/continuation-20261030/RUN34_RUN37_FROZEN_ISOLATED_PREREG_20261030.md'
permissions:
  contents: read
jobs:
  frozen-source-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve current RED and isolated historical GREEN without source rewrite
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-frozen-run34-run37"
          frozen="$RUNNER_TEMP/v13-frozen-source"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/specs/models.json v13/code/scripts/run33_b2_c3_counterfactual_envelopes.py v13/code/v13/runners.py v13/code/v13/utility.py v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/ACTIVE_BLOBS.txt"
          test "$(tail -1 "$e/ACTIVE_BLOBS.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          echo "$?" > "$e/CANON_EXIT.txt"
          test "$(sed -n '4p' "$e/ACTIVE_BLOBS.txt")" = ff16ab6012b2865e0f3abde2a289aaf00e9aaa53
          echo "$?" > "$e/ACTIVE_PIN_EXIT.txt"
          git cat-file -e f4a92dab9c4a40761d64394cdca1c052e9a76bfd^{blob} > "$e/FROZEN_OBJECT_RAW.log" 2>&1
          echo "$?" > "$e/FROZEN_OBJECT_EXIT.txt"
          git worktree add --detach "$frozen" HEAD > "$e/WORKTREE_RAW.log" 2>&1
          echo "$?" > "$e/WORKTREE_EXIT.txt"
          if [ "$(cat "$e/WORKTREE_EXIT.txt")" = 0 ]; then
            git cat-file blob f4a92dab9c4a40761d64394cdca1c052e9a76bfd > "$frozen/v13/code/v13/utility.py"
            echo "$?" > "$e/RESTORE_EXIT.txt"
            (cd "$frozen" && git hash-object v13/code/specs/models.json v13/code/scripts/run33_b2_c3_counterfactual_envelopes.py v13/code/v13/runners.py v13/code/v13/utility.py) > "$e/FROZEN_BLOBS.txt"
            printf '%s\n' 7af05962af41d0bc3f7dd18ef01d4eba55eabf99 b1d58d7e0c3937787cf15dd801e278de25845879 efda7aa1aa5729e974d0d641870d4da05d21c961 f4a92dab9c4a40761d64394cdca1c052e9a76bfd > "$e/EXPECTED_FROZEN_BLOBS.txt"
            cmp -s "$e/FROZEN_BLOBS.txt" "$e/EXPECTED_FROZEN_BLOBS.txt"
            echo "$?" > "$e/FROZEN_PIN_EXIT.txt"
          else
            echo SKIPPED > "$e/RESTORE_EXIT.txt"
            echo SKIPPED > "$e/FROZEN_PIN_EXIT.txt"
          fi
          python3 -m venv "$RUNNER_TEMP/v13-frozen-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-frozen-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
          else
            echo SKIPPED > "$e/DEPS_EXIT.txt"
            echo SKIPPED > "$e/PIP_CHECK_EXIT.txt"
          fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_run34_c3_native_quote_intervention_pilot tests.test_run37_c3_rule_use_native_pilot) > "$e/CURRENT_RED_RAW.log" 2>&1
            echo "$?" > "$e/CURRENT_RED_EXIT.txt"
            if [ "$(cat "$e/FROZEN_PIN_EXIT.txt")" = 0 ]; then
              (cd "$frozen/v13/code" && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_run34_c3_native_quote_intervention_pilot tests.test_run37_c3_rule_use_native_pilot) > "$e/FROZEN_GREEN_RAW.log" 2>&1
              echo "$?" > "$e/FROZEN_GREEN_EXIT.txt"
            else
              echo SKIPPED > "$e/FROZEN_GREEN_EXIT.txt"
              echo SKIPPED > "$e/FROZEN_GREEN_RAW.log"
            fi
          else
            echo SKIPPED > "$e/CURRENT_RED_EXIT.txt"
            echo SKIPPED > "$e/FROZEN_GREEN_EXIT.txt"
          fi
          "$py" -m py_compile v13/code/scripts/run34_c3_native_quote_intervention_pilot.py v13/code/scripts/run37_c3_rule_use_native_pilot.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base ef29bc777910067da28fa2b41445ebf7e3cccb0a --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check ef29bc777910067da28fa2b41445ebf7e3cccb0a HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          git status --porcelain > "$e/ACTIVE_WORKTREE_STATUS.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original RED and frozen GREEN raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-frozen-run34-run37-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-frozen-run34-run37/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce isolated historical proof only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-frozen-run34-run37"
          for stage in CANON ACTIVE_PIN FROZEN_OBJECT WORKTREE RESTORE FROZEN_PIN VENV DEPS PIP_CHECK FROZEN_GREEN COMPILE PRIVACY DIFF; do
            test "$(cat "$e/${stage}_EXIT.txt")" = 0 || { echo "$stage FAILED"; exit 1; }
          done
          test "$(cat "$e/CURRENT_RED_EXIT.txt")" != 0
          grep -q 'FAILED (errors=2)' "$e/CURRENT_RED_RAW.log"
          test "$(grep -c 'ValueError: native_source_or_catalog_changed' "$e/CURRENT_RED_RAW.log")" = 2
          grep -q 'OK$' "$e/FROZEN_GREEN_RAW.log"
          test ! -s "$e/ACTIVE_WORKTREE_STATUS.txt"
          echo 'HISTORICAL_ISOLATED_PREFLIGHT_ONLY_NO_NATIVE_NO_GATE_PROMOTION'
