name: V14 audio consent lease-through-generation QA

on:
  pull_request:
    branches: [core/v14-a5-voice-current-20261121]
    paths:
      - "v13/code/tests/test_c3_audio_runtime_consumer.py"
      - ".github/workflows/v14-audio-consent-generation-lease-qa.yml"
  push:
    branches: ["qa/v14-audio-consent-generation-lease-20261121"]
    paths:
      - "v13/code/tests/test_c3_audio_runtime_consumer.py"
      - ".github/workflows/v14-audio-consent-generation-lease-qa.yml"

jobs:
  audio-consent-generation-lease:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 psutil PyYAML pytest==9.2.0
      - name: Compile staged consumer tests
        run: |
          python -m py_compile v13/code/tests/test_c3_audio_runtime_consumer.py v13/code/tests/test_v14_audio_context_stage_20261121.py
      - name: Run hash-bound staged A5 consumer and consent regressions
        env:
          PYTHONPATH: v13/code
        run: |
          python -m pytest -q v13/code/tests/test_v14_audio_context_stage_20261121.py
