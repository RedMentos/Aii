name: V13 20261031 current-chain unfiltered CPU Torch Transformers PEFT regression
on:
  push:
    branches: [assistant/v13-currentchain-unfiltered-fullsuite-20261031-auto11]
    paths: ['.github/workflows/v13-currentchain-unfiltered-fullsuite.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fullsuite:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Unfiltered suite with frozen dependencies and closed raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-currentchain-fullsuite"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          898e5706c39944b3ad9175b78ad4a37c0ce07e56 v13/code/docs/CURRENTCHAIN_UNFILTERED_FULLSUITE_PREREG_20261031.md
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          1a9eb6f7c7cbfce83d91cc09b4ff9516cff310cf v13/code/v13/cognition.py
          0779d986fb8aee8aa01c5df5f656889d4bd56348 v13/code/v13/store.py
          22ed11e4a53d9eeae8fbc74a1753082b5785be2b v13/code/v13/runtime.py
          277d34a46b14633c52b5e7d59b3fdf0f16ea4159 v13/code/v13/b1b2_topic_partition_candidate.py
          368c9965013e4001d43ec9dff9987b8660e1e28d v13/code/v13/f1f5_temporal_source_gate_candidate.py
          26f866c88c1604b6119aaf55066f40a9f8b43f4f v13/code/v13/f1f5_temporal_atomic_draft_candidate.py
          3aa9a6bc641aac4995b4fb8018d3080acf18469f v13/code/tests/test_f1f5_temporal_atomic_draft_candidate.py
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-currentchain-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-currentchain-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu' > "$e/TORCH_RAW.log" 2>&1
          echo "$?" > "$e/TORCH_EXIT.txt"
          "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'transformers==4.44.2' > "$e/TRANSFORMERS_RAW.log" 2>&1
          echo "$?" > "$e/TRANSFORMERS_EXIT.txt"
          "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'peft==0.13.2' > "$e/PEFT_RAW.log" 2>&1
          echo "$?" > "$e/PEFT_EXIT.txt"
          "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
          echo "$?" > "$e/PIP_CHECK_EXIT.txt"
          "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
          echo "$?" > "$e/PIP_FREEZE_EXIT.txt"
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ] && [ "$(cat "$e/TORCH_EXIT.txt")" = 0 ] && [ "$(cat "$e/TRANSFORMERS_EXIT.txt")" = 0 ] && [ "$(cat "$e/PEFT_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=10s 20m env PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests -p 'test_*.py') > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else echo DEPENDENCIES_RED > "$e/FULL_RAW.log"; echo 99 > "$e/FULL_EXIT.txt"; fi
          "$py" -m compileall -q v13/code/v13 v13/code/scripts > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          git rev-parse --verify 8dab5814161523d8ffe2177ee7441133794beeb9 > "$e/FETCH_RAW.log" 2>&1
          echo "$?" > "$e/FETCH_EXIT.txt"
          python3 - > "$e/PRIVACY_RAW.log" 2>&1 <<'PY'
          import subprocess,sys
          sys.path.insert(0,'v13/code')
          from scripts.public_repo_privacy_scan import scan
          d=subprocess.check_output(['git','diff','--no-color','-U0','--text','8dab5814161523d8ffe2177ee7441133794beeb9','HEAD'],text=True)
          hits=scan(d)
          print('privacy','CLEAN' if not hits else hits)
          sys.exit(bool(hits))
          PY
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 8dab5814161523d8ffe2177ee7441133794beeb9 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve complete unfiltered raw including historical failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-currentchain-fullsuite-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-currentchain-fullsuite/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce exact unfiltered suite without waivers
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-currentchain-fullsuite"
          for s in PINS VENV DEPS TORCH TRANSFORMERS PEFT PIP_CHECK PIP_FREEZE FULL COMPILE FETCH PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo CURRENTCHAIN_FULL_SOFTWARE_ONLY_NO_NATIVE_REDMI_AGE_OR_STEP2_PROMOTION
