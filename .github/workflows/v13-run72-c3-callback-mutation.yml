name: V13 Run72 C3 callback mutation guard real-Store software
on:
  push:
    branches: [assistant/v13-run72-schema-callback-mutation-audit-20261031-auto11]
    paths:
      - '.github/workflows/v13-run72-c3-callback-mutation.yml'
      - 'v13/code/v13/jef_c3_schema_source_recheck_shadow.py'
      - 'v13/code/tests/test_jef_c3_schema_source_recheck_shadow.py'
permissions:
  contents: read
concurrency:
  group: v13-run72-c3-callback-software
  cancel-in-progress: false
jobs:
  callback-mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run source-bound real-Store tests and capture raw evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run72-callback"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          1d7c89dd80cf827c6f7f1efd3377bd28aa955e78 v13/code/v13/jef_c3_schema_source_recheck_shadow.py
          e510d31398fafcfda9b0459bb59f1569e668227e v13/code/tests/test_jef_c3_schema_source_recheck_shadow.py
          ee976c0329ad751b4851862680e6fe6f9ee66e82 v13/code/v13/jef_c3_schema_draft_candidate.py
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run72-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run72-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          for t in test_jef_c3_schema_source_recheck_shadow.py test_jef_c3_schema_draft_candidate.py test_run71_schema_crosspackage_integration.py; do
            key="${t%.py}"
            if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
              timeout --signal=TERM --kill-after=5s 6m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m unittest discover -s v13/code/tests -p "$t" -v > "$e/${key}_RAW.log" 2>&1
              echo "$?" > "$e/${key}_EXIT.txt"
            else echo DEPS_RED > "$e/${key}_RAW.log"; echo 99 > "$e/${key}_EXIT.txt"; fi
          done
          python3 -m compileall -q v13/code/v13/jef_c3_schema_source_recheck_shadow.py v13/code/tests/test_jef_c3_schema_source_recheck_shadow.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 6fa7c9c277bf271b5e3a17c4d4e1a3f57cdaefc7 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 6fa7c9c277bf271b5e3a17c4d4e1a3f57cdaefc7 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Retain raw evidence including failed checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run72-callback-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run72-callback/
          if-no-files-found: error
          retention-days: 90
      - name: Require every stage green
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-run72-callback"
          for s in PINS VENV DEPS test_jef_c3_schema_source_recheck_shadow test_jef_c3_schema_draft_candidate test_run71_schema_crosspackage_integration COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN72_SOFTWARE_ONLY_NO_NATIVE_OR_AGE_PROMOTION
