name: V13 Run117AF seed1067 combined C3 native model-free preflight
on:
  push:
    branches:
      - assistant/v13-run117af-combined-c3-native-20261031-gpt6
    paths:
      - .github/workflows/v13-run117af-combined-c3-preflight.yml
      - v13/code/docs/RUN117AF_*
      - v13/code/docs/fixtures/RUN117AF_*
      - v13/code/tests/test_run117af_combined_c3_native_preflight.py
permissions:
  contents: read
jobs:
  frozen-seed1067-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Verify immutable seed1067 and both prompt paths
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117af-preflight"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run117af-preflight-venv" > "$e/VENV_RAW.log" 2>&1
          py="$RUNNER_TEMP/v13-run117af-preflight-venv/bin/python"
          set +e
          "$py" -m pip install --disable-pip-version-check --no-input -q \
            'numpy==2.2.6' 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          deps_rc=$?
          echo 'cbaa2e2f8e92c994a63f12fdb9ff165c5082dcd8a33ef2c7c311e512749f29cf  v13/code/docs/fixtures/RUN117AF_COMBINED_C3_NATIVE_SEED1067.json' | sha256sum -c - > "$e/FIXTURE_RAW.log" 2>&1
          fixture_rc=$?
          test "$(git hash-object v13/code/docs/fixtures/RUN117AF_COMBINED_C3_NATIVE_SEED1067.json)" = 86edd23a22747a1a52773890e7663acb9aa6f3e1
          blob_rc=$?
          if test "$deps_rc" -eq 0 && test "$fixture_rc" -eq 0 && test "$blob_rc" -eq 0; then
            (cd v13/code && env PYTHONPATH=. "$py" -m unittest -v \
              tests.test_run117af_combined_c3_native_preflight \
              tests.test_b1b2_jef_span_c3_bridge_candidate \
              tests.test_jef_span_budget_shadow_candidate) > "$e/TEST_RAW.log" 2>&1
            test_rc=$?
          else
            test_rc=125;echo PREREQUISITE_RED > "$e/TEST_RAW.log"
          fi
          "$py" -m compileall -q v13/code/tests/test_run117af_combined_c3_native_preflight.py > "$e/COMPILE_RAW.log" 2>&1
          compile_rc=$?
          python3 v13/code/scripts/public_repo_privacy_scan.py \
            --base 31fa3551a9c375e4fe09abc0e3e0eeb12ae26501 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          privacy_rc=$?
          git diff --check 31fa3551a9c375e4fe09abc0e3e0eeb12ae26501 HEAD > "$e/DIFF_RAW.log" 2>&1
          diff_rc=$?
          for x in "DEPS:$deps_rc" "FIXTURE:$fixture_rc" "BLOB:$blob_rc" \
                   "TEST:$test_rc" "COMPILE:$compile_rc" "PRIVACY:$privacy_rc" "DIFF:$diff_rc"; do
            echo "${x#*:}" > "$e/${x%%:*}_EXIT.txt"
          done
          set -e
          "$py" - "$e" <<'PY' > "$e/RESULT_RAW.log"
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1]);names=('DEPS','FIXTURE','BLOB','TEST','COMPILE','PRIVACY','DIFF')
          r={'schema':'v13.run117af.seed1067_model_free_preflight.v1',
             'head':(e/'HEAD.txt').read_text().strip(),
             'fixture_sha256':'cbaa2e2f8e92c994a63f12fdb9ff165c5082dcd8a33ef2c7c311e512749f29cf',
             'fixture_blob':'86edd23a22747a1a52773890e7663acb9aa6f3e1',
             'exits':{n:int((e/(n+'_EXIT.txt')).read_text()) for n in names},
             'native_calls':0,'body_observers_synthetic':True,
             'age0':'RECORD_ONLY','step2_promoted':False,
             'b3_promoted':False,'jepa_weight':0,'redmi_measured':False,
             'whole_system_complete':False}
          (e/'RESULT.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat "$e/RESULT_RAW.log"
          tail -n 7 "$e/TEST_RAW.log"
          for rc in "$deps_rc" "$fixture_rc" "$blob_rc" "$test_rc" "$compile_rc" "$privacy_rc" "$diff_rc"; do test "$rc" -eq 0; done
      - name: Preserve preflight raw GREEN or RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117af-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117af-preflight/
          if-no-files-found: warn
          retention-days: 90
