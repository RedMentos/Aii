name: V13 Core C3 local speech operator
on:
  push:
    branches:
      - codex/v13-core-speech-operator-20261111-2106
  pull_request:
    paths:
      - 'v13/code/v13/speech_operator.py'
      - 'v13/code/tests/test_speech_operator_handoff.py'
      - 'v13/code/v13/speech_store_binding.py'
jobs:
  speech-operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused regression
        run: |
          python -m pip install pytest
          cd v13/code
          python -m pytest -q tests/test_speech_intent.py tests/test_speech_runtime_bridge.py tests/test_speech_store_binding.py tests/test_speech_operator_handoff.py
