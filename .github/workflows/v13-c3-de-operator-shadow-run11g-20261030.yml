name: V13 C3 German one-source operator SHADOW software
on:
  push:
    branches:
      - 'assistant/v13-c3-de-operator-probe-run11g-20261030'
    paths:
      - '.github/workflows/v13-c3-de-operator-shadow-run11g-20261030.yml'
      - 'v13/code/scripts/listarith_de_operator_shadow.py'
      - 'v13/code/tests/test_c3_de_operator_shadow_run11g_20261030.py'
permissions:
  contents: read
jobs:
  operator-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Private replay CLI software-only tests
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/c3-de-operator-shadow"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/c3-de-operator-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/c3-de-operator-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          (cd v13/code && timeout 5m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v \
            tests.test_c3_de_operator_shadow_run11g_20261030 \
            tests.test_listarith_de_closedworld_seed101_20261030) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          "$py" -m py_compile v13/code/scripts/listarith_de_operator_shadow.py \
            v13/code/tests/test_c3_de_operator_shadow_run11g_20261030.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py \
            --base 773a158463d51687c711250f21c99dad21c26b38 \
            --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 773a158463d51687c711250f21c99dad21c26b38 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-c3-de-operator-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/c3-de-operator-shadow/
          retention-days: 30
          if-no-files-found: error
      - name: Gate software-only and preserve raw failures
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/c3-de-operator-shadow"
          for stage in VENV DEPS TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/"$stage"_EXIT.txt")" != 0 ]; then
              echo "$stage RED; raw retained"
              tail -100 "$e/"$stage"_RAW.log" || true
              exit 1
            fi
          done
          echo "C3_OPERATOR_SOFTWARE_ONLY_NO_NATIVE_OR_TOOLSTEP_PROMOTION"
