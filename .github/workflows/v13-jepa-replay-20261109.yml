name: V13 JEPA replay retention
on:
  push:
    branches: ['codex/v13-jepa-replay-evaluation-*']
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pytest
      - run: PYTHONPATH=v13/code python -m pytest -q v13/code/tests/test_world_jepa_replay_20261109.py v13/code/tests/test_world_jepa_incremental_20261108.py
