name: V14 A3 OOD calibration ablation
on:
  push:
    branches:
      - "research-perception/**"
    paths:
      - "v13/code/v13/vision.py"
      - "v14/experiments/vision_ood_calibration.py"
      - "v14/experiments/test_vision_ood_calibration.py"
      - ".github/workflows/v14-vision-ood-calibration.yml"
  pull_request:
    paths:
      - "v13/code/v13/vision.py"
      - "v14/experiments/vision_ood_calibration.py"
      - "v14/experiments/test_vision_ood_calibration.py"
      - ".github/workflows/v14-vision-ood-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a3-ood-calibration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bounded research dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow pytest
      - name: Compile against the production V13 vision module
        env:
          PYTHONPATH: v13/code
        run: python -m py_compile v13/code/v13/vision.py v14/experiments/vision_ood_calibration.py
      - name: Run calibration, covariance and source-isolation tests
        env:
          PYTHONPATH: v13/code
        run: python -m pytest -q v14/experiments/test_vision_ood_calibration.py
      - name: Run deterministic synthetic end-to-end smoke
        env:
          PYTHONPATH: v13/code
        run: |
          python v14/experiments/vision_ood_calibration.py --repeats 1 > /tmp/v14-ood-smoke.json
          python -c "import json; x=json.load(open('/tmp/v14-ood-smoke.json')); assert x['schema']=='v14.vision_ood_calibration/1' and len(x['runs'])==1"
