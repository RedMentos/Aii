name: V13 P2X calibration one-factor source-only proof
on:
  push:
    branches: [assistant/v13-p2x-calibration-instruction-20261029]
    paths:
      - '.github/workflows/v13-p2x-calibration-source-20261029.yml'
      - 'v13/code/scripts/p2x_calibration_instruction.py'
      - 'v13/code/tests/test_p2x_calibration_instruction.py'
      - 'v13/code/docs/proofs/continuation-20261029/P2X_CALIBRATION_*'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record source and adversarial software evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-p2x-calibration-source"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          928023e1bb90e326969a8f8fdad25311c7779ced v13/code/docs/proofs/continuation-20261029/P2X_CALIBRATION_INSTRUCTION_PREREG.md
          8135fa2792df2c541dc1719e49d941c775703697 v13/code/scripts/p2x_disjoint_receiver_trainset.py
          c9509e299510540af4e43ebbc397f2e5a144142d v13/code/scripts/p2x_native_receiver_eval_scorer.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          : > "$e/SOURCE_RAW.log"
          source_red=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/SOURCE_RAW.log"
            if [ "$want" != "$got" ]; then source_red=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$source_red" > "$e/SOURCE_EXIT.txt"
          python3 -m py_compile v13/code/scripts/p2x_calibration_instruction.py v13/code/tests/test_p2x_calibration_instruction.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests python3 -m unittest -v tests.test_p2x_calibration_instruction) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base f8e05e6245fa8c221a89babacc41cd7b76668c23 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check f8e05e6245fa8c221a89babacc41cd7b76668c23 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original RED or GREEN source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-p2x-calibration-source-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-p2x-calibration-source/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce prereg and source-only tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-p2x-calibration-source"
          for stage in SOURCE COMPILE TEST PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED, raw preserved"
              tail -40 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
          echo "P2X_CALIBRATION_SOURCE_ONLY_NO_NATIVE_NO_GATE"
