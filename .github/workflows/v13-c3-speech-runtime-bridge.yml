name: V13 C3 speech runtime bridge
on:
  push:
    branches:
      - codex/v13-core-speech-runtime-bridge-20261111-1908
  pull_request:
    paths:
      - 'v13/code/v13/speech_runtime_bridge.py'
      - 'v13/code/tests/test_speech_runtime_bridge.py'
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: cd v13/code && python -m pytest -q tests/test_speech_intent.py tests/test_speech_runtime_bridge.py
