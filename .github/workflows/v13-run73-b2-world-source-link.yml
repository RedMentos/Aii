name: V13 Run73 B2 World source-bound event link SHADOW
on:
  push:
    branches: [codex/automation11-run73-b2-world-source-link-20261028]
  pull_request:
    branches: [codex/automation11-run70-b2-worldjepa-paired-realfile-integration-20261028]
permissions:
  contents: read
concurrency:
  group: v13-run73-${{ github.ref }}
  cancel-in-progress: true
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      V13_NO_AUTOSTART: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Capture Run73 source-bound evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run73"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          for p in v13/code/docs/proofs/continuation-20261028/RUN73_B2_WORLD_SOURCE_LINK_PREREG.md v13/code/v13/b2_world_event_link.py v13/code/tests/test_b2_world_event_link.py v13/code/v13/world.py v13/code/scripts/run40_b2_store_history_readonly.py; do git hash-object "$p" | xargs -I{} echo "{} $p"; done > "$e/FROZEN_RAW.log"
          if [ "$(git hash-object v13/code/docs/proofs/continuation-20261028/RUN73_B2_WORLD_SOURCE_LINK_PREREG.md)" = b4e8711fd2f3362a94e090320f9a00da0e0243ea ] && [ "$(git hash-object v13/code/v13/b2_world_event_link.py)" = 51b05b3f606fab856aea7feaeed63492099bd07b ] && [ "$(git hash-object v13/code/tests/test_b2_world_event_link.py)" = b02b2e6e10a34fbf1460aac5ca89c15de6c5ce74 ] && [ "$(git hash-object v13/code/v13/world.py)" = 3799f84fdf52a82efe70e0e5e73bcfe4a95f0ac7 ] && [ "$(git hash-object v13/code/scripts/run40_b2_store_history_readonly.py)" = f4befd61f22f87194c0cac070af73a1d7f559d73 ]; then echo 0 > "$e/FROZEN_EXIT.txt"; else echo 1 > "$e/FROZEN_EXIT.txt"; fi
          python3 -m venv "$RUNNER_TEMP/v13-run73-venv"
          py="$RUNNER_TEMP/v13-run73-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' > "$e/NUMPY_RAW.log" 2>&1
          echo "$?" > "$e/NUMPY_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 180s env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_b2_world_event_link tests.test_run40_b2_store_history_readonly tests.test_world_state) > "$e/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$e/FOCUSED_EXIT.txt"
          python3 -m compileall -q v13/code/v13/b2_world_event_link.py v13/code/tests/test_b2_world_event_link.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
            first=$?
            "$py" -m pip install --disable-pip-version-check --no-input 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
            second=$?
            "$py" -m pip install --disable-pip-version-check --no-input 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
            third=$?
            if [ "$first" = 0 ] && [ "$second" = 0 ] && [ "$third" = 0 ]; then
              echo 0 > "$e/INSTALL_EXIT.txt"
              (cd v13/code && timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=.:tests "$py" -m unittest discover -s tests -p 'test_*.py' -q) > "$e/FULL_RAW.log" 2>&1
              echo "$?" > "$e/FULL_EXIT.txt"
            else
              echo 1 > "$e/INSTALL_EXIT.txt"
              echo SKIPPED_PREREQ_RED > "$e/FULL_RAW.log"
              echo SKIPPED_RED > "$e/FULL_EXIT.txt"
            fi
          else
            for n in INSTALL FULL; do echo SKIPPED_FOCUSED_RED > "$e/${n}_RAW.log"; echo SKIPPED_RED > "$e/${n}_EXIT.txt"; done
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 1a592970781c581dce643168004b50bda7a2d95d --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 1a592970781c581dce643168004b50bda7a2d95d HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - name: Preserve original Run73 raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run73-link-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run73/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce Run73 source-only gates
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run73"
          for n in FROZEN NUMPY FOCUSED COMPILE INSTALL FULL PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; original raw retained; no B2/JEPA/native/gate promotion"
              tail -40 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN73_B2_WORLD_SOURCE_BOUND_SHADOW_ONLY
