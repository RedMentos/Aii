name: V13 Run117CD operator Sleep backlog progress software
on:
  push:
    branches:
      - assistant/v13-run117cd-sleep-backlog-operator-20261101-hourly11
    paths:
      - .github/workflows/v13-run117cd-sleep-backlog-operator.yml
      - v13/code/v13/sleep_offline.py
      - v13/code/tests/test_run117cd_sleep_backlog_operator.py
permissions:
  contents: read
jobs:
  operator-progress:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned software-only Operator and Sleep regression
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run117cd"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          b3da1220dfcc4e4f5b29e188aec331301b0a503d v13/code/v13/sleep_offline.py
          ec8cad9cb6787e543220408c704985e774696ae4 v13/code/tests/test_run117cd_sleep_backlog_operator.py
          867d06c230ed3860f12cb7d256579c07cb214e91 v13/code/v13/history.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run117cd-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run117cd-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' 'prompt-toolkit==3.0.52' 'psutil==7.0.0' 'PyYAML==6.0.2' 'Pillow==11.3.0' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo SKIPPED > "$e/DEPS_RAW.log"; echo SKIPPED > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout 300s "$py" -m unittest -v tests.test_run117cd_sleep_backlog_operator tests.test_run117cb_sleep_session_fairness tests.test_run117bz_sleep_digest_backlog tests.test_run117ca_sleep_context_consumer tests.test_sleep_digest_view_authority_run278 tests.test_sleep_offline tests.test_sleep_digest_live_lineage_run208 tests.test_context_os) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED > "$e/TEST_RAW.log"; echo SKIPPED > "$e/TEST_EXIT.txt"; fi
          python3 -m py_compile v13/code/v13/history.py v13/code/v13/sleep_offline.py v13/code/tests/test_run117cd_sleep_backlog_operator.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 8197b84546194c8ba5c7a0c6614cada66b6a3a75 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 8197b84546194c8ba5c7a0c6614cada66b6a3a75 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original software raw GREEN or RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117cd-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117cd/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce software-only Operator progress
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117cd"
          for stage in PINS VENV DEPS TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw preserved"
              tail -60 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
          echo RUN117CD_SOFTWARE_ONLY_NO_NATIVE_OR_GATE_PROMOTION
