name: V13 Run373 pinned C3 350M Linux-native AG12 field-confidence diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/run373-c3-pinned-native-solver.yml'
      - 'v13/code/scripts/run373_c3_field_confidence_native.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v13-native-c3-run131-serialized
  cancel-in-progress: false
jobs:
  native-c3:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      NEEDLE_TELEMETRY: '0'
      V13_NO_AUTOSTART: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact source, immutable catalog and host
        id: source
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/RUN373_HEAD.txt"
          sha256sum v13/code/specs/models.json v13/code/v13/runners.py v13/code/v13/agi/solver.py v13/code/scripts/run373_c3_field_confidence_native.py | tee "$RUNNER_TEMP/RUN373_SOURCE_SHA256SUMS.txt"
          python3 -m compileall -q v13/code/scripts/run373_c3_field_confidence_native.py
          { date -u -Iseconds; uname -a; free -h; df -h "$RUNNER_TEMP"; python3 --version; } | tee "$RUNNER_TEMP/RUN373_HOST.txt"
          python3 - <<'PY' | tee "$RUNNER_TEMP/RUN373_CATALOG.txt"
          import json
          j=json.load(open('v13/code/specs/models.json'))
          m=j['models']['language'];r=j['runner']
          assert m['revision']=='657e078c94084481950a2d555a941481f715536b'
          assert m['files'][0]['sha256']=='3d10b6ab8fc91a919534b9558e266255aca0bbc7f6d015963599aa9e74e05b1d'
          assert r['tag']=='b10964'
          assert r['linux_binaries']['linux-x86_64']['sha256']=='9abf88aea48a55d0f80edb1ee20220b186848cca0b4e919d71518cfd7ca67443'
          print('MODEL',m['model_id'],m['revision'],m['license_id'],m['license_url'])
          print('RUNNER',r['tag'],r['source_revision'])
          PY
      - name: Isolated Python dependencies
        id: deps
        run: |
          set -uo pipefail
          set +e
          python3 -m venv "$RUNNER_TEMP/run373venv"
          "$RUNNER_TEMP/run373venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52' 2>&1 | tee "$RUNNER_TEMP/RUN373_DEPS_RAW.log"
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Download exact pinned public GGUF and native runner (no model artifact upload)
        id: artifacts
        run: |
          set -uo pipefail
          set +e
          mkdir -p "$RUNNER_TEMP/run373/native" "$RUNNER_TEMP/run373/home"
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --max-time 600 \
            'https://huggingface.co/LiquidAI/LFM2.5-350M-GGUF/resolve/657e078c94084481950a2d555a941481f715536b/LFM2.5-350M-QAD-Q4_0.gguf' \
            -o "$RUNNER_TEMP/run373/model.gguf" 2>&1 | tee "$RUNNER_TEMP/RUN373_MODEL_DOWNLOAD_RAW.log"
          model_rc=${PIPESTATUS[0]}
          if [ "$model_rc" = 0 ]; then
            test "$(stat -c %s "$RUNNER_TEMP/run373/model.gguf")" = "219312832" || model_rc=2
            echo "3d10b6ab8fc91a919534b9558e266255aca0bbc7f6d015963599aa9e74e05b1d  $RUNNER_TEMP/run373/model.gguf" | sha256sum -c - || model_rc=2
          fi
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --max-time 300 \
            'https://github.com/ggml-org/llama.cpp/releases/download/b10964/llama-b10964-bin-ubuntu-x64.tar.gz' \
            -o "$RUNNER_TEMP/run373/runner.tar.gz" 2>&1 | tee "$RUNNER_TEMP/RUN373_RUNNER_DOWNLOAD_RAW.log"
          runner_rc=${PIPESTATUS[0]}
          if [ "$runner_rc" = 0 ]; then
            test "$(stat -c %s "$RUNNER_TEMP/run373/runner.tar.gz")" = "16825086" || runner_rc=2
            echo "9abf88aea48a55d0f80edb1ee20220b186848cca0b4e919d71518cfd7ca67443  $RUNNER_TEMP/run373/runner.tar.gz" | sha256sum -c - || runner_rc=2
          fi
          if [ "$model_rc" = 0 ] && [ "$runner_rc" = 0 ]; then
            PYTHONPATH=v13/code "$RUNNER_TEMP/run373venv/bin/python" - <<'PY' 2>&1 | tee "$RUNNER_TEMP/RUN373_EXTRACT_RAW.log"
          import os
          from pathlib import Path
          from v13.bootstrap import extract
          base=Path(os.environ['RUNNER_TEMP'])/'run373'
          extract(base/'runner.tar.gz',base/'native')
          found=list((base/'native').rglob('llama-server'))
          assert len(found)==1,found
          target=found[0];target.chmod(0o700)
          (base/'llama-server').symlink_to(target)
          print('NATIVE_BINARY',target)
          PY
            extract_rc=${PIPESTATUS[0]}
          else
            extract_rc=2
          fi
          echo "model_rc=$model_rc" >> "$GITHUB_OUTPUT"
          echo "runner_rc=$runner_rc" >> "$GITHUB_OUTPUT"
          echo "extract_rc=$extract_rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Actual pinned native C3 grammar/plain answer-field diagnostic
        id: native
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          if [ "${{ steps.deps.outputs.rc }}" != 0 ] || [ "${{ steps.artifacts.outputs.model_rc }}" != 0 ] || [ "${{ steps.artifacts.outputs.runner_rc }}" != 0 ] || [ "${{ steps.artifacts.outputs.extract_rc }}" != 0 ]; then
            echo "RUN373_PREREQUISITE_MISSING" | tee "$RUNNER_TEMP/RUN373_NATIVE_RAW.log"
            echo "rc=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          libs="$(find "$RUNNER_TEMP/run373/native" -type f -name '*.so*' -printf '%h\n' | sort -u | paste -sd: -)"
          export LD_LIBRARY_PATH="$libs:${LD_LIBRARY_PATH:-}"
          "$RUNNER_TEMP/run373/llama-server" --version 2>&1 | tee "$RUNNER_TEMP/RUN373_RUNNER_VERSION_RAW.log"
          version_rc=${PIPESTATUS[0]}
          if [ "$version_rc" != 0 ]; then
            echo "rc=$version_rc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          timeout 240s "$RUNNER_TEMP/run373venv/bin/python" -m scripts.run373_c3_native_solver_smoke \
            --home "$RUNNER_TEMP/run373/home" --model "$RUNNER_TEMP/run373/model.gguf" \
            --binary "$RUNNER_TEMP/run373/llama-server" \
            --report "$RUNNER_TEMP/RUN373_NATIVE_REPORT.json" \
            2>&1 | tee "$RUNNER_TEMP/RUN373_NATIVE_RAW.log"
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Official privacy scan
        id: privacy
        run: |
          set -uo pipefail
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree \
            2>&1 | tee "$RUNNER_TEMP/RUN373_PRIVACY_RAW.log"
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Close raw receipt hashes (no model or runner bytes)
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          find . -maxdepth 1 -type f -name 'RUN373_*' ! -name RUN373_SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > RUN373_SHA256SUMS.txt
      - name: Upload raw native evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V13-Run373-PinnedC3Native-Raw-${{ github.sha }}
          path: ${{ runner.temp }}/RUN373_*
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce actual pinned native proof
        if: always()
        run: |
          test "${{ steps.deps.outputs.rc }}" = "0"
          test "${{ steps.artifacts.outputs.model_rc }}" = "0"
          test "${{ steps.artifacts.outputs.runner_rc }}" = "0"
          test "${{ steps.artifacts.outputs.extract_rc }}" = "0"
          test "${{ steps.native.outputs.rc }}" = "0"
          python3 - "$RUNNER_TEMP/RUN373_NATIVE_REPORT.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1]))
          assert report.get('native_plumbing_pass') is True, report.get('status')
          assert report.get('field_confidence_supported') is True, report.get('status')
          assert report.get('supported_count',0) >= 3
          PY
          test "${{ steps.privacy.outputs.rc }}" = "0"
