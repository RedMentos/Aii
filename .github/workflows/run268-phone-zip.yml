name: V13 Run268 verified current Termux phone source ZIP
on:
  pull_request:
    paths:
      - 'v13/code/scripts/verify_phone_zip_current_run268.py'
      - 'v13/code/tests/test_phone_zip_current_run268.py'
      - '.github/workflows/run268-phone-zip.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact head and unchanged Canon
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git hash-object v13/code/v13/runtime.py)" = "a691d27bd0772a4fa1f03d57ec90663237bf6825"
          test -s AGENTS.md
          test -s v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          git rev-parse HEAD | tee "$RUNNER_TEMP/RUN268_SOURCE_HEAD.txt"
      - name: Pinned isolated Python dependencies for original packaging tests
        run: |
          python3 -m venv "$RUNNER_TEMP/run268venv"
          "$RUNNER_TEMP/run268venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt_toolkit==3.0.52'
      - name: Run new ZIP verifier negative controls
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          PYTHONPATH="$PWD:$PWD/tests" "$RUNNER_TEMP/run268venv/bin/python" -m unittest -v test_phone_zip_current_run268 test_package_source 2>&1 | tee "$RUNNER_TEMP/RUN268_TEST.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUNNER_TEMP/RUN268_TEST_EXIT.txt"
          exit 0
      - name: Build and independently verify source-only Termux ZIP
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          if [[ "$(cat "$RUNNER_TEMP/RUN268_TEST_EXIT.txt")" != "0" ]]; then echo 2 > "$RUNNER_TEMP/RUN268_ZIP_EXIT.txt"; exit 0; fi
          "$RUNNER_TEMP/run268venv/bin/python" scripts/package_source.py --root "$PWD" --out "$RUNNER_TEMP/V13-Phone-Run268.zip" --phone-install 2>&1 | tee "$RUNNER_TEMP/RUN268_PACKAGE.log"
          rc=${PIPESTATUS[0]}
          if [[ "$rc" = "0" ]]; then
            "$RUNNER_TEMP/run268venv/bin/python" scripts/verify_phone_zip_current_run268.py --zip "$RUNNER_TEMP/V13-Phone-Run268.zip" --root "$PWD" --out "$RUNNER_TEMP/RUN268_VERIFY.json" 2>&1 | tee "$RUNNER_TEMP/RUN268_VERIFY.log"
            rc=${PIPESTATUS[0]}
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN268_ZIP_EXIT.txt"
          echo "RUN268_ZIP_EXIT=$rc"
          exit 0
      - name: Official public repo privacy scan
        run: python3 v13/code/scripts/public_repo_privacy_scan.py --base 0e522d390e35e7eb24de2c034c1cb16979804df6 --head HEAD --no-worktree
      - name: Upload source-only ZIP and closed raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V13-Run268-Verified-Phone-Source-ZIP
          path: |
            ${{ github.workspace }}/AGENTS.md
            ${{ runner.temp }}/V13-Phone-Run268.zip
            ${{ runner.temp }}/RUN268_SOURCE_HEAD.txt
            ${{ runner.temp }}/RUN268_TEST.log
            ${{ runner.temp }}/RUN268_TEST_EXIT.txt
            ${{ runner.temp }}/RUN268_PACKAGE.log
            ${{ runner.temp }}/RUN268_VERIFY.log
            ${{ runner.temp }}/RUN268_VERIFY.json
            ${{ runner.temp }}/RUN268_ZIP_EXIT.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce true tests and ZIP verification
        run: |
          test "$(cat "$RUNNER_TEMP/RUN268_TEST_EXIT.txt")" = "0"
          test "$(cat "$RUNNER_TEMP/RUN268_ZIP_EXIT.txt")" = "0"
