name: V13 independent Z12c SHADOW calibration RED/GREEN
on:
  push:
    branches:
      - codex/review-z12c-calibration-required-20261027
    paths:
      - '.github/workflows/z12c-calibration-review.yml'
      - 'v13/code/v13/world_jepa_slots.py'
      - 'v13/code/tests/test_world_jepa_slots_calibration_guard.py'
permissions:
  contents: read
concurrency:
  group: v13-z12c-calibration-review
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.sha }}
      - name: Install isolated deps
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/z12creview"
          timeout 240s "$RUNNER_TEMP/z12creview/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Preserve original outputs
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/z12creviewproof"
          git rev-parse HEAD > "$RUNNER_TEMP/z12creviewproof/HEAD.txt"
          sha256sum v13/code/v13/world_jepa_slots.py v13/code/tests/test_world_jepa_slots_calibration_guard.py > "$RUNNER_TEMP/z12creviewproof/SHA256.txt"
          (cd v13/code && PYTHONPATH="$PWD:$PWD/scripts" "$RUNNER_TEMP/z12creview/bin/python" -m unittest -v tests.test_world_jepa_slots_calibration_guard tests.test_world_jepa_slots_checkpoint tests.test_world_jepa_slots tests.test_world_jepa) > "$RUNNER_TEMP/z12creviewproof/UNIT_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/z12creviewproof/UNIT_EXIT.txt"
          "$RUNNER_TEMP/z12creview/bin/python" -m compileall -q v13/code/v13/world_jepa_slots.py v13/code/tests/test_world_jepa_slots_calibration_guard.py > "$RUNNER_TEMP/z12creviewproof/COMPILE_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/z12creviewproof/COMPILE_EXIT.txt"
          "$RUNNER_TEMP/z12creview/bin/python" v13/code/scripts/public_repo_privacy_scan.py --base 74bc1010826db437d3e1ef21fac9c8946986f89b --head HEAD > "$RUNNER_TEMP/z12creviewproof/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/z12creviewproof/PRIVACY_EXIT.txt"
          exit 0
      - name: Upload original raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: z12c-calibration-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/z12creviewproof/
          if-no-files-found: error
      - name: Enforce
        run: |
          set -euo pipefail
          for n in UNIT COMPILE PRIVACY; do
            test "$(cat "$RUNNER_TEMP/z12creviewproof/${n}_EXIT.txt")" = 0 || { cat "$RUNNER_TEMP/z12creviewproof/${n}_RAW.log"; exit 1; }
          done
          tail -18 "$RUNNER_TEMP/z12creviewproof/UNIT_RAW.log"
