name: V13 Run13A original-ZIP route counterfactual source-only
on:
  push:
    branches: [assistant/v13-run13a-route-counterfactual-20261030]
    paths:
      - '.github/workflows/v13-run13a-route-counterfactual.yml'
permissions:
  contents: read
  actions: read
jobs:
  readonly-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Original ZIP hash, pure replay, tests, privacy and closed raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run13a-route-readonly"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          fec4b3d029014b0c90662060892323eb0ab86a09 v13/code/scripts/c2_body_run13a_route_counterfactual_readonly.py
          979323564f1448f4e463660d1f1be7f781d6e85f v13/code/tests/test_run13a_route_counterfactual_readonly.py
          2e2b2516e3947bcc9c81c53736ff257e65205a57 v13/code/docs/C2_BODY_RUN13A_ROUTE_COUNTERFACTUAL_READONLY_PLAN_20261030.md
          ede3b31b32620a680d2f22b0ad744c9237d182b5 v13/code/docs/fixtures/c2_body_fulltask_run13a_seed211_20261030.json
          084fc8039dfae484d26b6ad595e33759acb8a46c v13/code/scripts/c2_body_fulltask_run13a.py
          4b7bb4b4007e550d8bd518cfd568adbd99579d32 v13/code/scripts/c2_body_fulltask_verify_run13a.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run13a-route-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run13a-route-venv/bin/python"
          "$py" -m pip install --no-input --disable-pip-version-check -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts timeout 180s "$py" -m unittest -v tests.test_run13a_route_counterfactual_readonly tests.test_run13a_fulltask_runner tests.test_run13a_fulltask_verify_synthetic) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else
            echo SKIPPED > "$e/TEST_RAW.log"
            echo 99 > "$e/TEST_EXIT.txt"
          fi
          if [ "$(cat "$e/TEST_EXIT.txt")" = 0 ]; then
            gh api -H 'Accept: application/vnd.github+json' /repos/RedMentos/Aii/actions/artifacts/12981938740/zip > "$e/original_native.zip" 2> "$e/DOWNLOAD_RAW.log"
            echo "$?" > "$e/DOWNLOAD_EXIT.txt"
          else
            echo SKIPPED_TEST_RED > "$e/DOWNLOAD_RAW.log"
            echo 99 > "$e/DOWNLOAD_EXIT.txt"
          fi
          if [ "$(cat "$e/DOWNLOAD_EXIT.txt")" = 0 ]; then
            echo '52b1e6c8209dba364f41a157496cccfd9d59590e84e79139879ad87e5f576a6f  '"$e/original_native.zip" | sha256sum -c - > "$e/ZIP_HASH_RAW.log" 2>&1
            echo "$?" > "$e/ZIP_HASH_EXIT.txt"
          else
            echo SKIPPED_DOWNLOAD_RED > "$e/ZIP_HASH_RAW.log"
            echo 99 > "$e/ZIP_HASH_EXIT.txt"
          fi
          if [ "$(cat "$e/ZIP_HASH_EXIT.txt")" = 0 ]; then
            env PYTHONPATH=v13/code "$py" v13/code/scripts/c2_body_run13a_route_counterfactual_readonly.py --zip "$e/original_native.zip" > "$e/REPORT_RAW.json" 2> "$e/REPORT_RAW.log"
            echo "$?" > "$e/REPORT_EXIT.txt"
          else
            echo SKIPPED_ZIP_HASH_RED > "$e/REPORT_RAW.log"
            echo 99 > "$e/REPORT_EXIT.txt"
          fi
          "$py" -m py_compile v13/code/scripts/c2_body_run13a_route_counterfactual_readonly.py v13/code/tests/test_run13a_route_counterfactual_readonly.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 5ba394d08ab9494d77f0b406b74ea931532b0388 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 5ba394d08ab9494d77f0b406b74ea931532b0388 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original ZIP and complete raw even if RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run13a-route-readonly-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run13a-route-readonly/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce exact source-only diagnostic with no gate promotion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run13a-route-readonly"
          for stage in PINS VENV DEPS TEST DOWNLOAD ZIP_HASH REPORT COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "${stage} RED; original raw preserved; no gate"
              tail -60 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN13A_ROUTE_POSTHOC_EXACT_ZIP_SOURCE_ONLY_GREEN_NOT_A_GATE
