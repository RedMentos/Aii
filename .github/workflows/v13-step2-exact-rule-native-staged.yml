name: V13 STAGED exact-rule C3 matched Linux native (manual gate only)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v13-step2-native-serial-rule-transport
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Frozen sources, original Run116 raw, resources, serial C3 and closed evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          e="$RUNNER_TEMP/v13-exact-rule-native"
          work="$RUNNER_TEMP/v13-exact-rule-native-work"
          mkdir -p "$e/original" "$work"
          git rev-parse HEAD > "$e/HEAD.txt"
          source_ok=0
          check() {
            observed="$(git hash-object "$2" 2>/dev/null)" || return 1
            printf '%s %s\n' "$observed" "$2" >> "$e/SOURCE_RAW.log"
            [ "$observed" = "$1" ]
          }
          check f98caa025a8ba28e8ecdb5d3f29660937913ffed v13/code/docs/proofs/continuation-20261029/STEP2_RULE_TRANSPORT_NATIVE_EXECUTOR_PREREG.md || source_ok=1
          check 69bbcb22f448c258bf147dfabf181a9909c90207 v13/code/docs/proofs/continuation-20261029/STEP2_RULE_TRANSPORT_BRANCH_BUILD_STATE.json || source_ok=1
          check 9b43ce0721213775ef7067169ec4bd6f0b1e0f0e v13/code/scripts/step2_exact_rule_transport_native.py || source_ok=1
          check 4c233aaade91e55d00fa152c934de0e03e26d58f v13/code/scripts/step2_exact_rule_transport_verify.py || source_ok=1
          check c6ae8c8f7447cede21caebddda81de1f5beae034 v13/code/tests/test_step2_exact_rule_transport_verify.py || source_ok=1
          check b2c5679ffff632f4c1ebdd0bc673b474ea092530 v13/code/docs/proofs/continuation-20261029/STEP2_NATIVE_VERIFY_ADMISSION_PREREG.md || source_ok=1
          check a4d28951e80ca034d752f4d030d4196ec4f70904 v13/code/tests/test_step2_exact_rule_transport_native.py || source_ok=1
          check b7044736bb0ffec0b577c7720169257f3970f9e8 v13/code/docs/proofs/continuation-20261029/STEP2_EXACT_RULE_NATIVE_REPLAY_PREREG.md || source_ok=1
          check 58e0aceea1b99e1fc770296902bdb641608e6cc3 v13/code/scripts/step2_exact_rule_native_replay_preflight.py || source_ok=1
          check 454d7bff84f074338364facbe6afd9e26209484e v13/code/tests/test_step2_exact_rule_native_replay_preflight.py || source_ok=1
          check 4065d3453eefcbd35c2de502d1c3c219bf20c63a v13/code/scripts/step2_rule_revision_ambiguity_candidate.py || source_ok=1
          check 6068849a19f53ad1bdbd200739b95731f8a1fb20 v13/code/scripts/run118_step2_rule_pointer_choice_candidate.py || source_ok=1
          check 959cc898e2fd6386d999443b914a5b7c6701386d v13/code/scripts/run117_step2_rule_source_candidate.py || source_ok=1
          check 468d2bc72a5584fc6e5c67292968feb3a4125c07 v13/code/scripts/run111_step2_fresh_native_preflight.py || source_ok=1
          check 6cc3d52524e8c9122710eae2a908d024f0f44f24 v13/code/scripts/run109_step2_fresh_fixtures.py || source_ok=1
          check e8d8c87de2474a764e4bbc28b4fe028413a316e1 v13/code/scripts/step2_tool_replay.py || source_ok=1
          check 7253b113b43de110059575cc14ef7b2ce7bccc43 v13/code/scripts/step2_longnote_tp27_native_pilot.py || source_ok=1
          check e1f1a2d09a614378a75e397819fdce96a46de22d v13/code/v13/agi/eligibility.py || source_ok=1
          check 7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json || source_ok=1
          check 218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md || source_ok=1
          echo "$source_ok" > "$e/SOURCE_EXIT.txt"
          # Native dispatch must not bypass exact-head software GREEN + separate raw audit.
          # No receipt is committed yet: missing audit always blocks inference.
          gh run view 40812183190 --json headSha,status,conclusion > "$e/ADMISSION_RUN_RAW.json" 2> "$e/ADMISSION_QUERY_RAW.log"
          echo "$?" > "$e/ADMISSION_QUERY_EXIT.txt"
          python3 - "$e/ADMISSION_RUN_RAW.json" "v13/code/docs/proofs/continuation-20261029/STEP2_RUN126_EXACT_HEAD_SOFTWARE_INDEPENDENT_AUDIT.json" "v13/code/docs/proofs/continuation-20261029/STEP2_RUN126_NATIVE_OWNER_RELEASE.json" > "$e/ADMISSION_RAW.log" 2>&1 <<'PY'
          import json,sys
          from pathlib import Path
          run=Path(sys.argv[1]);proof=Path(sys.argv[2]);owner=Path(sys.argv[3])
          assert run.is_file(), 'EXACT_HEAD_CI_QUERY_MISSING'
          r=json.loads(run.read_text())
          assert r.get('headSha')=='7f25f3b0d0d8b7167817420240d0475f57f0a538', 'EXACT_HEAD_MISMATCH'
          assert r.get('status')=='completed' and r.get('conclusion')=='success', 'EXACT_HEAD_CI_NOT_GREEN'
          assert proof.is_file(), 'INDEPENDENT_ORIGINAL_RAW_AUDIT_MISSING_NO_NATIVE'
          a=json.loads(proof.read_text())
          assert a.get('schema')=='v13.step2.run126.exact_head_software_independent_audit.v1'
          assert a.get('run_id')==40812183190 and a.get('head_sha')==r['headSha']
          assert a.get('status')=='GREEN_INDEPENDENT_RAW'
          assert a.get('crc_clean') is True and a.get('all_inner_sha256_verified') is True
          assert a.get('software_only') is True and a.get('native_calls')==0
          assert isinstance(a.get('original_zip_sha256'),str) and len(a['original_zip_sha256'])==64
          assert owner.is_file(), 'NATIVE_OWNER_RELEASE_MISSING_NO_NATIVE'
          o=json.loads(owner.read_text())
          assert o.get('schema')=='v13.step2.run126.native_owner_release.v1'
          assert o.get('run_id')==40812183190 and o.get('software_zip_sha256')==a['original_zip_sha256']
          assert o.get('native_owner_idle_verified') is True
          assert o.get('resource_admission_approved') is True
          print('EXACT_HEAD_RAW_AUDIT_AND_NATIVE_OWNER_RELEASE_ADMITTED')
          PY
          echo "$?" > "$e/ADMISSION_EXIT.txt"
          python3 - "$e" > "$e/RESOURCE_RAW.log" 2>&1 <<'PY'
          import json,platform,shutil,sys
          from pathlib import Path
          root=Path(sys.argv[1]);info={}
          for line in Path('/proc/meminfo').read_text().splitlines():
              if line.startswith(('MemTotal:', 'MemAvailable:')):
                  k,v,*_=line.split();info[k.rstrip(':')]=int(v)*1024
          for key in ('memory.max','memory.current'):
              p=Path('/sys/fs/cgroup')/key
              info['cgroup_'+key]=p.read_text().strip() if p.exists() else 'UNAVAILABLE'
          info['platform']=platform.platform()
          info['machine']=platform.machine()
          info['disk_free_bytes']=shutil.disk_usage(str(root)).free
          info['mem_available_bytes']=info.get('MemAvailable',0)
          print(json.dumps(info,sort_keys=True))
          if platform.system()!='Linux' or platform.machine()!='x86_64':
              raise SystemExit(2)
          if info['mem_available_bytes']<2500000000 or info['disk_free_bytes']<5000000000:
              raise SystemExit(3)
          PY
          echo "$?" > "$e/RESOURCE_EXIT.txt"
          gh run download 40805361392 -n run116-sixfixture-cqp20-native-40805361392-4a6473afbe7404be5cf74f24d20a47d2d99fd0f6 -D "$e/original" > "$e/DOWNLOAD_RAW.log" 2>&1
          echo "$?" > "$e/DOWNLOAD_EXIT.txt"
          python3 - "$e/original" > "$e/ORIGINAL_VERIFY_RAW.log" 2>&1 <<'PY'
          from pathlib import Path
          import hashlib,sys
          d=Path(sys.argv[1]);b=(d/'STEP2_RAW.json').read_bytes()
          assert hashlib.sha256(b).hexdigest()=='c0cd539ec28f9583abe25c93f48871597df6758c442782eb6fedd56ad612105f'
          lines=(d/'SHA256SUMS.txt').read_text().splitlines();assert len(lines)==29
          for line in lines:
              h,p=line.split('  ',1)
              assert hashlib.sha256((d/p.removeprefix('./')).read_bytes()).hexdigest()==h,p
          print('ORIGINAL_RUN116_29_OF_29_HASHES_AND_SOURCE_SHA256_OK')
          PY
          echo "$?" > "$e/ORIGINAL_VERIFY_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-rule-native-venv"
          py="$RUNNER_TEMP/v13-rule-native-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          echo "$?" > "$e/INSTALL_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/step2_exact_rule_transport_native.py v13/code/tests/test_step2_exact_rule_transport_native.py v13/code/scripts/step2_exact_rule_native_replay_preflight.py v13/code/scripts/step2_exact_rule_transport_verify.py v13/code/tests/test_step2_exact_rule_transport_verify.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$source_ok" = 0 ] && [ "$(cat "$e/DOWNLOAD_EXIT.txt")" = 0 ] && [ "$(cat "$e/ORIGINAL_VERIFY_EXIT.txt")" = 0 ] && [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ] && [ "$(cat "$e/COMPILE_EXIT.txt")" = 0 ]; then
            (cd v13/code && V13_RUN116_SOURCE_REPORT="$e/original/STEP2_RAW.json" timeout --signal=TERM --kill-after=5s 180s "$py" -m unittest -v tests.test_step2_exact_rule_transport_native tests.test_step2_exact_rule_transport_verify tests.test_step2_exact_rule_native_replay_preflight tests.test_step2_rule_revision_ambiguity_candidate) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
            (cd v13/code && timeout --signal=TERM --kill-after=5s 180s "$py" -m scripts.step2_exact_rule_native_replay_preflight --source-report "$e/original/STEP2_RAW.json" --out "$work/pairs.json") > "$e/PREFLIGHT_RAW.log" 2>&1
            echo "$?" > "$e/PREFLIGHT_EXIT.txt"
          else
            for n in FOCUSED PREFLIGHT; do echo SKIPPED_PREREQ_RED > "$e/${n}_RAW.log"; echo SKIPPED_RED > "$e/${n}_EXIT.txt"; done
          fi
          export V13_HOME="$RUNNER_TEMP/v13-exact-rule-native-installed"
          if [ "$(cat "$e/ADMISSION_EXIT.txt")" = 0 ] && [ "$(cat "$e/RESOURCE_EXIT.txt")" = 0 ] && [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ] && [ "$(cat "$e/PREFLIGHT_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=15s 20m env PYTHONPATH=v13/code "$py" -m v13.bootstrap --home "$V13_HOME" > "$e/BOOTSTRAP_RAW.log" 2>&1
            echo "$?" > "$e/BOOTSTRAP_EXIT.txt"
          else
            echo SKIPPED_PREREQ_RED > "$e/BOOTSTRAP_RAW.log"; echo SKIPPED_RED > "$e/BOOTSTRAP_EXIT.txt"
          fi
          if [ "$(cat "$e/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=20s 45m env PYTHONPATH=v13/code:v13/code/tests "$py" -m scripts.step2_exact_rule_transport_native --installed-home "$V13_HOME" --source-report "$e/original/STEP2_RAW.json" --preflight-report "$work/pairs.json" --evidence-dir "$work/evidence" > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else
            echo SKIPPED_BOOTSTRAP_RED > "$e/NATIVE_RAW.log"; echo SKIPPED_RED > "$e/NATIVE_EXIT.txt"
          fi
          for f in RECEIPT.json NATIVE_ROWS.json; do
            if [ -f "$work/evidence/$f" ]; then cp "$work/evidence/$f" "$e/$f"; fi
          done
          if [ "$(cat "$e/NATIVE_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 240s env PYTHONPATH=.:tests "$py" -m scripts.step2_exact_rule_transport_verify --source-report "$e/original/STEP2_RAW.json" --preflight-report "$work/pairs.json" --native-rows "$e/NATIVE_ROWS.json" --receipt "$e/RECEIPT.json") > "$e/VERIFY_RAW.log" 2>&1
            echo "$?" > "$e/VERIFY_EXIT.txt"
          else
            echo SKIPPED_NATIVE_RED > "$e/VERIFY_RAW.log"; echo SKIPPED_RED > "$e/VERIFY_EXIT.txt"
          fi
          "$py" -m pip install --disable-pip-version-check --no-input 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu > "$e/FULL_INSTALL_RAW.log" 2>&1
          first="$?"
          if [ "$first" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input 'transformers==5.20.2' 'peft==0.21.2' >> "$e/FULL_INSTALL_RAW.log" 2>&1
            second="$?"
          else
            second=1
          fi
          if [ "$first" = 0 ] && [ "$second" = 0 ]; then echo 0 > "$e/FULL_INSTALL_EXIT.txt"; else echo 1 > "$e/FULL_INSTALL_EXIT.txt"; fi
          if [ "$(cat "$e/FULL_INSTALL_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=10s 18m "$py" -m unittest discover -s tests -p 'test_*.py') > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else
            echo SKIPPED_DEPS_RED > "$e/FULL_RAW.log"; echo SKIPPED_RED > "$e/FULL_EXIT.txt"
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 8d3e9e4ef87b9b47fa03ff12628ea63bdcd71cb1 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 8d3e9e4ef87b9b47fa03ff12628ea63bdcd71cb1 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - name: Preserve original native raw including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: step2-exact-rule-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-exact-rule-native/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce scoped native acceptance without canonical promotion
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-exact-rule-native"
          for n in SOURCE ADMISSION RESOURCE DOWNLOAD ORIGINAL_VERIFY INSTALL COMPILE FOCUSED PREFLIGHT BOOTSTRAP NATIVE VERIFY FULL_INSTALL FULL PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; original raw retained; STEP2 remains UTILITY_FAIL"
              tail -40 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo EXACT_RULE_NATIVE_SCOPED_ONLY_NO_CANON_GATE_PROMOTION
