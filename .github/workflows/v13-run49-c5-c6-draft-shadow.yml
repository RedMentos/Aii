name: V13 Run49 seed431 C5 C6 draft source-bound SQLite SHADOW
on:
  push:
    branches: [assistant/v13-run49-c5-c6-draft-source-shadow-20261031-hourly11]
    paths: ['.github/workflows/v13-run49-c5-c6-draft-shadow.yml']
permissions:
  contents: read
jobs:
  c5-c6-draft-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned fixture, prereg, real Store C5 C6 DRAFT source integrity and races
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run49-draft"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          94e95f0b797dd0613a8838f989872beff0cc5ebf v13/code/docs/fixtures/run49_c5_c6_draft_shadow_seed431.json
          2f2b81547886d5dca5ba11b8714642d26ec346a3 v13/code/docs/RUN49_C5_C6_DRAFT_SHADOW_PREREG_20261031.md
          075e563cec10e08b3f285ad138ee5d955de10bf0 v13/code/v13/agi/jef_c3_c5_c6_draft_shadow_run49.py
          ebb825b83dcb036305b9127635762a79564c3b8f v13/code/tests/test_run49_c5_c6_draft_shadow.py
          a7352d3b577b17db92d2fc31650bfcd914b53e02 v13/code/v13/agi/jef_c3_final_agreement_shadow_run48.py
          d1186642d5f4b7ef4af0699f07a2fe682b1484e2 v13/code/v13/agi/jef_eligibility_source_shadow_run46b.py
          0779d986fb8aee8aa01c5df5f656889d4bd56348 v13/code/v13/store.py
          6b0e64765e6dff8c7fec5ffaf56ed5c10b9b9300 v13/code/v13/transaction.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          sha256sum v13/code/docs/fixtures/run49_c5_c6_draft_shadow_seed431.json > "$e/FIXTURE_RAW.log" 2>&1
          test "$(cut -d' ' -f1 "$e/FIXTURE_RAW.log")" = dd7f99895ebb3c425cfa86d9c3dfc18fde0e55a5303ed226aed4c4b9644c02ee
          echo "$?" > "$e/FIXTURE_EXIT.txt"
          if [ "$bad" = 0 ] && [ "$(cat "$e/FIXTURE_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:tests:scripts python3 -m unittest -v tests.test_run49_c5_c6_draft_shadow tests.test_run48_jef_c3_final_agreement_shadow tests.test_run46b_jef_source_eligibility_shadow) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PINS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          python3 -m py_compile v13/code/v13/agi/jef_c3_c5_c6_draft_shadow_run49.py v13/code/tests/test_run49_c5_c6_draft_shadow.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base a3440e441011f630ec0cf1d1ba23a08dad3bd661 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check a3440e441011f630ec0cf1d1ba23a08dad3bd661 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run49-draft-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run49-draft/
          retention-days: 90
          if-no-files-found: error
      - name: Require all six stages zero
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run49-draft"
          for s in PINS FIXTURE TEST COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN49_C5_C6_DRAFT_SHADOW_ONLY_NO_OUTPUT_COMMIT_OR_AGE_PROMOTION
