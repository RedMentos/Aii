name: V13 Run591 Callosum human rating source proof
on:
  push:
    branches:
      - codex/automation11-run591-callosum-rating-proof-20261026
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/run591-callosum-rating-proof.yml'
      - 'v13/code/v13/callosum.py'
      - 'v13/code/tests/test_run591_callosum_rating_proof.py'
      - 'v13/code/docs/proofs/continuation-20261026/run591-callosum-rating-proof/**'
permissions:
  contents: read
jobs:
  callosum-rating-proof:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.ref == 'codex/automation11-run591-callosum-rating-proof-20261026' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install isolated model-free test dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'prompt_toolkit==3.0.52'
      - name: Execute source-bound rating and existing B3 channel tests
        shell: bash
        run: |
          mkdir -p run591-raw
          git rev-parse HEAD > run591-raw/source_head.txt
          sha256sum v13/code/v13/callosum.py v13/code/tests/test_run591_callosum_rating_proof.py v13/code/docs/proofs/continuation-20261026/run591-callosum-rating-proof/PREREG.md > run591-raw/source_sha256.txt
          set +e
          (cd v13/code && python -m unittest discover -s tests -p test_run591_callosum_rating_proof.py -v) > run591-raw/new-tests.log 2>&1
          echo "$?" > run591-raw/new-tests.exit
          (cd v13/code && python -m unittest discover -s tests -p test_callosum.py -v && python -m unittest discover -s tests -p test_callosum_outcome_once.py -v && python -m unittest discover -s tests -p test_callosum_message_lineage_run98.py -v && python -m unittest discover -s tests -p test_callosum_observed_cost_run206.py -v && python -m unittest discover -s tests -p test_callosum_peer_link_run99.py -v) > run591-raw/regressions.log 2>&1
          echo "$?" > run591-raw/regressions.exit
          python -m compileall -q v13/code/v13/callosum.py v13/code/tests/test_run591_callosum_rating_proof.py > run591-raw/compile.log 2>&1
          echo "$?" > run591-raw/compile.exit
          python v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha || '56c693de986a5d5e77fe0cc737bd6c210f32afd6' }}" --head "${{ github.event.pull_request.head.sha || github.sha }}" --no-worktree > run591-raw/privacy.log 2>&1
          echo "$?" > run591-raw/privacy.exit
          set -e
          cat run591-raw/new-tests.log
          cat run591-raw/regressions.log
          cat run591-raw/privacy.log
      - name: Close SHA manifest even on failure
        if: always()
        shell: bash
        run: |
          mkdir -p run591-raw
          (cd run591-raw && sha256sum *.txt *.log *.exit > RAW_SHA256SUMS.txt)
          cat run591-raw/RAW_SHA256SUMS.txt
      - name: Preserve raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run591-callosum-rating-proof-raw
          path: run591-raw/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce tests and privacy
        shell: bash
        run: |
          test "$(cat run591-raw/new-tests.exit)" = 0
          test "$(cat run591-raw/regressions.exit)" = 0
          test "$(cat run591-raw/compile.exit)" = 0
          test "$(cat run591-raw/privacy.exit)" = 0
