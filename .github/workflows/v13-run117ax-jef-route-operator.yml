name: V13 Run117AX optional JEF C2 route C5 C6 operator software
on:
  push:
    branches:
      - assistant/v13-run117ax-jef-route-operator-cli-20261031-gpt6
    paths:
      - .github/workflows/v13-run117ax-jef-route-operator.yml
      - v13/code/scripts/jef_c3_c5_c6_operator_cli.py
      - v13/code/tests/test_run117ax_jef_route_operator_cli.py
permissions:
  contents: read
jobs:
  jef-c2-c3-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Test source-bound JEF C2 advisory and unchanged C3 operator guards
        shell: bash
        run: |
          set +e
          set -uo pipefail
          e="$RUNNER_TEMP/v13-run117ax"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run117ax-venv" > "$e/VENV_RAW.log" 2>&1
          venv_rc=$?
          py="$RUNNER_TEMP/v13-run117ax-venv/bin/python"
          if test "$venv_rc" -eq 0; then
            "$py" -m pip install --disable-pip-version-check --no-input -q \
              'numpy==2.2.6' 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            deps_rc=$?
          else
            deps_rc=125;echo VENV_RED > "$e/DEPS_RAW.log"
          fi
          if test "$deps_rc" -eq 0; then
            (cd v13/code && env PYTHONPATH=.:tests:scripts "$py" -m unittest -v \
              tests.test_run117ax_jef_route_operator_cli \
              tests.test_run117aw_jef_c2_c3_formatter_route_shadow \
              tests.test_c2_monotone_route_shadow \
              tests.test_jef_c3_c5_c6_operator_cli) > "$e/TEST_RAW.log" 2>&1
            test_rc=$?
          else
            test_rc=125;echo PREREQUISITE_RED > "$e/TEST_RAW.log"
          fi
          python3 -m compileall -q \
            v13/code/scripts/jef_c3_c5_c6_operator_cli.py \
            v13/code/tests/test_run117ax_jef_route_operator_cli.py > "$e/COMPILE_RAW.log" 2>&1
          compile_rc=$?
          python3 v13/code/scripts/public_repo_privacy_scan.py \
            --base 278bfa3be280f96fd559985d1eebd05e96a1b887 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          privacy_rc=$?
          git diff --check 278bfa3be280f96fd559985d1eebd05e96a1b887 HEAD > "$e/DIFF_RAW.log" 2>&1
          diff_rc=$?
          for x in "VENV:$venv_rc" "DEPS:$deps_rc" "TEST:$test_rc" "COMPILE:$compile_rc" "PRIVACY:$privacy_rc" "DIFF:$diff_rc"; do
            echo "${x#*:}" > "$e/${x%%:*}_EXIT.txt"
          done
          "$py" - "$e" <<'PY' > "$e/RESULT_RAW.log"
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1]);names=('VENV','DEPS','TEST','COMPILE','PRIVACY','DIFF')
          r={'schema':'v13.run117ax.jef_route_operator_software_receipt.v1',
             'head':(e/'HEAD.txt').read_text().strip(),
             'exits':{n:int((e/(n+'_EXIT.txt')).read_text()) for n in names},
             'native_c2_calls':0,'native_c3_calls':0,'native_body_calls':0,
             'step2_promoted':False,'b3_promoted':False,'jepa_weight':0,
             'redmi_measured':False,'whole_system_complete':False}
          (e/'RESULT.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat "$e/RESULT_RAW.log"
          tail -n 35 "$e/TEST_RAW.log"
          for rc in "$venv_rc" "$deps_rc" "$test_rc" "$compile_rc" "$privacy_rc" "$diff_rc"; do test "$rc" -eq 0 || exit 2; done
      - name: Preserve original software RED or GREEN
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117ax-jef-c2-c3-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117ax/
          if-no-files-found: warn
          retention-days: 90
