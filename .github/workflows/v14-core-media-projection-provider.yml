name: V14 Core one-shot MediaProjection provider (current capability stack)

on:
  push:
    branches:
      - core/v14-media-projection-provider-current-base-20261123
    paths:
      - "android-companion/**"
      - "v13/code/v13/android_companion_transport.py"
      - "v13/code/v13/android_companion_ui_frames.py"
      - "v13/code/tests/test_android_companion_ui_frames.py"
      - "v13/code/tests/test_android_companion_transport_frames.py"
      - ".github/workflows/v14-core-media-projection-provider.yml"
  pull_request:
    branches:
      - core/v14-capability-registry-mediaprojection-20261123
    paths:
      - "android-companion/**"
      - "v13/code/v13/android_companion_transport.py"
      - "v13/code/v13/android_companion_ui_frames.py"
      - "v13/code/tests/test_android_companion_ui_frames.py"
      - "v13/code/tests/test_android_companion_transport_frames.py"
      - ".github/workflows/v14-core-media-projection-provider.yml"

permissions:
  contents: read

jobs:
  python-frame-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile provider modules
        run: |
          python -m py_compile \
            v13/code/v13/android_companion_transport.py \
            v13/code/v13/android_companion_ui_frames.py
      - name: Test signed frame receipt, bounded transport and companion regressions
        env:
          PYTHONPATH: v13/code
        run: |
          python -m pytest -q \
            v13/code/tests/test_android_companion_ui_frames.py \
            v13/code/tests/test_android_companion_transport_frames.py \
            v13/code/tests/test_android_companion_runtime.py \
            v13/code/tests/test_android_companion_transport.py \
            v13/code/tests/test_android_companion_ecdsa.py \
            v13/code/tests/test_android_control.py \
            v13/code/tests/test_android_outcomes.py \
            v13/code/tests/test_android_companion_protocol.py \
            v13/code/tests/test_android_companion_outcome_adapter.py

  android-companion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Assemble companion and run native unit tests
        run: |
          gradle --no-daemon -p android-companion \
            :app:assembleDebug :app:testDebugUnitTest
