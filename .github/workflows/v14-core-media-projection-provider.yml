name: V14 Core one-shot MediaProjection provider

on:
  push:
    branches:
      - core/v14-media-projection-frame-provider-20261122
    paths:
      - "android-companion/**"
      - "v13/code/v13/android_companion_transport.py"
      - "v13/code/v13/android_companion_ui_frames.py"
      - "v13/code/tests/test_android_companion_ui_frames.py"
      - "v13/code/tests/test_android_companion_transport_frames.py"
      - ".github/workflows/v14-core-media-projection-provider.yml"
  pull_request:
    branches:
      - qa/v14-companion-final-qa-20261122
    paths:
      - "android-companion/**"
      - "v13/code/v13/android_companion_transport.py"
      - "v13/code/v13/android_companion_ui_frames.py"
      - "v13/code/tests/test_android_companion_ui_frames.py"
      - "v13/code/tests/test_android_companion_transport_frames.py"
      - ".github/workflows/v14-core-media-projection-provider.yml"

permissions:
  contents: read

jobs:
  python-frame-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile provider modules
        run: |
          python -m py_compile \
            v13/code/v13/android_companion_transport.py \
            v13/code/v13/android_companion_ui_frames.py
      - name: Test signed frame receipt and bounded transport
        env:
          PYTHONPATH: v13/code
        run: |
          python -m pytest -q \
            v13/code/tests/test_android_companion_ui_frames.py \
            v13/code/tests/test_android_companion_transport_frames.py

  android-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Build and run companion unit tests
        run: |
          gradle --no-daemon -p android-companion \
            :app:assembleDebug :app:testDebugUnitTest
