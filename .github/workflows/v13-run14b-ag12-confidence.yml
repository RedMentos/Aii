name: V13 Run14B AG12 finite solver confidence admission
on:
  push:
    branches: [assistant/v13-run14b-ag12-nonfinite-eval-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run14b-ag12-confidence.yml'
      - 'v13/code/v13/agi/generality.py'
      - 'v13/code/tests/test_ag12_nonfinite_solver_run14b.py'
permissions:
  contents: read
jobs:
  ag12-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve original test-first AG12 evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run14b-ag12"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          dec1b1555750cf19685a88ba89e09270acc8b868 v13/code/v13/agi/generality.py
          ad1b97ef3ce9e136fd78e4795544d9985697fb39 v13/code/tests/test_ag12_nonfinite_solver_run14b.py
          523ca73b6e86d5f2b69f76432312443d9b65a014 v13/code/docs/RUN14B_AG12_SOLVER_CONFIDENCE_PREREG_20261030.md
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=. python3 -m unittest -v tests.test_ag12_nonfinite_solver_run14b tests.test_growth.G12Eval) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m py_compile v13/code/v13/agi/generality.py v13/code/tests/test_ag12_nonfinite_solver_run14b.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 7e7d57e1db88642f4fcd447eda2c012c1e625bfb --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 7e7d57e1db88642f4fcd447eda2c012c1e625bfb HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original AG12 raw even on RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run14b-ag12-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run14b-ag12/
          if-no-files-found: error
          retention-days: 30
      - name: Explicit scoped verdict
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run14b-ag12"
          for stage in PINS TEST COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            test "$(cat "$e/${stage}_EXIT.txt")" = 0
          done
