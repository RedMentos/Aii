name: V13 Run11Y source-bound JEF budget SHADOW software
on:
  push:
    branches: [assistant/v13-run11y-jef-budget-source-shadow-20261030]
    paths:
      - '.github/workflows/v13-run11y-jef-budget-source-shadow.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      NEEDLE_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Source-only Store-bound shadow and fail-closed tests
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run11y"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          2f4772ca669bf938279886c64fd4a71f601c1b79 v13/code/docs/JEF_BUDGET_SOURCE_SHADOW_PREREG_RUN11Y_20261030.md
          cc8188590379a1519219028940c4c96e95a7d6db v13/code/v13/agi/budget_en_source_shadow.py
          ac21a1d33c18081d0e73ebaed4c87ec5ad9b1d89 v13/code/tests/test_budget_en_source_shadow_run11y.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run11y-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run11y-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo SKIPPED > "$e/DEPS_RAW.log"; echo SKIPPED > "$e/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_budget_en_source_shadow_run11y) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED > "$e/TEST_RAW.log"; echo SKIPPED > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/v13/agi/budget_en_source_shadow.py v13/code/tests/test_budget_en_source_shadow_run11y.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base adb828fe3a1a0a5f6f7fce284bcb5f4bbab4af4f --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check adb828fe3a1a0a5f6f7fce284bcb5f4bbab4af4f HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original software RED or GREEN evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run11y-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run11y/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce software-only no-promotion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run11y"
          for stage in PINS VENV DEPS TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; preserve original raw and no gate promotion"
              tail -70 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'RUN11Y_STORE_SHADOW_SOFTWARE_ONLY_NO_NATIVE_OR_STEP2_GATE'
