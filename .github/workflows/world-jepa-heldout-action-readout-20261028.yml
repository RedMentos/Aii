name: V13 World-JEPA heldout action fixed readout software review
on:
  push:
    branches: [assistant/v13-world-jepa-heldout-action-readout-20261028]
    paths:
      - '.github/workflows/world-jepa-heldout-action-readout-20261028.yml'
      - 'v13/code/scripts/world_jepa_heldout_action_readout_20261028.py'
      - 'v13/code/tests/test_world_jepa_heldout_action_readout_20261028.py'
permissions:
  contents: read
concurrency:
  group: v13-world-jepa-heldout-action-20261028
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run isolated NumPy tests and fixed 400-step synthetic ablation
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/world-jepa-heldout-action"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/scripts/world_jepa_heldout_action_readout_20261028.py > "$e/SOURCE_BLOB.txt"
          python3 -m venv "$RUNNER_TEMP/world-jepa-venv"
          py="$RUNNER_TEMP/world-jepa-venv/bin/python"
          "$py" -m pip install --no-input -q numpy==2.2.6 > "$e/INSTALL_RAW.log" 2>&1
          echo "$?" > "$e/INSTALL_EXIT.txt"
          if [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_world_jepa_heldout_action_readout_20261028 tests.test_world_jepa_action_permutation_control) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
            (cd v13/code && timeout --signal=TERM --kill-after=5s 8m env PYTHONPATH=.:tests "$py" -m scripts.world_jepa_heldout_action_readout_20261028 --synthetic-smoke --steps 400) > "$e/RESEARCH_RAW.json" 2> "$e/RESEARCH_STDERR.log"
            echo "$?" > "$e/RESEARCH_EXIT.txt"
          else
            echo SKIPPED_INSTALL_RED > "$e/FOCUSED_EXIT.txt"
            echo SKIPPED_INSTALL_RED > "$e/RESEARCH_EXIT.txt"
          fi
          "$py" - "$e/RESEARCH_RAW.json" > "$e/REPORT_CHECK_RAW.log" 2>&1 <<'PY'
          import json, pathlib, sys
          j=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert j['scope']=='WORLD_JEPA_FIXED_READOUT_HELDOUT_ACTION_ABLATION'
          assert j['steps']==400 and j['seeds']==[3,7]
          assert j['readout_frozen_for_heldout_controls']
          assert j['heldout_row_marginals_preserved']
          assert j['heldout_row_mismatch_changed_fraction']>0
          assert not j['runtime_wired'] and not j['utility_proven']
          assert j['negative_gates_unchanged']['jepa_weight']==0
          assert len(j['per_seed'])==2
          print('SYNTHETIC_WORLD_JEPA_FIXED_READOUT_ONLY_NO_GATE_PROMOTION')
          PY
          echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/world_jepa_heldout_action_readout_20261028.py v13/code/tests/test_world_jepa_heldout_action_readout_20261028.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 0cc5e59fc1c91a71b0b232b42f70668c562d9d2b --head HEAD > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 0cc5e59fc1c91a71b0b232b42f70668c562d9d2b HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && sha256sum * > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-world-jepa-heldout-action-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/world-jepa-heldout-action/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce raw exits
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/world-jepa-heldout-action"
          for name in INSTALL FOCUSED RESEARCH REPORT_CHECK COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${name}_EXIT.txt")" != 0 ]; then
              echo "$name RED; raw evidence retained"
              tail -45 "$e/${name}_RAW.log" 2>/dev/null || tail -45 "$e/RESEARCH_STDERR.log" || true
              exit 1
            fi
          done
          echo 'WORLD_JEPA_DIGITAL_SHADOW_ONLY_NO_GATE_PROMOTION'
