name: V13 JEF C3 schema DRAFT default-OFF software review
on:
  push:
    branches: [assistant/v13-jef-c3-schema-draft-guard-20261031-run11]
    paths: ['.github/workflows/v13-jef-c3-schema-draft-software.yml']
permissions:
  contents: read
concurrency:
  group: v13-jef-schema-draft-software-20261031
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Source pins, isolated real Store software tests, privacy and raw evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-jef-schema-draft"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          fb393a7f7ed2952137621c9f4cfa87a79b76dbab v13/code/docs/JEF_C3_SCHEMA_DRAFT_GUARD_PREREG_20261031.md
          ee976c0329ad751b4851862680e6fe6f9ee66e82 v13/code/v13/jef_c3_schema_draft_candidate.py
          6b32fd2350213b56650fb8995e4d11b374e187a1 v13/code/tests/test_jef_c3_schema_draft_candidate.py
          25ad2234b353b58ad06bcc505b6ca05f527c0add v13/code/scripts/jef_c3_c5_c6_operator_cli.py
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-jef-schema-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-jef-schema-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else
            echo VENV_RED > "$e/DEPS_RAW.log"
            echo 99 > "$e/DEPS_EXIT.txt"
          fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ] && [ "$bad" = 0 ]; then
            timeout --signal=TERM --kill-after=5s 6m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m unittest discover -s v13/code/tests -p 'test_jef_c3_schema_draft_candidate.py' -v > "$e/TEST_NEW_RAW.log" 2>&1
            echo "$?" > "$e/TEST_NEW_EXIT.txt"
            timeout --signal=TERM --kill-after=5s 6m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m unittest discover -s v13/code/tests -p 'test_jef_c3_c5_c6_operator_cli.py' -v > "$e/TEST_OLD_RAW.log" 2>&1
            echo "$?" > "$e/TEST_OLD_EXIT.txt"
          else
            echo SKIPPED_DEPS_OR_PINS_RED > "$e/TEST_NEW_RAW.log"
            echo SKIPPED_DEPS_OR_PINS_RED > "$e/TEST_OLD_RAW.log"
            echo 99 > "$e/TEST_NEW_EXIT.txt"
            echo 99 > "$e/TEST_OLD_EXIT.txt"
          fi
          python3 -m compileall -q v13/code/v13/jef_c3_schema_draft_candidate.py v13/code/scripts/jef_c3_c5_c6_operator_cli.py v13/code/tests/test_jef_c3_schema_draft_candidate.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 4b14ca3bea9b4ddf717aefb7d04408d4b59921b5 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 4b14ca3bea9b4ddf717aefb7d04408d4b59921b5 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Retain original raw even when tests fail
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-jef-schema-draft-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-jef-schema-draft/
          if-no-files-found: error
          retention-days: 90
      - name: Require all stages
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-jef-schema-draft"
          for s in PINS VENV DEPS TEST_NEW TEST_OLD COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo JEF_SCHEMA_DRAFT_SOFTWARE_ONLY_NO_NATIVE_OR_AGE_PROMOTION
