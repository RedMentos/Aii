name: V14 Core role-specific native tap provenance

on:
  push:
    branches: [gpt6/v14-core-tap-provenance-20261121]
    paths:
      - "v13/code/v13/runners.py"
      - "v13/code/v13/cognition.py"
      - "v13/code/v13/b3pairs.py"
      - "v13/code/v13/b3train.py"
      - "v13/code/scripts/b3_train_l1_shadow.py"
      - "v13/code/v13/contracts.py"
      - "v13/code/v13/operator.py"
      - "v13/code/v13/runtime.py"
      - "v13/code/tests/test_native_taps.py"
      - "v13/code/tests/test_b3pairs.py"
      - "v13/code/tests/test_b3train.py"
      - "v13/code/tests/integration_taps.py"
      - ".github/workflows/v14-core-tap-provenance.yml"
  pull_request:
    branches: [gpt6/v13-private-remote-bridge-20261111]
    paths:
      - "v13/code/v13/runners.py"
      - "v13/code/v13/cognition.py"
      - "v13/code/v13/b3pairs.py"
      - "v13/code/v13/b3train.py"
      - "v13/code/scripts/b3_train_l1_shadow.py"
      - "v13/code/v13/contracts.py"
      - "v13/code/v13/operator.py"
      - "v13/code/v13/runtime.py"
      - "v13/code/tests/test_native_taps.py"
      - "v13/code/tests/test_b3pairs.py"
      - "v13/code/tests/test_b3train.py"
      - "v13/code/tests/integration_taps.py"
      - ".github/workflows/v14-core-tap-provenance.yml"

permissions:
  contents: read

jobs:
  tap-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bounded CPU test dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 psutil PyYAML pytest==9.2.0
      - name: Compile exact tap producer, consumer, tests and native evidence runner
        run: |
          python -m py_compile \
            v13/code/v13/runners.py \
            v13/code/v13/cognition.py \
            v13/code/v13/b3pairs.py \
            v13/code/v13/b3train.py \
            v13/code/scripts/b3_train_l1_shadow.py \
            v13/code/v13/contracts.py \
            v13/code/v13/operator.py \
            v13/code/v13/runtime.py \
            v13/code/tests/test_native_taps.py \
            v13/code/tests/test_b3pairs.py \
            v13/code/tests/test_b3train.py \
            v13/code/tests/integration_taps.py
      - name: Run native tap identity and existing provenance regressions (model-free)
        working-directory: v13/code
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_native_taps.py tests/test_b3pairs.py tests/test_b3train.py
      - name: Public repository privacy scan
        run: python v13/code/scripts/public_repo_privacy_scan.py --base 346321c47b8b1ab23fa6058a32a8e2daec128b11 --head HEAD --no-worktree

      - name: Smoke-test Termux L1 shadow CLI import
        working-directory: v13/code
        run: python scripts/b3_train_l1_shadow.py --help >/dev/null
