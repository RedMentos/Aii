name: V13 Sleep Context F1 F5 integrated source review (software only)
on:
  push:
    branches: [assistant/v13-sleep-f5-crossreview-integration-20261027]
    paths:
      - '.github/workflows/sleep-f5-crossreview-20261027.yml'
      - 'v13/code/v13/sleep_offline.py'
      - 'v13/code/v13/history.py'
      - 'v13/code/v13/memory.py'
      - 'v13/code/v13/episodic_route.py'
      - 'v13/code/tests/test_sleep_ttt_source_lineage_run207.py'
      - 'v13/code/tests/test_sleep_digest_live_lineage_run208.py'
      - 'v13/code/tests/test_sleep_digest_view_authority_run278.py'
      - 'v13/code/tests/test_memory_human_decision_lineage_run270.py'
      - 'v13/code/tests/test_episodic_route_f5_authority_run279.py'
permissions:
  contents: read
concurrency:
  group: v13-sleep-f5-crossreview-20261027
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Actual integrated source tests with closed raw evidence
        shell: bash
        run: |
          set +e
          evidence="$RUNNER_TEMP/v13-sleep-f5-crossreview"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/HEAD.txt"
          git show -s --format='%P' HEAD > "$evidence/PARENTS.txt"
          for item in \
            "v13/code/v13/sleep_offline.py:e51766478fee915824853da7c8e73785b12e91b3" \
            "v13/code/v13/history.py:a7138080e19b439331bf4c5da68e7e62f823f169" \
            "v13/code/v13/memory.py:501c8f43c92f031e034e4b93f4adbd4c67b7edfe" \
            "v13/code/v13/episodic_route.py:04161234548a26284a682a40da09d28242b89e71" \
            "v13/code/tests/test_sleep_ttt_source_lineage_run207.py:783092f081ede8fbfb8de3fd9879816b560f2fb4" \
            "v13/code/tests/test_sleep_digest_live_lineage_run208.py:b80eeacc38375368d35bdb8041f52ec42a70cbc2" \
            "v13/code/tests/test_sleep_digest_view_authority_run278.py:947286a7e2debd2795c77bf1efe1a2fa98000fe5" \
            "v13/code/tests/test_sleep_memory_c3_continuity_run205.py:b0119e70b492c2b386979daf0c9e08cf438e2608" \
            "v13/code/tests/test_memory_human_decision_lineage_run270.py:1871fed7bbb7fb279dcf86cec4f1ae44e52c1077" \
            "v13/code/tests/test_episodic_route_f5_authority_run279.py:a29b60c9775a72dd866e146a86f438b1d90c281e" \
            "v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md:218464b12a2d27d92524c751922fa8e1c3fb0ea7"; do
            path="${item%%:*}"; expected="${item##*:}"
            observed="$(git hash-object "$path")"
            printf '%s %s %s\n' "$path" "$expected" "$observed" >> "$evidence/BLOBS.txt"
            if [ "$observed" != "$expected" ]; then echo "$path" >> "$evidence/BLOB_MISMATCH.txt"; fi
          done
          if [ -s "$evidence/BLOB_MISMATCH.txt" ]; then echo 1 > "$evidence/BLOBS_EXIT.txt"; else echo 0 > "$evidence/BLOBS_EXIT.txt"; fi
          python3 -m venv "$RUNNER_TEMP/v13-sleep-f5-crossreview-venv"
          py="$RUNNER_TEMP/v13-sleep-f5-crossreview-venv/bin/python"
          "$py" -m pip install --no-input -q 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu > "$evidence/INSTALL_RAW.log" 2>&1
          first=$?
          "$py" -m pip install --no-input -q 'numpy==2.2.6' 'psutil' 'PyYAML' 'Pillow' 'transformers==5.20.2' 'peft==0.21.2' >> "$evidence/INSTALL_RAW.log" 2>&1
          second=$?
          if [ "$first" -eq 0 ] && [ "$second" -eq 0 ]; then echo 0; else echo 1; fi > "$evidence/INSTALL_EXIT.txt"
          (
            cd v13/code
            timeout --signal=TERM --kill-after=10s 7m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_sleep_ttt_source_lineage_run207 tests.test_sleep_digest_live_lineage_run208 tests.test_sleep_digest_view_authority_run278 tests.test_sleep_memory_c3_continuity_run205 tests.test_memory_human_decision_lineage_run270 tests.test_episodic_route_f5_authority_run279 tests.test_sleep_offline tests.test_history_lineage tests.test_sleep_a_exact_recall_identity_review tests.test_episodic_route tests.test_route_supersede tests.test_semantic_memory tests.test_context_os tests.test_executive_context tests.test_executive_goal_sequence_binding_review tests.test_b3_l1_seed_identity_review tests.test_world_jepa_incremental_closedstore
          ) > "$evidence/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$evidence/FOCUSED_EXIT.txt"
          (
            cd v13/code
            timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=.:tests "$py" -m unittest discover -s tests -p 'test_*.py' -q
          ) > "$evidence/FULL_RAW.log" 2>&1
          echo "$?" > "$evidence/FULL_EXIT.txt"
          python3 -m compileall -q v13/code/v13 > "$evidence/COMPILE_RAW.log" 2>&1
          echo "$?" > "$evidence/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 6c5dbf145380956ac29bf2d5479ec489ebc7ef5a --head HEAD > "$evidence/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$evidence/PRIVACY_EXIT.txt"
          git diff --check 6c5dbf145380956ac29bf2d5479ec489ebc7ef5a HEAD > "$evidence/DIFF_RAW.log" 2>&1
          echo "$?" > "$evidence/DIFF_EXIT.txt"
          "$py" - <<'PY' > "$evidence/GATES_RAW.log" 2>&1
          import json
          with open('v13/code/BUILD_STATE.json',encoding='utf-8') as f: state=json.load(f)
          p=state['sleep_lineage_reconciliation_20261027']
          assert p['step2']=='UTILITY_FAIL' and p['b3_l1']=='FAIL'
          assert p['jepa_weight']==0 and p['age_authority']==0
          assert not p['canonical_architecture_complete'] and not p['user_full_scope_complete']
          print('NONPROMOTING_GATES_PRESERVED')
          PY
          echo "$?" > "$evidence/GATES_EXIT.txt"
          (cd "$evidence" && sha256sum * > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-sleep-f5-crossreview-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-sleep-f5-crossreview/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce all raw exits, no gate promotion
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/v13-sleep-f5-crossreview"
          for name in BLOBS INSTALL FOCUSED FULL COMPILE PRIVACY DIFF GATES; do
            if [ "$(cat "$evidence/${name}_EXIT.txt")" != 0 ]; then
              echo "$name FAILED; raw evidence retained"
              tail -90 "$evidence/${name}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'SLEEP_CONTEXT_F1_F5_CROSS_ORGAN_SOFTWARE_ONLY_NO_PROMOTION'
