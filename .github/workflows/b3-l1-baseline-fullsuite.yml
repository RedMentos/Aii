name: V13 B3 L1 baseline completeness full software regression
on:
  push:
    branches: [assistant/v13-b3-l1-complete-baseline-review-20261027]
    paths:
      - '.github/workflows/b3-l1-baseline-fullsuite.yml'
      - 'v13/code/v13/b3bridge.py'
permissions:
  contents: read
concurrency:
  group: v13-b3-l1-baseline-full
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Full B3 source and original exits
        run: |
          set +e
          evidence="$RUNNER_TEMP/b3-l1-baseline-full"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/HEAD.txt"
          git hash-object v13/code/v13/b3bridge.py > "$evidence/SOURCE_BLOB.txt"
          git hash-object v13/code/tests/test_b3_l1_baseline_completeness_review.py > "$evidence/TEST_BLOB.txt"
          git hash-object v13/code/tests/test_b3bridge.py > "$evidence/EXISTING_TEST_BLOB.txt"
          git merge-base --is-ancestor 6233286b33715f482a0fa0a11741d78aafa745a7 HEAD
          echo "$?" > "$evidence/PREREG_EXIT.txt"
          git merge-base --is-ancestor 9f34fef1bef848ae5be933c0444fb4fd293bd838 HEAD
          echo "$?" > "$evidence/RED_TEST_COMMIT_EXIT.txt"
          if [ "$(cat "$evidence/SOURCE_BLOB.txt")" = "050ad0e9e3948261a23a752e5379383a13d2e61b" ] && [ "$(cat "$evidence/TEST_BLOB.txt")" = "869c98dc79000673ec1ae7e739c8d2aa548204b8" ] && [ "$(cat "$evidence/EXISTING_TEST_BLOB.txt")" = "50b9fcf38bee7e04aa792be51df164adeb88d2a7" ]; then echo 0; else echo 1; fi > "$evidence/FROZEN_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/b3-l1-baseline-full-venv"
          py="$RUNNER_TEMP/b3-l1-baseline-full-venv/bin/python"
          "$py" -m pip install --no-input -q 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu > "$evidence/INSTALL_RAW.log" 2>&1
          first=$?
          "$py" -m pip install --no-input -q 'numpy==2.2.6' 'psutil' 'PyYAML' 'Pillow' 'transformers==5.20.2' 'peft==0.21.2' >> "$evidence/INSTALL_RAW.log" 2>&1
          second=$?
          if [ "$first" -eq 0 ] && [ "$second" -eq 0 ]; then echo 0; else echo 1; fi > "$evidence/INSTALL_EXIT.txt"
          (
            cd v13/code
            timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=.:tests "$py" -m unittest discover -s tests -p 'test_*.py' -q
          ) > "$evidence/UNIT_RAW.log" 2>&1
          echo "$?" > "$evidence/UNIT_EXIT.txt"
          python3 -m compileall -q v13/code/v13 > "$evidence/COMPILE_RAW.log" 2>&1
          echo "$?" > "$evidence/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 87dd02f82abdcc3762029dac3ea8170c9db30e7c --head HEAD > "$evidence/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$evidence/PRIVACY_EXIT.txt"
          git diff --check 87dd02f82abdcc3762029dac3ea8170c9db30e7c HEAD > "$evidence/DIFF_RAW.log" 2>&1
          echo "$?" > "$evidence/DIFF_EXIT.txt"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-b3-l1-baseline-full-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/b3-l1-baseline-full/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce all raw exits
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/b3-l1-baseline-full"
          for name in PREREG RED_TEST_COMMIT FROZEN INSTALL UNIT COMPILE PRIVACY DIFF; do
            if [ "$(cat "$evidence/${name}_EXIT.txt")" != 0 ]; then
              echo "$name failed; original raw evidence retained"
              tail -80 "$evidence/${name}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'B3_L1_FULL_SOFTWARE_ONLY_NO_PROMOTION'
