name: V13 P0X independent export audit full software regression
on:
  push:
    branches: [codex/v13-p0x-independent-export-audit-20261029]
    paths: ['.github/workflows/v13-p0x-independent-fullsuite-review-20261029.yml']
permissions:
  contents: read
concurrency:
  group: v13-p0x-independent-fullsuite
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Exact-source full software regression and independent review
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-p0x-independent-fullsuite"
          mkdir -p "$e"
          trap '(cd "$e"; find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)' EXIT
          git rev-parse HEAD > "$e/HEAD.txt"
          {
            test "$(git hash-object v13/code/scripts/p0x_independent_source_holdout.py)" = 7ec4e877ad5ea3eed1c60102dac3baa15391dd2b
            test "$(git hash-object v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md)" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
            test "$(git hash-object v13/code/scripts/p0x_export_independent_verify.py)" = d1d6e65def6dad717e934c8fe68290b4a85d963b
            test "$(git hash-object v13/code/tests/test_p0x_export_independent_verify.py)" = 6df94d86e93503dcc439ff7515bd4b86e810abed
            git merge-base --is-ancestor cd2d1d76c08a8b4f09f83b99d33e8effab140d26 HEAD
          } > "$e/PINS_RAW.log" 2>&1
          echo "$?" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-p0x-fullsuite-venv"
          py="$RUNNER_TEMP/v13-p0x-fullsuite-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_BASE_EXIT.txt"
          "$py" -m pip install --disable-pip-version-check --no-input 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_TORCH_EXIT.txt"
          "$py" -m pip install --disable-pip-version-check --no-input 'transformers==5.20.2' 'peft==0.21.2' >> "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_TRANSFORMERS_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=10s 18m "$py" -m unittest discover -s tests -q) > "$e/FULL_RAW.log" 2>&1
          echo "$?" > "$e/FULL_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base cd2d1d76c08a8b4f09f83b99d33e8effab140d26 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check cd2d1d76c08a8b4f09f83b99d33e8effab140d26 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          exit 0
      - name: Preserve complete raw including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-p0x-independent-fullsuite-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-p0x-independent-fullsuite/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce all software and privacy gates
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-p0x-independent-fullsuite"
          for n in PINS DEPS_BASE DEPS_TORCH DEPS_TRANSFORMERS FULL PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED, raw preserved"
              tail -30 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          grep -q CLEAN "$e/PRIVACY_RAW.log"
          grep -q '^OK' "$e/FULL_RAW.log"
          echo P0X_FULL_SOFTWARE_ONLY_NO_NATIVE_NO_GATE
