name: V13 Run152 A3 train-only support threshold regression
on:
  pull_request:
    paths:
      - ".github/workflows/v13-run152-a3-trainonly-support.yml"
      - "v13/code/scripts/a3_trainonly_support_floor_run152.py"
      - "v13/code/tests/test_a3_trainonly_support_floor_run152.py"
      - "v13/code/docs/proofs/continuation-20261025/a3-trainonly-run152/**"
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Official privacy scan
        run: |
          set -euo pipefail
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
  a3-software:
    needs: privacy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Isolated NumPy and exact-head A3 worker tests
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/a3-run152"
          "$RUNNER_TEMP/a3-run152/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5'
          "$RUNNER_TEMP/a3-run152/bin/python" -m compileall -q v13/code/scripts/a3_trainonly_support_floor_run152.py v13/code/tests/test_a3_trainonly_support_floor_run152.py
          PYTHONPATH=v13/code "$RUNNER_TEMP/a3-run152/bin/python" -m unittest discover -s v13/code/tests -p 'test_a3_trainonly_support_floor_run152.py' -v 2>&1 | tee "$RUNNER_TEMP/RUN152_A3_TESTS.log"
          if grep -q 'skipped=' "$RUNNER_TEMP/RUN152_A3_TESTS.log"; then
            echo "Run152 actual student_worker integration must not skip in repository CI" >&2
            exit 1
          fi
