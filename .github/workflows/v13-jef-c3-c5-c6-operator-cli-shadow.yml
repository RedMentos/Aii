name: V13 JEF C3 C5 C6 local operator CLI SHADOW software
on:
  push:
    branches: [assistant/v13-jef-c3-c5-operator-cli-20261031-auto11]
    paths:
      - '.github/workflows/v13-jef-c3-c5-c6-operator-cli-shadow.yml'
      - 'v13/code/scripts/jef_c3_c5_c6_operator_cli.py'
      - 'v13/code/tests/test_jef_c3_c5_c6_operator_cli.py'
      - 'v13/code/docs/JEF_C3_C5_C6_OPERATOR_CLI_PREREG_20261031.md'
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      NEEDLE_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned JEF C3 C5 C6 local operator CLI software and privacy
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-jef-c3-c5-c6-cli"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          58dec7e7b896541080334c30d6e71e896463c49c v13/code/docs/JEF_C3_C5_C6_OPERATOR_CLI_PREREG_20261031.md
          5559ddd3d5964f9a258a3e3ef72f36db3d833095 v13/code/scripts/jef_c3_c5_c6_operator_cli.py
          d208db30eaa52314856aac03f1c4cd1caab4d2c4 v13/code/tests/test_jef_c3_c5_c6_operator_cli.py
          5e095feb81157b3a4be41dd7459c9f44cdcb7036 v13/code/v13/jef_c3_c5_c6_fallback_draft_candidate.py
          d80c9398a216ebf488eb501ed88404b05682848c v13/code/tests/test_jef_c3_c5_c6_fallback_draft_candidate.py
          6f2f878bb162c3325634b05e1c4c5f16e3d817b6 v13/code/v13/jef_c3_postgen_recheck_candidate.py
          ee97fadca69dc1f0ec3845c10ea07014d90ad45e v13/code/tests/test_jef_c3_postgen_recheck_candidate.py
          e94d70be7ec5f4666392a50ea17f813bd92c0879 v13/code/v13/jef_c3_typed_envelope_candidate.py
          de59302a2fb8880758cc9dce3249b919dde63bf3 v13/code/v13/jef_f1f5_live_current_candidate.py
          e417c3bb4afa34a226aa116752df8c10d659a113 v13/code/v13/jef_f1f5_source_admission.py
          7cfae3d54e49718181813cea68238301e2ffae87 v13/code/v13/jef_typed_source_shadow.py
          4409692865d284382de9a14aae55aa3a4315ecfc v13/code/scripts/run63_jef_c3_native.py
          8135fa2792df2c541dc1719e49d941c775703697 v13/code/scripts/p2x_disjoint_receiver_trainset.py
          8efd950c7bc221fbdae3fca200610cb383286001 v13/code/v13/common.py
          a9c9b828448737862fed41597e7471345453caf9 v13/code/v13/contracts.py
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-jef-c3-c5-c6-cli-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-jef-c3-c5-c6-cli-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 8m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_jef_c3_c5_c6_operator_cli tests.test_jef_c3_c5_c6_fallback_draft_candidate tests.test_jef_c3_postgen_recheck_candidate tests.test_jef_c3_typed_envelope_candidate tests.test_jef_f1f5_live_current_candidate tests.test_jef_f1f5_source_admission) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PINS_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/scripts/jef_c3_c5_c6_operator_cli.py v13/code/tests/test_jef_c3_c5_c6_operator_cli.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base e49027c991aef11049a4d253fc1becf4495ddfe5 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check e49027c991aef11049a4d253fc1becf4495ddfe5 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve raw including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-jef-c3-c5-c6-cli-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-jef-c3-c5-c6-cli/
          retention-days: 90
          if-no-files-found: error
      - name: Require all seven stages zero
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-jef-c3-c5-c6-cli"
          for s in PINS VENV DEPS TEST COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo JEF_C3_C5_C6_OPERATOR_CLI_SHADOW_NO_TTY_OR_DELIVERY
