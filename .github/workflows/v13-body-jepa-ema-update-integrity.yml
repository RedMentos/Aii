name: V13 Body JEPA EMA update integrity
on:
  push:
    branches: ['codex/v13-body-jepa-ema-update-integrity-20261109']
  workflow_dispatch:
jobs:
  ema-update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy && python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and run EMA, gradient and adjacent regression tests
        working-directory: v13/code
        run: |
          python -m py_compile v13/body_jepa.py
          python -m pytest -q tests/test_body_jepa_ema_update_integrity_20261109.py tests/test_body_jepa_ema_atomic_20261109.py tests/test_body_jepa_gradient_integrity_20261109.py tests/test_body_jepa_anchor_cache_20261109.py
