name: V13 Run292 pinned-native WAKE ONLY (halt remains separate FAIL)
on:
  pull_request:
    paths:
      - '.github/workflows/run292-native-wake-only.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v13-native-c3-run131-serialized
  cancel-in-progress: false
jobs:
  native-wake-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      V13_NO_AUTOSTART: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Exact source, Canon and fresh host
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/RUN292_NATIVE_HEAD.txt"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(sha256sum v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md | cut -d' ' -f1)" = 3423906b01b24443fcef733fb5c7ef47296963df63e603d8f843c99d544877ee
          git hash-object v13/code/v13/latewatch.py v13/code/tests/integration_readouts.py | tee "$RUNNER_TEMP/RUN292_NATIVE_BLOBS.txt"
          { date -u -Iseconds; uname -a; free -h; cat /sys/fs/cgroup/memory.max 2>/dev/null || true; } | tee "$RUNNER_TEMP/RUN292_NATIVE_HOST.log"
      - name: Pinned isolated dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/run292nativevenv"
          "$RUNNER_TEMP/run292nativevenv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Bootstrap all registered pinned native artifacts
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          export PYTHONPATH="$PWD" V13_HOME="$RUNNER_TEMP/run292nativeinstalled"
          timeout 1800s "$RUNNER_TEMP/run292nativevenv/bin/python" -m v13.bootstrap --home "$V13_HOME" 2>&1 | tee "$RUNNER_TEMP/RUN292_NATIVE_BOOTSTRAP.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUNNER_TEMP/RUN292_NATIVE_BOOTSTRAP_EXIT.txt"
          exit 0
      - name: Existing actual-weight wake-only integration, unchanged thresholds
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          mkdir -p "$RUNNER_TEMP/run292-native"
          if [[ "$(cat "$RUNNER_TEMP/RUN292_NATIVE_BOOTSTRAP_EXIT.txt")" != "0" ]]; then
            echo 2 > "$RUNNER_TEMP/RUN292_NATIVE_TEST_EXIT.txt"
            exit 0
          fi
          export PYTHONPATH="$PWD" V13_HOME="$RUNNER_TEMP/run292nativeinstalled"
          timeout 1200s "$RUNNER_TEMP/run292nativevenv/bin/python" tests/integration_readouts.py --wake-only --installed-home "$V13_HOME" --out "$RUNNER_TEMP/run292-native/readouts-wake-only.json" 2>&1 | tee "$RUNNER_TEMP/RUN292_NATIVE_TEST.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUNNER_TEMP/RUN292_NATIVE_TEST_EXIT.txt"
          exit 0
      - name: Official privacy scan
        run: |
          set -uo pipefail
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree 2>&1 | tee "$RUNNER_TEMP/RUN292_NATIVE_PRIVACY.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUNNER_TEMP/RUN292_NATIVE_PRIVACY_EXIT.txt"
          exit 0
      - name: Preserve closed raw evidence including failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V13-Run292-Native-WakeOnly-Raw
          path: |
            ${{ runner.temp }}/RUN292_NATIVE_HEAD.txt
            ${{ runner.temp }}/RUN292_NATIVE_BLOBS.txt
            ${{ runner.temp }}/RUN292_NATIVE_HOST.log
            ${{ runner.temp }}/RUN292_NATIVE_BOOTSTRAP.log
            ${{ runner.temp }}/RUN292_NATIVE_BOOTSTRAP_EXIT.txt
            ${{ runner.temp }}/RUN292_NATIVE_TEST.log
            ${{ runner.temp }}/RUN292_NATIVE_TEST_EXIT.txt
            ${{ runner.temp }}/RUN292_NATIVE_PRIVACY.log
            ${{ runner.temp }}/RUN292_NATIVE_PRIVACY_EXIT.txt
            ${{ runner.temp }}/run292-native/
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce actual wake-only exit (not full readouts)
        run: |
          test "$(cat "$RUNNER_TEMP/RUN292_NATIVE_BOOTSTRAP_EXIT.txt")" = "0"
          test "$(cat "$RUNNER_TEMP/RUN292_NATIVE_TEST_EXIT.txt")" = "0"
          test "$(cat "$RUNNER_TEMP/RUN292_NATIVE_PRIVACY_EXIT.txt")" = "0"
