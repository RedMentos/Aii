name: V13 current B1 B2 C3 bounded Linux-native GGUF smoke only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v13-current-catalog-linux-native-smoke-20261028
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      V13_NO_AUTOSTART: '1'
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Exact-source three-role serial native load/decode smoke and closed evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-current-catalog-linux-smoke-evidence"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/specs/models.json > "$e/CATALOG_GIT_BLOB.txt"
          git hash-object v13/code/v13/models.py > "$e/MODEL_MANAGER_GIT_BLOB.txt"
          if [ "$(cat "$e/CATALOG_GIT_BLOB.txt")" != "7af05962af41d0bc3f7dd18ef01d4eba55eabf99" ] ||
             [ "$(cat "$e/MODEL_MANAGER_GIT_BLOB.txt")" != "bd035cf8029850cce00b179edf533e53bf24358a" ]; then
            echo 'SOURCE_PIN_DRIFT: refuse Linux smoke' > "$e/SMOKE_DRIVER_RAW.log"
            echo 90 > "$e/SMOKE_EXIT.txt"
          else
            timeout --signal=TERM --kill-after=10s 22m env PYTHONPATH=v13/code python3 v13/code/scripts/step2_current_catalog_native_smoke.py \
              --scratch-root "$RUNNER_TEMP/v13-current-catalog-native-smoke-scratch" \
              --evidence-dir "$e" \
              --expected-catalog-blob 7af05962af41d0bc3f7dd18ef01d4eba55eabf99 > "$e/SMOKE_DRIVER_RAW.log" 2>&1
            echo "$?" > "$e/SMOKE_EXIT.txt"
          fi
          python3 - "$e" > "$e/REPORT_CHECK_RAW.log" 2>&1 <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])/'SMOKE_REPORT.json'
          if not p.exists():
              raise SystemExit('NO_CLOSED_NATIVE_SMOKE_REPORT')
          j=json.loads(p.read_text())
          assert j['evidence_kind']=='LINUX_NATIVE_SMOKE_ONLY'
          assert len(j['roles'])==3 and all(x['returncode']==0 and not x['timeout'] and x['stdout_nonempty'] for x in j['roles'])
          assert j['native_linux_load_decode']
          assert not j['step2_semantic_utility_proven'] and not j['redmi_proof']
          assert not j['step2_gate_promoted'] and j['jepa_weight']==0
          print('LINUX_NATIVE_THREE_ROLE_SMOKE_ONLY_NO_STEP2_UTILITY')
          PY
          echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          (cd "$e" && sha256sum * > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-current-catalog-linux-native-smoke-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-current-catalog-linux-smoke-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce actual Linux-native smoke result
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-current-catalog-linux-smoke-evidence"
          for k in SMOKE REPORT_CHECK; do
            if [ "$(cat "$e/${k}_EXIT.txt")" != 0 ]; then
              echo "$k RED; raw evidence retained, no native success claim"
              tail -45 "$e/${k}_RAW.log" || true
              exit 1
            fi
          done
          echo 'LINUX_NATIVE_SMOKE_ONLY_NOT_STEP2_NOT_REDM I_NO_GATE_PROMOTION'
