name: V13 Run13Z AG9 source-disjoint heldout calibration shadow
on:
  push:
    branches: [assistant/v13-run13z-ag9-heldout-calibration-shadow-20261030-auto11]
    paths:
      - '.github/workflows/v13-run13z-ag9-heldout-shadow.yml'
permissions:
  contents: read
jobs:
  ag9-heldout-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned source-disjoint heldout tests, no model or Store writes
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run13z-heldout"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          6e3063165b9acc5b70c0ab1732a4f548ad5b4408 v13/code/v13/agi/metacog_heldout_shadow_run13z.py
          36ae2486d7e197f675a6369afd36d15d034cfeef v13/code/tests/test_ag9_heldout_shadow_run13z.py
          bede3f29a39c6bd16b21c4b18aa2657a9fe1e459 v13/code/v13/agi/metacog.py
          3c6d545ab67e85eee00467d63478db54ec0fc052 v13/code/tests/test_ag9_finite_confidence_run13y.py
          9b12b6620b1f8df168c6e35173bc49184795f01e v13/code/docs/RUN13Z_AG9_HELDOUT_CALIBRATION_PREREG_20261030.md
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 2m env PYTHONPATH=. python3 -m unittest -v tests.test_ag9_heldout_shadow_run13z tests.test_ag9_finite_confidence_run13y) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m py_compile v13/code/v13/agi/metacog_heldout_shadow_run13z.py v13/code/tests/test_ag9_heldout_shadow_run13z.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 1096d953252811652f0e602980c745529ad7a25a --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 1096d953252811652f0e602980c745529ad7a25a HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original heldout raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run13z-heldout-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run13z-heldout/
          if-no-files-found: error
          retention-days: 30
      - name: Explicit scoped verdict
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run13z-heldout"
          for stage in PINS TEST COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            test "$(cat "$e/${stage}_EXIT.txt")" = 0
          done
