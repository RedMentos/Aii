name: V13 JEF F1/F5 operator integrated full software regression
on:
  push:
    branches: [assistant/v13-jef-f1f5-operator-diagnostic-20261029]
    paths:
      - '.github/workflows/v13-jef-f1f5-operator-full-20261029.yml'
permissions:
  contents: read
jobs:
  full-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Full source-only regression on exact operator review head
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-jef-f1f5-operator-full"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/tests/test_jef_f1f5_operator.py > "$e/TEST_BLOB_RAW.log"
          test "$(cat "$e/TEST_BLOB_RAW.log")" = 0b47dfd43efa000c9c66b5838c0fe795f7e4838f
          echo "$?" > "$e/TEST_BLOB_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-jef-f1f5-full-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-jef-f1f5-full-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
            first="$?"
            "$py" -m pip install --no-input -q 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
            second="$?"
            "$py" -m pip install --no-input -q 'transformers==5.20.2' 'tokenizers==0.23.1' 'safetensors==0.8.0' 'peft==0.21.2' 'gguf==0.19.0' 'Jinja2==3.1.6' 'MarkupSafe==3.0.3' >> "$e/INSTALL_RAW.log" 2>&1
            third="$?"
            "$py" -m pip check >> "$e/INSTALL_RAW.log" 2>&1
            fourth="$?"
            if [ "$first" = 0 ] && [ "$second" = 0 ] && [ "$third" = 0 ] && [ "$fourth" = 0 ]; then echo 0 > "$e/INSTALL_EXIT.txt"; else echo 1 > "$e/INSTALL_EXIT.txt"; fi
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
          else echo SKIPPED > "$e/INSTALL_EXIT.txt"; fi
          if [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 240s env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_jef_typed_source_shadow tests.test_jef_f1f5_source_admission tests.test_jef_f1f5_operator) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else echo SKIPPED > "$e/FOCUSED_EXIT.txt"; fi
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=10s 1200s env PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests -p 'test_*.py' -q) > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else echo SKIPPED > "$e/FULL_EXIT.txt"; fi
          "$py" -m compileall -q v13/code/v13/jef_f1f5_operator.py v13/code/v13/operator.py v13/code/tests/test_jef_f1f5_operator.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 86043068fda99efca34db252745cf275c96bd9bb --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 86043068fda99efca34db252745cf275c96bd9bb HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original full regression raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-jef-f1f5-operator-full-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-jef-f1f5-operator-full/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce integrated full software regression without gate promotion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-jef-f1f5-operator-full"
          for stage in TEST_BLOB VENV INSTALL FOCUSED FULL COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw preserved"
              tail -40 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'JEF_F1F5_OPERATOR_FULL_SOFTWARE_ONLY_NO_NATIVE_NO_GATE'
