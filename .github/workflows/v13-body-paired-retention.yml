name: V13 body paired retention
on:
  pull_request:
    paths:
      - 'v13/code/v13/agi/body_candidate_trial.py'
      - 'v13/code/v13/agi/body_dataset*.py'
      - 'v13/code/v13/agi/body_reviewed_dataset.py'
      - 'v13/code/tests/test_body_candidate_trial.py'
      - 'v13/code/tests/test_body_dataset_*.py'
      - 'v13/code/tests/test_body_reviewed_dataset.py'
      - '.github/workflows/v13-body-paired-retention.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  body-paired-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependency
        run: python -m pip install 'pytest>=8,<9'
      - name: Focused offline dataset and candidate tests
        working-directory: v13/code
        run: python -m pytest -q tests/test_body_dataset_reader.py tests/test_body_dataset_store.py tests/test_body_dataset_training_input.py tests/test_body_reviewed_dataset.py tests/test_body_candidate_trial.py
