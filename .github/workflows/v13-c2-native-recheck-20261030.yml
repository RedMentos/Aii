name: V13 current-chain pinned C2 Needle3 Linux native recheck
on:
  push:
    branches:
      - codex/v13-current-c2-native-recheck-20261030-auto11aa
    paths:
      - '.github/workflows/v13-c2-native-recheck-20261030.yml'
      - 'v13/code/scripts/current_c2_native_linux_smoke_20261028.py'
      - 'v13/code/docs/C2_CURRENT_NATIVE_RECHECK_PREREG_20261030.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v13-run11-c2-needle-native
  cancel-in-progress: false
jobs:
  c2-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Software guards then pinned C2 Needle3 native Linux control call
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-c2-native-recheck"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/specs/models.json > "$e/CATALOG_BLOB.txt"
          git hash-object v13/code/specs/control_tools.json > "$e/TOOLS_BLOB.txt"
          git hash-object v13/code/scripts/current_c2_native_linux_smoke_20261028.py > "$e/PROBE_BLOB.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:tests python3 -m unittest -q tests.test_current_c2_native_linux_smoke_20261028 tests.test_native_smoke_io_20261028) > "$e/GUARDS_RAW.log" 2>&1
          echo "$?" > "$e/GUARDS_EXIT.txt"
          if [ "$(cat "$e/GUARDS_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 10m env PYTHONPATH=v13/code python3 v13/code/scripts/current_c2_native_linux_smoke_20261028.py \
              --scratch-home "$RUNNER_TEMP/v13-c2-native-recheck-scratch" \
              --evidence-dir "$e/native" > "$e/NATIVE_PROBE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_PROBE_EXIT.txt"
          else
            echo SKIPPED_GUARDS_RED > "$e/NATIVE_PROBE_RAW.log"
            echo SKIPPED_RED > "$e/NATIVE_PROBE_EXIT.txt"
          fi
          python3 - "$e" > "$e/REPORT_CHECK_RAW.log" 2>&1 <<'PY'
          import hashlib,json,pathlib,sys
          p=pathlib.Path(sys.argv[1])/'native'
          f=p/'REPORT.json'
          if not f.is_file():
              raise SystemExit('NO_CLOSED_C2_NATIVE_REPORT')
          j=json.loads(f.read_text())
          assert j['evidence_kind']=='LINUX_NATIVE_C2_CONTROL_CALL_ONLY'
          assert j['catalog_git_blob']=='7af05962af41d0bc3f7dd18ef01d4eba55eabf99'
          assert j['tools_git_blob']=='954a3f468f10195fbce12d27f68585ee7edee2c9'
          assert j['model_sha256']=='c9d915eca282ed42d1a09b143b592adb4cc6744ffe2d294adf5cfc5548170c38'
          assert j['binary_sha256']=='5eb163c5ed33bd914c103ef8eba2134c7bb2d97bafafdd69f410a4a3100e8c37'
          assert j['native_exit_code']==0 and j['native_control_pass'] and j['valid_control_call']
          assert j['proposed_route'] in ('simple','detail','gist','both')
          assert not j['native_timed_out'] and j['raw_capture_complete'] and not j['raw_output_capped']
          assert j['stdout_bytes']<1048576 and j['stderr_bytes']<1048576
          for name,key in [('C2_STDOUT_RAW.log','stdout_sha256'),('C2_STDERR_RAW.log','stderr_sha256')]:
              assert hashlib.sha256((p/name).read_bytes()).hexdigest()==j[key]
          assert not j['external_tools_executed'] and not j['b1_b2_c3_executed']
          assert not j['jef_end_to_end_executed'] and not j['redmi_measured']
          assert not j['step2_gate_promoted'] and j['jepa_weight']==0 and j['age_authority']==0
          assert not j['whole_system_complete']
          print('PINNED_C2_NEEDLE_NATIVE_CONTROL_ONLY_NO_JEF_AUTHORITY')
          PY
          echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base bd3cce27d2c009ce44e334503b8e76c1ab5117c1 --head HEAD > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check bd3cce27d2c009ce44e334503b8e76c1ab5117c1 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-c2-native-recheck-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-c2-native-recheck/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce exact C2 native call evidence
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-c2-native-recheck"
          for name in GUARDS NATIVE_PROBE REPORT_CHECK PRIVACY DIFF; do
            if [ "$(cat "$e/${name}_EXIT.txt")" != 0 ]; then
              echo "$name RED; raw retained, no C2 native PASS"
              tail -80 "$e/${name}_RAW.log" || true
              exit 1
            fi
          done
          echo 'CURRENT_CHAIN_C2_NEEDLE_LINUX_NATIVE_ONLY_NO_JEF_REDMI_OR_GATE_PROMOTION'
