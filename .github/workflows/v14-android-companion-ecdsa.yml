name: V14 Android companion ECDSA and transport

on:
  push:
    branches:
      - core/v14-android-companion-native-20261121
  pull_request:
    branches:
      - gpt6/v14-core-companion-outcome-20261121
    paths:
      - "v13/code/v13/android_companion_ecdsa.py"
      - "v13/code/v13/android_companion_transport.py"
      - "v13/code/v13/android_outcomes.py"
      - "v13/code/tests/test_android_companion_ecdsa.py"
      - "v13/code/tests/test_android_companion_transport.py"
      - "v13/code/tests/test_android_companion_outcome_adapter.py"
      - ".github/workflows/v14-android-companion-ecdsa.yml"

permissions:
  contents: read

jobs:
  python-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile and test companion protocol
        env:
          PYTHONPATH: v13/code
        run: |
          python -m py_compile v13/code/v13/android_companion_ecdsa.py v13/code/v13/android_companion_transport.py v13/code/v13/android_outcomes.py
          python -m pytest -q v13/code/tests/test_android_companion_ecdsa.py v13/code/tests/test_android_companion_transport.py v13/code/tests/test_android_companion_outcome_adapter.py v13/code/tests/test_android_companion_protocol.py v13/code/tests/test_android_control.py v13/code/tests/test_android_outcomes.py
