name: V13 Run112 integrated Age0 source CLI and fresh STEP2 fixtures pinned C3 Linux native
on:
  push:
    branches: [assistant/v13-run112-age0-step2-source-integrated-20261029]
permissions:
  contents: read
concurrency:
  group: v13-run112-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native_source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Capture exact source, native experiment, software suite and original closed evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run112"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          source_ok=0
          check() {
            local observed
            observed="$(git hash-object "$2" 2>/dev/null)" || return 1
            printf '%s %s\n' "$observed" "$2" >> "$e/SOURCE_RAW.log"
            [ "$observed" = "$1" ]
          }
          check f992732f5f4a05578473c96fb6bcf949c679fe62 v13/code/docs/proofs/continuation-20261028/RUN112_AGE0_STEP2_INTEGRATION_PREREG.md || source_ok=1
          check d0a7ca36d3542522250b2eb7c09da2c39c045cad v13/code/docs/proofs/continuation-20261028/RUN112_BRANCH_BUILD_STATE.json || source_ok=1
          check 074f6561513411c0b94f6ceb84156d55f5ba857b v13/code/tests/test_run112_age0_step2_crosschain.py || source_ok=1
          check fa81effcf6a9e7cf82e2f2377ae030e512897015 v13/code/docs/proofs/continuation-20261028/RUN109_STEP2_FRESH_FIXTURES_PREREG.md || source_ok=1
          check 6cc3d52524e8c9122710eae2a908d024f0f44f24 v13/code/scripts/run109_step2_fresh_fixtures.py || source_ok=1
          check 78227dcd4a78dbc0ab33fb4ad2ef9938aee1de9c v13/code/tests/test_run109_step2_fresh_fixtures.py || source_ok=1
          check 2ad62fbbf1f6463d99360cdb8198f1104cfdfaf7 v13/code/scripts/step2_z2_timescale.py || source_ok=1
          check 59b6f8febd71781738557a5492057af4689ada6e v13/code/v13/__main__.py || source_ok=1
          check 22c2a149848fba992407bd4f1fba41db73844755 v13/code/tests/test_run106_cli_restore_before_initialize.py || source_ok=1
          check ea869ee800adc80ae5dc6ab281ce8b8a1c299ec7 v13/code/scripts/ask_verified_budget.py || source_ok=1
          check 9dddd752ad0e3cb0b31eaccc247d9da1a6425043 v13/code/tests/test_run103_budgetcontext_restore.py || source_ok=1
          check ab67f77fb988f8a0e48fda390a52e94126e084da v13/code/scripts/source_exact.py || source_ok=1
          check f53a59606ed6e364c897356fac253ec5ea98876a v13/code/tests/test_run97_source_exact_answer.py || source_ok=1
          check 7c43e14778546860e601bd42dc60e82e0f882630 v13/code/scripts/run105_human_tty_c3_native.py || source_ok=1
          check fb882c98b5c4061e3e510a17c99b08ee9b8c8e78 v13/code/tests/test_run105_human_tty_c3_native.py || source_ok=1
          check 1a9eb6f7c7cbfce83d91cc09b4ff9516cff310cf v13/code/v13/cognition.py || source_ok=1
          check ef3cdd5913a47b8e6e35bbaebf97a8325ecf13cb v13/code/v13/operator.py || source_ok=1
          check 68e7ed1352800174972558f1e0b0683a42c8689a v13/code/v13/runtime.py || source_ok=1
          check 7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json || source_ok=1
          check 218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md || source_ok=1
          echo "$source_ok" > "$e/SOURCE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run112-venv"
          py="$RUNNER_TEMP/v13-run112-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/BASE_INSTALL_RAW.log" 2>&1
          base_rc="$?"
          if [ "$base_rc" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/BASE_INSTALL_RAW.log" 2>&1
            torch_rc="$?"
            if [ "$torch_rc" = 0 ]; then
              "$py" -m pip install --disable-pip-version-check --no-input 'transformers==5.20.2' 'peft==0.21.2' >> "$e/BASE_INSTALL_RAW.log" 2>&1
              deps_rc="$?"
            else
              deps_rc=1
            fi
          else
            deps_rc=1
          fi
          echo "$deps_rc" > "$e/BASE_INSTALL_EXIT.txt"
          python3 -m compileall -q v13/code/v13/__main__.py v13/code/scripts/ask_verified_budget.py v13/code/scripts/source_exact.py v13/code/scripts/run105_human_tty_c3_native.py v13/code/tests/test_run112_age0_step2_crosschain.py v13/code/scripts/run109_step2_fresh_fixtures.py v13/code/tests/test_run109_step2_fresh_fixtures.py v13/code/tests/test_run106_cli_restore_before_initialize.py v13/code/tests/test_run103_budgetcontext_restore.py v13/code/tests/test_run97_source_exact_answer.py v13/code/tests/test_run105_human_tty_c3_native.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          export V13_HOME="$RUNNER_TEMP/v13-run112-home"
          if [ "$source_ok" = 0 ] && [ "$(cat "$e/BASE_INSTALL_EXIT.txt")" = 0 ] && [ "$(cat "$e/COMPILE_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=15s 22m "$py" -m scripts.run105_human_tty_c3_native --home "$V13_HOME" --install) > "$e/INSTALL_RAW.log" 2>&1
            echo "$?" > "$e/INSTALL_EXIT.txt"
          else
            echo SKIPPED_PREREQ_RED > "$e/INSTALL_RAW.log"; echo SKIPPED_RED > "$e/INSTALL_EXIT.txt"
          fi
          if [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=15s 10m "$py" -m scripts.run105_human_tty_c3_native --home "$V13_HOME" --out "$e/experiment") > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else
            echo SKIPPED_INSTALL_RED > "$e/NATIVE_RAW.log"; echo SKIPPED_RED > "$e/NATIVE_EXIT.txt"
          fi
          if [ "$(cat "$e/BASE_INSTALL_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 180s "$py" -m unittest -v tests.test_run112_age0_step2_crosschain tests.test_run109_step2_fresh_fixtures tests.test_run106_cli_restore_before_initialize tests.test_run103_budgetcontext_restore tests.test_run97_source_exact_answer tests.test_run105_human_tty_c3_native tests.test_run96_human_source_cli_crosschain tests.test_ask_verified_budget tests.test_source_consumer_recall_integration tests.test_run83_age0_backup_restore_e2e tests.test_verified_operator_preflight) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
            (cd v13/code && timeout --signal=TERM --kill-after=10s 18m "$py" -m unittest discover -s tests -p 'test_*.py') > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else
            echo SKIPPED_PREREQ_RED > "$e/FOCUSED_RAW.log"; echo SKIPPED_RED > "$e/FOCUSED_EXIT.txt"
            echo SKIPPED_PREREQ_RED > "$e/FULL_RAW.log"; echo SKIPPED_RED > "$e/FULL_EXIT.txt"
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base f918ce2c2474678c99f44f8816fec27909c0d604 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check f918ce2c2474678c99f44f8816fec27909c0d604 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - name: Preserve original Run112 raw evidence, no model bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run112-source-cli-native-integrated-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run112/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce exact source, native answer, focused/full tests and privacy
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run112"
          for n in SOURCE BASE_INSTALL COMPILE INSTALL NATIVE FOCUSED FULL PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED: original evidence retained; no gate promotion"
              tail -40 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN107_INTEGRATED_SOURCE_C3_NATIVE_LINUX_ONLY
