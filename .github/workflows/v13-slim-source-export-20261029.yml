name: V13 slim public tracked source export for local review
on:
  push:
    branches: [codex/v13-c3-stream-finalizer-20261029-auto10al]
    paths:
      - '.github/workflows/v13-slim-source-export-20261029.yml'
permissions:
  contents: read
jobs:
  slim-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Archive tracked runtime, tests, scripts, specs and Canon only
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-slim-source"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git archive --format=tar HEAD v13/code/v13 v13/code/tests v13/code/scripts v13/code/specs v13/code/docs/canon v13/code/BUILD_STATE.json | gzip -n -1 > "$e/v13-code-slim.tar.gz"
          sha256sum "$e/v13-code-slim.tar.gz" > "$e/SOURCE_ARCHIVE_SHA256.txt"
          git hash-object v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/CANON_BLOB.txt"
          test "$(cat "$e/CANON_BLOB.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Preserve slim source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-slim-source-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-slim-source/
          retention-days: 30
          if-no-files-found: error
