name: V13 P2X token-safe pilot plus paired scorer integrated full software review
on:
  push:
    branches: [assistant/v13-p2x-pilot-scorer-integration-20261029]
    paths:
      - '.github/workflows/v13-p2x-pilot-scorer-integration-20261029.yml'
permissions:
  contents: read
concurrency:
  group: v13-p2x-integration-source-only-20261029
  cancel-in-progress: false
jobs:
  full-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Capture exact-source integrated focused and full software evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-p2x-integration-evidence"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          c9509e299510540af4e43ebbc397f2e5a144142d v13/code/scripts/p2x_native_receiver_eval_scorer.py
          1bce2bb543f2e4c27d020578d424361a63d1ffa1 v13/code/tests/test_p2x_native_receiver_eval_scorer.py
          41b61ba3d196fc8d624e586c0f31e740002bd469 v13/code/scripts/p2x_c3_lora_pilot.py
          6715ebda76974b77aa2077a88bc30dca805e7831 v13/code/tests/test_p2x_c3_lora_pilot.py
          8d4683a25d7ddd2530c1e72bf33015f2b1303f6b v13/code/scripts/p2x_token_admission_native_probe.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          : > "$e/BLOBS_RAW.log"
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            printf '%s %s %s\n' "$want" "$got" "$path" >> "$e/BLOBS_RAW.log"
            if [ "$want" != "$got" ]; then echo BLOB_MISMATCH >> "$e/BLOBS_RAW.log"; fi
          done < "$e/EXPECTED_BLOBS.txt"
          if grep -q BLOB_MISMATCH "$e/BLOBS_RAW.log"; then echo 1 > "$e/BLOBS_EXIT.txt"; else echo 0 > "$e/BLOBS_EXIT.txt"; fi
          python3 -m venv "$RUNNER_TEMP/v13-p2x-integration-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-p2x-integration-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
            first="$?"
            "$py" -m pip install --no-input -q 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
            second="$?"
            "$py" -m pip install --no-input -q 'transformers==5.20.2' 'tokenizers==0.23.1' 'safetensors==0.8.0' 'peft==0.21.2' 'gguf==0.19.0' 'Jinja2==3.1.6' 'MarkupSafe==3.0.3' >> "$e/INSTALL_RAW.log" 2>&1
            third="$?"
            "$py" -m pip check >> "$e/INSTALL_RAW.log" 2>&1
            fourth="$?"
            if [ "$first" = 0 ] && [ "$second" = 0 ] && [ "$third" = 0 ] && [ "$fourth" = 0 ]; then echo 0 > "$e/INSTALL_EXIT.txt"; else echo 1 > "$e/INSTALL_EXIT.txt"; fi
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
          else echo SKIPPED > "$e/INSTALL_EXIT.txt"; fi
          if [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ] && [ "$(cat "$e/BLOBS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 240s env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_p2x_c3_lora_pilot tests.test_p2x_token_admission_native_probe tests.test_p2x_native_receiver_eval_scorer) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else echo SKIPPED_PREREQ_RED > "$e/FOCUSED_RAW.log"; echo SKIPPED > "$e/FOCUSED_EXIT.txt"; fi
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=10s 1080s env PYTHONPATH=.:tests "$py" -m unittest discover -s tests -p 'test_*.py' -q) > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else echo SKIPPED_FOCUSED_RED > "$e/FULL_RAW.log"; echo SKIPPED > "$e/FULL_EXIT.txt"; fi
          "$py" -m compileall -q v13/code/scripts/p2x_c3_lora_pilot.py v13/code/scripts/p2x_token_admission_native_probe.py v13/code/scripts/p2x_native_receiver_eval_scorer.py v13/code/tests/test_p2x_c3_lora_pilot.py v13/code/tests/test_p2x_token_admission_native_probe.py v13/code/tests/test_p2x_native_receiver_eval_scorer.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base ea82d7b9f0955e590b4dd7fe8d1babdb33e67088 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check ea82d7b9f0955e590b4dd7fe8d1babdb33e67088 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Upload original integrated raw even if RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-p2x-integration-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-p2x-integration-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce all source-only integration gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-p2x-integration-evidence"
          for stage in BLOBS VENV INSTALL FOCUSED FULL COMPILE PRIVACY DIFF; do
            test "$(cat "$e/${stage}_EXIT.txt")" = 0
          done
          echo 'P2X_INTEGRATED_SOURCE_ONLY_NO_NATIVE_OR_UTILITY_PROMOTION'
