name: V13 DE closed-world seed101 software-only
on:
  push:
    branches:
      - 'assistant/v13-de-closedworld-run11a-20261030'
permissions:
  contents: read
jobs:
  closedworld:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Frozen tests, source pins, compile and privacy evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/de-closedworld"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          (cd v13/code && timeout 5m env PYTHONPATH=.:tests:scripts python3 -m unittest -v \
            tests.test_listarith_de_closedworld_seed101_20261030 \
            tests.test_listarith_de_shadow_pipeline_20261030) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m py_compile \
            v13/code/v13/agi/listarith_de_closedworld_candidate.py \
            v13/code/tests/test_listarith_de_closedworld_seed101_20261030.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py \
            --base be26f5176a55180be0f9086868a9c4a1c2a5889c \
            --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check be26f5176a55180be0f9086868a9c4a1c2a5889c HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-de-closedworld-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/de-closedworld/
          retention-days: 30
          if-no-files-found: error
      - name: Gate software/integrity only, never STEP2/B3/JEPA/Redmi
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/de-closedworld"
          for stage in TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED (raw retained)"
              tail -100 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
          echo "SHADOW_ONLY_SOFTWARE_GREEN_NO_UTILITY_OR_AGE_PROMOTION"
