name: V13 German list_arith seed67 shadow dev preflight
on:
  push:
    branches:
      - assistant/v13-listarith-german-shadow-seed67-20261030
    paths:
      - '.github/workflows/v13-listarith-de-shadow-seed67-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shadow-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Immutable prereg and dev-only tests
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-listarith-de67-dev"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git merge-base --is-ancestor 45506ebab8595cea59cba85b2c773a6c0f44d438 HEAD > "$e/PREREG_RAW.log" 2>&1
          echo "$?" > "$e/PREREG_EXIT.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          3072aa0d6666a38de2f711e123cd35dae2cfed2a v13/code/docs/LISTARITH_GERMAN_SHADOW_SEED67_PREREG_20261030.md
          264805f54b697f693dc0e9730f0448f447fa8141 v13/code/specs/listarith_de_shadow_seed67_fixtures.json
          d13120bcd6be6572b6e63af5f2b5a3242e7d0b98 v13/code/v13/agi/listarith_de_shadow.py
          2de69a93654a67d6339d8c32647c084935b9dbc6 v13/code/tests/test_listarith_de_shadow_seed67_20261030.py
          35893e9f829a591ffb9a792a73cef9bce986b3c4 v13/code/v13/agi/listarith.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          red=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then red=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$red" > "$e/PINS_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests python3 -m unittest -v tests.test_listarith_de_shadow_seed67_20261030) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m py_compile v13/code/v13/agi/listarith_de_shadow.py v13/code/tests/test_listarith_de_shadow_seed67_20261030.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 01e4ee82b86a42afec7d76c3f2766270364e1c41 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 01e4ee82b86a42afec7d76c3f2766270364e1c41 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve all dev preflight raw on PASS or RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-listarith-de67-dev-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-listarith-de67-dev/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce shadow-only preflight
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-listarith-de67-dev"
          for stage in PREREG PINS TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained; no shadow signal claim"
              tail -80 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'GERMAN_LISTARITH_DEV_SOFTWARE_ONLY_NO_LIVE_TOOL_OR_GATE'
