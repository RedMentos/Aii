name: V13 durable Android stop
on:
  push:
    branches:
      - core/v13-android-durable-stop-20261112-0408
  pull_request:
    paths:
      - 'v13/code/v13/android_stop_latch.py'
      - 'v13/code/v13/android_local_console.py'
      - 'v13/code/tests/test_android_local_console.py'
      - 'v13/code/tests/test_qa_android_stop_during_approval.py'
jobs:
  durable-stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: |
          python -m compileall -q v13/code/v13/android_stop_latch.py v13/code/v13/android_local_console.py
          PYTHONPATH=v13/code python -m pytest -q v13/code/tests/test_android_local_console.py v13/code/tests/test_android_operator_audited_session.py v13/code/tests/test_android_operator_validation.py v13/code/tests/test_qa_android_stop_during_approval.py
