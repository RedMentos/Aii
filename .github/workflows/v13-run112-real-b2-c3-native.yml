name: V13 Run112 actual native B2 to C3 source handoff
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v13-native-c3-ag12-20261030
  cancel-in-progress: false
jobs:
  native-b2-c3:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      V13_NO_AUTOSTART: "1"
      DO_NOT_TRACK: "1"
      NEEDLE_TELEMETRY: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify current phone source, install pinned B2/C3 and run actual handoff
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run112-native"
          source_root="$RUNNER_TEMP/v13-run112-extracted/V13-Phone"
          installed="$RUNNER_TEMP/v13-run112-installed"
          fixture="$GITHUB_WORKSPACE/v13/code/docs/fixtures/RUN112_REAL_B2_C3_SEED907.json"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run112-native-venv" > "$e/VENV_RAW.log" 2>&1
          py="$RUNNER_TEMP/v13-run112-native-venv/bin/python"
          echo 0 > "$e/VENV_EXIT.txt"
          "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q \
            'numpy==2.2.6' 'prompt-toolkit==3.0.52' psutil PyYAML Pillow > "$e/DEPS_RAW.log" 2>&1
          echo 0 > "$e/DEPS_EXIT.txt"
          "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log"
          set +e
          "$py" v13/code/scripts/package_source.py --root v13/code --out "$e/V13-Phone-Run112-Native.zip" --phone-install > "$e/PACK_RAW.log" 2>&1
          pack_rc=$?
          set -e
          echo "$pack_rc" > "$e/PACK_EXIT.txt"
          if test "$pack_rc" -eq 0; then
            set +e
            "$py" - "$e" "$RUNNER_TEMP/v13-run112-extracted" "$fixture" <<'PY' > "$e/ZIP_RAW.log" 2>&1
          import hashlib,json,sys,zipfile
          from pathlib import Path
          e=Path(sys.argv[1]);dest=Path(sys.argv[2]);fixture=Path(sys.argv[3])
          p=e/'V13-Phone-Run112-Native.zip'
          assert hashlib.sha256(fixture.read_bytes()).hexdigest()=='243b709273d96d7844e1d097a63d1de13cf37922112c52dd80465ec3a7f7e517'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              manifest=json.loads(z.read('V13-Phone/WORKSPACE_FILES.json'))
              assert manifest['schema_version']==1
              for name,expected in manifest['files'].items():
                  assert hashlib.sha256(z.read('V13-Phone/'+name)).hexdigest()==expected,name
              for name in ('scripts/run112_real_b2_to_c3_native.py',
                           'scripts/run111_c3_b2_context_native.py',
                           'scripts/run93_source_c3_native_e2e.py',
                           'v13/bootstrap.py','v13/runner_activation.py'):
                  assert z.read('V13-Phone/'+name)==(Path('v13/code')/name).read_bytes()
              z.extractall(dest)
          print(json.dumps({'files':len(manifest['files']),
                            'phone_zip_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                            'registered_fixture_sha256':hashlib.sha256(fixture.read_bytes()).hexdigest(),
                            'manifest_hashes_pass':True,'redmi_measured':False},sort_keys=True))
          PY
            zip_rc=$?
            set -e
          else
            zip_rc=125
            echo 'PACK_RED' > "$e/ZIP_RAW.log"
          fi
          echo "$zip_rc" > "$e/ZIP_EXIT.txt"
          if test "$zip_rc" -eq 0; then
            set +e
            (cd "$source_root" && env PYTHONPATH=.:scripts:tests "$py" scripts/run112_real_b2_to_c3_native.py --fixture "$fixture" --work "$RUNNER_TEMP/v13-run112-preflight-work" --out "$e/PREFLIGHT") > "$e/PREFLIGHT_RAW.log" 2>&1
            preflight_rc=$?
            if test "$preflight_rc" -eq 0; then
              (cd "$source_root" && env PYTHONPATH=.:scripts:tests "$py" scripts/run93_source_c3_native_e2e.py --home "$installed" --install) > "$e/INSTALL_C3_RAW.log" 2>&1
              install_c3_rc=$?
            else
              install_c3_rc=125
              echo 'PREFLIGHT_RED' > "$e/INSTALL_C3_RAW.log"
            fi
            if test "$install_c3_rc" -eq 0; then
              (cd "$source_root" && env PYTHONPATH=.:scripts:tests "$py" "$py" - "$installed" <<'PY') > "$e/INSTALL_B2_RAW.log" 2>&1
          from pathlib import Path
          import sys,json
          from v13.models import ModelManager,catalog
          from v13.common import file_hash
          home=Path(sys.argv[1])
          m=ModelManager(home)
          m.install('gist')
          s=catalog()['models']['gist']
          assert s['revision']=='8fea620810c4afa23dd6443f999a48574c1611a3'
          assert s['files'][0]['sha256']=='57d1997790d1744fba5b40a7317df71ea5e2acee28c47e78f0cce39c0703f8cf'
          assert m.verify(deep=True)['gist']['ok']
          assert file_hash(m.path_for('B2_GIST'))==s['files'][0]['sha256']
          print(json.dumps({'status':'RUN112_B2_INSTALLED_PINNED',
                            'model_sha256':s['files'][0]['sha256'],
                            'revision':s['revision'],'weights_exported':False},sort_keys=True))
          PY
              install_b2_rc=$?
            else
              install_b2_rc=125
              echo 'C3_INSTALL_RED' > "$e/INSTALL_B2_RAW.log"
            fi
            if test "$install_b2_rc" -eq 0; then
              (cd "$source_root" && env PYTHONPATH=.:scripts:tests "$py" scripts/run112_real_b2_to_c3_native.py --fixture "$fixture" --installed "$installed" --work "$RUNNER_TEMP/v13-run112-native-work" --out "$e/NATIVE_CASE") > "$e/NATIVE_RAW.log" 2>&1
              native_rc=$?
            else
              native_rc=125
              echo 'B2_INSTALL_RED' > "$e/NATIVE_RAW.log"
            fi
            set -e
          else
            preflight_rc=125;install_c3_rc=125;install_b2_rc=125;native_rc=125
            echo 'ZIP_RED' > "$e/PREFLIGHT_RAW.log"
            echo 'ZIP_RED' > "$e/INSTALL_C3_RAW.log"
            echo 'ZIP_RED' > "$e/INSTALL_B2_RAW.log"
            echo 'ZIP_RED' > "$e/NATIVE_RAW.log"
          fi
          echo "$preflight_rc" > "$e/PREFLIGHT_EXIT.txt"
          echo "$install_c3_rc" > "$e/INSTALL_C3_EXIT.txt"
          echo "$install_b2_rc" > "$e/INSTALL_B2_EXIT.txt"
          echo "$native_rc" > "$e/NATIVE_EXIT.txt"
          if test "$native_rc" -eq 0; then
            set +e
            "$py" - "$e" <<'PY' > "$e/VERIFY_RAW.log" 2>&1
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1]);r=json.loads((e/'NATIVE_CASE/report.json').read_text())
          assert r['schema']=='v13.run112.real_b2_to_c3_native.v1'
          assert r['fixture_sha256']=='243b709273d96d7844e1d097a63d1de13cf37922112c52dd80465ec3a7f7e517'
          assert r['seed']==907 and r['native_b2'] is True and r['native_c3'] is True
          assert r['status']=='NATIVE_B2_C3_STRUCTURAL_PASS'
          assert r['b2_native_calls']==2 and r['c3_native_calls']==1
          assert len(r['b2_offers'])==2
          assert all(x['status']=='RECORDED' and x['native_final'] is True
                     and x['process_reaped'] is True for x in r['b2_offers'])
          assert r['prior_verified_for_c3'] is True and r['c3_process_reaped'] is True
          assert r['no_live_output'] is True and r['closed_store_ok'] is True
          assert r['age0']=='RECORD_ONLY' and r['jepa_weight']==0
          assert r['output_committed'] is False and r['tool_dispatches']==0
          assert r['whole_system_complete'] is False and r['redmi_measured'] is False
          print(json.dumps({'status':r['status'],
                            'source_decision_correct':r['source_decision_correct'],
                            'native_b2_calls':2,'native_c3_calls':1,
                            'step2_promoted':False},sort_keys=True))
          PY
            verify_rc=$?
            set -e
          else
            verify_rc=125
            echo 'NATIVE_RED_NOT_PROMOTED' > "$e/VERIFY_RAW.log"
          fi
          echo "$verify_rc" > "$e/VERIFY_EXIT.txt"
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base e9b791a9a1deeae001d4cc0c3760e6b5e8e29d29 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          privacy_rc=$?
          git diff --check e9b791a9a1deeae001d4cc0c3760e6b5e8e29d29 HEAD > "$e/DIFF_RAW.log" 2>&1
          diff_rc=$?
          set -e
          echo "$privacy_rc" > "$e/PRIVACY_EXIT.txt"
          echo "$diff_rc" > "$e/DIFF_EXIT.txt"
          "$py" - "$e" <<'PY' > "$e/RESULT_RAW.log"
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1]);names=['PACK','ZIP','PREFLIGHT','INSTALL_C3','INSTALL_B2','NATIVE','VERIFY','PRIVACY','DIFF']
          r={'schema':'v13.run112.real_b2_c3.native.v1',
             'head':(e/'HEAD.txt').read_text().strip(),
             'exits':{n:int((e/(n+'_EXIT.txt')).read_text()) for n in names},
             'native_b2_executed':(e/'NATIVE_EXIT.txt').read_text().strip()!='125',
             'redmi_measured':False,'step2_promoted':False,'b3_promoted':False,
             'body_jepa_promoted':False,'age_promoted':False}
          (e/'RESULT.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
          echo 0 > "$e/RESULT_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat "$e/RESULT_RAW.log"
          tail -n 12 "$e/NATIVE_RAW.log"
          for rc in "$pack_rc" "$zip_rc" "$preflight_rc" "$install_c3_rc" "$install_b2_rc" "$native_rc" "$verify_rc" "$privacy_rc" "$diff_rc"; do test "$rc" -eq 0; done
      - name: Preserve original native GREEN or RED without weights
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run112-real-b2-c3-native-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run112-native/
          if-no-files-found: warn
          retention-days: 90
