name: V13 Run36 disjoint native AG12 same-output confidence incidence
on:
  push:
    branches: [assistant/v13-run36-ag12-native-confidence-incidence-20261031-hourly11]
    paths:
      - 'v13/code/docs/RUN36_NATIVE_LAUNCH_TRIGGER_20261031.md'
permissions:
  contents: read
concurrency:
  group: v13-native-c3-ag12-20261030
  cancel-in-progress: false
jobs:
  native-incidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin frozen three-organ sources and run disjoint seed17 native cohort
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run36-native"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          a3aa063ef1a4da6cb6b49f8a75a63587d15327f1 v13/code/docs/AG12_NATIVE_FINITE_CONFIDENCE_INCIDENCE_PREREG_RUN36_20261031.md
          e02d23713e91f982ceea4a85e0b362581aa48e59 v13/code/v13/agi/solver_confidence_native_incidence_candidate.py
          13d806c9c896d58926846ab898ff7ea9d007a960 v13/code/tests/test_run36_ag12_native_confidence_incidence.py
          f2c94817610a9c5aad385feefaa2766c7fdd440a v13/code/scripts/run36_ag12_native_confidence_incidence.py
          46982818f6c6078d823c97388c1a4ec250d82e14 v13/code/v13/agi/solver_confidence_finite_candidate.py
          66a9419143c456f01747b4796fb327b3b36711b3 v13/code/v13/agi/solver.py
          f7c23a2467b3daeae4875b7e18b1a6d83fcdbb47 v13/code/scripts/run27_ag12_three_organ_native.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run36-native-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run36-native-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_run36_ag12_native_confidence_incidence tests.test_run33_ag12_finite_vote_shadow tests.test_run31_ag12_finite_confidence_candidate tests.test_agi_solver) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PIN_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          if [ "$(cat "$e/TEST_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 43m env PYTHONPATH=.:tests:scripts "$py" scripts/run36_ag12_native_confidence_incidence.py --home "$e/home" --out "$e/native") > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else echo SKIPPED_TEST_RED > "$e/NATIVE_RAW.log"; echo 99 > "$e/NATIVE_EXIT.txt"; fi
          if [ -f "$e/native/REPORT.json" ]; then
            (cd v13/code && PYTHONPATH=.:scripts "$py" - "$e/native/REPORT.json" > "$e/REPORT_CHECK_RAW.log" 2>&1 <<'PY'
          import json,sys
          from v13.agi.generality import build_suite
          r=json.load(open(sys.argv[1]))
          assert r['schema']=='v13.run36.ag12_native_finite_confidence_incidence.v1'
          assert r['evidence_kind']=='LINUX_NATIVE_AG12_SAME_OUTPUT_CONFIDENCE_SHADOW'
          assert r['status']=='DONE' and r['suite_seed']==r['generation_seed']==17
          assert r['native_role_calls']==528 and r['voted_items']==176
          assert r['roles']==['B1_DETAIL','B2_GIST','C3_LANGUAGE']
          assert r['exclusive_native_residency'] and r['runtime_closed'] and r['process_reaped']
          assert r['no_events'] and r['no_messages']
          assert r['age0']=='RECORD_ONLY' and r['step2']=='UTILITY_FAIL'
          assert r['b3']=='NO_PROMOTION' and r['body_jepa']=='UNAVAILABLE'
          assert r['jepa_weight']==0 and r['world_jepa_authority']=='SHADOW'
          assert not r['redmi_measured'] and not r['whole_system_complete']
          assert not r['learned_german_transfer_proven'] and not r['live_jef_fusion_proven']
          assert set(r['per_language'])=={'de','en'}
          for lang,v in r['per_language'].items():
            assert v['suite_hash']==build_suite(17,lang=lang)['hash']
            a=v['aggregate']
            assert a['items']==88 and a['role_calls']==264
            assert a['legacy_comparable_rows']+a['legacy_incomparable_rows']==88
            assert 0<=a['same_output_changed_votes']<=a['legacy_comparable_rows']
            assert 0<=a['finite_correct_all']<=88
            assert set(a['by_role'])==set(r['roles'])
            for role,c in a['by_role'].items():
              assert c['native_calls']==88
              assert sum(c['source_counts'].values())==88
              assert 0<=c['invalid_present']<=88
              assert 0<=c['missing_confidence']<=88
          print('RUN36_DISJOINT_NATIVE_INCIDENCE_AGGREGATE_ONLY_NO_PROMOTION')
          PY
            )
            echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          else echo NO_NATIVE_REPORT_RED > "$e/REPORT_CHECK_RAW.log"; echo 99 > "$e/REPORT_CHECK_EXIT.txt"; fi
          python3 -m py_compile v13/code/v13/agi/solver_confidence_native_incidence_candidate.py v13/code/scripts/run36_ag12_native_confidence_incidence.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 5e11c193f95bd4d7d9296845ee666535825a1ba5 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 5e11c193f95bd4d7d9296845ee666535825a1ba5 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          mkdir -p "$e/receipts"
          for f in HEAD.txt PINS.txt PINS_RAW.log PINS_EXIT.txt VENV_RAW.log VENV_EXIT.txt DEPS_RAW.log DEPS_EXIT.txt TEST_RAW.log TEST_EXIT.txt NATIVE_RAW.log NATIVE_EXIT.txt REPORT_CHECK_RAW.log REPORT_CHECK_EXIT.txt COMPILE_RAW.log COMPILE_EXIT.txt PRIVACY_RAW.log PRIVACY_EXIT.txt DIFF_RAW.log DIFF_EXIT.txt; do
            [ ! -f "$e/$f" ] || cp "$e/$f" "$e/receipts/$f"
          done
          [ ! -f "$e/native/REPORT.json" ] || cp "$e/native/REPORT.json" "$e/receipts/REPORT.json"
          (cd "$e/receipts" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve aggregate-only native receipts and all failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run36-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run36-native/receipts/
          if-no-files-found: error
          retention-days: 90
      - name: Require complete native receipts without utility or age promotion
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-run36-native"
          for stage in PINS VENV DEPS TEST NATIVE REPORT_CHECK COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${stage}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN36_NATIVE_AGGREGATE_ONLY_NO_AG12_OR_AGE_GATE_PROMOTION
