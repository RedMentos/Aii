name: V13 P2X CAL36 full software regression and privacy review

on:
  push:
    branches: [codex/v13-p2x-cal36-transport-20261029]
    paths: ['.github/workflows/v13-p2x-cal36-fullsuite-20261029.yml']

permissions:
  contents: read

concurrency:
  group: v13-p2x-cal36-fullsuite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  software-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      V13_NO_AUTOSTART: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Full software regression and original closed evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-p2x-cal36-fullsuite"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/scripts/p2x_cal36_transport.py > "$e/SOURCE_BLOB.txt"
          git hash-object v13/code/tests/test_p2x_cal36_transport_20261029.py > "$e/TEST_BLOB.txt"
          if [ "$(cat "$e/SOURCE_BLOB.txt")" = 8b8634375c37c40f804907120951d308ddb15a7f ] && [ "$(cat "$e/TEST_BLOB.txt")" = 3232ce1ab9f483ec16b85e52da4ab06e63175f6a ]; then echo 0 > "$e/PIN_EXIT.txt"; else echo 1 > "$e/PIN_EXIT.txt"; fi
          python3 -m venv "$RUNNER_TEMP/v13-p2x-cal36-fullsuite-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-p2x-cal36-fullsuite-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' > "$e/NUMPY_RAW.log" 2>&1
            echo "$?" > "$e/NUMPY_EXIT.txt"
          else echo SKIPPED > "$e/NUMPY_EXIT.txt"; fi
          if [ "$(cat "$e/NUMPY_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=10s 180s env PYTHONPATH=.:tests:scripts "$py" -m unittest -v               tests.test_p2x_cal36_transport_20261029               tests.test_p2x_lora_scaled_cli_review               tests.test_p2x_candidate360_standalone) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else echo SKIPPED > "$e/FOCUSED_EXIT.txt"; fi
          python3 -m compileall -q v13/code/scripts/p2x_cal36_transport.py v13/code/tests/test_p2x_cal36_transport_20261029.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
            first=$?
            "$py" -m pip install --disable-pip-version-check --no-input 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
            second=$?
            "$py" -m pip install --disable-pip-version-check --no-input 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
            third=$?
            if [ "$first" = 0 ] && [ "$second" = 0 ] && [ "$third" = 0 ]; then
              echo 0 > "$e/INSTALL_EXIT.txt"
              "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
              "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
              echo "$?" > "$e/PIP_CHECK_EXIT.txt"
              (cd v13/code && timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests -p 'test_*.py' -q) > "$e/FULL_RAW.log" 2>&1
              echo "$?" > "$e/FULL_EXIT.txt"
            else
              echo 1 > "$e/INSTALL_EXIT.txt"
              echo SKIPPED > "$e/PIP_CHECK_EXIT.txt"
              echo SKIPPED > "$e/FULL_EXIT.txt"
            fi
          else
            for n in INSTALL PIP_CHECK FULL; do echo SKIPPED > "$e/${n}_EXIT.txt"; done
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 6cf8a19ead783ec12461edbe54230a8d94fe3ac1 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 6cf8a19ead783ec12461edbe54230a8d94fe3ac1 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve full original RED or GREEN raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-p2x-cal36-fullsuite-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-p2x-cal36-fullsuite/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce all software stages without gate promotion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-p2x-cal36-fullsuite"
          for n in PIN VENV NUMPY FOCUSED COMPILE INSTALL PIP_CHECK FULL PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; original raw retained; no gate promotion"
              tail -45 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo CAL36_FULL_SOFTWARE_ONLY_PASS_NO_NATIVE_CLAIM
