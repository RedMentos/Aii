name: V13 Run13W C3 shadow native-output receipt consistency
on:
  push:
    branches: [assistant/v13-run13w-c3-output-receipt-bind-20261030-auto11]
    paths:
      - '.github/workflows/v13-run13w-c3-output-receipt.yml'
      - 'v13/code/tests/test_jef_c3_output_binding_run13w.py'
      - 'v13/code/tests/test_jef_c3_shadow_fallback_run13v.py'
      - 'v13/code/v13/agi/jef_c3_shadow_fallback_run13v.py'
      - 'v13/code/docs/RUN13W_C3_OUTPUT_RECEIPT_BINDING_PREREG_20261030.md'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run pinned source-only real Store tests and retain raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run13w-shadow"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          0044a96979db760fdd0c9fe35d6be17152289170 v13/code/v13/agi/jef_c3_shadow_fallback_run13v.py
          3a1b18e5c52baf4ce5b996d2e7af4bef2ccafac9 v13/code/tests/test_jef_c3_shadow_fallback_run13v.py
          4d90de6a587a3ccedf6c0a983d8749cb60614d45 v13/code/tests/test_jef_c3_output_binding_run13w.py
          edafad6249769fa9889601253e8b515062ca3a30 v13/code/docs/RUN13W_C3_OUTPUT_RECEIPT_BINDING_PREREG_20261030.md
          82d1f1e2af5bf565f9d5f081844e1da55c88084c v13/code/v13/agi/c3_source_fidelity_shadow_run13m.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run13w-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run13w-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_jef_c3_output_binding_run13w tests.test_jef_c3_shadow_fallback_run13v tests.test_c3_source_fidelity_shadow_run13m tests.test_jef_c3_shadow_prompt_run13i) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/v13/agi/jef_c3_shadow_fallback_run13v.py v13/code/tests/test_jef_c3_output_binding_run13w.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 0cd76094ac433e1b5b9e1ce05cbb57f36205d8d8 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 0cd76094ac433e1b5b9e1ce05cbb57f36205d8d8 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw even on RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run13w-shadow-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run13w-shadow/
          if-no-files-found: error
          retention-days: 30
      - name: Explicit scoped verdict
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run13w-shadow"
          for stage in PINS VENV DEPS TEST COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            test "$(cat "$e/${stage}_EXIT.txt")" = 0
          done
