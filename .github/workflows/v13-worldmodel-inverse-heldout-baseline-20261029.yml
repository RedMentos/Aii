name: V13 inverse heldout baseline software witness
on:
  push:
    branches:
      - codex/v13-worldmodel-inverse-heldout-baseline-20261029-auto10z
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run focused witness, retain original failure
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-inverse-baseline"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/v13/world_model.py v13/code/tests/test_worldmodel_inverse_heldout_baseline_20261029.py > "$e/SOURCE_BLOBS.txt"
          python3 -m venv "$RUNNER_TEMP/v13venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input numpy==2.2.6 > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests "$py" -m unittest -v test_worldmodel_inverse_heldout_baseline_20261029) > "$e/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$e/FOCUSED_EXIT.txt"
          "$py" -m compileall -q v13/code/v13/world_model.py v13/code/tests/test_worldmodel_inverse_heldout_baseline_20261029.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 20363b1f3052276254d23878feeb2f92adeff2ca --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 20363b1f3052276254d23878feeb2f92adeff2ca HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve bounded raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-inverse-heldout-${{ github.sha }}
          path: ${{ runner.temp }}/v13-inverse-baseline/
          if-no-files-found: error
      - name: Enforce tests and evidence
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-inverse-baseline"
          for n in VENV DEPS FOCUSED COMPILE PRIVACY DIFF; do
            test "$(cat "$e/${n}_EXIT.txt")" = 0 || { echo "$n failed; raw retained"; exit 1; }
          done
