name: V13 Run12N JEF exact source budget SHADOW cross-organ baseline
on:
  push:
    branches: [assistant/v13-run12n-jef-source-baseline-20261030]
    paths:
      - '.github/workflows/v13-run12n-jef-source-baseline-preflight.yml'
permissions:
  contents: read
jobs:
  source-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned prospective zero-offer witness, source tests and privacy
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run12n-jefbaseline"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          e8bbbaf04df479b32db40480e1fcc8bad223f48b v13/code/docs/fixtures/c2_body_observer_off_run12n_20261030.json
          cec2bf1c112774d6499ae6beaf44375bde0359b8 v13/code/docs/C2_BODY_OBSERVER_OFF_RUN12N_PREREG_20261030.md
          716b71401d3a228252beb8b4903e9ad656db75c5 v13/code/scripts/c2_body_observer_off_run12n.py
          a78f65b1c50f07bde3f845a492f8f41385e355c8 v13/code/scripts/c2_body_observer_off_verify_run12n.py
          adc3a9f23098fdd61b66ce0f1443ee9a015119c0 v13/code/tests/test_c2_body_observer_off_run12n.py
          6063727eef91af7087d3c07ef0e6b1d9ddf9e403 v13/code/tests/test_c2_body_observer_off_lifecycle_integration.py
          65d8d8b22f395b626b65b4f7923ad2aef08c2b62 v13/code/tests/test_run12n_jef_source_baseline.py
          cc8188590379a1519219028940c4c96e95a7d6db v13/code/v13/agi/budget_en_source_shadow.py
          ac21a1d33c18081d0e73ebaed4c87ec5ad9b1d89 v13/code/tests/test_budget_en_source_shadow_run11y.py
          c083fcc67937b79445e6ae5fd0c4f34d9190c725 v13/code/tests/test_c2_body_observer_off_verify_run12n.py
          d274a66b8ceb801c741bbffe1456611b43603208 v13/code/scripts/c2_body_disjoint_paired181_run11v.py
          cee1980787f1217e9a7aa2a1f180686b4add67fb v13/code/scripts/c2_strict_native_compat_run12k.py
          22ed11e4a53d9eeae8fbc74a1753082b5785be2b v13/code/v13/runtime.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run12n-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run12n-venv/bin/python"
          "$py" -m pip install --no-input --disable-pip-version-check --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts timeout 180s "$py" -m unittest -v tests.test_c2_body_observer_off_run12n tests.test_c2_body_observer_off_verify_run12n tests.test_c2_body_observer_off_lifecycle_integration tests.test_run12n_jef_source_baseline tests.test_budget_en_source_shadow_run11y tests.test_c2_c3_body_paired_run12m tests.test_c2_c3_body_paired_verify_run12m tests.test_c2_route_runtime_strict_run12j) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
            PYTHONPATH=v13/code "$py" - <<'PY' > "$e/COHORT_RAW.log" 2>&1
          from scripts import c2_body_observer_off_run12n as m
          from scripts import c2_body_disjoint_paired181_run11v as frozen
          f=m.load_fixture('v13/code/docs/fixtures/c2_body_observer_off_run12n_20261030.json')
          assert m.SEED==197 and m.fixture_hash(f['cases'])==m.FIXTURE_SHA256
          assert m.ARMS==('A_C3_ONLY','B_B1_ONLY','C_B2_ONLY','F_NATIVE_AUTO')
          assert len(m.ARM_ORDER)==4 and len(f['cases'])==4
          assert frozen.SEED==181
          print('RUN12N_NEW_SEED197_ZERO_OFFER_SOURCE_ONLY_VERIFIED')
          PY
            echo "$?" > "$e/COHORT_EXIT.txt"
          else
            echo SKIPPED_PINS_OR_DEPS_RED > "$e/TEST_RAW.log"
            echo 99 > "$e/TEST_EXIT.txt"
            echo SKIPPED_PINS_OR_DEPS_RED > "$e/COHORT_RAW.log"
            echo 99 > "$e/COHORT_EXIT.txt"
          fi
          "$py" -m py_compile v13/code/scripts/c2_body_observer_off_run12n.py v13/code/scripts/c2_body_observer_off_verify_run12n.py v13/code/tests/test_c2_body_observer_off_run12n.py v13/code/tests/test_c2_body_observer_off_verify_run12n.py v13/code/tests/test_c2_body_observer_off_lifecycle_integration.py v13/code/tests/test_run12n_jef_source_baseline.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 986d7da9e0a546bb18d3c450284118193c66caf3 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 986d7da9e0a546bb18d3c450284118193c66caf3 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original preflight raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run12n-jefbaseline-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run12n-jefbaseline/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce source-only preflight, no native or utility promotion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run12n-jefbaseline"
          for stage in PINS VENV DEPS TEST COHORT COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "${stage} RED; original raw retained"
              tail -80 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN12N_JEF_SOURCE_BASELINE_GREEN_NO_AUTHORITY_OR_GATE
