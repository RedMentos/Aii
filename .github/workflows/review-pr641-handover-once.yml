name: PR641 route handover unique-event focused RED/GREEN
on:
  push:
    branches:
      - codex/review-claude-pr641-handover-once-20261027
    paths:
      - '.github/workflows/review-pr641-handover-once.yml'
      - 'v13/code/v13/route_supersede.py'
      - 'v13/code/tests/test_review_pr641_handover_once.py'
permissions:
  contents: read
concurrency:
  group: v13-review641-handover
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.sha }}
      - name: Install isolated deps
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/rv641once"
          timeout 240s "$RUNNER_TEMP/rv641once/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Preserve actual results
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/rv641onceproof"
          git rev-parse HEAD > "$RUNNER_TEMP/rv641onceproof/HEAD.txt"
          sha256sum v13/code/v13/route_supersede.py v13/code/tests/test_review_pr641_handover_once.py > "$RUNNER_TEMP/rv641onceproof/SHA256.txt"
          (cd v13/code && PYTHONPATH="$PWD:$PWD/scripts" "$RUNNER_TEMP/rv641once/bin/python" -m unittest -v tests.test_review_pr641_handover_once tests.test_route_words) > "$RUNNER_TEMP/rv641onceproof/UNIT_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/rv641onceproof/UNIT_EXIT.txt"
          "$RUNNER_TEMP/rv641once/bin/python" v13/code/scripts/public_repo_privacy_scan.py --base 4abc439c12d38e7034a3506b40005248e685fb1f --head HEAD > "$RUNNER_TEMP/rv641onceproof/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/rv641onceproof/PRIVACY_EXIT.txt"
          exit 0
      - name: Upload original raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review641-handover-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/rv641onceproof/
          if-no-files-found: error
      - name: Enforce
        run: |
          set -euo pipefail
          for n in UNIT PRIVACY; do
            test "$(cat "$RUNNER_TEMP/rv641onceproof/${n}_EXIT.txt")" = 0 || { cat "$RUNNER_TEMP/rv641onceproof/${n}_RAW.log"; exit 1; }
          done
          tail -15 "$RUNNER_TEMP/rv641onceproof/UNIT_RAW.log"
