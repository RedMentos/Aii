name: V13 Run11 bilingual arithmetic candidate native Age0 heldout
on:
  push:
    branches:
      - assistant/v13-run11-arith-heldout-native-collector-20261028
    paths:
      - '.github/workflows/run11-bilingual-arith-candidate-native-20261028.yml'
permissions:
  contents: read
concurrency:
  group: v13-run11-bilingual-arith-native-exclusive
  cancel-in-progress: false
jobs:
  candidate-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      V13_NO_AUTOSTART: "1"
      NEEDLE_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin source, bootstrap real native and collect frozen public heldout serially
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-bilingual-candidate-native"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          68e7ed1352800174972558f1e0b0683a42c8689a v13/code/v13/runtime.py
          646c6f31b52ca2664c1952af7c7e842fc3e20885 v13/code/v13/prompts.py
          efda7aa1aa5729e974d0d641870d4da05d21c961 v13/code/v13/runners.py
          bd035cf8029850cce00b179edf533e53bf24358a v13/code/v13/models.py
          9640b2ce9abfc08cb82f7b550e18d856d9513f08 v13/code/v13/toolstep.py
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          954a3f468f10195fbce12d27f68585ee7edee2c9 v13/code/specs/control_tools.json
          ceda0a5cb506cf09885652b24893cf7d8fdff63b v13/code/specs/age0-bilingual-arith-heldout-20261028.json
          0348b17dedc0e4142a73a8ad8c93a57a2c7d6491 v13/code/scripts/age0_bilingual_arith_scorer.py
          a0a94ce08983b0621990c5b9c2f4712463e146bb v13/code/scripts/age0_bilingual_arith_native_collector.py
          BLOBS
          : > "$e/BLOBS_RAW.log"
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            printf '%s %s %s\n' "$want" "$got" "$path" >> "$e/BLOBS_RAW.log"
            if [ "$want" != "$got" ]; then echo BLOB_MISMATCH >> "$e/BLOBS_RAW.log"; fi
          done < "$e/EXPECTED_BLOBS.txt"
          if grep -q BLOB_MISMATCH "$e/BLOBS_RAW.log"; then echo 1 > "$e/BLOBS_EXIT.txt"; else echo 0 > "$e/BLOBS_EXIT.txt"; fi
          python3 -m venv "$RUNNER_TEMP/v13-bilingual-candidate-native-venv"
          py="$RUNNER_TEMP/v13-bilingual-candidate-native-venv/bin/python"
          "$py" -m pip install --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          echo "$?" > "$e/INSTALL_EXIT.txt"
          home="$RUNNER_TEMP/v13-bilingual-candidate-fresh-home"
          if [ "$(cat "$e/BLOBS_EXIT.txt")" = 0 ] && [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ] && [ ! -e "$home" ]; then
            timeout --signal=TERM --kill-after=10s 14m env PYTHONPATH=v13/code "$py" -m v13.bootstrap --home "$home" > "$e/BOOTSTRAP_RAW.log" 2>&1
            echo "$?" > "$e/BOOTSTRAP_EXIT.txt"
          else
            echo SKIPPED_SOURCE_INSTALL_OR_HOME_RED > "$e/BOOTSTRAP_RAW.log"
            echo SKIPPED_RED > "$e/BOOTSTRAP_EXIT.txt"
          fi
          if [ "$(cat "$e/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            "$py" - "$home" > "$e/AGE0_PREFLIGHT_RAW.log" 2>&1 <<'PY'
          import json,pathlib,sys
          h=pathlib.Path(sys.argv[1]);cfg=json.loads((h/'config/settings.json').read_text())
          assert cfg['seed']==13 and cfg['learning_mode']=='RECORD_ONLY' and cfg['system_stage']==0
          assert cfg.get('jepa_weight',0)==0 and not cfg['latents_enabled']
          assert cfg['b2_control']=='two_body'
          assert not (h/'data/db/brain.sqlite3').exists()
          print('FRESH_AGE0_SEED13_TWO_BODY_NO_DB')
          PY
            echo "$?" > "$e/AGE0_PREFLIGHT_EXIT.txt"
          else
            echo SKIPPED_BOOTSTRAP_RED > "$e/AGE0_PREFLIGHT_RAW.log"
            echo SKIPPED_RED > "$e/AGE0_PREFLIGHT_EXIT.txt"
          fi
          if [ "$(cat "$e/AGE0_PREFLIGHT_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=15s 33m env PYTHONPATH=v13/code "$py" -m scripts.age0_bilingual_arith_native_collector --home "$home" --out "$e/native" --prompt-git-blob 646c6f31b52ca2664c1952af7c7e842fc3e20885 --seconds-per-turn 120 > "$e/CAPTURE_RAW.log" 2>&1
            echo "$?" > "$e/CAPTURE_EXIT.txt"
          else
            echo SKIPPED_PREFLIGHT_RED > "$e/CAPTURE_RAW.log"
            echo SKIPPED_RED > "$e/CAPTURE_EXIT.txt"
          fi
          if [ "$(cat "$e/CAPTURE_EXIT.txt")" = 0 ]; then
            PYTHONPATH=v13/code "$py" - "$e/native" > "$e/REPORT_CHECK_RAW.log" 2>&1 <<'PY'
          import hashlib,json,pathlib,sys
          from scripts.age0_bilingual_arith_scorer import ROLE_MODELS,CANDIDATE_PROMPT,CATALOG_BLOB
          n=pathlib.Path(sys.argv[1])
          m=json.loads((n/'ANSWERS.json').read_text());r=json.loads((n/'CAPTURE_RESULT.json').read_text())
          rows=m['rows'];raw=(n/'RAW_ROWS.jsonl').read_text().splitlines()
          assert len(rows)==len(raw)==16 and r['rows']==r['final_rows']==16
          assert m['prompt_git_blob']==CANDIDATE_PROMPT and m['model_catalog_git_blob']==CATALOG_BLOB
          assert all(x['status']=='FINAL' and x['tool_call'] is None and x['learning_mode']=='RECORD_ONLY' and x['jepa_weight']==0 for x in rows)
          assert all(x['runner_role'] in ROLE_MODELS and x['runner_model_sha256']==ROLE_MODELS[x['runner_role']] for x in rows)
          assert all(json.loads(line)['error'] is None for line in raw)
          assert hashlib.sha256((n/'RAW_ROWS.jsonl').read_bytes()).hexdigest()==r['raw_sha256']
          assert not r['phone_measured'] and not r['whole_system_complete'] and r['jepa_weight']==0
          print('CANDIDATE_REAL_NATIVE_16_FINAL_ROWS_ONLY_NO_PROMOTION')
          PY
            echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          else
            echo SKIPPED_CAPTURE_RED > "$e/REPORT_CHECK_RAW.log"
            echo SKIPPED_RED > "$e/REPORT_CHECK_EXIT.txt"
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 3c030cd40dd198d80b2792c2d87d60e1e48cafe0 --head HEAD > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 3c030cd40dd198d80b2792c2d87d60e1e48cafe0 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-bilingual-candidate-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-bilingual-candidate-native/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce exact native evidence and unchanged Age0 gates
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-bilingual-candidate-native"
          for name in BLOBS INSTALL BOOTSTRAP AGE0_PREFLIGHT CAPTURE REPORT_CHECK PRIVACY DIFF; do
            if [ "$(cat "$e/${name}_EXIT.txt")" != 0 ]; then
              echo "$name RED; raw retained, no native quality or Age0 promotion"
              tail -80 "$e/${name}_RAW.log" || true
              exit 1
            fi
          done
          echo 'BILINGUAL_CANDIDATE_LINUX_NATIVE_ONLY_NO_REDM I_OR_GATE_PROMOTION'
