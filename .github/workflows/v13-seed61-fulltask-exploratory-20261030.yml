name: V13 seed61 posthoc full-task source-bound audit
on:
  push:
    branches:
      - assistant/v13-seed61-isolated-body-postclose-20261030
    paths:
      - '.github/workflows/v13-seed61-fulltask-exploratory-20261030.yml'
permissions:
  contents: read
  actions: read
jobs:
  posthoc-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read-only exact original seed61 raw and five adversarial tests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-seed61-posthoc"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          71bfedca12e387996dce73d27651c3a3357a59a2 v13/code/scripts/seed61_fulltask_exploratory_20261030.py
          d7e245391d427d386bb57e686eb4563669c88bf3 v13/code/tests/test_seed61_fulltask_exploratory_20261030.py
          631df9e4932bb7ace43d95dd4097c1733dc852c7 v13/code/scripts/c2_isolated_postclose_seed61_20261030.py
          45e3008b1bc38d0b7ebaeeda60e7292b1eb28e62 v13/code/docs/C2_NATIVE_ISOLATED_SEED61_PREREG_20261030.md
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          red=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then red=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$red" > "$e/PINS_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests python3 -m unittest -v tests.test_seed61_fulltask_exploratory_20261030) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          curl -fsSL --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/RedMentos/Aii/actions/artifacts/12955848461/zip" -o "$e/ORIGINAL.zip" > "$e/DOWNLOAD_RAW.log" 2>&1
          echo "$?" > "$e/DOWNLOAD_EXIT.txt"
          if [ "$(cat "$e/DOWNLOAD_EXIT.txt")" = 0 ]; then
            python3 v13/code/scripts/seed61_fulltask_exploratory_20261030.py --zip "$e/ORIGINAL.zip" --sha256 5296bf6bdf9fda8ac2c2b95ec9b73e10a1a1eb53574038c803a9d3ac12c55ad1 --out "$e/result.json" > "$e/AUDIT_RAW.log" 2>&1
            echo "$?" > "$e/AUDIT_EXIT.txt"
          else
            echo SKIPPED_NO_ORIGINAL > "$e/AUDIT_RAW.log"
            echo SKIPPED_RED > "$e/AUDIT_EXIT.txt"
          fi
          if [ -f "$e/result.json" ]; then
            python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));assert d["schema"]=="v13.seed61.fulltask.posthoc.exploratory.v1";assert len(d["rows"])==24 and len(d["by_arm"])==6;assert d["not_preregistered"] is True and d["not_a_gate"] is True and d["not_native_rerun"] is True;assert d["original_inner_manifest_present"] is False;assert all(d[k] is False for k in ("step2_gate_promoted","b3_promoted","body_jepa_available","redmi_measured","whole_system_complete"));assert d["jepa_weight"]==0' "$e/result.json" > "$e/REPORT_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          else
            echo NO_RESULT > "$e/REPORT_CHECK_RAW.log"
            echo SKIPPED_NO_RESULT > "$e/REPORT_CHECK_EXIT.txt"
          fi
          python3 -m py_compile v13/code/scripts/seed61_fulltask_exploratory_20261030.py v13/code/tests/test_seed61_fulltask_exploratory_20261030.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 84976e41aab1c42bff16bfaee0fbe6b673dd3752 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 84976e41aab1c42bff16bfaee0fbe6b673dd3752 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          rm -f "$e/ORIGINAL.zip"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original posthoc report and all stage logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-seed61-posthoc-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-seed61-posthoc/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce posthoc integrity, not a native or utility gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-seed61-posthoc"
          for stage in PINS TEST DOWNLOAD AUDIT REPORT_CHECK COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original failure preserved"
              tail -70 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'SEED61_POSTHOC_ONLY_NO_GATE_NO_NATIVE_RERUN'
