name: V13 seed79 isolated native C3 German typed read
on:
  push:
    branches: [assistant/v13-c3-de-typed-read-native-seed79-20261030]
    paths:
      - '.github/workflows/v13-c3-de79-native-20261030.yml'
permissions:
  contents: read
concurrency:
  group: v13-step2-budget-paired-native-20261030
  cancel-in-progress: false
jobs:
  native-c3:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned native C3 reader, preserve all source and raw errors
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-c3-de79-native"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          printf '%s\n' \
            '1f4af6ba056d26ada92df5fc2bc569cf166d6609 v13/code/docs/C3_DE_NATIVE_TYPED_READ_SEED79_PREREG_20261030.md' \
            'd0a840c9546fd87c3f7ef15f450b4650aaa06863 v13/code/specs/c3_de_native_typed_read_seed79.json' \
            'a9bbdca02aff7b30cc4a1d44ddb1b80b903da106 v13/code/scripts/c3_de_native_typed_read_seed79.py' \
            '4ed3091be12b8548b889116298f0deb4db70a8c2 v13/code/scripts/c3_de_native_typed_read_seed79_audit.py' \
            '4e4cecf985e980860a83faa6dc0ac472f29a1339 v13/code/tests/test_c3_de_native_typed_read_seed79_20261030.py' \
            '35893e9f829a591ffb9a792a73cef9bce986b3c4 v13/code/v13/agi/listarith.py' \
            'efda7aa1aa5729e974d0d641870d4da05d21c961 v13/code/v13/runners.py' \
            '7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json' \
            > "$e/EXPECTED_BLOBS.txt"
          red=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then red=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$red" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/de79-native-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/de79-native-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          if [ "$red" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_c3_de_native_typed_read_seed79_20261030) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else
            echo SKIPPED_PIN_OR_DEPS_RED > "$e/TEST_RAW.log"
            echo SKIPPED_RED > "$e/TEST_EXIT.txt"
          fi
          export V13_HOME="$RUNNER_TEMP/v13-c3-de79-installed"
          if [ "$(cat "$e/TEST_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 15m env PYTHONPATH=v13/code "$py" -m v13.bootstrap --home "$V13_HOME" > "$e/BOOTSTRAP_RAW.log" 2>&1
            echo "$?" > "$e/BOOTSTRAP_EXIT.txt"
          else
            echo SKIPPED_TEST_RED > "$e/BOOTSTRAP_RAW.log"
            echo SKIPPED_RED > "$e/BOOTSTRAP_EXIT.txt"
          fi
          if [ "$(cat "$e/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 15m env PYTHONPATH=v13/code "$py" v13/code/scripts/c3_de_native_typed_read_seed79.py --home "$V13_HOME" --out "$e/pilot" > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else
            echo SKIPPED_BOOTSTRAP_RED > "$e/NATIVE_RAW.log"
            echo SKIPPED_RED > "$e/NATIVE_EXIT.txt"
          fi
          if [ -f "$e/pilot/report.json" ]; then
            env PYTHONPATH=v13/code "$py" v13/code/scripts/c3_de_native_typed_read_seed79_audit.py --dir "$e/pilot" --out "$e/POSTHOC_AUDIT.json" > "$e/REPORT_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          else
            echo NO_NATIVE_REPORT > "$e/REPORT_CHECK_RAW.log"
            echo SKIPPED_NO_REPORT > "$e/REPORT_CHECK_EXIT.txt"
          fi
          "$py" -m py_compile v13/code/scripts/c3_de_native_typed_read_seed79.py v13/code/scripts/c3_de_native_typed_read_seed79_audit.py v13/code/tests/test_c3_de_native_typed_read_seed79_20261030.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 30bcf62f22c70107f920276263df6a7e9f8872de --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 30bcf62f22c70107f920276263df6a7e9f8872de HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-c3-de79-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-c3-de79-native/
          retention-days: 30
          if-no-files-found: error
      - name: Verify original raw and no promotion
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-c3-de79-native"
          for stage in PINS VENV DEPS TEST BOOTSTRAP NATIVE REPORT_CHECK COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained; no native gate"
              tail -80 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          if grep -q '"status": "PILOT_PARTIAL_RED"' "$e/pilot/report.json"; then
            echo "PILOT_PARTIAL_RED; no native proof or gate"
            exit 1
          fi
          echo "SEED79_LINUX_NATIVE_C3_READER_INTERMEDIATE_ONLY_NO_STEP2_B3_JEPA_REDMI_OR_WHOLE_SYSTEM_GATE"
