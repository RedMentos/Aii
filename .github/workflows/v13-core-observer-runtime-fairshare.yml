name: V13 Core observer Runtime fair-share regression
on:
  push:
    branches:
      - gpt6/core-observer-runtime-regression-20261113
      - gpt6/core-fairshare-error-diagnostics-20261114
  pull_request:
    paths:
      - 'v13/code/tests/test_observer_runtime_fairshare_integration.py'
      - 'v13/code/v13/observer_schedule.py'
      - 'v13/code/v13/runtime.py'
      - '.github/workflows/v13-core-observer-runtime-fairshare.yml'
permissions:
  contents: read
jobs:
  observer-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runtime and observer integration
        working-directory: v13/code
        run: |
          python -m pip install pytest
          python -m compileall -q tests/test_observer_runtime_fairshare_integration.py
          python -m pytest -q tests/test_observer_runtime_fairshare_integration.py tests/test_observer_fair_deadline.py tests/test_observer_schedule.py
