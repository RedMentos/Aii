name: V13 JEPA Runtime Replay Retention Ablation
on:
  pull_request:
    paths:
      - 'v13/code/tests/runtime_jepa_replay_ablation_disposable_cases_20261111.py'
      - 'v13/code/tests/test_runtime_jepa_replay_ablation_20261111.py'
      - '.github/workflows/v13-jepa-runtime-replay-retention.yml'
  push:
    branches:
      - 'jepa/runtime-retention-replay-20261111-0730'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pytest
      - run: python -m pytest -q -s v13/code/tests/test_runtime_jepa_replay_ablation_20261111.py
