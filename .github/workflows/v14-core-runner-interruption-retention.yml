name: V14 Core fastpath and interrupted runner warm retention

on:
  pull_request:
    paths:
      - "v13/code/v13/runners.py"
      - "v13/code/tests/test_runner_interruption_retention.py"
      - "v13/code/tests/test_arithmetic_fastpath_runtime.py"
      - "v13/code/tests/test_arithmetic_fastpath.py"
      - "v13/code/v13/arithmetic_fastpath.py"
      - "v13/code/v13/runtime.py"
      - ".github/workflows/v14-core-runner-interruption-retention.yml"
  push:
    branches:
      - "core/v14-runner-warm-retention-current-stack-20261125-run1"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused Runtime test dependencies
        run: python -m pip install pytest numpy psutil pyyaml
      - name: Compile exact runner and test
        env:
          PYTHONPATH: v13/code
        run: python -m py_compile v13/code/v13/runners.py v13/code/v13/runtime.py v13/code/v13/arithmetic_fastpath.py v13/code/tests/test_runner_interruption_retention.py v13/code/tests/test_arithmetic_fastpath.py v13/code/tests/test_arithmetic_fastpath_runtime.py
      - name: Test warm retention and fail-closed interruption cleanup
        env:
          PYTHONPATH: v13/code
        run: python -m pytest -q v13/code/tests/test_runner_interruption_retention.py
      - name: Test exact arithmetic fastpath and full-path fallthrough
        env:
          PYTHONPATH: v13/code
        run: python -m pytest -q v13/code/tests/test_arithmetic_fastpath.py v13/code/tests/test_arithmetic_fastpath_runtime.py
