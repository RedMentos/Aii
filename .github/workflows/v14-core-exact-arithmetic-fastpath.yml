name: V14 Core exact arithmetic fastpath

on:
  push:
    branches: [gpt6/v14-core-exact-arithmetic-fastpath-20261121]
    paths:
      - "v13/code/v13/runtime.py"
      - "v13/code/v13/focal.py"
      - "v13/code/v13/broker.py"
      - "v13/code/v13/contracts.py"
      - "v13/code/v13/world.py"
      - "v13/code/v13/arithmetic_reflex.py"
      - "v13/code/tests/test_arithmetic_reflex.py"
      - "v13/code/tests/test_v14_exact_arithmetic_runtime.py"
      - ".github/workflows/v14-core-exact-arithmetic-fastpath.yml"
  pull_request:
    branches: [gpt6/v13-private-remote-bridge-20261111]
    paths:
      - "v13/code/v13/runtime.py"
      - "v13/code/v13/focal.py"
      - "v13/code/v13/broker.py"
      - "v13/code/v13/contracts.py"
      - "v13/code/v13/world.py"
      - "v13/code/v13/arithmetic_reflex.py"
      - "v13/code/tests/test_arithmetic_reflex.py"
      - "v13/code/tests/test_v14_exact_arithmetic_runtime.py"
      - ".github/workflows/v14-core-exact-arithmetic-fastpath.yml"
  workflow_dispatch:

jobs:
  exact-arithmetic-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 psutil PyYAML pytest==9.2.0
      - name: Compile changed runtime and regression files
        run: |
          python -m py_compile \
            v13/code/v13/runtime.py \
            v13/code/v13/focal.py \
            v13/code/v13/broker.py \
            v13/code/v13/contracts.py \
            v13/code/v13/world.py \
            v13/code/v13/arithmetic_reflex.py \
            v13/code/tests/test_arithmetic_reflex.py \
            v13/code/tests/test_v14_exact_arithmetic_runtime.py
      - name: Run fastpath, C5, world, broker and output-policy regressions
        env:
          PYTHONPATH: v13/code
        run: |
          python -m pytest -q \
            v13/code/tests/test_arithmetic_reflex.py \
            v13/code/tests/test_v14_exact_arithmetic_runtime.py \
            v13/code/tests/test_broker.py \
            v13/code/tests/test_output_policy.py \
            v13/code/tests/test_focal.py \
            v13/code/tests/test_actionlearn.py \
            v13/code/tests/test_world_state.py
