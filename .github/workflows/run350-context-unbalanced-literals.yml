name: V13 Run350 Context OS unbalanced literal exactness
on:
  pull_request:
    paths:
      - '.github/workflows/run350-context-unbalanced-literals.yml'
      - 'v13/code/v13/context_os.py'
      - 'v13/code/tests/test_context_unbalanced_literals_run350.py'
      - 'v13/code/tests/test_context_inline_plan_run199.py'
      - 'v13/code/tests/test_context_inline_guard_run198.py'
      - 'v13/code/docs/proofs/continuation-20261025/run350-context-unbalanced-literals/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 50
      - name: Exact head, source SHA256 and isolated dependencies
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/RUN350_HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/run350venv"
          "$RUNNER_TEMP/run350venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
          sha256sum v13/code/v13/context_os.py v13/code/tests/test_context_unbalanced_literals_run350.py v13/code/tests/test_context_inline_plan_run199.py v13/code/tests/test_context_inline_guard_run198.py | tee "$RUNNER_TEMP/RUN350_SOURCE_SHA256SUMS.txt"
      - name: Context OS source exactness and runtime integration tests
        working-directory: v13/code
        run: |
          set -uo pipefail
          "$RUNNER_TEMP/run350venv/bin/python" -m compileall -q v13/context_os.py tests/test_context_unbalanced_literals_run350.py
          PYTHONPATH="$PWD" "$RUNNER_TEMP/run350venv/bin/python" -m unittest -v \
            tests.test_context_unbalanced_literals_run350 \
            tests.test_context_inline_plan_run199 \
            tests.test_context_inline_guard_run198 \
            tests.test_context_os \
            tests.test_context_exact_pin_run73 \
            tests.test_context_exact_quotes_run93 \
            2>&1 | tee "$RUNNER_TEMP/RUN350_TESTS_RAW.log"
          exit ${PIPESTATUS[0]}
      - name: Public repository privacy scan
        run: |
          set -euo pipefail
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree \
            2>&1 | tee "$RUNNER_TEMP/RUN350_PRIVACY_RAW.log"
      - name: Close raw receipts
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          find . -maxdepth 1 -type f -name 'RUN350_*' ! -name RUN350_SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > RUN350_SHA256SUMS.txt
      - name: Preserve raw RED, PASS or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V13-Run350-Context-Literals-Raw-${{ github.sha }}
          path: ${{ runner.temp }}/RUN350_*
          if-no-files-found: warn
          retention-days: 30
