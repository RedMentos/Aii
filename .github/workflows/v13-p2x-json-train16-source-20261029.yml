name: V13 P2X JSON train16 paired source-only admission

on:
  push:
    branches: [codex/v13-p2x-json-train16-inference-20261029]
    paths:
      - '.github/workflows/v13-p2x-json-train16-source-20261029.yml'
      - 'v13/code/scripts/p2x_json_train16_eval.py'
      - 'v13/code/tests/test_p2x_json_train16_eval_20261029.py'

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Preserve pinned source-only 32-call plan and synthetic replay
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-p2x-json-train16-source"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          c5fb3ca3d56ed73e7fc301137f0585f71666e67e v13/code/scripts/p2x_json_train16_eval.py
          1ee7dc6751d4483e5df1831adc819acaa25a08a6 v13/code/tests/test_p2x_json_train16_eval_20261029.py
          c5f2d6dc5802ed6bb08b33d2f5b75a3a96ab4dd7 v13/code/docs/coordination/P2X_JSON_TRAIN16_EVAL_PREREG_20261029.md
          f9182daef9611544efb7a0e2346177b05612be6b v13/code/scripts/p2x_c3_json_target_fourstep.py
          29fa99031862f534afe835a3a997ecb62b9b1752 v13/code/scripts/p2x_candidate360_standalone.py
          8135fa2792df2c541dc1719e49d941c775703697 v13/code/scripts/p2x_disjoint_receiver_trainset.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          source_red=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            printf '%s %s %s\n' "$want" "$got" "$path" >> "$e/SOURCE_RAW.log"
            if [ "$want" != "$got" ]; then source_red=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$source_red" > "$e/SOURCE_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests:scripts python3 -m unittest -v tests.test_p2x_json_train16_eval_20261029) > "$e/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$e/FOCUSED_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:scripts python3 -m scripts.p2x_json_train16_eval --plan-check) > "$e/PLAN_RAW.json" 2>&1
          echo "$?" > "$e/PLAN_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/p2x_json_train16_eval.py v13/code/tests/test_p2x_json_train16_eval_20261029.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base f507460bb545f074018f6dbec0d19d9bf7a6ccd0 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check f507460bb545f074018f6dbec0d19d9bf7a6ccd0 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original source-only raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-p2x-json-train16-source-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-p2x-json-train16-source/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce source-only gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-p2x-json-train16-source"
          for n in SOURCE FOCUSED PLAN COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; raw preserved"
              tail -50 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo P2X_TRAIN16_SOURCE_ONLY_NO_NATIVE_CLAIM
