name: V13 Run84 dual-source C3 postgen integrity software SHADOW
on:
  push:
    branches: [assistant/v13-run84-dual-source-c3-postgen-20261031-auto11]
    paths: ['.github/workflows/v13-run84-dual-source-c3-postgen.yml']
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Real SQLite callback mutation and source integrity counterexamples
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run84-postgen"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run84-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run84-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo SKIPPED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=5s 7m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m unittest tests.test_run84_dual_source_c3_postgen tests.test_run82_jef_b1b2_c3_dual_source tests.test_jef_c3_schema_source_recheck_shadow -v > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          python3 -m compileall -q v13/code/v13/jef_b1b2_c3_postgen_shadow.py v13/code/tests/test_run84_dual_source_c3_postgen.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 5ca8b4cc24f03238bca9846c284cb9efd53e9979 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 5ca8b4cc24f03238bca9846c284cb9efd53e9979 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Retain original software evidence including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run84-postgen-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run84-postgen/
          if-no-files-found: error
          retention-days: 90
      - name: Require all checks
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-run84-postgen"
          for s in VENV DEPS TEST COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || { cat "$e/TEST_RAW.log"; exit 1; }
          done
          tail -n 5 "$e/TEST_RAW.log"
          echo RUN84_POSTGEN_SOFTWARE_SHADOW_ONLY
