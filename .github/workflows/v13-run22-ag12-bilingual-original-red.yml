name: V13 Run22 AG12 bilingual compare original RED
on:
  push:
    branches: [assistant/v13-run22-ag12-bilingual-compare-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run22-ag12-bilingual-original-red.yml'
permissions:
  contents: read
jobs:
  compare-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Original absent read-only bilingual diagnostic
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run22-original-red"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          7a83e74e3472f4386c724fb4133714790382e32e v13/code/docs/AG12_BILINGUAL_COMPARE_PREREG_RUN22_20261030.md
          0e0399e435ef04a8b93895e29ba2bd60f0a03c9c v13/code/tests/test_ag12_bilingual_compare_run22.py
          27a5f57885a2836d0a3fbd4cf1829c0a1ab4edce v13/code/v13/agi/__init__.py
          a1cab60363814cb86472a42defb5089d4cdbd432 v13/code/v13/agi/generality.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 4m env PYTHONPATH=. python3 -m unittest -v tests.test_ag12_bilingual_compare_run22) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m py_compile v13/code/v13/agi/__init__.py v13/code/tests/test_ag12_bilingual_compare_run22.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base b02a73917bdb2b5aa451890e41af988c83bb2f5f --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check b02a73917bdb2b5aa451890e41af988c83bb2f5f HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run22-original-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run22-original-red/
          retention-days: 30
          if-no-files-found: error
      - name: Require test-first RED and other clean stages
        if: always()
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run22-original-red"
          test "$(cat "$e/PINS_EXIT.txt")" = 0
          test "$(cat "$e/COMPILE_EXIT.txt")" = 0
          test "$(cat "$e/PRIVACY_EXIT.txt")" = 0
          test "$(cat "$e/DIFF_EXIT.txt")" = 0
          test "$(cat "$e/TEST_EXIT.txt")" != 0
          grep -q "No module named 'v13.agi.language_compare'" "$e/TEST_RAW.log"
          echo 'RUN22_ORIGINAL_NO_BILINGUAL_DIAGNOSTIC_RED'
