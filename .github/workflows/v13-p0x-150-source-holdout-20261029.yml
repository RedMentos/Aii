name: V13 P0X independent 150-row source holdout software preflight
on:
  push:
    branches: [codex/v13-p0-independent-150-cohort-20261029]
    paths:
      - '.github/workflows/v13-p0x-150-source-holdout-20261029.yml'
      - 'v13/code/scripts/p0x_independent_source_holdout.py'
      - 'v13/code/tests/test_p0x_independent_source_holdout.py'
permissions:
  contents: read
concurrency:
  group: v13-p0x-source-only
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Exact prereg, source tests, structural oracle, privacy
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-p0x-150-source"
          mkdir -p "$e"
          trap '(cd "$e"; find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)' EXIT
          git rev-parse HEAD > "$e/HEAD.txt"
          check() { [ "$(git hash-object "$2")" = "$1" ]; }
          {
            check 312f8cb0acd591fe9c17a3e87a299f21d92465fd v13/code/docs/proofs/continuation-20261029/P0X_150_SOURCE_HOLDOUT_PREREG.md
            check 6063c57d12248a2b74466e62703537b3cd025f34 v13/code/docs/proofs/continuation-20261029/P0X_150_SOURCE_HOLDOUT_BUILD_STATE.json
            check 7ec4e877ad5ea3eed1c60102dac3baa15391dd2b v13/code/scripts/p0x_independent_source_holdout.py
            check edb1ed639261bcaedaf2885f58baa42c5f55f620 v13/code/tests/test_p0x_independent_source_holdout.py
            check 218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
            git merge-base --is-ancestor d089f08fbf4ee7c3d3d1c9b6789320974f99731b HEAD
            echo P0X_SOURCE_PINS_OK
          } > "$e/SOURCE_RAW.log" 2>&1
          python3 -m venv "$RUNNER_TEMP/v13-p0x-source-venv"
          py="$RUNNER_TEMP/v13-p0x-source-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          python3 -m compileall -q v13/code/scripts/p0x_independent_source_holdout.py v13/code/tests/test_p0x_independent_source_holdout.py > "$e/COMPILE_RAW.log" 2>&1
          (cd v13/code && timeout --signal=TERM --kill-after=5s 180s "$py" -m unittest -v tests.test_p0x_independent_source_holdout tests.test_hb0_split_information_cohort tests.test_hb1a_two_body_native_pilot) > "$e/FOCUSED_RAW.log" 2>&1
          (cd v13/code && "$py" -m scripts.p0x_independent_source_holdout) > "$e/ORACLE_RAW.json" 2>&1
          python3 v13/code/scripts/public_repo_privacy_scan.py --base d089f08fbf4ee7c3d3d1c9b6789320974f99731b --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          grep -q CLEAN "$e/PRIVACY_RAW.log"
          git diff --check d089f08fbf4ee7c3d3d1c9b6789320974f99731b HEAD
          echo P0X_150_SOURCE_ONLY_NO_NATIVE_NO_GATE > "$e/STATUS.txt"
      - name: Preserve original raw including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-p0x-150-source-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-p0x-150-source/
          if-no-files-found: error
          retention-days: 30
