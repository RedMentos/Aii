name: V13 JEPA checkpoint retention
on:
  pull_request:
    paths:
      - 'v13/code/v13/world_jepa_runtime_checkpoint.py'
      - 'v13/code/v13/world_jepa_shadow_checkpoint.py'
      - 'v13/code/tests/test_jepa_checkpoint_malformed_calibration_20261110.py'
      - 'v13/code/tests/test_jepa_checkpoint_retention_20261110.py'
      - 'v13/code/tests/test_world_jepa_checkpoint_publication_qa.py'
      - '.github/workflows/v13-jepa-checkpoint-retention.yml'
  workflow_dispatch:
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5 pytest==9.2.0
      - name: Run focused checkpoint regressions on Python ${{ matrix.python-version }}
        run: PYTHONPATH=v13/code python -m pytest -q v13/code/tests/test_jepa_checkpoint_retention_20261110.py v13/code/tests/test_runtime_jepa_integration_20261110.py v13/code/tests/test_jepa_checkpoint_malformed_calibration_20261110.py v13/code/tests/test_world_jepa_checkpoint_publication_qa.py
