name: V13 Run440 no-model export path casefold source-only
on:
  pull_request:
    paths:
      - '.github/workflows/run440-export-model-path-casefold.yml'
      - 'v13/code/scripts/run409_safe_export.py'
      - 'v13/code/scripts/run413_export_receipt_gate.py'
      - 'v13/code/tests/test_run440_model_path_casefold.py'
      - 'v13/code/docs/proofs/continuation-20261026/run440-export-casefold/**'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      HF_HUB_OFFLINE: '1'
      NO_MODEL_DOWNLOADS: '1'
      NEEDLE_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Isolated dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/run440"
          "$RUNNER_TEMP/run440/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Run casefold and inherited source-only tests
        run: |
          set -uo pipefail
          cd v13/code
          export PYTHONPATH="$PWD:$PWD/scripts"
          "$RUNNER_TEMP/run440/bin/python" -m unittest -v tests.test_run440_model_path_casefold tests.test_run409_safe_export tests.test_run413_export_receipt_gate > "$RUNNER_TEMP/run440-tests.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/run440-tests.txt"
          printf 'EXIT=%s\n' "$status" > "$RUNNER_TEMP/run440-exit.txt"
          exit "$status"
      - name: Official privacy scan
        if: always()
        run: |
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
      - name: Retain raw source test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run440-source-raw-${{ github.sha }}
          path: |
            ${{ runner.temp }}/run440-tests.txt
            ${{ runner.temp }}/run440-exit.txt
          if-no-files-found: warn
          retention-days: 30
