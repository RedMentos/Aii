name: V13 Run450 executable-vs-release SHA stage2 RED-first
on:
  pull_request:
    paths:
      - '.github/workflows/run450-stage2-executable-identity.yml'
      - 'v13/code/scripts/run404_stage2_resume.py'
      - 'v13/code/tests/test_run450_stage2_executable_identity.py'
      - 'v13/code/docs/proofs/continuation-20261026/run450-stage2-identity/**'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      HF_HUB_OFFLINE: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Pinned historical source identities and isolated dependencies
        run: |
          set -euo pipefail
          test "$(git hash-object v13/code/scripts/run394_step2_fresh.py)" = "fae7aed612108a554d8566b2917ebf31022df423"
          test "$(git hash-object v13/code/scripts/run397_step2_resume.py)" = "f1946054135cb6fdf48c06477308f518e2e62ad9"
          test "$(git hash-object v13/code/specs/models.json)" = "7af05962af41d0bc3f7dd18ef01d4eba55eabf99"
          python3 -m venv "$RUNNER_TEMP/run450"
          "$RUNNER_TEMP/run450/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Execute real source-only synthetic Run401 to Run404 preview
        run: |
          cd v13/code
          export PYTHONPATH="$PWD:$PWD/scripts"
          sha256sum scripts/run404_stage2_resume.py tests/test_run450_stage2_executable_identity.py | tee "$RUNNER_TEMP/run450-source-sha256.txt"
          set +e
          "$RUNNER_TEMP/run450/bin/python" -m unittest -v tests.test_run450_stage2_executable_identity tests.test_run404_stage2_resume tests.test_run402_stage_restore > "$RUNNER_TEMP/run450-tests.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/run450-tests.txt"
          printf 'EXIT=%s\n' "$status" > "$RUNNER_TEMP/run450-exit.txt"
          exit "$status"
      - name: Official privacy scan
        if: always()
        run: |
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
      - name: Retain raw RED/GREEN attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run450-stage2-identity-${{ github.sha }}
          path: |
            ${{ runner.temp }}/run450-source-sha256.txt
            ${{ runner.temp }}/run450-tests.txt
            ${{ runner.temp }}/run450-exit.txt
          if-no-files-found: warn
          retention-days: 30
