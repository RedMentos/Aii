name: V14 RAW EAR vs WebRTC/libfvad comparison harness

on:
  push:
    branches:
      - "research-perception/**"
    paths:
      - "v13/code/v13/audio_voice_cues.py"
      - "v13/code/v13/audio_temporal_evidence.py"
      - "v14/experiments/raw_ear_vad_compare.py"
      - "v14/experiments/test_raw_ear_vad_compare.py"
      - ".github/workflows/v14-raw-ear-vad-comparison.yml"
  pull_request:
    branches:
      - "research-perception/**"
      - "gpt6/v13-private-remote-bridge-20261111"
    paths:
      - "v13/code/v13/audio_voice_cues.py"
      - "v13/code/v13/audio_temporal_evidence.py"
      - "v14/experiments/raw_ear_vad_compare.py"
      - "v14/experiments/test_raw_ear_vad_compare.py"
      - ".github/workflows/v14-raw-ear-vad-comparison.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test-only WebRTC comparator
        run: |
          python -m pip install --upgrade pip
          python -m pip install webrtcvad-wheels==2.0.14.post1
      - name: Compile exact V3 source and benchmark
        run: |
          python -m py_compile \
            v13/code/v13/audio_voice_cues.py \
            v13/code/v13/audio_temporal_evidence.py \
            v14/experiments/raw_ear_vad_compare.py \
            v14/experiments/test_raw_ear_vad_compare.py
      - name: Verify exact V3/temporal source blobs and run synthetic ABI/benchmark checks
        env:
          PYTHONPATH: v14/experiments
          V14_EXPECTED_RAW_EAR_V3_BLOB: 7b1d519cd36ede4b520d78e22c0f89132a1c73a5
          V14_EXPECTED_TEMPORAL_VOICE_BLOB: f693f8b8394558a63d87a35fc67ea3db9dcb1929
        run: python -m unittest discover -s v14/experiments -p "test_raw_ear_vad_compare.py" -v
