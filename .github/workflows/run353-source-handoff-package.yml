name: V13 Run353 frozen source-handoff package applicability
on:
  pull_request:
    paths:
      - '.github/workflows/run353-source-handoff-package.yml'
      - 'v13/code/tests/test_package_source.py'
      - 'v13/code/docs/proofs/continuation-20261025/run353-source-handoff-package-scope/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 50
      - name: Exact source head, SHA256 and isolated deps
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/RUN353_HEAD.txt"
          sha256sum v13/code/tests/test_package_source.py v13/code/scripts/source_handoff_candidate.py v13/code/scripts/source_handoff_ablation.py | tee "$RUNNER_TEMP/RUN353_SOURCE_SHA256SUMS.txt"
          python3 -m venv "$RUNNER_TEMP/run353venv"
          "$RUNNER_TEMP/run353venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Original ZIP regressions and corruption counterexample
        working-directory: v13/code
        run: |
          set -uo pipefail
          "$RUNNER_TEMP/run353venv/bin/python" -m compileall -q tests/test_package_source.py
          PYTHONPATH="$PWD" "$RUNNER_TEMP/run353venv/bin/python" -m unittest -v tests.test_package_source 2>&1 | tee "$RUNNER_TEMP/RUN353_TESTS_RAW.log"
          exit ${PIPESTATUS[0]}
      - name: Public repo privacy scan
        run: |
          set -euo pipefail
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree 2>&1 | tee "$RUNNER_TEMP/RUN353_PRIVACY_RAW.log"
      - name: Close raw manifest
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          find . -maxdepth 1 -type f -name 'RUN353_*' ! -name RUN353_SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > RUN353_SHA256SUMS.txt
      - name: Preserve exact-head raw proof or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V13-Run353-Package-Raw-${{ github.sha }}
          path: ${{ runner.temp }}/RUN353_*
          if-no-files-found: warn
          retention-days: 30
