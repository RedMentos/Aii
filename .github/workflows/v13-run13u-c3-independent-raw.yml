name: V13 Run13U independent original Run13T C3 native raw review
on:
  push:
    branches:
      - assistant/v13-run13u-c3-independent-raw-20261030-auto11
    paths:
      - '.github/workflows/v13-run13u-c3-independent-raw.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: v13-run13u-readonly-original-native-artifact
  cancel-in-progress: false
jobs:
  verify-original-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 20
      - name: Download exact original Run13T native ZIP (no model)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --retry-delay 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/RedMentos/Aii/actions/artifacts/12996917793/zip' \
            -o "$RUNNER_TEMP/run13t-native-original.zip"
          echo "RUN13T_ORIGINAL_ZIP=$RUNNER_TEMP/run13t-native-original.zip" >> "$GITHUB_ENV"
          printf '%s  %s\n' \
            86f728599312518bfa67efa0ae16e66be0eaec9ccfd8c3da8710fba40192717c \
            "$RUNNER_TEMP/run13t-native-original.zip" | sha256sum -c -
      - name: Independent original raw replay and synthetic tamper tests
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/run13u-evidence"
          mkdir -p "$e"
          python3 v13/code/scripts/run13u_independent_c3_raw_audit.py \
            "$RUN13T_ORIGINAL_ZIP" \
            --expected-sha 86f728599312518bfa67efa0ae16e66be0eaec9ccfd8c3da8710fba40192717c \
            > "$e/REVIEW.json" 2> "$e/REVIEW_ERR.log"
          PYTHONPATH=v13/code/scripts python3 -m unittest -v \
            v13/code/tests/test_run13u_independent_c3_raw_audit.py \
            > "$e/TEST_RAW.log" 2>&1
          python3 -m py_compile v13/code/scripts/run13u_independent_c3_raw_audit.py \
            v13/code/tests/test_run13u_independent_c3_raw_audit.py \
            > "$e/COMPILE_RAW.log" 2>&1
          python3 v13/code/scripts/public_repo_privacy_scan.py \
            --base e46f8e9f3e6ffca231f201a21d9a300688b82862 --head HEAD --no-worktree \
            > "$e/PRIVACY_RAW.log" 2>&1
          git diff --check e46f8e9f3e6ffca231f201a21d9a300688b82862 HEAD \
            > "$e/DIFF_RAW.log" 2>&1
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat "$e/REVIEW.json"
          tail -10 "$e/TEST_RAW.log"
      - name: Preserve independent original review raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run13u-c3-raw-review-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/run13u-evidence/
          retention-days: 30
          if-no-files-found: warn