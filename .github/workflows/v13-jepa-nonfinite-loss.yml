name: V13 JEPA finite-loss rollback
on:
  pull_request:
    paths:
      - 'v13/code/v13/continuous_predictor.py'
      - 'v13/code/tests/test_online_predictor_nonfinite_loss.py'
      - '.github/workflows/v13-jepa-nonfinite-loss.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-loss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m unittest -v tests.test_online_predictor_nonfinite_loss tests.test_online_predictor_cursor_retention
        working-directory: v13/code
