name: V13 Run460 seven-receipt native294 independent source verifier
on:
  pull_request:
    paths:
      - '.github/workflows/run460-native294-verifier.yml'
      - 'v13/code/scripts/run460_verify_native294.py'
      - 'v13/code/tests/test_run460_verify_native294_adversarial.py'
      - 'v13/code/docs/proofs/continuation-20261026/run460-native294-verifier/**'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      HF_HUB_OFFLINE: '1'
      NO_MODEL_DOWNLOADS: '1'
      V13_NO_AUTOSTART: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Pin original six-receipt verifier and next-arm source
        run: |
          set -euo pipefail
          test "$(git hash-object v13/code/scripts/run453_verify_native252.py)" = "358f2803a9bcaf88aa011a177863b6ff77e65394"
          test "$(git hash-object v13/code/scripts/run397_step2_resume.py)" = "f1946054135cb6fdf48c06477308f518e2e62ad9"
          test "$(git hash-object v13/code/scripts/run459_stage7_o22.py)" = "6350ebfbb8e3472bf1d2573abe3fff25ccbd9c78"
          sha256sum v13/code/scripts/run460_verify_native294.py v13/code/tests/test_run460_verify_native294_adversarial.py > "$RUNNER_TEMP/run460-source-sha256.txt"
          python3 -m venv "$RUNNER_TEMP/run460"
          "$RUNNER_TEMP/run460/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Seven-receipt synthetic adversarial and inherited 252-row controls
        working-directory: v13/code
        run: |
          set +e
          export PYTHONPATH="$PWD:$PWD/scripts"
          "$RUNNER_TEMP/run460/bin/python" -m unittest -v tests.test_run460_verify_native294_adversarial tests.test_run459_stage7_o22 tests.test_run458_native252_atomic_import tests.test_run457_pinned_utility_reads tests.test_run456_native252_utility tests.test_run454_verify_native252_adversarial tests.test_run453_verify_native252 tests.test_run436_verify_native210 > "$RUNNER_TEMP/run460-tests.txt" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/run460-tests.txt"
          echo "EXIT=$rc" > "$RUNNER_TEMP/run460-exit.txt"
          exit "$rc"
      - name: Official public repository privacy scan
        if: always()
        run: |
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
      - name: Preserve raw evidence including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run460-native294-verifier-${{ github.sha }}
          path: |
            ${{ runner.temp }}/run460-source-sha256.txt
            ${{ runner.temp }}/run460-tests.txt
            ${{ runner.temp }}/run460-exit.txt
          if-no-files-found: warn
          retention-days: 30
