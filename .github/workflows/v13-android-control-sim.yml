name: V13 Android local sandbox replay integration
on:
  push:
    branches:
      - 'codex/v13-android-sandbox-world-*'
  pull_request:
    paths:
      - 'v13/code/v13/android_control_sim.py'
      - 'v13/code/tests/test_android_control_sim.py'
      - 'v13/code/v13/android_control.py'
      - '.github/workflows/v13-android-control-sim.yml'
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: v13/code
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: "Validate atomic simulated world and existing Android broker contract"
        run: |
          python -m py_compile v13/android_control_sim.py tests/test_android_control_sim.py
          python -m pytest -q tests/test_android_control_sim.py tests/test_android_control.py tests/test_android_control_cli.py
      - name: "Privacy/provenance review for simulated-only code"
        run: |
          python scripts/public_repo_privacy_scan.py --base 0b5cd871e8cc6fb42eb8d3acaca8ad7d96b1edfc --head HEAD
