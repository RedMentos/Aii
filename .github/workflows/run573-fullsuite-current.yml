name: V13 Run573 complete current-chain Python suite with restored pinned external prerequisites
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/run573-fullsuite-current.yml'
      - 'v13/code/docs/proofs/continuation-20261026/run573-fullsuite-current/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: v13-native-c3-run131-serialized
  cancel-in-progress: false
jobs:
  source:
    if: ${{ github.event.pull_request.head.ref == 'assistant/v13-run573-fullsuite-current-20261026' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PIP_NO_CACHE_DIR: '1'
      TOKENIZERS_PARALLELISM: 'false'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact current branch source and prereg
        id: source
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/RUN573_HEAD.txt"
          test "$(git hash-object v13/code/docs/proofs/continuation-20261026/run573-fullsuite-current/PREREG.md)" = '25279925839192943e4a252fa94700f99dc09937'
          test "$(git hash-object v13/code/scripts/integrated_candidates.py)" = '9ba7ea2eca522304b05a347ac749f0dff95c5236'
          test "$(git hash-object v13/code/scripts/current_source_lineage_run357.py)" = '3a312d1a53ad682610f51b8371895bbdc379ed2f'
          test "$(git hash-object v13/code/tests/test_run177_native_chain_reconcile_20261025.py)" = '3d74ae6fa6337ad42cf74262dd26880bad65335c'
          test "$(git hash-object v13/code/v13/agi/metacog.py)" = 'be469b602987c8325825677e0c13828e8477d0a0'
          test "$(git hash-object v13/code/tests/test_run546_metacog_labels.py)" = '5465b2dcfdafb205bd3e911e4d4812031ef8c328'
          test "$(git hash-object v13/code/v13/agi/live.py)" = '6746acfdf30457300992f3071e652e08e13f0b70'
          test "$(git hash-object v13/code/v13/agi/maturity.py)" = 'd0bfeb47ff9e2d32bd6dd0e48784ee538c86bea2'
          test "$(git hash-object v13/code/tests/test_agi_live.py)" = '308a22aab99985dcf9e8d80ac1e77c309797f684'
          test "$(git hash-object v13/code/tests/test_run549_quality_fact_partition.py)" = '3ee6a127decbf5a2c5374abe9c6cf8c4f996b343'
          test "$(git hash-object v13/code/v13/runtime.py)" = '0be34417865d64ee8ff6b7ba26631d18aa279e3a'
          test "$(git hash-object v13/code/v13/store.py)" = 'c60ca190578d224849ddca025ff6cf66beed2551'
          test "$(git hash-object v13/code/scripts/lp3_native_readiness.py)" = '2dfa7099541d3f8940817d43b97746c1d4d27092'
          test "$(git hash-object v13/code/scripts/lp3_closed_evidence_audit.py)" = '6068ddafa2ae319f66a1cfcd7fb50127372e20a8'
          test "$(git hash-object v13/code/scripts/run570_current_default_cohort.py)" = '64a76175da9f14c65c0e7fdfaf647e47e7e56715'
          test "$(git hash-object v13/code/tests/test_run570_current_default_cohort.py)" = '7a65e45981f8d452aac8ececea6200192fbc3a3c'
          test "$(git hash-object v13/code/scripts/run571_current_default_native.py)" = '813dfe55997db2116b7cd79365a744b2635440b6'
          test "$(git hash-object v13/code/tests/test_run571_current_default_native.py)" = 'acab4ea3b0898af7c6c4ee3ef18645770ffc3177'
          test "$(git hash-object v13/code/docs/proofs/continuation-20261026/run572-current-legacy-native/PREREG.md)" = 'bbe80979288006bde1b6e9bd8cf4081e6d4a8284'
          test "$(sha256sum v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md | cut -d' ' -f1)" = '3423906b01b24443fcef733fb5c7ef47296963df63e603d8f843c99d544877ee'
          { date -u -Iseconds; python3 --version; uname -a; } > "$RUNNER_TEMP/RUN573_HOST.txt"
      - name: Isolated pinned source-only dependencies and compileall
        id: deps
        run: |
          set -uo pipefail
          set +e
          python3 -m venv "$RUNNER_TEMP/run573venv"
          "$RUNNER_TEMP/run573venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52' > "$RUNNER_TEMP/RUN573_DEPS_RAW.log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            timeout 420s "$RUNNER_TEMP/run573venv/bin/python" -m pip install --disable-pip-version-check --no-input --index-url https://download.pytorch.org/whl/cpu 'torch==2.9.1+cpu' >> "$RUNNER_TEMP/RUN573_DEPS_RAW.log" 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            "$RUNNER_TEMP/run573venv/bin/python" -m compileall -q v13/code/v13 >> "$RUNNER_TEMP/RUN573_DEPS_RAW.log" 2>&1
            rc=$?
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN573_DEPS_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Pinned original Run531 raw fixture for Run534 full suite tests
        id: input
        run: |
          set -uo pipefail
          set +e
          mkdir -p "$RUNNER_TEMP/run573_input"
          curl -fsSL --retry 0 --max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/RedMentos/Aii/actions/artifacts/12649564483/zip" \
            -o "$RUNNER_TEMP/run573-original.zip" > "$RUNNER_TEMP/RUN573_INPUT_RAW.log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "c5361ce461260e5ba2740d0f60197b60bf2c5995573912afa58f25f923640f96  $RUNNER_TEMP/run573-original.zip" | sha256sum -c - >> "$RUNNER_TEMP/RUN573_INPUT_RAW.log" 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            unzip -q "$RUNNER_TEMP/run573-original.zip" -d "$RUNNER_TEMP/run573_input" >> "$RUNNER_TEMP/RUN573_INPUT_RAW.log" 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            (cd "$RUNNER_TEMP/run573_input" && sha256sum -c RUN531_SHA256SUMS.txt) >> "$RUNNER_TEMP/RUN573_INPUT_RAW.log" 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            echo "73ba92ea8e2a28a00d639dcb21caca5f8991472c4513233ad659fab65e947ea7  $RUNNER_TEMP/run573_input/RUN531_FULL.json" | sha256sum -c - >> "$RUNNER_TEMP/RUN573_INPUT_RAW.log" 2>&1
            rc=$?
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN573_INPUT_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Retrieve pinned original Run147 native evidence without inference
        id: run147
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          set +e
          curl -fLsS --retry 3 --retry-delay 1 --max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/RedMentos/Aii/actions/artifacts/12585363362/zip" \
            -o "$RUNNER_TEMP/RUN147_native.zip" > "$RUNNER_TEMP/RUN573_RUN147_RAW.log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "ddd60c897e1bdc634a40179b67e434097bb1e1999a6a2141372f6272682b9676  $RUNNER_TEMP/RUN147_native.zip" | sha256sum -c - >> "$RUNNER_TEMP/RUN573_RUN147_RAW.log" 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            python3 - <<'PY' >> "$RUNNER_TEMP/RUN573_RUN147_RAW.log" 2>&1
          import os,zipfile
          with zipfile.ZipFile(os.path.join(os.environ['RUNNER_TEMP'],'RUN147_native.zip')) as z:
              assert z.testzip() is None
              assert set(z.namelist()) == {'RUN147_C3_VARIED_NATIVE_REPORT.json','RUN147_VARIED_NATIVE_RAW.log'}
          print('RUN147_ORIGINAL_CRC_MEMBERS_PASS')
          PY
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then echo "RUN147_ARTIFACT=$RUNNER_TEMP/RUN147_native.zip" >> "$GITHUB_ENV"; fi
          echo "$rc" > "$RUNNER_TEMP/RUN573_RUN147_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Reconstruct exact historical LP3 helper and test in private temp
        id: lp3
        run: |
          set -uo pipefail
          set +e
          mkdir -p "$RUNNER_TEMP/lp3_run21"
          {
            base64 -d v13/code/docs/proofs/continuation-20261024/lp3-run20/LP3_RUN20_CODE_ONLY.tar.xz.base64 > "$RUNNER_TEMP/run20_code_only.tar.xz"
            echo "fc532d00e2c72281a154c984bbd79bd757a69a1d4e3c14e70a988dfb44c100c7  $RUNNER_TEMP/run20_code_only.tar.xz" | sha256sum -c -
            tar -xJf "$RUNNER_TEMP/run20_code_only.tar.xz" -C "$RUNNER_TEMP/lp3_run21"
            patch -d "$RUNNER_TEMP/lp3_run21" -p1 < v13/code/docs/coordination/LP3_RUN21_POSTREAP_REVIEW.patch
            helper="$(find "$RUNNER_TEMP/lp3_run21" -type f -path '*/scripts/lp3_serial_cohort.py' -print -quit)"
            test -n "$helper"
            echo "05e5bf300f582a03efeaae0133c8e20bf60948a2fa4e05a4867924ac4dc4b831  $helper" | sha256sum -c -
            cp v13/code/scripts/lp3_native_readiness.py "$(dirname "$helper")/"
            cp v13/code/scripts/lp3_closed_evidence_audit.py "$(dirname "$helper")/"
            testhelper="$(find "$RUNNER_TEMP/lp3_run21" -type f -path '*/tests/test_lp3_serial_cohort.py' -print -quit)"
            test -n "$testhelper"
            test "$(git hash-object "$testhelper")" = "4e355dd45eda22a486f06af69b6c0d0fc35f178c"
            echo "LP3_HELPER_DIR=$(dirname "$helper")" >> "$GITHUB_ENV"
            echo "LP3_TEST_DIR=$(dirname "$testhelper")" >> "$GITHUB_ENV"
          } > "$RUNNER_TEMP/RUN573_LP3_RAW.log" 2>&1
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/RUN573_LP3_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Full unfiltered V13 source-only unittest discovery
        id: suite
        if: ${{ steps.deps.outputs.rc == '0' && steps.input.outputs.rc == '0' && steps.run147.outputs.rc == '0' && steps.lp3.outputs.rc == '0' }}
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          export PYTHONPATH="$LP3_TEST_DIR:$LP3_HELPER_DIR:$PWD:$PWD/scripts"
          export RUN534_RAW_JSON="$RUNNER_TEMP/run573_input/RUN531_FULL.json"
          timeout --signal=TERM --kill-after=10s 900s "$RUNNER_TEMP/run573venv/bin/python" -m unittest discover -s tests -p 'test_*.py' -v > "$RUNNER_TEMP/RUN573_TESTS_RAW.log" 2>&1
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/RUN573_TEST_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Public privacy scan
        id: privacy
        if: always()
        run: |
          set -uo pipefail
          set +e
          git fetch --no-tags --depth=100 origin "${{ github.event.pull_request.base.sha }}" > "$RUNNER_TEMP/RUN573_PRIVACY_RAW.log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree >> "$RUNNER_TEMP/RUN573_PRIVACY_RAW.log" 2>&1
            rc=$?
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN573_PRIVACY_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: SHA-close full raw evidence
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          find . -maxdepth 1 -type f -name 'RUN573_*' ! -name RUN573_SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > RUN573_SHA256SUMS.txt
      - name: Preserve every source-wide result even on RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run573-full-source-wide-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/RUN573_*
          if-no-files-found: error
          retention-days: 30
      - name: Enforce source suite and privacy
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.source.outcome }}" = success
          test "$(cat "$RUNNER_TEMP/RUN573_DEPS_EXIT.txt")" = 0
          test "$(cat "$RUNNER_TEMP/RUN573_INPUT_EXIT.txt")" = 0
          test "$(cat "$RUNNER_TEMP/RUN573_RUN147_EXIT.txt")" = 0
          test "$(cat "$RUNNER_TEMP/RUN573_LP3_EXIT.txt")" = 0
          test "$(cat "$RUNNER_TEMP/RUN573_TEST_EXIT.txt")" = 0
          test "$(cat "$RUNNER_TEMP/RUN573_PRIVACY_EXIT.txt")" = 0
