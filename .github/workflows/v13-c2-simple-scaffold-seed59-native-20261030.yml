name: V13 seed59 actual C2 native route-selection utility
on:
  push:
    branches:
      - codex/v13-c2-simple-scaffold-native-20261030-hourly11d
    paths:
      - '.github/workflows/v13-c2-simple-scaffold-seed59-native-20261030.yml'
permissions:
  contents: read
concurrency:
  group: v13-step2-budget-paired-native-20261030
  cancel-in-progress: false
jobs:
  route-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Source-pinned seed59 12 serial native turns with original raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-seed59-native"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          82eb328ccb853b8a5a6e3ffb6427b8cb09c39e87 v13/code/docs/C2_SIMPLE_SCAFFOLD_NATIVE_PREREG_20261030.md
          56e173dc5067032de8b0c18995f57cbd34168fbb v13/code/scripts/c2_simple_scaffold_native_seed59_20261030.py
          0b577fb6483e03e109f374d7624de1fabd3f0bc4 v13/code/tests/test_c2_simple_scaffold_native_seed59_20261030.py
          b10bcdcb2cf2a2151c95cd432b7b0b5e6c5aac6b v13/code/scripts/c2_body_controlled_utility_seed53_20261030.py
          fcd44ccce3b8b40d65a25187a78b0a8d49d9609d v13/code/scripts/step2_paired_raw_validator_audit_20261030.py
          f6bb6c26237f9c94a29a9eeac5ecc6c5fa129ad3 v13/code/scripts/step2_expression_diagnostic_20261030.py
          fb34dba97ae3700ba5accdcb928bfb72afcf4fcb v13/code/scripts/c2_native_route_provenance_20261030.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          954a3f468f10195fbce12d27f68585ee7edee2c9 v13/code/specs/control_tools.json
          BLOBS
          red=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then red=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$red" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-seed59-native-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-seed59-native-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else
            echo SKIPPED_VENV_RED > "$e/DEPS_RAW.log"
            echo SKIPPED_RED > "$e/DEPS_EXIT.txt"
          fi
          if [ "$red" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_c2_simple_scaffold_native_seed59_20261030) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else
            echo SKIPPED_PINS_OR_DEPS_RED > "$e/TEST_RAW.log"
            echo SKIPPED_RED > "$e/TEST_EXIT.txt"
          fi
          export V13_HOME="$RUNNER_TEMP/v13-seed59-installed"
          if [ "$(cat "$e/TEST_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 15m env PYTHONPATH=v13/code "$py" -m v13.bootstrap --home "$V13_HOME" > "$e/BOOTSTRAP_RAW.log" 2>&1
            echo "$?" > "$e/BOOTSTRAP_EXIT.txt"
          else
            echo SKIPPED_TEST_RED > "$e/BOOTSTRAP_RAW.log"
            echo SKIPPED_RED > "$e/BOOTSTRAP_EXIT.txt"
          fi
          if [ "$(cat "$e/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 28m env PYTHONPATH=v13/code "$py" v13/code/scripts/c2_simple_scaffold_native_seed59_20261030.py --home "$V13_HOME" --out "$e/pilot" > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else
            echo SKIPPED_BOOTSTRAP_RED > "$e/NATIVE_RAW.log"
            echo SKIPPED_RED > "$e/NATIVE_EXIT.txt"
          fi
          if [ -f "$e/pilot/report.json" ]; then
            env PYTHONPATH=v13/code "$py" - "$e/pilot" > "$e/REPORT_CHECK_RAW.log" 2>&1 <<'PY'
          import json,sys
          from pathlib import Path
          from scripts.c2_simple_scaffold_native_seed59_20261030 import score_pair,pilot_signal,prompt
          from v13.cognition import scaffold_route
          p=Path(sys.argv[1]);j=json.loads((p/'report.json').read_text())
          arms=['A_FORCED_SIMPLE','B_NATIVE_AUTO','C_FORCED_BOTH']
          assert j['schema']=='v13.c2.simple_scaffold.native_utility.seed59.v1'
          assert j['seed']==59 and j['fixture_sha256']=='610b7b1c2b2d203b6388a7717394cd9c7c8460f434509167286e7bf7a972e651'
          assert j['arms']==arms and len(j['fixtures'])==4
          assert j['arm_order']==[arms[i%3:]+arms[:i%3] for i in range(4)]
          assert all(scaffold_route(prompt(f))=='simple' for f in j['fixtures'])
          assert j['learning_mode']=='RECORD_ONLY' and j['jepa_weight']==0
          for k in ('step2_gate_promoted','b3_promoted','body_jepa_available','redmi_measured','whole_system_complete','comparative_utility_proven'):
              assert j[k] is False,k
          assert all(x=={'ok':True,'hash_checked':True} for x in j['model_verification'].values())
          assert set(j['model_verification'])=={'needle','language','body','gist'}
          assert len(j['rows'])==12
          totals={arm:0 for arm in arms};valid=True;invoked=selected=0
          for i,row in enumerate(j['rows']):
              f=j['fixtures'][i//3];arm=j['arm_order'][i//3][i%3]
              assert row['index']==i and row['fixture']==f['project'] and row['arm']==arm
              raw=json.loads((p/'raw'/f'{i:02d}_{arm}.json').read_text())
              assert raw['index']==i and raw['fixture']==row['fixture'] and raw['arm']==arm
              assert raw['flags']==row['flags'] and raw['score']==row['score']
              assert type(row['score']['correct']) is int and 0<=row['score']['correct']<=2
              totals[arm]+=row['score']['correct']
              valid=valid and row['flags'].get('valid_native') is True
              if 'raw_audit' not in raw:
                  assert 'error_type' in raw and row['flags'].get('valid_native') is False
                  continue
              a=raw['raw_audit']
              assert a['event_id']==row['event_id'] and a['output']==row['final_output']
              assert raw['scaffold_route']=='simple' and raw['prompt']==prompt(f)
              assert raw['learning_mode']=='RECORD_ONLY' and raw['jepa_weight']==0
              for k in ('step2_gate_promoted','b3_promoted','body_jepa_available','redmi_measured','whole_system_complete'):
                  assert raw[k] is False
              assert raw['b2_control']=='two_body' and raw['b1_model_key']=='body' and raw['b2_model_key']=='gist'
              if arm=='A_FORCED_SIMPLE':
                  assert raw['b1_revision']=='unavailable' and raw['b2_revision']=='unavailable'
              else:
                  assert raw['b1_revision']=='6767265158422fb8a19c62ceb45f16f05363615b'
                  assert raw['b2_revision']=='8fea620810c4afa23dd6443f999a48574c1611a3'
              if row['flags']['valid_native']:
                  assert a['source_errors']==[] and a['checks'] and all(v is True for v in a['checks'].values())
                  assert json.loads(json.dumps(score_pair(f,row['final_output'])))==row['score']
                  assert row['flags']['process_release_valid'] is True
              if arm=='B_NATIVE_AUTO':
                  invoked+=int(row['flags']['native_c2_invocation'])
                  selected+=int(row['flags']['native_c2_selected'])
                  if row['flags']['native_c2_invocation']:
                      assert raw['native_c2_process_reaped'] is True
                      assert type(raw['native_c2_pid']) is int
                      assert raw['route_info']['native_control_metrics']['memory']['pid']==raw['native_c2_pid']
                      assert raw['context_packet']['event_id']==row['event_id']
                      assert raw['context_packet']['session_id']==row['session_id']
                      assert raw['context_packet']['external_action_authority'] is False
          assert j['score_totals_out_of_8']==totals and all(0<=v<=8 for v in totals.values())
          assert j['native_c2_invocations']==invoked and j['native_c2_selected']==selected
          assert j['pilot_signal_not_gate']==pilot_signal(totals,valid,selected)
          assert j['status']==('PILOT_COMPLETE_NO_GATE' if valid else 'PILOT_PARTIAL_RED')
          print('SEED59_RAW_SHAPE_AND_NEGATIVE_GATES_VERIFIED',j['status'],totals,invoked,selected)
          PY
            echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          else
            echo NO_NATIVE_REPORT > "$e/REPORT_CHECK_RAW.log"
            echo SKIPPED_NO_REPORT > "$e/REPORT_CHECK_EXIT.txt"
          fi
          "$py" -m py_compile v13/code/scripts/c2_simple_scaffold_native_seed59_20261030.py v13/code/tests/test_c2_simple_scaffold_native_seed59_20261030.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base e5d1c9b90670006989ac161246aa2793384fc319 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check e5d1c9b90670006989ac161246aa2793384fc319 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original 12-row native raw on PASS or RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-seed59-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-seed59-native/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce native pilot without C2/STEP2 gate promotion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-seed59-native"
          for stage in PINS VENV DEPS TEST BOOTSTRAP NATIVE REPORT_CHECK COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained; no native pilot PASS or gate promotion"
              tail -80 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'SEED59_NATIVE_INTERMEDIATE_ONLY_NO_STEP2_B3_JEPA_REDMI_OR_WHOLE_SYSTEM_GATE'
