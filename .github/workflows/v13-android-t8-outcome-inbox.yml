name: V13 Android T8 outcome inbox
on:
  pull_request:
    paths:
      - 'v13/code/v13/android_t8_outcome_ingest.py'
      - 'v13/code/tests/test_android_t8_outcome_ingest.py'
      - '.github/workflows/v13-android-t8-outcome-inbox.yml'
  workflow_dispatch:
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: PYTHONPATH=v13/code python -m pytest -q v13/code/tests/test_android_t8_outcome_ingest.py
