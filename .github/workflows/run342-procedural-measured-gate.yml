name: V13 Run342 measured procedural authority containment
on:
  pull_request:
    paths:
      - '.github/workflows/run342-procedural-measured-gate.yml'
      - 'v13/code/v13/fastforward.py'
      - 'v13/code/tests/test_fastforward_reflex.py'
      - 'v13/code/tests/test_fastforward_latency_gate_run300.py'
      - 'v13/code/tests/test_fastforward_canonical_gate_run342.py'
      - 'v13/code/docs/proofs/continuation-20261025/run342-procedural-measured-gate/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 50
      - name: Exact head and isolated model-free dependencies
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/RUN342_HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/run342venv"
          "$RUNNER_TEMP/run342venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
          sha256sum v13/code/v13/fastforward.py v13/code/tests/test_fastforward_canonical_gate_run342.py | tee "$RUNNER_TEMP/RUN342_SOURCE_SHA256SUMS.txt"
      - name: Real Runtime SQLite and FastForward focused tests
        working-directory: v13/code
        run: |
          set -uo pipefail
          "$RUNNER_TEMP/run342venv/bin/python" -m compileall -q v13 tests
          PYTHONPATH="$PWD:$PWD/scripts" "$RUNNER_TEMP/run342venv/bin/python" -m unittest -v \
            tests.test_fastforward_canonical_gate_run342 \
            tests.test_fastforward_reflex \
            tests.test_fastforward_latency_gate_run300 \
            tests.test_fastforward_outcome_once_run312 \
            tests.test_fastforward_sleep_cas_run299 \
            tests.test_sleep_offline.PredictorTests \
            2>&1 | tee "$RUNNER_TEMP/RUN342_TESTS_RAW.log"
          exit ${PIPESTATUS[0]}
      - name: Public repository privacy scan
        run: |
          set -euo pipefail
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree \
            2>&1 | tee "$RUNNER_TEMP/RUN342_PRIVACY_RAW.log"
      - name: Close raw source-only receipts
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          find . -maxdepth 1 -type f -name 'RUN342_*' ! -name RUN342_SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > RUN342_SHA256SUMS.txt
      - name: Preserve RED or PASS
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V13-Run342-Procedural-Gate-Raw-${{ github.sha }}
          path: ${{ runner.temp }}/RUN342_*
          if-no-files-found: warn
          retention-days: 30
