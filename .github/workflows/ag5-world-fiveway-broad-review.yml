name: V13 five-way AG5 World Claude broad suite differential
on:
  push:
    branches: [codex/automation11-fiveway-broad-review-20261027]
    paths:
      - '.github/workflows/ag5-world-fiveway-broad-review.yml'
permissions:
  contents: read
concurrency:
  group: v13-fiveway-broad-review-20261027
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Isolated dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/fiveway"
          timeout 240s "$RUNNER_TEMP/fiveway/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Exact disposable five-way merge and cross-feature tests
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/fivewayproof"
          git rev-parse HEAD > "$RUNNER_TEMP/fivewayproof/REVIEW_HEAD.txt"
          git fetch --no-tags origin c615497384dc5519be59232451895ca443ce9e45 e505364c78d6ef222eb287d84d84aed81ecc53e3 551d6212d7b71f8e78e1fdb163e45ab41a11310d 2671f054ed025625abe94be42d12667329c4366f > "$RUNNER_TEMP/fivewayproof/FETCH_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/fivewayproof/FETCH_EXIT.txt"
          git -c user.name='V13 Disposable Merge Probe' -c user.email='probe@localhost.invalid' merge --no-commit --no-ff c615497384dc5519be59232451895ca443ce9e45 > "$RUNNER_TEMP/fivewayproof/AG5_MERGE_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/fivewayproof/AG5_MERGE_EXIT.txt"
          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/fivewayproof/AG5_CONFLICTS.txt"
          "$RUNNER_TEMP/fiveway/bin/python" v13/code/scripts/resolve_ag5_world_merge_candidate.py > "$RUNNER_TEMP/fivewayproof/AG5_RESOLVE_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/fivewayproof/AG5_RESOLVE_EXIT.txt"
          git -c user.name='V13 Disposable Merge Probe' -c user.email='probe@localhost.invalid' commit --no-verify -m 'CI-only AG5 World resolved' > "$RUNNER_TEMP/fivewayproof/AG5_COMMIT_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/fivewayproof/AG5_COMMIT_EXIT.txt"
          for pair in 'CLAUDE e505364c78d6ef222eb287d84d84aed81ecc53e3' 'FETCH_FIX 551d6212d7b71f8e78e1fdb163e45ab41a11310d' 'EXPORT_FIX 2671f054ed025625abe94be42d12667329c4366f'; do
            name="${pair%% *}"
            sha="${pair#* }"
            git -c user.name='V13 Disposable Merge Probe' -c user.email='probe@localhost.invalid' merge --no-commit --no-ff "$sha" > "$RUNNER_TEMP/fivewayproof/${name}_MERGE_RAW.log" 2>&1
            rc="$?"
            echo "$rc" > "$RUNNER_TEMP/fivewayproof/${name}_MERGE_EXIT.txt"
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/fivewayproof/${name}_CONFLICTS.txt"
            if [ "$rc" != 0 ]; then break; fi
            git -c user.name='V13 Disposable Merge Probe' -c user.email='probe@localhost.invalid' commit --no-verify -m "CI-only ${name} integration" > "$RUNNER_TEMP/fivewayproof/${name}_COMMIT_RAW.log" 2>&1
            echo "$?" > "$RUNNER_TEMP/fivewayproof/${name}_COMMIT_EXIT.txt"
          done
          # The merged operator gained :modul and :wachter from Claude. The
          # AG5 guide must explain both commands in the disposable merged tree.
          "$RUNNER_TEMP/fiveway/bin/python" - <<'PY' > "$RUNNER_TEMP/fivewayproof/GUIDE_RAW.log" 2>&1
          from pathlib import Path
          import re
          p=Path("v13/code/docs/BEFEHLE.md")
          s=p.read_text()
          anchor=":toolforecast [status|shadow|off|score]\n    Sagt vorher, was ein Werkzeug bewirken würde (SCHATTEN).\n"
          if s.count(anchor)!=1: raise SystemExit("GUIDE_ANCHOR_DRIFT")
          for command in ("modul","wachter"):
              if re.search(r"(?m)^:"+command+r"\\b",s): raise SystemExit("GUIDE_ALREADY_DOCUMENTED:"+command)
          addition=(
              ":modul [liste|an|aus|lernen an|aus|vorschlag <https-Adresse> <Name>|holen <M>|zeige <M>|freigeben <M> <Code>|ablehnen <M>|zurueck <M>|frage <M> <Text>|export <M> <Pfad>]\n"
              "    Neue Wissens-Module: standardmäßig aus, nur deine getippten Freigaben. Herkunft/Hash prüfen, Export ist kein Modelltraining.\n"
              ":wachter [status|aus|schatten|an|lexikon|modell <Ordner>|test <Text>]\n"
              "    Zweiter Sicherheitswächter: standardmäßig aus, nur strenger; ein Modellordner wird nicht automatisch geladen.\n"
          )
          p.write_text(s.replace(anchor,anchor+addition))
          print("GUIDE_ADDED_TWO_COMMANDS",p.stat().st_size)
          PY
          echo "$?" > "$RUNNER_TEMP/fivewayproof/GUIDE_EXIT.txt"
          git add -- v13/code/docs/BEFEHLE.md
          git -c user.name='V13 Disposable Merge Probe' -c user.email='probe@localhost.invalid' commit --no-verify -m 'CI-only five-way module and guard guide' > "$RUNNER_TEMP/fivewayproof/GUIDE_COMMIT_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/fivewayproof/GUIDE_COMMIT_EXIT.txt"
          git status --short > "$RUNNER_TEMP/fivewayproof/FINAL_STATUS.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/fivewayproof/FINAL_HEAD.txt"
          sha256sum v13/code/v13/operator.py v13/code/v13/modules_gate.py v13/code/v13/module_learn.py v13/code/v13/guard2.py v13/code/docs/BEFEHLE.md > "$RUNNER_TEMP/fivewayproof/SOURCE_SHA256.txt"
          (cd v13/code && PYTHONPATH="$PWD:$PWD/scripts" timeout 600s "$RUNNER_TEMP/fiveway/bin/python" -m unittest -v tests.test_phone_halt tests.test_route_supersede tests.test_world_console_shadow tests.test_language_operator_run620 tests.test_operator_config_atomic_run623 tests.test_handy_pflicht_resume tests.test_run611_chat_session_paging tests.test_run594_chat_export_stream tests.test_toolforecast tests.test_world_jepa_action_identification tests.test_modules_gate tests.test_guard2 tests.test_review666_module_halt_race tests.test_review666_bp11b_export_gate) > "$RUNNER_TEMP/fivewayproof/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/fivewayproof/FOCUSED_EXIT.txt"
          (cd v13/code && PYTHONPATH="$PWD:$PWD/scripts" timeout 900s "$RUNNER_TEMP/fiveway/bin/python" -m unittest discover -s tests -p 'test_*.py' -v) > "$RUNNER_TEMP/fivewayproof/UNIT_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/fivewayproof/UNIT_EXIT.txt"
          "$RUNNER_TEMP/fiveway/bin/python" -m compileall -q v13/code/v13/operator.py v13/code/v13/modules_gate.py v13/code/v13/module_learn.py v13/code/v13/guard2.py > "$RUNNER_TEMP/fivewayproof/COMPILE_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/fivewayproof/COMPILE_EXIT.txt"
          "$RUNNER_TEMP/fiveway/bin/python" v13/code/scripts/public_repo_privacy_scan.py --base aab74aa900bfbd767f2983ba40a16fc0b8b95a3b --head HEAD > "$RUNNER_TEMP/fivewayproof/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/fivewayproof/PRIVACY_EXIT.txt"
          exit 0
      - name: Audit exact historical failure signatures without claiming a passing suite
        run: |
          set +e
          "$RUNNER_TEMP/fiveway/bin/python" - "$RUNNER_TEMP/fivewayproof/UNIT_RAW.log" "$RUNNER_TEMP/fivewayproof/DIFFERENTIAL.json" <<'PY'
          import hashlib, json, pathlib, re, sys
          raw = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          signatures = sorted(re.findall(r"^(?:FAIL|ERROR): .+$", raw, re.MULTILINE))
          digest = hashlib.sha256(json.dumps(signatures, ensure_ascii=False, separators=(",", ":")).encode()).hexdigest()
          counts = {kind: sum(s.startswith(kind + ": ") for s in signatures) for kind in ("FAIL", "ERROR")}
          totals = re.findall(r"Ran (\d+) tests in [\d.]+s", raw)
          baseline = "7fb3abd6ce63db14c0f740248d3cc6740d83f0f9d9812330053b995e32c64e5a"
          unchanged = digest == baseline and counts == {"FAIL": 5, "ERROR": 73} and bool(totals) and int(totals[-1]) >= 4424
          status = "HISTORICAL_RED_UNCHANGED" if unchanged else "DIFFERENTIAL_REQUIRES_REVIEW"
          report = {"status": status, "baseline_sha256": baseline, "observed_sha256": digest,
                    "observed_counts": counts, "observed_total_tests": totals[-1] if totals else None,
                    "signatures": signatures, "baseline_run": 40460394112,
                    "claim_scope": "disposable five-way Linux software tests; not production, native, Redmi, or completion"}
          pathlib.Path(sys.argv[2]).write_text(json.dumps(report, indent=2) + "\n")
          print(status, counts, report["observed_total_tests"], digest)
          sys.exit(0 if unchanged else 1)
          PY
          echo "$?" > "$RUNNER_TEMP/fivewayproof/DIFFERENTIAL_EXIT.txt"
          exit 0
      - name: Upload exact raw including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ag5-world-fiveway-broad-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/fivewayproof/
          if-no-files-found: error
      - name: Enforce merge and focused exits
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/fivewayproof/FETCH_EXIT.txt")" = 0
          test "$(cat "$RUNNER_TEMP/fivewayproof/AG5_MERGE_EXIT.txt")" = 1
          test "$(wc -l < "$RUNNER_TEMP/fivewayproof/AG5_CONFLICTS.txt")" = 3
          for n in AG5_RESOLVE AG5_COMMIT CLAUDE_MERGE CLAUDE_COMMIT FETCH_FIX_MERGE FETCH_FIX_COMMIT EXPORT_FIX_MERGE EXPORT_FIX_COMMIT GUIDE GUIDE_COMMIT FOCUSED COMPILE PRIVACY DIFFERENTIAL; do
            test "$(cat "$RUNNER_TEMP/fivewayproof/${n}_EXIT.txt")" = 0 || { tail -90 "$RUNNER_TEMP/fivewayproof/${n}_RAW.log" 2>/dev/null || true; exit 1; }
          done
          test "$(cat "$RUNNER_TEMP/fivewayproof/UNIT_EXIT.txt")" = 1
          tail -12 "$RUNNER_TEMP/fivewayproof/FOCUSED_RAW.log"
          head -14 "$RUNNER_TEMP/fivewayproof/DIFFERENTIAL.json"
          echo 'Historical 5 FAIL/73 ERROR unchanged; full suite remains RED'
