name: V13 current distinct B1/B2 native candidate software guards (no downloads)
on:
  push:
    branches: [assistant/v13-run11-b1b2-native-two-body-smoke-20261028]
    paths:
      - '.github/workflows/current-b1b2-native-guards-20261028.yml'
      - 'v13/code/scripts/current_b1b2_native_linux_smoke_20261028.py'
      - 'v13/code/tests/test_current_b1b2_native_linux_smoke_20261028.py'
permissions:
  contents: read
concurrency:
  group: v13-current-b1b2-native-guards-20261028
  cancel-in-progress: false
jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact model pins and subprocess guards without downloads
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-current-b1b2-guards"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/specs/models.json > "$e/CATALOG_BLOB.txt"
          git hash-object v13/code/scripts/current_b1b2_native_linux_smoke_20261028.py > "$e/SOURCE_BLOB.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 4m env PYTHONPATH=.:tests python3 -m unittest -v tests.test_current_b1b2_native_linux_smoke_20261028 tests.test_current_c3_native_linux_smoke_20261028) > "$e/GUARDS_RAW.log" 2>&1
          echo "$?" > "$e/GUARDS_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/current_b1b2_native_linux_smoke_20261028.py v13/code/tests/test_current_b1b2_native_linux_smoke_20261028.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base c0260321fb7a26c3c7e6cd867a1879fe7ce164a0 --head HEAD > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check c0260321fb7a26c3c7e6cd867a1879fe7ce164a0 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && sha256sum * > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-current-b1b2-guards-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-current-b1b2-guards/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce guards; no native claim
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-current-b1b2-guards"
          for name in GUARDS COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${name}_EXIT.txt")" != 0 ]; then
              echo "$name RED; raw retained"
              tail -80 "$e/${name}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'B1B2_GUARDS_ONLY_NO_NATIVE_EXECUTION_NO_GATE_PROMOTION'
