name: V13 Run594 complete atomic chat export
on:
  push:
    branches:
      - codex/automation11-run594-chat-export-stream-20261026
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/run594-chat-export-stream.yml'
      - 'v13/code/v13/chat_export.py'
      - 'v13/code/v13/operator.py'
      - 'v13/code/tests/test_run594_chat_export_stream.py'
permissions:
  contents: read
jobs:
  chat-export:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.ref == 'codex/automation11-run594-chat-export-stream-20261026' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install isolated model-free dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'prompt_toolkit==3.0.52'
      - name: Execute exact-head chat export and operator regressions
        shell: bash
        run: |
          mkdir -p run594-raw
          git rev-parse HEAD > run594-raw/source_head.txt
          sha256sum v13/code/v13/chat_export.py v13/code/v13/operator.py v13/code/tests/test_run594_chat_export_stream.py v13/code/docs/proofs/continuation-20261026/run594-chat-export-stream/PREREG.md > run594-raw/source_sha256.txt
          set +e
          (cd v13/code && python -m unittest discover -s tests -p test_run594_chat_export_stream.py -v) > run594-raw/new-tests.log 2>&1
          echo "$?" > run594-raw/new-tests.exit
          (cd v13/code && python -m unittest discover -s tests -p test_chat_operator_persistence_run214.py -v && python -m unittest discover -s tests -p test_phone_chat_sessions_run89.py -v && python -m unittest discover -s tests -p test_phone_operator_journey_run86.py -v && python -m unittest discover -s tests -p test_operator_search_literal_run88.py -v && python -m unittest discover -s tests -p test_multichat_backup_restore_run217.py -v) > run594-raw/regressions.log 2>&1
          echo "$?" > run594-raw/regressions.exit
          python -m compileall -q v13/code/v13/chat_export.py v13/code/v13/operator.py v13/code/tests/test_run594_chat_export_stream.py > run594-raw/compile.log 2>&1
          echo "$?" > run594-raw/compile.exit
          python v13/code/scripts/public_repo_privacy_scan.py --base "f84da9510c25beddb7200cad65fa16324b9683ec" --head "${{ github.event.pull_request.head.sha || github.sha }}" --no-worktree > run594-raw/privacy.log 2>&1
          echo "$?" > run594-raw/privacy.exit
          set -e
          cat run594-raw/new-tests.log run594-raw/regressions.log run594-raw/privacy.log
      - name: Close raw hashes even on failure
        if: always()
        shell: bash
        run: |
          mkdir -p run594-raw
          (cd run594-raw && sha256sum *.txt *.log *.exit > RAW_SHA256SUMS.txt)
          cat run594-raw/RAW_SHA256SUMS.txt
      - name: Preserve raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run594-chat-export-raw
          path: run594-raw/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce focused checks
        run: |
          test "$(cat run594-raw/new-tests.exit)" = 0
          test "$(cat run594-raw/regressions.exit)" = 0
          test "$(cat run594-raw/compile.exit)" = 0
          test "$(cat run594-raw/privacy.exit)" = 0
