name: V13 paired109 independent original raw audit
on:
  push:
    branches:
      - 'codex/v13-c3-paired109-independent-audit-20261030-auto11f'
    paths:
      - 'v13/code/docs/C3_PAIRED109_INDEPENDENT_AUDIT_LAUNCH_AUTO11_20261030.md'
permissions:
  contents: read
  actions: read
jobs:
  original-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Read original immutable native raw and independent scorer
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/c3-paired109-independent"
          mkdir -p "$e/original"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/c3-paired109-audit-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/c3-paired109-audit-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          (cd v13/code && timeout 5m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v \
            tests.test_c3_paired109_independent_audit_auto11 \
            tests.test_c3_typedread_paired109_auto11) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          gh run download 41021980064 --repo "$GITHUB_REPOSITORY" \
            --name 'v13-c3-paired109-native-41021980064-b9b83b7da73ef2f8b49a7a60df95cf51b3dbc254' \
            --dir "$e/original" > "$e/FETCH_RAW.log" 2>&1
          echo "$?" > "$e/FETCH_EXIT.txt"
          if [ "$(cat "$e/FETCH_EXIT.txt")" = 0 ]; then
            (cd "$e/original" && sha256sum -c SHA256SUMS && \
              test "$(cat HEAD.txt)" = b9b83b7da73ef2f8b49a7a60df95cf51b3dbc254) > "$e/ORIGINAL_HASH_RAW.log" 2>&1
            echo "$?" > "$e/ORIGINAL_HASH_EXIT.txt"
          else
            echo FETCH_FAILED > "$e/ORIGINAL_HASH_RAW.log"
            echo SKIPPED_RED > "$e/ORIGINAL_HASH_EXIT.txt"
          fi
          if [ "$(cat "$e/ORIGINAL_HASH_EXIT.txt")" = 0 ] && [ "$(cat "$e/TEST_EXIT.txt")" = 0 ]; then
            timeout 3m env PYTHONPATH=v13/code "$py" \
              v13/code/scripts/c3_typedread_paired109_independent_audit.py \
              --report "$e/original/PAIRED_PRIVATE_REPORT.json" \
              --out "$e/INDEPENDENT_AUDIT.json" > "$e/AUDIT_RAW.log" 2>&1
            echo "$?" > "$e/AUDIT_EXIT.txt"
          else
            echo SKIPPED_HASH_OR_TEST_RED > "$e/AUDIT_RAW.log"
            echo SKIPPED_RED > "$e/AUDIT_EXIT.txt"
          fi
          "$py" -m py_compile v13/code/scripts/c3_typedread_paired109_independent_audit.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py \
            --base b9b83b7da73ef2f8b49a7a60df95cf51b3dbc254 \
            --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check b9b83b7da73ef2f8b49a7a60df95cf51b3dbc254 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-c3-paired109-independent-${{ github.run_id }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/c3-paired109-independent/*.log
            ${{ runner.temp }}/c3-paired109-independent/*_EXIT.txt
            ${{ runner.temp }}/c3-paired109-independent/HEAD.txt
            ${{ runner.temp }}/c3-paired109-independent/SHA256SUMS
            ${{ runner.temp }}/c3-paired109-independent/INDEPENDENT_AUDIT.json
          retention-days: 30
          if-no-files-found: error
      - name: Gate original raw and independent exact scorer
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/c3-paired109-independent"
          for stage in VENV DEPS TEST FETCH ORIGINAL_HASH AUDIT COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained, no promotion"
              tail -80 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
          echo "INDEPENDENT_PAIRED109_RAW_AUDIT_ONLY_NO_STEP2_B3_JEPA_REDMI_PROMOTION"
