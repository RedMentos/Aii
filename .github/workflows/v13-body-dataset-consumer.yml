name: V13 Body Dataset Consumer
on:
  push:
    branches:
      - 'codex/v13-body-dataset-reader-*'
  pull_request:
    paths:
      - 'v13/code/v13/agi/body_dataset_reader.py'
      - 'v13/code/tests/test_body_dataset_reader.py'
      - 'v13/code/v13/agi/body_dataset_training_input.py'
      - 'v13/code/tests/test_body_dataset_training_input.py'
      - '.github/workflows/v13-body-dataset-consumer.yml'
jobs:
  dataset-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test offline dataset consumer
        working-directory: v13/code
        run: |
          python -m compileall -q v13/agi/body_dataset.py v13/agi/body_dataset_reader.py
          python -m unittest discover -s tests -p 'test_body_dataset_reader.py' -v
          python -m unittest discover -s tests -p 'test_body_dataset_training_input.py' -v
          python -m unittest discover -s tests -p 'test_body_reviewed_dataset.py' -v
          python -m unittest discover -s tests -p 'test_body_dataset_store.py' -v
