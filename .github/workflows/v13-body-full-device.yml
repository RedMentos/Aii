name: V13 Body-JEPA full device regression
on:
  push:
    branches: ['codex/v13-body-jepa-full-device-*']
  pull_request:
    paths:
      - 'v13/code/v13/body_jepa.py'
      - 'v13/code/tests/test_body_jepa_full_device_20261109.py'
  workflow_dispatch:
jobs:
  body-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and run adjacent body JEPA regressions
        working-directory: v13/code
        run: |
          python -m py_compile v13/body_jepa.py
          python -m pytest -q tests/test_body_jepa_full_device_20261109.py tests/test_body_jepa_latent_device_20261109.py tests/test_body_jepa_retention_device.py tests/test_body_jepa_retention_integrity.py tests/test_body_jepa_retention_20261108.py
