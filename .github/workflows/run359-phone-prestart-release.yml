name: V13 Run359 widget prestart interrupted-release ownership
on:
  pull_request:
    paths:
      - '.github/workflows/run359-phone-prestart-release.yml'
      - 'v13/code/v13/phone_halt.py'
      - 'v13/code/tests/test_phone_prestart_release_recovery_run359.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      V13_NO_AUTOSTART: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact head and isolated dependencies
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/RUN359_HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/run359venv"
          "$RUNNER_TEMP/run359venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
          sha256sum v13/code/v13/phone_halt.py v13/code/tests/test_phone_prestart_release_recovery_run359.py | tee "$RUNNER_TEMP/RUN359_SOURCE_SHA256SUMS.txt"
      - name: Actual SQLite prestart and standstill regressions
        id: suite
        working-directory: v13/code
        run: |
          set -uo pipefail
          "$RUNNER_TEMP/run359venv/bin/python" -m compileall -q v13/phone_halt.py tests/test_phone_prestart_release_recovery_run359.py
          PYTHONPATH="$PWD" "$RUNNER_TEMP/run359venv/bin/python" -m unittest -v \
            tests.test_phone_prestart_release_recovery_run359 \
            tests.test_phone_prestart_run128 \
            tests.test_standstill_release_recovery_run348 \
            2>&1 | tee "$RUNNER_TEMP/RUN359_TESTS_RAW.log"
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Public repository privacy scan
        id: privacy
        run: |
          set -uo pipefail
          python3 v13/code/scripts/public_repo_privacy_scan.py \
            --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree \
            2>&1 | tee "$RUNNER_TEMP/RUN359_PRIVACY_RAW.log"
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Close source-only evidence
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          find . -maxdepth 1 -type f -name 'RUN359_*' ! -name RUN359_SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > RUN359_SHA256SUMS.txt
      - name: Upload raw logs on PASS and RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V13-Run359-Widget-Release-Raw-${{ github.sha }}
          path: ${{ runner.temp }}/RUN359_*
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce actual tests and privacy result
        if: always()
        run: |
          test "${{ steps.suite.outputs.rc }}" = "0"
          test "${{ steps.privacy.outputs.rc }}" = "0"
