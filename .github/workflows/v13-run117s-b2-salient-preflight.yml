name: V13 Run117S B2 salient source six-case model-free preflight
on:
  push:
    branches:
      - assistant/v13-run117s-b2-salient-source-shadow-20261031-hourly11
  workflow_dispatch:
permissions:
  contents: read
jobs:
  salient-source-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Verify frozen source, six real Store synthetic observers and negative gates
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117s-salience"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          set +e
          test "$(git hash-object v13/code/v13/b2_salient_source_excerpt_shadow_candidate.py)" = 36d8ad62bd23e5c93b56469c2c0962f882d6a4e3
          a=$?
          test "$(git hash-object v13/code/scripts/run117s_body_complementarity_preflight.py)" = 2fde8a1bccefae8067947560974d7df0b0e18bfb
          b=$?
          test "$(git hash-object v13/code/tests/test_run117s_b2_salient_source_shadow.py)" = ce46bec8ad8cccf551472a9080ff6f4cbd76deae
          c=$?
          test "$(git hash-object v13/code/tests/test_run117s_body_complementarity_preflight.py)" = 3d01dc477ac15e3b25e766ae6b4c1a3034de99a1
          d=$?
          test "$(git hash-object v13/code/docs/fixtures/RUN117S_BODY_COMPLEMENTARITY_SEED1061.json)" = f7741de466571e67e48720395f32acbcb32ff14a
          f=$?
          echo '11d499eeb04d83e3786fe12046207ec3d0fc6684f5220a5fc1943202cd0f31de  v13/code/docs/fixtures/RUN117S_BODY_COMPLEMENTARITY_SEED1061.json' | sha256sum -c - > "$e/FIXTURE_HASH_RAW.log" 2>&1
          fixture_rc=$?
          test "$a" -eq 0 && test "$b" -eq 0 && test "$c" -eq 0 && test "$d" -eq 0 && test "$f" -eq 0 && test "$fixture_rc" -eq 0
          source_rc=$?
          echo "$source_rc" > "$e/SOURCE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run117s-venv" > "$e/VENV_RAW.log" 2>&1
          venv_rc=$?
          py="$RUNNER_TEMP/v13-run117s-venv/bin/python"
          if [ "$venv_rc" -eq 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            deps_rc=$?
          else
            echo VENV_RED > "$e/DEPS_RAW.log"
            deps_rc=1
          fi
          echo "$deps_rc" > "$e/DEPS_EXIT.txt"
          if [ "$deps_rc" -eq 0 ] && [ "$source_rc" -eq 0 ]; then
            (cd v13/code && env PYTHONPATH=. "$py" -m scripts.run117s_body_complementarity_preflight \
              --fixture docs/fixtures/RUN117S_BODY_COMPLEMENTARITY_SEED1061.json \
              --work "$RUNNER_TEMP/run117s-fresh-work" \
              --out "$RUNNER_TEMP/run117s-fresh-report") > "$e/PREFLIGHT_RAW.log" 2>&1
            preflight_rc=$?
            if [ -f "$RUNNER_TEMP/run117s-fresh-report/report.json" ]; then
              cp "$RUNNER_TEMP/run117s-fresh-report/report.json" "$e/PREFLIGHT_REPORT.json"
            fi
            (cd v13/code && env PYTHONPATH=. "$py" -m unittest -v \
              tests.test_run117s_b2_salient_source_shadow \
              tests.test_run117s_body_complementarity_preflight \
              tests.test_run117r_native_output_postgen_replay \
              tests.test_run117q_native_attribution_readonly \
              tests.test_run117_b1b2_jef_c3_role_postgen \
              tests.test_run115k_realstore_bridge_review \
              tests.test_run115k_postassembly_authority_review \
              tests.test_run116_b1b2_jef_c3_native \
              tests.test_jef_two_source_role_formatter_candidate \
              tests.test_two_source_pointer_shadow_candidate \
              tests.test_b1b2_c3_source_envelope_candidate) > "$e/TEST_RAW.log" 2>&1
            test_rc=$?
          else
            echo SOURCE_OR_DEPS_RED > "$e/PREFLIGHT_RAW.log"
            echo SOURCE_OR_DEPS_RED > "$e/TEST_RAW.log"
            preflight_rc=125
            test_rc=125
          fi
          echo "$preflight_rc" > "$e/PREFLIGHT_EXIT.txt"
          echo "$test_rc" > "$e/TEST_EXIT.txt"
          "$py" -m compileall -q v13/code/v13/b2_salient_source_excerpt_shadow_candidate.py v13/code/scripts/run117s_body_complementarity_preflight.py v13/code/tests/test_run117s_b2_salient_source_shadow.py v13/code/tests/test_run117s_body_complementarity_preflight.py > "$e/COMPILE_RAW.log" 2>&1
          compile_rc=$?
          echo "$compile_rc" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base d8f5d88cf5d620c114b6b758274753321ef1e4fb --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          privacy_rc=$?
          echo "$privacy_rc" > "$e/PRIVACY_EXIT.txt"
          git diff --check d8f5d88cf5d620c114b6b758274753321ef1e4fb HEAD > "$e/DIFF_RAW.log" 2>&1
          diff_rc=$?
          echo "$diff_rc" > "$e/DIFF_EXIT.txt"
          set -e
          "$py" - "$e" <<'PY' > "$e/RESULT_RAW.log"
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1]); names=('SOURCE','DEPS','PREFLIGHT','TEST','COMPILE','PRIVACY','DIFF')
          r={'schema':'v13.run117s.salient_b2_model_free_evidence.v1',
             'head':(e/'HEAD.txt').read_text().strip(),
             'fixture_seed':1061,
             'fixture_sha256':'11d499eeb04d83e3786fe12046207ec3d0fc6684f5220a5fc1943202cd0f31de',
             'exits':{n:int((e/(n+'_EXIT.txt')).read_text()) for n in names},
             'native_executed':False,'synthetic_body_observers':True,
             'native_c3_calls':0,'output_committed':False,
             'tool_dispatches':0,'learning_authority':0,'delivery_authority':0,
             'step2_promoted':False,'body_jepa_promoted':False,
             'redmi_measured':False,'whole_system_complete':False}
          (e/'RESULT.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat "$e/RESULT_RAW.log"
          cat "$e/PREFLIGHT_RAW.log"
          tail -n 9 "$e/TEST_RAW.log"
          for rc in "$source_rc" "$deps_rc" "$preflight_rc" "$test_rc" "$compile_rc" "$privacy_rc" "$diff_rc"; do test "$rc" -eq 0; done
      - name: Preserve original GREEN or RED source receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117s-salience-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117s-salience/
          if-no-files-found: warn
          retention-days: 90
