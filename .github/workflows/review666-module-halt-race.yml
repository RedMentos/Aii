name: V13 independent review666 mid-fetch revocation
on:
  push:
    branches: [codex/v13-review666-module-halt-race-20261027]
    paths:
      - '.github/workflows/review666-module-halt-race.yml'
      - 'v13/code/v13/modules_gate.py'
      - 'v13/code/tests/test_review666_module_halt_race.py'
  pull_request:
    branches: [claude/project-thread-07uqqx]
    paths:
      - '.github/workflows/review666-module-halt-race.yml'
      - 'v13/code/v13/modules_gate.py'
      - 'v13/code/v13/module_learn.py'
      - 'v13/code/tests/test_review666_module_halt_race.py'
permissions:
  contents: read
concurrency:
  group: v13-review666-module-halt-race
  cancel-in-progress: false
jobs:
  synthetic-sqlite:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Isolated dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/review666"
          timeout 240s "$RUNNER_TEMP/review666/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Capture exact tests, compile and privacy
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/review666proof"
          git rev-parse HEAD > "$RUNNER_TEMP/review666proof/HEAD.txt"
          sha256sum v13/code/v13/modules_gate.py v13/code/tests/test_review666_module_halt_race.py > "$RUNNER_TEMP/review666proof/SOURCE_SHA256.txt"
          (cd v13/code && PYTHONPATH="$PWD:$PWD/scripts" timeout 450s "$RUNNER_TEMP/review666/bin/python" -m unittest -v tests.test_review666_module_halt_race tests.test_modules_gate tests.test_guard2) > "$RUNNER_TEMP/review666proof/UNIT_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/review666proof/UNIT_EXIT.txt"
          "$RUNNER_TEMP/review666/bin/python" -m compileall -q v13/code/v13/modules_gate.py v13/code/tests/test_review666_module_halt_race.py > "$RUNNER_TEMP/review666proof/COMPILE_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/review666proof/COMPILE_EXIT.txt"
          "$RUNNER_TEMP/review666/bin/python" v13/code/scripts/public_repo_privacy_scan.py --base ed5010708bdb3d11c5e495f01cc07d99d359ba39 --head HEAD > "$RUNNER_TEMP/review666proof/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/review666proof/PRIVACY_EXIT.txt"
          exit 0
      - name: Preserve RED and GREEN raw receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review666-module-halt-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/review666proof/
          if-no-files-found: error
      - name: Enforce exits
        run: |
          set -euo pipefail
          for n in UNIT COMPILE PRIVACY; do
            test "$(cat "$RUNNER_TEMP/review666proof/${n}_EXIT.txt")" = 0 || { tail -80 "$RUNNER_TEMP/review666proof/${n}_RAW.log"; exit 1; }
          done
          tail -12 "$RUNNER_TEMP/review666proof/UNIT_RAW.log"
