name: V13 Run537 current full source wide regression
on:
  pull_request:
    types: [opened]
    paths:
      - '.github/workflows/run537-current-fullsuite.yml'
      - 'v13/code/docs/proofs/continuation-20261026/run537-current-fullsuite/**'
permissions:
  contents: read
  actions: read
jobs:
  source:
    if: ${{ github.event.pull_request.head.ref == 'codex/automation11-run537-current-fullsuite-20261026' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PIP_NO_CACHE_DIR: '1'
      TOKENIZERS_PARALLELISM: 'false'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact current branch source and prereg
        id: source
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/RUN537_HEAD.txt"
          test "$(git hash-object v13/code/docs/proofs/continuation-20261026/run537-current-fullsuite/PREREG.md)" = '8083ada798ca6fcd95bc0ee2fbf06987af47c892'
          test "$(git hash-object v13/code/docs/proofs/continuation-20261026/run537-current-fullsuite/BUILD_STATE_RUN537.json)" = '97f244a018898a3c6b2e146b8460181d40e38c62'
          test "$(git hash-object v13/code/v13/agi/approved_sandbox_world.py)" = '491495d861ca72fcc9d389ada1d2d1df4a49036c'
          test "$(git hash-object v13/code/tests/test_run536_approved_sandbox_world.py)" = 'edf3f73c2f316e6a49c01ebb6808bebd622d1d89'
          test "$(git hash-object v13/code/v13/operator.py)" = '26087a32767f72dff2cddfe29e764ec06babee06'
          test "$(git hash-object v13/code/scripts/run534_independent_z12a_audit.py)" = 'dfd4e9bcb675f656a131e440d43879c4d175d85a'
          { date -u -Iseconds; python3 --version; uname -a; } > "$RUNNER_TEMP/RUN537_HOST.txt"
      - name: Isolated pinned source-only dependencies and compileall
        id: deps
        run: |
          set -uo pipefail
          set +e
          python3 -m venv "$RUNNER_TEMP/run537venv"
          "$RUNNER_TEMP/run537venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52' > "$RUNNER_TEMP/RUN537_DEPS_RAW.log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            timeout 420s "$RUNNER_TEMP/run537venv/bin/python" -m pip install --disable-pip-version-check --no-input --index-url https://download.pytorch.org/whl/cpu 'torch==2.9.1+cpu' >> "$RUNNER_TEMP/RUN537_DEPS_RAW.log" 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            "$RUNNER_TEMP/run537venv/bin/python" -m compileall -q v13/code/v13 >> "$RUNNER_TEMP/RUN537_DEPS_RAW.log" 2>&1
            rc=$?
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN537_DEPS_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Pinned original Run531 raw fixture for Run534 full suite tests
        id: input
        run: |
          set -uo pipefail
          set +e
          mkdir -p "$RUNNER_TEMP/run537_input"
          curl -fsSL --retry 0 --max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/RedMentos/Aii/actions/artifacts/12649564483/zip" \
            -o "$RUNNER_TEMP/run537-original.zip" > "$RUNNER_TEMP/RUN537_INPUT_RAW.log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "c5361ce461260e5ba2740d0f60197b60bf2c5995573912afa58f25f923640f96  $RUNNER_TEMP/run537-original.zip" | sha256sum -c - >> "$RUNNER_TEMP/RUN537_INPUT_RAW.log" 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            unzip -q "$RUNNER_TEMP/run537-original.zip" -d "$RUNNER_TEMP/run537_input" >> "$RUNNER_TEMP/RUN537_INPUT_RAW.log" 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            (cd "$RUNNER_TEMP/run537_input" && sha256sum -c RUN531_SHA256SUMS.txt) >> "$RUNNER_TEMP/RUN537_INPUT_RAW.log" 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            echo "73ba92ea8e2a28a00d639dcb21caca5f8991472c4513233ad659fab65e947ea7  $RUNNER_TEMP/run537_input/RUN531_FULL.json" | sha256sum -c - >> "$RUNNER_TEMP/RUN537_INPUT_RAW.log" 2>&1
            rc=$?
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN537_INPUT_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Full unfiltered V13 source-only unittest discovery
        id: suite
        if: ${{ steps.deps.outputs.rc == '0' && steps.input.outputs.rc == '0' }}
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          export PYTHONPATH="$PWD:$PWD/scripts"
          export RUN534_RAW_JSON="$RUNNER_TEMP/run537_input/RUN531_FULL.json"
          timeout --signal=TERM --kill-after=10s 900s "$RUNNER_TEMP/run537venv/bin/python" -m unittest discover -s tests -p 'test_*.py' -v > "$RUNNER_TEMP/RUN537_TESTS_RAW.log" 2>&1
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/RUN537_TEST_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Public privacy scan
        id: privacy
        if: always()
        run: |
          set -uo pipefail
          set +e
          git fetch --no-tags --depth=100 origin "${{ github.event.pull_request.base.sha }}" > "$RUNNER_TEMP/RUN537_PRIVACY_RAW.log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree >> "$RUNNER_TEMP/RUN537_PRIVACY_RAW.log" 2>&1
            rc=$?
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN537_PRIVACY_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: SHA-close full raw evidence
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          find . -maxdepth 1 -type f -name 'RUN537_*' ! -name RUN537_SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > RUN537_SHA256SUMS.txt
      - name: Preserve every source-wide result even on RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run537-full-source-wide-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/RUN537_*
          if-no-files-found: error
          retention-days: 30
      - name: Enforce source suite and privacy
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.source.outcome }}" = success
          test "$(cat "$RUNNER_TEMP/RUN537_DEPS_EXIT.txt")" = 0
          test "$(cat "$RUNNER_TEMP/RUN537_INPUT_EXIT.txt")" = 0
          test "$(cat "$RUNNER_TEMP/RUN537_TEST_EXIT.txt")" = 0
          test "$(cat "$RUNNER_TEMP/RUN537_PRIVACY_EXIT.txt")" = 0
