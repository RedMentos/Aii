name: V13 Context/Self/Sleep Age0 source-bound restart integration
on:
  push:
    branches: [assistant/v13-context-self-sleep-age0-20261029]
    paths:
      - '.github/workflows/v13-context-self-sleep-age0-20261029.yml'
      - 'v13/code/v13/sleep.py'
      - 'v13/code/tests/test_context_self_sleep_age0_20261029.py'
      - 'v13/code/docs/proofs/continuation-20261029/V13_CROSSORGAN_AGE0_SOURCE_*'
permissions:
  contents: read
jobs:
  source-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Closed source-only exact code evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-crossorgan-age0"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          afb0bfc86125df4a810933f4adbeb483ee8cbf4e v13/code/docs/proofs/continuation-20261029/V13_CROSSORGAN_AGE0_SOURCE_PREREG.md
          ca0c0c50ae3f27661a4e9eaa5435dd1a4aac8a31 v13/code/tests/test_context_self_sleep_age0_20261029.py
          d28036f8ede96d031ec38a608c76549936c21eea v13/code/v13/context_os.py
          072ae59d75c97d972433fedd3830002d2c8530ad v13/code/v13/selfmodel.py
          3f6c91b1ab4ac02624a86049373957ff7bd93fd2 v13/code/v13/sleep.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          source_red=0
          : > "$e/SOURCE_RAW.log"
          while read -r want file; do
            got="$(git hash-object "$file" 2>/dev/null)"
            echo "$want $got $file" >> "$e/SOURCE_RAW.log"
            if [ "$want" != "$got" ]; then source_red=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$source_red" > "$e/SOURCE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-crossorgan-age0-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-crossorgan-age0-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            first="$?"
            "$py" -m pip install --disable-pip-version-check --no-input -q 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/DEPS_RAW.log" 2>&1
            second="$?"
            "$py" -m pip install --disable-pip-version-check --no-input -q 'transformers==5.20.2' 'tokenizers==0.23.1' 'safetensors==0.8.0' 'peft==0.21.2' 'gguf==0.19.0' 'Jinja2==3.1.6' 'MarkupSafe==3.0.3' >> "$e/DEPS_RAW.log" 2>&1
            third="$?"
            if [ "$first" = 0 ] && [ "$second" = 0 ] && [ "$third" = 0 ]; then echo 0 > "$e/DEPS_EXIT.txt"; else echo 1 > "$e/DEPS_EXIT.txt"; fi
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
          else echo SKIPPED > "$e/DEPS_EXIT.txt"; echo SKIPPED > "$e/PIP_CHECK_EXIT.txt"; fi
          if [ "$source_red" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ] && [ "$(cat "$e/PIP_CHECK_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_context_self_sleep_age0_20261029 tests.test_context_os tests.test_selfmodel tests.test_sleep_scheduler tests.test_sleep_validation) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else echo SKIPPED_PREREQ_RED > "$e/FOCUSED_RAW.log"; echo SKIPPED > "$e/FOCUSED_EXIT.txt"; fi
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests -p 'test_*.py') > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else echo SKIPPED_FOCUSED_RED > "$e/FULL_RAW.log"; echo SKIPPED > "$e/FULL_EXIT.txt"; fi
          "$py" -m py_compile v13/code/v13/context_os.py v13/code/v13/selfmodel.py v13/code/v13/sleep.py v13/code/tests/test_context_self_sleep_age0_20261029.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base e435583d4b2ca1dc6ac058029380e9f731d323b1 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check e435583d4b2ca1dc6ac058029380e9f731d323b1 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw and hashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-crossorgan-age0-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-crossorgan-age0/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce exact source and tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-crossorgan-age0"
          for stage in SOURCE VENV DEPS PIP_CHECK FOCUSED FULL COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED, original raw retained"
              tail -70 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'CROSSORGAN_AGE0_SOURCE_SOFTWARE_ONLY'
