name: V14 output commit atomicity
on:
  push:
    branches:
      - core/v14-output-commit-atomicity-20261123
  pull_request:
    branches:
      - gpt6/v13-private-remote-bridge-20261111
      - core/v14-output-commit-atomicity-20261123
    paths:
      - "v13/code/v13/transaction.py"
      - "v13/code/v13/broker.py"
      - "v13/code/tests/test_transaction.py"
      - ".github/workflows/v14-output-commit-atomicity.yml"
permissions:
  contents: read
jobs:
  output-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused Runtime test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.2.0 numpy==2.2.6 psutil==7.2.2 PyYAML==6.0.4
      - name: Compile output transaction and regression tests
        run: python -m py_compile v13/code/v13/transaction.py v13/code/tests/test_transaction.py
      - name: Exercise transaction, restart and output commit regressions
        env:
          PYTHONPATH: v13/code
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q v13/code/tests/test_transaction.py
      - name: Scan public diff for private data and secrets
        run: python v13/code/scripts/public_repo_privacy_scan.py --base origin/gpt6/v13-private-remote-bridge-20261111 --head HEAD --no-worktree
