name: V13 Run104 optional bounded phone JEF C3 C5 C6 and STEP2 exit smoke
on:
  push:
    branches:
      - assistant/v13-phone-c3-c5-c6-smoke-20261031-auto11
    paths:
      - v13/code/docs/RUN104_PHONE_C3_C5_EXIT_TRIGGER.txt
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      NO_MODEL_DOWNLOADS: "1"
      V13_NO_AUTOSTART: "1"
      DO_NOT_TRACK: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Execute preregistered Run104 model-free current phone acceptance
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run104-phone"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run104-venv" > "$e/VENV_RAW.log" 2>&1
          py="$RUNNER_TEMP/v13-run104-venv/bin/python"
          echo 0 > "$e/VENV_EXIT.txt"
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo 0 > "$e/DEPS_EXIT.txt"
          "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log"
          "$py" -m compileall -q v13/code/scripts/install_selftest.py v13/code/tests/test_install_selftest_run104_20261031.py > "$e/COMPILE_RAW.log" 2>&1
          echo 0 > "$e/COMPILE_EXIT.txt"
          set +e
          for spec in "INSTALL_CONTRACT:test_install_selftest.py" "RUN102_CONTRACT:test_install_selftest_run102_20261031.py" "RUN104_CONTRACT:test_install_selftest_run104_20261031.py" "JEF_C5C6:test_jef_c3_c5_c6_operator_cli.py" "STEP2_EXIT:test_step2_exit_gate_split_20261031.py" "C3_CONTEXT:test_b2_c3_context_plan_20261031.py"; do
            label="${spec%%:*}"; pattern="${spec#*:}"
            (cd v13/code && env PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests -p "$pattern" -v) > "$e/${label}_RAW.log" 2>&1
            echo $? > "$e/${label}_EXIT.txt"
          done
          "$py" v13/code/scripts/package_source.py --root v13/code --out "$e/V13-Phone-Run104.zip" --phone-install > "$e/PACKAGE_RAW.log" 2>&1
          package_rc=$?
          set -e
          echo "$package_rc" > "$e/PACKAGE_EXIT.txt"
          if test "$package_rc" -eq 0; then
            set +e
            "$py" - "$e" "$RUNNER_TEMP/v13-run104-extracted" <<'PY' > "$e/ZIP_VERIFY_RAW.log" 2>&1
          import hashlib,json,sys,zipfile
          from pathlib import Path
          e=Path(sys.argv[1]);root=Path(sys.argv[2]);zpath=e/'V13-Phone-Run104.zip'
          required=('scripts/install_selftest.py','tests/test_install_selftest_run104_20261031.py',
                    'tests/test_jef_c3_c5_c6_operator_cli.py',
                    'tests/test_step2_exit_gate_split_20261031.py',
                    'bench-results/step2-z2b-seeds-20261021/z2b_result.json',
                    'bench-results/step2-z2c-b2-rule-20261021/z2c_result.json')
          with zipfile.ZipFile(zpath) as z:
              assert z.testzip() is None
              manifest=json.loads(z.read('V13-Phone/WORKSPACE_FILES.json'))
              assert manifest['schema_version']==1
              files=manifest['files']
              for name,expected in files.items():
                  assert not name.startswith('/') and '..' not in Path(name).parts
                  assert hashlib.sha256(z.read('V13-Phone/'+name)).hexdigest()==expected,name
              for name in required:
                  assert name in files,name
                  assert z.read('V13-Phone/'+name)==(Path('v13/code')/name).read_bytes()
              z.extractall(root)
          for name,expected in files.items():
              assert hashlib.sha256((root/'V13-Phone'/name).read_bytes()).hexdigest()==expected,name
          for name in required[-2:]:
              assert json.loads((root/'V13-Phone'/name).read_text())['gate']['canonical_gate_pass'] is False
          result={'schema':'v13.run104.phone_source.software.v1',
                  'files':len(files),'zip_bytes':zpath.stat().st_size,
                  'zip_sha256':hashlib.sha256(zpath.read_bytes()).hexdigest(),
                  'all_source_hashes_match':True,
                  'native_model_executed':False,'redmi_measured':False,'gate_promoted':False}
          (e/'ZIP_REPORT.json').write_text(json.dumps(result,sort_keys=True)+'\n')
          print(json.dumps(result,sort_keys=True))
          PY
            zip_rc=$?
            if test "$zip_rc" -eq 0; then
              (cd "$RUNNER_TEMP/v13-run104-extracted/V13-Phone" && env PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests -p test_install_selftest_run104_20261031.py -v) > "$e/EXTRACTED_CONTRACT_RAW.log" 2>&1
              extracted_contract_rc=$?
              (cd "$RUNNER_TEMP/v13-run104-extracted/V13-Phone" && env PYTHONPATH=.:tests:scripts "$py" scripts/install_selftest.py --timeout-seconds 120 --cohort run104_c3_c5_exit) > "$e/EXTRACTED_RUN104_RAW.log" 2>&1
              run104_rc=$?
              (cd "$RUNNER_TEMP/v13-run104-extracted/V13-Phone" && env PYTHONPATH=.:tests:scripts "$py" scripts/install_selftest.py --timeout-seconds 120 --cohort run102_c3) > "$e/EXTRACTED_RUN102_RAW.log" 2>&1
              run102_rc=$?
              (cd "$RUNNER_TEMP/v13-run104-extracted/V13-Phone" && env PYTHONPATH=.:tests:scripts "$py" -c 'from v13.gates import summary; import json; s=summary(); assert s["gates"]["STEP2_EXIT"]=="EVIDENCE_NOT_PASSING"; print(json.dumps(s,sort_keys=True))') > "$e/EXTRACTED_GATES_RAW.log" 2>&1
              gates_rc=$?
            else
              extracted_contract_rc=125;run104_rc=125;run102_rc=125;gates_rc=125
              echo 'ZIP_RED_NO_EXTRACTED_TESTS' > "$e/EXTRACTED_CONTRACT_RAW.log"
            fi
            set -e
          else
            zip_rc=125;extracted_contract_rc=125;run104_rc=125;run102_rc=125;gates_rc=125
            echo 'PACKAGE_RED_NO_ZIP' > "$e/ZIP_VERIFY_RAW.log"
          fi
          echo "$zip_rc" > "$e/ZIP_VERIFY_EXIT.txt"
          echo "$extracted_contract_rc" > "$e/EXTRACTED_CONTRACT_EXIT.txt"
          echo "$run104_rc" > "$e/EXTRACTED_RUN104_EXIT.txt"
          echo "$run102_rc" > "$e/EXTRACTED_RUN102_EXIT.txt"
          echo "$gates_rc" > "$e/EXTRACTED_GATES_EXIT.txt"
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 70dc2e169465e948c24514ca5aebe33a4ca8fea0 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo $? > "$e/PRIVACY_EXIT.txt"
          git diff --check 70dc2e169465e948c24514ca5aebe33a4ca8fea0 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo $? > "$e/DIFF_EXIT.txt"
          set -e
          "$py" - "$e" <<'PY' > "$e/RESULT_RAW.log" 2>&1
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1])
          names=('INSTALL_CONTRACT','RUN102_CONTRACT','RUN104_CONTRACT','JEF_C5C6',
                 'STEP2_EXIT','C3_CONTEXT','PACKAGE','ZIP_VERIFY',
                 'EXTRACTED_CONTRACT','EXTRACTED_RUN104','EXTRACTED_RUN102',
                 'EXTRACTED_GATES','PRIVACY','DIFF')
          r={'schema':'v13.run104.c3_c5_exit.software.v1',
             'head':(e/'HEAD.txt').read_text().strip(),
             'exits':{n:int((e/(n+'_EXIT.txt')).read_text()) for n in names},
             'native_model_executed':False,'redmi_measured':False,
             'step2_promoted':False,'b3_promoted':False,
             'body_jepa_promoted':False,'age_promoted':False}
          (e/'RESULT.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
          echo 0 > "$e/RESULT_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat "$e/RESULT_RAW.log"
          for name in RUN104_CONTRACT EXTRACTED_CONTRACT EXTRACTED_RUN104 EXTRACTED_RUN102 JEF_C5C6; do
            echo "===== $name ====="; tail -n 7 "$e/${name}_RAW.log"
          done
          for name in INSTALL_CONTRACT RUN102_CONTRACT RUN104_CONTRACT JEF_C5C6 STEP2_EXIT C3_CONTEXT PACKAGE ZIP_VERIFY EXTRACTED_CONTRACT EXTRACTED_RUN104 EXTRACTED_RUN102 EXTRACTED_GATES PRIVACY DIFF; do
            test "$(cat "$e/${name}_EXIT.txt")" -eq 0
          done
          grep -q 'INSTALL_SELFTEST_PASS: 21 exact model-free cases' "$e/EXTRACTED_RUN104_RAW.log"
          grep -q 'INSTALL_SELFTEST_PASS: 18 exact model-free cases' "$e/EXTRACTED_RUN102_RAW.log"
      - name: Upload original raw results and source ZIP including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run104-phone-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run104-phone/
          if-no-files-found: error
          retention-days: 90
