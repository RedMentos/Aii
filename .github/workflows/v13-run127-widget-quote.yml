name: V13 Run127 Widget installer quoting
on:
  pull_request:
    paths:
      - ".github/workflows/v13-run127-widget-quote.yml"
      - "v13/code/KNOEPFE_EINRICHTEN.sh"
      - "v13/code/tests/test_widget_installer_quoting_run127.py"
      - "v13/code/docs/proofs/continuation-20261025/widget-quote-run127/**"
permissions:
  contents: read
concurrency:
  group: v13-run127-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Official privacy scan
        run: |
          set -euo pipefail
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
  software:
    needs: privacy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      NEEDLE_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
      NO_MODEL_DOWNLOADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Isolated model-free dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/run127"
          "$RUNNER_TEMP/run127/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Real shell Widget quoting and inherited tests
        run: |
          set -euo pipefail
          cd v13/code
          export PYTHONPATH="$PWD"
          bash -n KNOEPFE_EINRICHTEN.sh
          "$RUNNER_TEMP/run127/bin/python" -m compileall -q v13 tests
          for pattern in test_widget_installer_quoting_run127.py test_phone_halt.py test_phone_startup_notice_run125.py; do
            echo "RUN127_SUITE=$pattern"
            "$RUNNER_TEMP/run127/bin/python" -m unittest discover -s tests -p "$pattern" -v
          done
          echo 'RUN127_LINUX_SHELL_SOFTWARE_PASS; NOT_ANDROID_OR_NATIVE'
