name: V13 Automation11 staged12 assembler lightweight synthetic audit
on:
  push:
    branches:
      - assistant/v13-run11-step2-staged12-assembler-20261028
    paths:
      - '.github/workflows/automation11-step2-staged12-assembler-focused-20261028.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v13-run11-software-light-assembler
  cancel-in-progress: false
jobs:
  assembler-focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: "1"
      NEEDLE_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Source-pinned synthetic only, no native/model execution
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-step2-staged12-assembler-evidence"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          3509b6cdb137e3c664d8990b5f3afefd03912271 v13/code/scripts/step2_staged12_assemble.py
          17d2051f02e6ec17d4928f92836b93f7b9ec8be0 v13/code/tests/test_step2_staged12_assemble.py
          2d26102206d3ad6590b1ed436a121157b090760a v13/code/docs/coordination/AUTOMATION11_STEP2_STAGED12_ASSEMBLER_PREREG_20261028.md
          8773d5e9f9f423f5f528eb04c5c0089802b06bb1 v13/code/scripts/step2_longnote_staged12_native.py
          1680c331eee029681e1777d2ae609a32c883db05 v13/code/tests/test_step2_longnote_staged12_native.py
          128647ee0680262575807722cd670db79a709385 v13/code/scripts/step2_longnote_runner_preflight.py
          eeb4155dc3421c2b57ca0871c126f8ea2249c649 v13/code/scripts/step2_longnote_revision_fixtures.py
          5722cdcf6163331ae83677bd96394399cca0fbc3 v13/code/scripts/step2_fourarm_native_collector_candidate.py
          e07216f214b2653295eb797318b20cd862602de6 v13/code/v13/world_jepa.py
          68e7ed1352800174972558f1e0b0683a42c8689a v13/code/v13/runtime.py
          BLOBS
          : > "$e/PINS_RAW.log"
          while read -r want file; do
            got="$(git hash-object "$file" 2>/dev/null)"
            printf '%s %s %s\n' "$want" "$got" "$file" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then echo MISMATCH >> "$e/PINS_RAW.log"; fi
          done < "$e/EXPECTED_BLOBS.txt"
          if grep -q MISMATCH "$e/PINS_RAW.log"; then echo 1 > "$e/PINS_EXIT.txt"; else echo 0 > "$e/PINS_EXIT.txt"; fi
          python3 -m venv "$RUNNER_TEMP/v13-step2-staged12-assembler-venv"
          py="$RUNNER_TEMP/v13-step2-staged12-assembler-venv/bin/python"
          "$py" -m pip install --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          echo "$?" > "$e/INSTALL_EXIT.txt"
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 4m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_step2_staged12_assemble tests.test_step2_longnote_staged12_native tests.test_step2_longnote_tp27_full70_native tests.test_world_jepa_stale_fit_order) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
            "$py" -m py_compile v13/code/scripts/step2_staged12_assemble.py v13/code/tests/test_step2_staged12_assemble.py v13/code/scripts/step2_longnote_staged12_native.py > "$e/COMPILE_RAW.log" 2>&1
            echo "$?" > "$e/COMPILE_EXIT.txt"
          else
            for n in FOCUSED COMPILE; do echo SKIPPED_PREREQ_RED > "$e/${n}_RAW.log"; echo SKIPPED_RED > "$e/${n}_EXIT.txt"; done
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base a8c08ea4fe771c6815d996a91fc9acb20e7306df --head HEAD > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check a8c08ea4fe771c6815d996a91fc9acb20e7306df HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-automation11-staged12-assembler-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-step2-staged12-assembler-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce synthetic software only
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-step2-staged12-assembler-evidence"
          for name in PINS INSTALL FOCUSED COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${name}_EXIT.txt")" != 0 ]; then
              echo "$name RED; original raw retained; no native or Canon promotion"
              tail -90 "$e/${name}_RAW.log" || true
              exit 1
            fi
          done
          echo 'STAGED12_ASSEMBLER_SYNTHETIC_ONLY_NO_NATIVE_GATE_PROMOTION'
