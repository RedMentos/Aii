name: V13 Run397 append-only STEP2 native resume source proof
on:
  pull_request:
    paths:
      - '.github/workflows/run397-step2-resume.yml'
      - 'v13/code/scripts/run397_step2_resume.py'
      - 'v13/code/tests/test_run397_step2_resume.py'
      - 'v13/code/docs/proofs/continuation-20261026/run397-step2-resume/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact source and frozen Run394/model identity
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/RUN397_HEAD.txt"
          test "$(git hash-object v13/code/scripts/run394_step2_fresh.py)" = "fae7aed612108a554d8566b2917ebf31022df423"
          test "$(git hash-object v13/code/specs/models.json)" = "7af05962af41d0bc3f7dd18ef01d4eba55eabf99"
          sha256sum v13/code/scripts/run397_step2_resume.py v13/code/tests/test_run397_step2_resume.py v13/code/scripts/run394_step2_fresh.py v13/code/scripts/run396_step2_pilot_audit.py | tee "$RUNNER_TEMP/RUN397_SOURCE_HASHES.txt"
          python3 -m compileall -q v13/code/scripts/run397_step2_resume.py v13/code/tests/test_run397_step2_resume.py
      - name: Synthetic restart and inherited exact-source tests
        id: tests
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          PYTHONPATH="$PWD:$PWD/scripts" python3 -m unittest -v \
            tests.test_run394_step2_fresh tests.test_run396_step2_pilot_audit tests.test_run397_step2_resume \
            2>&1 | tee "$RUNNER_TEMP/RUN397_TESTS_RAW.log"
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Privacy scan
        id: privacy
        run: |
          set -uo pipefail
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree 2>&1 | tee "$RUNNER_TEMP/RUN397_PRIVACY_RAW.log"
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Close raw source evidence SHA256
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          find . -maxdepth 1 -type f -name 'RUN397_*' ! -name RUN397_SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > RUN397_SHA256SUMS.txt
      - name: Upload raw source-only proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V13-Run397-Resume-Raw-${{ github.sha }}
          path: ${{ runner.temp }}/RUN397_*
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce tests/privacy, no native claim
        if: always()
        run: |
          test "${{ steps.tests.outputs.rc }}" = "0"
          test "${{ steps.privacy.outputs.rc }}" = "0"
