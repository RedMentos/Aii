name: V13 Run14V learned wake effort band original RED
on:
  push:
    branches: [assistant/v13-run14v-effort-learned-wake-ceiling-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run14v-effort-original-red.yml'
permissions:
  contents: read
jobs:
  effort:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve original C2 learned wake band RED and stage exits
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run14v-original"; mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          197f77ad2c76611df33c1841e68be369ddb05bc2 v13/code/docs/EFFORT_LEARNED_BAND_PREREG_RUN14V_20261030.md
          d1cda1627b93e30701a35f022df1ff09270886b8 v13/code/tests/test_effort_learned_band_run14v.py
          e2cd61815eed0192dbe281e7edfb246d70a394ca v13/code/v13/effort.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run14v-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run14v-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
          echo "$?" > "$e/PIP_CHECK_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=.:tests "$py" -m unittest -v \
            tests.test_effort_learned_band_run14v tests.test_effort tests.test_c2_deadline_preferred_wake_run14o) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m compileall -q v13/code/v13/effort.py v13/code/tests/test_effort_learned_band_run14v.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 09f6ce79d1a7684a0421c6d509dc934218b71bf2 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 09f6ce79d1a7684a0421c6d509dc934218b71bf2 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve complete original raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run14v-original-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run14v-original/
          retention-days: 30
          if-no-files-found: error
      - name: Require setup and expose original RED
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run14v-original"
          for stage in PINS VENV DEPS PIP_CHECK COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            test "$(cat "$e/${stage}_EXIT.txt")" = 0
          done
          echo "ORIGINAL_TEST_EXIT=$(cat "$e/TEST_EXIT.txt")"
          tail -65 "$e/TEST_RAW.log"
          test "$(cat "$e/TEST_EXIT.txt")" = 0
