name: V13 Boss audited Android action to JEPA
on:
  push:
    branches:
      - boss/v13-operator-outcome-world-20261111-1545
  pull_request:
    paths:
      - 'v13/code/v13/android_control.py'
      - 'v13/code/v13/android_operator_loop.py'
      - 'v13/code/v13/android_goal_learning_demo.py'
      - 'v13/code/tests/test_boss_outcome_world_jepa.py'
      - '.github/workflows/v13-boss-audited-world.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audited-world:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: v13/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy==1.26.4
      - run: python -m compileall -q v13/android_control.py v13/android_operator_loop.py v13/android_goal_learning_demo.py
      - run: python -m pytest -q tests/test_android_control.py tests/test_android_operator_loop.py tests/test_android_companion_registry.py tests/test_android_operator_world.py tests/test_android_goal_learning_demo.py tests/test_boss_outcome_world_jepa.py
