name: V13 Auto11 restart C5 C6 persisted provenance SHADOW
on:
  push:
    branches: [assistant/v13-auto11-restart-draft-proof-20261031-1223]
    paths: ['.github/workflows/v13-auto11-restart-c5-c6-draft.yml']
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Real Runtime restart and strict source replay
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-auto11-restart"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          a9e914031a9fff9809b7979b0f8102e51b611986 v13/code/docs/AUTO11_RESTART_C5_C6_PERSISTED_PROVENANCE_PREREG_20261031.md
          dbe50b0e4ce3d5c97f2cd9c570c0e537f7a9caa8 v13/code/v13/jef_b1b2_c3_c5c6_draft_shadow.py
          a11b4fd7377fbb5eea4db9ed534d29d26f65a2e5 v13/code/v13/jef_b1b2_c3_c5c6_restart_preflight_shadow.py
          d9adaec58c98b9612fe17f02e377d134fd407ac5 v13/code/v13/c5_shadow_action_binding.py
          9130695e11cec8c05aab49639aafe2cc4fc5dbd6 v13/code/tests/test_auto11_restart_c5_c6_draft.py
          6e464c2ee5a2fe8827068b3565196e007f5ed7a0 v13/code/tests/test_auto11_shadow_c5_action_binding.py
          a93946aaaf3aeb84d98ba4ac327d49f25e16c28b v13/code/tests/test_auto11_dual_source_c5c6_draft.py
          PINS
          bad=0
          while read -r want file; do
            got="$(git hash-object "$file" 2>/dev/null)"
            echo "$want $got $file" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-auto11-restart-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-auto11-restart-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo SKIPPED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=5s 10m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m unittest -v tests.test_auto11_restart_c5_c6_draft tests.test_auto11_shadow_c5_action_binding tests.test_auto11_dual_source_c5c6_draft tests.test_run84_dual_source_c3_postgen tests.test_jef_c3_schema_source_recheck_shadow > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          python3 -m compileall -q v13/code/v13/jef_b1b2_c3_c5c6_draft_shadow.py v13/code/v13/jef_b1b2_c3_c5c6_restart_preflight_shadow.py v13/code/tests/test_auto11_restart_c5_c6_draft.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 328f1a5f6d434ea94bf4d5ccc89b62d367751617 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 328f1a5f6d434ea94bf4d5ccc89b62d367751617 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Retain raw evidence including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-auto11-restart-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-auto11-restart/
          if-no-files-found: error
          retention-days: 90
      - name: Require all exits zero
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-auto11-restart"
          for s in PINS VENV DEPS TEST COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || { tail -n 100 "$e/TEST_RAW.log"; exit 1; }
          done
          tail -n 5 "$e/TEST_RAW.log"
          echo AUTO11_RESTART_SOFTWARE_SHADOW_NO_NATIVE_NO_APPROVAL
