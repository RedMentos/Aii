name: V13 World-Model selection binding full cross-organ software review
on:
  push:
    branches: [codex/v13-worldmodel-selection-timebind-20261029-auto10af]
    paths: ['.github/workflows/v13-worldmodel-selection-full-20261029.yml']
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact-head full software regression with immutable original failure record
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-worldmodel-selection-full"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/v13/world_model.py v13/code/tests/test_worldmodel_selection_binding_20261029.py v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/SOURCE_BLOBS.txt"
          test "$(tail -1 "$e/SOURCE_BLOBS.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          echo "$?" > "$e/CANON_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-worldmodel-full-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-worldmodel-full-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            rc=$?
            if [ "$rc" = 0 ]; then
              "$py" -m pip install --disable-pip-version-check --no-input -q 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/DEPS_RAW.log" 2>&1
              rc=$?
            fi
            if [ "$rc" = 0 ]; then
              "$py" -m pip install --disable-pip-version-check --no-input -q 'transformers==5.20.2' 'tokenizers==0.23.1' 'safetensors==0.8.0' 'peft==0.21.2' 'gguf==0.19.0' 'Jinja2==3.1.6' 'MarkupSafe==3.0.3' >> "$e/DEPS_RAW.log" 2>&1
              rc=$?
            fi
            "$py" -m pip check >> "$e/DEPS_RAW.log" 2>&1
            if [ "$?" != 0 ]; then rc=1; fi
            echo "$rc" > "$e/DEPS_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
          else echo SKIPPED > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=10s 1200s env PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests -p 'test_*.py' -q) > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else echo SKIPPED > "$e/FULL_EXIT.txt"; echo SKIPPED > "$e/FULL_RAW.log"; fi
          "$py" -m compileall -q v13/code/v13/world_model.py v13/code/tests/test_worldmodel_selection_binding_20261029.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 38f21f2d201b742095343bac5150f6808773d21e --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 38f21f2d201b742095343bac5150f6808773d21e HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve full original software suite raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-worldmodel-selection-full-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-worldmodel-selection-full/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce full software regression and preserve historical failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-worldmodel-selection-full"
          for stage in CANON VENV DEPS FULL COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original full raw preserved"
              tail -60 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'WORLDMODEL_FULL_SOFTWARE_ONLY_NO_NATIVE_OR_GATE'
