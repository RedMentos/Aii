name: V13 Run13K seed239 C3 copy-vs-shadow 12-call native
on:
  push:
    branches: [assistant/v13-run13k-c3-copy-native-20261030-auto11]
    paths:
      - '.github/workflows/v13-run13k-c3-copy-native-20261030.yml'
permissions:
  contents: read
concurrency:
  group: v13-step2-budget-paired-native-20261030
  cancel-in-progress: false
jobs:
  copy-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin source, bootstrap public models and run 12 actual native C3 calls
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run13k-native"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          a8e240f47f25409eeb495d82e2dd0fe47dad0e3d v13/code/scripts/run13k_c3_copy_native.py
          fe24c325c86b4f1c53dac53f309ced4bf9a8043b v13/code/scripts/run13k_c3_copy_native_verify.py
          bf6f5441d2dbdbb64d2f49de01daaf3a37484cdd v13/code/tests/test_run13k_c3_copy_native.py
          f060d7cc2ae5344260dc32ac627fb383eeded517 v13/code/docs/fixtures/run13k_c3_copy_seed239_20261030.json
          b7d9c520519d0487c18cbcdb1bdfa8d9f71298e0 v13/code/docs/RUN13K_C3_COPY_NATIVE_PREREG_20261030.md
          de5cf4541bb45e2764ea424747dacd08e6f212e0 v13/code/scripts/run13j_c3_jef_native.py
          f27822fbd78e2ae37038df96f5a31ebb04ee11e1 v13/code/scripts/run13j_c3_jef_native_verify.py
          887aad1a55faf4b263b49c992a9e61372fce3948 v13/code/v13/agi/jef_c3_shadow_prompt_run13i.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run13k-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run13k-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_run13k_c3_copy_native tests.test_run13j_c3_jef_native_preflight) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          export V13_HOME="$RUNNER_TEMP/v13-run13k-installed"
          if [ "$(cat "$e/TEST_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 15m env PYTHONPATH=v13/code "$py" -m v13.bootstrap --home "$V13_HOME" > "$e/BOOTSTRAP_RAW.log" 2>&1
            echo "$?" > "$e/BOOTSTRAP_EXIT.txt"
          else echo SKIPPED_TEST_RED > "$e/BOOTSTRAP_RAW.log"; echo 99 > "$e/BOOTSTRAP_EXIT.txt"; fi
          if [ "$(cat "$e/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 35m env PYTHONPATH=v13/code "$py" v13/code/scripts/run13k_c3_copy_native.py --home "$V13_HOME" --out "$e/pilot" --fixture v13/code/docs/fixtures/run13k_c3_copy_seed239_20261030.json > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else echo SKIPPED_BOOTSTRAP_RED > "$e/NATIVE_RAW.log"; echo 99 > "$e/NATIVE_EXIT.txt"; fi
          if [ -f "$e/pilot/report.json" ]; then
            timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=v13/code "$py" v13/code/scripts/run13k_c3_copy_native_verify.py --pilot "$e/pilot" --fixture v13/code/docs/fixtures/run13k_c3_copy_seed239_20261030.json > "$e/REPORT_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          else echo NO_NATIVE_REPORT > "$e/REPORT_CHECK_RAW.log"; echo 99 > "$e/REPORT_CHECK_EXIT.txt"; fi
          "$py" -m py_compile v13/code/scripts/run13k_c3_copy_native.py v13/code/scripts/run13k_c3_copy_native_verify.py v13/code/tests/test_run13k_c3_copy_native.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 91ff2eb31866c909381f9b5a36dc76064ffbf2c5 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 91ff2eb31866c909381f9b5a36dc76064ffbf2c5 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original native and failure raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run13k-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run13k-native/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce actual native structural execution and independent replay only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run13k-native"
          for stage in PINS VENV DEPS TEST BOOTSTRAP NATIVE REPORT_CHECK COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED"; tail -60 "$e/${stage}_RAW.log" || true; exit 1
            fi
          done
          echo 'RUN13K_LINUX_NATIVE_C3_STRUCTURAL_ONLY_NO_STEP2_B3_JEPA_REDMI_OR_WHOLE_SYSTEM_GATE'
