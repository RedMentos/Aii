name: V13 Run27 pinned real three-organ BodySolver AG12 native vote
on:
  push:
    branches: [assistant/v13-run27-ag12-ensemble-native-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run27-ag12-vote-native.yml'
permissions:
  contents: read
concurrency:
  group: v13-native-c3-ag12-20261030
  cancel-in-progress: false
jobs:
  three-organ-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin source and run 528 real native role-calls serially, retain all raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run27-native"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          040730d68bccf1d7d3c154bb1b7657d8a47bffba v13/code/docs/AG12_THREE_ORGAN_NATIVE_PREREG_RUN27_20261030.md
          f7c23a2467b3daeae4875b7e18b1a6d83fcdbb47 v13/code/scripts/run27_ag12_three_organ_native.py
          10ceb8bd168e7a22e14b6127cf30856632431cec v13/code/tests/test_run27_ag12_three_organ_native.py
          cec8b7ec36066ee74c2ff1a3684c7517160cef3a v13/code/scripts/run25_ag12_bodies_native.py
          b781461e8fae5de9a519a0216d4d9a6a773eb498 v13/code/scripts/run24_ag12_german_c3_native.py
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          bd035cf8029850cce00b179edf533e53bf24358a v13/code/v13/models.py
          dc23e192bcd01589475692666ebb6568c80d078b v13/code/v13/bootstrap.py
          66a9419143c456f01747b4796fb327b3b36711b3 v13/code/v13/agi/solver.py
          a1cab60363814cb86472a42defb5089d4cdbd432 v13/code/v13/agi/generality.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run27-native-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run27-native-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout 4m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_run27_ag12_three_organ_native tests.test_run26_ag12_native_crossorgan tests.test_run25_ag12_bodies_native tests.test_run24_ag12_german_c3_native) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PINS_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          if [ "$(cat "$e/TEST_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=15s 45m env PYTHONPATH=v13/code "$py" v13/code/scripts/run27_ag12_three_organ_native.py --home "$RUNNER_TEMP/v13-run27-fresh-home" --out "$e/native" > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else echo SKIPPED_TEST_RED > "$e/NATIVE_RAW.log"; echo 99 > "$e/NATIVE_EXIT.txt"; fi
          if [ -f "$e/native/REPORT.json" ]; then
            "$py" - "$e/native/REPORT.json" > "$e/REPORT_CHECK_RAW.log" 2>&1 <<'PY'
          import json,pathlib,sys
          path=pathlib.Path(sys.argv[1])
          r=json.loads(path.read_text())
          assert r['evidence_kind']=='LINUX_NATIVE_AG12_BODYSOLVER_VOTE_ONLY'
          assert r['status']=='DONE' and r['seed']==13
          assert r['roles']==['B1_DETAIL','B2_GIST','C3_LANGUAGE']
          assert r['native_role_calls']==528 and r['voted_items']==176
          assert r['model_sha256']=={
              'B1_DETAIL':'bb741ebb106d543e9de114b843a3d3d73d51c74b5801e69da2abde821a0cb3e1',
              'B2_GIST':'57d1997790d1744fba5b40a7317df71ea5e2acee28c47e78f0cce39c0703f8cf',
              'C3_LANGUAGE':'3d10b6ab8fc91a919534b9558e266255aca0bbc7f6d015963599aa9e74e05b1d'}
          assert r['runner_tar_sha256']=='9abf88aea48a55d0f80edb1ee20220b186848cca0b4e919d71518cfd7ca67443'
          assert r['runner_binary_sha256']=='79e312188dc1d75c28201771f106e91de470b5cebdd838d31bb4db25eecf5d39'
          assert r['exclusive_native_residency'] and r['runtime_closed'] and r['process_reaped']
          assert r['no_events'] and r['no_messages']
          assert r['learning_mode']=='RECORD_ONLY' and r['jepa_weight']==0
          for lang in ('de','en'):
              run=r['runs'][lang]
              assert run['status']=='DONE' and run['roles']==r['roles']
              for role in r['roles']:
                  assert run['stats'][role]['items']==88 and run['stats'][role]['errors']==0
              rows=json.loads((path.parent/('AG12_'+lang.upper()+'_ROWS.json')).read_text())
              assert rows['status']=='DONE' and rows['items']==88 and len(rows['results'])==88
          assert not r['redmi_measured'] and not r['step2_promoted'] and not r['b3_promoted']
          assert not r['body_jepa_promoted'] and not r['learned_german_transfer_proven']
          assert not r['actual_live_jef_fusion_proven'] and not r['whole_system_complete']
          print('RUN27_REAL_NATIVE_BODYSOLVER_VOTE_528_CALLS_NO_LIVE_JEF_OR_AGE_PROMOTION')
          PY
            echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          else echo NO_CLOSED_NATIVE_REPORT > "$e/REPORT_CHECK_RAW.log"; echo 99 > "$e/REPORT_CHECK_EXIT.txt"; fi
          "$py" -m py_compile v13/code/scripts/run27_ag12_three_organ_native.py v13/code/tests/test_run27_ag12_three_organ_native.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 503f73faab73b1aa780813f605c68362ac7bd7d9 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 503f73faab73b1aa780813f605c68362ac7bd7d9 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve native and failed raw, never model weights
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run27-three-organ-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run27-native/
          retention-days: 30
          if-no-files-found: error
      - name: Require full native role evidence, not live JEF proof
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run27-native"
          for stage in PINS VENV DEPS TEST NATIVE REPORT_CHECK COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              tail -70 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
          echo 'RUN27_REAL_NATIVE_BODYSOLVER_ONLY_NO_LIVE_JEF_OR_WHOLE_SYSTEM_PROMOTION'
