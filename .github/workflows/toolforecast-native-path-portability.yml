name: V13 optional native restore path test portability
on:
  push:
    branches:
      - codex/current-chain-fullsuite-portability-20261027
    paths:
      - '.github/workflows/toolforecast-native-path-portability.yml'
      - 'v13/code/tests/test_toolforecast.py'
      - 'v13/code/tests/test_toolforecast_native_path_portability.py'
permissions:
  contents: read
concurrency:
  group: v13-native-path-portability
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.sha }}
      - name: Isolated dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/nativepath"
          timeout 240s "$RUNNER_TEMP/nativepath/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Capture raw test evidence
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/nativepathproof"
          git rev-parse HEAD > "$RUNNER_TEMP/nativepathproof/HEAD.txt"
          sha256sum v13/code/tests/test_toolforecast.py v13/code/tests/test_toolforecast_native_path_portability.py > "$RUNNER_TEMP/nativepathproof/SOURCE_SHA256.txt"
          (cd v13/code && PYTHONPATH="$PWD:$PWD/scripts" "$RUNNER_TEMP/nativepath/bin/python" -m unittest -v tests.test_toolforecast_native_path_portability tests.test_toolforecast) > "$RUNNER_TEMP/nativepathproof/UNIT_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/nativepathproof/UNIT_EXIT.txt"
          "$RUNNER_TEMP/nativepath/bin/python" -m compileall -q v13/code/tests/test_toolforecast.py v13/code/tests/test_toolforecast_native_path_portability.py > "$RUNNER_TEMP/nativepathproof/COMPILE_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/nativepathproof/COMPILE_EXIT.txt"
          "$RUNNER_TEMP/nativepath/bin/python" v13/code/scripts/public_repo_privacy_scan.py --base 27ada5026bb16f3d11c0b3c7689917029594d408 --head HEAD > "$RUNNER_TEMP/nativepathproof/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/nativepathproof/PRIVACY_EXIT.txt"
          exit 0
      - name: Upload raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-path-portability-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/nativepathproof/
          if-no-files-found: error
      - name: Enforce
        run: |
          set -euo pipefail
          for n in UNIT COMPILE PRIVACY; do
            test "$(cat "$RUNNER_TEMP/nativepathproof/${n}_EXIT.txt")" = 0 || { cat "$RUNNER_TEMP/nativepathproof/${n}_RAW.log"; exit 1; }
          done
          tail -18 "$RUNNER_TEMP/nativepathproof/UNIT_RAW.log"
