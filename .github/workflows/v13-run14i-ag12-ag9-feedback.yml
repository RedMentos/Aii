name: V13 Run14I AG12 AG9 feedback candidate GREEN
on:
  push:
    branches: [assistant/v13-run14i-ag12-ag9-direct-feedback-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run14i-ag12-ag9-feedback.yml'
permissions:
  contents: read
jobs:
  ag12-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact-source candidate AG12 AG9 direct feedback regression
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run14i-feedback"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          e0daa99e5953caeba49a1167cfbbbc5885a7522f v13/code/v13/agi/generality.py
          1e7d8dce2790c908dd294f3c3680dbab519adc10 v13/code/v13/agi/solver.py
          73934d854a07e73d84e4155f02c0acc7e0704a58 v13/code/tests/test_ag12_ag9_direct_feedback_run14i.py
          afadcc9d959ee7b38fb195be3b13a1ce2eb84bb2 v13/code/docs/RUN14I_AG12_AG9_DIRECT_FEEDBACK_PREREG_20261030.md
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=. python3 -m unittest -v tests.test_ag12_ag9_direct_feedback_run14i tests.test_agi_solver.Solver tests.test_ag12_suite_identity_run14h tests.test_ag12_export_isolation_run14g tests.test_ag12_language_isolation_run14f tests.test_growth.G12Eval) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m py_compile v13/code/v13/agi/generality.py v13/code/v13/agi/solver.py v13/code/tests/test_ag12_ag9_direct_feedback_run14i.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 5c5d0475ce329f4557bcaf1a517e9e7c41e32557 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 5c5d0475ce329f4557bcaf1a517e9e7c41e32557 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve candidate raw even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run14i-feedback-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run14i-feedback/
          retention-days: 30
          if-no-files-found: error
      - name: Explicit candidate GREEN requires every stage
        if: always()
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run14i-feedback"
          for stage in PINS TEST COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            test "$(cat "$e/${stage}_EXIT.txt")" = 0
          done
