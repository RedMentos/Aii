name: Run217 multi-chat backup/restore operator journey (software)
on:
  pull_request:
    paths:
      - 'v13/code/tests/test_multichat_backup_restore_run217.py'
      - 'v13/code/v13/backup.py'
      - 'v13/code/v13/operator.py'
      - '.github/workflows/run217-multichat-restore.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Isolated software prerequisites
        run: python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Actual Runtime/SQLite backup and operator regressions
        working-directory: v13/code
        run: |
          PYTHONPATH=tests:. python -m unittest -v tests.test_multichat_backup_restore_run217 tests.test_chat_operator_persistence_run214 tests.test_backup_restore_memory_run210 tests.test_restore_crash_journal_run211
          python -m compileall -q tests/test_multichat_backup_restore_run217.py
      - name: Official public repository privacy scan
        run: python v13/code/scripts/public_repo_privacy_scan.py --base 597544e2f523a73d81e947b56a4cf8a705872818 --head HEAD --no-worktree
      - name: Claim boundary
        run: echo 'Actual Runtime/SQLite and deterministic C3 double; no native model, Redmi, learning or gate promotion'
