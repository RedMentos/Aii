name: V13 Run12I broad Sleep/replay cross-organ regression
on:
  push:
    branches: [assistant/v13-run12i-sleep-replay-atomicity-20261030]
    paths:
      - '.github/workflows/v13-run12i-sleep-crossorgan-all.yml'
permissions:
  contents: read
jobs:
  sleep-crossorgan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run every named Sleep suite, preserve failures without waivers
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run12i-broad"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/v13/sleep.py > "$e/SLEEP_BLOB.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run12i-broad-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run12i-broad-venv/bin/python"
          "$py" -m pip install --no-input --disable-pip-version-check --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests timeout --signal=TERM --kill-after=5s 720s "$py" -m unittest discover -s tests -p '*sleep*.py' -v) > "$e/SLEEP_ALL_RAW.log" 2>&1
          echo "$?" > "$e/SLEEP_ALL_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests timeout --signal=TERM --kill-after=5s 240s "$py" -m unittest -v tests.test_age0_source_context_world_sleep_integration_20261029 tests.test_context_sleep_f5_crossorgan_20261028) > "$e/CROSS_RAW.log" 2>&1
          echo "$?" > "$e/CROSS_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base c91988be08b418be694257cc12509b177c6bbd29 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check c91988be08b418be694257cc12509b177c6bbd29 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve raw on RED or GREEN
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run12i-broad-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run12i-broad/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce broad review without exclusions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run12i-broad"
          for stage in VENV DEPS SLEEP_ALL CROSS PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "${stage} RED; original raw preserved"
              tail -100 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo "RUN12I_BROAD_SLEEP_CROSSORGAN_SOFTWARE_ONLY"
