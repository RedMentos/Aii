name: V13 Run43 current-source real-Store JEF B2 C3 software witness
on:
  push:
    branches: [assistant/v13-run43-current-source-handoff-realstore-20261031-hourly11]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  realstore:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact-source current Runtime real SQLite witness
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run43-realstore"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          15833fef85d1e7884d956588b43066489d4a8ddb v13/code/docs/CURRENT_SOURCE_HANDOFF_REALSTORE_PREREG_RUN43_20261031.md
          57acb60757bbaaf114c4df57897e0a094f87c9ab v13/code/tests/test_run43_current_source_handoff_realstore.py
          22ed11e4a53d9eeae8fbc74a1753082b5785be2b v13/code/v13/runtime.py
          1a9eb6f7c7cbfce83d91cc09b4ff9516cff310cf v13/code/v13/cognition.py
          9c9f2f198d43f8df55904a7f9a2cdaa46bc90601 v13/code/v13/bodyview.py
          546b97946a5036b7006fb741376e5ca42c7e1440 v13/code/v13/config.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run43-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run43-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_run43_current_source_handoff_realstore tests.test_context_source_link_budget_run13e) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo PIN_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/tests/test_run43_current_source_handoff_realstore.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          git fetch --no-tags --depth=1 origin d696bc8527e8d9ad7cdf1adaa981df7586e9a88a > "$e/FETCH_RAW.log" 2>&1
          echo "$?" > "$e/FETCH_EXIT.txt"
          python3 - > "$e/PRIVACY_RAW.log" 2>&1 <<'PY'
          import subprocess,sys
          sys.path.insert(0,'v13/code')
          from scripts.public_repo_privacy_scan import scan
          d=subprocess.check_output(['git','diff','--no-color','-U0','--text','d696bc8527e8d9ad7cdf1adaa981df7586e9a88a','HEAD'],text=True)
          hits=scan(d)
          print('privacy','CLEAN' if not hits else hits)
          sys.exit(bool(hits))
          PY
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check d696bc8527e8d9ad7cdf1adaa981df7586e9a88a HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw even on failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run43-realstore-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run43-realstore/
          if-no-files-found: error
          retention-days: 90
      - name: Require all stages zero without native or age claims
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-run43-realstore"
          for s in PINS VENV DEPS TEST COMPILE FETCH PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN43_CURRENT_REALSTORE_SOFTWARE_ONLY_NO_NATIVE_OR_STEP2_PROMOTION
