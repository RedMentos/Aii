name: V13 Run12J C2 validated Runtime route admission source-only
on:
  push:
    branches: [assistant/v13-run12j-c2-runtime-strict-tool-admission-20261030]
    paths:
      - '.github/workflows/v13-run12j-c2-runtime-strict.yml'
permissions:
  contents: read
jobs:
  c2-strict-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate strict C2 tool-call binding against old Runtime
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run12j-c2"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          22ed11e4a53d9eeae8fbc74a1753082b5785be2b v13/code/v13/runtime.py
          cfacb8739c769c8a4171ce1d19eaa477d9528eb5 v13/code/tests/test_c2_route_runtime_strict_run12j.py
          1b353cf79ca2291c6ec4cf7b69eb926a63a1b48b v13/code/v13/control_calibration_worker.py
          90d5361d1f8ad34c2311e870572a1d40146e4ca0 v13/code/v13/sleep.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run12j-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run12j-venv/bin/python"
          "$py" -m pip install --no-input --disable-pip-version-check --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests timeout --signal=TERM --kill-after=5s 420s "$py" -m unittest -v tests.test_c2_route_runtime_strict_run12j tests.test_c2_route_admission_shadow tests.test_c2_benchmark tests.test_control_calibration tests.test_c2_native_route_provenance_20261030 tests.test_c2_simple_scaffold_native_seed59_20261030 tests.test_c2_c3_body_auto_native_smoke_20261030) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          "$py" -m py_compile v13/code/v13/runtime.py v13/code/tests/test_c2_route_runtime_strict_run12j.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          git show d51058764af32f9e7dcda8f2e31228747dcef9ee:v13/code/v13/runtime.py > "$e/ORIGINAL_RUNTIME.py" 2> "$e/ORIGINAL_FETCH_RAW.log"
          (cd v13/code && ORIGINAL="$e/ORIGINAL_RUNTIME.py" PYTHONPATH=.:tests "$py" - <<'PY'
          import importlib.util, os
          from tests.test_c2_route_runtime_strict_run12j import FakeRuntime, native
          spec=importlib.util.spec_from_file_location('v13.runtime_original_run12j',os.environ['ORIGINAL'])
          original=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(original)
          control={'route':'gist','diagnostic':{'route':'both'}} | native('detail')
          old=FakeRuntime(control)
          old._route=original.Runtime._route.__get__(old,FakeRuntime)
          before=old.call()[0]
          after=FakeRuntime(control).call()[0]
          failed=native('detail',success=False) | {'route':'both'}
          old_bad=FakeRuntime(failed)
          old_bad._route=original.Runtime._route.__get__(old_bad,FakeRuntime)
          before_bad=old_bad.call()[0]
          after_bad=FakeRuntime(failed).call()[0]
          print('ORIGINAL_FOREIGN_ROUTE',before,'PATCHED_VALIDATED_ROUTE',after)
          print('ORIGINAL_FAILED_NATIVE_ROUTE',before_bad,'PATCHED_SCAFFOLD_ROUTE',after_bad)
          assert (before,after,before_bad,after_bad)==('gist','detail','both','simple')
          PY
          ) > "$e/REVIEW_RAW.log" 2>&1
          echo "$?" > "$e/REVIEW_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base d51058764af32f9e7dcda8f2e31228747dcef9ee --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check d51058764af32f9e7dcda8f2e31228747dcef9ee HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw even on RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run12j-c2-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run12j-c2/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce source-only no-new-authority review
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run12j-c2"
          for stage in PINS VENV DEPS TEST COMPILE REVIEW PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "${stage} RED; original raw preserved"
              tail -100 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo "RUN12J_C2_STRICT_TOOL_BINDING_SOFTWARE_ONLY_NO_GATE_PROMOTION"
