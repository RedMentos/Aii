name: V13 Run600 persistent chat navigation and historical export
on:
  push:
    branches:
      - codex/automation11-run600-chat-history-navigation-20261026
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/run600-chat-history-navigation.yml'
      - 'v13/code/v13/operator.py'
      - 'v13/code/tests/test_run600_chat_history_navigation.py'
permissions:
  contents: read
jobs:
  chat-history:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.ref == 'codex/automation11-run600-chat-history-navigation-20261026' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pin current source, Canon, and prereg
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/CHAT_HEAD.txt"
          test "$(sha256sum v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md | cut -d' ' -f1)" = 3423906b01b24443fcef733fb5c7ef47296963df63e603d8f843c99d544877ee
          git cat-file -e 1221589f8b75aae5c153d33635b943c2e26f5f57^{commit}
          sha256sum v13/code/v13/operator.py v13/code/v13/chat_export.py v13/code/tests/test_run600_chat_history_navigation.py v13/code/docs/proofs/continuation-20261026/run600-chat-history-navigation/PREREG.md > "$RUNNER_TEMP/CHAT_SOURCE_SHA256.txt"
      - name: Install pinned model-free dependencies
        run: python3 -m pip install --disable-pip-version-check 'numpy==2.2.6' 'prompt_toolkit==3.0.52'
      - name: Real SQLite Runtime Operator new tests
        run: |
          set +e
          (cd v13/code && python3 -m unittest discover -s tests -p test_run600_chat_history_navigation.py -v) > "$RUNNER_TEMP/CHAT_NEW_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/CHAT_NEW_EXIT.txt"
          exit 0
      - name: Existing chat export, WAL and operator regressions
        run: |
          set +e
          (cd v13/code && for p in test_run594_chat_export_stream.py test_run597_chat_export_wal_snapshot.py test_operator_search_literal_run88.py test_phone_chat_sessions_run89.py test_chat_operator_persistence_run214.py; do python3 -m unittest discover -s tests -p "$p" -v || exit $?; done) > "$RUNNER_TEMP/CHAT_REGRESSIONS_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/CHAT_REGRESSIONS_EXIT.txt"
          exit 0
      - name: Compile and privacy
        if: always()
        run: |
          set +e
          python3 -m compileall -q v13/code/v13/operator.py v13/code/tests/test_run600_chat_history_navigation.py > "$RUNNER_TEMP/CHAT_COMPILE_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/CHAT_COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 1b04791e0bfb30c4fec4a76e5b953dd3f41da2d6 --head HEAD --no-worktree > "$RUNNER_TEMP/CHAT_PRIVACY_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/CHAT_PRIVACY_EXIT.txt"
          exit 0
      - name: Close original raw evidence even on failure
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          find . -maxdepth 1 -type f -name 'CHAT_*' ! -name CHAT_SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > CHAT_SHA256SUMS.txt
      - name: Upload original raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run600-chat-navigation-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/CHAT_*
          if-no-files-found: error
          retention-days: 30
      - name: Enforce focused checks
        if: always()
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/CHAT_NEW_EXIT.txt")" = 0
          test "$(cat "$RUNNER_TEMP/CHAT_REGRESSIONS_EXIT.txt")" = 0
          test "$(cat "$RUNNER_TEMP/CHAT_COMPILE_EXIT.txt")" = 0
          test "$(cat "$RUNNER_TEMP/CHAT_PRIVACY_EXIT.txt")" = 0
