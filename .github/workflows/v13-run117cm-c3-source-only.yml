name: V13 Run117CM C3 source-only no-oracle software
on:
  push:
    branches:
      - assistant/v13-run117cm-c3-source-only-candidate-20261101-hourly11
    paths:
      - .github/workflows/v13-run117cm-c3-source-only.yml
      - v13/code/v13/jef_c3_source_only_shadow_candidate.py
      - v13/code/tests/test_run117cm_c3_source_only_candidate.py
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Source-pinned no-oracle real Store regression
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run117cm"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          6886799315457fe51698e43fd483707da7b9b5e2 v13/code/v13/jef_c3_source_only_shadow_candidate.py
          b512efece4875586a7ffa6cb9e709175de382161 v13/code/tests/test_run117cm_c3_source_only_candidate.py
          6c834c49db26f5e209a3960f4d0cc02cb9c1ed7e v13/code/docs/PREREG_RUN117CM_C3_SOURCE_ONLY_20261101.md
          5449e4f4481174b17433ae3e5af035e90a90dce0 v13/code/v13/jef_f1f5_range_admission_shadow.py
          7cfae3d54e49718181813cea68238301e2ffae87 v13/code/v13/jef_typed_source_shadow.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run117cm-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run117cm-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' 'prompt-toolkit==3.0.52' 'psutil==7.0.0' 'PyYAML==6.0.2' 'Pillow==11.3.0' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo SKIPPED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout 300s "$py" -m unittest -v tests.test_run117cm_c3_source_only_candidate tests.test_run82_jef_b1b2_c3_dual_source tests.test_b1b2_c3_source_envelope_candidate tests.test_run83_native_driver_fake_c3 tests.test_run117cj_c3_native_absence_gate) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          python3 -m py_compile v13/code/v13/jef_c3_source_only_shadow_candidate.py v13/code/tests/test_run117cm_c3_source_only_candidate.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base da5eac838296ca32eb4d111b781d45dfc8823a4e --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check da5eac838296ca32eb4d111b781d45dfc8823a4e HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original no-oracle raw GREEN or RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117cm-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117cm/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce no-oracle software gate only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117cm"
          for stage in PINS VENV DEPS TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw preserved"
              tail -70 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
          echo RUN117CM_SOURCE_ONLY_SOFTWARE_PASS_NO_NATIVE_OR_GATE_PROMOTION
