name: V13 Run132 Claude HX1 HX3 HX4 preserved shadow integration
on:
  pull_request:
    paths:
      - ".github/workflows/v13-run132-hx-preserve.yml"
      - "v13/code/v13/agi/harness.py"
      - "v13/code/v13/agi/experience.py"
      - "v13/code/v13/agi/blind_select.py"
      - "v13/code/v13/agi/self_improve.py"
      - "v13/code/v13/agi/__init__.py"
      - "v13/code/tests/test_harness_hx.py"
      - "v13/code/docs/proofs/continuation-20261025/hx134-preserve-run132/**"
permissions:
  contents: read
concurrency:
  group: v13-run132-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Official privacy and frozen Runtime
        run: |
          set -euo pipefail
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
          test "$(git hash-object v13/code/v13/runtime.py)" = "a691d27bd0772a4fa1f03d57ec90663237bf6825"
  software:
    needs: privacy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      NO_MODEL_DOWNLOADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Model-free pinned dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/run132"
          "$RUNNER_TEMP/run132/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Claude HX tests and inherited AG8/Growth tests
        run: |
          set -euo pipefail
          cd v13/code
          export PYTHONPATH="$PWD"
          "$RUNNER_TEMP/run132/bin/python" -m compileall -q v13 tests
          for pattern in test_harness_hx.py test_growth.py test_agi_live.py test_agi_solver.py test_agi_trainers.py; do
            echo "RUN132_SUITE=$pattern"
            "$RUNNER_TEMP/run132/bin/python" -m unittest discover -s tests -p "$pattern" -v
          done
          echo "RUN132_LINUX_SHADOW_PASS; NO_LIVE_HARNESS_CONSUMER_OR_NATIVE_PROOF"
