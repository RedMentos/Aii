name: V13 Run97 bounded first-install smoke minimal-deps verification
on:
  push:
    branches:
      - assistant/v13-run97-installer-smoke-20261031-auto11
    paths:
      - v13/code/docs/RUN97_INSTALL_SMOKE_TRIGGER.txt
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      V13_NO_AUTOSTART: "1"
      NO_MODEL_DOWNLOADS: "1"
      DO_NOT_TRACK: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run bounded smoke and adversarial contract with setup-only deps
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/run97-installer-smoke"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/run97-venv" > "$e/VENV_RAW.log" 2>&1
          py="$RUNNER_TEMP/run97-venv/bin/python"
          echo 0 > "$e/VENV_EXIT.txt"
          "$py" -m pip install --disable-pip-version-check --no-input -q \
            'numpy==2.2.6' 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo 0 > "$e/DEPS_EXIT.txt"
          "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log"
          bash -n v13/code/setup.sh v13/code/STARTEN.sh > "$e/SHELL_RAW.log" 2>&1
          echo 0 > "$e/SHELL_EXIT.txt"
          "$py" -m compileall -q v13/code/scripts/install_selftest.py v13/code/tests/test_install_selftest.py > "$e/COMPILE_RAW.log" 2>&1
          echo 0 > "$e/COMPILE_EXIT.txt"
          set +e
          (cd v13/code && env PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests -p test_install_selftest.py -v) > "$e/CONTRACT_RAW.log" 2>&1
          contract_rc=$?
          (cd v13/code && env PYTHONPATH=.:tests:scripts "$py" scripts/install_selftest.py --timeout-seconds 120) > "$e/SMOKE_RAW.log" 2>&1
          smoke_rc=$?
          set -e
          echo "$contract_rc" > "$e/CONTRACT_EXIT.txt"
          echo "$smoke_rc" > "$e/SMOKE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py \
            --base 2f9ad42c1c448c4f08f2319e03770de996816626 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo 0 > "$e/PRIVACY_EXIT.txt"
          git diff --check 2f9ad42c1c448c4f08f2319e03770de996816626 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo 0 > "$e/DIFF_EXIT.txt"
          "$py" - "$e" <<'PY' > "$e/RESULT_RAW.log" 2>&1
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1])
          r={'schema':'v13.run97.install_smoke_linux_minimal_deps.v1',
             'head':(e/'HEAD.txt').read_text().strip(),
             'contract_exit':int((e/'CONTRACT_EXIT.txt').read_text()),
             'smoke_exit':int((e/'SMOKE_EXIT.txt').read_text()),
             'smoke_pass':('INSTALL_SELFTEST_PASS' in (e/'SMOKE_RAW.log').read_text(errors='replace')),
             'native_model_proven':False,'redmi_measured':False,'step2_promoted':False,
             'body_jepa_promoted':False,'b3_promoted':False,'age_promoted':False}
          (e/'RESULT.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
          echo 0 > "$e/RESULT_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat "$e/RESULT_RAW.log"
          tail -n 12 "$e/SMOKE_RAW.log"
          test "$contract_rc" -eq 0
          test "$smoke_rc" -eq 0
          grep -q 'INSTALL_SELFTEST_PASS' "$e/SMOKE_RAW.log"
      - name: Upload exact raw receipts including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run97-install-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/run97-installer-smoke/
          if-no-files-found: error
          retention-days: 90
