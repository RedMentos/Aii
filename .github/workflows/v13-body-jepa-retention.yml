name: V13 Body JEPA retention regression
on:
  push:
    branches: ['codex/v13-body-jepa-retention-metrics-*']
  workflow_dispatch:
jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pytest
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and test Body JEPA retention
        working-directory: v13/code
        run: |
          python -m py_compile v13/body_jepa.py
          python -m pytest -q tests/test_body_jepa_retention_20261108.py
