name: V13 Run13Q frozen-owner F1F5 SQLite containment candidate
on:
  push:
    branches: [assistant/v13-run13q-f1f5-sqlite-guard-candidate-20261030-auto11]
    paths:
      - '.github/workflows/v13-run13q-f1f5-sqlite-candidate.yml'
      - 'v13/code/v13/jef_f1f5_source_admission.py'
      - 'v13/code/tests/test_jef_f1f5_sqlite_candidate_run13q.py'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve all original F1/F5 source and fault-injection test evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run13q-f1f5"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/CANON_BLOB.txt"
          git hash-object v13/code/v13/jef_f1f5_source_admission.py > "$e/ADMISSION_BLOB.txt"
          git hash-object v13/code/tests/test_jef_f1f5_sqlite_candidate_run13q.py > "$e/TEST_BLOB.txt"
          test "$(cat "$e/CANON_BLOB.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7 &&
          test "$(cat "$e/ADMISSION_BLOB.txt")" = 16590da170358b99b57595c63585f542c924c3ff &&
          test "$(cat "$e/TEST_BLOB.txt")" = c77a538f479c23e1351e7a151bf98cabe144e676
          echo "$?" > "$e/SOURCE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run13q-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run13q-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
          echo "$?" > "$e/PIP_CHECK_EXIT.txt"
          "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
          (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_jef_f1f5_sqlite_candidate_run13q tests.test_jef_f1f5_source_admission tests.test_jef_typed_source_shadow) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          "$py" -m py_compile v13/code/v13/jef_f1f5_source_admission.py v13/code/tests/test_jef_f1f5_sqlite_candidate_run13q.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 5d37d8cb25f5cc1dab347c3cea9a64fe08d077c5 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 5d37d8cb25f5cc1dab347c3cea9a64fe08d077c5 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve complete original raw, even RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run13q-f1f5-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run13q-f1f5/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce source, tests and privacy without waivers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run13q-f1f5"
          for stage in SOURCE VENV DEPS PIP_CHECK TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained"
              tail -90 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'RUN13Q_SQLITE_FAIL_CLOSED_CANDIDATE_NO_RUNTIME_PROMOTION'
