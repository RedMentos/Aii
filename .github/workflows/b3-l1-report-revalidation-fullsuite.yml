name: V13 B3 L1 report revalidation full software regression
on:
  push:
    branches: [assistant/v13-b3-l1-report-revalidation-review-20261027]
    paths:
      - '.github/workflows/b3-l1-report-revalidation-fullsuite.yml'
      - 'v13/code/v13/b3bridge.py'
permissions:
  contents: read
concurrency:
  group: v13-b3-l1-report-full
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Full B3 report source and raw exits
        run: |
          set +e
          evidence="$RUNNER_TEMP/b3-l1-report-full"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/HEAD.txt"
          git hash-object v13/code/v13/b3bridge.py > "$evidence/SOURCE_BLOB.txt"
          git hash-object v13/code/tests/test_b3_l1_report_revalidation_review.py > "$evidence/TEST_BLOB.txt"
          git hash-object v13/code/tests/test_b3_completion.py > "$evidence/EXISTING_TEST_BLOB.txt"
          git merge-base --is-ancestor 1e05eb86895237cfcf06ced69d33fbb720ee7629 HEAD
          echo "$?" > "$evidence/PREREG_EXIT.txt"
          git merge-base --is-ancestor ad0a87bde3fac23fd3785d9fec88f0f547b90adc HEAD
          echo "$?" > "$evidence/RED_TEST_COMMIT_EXIT.txt"
          if [ "$(cat "$evidence/SOURCE_BLOB.txt")" = "3f0efe54e2087babf267ef3d4ccbd424b897faf8" ] && [ "$(cat "$evidence/TEST_BLOB.txt")" = "ba2662593bdf260b5cbed7cb3158793a26638c92" ] && [ "$(cat "$evidence/EXISTING_TEST_BLOB.txt")" = "188ce376f1012ade7560d058752901afc22da930" ]; then echo 0; else echo 1; fi > "$evidence/FROZEN_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/b3-l1-report-full-venv"
          py="$RUNNER_TEMP/b3-l1-report-full-venv/bin/python"
          "$py" -m pip install --no-input -q 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu > "$evidence/INSTALL_RAW.log" 2>&1
          first=$?
          "$py" -m pip install --no-input -q 'numpy==2.2.6' 'psutil' 'PyYAML' 'Pillow' 'transformers==5.20.2' 'peft==0.21.2' >> "$evidence/INSTALL_RAW.log" 2>&1
          second=$?
          if [ "$first" -eq 0 ] && [ "$second" -eq 0 ]; then echo 0; else echo 1; fi > "$evidence/INSTALL_EXIT.txt"
          (
            cd v13/code
            timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=.:tests "$py" -m unittest discover -s tests -p 'test_*.py' -q
          ) > "$evidence/UNIT_RAW.log" 2>&1
          echo "$?" > "$evidence/UNIT_EXIT.txt"
          python3 -m compileall -q v13/code/v13 > "$evidence/COMPILE_RAW.log" 2>&1
          echo "$?" > "$evidence/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 80e2dfc1d39256153df6bc6ff316349c705dc65a --head HEAD > "$evidence/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$evidence/PRIVACY_EXIT.txt"
          git diff --check 80e2dfc1d39256153df6bc6ff316349c705dc65a HEAD > "$evidence/DIFF_RAW.log" 2>&1
          echo "$?" > "$evidence/DIFF_EXIT.txt"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-b3-l1-report-full-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/b3-l1-report-full/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce raw exits
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/b3-l1-report-full"
          for name in PREREG RED_TEST_COMMIT FROZEN INSTALL UNIT COMPILE PRIVACY DIFF; do
            if [ "$(cat "$evidence/${name}_EXIT.txt")" != 0 ]; then
              echo "$name failed; original raw evidence retained"
              tail -80 "$evidence/${name}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'B3_L1_REPORT_FULL_SOFTWARE_ONLY_NO_PROMOTION'
