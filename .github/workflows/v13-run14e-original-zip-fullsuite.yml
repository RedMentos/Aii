name: V13 Run14E exact original native ZIP unfiltered full suite
on:
  push:
    branches: [assistant/v13-run14e-original-zip-fullsuite-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run14e-original-zip-fullsuite.yml'
permissions:
  contents: read
  actions: read
jobs:
  unfiltered-original-zip:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Unfiltered full-suite exact original raw, no RED waivers
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run14e-fullsuite"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/v13/agi/metacog.py v13/code/v13/agi/generality.py v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/SOURCE_BLOBS.txt"
          test "$(tail -1 "$e/SOURCE_BLOBS.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          echo "$?" > "$e/CANON_EXIT.txt"
          native="$RUNNER_TEMP/run13t_native_original.zip"
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/12996917793/zip" \
            --output "$native" > "$e/ORIGINAL_FETCH_RAW.log" 2>&1
          fetch_rc="$?"
          echo "$fetch_rc" > "$e/ORIGINAL_FETCH_EXIT.txt"
          if [ "$fetch_rc" = 0 ]; then
            python3 - "$native" > "$e/ORIGINAL_RAW.log" 2>&1 <<'PY'
          import hashlib, pathlib, sys, zipfile
          path = pathlib.Path(sys.argv[1])
          expected = "86f728599312518bfa67efa0ae16e66be0eaec9ccfd8c3da8710fba40192717c"
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          if actual != expected:
              raise ValueError("RUN13T_ORIGINAL_ZIP_SHA256_RED")
          with zipfile.ZipFile(path) as z:
              names = z.namelist()
              if len(names) != len(set(names)) or z.testzip() is not None:
                  raise ValueError("RUN13T_ORIGINAL_ZIP_CRC_RED")
              entries = {}
              for line in z.read("SHA256SUMS").decode().splitlines():
                  want, name = line.split(maxsplit=1)
                  name = name.removeprefix("./")
                  if name in entries or name not in names or hashlib.sha256(z.read(name)).hexdigest() != want:
                      raise ValueError("RUN13T_ORIGINAL_ZIP_INNER_RED")
                  entries[name] = want
              if set(entries) != set(names) - {"SHA256SUMS"} or len(entries) != 39:
                  raise ValueError("RUN13T_ORIGINAL_ZIP_MANIFEST_RED")
              if len([n for n in names if n.startswith("pilot/raw/") and n.endswith(".json")]) != 16:
                  raise ValueError("RUN13T_ORIGINAL_NATIVE_ROWS_RED")
          print("RUN13T_ORIGINAL_NATIVE_ZIP_VERIFIED", actual, "CRC_OK", "39_INNER_OK", "16_ROWS")
          PY
            echo "$?" > "$e/ORIGINAL_EXIT.txt"
          else
            echo 1 > "$e/ORIGINAL_EXIT.txt"
            echo "ORIGINAL_FETCH_FAILED" > "$e/ORIGINAL_RAW.log"
          fi
          python3 -m venv "$RUNNER_TEMP/v13-run14c-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run14c-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input -q --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu' > "$e/TORCH_RAW.log" 2>&1
            echo "$?" > "$e/TORCH_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input -q 'transformers==4.44.2' > "$e/TRANSFORMERS_RAW.log" 2>&1
            echo "$?" > "$e/TRANSFORMERS_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input -q 'peft==0.13.2' > "$e/PEFT_RAW.log" 2>&1
            echo "$?" > "$e/PEFT_EXIT.txt"
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
            "$py" -c 'import torch; assert torch.__version__=="2.5.1+cpu"; print(torch.__version__, torch.cuda.is_available())' > "$e/TORCH_IMPORT_RAW.log" 2>&1
            echo "$?" > "$e/TORCH_IMPORT_EXIT.txt"
            "$py" -c 'import transformers; from transformers import GPT2Config,GPT2LMHeadModel; assert transformers.__version__=="4.44.2"; print(transformers.__version__)' > "$e/TRANSFORMERS_IMPORT_RAW.log" 2>&1
            echo "$?" > "$e/TRANSFORMERS_IMPORT_EXIT.txt"
            "$py" -c 'import peft; from peft import LoraConfig,get_peft_model; assert peft.__version__=="0.13.2"; print(peft.__version__)' > "$e/PEFT_IMPORT_RAW.log" 2>&1
            echo "$?" > "$e/PEFT_IMPORT_EXIT.txt"
          else
            for stage in DEPS TORCH TRANSFORMERS PEFT PIP_CHECK TORCH_IMPORT TRANSFORMERS_IMPORT PEFT_IMPORT; do echo SKIPPED > "$e/${stage}_EXIT.txt"; echo SKIPPED > "$e/${stage}_RAW.log"; done
          fi
          if [ "$(cat "$e/ORIGINAL_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ] && [ "$(cat "$e/TORCH_EXIT.txt")" = 0 ] && [ "$(cat "$e/TRANSFORMERS_EXIT.txt")" = 0 ] && [ "$(cat "$e/PEFT_EXIT.txt")" = 0 ] && [ "$(cat "$e/TORCH_IMPORT_EXIT.txt")" = 0 ] && [ "$(cat "$e/TRANSFORMERS_IMPORT_EXIT.txt")" = 0 ] && [ "$(cat "$e/PEFT_IMPORT_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=10s 20m env RUN13X_ORIGINAL_ZIP="$native" PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests -p 'test_*.py') > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else echo SKIPPED > "$e/FULL_EXIT.txt"; echo SKIPPED > "$e/FULL_RAW.log"; fi
          "$py" -m compileall -q v13/code/v13 v13/code/scripts > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 7e7d57e1db88642f4fcd447eda2c012c1e625bfb --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 7e7d57e1db88642f4fcd447eda2c012c1e625bfb HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve full-suite original raw even when RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run14e-fullsuite-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run14e-fullsuite/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce all original full-suite checks and negative gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run14e-fullsuite"
          for stage in CANON ORIGINAL_FETCH ORIGINAL VENV DEPS TORCH TRANSFORMERS PEFT PIP_CHECK TORCH_IMPORT TRANSFORMERS_IMPORT PEFT_IMPORT FULL COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained; no waiver or promotion"
              tail -50 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'RUN14E_FULLSUITE_SOFTWARE_GREEN_ONLY_NO_NATIVE_REDMI_OR_STEP2_GATE'
