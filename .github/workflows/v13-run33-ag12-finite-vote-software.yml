name: V13 Run33 finite AG12 vote SHADOW wiring software
on:
  push:
    branches: [assistant/v13-run33-ag12-finite-vote-shadow-20261031-hourly11]
    paths:
      - '.github/workflows/v13-run33-ag12-finite-vote-software.yml'
permissions:
  contents: read
jobs:
  finite-vote-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check frozen source pins and mock BodySolver finite vote
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run33-finite-vote"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          51b260b2b191ebf7b29cce3cfcd309aa1ef585b5 v13/code/docs/AG12_FINITE_VOTE_SHADOW_PREREG_RUN33_20261031.md
          9ec44353a723860c5efe0f87ad1ca2d456bfb71c v13/code/v13/agi/solver_confidence_finite_vote_candidate.py
          0d28864b5ad9a09577f201268d46ba5ddeeeeeda v13/code/tests/test_run33_ag12_finite_vote_shadow.py
          46982818f6c6078d823c97388c1a4ec250d82e14 v13/code/v13/agi/solver_confidence_finite_candidate.py
          66a9419143c456f01747b4796fb327b3b36711b3 v13/code/v13/agi/solver.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run33-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run33-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_run33_ag12_finite_vote_shadow tests.test_run31_ag12_finite_confidence_candidate tests.test_ag12_nonfinite_solver_run14b tests.test_agi_solver) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PIN_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          python3 -m py_compile v13/code/v13/agi/solver_confidence_finite_vote_candidate.py v13/code/tests/test_run33_ag12_finite_vote_shadow.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 550185a74e9daddaea27860f6244c1209d376af2 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 550185a74e9daddaea27860f6244c1209d376af2 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve closed software raw, including RED evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run33-finite-vote-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run33-finite-vote/
          if-no-files-found: error
          retention-days: 90
      - name: Require every software stage zero without promoting any gate
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-run33-finite-vote"
          for stage in PINS VENV DEPS TEST COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${stage}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN33_SYNTHETIC_FINITE_VOTE_SHADOW_ONLY_NO_NATIVE_OR_GATE_PROMOTION
