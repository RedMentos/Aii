name: V13 Run143 independent Run142 native answer-format audit
on:
  pull_request:
    paths:
      - ".github/workflows/v13-run143-age0d-readonly-audit.yml"
      - "v13/code/scripts/age0d_run142_readonly_audit.py"
      - "v13/code/tests/test_age0d_run142_readonly_audit.py"
      - "v13/code/docs/coordination/continuation-20261025/run143-answer-audit/**"
permissions:
  contents: read
  actions: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Official privacy scan
        run: |
          set -euo pipefail
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
  independent-readonly:
    needs: privacy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Test exact independent source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 -m compileall -q v13/code/scripts/age0d_run142_readonly_audit.py v13/code/tests/test_age0d_run142_readonly_audit.py
          (cd v13/code && PYTHONPATH=. python3 -m unittest -v tests.test_age0d_run142_readonly_audit)
      - name: Download registered Run142 artifact through official action
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: V13-Run142-C3-AGE0D-Native-2ba3688039ac6368f6cb8c0130dcaaa5dcb5d6ee
          run-id: 40156408710
          github-token: ${{ github.token }}
          repository: RedMentos/Aii
          path: ${{ runner.temp }}/run142_download
      - name: Verify exact inner hashes and recompute independent audit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])
          source=p/'run142_download'
          report=(source/'RUN142_C3_CHALLENGE_NATIVE_REPORT.json').read_bytes()
          log=(source/'RUN142_CHALLENGE_NATIVE_RAW.log').read_bytes()
          if hashlib.sha256(report).hexdigest()!='c691d0f07bef5776128bc7bdfdaa214d1704b3694d9ea1d5039dc19ab46e1b09':
              raise SystemExit('RUN143_REFUSED_REPORT_HASH')
          if hashlib.sha256(log).hexdigest()!='6b60f8c3e576923ee2fb63758148d55ef63693c750eb2519617bb07d04f114f5':
              raise SystemExit('RUN143_REFUSED_LOG_HASH')
          (p/'RUN142_C3_CHALLENGE_NATIVE_REPORT.json').write_bytes(report)
          print('RUN143_INNER_HASHES_PASS; wrapper digest checked separately by original GitHub artifact metadata')
          PY
          cd v13/code
          PYTHONPATH=. python3 scripts/age0d_run142_readonly_audit.py \
            --report "$RUNNER_TEMP/RUN142_C3_CHALLENGE_NATIVE_REPORT.json" \
            --expected-sha256 c691d0f07bef5776128bc7bdfdaa214d1704b3694d9ea1d5039dc19ab46e1b09 \
            --out "$RUNNER_TEMP/RUN143_READONLY_AUDIT.json" | tee "$RUNNER_TEMP/RUN143_AUDIT_LOG.txt"
          python3 - <<'PY'
          import json,os,pathlib
          a=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'RUN143_READONLY_AUDIT.json').read_text())
          assert a['diagnostic_statuses']=={'CORRECT':63,'MISMATCH':11,'ABSTAIN':6}
          assert a['original_abstains_with_strict_diagnostic']==32
          assert a['original_supported_disagreement']==0
          assert a['gate']=='UNVERIFIED' and a['age0d_delivery']=='OFF'
          print('RUN143_CLOSED_READONLY_RECOMPUTE_PASS')
          PY
      - name: Upload only diagnostic and test log, never model bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: V13-Run143-Readonly-Audit-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/RUN143_READONLY_AUDIT.json
            ${{ runner.temp }}/RUN143_AUDIT_LOG.txt
          if-no-files-found: warn
          retention-days: 30
