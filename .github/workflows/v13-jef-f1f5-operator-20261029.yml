name: V13 JEF explicit local F1/F5 SHADOW operator diagnostic
on:
  push:
    branches: [assistant/v13-jef-f1f5-operator-diagnostic-20261029]
    paths:
      - '.github/workflows/v13-jef-f1f5-operator-20261029.yml'
      - 'v13/code/v13/jef_f1f5_operator.py'
      - 'v13/code/v13/operator.py'
      - 'v13/code/tests/test_jef_f1f5_operator.py'
      - 'v13/code/docs/proofs/continuation-20261029/JEF_F1F5_OPERATOR_*'
permissions:
  contents: read
jobs:
  operator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Real Runtime operator SHADOW no-native source and gates
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-jef-f1f5-operator"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          83552447e8de0fd93802e14202bb37c2be2e9856 v13/code/docs/proofs/continuation-20261029/JEF_F1F5_OPERATOR_DIAGNOSTIC_PREREG.md
          28702e82594655a4ef4e5e018a5ca80c343f73a0 v13/code/v13/jef_f1f5_operator.py
          4823a811820070e944b916691d0e1e2dde98c0da v13/code/v13/operator.py
          0b47dfd43efa000c9c66b5838c0fe795f7e4838f v13/code/tests/test_jef_f1f5_operator.py
          e417c3bb4afa34a226aa116752df8c10d659a113 v13/code/v13/jef_f1f5_source_admission.py
          7cfae3d54e49718181813cea68238301e2ffae87 v13/code/v13/jef_typed_source_shadow.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          source_red=0
          : > "$e/SOURCE_RAW.log"
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/SOURCE_RAW.log"
            if [ "$want" != "$got" ]; then source_red=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$source_red" > "$e/SOURCE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-jef-f1f5-operator-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-jef-f1f5-operator-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
          else echo SKIPPED > "$e/DEPS_EXIT.txt"; echo SKIPPED > "$e/PIP_CHECK_EXIT.txt"; fi
          if [ "$source_red" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ] && [ "$(cat "$e/PIP_CHECK_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_jef_typed_source_shadow tests.test_jef_f1f5_source_admission tests.test_jef_f1f5_operator) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PREREQ_RED > "$e/TEST_RAW.log"; echo SKIPPED > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/v13/jef_f1f5_operator.py v13/code/v13/operator.py v13/code/tests/test_jef_f1f5_operator.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 86043068fda99efca34db252745cf275c96bd9bb --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 86043068fda99efca34db252745cf275c96bd9bb HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original explicit operator SHADOW raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-jef-f1f5-operator-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-jef-f1f5-operator/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce no-live-answer no-native F1/F5 operator tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-jef-f1f5-operator"
          for stage in SOURCE VENV DEPS PIP_CHECK TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED, original raw retained"
              tail -60 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'JEF_F1F5_OPERATOR_SHADOW_NO_LIVE_ANSWER_NO_GATE'
