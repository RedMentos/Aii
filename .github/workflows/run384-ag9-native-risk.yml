name: V13 Run384 AG9 native field-only selective-risk audit
on:
  pull_request:
    paths:
      - '.github/workflows/run384-ag9-native-risk.yml'
      - 'v13/code/scripts/run384_native_selective_risk.py'
      - 'v13/code/tests/test_run384_native_selective_risk.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact source and isolated dependencies
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/RUN384_HEAD.txt"
          sha256sum v13/code/scripts/run384_native_selective_risk.py v13/code/tests/test_run384_native_selective_risk.py v13/code/v13/agi/metacog.py v13/code/v13/agi/generality.py | tee "$RUNNER_TEMP/RUN384_SOURCE_SHA256SUMS.txt"
          python3 -m venv "$RUNNER_TEMP/run384venv"
          "$RUNNER_TEMP/run384venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
          python3 -m compileall -q v13/code/scripts/run384_native_selective_risk.py v13/code/tests/test_run384_native_selective_risk.py
      - name: Source-only calibration and abstention risk controls
        id: suite
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          PYTHONPATH="$PWD" "$RUNNER_TEMP/run384venv/bin/python" -m unittest -v \
            tests.test_run384_native_selective_risk \
            2>&1 | tee "$RUNNER_TEMP/RUN384_TESTS_RAW.log"
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Synthetic CLI IO smoke only (not native measurement)
        id: smoke
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          "$RUNNER_TEMP/run384venv/bin/python" - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'RUN384_FIXTURE.json'
          p.write_text(json.dumps({'evidence_level':'LINUX_NATIVE_C3_ONLY','revision':'synthetic-io-only',
            'rows':[{'arm':'synthetic','answer':'2','correct_exact':True,'confidence':.9,
              'field_supported':True,'confidence_source':'field_min_prob',
              'status':'FINAL','can_train_body':False}]}))
          PY
          PYTHONPATH="$PWD" "$RUNNER_TEMP/run384venv/bin/python" scripts/run384_native_selective_risk.py \
            --report "$RUNNER_TEMP/RUN384_FIXTURE.json" --out "$RUNNER_TEMP/RUN384_SMOKE_RESULT.json" \
            2>&1 | tee "$RUNNER_TEMP/RUN384_SMOKE_RAW.log"
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Official privacy scan
        id: privacy
        run: |
          set -uo pipefail
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree \
            2>&1 | tee "$RUNNER_TEMP/RUN384_PRIVACY_RAW.log"
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Close raw evidence
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          find . -maxdepth 1 -type f -name 'RUN384_*' ! -name RUN384_SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > RUN384_SHA256SUMS.txt
      - name: Upload exact-head source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V13-Run384-AG9Risk-Raw-${{ github.sha }}
          path: ${{ runner.temp }}/RUN384_*
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce source controls and privacy
        if: always()
        run: |
          test "${{ steps.suite.outputs.rc }}" = "0"
          test "${{ steps.smoke.outputs.rc }}" = "0"
          test "${{ steps.privacy.outputs.rc }}" = "0"
