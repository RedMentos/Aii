name: V13 Run12N observer-OFF pinned C2 C3 Body 16-turn native utility
on:
  push:
    branches: [assistant/v13-run12n-native-launch-review-20261030]
    paths:
      - '.github/workflows/v13-run12n-c2body-native.yml'
permissions:
  contents: read
concurrency:
  group: v13-step2-budget-paired-native-20261030
  cancel-in-progress: false
jobs:
  c2body-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen source, serial four-model native 16-turn and independent replay
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run12n-native"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          e8bbbaf04df479b32db40480e1fcc8bad223f48b v13/code/docs/fixtures/c2_body_observer_off_run12n_20261030.json
          cec2bf1c112774d6499ae6beaf44375bde0359b8 v13/code/docs/C2_BODY_OBSERVER_OFF_RUN12N_PREREG_20261030.md
          7911f1016abb8681e8c67f693c36cfe9128aec48 v13/code/scripts/c2_body_observer_off_run12n.py
          a78f65b1c50f07bde3f845a492f8f41385e355c8 v13/code/scripts/c2_body_observer_off_verify_run12n.py
          db9bb085132982b9ab7c02090c11abd40c75dab3 v13/code/tests/test_c2_body_observer_off_run12n.py
          c083fcc67937b79445e6ae5fd0c4f34d9190c725 v13/code/tests/test_c2_body_observer_off_verify_run12n.py
          d274a66b8ceb801c741bbffe1456611b43603208 v13/code/scripts/c2_body_disjoint_paired181_run11v.py
          4f04236507d7f4c2ae70f62aef905eefe83389d6 v13/code/scripts/c2_body_disjoint_paired181_verify_run11v.py
          d824690e942489b11c79c3aa68cd0f02e6176f06 v13/code/scripts/c2_c3_body_source_arithmetic_shadow_run11q.py
          fcd44ccce3b8b40d65a25187a78b0a8d49d9609d v13/code/scripts/step2_paired_raw_validator_audit_20261030.py
          f6bb6c26237f9c94a29a9eeac5ecc6c5fa129ad3 v13/code/scripts/step2_expression_diagnostic_20261030.py
          fb34dba97ae3700ba5accdcb928bfb72afcf4fcb v13/code/scripts/c2_native_route_provenance_20261030.py
          cee1980787f1217e9a7aa2a1f180686b4add67fb v13/code/scripts/c2_strict_native_compat_run12k.py
          22ed11e4a53d9eeae8fbc74a1753082b5785be2b v13/code/v13/runtime.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          954a3f468f10195fbce12d27f68585ee7edee2c9 v13/code/specs/control_tools.json
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run12n-native-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run12n-native-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else
            echo SKIPPED_VENV_RED > "$e/DEPS_RAW.log"
            echo 99 > "$e/DEPS_EXIT.txt"
          fi
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_c2_body_observer_off_run12n tests.test_c2_body_observer_off_verify_run12n tests.test_c2_body_disjoint_paired181_run11v tests.test_c2_body_disjoint_paired181_verify_run11v tests.test_c2_route_runtime_strict_run12j) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else
            echo SKIPPED_PINS_OR_DEPS_RED > "$e/TEST_RAW.log"
            echo 99 > "$e/TEST_EXIT.txt"
          fi
          export V13_HOME="$RUNNER_TEMP/v13-run12n-installed"
          if [ "$(cat "$e/TEST_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 15m env PYTHONPATH=v13/code "$py" -m v13.bootstrap --home "$V13_HOME" > "$e/BOOTSTRAP_RAW.log" 2>&1
            echo "$?" > "$e/BOOTSTRAP_EXIT.txt"
          else
            echo SKIPPED_TEST_RED > "$e/BOOTSTRAP_RAW.log"
            echo 99 > "$e/BOOTSTRAP_EXIT.txt"
          fi
          if [ "$(cat "$e/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 38m env PYTHONPATH=v13/code "$py" v13/code/scripts/c2_body_observer_off_run12n.py --home "$V13_HOME" --out "$e/pilot" --fixture v13/code/docs/fixtures/c2_body_observer_off_run12n_20261030.json > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else
            echo SKIPPED_BOOTSTRAP_RED > "$e/NATIVE_RAW.log"
            echo 99 > "$e/NATIVE_EXIT.txt"
          fi
          if [ -f "$e/pilot/report.json" ]; then
            timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=v13/code "$py" v13/code/scripts/c2_body_observer_off_verify_run12n.py --pilot "$e/pilot" --fixture v13/code/docs/fixtures/c2_body_observer_off_run12n_20261030.json > "$e/REPORT_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          else
            echo NO_NATIVE_REPORT > "$e/REPORT_CHECK_RAW.log"
            echo 99 > "$e/REPORT_CHECK_EXIT.txt"
          fi
          "$py" -m py_compile v13/code/scripts/c2_body_observer_off_run12n.py v13/code/scripts/c2_body_observer_off_verify_run12n.py v13/code/tests/test_c2_body_observer_off_run12n.py v13/code/tests/test_c2_body_observer_off_verify_run12n.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 6e71ce356652ea06966a59937c09756d0b4e4c45 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 6e71ce356652ea06966a59937c09756d0b4e4c45 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original native and failure raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run12n-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run12n-native/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce structural native and independent replay, not utility signal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run12n-native"
          for stage in PINS VENV DEPS TEST BOOTSTRAP NATIVE REPORT_CHECK COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "${stage} RED; original raw retained; no STEP2 gate"
              tail -80 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN12N_STRUCTURAL_NATIVE_GREEN_UTILITY_SIGNAL_SEPARATE_NO_STEP2_B3_JEPA_REDMI_OR_AGE_GATE
