name: V13 Run12N full-task posthoc original native ZIP audit
on:
  push:
    branches: [assistant/v13-run12n-fulltask-readonly-diagnostic-20261030]
    paths:
      - '.github/workflows/v13-run12n-fulltask-posthoc-audit.yml'
permissions:
  contents: read
  actions: read
jobs:
  fulltask-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      GH_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact original native artifact and run no-model diagnostic
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run12n-fulltask"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          7324f5c8c09d5e5706c40887f755285dcdcbb9a8 v13/code/scripts/c2_body_run12n_fulltask_readonly.py
          6c8fa8481a174f012f26c11b76c5b7830afbc4b5 v13/code/tests/test_c2_body_run12n_fulltask_readonly.py
          9b4357c9af59cfc8bcfe5bb3de72347b79fef020 v13/code/docs/RUN12N_FULLTASK_POSTHOC_REPORT_20261030.json
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          timeout 120s gh api --method GET -H 'Accept: application/vnd.github+json' \
            repos/RedMentos/Aii/actions/artifacts/12979551173/zip \
            > "$e/original.zip" 2> "$e/DOWNLOAD_RAW.log"
          echo "$?" > "$e/DOWNLOAD_EXIT.txt"
          sha256sum "$e/original.zip" > "$e/ORIGINAL_SHA256.log"
          if [ "$(cat "$e/DOWNLOAD_EXIT.txt")" = 0 ] && [ "$(cat "$e/PINS_EXIT.txt")" = 0 ]; then
            (cd v13/code && V13_RUN12N_ORIGINAL_ZIP="$e/original.zip" \
              timeout 90s python3 -m unittest -v \
              tests.test_c2_body_run12n_fulltask_readonly) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
            timeout 90s python3 v13/code/scripts/c2_body_run12n_fulltask_readonly.py \
              --zip "$e/original.zip" > "$e/REPORT_RAW.json" 2> "$e/DIAG_RAW.log"
            echo "$?" > "$e/DIAG_EXIT.txt"
            python3 - "$e/REPORT_RAW.json" v13/code/docs/RUN12N_FULLTASK_POSTHOC_REPORT_20261030.json <<'PY' > "$e/COMPARE_RAW.log" 2>&1
          import json,sys
          left=json.load(open(sys.argv[1]))
          right=json.load(open(sys.argv[2]))
          assert left==right, 'POSTHOC_REPORT_DIFFERS_FROM_ORIGINAL'
          print('RUN12N_ORIGINAL_FULLTASK_POSTHOC_REPORT_BYTE_SEMANTICS_MATCH')
          PY
            echo "$?" > "$e/COMPARE_EXIT.txt"
          else
            for stage in TEST DIAG COMPARE; do
              echo SKIPPED_DOWNLOAD_OR_PINS_RED > "$e/"$stage"_RAW.log"
              echo 99 > "$e/"$stage"_EXIT.txt"
            done
          fi
          python3 -m py_compile v13/code/scripts/c2_body_run12n_fulltask_readonly.py \
            v13/code/tests/test_c2_body_run12n_fulltask_readonly.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py \
            --base 1afd220740fbfd9bc50ce9060a0b26e57e85d634 --head HEAD --no-worktree \
            > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 1afd220740fbfd9bc50ce9060a0b26e57e85d634 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          rm -f "$e/original.zip"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original audit logs and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run12n-fulltask-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run12n-fulltask/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce read-only audit with no promotion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run12n-fulltask"
          for stage in PINS DOWNLOAD TEST DIAG COMPARE COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/$stage"_EXIT.txt)" != 0 ]; then
              echo "$stage RED; original logs retained; no gate"
              tail -80 "$e/$stage"_RAW.log 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN12N_POSTHOC_FULLTASK_ORIGINAL_ZIP_VERIFIED_NO_GATE
