name: V13 Body-JEPA typed batch preflight RED-first review
on:
  push:
    branches: [codex/v13-bodyjepa-typed-batch-preflight-20261030-auto11s]
    paths:
      - '.github/workflows/v13-bodyjepa-typed-batch-preflight-20261030.yml'
      - 'v13/code/v13/body_jepa_objective_bridge.py'
      - 'v13/code/tests/test_bodyjepa_typed_batch_preflight_20261030.py'
      - 'v13/code/docs/proofs/continuation-20261030/BODYJEPA_TYPED_BATCH_PREREG_20261030.md'
permissions:
  contents: read
jobs:
  typed-batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Pinned tiny-Torch tests with closed original raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-bodyjepa-typed-batch"
          w="$RUNNER_TEMP/v13-bodyjepa-typed-batch-venv"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/CANON_BLOB.txt"
          git hash-object v13/code/v13/body_jepa.py > "$e/BODYJEPA_BLOB.txt"
          git hash-object v13/code/v13/body_jepa_objective_bridge.py > "$e/BRIDGE_BLOB.txt"
          test "$(cat "$e/CANON_BLOB.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7 &&
          test "$(cat "$e/BODYJEPA_BLOB.txt")" = be022258cd46cc11e460dd7438563c0d0cc4a0eb
          echo "$?" > "$e/SOURCE_EXIT.txt"
          python3 -m venv "$w" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$w/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --no-input --disable-pip-version-check 'numpy==2.2.6' 'psutil==7.1.0' 'PyYAML==6.0.3' 'Pillow==11.3.0' 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip install --no-input --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu' > "$e/TORCH_RAW.log" 2>&1
            echo "$?" > "$e/TORCH_EXIT.txt"
            "$py" -m pip install --no-input --disable-pip-version-check 'transformers==4.44.2' 'peft==0.13.2' > "$e/HF_RAW.log" 2>&1
            echo "$?" > "$e/HF_EXIT.txt"
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
          else
            for s in DEPS TORCH HF PIP_CHECK; do echo SKIPPED > "$e/${s}_EXIT.txt"; done
          fi
          if [ "$(cat "$e/SOURCE_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ] &&
             [ "$(cat "$e/TORCH_EXIT.txt")" = 0 ] && [ "$(cat "$e/HF_EXIT.txt")" = 0 ] &&
             [ "$(cat "$e/PIP_CHECK_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_bodyjepa_typed_batch_preflight_20261030 tests.test_body_jepa_objective_bridge_20261030 tests.test_body_jepa) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
            "$py" -m py_compile v13/code/v13/body_jepa_objective_bridge.py v13/code/tests/test_bodyjepa_typed_batch_preflight_20261030.py > "$e/COMPILE_RAW.log" 2>&1
            echo "$?" > "$e/COMPILE_EXIT.txt"
          else
            echo SKIPPED > "$e/TEST_EXIT.txt"
            echo SKIPPED > "$e/COMPILE_EXIT.txt"
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base e1e9228318b2152875bd6e5b402f5cf2c50213df --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check e1e9228318b2152875bd6e5b402f5cf2c50213df HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original RED or GREEN raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-bodyjepa-typed-batch-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-bodyjepa-typed-batch/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce all checks without waiver
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-bodyjepa-typed-batch"
          for s in SOURCE VENV DEPS TORCH HF PIP_CHECK TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${s}_EXIT.txt")" != 0 ]; then
              echo "$s RED; original raw retained; no native/Redmi/Age promotion"
              tail -80 "$e/${s}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'BODYJEPA_TYPED_BATCH_SOFTWARE_ONLY_ZERO_AUTHORITY'
