name: V13 Run11 German half calc proposal Age0 policy guards
on:
  push:
    branches:
      - assistant/v13-run11-german-half-calc-proposer-20261028
    paths:
      - '.github/workflows/run11-german-half-calc-guards-20261028.yml'
      - 'v13/code/v13/toolstep.py'
      - 'v13/code/tests/test_toolstep.py'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: "1"
      NO_MODEL_DOWNLOADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test parser, shadow policy and existing tool regressions
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-german-half-guards"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/v13/toolstep.py > "$e/TOOLSTEP_BLOB.txt"
          git hash-object v13/code/tests/test_toolstep.py > "$e/TEST_BLOB.txt"
          python3 -m venv "$RUNNER_TEMP/v13-german-half-venv"
          py="$RUNNER_TEMP/v13-german-half-venv/bin/python"
          "$py" -m pip install --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          echo "$?" > "$e/INSTALL_EXIT.txt"
          if [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_toolstep tests.test_calc_tool_ablation tests.test_calc_tool_span_ablation tests.test_calc_tool_producer_ablation) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else
            echo SKIPPED_INSTALL_RED > "$e/FOCUSED_RAW.log"
            echo SKIPPED_RED > "$e/FOCUSED_EXIT.txt"
          fi
          python3 -m compileall -q v13/code/v13/toolstep.py v13/code/tests/test_toolstep.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base db7702f151aa951a6f4293f98585687e6ca9c8ae --head HEAD > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check db7702f151aa951a6f4293f98585687e6ca9c8ae HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-german-half-guards-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-german-half-guards/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce focused source and policy checks
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-german-half-guards"
          for name in INSTALL FOCUSED COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${name}_EXIT.txt")" != 0 ]; then
              echo "$name RED; raw retained"
              tail -80 "$e/${name}_RAW.log" || true
              exit 1
            fi
          done
          echo 'GERMAN_HALF_CALC_PROPOSAL_AGE0_SHADOW_ONLY_NO_TOOL_AUTHORITY'
