name: V13 P2X CAL36 pinned LoRA calibration native diagnostic

on:
  push:
    branches: [codex/v13-p2x-cal36-transport-20261029]
    paths: ['.github/workflows/v13-p2x-cal36-native-20261029.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: v13-p2-qad-fp32-real-value-serial-20261029
  cancel-in-progress: false

jobs:
  cal36-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      V13_NO_AUTOSTART: '1'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact review branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned CAL36 native execution and raw closure
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-p2x-cal36-native-evidence"
          work="$RUNNER_TEMP/v13-p2x-cal36-native-work"
          home="$RUNNER_TEMP/v13-p2x-cal36-native-home"
          mkdir -p "$e" "$work" "$home"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          d224298df0657b4ac1326d32ee504642a1ef7e6a v13/code/docs/P2X_CAL36_TRANSPORT_PREREG_20261029.md
          8b8634375c37c40f804907120951d308ddb15a7f v13/code/scripts/p2x_cal36_transport.py
          3232ce1ab9f483ec16b85e52da4ab06e63175f6a v13/code/tests/test_p2x_cal36_transport_20261029.py
          29fa99031862f534afe835a3a997ecb62b9b1752 v13/code/scripts/p2x_candidate360_standalone.py
          8135fa2792df2c541dc1719e49d941c775703697 v13/code/scripts/p2x_disjoint_receiver_trainset.py
          c9509e299510540af4e43ebbc397f2e5a144142d v13/code/scripts/p2x_native_receiver_eval_scorer.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          source_red=0
          : > "$e/SOURCE_RAW.log"
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            printf '%s %s %s\n' "$want" "$got" "$path" >> "$e/SOURCE_RAW.log"
            if [ "$want" != "$got" ]; then source_red=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$source_red" > "$e/SOURCE_EXIT.txt"
          if [ "$source_red" = 0 ]; then
            python3 - "$work" > "$e/RESOURCE_RAW.log" 2>&1 <<'PY'
          import sys
          sys.path.insert(0,"v13/code/scripts")
          from p2x_c3_lora_pilot import resource_admission
          print(resource_admission(sys.argv[1]))
          PY
            echo "$?" > "$e/RESOURCE_EXIT.txt"
          else echo SKIPPED > "$e/RESOURCE_EXIT.txt"; fi
          if [ "$(cat "$e/RESOURCE_EXIT.txt")" = 0 ]; then
            python3 -m venv "$work/venv" > "$e/VENV_RAW.log" 2>&1
            echo "$?" > "$e/VENV_EXIT.txt"
          else echo SKIPPED > "$e/VENV_EXIT.txt"; fi
          py="$work/venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input               'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52'               > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
          else echo SKIPPED > "$e/DEPS_EXIT.txt"; echo SKIPPED > "$e/PIP_CHECK_EXIT.txt"; fi
          if [ "$(cat "$e/PIP_CHECK_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v               tests.test_p2x_cal36_transport_20261029               tests.test_p2x_lora_scaled_cli_review) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else echo SKIPPED > "$e/FOCUSED_EXIT.txt"; fi
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=20s 1500s               "$py" -m scripts.p2x_base360_native_executor --home "$home" --install)               > "$e/INSTALL_RAW.log" 2>&1
            echo "$?" > "$e/INSTALL_EXIT.txt"
          else echo SKIPPED > "$e/INSTALL_EXIT.txt"; fi
          if [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ]; then
            curl -fLsS --retry 2 --connect-timeout 20 --max-time 240               'https://github.com/ggml-org/llama.cpp/releases/download/b10964/llama-b10964-bin-ubuntu-x64.tar.gz'               -o "$work/runner.tar.gz" > "$e/RUNTIME_DOWNLOAD_RAW.log" 2>&1
            echo "$?" > "$e/RUNTIME_DOWNLOAD_EXIT.txt"
            printf '%s  %s\n' '9abf88aea48a55d0f80edb1ee20220b186848cca0b4e919d71518cfd7ca67443' "$work/runner.tar.gz"               | sha256sum -c > "$e/RUNTIME_SHA_RAW.log" 2>&1
            echo "$?" > "$e/RUNTIME_SHA_EXIT.txt"
          else echo SKIPPED > "$e/RUNTIME_DOWNLOAD_EXIT.txt"; echo SKIPPED > "$e/RUNTIME_SHA_EXIT.txt"; fi
          if [ "$(cat "$e/RUNTIME_SHA_EXIT.txt")" = 0 ]; then
            curl -fLsS --retry 2 --connect-timeout 20 --max-time 240               -H "Authorization: Bearer $GITHUB_TOKEN"               -H 'Accept: application/vnd.github+json'               'https://api.github.com/repos/RedMentos/Aii/actions/artifacts/12896411365/zip'               -o "$work/adapter.zip" > "$e/ADAPTER_DOWNLOAD_RAW.log" 2>&1
            echo "$?" > "$e/ADAPTER_DOWNLOAD_EXIT.txt"
            printf '%s  %s\n' 'c86ef27fc5a8abe4419888329286d271d971a2a6b63f9fd6c1d8ed704cf81a09' "$work/adapter.zip"               | sha256sum -c > "$e/ADAPTER_SHA_RAW.log" 2>&1
            echo "$?" > "$e/ADAPTER_SHA_EXIT.txt"
            if [ "$(cat "$e/ADAPTER_SHA_EXIT.txt")" = 0 ]; then
              mkdir -p "$work/adapter"
              unzip -q "$work/adapter.zip" -d "$work/adapter" > "$e/ADAPTER_UNZIP_RAW.log" 2>&1
              echo "$?" > "$e/ADAPTER_UNZIP_EXIT.txt"
              printf '%s  %s\n' '062c20d796c59169579529f4a069f77693a847123f599d00f374bd01a8618e92' "$work/adapter/adapter/adapter.gguf"                 | sha256sum -c > "$e/ADAPTER_GGUF_SHA_RAW.log" 2>&1
              echo "$?" > "$e/ADAPTER_GGUF_SHA_EXIT.txt"
            else echo SKIPPED > "$e/ADAPTER_UNZIP_EXIT.txt"; echo SKIPPED > "$e/ADAPTER_GGUF_SHA_EXIT.txt"; fi
          else for stage in ADAPTER_DOWNLOAD ADAPTER_SHA ADAPTER_UNZIP ADAPTER_GGUF_SHA; do echo SKIPPED > "$e/${stage}_EXIT.txt"; done; fi
          if [ "$(cat "$e/ADAPTER_GGUF_SHA_EXIT.txt")" = 0 ]; then
            PYTHONPATH=v13/code "$py" - "$home" > "$e/MODEL_PATH_RAW.log" 2>&1 <<'PY'
          import sys
          from pathlib import Path
          from v13.models import ModelManager
          print(ModelManager(Path(sys.argv[1])).path_for("C3_LANGUAGE"))
          PY
            echo "$?" > "$e/MODEL_PATH_EXIT.txt"
          else echo SKIPPED > "$e/MODEL_PATH_EXIT.txt"; fi
          if [ "$(cat "$e/MODEL_PATH_EXIT.txt")" = 0 ]; then
            model_path="$(tail -1 "$e/MODEL_PATH_RAW.log")"
            (cd v13/code && PYTHONPATH=.:scripts timeout --signal=TERM --kill-after=20s 2100s               "$py" -m scripts.p2x_cal36_transport               --server-binary "$(readlink -f "$home/bin/llama-server")"               --runtime-archive "$work/runner.tar.gz"               --model "$model_path"               --adapter "$work/adapter/adapter/adapter.gguf"               --out "$work/cal36") > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else echo SKIPPED > "$e/NATIVE_EXIT.txt"; fi
          if [ -d "$work/cal36" ]; then cp -a "$work/cal36" "$e/evidence"; fi
          if [ "$(cat "$e/NATIVE_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:scripts "$py" -m scripts.p2x_cal36_transport               --verify "$e/evidence") > "$e/VERIFY_RAW.json" 2>&1
            echo "$?" > "$e/VERIFY_EXIT.txt"
          else echo SKIPPED > "$e/VERIFY_EXIT.txt"; fi
          python3 v13/code/scripts/public_repo_privacy_scan.py             --base 6cf8a19ead783ec12461edbe54230a8d94fe3ac1 --head HEAD --no-worktree             > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 6cf8a19ead783ec12461edbe54230a8d94fe3ac1 HEAD             > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw including failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-p2x-cal36-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-p2x-cal36-native-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce pinned source and closed 72-call diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-p2x-cal36-native-evidence"
          for stage in SOURCE RESOURCE VENV DEPS PIP_CHECK FOCUSED INSTALL RUNTIME_DOWNLOAD RUNTIME_SHA ADAPTER_DOWNLOAD ADAPTER_SHA ADAPTER_UNZIP ADAPTER_GGUF_SHA MODEL_PATH NATIVE VERIFY PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; raw preserved; no gate promotion"
              tail -50 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          python3 - "$e/VERIFY_RAW.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["status"]=="P2X_CAL36_DIAGNOSTIC_NO_GATE"
          assert x["rows"]==36 and x["native_calls"]==72
          assert x["validation_rows_used"]==0 and x["train_rows_used"]==0
          assert x["step2_status"]=="UTILITY_FAIL"
          assert x["jepa_weight"]==0 and x["ag6_approved"] is False
          assert x["whole_system_complete"] is False
          print("P2X_CAL36_LINUX_NATIVE_DIAGNOSTIC_ONLY_NO_GATE")
          PY
