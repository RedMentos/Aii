name: V13 Body native training port containment review
on:
  push:
    branches: [assistant/v13-body-train-port-containment-20261030]
permissions:
  contents: read
jobs:
  fail-closed-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen port containment regression, no native training
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-body-port-containment"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git merge-base --is-ancestor 2b31f25ba3c865c8e01712e6778a56c55c4387a5 HEAD > "$e/PREREG_RAW.log" 2>&1
          echo "$?" > "$e/PREREG_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/body-port-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/body-port-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_body_train_port_containment_20261030 tests.test_body_training_port) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          "$py" -m py_compile v13/code/v13/body_training.py v13/code/tests/test_body_train_port_containment_20261030.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 30bcf62f22c70107f920276263df6a7e9f8872de --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 30bcf62f22c70107f920276263df6a7e9f8872de HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-body-port-containment-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-body-port-containment/
          retention-days: 30
          if-no-files-found: error
      - name: Require source-only containment tests
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-body-port-containment"
          for stage in PREREG VENV DEPS TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED"
              tail -70 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo "BODY_TRAIN_PORT_CONTAINMENT_SOFTWARE_ONLY_ZERO_TRAINING_AUTHORITY"
