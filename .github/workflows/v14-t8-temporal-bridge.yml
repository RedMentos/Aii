name: V14 T8 temporal bridge and real Store tests
on:
  pull_request:
    paths:
      - v14/learning/**
      - .github/workflows/v14-t8-temporal-bridge.yml
  push:
    branches:
      - boss/v14-t8-temporal-store-integration-20261121
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime test dependencies
        run: python -m pip install numpy pytest psutil
      - name: Compile V14 learning modules
        run: python -m py_compile v14/learning/*.py
      - name: Run V14 temporal ledger, receiver, and real SQLite Store integration
        run: PYTHONPATH=v13/code:v14/learning python -m pytest -q v14/learning/test_*.py
