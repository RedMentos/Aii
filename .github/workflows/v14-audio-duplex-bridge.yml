name: V14 RAW EAR audio duplex bridge

on:
  push:
    branches:
      - "research-perception/**"
    paths:
      - "v13/code/v13/audio_duplex_bridge.py"
      - "v13/code/v13/duplex.py"
      - "v13/code/v13/audio_voice_cues.py"
      - "v13/code/v13/audio_teacher_ear.py"
      - "v13/code/v13/audio_temporal_evidence.py"
      - "v13/code/v13/audio_speaker_evidence.py"
      - "v13/code/tests/test_audio_temporal_evidence.py"
      - "v13/code/tests/test_audio_speaker_evidence.py"
      - "v13/code/tests/test_audio_ear_voice_cues_v14.py"
      - "v13/code/tests/test_audio_duplex_bridge.py"
      - "v13/code/tests/test_audio_teacher_ear.py"
      - "v13/code/tests/test_audio_teacher_ear_runtime_integration.py"
      - ".github/workflows/v14-audio-duplex-bridge.yml"
  pull_request:
    branches:
      - "gpt6/v13-private-remote-bridge-20261111"
    paths:
      - "v13/code/v13/audio_duplex_bridge.py"
      - "v13/code/v13/duplex.py"
      - "v13/code/v13/audio_voice_cues.py"
      - "v13/code/v13/audio_teacher_ear.py"
      - "v13/code/v13/audio_temporal_evidence.py"
      - "v13/code/v13/audio_speaker_evidence.py"
      - "v13/code/tests/test_audio_temporal_evidence.py"
      - "v13/code/tests/test_audio_speaker_evidence.py"
      - "v13/code/tests/test_audio_ear_voice_cues_v14.py"
      - "v13/code/tests/test_audio_duplex_bridge.py"
      - "v13/code/tests/test_audio_teacher_ear.py"
      - "v13/code/tests/test_audio_teacher_ear_runtime_integration.py"
      - ".github/workflows/v14-audio-duplex-bridge.yml"

permissions:
  contents: read

jobs:
  audio-duplex-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest==9.2.0 numpy==2.3.5
      - name: Compile exact bridge and integration tests
        run: |
          python -m py_compile \
            v13/code/v13/audio_duplex_bridge.py \
            v13/code/v13/duplex.py \
            v13/code/v13/audio_teacher_ear.py \
            v13/code/v13/audio_voice_cues.py \
            v13/code/v13/audio_temporal_evidence.py \
            v13/code/v13/audio_speaker_evidence.py \
            v13/code/tests/test_audio_temporal_evidence.py \
            v13/code/tests/test_audio_speaker_evidence.py \
            v13/code/tests/test_audio_ear_voice_cues_v14.py \
            v13/code/tests/test_audio_duplex_bridge.py \
            v13/code/tests/test_audio_teacher_ear.py \
            v13/code/tests/test_audio_teacher_ear_runtime_integration.py
      - name: Run source-bound RAW EAR and optional Teacher Ear Runtime tests
        env:
          PYTHONPATH: v13/code
        run: |
          python -m pytest -q \
            v13/code/tests/test_audio_duplex_bridge.py \
            v13/code/tests/test_audio_temporal_evidence.py \
            v13/code/tests/test_audio_speaker_evidence.py \
            v13/code/tests/test_audio_ear_voice_cues_v14.py \
            v13/code/tests/test_audio_teacher_ear.py \
            v13/code/tests/test_audio_teacher_ear_runtime_integration.py
