name: V13 Run46B disjoint seed401 JEF exact source eligibility real SQLite SHADOW
on:
  push:
    branches: [assistant/v13-run46b-jef-source-eligibility-shadow-20261031-hourly11]
    paths: ['.github/workflows/v13-run46b-jef-source-eligibility-shadow.yml']
permissions:
  contents: read
jobs:
  realstore-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact pins, six disjoint real SQLite witnesses, adversarial no-authority tests
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run46b-jef"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          ccc56360fc1020562e5f77dbf235c421cec4b1a6 v13/code/docs/fixtures/run46b_jef_source_eligibility_seed401.json
          f8413b389e198086569826c3afc1ebc9ad6f97a1 v13/code/docs/RUN46B_JEF_SOURCE_ELIGIBILITY_PREREG_20261031.md
          d1186642d5f4b7ef4af0699f07a2fe682b1484e2 v13/code/v13/agi/jef_eligibility_source_shadow_run46b.py
          b106567d5383093c4c5bf8c848651cb85ef6bf94 v13/code/tests/test_run46b_jef_source_eligibility_shadow.py
          e1f1a2d09a614378a75e397819fdce96a46de22d v13/code/v13/agi/eligibility.py
          0779d986fb8aee8aa01c5df5f656889d4bd56348 v13/code/v13/store.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          sha256sum v13/code/docs/fixtures/run46b_jef_source_eligibility_seed401.json > "$e/FIXTURE_SHA_RAW.log" 2>&1
          test "$(cut -d' ' -f1 "$e/FIXTURE_SHA_RAW.log")" = 8aa69cc86d2e2067e809d4f703ddbff3fc575ea111d7afd97a73012e0bda0e21
          echo "$?" > "$e/FIXTURE_SHA_EXIT.txt"
          if [ "$bad" = 0 ] && [ "$(cat "$e/FIXTURE_SHA_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:tests:scripts python3 -m unittest -v tests.test_run46b_jef_source_eligibility_shadow) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo PIN_OR_FIXTURE_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          python3 -m py_compile v13/code/v13/agi/jef_eligibility_source_shadow_run46b.py v13/code/tests/test_run46b_jef_source_eligibility_shadow.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 83ee9c2a98308fd7cd75cfd9071156d09573fd50 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 83ee9c2a98308fd7cd75cfd9071156d09573fd50 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run46b-jef-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run46b-jef/
          retention-days: 90
          if-no-files-found: error
      - name: Require exact fixture and all software stages
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run46b-jef"
          for s in PINS FIXTURE_SHA TEST COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN46B_JEF_REAL_SQLITE_SHADOW_ONLY_NO_NATIVE_OR_AGE_PROMOTION
