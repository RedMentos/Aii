name: V13 B1 B2 anchor retention regression
on:
  pull_request:
    paths:
      - 'v13/code/v13/body_jepa.py'
      - 'v13/code/tests/test_body_anchor_retention.py'
      - 'v13/code/tests/test_body_heldout_retention.py'
      - '.github/workflows/v13-body-anchor-retention.yml'
  workflow_dispatch:
jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy pytest torch peft transformers
      - name: Compile and run synthetic body retention tests
        working-directory: v13/code
        run: |
          python -m compileall -q v13/body_jepa.py tests/test_body_anchor_retention.py tests/test_body_heldout_retention.py
          python -m pytest -q tests/test_body_anchor_retention.py tests/test_body_heldout_retention.py tests/test_body_jepa.py
