name: V13 Run124 preworker phone stop safety
on:
  pull_request:
    paths:
      - ".github/workflows/v13-run124-phone-preworker.yml"
      - "v13/code/v13/runtime.py"
      - "v13/code/tests/test_phone_halt_preworker_run124.py"
      - "v13/code/docs/proofs/continuation-20261025/phone-preworker-run124/**"
permissions:
  contents: read
concurrency:
  group: v13-run124-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Official privacy scan
        run: |
          set -euo pipefail
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
  software:
    needs: privacy
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      NEEDLE_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
      NO_MODEL_DOWNLOADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Isolated model-free dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/run124"
          "$RUNNER_TEMP/run124/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Preworker startup safety and inherited stop regressions
        run: |
          set -euo pipefail
          cd v13/code
          export PYTHONPATH="$PWD"
          "$RUNNER_TEMP/run124/bin/python" -m compileall -q v13 tests
          for pattern in test_phone_halt_preworker_run124.py test_phone_halt.py test_cli_standstill_run121.py test_phone_operator_journey_run86.py test_standstill.py; do
            echo "RUN124_SUITE=$pattern"
            "$RUNNER_TEMP/run124/bin/python" -m unittest discover -s tests -p "$pattern" -v
          done
          echo 'RUN124_PREWORKER_LINUX_SOFTWARE_PASS; NO_NATIVE_OR_REDMI_PROOF'
