name: V13 Run171 pinned B1 real temporal taps to external shadow predictor
on:
  pull_request:
    paths:
      - '.github/workflows/v13-run171-b1-temporal-shadow.yml'
      - 'v13/code/scripts/run171_b1_future_states.py'
      - 'v13/code/tests/test_run171_b1_future_states.py'
      - 'v13/code/docs/proofs/continuation-20261025/run171-b1-temporal-taps/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v13-native-c3-run131-serialized
  cancel-in-progress: false
jobs:
  pinned-native-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Exact-source preflight and synthetic adversarial tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input numpy==2.3.5
          test "$(git hash-object v13/code/scripts/run171_b1_future_states.py)" = '9b647053923534b5dde266a0dc52abb364d613da'
          test "$(git hash-object v13/code/tests/test_run171_b1_future_states.py)" = '2a769fd578bf70d4410e02f30a4097743b9822b9'
          PYTHONPATH=v13/code python -m unittest discover -s v13/code/tests -p test_run171_b1_future_states.py -v
          python -m compileall -q v13/code/scripts/run171_b1_future_states.py v13/code/tests/test_run171_b1_future_states.py
          PYTHONPATH=v13/code python - <<'PY'
          from scripts.run171_b1_future_states import text_sha
          assert text_sha() == '76c0276ed2501a017a10c10c0cbfbc30e97268bee95e910df3388ceccfaa1302'
          import json
          m=json.load(open('v13/code/specs/models.json'))['models']['body']
          assert m['revision']=='6767265158422fb8a19c62ceb45f16f05363615b'
          assert m['files'][0]['sha256']=='bb741ebb106d543e9de114b843a3d3d73d51c74b5801e69da2abde821a0cb3e1'
          print('RUN171_PREREG_SOURCE_AND_MODEL_OK')
          PY
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2{print $4}')" -gt 2500000
      - name: Sequential pinned B1 tap and frozen predictor shadow
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/run171"
          export MODEL="$RUNNER_TEMP/run171/body.gguf"
          export ARCHIVE="$RUNNER_TEMP/run171/llama-b10964-linux-x64.tar.gz"
          export NATIVE_DIR="$RUNNER_TEMP/run171/native-binary"
          export NATIVE_HOME="$RUNNER_TEMP/run171/native-home"
          export PRED_OUT="$RUNNER_TEMP/run171/predictor"
          export SUMMARY="$RUNNER_TEMP/run171/metadata-summary.json"
          trap 'rm -rf "$RUNNER_TEMP/run171/body.gguf" "$RUNNER_TEMP/run171/llama-b10964-linux-x64.tar.gz" "$NATIVE_DIR" "$NATIVE_HOME" "$PRED_OUT"' EXIT
          timeout 600s curl --fail --silent --show-error --location --retry 2 --connect-timeout 20 --max-time 480 \
            'https://huggingface.co/LiquidAI/LFM2.5-1.2B-Instruct-GGUF/resolve/6767265158422fb8a19c62ceb45f16f05363615b/LFM2.5-1.2B-Instruct-QAD-Q4_0.gguf' -o "$MODEL"
          test "$(stat -c %s "$MODEL")" = "695755488"
          echo "bb741ebb106d543e9de114b843a3d3d73d51c74b5801e69da2abde821a0cb3e1  $MODEL" | sha256sum -c -
          PYTHONPATH=v13/code python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from scripts.run171_b1_future_states import collect,run_shadow,text_sha,SEED
          from v13.models import catalog,download_file
          from v13.bootstrap import extract
          from v13.config import initialize,KNOBS
          from v13.runners import LlamaRunner
          from v13 import predictor_worker
          spec=catalog()['runner']['linux_binaries']['linux-x86_64']
          assert spec['sha256']=='9abf88aea48a55d0f80edb1ee20220b186848cca0b4e919d71518cfd7ca67443'
          archive=Path(os.environ['ARCHIVE'])
          download_file(spec,archive,progress=lambda _:None)
          def sha(p):
              h=hashlib.sha256()
              with Path(p).open('rb') as f:
                  for b in iter(lambda:f.read(1<<20),b''):h.update(b)
              return h.hexdigest()
          assert sha(archive)==spec['sha256']
          native=Path(os.environ['NATIVE_DIR'])
          extract(archive,native)
          bins=list(native.rglob('llama-server'))
          assert len(bins)==1
          bins[0].chmod(0o700)
          os.environ['V13_LLAMA_SERVER']=str(bins[0])
          home=Path(os.environ['NATIVE_HOME'])
          cfg=dict(initialize(home))
          cfg.update(threads=2,context_tokens=512,answer_tokens=32)
          runner=LlamaRunner(home,'B1_DETAIL',Path(os.environ['MODEL']),cfg,purpose='tap')
          try:
              taps=collect(runner)
          finally:
              runner.unload()
          pred={k:KNOBS[k][0] for k in ('predictor_lr','ema_decay','max_update_norm','retention_max_delta','predictor_steps')}
          pred.update(seed=SEED,predictor_regularizer='ema')
          out=Path(os.environ['PRED_OUT']);out.mkdir(parents=True,exist_ok=False)
          report=run_shadow(taps,predictor_worker.train,pred,out)
          report.update(source_revision='6767265158422fb8a19c62ceb45f16f05363615b',
                        model_sha256='bb741ebb106d543e9de114b843a3d3d73d51c74b5801e69da2abde821a0cb3e1',
                        runner_archive_sha256=spec['sha256'],runner_version='b10964',
                        source_token_counts=[x['tokens'] for x in taps],
                        source_token_id_hashes=[x['token_ids_sha256'] for x in taps],
                        evidence_class='LINUX_NATIVE_FROZEN_B1_TAP_EXTERNAL_PREDICTOR_ONLY',
                        native_body_train=False)
          assert report['text_set_sha256']==text_sha() and report['native_body_parameters_modified']==0
          assert report['gates']['Body_JEPA']=='UNAVAILABLE' and report['jepa_weight']==0
          Path(os.environ['SUMMARY']).write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
          print('RUN171_REAL_B1_TEMPORAL_TAP_SHADOW_COMPLETE',
                report['temporal_pairs'],report['external_predictor_metrics']['commit_eligible'],
                'BODY_AUTHORITY',0)
          PY
      - name: Official public repo privacy scan
        if: always()
        run: python v13/code/scripts/public_repo_privacy_scan.py --base 79df0f7e9c1cf0f3a17f08aac4b31ecf01f51911 --head HEAD
      - name: Upload metadata only; no GGUF, taps or predictor weights
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V13-Run171-Real-B1-Temporal-Shadow-Metadata-Only
          path: ${{ runner.temp }}/run171/metadata-summary.json
          if-no-files-found: warn
          retention-days: 14
