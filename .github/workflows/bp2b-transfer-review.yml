name: V13 BP2b source-disjoint transfer cohort preflight
on:
  push:
    branches: [codex/automation11-bp2b-transfer-cohort-20261027]
    paths:
      - '.github/workflows/bp2b-transfer-review.yml'
      - 'v13/code/scripts/bp2b_transfer_cohort.py'
      - 'v13/code/tests/test_bp2b_transfer_cohort.py'
      - 'v13/code/docs/proofs/continuation-20261027/bp2b-transfer/**'
permissions:
  contents: read
concurrency:
  group: v13-bp2b-transfer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Isolated software prerequisites
        run: |
          set -euo pipefail
          python3 -m venv --system-site-packages "$RUNNER_TEMP/bp2b-transfer-venv"
          "$RUNNER_TEMP/bp2b-transfer-venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5'
      - name: Closed raw tests and frozen cohort preflight
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/bp2b-transfer"
          git rev-parse HEAD > "$RUNNER_TEMP/bp2b-transfer/HEAD.txt"
          git hash-object v13/code/scripts/bp2b_transfer_cohort.py > "$RUNNER_TEMP/bp2b-transfer/SCRIPT_BLOB.txt"
          git hash-object v13/code/v13/locality_anchors.py > "$RUNNER_TEMP/bp2b-transfer/ANCHORS_BLOB.txt"
          (cd v13/code && PYTHONPATH="$PWD" "$RUNNER_TEMP/bp2b-transfer-venv/bin/python" -m unittest -v tests.test_bp2b_transfer_cohort tests.test_bp2b_locality_anchors) > "$RUNNER_TEMP/bp2b-transfer/UNIT_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp2b-transfer/UNIT_EXIT.txt"
          for seed in 41 42 43; do
            PYTHONPATH=v13/code "$RUNNER_TEMP/bp2b-transfer-venv/bin/python" v13/code/scripts/bp2b_transfer_cohort.py --out "$RUNNER_TEMP/bp2b-transfer/prepared" --seed "$seed" --prepare-only
          done > "$RUNNER_TEMP/bp2b-transfer/PREPARE_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp2b-transfer/PREPARE_EXIT.txt"
          "$RUNNER_TEMP/bp2b-transfer-venv/bin/python" -m compileall -q v13/code/scripts/bp2b_transfer_cohort.py v13/code/tests/test_bp2b_transfer_cohort.py > "$RUNNER_TEMP/bp2b-transfer/COMPILE_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp2b-transfer/COMPILE_EXIT.txt"
          "$RUNNER_TEMP/bp2b-transfer-venv/bin/python" v13/code/scripts/public_repo_privacy_scan.py --base 592e8975e52e3765e5acd893cd56aa69e936473f --head HEAD > "$RUNNER_TEMP/bp2b-transfer/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp2b-transfer/PRIVACY_EXIT.txt"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bp2b-transfer-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/bp2b-transfer/
          if-no-files-found: error
      - name: Enforce source-only gates
        run: |
          set -euo pipefail
          for n in UNIT PREPARE COMPILE PRIVACY; do
            test "$(cat "$RUNNER_TEMP/bp2b-transfer/${n}_EXIT.txt")" = 0 || {
              tail -100 "$RUNNER_TEMP/bp2b-transfer/${n}_RAW.log"; exit 1;
            }
          done
          echo "BP2B_SOURCE_ONLY_NO_NATIVE_OR_AGE_PROMOTION"
