name: V13 Run41 real Runtime Store B2 history cross-check
on:
  push:
    branches:
      - assistant/v13-run41-b2-realstore-crosscheck-20261028
permissions:
  contents: read
concurrency:
  group: v13-run41-realstore-${{ github.ref }}
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      V13_NO_AUTOSTART: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Capture actual Store source-only evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run41"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          for p in v13/code/scripts/run40_b2_store_history_readonly.py v13/code/scripts/run39_b2_rule_span_candidate.py v13/code/v13/cognition.py; do git hash-object "$p" | xargs -I{} echo "{} $p"; done > "$e/FROZEN_RAW.log"
          if [ "$(git hash-object v13/code/scripts/run40_b2_store_history_readonly.py)" = f4befd61f22f87194c0cac070af73a1d7f559d73 ] && [ "$(git hash-object v13/code/scripts/run39_b2_rule_span_candidate.py)" = a2f4d0e8a7ce69f0d0d41a7f884ccea490798724 ] && [ "$(git hash-object v13/code/v13/cognition.py)" = 1a9eb6f7c7cbfce83d91cc09b4ff9516cff310cf ]; then echo 0 > "$e/FROZEN_EXIT.txt"; else echo 1 > "$e/FROZEN_EXIT.txt"; fi
          python3 -m compileall -q v13/code/scripts/run40_b2_store_history_readonly.py v13/code/tests/test_run41_b2_realstore_crosscheck.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run41-venv"
          py="$RUNNER_TEMP/v13-run41-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          first=$?
          "$py" -m pip install --disable-pip-version-check --no-input 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
          second=$?
          "$py" -m pip install --disable-pip-version-check --no-input 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
          third=$?
          if [ "$first" = 0 ] && [ "$second" = 0 ] && [ "$third" = 0 ]; then
            echo 0 > "$e/INSTALL_EXIT.txt"
            (cd v13/code && timeout --signal=TERM --kill-after=5s 180s env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_run41_b2_realstore_crosscheck tests.test_run40_b2_store_history_readonly tests.test_run39_b2_rule_span_candidate) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
            (cd v13/code && timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=.:tests "$py" -m unittest discover -s tests -p 'test_*.py' -q) > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else
            echo 1 > "$e/INSTALL_EXIT.txt"
            for n in FOCUSED FULL; do echo SKIPPED_PREREQ_RED > "$e/${n}_RAW.log"; echo SKIPPED_RED > "$e/${n}_EXIT.txt"; done
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 2d8740f8086e66991d151250a07951f6651fed71 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 2d8740f8086e66991d151250a07951f6651fed71 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - name: Preserve original raw software evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run41-b2-realstore-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run41/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce real Store software proof only
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run41"
          for n in FROZEN COMPILE INSTALL FOCUSED FULL PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; raw retained; native NOT RUN"
              tail -45 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN41_REAL_STORE_SOURCE_ONLY_SHADOW_NO_GATE_PROMOTION
