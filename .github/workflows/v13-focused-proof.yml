name: V13 focused source-bound proofs

on:
  pull_request:
    paths:
      - "v13/code/v13/**"
      - "v13/code/tests/**"
      - ".github/workflows/v13-focused-proof.yml"

permissions:
  contents: read

concurrency:
  group: v13-focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (sparse, no persisted credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 50
          filter: blob:none
          sparse-checkout: |
            v13/code

      - name: Install isolated Python test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input \
            'numpy==2.3.5' 'prompt-toolkit==3.0.52'

      - name: Compile and run source-bound SQLite/software regressions
        shell: bash
        working-directory: v13/code
        env:
          NEEDLE_TELEMETRY: "0"
          DO_NOT_TRACK: "1"
        run: |
          set -euo pipefail
          ../../.venv/bin/python -m compileall -q v13 tests
          ../../.venv/bin/python -m unittest -v \
            tests.test_jef_human_precedence_run68 \
            tests.test_jef_outcome_lineage_run69 \
            tests.test_world_action_chronology_run70 \
            tests.test_world_observed_role_run71 \
            tests.test_world_model_integration_run64 \
            tests.test_world_align_finite_run65 \
            tests.test_context_exact_pin_run73 \
            tests.test_context_exact_quotes_run93 \
            tests.test_context_os \
            tests.test_context_append_provenance_run74 \
            tests.test_jefoutcome \
            tests.test_jef_outcome_vocab_run92 \
            tests.test_jef_lifecycle_integration_run67 \
            tests.test_jef_lifecycle_sources \
            tests.test_callosum_outcome_integration_run66 \
            tests.test_callosum_outcome_once \
            tests.test_callosum \
            tests.test_world_worker \
            tests.test_world_model \
            tests.test_learning_invariants \
            tests.test_age \
            tests.test_age_rights \
            tests.test_prohibitions \
            tests.test_standstill \
            tests.test_organ \
            tests.test_migrations \
            tests.test_runtime_queue \
            tests.test_operator_search_literal_run88 \
            tests.test_history_lineage \
            tests.test_episodes \
            tests.test_neuromod \
            tests.test_attention \
            tests.test_ledger_hygiene \
            tests.test_selfmodel \
            tests.test_output_policy \
            tests.test_output_policy_runtime \
            tests.test_toolstep \
            tests.test_transaction \
            tests.test_sleep_scheduler \
            tests.test_sleep_validation \
            tests.test_homeostasis_regulation \
            tests.test_body_training_port \
            tests.test_body_train_port_paths_run90 \
            tests.test_body_train_port_schema_run91

      - name: Official added-lines public-repo privacy scan
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python v13/code/scripts/public_repo_privacy_scan.py \
            --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree

      - name: Build and independently verify model-free V13 Phone source ZIP
        shell: bash
        working-directory: v13/code
        run: |
          set -euo pipefail
          ../../.venv/bin/python scripts/package_source.py --root . --out "$RUNNER_TEMP/V13-Phone-Run83.zip" --phone-install | tee "$RUNNER_TEMP/v13-phone-packager.jsonl"
          unzip -tqq "$RUNNER_TEMP/V13-Phone-Run83.zip"
          ../../.venv/bin/python - <<'PY'
          import json,os,zipfile
          p=os.path.join(os.environ['RUNNER_TEMP'],'V13-Phone-Run83.zip')
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              required={
                  'V13-Phone/setup.sh',
                  'V13-Phone/STARTEN.sh',
                  'V13-Phone/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md',
                  'V13-Phone/WORKSPACE_FILES.json',
              }
              missing=required-names
              if missing:raise SystemExit('Missing phone source entries: '+repr(sorted(missing)))
              manifest=json.loads(z.read('V13-Phone/WORKSPACE_FILES.json'))
              if manifest['schema_version']!=1 or len(manifest['files'])<100:
                  raise SystemExit('Invalid or incomplete phone source manifest')
              if any(x.endswith(('.gguf','.safetensors','.sqlite','.db','.env')) for x in names):
                  raise SystemExit('Private/model payload in phone source ZIP')
              print('PHONE_SOURCE_MANIFEST_PASS',len(manifest['files']))
          PY
          sha256sum "$RUNNER_TEMP/V13-Phone-Run83.zip"
          stat -c 'PHONE_SOURCE_BYTES=%s' "$RUNNER_TEMP/V13-Phone-Run83.zip"

      - name: Independently audit ZIP manifest paths hashes and archive bytes
        shell: bash
        working-directory: v13/code
        run: |
          set -euo pipefail
          ../../.venv/bin/python - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.phone_release_audit_candidate import verify_archive,sha256
          temp=Path(os.environ['RUNNER_TEMP'])
          archive=temp/'V13-Phone-Run83.zip'
          packager=json.loads((temp/'v13-phone-packager.jsonl').read_text().strip().splitlines()[-1])
          files=verify_archive(archive)
          actual=sha256(archive)
          if len(files)<100 or len(files)+1!=packager['files'] or actual!=packager['sha256']:
              raise SystemExit('Independent archive verification disagrees with packager')
          print('INDEPENDENT_PHONE_ARCHIVE_PASS',len(files),actual)
          PY

      - name: Execute extracted V13 Phone source smoke without models
        shell: bash
        run: |
          set -euo pipefail
          unpack="$RUNNER_TEMP/v13-phone-extracted-run84"
          mkdir -p "$unpack"
          unzip -q "$RUNNER_TEMP/V13-Phone-Run83.zip" -d "$unpack"
          cd "$unpack/V13-Phone"
          "$GITHUB_WORKSPACE/.venv/bin/python" -m compileall -q v13 scripts tests
          "$GITHUB_WORKSPACE/.venv/bin/python" -m unittest -v \
            tests.test_context_os \
            tests.test_jefoutcome \
            tests.test_history_lineage \
            tests.test_age \
            tests.test_standstill \
            tests.test_phone_operator_journey_run86 \
            tests.test_phone_cli_run87 \
            tests.test_operator_search_literal_run88 \
            tests.test_phone_chat_sessions_run89 \
            tests.test_body_training_port \
            tests.test_body_train_port_paths_run90 \
            tests.test_body_train_port_schema_run91 \
            tests.test_jef_outcome_vocab_run92 \
            tests.test_context_exact_quotes_run93 \
            tests.test_package_source \
            tests.test_run191_step2_complementarity_gate
          "$GITHUB_WORKSPACE/.venv/bin/python" - <<'PY'
          import os
          from pathlib import Path
          from v13.runtime import Runtime
          home=Path(os.environ['RUNNER_TEMP'])/'v13-phone-run84-home'
          r=Runtime(home)
          try:
              e=r.store.event(r.session,'source zip persistence check')
              ref=e['source_ref']
              assert r.store.read_source(ref)=='source zip persistence check'
          finally:
              r.close()
          r=Runtime(home)
          try:
              assert r.store.read_source(ref)=='source zip persistence check'
              print('EXTRACTED_PHONE_RUNTIME_RESTART_PASS')
          finally:
              r.close()
          PY

      - name: Upload verified V13 Phone source ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: V13-Phone-source-${{ github.sha }}
          path: ${{ runner.temp }}/V13-Phone-Run83.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
