name: V13 Run103 explicit memory user-rule gate
on:
  pull_request:
    paths:
      - "v13/code/v13/memory.py"
      - "v13/code/v13/userrules.py"
      - "v13/code/tests/test_memory_user_rule_gate_run103.py"
      - ".github/workflows/v13-run103-memory-rules.yml"
permissions:
  contents: read
concurrency:
  group: v13-run103-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout review source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Install isolated dependencies
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Test real SQLite memory permissions and inherited learning paths
        working-directory: v13/code
        run: |
          set -euo pipefail
          ../../.venv/bin/python -m compileall -q v13 tests
          ../../.venv/bin/python -m unittest -v \
            tests.test_memory_user_rule_gate_run103 \
            tests.test_userrules \
            tests.test_semantic_memory \
            tests.test_memory_trainer \
            tests.test_consolidation \
            tests.test_age_rights
      - name: Official public repository privacy scan
        run: |
          set -euo pipefail
          .venv/bin/python v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
