name: V13 Run12L frozen C2 route proxy source-only preflight
on:
  push:
    branches: [assistant/v13-run12l-c2-route-proxy-native-20261030]
    paths:
      - '.github/workflows/v13-run12l-c2-proxy-preflight.yml'
permissions:
  contents: read
jobs:
  source-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen pins, disjoint scaffold, tests and public privacy
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run12l-preflight"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          999561f79efccd334c8cc6e5a602d5169a969142 v13/code/docs/fixtures/c2_route_proxy_run12l_20261030.json
          6229b34739a5f4fd8d9e2201309a4e3c8193e2a1 v13/code/docs/C2_ROUTE_PROXY_RUN12L_PREREG_20261030.md
          1130e34aca7208859204117b5e074ee0597b222d v13/code/scripts/c2_route_proxy_score_run12l.py
          f31947da2bce92a96d580d1f9cea1c0fda5a1974 v13/code/scripts/c2_route_proxy_native_run12l.py
          dd162105fb97d1344c14325359330b6ce5fbea28 v13/code/tests/test_c2_route_proxy_run12l.py
          22ed11e4a53d9eeae8fbc74a1753082b5785be2b v13/code/v13/runtime.py
          fb34dba97ae3700ba5accdcb928bfb72afcf4fcb v13/code/scripts/c2_native_route_provenance_20261030.py
          cee1980787f1217e9a7aa2a1f180686b4add67fb v13/code/scripts/c2_strict_native_compat_run12k.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run12l-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run12l-venv/bin/python"
          "$py" -m pip install --no-input --disable-pip-version-check -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts timeout 180s "$py" -m unittest -v tests.test_c2_route_proxy_run12l tests.test_c2_strict_native_compat_run12k tests.test_c2_route_runtime_strict_run12j) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
            PYTHONPATH=v13/code "$py" - <<'PY' > "$e/COHORT_RAW.log" 2>&1
          from pathlib import Path
          from scripts.c2_route_proxy_score_run12l import load_fixture
          from scripts import c2_native_route_provenance_20261030 as original
          from scripts import c2_strict_native_compat_run12k as prior
          from v13.cognition import scaffold_route
          f=load_fixture(Path('v13/code/docs/fixtures/c2_route_proxy_run12l_20261030.json'))
          assert not ({c['prompt'] for c in f['cases']} & set(original.PROMPTS))
          assert not ({c['prompt'] for c in f['cases']} & set(prior.PROMPTS))
          assert all(scaffold_route(c['prompt'])==c['expected_scaffold'] for c in f['cases'])
          assert f['seed']==original.SEED==43
          print('FROZEN_15_CASES_DISJOINT_SCAFFOLD_AND_SEED_VERIFIED')
          PY
            echo "$?" > "$e/COHORT_EXIT.txt"
          else
            echo SKIPPED_PINS_OR_DEPS_RED > "$e/TEST_RAW.log"
            echo 99 > "$e/TEST_EXIT.txt"
            echo SKIPPED_PINS_OR_DEPS_RED > "$e/COHORT_RAW.log"
            echo 99 > "$e/COHORT_EXIT.txt"
          fi
          "$py" -m py_compile v13/code/scripts/c2_route_proxy_score_run12l.py v13/code/scripts/c2_route_proxy_native_run12l.py v13/code/tests/test_c2_route_proxy_run12l.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 0470e5c06f7382d0fea1263691bbbdca636d692e --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 0470e5c06f7382d0fea1263691bbbdca636d692e HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve source-only raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run12l-preflight-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run12l-preflight/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce source-only prereg before native
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run12l-preflight"
          for stage in PINS VENV DEPS TEST COHORT COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "${stage} RED; original raw retained"
              tail -70 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN12L_SOURCE_ONLY_GREEN_NO_NATIVE_OR_UTILITY_CLAIM
