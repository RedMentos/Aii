name: V14 A3 projector source-stat exact forget

on:
  push:
    branches:
      - "research-perception/**"
    paths:
      - "v13/code/v13/vision.py"
      - "v13/code/v13/vision_source_lineage.py"
      - "v13/code/v13/vision_projector_stats.py"
      - "v13/code/tests/test_vision.py"
      - "v13/code/tests/test_vision_projector_stats.py"
      - ".github/workflows/v14-vision-projector-source-stats.yml"
  pull_request:
    paths:
      - "v13/code/v13/vision.py"
      - "v13/code/v13/vision_source_lineage.py"
      - "v13/code/v13/vision_projector_stats.py"
      - "v13/code/tests/test_vision.py"
      - "v13/code/tests/test_vision_projector_stats.py"
      - ".github/workflows/v14-vision-projector-source-stats.yml"

permissions:
  contents: read

jobs:
  a3-source-stats:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bounded vision test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.2.0 numpy==2.3.5 Pillow==12.3.0
      - name: Compile exact A3 source and tests
        working-directory: v13/code
        run: python -m py_compile v13/vision.py v13/vision_source_lineage.py v13/vision_projector_stats.py tests/test_vision.py tests/test_vision_projector_stats.py
      - name: Run source-stat algebra, privacy and Runtime integration regressions
        working-directory: v13/code
        run: python -m pytest -q tests/test_vision_projector_stats.py tests/test_vision.py tests/test_vision_source_lineage.py
