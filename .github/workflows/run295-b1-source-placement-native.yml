name: V13 Run295 pinned native B1 source placement (diagnostic only)
on:
  pull_request:
    paths:
      - 'v13/code/scripts/run295_b1_source_placement.py'
      - 'v13/code/tests/test_run295_b1_source_placement.py'
      - '.github/workflows/run295-b1-source-placement-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v13-native-c3-run131-serialized
  cancel-in-progress: false
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Exact frozen Run288 B1 source-only controls
        working-directory: v13/code
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/run295source"
          "$RUNNER_TEMP/run295source/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
          "$RUNNER_TEMP/run295source/bin/python" -m compileall -q scripts/run295_b1_source_placement.py tests/test_run295_b1_source_placement.py
          PYTHONPATH="$PWD" "$RUNNER_TEMP/run295source/bin/python" -m unittest -v tests.test_run295_b1_source_placement
      - name: Official privacy scan
        run: python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
  native-probe:
    needs: source-only
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      V13_NO_AUTOSTART: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Exact source Canon and host budget
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/RUN295_HEAD.txt"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(sha256sum v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md | cut -d' ' -f1)" = 3423906b01b24443fcef733fb5c7ef47296963df63e603d8f843c99d544877ee
          git hash-object v13/code/v13/prompts.py v13/code/v13/runners.py v13/code/v13/runtime.py v13/code/scripts/run295_b1_source_placement.py | tee "$RUNNER_TEMP/RUN295_SOURCE_BLOBS.txt"
          { date -u -Iseconds; uname -a; free -h; cat /sys/fs/cgroup/memory.max 2>/dev/null || true; } | tee "$RUNNER_TEMP/RUN295_HOST.log"
      - name: Isolated pinned Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/run295venv"
          "$RUNNER_TEMP/run295venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Fresh pinned models and native server
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          export PYTHONPATH="$PWD" V13_HOME="$RUNNER_TEMP/run295installed"
          timeout 1800s "$RUNNER_TEMP/run295venv/bin/python" -m v13.bootstrap --home "$V13_HOME" 2>&1 | tee "$RUNNER_TEMP/RUN295_BOOTSTRAP.log"
          echo "${PIPESTATUS[0]}" > "$RUNNER_TEMP/RUN295_BOOTSTRAP_EXIT.txt"
          exit 0
      - name: Nine sequential actual B1 native generations
        id: native
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          mkdir -p "$RUNNER_TEMP/run295"
          export PYTHONPATH="$PWD" V13_HOME="$RUNNER_TEMP/run295installed"
          if [[ "$(cat "$RUNNER_TEMP/RUN295_BOOTSTRAP_EXIT.txt")" != "0" ]]; then
            echo 2 > "$RUNNER_TEMP/RUN295_NATIVE_EXIT.txt"
            echo "rc=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          timeout 1500s "$RUNNER_TEMP/run295venv/bin/python" scripts/run295_b1_source_placement.py --installed-home "$V13_HOME" --out "$RUNNER_TEMP/run295/report.json" 2>&1 | tee "$RUNNER_TEMP/RUN295_NATIVE.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUNNER_TEMP/RUN295_NATIVE_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Official privacy scan
        id: privacy
        run: |
          set -uo pipefail
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree 2>&1 | tee "$RUNNER_TEMP/RUN295_PRIVACY.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUNNER_TEMP/RUN295_PRIVACY_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preserve native raw failures and outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V13-Run295-B1-SourcePlacement-Native-Raw
          path: |
            ${{ runner.temp }}/RUN295_HEAD.txt
            ${{ runner.temp }}/RUN295_SOURCE_BLOBS.txt
            ${{ runner.temp }}/RUN295_HOST.log
            ${{ runner.temp }}/RUN295_BOOTSTRAP.log
            ${{ runner.temp }}/RUN295_BOOTSTRAP_EXIT.txt
            ${{ runner.temp }}/RUN295_NATIVE.log
            ${{ runner.temp }}/RUN295_NATIVE_EXIT.txt
            ${{ runner.temp }}/RUN295_PRIVACY.log
            ${{ runner.temp }}/RUN295_PRIVACY_EXIT.txt
            ${{ runner.temp }}/run295/
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce genuine native and privacy exits
        if: always()
        run: |
          test "$(cat "$RUNNER_TEMP/RUN295_BOOTSTRAP_EXIT.txt")" = "0"
          test "${{ steps.native.outputs.rc }}" = "0"
          test "${{ steps.privacy.outputs.rc }}" = "0"
