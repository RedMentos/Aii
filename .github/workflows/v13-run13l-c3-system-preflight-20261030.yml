name: V13 Run13L seed251 C3 system-abstention software preflight
on:
  push:
    branches: [assistant/v13-run13l-c3-system-abstention-native-20261030-auto11]
    paths:
      - '.github/workflows/v13-run13l-c3-system-preflight-20261030.yml'
permissions:
  contents: read
jobs:
  copy-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin and test source-bound copy candidate without native model
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run13l-preflight"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          b32edca2c1d622ce865f7beee11a925cdce064f9 v13/code/scripts/run13l_c3_system_native.py
          4623e05722856d5204c746e5b24db51fb4a3cb8d v13/code/scripts/run13l_c3_system_native_verify.py
          916b25a60d229c8f0ae27cb4bf052cb91c1e9390 v13/code/tests/test_run13l_c3_system_native.py
          4d1fe45b8bf9099854013645b89f8817e2250620 v13/code/docs/fixtures/run13l_c3_system_seed251_20261030.json
          e767f15314a10d8ecf708304832b8465243fe636 v13/code/docs/RUN13L_C3_SYSTEM_ABSTENTION_PREREG_20261030.md
          a8e240f47f25409eeb495d82e2dd0fe47dad0e3d v13/code/scripts/run13k_c3_copy_native.py
          fe24c325c86b4f1c53dac53f309ced4bf9a8043b v13/code/scripts/run13k_c3_copy_native_verify.py
          de5cf4541bb45e2764ea424747dacd08e6f212e0 v13/code/scripts/run13j_c3_jef_native.py
          f27822fbd78e2ae37038df96f5a31ebb04ee11e1 v13/code/scripts/run13j_c3_jef_native_verify.py
          887aad1a55faf4b263b49c992a9e61372fce3948 v13/code/v13/agi/jef_c3_shadow_prompt_run13i.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run13k-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run13k-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_run13l_c3_system_native tests.test_run13k_c3_copy_native tests.test_run13j_c3_jef_native_preflight) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/scripts/run13l_c3_system_native.py v13/code/scripts/run13l_c3_system_native_verify.py v13/code/tests/test_run13l_c3_system_native.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base edaf8f5354ffc4f9d7091f705af7ceed17d75488 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check edaf8f5354ffc4f9d7091f705af7ceed17d75488 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original preflight raw even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run13l-preflight-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run13l-preflight/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce software only, no utility promotion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run13l-preflight"
          for stage in PINS VENV DEPS TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED"; tail -60 "$e/${stage}_RAW.log" || true; exit 1
            fi
          done
          echo 'RUN13L_SOURCE_PREFLIGHT_ONLY_NO_NATIVE_OR_STEP2_GATE'
