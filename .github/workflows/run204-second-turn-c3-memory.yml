name: Run204 Age-0 second-turn C3 memory pipeline (software)
on:
  pull_request:
    paths:
      - 'v13/code/tests/test_second_turn_c3_memory_pipeline_run204.py'
      - '.github/workflows/run204-second-turn-c3-memory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Isolated software prerequisites
        run: python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Real Runtime end-to-end second-turn and restart tests
        working-directory: v13/code
        run: |
          python -m unittest -v tests.test_second_turn_c3_memory_pipeline_run204 tests.test_executive_context tests.test_memory_recall_key_lineage_run203 tests.test_phone_cli_run87
          python -m compileall -q tests/test_second_turn_c3_memory_pipeline_run204.py
      - name: Official public repository privacy scan
        run: python v13/code/scripts/public_repo_privacy_scan.py --base 666c985642ca90e448cde73e2f355d9170d0d47d --head HEAD --no-worktree
      - name: Evidence boundary
        run: echo 'C3 is a deterministic test double; this proves source-to-context plumbing, not native model learning, answer quality, JEPA or Redmi'
