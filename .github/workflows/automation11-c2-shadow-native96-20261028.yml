name: V13 Automation11 pinned C2 96-row native SHADOW admission evidence
on:
  push:
    branches:
      - assistant/v13-run11-c2-native96-shadow-evidence-20261028
    paths:
      - '.github/workflows/automation11-c2-shadow-native96-20261028.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v13-run11-age0-native-endtoend
  cancel-in-progress: false
jobs:
  native-c2-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: "1"
      NEEDLE_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Source-pinned C2 native 96 rows with independent raw replay and no route authority
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-c2-shadow-native96"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          18116397241d75f167447ddc9d8d72a0de616f7a v13/code/scripts/native_c2_shadow_admission_probe.py
          5613c08f00b80905d74c54a92b30b3a1f5fd99a3 v13/code/v13/c2_route_admission_shadow.py
          6dc268b9fac0b74f5805102a5ff0ba1c9e965bee v13/code/tests/test_c2_route_admission_shadow.py
          68e7ed1352800174972558f1e0b0683a42c8689a v13/code/v13/runtime.py
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          954a3f468f10195fbce12d27f68585ee7edee2c9 v13/code/specs/control_tools.json
          758c5a7dea93bfb178bc3778428ee262178b6a58 v13/code/specs/c2-benchmark.json
          1b353cf79ca2291c6ec4cf7b69eb926a63a1b48b v13/code/v13/control_calibration_worker.py
          1a9eb6f7c7cbfce83d91cc09b4ff9516cff310cf v13/code/v13/cognition.py
          efda7aa1aa5729e974d0d641870d4da05d21c961 v13/code/v13/runners.py
          bd035cf8029850cce00b179edf533e53bf24358a v13/code/v13/models.py
          546b97946a5036b7006fb741376e5ca42c7e1440 v13/code/v13/config.py
          BLOBS
          : > "$e/BLOBS_RAW.log"
          while read -r want file; do
            got="$(git hash-object "$file" 2>/dev/null)"
            printf '%s %s %s\n' "$want" "$got" "$file" >> "$e/BLOBS_RAW.log"
            if [ "$want" != "$got" ]; then echo MISMATCH >> "$e/BLOBS_RAW.log"; fi
          done < "$e/EXPECTED_BLOBS.txt"
          if grep -q MISMATCH "$e/BLOBS_RAW.log"; then echo 1 > "$e/BLOBS_EXIT.txt"; else echo 0 > "$e/BLOBS_EXIT.txt"; fi
          python3 -m venv "$RUNNER_TEMP/v13-c2-shadow-native96-venv"
          py="$RUNNER_TEMP/v13-c2-shadow-native96-venv/bin/python"
          "$py" -m pip install --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          echo "$?" > "$e/INSTALL_EXIT.txt"
          if [ "$(cat "$e/BLOBS_EXIT.txt")" = 0 ] && [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_c2_route_admission_shadow tests.test_control_calibration) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
            "$py" -m py_compile v13/code/scripts/native_c2_shadow_admission_probe.py > "$e/COMPILE_RAW.log" 2>&1
            echo "$?" > "$e/COMPILE_EXIT.txt"
          else
            echo SKIPPED_PREREQ_RED > "$e/FOCUSED_RAW.log"
            echo SKIPPED_RED > "$e/FOCUSED_EXIT.txt"
            echo SKIPPED_PREREQ_RED > "$e/COMPILE_RAW.log"
            echo SKIPPED_RED > "$e/COMPILE_EXIT.txt"
          fi
          export V13_HOME="$RUNNER_TEMP/v13-c2-shadow-native96-home"
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ] && [ "$(cat "$e/COMPILE_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 15m env PYTHONPATH=v13/code "$py" -m v13.bootstrap --home "$V13_HOME" > "$e/BOOTSTRAP_RAW.log" 2>&1
            echo "$?" > "$e/BOOTSTRAP_EXIT.txt"
          else
            echo SKIPPED_SOFTWARE_RED > "$e/BOOTSTRAP_RAW.log"
            echo SKIPPED_RED > "$e/BOOTSTRAP_EXIT.txt"
          fi
          if [ "$(cat "$e/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 12m env PYTHONPATH=v13/code "$py" v13/code/scripts/native_c2_shadow_admission_probe.py --installed-home "$V13_HOME" --out "$e/NATIVE96_REPORT.json" > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else
            echo SKIPPED_BOOTSTRAP_RED > "$e/NATIVE_RAW.log"
            echo SKIPPED_RED > "$e/NATIVE_EXIT.txt"
          fi
          if [ "$(cat "$e/NATIVE_EXIT.txt")" = 0 ]; then
            env PYTHONPATH=v13/code "$py" - "$e/NATIVE96_REPORT.json" > "$e/REPLAY_RAW.log" 2>&1 <<'PY'
          import hashlib,json,math,sys
          from pathlib import Path
          from v13.cognition import scaffold_route
          from v13.control_calibration_worker import observation
          from v13.c2_route_admission_shadow import evaluate
          from v13.common import APP
          p=Path(sys.argv[1]);report=json.loads(p.read_text())
          spec=json.loads((APP/'specs/c2-benchmark.json').read_text())
          items=spec['items'];rows=report['rows']
          assert len(items)==len(rows)==96
          assert report['schema']=='v13.c2.shadow_native96_probe.v1'
          assert report['scope']=='LINUX_NATIVE_C2_PARSER_SHADOW_ONLY'
          assert report['corpus_sha256']==spec['items_sha256']=='54f3da390fb79c3f966edd61d3390d94dc59d850987174c644ef45ef531a54e6'
          assert report['source_revision']=='c2-route-admission-shadow-v1' and report['seed']==13
          assert report['native_attempts']==96 and report['all_rows_recorded'] is True
          assert report['all_shadow_veto'] is True and report['runtime_route_modified'] is False
          assert report['age_authority']==0 and report['weight_updates'] is False
          assert report['redmi_measured'] is False and report['process_reaped'] is True
          assert report['model_hashes_unchanged'] is True
          before=report['model_hashes_before'];after=report['model_hashes_after']
          assert before==after and 'needle' in before
          assert all(v['ok'] is True and v['hash_checked'] is True for v in before.values())
          assert len({x['id'] for x in items})==96
          valid=0;actual_final=0
          for item,row in zip(items,rows):
              assert row['id']==item['id'] and row['label']==item['label']
              assert row['text_sha256']==hashlib.sha256(item['text'].encode()).hexdigest()
              assert row['scaffold']==scaffold_route(item['text'])
              assert row['native_attempted'] is True
              assert isinstance(row['duration_s'],(int,float)) and math.isfinite(row['duration_s']) and row['duration_s']>=0
              if row['native_returned']:
                  assert 'native_raw' in row and 'native_metrics' in row
                  raw=row['native_raw']
                  try:
                      obs=observation(raw)
                  except (ValueError,TypeError,KeyError,OverflowError):
                      assert row['native_valid'] is False
                  else:
                      assert row['native_valid'] is True
                      assert row['native_route']==obs['route']
                      assert row['native_confidence']==obs['raw_confidence']
                      assert row['native_ambiguous']==obs['ambiguous']
                      assert row['native_proposal_count']==obs['proposal_count']
                      valid+=1
                  m=row['native_metrics']
                  if m.get('status')=='FINAL' and m.get('role')=='C2_CONTROL':actual_final+=1
              else:
                  raw=None
                  assert row['native_valid'] is False and 'native_raw' not in row
              assert row['decision']==evaluate(row['scaffold'],raw,None)
              assert row['decision']['would_admit'] is False
              assert row['decision']['applied'] is False and row['decision']['age_authority']==0
              assert row['decision']['model_called'] is False and row['decision']['weight_updates'] is False
          assert valid==report['valid_native'] and valid>=1 and actual_final>=1
          assert report['status'] in ('PASS_SCOPED','PASS_SCOPED_WITH_NATIVE_NEGATIVES')
          print('NATIVE_C2_RAW_REPLAY_PASS',valid,'/',len(rows),'native_valid; worker_final',actual_final)
          print('SHADOW_NO_RUNTIME_AUTHORITY_NO_REDM I_NO_GATE_PROMOTION')
          PY
            echo "$?" > "$e/REPLAY_EXIT.txt"
          else
            echo SKIPPED_NATIVE_RED > "$e/REPLAY_RAW.log"
            echo SKIPPED_RED > "$e/REPLAY_EXIT.txt"
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 55eed830d6270f475b46c85e9f9ad8c10fb65e32 --head HEAD > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 55eed830d6270f475b46c85e9f9ad8c10fb65e32 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-automation11-c2-shadow-native96-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-c2-shadow-native96/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce real native raw replay without gate promotion
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-c2-shadow-native96"
          for name in BLOBS INSTALL FOCUSED COMPILE BOOTSTRAP NATIVE REPLAY PRIVACY DIFF; do
            if [ "$(cat "$e/${name}_EXIT.txt")" != 0 ]; then
              echo "$name RED; raw retained, no C2 native claim"
              tail -90 "$e/${name}_RAW.log" || true
              exit 1
            fi
          done
          echo 'C2_96_LINUX_NATIVE_SHADOW_ONLY_NO_REDM I_OR_GATE_PROMOTION'
