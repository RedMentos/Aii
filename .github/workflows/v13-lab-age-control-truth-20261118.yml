name: V13 Lab Age control state and WebView truth
on:
  push:
    branches:
      - gpt6/fix-lab-age-compatible-release-20261118
      - gpt6/v13-private-remote-bridge-20261111
  pull_request:
    paths:
      - 'v13/code/v13/lab_age.py'
      - 'v13/code/v13/agi/goals.py'
      - 'v13/code/v13/scheduler.py'
      - 'v13/code/tests/test_goal_wake_atomicity_20261121.py'
      - 'v13/code/v13/runtime_deploy.py'
      - 'v13/code/scripts/stage_integrated_candidate.py'
      - 'v13/code/scripts/termux_runtime_recovery_candidate_20261112.py'
      - 'v13/code/scripts/lab_age_stage_candidate_20261118.py'
      - 'v13/code/v13/lab_age_runtime.py'
      - 'v13/code/v13/operator.py'
      - 'v13/code/v13/ui.py'
      - 'v13/code/v13/mobile_dashboard.py'
      - 'v13/code/v13/mobile_dashboard.html'
      - 'v13/code/tests/test_lab_age.py'
      - 'v13/code/tests/test_lab_age_controls_20261118.py'
      - '.github/workflows/v13-lab-age-control-truth-20261118.yml'
permissions:
  contents: read
jobs:
  lab-age-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and owner Age boundary regressions
        env:
          PYTHONPATH: v13/code
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m py_compile v13/code/v13/lab_age.py v13/code/v13/agi/goals.py v13/code/v13/scheduler.py v13/code/v13/operator.py v13/code/v13/ui.py v13/code/v13/mobile_dashboard.py v13/code/tests/test_lab_age.py v13/code/tests/test_lab_age_controls_20261118.py v13/code/tests/test_goal_wake_atomicity_20261121.py
          python -m unittest discover -s v13/code/tests -p 'test_lab_age.py' -v
          python -m unittest discover -s v13/code/tests -p 'test_lab_age_controls_20261118.py' -v
          python -m unittest discover -s v13/code/tests -p 'test_webview_auto_update_button.py' -v
          python -m unittest discover -s v13/code/tests -p 'test_mobile_dashboard.py' -v
          python -m unittest discover -s v13/code/tests -p 'test_age_rights.py' -v
