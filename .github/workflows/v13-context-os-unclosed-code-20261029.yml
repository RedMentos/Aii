name: V13 Context OS unclosed code exact-source regression
on:
  push:
    branches: [assistant/v13-context-os-unclosed-code-20261029]
    paths:
      - '.github/workflows/v13-context-os-unclosed-code-20261029.yml'
      - 'v13/code/v13/context_os.py'
      - 'v13/code/tests/test_context_os_unclosed_code_20261029.py'
      - 'v13/code/docs/proofs/continuation-20261029/CONTEXT_OS_UNCLOSED_CODE_*'
permissions:
  contents: read
jobs:
  source-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Closed source-only exact code evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-context-code"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          6fd3ef4d0f74de2603d12a98872e89aa5c492926 v13/code/docs/proofs/continuation-20261029/CONTEXT_OS_UNCLOSED_CODE_PREREG.md
          a7271a41e6b8fec7c8aeffa3c174f4de18e86363 v13/code/tests/test_context_os_unclosed_code_20261029.py
          fd8ea629dc565a5f27b212599f3b006bb93605fd v13/code/v13/context_os.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          source_red=0
          : > "$e/SOURCE_RAW.log"
          while read -r want file; do
            got="$(git hash-object "$file" 2>/dev/null)"
            echo "$want $got $file" >> "$e/SOURCE_RAW.log"
            if [ "$want" != "$got" ]; then source_red=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$source_red" > "$e/SOURCE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-context-code-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-context-code-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
          else echo SKIPPED > "$e/DEPS_EXIT.txt"; echo SKIPPED > "$e/PIP_CHECK_EXIT.txt"; fi
          if [ "$source_red" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ] && [ "$(cat "$e/PIP_CHECK_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_context_os tests.test_context_os_unclosed_code_20261029) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else echo SKIPPED_PREREQ_RED > "$e/FOCUSED_RAW.log"; echo SKIPPED > "$e/FOCUSED_EXIT.txt"; fi
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests -p 'test_*.py') > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else echo SKIPPED_FOCUSED_RED > "$e/FULL_RAW.log"; echo SKIPPED > "$e/FULL_EXIT.txt"; fi
          "$py" -m py_compile v13/code/v13/context_os.py v13/code/tests/test_context_os_unclosed_code_20261029.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 48a58ca8ca49c0b908509e04081cf9fc132017fd --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 48a58ca8ca49c0b908509e04081cf9fc132017fd HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw and hashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-context-code-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-context-code/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce exact source and tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-context-code"
          for stage in SOURCE VENV DEPS PIP_CHECK FOCUSED FULL COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED, original raw retained"
              tail -70 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'CONTEXT_CODE_EXACT_SOURCE_SOFTWARE_ONLY'
