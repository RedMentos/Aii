name: V13 Run117BP known seed401 C3 budget native harness software preflight

on:
  push:
    branches:
      - assistant/v13-run117bp-jef-c3-budget-native-smoke-20261101-hourly11
    paths:
      - .github/workflows/v13-run117bp-jef-c3-budget-native-preflight.yml
      - v13/code/scripts/run117bp_jef_c3_budget_native_smoke.py
      - v13/code/tests/test_run117bp_jef_c3_budget_native_smoke.py
      - v13/code/docs/RUN117BP_JEF_C3_BUDGET_NATIVE_SMOKE_LAUNCH_20261101.md

permissions:
  contents: read

jobs:
  real-store-shadow-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run real Store callback tests and preserve closed raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run117bp"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          d34649f9a1e3358a88e7cd84b39e4e18e3bbd70c v13/code/scripts/run117bp_jef_c3_budget_native_smoke.py
          58186fb2bc894956fd0025f32943ea2a0c246e6d v13/code/v13/agi/jef_c3_budget_formatter_shadow_run117bo.py
          8a003fd753048e0c868094984eddf88e09d710ba v13/code/tests/test_run117bp_jef_c3_budget_native_smoke.py
          466c9f51905eb981b782f5b7b8aa7818eb66a893 v13/code/tests/test_run117bo_jef_c3_budget_formatter_shadow.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          echo '8aa69cc86d2e2067e809d4f703ddbff3fc575ea111d7afd97a73012e0bda0e21  v13/code/docs/fixtures/run46b_jef_source_eligibility_seed401.json' | sha256sum -c - > "$e/FIXTURE_RAW.log" 2>&1
          echo "$?" > "$e/FIXTURE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run117bp-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run117bp-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' 'prompt-toolkit==3.0.52' 'psutil==7.0.0' 'PyYAML==6.0.2' 'Pillow==11.3.0' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
          else
            for stage in DEPS PIP_CHECK; do echo SKIPPED > "$e/${stage}_RAW.log"; echo SKIPPED > "$e/${stage}_EXIT.txt"; done
          fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout 120s "$py" -m unittest -v tests.test_run117bp_jef_c3_budget_native_smoke tests.test_run117bo_jef_c3_budget_formatter_shadow tests.test_run46b_jef_source_eligibility_shadow tests.test_jef_c3_schema_source_recheck_shadow) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED > "$e/TEST_RAW.log"; echo SKIPPED > "$e/TEST_EXIT.txt"; fi
          python3 -m py_compile v13/code/scripts/run117bp_jef_c3_budget_native_smoke.py v13/code/tests/test_run117bp_jef_c3_budget_native_smoke.py v13/code/v13/agi/jef_c3_budget_formatter_shadow_run117bo.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 3dd6a46be7d3f296956e174b85bdfc9a5bd2dd2e --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 3dd6a46be7d3f296956e174b85bdfc9a5bd2dd2e HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original software raw even on RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117bp-realstore-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117bp/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce source and software-only negative gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117bp"
          for stage in PINS FIXTURE VENV DEPS PIP_CHECK TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw preserved, no gate promotion"
              tail -60 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'RUN117BP_SOFTWARE_PREFLIGHT_ONLY_NO_NATIVE_OR_GATE_PROMOTION'
