name: V13 Run150 source-verified persisted history SHADOW audit
on:
  pull_request:
    paths:
      - ".github/workflows/v13-run150-persisted-age0d.yml"
      - "v13/code/scripts/age0d_history_shadow_audit_run150.py"
      - "v13/code/tests/test_age0d_history_shadow_audit_run150.py"
      - "v13/code/docs/proofs/continuation-20261025/age0d-history-shadow-run150/**"
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Official privacy scan
        run: |
          set -euo pipefail
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
  sqlite-history:
    needs: privacy
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read-only synthetic SQLite and actual V13 Store integration
        run: |
          set -euo pipefail
          python3 -m compileall -q v13/code/scripts/age0d_history_shadow_audit_run150.py v13/code/tests/test_age0d_history_shadow_audit_run150.py
          PYTHONPATH=v13/code python3 -m unittest discover -s v13/code/tests -p 'test_age0d_history_shadow_audit_run150.py' -v 2>&1 | tee "$RUNNER_TEMP/RUN150_SQLITE_RAW.log"
          if grep -q 'skipped=' "$RUNNER_TEMP/RUN150_SQLITE_RAW.log"; then
            echo "Run150 actual Store integration must not skip in repository CI" >&2
            exit 1
          fi
