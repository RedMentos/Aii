name: V13 STEP2 original native output semantic gap audit
on:
  push:
    branches:
      - codex/v13-step2-native-semantic-gap-20261030-auto11af
    paths:
      - '.github/workflows/v13-step2-native-semantic-gap-20261030.yml'
      - 'v13/code/scripts/step2_currentchain_native_semantic_gap_20261030.py'
      - 'v13/code/tests/test_step2_currentchain_native_semantic_gap_20261030.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: v13-step2-native-semantic-gap-20261030
  cancel-in-progress: false
jobs:
  semantic-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Synthetic scorer tests and exact original native artifact audit
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-step2-semantic-gap"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/scripts/step2_currentchain_native_semantic_gap_20261030.py v13/code/tests/test_step2_currentchain_native_semantic_gap_20261030.py v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/SOURCE_BLOBS.txt"
          test "$(tail -1 "$e/SOURCE_BLOBS.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          echo "$?" > "$e/CANON_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:tests python3 -m unittest -v tests.test_step2_currentchain_native_semantic_gap_20261030) > "$e/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$e/FOCUSED_EXIT.txt"
          curl --fail --silent --show-error --location --retry 3 --max-time 90 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/RedMentos/Aii/actions/artifacts/12947896111/zip" \
            --output "$e/original.zip" > "$e/DOWNLOAD_RAW.log" 2>&1
          echo "$?" > "$e/DOWNLOAD_EXIT.txt"
          if [ "$(cat "$e/DOWNLOAD_EXIT.txt")" = 0 ]; then
            sha256sum "$e/original.zip" > "$e/ORIGINAL_ZIP_SHA256.txt"
            python3 v13/code/scripts/step2_currentchain_native_semantic_gap_20261030.py --zip "$e/original.zip" --out "$e/AUDIT_RESULT.json" > "$e/AUDIT_RAW.log" 2>&1
            echo "$?" > "$e/AUDIT_EXIT.txt"
          else
            echo SKIPPED_DOWNLOAD_RED > "$e/AUDIT_RAW.log"
            echo SKIPPED_RED > "$e/AUDIT_EXIT.txt"
          fi
          if [ "$(cat "$e/AUDIT_EXIT.txt")" = 0 ]; then
            python3 - "$e/AUDIT_RESULT.json" > "$e/NEGATIVE_EXPECTATION_RAW.log" 2>&1 <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          assert j['semantic_status']=='SEMANTIC_REQUIREMENT_FAIL'
          assert j['score']['correct_remainders']==0 and j['score']['required_remainders']==2
          assert j['native_executed_here'] is False and j['comparative_utility_proven'] is False
          assert j['step2_gate_promoted'] is False and j['redmi_measured'] is False
          print('FROZEN_NATIVE_STEP2_SEMANTIC_0_OF_2_NEGATIVE_NOT_A_GATE')
          PY
            echo "$?" > "$e/NEGATIVE_EXPECTATION_EXIT.txt"
          else
            echo SKIPPED_AUDIT_RED > "$e/NEGATIVE_EXPECTATION_RAW.log"
            echo SKIPPED_RED > "$e/NEGATIVE_EXPECTATION_EXIT.txt"
          fi
          rm -f "$e/original.zip"
          python3 -m py_compile v13/code/scripts/step2_currentchain_native_semantic_gap_20261030.py v13/code/tests/test_step2_currentchain_native_semantic_gap_20261030.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 3efc8da2b1b74ecb62992c4efafc55391c2c2924 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 3efc8da2b1b74ecb62992c4efafc55391c2c2924 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-step2-native-semantic-gap-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-step2-semantic-gap/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce scorer tests and negative evidence closure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-step2-semantic-gap"
          for stage in CANON FOCUSED DOWNLOAD AUDIT NEGATIVE_EXPECTATION COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained; no STEP2 promotion"
              tail -75 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'SCORER_GREEN_ORIGINAL_NATIVE_SEMANTIC_NEGATIVE_0_OF_2_NO_STEP2_PROMOTION'
