name: V14 Core audio + exact arithmetic Runtime

on:
  push:
    branches:
      - core/v14-audio-lease-runtime-20261121
      - gpt6/v13-private-remote-bridge-20261111
    paths:
      - v13/code/scripts/integrated_audio_context_candidate_20261121.py
      - v13/code/scripts/integrated_arithmetic_guard_candidate_20261121.py
      - v13/code/scripts/termux_runtime_recovery_candidate_20261121.py
      - v13/code/scripts/stage_integrated_candidate.py
      - v13/code/v13/runtime_deploy.py
      - v13/code/tests/test_termux_runtime_recovery_stage.py
      - v13/code/tests/test_v14_audio_lease_runtime.py
      - v13/code/tests/test_v14_audio_revocation_request.py
      - v13/code/tests/test_v14_exact_arithmetic_runtime_20261121.py
      - v13/code/tests/test_arithmetic_reflex.py
      - v13/code/tests/test_speech_output.py
      - v13/code/v13/speech_intent.py
      - v13/code/v13/speech_output.py
      - v13/code/v13/operator.py
      - v13/code/v13/config.py
      - v13/code/tests/test_arithmetic_stage_20261116.py
      - v13/code/tests/test_runtime_deploy.py
      - v13/code/tests/test_runtime_deploy_integrity.py
      - v13/code/tests/test_v14_audio_lease_full_lifecycle_qa.py
      - v13/code/tests/test_v14_exact_arithmetic_date_ambiguity_qa.py
      - .github/workflows/v14-core-audio-lease-runtime.yml
  pull_request:
    branches:
      - gpt6/v13-private-remote-bridge-20261111
      - research-perception/v14-raw-ear-shared-lease-api-20261121-run13
    paths:
      - v13/code/scripts/integrated_audio_context_candidate_20261121.py
      - v13/code/scripts/integrated_arithmetic_guard_candidate_20261121.py
      - v13/code/scripts/termux_runtime_recovery_candidate_20261121.py
      - v13/code/scripts/stage_integrated_candidate.py
      - v13/code/v13/runtime_deploy.py
      - v13/code/tests/test_termux_runtime_recovery_stage.py
      - v13/code/tests/test_v14_audio_lease_runtime.py
      - v13/code/tests/test_v14_audio_revocation_request.py
      - v13/code/tests/test_v14_exact_arithmetic_runtime_20261121.py
      - v13/code/tests/test_arithmetic_reflex.py
      - v13/code/tests/test_speech_output.py
      - v13/code/v13/speech_intent.py
      - v13/code/v13/speech_output.py
      - v13/code/v13/operator.py
      - v13/code/v13/config.py
      - v13/code/tests/test_arithmetic_stage_20261116.py
      - v13/code/tests/test_runtime_deploy.py
      - v13/code/tests/test_runtime_deploy_integrity.py
      - v13/code/tests/test_v14_audio_lease_full_lifecycle_qa.py
      - v13/code/tests/test_v14_exact_arithmetic_date_ambiguity_qa.py
      - .github/workflows/v14-core-audio-lease-runtime.yml

jobs:
  staged-audio-arithmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pytest==9.2.0 numpy==2.2.6 psutil PyYAML
      - name: Compile exact stage, arithmetic overlay and deploy sources
        working-directory: v13/code
        run: >-
          python -m py_compile
          scripts/integrated_audio_context_candidate_20261121.py
          scripts/integrated_arithmetic_guard_candidate_20261121.py
          scripts/termux_runtime_recovery_candidate_20261121.py
          scripts/stage_integrated_candidate.py
          v13/runtime_deploy.py
          tests/test_v14_exact_arithmetic_runtime_20261121.py
          tests/test_v14_audio_revocation_request.py
          tests/test_v14_audio_lease_full_lifecycle_qa.py
          tests/test_v14_exact_arithmetic_date_ambiguity_qa.py
      - name: Stage and test Runtime audio, exact arithmetic, C5 and persistence
        working-directory: v13/code
        run: >-
          python -m pytest -q
          tests/test_termux_runtime_recovery_stage.py
          tests/test_v14_audio_lease_runtime.py
          tests/test_v14_audio_revocation_request.py
          tests/test_v14_audio_lease_full_lifecycle_qa.py
          tests/test_v14_exact_arithmetic_date_ambiguity_qa.py
          tests/test_v14_exact_arithmetic_runtime_20261121.py
          tests/test_arithmetic_reflex.py
          tests/test_speech_output.py
          tests/test_arithmetic_stage_20261116.py
          tests/test_runtime_deploy.py
          tests/test_runtime_deploy_integrity.py
