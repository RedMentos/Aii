name: V13 Run11 World F4 and C2 route integration software
on:
  push:
    branches:
      - assistant/v13-run11-world-c2-validated-integration-20261028
    paths:
      - '.github/workflows/run11-world-c2-validated-integration-20261028.yml'
      - 'v13/code/v13/world.py'
      - 'v13/code/scripts/c2_benchmark.py'
      - 'v13/code/tests/test_c2_benchmark.py'
      - 'v13/code/tests/test_world_modulator_atomicity_run349.py'
      - 'v13/code/tests/test_world_corrupt_packet_recovery_run420.py'
      - 'v13/code/tests/test_world_receipt_binding_run424.py'
      - 'v13/code/tests/test_world_valid_recent_window_run431.py'
permissions:
  contents: read
jobs:
  world-timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: "1"
      NO_MODEL_DOWNLOADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact pins, World focused/full Linux software, privacy and diff
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-world-c2-integration"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          3799f84fdf52a82efe70e0e5e73bcfe4a95f0ac7 v13/code/v13/world.py
          bdeae71f380ab7d83f61acdf6adf69780b7e0745 v13/code/tests/test_selfstate_session_unfinished_20261028.py
          328904eb5e855503d6d44e79fdadd1886bfd298c v13/code/tests/test_world_modulator_atomicity_run349.py
          166864e5ca465fee0080e100564f62f6b2959eaa v13/code/tests/test_world_corrupt_packet_recovery_run420.py
          78c6a7b859d246c90e9b0702d49bb48188d5424c v13/code/tests/test_world_receipt_binding_run424.py
          357057d35aa931b97fba19d1944f0cc1eb771fe2 v13/code/tests/test_world_valid_recent_window_run431.py
          12fe792cacd2dc92c2b3c5c33e01424e20a148e4 v13/code/scripts/c2_benchmark.py
          48554fd86c985fab520888af8bd7910236589683 v13/code/tests/test_c2_benchmark.py
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          BLOBS
          : > "$e/BLOBS_RAW.log"
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            printf '%s %s %s\n' "$want" "$got" "$path" >> "$e/BLOBS_RAW.log"
            if [ "$want" != "$got" ]; then echo MISMATCH >> "$e/BLOBS_RAW.log"; fi
          done < "$e/EXPECTED_BLOBS.txt"
          if grep -q MISMATCH "$e/BLOBS_RAW.log"; then echo 1 > "$e/BLOBS_EXIT.txt"; else echo 0 > "$e/BLOBS_EXIT.txt"; fi
          python3 -m venv "$RUNNER_TEMP/v13-world-timing-venv"
          py="$RUNNER_TEMP/v13-world-timing-venv/bin/python"
          "$py" -m pip install --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          first=$?
          "$py" -m pip install --no-input -q 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
          second=$?
          "$py" -m pip install --no-input -q 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
          third=$?
          if [ "$first" = 0 ] && [ "$second" = 0 ] && [ "$third" = 0 ]; then echo 0 > "$e/INSTALL_EXIT.txt"; else echo 1 > "$e/INSTALL_EXIT.txt"; fi
          if [ "$(cat "$e/BLOBS_EXIT.txt")" = 0 ] && [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 4m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_world_modulator_atomicity_run349 tests.test_world_corrupt_packet_recovery_run420 tests.test_world_receipt_binding_run424 tests.test_world_valid_recent_window_run431 tests.test_world_timing_invalid_sample_20261028 tests.test_world_multiaction_recovery_20261028 tests.test_selfstate_session_unfinished_20261028 tests.test_c2_benchmark) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else
            echo SKIPPED_PREREQ_RED > "$e/FOCUSED_RAW.log"
            echo SKIPPED_RED > "$e/FOCUSED_EXIT.txt"
          fi
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=.:tests "$py" -m unittest discover -s tests -p 'test_*.py' -q) > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else
            echo SKIPPED_FOCUSED_RED > "$e/FULL_RAW.log"
            echo SKIPPED_RED > "$e/FULL_EXIT.txt"
          fi
          python3 -m compileall -q v13/code/scripts/c2_benchmark.py v13/code/tests/test_c2_benchmark.py v13/code/v13/world.py v13/code/tests/test_world_modulator_atomicity_run349.py v13/code/tests/test_world_corrupt_packet_recovery_run420.py v13/code/tests/test_world_receipt_binding_run424.py v13/code/tests/test_world_valid_recent_window_run431.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 3de35568ff5905fa892a73358713a85bda626e1f --head HEAD > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 3de35568ff5905fa892a73358713a85bda626e1f HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-world-c2-integration-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-world-c2-integration/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce all software gates
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-world-c2-integration"
          for name in BLOBS INSTALL FOCUSED FULL COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${name}_EXIT.txt")" != 0 ]; then
              echo "$name RED; raw retained"
              tail -80 "$e/${name}_RAW.log" || true
              exit 1
            fi
          done
          echo 'WORLD_C2_INTEGRATION_SOFTWARE_ONLY_NO_NATIVE_REDMI_PROOF'
