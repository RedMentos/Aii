name: V13 adaptive behavior adviser & trainable weights
on:
  push:
    branches:
      - boss/v13-adaptive-behavior-judge-20261111
  pull_request:
    paths:
      - 'v13/code/v13/behavior_governor.py'
      - 'v13/code/tests/test_behavior_governor.py'
      - 'v13/code/tests/test_behavior_governor_android_integration.py'
      - 'v13/code/v13/android_goal_learning_demo.py'
      - 'v13/code/v13/android_goal_replay_retention.py'
      - 'v13/code/tests/test_android_goal_replay_retention.py'
      - 'v13/code/tests/test_behavior_goal_replay_composite.py'
      - '.github/workflows/v13-adaptive-behavior-judge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  behavioral-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: v13/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest numpy==1.26.4
      - name: Verify real gradient updates and independent Android capability guards
        run: |
          python -m py_compile v13/behavior_governor.py v13/android_goal_learning_demo.py
          python -m pytest -q tests/test_behavior_governor.py tests/test_behavior_governor_android_integration.py tests/test_behavior_goal_replay_composite.py tests/test_android_goal_replay_retention.py tests/test_android_goal_learning_demo.py tests/test_android_control_sim.py tests/test_android_sim_jepa_probe.py
