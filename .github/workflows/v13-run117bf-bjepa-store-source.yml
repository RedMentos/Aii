name: V13 Run117BF Body-JEPA real Store USER SourceRef research

on:
  push:
    branches:
      - assistant/v13-run117bf-bjepa-store-source-binding-20261031-hourly11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  store-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Source-pinned real SQLite Store tests, privacy and raw receipts
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run117bf"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          d96d925733c0e76a94ceac7934e57ab18fe4538c v13/code/v13/body_jepa_store_source_binding_shadow.py
          3a95d937d09db402aad2160612a0df85575c8b95 v13/code/tests/test_body_jepa_store_source_binding_run117bf.py
          823644a51acd1ea1ed2c8ed17452d0976a25778f v13/code/v13/body_jepa_grouped_source_candidate.py
          0779d986fb8aee8aa01c5df5f656889d4bd56348 v13/code/v13/store.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m py_compile v13/code/v13/body_jepa_store_source_binding_shadow.py v13/code/tests/test_body_jepa_store_source_binding_run117bf.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$bad" = 0 ]; then
            timeout --signal=TERM --kill-after=5s 90s env PYTHONPATH=v13/code python3 -m unittest discover -s v13/code/tests -p test_body_jepa_store_source_binding_run117bf.py -v > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED > "$e/TEST_RAW.log"; echo SKIPPED > "$e/TEST_EXIT.txt"; fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base ef80e54b5a00fdc08d50a6a3ea9fa3aa5f2dd656 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check ef80e54b5a00fdc08d50a6a3ea9fa3aa5f2dd656 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw on GREEN or RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117bf-store-source-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117bf/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce source-only research result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117bf"
          for stage in PINS COMPILE TEST PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; raw preserved"
              tail -75 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'RUN117BF_REAL_SQLITE_SOFTWARE_ONLY_NO_TRAINING_OR_JEPA_GATE'
