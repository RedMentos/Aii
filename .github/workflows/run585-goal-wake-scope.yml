name: V13 Run585 AG3 goal wake scoped software proof
on:
  push:
    branches:
      - codex/automation11-run585-goal-wake-scope-20261026
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/run585-goal-wake-scope.yml'
      - 'v13/code/v13/agi/goals.py'
      - 'v13/code/tests/test_run585_goal_wake_scope.py'
      - 'v13/code/docs/proofs/continuation-20261026/run585-goal-wake-scope/**'
permissions:
  contents: read
jobs:
  goal-wake-scope:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.ref == 'codex/automation11-run585-goal-wake-scope-20261026' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install isolated model-free test dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'prompt_toolkit==3.0.52'
      - name: Execute AG3 and existing operator/JEF software tests
        shell: bash
        run: |
          mkdir -p run585-raw
          git rev-parse HEAD > run585-raw/source_head.txt
          sha256sum v13/code/v13/agi/goals.py v13/code/tests/test_run585_goal_wake_scope.py v13/code/docs/proofs/continuation-20261026/run585-goal-wake-scope/PREREG.md > run585-raw/source_sha256.txt
          set +e
          (cd v13/code && python -m unittest discover -s tests -p test_run585_goal_wake_scope.py -v) > run585-raw/new-tests.log 2>&1
          echo "$?" > run585-raw/new-tests.exit
          (cd v13/code && python -m unittest discover -s tests -p test_run553_user_goal_operator.py -v && python -m unittest discover -s tests -p test_run555_jef_goal_session.py -v && python -m unittest discover -s tests -p test_run552_jef_goal_final_receipt.py -v) > run585-raw/regressions.log 2>&1
          echo "$?" > run585-raw/regressions.exit
          python -m compileall -q v13/code/v13/agi/goals.py v13/code/tests/test_run585_goal_wake_scope.py > run585-raw/compile.log 2>&1
          echo "$?" > run585-raw/compile.exit
          python v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha || '5155956454730e516f494129d38971a3783f117b' }}" --head "${{ github.event.pull_request.head.sha || github.sha }}" --no-worktree > run585-raw/privacy.log 2>&1
          echo "$?" > run585-raw/privacy.exit
          set -e
          cat run585-raw/new-tests.log
          cat run585-raw/regressions.log
          cat run585-raw/privacy.log
      - name: Close SHA manifest even on failure
        if: always()
        shell: bash
        run: |
          mkdir -p run585-raw
          (cd run585-raw && sha256sum *.txt *.log *.exit > RAW_SHA256SUMS.txt)
          cat run585-raw/RAW_SHA256SUMS.txt
      - name: Preserve raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run585-goal-wake-scope-raw
          path: run585-raw/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce tests and privacy
        shell: bash
        run: |
          test "$(cat run585-raw/new-tests.exit)" = 0
          test "$(cat run585-raw/regressions.exit)" = 0
          test "$(cat run585-raw/compile.exit)" = 0
          test "$(cat run585-raw/privacy.exit)" = 0
