name: Run218 actual Runtime C5 to WorldModel observation (software)
on:
  pull_request:
    paths:
      - 'v13/code/tests/test_runtime_world_observation_run218.py'
      - 'v13/code/v13/world_model.py'
      - 'v13/code/v13/runtime.py'
      - '.github/workflows/run218-runtime-world.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Isolated software prerequisites
        run: python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Actual Runtime/C5 world and observed input regressions
        working-directory: v13/code
        run: |
          PYTHONPATH=tests:. python -m unittest -v tests.test_runtime_world_observation_run218 tests.test_world_model_integration_run64 tests.test_world_counterfactual_input_integrity_run209 tests.test_world_observation_integrity_run202
          python -m compileall -q v13/world_model.py tests/test_runtime_world_observation_run218.py
      - name: Official public repository privacy scan
        run: python v13/code/scripts/public_repo_privacy_scan.py --base 9c8c03aaf72689616f722dde56266050c7fbde21 --head HEAD --no-worktree
      - name: Claim boundary
        run: echo 'Actual Runtime/SQLite with deterministic C3 double; no native, fitted world utility or gate promotion'
