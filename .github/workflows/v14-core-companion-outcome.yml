name: V14 Core Android companion outcome adapter, Store and caller-assertion gate
on:
  push:
    branches:
      - gpt6/v14-core-companion-outcome-20261121
      - qa/v14-companion-single-use-approval-20261121
      - qa/v14-companion-os-permission-contract-20261122
      - core/v14-android-action-journal-20261122
  pull_request:
    branches:
      - core/v14-android-companion-native-20261121
      - qa/v14-companion-single-use-approval-20261121
      - qa/v14-pairing-durable-commit-20261122
    paths:
      - 'v13/code/v13/contracts.py'
      - 'v13/code/v13/android_control.py'
      - 'v13/code/v13/android_outcomes.py'
      - 'v13/code/v13/android_companion_protocol.py'
      - 'v13/code/v13/android_companion_ecdsa.py'
      - 'v13/code/v13/android_companion_transport.py'
      - 'v13/code/v13/android_companion_runtime.py'
      - 'v13/code/tests/test_android_companion_runtime.py'
      - 'v13/code/tests/test_android_companion_outcome_adapter.py'
      - 'v13/code/tests/test_android_companion_ecdsa.py'
      - 'v13/code/tests/test_android_companion_transport.py'
      - 'v13/code/tests/test_android_control.py'
      - '.github/workflows/v14-core-companion-outcome.yml'
jobs:
  companion-outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile companion boundary
        run: python -m py_compile v13/code/v13/contracts.py v13/code/v13/android_control.py v13/code/v13/android_outcomes.py v13/code/v13/android_companion_protocol.py v13/code/v13/android_companion_ecdsa.py v13/code/v13/android_companion_transport.py v13/code/v13/android_companion_runtime.py v13/code/tests/test_android_companion_runtime.py v13/code/tests/test_android_companion_outcome_adapter.py v13/code/tests/test_android_companion_ecdsa.py v13/code/tests/test_android_companion_transport.py v13/code/tests/test_android_control.py
      - name: Run existing and new Android control regressions
        run: PYTHONPATH=v13/code python -m pytest -q v13/code/tests/test_android_control.py v13/code/tests/test_android_outcomes.py v13/code/tests/test_android_companion_protocol.py v13/code/tests/test_android_companion_outcome_adapter.py v13/code/tests/test_android_companion_ecdsa.py v13/code/tests/test_android_companion_transport.py v13/code/tests/test_android_companion_runtime.py
