name: V13 Sleep A exact recall identity RED GREEN
on:
  push:
    branches: [assistant/v13-sleep-a-exact-recall-identity-review-20261027]
    paths:
      - '.github/workflows/sleep-a-exact-recall-identity-review.yml'
      - 'v13/code/v13/sleep.py'
      - 'v13/code/tests/test_sleep_a_exact_recall_identity_review.py'
permissions:
  contents: read
concurrency:
  group: v13-sleep-a-exact-recall-identity
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Capture raw Sleep A tests
        run: |
          set +e
          evidence="$RUNNER_TEMP/sleep-a-exact"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/HEAD.txt"
          git hash-object v13/code/v13/sleep.py > "$evidence/SOURCE_BLOB.txt"
          git hash-object v13/code/tests/test_sleep_a_exact_recall_identity_review.py > "$evidence/TEST_BLOB.txt"
          git merge-base --is-ancestor d9ee59ef7d189334533f58a9be63229466fa345f HEAD
          echo "$?" > "$evidence/PREREG_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/sleep-a-exact-venv"
          py="$RUNNER_TEMP/sleep-a-exact-venv/bin/python"
          "$py" -m pip install --no-input -q 'numpy==2.2.6' 'psutil' 'PyYAML' 'Pillow' > "$evidence/INSTALL_RAW.log" 2>&1
          echo "$?" > "$evidence/INSTALL_EXIT.txt"
          (
            cd v13/code
            timeout --signal=TERM --kill-after=10s 8m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_sleep_a_exact_recall_identity_review tests.test_sleep_scheduler tests.test_sleep_validation tests.test_sleep_offline
          ) > "$evidence/UNIT_RAW.log" 2>&1
          echo "$?" > "$evidence/UNIT_EXIT.txt"
          python3 -m py_compile v13/code/v13/sleep.py v13/code/tests/test_sleep_a_exact_recall_identity_review.py > "$evidence/COMPILE_RAW.log" 2>&1
          echo "$?" > "$evidence/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 1ab88aa30947e2f3da9905b1d3055f04b98a8bed --head HEAD > "$evidence/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$evidence/PRIVACY_EXIT.txt"
          git diff --check 1ab88aa30947e2f3da9905b1d3055f04b98a8bed HEAD > "$evidence/DIFF_RAW.log" 2>&1
          echo "$?" > "$evidence/DIFF_EXIT.txt"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-sleep-a-exact-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/sleep-a-exact/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce raw exits
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/sleep-a-exact"
          for name in PREREG INSTALL UNIT COMPILE PRIVACY DIFF; do
            if [ "$(cat "$evidence/${name}_EXIT.txt")" != 0 ]; then
              echo "$name failed; raw evidence retained"
              tail -100 "$evidence/${name}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'SLEEP_A_EXACT_RECALL_SOFTWARE_ONLY_NO_PROMOTION'
