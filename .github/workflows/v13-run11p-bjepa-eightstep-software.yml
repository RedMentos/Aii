name: V13 run11p Body-JEPA eight-step disjoint cohort software controls
on:
  push:
    branches: [assistant/v13-run11p-bjepa-eightstep-disjoint-20261030]
    paths:
      - '.github/workflows/v13-run11p-bjepa-eightstep-software.yml'
      - 'v13/code/scripts/bodyjepa_350m_eightstep_disjoint_run11p.py'
      - 'v13/code/tests/test_bodyjepa_350m_eightstep_disjoint_run11p.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eightstep-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Source-bound eight-step cohort protocol and raw receipts
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run11p-software"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/scripts/bodyjepa_350m_eightstep_disjoint_run11p.py > "$e/PROBE_BLOB.txt"
          git hash-object v13/code/v13/body_jepa.py > "$e/BJEPA_BLOB.txt"
          git hash-object v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/CANON_BLOB.txt"
          test "$(cat "$e/PROBE_BLOB.txt")" = af685a22ddd4ff6412643a8849a1f00bf2112487 &&
          test "$(cat "$e/BJEPA_BLOB.txt")" = b560d4e88fe457f381e89dfc5d6188a8ec3b306b &&
          test "$(cat "$e/CANON_BLOB.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          echo "$?" > "$e/SOURCE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run11p-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run11p-venv/bin/python"
          "$py" -m pip install --no-input --disable-pip-version-check --timeout 90 --retries 2             'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu             > "$e/TORCH_RAW.log" 2>&1
          echo "$?" > "$e/TORCH_EXIT.txt"
          "$py" -m pip install --no-input --disable-pip-version-check --timeout 90 --retries 2             'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' 'transformers==5.20.2' 'tokenizers==0.23.1' 'safetensors==0.8.0' 'peft==0.21.2' 'huggingface_hub>=1.31.0,<2.0'             > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:scripts:tests "$py" -m unittest -v             tests.test_bodyjepa_350m_eightstep_disjoint_run11p             tests.test_bodyjepa_350m_heldout_ablation_20261030             tests.test_body_jepa) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          "$py" -m py_compile v13/code/scripts/bodyjepa_350m_eightstep_disjoint_run11p.py             v13/code/tests/test_bodyjepa_350m_eightstep_disjoint_run11p.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py             --base b4c1a3df6b29eb2d8e231665fc73c0592ab529ca             --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check b4c1a3df6b29eb2d8e231665fc73c0592ab529ca HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-run11p-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run11p-software/
          retention-days: 30
          if-no-files-found: error
      - name: Fail closed
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run11p-software"
          for stage in SOURCE VENV TORCH DEPS TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "${stage} RED; raw preserved"
              tail -100 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo "EIGHTSTEP_SOFTWARE_PROTOCOL_ONLY_NO_NATIVE_OR_GATE_PROMOTION"
