name: V13 WorldModel fitted source lineage and revocation (software)
on:
  pull_request:
    paths:
      - 'v13/code/v13/world_model.py'
      - 'v13/code/tests/test_world_model.py'
      - 'v13/code/tests/test_world_fitted_source_lineage_20261025.py'
      - '.github/workflows/world-fitted-source-lineage-20261025.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  world-fit-lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned isolated software prerequisites
        run: |
          python3 -m venv "$RUNNER_TEMP/world-fit"
          "$RUNNER_TEMP/world-fit/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt_toolkit==3.0.52'
      - name: Actual Store source revocation and existing WorldModel compatibility tests
        working-directory: v13/code
        run: |
          set -o pipefail
          PYTHONPATH="$PWD:$PWD/tests" "$RUNNER_TEMP/world-fit/bin/python" -m unittest -v test_world_fitted_source_lineage_20261025 test_world_model test_world_event_source_integrity_20261025 test_world_model_integration_run64 test_runtime_world_observation_run218 2>&1 | tee "$RUNNER_TEMP/WORLD_FITTED_LINEAGE_RAW.log"
          "$RUNNER_TEMP/world-fit/bin/python" -m compileall -q v13/world_model.py tests/test_world_model.py tests/test_world_fitted_source_lineage_20261025.py
      - name: Official privacy scan
        run: python3 v13/code/scripts/public_repo_privacy_scan.py --base ddad7815b368819c8987695c0bee1256e104ddff --head HEAD --no-worktree
      - name: Preserve full raw log on failure or success
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: V13-World-Fitted-Source-Lineage-Raw
          path: ${{ runner.temp }}/WORLD_FITTED_LINEAGE_RAW.log
          if-no-files-found: warn
          retention-days: 30
      - name: Claim boundary
        run: echo 'Actual Store with synthetic actions; no native model, JEPA, B3 or Redmi proof'
