name: Run215 JEF open-question event/source lineage (software)
on:
  pull_request:
    paths:
      - 'v13/code/v13/executive.py'
      - 'v13/code/tests/test_executive_open_question_lineage_run215.py'
      - '.github/workflows/run215-jef-question-lineage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jef:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Isolated software prerequisites
        run: python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Actual source JEF question-lineage and previous regressions
        working-directory: v13/code
        run: |
          PYTHONPATH=tests:. python -m unittest -v tests.test_executive_open_question_lineage_run215 tests.test_executive_task_session_lineage_run213 tests.test_executive_goal_session_lineage_run212 tests.test_executive
          python -m compileall -q v13/executive.py tests/test_executive_open_question_lineage_run215.py
      - name: Official public repository privacy scan
        run: python v13/code/scripts/public_repo_privacy_scan.py --base f4691e7246bd7bb9d0468304c224267ee2551be2 --head HEAD --no-worktree
      - name: Claim boundary
        run: echo 'Actual JEF Store/Executive with synthetic OfferPackets; no native C2, learning or age promotion'
