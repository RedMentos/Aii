name: V13 P2 QAD one-factor ignore_eos false native control
on:
  push:
    branches: [codex/v13-p2-eos-sampling-control-20261029]
    paths: ['.github/workflows/v13-p2-qad-eos-control-native-20261029.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: v13-p2-qad-fp32-real-value-serial-20261029
  cancel-in-progress: false
jobs:
  native-eos-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned original raw and one-factor native eight-call diagnostic
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          e="$RUNNER_TEMP/v13-p2-eos-control-evidence"
          w="$RUNNER_TEMP/v13-p2-eos-control-work"
          mkdir -p "$e" "$w/runtime"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 - "$w" > "$e/RESOURCE_RAW.log" 2>&1 <<'PY'
          import shutil,sys
          print(shutil.disk_usage(sys.argv[1]).free)
          assert shutil.disk_usage(sys.argv[1]).free >= 1_000_000_000
          PY
          echo "$?" > "$e/RESOURCE_EXIT.txt"
          if [ "$(cat "$e/RESOURCE_EXIT.txt")" = 0 ]; then
            python3 - "$w/original.zip" > "$e/ARTIFACT_DOWNLOAD_RAW.log" 2>&1 <<'PY'
          import os,sys,urllib.request
          url="https://api.github.com/repos/RedMentos/Aii/actions/artifacts/12887870364/zip"
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(req,timeout=120) as response:
              with open(sys.argv[1],"xb") as f:
                  f.write(response.read(4_000_000))
          PY
            echo "$?" > "$e/ARTIFACT_DOWNLOAD_EXIT.txt"
            printf '%s  %s\n' '2cb67b8dc3a861d821e75b0dfab4a56cd2f1a046a9e36ce0929197648c1d1633' "$w/original.zip" | sha256sum -c > "$e/ARTIFACT_SHA_RAW.log" 2>&1
            echo "$?" > "$e/ARTIFACT_SHA_EXIT.txt"
            if [ "$(cat "$e/ARTIFACT_SHA_EXIT.txt")" = 0 ]; then
              unzip -t "$w/original.zip" > "$e/ARTIFACT_CRC_RAW.log" 2>&1
              unzip -p "$w/original.zip" RESULT.json > "$w/reference.json"
              printf '%s  %s\n' '1df95bff7c78635ae3f5bce13e58d30182610e8a7978ab6afaabfa327e750a23' "$w/reference.json" | sha256sum -c > "$e/RESULT_SHA_RAW.log" 2>&1
              echo "$?" > "$e/RESULT_SHA_EXIT.txt"
            else echo SKIPPED > "$e/RESULT_SHA_EXIT.txt"; fi
            curl -fL --retry 2 --connect-timeout 20 --max-time 300 'https://github.com/ggml-org/llama.cpp/releases/download/b10964/llama-b10964-bin-ubuntu-x64.tar.gz' -o "$w/runtime.tar.gz" > "$e/RUNTIME_DOWNLOAD_RAW.log" 2>&1
            echo "$?" > "$e/RUNTIME_DOWNLOAD_EXIT.txt"
            printf '%s  %s\n' '9abf88aea48a55d0f80edb1ee20220b186848cca0b4e919d71518cfd7ca67443' "$w/runtime.tar.gz" | sha256sum -c > "$e/RUNTIME_SHA_RAW.log" 2>&1
            echo "$?" > "$e/RUNTIME_SHA_EXIT.txt"
            curl -fL --retry 2 --connect-timeout 20 --max-time 600 'https://huggingface.co/LiquidAI/LFM2.5-350M-GGUF/resolve/657e078c94084481950a2d555a941481f715536b/LFM2.5-350M-QAD-Q4_0.gguf?download=true' -o "$w/QAD.gguf" > "$e/GGUF_DOWNLOAD_RAW.log" 2>&1
            echo "$?" > "$e/GGUF_DOWNLOAD_EXIT.txt"
            printf '%s  %s\n' '3d10b6ab8fc91a919534b9558e266255aca0bbc7f6d015963599aa9e74e05b1d' "$w/QAD.gguf" | sha256sum -c > "$e/GGUF_SHA_RAW.log" 2>&1
            echo "$?" > "$e/GGUF_SHA_EXIT.txt"
          else
            for s in ARTIFACT_DOWNLOAD ARTIFACT_SHA RESULT_SHA RUNTIME_DOWNLOAD RUNTIME_SHA GGUF_DOWNLOAD GGUF_SHA; do echo SKIPPED > "$e/$s"_EXIT.txt; done
          fi
          if [ "$(cat "$e/RESULT_SHA_EXIT.txt")" = 0 ] && [ "$(cat "$e/RUNTIME_SHA_EXIT.txt")" = 0 ] && [ "$(cat "$e/GGUF_SHA_EXIT.txt")" = 0 ]; then
            tar -xzf "$w/runtime.tar.gz" -C "$w/runtime" > "$e/EXTRACT_RAW.log" 2>&1
            bin=$(find "$w/runtime" -type f -name llama-server -print -quit)
            if [ -n "$bin" ]; then
              chmod +x "$bin"
              export LD_LIBRARY_PATH="$(dirname "$bin"):$LD_LIBRARY_PATH"
              "$bin" --model "$w/QAD.gguf" --host 127.0.0.1 --port 8080 --ctx-size 512 --threads 2 --n-gpu-layers 0 --no-warmup > "$e/SERVER_RAW.log" 2>&1 &
              server_pid=$!
              ready=1
              for i in $(seq 1 90); do
                curl -fsS --max-time 2 http://127.0.0.1:8080/health > "$e/HEALTH_RAW.json" 2>/dev/null
                if [ "$?" = 0 ]; then ready=0; break; fi
                if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
                sleep 1
              done
              echo "$ready" > "$e/SERVER_READY_EXIT.txt"
              if [ "$ready" = 0 ]; then
                timeout --signal=TERM --kill-after=10s 300s python3 v13/code/scripts/p2_qad_eos_control.py --reference "$w/reference.json" --gguf "$w/QAD.gguf" --output "$e/RESULT.json" > "$e/AUDIT_RAW.log" 2>&1
                echo "$?" > "$e/AUDIT_EXIT.txt"
              else echo SKIPPED_SERVER_RED > "$e/AUDIT_RAW.log"; echo SKIPPED > "$e/AUDIT_EXIT.txt"; fi
              kill "$server_pid" 2>/dev/null
              wait "$server_pid" 2>/dev/null
            else echo 1 > "$e/SERVER_READY_EXIT.txt"; echo SKIPPED > "$e/AUDIT_EXIT.txt"; fi
          else echo SKIPPED > "$e/SERVER_READY_EXIT.txt"; echo SKIPPED > "$e/AUDIT_EXIT.txt"; fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 9be1c524d1ab813be97b80873b0ba223372f7fd0 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 9be1c524d1ab813be97b80873b0ba223372f7fd0 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve raw and RED before checking narrow result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-p2-eos-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-p2-eos-control-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce only eight source-bound native calls
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-p2-eos-control-evidence"
          for s in RESOURCE ARTIFACT_DOWNLOAD ARTIFACT_SHA RESULT_SHA RUNTIME_DOWNLOAD RUNTIME_SHA GGUF_DOWNLOAD GGUF_SHA SERVER_READY AUDIT PRIVACY DIFF; do
            test "$(cat "$e/$s"_EXIT.txt)" = 0
          done
          python3 - "$e/RESULT.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['schema']=='v13.p2.qad_gguf_eos_sampling_control.v1'
          assert x['status']=='EIGHT_NATIVE_EOS_CONTROL_DESCRIPTIVE_ONLY'
          assert x['probe_count']==x['new_gguf_forward_calls']==8
          assert x['new_hf_forward_calls']==0 and x['training'] is False
          assert x['full_logit_rope_cache_adapter_or_utility_parity_proven'] is False
          assert 0<=x['control_hf_vs_generated_equal']<=8
          print('EIGHT_EOS_CONTROL_NATIVE_CALLS_MEASURED_NO_PARITY_PROMOTION')
          PY
