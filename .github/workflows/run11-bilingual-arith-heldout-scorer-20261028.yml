name: V13 Run11 bilingual arithmetic heldout scorer
on:
  push:
    branches:
      - assistant/v13-run11-bilingual-arith-heldout-scorer-20261028
    paths:
      - '.github/workflows/run11-bilingual-arith-heldout-scorer-20261028.yml'
      - 'v13/code/scripts/age0_bilingual_arith_scorer.py'
      - 'v13/code/tests/test_age0_bilingual_arith_scorer.py'
      - 'v13/code/specs/age0-bilingual-arith-heldout-20261028.json'
permissions:
  contents: read
concurrency:
  group: v13-run11-bilingual-arith-heldout-scorer
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: "1"
      NO_MODEL_DOWNLOADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Freeze heldout corpus and run focused plus full Linux software
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-bilingual-arith-heldout"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/specs/age0-bilingual-arith-heldout-20261028.json > "$e/FIXTURE_BLOB.txt"
          if [ "$(cat "$e/FIXTURE_BLOB.txt")" = ceda0a5cb506cf09885652b24893cf7d8fdff63b ]; then echo 0 > "$e/FIXTURE_EXIT.txt"; else echo 1 > "$e/FIXTURE_EXIT.txt"; fi
          python3 -m venv "$RUNNER_TEMP/v13-bilingual-arith-venv"
          py="$RUNNER_TEMP/v13-bilingual-arith-venv/bin/python"
          "$py" -m pip install --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          first=$?
          "$py" -m pip install --no-input -q 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
          second=$?
          "$py" -m pip install --no-input -q 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
          third=$?
          if [ "$first" = 0 ] && [ "$second" = 0 ] && [ "$third" = 0 ]; then echo 0 > "$e/INSTALL_EXIT.txt"; else echo 1 > "$e/INSTALL_EXIT.txt"; fi
          if [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ] && [ "$(cat "$e/FIXTURE_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 4m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_age0_bilingual_arith_scorer) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else
            echo SKIPPED_PREREQ_RED > "$e/FOCUSED_RAW.log"
            echo SKIPPED_RED > "$e/FOCUSED_EXIT.txt"
          fi
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=.:tests "$py" -m unittest discover -s tests -p 'test_*.py' -q) > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else
            echo SKIPPED_FOCUSED_RED > "$e/FULL_RAW.log"
            echo SKIPPED_RED > "$e/FULL_EXIT.txt"
          fi
          python3 -m compileall -q v13/code/scripts/age0_bilingual_arith_scorer.py v13/code/tests/test_age0_bilingual_arith_scorer.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base b99ce3ef8dd772130c3a56a1ec02e7ea203f3b5c --head HEAD > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check b99ce3ef8dd772130c3a56a1ec02e7ea203f3b5c HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-bilingual-arith-heldout-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-bilingual-arith-heldout/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce software-only acceptance
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-bilingual-arith-heldout"
          for name in FIXTURE INSTALL FOCUSED FULL COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${name}_EXIT.txt")" != 0 ]; then
              echo "$name RED; raw retained"
              tail -80 "$e/${name}_RAW.log" || true
              exit 1
            fi
          done
          echo 'BILINGUAL_ARITH_HELDOUT_SOFTWARE_PASS_NO_NATIVE_PROMOTION'
