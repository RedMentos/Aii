name: V13 Run12C source-only contrastive 350M pilot preflight
on:
  push:
    branches: [assistant/v13-run12c-bjepa-contrastive-native-runner-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run12c-bjepa-contrastive-preflight.yml'
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Closed raw source-only protocol and privacy check
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run12c-preflight"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          15597550100de6ca546b1b024fbc6597fc600839 v13/code/scripts/bodyjepa_350m_contrastive_disjoint_run12c.py
          3d77ff42fbbbb68c941b5b8092b9e16f700b66d8 v13/code/tests/test_bodyjepa_350m_contrastive_disjoint_run12c.py
          a31a18d9be0b1137a10304f24d3a241d720bd247 v13/code/v13/body_jepa_contrastive_trainer_shadow.py
          af685a22ddd4ff6412643a8849a1f00bf2112487 v13/code/scripts/bodyjepa_350m_eightstep_disjoint_run11p.py
          b560d4e88fe457f381e89dfc5d6188a8ec3b306b v13/code/v13/body_jepa.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            printf '%s %s %s\n' "$want" "$got" "$path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:scripts:tests timeout --signal=TERM --kill-after=5s 120s python3 -m unittest -v tests.test_bodyjepa_350m_contrastive_disjoint_run12c tests.test_bodyjepa_350m_eightstep_disjoint_run11p) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m py_compile v13/code/scripts/bodyjepa_350m_contrastive_disjoint_run12c.py v13/code/tests/test_bodyjepa_350m_contrastive_disjoint_run12c.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base f4fb9b9ae443c4486730a827dfbd199b5cc75bb2 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check f4fb9b9ae443c4486730a827dfbd199b5cc75bb2 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw on GREEN or RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run12c-preflight-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run12c-preflight/
          retention-days: 30
          if-no-files-found: error
      - name: Fail closed, no native or gate promotion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run12c-preflight"
          for stage in PINS TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "${stage} RED; raw artifact preserved"
              tail -80 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo "RUN12C_SOFTWARE_ONLY_NO_NATIVE_NO_PROMOTION"
