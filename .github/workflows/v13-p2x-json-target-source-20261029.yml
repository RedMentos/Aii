name: V13 P2X JSON-target four-step source-only admission

on:
  push:
    branches: [codex/v13-p2x-json-target-trainpilot-20261029]
    paths:
      - '.github/workflows/v13-p2x-json-target-source-20261029.yml'
      - 'v13/code/scripts/p2x_c3_json_target_fourstep.py'
      - 'v13/code/scripts/p2x_json_target_evidence_audit.py'
      - 'v13/code/tests/test_p2x_json_target_fourstep_20261029.py'

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Capture exact source-only RED or GREEN
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-p2x-json-target-source"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          f9182daef9611544efb7a0e2346177b05612be6b v13/code/scripts/p2x_c3_json_target_fourstep.py
          1d6170affdcece632db29a9d1e5583ef0ac6c916 v13/code/scripts/p2x_json_target_evidence_audit.py
          08e719fed4e7d424f1fd7cee26dfb9a4ffe5624d v13/code/tests/test_p2x_json_target_fourstep_20261029.py
          c2d6ac051d943969f547fe260390d1a5edf714c3 v13/code/docs/coordination/P2X_JSON_TARGET_FOURSTEP_PREREG_20261029.md
          41b61ba3d196fc8d624e586c0f31e740002bd469 v13/code/scripts/p2x_c3_lora_pilot.py
          fc434116f2a7b480109b7a8b939db9b4f362062a v13/code/scripts/p2x_c3_receiver_fourstep.py
          8135fa2792df2c541dc1719e49d941c775703697 v13/code/scripts/p2x_disjoint_receiver_trainset.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          source_red=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            printf '%s %s %s\n' "$want" "$got" "$path" >> "$e/SOURCE_RAW.log"
            if [ "$want" != "$got" ]; then source_red=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$source_red" > "$e/SOURCE_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests:scripts python3 -m unittest -v tests.test_p2x_json_target_fourstep_20261029 tests.test_p2x_c3_receiver_fourstep) > "$e/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$e/FOCUSED_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/p2x_c3_json_target_fourstep.py v13/code/scripts/p2x_json_target_evidence_audit.py v13/code/tests/test_p2x_json_target_fourstep_20261029.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 4f80f88920678ea1aad3a50550b4bc73ea1d80c5 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 4f80f88920678ea1aad3a50550b4bc73ea1d80c5 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original source-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-p2x-json-target-source-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-p2x-json-target-source/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce source-only gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-p2x-json-target-source"
          for n in SOURCE FOCUSED COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; original raw preserved"
              tail -50 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo P2X_JSON_TARGET_SOURCE_ONLY_NO_NATIVE_CLAIM
