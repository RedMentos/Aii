name: V14 tokenwise native receiver consumer

on:
  push:
    branches:
      - core/v14-tokenwise-native-receiver-consumer-20261125-run1
  pull_request:
    branches:
      - core/v14-native-tokenwise-runtime-capture-20261125-run1
    paths:
      - "v13/code/v13/native_tokenwise_receiver_probe.py"
      - "v13/code/v13/native_tokenwise_pairing.py"
      - "v13/code/v13/latent_adapter.py"
      - "v13/code/v13/native_latent_receiver.py"
      - "v13/code/v13/native_probe_approval.py"
      - "v13/code/tests/test_native_tokenwise_receiver_probe.py"
      - "v13/code/tests/test_native_tokenwise_pairing.py"
      - ".github/workflows/v14-native-tokenwise-receiver-consumer.yml"

permissions:
  contents: read

jobs:
  python-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
      - name: Install focused dependencies
        run: python -m pip install pytest==9.2.0 numpy==2.3.5 psutil pyyaml
      - name: Compile tokenwise receiver consumer and contracts
        env:
          PYTHONPATH: v13/code
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile v13/code/v13/native_tokenwise_receiver_probe.py v13/code/v13/native_tokenwise_pairing.py v13/code/v13/latent_adapter.py v13/code/v13/native_latent_receiver.py v13/code/v13/native_probe_approval.py v13/code/tests/test_native_tokenwise_receiver_probe.py v13/code/tests/test_native_tokenwise_pairing.py
      - name: Test native receiver consumer and anchor-preserving alignment
        env:
          PYTHONPATH: v13/code
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -q v13/code/tests/test_native_tokenwise_receiver_probe.py v13/code/tests/test_native_tokenwise_pairing.py
      - name: Scan public diff for private data and secrets
        run: python v13/code/scripts/public_repo_privacy_scan.py --base origin/core/v14-native-tokenwise-runtime-capture-20261125-run1 --head HEAD --no-worktree
