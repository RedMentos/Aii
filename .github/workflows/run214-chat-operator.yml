name: Run214 persistent multi-chat operator journey (software)
on:
  pull_request:
    paths:
      - 'v13/code/tests/test_chat_operator_persistence_run214.py'
      - 'v13/code/v13/operator.py'
      - 'v13/code/v13/store.py'
      - 'v13/code/v13/runtime.py'
      - '.github/workflows/run214-chat-operator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chat-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Isolated software prerequisites
        run: python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Actual Runtime/Operator/SQLite journey and existing regressions
        working-directory: v13/code
        run: |
          PYTHONPATH=tests:. python -m unittest -v tests.test_chat_operator_persistence_run214 tests.test_operator_search_literal_run88 tests.test_second_turn_c3_memory_pipeline_run204
          python -m compileall -q v13/operator.py tests/test_chat_operator_persistence_run214.py
      - name: Official public repository privacy scan
        run: python v13/code/scripts/public_repo_privacy_scan.py --base d5cbdee642844e334ddfb277c48005785be25441 --head HEAD --no-worktree
      - name: Claim boundary
        run: echo 'Actual Runtime/SQLite with deterministic C3 double; no native, Redmi, learning or gate promotion'
