name: V14 JEPA training-resume and source-forget Python 3.13/3.14

on:
  pull_request:
    paths:
      - "v13/code/v13/world_jepa.py"
      - "v13/code/v13/world_jepa_training_state.py"
      - "v13/code/v13/world_jepa_shadow_checkpoint.py"
      - "v13/code/v13/world_jepa_consumer.py"
      - "v13/code/v13/memory.py"
      - "v13/code/v13/store.py"
      - "v13/code/v13/source_lifecycle_candidate.py"
      - "v13/code/scripts/source_lifecycle_lock_integration_candidate.py"
      - "v13/code/scripts/integrated_memory_world_candidate_20261111.py"
      - "v13/code/scripts/integrated_online_world_candidate_20261110.py"
      - "v13/code/scripts/integrated_jepa_guard_candidate_20261110.py"
      - "v13/code/scripts/integrated_predictor_stream_guard_20261110.py"
      - "v13/code/scripts/integrated_predictor_history_guard_20261110.py"
      - "v13/code/scripts/integrated_body_world_candidate_20261110.py"
      - "v13/code/scripts/integrated_c3_resume_candidate_20261110.py"
      - "v13/code/scripts/integrated_feedback_bootstrap_candidate_20261111.py"
      - "v13/code/scripts/integrated_context_recall_candidate_20261111.py"
      - "v13/code/scripts/integrated_world_training_resume_candidate_20261111.py"
      - "v13/code/scripts/termux_runtime_recovery_candidate_20261112.py"
      - "v13/code/scripts/termux_runtime_recovery_candidate_20261121.py"
      - "v13/code/scripts/stage_integrated_candidate.py"
      - "v13/code/v13/runtime_deploy.py"
      - "v13/code/tests/source_lifecycle_disposable_cases.py"
      - "v13/code/tests/test_integrated_memory_world_candidate_20261111.py"
      - "v13/code/tests/test_v14_world_jepa_runtime_port.py"
      - "v13/code/v13/world_jepa_receiver_matrix.py"
      - "v13/code/v13/world_jepa_planner.py"
      - "v13/code/tests/test_world_jepa_training_resume_stage_20261111.py"
      - "v13/code/tests/world_jepa_training_resume_disposable_cases_20261111.py"
      - "v13/code/tests/test_v14_world_jepa_postcommit_runtime.py"
      - ".github/workflows/v14-jepa-training-resume-py314.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimizer-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 pytest==9.2.0
      - name: Run staged optimizer-resume source-composition regression
        run: PYTHONPATH=v13/code PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -s v13/code/tests/test_world_jepa_training_resume_stage_20261111.py
      - name: Run source-forget guard regressions
        run: PYTHONPATH=v13/code PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -s v13/code/tests/test_v14_world_jepa_runtime_port.py -k "memory_forget or source_forget_guard"
      - name: Run lifecycle cleanup and memory/world composition regressions
        run: PYTHONPATH=v13/code PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -s v13/code/tests/source_lifecycle_disposable_cases.py v13/code/tests/test_integrated_memory_world_candidate_20261111.py
