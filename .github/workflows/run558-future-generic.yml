name: V13 Run558 frozen FUTURE_003..024 source-only batch executor
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/run558-future-generic.yml'
      - 'v13/code/scripts/run558_future_batch.py'
      - 'v13/code/tests/test_run558_future_batch.py'
      - 'v13/code/docs/proofs/continuation-20261026/run558-future-generic/**'
permissions:
  contents: read
jobs:
  source:
    if: ${{ github.event.pull_request.head.ref == 'codex/automation11-run558-step2-future-generic-20261026' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Pin frozen originals, new source and unchanged Canon
        id: source
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/RUN558_HEAD.txt"
          test "$(git hash-object v13/code/docs/proofs/continuation-20261026/run558-future-generic/PREREG.md)" = 'c684150f8396f92b8d734ad5d3df734ec06abd69'
          test "$(git hash-object v13/code/scripts/run558_future_batch.py)" = 'c73f2e44c5ecf3b1815b04097502153c814c74e0'
          test "$(git hash-object v13/code/tests/test_run558_future_batch.py)" = 'ed9b3bae830cc8db1fdc9f96872caa8252f01ace'
          test "$(git hash-object v13/code/scripts/run504_remaining980_schedule.py)" = '5f447908ec6197760d55c347ffb949ae42ad1ed8'
          test "$(git hash-object v13/code/scripts/run502_step2_batch.py)" = '5c01768ccedbe63cb3c2eebde5a75347e3a67abd'
          test "$(git hash-object v13/code/scripts/run500_step2_stage_map.py)" = '504a4a8492bdb383869b164b82c05d13e00f6823'
          test "$(git hash-object v13/code/scripts/run491_step2_heldout10.py)" = 'f4d2d8d5e66c49c508e376ebafce2146e5a2715b'
          test "$(git hash-object v13/code/scripts/run496_heldout10_native_pilot.py)" = '543982e6c03c548eab87470732be279fbba53ac1'
          test "$(git hash-object v13/code/specs/models.json)" = '7af05962af41d0bc3f7dd18ef01d4eba55eabf99'
          test "$(sha256sum v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md | cut -d' ' -f1)" = '3423906b01b24443fcef733fb5c7ef47296963df63e603d8f843c99d544877ee'
          { date -u -Iseconds; python3 --version; uname -a; } > "$RUNNER_TEMP/RUN558_HOST.txt"
      - name: Install isolated source-only dependencies
        id: deps
        run: |
          set -uo pipefail
          set +e
          python3 -m venv "$RUNNER_TEMP/run558venv"
          timeout 240s "$RUNNER_TEMP/run558venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52' > "$RUNNER_TEMP/RUN558_DEPS_RAW.log" 2>&1
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/RUN558_DEPS_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: All 22 remaining batches and original fail-stop tests
        id: tests
        if: ${{ steps.deps.outputs.rc == '0' }}
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          export PYTHONPATH="$PWD:$PWD/scripts"
          "$RUNNER_TEMP/run558venv/bin/python" -m compileall -q scripts/run558_future_batch.py tests/test_run558_future_batch.py
          rc=$?
          if [ "$rc" -eq 0 ]; then
            timeout 420s "$RUNNER_TEMP/run558venv/bin/python" -m unittest -v tests.test_run558_future_batch tests.test_run556_future002_batch tests.test_run505_future001_batch tests.test_run504_remaining980_schedule tests.test_run502_step2_batch tests.test_run500_step2_stage_map > "$RUNNER_TEMP/RUN558_TESTS_RAW.log" 2>&1
            rc=$?
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN558_TEST_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Real source-only first and last future plan
        id: plan
        if: ${{ steps.deps.outputs.rc == '0' }}
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          export PYTHONPATH="$PWD:$PWD/scripts"
          rc=0
          for batch in FUTURE_003 FUTURE_024; do
            work="$RUNNER_TEMP/run558-$batch"
            "$RUNNER_TEMP/run558venv/bin/python" scripts/run500_step2_stage_map.py --fixture-only --work "$work" >> "$RUNNER_TEMP/RUN558_PLAN_RAW.log" 2>&1 || { rc=$?; break; }
            "$RUNNER_TEMP/run558venv/bin/python" scripts/run504_remaining980_schedule.py --output "$work/RUN504_SCHEDULE.json" >> "$RUNNER_TEMP/RUN558_PLAN_RAW.log" 2>&1 || { rc=$?; break; }
            "$RUNNER_TEMP/run558venv/bin/python" scripts/run558_future_batch.py --plan --batch "$batch" --work "$work" >> "$RUNNER_TEMP/RUN558_PLAN_RAW.log" 2>&1 || { rc=$?; break; }
            cp "$work/RUN558_BATCH_PLAN.json" "$RUNNER_TEMP/RUN558_$batch.json" || { rc=$?; break; }
          done
          if [ "$rc" -eq 0 ]; then
            "$RUNNER_TEMP/run558venv/bin/python" - <<'PY' >> "$RUNNER_TEMP/RUN558_PLAN_RAW.log" 2>&1
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          first=json.loads((root/'RUN558_FUTURE_003.json').read_text())
          last=json.loads((root/'RUN558_FUTURE_024.json').read_text())
          assert first['stage_ids']==['A_s32_p01','A_s32_p02','A_s32_p03']
          assert first['expected_rows']==42 and last['expected_rows']==14
          assert all(x['native_executed'] is False and x['canonical_gate_pass'] is False and x['step2_exit']=='UTILITY_FAIL' for x in (first,last))
          print('RUN558_22_FROZEN_FUTURE_BATCHES_PLANNABLE_NOT_EXECUTED')
          PY
            rc=$?
          fi
          echo "$rc" > "$RUNNER_TEMP/RUN558_PLAN_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Official public privacy scan
        id: privacy
        if: always()
        run: |
          set -uo pipefail
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree > "$RUNNER_TEMP/RUN558_PRIVACY_RAW.log" 2>&1
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/RUN558_PRIVACY_EXIT.txt"
          exit 0
      - name: SHA-close all raw even RED
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          find . -maxdepth 1 -type f -name 'RUN558_*' ! -name RUN558_SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > RUN558_SHA256SUMS.txt
      - name: Preserve raw even RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run558-future-generic-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/RUN558_*
          if-no-files-found: error
          retention-days: 30
      - name: Enforce source, tests, plan and privacy
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.source.outcome }}" = success
          test "$(cat "$RUNNER_TEMP/RUN558_DEPS_EXIT.txt")" = 0
          test "$(cat "$RUNNER_TEMP/RUN558_TEST_EXIT.txt")" = 0
          test "$(cat "$RUNNER_TEMP/RUN558_PLAN_EXIT.txt")" = 0
          test "$(cat "$RUNNER_TEMP/RUN558_PRIVACY_EXIT.txt")" = 0
