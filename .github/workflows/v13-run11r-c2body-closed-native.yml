name: V13 Run11R seed163 C2-C3-Body native pilot (explicit only)
on:
  workflow_dispatch:
  push:
    branches: [assistant/v13-run11r-native-explicit-trigger-20261030]
    paths:
      - 'v13/code/docs/RUN11R_NATIVE_TRIGGER_20261030.txt'
permissions:
  contents: read
concurrency:
  group: v13-step2-budget-paired-native-20261030
  cancel-in-progress: false
jobs:
  run11r-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Source-pinned isolated 24-turn native pilot and independent raw replay
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run11r-native"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          2152a5d2205f8c3b3c52c987e6b5e36ab7c96c94 v13/code/docs/C2_BODY_OBSERVER_CLOSED_PREREG_RUN11R_20261030.md
          e3c4b93bc1dafe24c23747105cf654aa59de2937 v13/code/scripts/c2_body_observer_closed_run11r.py
          e6931fee2d1e833baf83d39d95ad1888745fb661 v13/code/tests/test_c2_body_observer_closed_run11r.py
          9cef2f2edd8bbd2fae075f03690bd9f31b8c4c1e v13/code/scripts/c2_body_observer_closed_verify_run11r.py
          d44dadd5954d0648e0d21d08bf836079435abe71 v13/code/tests/test_c2_body_observer_closed_verify_run11r.py
          d824690e942489b11c79c3aa68cd0f02e6176f06 v13/code/scripts/c2_c3_body_source_arithmetic_shadow_run11q.py
          fcd44ccce3b8b40d65a25187a78b0a8d49d9609d v13/code/scripts/step2_paired_raw_validator_audit_20261030.py
          f6bb6c26237f9c94a29a9eeac5ecc6c5fa129ad3 v13/code/scripts/step2_expression_diagnostic_20261030.py
          fb34dba97ae3700ba5accdcb928bfb72afcf4fcb v13/code/scripts/c2_native_route_provenance_20261030.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          954a3f468f10195fbce12d27f68585ee7edee2c9 v13/code/specs/control_tools.json
          BLOBS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run11r-native-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run11r-native-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo SKIPPED > "$e/DEPS_RAW.log"; echo SKIPPED > "$e/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_c2_body_observer_closed_run11r tests.test_c2_body_observer_closed_verify_run11r) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED > "$e/TEST_RAW.log"; echo SKIPPED > "$e/TEST_EXIT.txt"; fi
          export V13_HOME="$RUNNER_TEMP/v13-run11r-installed"
          if [ "$(cat "$e/TEST_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 15m env PYTHONPATH=v13/code "$py" -m v13.bootstrap --home "$V13_HOME" > "$e/BOOTSTRAP_RAW.log" 2>&1
            echo "$?" > "$e/BOOTSTRAP_EXIT.txt"
          else echo SKIPPED > "$e/BOOTSTRAP_RAW.log"; echo SKIPPED > "$e/BOOTSTRAP_EXIT.txt"; fi
          if [ "$(cat "$e/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 38m env PYTHONPATH=v13/code "$py" v13/code/scripts/c2_body_observer_closed_run11r.py --home "$V13_HOME" --out "$e/pilot" > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else echo SKIPPED > "$e/NATIVE_RAW.log"; echo SKIPPED > "$e/NATIVE_EXIT.txt"; fi
          if [ -f "$e/pilot/report.json" ]; then
            timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=v13/code "$py" v13/code/scripts/c2_body_observer_closed_verify_run11r.py --pilot "$e/pilot" > "$e/REPORT_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          else echo NO_REPORT > "$e/REPORT_CHECK_RAW.log"; echo SKIPPED > "$e/REPORT_CHECK_EXIT.txt"; fi
          "$py" -m py_compile v13/code/scripts/c2_body_observer_closed_run11r.py v13/code/tests/test_c2_body_observer_closed_run11r.py v13/code/scripts/c2_body_observer_closed_verify_run11r.py v13/code/tests/test_c2_body_observer_closed_verify_run11r.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 5b6c515a058725fe3db88c0daf07505187ac5c72 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 5b6c515a058725fe3db88c0daf07505187ac5c72 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve all original raw even on native RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run11r-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run11r-native/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce all stages and negative gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run11r-native"
          for stage in PINS VENV DEPS TEST BOOTSTRAP NATIVE REPORT_CHECK COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw preserved; no native or STEP2 gate promotion"
              tail -80 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'RUN11R_NATIVE_PILOT_ONLY_NO_STEP2_B3_JEPA_REDMI_OR_WHOLE_SYSTEM_GATE'
