name: V13 Run595 Context OS exact feedback selector
on:
  push:
    branches:
      - codex/automation11-run595-ctx-feedback-plan-selector-20261026
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/run595-ctx-feedback-plan-selector.yml'
      - 'v13/code/v13/context_os.py'
      - 'v13/code/tests/test_run595_ctx_feedback_plan_selector.py'
permissions:
  contents: read
jobs:
  context-feedback:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.ref == 'codex/automation11-run595-ctx-feedback-plan-selector-20261026' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install isolated model-free dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'prompt_toolkit==3.0.52'
      - name: Execute exact-head Context OS feedback tests
        shell: bash
        run: |
          mkdir -p run595-raw
          git rev-parse HEAD > run595-raw/source_head.txt
          sha256sum v13/code/v13/context_os.py v13/code/tests/test_run595_ctx_feedback_plan_selector.py v13/code/docs/proofs/continuation-20261026/run595-ctx-feedback-plan-selector/PREREG.md > run595-raw/source_sha256.txt
          set +e
          (cd v13/code && python -m unittest discover -s tests -p test_run595_ctx_feedback_plan_selector.py -v) > run595-raw/new-tests.log 2>&1
          echo "$?" > run595-raw/new-tests.exit
          (cd v13/code && python -m unittest discover -s tests -p test_run590_ctx_plan_receipts.py -v && python -m unittest discover -s tests -p test_context_os.py -v && python -m unittest discover -s tests -p test_context_append_provenance_run74.py -v && python -m unittest discover -s tests -p test_context_warm_authority_run271.py -v && python -m unittest discover -s tests -p test_context_unbalanced_literals_run350.py -v) > run595-raw/regressions.log 2>&1
          echo "$?" > run595-raw/regressions.exit
          python -m compileall -q v13/code/v13/context_os.py v13/code/tests/test_run595_ctx_feedback_plan_selector.py > run595-raw/compile.log 2>&1
          echo "$?" > run595-raw/compile.exit
          python v13/code/scripts/public_repo_privacy_scan.py --base "34d0f6474238f25ea155d3c212b9acf7be37cf5b" --head "${{ github.event.pull_request.head.sha || github.sha }}" --no-worktree > run595-raw/privacy.log 2>&1
          echo "$?" > run595-raw/privacy.exit
          set -e
          cat run595-raw/new-tests.log run595-raw/regressions.log run595-raw/privacy.log
      - name: Close raw hashes
        if: always()
        shell: bash
        run: |
          mkdir -p run595-raw
          (cd run595-raw && sha256sum *.txt *.log *.exit > RAW_SHA256SUMS.txt)
          cat run595-raw/RAW_SHA256SUMS.txt
      - name: Preserve raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run595-ctx-feedback-raw
          path: run595-raw/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce focused checks
        run: |
          test "$(cat run595-raw/new-tests.exit)" = 0
          test "$(cat run595-raw/regressions.exit)" = 0
          test "$(cat run595-raw/compile.exit)" = 0
          test "$(cat run595-raw/privacy.exit)" = 0
