name: V14 Core staged A5 voice and arithmetic integration

on:
  pull_request:
    branches: [research-perception/v14-raw-ear-runtime-temporal-state-20261121]
    paths:
      - "v13/code/scripts/integrated_audio_context_candidate_20261121.py"
      - "v13/code/scripts/termux_runtime_recovery_candidate_20261121.py"
      - "v13/code/scripts/stage_integrated_candidate.py"
      - "v13/code/v13/runtime_deploy.py"
      - "v13/code/v13/audio_voice_cues.py"
      - "v13/code/v13/audio_temporal_evidence.py"
      - "v13/code/v13/arithmetic_reflex.py"
      - "v13/code/scripts/integrated_arithmetic_candidate_20261116.py"
      - "v13/code/scripts/termux_runtime_recovery_candidate_20261112.py"
      - "v13/code/tests/test_c3_audio_runtime_consumer.py"
      - "v13/code/tests/test_v14_audio_context_stage_20261121.py"
      - "v13/code/tests/test_arithmetic_reflex.py"
      - "v13/code/tests/arithmetic_disposable_cases_20261116.py"
      - "v13/code/tests/test_termux_runtime_recovery_stage.py"
      - "v13/code/tests/test_runtime_deploy_integrated_20261116.py"
      - "v13/code/tests/test_v14_arithmetic_policy_separation.py"
      - ".github/workflows/v14-core-a5-voice-runtime.yml"
  push:
    branches: [core/v14-a5-voice-current-20261121]
    paths:
      - "v13/code/scripts/integrated_audio_context_candidate_20261121.py"
      - "v13/code/scripts/termux_runtime_recovery_candidate_20261121.py"
      - "v13/code/scripts/stage_integrated_candidate.py"
      - "v13/code/v13/runtime_deploy.py"
      - "v13/code/v13/audio_voice_cues.py"
      - "v13/code/v13/audio_temporal_evidence.py"
      - "v13/code/v13/arithmetic_reflex.py"
      - "v13/code/scripts/integrated_arithmetic_candidate_20261116.py"
      - "v13/code/scripts/termux_runtime_recovery_candidate_20261112.py"
      - "v13/code/tests/**"
      - ".github/workflows/v14-core-a5-voice-runtime.yml"
  workflow_dispatch:

jobs:
  staged-a5-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 psutil PyYAML pytest==9.2.0
      - name: Verify exact builder and deployer pin chain
        run: |
          test "$(sha256sum v13/code/scripts/integrated_audio_context_candidate_20261121.py | cut -d' ' -f1)" = "1a3ccb0160706c1c5fc39f67cb91ed2f8083a481519b558f16ead8109304f238"
          test "$(sha256sum v13/code/scripts/termux_runtime_recovery_candidate_20261121.py | cut -d' ' -f1)" = "d495452982268e96d66ba6fdf491759f0bbbdcd828a33ace7b87e5ca728bd6d5"
          test "$(sha256sum v13/code/scripts/stage_integrated_candidate.py | cut -d' ' -f1)" = "8d68f2bbae90f28675c35bec22b04834bbd2732aad40e2ea1e2217596cc06cba"
          test "$(sha256sum v13/code/scripts/termux_runtime_recovery_candidate_20261112.py | cut -d' ' -f1)" = "ff0920afd2311827678ff9cfa115c63cd4ff06cda3a9cddf5f298fd4719ad9d5"
          test "$(sha256sum v13/code/scripts/integrated_arithmetic_candidate_20261116.py | cut -d' ' -f1)" = "728a229ea8316aa97fdd8cf83fa7d5358bc1c187cfcc556b62005e9e0e872128"
          test "$(sha256sum v13/code/v13/arithmetic_reflex.py | cut -d' ' -f1)" = "3874df3a75137239336e42af304437531562c96eff8323b0d8cd6dd43c3cc653"
          grep -F 'STAGER_SHA256 = "8d68f2bbae90f28675c35bec22b04834bbd2732aad40e2ea1e2217596cc06cba"' v13/code/v13/runtime_deploy.py
      - name: Compile composed builders and Runtime consumers
        run: |
          python -m py_compile \
            v13/code/scripts/integrated_audio_context_candidate_20261121.py \
            v13/code/scripts/termux_runtime_recovery_candidate_20261121.py \
            v13/code/scripts/stage_integrated_candidate.py \
            v13/code/v13/runtime_deploy.py \
            v13/code/v13/audio_voice_cues.py \
            v13/code/v13/audio_temporal_evidence.py \
            v13/code/v13/arithmetic_reflex.py \
            v13/code/scripts/integrated_arithmetic_candidate_20261116.py \
            v13/code/scripts/termux_runtime_recovery_candidate_20261112.py \
            v13/code/tests/test_c3_audio_runtime_consumer.py \
            v13/code/tests/test_v14_audio_context_stage_20261121.py \
            v13/code/tests/test_termux_runtime_recovery_stage.py
      - name: Read back exact staged builder SHA256 chain
        run: |
          set -euo pipefail
          sha256sum v13/code/scripts/integrated_audio_context_candidate_20261121.py
          sha256sum v13/code/scripts/termux_runtime_recovery_candidate_20261121.py
          sha256sum v13/code/scripts/stage_integrated_candidate.py
          sha256sum v13/code/v13/runtime_deploy.py
      - name: Staged voice, B1/B2/C3, arithmetic and consent regressions
        env:
          PYTHONPATH: v13/code
        run: |
          python -m pytest -q \
            v13/code/tests/test_v14_audio_context_stage_20261121.py \
            v13/code/tests/test_v14_arithmetic_policy_separation.py \
            v13/code/tests/test_arithmetic_stage_20261116.py
      - name: Recovery and installed-deployer simulation
        env:
          PYTHONPATH: v13/code
        run: |
          python -m pytest -q \
            v13/code/tests/test_termux_runtime_recovery_stage.py \
            v13/code/tests/test_runtime_deploy_integrated_20261116.py \
            v13/code/tests/test_integrated_stage_real_smoke.py
      - name: Adjacent cognition and source-provenance regressions
        env:
          PYTHONPATH: v13/code
        run: |
          python -m pytest -q \
            v13/code/tests/test_broker.py \
            v13/code/tests/test_output_policy.py \
            v13/code/tests/test_context_os.py \
            v13/code/tests/test_enlightened_space.py \
            v13/code/tests/test_offer_deadlines.py \
