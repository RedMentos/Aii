name: V14 Core staged A5 voice and arithmetic integration

on:
  pull_request:
    branches: [gpt6/v13-private-remote-bridge-20261111]
    paths:
      - "v13/code/scripts/integrated_audio_context_candidate_20261121.py"
      - "v13/code/scripts/termux_runtime_recovery_candidate_20261121.py"
      - "v13/code/scripts/stage_integrated_candidate.py"
      - "v13/code/v13/runtime_deploy.py"
      - "v13/code/v13/audio_voice_cues.py"
      - "v13/code/tests/test_c3_audio_runtime_consumer.py"
      - "v13/code/tests/test_v14_audio_context_stage_20261121.py"
      - "v13/code/tests/test_arithmetic_reflex.py"
      - "v13/code/tests/arithmetic_disposable_cases_20261116.py"
      - "v13/code/tests/test_termux_runtime_recovery_stage.py"
      - "v13/code/tests/test_runtime_deploy_integrated_20261116.py"
      - "v13/code/tests/test_v14_arithmetic_policy_separation.py"
      - ".github/workflows/v14-core-a5-voice-runtime.yml"
  push:
    branches: [gpt6/v14-core-a5-voice-runtime-20261121]
    paths:
      - "v13/code/scripts/integrated_audio_context_candidate_20261121.py"
      - "v13/code/scripts/termux_runtime_recovery_candidate_20261121.py"
      - "v13/code/scripts/stage_integrated_candidate.py"
      - "v13/code/v13/runtime_deploy.py"
      - "v13/code/v13/audio_voice_cues.py"
      - "v13/code/tests/**"
      - ".github/workflows/v14-core-a5-voice-runtime.yml"
  workflow_dispatch:

jobs:
  staged-a5-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 psutil PyYAML pytest==9.2.0
      - name: Verify exact builder and deployer pin chain
        run: |
          test "$(sha256sum v13/code/scripts/integrated_audio_context_candidate_20261121.py | cut -d' ' -f1)" = "01de81a1c41300f0ce78e24aee528971a22047880c6659b742b85b2be2bc6039"
          test "$(sha256sum v13/code/scripts/termux_runtime_recovery_candidate_20261121.py | cut -d' ' -f1)" = "5d24951dabe314237bd3237000f9ea7a970c5c66a1d417204ad82f15df45ac6c"
          test "$(sha256sum v13/code/scripts/stage_integrated_candidate.py | cut -d' ' -f1)" = "870cf3e0d7acc2ff58553b9e1ab1a46821a40e90a029c1451a97b7d6d5a94eda"
          grep -F 'STAGER_SHA256 = "870cf3e0d7acc2ff58553b9e1ab1a46821a40e90a029c1451a97b7d6d5a94eda"' v13/code/v13/runtime_deploy.py
      - name: Compile composed builders and Runtime consumers
        run: |
          python -m py_compile \
            v13/code/scripts/integrated_audio_context_candidate_20261121.py \
            v13/code/scripts/termux_runtime_recovery_candidate_20261121.py \
            v13/code/scripts/stage_integrated_candidate.py \
            v13/code/v13/runtime_deploy.py \
            v13/code/v13/audio_voice_cues.py \
            v13/code/tests/test_c3_audio_runtime_consumer.py \
            v13/code/tests/test_v14_audio_context_stage_20261121.py \
            v13/code/tests/test_termux_runtime_recovery_stage.py
      - name: Read back exact staged builder SHA256 chain
        run: |
          set -euo pipefail
          sha256sum v13/code/scripts/integrated_audio_context_candidate_20261121.py
          sha256sum v13/code/scripts/termux_runtime_recovery_candidate_20261121.py
          sha256sum v13/code/scripts/stage_integrated_candidate.py
          sha256sum v13/code/v13/runtime_deploy.py
      - name: Staged voice, B1/B2/C3, arithmetic and consent regressions
        env:
          PYTHONPATH: v13/code
        run: |
          python -m pytest -q \
            v13/code/tests/test_v14_audio_context_stage_20261121.py \
            v13/code/tests/test_v14_arithmetic_policy_separation.py \
            v13/code/tests/test_arithmetic_stage_20261116.py
      - name: Recovery and installed-deployer simulation
        env:
          PYTHONPATH: v13/code
        run: |
          python -m pytest -q \
            v13/code/tests/test_termux_runtime_recovery_stage.py \
            v13/code/tests/test_runtime_deploy_integrated_20261116.py \
            v13/code/tests/test_integrated_stage_real_smoke.py
      - name: Adjacent cognition and source-provenance regressions
        env:
          PYTHONPATH: v13/code
        run: |
          python -m pytest -q \
            v13/code/tests/test_broker.py \
            v13/code/tests/test_output_policy.py \
            v13/code/tests/test_context_os.py \
            v13/code/tests/test_enlightened_space.py \
            v13/code/tests/test_offer_deadlines.py \
