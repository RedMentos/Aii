name: V13 HB0b source-allowlisted arm export SOFTWARE-only
on:
  push:
    branches: [codex/v13-hb0-arm-blind-export-20261029]
permissions:
  contents: read
concurrency:
  group: v13-hb0b-arm-export-${{ github.ref }}
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Pinned-source arm export, full regression and privacy
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-hb0b"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          source_red=0
          check() {
            got="$(git hash-object "$2" 2>/dev/null)" || return 1
            printf '%s %s\n' "$got" "$2" >> "$e/SOURCE_RAW.log"
            [ "$got" = "$1" ]
          }
          check 486030c7031b5cfa343c935fe39a0f3d74049c65 v13/code/docs/proofs/continuation-20261029/HB0_SPLIT_INFORMATION_COHORT_PREREG.md || source_red=1
          check 329153aaa73df009fdc433523994e372e0fd2c95 v13/code/scripts/hb0_split_information_cohort.py || source_red=1
          check c67fe0ee9d693413c1bb430b6f391d8a478f8960 v13/code/tests/test_hb0_split_information_cohort.py || source_red=1
          check 5a401012bae1835cfeaffd317a65ea3376aef284 v13/code/docs/proofs/continuation-20261029/HB0_ARM_BLIND_EXPORT_PREREG.md || source_red=1
          check 8d6f5b9f0830540d2de72cc624778ff03e7b90ec v13/code/scripts/hb0_arm_export.py || source_red=1
          check f0fd31f7e88ffcbce88babc203cf7dd763007955 v13/code/tests/test_hb0_arm_export.py || source_red=1
          check 8c79ab6d38eeebce832faa139c4a819f6d379d96 v13/code/scripts/context_option_safe_scope_candidate.py || source_red=1
          check e1f1a2d09a614378a75e397819fdce96a46de22d v13/code/v13/agi/eligibility.py || source_red=1
          echo "$source_red" > "$e/SOURCE_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/hb0_split_information_cohort.py v13/code/scripts/hb0_arm_export.py v13/code/tests/test_hb0_split_information_cohort.py v13/code/tests/test_hb0_arm_export.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$source_red" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 180s python3 -m unittest -v tests.test_hb0_split_information_cohort tests.test_hb0_arm_export) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
            # SELF-PINNED SOFTWARE SMOKE ONLY. The next real model cohort
            # requires an externally registered SHA, not this generated value.
            (cd v13/code && python3 -c 'from scripts import hb0_split_information_cohort as h; print(h._sha(h.fixtures()))') > "$e/FIXTURE_SHA256.txt" 2>&1
            (cd v13/code && python3 -m scripts.hb0_arm_export --fixture-sha256 "$(cat "$e/FIXTURE_SHA256.txt")" --out-dir "$e/bundle") > "$e/EXPORT_RAW.log" 2>&1
            echo "$?" > "$e/EXPORT_EXIT.txt"
          else
            for n in FOCUSED EXPORT; do echo SKIPPED_SOURCE_RED > "$e/${n}_RAW.log"; echo SKIPPED_RED > "$e/${n}_EXIT.txt"; done
          fi
          python3 -m venv "$RUNNER_TEMP/v13-hb0b-venv"
          py="$RUNNER_TEMP/v13-hb0b-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          install_ok="$?"
          if [ "$install_ok" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
            install_ok="$?"
          fi
          if [ "$install_ok" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
            install_ok="$?"
          fi
          echo "$install_ok" > "$e/INSTALL_EXIT.txt"
          if [ "$install_ok" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=10s 18m "$py" -m unittest discover -s tests -p 'test_*.py') > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else
            echo SKIPPED_DEPENDENCY_RED > "$e/FULL_RAW.log"
            echo SKIPPED_RED > "$e/FULL_EXIT.txt"
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 21f7337dd681edba06637c0b9b93fd81b218750d --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 21f7337dd681edba06637c0b9b93fd81b218750d HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - name: Preserve complete evidence including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-hb0b-arm-export-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-hb0b/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce exact-head software smoke acceptance
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-hb0b"
          for n in SOURCE COMPILE FOCUSED EXPORT INSTALL FULL PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; all raw preserved; no gate promotion"
              tail -40 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo HB0B_ARM_EXPORT_SOFTWARE_SMOKE_NO_NATIVE_NO_GATE
