name: V13 Run117BU disjoint seed1103 paired native harness software
on:
  push:
    branches:
      - assistant/v13-run117bu-disjoint-budget-native-runner-20261101-hourly11
    paths:
      - .github/workflows/v13-run117bu-disjoint-budget-preflight.yml
      - v13/code/scripts/run117bu_disjoint_budget_native.py
      - v13/code/tests/test_run117bu_disjoint_budget_native.py
permissions:
  contents: read
jobs:
  disjoint-native-harness-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run paired harness synthetic tests with closed raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run117bu"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          437303f4f256a06439a65638a87cafc3aa062aeb v13/code/scripts/run117bu_disjoint_budget_native.py
          01441a60285ec70863a159559821a282527876cd v13/code/tests/test_run117bu_disjoint_budget_native.py
          4c5fc5b1d439c8e143d69371a1bcdd3f0ccaa935 v13/code/docs/fixtures/RUN117BS_C3_DISJOINT_BUDGET_SEED1103.json
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          echo 'f8ca7a22c47f991d630c9df1b1b2ee2943d24123246c8ffaf45db65998403f65  v13/code/docs/fixtures/RUN117BS_C3_DISJOINT_BUDGET_SEED1103.json' | sha256sum -c - > "$e/FIXTURE_RAW.log" 2>&1
          echo "$?" > "$e/FIXTURE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run117bu-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run117bu-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' 'prompt-toolkit==3.0.52' 'psutil==7.0.0' 'PyYAML==6.0.2' 'Pillow==11.3.0' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
          else
            for stage in DEPS PIP_CHECK; do echo SKIPPED > "$e/${stage}_RAW.log"; echo SKIPPED > "$e/${stage}_EXIT.txt"; done
          fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout 180s "$py" -m unittest -v tests.test_run117bu_disjoint_budget_native tests.test_run117bs_disjoint_budget_fixture tests.test_run117bo_jef_c3_budget_formatter_shadow) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED > "$e/TEST_RAW.log"; echo SKIPPED > "$e/TEST_EXIT.txt"; fi
          python3 -m py_compile v13/code/scripts/run117bu_disjoint_budget_native.py v13/code/tests/test_run117bu_disjoint_budget_native.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 314cf1c3082cd493ef38271fed585db9f9b24202 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 314cf1c3082cd493ef38271fed585db9f9b24202 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original software raw GREEN or RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117bu-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117bu/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce software-only preflight
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117bu"
          for stage in PINS FIXTURE VENV DEPS PIP_CHECK TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw preserved"
              tail -50 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
          echo 'RUN117BU_SOFTWARE_ONLY_NO_NATIVE_OR_GATE_PROMOTION'
