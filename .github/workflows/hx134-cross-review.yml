name: V13 HX134 Claude cross-review RED GREEN
on:
  push:
    branches: [assistant/v13-hx134-c1-world-b3-integration-20261027]
    paths:
      - '.github/workflows/hx134-cross-review.yml'
      - 'v13/code/tests/test_harness_hx.py'
      - 'v13/code/v13/agi/harness.py'
      - 'v13/code/v13/agi/experience.py'
      - 'v13/code/v13/agi/blind_select.py'
      - 'v13/code/v13/agi/__init__.py'
      - 'v13/code/v13/agi/self_improve.py'
permissions:
  contents: read
concurrency:
  group: v13-hx134-cross-review
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve exact HX focused raw exits
        run: |
          set +e
          evidence="$RUNNER_TEMP/hx134-cross"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/HEAD.txt"
          git hash-object v13/code/tests/test_harness_hx.py > "$evidence/TEST_BLOB.txt"
          git hash-object v13/code/v13/agi/self_improve.py > "$evidence/AG8_BLOB.txt"
          git merge-base --is-ancestor ed0eb935135cf2824a236cb63f5752e5d27687a4 HEAD
          echo "$?" > "$evidence/PREREG_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/hx134-venv"
          py="$RUNNER_TEMP/hx134-venv/bin/python"
          "$py" -m pip install --no-input -q 'numpy==2.2.6' 'psutil' 'PyYAML' 'Pillow' > "$evidence/INSTALL_RAW.log" 2>&1
          echo "$?" > "$evidence/INSTALL_EXIT.txt"
          (
            cd v13/code
            timeout --signal=TERM --kill-after=10s 7m env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_harness_hx tests.test_agi_live
          ) > "$evidence/UNIT_RAW.log" 2>&1
          echo "$?" > "$evidence/UNIT_EXIT.txt"
          python3 -m compileall -q v13/code/v13/agi > "$evidence/COMPILE_RAW.log" 2>&1
          echo "$?" > "$evidence/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 1ab88aa30947e2f3da9905b1d3055f04b98a8bed --head HEAD > "$evidence/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$evidence/PRIVACY_EXIT.txt"
          git diff --check 1ab88aa30947e2f3da9905b1d3055f04b98a8bed HEAD > "$evidence/DIFF_RAW.log" 2>&1
          echo "$?" > "$evidence/DIFF_EXIT.txt"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-hx134-cross-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/hx134-cross/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce raw exits
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/hx134-cross"
          for name in PREREG INSTALL UNIT COMPILE PRIVACY DIFF; do
            if [ "$(cat "$evidence/${name}_EXIT.txt")" != 0 ]; then
              echo "$name failed; raw evidence retained"
              tail -100 "$evidence/${name}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'HX134_SHADOW_SOFTWARE_ONLY_NO_PROMOTION'
