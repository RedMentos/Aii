name: V13 STEP3 semantic cache full software suite
on:
  push:
    branches: [codex/automation11k-semantic-cache-integrity-20261027]
    paths:
      - '.github/workflows/semantic-cache-fullsuite.yml'
      - 'v13/code/v13/semantic_memory.py'
      - 'v13/code/tests/test_semantic_memory.py'
permissions:
  contents: read
concurrency:
  group: v13-semantic-cache-full-${{ github.ref }}
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Isolated dependencies and full software suite with closed raw exits
        run: |
          set +e
          evidence="$RUNNER_TEMP/v13-semantic-cache-full"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/HEAD.txt"
          git hash-object v13/code/v13/semantic_memory.py > "$evidence/SEMANTIC_BLOB.txt"
          python3 -m venv "$RUNNER_TEMP/scheduler-venv"
          py="$RUNNER_TEMP/scheduler-venv/bin/python"
          "$py" -m pip install --no-input -q 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu > "$evidence/INSTALL_RAW.log" 2>&1
          torch_exit=$?
          "$py" -m pip install --no-input -q 'numpy==2.2.6' 'psutil' 'PyYAML' 'Pillow' 'transformers==5.20.2' 'peft==0.21.2' >> "$evidence/INSTALL_RAW.log" 2>&1
          deps_exit=$?
          if [ "$torch_exit" -eq 0 ] && [ "$deps_exit" -eq 0 ]; then echo 0; else echo 1; fi > "$evidence/INSTALL_EXIT.txt"
          (
            cd v13/code
            timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=. "$py" -m unittest discover -s tests -p 'test_*.py' -q
          ) > "$evidence/UNIT_RAW.log" 2>&1
          echo "$?" > "$evidence/UNIT_EXIT.txt"
          python3 -m compileall -q v13/code/v13 v13/code/tests/test_semantic_memory.py > "$evidence/COMPILE_RAW.log" 2>&1
          echo "$?" > "$evidence/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 130083fa8fcd7b5ee0cd81635d654da0e4927cfe --head HEAD > "$evidence/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$evidence/PRIVACY_EXIT.txt"
          git diff --check 130083fa8fcd7b5ee0cd81635d654da0e4927cfe HEAD > "$evidence/DIFF_RAW.log" 2>&1
          echo "$?" > "$evidence/DIFF_EXIT.txt"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-semantic-cache-full-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-semantic-cache-full/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce all exits; no model or Age promotion
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/v13-semantic-cache-full"
          for name in INSTALL UNIT COMPILE PRIVACY DIFF; do
            if [ "$(cat "$evidence/${name}_EXIT.txt")" != 0 ]; then
              echo "$name failed; raw evidence retained"
              tail -80 "$evidence/${name}_RAW.log"
              exit 1
            fi
          done
          echo 'SEMANTIC_CACHE_FULLSUITE_SOFTWARE_ONLY_NO_AGE_PROMOTION'
