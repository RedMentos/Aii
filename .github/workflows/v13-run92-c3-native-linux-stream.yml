name: V13 Run92 pinned C3 350M native Linux causal stream
on:
  push:
    branches: [assistant/v13-run92-c3-native-stream-linux-20261029]
permissions:
  contents: read
concurrency:
  group: v13-run92-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native_linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Capture source-bound pinned C3 native Linux attempt and original raw evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run92"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          for p in v13/code/docs/proofs/continuation-20261028/RUN92_C3_NATIVE_STREAM_LINUX_PREREG.md v13/code/specs/models.json v13/code/v13/bootstrap.py v13/code/v13/models.py v13/code/v13/runners.py v13/code/scripts/test_native_prefill_stream.py v13/code/scripts/native_prefill_stream.cpp v13/code/scripts/native_prefill_stream_client.py v13/code/scripts/native_prefill_worker.cpp v13/code/scripts/test_native_prefill_port.py v13/code/scripts/test_native_prefill_stream_protocol.py v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md; do git hash-object "$p" | xargs -I{} echo "{} $p"; done > "$e/SOURCE_RAW.log"
          if [ "$(git hash-object v13/code/docs/proofs/continuation-20261028/RUN92_C3_NATIVE_STREAM_LINUX_PREREG.md)" = 96f3cad745215b172acedef4fc92e28c2dbd654d ] && [ "$(git hash-object v13/code/specs/models.json)" = 7af05962af41d0bc3f7dd18ef01d4eba55eabf99 ] && [ "$(git hash-object v13/code/v13/bootstrap.py)" = dc23e192bcd01589475692666ebb6568c80d078b ] && [ "$(git hash-object v13/code/v13/models.py)" = bd035cf8029850cce00b179edf533e53bf24358a ] && [ "$(git hash-object v13/code/v13/runners.py)" = efda7aa1aa5729e974d0d641870d4da05d21c961 ] && [ "$(git hash-object v13/code/scripts/test_native_prefill_stream.py)" = ef5f4097c6cf40bae38b083312c7e621f6a3ebb6 ] && [ "$(git hash-object v13/code/scripts/native_prefill_stream.cpp)" = 97b4d12648961b80a4e43b8e84e50b9d6369eefb ] && [ "$(git hash-object v13/code/scripts/native_prefill_stream_client.py)" = ded6a16ee428d7857f7a525d0688b25061e66d25 ] && [ "$(git hash-object v13/code/scripts/native_prefill_worker.cpp)" = cdf7450e9d8032218afbc73062836d4d81edf605 ] && [ "$(git hash-object v13/code/scripts/test_native_prefill_port.py)" = 64fb49deb7ab53d05ce4c4afbe9f7d0e71068cfe ] && [ "$(git hash-object v13/code/scripts/test_native_prefill_stream_protocol.py)" = 28258346937142968146a42e558c4d7da6959e54 ] && [ "$(git hash-object v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md)" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7 ]; then echo 0 > "$e/SOURCE_EXIT.txt"; else echo 1 > "$e/SOURCE_EXIT.txt"; fi
          python3 -m venv "$RUNNER_TEMP/v13-run92-venv"
          py="$RUNNER_TEMP/v13-run92-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/BASE_INSTALL_RAW.log" 2>&1
          echo "$?" > "$e/BASE_INSTALL_EXIT.txt"
          export V13_HOME="$RUNNER_TEMP/v13-run92-home"
          mkdir -p "$V13_HOME"
          if [ "$(cat "$e/BASE_INSTALL_EXIT.txt")" = 0 ] && [ "$(cat "$e/SOURCE_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=15s 22m "$py" - <<'PY'
          import json,os
          from pathlib import Path
          from v13.config import initialize
          from v13.models import ModelManager,catalog
          from v13.bootstrap import install_native
          from v13.common import file_hash
          home=Path(os.environ["V13_HOME"])
          initialize(home)
          m=ModelManager(home)
          m.install("language")
          m.install("needle")
          install_native(home)
          rep=m.verify(deep=True)
          assert rep["language"]["ok"] and rep["language"]["hash_checked"]
          assert rep["needle"]["ok"] and rep["needle"]["hash_checked"]
          assert m.revision("C3_LANGUAGE")==catalog()["models"]["language"]["revision"]
          assert file_hash(m.path_for("C3_LANGUAGE"))==catalog()["models"]["language"]["files"][0]["sha256"]
          print(json.dumps({"status":"PINNED_C3_AND_NEEDLE_INSTALLED_HASH_VERIFIED","language_revision":m.revision("C3_LANGUAGE"),"language_sha256":file_hash(m.path_for("C3_LANGUAGE")),"model_bytes_uploaded":False,"runner_tag":catalog()["runner"]["tag"],"deep_verified":rep},sort_keys=True))
          PY
            ) > "$e/INSTALL_RAW.log" 2>&1
            echo "$?" > "$e/INSTALL_EXIT.txt"
          else
            echo SKIPPED_PREREQ_RED > "$e/INSTALL_RAW.log"; echo SKIPPED_RED > "$e/INSTALL_EXIT.txt"
          fi
          if [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=15s 16m "$py" scripts/test_native_prefill_stream.py --installed-home "$V13_HOME" --out-dir "$e/native" --baseline-zero --prompt 'Hallo! Was kann ich als Erstes fragen?' --max-tokens 64 --seconds 90 --rss-limit-mb 768) > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else
            echo SKIPPED_INSTALL_RED > "$e/NATIVE_RAW.log"; echo SKIPPED_RED > "$e/NATIVE_EXIT.txt"
          fi
          if [ "$(cat "$e/BASE_INSTALL_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 120s "$py" scripts/test_native_prefill_stream_protocol.py --output "$e/PROTOCOL.json") > "$e/PROTOCOL_RAW.log" 2>&1
            echo "$?" > "$e/PROTOCOL_EXIT.txt"
          else
            echo SKIPPED_PREREQ_RED > "$e/PROTOCOL_RAW.log"; echo SKIPPED_RED > "$e/PROTOCOL_EXIT.txt"
          fi
          python3 -m compileall -q v13/code/scripts/test_native_prefill_stream.py v13/code/scripts/native_prefill_stream_client.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 3545dab0faa3d548df58557ed8376a6162c51d9a --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 3545dab0faa3d548df58557ed8376a6162c51d9a HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - name: Preserve Run92 original raw evidence only, no model bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run92-c3-native-linux-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run92/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce exact source, native, protocol and privacy gates
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run92"
          for n in SOURCE BASE_INSTALL INSTALL NATIVE PROTOCOL COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; raw retained; no Redmi/native quality/JEPA/STEP2 promotion"
              tail -50 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN92_C3_350M_REAL_NATIVE_LINUX_STREAM_ONLY
