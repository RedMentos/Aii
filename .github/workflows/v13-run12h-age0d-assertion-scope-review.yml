name: V13 Run12H independent Age0d assertion-scope review
on:
  push:
    branches: [assistant/v13-run12h-age0d-assertion-scope-review-20261030]
    paths:
      - '.github/workflows/v13-run12h-age0d-assertion-scope-review.yml'
permissions:
  contents: read
jobs:
  assertion-scope-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve independent original-vs-fix evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run12h-age0d"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          74383c570df068de7d647184d8c6e85ae3e1e125 v13/code/v13/age0d_answer_arithmetic_shadow_run12f.py
          30b2817e9ac0ca2f5c3303c8be552cf5b79f862c v13/code/tests/test_age0d_assertion_scope_review_run12h.py
          444e8e39715b3c2bbe8c9e75ebc7ae240f1d0a22 v13/code/tests/test_age0d_answer_arithmetic_shadow_run12f.py
          072ae59d75c97d972433fedd3830002d2c8530ad v13/code/v13/selfmodel.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests timeout --signal=TERM --kill-after=5s 120s python3 -m unittest -v tests.test_age0d_answer_arithmetic_shadow_run12f tests.test_age0d_assertion_scope_review_run12h) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m py_compile v13/code/v13/age0d_answer_arithmetic_shadow_run12f.py v13/code/tests/test_age0d_assertion_scope_review_run12h.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          git show fabe41540bf6d1230d88d64f817ef794db9723f2:v13/code/v13/age0d_answer_arithmetic_shadow_run12f.py > "$e/ORIGINAL_SOURCE.py" 2> "$e/ORIGINAL_FETCH_RAW.log"
          (cd v13/code && ORIGINAL="$e/ORIGINAL_SOURCE.py" PYTHONPATH=. python3 - <<'PY'
          import importlib.util, os
          from v13 import age0d_answer_arithmetic_shadow_run12f as patched
          spec = importlib.util.spec_from_file_location('run12f_original', os.environ['ORIGINAL'])
          original = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(original)
          s = 'It is not true that 2 + 2 = 5.'
          before = original.inspect('Review the statement', s)
          after = patched.inspect('Review the statement', s)
          print('ORIGINAL', before['status'], before['reason'])
          print('PATCHED', after['status'], after['reason'])
          assert before['status'] == 'POSSIBLE_ARITHMETIC_ERROR_SHADOW'
          assert after['status'] == 'ABSTAIN'
          assert after['authority'] == 'SHADOW_ONLY_NO_DELIVERY'
          PY
          ) > "$e/REVIEW_RAW.log" 2>&1
          echo "$?" > "$e/REVIEW_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base fabe41540bf6d1230d88d64f817ef794db9723f2 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check fabe41540bf6d1230d88d64f817ef794db9723f2 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve raw on RED or GREEN
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run12h-age0d-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run12h-age0d/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce no-promotion source-only review
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run12h-age0d"
          for stage in PINS TEST COMPILE REVIEW PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "${stage} RED; original raw preserved"
              tail -100 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo "RUN12H_ASSERTION_SCOPE_SYNTHETIC_REVIEW_ONLY_NO_DELIVERY"
