name: V13 Run58 B1 B2 C3 F1 F5 C5 C6 DRAFT SHADOW software integration
on:
  push:
    branches: [assistant/v13-run58-crossorgan-c6-shadow-20261031-auto11]
    paths: ['.github/workflows/v13-run58-crossorgan-c6-shadow.yml']
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen pins, real SQLite persisted OfferPacket tests and original RED preservation
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run58-software"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          0779d986fb8aee8aa01c5df5f656889d4bd56348 v13/code/v13/store.py
          1a9eb6f7c7cbfce83d91cc09b4ff9516cff310cf v13/code/v13/cognition.py
          277d34a46b14633c52b5e7d59b3fdf0f16ea4159 v13/code/v13/b1b2_topic_partition_candidate.py
          5dcf4fbcec173773efdcdc4cd719e4e543ef15f5 v13/code/v13/b1b2_causal_offer_consumer_candidate.py
          c887e3db355df8b68d3bd35c6c86d1573ea2d081 v13/code/docs/fixtures/run52_b1b2_cross_turn_seed479.json
          a73ad91409dbf5b6a62b2b935b6491aad7301db8 v13/code/scripts/run52_b1b2_cross_turn_native.py
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          6d5a6394f8cd68192d44c66606d4793486cad925 v13/code/scripts/run54_b1b2_topic_native.py
          b95bf64065673412eaea025548642d407b29955f v13/code/scripts/run54_b1b2_topic_native_verify.py
          3054d2dad09691ba8c2cf31cc7292202e74f09ef v13/code/tests/test_run54_b1b2_topic_native.py
          429d792106063c48933d921dc1a6b7ecd16b5df6 v13/code/scripts/run55_b1b2_topic_native_corrective.py
          b9de84c7cf76f0d629d396b0b45c2b0fb528bdd6 v13/code/scripts/run55_b1b2_topic_native_verify.py
          ee0cdd4cefa5928cfbc752e9d0535661b248228c v13/code/tests/test_run55_b1b2_native_corrective.py
          8aaccb96c3fca43fa4450ab9bdc15f0e787bf093 v13/code/v13/b1b2_c3_source_envelope_candidate.py
          beda0ad44985fc567ea7e1b39db8617493955176 v13/code/tests/test_b1b2_c3_source_envelope_candidate.py
          221798d31436fc88bbf1dce7f22328fd068b2dde v13/code/scripts/run57_b1b2_c3_native_envelope.py
          e25deb605e7fc7cca857f7c2078a202fdd07ad57 v13/code/scripts/run57_b1b2_c3_native_verify.py
          01f970a302590ce78198f678fe24936447682a9d v13/code/tests/test_run57_b1b2_c3_native_envelope.py
          30bb3269fa89621f78db893cf566d04f8768cf27 v13/code/v13/c6_positive_assertion_candidate.py
          0ef8309a4323cda02783c8a8ff8bd378a0512870 v13/code/tests/test_c6_positive_assertion_candidate.py
          b401e0ba26a1031007ad939397947b6d2d01850d v13/code/v13/run58_crossorgan_c6_shadow_candidate.py
          155e91e9f780deb4ef2c91af4822961ec3ab11ae v13/code/tests/test_run58_crossorgan_c6_shadow_candidate.py
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          sha256sum v13/code/docs/fixtures/run52_b1b2_cross_turn_seed479.json > "$e/FIXTURE_RAW.log" 2>&1
          test "$(cut -d' ' -f1 "$e/FIXTURE_RAW.log")" = 5cc8783dedbb201a0a8b86763c99dc23130e1d126a603cf0afcac33d8b985f3b
          echo "$?" > "$e/FIXTURE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run58-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run58-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/FIXTURE_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_run58_crossorgan_c6_shadow_candidate tests.test_c6_positive_assertion_candidate tests.test_run57_b1b2_c3_native_envelope tests.test_b1b2_c3_source_envelope_candidate tests.test_run55_b1b2_native_corrective tests.test_run54_b1b2_topic_native tests.test_c6_temporal_draft_preflight_candidate tests.test_f1f5_temporal_atomic_draft_candidate tests.test_f1f5_temporal_source_gate_candidate tests.test_runtime_c3_atomic_draft_candidate tests.test_b1b2_topic_partition_candidate tests.test_b1b2_causal_offer_consumer_candidate tests.test_b1b2_causal_context_candidate tests.test_f1f5_c5c6_atomic_draft_candidate tests.test_f1f5_event_finalizer_candidate tests.test_run52_lexical_metric_audit tests.test_run52_b1b2_cross_turn tests.test_run51_f1f5_second_attempt tests.test_run50_native_c3_c5_c6_draft tests.test_run49_c5_c6_draft_shadow tests.test_run48_jef_c3_final_agreement_shadow tests.test_run46b_jef_source_eligibility_shadow) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PINS_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/scripts/run55_b1b2_topic_native_corrective.py v13/code/scripts/run55_b1b2_topic_native_verify.py v13/code/tests/test_run55_b1b2_native_corrective.py v13/code/v13/b1b2_c3_source_envelope_candidate.py v13/code/tests/test_b1b2_c3_source_envelope_candidate.py v13/code/scripts/run57_b1b2_c3_native_envelope.py v13/code/scripts/run57_b1b2_c3_native_verify.py v13/code/tests/test_run57_b1b2_c3_native_envelope.py v13/code/v13/c6_positive_assertion_candidate.py v13/code/tests/test_c6_positive_assertion_candidate.py v13/code/v13/run58_crossorgan_c6_shadow_candidate.py v13/code/tests/test_run58_crossorgan_c6_shadow_candidate.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base c38fdff05c66dd038a2a88f292278a8faad9637c --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check c38fdff05c66dd038a2a88f292278a8faad9637c HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run58-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run58-software/
          retention-days: 90
          if-no-files-found: error
      - name: Require eight stages zero
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run58-software"
          for s in PINS FIXTURE VENV DEPS TEST COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN58_CROSSORGAN_C6_DRAFT_SHADOW_NO_TTY_OUTPUT_OR_PROMOTION
