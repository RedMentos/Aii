name: V13 Run117 World selective-risk fresh cohort
on:
  pull_request:
    paths:
      - ".github/workflows/v13-run117-world-selective.yml"
      - "v13/code/scripts/ablation_world_selective_risk_run117.py"
      - "v13/code/tests/test_world_selective_risk_run117.py"
      - "v13/code/docs/proofs/continuation-20261025/world-selective-risk-run117/**"
permissions:
  contents: read
concurrency:
  group: v13-run117-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Isolated model-free dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Preregistered synthetic unit tests
        working-directory: v13/code
        run: |
          set -euo pipefail
          ../../.venv/bin/python -m compileall -q scripts/ablation_world_selective_risk_run117.py tests/test_world_selective_risk_run117.py
          ../../.venv/bin/python -m unittest discover -s tests -p 'test_world_selective_risk_run117.py' -v
  fresh-20-seeds:
    needs: focused
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Isolated numpy
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5'
      - name: Fresh 20-seed preregistered synthetic cohort
        working-directory: v13/code
        run: |
          set -euo pipefail
          timeout 360s ../../.venv/bin/python scripts/ablation_world_selective_risk_run117.py /tmp/world-run117.json
          ../../.venv/bin/python -c "import json; r=json.load(open('/tmp/world-run117.json')); assert len(r['per_seed'])==20; assert all(v['queries_n']==400 and v['valid_n']+v['abstained_n']==400 for v in r['per_seed'].values()); print(json.dumps({'verdict':r['verdict'],'wins':r['wins'],'eligible_seeds':r['eligible_seeds'],'counts':{s:{'valid':v['valid_n'],'abstained':v['abstained_n'],'risk':v['risk']} for s,v in r['per_seed'].items()}},sort_keys=True))"
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Official public repository privacy scan
        run: |
          set -euo pipefail
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
