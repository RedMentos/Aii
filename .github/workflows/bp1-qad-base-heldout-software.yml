name: V13 BP1 pinned QAD Q4 base-only 22-row heldout software review
on:
  push:
    branches: [codex/gpt6-bp1-qad-base-heldout-20261027]
    paths:
      - '.github/workflows/bp1-qad-base-heldout-software.yml'
      - 'v13/code/scripts/bp1_qad_base_heldout.py'
      - 'v13/code/tests/test_bp1_qad_base_heldout.py'
permissions:
  contents: read
concurrency:
  group: v13-bp1-qad-base-heldout-software-${{ github.ref }}
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Source-bound base-only tests, V2/V1 regressions, compile, privacy
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/bp1-base-heldout"
          git rev-parse HEAD > "$RUNNER_TEMP/bp1-base-heldout/HEAD.txt"
          sha256sum v13/code/scripts/bp1_qad_base_heldout.py v13/code/tests/test_bp1_qad_base_heldout.py > "$RUNNER_TEMP/bp1-base-heldout/SOURCE_SHA256.txt"
          (cd v13/code && PYTHONPATH="$PWD:$PWD/scripts" python3 -m unittest -v tests.test_bp1_qad_base_heldout tests.test_bp1_qad_lora_eval tests.test_bp1_paired_score tests.test_bp1_native_collect) > "$RUNNER_TEMP/bp1-base-heldout/UNIT_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp1-base-heldout/UNIT_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/bp1_qad_base_heldout.py v13/code/tests/test_bp1_qad_base_heldout.py > "$RUNNER_TEMP/bp1-base-heldout/COMPILE_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp1-base-heldout/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base f6d6812a493cc7d2235e97bf16e0324242d1ecd6 --head HEAD > "$RUNNER_TEMP/bp1-base-heldout/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp1-base-heldout/PRIVACY_EXIT.txt"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bp1-qad-base-heldout-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/bp1-base-heldout/
          if-no-files-found: error
      - name: Enforce software exits
        run: |
          set -euo pipefail
          for n in UNIT COMPILE PRIVACY; do
            test "$(cat "$RUNNER_TEMP/bp1-base-heldout/${n}_EXIT.txt")" = 0 || {
              echo "${n} failed"; tail -100 "$RUNNER_TEMP/bp1-base-heldout/${n}_RAW.log"; exit 1;
            }
          done
          echo "QAD_BASE_ONLY_SOFTWARE; NO_NATIVE_MODEL_OR_HELDOUT_EXECUTION"
