name: V14 vision source-lineage and forget regressions

on:
  push:
    branches:
      - "research-perception/**"
    paths:
      - "v13/code/v13/vision.py"
      - "v13/code/v13/vision_source_lineage.py"
      - "v13/code/v13/vision_projector_stats.py"
      - "v13/code/tests/test_vision.py"
      - "v13/code/tests/test_vision_source_lineage.py"
      - "v13/code/tests/test_vision_projector_stats.py"
      - ".github/workflows/v14-vision-source-lineage.yml"
  pull_request:
    paths:
      - "v13/code/v13/vision.py"
      - "v13/code/v13/vision_source_lineage.py"
      - "v13/code/v13/vision_projector_stats.py"
      - "v13/code/tests/test_vision.py"
      - "v13/code/tests/test_vision_source_lineage.py"
      - "v13/code/tests/test_vision_projector_stats.py"
      - ".github/workflows/v14-vision-source-lineage.yml"

permissions:
  contents: read

jobs:
  vision-source-lineage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bounded vision test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.2.0 numpy==2.3.5 Pillow==12.3.0
      - name: Report exact source hashes for staged composer rebinding
        run: sha256sum v13/code/v13/vision.py v13/code/v13/vision_source_lineage.py v13/code/v13/vision_ui_frame_ingress.py
      - name: Compile exact source and tests
        run: python -m py_compile v13/code/v13/vision.py v13/code/v13/vision_source_lineage.py v13/code/v13/vision_projector_stats.py v13/code/tests/test_vision.py v13/code/tests/test_vision_source_lineage.py v13/code/tests/test_vision_projector_stats.py
      - name: Run vision and source-forget regressions
        working-directory: v13/code
        run: python -m pytest -q tests/test_vision.py tests/test_vision_source_lineage.py tests/test_vision_projector_stats.py
