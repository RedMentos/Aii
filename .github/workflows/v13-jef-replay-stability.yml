name: V13 JEF stable event replay
on:
  push:
    branches:
      - 'codex/v13-jef-replay-stability-*'
  pull_request:
    paths:
      - 'v13/code/v13/turnflow.py'
      - 'v13/code/tests/test_turnflow_replay_stability.py'
      - '.github/workflows/v13-jef-replay-stability.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - env:
          PYTHONPATH: v13/code
        run: |
          python -m compileall -q v13/code/v13/turnflow.py
          python -m unittest discover -s v13/code/tests -p 'test_turnflow_replay_stability.py' -v
          python -m unittest discover -s v13/code/tests -p 'test_turnflow_event_identity.py' -v
          python -m unittest discover -s v13/code/tests -p 'test_turnflow_no_offer_evidence.py' -v
          python -m pytest -q v13/code/tests/test_turnflow_think_speak.py v13/code/tests/test_turnflow_human_exploration.py
