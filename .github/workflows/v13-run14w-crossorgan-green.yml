name: V13 Run14W integrated ContextOS World C2 Sleep software witness
on:
  push:
    branches: [assistant/v13-run14w-crossorgan-integration-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run14w-crossorgan-green.yml'
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run source-pinned cross-organ real SQLite and restart regression
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run14w-green"; mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          021391e21e6cd9aeafca8ce819be514032ae0e1e v13/code/docs/RUN14W_CROSSORGAN_PREREG_20261030.md
          597d6ca7528a496c34d1178a6f6156993b457ebb v13/code/tests/test_run14w_context_world_effort_integration.py
          40a77a9c3717db7899bfd8966acfa4b9e315e966 v13/code/v13/context_os.py
          03c87501862eb773f80b3704f1e2b8f81b5cfc75 v13/code/v13/world.py
          563a6db17c1331f5eaa9f6549502f8afc460ad57 v13/code/v13/effort.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run14w-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run14w-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
          echo "$?" > "$e/PIP_CHECK_EXIT.txt"
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 10m env PYTHONPATH=.:tests "$py" -m unittest -v \
              tests.test_run14w_context_world_effort_integration \
              tests.test_context_os_outcome_replay_run14s tests.test_context_os \
              tests.test_world_duplicate_json_run14u tests.test_world_state \
              tests.test_world_receipt_binding_run424 tests.test_world_valid_recent_window_run431 \
              tests.test_effort_learned_band_run14v tests.test_effort \
              tests.test_c2_deadline_preferred_wake_run14o tests.test_resource_modes \
              tests.test_sleep_scheduler tests.test_sleep_validation \
              tests.test_sleep_replay_enqueue_atomic_run12i tests.test_neuromod) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PREREQUISITE > "$e/TEST_RAW.log";echo 99 > "$e/TEST_EXIT.txt";fi
          python3 -m compileall -q v13/code/v13/context_os.py v13/code/v13/world.py v13/code/v13/effort.py v13/code/tests/test_run14w_context_world_effort_integration.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base f5bc048cf425132209911e4575fe80dd1067722f --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check f5bc048cf425132209911e4575fe80dd1067722f HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve complete integrated raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run14w-integrated-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run14w-green/
          retention-days: 30
          if-no-files-found: error
      - name: Require all integrated stages GREEN
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run14w-green"
          for stage in PINS VENV DEPS PIP_CHECK TEST COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              tail -100 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
          echo 'CROSS_ORGAN_SOFTWARE_ONLY; NO_NATIVE_OR_AGE_PROMOTION'
