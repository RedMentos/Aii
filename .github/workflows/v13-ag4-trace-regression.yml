name: V13 AG4 learned tool trace regression
on:
  pull_request:
    paths:
      - 'v13/code/v13/agi/skills.py'
      - 'v13/code/tests/test_ag4_trace_composition_20261108.py'
      - '.github/workflows/v13-ag4-trace-regression.yml'
  workflow_dispatch:
jobs:
  ag4-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Compile changed Python sources
        run: python -m py_compile v13/code/v13/agi/skills.py v13/code/tests/test_ag4_trace_composition_20261108.py
      - name: Run focused regression suite
        working-directory: v13/code
        run: python -m pytest -q tests/test_ag4_trace_composition_20261108.py
