name: V13 Run159 full-suite cross-organ current chain
on:
  pull_request:
    paths:
      - '.github/workflows/v13-run159-fullsuite.yml'
      - 'v13/code/docs/proofs/continuation-20261025/run159-fullsuite/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v13-native-c3-run131-serialized
  cancel-in-progress: false
jobs:
  privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Official public repo privacy scan
        run: |
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
  full-suite:
    needs: privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      NEEDLE_TELEMETRY: '0'
      NO_MODEL_DOWNLOADS: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Exact frozen Runtime and sealed LP3 test helper
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git hash-object v13/code/v13/runtime.py)" = "a691d27bd0772a4fa1f03d57ec90663237bf6825"
          ARCHIVE=v13/code/docs/proofs/continuation-20261024/lp3-run16/SOURCE_AND_TESTS.tar.xz
          test "$(git hash-object "$ARCHIVE")" = "667d7f1b73a655097a44ff4c61749af113f7544f"
          echo "041e0014194ffdfd74aef79cf6a9149e6c2e11ad51b859bc9a9e7e81b1b67516  $ARCHIVE" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/lp3_run16"
          tar -xJf "$ARCHIVE" -C "$RUNNER_TEMP/lp3_run16"
          helper="$(find "$RUNNER_TEMP/lp3_run16" -type f -name test_lp3_serial_cohort.py -print -quit)"
          test -n "$helper"
          echo "LP3_HELPER_DIR=$(dirname "$helper")" >> "$GITHUB_ENV"
      - name: Isolated CPU-only pinned dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/run159"
          timeout 180s "$RUNNER_TEMP/run159/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
          timeout 420s "$RUNNER_TEMP/run159/bin/python" -m pip install --disable-pip-version-check --no-input --index-url https://download.pytorch.org/whl/cpu 'torch==2.9.1+cpu'
          "$RUNNER_TEMP/run159/bin/python" -c 'import torch;print("RUN159_TORCH",torch.__version__,"CUDA",torch.cuda.is_available())'
      - name: Full discovery, preserve all failures
        id: suite
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          export PYTHONPATH="$LP3_HELPER_DIR:$PWD"
          "$RUNNER_TEMP/run159/bin/python" -m compileall -q v13 tests
          timeout 900s "$RUNNER_TEMP/run159/bin/python" -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/RUN159_FULL_SUITE_RAW.log"
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "RUN159_SUITE_EXIT=$rc"
          grep -E 'Ran [0-9]+ tests|FAILED \(|^OK$|^ERROR:|^FAIL:' "$RUNNER_TEMP/RUN159_FULL_SUITE_RAW.log" | tail -n 80 || true
          exit 0
      - name: Upload closed raw suite log even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V13-Run159-FullSuite-Raw-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/RUN159_FULL_SUITE_RAW.log
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce true suite result
        if: always()
        run: |
          test "${{ steps.suite.outputs.exit_code }}" = "0"
