name: V13 Run117CR read-only full source-chain drift audit
on:
  push:
    branches:
      - assistant/v13-run117cr-source-chain-drift-audit-20261101-gpt6
  pull_request:
    branches:
      - assistant/v13-run117cq-native-artifact-hydration-20261101-gpt6
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-source-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compare complete reviewed source chain without changing acceptance
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run117cr"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          1852aa8546ec4c938f0b66b6fffc1753c6ba0224 v13/code/scripts/run117cr_source_chain_drift_audit.py
          f4c0f6f397452292c6e67e4e1e91d04290890632 v13/code/tests/test_run117cr_source_chain_drift_audit.py
          2ea80d6531d6408cae0b4648e21c5f9246f4d1cd v13/code/scripts/integrated_candidates.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m py_compile v13/code/scripts/run117cr_source_chain_drift_audit.py v13/code/tests/test_run117cr_source_chain_drift_audit.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests:scripts python3 -m unittest -v tests.test_run117cr_source_chain_drift_audit) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests:scripts python3 scripts/run117cr_source_chain_drift_audit.py --diff-output "$e/COMPLETE_SOURCE_DIFF.patch") > "$e/AUDIT_RAW.json" 2> "$e/AUDIT_STDERR.log"
          echo "$?" > "$e/AUDIT_EXIT.txt"
          git log --format='%H %aI %s' --max-count=60 -- v13/code/v13/runtime.py v13/code/v13/runners.py v13/code/v13/store.py v13/code/v13/memory_server.py > "$e/SOURCE_LINEAGE_RAW.log" 2>&1
          echo "$?" > "$e/LINEAGE_EXIT.txt"
          git diff --exit-code -- v13/code/v13/runtime.py v13/code/v13/runners.py v13/code/v13/store.py v13/code/v13/memory_server.py > "$e/NO_SOURCE_MUTATION_RAW.log" 2>&1
          echo "$?" > "$e/NO_SOURCE_MUTATION_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base fa39f71c4eeb76620c062300a19988d8f42fe543 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check fa39f71c4eeb76620c062300a19988d8f42fe543 HEAD > "$e/DIFF_EXIT_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve complete source diff, git lineage and original raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117cr-source-chain-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117cr/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce audit integrity without accepting source drift
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117cr"
          for stage in PINS COMPILE TEST AUDIT LINEAGE NO_SOURCE_MUTATION PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; no source identity promotion"
              tail -80 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN117CR_SOURCE_CHAIN_AUDIT_ONLY_DRIFT_NOT_ACCEPTED
