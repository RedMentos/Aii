name: V13 C6 positive assertion source-grounding SHADOW regression
on:
  push:
    branches: [assistant/v13-c6-positive-assertion-guard-20261031-auto11]
    paths:
      - '.github/workflows/v13-c6-positive-assertion-guard.yml'
      - 'v13/code/v13/c6_positive_assertion_candidate.py'
      - 'v13/code/tests/test_c6_positive_assertion_candidate.py'
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned source, real SQLite negative controls, raw stage receipts
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-c6-positive-assertion"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          0779d986fb8aee8aa01c5df5f656889d4bd56348 v13/code/v13/store.py
          22ed11e4a53d9eeae8fbc74a1753082b5785be2b v13/code/v13/runtime.py
          c33930e8f9d9f02f788bc8fb9de3f498db9a2800 v13/code/v13/source_consumer.py
          890641892b3d4f6ec1f54de4e6591cfa4784baa6 v13/code/docs/fixtures/run51_f1f5_second_attempt_seed467.json
          26f866c88c1604b6119aaf55066f40a9f8b43f4f v13/code/v13/f1f5_temporal_atomic_draft_candidate.py
          295702496d94e84113f253cc3a09d71aba3b1e34 v13/code/v13/c6_temporal_draft_preflight_candidate.py
          66221a37f7064d5b1c07167c92d0a12d5b8928e9 v13/code/tests/test_c6_temporal_draft_preflight_candidate.py
          30bb3269fa89621f78db893cf566d04f8768cf27 v13/code/v13/c6_positive_assertion_candidate.py
          0ef8309a4323cda02783c8a8ff8bd378a0512870 v13/code/tests/test_c6_positive_assertion_candidate.py
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          sha256sum v13/code/docs/fixtures/run51_f1f5_second_attempt_seed467.json > "$e/FIXTURE_RAW.log" 2>&1
          test "$(cut -d' ' -f1 "$e/FIXTURE_RAW.log")" = 160128b2f5df2a5798ae7ec62687e6be5a8e61f6c6b2dad43f1ad253ee592ecc
          echo "$?" > "$e/FIXTURE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-c6-positive-assertion-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-c6-positive-assertion-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/FIXTURE_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_c6_positive_assertion_candidate tests.test_c6_temporal_draft_preflight_candidate tests.test_f1f5_temporal_atomic_draft_candidate tests.test_f1f5_temporal_source_gate_candidate tests.test_runtime_c3_atomic_draft_candidate tests.test_b1b2_topic_partition_candidate tests.test_b1b2_causal_offer_consumer_candidate tests.test_b1b2_causal_context_candidate tests.test_f1f5_c5c6_atomic_draft_candidate tests.test_f1f5_event_finalizer_candidate tests.test_run52_lexical_metric_audit tests.test_run52_b1b2_cross_turn tests.test_run51_f1f5_second_attempt tests.test_run50_native_c3_c5_c6_draft tests.test_run49_c5_c6_draft_shadow tests.test_run48_jef_c3_final_agreement_shadow tests.test_run46b_jef_source_eligibility_shadow) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PINS_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/v13/c6_positive_assertion_candidate.py v13/code/tests/test_c6_positive_assertion_candidate.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 7f21f779d5750e769bb77aac2aae5f40fd72afce --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 7f21f779d5750e769bb77aac2aae5f40fd72afce HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-c6-positive-assertion-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-c6-positive-assertion/
          retention-days: 90
          if-no-files-found: error
      - name: Require eight stages zero
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-c6-positive-assertion"
          for s in PINS FIXTURE VENV DEPS TEST COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo C6_POSITIVE_ASSERTION_SHADOW_NO_TTY_NO_OUTPUT_NO_PROMOTION
