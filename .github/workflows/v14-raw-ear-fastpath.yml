name: V14 RAW EAR optional NumPy backend

on:
  push:
    branches:
      - "research-perception/**"
    paths:
      - "v13/code/v13/audio_voice_cues.py"
      - "v13/code/v13/vision.py"
      - "v13/code/v13/vision_a5_bridge.py"
      - "v13/code/v13/attention.py"
      - "v13/code/v13/contracts.py"
      - "v13/code/v13/percept_admission.py"
      - "v13/code/v13/a5_context_envelope.py"
      - "v13/code/v13/store.py"
      - "v13/code/v13/common.py"
      - "v13/code/v13/config.py"
      - "v13/code/tests/test_vision.py"
      - "v13/code/tests/test_vision_a5_bridge.py"
      - "v13/code/v13/audio_speaker_evidence.py"
      - "v13/code/v13/audio_input.py"
      - "v13/code/tests/test_audio_input.py"
      - "v13/code/tests/test_audio_speaker_evidence.py"
      - "v13/code/tests/test_audio_ear_voice_cues_v14.py"
      - "v13/code/experiments/benchmark_raw_ear_backends.py"
      - ".github/workflows/v14-raw-ear-fastpath.yml"
  pull_request:
    paths:
      - "v13/code/v13/audio_voice_cues.py"
      - "v13/code/v13/audio_speaker_evidence.py"
      - "v13/code/tests/test_audio_input.py"
      - "v13/code/v13/audio_input.py"
      - "v13/code/tests/test_audio_speaker_evidence.py"
      - "v13/code/tests/test_audio_ear_voice_cues_v14.py"
      - "v13/code/experiments/benchmark_raw_ear_backends.py"
      - ".github/workflows/v14-raw-ear-fastpath.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v14-raw-ear-fastpath-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  raw-ear-fastpath:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal perception test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.2.0 numpy==2.3.5 Pillow==12.3.0
      - name: Compile RAW EAR implementation, tests and benchmark
        run: python -m py_compile v13/code/v13/audio_voice_cues.py v13/code/v13/audio_speaker_evidence.py v13/code/v13/audio_input.py v13/code/v13/vision.py v13/code/v13/vision_a5_bridge.py v13/code/tests/test_audio_input.py v13/code/tests/test_audio_ear_voice_cues_v14.py v13/code/tests/test_audio_speaker_evidence.py v13/code/tests/test_vision.py v13/code/tests/test_vision_a5_bridge.py v13/code/experiments/benchmark_raw_ear_backends.py
      - name: Run RAW EAR backend parity and A5-A4-C3 consumer tests
        working-directory: v13/code
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -s tests/test_audio_ear_voice_cues_v14.py tests/test_audio_speaker_evidence.py tests/test_audio_input.py tests/test_vision.py tests/test_vision_a5_bridge.py
      - name: Run deterministic synthetic benchmark
        working-directory: v13/code
        run: python experiments/benchmark_raw_ear_backends.py --iterations 5
      - name: Scan changed public content for secrets and private identifiers
        run: python v13/code/scripts/public_repo_privacy_scan.py --base origin/gpt6/v13-private-remote-bridge-20261111 --head HEAD --no-worktree
