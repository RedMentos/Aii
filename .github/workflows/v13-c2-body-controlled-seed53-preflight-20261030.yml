name: V13 seed53 six-arm controlled utility software preflight
on:
  push:
    branches:
      - codex/v13-c2-body-controlled-native-20261030-hourly11c
    paths:
      - '.github/workflows/v13-c2-body-controlled-seed53-preflight-20261030.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin frozen seed53 source and run adversarial software tests
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-seed53-preflight"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          decf9a6bafb2d5b15d6b7df224b191caf05cb98a v13/code/docs/C2_BODY_CONTROLLED_UTILITY_PREREG_20261030.md
          d14a7d171c99d9ff9947ea55ab3c5d4709909d7d v13/code/scripts/c2_body_controlled_utility_seed53_20261030.py
          a1229441e38edca3aad99caea615665c5790c845 v13/code/tests/test_c2_body_controlled_utility_seed53_20261030.py
          fcd44ccce3b8b40d65a25187a78b0a8d49d9609d v13/code/scripts/step2_paired_raw_validator_audit_20261030.py
          f6bb6c26237f9c94a29a9eeac5ecc6c5fa129ad3 v13/code/scripts/step2_expression_diagnostic_20261030.py
          fb34dba97ae3700ba5accdcb928bfb72afcf4fcb v13/code/scripts/c2_native_route_provenance_20261030.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          954a3f468f10195fbce12d27f68585ee7edee2c9 v13/code/specs/control_tools.json
          BLOBS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-seed53-preflight-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-seed53-preflight-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else
            echo SKIPPED > "$e/DEPS_RAW.log"
            echo SKIPPED > "$e/DEPS_EXIT.txt"
          fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_c2_body_controlled_utility_seed53_20261030) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
            (cd v13/code && PYTHONPATH=.:scripts "$py" -c 'from scripts.c2_body_controlled_utility_seed53_20261030 import validate_fixtures; assert validate_fixtures(); print("FRESH_SEED53_24_TURNS_SOFTWARE_ONLY")') > "$e/FIXTURE_RAW.log" 2>&1
            echo "$?" > "$e/FIXTURE_EXIT.txt"
          else
            for stage in TEST FIXTURE; do echo SKIPPED > "$e/${stage}_RAW.log"; echo SKIPPED > "$e/${stage}_EXIT.txt"; done
          fi
          "$py" -m py_compile v13/code/scripts/c2_body_controlled_utility_seed53_20261030.py v13/code/tests/test_c2_body_controlled_utility_seed53_20261030.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 373d50e92c698163aa4ac773f46f27ec13379e85 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 373d50e92c698163aa4ac773f46f27ec13379e85 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve complete software raw on pass or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-seed53-preflight-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-seed53-preflight/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce source-pinned software preflight
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-seed53-preflight"
          for stage in PINS VENV DEPS TEST FIXTURE COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; raw preserved; native not authorized by this preflight"
              tail -75 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'SEED53_SOURCE_PREFLIGHT_ONLY_NO_NATIVE_OR_GATE'
