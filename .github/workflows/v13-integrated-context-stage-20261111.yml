name: V13 staged context and integrated regression
on:
  push:
    # Phone updates require a result for the exact release SHA, including
    # documentation-only checkpoints and after the draft PR is closed.
    branches: ['codex/v13-integrated-continuation-20261110', 'gpt6/v13-private-remote-bridge-20261111']
  pull_request:
    paths:
      - '.github/workflows/v13-integrated-context-stage-20261111.yml'
      - 'v13/code/v13/**'
      - 'v13/code/scripts/**'
      - 'v13/code/candidates/**'
      - 'v13/code/specs/**'
      - 'v13/code/tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staged-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest==9.2.0 numpy==2.2.6
      - name: Stage, source recall, SQLite turn, revocation and JEPA restart
        working-directory: v13/code
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -m pytest -q -s
          tests/test_stage_integrated_candidate.py
          tests/test_integrated_stage_real_smoke.py
          tests/test_pinned_stage_runtime_e2e_20261111.py
          tests/test_context_source_recall_stage_20261111.py
          tests/test_runtime_jepa_utility_integration_20261111.py
          tests/test_world_jepa_training_resume_stage_20261111.py
          tests/test_termux_probe_recovery_candidate_20261112.py
          tests/test_termux_chat_recovery_candidate_20261112.py
          tests/test_termux_idle_recovery_candidate_20261112.py
          tests/test_termux_runtime_recovery_stage.py
          tests/test_activate_termux_recovery.py
          tests/test_unified_brain_delivery.py
          tests/test_enlightened_space.py
          tests/test_native_prompt_admission.py
      - name: Check recovery shell syntax
        run: bash -n v13/code/scripts/termux_runtime_recovery.sh
  integrated-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --disable-pip-version-check pytest==9.2.0 numpy==2.2.6 pillow==13.0.0 transformers==4.44.2 peft==0.13.2
      - name: Exercise the shared staged organ and memory paths
        working-directory: v13/code
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q -s tests/test_staged_integrated_regression_20261111.py
