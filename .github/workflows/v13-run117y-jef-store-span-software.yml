name: V13 Run117Y real-Store JEF budget span SHADOW software tests
on:
  push:
    branches:
      - assistant/v13-run117y-jef-store-span-budget-20261031
    paths:
      - .github/workflows/v13-run117y-jef-store-span-software.yml
      - v13/code/v13/jef_span_budget_shadow_candidate.py
      - v13/code/tests/test_jef_span_budget_shadow_candidate.py
      - v13/code/docs/RUN117Y_*
permissions:
  contents: read
jobs:
  software-real-store:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Run 51 source/JEF/pointer tests without model calls
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117y-jef-span"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run117y-venv" > "$e/VENV_RAW.log" 2>&1
          py="$RUNNER_TEMP/v13-run117y-venv/bin/python"
          set +e
          "$py" -m pip install --disable-pip-version-check --no-input -q \
            'numpy==2.2.6' 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          deps_rc=$?
          if test "$deps_rc" -eq 0; then
            (cd v13/code && env PYTHONPATH=. "$py" -m unittest -v \
              tests.test_jef_span_budget_shadow_candidate \
              tests.test_run117w_c3_arithmetic_native \
              tests.test_two_source_pointer_shadow_candidate \
              tests.test_jef_two_source_role_formatter_candidate \
              tests.test_run46b_jef_source_eligibility_shadow \
              tests.test_run117s_r_prior_source_binding_review) > "$e/TEST_RAW.log" 2>&1
            test_rc=$?
          else
            test_rc=125;echo PREREQUISITE_RED > "$e/TEST_RAW.log"
          fi
          "$py" -m compileall -q v13/code/v13/jef_span_budget_shadow_candidate.py \
            v13/code/tests/test_jef_span_budget_shadow_candidate.py > "$e/COMPILE_RAW.log" 2>&1
          compile_rc=$?
          python3 v13/code/scripts/public_repo_privacy_scan.py \
            --base 33be6b44a87b481486c3d6079b3c7e828a958ea5 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          privacy_rc=$?
          git diff --check 33be6b44a87b481486c3d6079b3c7e828a958ea5 HEAD > "$e/DIFF_RAW.log" 2>&1
          diff_rc=$?
          for x in "DEPS:$deps_rc" "TEST:$test_rc" "COMPILE:$compile_rc" \
                   "PRIVACY:$privacy_rc" "DIFF:$diff_rc"; do
            echo "${x#*:}" > "$e/${x%%:*}_EXIT.txt"
          done
          set -e
          "$py" - "$e" <<'PY' > "$e/RESULT_RAW.log"
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1]);names=('DEPS','TEST','COMPILE','PRIVACY','DIFF')
          r={'schema':'v13.run117y.jef_store_span_software_receipt.v1',
             'head':(e/'HEAD.txt').read_text().strip(),
             'exits':{n:int((e/(n+'_EXIT.txt')).read_text()) for n in names},
             'native_model_called':False,'source': 'REAL_SQLITE_WITH_SYNTHETIC_RUNTIME',
             'step2_promoted':False,'b3_promoted':False,'jepa_weight':0,
             'redmi_measured':False,'whole_system_complete':False}
          (e/'RESULT.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat "$e/RESULT_RAW.log"
          tail -n 6 "$e/TEST_RAW.log"
          for rc in "$deps_rc" "$test_rc" "$compile_rc" "$privacy_rc" "$diff_rc"; do test "$rc" -eq 0; done
      - name: Preserve model-free GREEN or RED evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117y-jef-store-span-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117y-jef-span/
          if-no-files-found: warn
          retention-days: 90