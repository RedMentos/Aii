name: V13 Run96 Sleep wake index proof

on:
  pull_request:
    paths:
      - "v13/code/v13/sleep.py"
      - "v13/code/tests/test_sleep_wake_index_run96.py"
      - ".github/workflows/v13-run96-sleep.yml"

permissions:
  contents: read

concurrency:
  group: v13-run96-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sleep-wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 50
      - run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Real Runtime SQLite Sleep and Age regressions
        working-directory: v13/code
        run: |
          set -euo pipefail
          ../../.venv/bin/python -m compileall -q v13 tests
          ../../.venv/bin/python -m unittest -v tests.test_sleep_wake_index_run96 tests.test_sleep_replay_window_run95 tests.test_sleep_scheduler tests.test_sleep_validation tests.test_age tests.test_age_rights
      - name: Official public repository privacy scan
        run: |
          set -euo pipefail
          .venv/bin/python v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
