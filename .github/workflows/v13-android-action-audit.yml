name: V13 Android companion durable audit
on:
  push:
    branches:
      - codex/v13-core-durable-companion-audit-20261112-0004
  pull_request:
    paths:
      - 'v13/code/v13/android_action_audit.py'
      - 'v13/code/tests/test_android_action_audit.py'
      - '.github/workflows/v13-android-action-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: PYTHONPATH=v13/code python -m pytest -q v13/code/tests/test_android_action_audit.py
