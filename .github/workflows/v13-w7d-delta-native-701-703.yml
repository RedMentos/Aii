name: V13 W7D disjoint delta-inverse real-file SHADOW 701-703
on:
  push:
    branches: [codex/w7d-native-disjoint-701-703-20261031-hourly11]
    paths: ['.github/workflows/v13-w7d-delta-native-701-703.yml']
permissions:
  contents: read
concurrency:
  group: v13-native-c3-ag12-20261030
  cancel-in-progress: false
jobs:
  realfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    env:
      V13_NO_AUTOSTART: '1'
      DO_NOT_TRACK: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin source and execute preregistered W7D two-arm real-file cohort
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-w7d-delta-native"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          99a686a131a1bdc89efe0d0cf9610ec54cbd853b v13/code/v13/world_jepa.py
          2fd1366dc1b6d8c02803ee3254020f70e5bf3eb4 v13/code/scripts/z12b_world_jepa.py
          219bf7233cb91c746c89a60f9b7789dc3b5ca9ef v13/code/scripts/run35_world_jepa_slot_alignment_real.py
          51bc5260cde8db3bc6cf7924a7a089a5cdfe5fd0 v13/code/v13/world_jepa_fullslot_candidate.py
          67e14e0d03c50c4767b74d5b02a819a95c6cc262 v13/code/v13/world_jepa_slot_candidate.py
          c65467f1f000c187f46542270dfc53ee569824a1 v13/code/v13/world_jepa_action_balanced_fullslot_candidate.py
          ed5d4b4f3324fc757c2a62944a82023c54b71fd0 v13/code/v13/world_jepa_delta_inverse_candidate.py
          8d0102d9ecc1e8aaa8bb073c0975480448e369ed v13/code/v13/world_jepa_delta_balanced_candidate.py
          f5b630a1a99b85df260912596fc253b3c0f20b7e v13/code/docs/WORLD_JEPA_DELTA_INVERSE_PREREG_20261031.md
          819ae4863ac3f383cd08541a01fade995b9a1ff7 v13/code/docs/W7D_D3_PERSEED_INTEGRITY_REVIEW_PREREG_20261031.md
          9ce0822d1b83945d6f4d33e8bc1f2fe1e48a2723 v13/code/scripts/w7d_world_jepa_delta_inverse_real.py
          f6b8dc46cdc1d829324d705326fa0287a39aa55b v13/code/tests/test_w7d_d3_perseed_integrity_review.py
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-w7d-native-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-w7d-native-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 4m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_w7d_d3_perseed_integrity_review tests.test_world_jepa_delta_inverse_candidate tests.test_w7s_world_jepa_disjoint_support) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo PIN_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          if [ "$(cat "$e/TEST_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 45m env PYTHONPATH=.:tests:scripts "$py" scripts/w7d_world_jepa_delta_inverse_real.py --out "$e/RESULT.json" --work-root "$e/work") > "$e/REALFILE_RAW.log" 2>&1
            echo "$?" > "$e/REALFILE_EXIT.txt"
          else echo TEST_RED > "$e/REALFILE_RAW.log"; echo 99 > "$e/REALFILE_EXIT.txt"; fi
          if [ -f "$e/RESULT.json" ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" - "$e/RESULT.json" "$e/work" > "$e/REPORT_CHECK_RAW.log" 2>&1 <<'PY'
          import json,sys,pathlib,math
          from scripts import w7d_world_jepa_delta_inverse_real as w
          r=json.load(open(sys.argv[1])); work=pathlib.Path(sys.argv[2])
          assert r['schema']=='v13.w7d.world_jepa_delta_inverse_exact_row.v1'
          assert r['evidence_kind']=='LINUX_REALFILE_WORLD_JEPA_SHADOW_EXACT_ROWS'
          assert r['registered'] and r['seeds']==[701,702,703]
          assert r['args']=={'train':4000,'cf':150,'attr':900,'steps':3000}
          assert r['status'] in ('SHADOW_CANDIDATE_FAIL','SHADOW_CANDIDATE_PASS_NOT_PROMOTED')
          assert r['same_collected_rows'] and r['same_core_parameter_count']
          assert r['same_optimizer_steps'] and r['same_training_example_count']
          assert not r['global_96d_capacity_control_complete']
          assert r['affected_slot_copies']==5
          assert len(r['attribution_support_preflight'])==3
          assert [x['seed'] for x in r['attribution_support_preflight']]==[701,702,703]
          assert all(set(x['counts'])=={'own_only','world_only','both','none'} and min(x['counts'].values())>=15 for x in r['attribution_support_preflight'])
          assert r['age0']=='RECORD_ONLY' and r['step2']=='UTILITY_FAIL'
          assert r['b3']=='NO_PROMOTION' and r['body_jepa']=='UNAVAILABLE'
          assert r['jepa_weight']==0 and r['world_jepa_authority']=='SHADOW'
          assert not r['redmi_measured'] and not r['whole_system_complete']
          for arm in ('balanced_slot','delta_slot'):
            assert len(r[arm])==3
            assert all(row['seed']==seed and row['capacity']['world_concat_dim']==96
                       for seed,row in zip((701,702,703),r[arm]))
            assert all((work/f'{arm}-{seed}-RESULT.json').is_file() for seed in (701,702,703))
            assert len(r[arm+'_gates'])==6 and len(r[arm+'_w7'])==3
            assert all(type(v) is bool for g in (r[arm+'_gates'],r[arm+'_w7'])
                       for v in g.values())
            assert all('_conf_err' not in row for row in r[arm])
          x=r['exploratory']
          assert x['D3_per_seed_rho_measured'] is True
          assert len(x['per_seed_w4_rho_delta'])==3
          assert all(math.isfinite(v) for v in x['per_seed_w4_rho_delta'])
          assert x['D3_w4_rho_improvement']==(x['mean_per_seed_w4_rho_delta']<=-.05
              and all(v<=.05 for v in x['per_seed_w4_rho_delta']))
          assert all(type(x[k]) is bool for k in ('D1_w6_margin_improvement',
                       'D2_w7b_none_improvement','D3_w4_rho_improvement'))
          # The per-seed RESULT files retain raw pairs for independent replay.
          raw={}
          for arm in ('balanced_slot','delta_slot'):
            raw[arm]=[json.load(open(work/f'{arm}-{seed}-RESULT.json')) for seed in (701,702,703)]
            assert all(len(row['_conf_err'])>=2 for row in raw[arm])
          rb=w.per_seed_w4_rho(raw['balanced_slot'])
          rd=w.per_seed_w4_rho(raw['delta_slot'])
          assert x['per_seed_w4_rho_delta']==[round(d-b,6) for d,b in zip(rd,rb)]
          assert r['status']==('SHADOW_CANDIDATE_PASS_NOT_PROMOTED'
             if all(r['delta_slot_gates'].values()) and all(r['delta_slot_w7'].values())
             else 'SHADOW_CANDIDATE_FAIL')
          print('W7D_REGISTERED_REALFILE_SHADOW_NO_PROMOTION',r['status'],
                r['balanced_slot_gates'],r['delta_slot_gates'],
                r['delta_slot_w7'],x)
          PY
            )
            echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          else echo NO_RESULT_RED > "$e/REPORT_CHECK_RAW.log"; echo 99 > "$e/REPORT_CHECK_EXIT.txt"; fi
          "$py" -m py_compile v13/code/scripts/w7d_world_jepa_delta_inverse_real.py v13/code/v13/world_jepa_delta_inverse_candidate.py v13/code/tests/test_w7d_d3_perseed_integrity_review.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base aaed82834eac01b198bd30d330ad104b6598fb35 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check aaed82834eac01b198bd30d330ad104b6598fb35 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw including failure and file-world rows
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-w7d-delta-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-w7d-delta-native/
          if-no-files-found: error
          retention-days: 90
      - name: Require all stages zero without World-JEPA or age promotion
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-w7d-delta-native"
          for s in PINS VENV DEPS TEST REALFILE REPORT_CHECK COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo W7D_REALFILE_SHADOW_ONLY_NO_WORLD_JEPA_OR_AGE_PROMOTION
