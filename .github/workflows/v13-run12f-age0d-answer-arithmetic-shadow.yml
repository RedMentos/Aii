name: V13 Run12F answer-aware Age0d arithmetic SHADOW source-only
on:
  push:
    branches: [assistant/v13-run12f-age0d-answer-arithmetic-shadow-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run12f-age0d-answer-arithmetic-shadow.yml'
permissions:
  contents: read
jobs:
  shadow-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact source and answer-aware SHADOW false-alarm controls
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run12f-age0d"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          ab3a7cb2b58020522a3aba1fe70b2be29fbeeb70 v13/code/v13/age0d_answer_arithmetic_shadow_run12f.py
          444e8e39715b3c2bbe8c9e75ebc7ae240f1d0a22 v13/code/tests/test_age0d_answer_arithmetic_shadow_run12f.py
          072ae59d75c97d972433fedd3830002d2c8530ad v13/code/v13/selfmodel.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run12f-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run12f-venv/bin/python"
          "$py" -m pip install --no-input --disable-pip-version-check --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests timeout --signal=TERM --kill-after=5s 180s "$py" -m unittest -v tests.test_age0d_answer_arithmetic_shadow_run12f tests.test_late_correction) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          "$py" -m py_compile v13/code/v13/age0d_answer_arithmetic_shadow_run12f.py v13/code/tests/test_age0d_answer_arithmetic_shadow_run12f.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 70fa2161187a5cce769df7f739c8844c0fff5c05 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 70fa2161187a5cce769df7f739c8844c0fff5c05 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw even on RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run12f-age0d-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run12f-age0d/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce SHADOW-only no live correction authority
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run12f-age0d"
          for stage in PINS VENV DEPS TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "${stage} RED; original raw preserved"
              tail -100 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo "RUN12F_AGE0D_ANSWER_AWARE_SHADOW_ONLY_NO_DELIVERY"
