name: V14 Core vision source lifecycle composition

on:
  push:
    branches:
      - "core/v14-vision-source-lifecycle-*"
    paths:
      - "v13/code/scripts/source_lifecycle_lock_integration_candidate.py"
      - "v13/code/scripts/run_source_lifecycle_vision_candidate_tests.py"
      - "v13/code/tests/source_lifecycle_disposable_cases.py"
      - "v13/code/v13/vision.py"
      - "v13/code/v13/source_lifecycle_candidate.py"
      - "v13/code/v13/store.py"
      - "v13/code/v13/archive.py"
      - "v13/code/v13/memory.py"
      - ".github/workflows/v14-core-vision-source-lifecycle.yml"
  pull_request:
    paths:
      - "v13/code/scripts/source_lifecycle_lock_integration_candidate.py"
      - "v13/code/scripts/run_source_lifecycle_vision_candidate_tests.py"
      - "v13/code/tests/source_lifecycle_disposable_cases.py"
      - "v13/code/v13/vision.py"
      - "v13/code/v13/source_lifecycle_candidate.py"
      - "v13/code/v13/store.py"
      - "v13/code/v13/archive.py"
      - "v13/code/v13/memory.py"
      - ".github/workflows/v14-core-vision-source-lifecycle.yml"

permissions:
  contents: read

jobs:
  materialized-vision-lifecycle:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bounded Runtime test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.2.0 numpy==2.3.5 Pillow==12.3.0 psutil==7.1.3
      - name: Report exact lifecycle source pins for downstream rebind
        run: sha256sum v13/code/scripts/source_lifecycle_lock_integration_candidate.py v13/code/v13/vision.py v13/code/v13/source_lifecycle_candidate.py
      - name: Compile exact composer, materializer and disposable Runtime tests
        run: python -m py_compile v13/code/scripts/source_lifecycle_lock_integration_candidate.py v13/code/scripts/run_source_lifecycle_vision_candidate_tests.py v13/code/tests/source_lifecycle_disposable_cases.py
      - name: Materialize and test exact source lifecycle Runtime consumer
        run: python v13/code/scripts/run_source_lifecycle_vision_candidate_tests.py
