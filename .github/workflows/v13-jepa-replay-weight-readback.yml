name: V13 JEPA replay-trained checkpoint readback
on:
  push:
    branches:
      - 'jepa/android-replay-weight-readback-20261111-1030'
  pull_request:
    paths:
      - 'v13/code/v13/android_sim_jepa_probe.py'
      - 'v13/code/v13/android_goal_replay_retention.py'
      - 'v13/code/tests/test_android_goal_replay_retention.py'
      - '.github/workflows/v13-jepa-replay-weight-readback.yml'
jobs:
  replay-weight-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pytest
      - run: cd v13/code && python -m pytest -q tests/test_android_goal_replay_retention.py tests/test_android_goal_learning_demo.py
