name: V14 A4 error-gated plasticity and retention ablation

on:
  push:
    branches:
      - "research-perception/**"
    paths:
      - "v13/code/v13/audio_temporal_prediction.py"
      - "v13/code/v13/audio_event_expectation.py"
      - "v13/code/v13/audio_voice_cues.py"
      - "v13/code/scripts/integrated_audio_context_candidate_20261121.py"
      - "v13/code/tests/test_audio_temporal_prediction.py"
      - "v14/experiments/a4_update_gate_retention_20261127.py"
      - "v14/experiments/test_a4_update_gate_retention_20261127.py"
      - "v14/experiments/a4_update_effect_predictor_20261128.py"
      - "v14/experiments/test_a4_update_effect_predictor_20261128.py"
      - "v14/experiments/test_a4_multi_horizon_update_effect_20261128.py"
      - "v14/experiments/a4_multi_horizon_update_effect_20261128.py"
      - ".github/workflows/v14-a4-update-gate-retention.yml"
  pull_request:
    branches:
      - "research-perception/**"
      - "gpt6/v13-private-remote-bridge-20261111"
    paths:
      - "v13/code/v13/audio_temporal_prediction.py"
      - "v13/code/v13/audio_event_expectation.py"
      - "v13/code/v13/audio_voice_cues.py"
      - "v13/code/scripts/integrated_audio_context_candidate_20261121.py"
      - "v13/code/tests/test_audio_temporal_prediction.py"
      - "v14/experiments/a4_update_gate_retention_20261127.py"
      - "v14/experiments/test_a4_update_gate_retention_20261127.py"
      - "v14/experiments/a4_update_effect_predictor_20261128.py"
      - "v14/experiments/test_a4_update_effect_predictor_20261128.py"
      - "v14/experiments/a4_multi_horizon_update_effect_20261128.py"
      - "v14/experiments/test_a4_multi_horizon_update_effect_20261128.py"
      - ".github/workflows/v14-a4-update-gate-retention.yml"

permissions:
  contents: read

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest==9.2.0
      - name: Compile exact predictor and ablation
        env:
          PYTHONPATH: v13/code:v14/experiments
        run: |
          python -m py_compile v13/code/v13/audio_temporal_prediction.py v13/code/v13/audio_event_expectation.py v13/code/v13/audio_voice_cues.py v13/code/scripts/integrated_audio_context_candidate_20261121.py v13/code/tests/test_audio_temporal_prediction.py v14/experiments/a4_update_gate_retention_20261127.py v14/experiments/test_a4_update_gate_retention_20261127.py v14/experiments/a4_update_effect_predictor_20261128.py v14/experiments/test_a4_update_effect_predictor_20261128.py v14/experiments/a4_multi_horizon_update_effect_20261128.py v14/experiments/test_a4_multi_horizon_update_effect_20261128.py
      - name: Run exact predictor and retention tests
        env:
          PYTHONPATH: v13/code:v14/experiments
        run: python -m unittest discover -s v14/experiments -p "test_a4_update_gate_retention_20261127.py" -v
      - name: Run update-effect predictor and future-regime ablation tests
        env:
          PYTHONPATH: v13/code:v14/experiments
        run: python -m unittest discover -s v14/experiments -p "test_a4_update_effect_predictor_20261128.py" -v
      - name: Emit synthetic update-effect ablation
        env:
          PYTHONPATH: v13/code:v14/experiments
        run: python v14/experiments/a4_update_effect_predictor_20261128.py
      - name: Run multi-horizon update-effect ablation tests
        env:
          PYTHONPATH: v13/code:v14/experiments
        run: python -m unittest discover -s v14/experiments -p "test_a4_multi_horizon_update_effect_20261128.py" -v
      - name: Emit multi-horizon update-effect ablation
        env:
          PYTHONPATH: v13/code:v14/experiments
        run: python v14/experiments/a4_multi_horizon_update_effect_20261128.py
      - name: Run exact predictor, registry and A5/A4 consumer regressions
        env:
          PYTHONPATH: v13/code
        run: python -m pytest -q v13/code/tests/test_audio_temporal_prediction.py
      - name: Emit deterministic synthetic ablation
        env:
          PYTHONPATH: v13/code:v14/experiments
        run: python v14/experiments/a4_update_gate_retention_20261127.py
