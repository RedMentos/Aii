name: V13 Run85 model-less doctor negative gates E2E
on:
  push:
    branches: [assistant/v13-run85-doctor-negative-gates-e2e-20261028]
permissions:
  contents: read
concurrency:
  group: v13-run85-${{ github.ref }}
  cancel-in-progress: true
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Capture Run85 source-bound doctor and negative gate evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run85"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          for p in v13/code/docs/proofs/continuation-20261028/RUN85_DOCTOR_NEGATIVE_GATES_PREREG.md v13/code/tests/test_run85_doctor_negative_gates_e2e.py v13/code/v13/verification.py v13/code/v13/operator.py; do git hash-object "$p" | xargs -I{} echo "{} $p"; done > "$e/SOURCE_RAW.log"
          if [ "$(git hash-object v13/code/docs/proofs/continuation-20261028/RUN85_DOCTOR_NEGATIVE_GATES_PREREG.md)" = 41db133ffbe5bec2c946e24545fe28b0913d9e18 ] && [ "$(git hash-object v13/code/tests/test_run85_doctor_negative_gates_e2e.py)" = 9450884b3f68d547bfe66a002b3ab289445927af ] && [ "$(git hash-object v13/code/v13/verification.py)" = b3225c0656815b76ca3a7c2b582bc37af0ea5fc6 ] && [ "$(git hash-object v13/code/v13/operator.py)" = 7bf3a992af1db87f6ee2432c2486dbbced0f2bd4 ]; then echo 0 > "$e/SOURCE_EXIT.txt"; else echo 1 > "$e/SOURCE_EXIT.txt"; fi
          python3 -m venv "$RUNNER_TEMP/v13-run85-venv"
          py="$RUNNER_TEMP/v13-run85-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/BASE_INSTALL_RAW.log" 2>&1
          echo "$?" > "$e/BASE_INSTALL_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 180s env PYTHONPATH=.:tests "$py" -m unittest -v tests.test_run85_doctor_negative_gates_e2e tests.test_age_rights tests.test_verified_operator_preflight) > "$e/FOCUSED_RAW.log" 2>&1
          echo "$?" > "$e/FOCUSED_EXIT.txt"
          python3 -m compileall -q v13/code/tests/test_run85_doctor_negative_gates_e2e.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu > "$e/INSTALL_RAW.log" 2>&1
            first=$?
            "$py" -m pip install --disable-pip-version-check --no-input 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
            second=$?
            if [ "$first" = 0 ] && [ "$second" = 0 ]; then
              echo 0 > "$e/INSTALL_EXIT.txt"
              (cd v13/code && timeout --signal=TERM --kill-after=10s 18m env PYTHONPATH=.:tests "$py" -m unittest discover -s tests -p 'test_*.py' -q) > "$e/FULL_RAW.log" 2>&1
              echo "$?" > "$e/FULL_EXIT.txt"
            else
              echo 1 > "$e/INSTALL_EXIT.txt"
              echo SKIPPED_PREREQ_RED > "$e/FULL_RAW.log"; echo SKIPPED_RED > "$e/FULL_EXIT.txt"
            fi
          else
            echo SKIPPED_FOCUSED_RED > "$e/INSTALL_RAW.log"; echo SKIPPED_RED > "$e/INSTALL_EXIT.txt"
            echo SKIPPED_FOCUSED_RED > "$e/FULL_RAW.log"; echo SKIPPED_RED > "$e/FULL_EXIT.txt"
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 2fa443822f99b367d137f0254e69e20268f664e8 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 2fa443822f99b367d137f0254e69e20268f664e8 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - name: Preserve Run85 original raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run85-doctor-negative-gates-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run85/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce Run85 source and negative gates
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run85"
          for n in SOURCE BASE_INSTALL FOCUSED COMPILE INSTALL FULL PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; raw retained; no native/Redmi/age/utility promotion"
              tail -40 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN85_DOCTOR_NEGATIVE_GATES_LINUX_SOFTWARE_ONLY
