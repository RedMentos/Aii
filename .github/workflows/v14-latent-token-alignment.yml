name: V14 latent token-span alignment
on:
  push:
    branches:
      - research-perception/v14-token-span-alignment-20261125-run14
  pull_request:
    branches:
      - gpt6/v13-private-remote-bridge-20261111
      - research-perception/latent-event-scope-20261125-run12
    paths:
      - "v13/code/v13/latent_adapter.py"
      - "v13/code/tests/test_latent_adapter.py"
      - "v13/code/tests/test_latent_tap_adapter.py"
      - "v13/code/tests/test_latent_alignment_audit.py"
      - ".github/workflows/v14-latent-token-alignment.yml"
permissions:
  contents: read
jobs:
  adapter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused adapter test dependencies
        run: python -m pip install pytest==9.2.0 numpy==2.3.5
      - name: Compile adapter and source-audit contracts
        run: python -m py_compile v13/code/v13/latent_adapter.py v13/code/v13/latent_alignment_audit.py v13/code/tests/test_latent_adapter.py v13/code/tests/test_latent_tap_adapter.py v13/code/tests/test_latent_alignment_audit.py
      - name: Test span alignment, adapter fitting, checkpoint, and source audit
        env:
          PYTHONPATH: v13/code
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q v13/code/tests/test_latent_adapter.py v13/code/tests/test_latent_tap_adapter.py v13/code/tests/test_latent_alignment_audit.py
      - name: Scan public diff for private data and secrets
        run: python v13/code/scripts/public_repo_privacy_scan.py --base origin/gpt6/v13-private-remote-bridge-20261111 --head HEAD --no-worktree
