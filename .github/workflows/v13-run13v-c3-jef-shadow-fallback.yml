name: V13 Run13V source-rechecked JEF/C3 SHADOW fallback
on:
  push:
    branches: [assistant/v13-run13v-c3-jef-shadow-fallback-20261030-auto11]
    paths:
      - '.github/workflows/v13-run13v-c3-jef-shadow-fallback.yml'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin source, test source rechecks and receipt fallback with real Store
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run13v-shadow"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          7d7aee0b501fcb7581df39d8588bc9b36f29e36d v13/code/v13/agi/jef_c3_shadow_fallback_run13v.py
          b61dd1eeee8c0da852b2c0dbffbdfa12c0711b5c v13/code/tests/test_jef_c3_shadow_fallback_run13v.py
          67eb2d9d772d45b8b6ea37043ed2a32a84f5cfa8 v13/code/docs/RUN13V_C3_JEF_SHADOW_FALLBACK_PREREG_20261030.md
          887aad1a55faf4b263b49c992a9e61372fce3948 v13/code/v13/agi/jef_c3_shadow_prompt_run13i.py
          82d1f1e2af5bf565f9d5f081844e1da55c88084c v13/code/v13/agi/c3_source_fidelity_shadow_run13m.py
          a8e240f47f25409eeb495d82e2dd0fe47dad0e3d v13/code/scripts/run13k_c3_copy_native.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run13v-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run13v-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_jef_c3_shadow_fallback_run13v tests.test_c3_source_fidelity_shadow_run13m tests.test_jef_c3_shadow_prompt_run13i) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/v13/agi/jef_c3_shadow_fallback_run13v.py v13/code/tests/test_jef_c3_shadow_fallback_run13v.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 64d491f40dcd1b554bdeed6b62fc465ee6c7490d --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 64d491f40dcd1b554bdeed6b62fc465ee6c7490d HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve full original raw including failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run13v-shadow-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run13v-shadow/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce no-waiver source-only candidate gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run13v-shadow"
          for stage in PINS VENV DEPS TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED"; tail -90 "$e/${stage}_RAW.log" || true; exit 1
            fi
          done
          echo 'RUN13V_SOURCE_ONLY_SHADOW_NO_NATIVE_EGRESS_LEARNING_OR_PROMOTION'
