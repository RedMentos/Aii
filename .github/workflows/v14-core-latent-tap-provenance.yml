name: V14 Core latent tap provenance
on:
  push:
    branches:
      - core/v14-latent-tap-provenance-20261122
  pull_request:
    branches:
      - boss/v14-recall-store-pin-rebind-20261122
    paths:
      - "v13/code/v13/cognition.py"
      - "v13/code/v13/contracts.py"
      - "v13/code/v13/runtime_deploy.py"
      - "v13/code/scripts/integrated_latent_tap_provenance_candidate_20261122.py"
      - "v13/code/scripts/termux_runtime_recovery_candidate_20261121.py"
      - "v13/code/scripts/stage_integrated_candidate.py"
      - "v13/code/tests/test_native_taps.py"
      - "v13/code/tests/test_v14_latent_tap_provenance_20261122.py"
      - ".github/workflows/v14-core-latent-tap-provenance.yml"
permissions:
  contents: read
jobs:
  staged-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
      - name: Install focused Runtime test dependencies
        run: python -m pip install pytest==9.2.0 numpy==2.3.5 psutil PyYAML
      - name: Compile the source-pinned tap and deployment chain
        run: |
          python -m py_compile \
            v13/code/v13/cognition.py \
            v13/code/v13/contracts.py \
            v13/code/v13/runtime_deploy.py \
            v13/code/scripts/integrated_latent_tap_provenance_candidate_20261122.py \
            v13/code/scripts/termux_runtime_recovery_candidate_20261121.py \
            v13/code/scripts/stage_integrated_candidate.py \
            v13/code/tests/test_native_taps.py \
            v13/code/tests/test_v14_latent_tap_provenance_20261122.py
      - name: Test native tap identity and staged Runtime provenance
        env:
          PYTHONPATH: v13/code
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -q \
            v13/code/tests/test_native_taps.py \
            v13/code/tests/test_v14_latent_tap_provenance_20261122.py
