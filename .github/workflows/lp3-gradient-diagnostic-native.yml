name: V13 LP3 no-update 350M gradient diagnostic
on:
  push:
    branches: [codex/automation11e-lp3-gradient-diagnostic-20261027]
    paths:
      - '.github/workflows/lp3-gradient-diagnostic-native.yml'
permissions:
  contents: read
concurrency:
  group: v13-native-heavy-lp3-gradient-350m
  cancel-in-progress: false
jobs:
  gradient-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      V13_NO_AUTOSTART: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify prereg before source and install pinned isolated CPU dependencies
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fd3354f59fd84def242a222e4639a6501ff170df HEAD
          python3 -m venv "$RUNNER_TEMP/lp3-grad-venv"
          py="$RUNNER_TEMP/lp3-grad-venv/bin/python"
          "$py" -m pip install --no-input --disable-pip-version-check --timeout 90 --retries 2 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu
          "$py" -m pip install --no-input --disable-pip-version-check --timeout 90 --retries 2 'transformers==5.20.2' 'huggingface_hub==2.3.0'
          "$py" -m pip check
          cd v13/code
          PYTHONPATH=. "$py" -m unittest -v tests.test_lp3_gradient_diagnostic tests.test_lp3_heldout_utility tests.test_lp3_state_prefix
          "$py" -m py_compile scripts/lp3_gradient_diagnostic.py scripts/lp3_heldout_utility.py
      - name: Retrieve exact official master and verify full FP32 hash
        run: |
          set -euo pipefail
          py="$RUNNER_TEMP/lp3-grad-venv/bin/python"
          export MASTER="$RUNNER_TEMP/lp3-grad-master"
          "$py" - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='LiquidAI/LFM2.5-350M',
              revision='120bf032c36dd1273de754669da040dba7ad4982',
              local_dir=os.environ['MASTER'],
              allow_patterns=['*.json','*.jinja','*.safetensors','LICENSE','README.md'])
          PY
          cd v13/code
          PYTHONPATH=. "$py" - <<'PY'
          import os
          from scripts.lp3_real_master_smoke import verify_master
          print('EXACT_MASTER_SHA_PASS',verify_master(os.environ['MASTER']))
          PY
      - name: Measure eight single-row gradients and original two-row comparator, no optimizer
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/lp3-grad-evidence"
          cd v13/code
          export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
          timeout --signal=TERM --kill-after=15s 15m \
            env PYTHONPATH=. "$RUNNER_TEMP/lp3-grad-venv/bin/python" scripts/lp3_gradient_diagnostic.py \
              --master "$RUNNER_TEMP/lp3-grad-master" \
              --out "$RUNNER_TEMP/lp3-grad-evidence/RESULT.json" --execute-native \
              > "$RUNNER_TEMP/lp3-grad-evidence/NATIVE_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/lp3-grad-evidence/NATIVE_EXIT.txt"
          cat "$RUNNER_TEMP/lp3-grad-evidence/NATIVE_RAW.log"
          exit 0
      - name: Close source, prereg, privacy and diff receipts
        if: always()
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/lp3-grad-evidence"
          test -f "$RUNNER_TEMP/lp3-grad-evidence/NATIVE_EXIT.txt" || echo 'NOT_RUN' > "$RUNNER_TEMP/lp3-grad-evidence/NATIVE_EXIT.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/lp3-grad-evidence/HEAD.txt"
          git hash-object v13/code/scripts/lp3_gradient_diagnostic.py > "$RUNNER_TEMP/lp3-grad-evidence/SCRIPT_BLOB.txt"
          git hash-object v13/code/docs/proofs/continuation-20261027/lp3-gradient-diagnostic/PREREG.md > "$RUNNER_TEMP/lp3-grad-evidence/PREREG_BLOB.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base afbc0818b1080c11ac78cca3df5eeb6cd7b081b4 --head HEAD > "$RUNNER_TEMP/lp3-grad-evidence/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/lp3-grad-evidence/PRIVACY_EXIT.txt"
          git diff --check afbc0818b1080c11ac78cca3df5eeb6cd7b081b4 HEAD > "$RUNNER_TEMP/lp3-grad-evidence/DIFF_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/lp3-grad-evidence/DIFF_EXIT.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lp3-gradient-diagnostic-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/lp3-grad-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce genuine exits without utility or Age claims
        if: always()
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/lp3-grad-evidence"
          test "$(cat "$evidence/NATIVE_EXIT.txt")" = 0
          test "$(cat "$evidence/PRIVACY_EXIT.txt")" = 0
          test "$(cat "$evidence/DIFF_EXIT.txt")" = 0
          "$RUNNER_TEMP/lp3-grad-venv/bin/python" - "$evidence/RESULT.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='LP3_GRADIENT_DIAGNOSTIC_COMPLETE'
          assert d['optimizer_updates']==0
          assert len(d['six_train_prompt_gradients'])==6
          assert len(d['two_compatibility_single_prompt_gradients'])==2
          assert d['utility_proven'] is False and d['jepa_weight']==0
          assert d['age_authority']==0 and d['redmi_measured'] is False
          print('LP3_GRADIENT_DIAGNOSTIC_ONLY_NO_UTILITY_OR_AGE_PROMOTION')
          PY
