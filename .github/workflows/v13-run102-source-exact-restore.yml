name: V13 Run102 source-exact pending restore recovery software acceptance
on:
  push:
    branches: [assistant/v13-run102-source-exact-restore-20261029]
permissions:
  contents: read
concurrency:
  group: v13-run102-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source_exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Exact-source deterministic answer software proof and original raw evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run102"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          source_ok=0
          check() {
            observed="$(git hash-object "$2" 2>/dev/null)" || return 1
            printf '%s %s\n' "$observed" "$2" >> "$e/SOURCE_RAW.log"
            [ "$observed" = "$1" ]
          }
          check 5a569e81fa329bf80908b97bc90205b196ced095 v13/code/docs/proofs/continuation-20261028/RUN102_SOURCE_EXACT_RESTORE_PREREG.md || source_ok=1
          check 957c63a6286572ff1a396be9ec9e000e7656af8f v13/code/scripts/source_exact.py || source_ok=1
          check 8d3ba898f4242a2fedb9d0ec6f2cdcdff0e41df5 v13/code/tests/test_run102_source_exact_restore.py || source_ok=1
          check 409c4e13ba0754364d708e4dbe803bd740954b69 v13/code/v13/backup.py || source_ok=1
          check 0779d986fb8aee8aa01c5df5f656889d4bd56348 v13/code/v13/store.py || source_ok=1
          check 75ca7f3f197665f665d9582b7f5c2efb1f598235 v13/code/scripts/ask_verified_budget.py || source_ok=1
          check 4b73842be25e784f70ade4f6c4ced3fe2dcb9eab v13/code/v13/source_consumer.py || source_ok=1
          check 53dc948d0d360f94743ad996eb83ea0e85c2dd0b v13/code/v13/memory.py || source_ok=1
          check 68e7ed1352800174972558f1e0b0683a42c8689a v13/code/v13/runtime.py || source_ok=1
          check 218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md || source_ok=1
          echo "$source_ok" > "$e/SOURCE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run102-venv"
          py="$RUNNER_TEMP/v13-run102-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          base_rc="$?"
          if [ "$base_rc" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
            torch_rc="$?"
            if [ "$torch_rc" = 0 ]; then
              "$py" -m pip install --disable-pip-version-check --no-input 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
              deps_rc="$?"
            else
              deps_rc=1
            fi
          else
            deps_rc=1
          fi
          echo "$deps_rc" > "$e/INSTALL_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/source_exact.py v13/code/tests/test_run102_source_exact_restore.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$source_ok" = 0 ] && [ "$deps_rc" = 0 ] && [ "$(cat "$e/COMPILE_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 180s "$py" -m unittest -v tests.test_run102_source_exact_restore tests.test_run97_source_exact_answer tests.test_ask_verified_budget tests.test_source_consumer_recall_integration tests.test_verified_operator_preflight) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
            (cd v13/code && timeout --signal=TERM --kill-after=10s 18m "$py" -m unittest discover -s tests -p 'test_*.py') > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else
            echo SKIPPED_PREREQ_RED > "$e/FOCUSED_RAW.log"; echo SKIPPED_RED > "$e/FOCUSED_EXIT.txt"
            echo SKIPPED_PREREQ_RED > "$e/FULL_RAW.log"; echo SKIPPED_RED > "$e/FULL_EXIT.txt"
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 8dcec32c4da3c992ebca9d038fabba3009bdda8b --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 8dcec32c4da3c992ebca9d038fabba3009bdda8b HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - name: Preserve original Run102 source-exact software evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run102-source-exact-restore-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run102/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce source, tests and privacy without native promotion
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run102"
          for n in SOURCE INSTALL COMPILE FOCUSED FULL PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; raw retained; no gate promotion"
              tail -40 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN102_SOURCE_EXACT_RESTORE_SOFTWARE_ONLY
