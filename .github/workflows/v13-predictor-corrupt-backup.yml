name: V13 predictor corrupt backup rollback QA
on:
  pull_request:
    paths:
      - 'v13/code/v13/continuous_predictor.py'
      - 'v13/code/tests/test_online_predictor_corrupt_backup.py'
      - '.github/workflows/v13-predictor-corrupt-backup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rollback-corrupt-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3'
      - name: Run malformed backup rollback regression
        working-directory: v13/code
        run: python -m unittest -v tests.test_online_predictor_corrupt_backup tests.test_online_predictor_publish_fault
