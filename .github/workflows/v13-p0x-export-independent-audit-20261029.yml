name: V13 P0X independent exported source integrity audit
on:
  push:
    branches: [codex/v13-p0x-independent-export-audit-20261029]
    paths:
      - '.github/workflows/v13-p0x-export-independent-audit-20261029.yml'
      - 'v13/code/scripts/p0x_export_independent_verify.py'
      - 'v13/code/tests/test_p0x_export_independent_verify.py'
      - 'v13/code/docs/proofs/continuation-20261029/P0X_EXPORT_INDEPENDENT_AUDIT_BUILD_STATE.json'
permissions:
  contents: read
concurrency:
  group: v13-p0x-independent-export-audit
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Independently validate export, negative gates, and privacy
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-p0x-export-independent"
          mkdir -p "$e"
          trap '(cd "$e"; find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)' EXIT
          git rev-parse HEAD > "$e/HEAD.txt"
          {
            test "$(git hash-object v13/code/scripts/p0x_independent_source_holdout.py)" = 7ec4e877ad5ea3eed1c60102dac3baa15391dd2b
            test "$(git hash-object v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md)" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
            test "$(git hash-object v13/code/docs/proofs/continuation-20261029/P0X_150_SOURCE_HOLDOUT_PREREG.md)" = 312f8cb0acd591fe9c17a3e87a299f21d92465fd
            git merge-base --is-ancestor cd2d1d76c08a8b4f09f83b99d33e8effab140d26 HEAD
            echo P0X_PINNED_PARENT_OK
          } > "$e/PINS_RAW.log" 2>&1
          python3 -m compileall -q v13/code/scripts/p0x_export_independent_verify.py v13/code/tests/test_p0x_export_independent_verify.py > "$e/COMPILE_RAW.log" 2>&1
          (cd v13/code && timeout --signal=TERM --kill-after=5s 120s python3 -m unittest -v tests.test_p0x_export_independent_verify tests.test_p0x_independent_source_holdout) > "$e/TESTS_RAW.log" 2>&1
          (cd v13/code && python3 -m scripts.p0x_independent_source_holdout --out "$e/export" --fixture-sha256 ab03aba600e8085b02247657cc5fb718195e89a83641ef69ad006a27c776647e) > "$e/EXPORT_RAW.json" 2>&1
          (cd v13/code && python3 -m scripts.p0x_export_independent_verify --directory "$e/export" --fixture-sha256 ab03aba600e8085b02247657cc5fb718195e89a83641ef69ad006a27c776647e) > "$e/VERIFY_RAW.json" 2>&1
          python3 v13/code/scripts/public_repo_privacy_scan.py --base cd2d1d76c08a8b4f09f83b99d33e8effab140d26 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          grep -q CLEAN "$e/PRIVACY_RAW.log"
          git diff --check cd2d1d76c08a8b4f09f83b99d33e8effab140d26 HEAD
          echo P0X_EXPORT_INDEPENDENT_SOFTWARE_ONLY_NO_NATIVE_NO_GATE > "$e/STATUS.txt"
      - name: Retain closed raw including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-p0x-independent-export-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-p0x-export-independent/
          if-no-files-found: error
          retention-days: 30
