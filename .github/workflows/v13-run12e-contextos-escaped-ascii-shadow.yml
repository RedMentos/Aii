name: V13 Run12E Context OS escaped ASCII quote SHADOW source-only
on:
  push:
    branches: [assistant/v13-run12e-contextos-escaped-ascii-shadow-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run12e-contextos-escaped-ascii-shadow.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Source-bound literal preservation regression and original raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run12e-contextos"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          660155b61275623ad545a03dae7bca0157046215 v13/code/v13/context_os_escaped_ascii_shadow_run12e.py
          1a469be44e2a7e6b9f9f5b827ac4787059191060 v13/code/tests/test_contextos_escaped_ascii_shadow_run12e.py
          c515e9a432a1d912dab9cb551f74bb5f47d2e184 v13/code/v13/context_os.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          (cd v13/code && PYTHONPATH=.:tests timeout --signal=TERM --kill-after=5s 120s python3 -m unittest -v tests.test_contextos_escaped_ascii_shadow_run12e tests.test_contextos_typographic_quotes_run11i tests.test_context_os_singlequote_exact_20261029 tests.test_context_os_unclosed_code_20261029) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m py_compile v13/code/v13/context_os_escaped_ascii_shadow_run12e.py v13/code/tests/test_contextos_escaped_ascii_shadow_run12e.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 352cf805ae8250252ebdf75ccc604cb502be6238 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 352cf805ae8250252ebdf75ccc604cb502be6238 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw on RED or GREEN
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run12e-contextos-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run12e-contextos/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce source-only no production activation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run12e-contextos"
          for stage in PINS TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "${stage} RED; raw preserved"
              tail -100 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo "RUN12E_CONTEXTOS_SHADOW_ONLY_NO_RUNTIME_CHANGE"
