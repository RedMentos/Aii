name: V13 Run14H AG12 suite identity test-first RED
on:
  push:
    branches: [assistant/v13-run14h-ag12-suite-identity-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run14h-ag12-suite.yml'
permissions:
  contents: read
jobs:
  ag12-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact-source original AG12 suite rotation regression
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run14h-suite"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          2b65c8f4b9a63a9207412e4939ac121c4124d9a4 v13/code/v13/agi/generality.py
          692fd80fb9c53e4f4a9b9053f3e27ce16f526d73 v13/code/tests/test_ag12_suite_identity_run14h.py
          ea859b66fe856580d1562f0a7dd262cc88e9559b v13/code/docs/RUN14H_AG12_SUITE_IDENTITY_PREREG_20261030.md
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=. python3 -m unittest -v tests.test_ag12_suite_identity_run14h tests.test_ag12_export_isolation_run14g tests.test_ag12_language_isolation_run14f tests.test_growth.G12Eval) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m py_compile v13/code/v13/agi/generality.py v13/code/tests/test_ag12_suite_identity_run14h.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 658dd1b6caf8eeed44e808973df66a5023c0af7b --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 658dd1b6caf8eeed44e808973df66a5023c0af7b HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve candidate raw even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run14h-suite-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run14h-suite/
          retention-days: 30
          if-no-files-found: error
      - name: Explicit test-first RED expected; pins and hygiene must pass
        if: always()
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run14h-suite"
          for stage in PINS COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            test "$(cat "$e/${stage}_EXIT.txt")" = 0
          done
          echo "TEST $(cat "$e/TEST_EXIT.txt")"
          test "$(cat "$e/TEST_EXIT.txt")" != 0
