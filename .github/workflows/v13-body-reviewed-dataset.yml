name: V13 reviewed B1 B2 dataset
on:
  push:
    branches:
      - codex/v13-reviewed-body-datasets-20261110-hour12
  pull_request:
    paths:
      - 'v13/code/v13/agi/body_dataset.py'
      - 'v13/code/tests/test_body_reviewed_dataset.py'
      - '.github/workflows/v13-body-reviewed-dataset.yml'
jobs:
  review-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: PYTHONPATH=v13/code python -m pytest -q v13/code/tests/test_body_reviewed_dataset.py
      - run: python -m compileall -q v13/code/v13/agi/body_dataset.py
