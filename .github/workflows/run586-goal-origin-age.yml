name: V13 Run586 AG3 goal origin and Age wake proof
on:
  push:
    branches:
      - codex/automation11-run586-goal-origin-age-20261026
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/run586-goal-origin-age.yml'
      - 'v13/code/v13/agi/goals.py'
      - 'v13/code/tests/test_run586_goal_origin_age.py'
      - 'v13/code/docs/proofs/continuation-20261026/run586-goal-origin-age/**'
permissions:
  contents: read
jobs:
  goal-origin-age:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.ref == 'codex/automation11-run586-goal-origin-age-20261026' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 100
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install isolated model-free test dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'prompt_toolkit==3.0.52'
      - name: Execute origin, scope, and AG3 scheduler software regressions
        shell: bash
        run: |
          mkdir -p run586-raw
          git rev-parse HEAD > run586-raw/source_head.txt
          sha256sum v13/code/v13/agi/goals.py v13/code/tests/test_run586_goal_origin_age.py v13/code/docs/proofs/continuation-20261026/run586-goal-origin-age/PREREG.md > run586-raw/source_sha256.txt
          set +e
          (cd v13/code && python -m unittest discover -s tests -p test_run586_goal_origin_age.py -v) > run586-raw/new-tests.log 2>&1
          echo "$?" > run586-raw/new-tests.exit
          (cd v13/code && python -m unittest discover -s tests -p test_run585_goal_wake_scope.py -v && python -m unittest discover -s tests -p test_growth.py -v) > run586-raw/regressions.log 2>&1
          echo "$?" > run586-raw/regressions.exit
          python -m compileall -q v13/code/v13/agi/goals.py v13/code/tests/test_run586_goal_origin_age.py > run586-raw/compile.log 2>&1
          echo "$?" > run586-raw/compile.exit
          python v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha || 'f0171ac0e990768bbd3b60c1efe49242f2e50418' }}" --head "${{ github.event.pull_request.head.sha || github.sha }}" --no-worktree > run586-raw/privacy.log 2>&1
          echo "$?" > run586-raw/privacy.exit
          set -e
          cat run586-raw/new-tests.log
          cat run586-raw/regressions.log
          cat run586-raw/privacy.log
      - name: Close SHA manifest even on failure
        if: always()
        shell: bash
        run: |
          mkdir -p run586-raw
          (cd run586-raw && sha256sum *.txt *.log *.exit > RAW_SHA256SUMS.txt)
          cat run586-raw/RAW_SHA256SUMS.txt
      - name: Preserve raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run586-goal-origin-age-raw
          path: run586-raw/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce all software checks
        shell: bash
        run: |
          test "$(cat run586-raw/new-tests.exit)" = 0
          test "$(cat run586-raw/regressions.exit)" = 0
          test "$(cat run586-raw/compile.exit)" = 0
          test "$(cat run586-raw/privacy.exit)" = 0
