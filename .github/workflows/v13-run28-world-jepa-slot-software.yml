name: V13 Run28 slot-shared World JEPA SHADOW candidate software preflight
on:
  push:
    branches: [assistant/v13-run28-world-jepa-slot-candidate-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run28-world-jepa-slot-software.yml'
permissions:
  contents: read
jobs:
  slot-candidate-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin original Z12b and new SHADOW candidate, run software only
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run28-slot-software"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          14a641750ef65ea291897c1e0e2f24aa094f24ec v13/code/docs/WORLD_JEPA_SLOT_COMPOSITION_PREREG_RUN28_20261030.md
          7a1156c24f2a7863555da579a6b1d0ca80c1edaf v13/code/v13/world_jepa_slot_candidate.py
          fe8e605bc56262e59b8871747fa968f66d88b61b v13/code/tests/test_world_jepa_slot_candidate_run28.py
          9cad5e592455f44527528e37eccff14286dcef1b v13/code/scripts/run28_world_jepa_slot_real.py
          e69d08fc64a7661746938159ae2227332cc5dd2d v13/code/tests/test_run28_world_jepa_slot_real.py
          99a686a131a1bdc89efe0d0cf9610ec54cbd853b v13/code/v13/world_jepa.py
          2fd1366dc1b6d8c02803ee3254020f70e5bf3eb4 v13/code/scripts/z12b_world_jepa.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run28-slot-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run28-slot-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 8m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_world_jepa_slot_candidate_run28 tests.test_run28_world_jepa_slot_real tests.test_world_jepa tests.test_world_jepa_fit_input_guard tests.test_world_jepa_action_permutation_control tests.test_world_jepa_atomic_fit) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PIN_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/v13/world_jepa_slot_candidate.py v13/code/tests/test_world_jepa_slot_candidate_run28.py v13/code/scripts/run28_world_jepa_slot_real.py v13/code/tests/test_run28_world_jepa_slot_real.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 740b376132405d77923d53400b59c5e0cee0cc96 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 740b376132405d77923d53400b59c5e0cee0cc96 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original software raw, no heavy fit or native
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run28-slot-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run28-slot-software/
          retention-days: 30
          if-no-files-found: error
      - name: Require software preflight only, never learning gate promotion
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run28-slot-software"
          for stage in PINS VENV DEPS TEST COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              tail -80 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
          echo 'RUN28_SLOT_SHARED_JEPA_SOFTWARE_ONLY_NO_WORLD_GATE_OR_NATIVE_PROOF'
