name: V13 JEF human F1/F5 two-source SHADOW admission
on:
  push:
    branches: [assistant/v13-jef-f1f5-source-admission-20261029]
    paths:
      - '.github/workflows/v13-jef-f1f5-source-admission-20261029.yml'
      - 'v13/code/v13/jef_f1f5_source_admission.py'
      - 'v13/code/tests/test_jef_f1f5_source_admission.py'
      - 'v13/code/docs/proofs/continuation-20261029/JEF_F1F5_*'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact human F1/F5 source admission and real Store adversarial tests
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-jef-f1f5-source"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          b1a0c280bd102ce960c3d323798b40e36af4de13 v13/code/docs/proofs/continuation-20261029/JEF_F1F5_SOURCE_ADMISSION_PREREG.md
          e417c3bb4afa34a226aa116752df8c10d659a113 v13/code/v13/jef_f1f5_source_admission.py
          734f311858d94d5b65da96fbce10242604890e1e v13/code/tests/test_jef_f1f5_source_admission.py
          7cfae3d54e49718181813cea68238301e2ffae87 v13/code/v13/jef_typed_source_shadow.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          source_red=0
          : > "$e/SOURCE_RAW.log"
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/SOURCE_RAW.log"
            if [ "$want" != "$got" ]; then source_red=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$source_red" > "$e/SOURCE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-jef-f1f5-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-jef-f1f5-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
          else echo SKIPPED > "$e/DEPS_EXIT.txt"; echo SKIPPED > "$e/PIP_CHECK_EXIT.txt"; fi
          if [ "$source_red" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ] && [ "$(cat "$e/PIP_CHECK_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_jef_typed_source_shadow tests.test_jef_f1f5_source_admission) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PREREQ_RED > "$e/TEST_RAW.log"; echo SKIPPED > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/v13/jef_f1f5_source_admission.py v13/code/tests/test_jef_f1f5_source_admission.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base bf121ae56164a6a77a186dd8456e935e7bb389f9 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check bf121ae56164a6a77a186dd8456e935e7bb389f9 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original human F1/F5 source evidence including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-jef-f1f5-source-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-jef-f1f5-source/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce F1/F5 lineage tests with no authority promotion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-jef-f1f5-source"
          for stage in SOURCE VENV DEPS PIP_CHECK TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED, original raw retained"
              tail -55 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'JEF_F1F5_HUMAN_SOURCE_SHADOW_NO_NATIVE_NO_GATE'
