name: V13 Run134 answer-visible arithmetic SHADOW candidate
on:
  pull_request:
    paths:
      - ".github/workflows/v13-run134-age0d-arithmetic.yml"
      - "v13/code/v13/agi/answer_arithmetic_shadow.py"
      - "v13/code/tests/test_age0d_answer_arithmetic_run134.py"
      - "v13/code/docs/proofs/continuation-20261025/age0d-answer-arithmetic-run134/**"
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Official privacy scan
        run: |
          set -euo pipefail
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "$(git rev-parse HEAD^1)" --head HEAD --no-worktree
  software:
    needs: privacy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Frozen Runtime guard and isolated candidate tests
        run: |
          set -euo pipefail
          test "$(git hash-object v13/code/v13/runtime.py)" = a691d27bd0772a4fa1f03d57ec90663237bf6825
          python3 -m compileall -q v13/code/v13/agi/answer_arithmetic_shadow.py v13/code/tests/test_age0d_answer_arithmetic_run134.py
          cd v13/code
          PYTHONPATH=. python3 -m unittest -v tests.test_age0d_answer_arithmetic_run134
