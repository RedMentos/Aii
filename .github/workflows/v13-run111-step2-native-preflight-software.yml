name: V13 Run111 source-pinned STEP2 CQP DQP CQ reversible preflight (no native)
on:
  push:
    branches: [assistant/v13-run111-step2-fresh-native-preflight-20261029]
permissions:
  contents: read
concurrency:
  group: v13-run111-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixture_acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Exact-source checks, deterministic fixtures, focused and full tests
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run111"
          mkdir -p "$e/experiment"
          git rev-parse HEAD > "$e/HEAD.txt"
          source_ok=0
          check() {
            observed="$(git hash-object "$2" 2>/dev/null)" || return 1
            printf '%s %s\n' "$observed" "$2" >> "$e/SOURCE_RAW.log"
            [ "$observed" = "$1" ]
          }
          check 87008e8ca85cf9f54d7f6a7fe44f77d8e4d25cda v13/code/docs/proofs/continuation-20261028/RUN111_FRESH_STEP2_NATIVE_PREFLIGHT_PREREG.md || source_ok=1
          check 468d2bc72a5584fc6e5c67292968feb3a4125c07 v13/code/scripts/run111_step2_fresh_native_preflight.py || source_ok=1
          check eb3777be2458b47774858f3bb536aa8027cf1cad v13/code/tests/test_run111_step2_fresh_native_preflight.py || source_ok=1
          check 2ad62fbbf1f6463d99360cdb8198f1104cfdfaf7 v13/code/scripts/step2_z2_timescale.py || source_ok=1
          check 218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md || source_ok=1
          check e006147f794a97d85aa0ad73aa829f314a9b8897 v13/code/docs/proofs/continuation-20261028/RUN111_FIXED_FIXTURE_SHA_AMENDMENT.md || source_ok=1
          check 7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json || source_ok=1
          check 6cc3d52524e8c9122710eae2a908d024f0f44f24 v13/code/scripts/run109_step2_fresh_fixtures.py || source_ok=1
          echo "$source_ok" > "$e/SOURCE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run111-venv"
          py="$RUNNER_TEMP/v13-run111-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          deps_rc="$?"
          if [ "$deps_rc" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
            deps_rc="$?"
          fi
          if [ "$deps_rc" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
            deps_rc="$?"
          fi
          echo "$deps_rc" > "$e/INSTALL_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/run111_step2_fresh_native_preflight.py v13/code/tests/test_run111_step2_fresh_native_preflight.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$source_ok" = 0 ] && [ "$deps_rc" = 0 ] && [ "$(cat "$e/COMPILE_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 180s "$py" -m scripts.run111_step2_fresh_native_preflight --dry-run --out "$e/experiment/run111-report.json") > "$e/PROBE_RAW.log" 2>&1
            echo "$?" > "$e/PROBE_EXIT.txt"
            (cd v13/code && timeout --signal=TERM --kill-after=5s 180s "$py" -m unittest -v tests.test_run111_step2_fresh_native_preflight tests.test_run109_step2_fresh_fixtures tests.test_step2_z2) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
            (cd v13/code && timeout --signal=TERM --kill-after=10s 18m "$py" -m unittest discover -s tests -p 'test_*.py') > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else
            for n in PROBE FOCUSED FULL; do echo SKIPPED_PREREQ_RED > "$e/${n}_RAW.log"; echo SKIPPED_RED > "$e/${n}_EXIT.txt"; done
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base f918ce2c2474678c99f44f8816fec27909c0d604 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check f918ce2c2474678c99f44f8816fec27909c0d604 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - name: Preserve original Run110 raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run111-step2-preflight-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run111/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce software-only acceptance without gate promotion
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run111"
          for n in SOURCE INSTALL COMPILE PROBE FOCUSED FULL PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; original raw retained; STEP2 remains UTILITY_FAIL"
              tail -40 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN111_REVERSIBLE_PREFLIGHT_SOFTWARE_ONLY_NO_NATIVE_NO_GATE_PROMOTION
