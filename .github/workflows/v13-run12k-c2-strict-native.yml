name: V13 Run12K pinned C2 strict native compatibility four prompts
on:
  push:
    branches: [assistant/v13-run12k-c2-strict-native-compatibility-20261030]
    paths:
      - '.github/workflows/v13-run12k-c2-strict-native.yml'
permissions:
  contents: read
concurrency:
  group: v13-step2-budget-paired-native-20261030
  cancel-in-progress: false
jobs:
  c2-strict-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned source, software prereg, serial native C2, closed original raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run12k-c2"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          59f31e1ba1a964b1f8674393abdd60f68cb9f6a8 v13/code/docs/C2_STRICT_NATIVE_COMPAT_RUN12K_PREREG_20261030.md
          cee1980787f1217e9a7aa2a1f180686b4add67fb v13/code/scripts/c2_strict_native_compat_run12k.py
          fe9084c872be32ba260b3554b4a73708a0c048a7 v13/code/tests/test_c2_strict_native_compat_run12k.py
          22ed11e4a53d9eeae8fbc74a1753082b5785be2b v13/code/v13/runtime.py
          fb34dba97ae3700ba5accdcb928bfb72afcf4fcb v13/code/scripts/c2_native_route_provenance_20261030.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          954a3f468f10195fbce12d27f68585ee7edee2c9 v13/code/specs/control_tools.json
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run12k-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run12k-venv/bin/python"
          "$py" -m pip install --no-input --disable-pip-version-check --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts timeout --signal=TERM --kill-after=5s 180s "$py" -m unittest -v tests.test_c2_strict_native_compat_run12k tests.test_c2_route_runtime_strict_run12j) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else
            echo SKIPPED_PINS_OR_DEPS_RED > "$e/TEST_RAW.log"
            echo 99 > "$e/TEST_EXIT.txt"
          fi
          export V13_HOME="$RUNNER_TEMP/v13-run12k-installed"
          if [ "$(cat "$e/TEST_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 8m env PYTHONPATH=v13/code "$py" - <<'PY' > "$e/INSTALL_RAW.log" 2>&1
          import os
          from pathlib import Path
          from v13.config import initialize
          from v13.models import ModelManager
          from v13.bootstrap import install_native
          home=Path(os.environ['V13_HOME'])
          initialize(home)
          ModelManager(home).install('needle')
          install_native(home)
          print('PINNED_NEEDLE_ONLY_NATIVE_WORKER_INSTALLED')
          PY
            echo "$?" > "$e/INSTALL_EXIT.txt"
          else
            echo SKIPPED_TEST_RED > "$e/INSTALL_RAW.log"
            echo 99 > "$e/INSTALL_EXIT.txt"
          fi
          if [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=10s 8m env PYTHONPATH=v13/code "$py" v13/code/scripts/c2_strict_native_compat_run12k.py --home "$V13_HOME" --out "$e/pilot" > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else
            echo SKIPPED_INSTALL_RED > "$e/NATIVE_RAW.log"
            echo 99 > "$e/NATIVE_EXIT.txt"
          fi
          if [ -f "$e/pilot/report.json" ]; then
            PYTHONPATH=v13/code "$py" - "$e/pilot" > "$e/REPORT_CHECK_RAW.log" 2>&1 <<'PY'
          import json,sys
          from pathlib import Path
          from scripts.c2_strict_native_compat_run12k import PROMPTS,PROMPT_SHA256,SCHEMA,classify
          p=Path(sys.argv[1]);j=json.loads((p/'report.json').read_text())
          assert j['schema']==SCHEMA and j['seed']==43
          assert j['prompt_sha256']==PROMPT_SHA256 and j['prompts']==list(PROMPTS)
          assert j['expected_scaffolds']==['simple','simple','detail','gist']
          assert j['needle_model_sha256']=='c9d915eca282ed42d1a09b143b592adb4cc6744ffe2d294adf5cfc5548170c38'
          assert j['needle_model_verified']=={'ok':True,'hash_checked':True}
          assert len(j['rows'])==4
          for i,row in enumerate(j['rows']):
              assert row['index']==i and row['prompt']==PROMPTS[i]
              if 'route_info' not in row:
                  print('ROW_RED',i,row.get('error_type'),row.get('error'))
                  continue
              raw=json.loads((p/'raw'/f'{i:02d}_C2_ROUTE.json').read_text())
              strict=json.loads((p/'raw'/f'{i:02d}_STRICT_ADMISSION.json').read_text())
              assert row['strict_admission']==strict==classify(raw)
              assert row['source_exact'] is True
              assert row['no_live_answer'] is True and row['c3_called'] is False and row['body_called'] is False
              assert row['jepa_weight']==0
              assert row['context_packet']['event_id']==row['event_id']
              assert row['context_packet']['session_id']==row['session_id']
              assert row['context_packet']['query_ref']==row['source_ref']
          for key in ('native_route_utility_proven','c3_called','body_called','step2_gate_promoted','b3_promoted','body_jepa_available','redmi_measured','whole_system_complete'):
              assert j[key] is False,key
          assert j['learning_mode']=='RECORD_ONLY' and j['jepa_weight']==0
          print('NATIVE_C2_PROVEN',j['native_c2_proven'],'STRICT_COMPATIBILITY',j['strict_compatibility'],'SIMPLE_ADMITTED',j.get('simple_admitted'))
          assert j['native_c2_proven'] is True
          assert j['strict_compatibility'] is True
          PY
            echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          else
            echo NO_NATIVE_REPORT > "$e/REPORT_CHECK_RAW.log"
            echo 99 > "$e/REPORT_CHECK_EXIT.txt"
          fi
          "$py" -m py_compile v13/code/scripts/c2_strict_native_compat_run12k.py v13/code/tests/test_c2_strict_native_compat_run12k.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 05d70bbace6fa242577e7019aa477a51e7a100c5 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 05d70bbace6fa242577e7019aa477a51e7a100c5 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original native raw on RED or GREEN
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run12k-c2-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run12k-c2/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce strict native compatibility without gate promotion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run12k-c2"
          for stage in PINS VENV DEPS TEST INSTALL NATIVE REPORT_CHECK COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "${stage} RED; original raw preserved; no compatibility PASS"
              tail -80 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo "RUN12K_LINUX_NATIVE_C2_STRICT_COMPAT_ONLY_NO_STEP2_B3_JEPA_REDMI_AGE_OR_UTILITY_GATE"
