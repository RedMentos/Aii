name: V13 BP2b independent adapter artifact integrity review
on:
  push:
    branches: [assistant/v13-bp2b-adapter-integrity-20261027]
    paths:
      - '.github/workflows/bp2b-adapter-integrity-review.yml'
      - 'v13/code/scripts/bp2b_native_runner.py'
      - 'v13/code/tests/test_bp2b_native_runner.py'
      - 'v13/code/docs/proofs/continuation-20261027/bp2b-adapter-integrity/**'
permissions:
  contents: read
concurrency:
  group: v13-bp2b-native-runner-${{ github.ref }}
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Isolated source-only prerequisites
        run: |
          set -euo pipefail
          python3 -m venv --system-site-packages "$RUNNER_TEMP/bp2b-adapter-integrity-venv"
          "$RUNNER_TEMP/bp2b-adapter-integrity-venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5'
      - name: Capture fake orchestration, dry-run plans, compile and privacy
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/bp2b-adapter-integrity"
          git rev-parse HEAD > "$RUNNER_TEMP/bp2b-adapter-integrity/HEAD.txt"
          git hash-object v13/code/scripts/bp2b_native_runner.py > "$RUNNER_TEMP/bp2b-adapter-integrity/RUNNER_BLOB.txt"
          (cd v13/code && PYTHONPATH="$PWD" "$RUNNER_TEMP/bp2b-adapter-integrity-venv/bin/python" -m unittest -v tests.test_bp2b_native_runner tests.test_bp2b_transfer_score) > "$RUNNER_TEMP/bp2b-adapter-integrity/UNIT_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp2b-adapter-integrity/UNIT_EXIT.txt"
          for arm in legacy bp2b bp2b_minor manual_ref; do
            PYTHONPATH=v13/code "$RUNNER_TEMP/bp2b-adapter-integrity-venv/bin/python" v13/code/scripts/bp2b_native_runner.py --seed 41 --arm "$arm" --out "$RUNNER_TEMP/bp2b-adapter-integrity/dry" --dry-run
          done > "$RUNNER_TEMP/bp2b-adapter-integrity/DRY_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp2b-adapter-integrity/DRY_EXIT.txt"
          "$RUNNER_TEMP/bp2b-adapter-integrity-venv/bin/python" -m compileall -q v13/code/scripts/bp2b_native_runner.py v13/code/tests/test_bp2b_native_runner.py > "$RUNNER_TEMP/bp2b-adapter-integrity/COMPILE_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp2b-adapter-integrity/COMPILE_EXIT.txt"
          "$RUNNER_TEMP/bp2b-adapter-integrity-venv/bin/python" v13/code/scripts/public_repo_privacy_scan.py --base 4d6e468f3a8ca30668063e85d6d8c06eb8f24f7a --head HEAD > "$RUNNER_TEMP/bp2b-adapter-integrity/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp2b-adapter-integrity/PRIVACY_EXIT.txt"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bp2b-adapter-integrity-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/bp2b-adapter-integrity/
          if-no-files-found: error
      - name: Enforce software-only gates
        run: |
          set -euo pipefail
          for n in UNIT DRY COMPILE PRIVACY; do
            test "$(cat "$RUNNER_TEMP/bp2b-adapter-integrity/${n}_EXIT.txt")" = 0 || {
              tail -100 "$RUNNER_TEMP/bp2b-adapter-integrity/${n}_RAW.log"; exit 1;
            }
          done
          echo "BP2B_ADAPTER_INTEGRITY_SOFTWARE_ONLY_NO_NATIVE_PROOF"
