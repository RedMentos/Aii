name: V13 Run69 JEF C3 schema source-recheck adapter software
on:
  push:
    branches: [codex/jef-c3-schema-source-recheck-adapter-20261031-auto11]
    paths: ['.github/workflows/v13-run69-jef-c3-schema-adapter-software.yml']
permissions:
  contents: read
concurrency:
  group: v13-run69-jef-schema-adapter-software
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned real Store tests and source/JSON negative controls
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run69-adapter"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          fc80a53eb78ca831bc064d5e38d1059dd5a8d9b5 v13/code/docs/JEF_C3_SCHEMA_SOURCE_RECHECK_ADAPTER_PLAN_20261031.md
          18aaaa86f416a1df9a703b86b9d12215ad1c00c5 v13/code/v13/jef_c3_schema_source_recheck_shadow.py
          c47a6ea2ef47e01b43c6320c60de1280e33607bf v13/code/tests/test_jef_c3_schema_source_recheck_shadow.py
          3b6b79c7eded3b812d27fb594ceda9afd3fd9464 v13/code/scripts/jef_c3_schema_fixture_727.py
          e94d70be7ec5f4666392a50ea17f813bd92c0879 v13/code/v13/jef_c3_typed_envelope_candidate.py
          7cfae3d54e49718181813cea68238301e2ffae87 v13/code/v13/jef_typed_source_shadow.py
          d31c93c438f3e15f435b60603866713005c59f93 v13/code/scripts/jef_c3_c5_c6_operator_cli.py
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run69-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run69-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=5s 6m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m unittest discover -s v13/code/tests -p 'test_jef_c3_schema_source_recheck_shadow.py' -v > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo PINS_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/v13/jef_c3_schema_source_recheck_shadow.py v13/code/tests/test_jef_c3_schema_source_recheck_shadow.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 4b14ca3bea9b4ddf717aefb7d04408d4b59921b5 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 4b14ca3bea9b4ddf717aefb7d04408d4b59921b5 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Retain raw test and negative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run69-jef-schema-adapter-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run69-adapter/
          if-no-files-found: error
          retention-days: 90
      - name: Require all software stages
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-run69-adapter"
          for s in PINS VENV DEPS TEST COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN69_SOFTWARE_SHADOW_ONLY_NO_NATIVE_PROMOTION
