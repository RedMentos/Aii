name: V13 Run117CS exact Run12J reviewed source-chain regression
on:
  push:
    branches:
      - assistant/v13-run117cs-run12j-reviewed-chain-20261101-gpt6
  pull_request:
    branches:
      - assistant/v13-run117cr-source-chain-drift-audit-20261101-gpt6
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact Run12J transform and original frozen regressions
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run117cs"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          e3b946538703e411f78c39c1fa4c4a3aad88d42b v13/code/scripts/integrated_candidates.py
          e90e2e26cbad902bb1f63def326a45f9b5757d67 v13/code/tests/test_run117cs_run12j_reviewed_chain.py
          22ed11e4a53d9eeae8fbc74a1753082b5785be2b v13/code/v13/runtime.py
          27216f52bc1336372fdcc3e267750bcbdc7e17ab v13/code/scripts/source_handoff_candidate.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run117cs-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run117cs-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' 'psutil==7.0.0' 'PyYAML==6.0.2' 'Pillow==11.3.0' 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
          else
            for stage in DEPS PIP_CHECK; do echo SKIPPED > "$e/${stage}_RAW.log"; echo 99 > "$e/${stage}_EXIT.txt"; done
          fi
          python3 -m py_compile v13/code/scripts/integrated_candidates.py v13/code/tests/test_run117cs_run12j_reviewed_chain.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 540s env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_run117cs_run12j_reviewed_chain tests.test_run117cr_source_chain_drift_audit tests.test_source_handoff_candidate tests.test_eligibility_fixed tests.test_native_firing_merged_candidate tests.test_native_firing_runtime_candidate tests.test_b2_offer_candidate tests.test_quote_context) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          (cd v13/code && PYTHONPATH=.:tests:scripts "$py" scripts/run117cr_source_chain_drift_audit.py --diff-output "$e/POST_CHAIN_DIFF.patch") > "$e/CHAIN_AUDIT_RAW.json" 2> "$e/CHAIN_AUDIT_STDERR.log"
          echo "$?" > "$e/CHAIN_AUDIT_EXIT.txt"
          git diff --exit-code -- v13/code/v13/runtime.py v13/code/v13/runners.py v13/code/v13/store.py v13/code/v13/memory_server.py > "$e/NO_SOURCE_MUTATION_RAW.log" 2>&1
          echo "$?" > "$e/NO_SOURCE_MUTATION_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 947b1fa636d1185e610e701a4504d1011fa76247 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 947b1fa636d1185e610e701a4504d1011fa76247 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve raw GREEN or RED including exact source diff
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117cs-reviewed-chain-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117cs/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce original source guard, no full-suite promotion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117cs"
          for stage in PINS VENV DEPS PIP_CHECK COMPILE TEST CHAIN_AUDIT NO_SOURCE_MUTATION PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; raw retained, no gate promotion"
              tail -80 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          "$RUNNER_TEMP/v13-run117cs-venv/bin/python" - "$e/CHAIN_AUDIT_RAW.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1]))
          assert report['status']=='EXACT_REVIEWED_CHAIN',report
          assert report['changed_files']==[],report
          assert report['checked_files']==4
          PY
          test ! -s "$e/POST_CHAIN_DIFF.patch"
          echo RUN117CS_EXACT_REVIEWED_RUN12J_CHAIN_NO_NATIVE_OR_FULLSUITE_PROMOTION
