name: V13 BP1 48 native-control collector software-only review
on:
  push:
    branches: [codex/automation11-bp1-nearmiss48-native-20261027]
    paths:
      - '.github/workflows/bp1-nearmiss48-software.yml'
      - 'v13/code/scripts/bp1_qad_nearmiss_native.py'
      - 'v13/code/tests/test_bp1_qad_nearmiss_native.py'
      - 'v13/code/docs/proofs/continuation-20261027/bp1-nearmiss48-native/**'
permissions:
  contents: read
concurrency:
  group: v13-bp1-nearmiss48-software-${{ github.ref }}
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Exact registered controls, collector tests, compile, privacy
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/bp1-nearmiss48"
          git rev-parse HEAD > "$RUNNER_TEMP/bp1-nearmiss48/HEAD.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/bp1-nearmiss48/TREE.txt"
          python3 - <<'PY' > "$RUNNER_TEMP/bp1-nearmiss48/SOURCE_PARITY_RAW.log" 2>&1
          import subprocess
          head='8c603338dd766fded586955996e2bb1bdb012be3'
          paths=['v13/code/scripts/bp1_qad_nearmiss_retention.py','v13/code/scripts/bp1_qad_nearmiss_score.py',
                 'v13/code/tests/test_bp1_qad_nearmiss_retention.py','v13/code/tests/test_bp1_qad_nearmiss_score.py']
          for p in paths:
              a=subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip()
              b=subprocess.check_output(['git','rev-parse',head+':'+p],text=True).strip()
              if a!=b:raise RuntimeError('CONTROL_SOURCE_DRIFT '+p)
          print('EXACT_REGISTERED_CONTROLS',len(paths))
          PY
          echo "$?" > "$RUNNER_TEMP/bp1-nearmiss48/SOURCE_PARITY_EXIT.txt"
          (cd v13/code && PYTHONPATH="$PWD:$PWD/scripts" python3 -m unittest -v \
            tests.test_bp1_qad_nearmiss_retention tests.test_bp1_qad_nearmiss_score tests.test_bp1_qad_nearmiss_native) > "$RUNNER_TEMP/bp1-nearmiss48/UNIT_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp1-nearmiss48/UNIT_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/bp1_qad_nearmiss_retention.py v13/code/scripts/bp1_qad_nearmiss_score.py v13/code/scripts/bp1_qad_nearmiss_native.py v13/code/tests/test_bp1_qad_nearmiss_native.py > "$RUNNER_TEMP/bp1-nearmiss48/COMPILE_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp1-nearmiss48/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 7de89c7631142e980651fc7c92114315c0ac42c0 --head HEAD > "$RUNNER_TEMP/bp1-nearmiss48/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/bp1-nearmiss48/PRIVACY_EXIT.txt"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bp1-nearmiss48-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/bp1-nearmiss48/
          if-no-files-found: error
      - name: Enforce exact controls and software-only checks
        run: |
          set -euo pipefail
          for n in SOURCE_PARITY UNIT COMPILE PRIVACY; do
            test "$(cat "$RUNNER_TEMP/bp1-nearmiss48/${n}_EXIT.txt")" = 0 || {
              tail -100 "$RUNNER_TEMP/bp1-nearmiss48/${n}_RAW.log"; exit 1;
            }
          done
          echo "BP1_NEARMISS48_COLLECTOR_SOFTWARE_ONLY_NO_NATIVE_PROOF"
