name: V13 Run117BT independent original Run117BR native artifact compact audit
on:
  push:
    branches:
      - assistant/v13-run117bt-original-native-compact-audit-20261101-hourly11
    paths:
      - .github/workflows/v13-run117bt-original-native-compact-audit.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  read-only-native-raw-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ORIGINAL_ARTIFACT_ID: '13062136743'
      ORIGINAL_RUN_ID: '41253050432'
      ORIGINAL_ZIP_SHA256: 'bbdefb2209f502ae87fbfa8c32607c183bea63c4af43b15e369aee9029c2a622'
      ORIGINAL_HEAD: '5b429be40b2bbab736f5536385943f08f758b7c2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download original large native artifact read-only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run117bt"
          mkdir -p "$e/compact"
          git rev-parse HEAD > "$e/compact/AUDITOR_HEAD.txt"
          printf '%s\n' "$ORIGINAL_ARTIFACT_ID" > "$e/compact/ORIGINAL_ARTIFACT_ID.txt"
          printf '%s\n' "$ORIGINAL_RUN_ID" > "$e/compact/ORIGINAL_RUN_ID.txt"
          curl --fail --location --retry 2 --retry-delay 3 --connect-timeout 30 --max-time 1200 --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ORIGINAL_ARTIFACT_ID/zip" \
            --output "$RUNNER_TEMP/v13-run117bt-original.zip" > "$e/compact/DOWNLOAD_RAW.log" 2>&1
          echo "$?" > "$e/compact/DOWNLOAD_EXIT.txt"
          if [ -f "$RUNNER_TEMP/v13-run117bt-original.zip" ]; then
            sha256sum "$RUNNER_TEMP/v13-run117bt-original.zip" > "$e/compact/ORIGINAL_ZIP_SHA256.txt"
            echo "$ORIGINAL_ZIP_SHA256  $RUNNER_TEMP/v13-run117bt-original.zip" | sha256sum -c - > "$e/compact/ORIGINAL_PIN_RAW.log" 2>&1
            echo "$?" > "$e/compact/ORIGINAL_PIN_EXIT.txt"
          else echo SKIPPED > "$e/compact/ORIGINAL_PIN_EXIT.txt"; fi
          exit 0
      - name: Independently hash all original ZIP entries and extract only bounded synthetic evidence
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run117bt"
          if [ "$(cat "$e/compact/ORIGINAL_PIN_EXIT.txt")" = 0 ]; then
            python3 - "$RUNNER_TEMP/v13-run117bt-original.zip" "$e/compact" "$ORIGINAL_HEAD" <<'PY' > "$e/compact/ARCHIVE_RAW.log" 2>&1
          import hashlib,json,sys,zipfile
          from pathlib import Path
          archive=Path(sys.argv[1]);out=Path(sys.argv[2]);head=sys.argv[3]
          with zipfile.ZipFile(archive) as z:
              names=z.namelist()
              assert len(names)==len(set(names)), 'DUPLICATE_ZIP_NAMES_RED'
              assert 'SHA256SUMS' in names and 'HEAD.txt' in names
              assert z.read('HEAD.txt').decode().strip()==head
              sums=z.read('SHA256SUMS').decode().splitlines()
              expected={}
              for line in sums:
                  want,name=line.split('  ',1)
                  name=name.removeprefix('./')
                  assert name not in expected and len(want)==64
                  expected[name]=want
              assert set(expected)==set(names)-{'SHA256SUMS'}, 'SHA256SUMS_COVERAGE_RED'
              verified=0;total=0
              for name,want in expected.items():
                  assert not name.startswith('/') and '..' not in Path(name).parts
                  h=hashlib.sha256()
                  with z.open(name) as stream:
                      while True:
                          block=stream.read(1024*1024)
                          if not block:break
                          h.update(block);total+=len(block)
                  assert h.hexdigest()==want,'ENTRY_HASH_RED:'+name
                  verified+=1
              stages=['PINS','FIXTURE','VENV','DEPS','PIP_CHECK','PACK','ZIP','PREFLIGHT',
                      'INSTALL_C3','NATIVE','VERIFY','COMPILE','PRIVACY','DIFF','NOEXPORT']
              exits={stage:z.read(stage+'_EXIT.txt').decode().strip() for stage in stages}
              assert all(v=='0' for v in exits.values()),'STAGE_RED:'+repr(exits)
              assert 'NATIVE_CASE/report.json' in names,'NATIVE_REPORT_MISSING'
              wanted=[n for n in names if n=='NATIVE_CASE/report.json' or
                      (n.startswith('NATIVE_CASE/home-') and
                       ('/data/db/brain.sqlite3' in n or '/data/blobs/' in n))]
              assert len(wanted)>1,'PERSISTED_STORE_MISSING'
              for name in wanted:
                  dest=out/name
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(name) as src,dest.open('wb') as dst:
                      while True:
                          block=src.read(1024*1024)
                          if not block:break
                          dst.write(block)
              for name in ('NATIVE_RAW.log','VERIFY_RAW.log','NOEXPORT_RAW.log',
                           'INSTALL_C3_RAW.log','PINS_RAW.log','ZIP_RAW.log'):
                  if name in names:(out/name).write_bytes(z.read(name))
              result={'original_head':head,'original_sha256':hashlib.file_digest(archive.open('rb'),'sha256').hexdigest(),
                      'zip_crc_all_entries_checked':True,'inner_sha256_verified':verified,
                      'inner_bytes_verified':total,'stage_exits':exits,'persisted_evidence_files':len(wanted),
                      'evidence_class':'LINUX_NATIVE_C3_KNOWN_SEED401_REGRESSION_ONLY',
                      'native_attestation':False,'redmi_measured':False}
              (out/'INDEPENDENT_ARCHIVE_AUDIT.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
              print(json.dumps(result,sort_keys=True))
          PY
            echo "$?" > "$e/compact/ARCHIVE_EXIT.txt"
          else echo SKIPPED > "$e/compact/ARCHIVE_EXIT.txt"; fi
          exit 0
      - name: Independently rescore original C3 and persisted USER SourceRefs
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run117bt"
          if [ "$(cat "$e/compact/ARCHIVE_EXIT.txt")" = 0 ]; then
            (cd v13/code && python3 scripts/run117bq_independent_budget_smoke_audit.py \
              --report "$e/compact/NATIVE_CASE/report.json" \
              --fixture docs/fixtures/run46b_jef_source_eligibility_seed401.json \
              --root "$e/compact/NATIVE_CASE") > "$e/compact/INDEPENDENT_REPORT_AUDIT_RAW.log" 2>&1
            echo "$?" > "$e/compact/INDEPENDENT_REPORT_AUDIT_EXIT.txt"
          else echo SKIPPED > "$e/compact/INDEPENDENT_REPORT_AUDIT_EXIT.txt"; fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 9bb67662a14fc3750b9aa7d2051fc8c2181249e7 --head HEAD --no-worktree > "$e/compact/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/compact/PRIVACY_EXIT.txt"
          (cd "$e/compact" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve compact independent original audit GREEN or RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117bt-original-audit-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117bt/compact/
          retention-days: 90
          if-no-files-found: error
      - name: Enforce independently verified original native evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117bt/compact"
          for stage in DOWNLOAD ORIGINAL_PIN ARCHIVE INDEPENDENT_REPORT_AUDIT PRIVACY; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; compact raw preserved; no gate promotion"
              tail -70 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'RUN117BT_ORIGINAL_NATIVE_AUDIT_STRUCTURAL_ONLY_NO_AGI_OR_GATE_PROMOTION'
