name: V13 Boss C5 Android replay composite
on:
  push:
    branches: [boss/v13-integrated-jepa-bridge-20261111-1045]
  pull_request:
    paths:
      - 'v13/code/v13/android_c5_goal_replay.py'
      - 'v13/code/v13/android_capability_bridge.py'
      - 'v13/code/v13/android_goal_replay_retention.py'
      - 'v13/code/v13/android_sim_jepa_probe.py'
      - 'v13/code/tests/test_android_c5_goal_replay.py'
      - '.github/workflows/v13-boss-c5-android-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  composite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v13/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy==1.26.4
      - run: python -m py_compile v13/android_c5_goal_replay.py v13/android_capability_bridge.py v13/android_goal_replay_retention.py v13/android_sim_jepa_probe.py
      - run: python -m pytest -q tests/test_android_c5_goal_replay.py tests/test_android_capability_bridge.py tests/test_android_goal_replay_retention.py tests/test_behavior_goal_replay_composite.py tests/test_behavior_governor.py tests/test_behavior_governor_android_integration.py tests/test_android_goal_learning_demo.py
