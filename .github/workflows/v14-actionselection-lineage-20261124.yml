name: V14 ActionSelection source-lineage regression
on:
  pull_request:
    branches: ['gpt6/v13-private-remote-bridge-20261111']
    paths:
      - '.github/workflows/v14-actionselection-lineage-20261124.yml'
      - 'v13/code/v13/focal.py'
      - 'v13/code/v13/world_jepa_store_authority.py'
      - 'v13/code/tests/test_focal.py'
  push:
    branches: ['core/v14-actionselection-source-lineage-20261124']
    paths:
      - '.github/workflows/v14-actionselection-lineage-20261124.yml'
      - 'v13/code/v13/focal.py'
      - 'v13/code/v13/world_jepa_store_authority.py'
      - 'v13/code/tests/test_focal.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actionselection-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.2.0 numpy==2.2.6 pillow==13.0.0
      - name: Compile exact source and consumer
        run: python -m py_compile v13/code/v13/focal.py v13/code/v13/world_jepa_store_authority.py v13/code/tests/test_focal.py
      - name: Run C4/C5 source-lineage and consumer regression
        working-directory: v13/code
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q -s tests/test_focal.py
