name: V13 resumable no-model UTF8 output stream
on:
  push:
    branches:
      - 'codex/v13-fastbatch-stream-output-*'
      - 'codex/v13-session-bound-procedure-*'
  pull_request:
    paths:
      - 'v13/code/v13/procedural_batch.py'
      - 'v13/code/tests/test_procedural_stream_output.py'
      - 'v13/code/scripts/benchmark_procedural_fastpath.py'
      - 'v13/code/tests/test_procedural_fastpath_benchmark.py'
      - 'v13/code/tests/test_procedural_job_lock.py'
      - 'v13/code/v13/speed_panel.py'
      - 'v13/code/v13/procedural_inputs.py'
      - 'v13/code/tests/test_procedural_input_values.py'
      - 'v13/code/tests/test_speed_panel.py'
      - 'v13/code/v13/procedural_habits.py'
      - 'v13/code/tests/test_procedural_session_scope.py'
      - 'v13/code/v13/brain_learning_receipts.py'
      - 'v13/code/tests/test_brain_learning_receipts.py'
      - 'v13/code/tests/test_procedural_shared_habits.py'
      - 'v13/code/v13/brain_panel.py'
      - 'v13/code/v13/operator.py'
      - '.github/workflows/v13-procedural-stream-output.yml'
permissions:
  contents: read
jobs:
  streaming:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v13/code
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: "Compile and test bounded UTF-8 output and prior learned habits"
        run: |
          python -m py_compile v13/procedural_batch.py v13/operator.py v13/speed_panel.py v13/brain_panel.py v13/procedural_inputs.py v13/brain_learning_receipts.py scripts/benchmark_procedural_fastpath.py tests/test_procedural_stream_output.py tests/test_procedural_fastpath_benchmark.py tests/test_procedural_job_lock.py tests/test_procedural_session_scope.py tests/test_procedural_shared_habits.py
          python -m pytest -q tests/test_procedural_stream_output.py tests/test_procedural_fastpath_benchmark.py tests/test_procedural_habits.py tests/test_procedural_batch.py tests/test_brain_diagnosis.py tests/test_procedural_job_lock.py tests/test_procedural_input_values.py tests/test_speed_panel.py tests/test_procedural_session_scope.py tests/test_brain_learning_receipts.py tests/test_procedural_shared_habits.py
          python scripts/benchmark_procedural_fastpath.py --rows 100000 --batch-rows 8192 > /tmp/v13-procedure-bench.json
          python -c 'import json; p=json.load(open("/tmp/v13-procedure-bench.json")); assert p["fixture"]["rows"]==100000 and p["stream"]["verified_same_sha256"] and p["fixture"]["model_calls"]==0'
          python scripts/benchmark_procedural_fastpath.py --mode values --rows 100000 --batch-rows 8192 > /tmp/v13-values-bench.json
          python -c 'import json; p=json.load(open("/tmp/v13-values-bench.json")); assert p["fixture"]["kind"]=="SYNTHETIC_IMPORTED_VALUES" and p["fixture"]["rows"]==100000 and p["stream"]["verified_same_sha256"] and p["fixture"]["model_calls"]==0'
      - name: "Read back Linux-only synthetic throughput receipt"
        run: |
          cat /tmp/v13-procedure-bench.json
          cat /tmp/v13-values-bench.json
      - name: "Privacy scan new public source"
        run: |
          python scripts/public_repo_privacy_scan.py --base 0fb80f8ac43b9fadceda3343db0e837fe978f518 --head HEAD
