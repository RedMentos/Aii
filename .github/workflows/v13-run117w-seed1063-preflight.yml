name: V13 Run117W seed1063 C3 arithmetic diagnostic model-free preflight
on:
  push:
    branches:
      - assistant/v13-run117w-c3-arithmetic-native-diagnostic-20261031-1938
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c3-diagnostic-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Frozen seed1063 source-role contracts, inherited tests and privacy
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117w-preflight"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/scripts/run117w_c3_arithmetic_native.py > "$e/RUNNER_BLOB.txt"
          git hash-object v13/code/docs/fixtures/RUN117W_C3_ARITHMETIC_SEED1063.json > "$e/FIXTURE_BLOB.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run117w-venv" > "$e/VENV_RAW.log" 2>&1
          py="$RUNNER_TEMP/v13-run117w-venv/bin/python"
          set +e
          echo '2b62fd13c81201c23574fa42ad87176f5d25f755b534a76f4386c9ec9c608ed9  v13/code/docs/fixtures/RUN117W_C3_ARITHMETIC_SEED1063.json' | sha256sum -c - > "$e/FIXTURE_RAW.log" 2>&1
          fixture_rc=$?
          "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          deps_rc=$?
          if test "$fixture_rc" -eq 0 && test "$deps_rc" -eq 0; then
            (cd v13/code && env PYTHONPATH=. "$py" -m unittest -v \
              tests.test_run117w_c3_arithmetic_native \
              tests.test_run117v_original_native_readonly_audit \
              tests.test_run117u_seed1061_native_three_arm \
              tests.test_run117s_r_prior_source_binding_review \
              tests.test_run117s_b2_salient_source_shadow \
              tests.test_run117s_body_complementarity_preflight) > "$e/TEST_RAW.log" 2>&1
            test_rc=$?
          else
            test_rc=125;echo PREREQUISITE_RED > "$e/TEST_RAW.log"
          fi
          "$py" -m compileall -q v13/code/scripts/run117w_c3_arithmetic_native.py v13/code/tests/test_run117w_c3_arithmetic_native.py > "$e/COMPILE_RAW.log" 2>&1
          compile_rc=$?
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 795c84ae91920809e8512c231a1025d15aaceafb --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          privacy_rc=$?
          git diff --check 795c84ae91920809e8512c231a1025d15aaceafb HEAD > "$e/DIFF_RAW.log" 2>&1
          diff_rc=$?
          for x in "FIXTURE:$fixture_rc" "DEPS:$deps_rc" "TEST:$test_rc" "COMPILE:$compile_rc" "PRIVACY:$privacy_rc" "DIFF:$diff_rc"; do
            echo "${x#*:}" > "$e/${x%%:*}_EXIT.txt"
          done
          set -e
          "$py" - "$e" <<'PY' > "$e/RESULT_RAW.log"
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1]);names=('FIXTURE','DEPS','TEST','COMPILE','PRIVACY','DIFF')
          r={'schema':'v13.run117w.seed1063_model_free_preflight.v1',
             'head':(e/'HEAD.txt').read_text().strip(),
             'runner_blob':(e/'RUNNER_BLOB.txt').read_text().strip(),
             'fixture_blob':(e/'FIXTURE_BLOB.txt').read_text().strip(),
             'fixture_sha256':'2b62fd13c81201c23574fa42ad87176f5d25f755b534a76f4386c9ec9c608ed9',
             'exits':{n:int((e/(n+'_EXIT.txt')).read_text()) for n in names},
             'native_executed':False,'typed_jef_is_deterministic':True,
             'output_committed':False,'tool_dispatches':0,
             'learning_authority':0,'delivery_authority':0,
             'step2_promoted':False,'b3_promoted':False,'jepa_weight':0,
             'redmi_measured':False,'whole_system_complete':False}
          (e/'RESULT.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat "$e/RESULT_RAW.log"
          tail -n 25 "$e/TEST_RAW.log"
          for rc in "$fixture_rc" "$deps_rc" "$test_rc" "$compile_rc" "$privacy_rc" "$diff_rc"; do test "$rc" -eq 0; done
      - name: Preserve original RED or GREEN
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117w-model-free-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117w-preflight/
          if-no-files-found: warn
          retention-days: 90
