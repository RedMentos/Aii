name: V13 W7S independent stdlib raw report replay software
on:
  push:
    branches: [assistant/v13-world-jepa-w7s-independent-verifier-20261031-auto11]
    paths: ['.github/workflows/v13-world-jepa-w7s-independent-replay.yml']
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Frozen pins, independent software regressions, closed raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-w7s-independent-replay"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          ed9238770eaf0a9a5af20260a246a9b8257a849f v13/code/docs/WORLD_JEPA_ACTION_BALANCED_FULLSLOT_PREREG_RUN39_20261031.md
          563030370bd30688138c0d31c32fe6494abfc817 v13/code/scripts/w7s_world_jepa_disjoint_support_real.py
          afff18393c1522f7e4c3987154dd6af5251caea0 v13/code/tests/test_w7s_world_jepa_disjoint_support.py
          90d171529808d5b42af89d8556e2d53c061332b7 v13/code/docs/WORLD_JEPA_W7_DISJOINT_SUPPORT_PREREG_20261031.md
          7191493fec0743cd3416e2a6f5fce396b7405335 v13/code/scripts/verify_w7s_world_jepa_report.py
          0b0f383ac84b4ff62e5b07a2689ff56ce9176c24 v13/code/tests/test_verify_w7s_world_jepa_report.py
          e9cc3afd5d74d5f980447f54c815f167720fddd1 v13/code/docs/WORLD_JEPA_W7S_INDEPENDENT_REPLAY_PREREG_20261031.md
          c65467f1f000c187f46542270dfc53ee569824a1 v13/code/v13/world_jepa_action_balanced_fullslot_candidate.py
          cad9dd0f7877ed0243ea6a9cf387a34c433e5f59 v13/code/tests/test_run39_world_jepa_action_balanced_fullslot.py
          411c98de52ab3fbec5437ce12bf0c29591ff79a7 v13/code/scripts/run39_world_jepa_action_balanced_real.py
          8c68e6cbd8bd49a9fe9245d6740428f714e5a6e8 v13/code/tests/test_run39_world_jepa_action_balanced_real.py
          51bc5260cde8db3bc6cf7924a7a089a5cdfe5fd0 v13/code/v13/world_jepa_fullslot_candidate.py
          67e14e0d03c50c4767b74d5b02a819a95c6cc262 v13/code/v13/world_jepa_slot_candidate.py
          99a686a131a1bdc89efe0d0cf9610ec54cbd853b v13/code/v13/world_jepa.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run39-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run39-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_verify_w7s_world_jepa_report tests.test_w7s_world_jepa_disjoint_support tests.test_run39_world_jepa_action_balanced_fullslot tests.test_run39_world_jepa_action_balanced_real tests.test_run38_world_jepa_fullslot_candidate tests.test_world_jepa_slot_candidate_run28 tests.test_world_jepa_atomic_fit) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo PIN_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/v13/world_jepa_action_balanced_fullslot_candidate.py v13/code/tests/test_run39_world_jepa_action_balanced_fullslot.py v13/code/scripts/run39_world_jepa_action_balanced_real.py v13/code/tests/test_run39_world_jepa_action_balanced_real.py v13/code/scripts/w7s_world_jepa_disjoint_support_real.py v13/code/tests/test_w7s_world_jepa_disjoint_support.py v13/code/scripts/verify_w7s_world_jepa_report.py v13/code/tests/test_verify_w7s_world_jepa_report.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          git fetch --no-tags --depth=1 origin d4e6d19fb54820512e10b6f3f66c682c303808c6 > "$e/FETCH_RAW.log" 2>&1
          echo "$?" > "$e/FETCH_EXIT.txt"
          "$py" - > "$e/PRIVACY_RAW.log" 2>&1 <<'PY'
          import subprocess,sys
          sys.path.insert(0,'v13/code')
          from scripts.public_repo_privacy_scan import scan
          d=subprocess.check_output(['git','diff','--no-color','-U0','--text','d4e6d19fb54820512e10b6f3f66c682c303808c6','HEAD'],text=True)
          hits=scan(d)
          print('privacy', 'CLEAN' if not hits else hits)
          sys.exit(bool(hits))
          PY
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check d4e6d19fb54820512e10b6f3f66c682c303808c6 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original software raw including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-w7s-independent-replay-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-w7s-independent-replay/
          if-no-files-found: error
          retention-days: 90
      - name: Require all stages zero and no learning promotion
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-w7s-independent-replay"
          for s in PINS VENV DEPS TEST COMPILE FETCH PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo W7S_INDEPENDENT_REPORT_REPLAY_SOFTWARE_NO_NATIVE_OR_PROMOTION
