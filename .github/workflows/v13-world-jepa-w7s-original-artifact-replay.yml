name: V13 W7S original Linux native ZIP full-gate replay
on:
  push:
    branches: [assistant/v13-world-jepa-w7s-original-artifact-ci-20261031-auto11]
    paths: ['.github/workflows/v13-world-jepa-w7s-original-artifact-replay.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact original artifact and independently replay W1-W7
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-w7s-original-replay"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          95ac7b8debb71dbd93c78db8442c81e2e8b4a34d v13/code/scripts/verify_w7s_native_zip.py
          73392dde94e646124f92ee124aa1989e7c46f0d2 v13/code/scripts/verify_w7s_full_gates.py
          7191493fec0743cd3416e2a6f5fce396b7405335 v13/code/scripts/verify_w7s_world_jepa_report.py
          b6c791bbc97018f6d6e215a447149dce13025e77 v13/code/tests/test_verify_w7s_native_zip.py
          3ba1579b3f5e695af6dac99834a7c5ee23e8728a v13/code/docs/WORLD_JEPA_W7S_ORIGINAL_ARTIFACT_CI_PREREG_20261031.md
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          563030370bd30688138c0d31c32fe6494abfc817 v13/code/scripts/w7s_world_jepa_disjoint_support_real.py
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-w7s-original-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-w7s-original-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' > "$e/DEPS_RAW.log" 2>&1
          echo "$?" > "$e/DEPS_EXIT.txt"
          if [ "$bad" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_verify_w7s_native_zip tests.test_verify_w7s_full_gates tests.test_verify_w7s_world_jepa_report) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo PINS_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          curl --fail --silent --show-error --location --retry 2 --max-time 240 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/RedMentos/Aii/actions/artifacts/13032013538/zip" \
            -o "$e/ORIGINAL.zip" > "$e/DOWNLOAD_RAW.log" 2>&1
          echo "$?" > "$e/DOWNLOAD_EXIT.txt"
          if [ -f "$e/ORIGINAL.zip" ]; then
            sha256sum "$e/ORIGINAL.zip" > "$e/ORIGINAL_SHA256_RAW.log"
            got="$(cut -d ' ' -f1 "$e/ORIGINAL_SHA256_RAW.log")"
            [ "$got" = "c9bdad3ef348833e9b85961db310f7fa9f5af719eaf0f892809c975d41b8fe41" ]
            echo "$?" > "$e/ORIGINAL_HASH_EXIT.txt"
          else echo NO_ORIGINAL > "$e/ORIGINAL_SHA256_RAW.log"; echo 99 > "$e/ORIGINAL_HASH_EXIT.txt"; fi
          if [ "$(cat "$e/TEST_EXIT.txt")" = 0 ] && [ "$(cat "$e/ORIGINAL_HASH_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" scripts/verify_w7s_native_zip.py --zip "$e/ORIGINAL.zip") > "$e/AUDIT_RAW.log" 2>&1
            echo "$?" > "$e/AUDIT_EXIT.txt"
          else echo SKIPPED_ORIGINAL_OR_TEST_RED > "$e/AUDIT_RAW.log"; echo 99 > "$e/AUDIT_EXIT.txt"; fi
          if [ "$(cat "$e/AUDIT_EXIT.txt")" = 0 ]; then
            "$py" - "$e/ORIGINAL.zip" > "$e/SCIENTIFIC_GATE_RAW.log" 2>&1 <<'PY'
          import json,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z: r=json.loads(z.read('RESULT.json'))
          assert r['status']=='SHADOW_CANDIDATE_FAIL' and r['seeds']==[601,602,603]
          assert all(min(s['counts'].values())>=15 for s in r['attribution_support_preflight'])
          for arm in ('two_slot','six_slot','balanced_slot'):
              g=r[arm+'_gates']
              assert all(g[k] for k in ('W1_cf_retrieval_covered','W2_controls_fail','W3_no_collapse','W5_attribution_jepa'))
              assert not g['W4_confidence_tracks_error'] and not g['W6_no_action_attribution_worse']
          w=r['balanced_slot_w7']
          assert w['W7a_both_world_action_gain'] and w['W7c_four_class_macro_action_gain']
          assert not w['W7b_none_self_action_gain']
          assert r['exploratory']['H2_covered_cf_and_controls']
          assert not r['exploratory']['H1_balanced_gap_improvement']
          assert not r['exploratory']['H3_w7c_improvement']
          assert r['age0']=='RECORD_ONLY' and r['step2']=='UTILITY_FAIL' and r['b3']=='NO_PROMOTION'
          assert r['body_jepa']=='UNAVAILABLE' and r['jepa_weight']==0 and r['world_jepa_authority']=='SHADOW'
          assert not r['redmi_measured'] and not r['whole_system_complete']
          print('ORIGINAL_W7S_LINUX_REALFILE_RAW_REPLAY_VERIFIED_UTILITY_FAIL_NO_PROMOTION')
          PY
            echo "$?" > "$e/SCIENTIFIC_GATE_EXIT.txt"
          else echo SKIPPED_AUDIT_RED > "$e/SCIENTIFIC_GATE_RAW.log"; echo 99 > "$e/SCIENTIFIC_GATE_EXIT.txt"; fi
          "$py" -m py_compile v13/code/scripts/verify_w7s_native_zip.py v13/code/scripts/verify_w7s_full_gates.py v13/code/scripts/verify_w7s_world_jepa_report.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 7777c54c44df71062eba430a5079b40e37065688 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 7777c54c44df71062eba430a5079b40e37065688 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original ZIP and all raw evidence including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-w7s-original-replay-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-w7s-original-replay/
          retention-days: 90
          if-no-files-found: error
      - name: Require all audit stages zero while scientific gate remains FAIL
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-w7s-original-replay"
          for s in PINS VENV DEPS TEST DOWNLOAD ORIGINAL_HASH AUDIT SCIENTIFIC_GATE COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/$s"_EXIT.txt 2>/dev/null || echo MISSING)"
            test "$(cat "$e/$s"_EXIT.txt 2>/dev/null)" = 0 || exit 1
          done
          echo W7S_ORIGINAL_RAW_REPLAY_VERIFIED_WORLD_JEPA_UTILITY_FAIL_NO_PROMOTION
