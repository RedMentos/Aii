name: V13 Run114 Atlas CQP20 genuine distinct-body STEP2 native one-fixture diagnostic
on:
  push:
    branches: [assistant/v13-run114-atlas-cqp20-native-execution-20261029]
permissions:
  contents: read
concurrency:
  group: v13-run114-atlas-native-serial
  cancel-in-progress: false
jobs:
  atlas_native:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Frozen source, resource admission, serial native and original raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run114"
          work="$RUNNER_TEMP/v13-run114-work"
          mkdir -p "$e" "$work"
          git rev-parse HEAD > "$e/HEAD.txt"
          source_ok=0
          check() {
            observed="$(git hash-object "$2" 2>/dev/null)" || return 1
            printf '%s %s\n' "$observed" "$2" >> "$e/SOURCE_RAW.log"
            [ "$observed" = "$1" ]
          }
          check cccc421a89f0fe090642254dc47355104c305c3b v13/code/docs/proofs/continuation-20261028/RUN114_ATLAS_NATIVE_EXECUTION_PREREG.md || source_ok=1
          check c0e64dba8b49eb7692d4579ae27ee277fbb01b50 v13/code/docs/proofs/continuation-20261028/RUN114_BRANCH_BUILD_STATE.json || source_ok=1
          check d4066bb72cb4423b2f3114057362b530b14b6556 v13/code/docs/proofs/continuation-20261028/RUN113_ATLAS_CQP_S20_NATIVE_PILOT_PREREG.md || source_ok=1
          check 3d1ddbd7b45a46d4b9332466f4ac8a6122d4af89 v13/code/scripts/run113_step2_atlas_cqp_native_pilot.py || source_ok=1
          check 0e9f9434771f67713872049f53054fa125ed3084 v13/code/tests/test_run113_step2_atlas_cqp_native_pilot.py || source_ok=1
          check 468d2bc72a5584fc6e5c67292968feb3a4125c07 v13/code/scripts/run111_step2_fresh_native_preflight.py || source_ok=1
          check 6cc3d52524e8c9122710eae2a908d024f0f44f24 v13/code/scripts/run109_step2_fresh_fixtures.py || source_ok=1
          check 2ad62fbbf1f6463d99360cdb8198f1104cfdfaf7 v13/code/scripts/step2_z2_timescale.py || source_ok=1
          check 7c299616495450e4a38f9aab9921f7176ba67556 v13/code/scripts/step2_z2b_seeds.py || source_ok=1
          check a7ba12a8807a1ca8236f1c70d54dedb65c212caa v13/code/tests/integration_step2_utility.py || source_ok=1
          check e8d8c87de2474a764e4bbc28b4fe028413a316e1 v13/code/scripts/step2_tool_replay.py || source_ok=1
          check 7253b113b43de110059575cc14ef7b2ce7bccc43 v13/code/scripts/step2_longnote_tp27_native_pilot.py || source_ok=1
          check e1f1a2d09a614378a75e397819fdce96a46de22d v13/code/v13/agi/eligibility.py || source_ok=1
          check 1a9eb6f7c7cbfce83d91cc09b4ff9516cff310cf v13/code/v13/cognition.py || source_ok=1
          check 7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json || source_ok=1
          check 218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md || source_ok=1
          echo "$source_ok" > "$e/SOURCE_EXIT.txt"
          python3 - "$e" > "$e/RESOURCE_RAW.log" 2>&1 <<'PY'
          import json,platform,shutil,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          info={}
          for line in Path('/proc/meminfo').read_text().splitlines():
              if line.startswith(('MemTotal:', 'MemAvailable:')):
                  k,v,*_=line.split()
                  info[k.rstrip(':')]=int(v)*1024
          for key in ('memory.max','memory.current'):
              p=Path('/sys/fs/cgroup')/key
              info['cgroup_'+key]=p.read_text().strip() if p.exists() else 'UNAVAILABLE'
          info['platform']=platform.platform()
          info['machine']=platform.machine()
          info['disk_free_bytes']=shutil.disk_usage(str(root)).free
          info['mem_available_bytes']=info.get('MemAvailable',0)
          print(json.dumps(info,sort_keys=True))
          if platform.system()!='Linux' or platform.machine()!='x86_64':
              raise SystemExit(2)
          if info['mem_available_bytes']<2500000000 or info['disk_free_bytes']<5000000000:
              raise SystemExit(3)
          PY
          echo "$?" > "$e/RESOURCE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run114-venv"
          py="$RUNNER_TEMP/v13-run114-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          echo "$?" > "$e/INSTALL_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/run113_step2_atlas_cqp_native_pilot.py v13/code/scripts/run111_step2_fresh_native_preflight.py v13/code/tests/test_run113_step2_atlas_cqp_native_pilot.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$source_ok" = 0 ] && [ "$(cat "$e/INSTALL_EXIT.txt")" = 0 ] && [ "$(cat "$e/COMPILE_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 180s "$py" -m unittest -v tests.test_run113_step2_atlas_cqp_native_pilot tests.test_run111_step2_fresh_native_preflight tests.test_run109_step2_fresh_fixtures) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else
            echo SKIPPED_SOURCE_INSTALL_COMPILE_RED > "$e/FOCUSED_RAW.log"; echo SKIPPED_RED > "$e/FOCUSED_EXIT.txt"
          fi
          export V13_HOME="$RUNNER_TEMP/v13-run114-installed"
          if [ "$source_ok" = 0 ] && [ "$(cat "$e/RESOURCE_EXIT.txt")" = 0 ] && [ "$(cat "$e/FOCUSED_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=15s 20m env PYTHONPATH=v13/code "$py" -m v13.bootstrap --home "$V13_HOME" > "$e/BOOTSTRAP_RAW.log" 2>&1
            echo "$?" > "$e/BOOTSTRAP_EXIT.txt"
          else
            echo SKIPPED_PREREQ_RED > "$e/BOOTSTRAP_RAW.log"; echo SKIPPED_RED > "$e/BOOTSTRAP_EXIT.txt"
          fi
          if [ "$(cat "$e/BOOTSTRAP_EXIT.txt")" = 0 ]; then
            timeout --signal=TERM --kill-after=20s 35m env PYTHONPATH=v13/code "$py" -m scripts.run113_step2_atlas_cqp_native_pilot --installed-home "$V13_HOME" --evidence-dir "$work/evidence" > "$e/NATIVE_RAW.log" 2>&1
            echo "$?" > "$e/NATIVE_EXIT.txt"
          else
            echo SKIPPED_BOOTSTRAP_RED > "$e/NATIVE_RAW.log"; echo SKIPPED_RED > "$e/NATIVE_EXIT.txt"
          fi
          for f in RECEIPT.json STEP2_RAW.json TOOL_RAW.json TOOL_RAW.preregistration.json; do
            if [ -f "$work/evidence/$f" ]; then cp "$work/evidence/$f" "$e/$f"; fi
          done
          if [ "$(cat "$e/NATIVE_EXIT.txt")" = 0 ]; then
            (cd v13/code && env PYTHONPATH=.:tests "$py" - "$e" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          from scripts import run113_step2_atlas_cqp_native_pilot as pilot
          e=Path(sys.argv[1])
          receipt=json.loads((e/'RECEIPT.json').read_text())
          source_bytes=(e/'STEP2_RAW.json').read_bytes()
          tool_bytes=(e/'TOOL_RAW.json').read_bytes()
          source=json.loads(source_bytes);tool=json.loads(tool_bytes)
          assert receipt['status']=='PASS_SCOPED_ATLAS_CQP20_NATIVE_NO_UTILITY_GATE'
          assert receipt['fixture_sha256']==pilot.FIXTURE_SHA256
          assert receipt['seed']==20 and receipt['arm']=='CQP'
          assert receipt['age_authority']==0 and receipt['jepa_weight']==0
          assert receipt['canonical_gate_pass'] is False and receipt['whole_system_complete'] is False
          assert receipt['weight_updates'] is False and receipt['redmi_measured'] is False
          assert receipt['source_report_sha256']==hashlib.sha256(source_bytes).hexdigest()
          assert receipt['tool_report_sha256']==hashlib.sha256(tool_bytes).hexdigest()
          assert receipt['model_hashes_before']==receipt['model_hashes_after']
          assert pilot.verify_source(source,receipt['queried_offers'],receipt['model_hashes_before'])==receipt['source_guard']
          assert pilot.verify_tool(source,tool)==receipt['tool_guard']
          print('RUN114_ATLAS_CQP20_7_SOURCE_7_TOOL_LINUX_NATIVE_ONLY_NO_STEP2_GATE')
          print('SOURCE',receipt['source_report_sha256'])
          print('TOOL',receipt['tool_report_sha256'])
          PY
            ) > "$e/VERIFY_RAW.log" 2>&1
            echo "$?" > "$e/VERIFY_EXIT.txt"
          else
            echo SKIPPED_NATIVE_RED > "$e/VERIFY_RAW.log"; echo SKIPPED_RED > "$e/VERIFY_EXIT.txt"
          fi
          "$py" -m pip install --disable-pip-version-check --no-input 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu > "$e/FULL_INSTALL_RAW.log" 2>&1
          first="$?"
          if [ "$first" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input 'transformers==5.20.2' 'peft==0.21.2' >> "$e/FULL_INSTALL_RAW.log" 2>&1
            second="$?"
          else
            second=1
          fi
          if [ "$first" = 0 ] && [ "$second" = 0 ]; then echo 0 > "$e/FULL_INSTALL_EXIT.txt"; else echo 1 > "$e/FULL_INSTALL_EXIT.txt"; fi
          if [ "$(cat "$e/FULL_INSTALL_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=10s 10m "$py" -m unittest discover -s tests -p 'test_*.py' -q) > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else
            echo SKIPPED_FULL_DEPS_RED > "$e/FULL_RAW.log"; echo SKIPPED_RED > "$e/FULL_EXIT.txt"
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 7dd2ef1a3e187187aeb2d2ebb955291798c37356 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 7dd2ef1a3e187187aeb2d2ebb955291798c37356 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - name: Preserve original native pilot raw (including RED)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run114-atlas-cqp20-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run114/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce exact source, resources, native and software; no STEP2 promotion
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run114"
          for n in SOURCE RESOURCE INSTALL COMPILE FOCUSED BOOTSTRAP NATIVE VERIFY FULL_INSTALL FULL PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; original raw retained; no STEP2/Redmi/JEPA gate promotion"
              tail -60 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo RUN114_ATLAS_CQP20_LINUX_NATIVE_SCOPED_ONLY_NO_GATE_PROMOTION
