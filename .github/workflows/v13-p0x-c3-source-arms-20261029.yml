name: V13 P0X 600-call C3 source-arm software-only preflight
on:
  push:
    branches: [codex/v13-p0x-c3-source-arms-20261029]
    paths:
      - '.github/workflows/v13-p0x-c3-source-arms-20261029.yml'
      - 'v13/code/scripts/p0x_c3_source_arms.py'
      - 'v13/code/tests/test_p0x_c3_source_arms.py'
permissions:
  contents: read
concurrency:
  group: v13-p0x-c3-source-arms
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Prospective source pins, 600 source-arm controls and privacy
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-p0x-source-arms"
          mkdir -p "$e"
          trap '(cd "$e"; find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)' EXIT
          git rev-parse HEAD > "$e/HEAD.txt"
          check() { [ "$(git hash-object "$2")" = "$1" ]; }
          {
            check 27074170ff9e6474e3e181afbd648005ca50a22c v13/code/docs/proofs/continuation-20261029/P0X_C3_SOURCE_ARMS_PREREG.md
            check 8fdc3f972c92679d82e01c4384d192723d16d171 v13/code/docs/proofs/continuation-20261029/P0X_C3_SOURCE_ARMS_BUILD_STATE.json
            check e159e7636362b6cee82dc5cd9d01d214f54d1850 v13/code/scripts/p0x_c3_source_arms.py
            check f24f54f2e0c629e0fa2f4d34c158a1f412a64adb v13/code/tests/test_p0x_c3_source_arms.py
            check 7ec4e877ad5ea3eed1c60102dac3baa15391dd2b v13/code/scripts/p0x_independent_source_holdout.py
            check a51cb76937febb0016d5a4bd71ccf08b164bead5 v13/code/scripts/p0x_c3_150_baseline.py
            check e85b0d636c75d6c6cf0cdd7f45a18609c2c4b04b v13/code/docs/proofs/continuation-20261029/P0X_150_SOURCE_HOLDOUT_REGISTRATION.json
            check 218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
            git merge-base --is-ancestor 577366b0059d8367f5c5446afc62b0d524d35768 HEAD
            echo P0X_SOURCE_ARMS_PINS_OK
          } > "$e/SOURCE_RAW.log" 2>&1
          python3 -m venv "$RUNNER_TEMP/v13-p0x-arms-venv"
          py="$RUNNER_TEMP/v13-p0x-arms-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
          python3 -m compileall -q v13/code/scripts/p0x_c3_source_arms.py v13/code/tests/test_p0x_c3_source_arms.py > "$e/COMPILE_RAW.log" 2>&1
          (cd v13/code && timeout --signal=TERM --kill-after=5s 180s "$py" -m unittest -v tests.test_p0x_independent_source_holdout tests.test_p0x_c3_150_baseline tests.test_p0x_c3_source_arms) > "$e/FOCUSED_RAW.log" 2>&1
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 577366b0059d8367f5c5446afc62b0d524d35768 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          grep -q CLEAN "$e/PRIVACY_RAW.log"
          git diff --check 577366b0059d8367f5c5446afc62b0d524d35768 HEAD
          echo P0X_SOURCE_ARMS_SOFTWARE_ONLY_NO_NATIVE_NO_GATE > "$e/STATUS.txt"
      - name: Preserve raw including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-p0x-source-arms-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-p0x-source-arms/
          if-no-files-found: error
          retention-days: 30
