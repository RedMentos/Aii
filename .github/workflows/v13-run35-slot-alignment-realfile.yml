name: V13 Run35 exact-row aligned vs scrambled World-JEPA real-file
on:
  push:
    branches: [assistant/v13-run35-world-jepa-slot-alignment-ablation-20261031-hourly11]
    paths:
      - '.github/workflows/v13-run35-slot-alignment-realfile.yml'
permissions:
  contents: read
concurrency:
  group: v13-native-c3-ag12-20261030
  cancel-in-progress: false
jobs:
  realfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    env:
      V13_NO_AUTOSTART: '1'
      DO_NOT_TRACK: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin source, run exact-row real-file experiment and preserve failed raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run35-realfile"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          41745d62182e4cf79e8e7a729d3fb360546490d2 v13/code/docs/WORLD_JEPA_SLOT_ALIGNMENT_ABLATION_PREREG_RUN35_20261031.md
          9675261fe82f635e0bf9b9be592a9e5d11aa16a1 v13/code/v13/world_jepa_slot_scramble_candidate.py
          219bf7233cb91c746c89a60f9b7789dc3b5ca9ef v13/code/scripts/run35_world_jepa_slot_alignment_real.py
          9aac2a89ae0cb6a427c0247a878e7b96d5cd6a87 v13/code/tests/test_run35_world_jepa_slot_alignment.py
          99a686a131a1bdc89efe0d0cf9610ec54cbd853b v13/code/v13/world_jepa.py
          2fd1366dc1b6d8c02803ee3254020f70e5bf3eb4 v13/code/scripts/z12b_world_jepa.py
          67e14e0d03c50c4767b74d5b02a819a95c6cc262 v13/code/v13/world_jepa_slot_candidate.py
          dbf3af3f8bc61a846eb542c7db3cc034e94f5bd7 v13/code/scripts/run28_world_jepa_slot_real.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run35-real-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run35-real-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 4m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_run35_world_jepa_slot_alignment tests.test_world_jepa_slot_candidate_run28 tests.test_run28_world_jepa_slot_real) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PIN_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          if [ "$(cat "$e/TEST_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 43m env PYTHONPATH=.:tests:scripts "$py" scripts/run35_world_jepa_slot_alignment_real.py --out "$e/RESULT.json" --work-root "$e/work") > "$e/REALFILE_RAW.log" 2>&1
            echo "$?" > "$e/REALFILE_EXIT.txt"
          else echo SKIPPED_TEST_RED > "$e/REALFILE_RAW.log"; echo 99 > "$e/REALFILE_EXIT.txt"; fi
          if [ -f "$e/RESULT.json" ]; then
            "$py" - "$e/RESULT.json" "$e/work" > "$e/REPORT_CHECK_RAW.log" 2>&1 <<'PY'
          import json,sys,math,pathlib
          r=json.load(open(sys.argv[1])); work=pathlib.Path(sys.argv[2])
          assert r['schema']=='v13.run35.world_jepa_slot_alignment_exact_row.v1'
          assert r['registered'] and r['seeds']==[301,302,303]
          assert r['args']=={'train':4000,'cf':150,'attr':300,'steps':3000}
          assert r['status'] in ('SHADOW_CANDIDATE_FAIL','SHADOW_CANDIDATE_PASS_NOT_PROMOTED')
          assert r['exact_same_collected_rows'] and r['parameter_count_matched']
          assert not r['global_96d_capacity_control_complete']
          assert r['age0']=='RECORD_ONLY' and r['step2']=='UTILITY_FAIL'
          assert r['b3']=='NO_PROMOTION' and r['body_jepa']=='UNAVAILABLE'
          assert r['jepa_weight']==0 and r['world_jepa_authority']=='SHADOW'
          assert not r['redmi_measured'] and not r['whole_system_complete']
          assert len(r['aligned'])==len(r['scrambled'])==3
          assert all(row['seed']==seed and row['capacity']['world_concat_dim']==96
                     for arm in ('aligned','scrambled')
                     for seed,row in zip((301,302,303),r[arm]))
          assert all((work/f'{arm}-{seed}-RESULT.json').is_file()
                     for arm in ('aligned','scrambled') for seed in (301,302,303))
          assert len(r['aligned_gates'])==len(r['scrambled_gates'])==6
          assert len(r['aligned_w7'])==len(r['scrambled_w7'])==3
          assert all(type(v) is bool for g in
                     (r['aligned_gates'],r['scrambled_gates'],r['aligned_w7'],r['scrambled_w7'])
                     for v in g.values())
          assert all(type(v) is bool for k,v in r['locality'].items() if k.startswith('L'))
          print('RUN35_REALFILE_CLOSED_SHADOW_NO_PROMOTION',r['status'],r['locality'],r['aligned_gates'],r['aligned_w7'])
          PY
            echo "$?" > "$e/REPORT_CHECK_EXIT.txt"
          else echo NO_RESULT_RED > "$e/REPORT_CHECK_RAW.log"; echo 99 > "$e/REPORT_CHECK_EXIT.txt"; fi
          python3 -m py_compile v13/code/v13/world_jepa_slot_scramble_candidate.py v13/code/scripts/run35_world_jepa_slot_alignment_real.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 1f7f7bd13e7dd09638765297a9dc6c18eab431b0 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 1f7f7bd13e7dd09638765297a9dc6c18eab431b0 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve all original real-file raw and failed per-seed checkpoints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run35-realfile-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run35-realfile/
          if-no-files-found: error
          retention-days: 90
      - name: Require complete original raw and all stages, not learning promotion
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-run35-realfile"
          for stage in PINS VENV DEPS TEST REALFILE REPORT_CHECK COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${stage}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN35_EXACT_ROW_REALFILE_SHADOW_ONLY_NO_WORLD_JEPA_OR_AGE_PROMOTION
