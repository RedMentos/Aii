name: V13 STEP2 matched C3 native executor SOFTWARE guard (no native)
on:
  push:
    branches: [assistant/v13-step2-native-rule-transport-20261029]
permissions:
  contents: read
  actions: read
concurrency:
  group: v13-exact-rule-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      V13_NO_AUTOSTART: '1'
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Pin original source, verify and run software-only preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          e="$RUNNER_TEMP/v13-exact-rule-preflight"
          mkdir -p "$e/original" "$e/experiment"
          git rev-parse HEAD > "$e/HEAD.txt"
          source_ok=0
          check() {
            observed="$(git hash-object "$2" 2>/dev/null)" || return 1
            printf '%s %s\n' "$observed" "$2" >> "$e/SOURCE_RAW.log"
            [ "$observed" = "$1" ]
          }
          check b7044736bb0ffec0b577c7720169257f3970f9e8 v13/code/docs/proofs/continuation-20261029/STEP2_EXACT_RULE_NATIVE_REPLAY_PREREG.md || source_ok=1
          check f98caa025a8ba28e8ecdb5d3f29660937913ffed v13/code/docs/proofs/continuation-20261029/STEP2_RULE_TRANSPORT_NATIVE_EXECUTOR_PREREG.md || source_ok=1
          check 69bbcb22f448c258bf147dfabf181a9909c90207 v13/code/docs/proofs/continuation-20261029/STEP2_RULE_TRANSPORT_BRANCH_BUILD_STATE.json || source_ok=1
          check 9b43ce0721213775ef7067169ec4bd6f0b1e0f0e v13/code/scripts/step2_exact_rule_transport_native.py || source_ok=1
          check a4d28951e80ca034d752f4d030d4196ec4f70904 v13/code/tests/test_step2_exact_rule_transport_native.py || source_ok=1
          check 58e0aceea1b99e1fc770296902bdb641608e6cc3 v13/code/scripts/step2_exact_rule_native_replay_preflight.py || source_ok=1
          check 454d7bff84f074338364facbe6afd9e26209484e v13/code/tests/test_step2_exact_rule_native_replay_preflight.py || source_ok=1
          check 4065d3453eefcbd35c2de502d1c3c219bf20c63a v13/code/scripts/step2_rule_revision_ambiguity_candidate.py || source_ok=1
          check 6068849a19f53ad1bdbd200739b95731f8a1fb20 v13/code/scripts/run118_step2_rule_pointer_choice_candidate.py || source_ok=1
          check 959cc898e2fd6386d999443b914a5b7c6701386d v13/code/scripts/run117_step2_rule_source_candidate.py || source_ok=1
          check 468d2bc72a5584fc6e5c67292968feb3a4125c07 v13/code/scripts/run111_step2_fresh_native_preflight.py || source_ok=1
          check 6cc3d52524e8c9122710eae2a908d024f0f44f24 v13/code/scripts/run109_step2_fresh_fixtures.py || source_ok=1
          echo "$source_ok" > "$e/SOURCE_EXIT.txt"
          gh run download 40805361392 -n run116-sixfixture-cqp20-native-40805361392-4a6473afbe7404be5cf74f24d20a47d2d99fd0f6 -D "$e/original" > "$e/DOWNLOAD_RAW.log" 2>&1
          echo "$?" > "$e/DOWNLOAD_EXIT.txt"
          python3 - "$e/original" > "$e/ORIGINAL_VERIFY_RAW.log" 2>&1 <<'PY'
          from pathlib import Path
          import hashlib,sys
          d=Path(sys.argv[1])
          assert (d/'STEP2_RAW.json').is_file()
          assert hashlib.sha256((d/'STEP2_RAW.json').read_bytes()).hexdigest()=='c0cd539ec28f9583abe25c93f48871597df6758c442782eb6fedd56ad612105f'
          lines=(d/'SHA256SUMS.txt').read_text().splitlines()
          assert len(lines)==29
          for line in lines:
              h,p=line.split('  ',1)
              assert hashlib.sha256((d/p.removeprefix('./')).read_bytes()).hexdigest()==h,p
          print('ORIGINAL_RUN116_29_OF_29_HASHES_AND_SOURCE_SHA256_OK')
          PY
          echo "$?" > "$e/ORIGINAL_VERIFY_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-exact-rule-venv"
          py="$RUNNER_TEMP/v13-exact-rule-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/INSTALL_RAW.log" 2>&1
          deps_rc="$?"
          if [ "$deps_rc" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu >> "$e/INSTALL_RAW.log" 2>&1
            deps_rc="$?"
          fi
          if [ "$deps_rc" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input 'transformers==5.20.2' 'peft==0.21.2' >> "$e/INSTALL_RAW.log" 2>&1
            deps_rc="$?"
          fi
          echo "$deps_rc" > "$e/INSTALL_EXIT.txt"
          python3 -m compileall -q v13/code/scripts/step2_exact_rule_native_replay_preflight.py v13/code/tests/test_step2_exact_rule_native_replay_preflight.py v13/code/scripts/step2_exact_rule_transport_native.py v13/code/tests/test_step2_exact_rule_transport_native.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          if [ "$source_ok" = 0 ] && [ "$(cat "$e/DOWNLOAD_EXIT.txt")" = 0 ] && [ "$(cat "$e/ORIGINAL_VERIFY_EXIT.txt")" = 0 ] && [ "$deps_rc" = 0 ] && [ "$(cat "$e/COMPILE_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 180s "$py" -m scripts.step2_exact_rule_native_replay_preflight --source-report "$e/original/STEP2_RAW.json" --out "$e/experiment/pairs.json") > "$e/PROBE_RAW.log" 2>&1
            echo "$?" > "$e/PROBE_EXIT.txt"
            (cd v13/code && V13_RUN116_SOURCE_REPORT="$e/original/STEP2_RAW.json" timeout --signal=TERM --kill-after=5s 180s "$py" -m unittest -v tests.test_step2_exact_rule_transport_native tests.test_step2_exact_rule_native_replay_preflight tests.test_step2_rule_revision_ambiguity_candidate tests.test_run118_step2_rule_pointer_choice_candidate tests.test_run117_step2_rule_source_candidate) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
            (cd v13/code && timeout --signal=TERM --kill-after=10s 18m "$py" -m unittest discover -s tests -p 'test_*.py') > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else
            for n in PROBE FOCUSED FULL; do echo SKIPPED_PREREQ_RED > "$e/${n}_RAW.log"; echo SKIPPED_RED > "$e/${n}_EXIT.txt"; done
          fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 8d3e9e4ef87b9b47fa03ff12628ea63bdcd71cb1 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 8d3e9e4ef87b9b47fa03ff12628ea63bdcd71cb1 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          exit 0
      - name: Preserve original raw (software-only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: step2-exact-rule-preflight-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-exact-rule-preflight/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce preflight without native or gate promotion
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-exact-rule-preflight"
          for n in SOURCE DOWNLOAD ORIGINAL_VERIFY INSTALL COMPILE PROBE FOCUSED FULL PRIVACY DIFF; do
            if [ "$(cat "$e/${n}_EXIT.txt")" != 0 ]; then
              echo "$n RED; raw retained; no native execution or STEP2 promotion"
              tail -40 "$e/${n}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo STEP2_NATIVE_EXECUTOR_SOFTWARE_GUARD_ONLY_NO_NATIVE
