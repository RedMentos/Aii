name: V13 Boss Android goal to JEPA synthetic E2E
on:
  push:
    branches:
      - boss/v13-android-goal-learn-demo-20261111
  pull_request:
    paths:
      - 'v13/code/v13/android_goal_learning_demo.py'
      - 'v13/code/tests/test_android_goal_learning_demo.py'
      - '.github/workflows/v13-boss-android-goal-to-jepa-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  goal-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: v13/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest numpy==1.26.4
      - name: Verify real broker + SQLite simulation + numeric JEPA checkpoint
        run: |
          python -m py_compile v13/android_goal_learning_demo.py tests/test_android_goal_learning_demo.py
          python -m pytest -q -s tests/test_android_goal_learning_demo.py tests/test_android_control_sim.py tests/test_android_sim_jepa_probe.py
      - name: Exercise command line without Android permissions
        run: |
          PYTHONPATH=. python -m v13.android_goal_learning_demo --home /tmp/v13-android-goal-synthetic --count 18 --simulation-only
