name: V13 P2X native receiver scorer source-only
on:
  push:
    branches: [codex/v13-p2x-native-eval-scorer-20261029]
    paths:
      - 'v13/code/scripts/p2x_native_receiver_eval_scorer.py'
      - 'v13/code/tests/test_p2x_native_receiver_eval_scorer.py'
      - '.github/workflows/v13-p2x-native-eval-scorer-source-20261029.yml'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compile, eleven adversarial raw scorer tests and privacy
        run: |
          set -euo pipefail
          python3 -m py_compile v13/code/scripts/p2x_native_receiver_eval_scorer.py v13/code/tests/test_p2x_native_receiver_eval_scorer.py
          python3 -m unittest discover -s v13/code/tests -p 'test_p2x_native_receiver_eval_scorer.py' -v
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 9a5184df4d06d0adc7deed5c3ff183ef8657fc42 --head HEAD --no-worktree
          git diff --check 9a5184df4d06d0adc7deed5c3ff183ef8657fc42 HEAD
