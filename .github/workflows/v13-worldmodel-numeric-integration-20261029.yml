name: V13 exact World-Model donor numeric integration with C3 BJ1 source
on:
  push:
    branches: [codex/v13-worldmodel-numeric-integration-20261029-auto10ar]
    paths:
      - '.github/workflows/v13-worldmodel-numeric-integration-20261029.yml'
      - 'v13/code/v13/world_model.py'
      - 'v13/code/tests/test_worldmodel_numeric_guard_20261029.py'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact donor and cross-organ lightweight focused tests
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-wm-integration"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/v13/world_model.py v13/code/tests/test_worldmodel_numeric_guard_20261029.py v13/code/v13/body_jepa.py v13/code/scripts/ask_verified_budget.py v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/SOURCE_BLOBS.txt"
          test "$(sed -n '1p' "$e/SOURCE_BLOBS.txt")" = 356540e09b740240768ede47a653e43e70452200 && test "$(sed -n '2p' "$e/SOURCE_BLOBS.txt")" = 318e3ecff9d5b899510dd71d1561dcbe4b154ae9 && test "$(tail -1 "$e/SOURCE_BLOBS.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          echo "$?" > "$e/CANON_DONOR_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-wm-integration-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-wm-integration-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
          else
            for stage in DEPS PIP_CHECK; do echo SKIPPED > "$e/${stage}_EXIT.txt"; echo SKIPPED > "$e/${stage}_RAW.log"; done
          fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_worldmodel_numeric_guard_20261029 tests.test_world_model tests.test_worldmodel_stage_binding_20261029 tests.test_worldmodel_selection_binding_20261029 tests.test_worldmodel_realstore_integration_20261029 tests.test_worldmodel_inverse_heldout_baseline_20261029 tests.test_worldjepa_fixture_provenance_20261029 tests.test_world_jepa_readonly_store tests.test_c3_hedge_veto_20261029 tests.test_bodyjepa_derangement_bound_20261029) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else echo SKIPPED > "$e/FOCUSED_EXIT.txt"; echo SKIPPED > "$e/FOCUSED_RAW.log"; fi
          "$py" -m py_compile v13/code/v13/world_model.py v13/code/v13/body_jepa.py v13/code/scripts/ask_verified_budget.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base b4c9825f23509d1839e7b964c824efb12d1a66bf --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check b4c9825f23509d1839e7b964c824efb12d1a66bf HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original raw on failure or success
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-wm-integration-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-wm-integration/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce exact donor and all tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-wm-integration"
          for stage in CANON_DONOR VENV DEPS PIP_CHECK FOCUSED COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained"
              tail -60 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'WORLD_MODEL_EXACT_DONOR_SOFTWARE_ONLY_NO_GATE'
