name: V13 Run443 real offline Age0 human-memory lifecycle
on:
  pull_request:
    paths:
      - '.github/workflows/run443-offline-human-memory-lifecycle.yml'
      - 'v13/code/tests/test_run443_offline_human_memory_lifecycle.py'
      - 'v13/code/docs/proofs/continuation-20261026/run443-offline-memory/**'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      NO_MODEL_DOWNLOADS: '1'
      NEEDLE_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Isolated model-free dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/run443"
          "$RUNNER_TEMP/run443/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Run real SQLite offline human memory and inherited regressions
        run: |
          cd v13/code
          export PYTHONPATH="$PWD:$PWD/scripts"
          sha256sum tests/test_run443_offline_human_memory_lifecycle.py | tee "$RUNNER_TEMP/run443-source-sha256.txt"
          set +e
          "$RUNNER_TEMP/run443/bin/python" -m unittest -v tests.test_run443_offline_human_memory_lifecycle tests.test_phone_chat_sessions_run89 tests.test_memory_human_decision_lineage_run270 tests.test_history_lineage tests.test_atomic_forget_generation_run290 > "$RUNNER_TEMP/run443-tests.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/run443-tests.txt"
          printf 'EXIT=%s\n' "$status" > "$RUNNER_TEMP/run443-exit.txt"
          exit "$status"
      - name: Official privacy scan
        if: always()
        run: |
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree
      - name: Retain raw model-free lifecycle proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run443-offline-lifecycle-${{ github.sha }}
          path: |
            ${{ runner.temp }}/run443-tests.txt
            ${{ runner.temp }}/run443-exit.txt
            ${{ runner.temp }}/run443-source-sha256.txt
          if-no-files-found: warn
          retention-days: 30
