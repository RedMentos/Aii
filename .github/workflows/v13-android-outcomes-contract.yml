name: V13 Android outcome contract

on:
  pull_request:
    paths:
      - 'v13/code/v13/android_outcomes.py'
      - 'v13/code/tests/test_android_outcomes.py'
      - '.github/workflows/v13-android-outcomes-contract.yml'
  push:
    branches:
      - gpt6/v13-private-remote-bridge-20261111
    paths:
      - 'v13/code/v13/android_outcomes.py'
      - 'v13/code/tests/test_android_outcomes.py'
      - '.github/workflows/v13-android-outcomes-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: v13/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest==9.2.0
      - name: Verify approved action, local stop, no fake observation or replay
        run: |
          python -m py_compile v13/android_outcomes.py tests/test_android_outcomes.py
          python -m pytest -q tests/test_android_outcomes.py
