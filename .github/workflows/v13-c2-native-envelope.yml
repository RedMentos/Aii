name: V13 C2 typed executive contract
on:
  push:
    branches:
      - gpt6/core-c2-typed-fields-20261119
  pull_request:
    paths:
      - 'v13/code/v13/fastpolicy.py'
      - 'v13/code/tests/test_c2_native_envelope_20261119.py'
      - '.github/workflows/v13-c2-native-envelope.yml'
jobs:
  c2-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q v13/code/v13/fastpolicy.py v13/code/tests/test_c2_native_envelope_20261119.py
      - run: python -m pip install pytest
      - run: PYTHONPATH=v13/code python -m pytest -q v13/code/tests/test_c2_native_envelope_20261119.py
