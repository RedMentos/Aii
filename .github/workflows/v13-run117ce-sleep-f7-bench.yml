name: V13 Run117CE bounded F7 Sleep Linux software overhead
on:
  push:
    branches:
      - assistant/v13-run117ce-sleep-f7-bounded-bench-20261101-hourly11
    paths:
      - .github/workflows/v13-run117ce-sleep-f7-bench.yml
permissions:
  contents: read
jobs:
  bounded-linux-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Source-pinned Store benchmark and closed raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run117ce"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          3a9fd897aa2e8e41bf9a38db353fd9c533496e3c v13/code/scripts/run117ce_sleep_f7_bounded_bench.py
          51f89394fe7cd236554539a94779f3ac33c0d388 v13/code/tests/test_run117ce_sleep_f7_bounded_bench.py
          259c10148b887fee00dbb3c0c706b80081dcbc7f v13/code/docs/PREREG_RUN117CE_SLEEP_F7_BENCH_20261101.md
          55cc54a510501ba4b1465254beaecd9ec81ec6db v13/code/v13/sleep_offline.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run117ce-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run117ce-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' 'prompt-toolkit==3.0.52' 'psutil==7.0.0' 'PyYAML==6.0.2' 'Pillow==11.3.0' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo SKIPPED > "$e/DEPS_RAW.log"; echo SKIPPED > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout 180s "$py" -m unittest -v tests.test_run117ce_sleep_f7_bounded_bench tests.test_run117cb_sleep_session_fairness) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
            (cd v13/code && timeout 240s "$py" scripts/run117ce_sleep_f7_bounded_bench.py --sessions 32 --turns 70 --out "$e/BENCH_32x70.json") > "$e/BENCH_32x70_RAW.log" 2>&1
            echo "$?" > "$e/BENCH_32x70_EXIT.txt"
            (cd v13/code && timeout 240s "$py" scripts/run117ce_sleep_f7_bounded_bench.py --sessions 128 --turns 1 --out "$e/BENCH_128x1.json") > "$e/BENCH_128x1_RAW.log" 2>&1
            echo "$?" > "$e/BENCH_128x1_EXIT.txt"
          else
            for stage in TEST BENCH_32x70 BENCH_128x1; do echo SKIPPED > "$e/${stage}_RAW.log"; echo 99 > "$e/${stage}_EXIT.txt"; done
          fi
          if [ -f "$e/BENCH_32x70.json" ] && [ -f "$e/BENCH_128x1.json" ]; then
            "$py" - "$e" <<'PY' > "$e/VERIFY_RAW.log" 2>&1
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1])
          for name,n,t in [('BENCH_32x70.json',32,70),('BENCH_128x1.json',128,1)]:
              r=json.loads((e/name).read_text())
              assert r['status']=='INTEGRITY_PASS' and r['evidence_class']=='LINUX_SOFTWARE_STORE_ONLY'
              assert r['session_count']==n and r['turns_per_session']==t and r['total_turns']==n*t
              assert r['closed_store_ok'] and r['native_model_calls']==0 and not r['redmi_measured']
              assert r['age0']=='RECORD_ONLY' and r['step2']=='UTILITY_FAIL'
              assert r['jepa_weight']==0 and r['learning_authority']==0 and not r['whole_system_complete']
              assert sum(x['turns'] for x in r['cycle_counts'])==n*t
              assert r['cycle_counts'][-1]['sessions']==0
          print('RUN117CE_LINUX_SOFTWARE_ONLY_VERIFIED')
          PY
            echo "$?" > "$e/VERIFY_EXIT.txt"
          else echo MISSING_REPORT > "$e/VERIFY_RAW.log"; echo 99 > "$e/VERIFY_EXIT.txt"; fi
          python3 -m py_compile v13/code/scripts/run117ce_sleep_f7_bounded_bench.py v13/code/tests/test_run117ce_sleep_f7_bounded_bench.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 8197b84546194c8ba5c7a0c6614cada66b6a3a75 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 8197b84546194c8ba5c7a0c6614cada66b6a3a75 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original numeric software raw GREEN or RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117ce-linux-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117ce/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce integrity only, not a performance/Redmi gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117ce"
          for stage in PINS VENV DEPS TEST BENCH_32x70 BENCH_128x1 VERIFY COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw preserved"
              tail -60 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
          echo RUN117CE_LINUX_SOFTWARE_INTEGRITY_ONLY_NO_REDMi_OR_GATE_PROMOTION
