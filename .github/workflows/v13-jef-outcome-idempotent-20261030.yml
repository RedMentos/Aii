name: V13 JEF FINAL self-outcome retry idempotency
on:
  push:
    branches: [codex/v13-jef-outcome-idempotent-20261030-auto11l]
    paths:
      - '.github/workflows/v13-jef-outcome-idempotent-20261030.yml'
      - 'v13/code/v13/jefoutcome.py'
      - 'v13/code/tests/test_jefoutcome_session_20261030.py'
      - 'v13/code/tests/test_jefoutcome_idempotent_20261030.py'
      - 'v13/code/docs/proofs/continuation-20261030/JEF_OUTCOME_IDEMPOTENT_PREREG_20261030.md'
permissions:
  contents: read
jobs:
  focused-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run preregistered session-boundary tests and close raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-jef-outcome-idempotent"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object v13/code/v13/agi/live.py v13/code/v13/skilllive.py v13/code/v13/jefoutcome.py v13/code/tests/test_jefoutcome.py v13/code/tests/test_jefoutcome_session_20261030.py v13/code/tests/test_skilllive_jef_route_correction_20261030.py v13/code/tests/test_jefoutcome_idempotent_20261030.py v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md > "$e/SOURCE_BLOBS.txt"
          test "$(tail -1 "$e/SOURCE_BLOBS.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          echo "$?" > "$e/CANON_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-jef-outcome-idempotent-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-jef-outcome-idempotent-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
          else
            echo SKIPPED > "$e/DEPS_EXIT.txt"
            echo SKIPPED > "$e/PIP_CHECK_EXIT.txt"
          fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_jefoutcome_idempotent_20261030 tests.test_skilllive_jef_route_correction_20261030 tests.test_skilllive tests.test_jefoutcome_session_20261030 tests.test_jefoutcome tests.test_jef_operator_session_20261030 tests.test_contextos_operator_session_20261029) > "$e/FOCUSED_RAW.log" 2>&1
            echo "$?" > "$e/FOCUSED_EXIT.txt"
          else
            echo SKIPPED > "$e/FOCUSED_EXIT.txt"
            echo SKIPPED > "$e/FOCUSED_RAW.log"
          fi
          "$py" -m py_compile v13/code/v13/agi/live.py v13/code/v13/jefoutcome.py v13/code/tests/test_skilllive_jef_route_correction_20261030.py v13/code/tests/test_jefoutcome_idempotent_20261030.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base c55b8e6f54ce28a7ec7e2400809f051e0ec94b81 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check c55b8e6f54ce28a7ec7e2400809f051e0ec94b81 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve complete original raw evidence even on RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-jef-outcome-idempotent-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-jef-outcome-idempotent/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce focused evidence without gate promotion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-jef-outcome-idempotent"
          for stage in CANON VENV DEPS PIP_CHECK FOCUSED COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained; no gate promotion"
              tail -70 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'JEF_OUTCOME_IDEMPOTENT_SOFTWARE_ONLY_NO_NATIVE_NO_REDMI'
