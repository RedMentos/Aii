name: V13 Run14T seed311 C3 schema constrained source preflight
on:
  push:
    branches: [assistant/v13-run14t-c3-schema-constraint-20261030-hourly11]
    paths:
      - '.github/workflows/v13-run14t-c3-schema-preflight.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify prereg fixture source and synthetic independent replay
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run14t-preflight"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          0bd68dfbe2d9181ea71b21d5768184b4f8401a82 v13/code/docs/RUN14T_C3_SCHEMA_CONSTRAINT_PREREG_20261030.md
          8f1b6731a61f94ce250a122d24789b4c97aead42 v13/code/docs/fixtures/run14t_c3_schema_seed311_20261030.json
          6e3778776100561881f9140a6b54d169d9ebf46a v13/code/scripts/run14t_c3_schema_native.py
          986a59fa07966f83761001b87eea328e176224ff v13/code/scripts/run14t_c3_schema_native_verify.py
          4e42112310fa5ac244355877e393ebbb35e56a5b v13/code/tests/test_run14t_c3_schema_native.py
          41ae26e01932ea7e89188e3a544bef103f1b3ec6 v13/code/v13/agi/c3_structured_source_shadow_run14k.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run14t-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run14t-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
          else
            echo 99 > "$e/DEPS_EXIT.txt";echo VENV_RED > "$e/DEPS_RAW.log"
            echo 99 > "$e/PIP_CHECK_EXIT.txt";echo VENV_RED > "$e/PIP_CHECK_RAW.log"
          fi
          if [ "$(cat "$e/PINS_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 5m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v \
              tests.test_run14t_c3_schema_native \
              tests.test_run14l_c3_structured_native \
              tests.test_c3_structured_source_shadow_run14k) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PREREQUISITE > "$e/TEST_RAW.log";echo 99 > "$e/TEST_EXIT.txt";fi
          python3 -m py_compile v13/code/scripts/run14t_c3_schema_native.py v13/code/scripts/run14t_c3_schema_native_verify.py v13/code/tests/test_run14t_c3_schema_native.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 080e2f9daec2f6b51e05c26c041993dd7718250a --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 080e2f9daec2f6b51e05c26c041993dd7718250a HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve complete raw even on preflight RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run14t-preflight-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run14t-preflight/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce all preflight stages GREEN
        if: always()
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run14t-preflight"
          for stage in PINS VENV DEPS PIP_CHECK TEST COMPILE PRIVACY DIFF; do
            echo "$stage $(cat "$e/${stage}_EXIT.txt")"
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              tail -100 "$e/${stage}_RAW.log" || true
              exit 1
            fi
          done
          echo 'RUN14T_SYNTHETIC_ONLY; NO_NATIVE_EVIDENCE'
