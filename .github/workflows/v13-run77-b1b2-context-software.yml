name: V13 Run77 disjoint B1 B2 semantic context utility software prereg
on:
  push:
    branches: [assistant/v13-run77-b1b2-disjoint-context-utility-20261031-auto11]
    paths: ['.github/workflows/v13-run77-b1b2-context-software.yml']
permissions:
  contents: read
concurrency:
  group: v13-run77-b1b2-context-software
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen fixture and scorer with B1 B2 source guards
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run77-software"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          afdca4d0d227c1fd04a5b7fda01e3bb0d38a9a5e v13/code/docs/RUN77_B1B2_DISJOINT_CONTEXT_UTILITY_PREREG_20261031.md
          6044d7bb48d7c8de0801cce96c6af466b1f9d547 v13/code/scripts/jef_b1b2_context_fixture_797.py
          eebd79d1a454b9b3dcda42be425666ad3e609cd6 v13/code/scripts/run77_b1b2_context_native.py
          e42222c39d9a065b653b21374f336be363d6ea87 v13/code/scripts/run77_b1b2_context_verify.py
          a848c3b924d32e3d69cbccbb75e23837d372f3a1 v13/code/tests/test_run77_b1b2_context_fixture.py
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run77-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run77-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          for t in test_run77_b1b2_context_fixture.py test_b1b2_latest_user_offer_candidate.py test_b1b2_topic_partition_candidate.py; do
            key="${t%.py}"
            if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
              timeout --signal=TERM --kill-after=5s 6m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m unittest discover -s v13/code/tests -p "$t" -v > "$e/${key}_RAW.log" 2>&1
              echo "$?" > "$e/${key}_EXIT.txt"
            else echo DEPS_RED > "$e/${key}_RAW.log"; echo 99 > "$e/${key}_EXIT.txt"; fi
          done
          python3 -m compileall -q v13/code/scripts/jef_b1b2_context_fixture_797.py v13/code/scripts/run77_b1b2_context_native.py v13/code/scripts/run77_b1b2_context_verify.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 98c7951720f812d7f65aee97dcfbc222cf252edc --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 98c7951720f812d7f65aee97dcfbc222cf252edc HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Retain original raw including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run77-software-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run77-software/
          if-no-files-found: error
          retention-days: 90
      - name: Require all preflight gates
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-run77-software"
          for s in PINS VENV DEPS test_run77_b1b2_context_fixture test_b1b2_latest_user_offer_candidate test_b1b2_topic_partition_candidate COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN77_DISJOINT_B1B2_SOFTWARE_ONLY_NO_NATIVE_OR_AGE_PROMOTION
