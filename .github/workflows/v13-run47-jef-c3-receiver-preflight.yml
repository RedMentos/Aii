name: V13 Run47 seed409 JEF C3 native receiver source-only preflight
on:
  push:
    branches: [assistant/v13-run47-jef-c3-typed-receiver-native-20261031-hourly11]
    paths: ['.github/workflows/v13-run47-jef-c3-receiver-preflight.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen seed409 source and strict fake-native independent replay
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run47-preflight"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          2a342ec1164b19aa46577cf77ccaba2406570120 v13/code/docs/fixtures/run47_jef_c3_typed_receiver_seed409.json
          e5a1a6d81ad6c0770373e14de056437be7df6844 v13/code/docs/RUN47_JEF_C3_TYPED_RECEIVER_NATIVE_PREREG_20261031.md
          4705a46640134e213aa00a86e02375d972c76cda v13/code/scripts/run47_jef_c3_typed_receiver_native.py
          d684572065fa220becf72a888b6303c4467ab8f3 v13/code/scripts/run47_jef_c3_typed_receiver_verify.py
          59f2738f9dab027cf1bb7b3026143f0bd9e9c773 v13/code/tests/test_run47_jef_c3_typed_receiver_native.py
          d1186642d5f4b7ef4af0699f07a2fe682b1484e2 v13/code/v13/agi/jef_eligibility_source_shadow_run46b.py
          22ed11e4a53d9eeae8fbc74a1753082b5785be2b v13/code/v13/runtime.py
          7af05962af41d0bc3f7dd18ef01d4eba55eabf99 v13/code/specs/models.json
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          sha256sum v13/code/docs/fixtures/run47_jef_c3_typed_receiver_seed409.json > "$e/FIXTURE_RAW.log" 2>&1
          test "$(cut -d' ' -f1 "$e/FIXTURE_RAW.log")" = 4015600687c392d7c36d17eeb289ad68fd958222d07bd87b4d7f60df0a8b0fad
          echo "$?" > "$e/FIXTURE_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run47-preflight-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run47-preflight-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          if [ "$bad" = 0 ] && [ "$(cat "$e/FIXTURE_EXIT.txt")" = 0 ] && [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=5s 3m env PYTHONPATH=.:tests:scripts "$py" -m unittest -v tests.test_run47_jef_c3_typed_receiver_native tests.test_run46b_jef_source_eligibility_shadow) > "$e/TEST_RAW.log" 2>&1
            echo "$?" > "$e/TEST_EXIT.txt"
          else echo SKIPPED_PIN_OR_DEPS_RED > "$e/TEST_RAW.log"; echo 99 > "$e/TEST_EXIT.txt"; fi
          "$py" -m py_compile v13/code/scripts/run47_jef_c3_typed_receiver_native.py v13/code/scripts/run47_jef_c3_typed_receiver_verify.py v13/code/tests/test_run47_jef_c3_typed_receiver_native.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base ec7fd2765330e49d775434decdc3b510a997bfe6 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check ec7fd2765330e49d775434decdc3b510a997bfe6 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve complete preflight raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run47-preflight-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run47-preflight/
          retention-days: 90
          if-no-files-found: error
      - name: Require all eight stages zero
        if: always()
        shell: bash
        run: |
          set -eu
          e="$RUNNER_TEMP/v13-run47-preflight"
          for s in PINS FIXTURE VENV DEPS TEST COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN47_SOURCE_ONLY_NO_NATIVE_OR_STEP2_PROMOTION
