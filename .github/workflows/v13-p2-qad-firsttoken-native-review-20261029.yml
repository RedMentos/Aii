name: V13 P2 QAD FP32 versus GGUF eight first-token native review
on:
  push:
    branches: [codex/v13-p2-firsttoken-native-review-20261029]
    paths:
      - '.github/workflows/v13-p2-qad-firsttoken-native-review-20261029.yml'
permissions:
  contents: read
concurrency:
  group: v13-p2-qad-fp32-real-value-serial-20261029
  cancel-in-progress: false
jobs:
  pinned-firsttoken:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      V13_NO_AUTOSTART: '1'
      PYTHONNOUSERSITE: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Execute preregistered pinned eight-probe model-forward diagnostic
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-p2-firsttoken-native-evidence"
          w="$RUNNER_TEMP/v13-p2-firsttoken-native-work"
          mkdir -p "$e" "$w/master" "$w/runtime"
          git rev-parse HEAD > "$e/HEAD.txt"
          python3 - "$w" > "$e/RESOURCE_RAW.log" 2>&1 <<'PY'
          import pathlib,shutil,sys
          p=pathlib.Path(sys.argv[1])
          print('free_bytes',shutil.disk_usage(p).free)
          assert shutil.disk_usage(p).free >= 4_000_000_000
          PY
          echo "$?" > "$e/RESOURCE_EXIT.txt"
          if [ "$(cat "$e/RESOURCE_EXIT.txt")" = 0 ]; then
            python3 -m venv "$w/venv" > "$e/VENV_RAW.log" 2>&1
            echo "$?" > "$e/VENV_EXIT.txt"
          else echo SKIPPED > "$e/VENV_EXIT.txt"; fi
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$w/venv/bin/python" -m pip install --no-input --disable-pip-version-check \
              --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.1' \
              > "$e/TORCH_RAW.log" 2>&1
            echo "$?" > "$e/TORCH_EXIT.txt"
          else echo SKIPPED > "$e/TORCH_EXIT.txt"; fi
          if [ "$(cat "$e/TORCH_EXIT.txt")" = 0 ]; then
            "$w/venv/bin/python" -m pip install --no-input --disable-pip-version-check \
              'transformers==5.20.2' 'tokenizers==0.23.1' 'safetensors==0.7.0' \
              > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo SKIPPED > "$e/DEPS_EXIT.txt"; fi
          if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
            curl -fL --retry 2 --connect-timeout 20 --max-time 300 \
              'https://github.com/ggml-org/llama.cpp/releases/download/b10964/llama-b10964-bin-ubuntu-x64.tar.gz' \
              -o "$w/runtime.tar.gz" > "$e/RUNTIME_DOWNLOAD_RAW.log" 2>&1
            echo "$?" > "$e/RUNTIME_DOWNLOAD_EXIT.txt"
            printf '%s  %s\n' '9abf88aea48a55d0f80edb1ee20220b186848cca0b4e919d71518cfd7ca67443' "$w/runtime.tar.gz" | sha256sum -c > "$e/RUNTIME_SHA_RAW.log" 2>&1
            echo "$?" > "$e/RUNTIME_SHA_EXIT.txt"
            for name in config.json tokenizer.json tokenizer_config.json chat_template.jinja model.safetensors; do
              curl -fL --retry 2 --connect-timeout 20 --max-time 900 \
                "https://huggingface.co/LiquidAI/LFM2.5-350M-GGUF/resolve/657e078c94084481950a2d555a941481f715536b/qad/$name?download=true" \
                -o "$w/master/$name" >> "$e/MASTER_DOWNLOAD_RAW.log" 2>&1 || break
            done
            test -f "$w/master/model.safetensors"
            echo "$?" > "$e/MASTER_DOWNLOAD_EXIT.txt"
            curl -fL --retry 2 --connect-timeout 20 --max-time 600 \
              'https://huggingface.co/LiquidAI/LFM2.5-350M-GGUF/resolve/657e078c94084481950a2d555a941481f715536b/LFM2.5-350M-QAD-Q4_0.gguf?download=true' \
              -o "$w/QAD.gguf" > "$e/GGUF_DOWNLOAD_RAW.log" 2>&1
            echo "$?" > "$e/GGUF_DOWNLOAD_EXIT.txt"
            printf '%s  %s\n' \
              '884c7b2b936f296dd448bfca18a14fd9bc903be7d3bff1303ac62bbb43f641d6' "$w/master/config.json" \
              'df1d8d5ec5d091b460562ffd545e4a5e91d17d4a0db7ebe733be34ed374377bd' "$w/master/tokenizer.json" \
              'b99856c5bdc9f88cc30a7ffff78bfc7768427e0b1216d0c196b27e5d55043455' "$w/master/tokenizer_config.json" \
              'ba551d58630afa3190b1be3602e28301f3d2e9bbac978dfc49d6d825171648b6' "$w/master/chat_template.jinja" \
              '1d90518482c4ec204bebb4820bbaee4f8a38c5a6df72256f86bcd21fe52ad079' "$w/master/model.safetensors" \
              '3d10b6ab8fc91a919534b9558e266255aca0bbc7f6d015963599aa9e74e05b1d' "$w/QAD.gguf" \
              | sha256sum -c > "$e/MODEL_SHA_RAW.log" 2>&1
            echo "$?" > "$e/MODEL_SHA_EXIT.txt"
          else
            for s in RUNTIME_DOWNLOAD RUNTIME_SHA MASTER_DOWNLOAD GGUF_DOWNLOAD MODEL_SHA; do echo SKIPPED > "$e/${s}_EXIT.txt"; done
          fi
          if [ "$(cat "$e/MODEL_SHA_EXIT.txt")" = 0 ] && [ "$(cat "$e/RUNTIME_SHA_EXIT.txt")" = 0 ]; then
            tar -xzf "$w/runtime.tar.gz" -C "$w/runtime" > "$e/EXTRACT_RAW.log" 2>&1
            bin=$(find "$w/runtime" -type f -name llama-server -print -quit)
            if [ -n "$bin" ]; then
              chmod +x "$bin"
              export LD_LIBRARY_PATH="$(dirname "$bin"):${LD_LIBRARY_PATH:-}"
              "$bin" --model "$w/QAD.gguf" --host 127.0.0.1 --port 8080 \
                --ctx-size 512 --threads 2 --n-gpu-layers 0 --no-warmup \
                > "$e/SERVER_RAW.log" 2>&1 &
              server_pid=$!
              ready=1
              for i in $(seq 1 90); do
                curl -fsS --max-time 2 http://127.0.0.1:8080/health > "$e/HEALTH_RAW.json" 2>/dev/null
                if [ "$?" = 0 ]; then ready=0; break; fi
                if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
                sleep 1
              done
              echo "$ready" > "$e/SERVER_READY_EXIT.txt"
              if [ "$ready" = 0 ]; then
                timeout --signal=TERM --kill-after=10s 1200s \
                  "$w/venv/bin/python" v13/code/scripts/p2_qad_fp32_firsttoken_probe.py \
                  --master "$w/master" --gguf "$w/QAD.gguf" --output "$e/RESULT.json" \
                  > "$e/AUDIT_RAW.log" 2>&1
                echo "$?" > "$e/AUDIT_EXIT.txt"
              else echo SKIPPED_SERVER_RED > "$e/AUDIT_RAW.log"; echo SKIPPED > "$e/AUDIT_EXIT.txt"; fi
              kill "$server_pid" 2>/dev/null
              wait "$server_pid" 2>/dev/null
            else echo 1 > "$e/SERVER_READY_EXIT.txt"; echo SKIPPED > "$e/AUDIT_EXIT.txt"; fi
          else echo SKIPPED > "$e/SERVER_READY_EXIT.txt"; echo SKIPPED > "$e/AUDIT_EXIT.txt"; fi
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 955c7abab8a56e68781f651b2661de94b03aa382 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 955c7abab8a56e68781f651b2661de94b03aa382 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original native model-forward raw, hashes and RED exits
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-p2-firsttoken-native-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-p2-firsttoken-native-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce descriptive-only eight forwards and unchanged negative gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-p2-firsttoken-native-evidence"
          for s in RESOURCE VENV TORCH DEPS RUNTIME_DOWNLOAD RUNTIME_SHA MASTER_DOWNLOAD GGUF_DOWNLOAD MODEL_SHA SERVER_READY AUDIT PRIVACY DIFF; do
            test "$(cat "$e/${s}_EXIT.txt")" = 0
          done
          python3 - "$e/RESULT.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['schema']=='v13.p2.qad_fp32_gguf_first_token_native.v1'
          assert x['status']=='FIRST_TOKEN_MEASURED_NO_PARITY_PROMOTION'
          assert x['probe_count']==x['model_forward_calls']==8
          assert len(x['rows'])==8
          assert 0<=x['top1_equal_count']<=8
          assert x['training'] is False
          assert x['full_logit_greedy_cache_adapter_or_utility_parity_proven'] is False
          print('EIGHT_PINNED_FIRSTTOKEN_FORWARDS_MEASURED_NO_PARITY_PROMOTION')
          PY
