name: V13 current review-chain unfiltered software suite run11g
on:
  push:
    branches:
      - 'assistant/v13-currentchain-unfiltered-run11g-20261030-gpt6'
    paths:
      - '.github/workflows/v13-currentchain-unfiltered-run11g.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  full-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Full unfiltered suite with exact original native evidence prerequisite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          e="$RUNNER_TEMP/v13-currentchain-run11g"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          git hash-object \
            v13/code/v13/jefoutcome.py v13/code/v13/context_os.py \
            v13/code/v13/agi/listarith_de_deterministic_source_candidate.py \
            v13/code/v13/jefbridge.py v13/code/v13/executive.py \
            v13/code/v13/agi/listarith_de_closedworld_candidate.py \
            v13/code/v13/body_jepa.py v13/code/v13/world_jepa.py \
            v13/code/v13/sleep.py \
            v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md \
            > "$e/SOURCE_BLOBS.txt"
          test "$(tail -1 "$e/SOURCE_BLOBS.txt")" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          echo "$?" > "$e/CANON_EXIT.txt"
          python3 - "$e/original_native.zip" > "$e/NATIVE_FETCH_RAW.log" 2>&1 <<'PY'
          import hashlib, os, pathlib, shutil, sys, urllib.error, urllib.parse, urllib.request, zipfile
          dest=pathlib.Path(sys.argv[1])
          api="https://api.github.com/repos/RedMentos/Aii/actions/artifacts/12951963045/zip"
          req=urllib.request.Request(api,headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28"})
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect)
          try:
              with opener.open(req,timeout=120) as response, dest.open("wb") as f:
                  shutil.copyfileobj(response,f)
          except urllib.error.HTTPError as exc:
              if exc.code not in (301,302,303,307,308):raise
              target=exc.headers.get("Location","")
              u=urllib.parse.urlsplit(target)
              if u.scheme!="https" or not u.hostname:raise ValueError("INVALID_REDIRECT")
              # Redirect is a pre-signed artifact URL: never forward GH_TOKEN.
              with urllib.request.urlopen(urllib.request.Request(target),timeout=120) as response, dest.open("wb") as f:
                  shutil.copyfileobj(response,f)
          blob=dest.read_bytes()
          expected="98a61f622b64b792f38d766da3ef50e9101571b7e616f2c587d6e89ab5e31c46"
          actual=hashlib.sha256(blob).hexdigest()
          if actual!=expected:raise ValueError("PINNED_NATIVE_ZIP_SHA_MISMATCH:"+actual)
          with zipfile.ZipFile(dest) as z:
              if len(z.namelist())!=54 or z.testzip() is not None:raise ValueError("NATIVE_ZIP_CRC_OR_ENTRY_MISMATCH")
              if z.read("HEAD.txt").decode().strip()!="5e802d235c9501879a3aff07e5134c1455e1769b":raise ValueError("NATIVE_SOURCE_HEAD_MISMATCH")
          shutil.copyfile(dest,"v13/code/tests/NATIVE_40996792157.zip")
          print("PINNED_ORIGINAL_NATIVE_ZIP_VERIFIED",len(blob),actual)
          PY
          echo "$?" > "$e/NATIVE_FETCH_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-currentchain-run11g-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-currentchain-run11g-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input -q --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu' > "$e/TORCH_RAW.log" 2>&1
            echo "$?" > "$e/TORCH_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input -q 'transformers==4.44.2' > "$e/TRANSFORMERS_RAW.log" 2>&1
            echo "$?" > "$e/TRANSFORMERS_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input -q 'peft==0.13.2' > "$e/PEFT_RAW.log" 2>&1
            echo "$?" > "$e/PEFT_EXIT.txt"
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
            "$py" -c 'import torch; assert torch.__version__=="2.5.1+cpu"; print(torch.__version__,torch.cuda.is_available())' > "$e/TORCH_IMPORT_RAW.log" 2>&1
            echo "$?" > "$e/TORCH_IMPORT_EXIT.txt"
            "$py" -c 'import transformers; assert transformers.__version__=="4.44.2"; print(transformers.__version__)' > "$e/TRANSFORMERS_IMPORT_RAW.log" 2>&1
            echo "$?" > "$e/TRANSFORMERS_IMPORT_EXIT.txt"
            "$py" -c 'import peft; assert peft.__version__=="0.13.2"; print(peft.__version__)' > "$e/PEFT_IMPORT_RAW.log" 2>&1
            echo "$?" > "$e/PEFT_IMPORT_EXIT.txt"
          else
            for stage in DEPS TORCH TRANSFORMERS PEFT PIP_CHECK TORCH_IMPORT TRANSFORMERS_IMPORT PEFT_IMPORT; do
              echo SKIPPED_RED > "$e/${stage}_EXIT.txt"
              echo SKIPPED_RED > "$e/${stage}_RAW.log"
            done
          fi
          if [ "$(cat "$e/CANON_EXIT.txt")" = 0 ] && [ "$(cat "$e/NATIVE_FETCH_EXIT.txt")" = 0 ] && \
             [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ] && [ "$(cat "$e/TORCH_EXIT.txt")" = 0 ] && \
             [ "$(cat "$e/TRANSFORMERS_EXIT.txt")" = 0 ] && [ "$(cat "$e/PEFT_EXIT.txt")" = 0 ] && \
             [ "$(cat "$e/TORCH_IMPORT_EXIT.txt")" = 0 ] && \
             [ "$(cat "$e/TRANSFORMERS_IMPORT_EXIT.txt")" = 0 ] && \
             [ "$(cat "$e/PEFT_IMPORT_EXIT.txt")" = 0 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=10s 32m \
              env PYTHONPATH=.:tests:scripts "$py" -m unittest discover -s tests -p 'test_*.py') \
              > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else
            echo SKIPPED_PREREQUISITE_RED > "$e/FULL_RAW.log"
            echo SKIPPED_RED > "$e/FULL_EXIT.txt"
          fi
          "$py" -m compileall -q v13/code/v13 v13/code/scripts > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py \
            --base 8744720e30a28dd0c87247bd7a0e37a1f840bb4e \
            --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 8744720e30a28dd0c87247bd7a0e37a1f840bb4e HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS ! -name original_native.zip -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          rm -f "$e/original_native.zip"
          exit 0
      - name: Preserve original unfiltered raw even on RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-currentchain-unfiltered-run11g-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-currentchain-run11g/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce original unfiltered result with no waivers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-currentchain-run11g"
          for stage in CANON NATIVE_FETCH VENV DEPS TORCH TRANSFORMERS PEFT PIP_CHECK TORCH_IMPORT TRANSFORMERS_IMPORT PEFT_IMPORT FULL COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw retained; no gate promotion"
              tail -80 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo "UNFILTERED_SOFTWARE_GREEN_ONLY_NO_NATIVE_OR_REDMI_PROMOTION"
