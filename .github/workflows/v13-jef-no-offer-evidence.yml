name: V13 JEF no-offer evidence regression
on:
  pull_request:
    paths:
      - 'v13/code/v13/turnflow.py'
      - 'v13/code/tests/test_turnflow_no_offer_evidence.py'
      - '.github/workflows/v13-jef-no-offer-evidence.yml'
      - 'v13/code/tests/test_turnflow_think_speak.py'
  workflow_dispatch:
jobs:
  no-offer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Compile and test JEF evidence boundaries
        env:
          PYTHONPATH: v13/code
        run: |
          python -m compileall -q v13/code/v13/turnflow.py v13/code/tests/test_turnflow_no_offer_evidence.py
          python -m unittest discover -s v13/code/tests -p 'test_turnflow_no_offer_evidence.py' -v
          python -m pytest -q v13/code/tests/test_turnflow_think_speak.py
