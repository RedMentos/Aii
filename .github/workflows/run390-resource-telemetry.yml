name: V13 Run390 finite resource telemetry source tests
on:
  pull_request:
    paths:
      - '.github/workflows/run390-resource-telemetry.yml'
      - 'v13/code/v13/resource_modes.py'
      - 'v13/code/tests/test_telemetry_finite_run390.py'
      - 'v13/code/tests/test_resource_telemetry_finite_run390.py'
      - 'v13/code/docs/proofs/continuation-20261026/run390-resource-telemetry/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Source identity and isolated Python
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/RUN390_HEAD.txt"
          sha256sum v13/code/v13/resource_modes.py v13/code/tests/test_resource_telemetry_finite_run390.py | tee "$RUNNER_TEMP/RUN390_SOURCE_HASHES.txt"
          python3 -m venv "$RUNNER_TEMP/run390venv"
          "$RUNNER_TEMP/run390venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
          python3 -m compileall -q v13/code/v13/resource_modes.py v13/code/tests/test_resource_telemetry_finite_run390.py
      - name: Preregistered counterexamples and inherited resource modes
        id: suite
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          PYTHONPATH="$PWD" "$RUNNER_TEMP/run390venv/bin/python" -m unittest -v \
            tests.test_resource_telemetry_finite_run390 tests.test_resource_modes \
            2>&1 | tee "$RUNNER_TEMP/RUN390_TESTS_RAW.log"
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Privacy scan
        id: privacy
        run: |
          set -uo pipefail
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree \
            2>&1 | tee "$RUNNER_TEMP/RUN390_PRIVACY_RAW.log"
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Close raw SHA
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          find . -maxdepth 1 -type f -name 'RUN390_*' ! -name RUN390_SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > RUN390_SHA256SUMS.txt
      - name: Upload exact-head raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V13-Run390-Resource-Raw-${{ github.sha }}
          path: ${{ runner.temp }}/RUN390_*
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce tests and privacy
        if: always()
        run: |
          test "${{ steps.suite.outputs.rc }}" = "0"
          test "${{ steps.privacy.outputs.rc }}" = "0"
