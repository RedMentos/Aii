name: V13 Run392 source-wide resource-mode diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/run392-resource-suite-diagnostic.yml'
      - 'v13/code/scripts/run392_resource_suite_diagnostic.py'
      - 'v13/code/docs/proofs/continuation-20261026/run392-sourcewide-resource/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PIP_NO_CACHE_DIR: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact source identity and isolated dependencies
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/RUN392_HEAD.txt"
          sha256sum v13/code/scripts/run392_resource_suite_diagnostic.py v13/code/v13/resource_modes.py v13/code/v13/resources.py v13/code/v13/sleep.py v13/code/tests/test_resource_modes.py | tee "$RUNNER_TEMP/RUN392_SOURCE_HASHES.txt"
          python3 -m venv "$RUNNER_TEMP/run392venv"
          "$RUNNER_TEMP/run392venv/bin/python" -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
          python3 -m compileall -q v13/code/scripts/run392_resource_suite_diagnostic.py
      - name: Instrumented full unittest suite (bounded, retain failures)
        id: suite
        working-directory: v13/code
        run: |
          set -uo pipefail
          set +e
          PYTHONPATH="$PWD" timeout 900s "$RUNNER_TEMP/run392venv/bin/python" scripts/run392_resource_suite_diagnostic.py \
            2>&1 | tee "$RUNNER_TEMP/RUN392_TESTS_RAW.log"
          rc=${PIPESTATUS[0]}
          echo "TEST_EXIT=$rc" | tee "$RUNNER_TEMP/RUN392_EXIT.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Privacy scan
        id: privacy
        run: |
          set -uo pipefail
          set +e
          python3 v13/code/scripts/public_repo_privacy_scan.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD --no-worktree \
            2>&1 | tee "$RUNNER_TEMP/RUN392_PRIVACY_RAW.log"
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Close raw SHA
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          find . -maxdepth 1 -type f -name 'RUN392_*' ! -name RUN392_SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > RUN392_SHA256SUMS.txt
      - name: Upload exact-head raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V13-Run392-SourceWide-Raw-${{ github.sha }}
          path: ${{ runner.temp }}/RUN392_*
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce tests and privacy; expected suite RED remains visible
        if: always()
        run: |
          test "${{ steps.suite.outputs.rc }}" = "0"
          test "${{ steps.privacy.outputs.rc }}" = "0"
