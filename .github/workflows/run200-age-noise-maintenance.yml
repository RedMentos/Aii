name: Run200 Age noise-aware maintenance integrity (software)
on:
  pull_request:
    paths:
      - 'v13/code/v13/age.py'
      - 'v13/code/tests/test_age_noise_maintenance_run200.py'
      - '.github/workflows/run200-age-noise-maintenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  age:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Isolated test prerequisites
        run: python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'prompt-toolkit==3.0.52'
      - name: Actual AgeControl regression and prior Age tests
        working-directory: v13/code
        run: |
          python -m unittest -v tests.test_age_noise_maintenance_run200 tests.test_age tests.test_age_rights
          python -m compileall -q v13/age.py tests/test_age_noise_maintenance_run200.py
      - name: Official repository privacy scan
        run: python v13/code/scripts/public_repo_privacy_scan.py --base 7fbc99e84835bf6b0aad86b56f1d433bdc427762 --head HEAD --no-worktree
      - name: Evidence boundary
        run: echo 'SOFTWARE/SYNTHETIC ONLY; Age BUILD_CEILING stays 0, no native or Redmi proof'
