name: V13 Run186 C3 final Gist utility candidate (software only)
on:
  pull_request:
    paths:
      - '.github/workflows/v13-run186-c3-final-software.yml'
      - 'v13/code/scripts/run186_c3_gist_final_utility.py'
      - 'v13/code/tests/test_run186_c3_gist_final_utility.py'
      - 'v13/code/docs/proofs/continuation-20261025/run186-c3-final/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-bound-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen Run181 and pinned C3 registry, focused tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/run186"
          test "$(git hash-object v13/code/scripts/gist_utility_bench.py)" = 'f2b6d00cbe100152bb77a3b04187324eb379abd6'
          test "$(git hash-object v13/code/scripts/run181_gist_offer_audit.py)" = '30b4f32893ec505e7c3035e76523389233121e9a'
          test "$(git hash-object v13/code/specs/models.json)" = '7af05962af41d0bc3f7dd18ef01d4eba55eabf99'
          python3 -m compileall -q v13/code/scripts/run186_c3_gist_final_utility.py v13/code/tests/test_run186_c3_gist_final_utility.py
          python3 -m unittest discover -s v13/code/tests -p test_run186_c3_gist_final_utility.py -v 2>&1 | tee "$RUNNER_TEMP/run186/software.log"
          echo RUN186_C3_FINAL_NATIVE_NOT_RUN_SERIALIZATION_REQUIRED
      - name: Official public repository privacy scan
        if: always()
        run: python3 v13/code/scripts/public_repo_privacy_scan.py --base 92cd1f54cfef56be8d0d3af9407e2337917c2afc --head HEAD
      - name: Preserve software test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: V13-Run186-C3-Final-Software-Only
          path: ${{ runner.temp }}/run186/software.log
          if-no-files-found: warn
          retention-days: 14
