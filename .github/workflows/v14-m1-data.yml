name: V14 M1 DATA tests

on:
  push:
    branches:
      - 'v14/rebuild-isolated-20261123'
    paths:
      - 'v14/m1/**'
      - '.github/workflows/v14-m1-data.yml'
  pull_request:
    paths:
      - 'v14/m1/**'
      - '.github/workflows/v14-m1-data.yml'

permissions:
  contents: read

jobs:
  synthetic-data-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install NumPy
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Install CPU PyTorch for base-model tests
        if: matrix.python-version == '3.13'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run M1 DATA tests
        run: python -m unittest v14.m1.test_data v14.m1.test_array_data v14.m1.test_evaluation -v
      - name: Run M1 BASE architecture tests
        if: matrix.python-version == '3.13'
        run: python -m unittest v14.m1.test_base v14.m1.test_training v14.m1.test_baselines -v
