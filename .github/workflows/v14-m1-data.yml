name: V14 M1 DATA tests

concurrency:
  group: v14-m1-data-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 'gpt6/v14-m1-isolated-20261124'
    paths:
      - 'v14/m1/**'
      - '.github/workflows/v14-m1-data.yml'
  pull_request:
    paths:
      - 'v14/m1/**'
      - '.github/workflows/v14-m1-data.yml'

permissions:
  contents: read

jobs:
  synthetic-data-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install NumPy for bounded-memory array tests
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Run M1 DATA, BASE and raw-window control tests
        run: python -m unittest v14.m1.test_data v14.m1.test_array_data v14.m1.test_baselines v14.m1.test_raw_probes -v
