name: V14 M1 DATA tests

on:
  push:
    branches:
      - 'gpt6/v13-private-remote-bridge-20261111'
    paths:
      - 'v14/m1/**'
      - '.github/workflows/v14-m1-data.yml'
  pull_request:
    paths:
      - 'v14/m1/**'
      - '.github/workflows/v14-m1-data.yml'

permissions:
  contents: read

jobs:
  synthetic-data-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run M1 DATA synthetic logic tests
        run: python -m unittest v14.m1.test_data -v
