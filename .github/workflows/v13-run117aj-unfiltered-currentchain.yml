name: V13 Run117AJ exact current-chain unfiltered software regression
on:
  push:
    branches:
      - assistant/v13-run117aj-unfiltered-currentchain-20261031-gpt6
    paths:
      - .github/workflows/v13-run117aj-unfiltered-currentchain.yml
      - v13/code/docs/RUN117AJ_*
permissions:
  contents: read
  actions: read
jobs:
  full-unfiltered:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      ORIGINAL_ARTIFACT_ID: '13054946077'
      ORIGINAL_ARTIFACT_SHA: '65939e4dea18f15bf11d5b1b3c5128f5a6128c6d03b9d2beb090f185d03fb69a'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Execute unfiltered current-chain suite and preserve all raw evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run117aj-fullsuite"
          original="$RUNNER_TEMP/run117z-original-native.zip"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          test "$(git hash-object v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md)" = 218464b12a2d27d92524c751922fa8e1c3fb0ea7
          echo "$?" > "$e/CANON_EXIT.txt"
          test "$(git hash-object v13/code/v13/b1b2_source_id_quote_candidate.py)" = e431eecaa4a7643a548a512036225343f681ee23
          echo "$?" > "$e/SOURCE_PIN_EXIT.txt"
          echo 'cff778da793fbab2d456143b5d8290176b1097cc0e4d867eabbd9fbc2e05f67a  v13/code/docs/fixtures/RUN117AH_BODY_SOURCE_ID_SEED1069.json' | sha256sum -c - > "$e/FIXTURE_RAW.log" 2>&1
          echo "$?" > "$e/FIXTURE_EXIT.txt"
          curl --fail --silent --show-error --location --retry 2 --max-time 180 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/RedMentos/Aii/actions/artifacts/$ORIGINAL_ARTIFACT_ID/zip" \
            --output "$original" > "$e/DOWNLOAD_RAW.log" 2>&1
          echo "$?" > "$e/DOWNLOAD_EXIT.txt"
          if [ "$(cat "$e/DOWNLOAD_EXIT.txt")" = 0 ]; then
            printf '%s  %s\n' "$ORIGINAL_ARTIFACT_SHA" "$original" | sha256sum -c - > "$e/OUTER_SHA_RAW.log" 2>&1
            echo "$?" > "$e/OUTER_SHA_EXIT.txt"
          else
            echo 125 > "$e/OUTER_SHA_EXIT.txt"
            echo DOWNLOAD_RED > "$e/OUTER_SHA_RAW.log"
          fi
          unset GH_TOKEN
          python3 -m venv "$RUNNER_TEMP/v13-run117aj-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run117aj-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q \
              'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q \
              --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu' > "$e/TORCH_RAW.log" 2>&1
            echo "$?" > "$e/TORCH_EXIT.txt"
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q \
              'transformers==4.44.2' 'peft==0.13.2' > "$e/PEFT_RAW.log" 2>&1
            echo "$?" > "$e/PEFT_EXIT.txt"
            "$py" -m pip check > "$e/PIP_CHECK_RAW.log" 2>&1
            echo "$?" > "$e/PIP_CHECK_EXIT.txt"
            "$py" -m pip freeze > "$e/PIP_FREEZE_RAW.log" 2>&1
          else
            for stage in DEPS TORCH PEFT PIP_CHECK; do
              echo 125 > "$e/${stage}_EXIT.txt"
              echo VENV_RED > "$e/${stage}_RAW.log"
            done
          fi
          ready=1
          for stage in CANON SOURCE_PIN FIXTURE DOWNLOAD OUTER_SHA VENV DEPS TORCH PEFT PIP_CHECK; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then ready=0; fi
          done
          if [ "$ready" = 1 ]; then
            (cd v13/code && timeout --signal=TERM --kill-after=10s 25m \
              env PYTHONPATH=.:tests:scripts V13_RUN117Z_ORIGINAL_ZIP="$original" \
              "$py" -m unittest discover -s tests -p 'test_*.py') > "$e/FULL_RAW.log" 2>&1
            echo "$?" > "$e/FULL_EXIT.txt"
          else
            echo 125 > "$e/FULL_EXIT.txt"
            echo NOT_RUN_PREREQUISITE_RED > "$e/FULL_RAW.log"
          fi
          "$py" -m compileall -q v13/code/v13 v13/code/scripts > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py \
            --base 8b745b6303969c29ed26330d39d6a29946331140 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 8b745b6303969c29ed26330d39d6a29946331140 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          "$py" - "$e" <<'PY' > "$e/RESULT_RAW.log"
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1])
          names=('CANON','SOURCE_PIN','FIXTURE','DOWNLOAD','OUTER_SHA','VENV',
                 'DEPS','TORCH','PEFT','PIP_CHECK','FULL','COMPILE','PRIVACY','DIFF')
          r={'schema':'v13.run117aj.unfiltered_reviewchain_software_receipt.v1',
             'head':(e/'HEAD.txt').read_text().strip(),
             'original_native_artifact_id':13054946077,
             'original_native_sha256':'65939e4dea18f15bf11d5b1b3c5128f5a6128c6d03b9d2beb090f185d03fb69a',
             'fixture_sha256':'cff778da793fbab2d456143b5d8290176b1097cc0e4d867eabbd9fbc2e05f67a',
             'exits':{n:int((e/(n+'_EXIT.txt')).read_text()) for n in names},
             'native_inference_this_run':False,'step2_promoted':False,
             'b3_promoted':False,'jepa_weight':0,'redmi_measured':False,
             'whole_system_complete':False}
          (e/'RESULT.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat "$e/RESULT_RAW.log"
          tail -n 40 "$e/FULL_RAW.log"
          for stage in CANON SOURCE_PIN FIXTURE DOWNLOAD OUTER_SHA VENV DEPS TORCH PEFT PIP_CHECK FULL COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "STAGE_RED:$stage"
              exit 1
            fi
          done
      - name: Preserve original GREEN or RED unfiltered software receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117aj-unfiltered-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117aj-fullsuite/
          if-no-files-found: warn
          retention-days: 90
