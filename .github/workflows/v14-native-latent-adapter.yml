name: V14 native latent adapter
on:
  push:
    branches:
      - core/v14-native-latent-adapter-20261122
  pull_request:
    branches:
      - core/v14-llama-server-cache-diagnostics-20261122
    paths:
      - v13/code/v13/latent_bridge_native.py
      - v13/code/tests/test_native_latent_adapter.py
      - .github/workflows/v14-native-latent-adapter.yml
jobs:
  native-latent-adapter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip numpy pytest
      - name: Run low-rank native latent adapter tests
        env:
          PYTHONPATH: v13/code
        run: python -m pytest -q v13/code/tests/test_native_latent_adapter.py
