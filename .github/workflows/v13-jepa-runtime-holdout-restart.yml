name: V13 JEPA Runtime Holdout Restart
on:
  pull_request:
    paths:
      - 'v13/code/tests/runtime_jepa_utility_disposable_cases_20261111.py'
      - 'v13/code/tests/test_runtime_jepa_utility_integration_20261111.py'
      - '.github/workflows/v13-jepa-runtime-holdout-restart.yml'
  workflow_dispatch:
jobs:
  runtime-jepa-holdout:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pytest
      - run: python -m pytest -q -s v13/code/tests/test_runtime_jepa_utility_integration_20261111.py
