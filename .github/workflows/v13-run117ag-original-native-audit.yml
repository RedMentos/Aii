name: V13 Run117AG independent original native seed1067 ZIP audit
on:
  push:
    branches:
      - assistant/v13-run117ag-independent-native-audit-20261031-gpt6
    paths:
      - .github/workflows/v13-run117ag-original-native-audit.yml
      - v13/code/scripts/run117ag_independent_native_audit.py
      - v13/code/tests/test_run117ag_independent_native_audit.py
      - v13/code/docs/RUN117AG_*
permissions:
  contents: read
  actions: read
jobs:
  independent-original-native-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      ORIGINAL_ARTIFACT_ID: '13055310481'
      ORIGINAL_ARTIFACT_SHA: '1082b64fe8d5a8ed3f8026c5913e9712f51217f75d5544b762924016f9bfc888'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Independent original raw ZIP source manifest native C3 and score audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117ag-independent-audit"
          original="$RUNNER_TEMP/run117af-original-native.zip"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          set +e
          curl --fail --silent --show-error --location --retry 2 --max-time 180 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/RedMentos/Aii/actions/artifacts/$ORIGINAL_ARTIFACT_ID/zip" \
            --output "$original" > "$e/DOWNLOAD_RAW.log" 2>&1
          download_rc=$?
          if test "$download_rc" -eq 0; then
            printf '%s  %s\n' "$ORIGINAL_ARTIFACT_SHA" "$original" | sha256sum -c - > "$e/OUTER_SHA_RAW.log" 2>&1
            outer_rc=$?
          else
            outer_rc=125;echo DOWNLOAD_RED > "$e/OUTER_SHA_RAW.log"
          fi
          if test "$outer_rc" -eq 0; then
            python3 v13/code/scripts/run117ag_independent_native_audit.py "$original" \
              --expected-sha "$ORIGINAL_ARTIFACT_SHA" > "$e/AUDIT_RAW.log" 2>&1
            audit_rc=$?
          else
            audit_rc=125;echo OUTER_SHA_RED > "$e/AUDIT_RAW.log"
          fi
          python3 -m compileall -q v13/code/scripts/run117ag_independent_native_audit.py > "$e/COMPILE_RAW.log" 2>&1
          compile_rc=$?
          python3 v13/code/scripts/public_repo_privacy_scan.py \
            --base f767480f5d79e8b8493f458e8579aefa78721ca5 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          privacy_rc=$?
          git diff --check f767480f5d79e8b8493f458e8579aefa78721ca5 HEAD > "$e/DIFF_RAW.log" 2>&1
          diff_rc=$?
          for x in "DOWNLOAD:$download_rc" "OUTER:$outer_rc" "AUDIT:$audit_rc" \
                   "COMPILE:$compile_rc" "PRIVACY:$privacy_rc" "DIFF:$diff_rc"; do
            echo "${x#*:}" > "$e/${x%%:*}_EXIT.txt"
          done
          set -e
          python3 - "$e" <<'PY' > "$e/RESULT_RAW.log"
          import json,sys
          from pathlib import Path
          e=Path(sys.argv[1]);names=('DOWNLOAD','OUTER','AUDIT','COMPILE','PRIVACY','DIFF')
          exits={n:int((e/(n+'_EXIT.txt')).read_text()) for n in names}
          audit=json.loads((e/'AUDIT_RAW.log').read_text()) if exits['AUDIT']==0 else None
          r={'schema':'v13.run117ag.independent_original_native_audit_receipt.v1',
             'head':(e/'HEAD.txt').read_text().strip(),
             'original_artifact_id':13055310481,
             'original_artifact_sha256':'1082b64fe8d5a8ed3f8026c5913e9712f51217f75d5544b762924016f9bfc888',
             'exits':exits,'audit':audit,'new_native_calls':0,
             'step2_promoted':False,'b3_promoted':False,'jepa_weight':0,
             'redmi_measured':False,'whole_system_complete':False}
          (e/'RESULT.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat "$e/RESULT_RAW.log"
          cat "$e/AUDIT_RAW.log"
          for rc in "$download_rc" "$outer_rc" "$audit_rc" "$compile_rc" "$privacy_rc" "$diff_rc"; do test "$rc" -eq 0; done
          python3 - "$e/AUDIT_RAW.log" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          assert a['status']=='INDEPENDENT_ORIGINAL_NATIVE_STRUCTURAL_PASS'
          assert a['native_c3_calls']==12
          assert a['scores']=={'REAL_STORE_JEF_ONLY':6,'B1B2_JEF_CONTEXTOS':6}
          PY
      - name: Preserve independent GREEN or RED audit raw
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117ag-independent-audit-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117ag-independent-audit/
          if-no-files-found: warn
          retention-days: 90
