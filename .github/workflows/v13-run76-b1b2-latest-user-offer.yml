name: V13 Run76 B1 B2 latest USER SHADOW offer guard software
on:
  push:
    branches: [assistant/v13-run76-b1b2-latest-user-offer-20261031-auto11]
    paths: ['.github/workflows/v13-run76-b1b2-latest-user-offer.yml']
permissions:
  contents: read
concurrency:
  group: v13-run76-b1b2-latest-user-software
  cancel-in-progress: false
jobs:
  b1b2:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V13_NO_AUTOSTART: '1'
      NO_MODEL_DOWNLOADS: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned source and real Store B1 B2 chronology negatives
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run76-b1b2"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/PINS.txt" <<'PINS'
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          5d0652a467e5186eb22cf0638d75d27da190591b v13/code/docs/RUN76_B1B2_LATEST_USER_OFFER_PREREG_20261031.md
          7c1ea152d511783a47a1e55cc6a968ecd9d7e338 v13/code/v13/b1b2_latest_user_offer_candidate.py
          c4557ab411e664e132e6ab4639082badf7cd9475 v13/code/tests/test_b1b2_latest_user_offer_candidate.py
          277d34a46b14633c52b5e7d59b3fdf0f16ea4159 v13/code/v13/b1b2_topic_partition_candidate.py
          5dcf4fbcec173773efdcdc4cd719e4e543ef15f5 v13/code/v13/b1b2_causal_offer_consumer_candidate.py
          PINS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            [ "$want" = "$got" ] || bad=1
          done < "$e/PINS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          python3 -m venv "$RUNNER_TEMP/v13-run76-venv" > "$e/VENV_RAW.log" 2>&1
          echo "$?" > "$e/VENV_EXIT.txt"
          py="$RUNNER_TEMP/v13-run76-venv/bin/python"
          if [ "$(cat "$e/VENV_EXIT.txt")" = 0 ]; then
            "$py" -m pip install --disable-pip-version-check --no-input --timeout 90 --retries 2 -q 'numpy==2.2.6' psutil PyYAML Pillow 'prompt-toolkit==3.0.52' > "$e/DEPS_RAW.log" 2>&1
            echo "$?" > "$e/DEPS_EXIT.txt"
          else echo VENV_RED > "$e/DEPS_RAW.log"; echo 99 > "$e/DEPS_EXIT.txt"; fi
          for t in test_b1b2_latest_user_offer_candidate.py test_b1b2_topic_partition_candidate.py test_b1b2_causal_offer_consumer_candidate.py test_b1b2_causal_context_candidate.py; do
            key="${t%.py}"
            if [ "$(cat "$e/DEPS_EXIT.txt")" = 0 ]; then
              timeout --signal=TERM --kill-after=5s 6m env PYTHONPATH=v13/code:v13/code/scripts "$py" -m unittest discover -s v13/code/tests -p "$t" -v > "$e/${key}_RAW.log" 2>&1
              echo "$?" > "$e/${key}_EXIT.txt"
            else echo DEPS_RED > "$e/${key}_RAW.log"; echo 99 > "$e/${key}_EXIT.txt"; fi
          done
          python3 -m compileall -q v13/code/v13/b1b2_latest_user_offer_candidate.py v13/code/tests/test_b1b2_latest_user_offer_candidate.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 5db1902de1ea73de120246c53da8356bdd263c3b --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 5db1902de1ea73de120246c53da8356bdd263c3b HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Retain original raw including RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run76-b1b2-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run76-b1b2/
          if-no-files-found: error
          retention-days: 90
      - name: Require all software gates
        if: always()
        shell: bash
        run: |
          e="$RUNNER_TEMP/v13-run76-b1b2"
          for s in PINS VENV DEPS test_b1b2_latest_user_offer_candidate test_b1b2_topic_partition_candidate test_b1b2_causal_offer_consumer_candidate test_b1b2_causal_context_candidate COMPILE PRIVACY DIFF; do
            echo "$s $(cat "$e/${s}_EXIT.txt" 2>/dev/null || echo MISSING)"
            test "$(cat "$e/${s}_EXIT.txt" 2>/dev/null)" = 0 || exit 1
          done
          echo RUN76_B1B2_CHRONOLOGY_SOFTWARE_ONLY_NO_NATIVE_OR_AGE_PROMOTION
