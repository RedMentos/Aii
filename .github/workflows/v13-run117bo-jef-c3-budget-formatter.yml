name: V13 Run117BO real Store JEF C3 budget formatter shadow

on:
  push:
    branches:
      - assistant/v13-run117bo-jef-c3-budget-formatter-20261101-hourly11
    paths:
      - .github/workflows/v13-run117bo-jef-c3-budget-formatter.yml
      - v13/code/v13/agi/jef_c3_budget_formatter_shadow_run117bo.py
      - v13/code/tests/test_run117bo_jef_c3_budget_formatter_shadow.py
      - v13/code/docs/RUN117BO_JEF_C3_BUDGET_FORMATTER_DESIGN_20261101.md

permissions:
  contents: read

jobs:
  real-store-shadow-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run real Store callback tests and preserve closed raw
        shell: bash
        run: |
          set +e
          e="$RUNNER_TEMP/v13-run117bo"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/HEAD.txt"
          cat > "$e/EXPECTED_BLOBS.txt" <<'BLOBS'
          58186fb2bc894956fd0025f32943ea2a0c246e6d v13/code/v13/agi/jef_c3_budget_formatter_shadow_run117bo.py
          466c9f51905eb981b782f5b7b8aa7818eb66a893 v13/code/tests/test_run117bo_jef_c3_budget_formatter_shadow.py
          218464b12a2d27d92524c751922fa8e1c3fb0ea7 v13/code/docs/canon/V13_v10.16.1_WORK_HANDOFF_SINGLE_SOURCE_B3_HARDENED.md
          BLOBS
          bad=0
          while read -r want path; do
            got="$(git hash-object "$path" 2>/dev/null)"
            echo "$want $got $path" >> "$e/PINS_RAW.log"
            if [ "$want" != "$got" ]; then bad=1; fi
          done < "$e/EXPECTED_BLOBS.txt"
          echo "$bad" > "$e/PINS_EXIT.txt"
          echo '8aa69cc86d2e2067e809d4f703ddbff3fc575ea111d7afd97a73012e0bda0e21  v13/code/docs/fixtures/run46b_jef_source_eligibility_seed401.json' | sha256sum -c - > "$e/FIXTURE_RAW.log" 2>&1
          echo "$?" > "$e/FIXTURE_EXIT.txt"
          (cd v13/code && timeout 120s python3 -m unittest -v tests.test_run117bo_jef_c3_budget_formatter_shadow tests.test_run46b_jef_source_eligibility_shadow tests.test_jef_c3_schema_source_recheck_shadow) > "$e/TEST_RAW.log" 2>&1
          echo "$?" > "$e/TEST_EXIT.txt"
          python3 -m py_compile v13/code/v13/agi/jef_c3_budget_formatter_shadow_run117bo.py v13/code/tests/test_run117bo_jef_c3_budget_formatter_shadow.py > "$e/COMPILE_RAW.log" 2>&1
          echo "$?" > "$e/COMPILE_EXIT.txt"
          python3 v13/code/scripts/public_repo_privacy_scan.py --base 4ade5c42fe842df7220892f6b92ac9b66ad78205 --head HEAD --no-worktree > "$e/PRIVACY_RAW.log" 2>&1
          echo "$?" > "$e/PRIVACY_EXIT.txt"
          git diff --check 4ade5c42fe842df7220892f6b92ac9b66ad78205 HEAD > "$e/DIFF_RAW.log" 2>&1
          echo "$?" > "$e/DIFF_EXIT.txt"
          (cd "$e" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit 0
      - name: Preserve original software raw even on RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v13-run117bo-realstore-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v13-run117bo/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce source and software-only negative gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/v13-run117bo"
          for stage in PINS FIXTURE TEST COMPILE PRIVACY DIFF; do
            if [ "$(cat "$e/${stage}_EXIT.txt")" != 0 ]; then
              echo "$stage RED; original raw preserved, no gate promotion"
              tail -60 "$e/${stage}_RAW.log" 2>/dev/null || true
              exit 1
            fi
          done
          echo 'RUN117BO_SOFTWARE_ONLY_SHADOW_NO_NATIVE_OR_GATE_PROMOTION'
