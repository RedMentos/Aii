name: V13 P2 QAD FP32 first-token probe source-only tests
on:
  push:
    branches: [codex/v13-p2-structural-tensor-audit-20261029]
    paths:
      - 'v13/code/scripts/p2_qad_fp32_firsttoken_probe.py'
      - 'v13/code/tests/test_p2_qad_fp32_firsttoken_probe.py'
      - '.github/workflows/v13-p2-qad-firsttoken-source-only-20261029.yml'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile and run eight source-only fail-closed tests
        run: |
          python3 -m py_compile v13/code/scripts/p2_qad_fp32_firsttoken_probe.py v13/code/tests/test_p2_qad_fp32_firsttoken_probe.py
          python3 -m unittest discover -s v13/code/tests -p 'test_p2_qad_fp32_firsttoken_probe.py' -v
